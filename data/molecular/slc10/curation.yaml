  - assertion_id: slc10-assay:ntcp-e257a-uptake-reduction-2014
    protein_id: UniProtKB:Q14973
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Reduction of taurocholate uptake with NTCP E257A
    substrate: Taurocholate
    outcome: DETECTED
    assay: Radiotracer uptake in HepG2 cells
    conditions: 1 micromolar taurocholate, 15 minutes, 37 degrees Celsius, sodium-containing buffer; wild-type comparator. E257A belongs to the reported 95-99 percent reduction group; no individual point estimate assigned.
    construct: Human NTCP E257A with C-terminal C-9 tag; complete historical construct not independently reconciled.
    sequence_substitutions:
      - {position: 257, residue: E, substituted_residue: A}
    expression_localization_controls: Mutant and wild-type total and surface expression were largely comparable (Figure 6B).
    source_locator: Results, sodium-site mutants; Figure 6A/B; Methods, taurocholate uptake assay
    evidence:
      - reference: https://doi.org/10.1128/JVI.03478-13
        snippet: 95 to 99% reduction
        notes: The sentence explicitly lists E257A among the tested mutants.
    limitations: DETECTED describes the reduction, not normal transport. Reduced uptake is not complete absence. This does not isolate sodium binding from folding, gating or coupling effects, or explain SLC10A4.
