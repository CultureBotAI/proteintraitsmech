# Curator-authored inputs, not a MolecularEvidenceBundle or grounding registry.
# build_slc10_pilot binds the exact sequence checksums from its verified snapshot.
# All assertions remain PROPOSED pending scientific review.
functional_observations:
  - assertion_id: slc10-assay:a4-taurocholate-oocytes-2015
    protein_id: UniProtKB:Q96EP9
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Taurocholate uptake
    activity_id: GO:0008508
    substrate: Taurocholate
    outcome: NOT_DETECTED
    assay: Radiotracer uptake in Xenopus laevis oocytes
    conditions: 1 micromolar substrate; sodium-containing buffer; Figure 4 time course; ten oocytes per group.
    construct: Human SLC10A4 cRNA; historical construct sequence not independently reconciled to the pinned reference.
    expression_localization_controls: Water-injected negative control and NTCP positive control; matched surface abundance not established here.
    source_locator: Results, in vitro transport studies; Figure 4
    evidence:
      - reference: https://doi.org/10.1186/s12868-015-0174-2
        snippet: were not transported by SLC10A4 in this transport assay
    limitations: Assay-specific negative, not universal inactivity or proof of a defective sodium site.
  - assertion_id: slc10-assay:ntcp-taurocholate-oocytes-2015
    protein_id: UniProtKB:Q14973
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Taurocholate uptake
    activity_id: GO:0008508
    substrate: Taurocholate
    outcome: DETECTED
    assay: Radiotracer uptake in Xenopus laevis oocytes
    conditions: Positive-control arm of the same Figure 4 assay.
    construct: Human NTCP cRNA; historical construct sequence not independently reconciled to the pinned reference.
    expression_localization_controls: Water-injected oocytes as negative control.
    source_locator: Results, in vitro transport studies; Figure 4
    evidence:
      - reference: https://doi.org/10.1186/s12868-015-0174-2
        snippet: although NTCP showed significant transport activity for all of them
    limitations: Does not identify which residue contacts are necessary or sufficient for uptake.
  - assertion_id: slc10-assay:a4-thrombin-associated-uptake-2013
    protein_id: UniProtKB:Q96EP9
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Cell-associated bile-acid accumulation after thrombin exposure
    substrate: Lithocholic acid and taurocholic acid
    outcome: DETECTED
    assay: Cellular uptake quantified by liquid chromatography tandem mass spectrometry
    conditions: TE671 cells with thrombin treatment; abstract-level extraction, dose and time not independently checked.
    construct: Endogenous SLC10A4 attribution; cleavage and exact protein sequence not independently verified.
    expression_localization_controls: Immunoblotting, immunofluorescence, and SLC10A4 RNA interference reported.
    source_locator: Abstract, uptake and RNA interference results
    evidence:
      - reference: https://doi.org/10.1093/jb/mvt031
        snippet: uptake and cell death effects of LCA were increased by thrombin treatment
    limitations: Cellular accumulation is not an isolated-protein transport measurement. Attribution and interpretation disputed by the 2015 study; retain both contexts.
  - assertion_id: slc10-assay:asbt-electrogenic-1998
    protein_id: UniProtKB:Q12908
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Sodium-dependent bile-acid analogue transport
    substrate: Chenodeoxycholyl-Nepsilon-nitrobenzoxadiazol-lysine
    outcome: DETECTED
    assay: Single-cell fluorescence measurements under voltage clamp
    conditions: Stably transfected CHO cells; sodium concentration and membrane voltage varied.
    construct: Human ASBT; historical construct sequence not reconciled to the pinned reference.
    expression_localization_controls: Nontransfected cells lacked sodium- or voltage-dependent uptake.
    source_locator: Abstract; original study DOI and PMID 9856990
    evidence:
      - reference: https://doi.org/10.1074/jbc.273.52.34691
        snippet: Bile acid movement was bidirectional and voltage-dependent with negative intracellular voltage-stimulating influx.
    limitations: Substrate- and system-specific positive control, not proof that each NTCP contact is necessary in ASBT.
  - assertion_id: slc10-assay:soat-steroid-sulfates-2007
    protein_id: UniProtKB:Q3KNW5
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Sodium-dependent sulfated-steroid transport
    substrate: Dehydroepiandrosterone sulfate, estrone-3-sulfate, and pregnenolone sulfate
    outcome: DETECTED
    assay: Uptake in stably transfected HEK293 cells
    conditions: Sodium-dependent uptake; detailed incubation parameters not extracted from the abstract.
    construct: Human SOAT; historical construct sequence not reconciled to the pinned reference.
    expression_localization_controls: Glycosylation and topology characterized; quantitative surface-expression control not established in abstract.
    source_locator: Abstract; original study PMID 17491011, retrieved through Europe PMC
    evidence:
      - reference: https://doi.org/10.1074/jbc.M702663200
        snippet: sodium-dependent transport of dehydroepiandrosterone sulfate, estrone-3-sulfate, and pregnenolone sulfate
    limitations: Not a generic bile-acid positive control. The study distinguishes sulfoconjugated substrates from taurocholic, cholic, and chenodeoxycholic acids.
  - assertion_id: slc10-assessment:a7-assay-identity-unresolved
    protein_id: UniProtKB:Q0GE19
    evidence_origin: CURATOR_INTERPRETATION
    review_status: PROPOSED
    activity: NTCP-like bile-acid or steroid-sulfate transport
    substrate: Bile acids and steroid sulfates
    outcome: NOT_ASSESSED
    assay: Published oocyte and HEK293 screens; exact human construct not yet independently resolved
    conditions: Abstract reports negative screens; species-specific assay assignment remains to be checked in the full study.
    construct: Human Q0GE19 reference; do not transfer unspecified SLC10A7 species/construct results.
    expression_localization_controls: Abstract reports plasma-membrane detection; native localization is a separate question.
    source_locator: Abstract; original study PMID 17628207, retrieved through Europe PMC
    evidence:
      - reference: https://doi.org/10.1016/j.ejcb.2007.06.001
        snippet: revealed no transport activity for bile acids and steroid sulfates
    limitations: NOT_ASSESSED is a pilot evidence gap, not a claim that the literature contains no experiments or that SLC10A7 has no function.
  - assertion_id: slc10-assay:rat-sodium-dependent-1991
    protein_id: UniProtKB:P26435
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Sodium-dependent bile-acid uptake
    substrate: Bile acids; exact assay substrate panel requires full-text extraction
    outcome: DETECTED
    assay: Functional expression cloning in Xenopus laevis oocytes
    conditions: Sodium dependence and inhibition tested; quantitative assay conditions not extracted from abstract.
    construct: Cloned rat liver transporter; 362-residue protein reported, sequence not independently reconciled.
    expression_localization_controls: Translation and glycosylation examined; surface-expression quantification not established in abstract.
    source_locator: Abstract; original study PMID 1961729, retrieved through Europe PMC
    evidence:
      - reference: https://doi.org/10.1073/pnas.88.23.10629
        snippet: The cloned transporter is strictly sodium-dependent
    limitations: Supports a transport control, not a conclusion about HBV entry or the sufficiency of individual contact residues.
  - assertion_id: slc10-assay:mouse-taurocholate-2013
    protein_id: UniProtKB:O08705
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Taurocholate uptake
    substrate: Taurocholate
    outcome: DETECTED
    assay: Radiotracer uptake in NTCP-transfected HepG2 cells
    conditions: Wild-type and sequence-swapped constructs compared.
    construct: Mouse NTCP; historical construct sequence not independently reconciled.
