  - assertion_id: slc10-assay:mouse-viral-infection-2013
    protein_id: UniProtKB:O08705
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Support of HBV or HDV infection
    substrate: HBV and HDV
    outcome: NOT_DETECTED
    assay: Infection of NTCP-expressing cells
    conditions: Wild-type mouse NTCP arm; humanized variants assessed separately.
    construct: Mouse NTCP; historical construct sequence not independently reconciled.
    expression_localization_controls: Expression and taurocholate transport controls.
    source_locator: Abstract and Figure 1; PMID 23678176
    evidence:
      - reference: https://doi.org/10.1128/JVI.03540-12
        snippet: unable to support either HBV or HDV
    limitations: Assay-specific restriction; not loss of transport or absence of every binding interaction.
  - assertion_id: slc10-assay:ntcp-blv-inhibition-2024
    protein_id: UniProtKB:Q14973
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Inhibition of NTCP-mediated taurocholate uptake by bulevirtide
    substrate: Taurocholate; bulevirtide as inhibitor
    outcome: DETECTED
    assay: Radiotracer uptake into NTCP-expressing Flp-In T-Rex cells
    conditions: 1 micromolar taurocholate; 8 minute uptake; varying bulevirtide concentrations; three independent replicates.
    construct: Human NTCP; assay construct and purified cryo-EM construct are not asserted to be identical.
    expression_localization_controls: Robust sodium-dependent uptake before inhibition; detailed surface-abundance normalization not independently extracted.
    source_locator: Results, Figure 3a; PMID 38509088
    evidence:
      - reference: https://doi.org/10.1038/s41467-024-46706-w
        snippet: BLV fully abolished transport
    limitations: Inhibition by the complete drug does not prove that one myristoyl contact is individually necessary, or that binding predicts viral entry.
explanations:
  - assertion_id: slc10-explanation:a4-residue-loss
    protein_id: UniProtKB:Q96EP9
    evidence_origin: CURATOR_INTERPRETATION
    review_status: PROPOSED
    claim: The 2015 taurocholate uptake result is explained by loss of NTCP sodium-contacting side-chain residue identities in SLC10A4.
    assessment: CHALLENGED
    challenging_assertions:
      - slc10-comparison:7ZYI-I-705-NA-4.5A-Q96EP9
      - slc10-comparison:7ZYI-J-706-NA-4.5A-Q96EP9
    evidence:
      - reference: https://doi.org/10.2210/pdb7ZYI/pdb
        notes: Structural contact source; cross-protein correspondence is computed, not experimentally observed.
      - reference: https://www.uniprot.org/uniprotkb/Q96EP9/entry
        notes: Pinned SLC10A4 sequence, not a functional assay.
    unresolved_questions:
      - Does SLC10A4 bind sodium in this geometry?
      - Which substrates, localization requirements, gating steps, or coupling mechanisms apply?
      - How should the 2013 and 2015 assay contexts and disputed attribution be reconciled?
    limitations: Challenges loss of residue identities, not every possible defect in site geometry. Does not establish sodium binding or transport.
  - assertion_id: slc10-explanation:mouse-binding-not-infection
    protein_id: UniProtKB:O08705
    evidence_origin: CURATOR_INTERPRETATION
    review_status: PROPOSED
    claim: Detectable preS1 binding alone establishes productive viral infection in the tested system.
    assessment: CHALLENGED
    challenging_assertions:
      - slc10-assay:mouse-pres1-binding-2013
      - slc10-assay:mouse-viral-infection-2013
    evidence:
      - reference: https://doi.org/10.1128/JVI.03540-12
    unresolved_questions:
      - Which post-binding steps depend on the protein variant and host-cell context?
    limitations: A counterexample to sufficiency, not a complete causal account of host restriction.
mechanisms:
  - mechanism_id: slc10-mechanism:ntcp-sodium-coordination
    review_status: PROPOSED
    trait_ref: Pfam:PF01758
    protein_ids: [UniProtKB:Q14973]
    assertion_refs:
      - slc10-site:7ZYI-I-705-NA-4.5A
      - slc10-site:7ZYI-J-706-NA-4.5A
    limitations: Substrate-bound NTCP only. The two residues contact distinct sodium sites. This does not establish necessity in every transporter, occupancy in 8RQF, or sodium binding in SLC10A4.
    residue_bindings:
      - {node_id: oxygen_ligand_residues, protein_id: UniProtKB:Q14973, position: 257, residue: E}
      - {node_id: oxygen_ligand_residues, protein_id: UniProtKB:Q14973, position: 261, residue: Q}
    graph:
      graph_id: ntcp_sodium_coordination
      title: Human NTCP E257 and Q261 participate in distinct sodium sites
      description: A local binding mechanism, not a complete transport cycle or a family-wide requirement. Coordinates and SIFTS refer to substrate-bound 7ZYI.
      nodes:
        - node_id: oxygen_ligand_residues
          label: NTCP E257 and Q261 (UniProtKB Q14973 numbering)
          node_type: RESIDUE
          local: true
          xrefs: [UniProtKB:Q14973]
          description: Sequence-bound residue set; E257 at the deposited Na2 site and Q261 at Na1. The set does not imply that each residue contacts both ions.
        - node_id: sodium
          label: Sodium ions in the two 7ZYI sites
          node_type: LIGAND
          grounding: CHEBI:29101
          xrefs: [PDBCCD:NA]
          description: Sodium(1+); distinct deposited instances I:A:705 and J:A:706 remain separate in the linked structural assertions.
      edges:
        - subject: oxygen_ligand_residues
          predicate: physically interacts with
          predicate_id: RO:0002436
          object: sodium
          description: The authors identify these residues as sodium-coordinating in the earlier substrate-bound NTCP structure; this is not an assertion of sodium density in the BLV-bound structure.
          evidence:
            - reference: https://doi.org/10.1038/s41467-024-46706-w
              snippet: sodium ions, such as Glu257 and Gln261
              notes: Results paragraph beginning with the previously reported substrate-bound structure; the complete sentence contrasts earlier coordination with poor resolution in BLV-bound NTCP. Coordinates are 7ZYI, not 8RQF.
            - reference: https://doi.org/10.1038/s41422-022-00680-4
              notes: Original substrate-bound structure; Figure 2 and sodium-site discussion.
  - mechanism_id: slc10-mechanism:ntcp-bile-salt-binding
    review_status: PROPOSED
    trait_ref: Pfam:PF01758
    protein_ids: [UniProtKB:Q14973]
    assertion_refs:
      - slc10-site:7ZYI-F-702-CHO-4.5A
      - slc10-site:7ZYI-G-703-CHO-4.5A
    limitations: Density was interpreted as GCDC using structure and biochemical context; sterol-shaped density alone does not uniquely identify the ligand. No residue necessity or complete translocation cycle is asserted.
    graph:
      graph_id: ntcp_bile_salt_binding
      title: Two modeled bile-salt molecules bind within the NTCP tunnel
      description: Substrate-bound human NTCP only; the two deposited CHO instances are preserved separately in the linked sites.
      nodes:
        - node_id: tunnel
          label: NTCP tunnel surfaces from TM1, TM3b, TM6 and TM9
          node_type: MOTIF
          local: true
          xrefs: [UniProtKB:Q14973]
          description: The local binding cavity described for 7ZYI, not a universal SBF-family specificity motif.
        - node_id: gcdc
          label: Glycochenodeoxycholic acid modeled in 7ZYI
          node_type: LIGAND
          grounding: CHEBI:36274
          xrefs: [PDBCCD:CHO]
          description: Chemical identity follows deposited CCD CHO; no experimentally resolved protonation state is claimed. Two molecule instances, F:A:702 and G:A:703.
      edges:
        - subject: tunnel
          predicate: physically interacts with
          predicate_id: RO:0002436
          object: gcdc
          description: The authors model two GCDC molecules clamped by the stated helices. Geometry gives contact candidates, not proof that every contacting residue is indispensable.
          evidence:
            - reference: https://doi.org/10.1038/s41422-022-00680-4
              snippet: The bound substrate molecules are oriented in parallel and clamped between TM1, TM3b, TM6 and TM9
              notes: Results, substrate-binding tunnel; Figure 1h and Supplementary Figure S6. Ligand-assignment caveats are discussed in the preceding sentences.
  - mechanism_id: slc10-mechanism:ntcp-blv-myristoyl-binding
    review_status: PROPOSED
    trait_ref: Pfam:PF01758
    protein_ids: [UniProtKB:Q14973]
    assertion_refs: [slc10-site:8RQF-F-101-BJU-4.5A]
    limitations: Author-described TM4 interaction set, not a diagnostic viral-entry motif. M133 is named by the authors but is outside this pilot's 4.5 angstrom contact shell; the definitions are intentionally not forced to agree. Drug binding is not infection.
    residue_bindings:
      - {node_id: tm4_residues, protein_id: UniProtKB:Q14973, position: 128, residue: F}
      - {node_id: tm4_residues, protein_id: UniProtKB:Q14973, position: 131, residue: L}
      - {node_id: tm4_residues, protein_id: UniProtKB:Q14973, position: 133, residue: M}
    graph:
      graph_id: ntcp_blv_myristoyl_binding
      title: NTCP TM4 residues interact with the bulevirtide myristoyl group
      description: Partial molecular interface in 8RQF. The myristoylated glycine component is not the complete BLV drug or an intact virus.
      nodes:
        - node_id: tm4_residues
          label: NTCP F128, L131 and M133 (UniProtKB Q14973 numbering)
          node_type: RESIDUE
          local: true
          xrefs: [UniProtKB:Q14973]
          description: Author-described TM4 part of the interface; the publication separately describes a TM5 contribution.
        - node_id: myristoyl_moiety
          label: Myristoylated glycine moiety of bound BLV
          node_type: LIGAND
          grounding: CHEBI:133050
          xrefs: [PDBCCD:BJU]
          description: N-tetradecanoylglycyl substituent group in the peptide. BJU is the deposited component representation; free N-myristoylglycine is not the complete drug.
      edges:
        - subject: tm4_residues
          predicate: physically interacts with
          predicate_id: RO:0002436
          object: myristoyl_moiety
          description: The authors describe contacts of the BLV myristoyl group with this TM4 surface. No single-residue necessity or sufficiency claim is made.
          evidence:
            - reference: https://doi.org/10.1038/s41467-024-46706-w
              snippet: surface of TM4 (Phe128, Leu131, and Met133)
              notes: Results, Molecular interaction between BLV and NTCP; Figure 4. Full sentence identifies the myristoyl group as the interaction partner.
  - mechanism_id: slc10-mechanism:ntcp-blv-transport-inhibition
    review_status: PROPOSED
    trait_ref: Pfam:PF01758
    protein_ids: [UniProtKB:Q14973]
    assertion_refs: [slc10-assay:ntcp-blv-inhibition-2024]
    limitations: Experimental inhibition by complete BLV. The graph does not attribute the inhibition to one contact or predict infection competence of other SLC10 proteins.
    graph:
      graph_id: ntcp_blv_transport_inhibition
      title: Bulevirtide inhibits NTCP-mediated taurocholate uptake
      description: The functional consequence is scoped to the linked cell-based assay, independently of the myristoyl contact graph.
      nodes:
        - node_id: blv
          label: Bulevirtide (complete myristoylated peptide drug)
          node_type: LIGAND
          grounding: PubChem:134687648
          description: Complete BLV, not isolated myristoylglycine; chemical identity is independently available at https://pubchem.ncbi.nlm.nih.gov/compound/134687648.
        - node_id: uptake
          label: NTCP-mediated taurocholate uptake in the tested cells
          node_type: MOLECULAR_FUNCTION
          grounding: GO:0008508
          description: Bile acid:sodium symporter activity, scoped here to human NTCP and the Figure 3a assay; not a new GO annotation.
      edges:
        - subject: blv
          predicate: negatively regulates
          predicate_id: RO:0002212
          object: uptake
          description: Increasing BLV inhibits uptake; complete inhibition is reported at high concentrations in the linked 1 micromolar taurocholate, 8 minute assay.
          evidence:
            - reference: https://doi.org/10.1038/s41467-024-46706-w
              snippet: BLV fully abolished transport
              notes: Results, Figure 3a; the result applies to complete drug exposure, not to a residue mutation.
