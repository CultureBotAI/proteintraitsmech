    protein_id: UniProtKB:Q14973
    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Increase of estrone-3-sulfate uptake with NTCP S267F
    substrate: Estrone-3-sulfate
    outcome: DETECTED
    assay: Radiotracer uptake in transfected HEK293 cells
    conditions: Initial assay, 5.8 nM substrate for five minutes at 37 degrees Celsius; twofold increase versus wild type before surface-expression correction.
    construct: His-tagged human NTCP S267F; Methods specify HEK293T/17 cells; full historical construct not independently reconciled.
