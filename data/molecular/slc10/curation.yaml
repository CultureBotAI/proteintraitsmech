    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Taurocholate uptake
    activity_id: GO:0008508
    substrate: Taurocholate
    outcome: DETECTED
    assay: Radiotracer uptake in Xenopus laevis oocytes
    conditions: Positive-control arm of the same Figure 4 assay.
    construct: Human NTCP cRNA; historical construct sequence not independently reconciled to the pinned reference.
