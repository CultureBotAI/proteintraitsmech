    evidence_origin: EXPERIMENTAL_ASSAY
    review_status: PROPOSED
    activity: Sodium-dependent bile-acid analogue transport
    substrate: Chenodeoxycholyl-Nepsilon-nitrobenzoxadiazol-lysine
    outcome: DETECTED
    assay: Single-cell fluorescence measurements under voltage clamp
    conditions: Stably transfected CHO cells; sodium concentration and membrane voltage varied.
    construct: Human ASBT; historical construct sequence not reconciled to the pinned reference.
