residue_simulations:
  - assertion_id: slc10-simulation:ntcp-s267f-taurocholate-2024
    protein_id: UniProtKB:Q14973
    position: 267
    residue: S
    substituted_residue: F
    evidence_origin: PUBLISHED_SIMULATION
    review_status: PROPOSED
    partner_id: CHEBI:36257
    claim: The authors report an F267 side-chain interaction with the sterol group of taurocholate in the extracellular pocket.
    method: Source-reported 1-microsecond mutant molecular dynamics; not independently replayed by PTM.
    conditions: S267F hNTCP with TCA; extracellular-pocket analysis. Do not substitute estrone-3-sulfate or the 7ZYI CHO component for the simulated substrate.
    coordinate_frame: Source hNTCP numbering matched to S267 of pinned Q14973; the reference hash does not certify the complete simulated construct or its protonation assignments.
    source_locator: Lu and Huang 2024, Overall scheme of the hNTCP transport cycle; Figure S19b-c.
    evidence:
      - reference: https://doi.org/10.1016/j.bpj.2024.03.033
        snippet: S267F mutation fosters hydrophobic stacking interactions between the side chain of F267 and the sterol group of TCA
        notes: Published article text indexed at PMC11140467; variant result is not present in the inspected 2023 Research Square v1 preprint.
      - reference: https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:36257
        notes: Taurocholate molecular identity; not evidence of an NTCP interaction.
    limitations: Published simulation hypothesis, not experimental contact or a reproduced trajectory. Does not establish the intermediate responsible for either 2021 uptake branch, explain estrone-sulfate transport, or simulate R252H.
residue_reasoning:
