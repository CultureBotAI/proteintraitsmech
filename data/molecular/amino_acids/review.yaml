reviewed_on: '2026-10-08'
reviewer: Codex source-transcription and chemical-rule self-review
llm_assisted: true
scope: >-
  All 20 standard residue identities, their existing MOD/ChEBI links, CCD
  atom/bond projections, functional-group rules and eight operational properties.
  Exact raw snapshot chemistry-2026-10-08; not an assessment of any protein mechanism.
checks:
  - All 22 source files pass exact membership, URL/license, byte-count and SHA-256 checks.
  - CCD one-letter/component identities and peptide-linking types match all 20 MOD/ChEBI mappings.
  - All 20 side-chain heavy-atom counts inspected; backbone, leaving atoms and hydrogen excluded.
  - Aromatic atom sets inspected for F/H/W/Y; hydroxyl groups for S/T/Y exclude carboxyl O-H.
  - Amide N/Q, guanidino R, primary amino K, thiol C, thioether M and proline ring closure inspected.
  - Initial amide/guanidino/lysine classification defect reproduced with failing tests and corrected.
  - Kyte-Doolittle and Bjellqvist literal source tables agree with independently maintained biophysical constants.
  - pH-7 side-chain charge uses the explicit independent-site model; no terminal or environment contribution.
limitations: >-
  Machine-assisted self-review, not independent human scientific approval.
  Chemical-component reference flags do not establish physiological protonation,
  local hydrogen bonds, steric volume, conformational effects or variant outcomes.
  pKa values are model parameters, not site measurements. Existing SEEDED trait
  records are not promoted by this review. Modified/nonstandard residues are excluded.
