# ProteinTraitsMech — detection-method catalogue
#
# "How is a trait detected / predicted / computed on a real protein?" Method is
# largely a function of either the DATA SOURCE (how that source's signatures are
# scanned) or the TRAIT CATEGORY (the common-parent feature — e.g. every
# SEQ_DISORDER trait is found by disorder predictors, regardless of source).
# So this catalogue is keyed both ways; the browser resolves a record's methods
# as by_source[src] + by_category[cat] (source first).
#
# Each method is grounded: `edam` = EDAM operation (what it does), `tool` =
# bio.tools id or URL (which software), `ref` = PMID/DOI, `eco` = Evidence &
# Conclusion Ontology code (evidence kind), `recipe` = a runnable command
# template ({input}/{db}/{output} placeholders). This KB *describes* methods —
# it does not run them; recipes are documentation, not a workflow engine.
# See research/methods-recipes-tools-round1.md.

meta:
  edam: http://edamontology.org/
  biotools: https://bio.tools/
  eco: https://www.evidenceontology.org/
  note: >-
    method_type values map to ECO: SEQUENCE_PATTERN/HMM_PROFILE/PROFILE_MATRIX →
    ECO:0000203 (sequence-analysis evidence); ML_PREDICTOR → ECO:0007653
    (computational combinatorial evidence); STRUCTURAL_ALGORITHM → ECO:0000041
    (similarity/structure evidence); HOMOLOGY_TRANSFER → ECO:0000250;
    EXPERIMENTAL → ECO:0000269.

# ---------------------------------------------------------------- by SOURCE ---
by_source:
  PROSITE:
    - name: ps_scan / ScanProsite
      method_type: SEQUENCE_PATTERN
      edam: EDAM:operation_0361        # sequence annotation
      tool: biotools:ps_scan
      ref: PMID:16845026
      eco: ECO:0000203
      recipe: "ps_scan.pl -d prosite.dat {input.fasta}   # or web ScanProsite"
  Pfam:
    - name: hmmsearch / hmmscan (Pfam-A)
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347        # sequence database search (HMM)
      tool: biotools:hmmer
      ref: PMID:22039361
      eco: ECO:0000203
      recipe: "hmmsearch --cut_ga Pfam-A.hmm {input.fasta}"
  InterPro:
    - name: InterProScan
      method_type: HMM_PROFILE
      edam: EDAM:operation_0361
      tool: biotools:interproscan
      ref: PMID:24451626
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl Pfam,PROSITE,SMART,Gene3D -f TSV"
  NCBIfam:
    - name: hmmsearch (NCBIfam) / AMRFinderPlus
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: biotools:amrfinderplus
      ref: PMID:34135355
      eco: ECO:0000203
      recipe: "hmmsearch hmm_PGAP.HMM {input.fasta}   # or amrfinder -p {input.fasta}"
  CDD:
    - name: RPS-BLAST / CD-Search
      method_type: PROFILE_MATRIX
      edam: EDAM:operation_0347
      tool: biotools:cd-search
      ref: PMID:25414356
      eco: ECO:0000203
      recipe: "rpsblast -query {input.fasta} -db Cdd -evalue 0.01 -outfmt 6"
  ELM:
    - name: SLiMSearch / ELM regex scan
      method_type: SEQUENCE_PATTERN
      edam: EDAM:operation_0239        # sequence motif recognition
      tool: biotools:slimsearch
      ref: PMID:26908899
      eco: ECO:0000203
      recipe: "grep -oP '<Regex>' {input.fasta}   # or ELM/SLiMSearch web with disorder+conservation filters"
  MEROPS:
    - name: MEROPS Batch BLAST / hmmscan
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: https://www.ebi.ac.uk/merops/
      ref: PMID:29145643
      eco: ECO:0000203
      recipe: "hmmscan merops_scan.lib {input.fasta}   # or MEROPS Batch BLAST"
  CATH:
    - name: Gene3D (CATH-assign, HMMER)
      method_type: HMM_PROFILE
      edam: EDAM:operation_0303        # fold recognition / structure prediction
      tool: biotools:gene3d
      ref: PMID:33021670
      eco: ECO:0000203
      recipe: "cath-genomescan.pl -i {input.fasta} -l cath-funfam-hmm3.lib"
  SCOPe:
    - name: SUPERFAMILY (SCOP HMMs)
      method_type: HMM_PROFILE
      edam: EDAM:operation_0303
      tool: biotools:superfamily
      ref: PMID:21062764
      eco: ECO:0000203
      recipe: "hmmscan supfam.hmm {input.fasta}"
  TED:
    - name: Merizo / Chainsaw (domain chopping) + Foldseek
      method_type: STRUCTURAL_ALGORITHM
      edam: EDAM:operation_3899        # protein-domain assignment / structure comparison
      tool: biotools:foldseek
      ref: PMID:38538027
      eco: ECO:0000041
      recipe: "merizo predict {input.pdb}; foldseek easy-search {input.pdb} tedDB res tmp"
  RepeatsDB:
    - name: ReUPred / structural repeat detection
      method_type: STRUCTURAL_ALGORITHM
      edam: EDAM:operation_2488        # protein secondary/structure feature
      tool: https://repeatsdb.org/
      ref: PMID:36629399
      eco: ECO:0000041
      recipe: "curl -s 'https://repeatsdb.org/api/entries?repeatsdb_id={id}'   # or run ReUPred / Raphael on {input.pdb}"
  TCDB:
    - name: BLAST vs TCDB (TCDB-BLAST)
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_0346        # sequence similarity search
      tool: https://tcdb.org/
      ref: PMID:33170213
      eco: ECO:0000250
      recipe: "blastp -query {input.fasta} -db tcdb -evalue 1e-5   # TCDB-BLAST"
  COG:
    - name: eggNOG-mapper / COGclassifier / RPS-BLAST(COG)
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_0324        # phylogenetic/ortholog inference
      tool: biotools:eggnog-mapper
      ref: PMID:34597405
      eco: ECO:0000250
      recipe: "emapper.py -i {input.fasta} -o out   # COG in the annotations"
  ExPASy ENZYME:
    - name: EC-number prediction (DeepEC / CLEAN) or InterPro2GO transfer
      method_type: ML_PREDICTOR
      edam: EDAM:operation_3778        # text/EC annotation; enzyme prediction
      tool: biotools:deepec
      ref: PMID:36219571
      eco: ECO:0007653
      recipe: "CLEAN --fasta {input.fasta}   # predict EC; or transfer from InterPro/UniRule"
  Rhea:
    - name: reaction assignment via EC / UniProt annotation
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_3803
      tool: https://www.rhea-db.org/
      ref: PMID:34755880
      eco: ECO:0000250
      recipe: "CLEAN --fasta {input.fasta} && curl -s 'https://www.rhea-db.org/rhea?query={curie}&format=tsv'   # or map UniProt catalytic activity to {curie}"
  CARD/ARO:
    - name: RGI (Resistance Gene Identifier)
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_3482        # antimicrobial resistance prediction
      tool: biotools:rgi
      ref: PMID:36263822
      eco: ECO:0000250
      recipe: "rgi main -i {input.fasta} -t protein -o rgi_out"
  M-CSA:
    - name: catalytic-site transfer (homology to M-CSA templates)
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_0420        # catalytic residue prediction
      tool: https://www.ebi.ac.uk/thornton-srv/m-csa/
      ref: PMID:29140459
      eco: ECO:0000250
      recipe: "blastp -query {input.fasta} -db mcsa_S95 -evalue 1e-5 -outfmt 6   # align to M-CSA template and check active-site conservation"
  DisProt:
    - name: (curated experimental; see SEQ_DISORDER predictors)
      method_type: EXPERIMENTAL
      edam: EDAM:operation_0472
      tool: https://disprot.org/
      ref: PMID:34850135
      eco: ECO:0000269
      recipe: "mobidb_lite.py {input.fasta} -o {output.json}   # or blastp -query {input.fasta} -db disprot -evalue 1e-5"
  ECOD:
    - name: ECOD domain assignment (Foldseek / HHsearch / DomainSummary)
      method_type: STRUCTURAL_ALGORITHM
      edam: EDAM:operation_0303
      tool: biotools:foldseek
      ref: PMID:25452340
      eco: ECO:0000041
      recipe: "foldseek easy-search {input.pdb} ecodDB res tmp   # or hhsearch -i {input.fasta} -d ecod_hhm"
  HAMAP:
    - name: HAMAP family profile scan (ps_scan / InterProScan)
      method_type: PROFILE_MATRIX
      edam: EDAM:operation_0361
      tool: biotools:hamap
      ref: PMID:25392413
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl Hamap -f TSV   # or ps_scan.pl -d hamap.prf {input.fasta}"
  IDEAL:
    - name: IDEAL disordered / ProS binding region homology + disorder scan
      method_type: ML_PREDICTOR
      edam: EDAM:operation_0472
      tool: https://www.ideal-db.org/
      ref: PMID:24243840
      eco: ECO:0007653
      recipe: "blastp -query {input.fasta} -db ideal -evalue 1e-5 -outfmt 6 && iupred3 {input.fasta} anchor"
  LinkML LSF:
    - name: UniProt Feature Table / InterProScan sequence-feature annotation
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_0361
      tool: biotools:interproscan
      ref: PMID:36408920
      eco: ECO:0000250
      recipe: "interproscan.sh -i {input.fasta} -f GFF3   # or query UniProt feature annotations via UniRule"
  METPO:
    - name: ProTraits / Traitar / eggNOG microbial phenotype & enzymatic trait inference
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_3778
      tool: biotools:eggnog-mapper
      ref: PMID:27899665
      eco: ECO:0000250
      recipe: "emapper.py -i {input.fasta} -o out   # map EC/KO/COG to METPO microbial phenotype trait"
  PANTHER:
    - name: PANTHER HMM family/subfamily scoring (pantherScore / InterProScan)
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: biotools:panther
      ref: PMID:34890455
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl PANTHER -f TSV   # or pantherScore2.2.pl -l PANTHER18.0 -D B -i {input.fasta}"
  PATO:
    - name: Biophysical / structural quality calculation (FoldX / FreeSASA / DSSP)
      method_type: STRUCTURAL_ALGORITHM
      edam: EDAM:operation_0387
      tool: biotools:freesasa
      ref: PMID:26973785
      eco: ECO:0000041
      recipe: "freesasa {input.pdb} && mkdssp {input.pdb} {output.dssp}   # compute structural/biophysical quality"
  PRINTS:
    - name: FingerPRINTScan / InterProScan (PRINTS motif fingerprints)
      method_type: PROFILE_MATRIX
      edam: EDAM:operation_0239
      tool: biotools:interproscan
      ref: PMID:12520022
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl PRINTS -f TSV   # or FingerPRINTScan prints.pval {input.fasta}"
  PSI-MI:
    - name: HUPO-PSI Molecular Interaction annotation (IntAct / PSICQUIC / AlphaFold-Multimer)
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_2464
      tool: biotools:intact
      ref: PMID:34761267
      eco: ECO:0000250
      recipe: "curl -s 'https://www.ebi.ac.uk/Tools/webservices/psicquic/intact/webservices/current/search/query/{curie}'   # query IntAct PSICQUIC"
  PSI-MOD:
    - name: Mass-spectrometry PTM identification (MaxQuant / MSFragger) or MusiteDeep
      method_type: ML_PREDICTOR
      edam: EDAM:operation_0417
      tool: biotools:musitedeep
      ref: PMID:18688235
      eco: ECO:0007653
      recipe: "musitedeep predict -input {input.fasta}   # or open-search PTM assignment with MSFragger"
  Reactome:
    - name: Reactome pathway mapping via UniProt / eggNOG-mapper orthology
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_3660
      tool: biotools:reactome
      ref: PMID:34788843
      eco: ECO:0000250
      recipe: "emapper.py -i {input.fasta} -o out   # or curl -s 'https://reactome.org/ContentService/data/pathway/{id}/containedEvents'"
  SFLD:
    - name: Structure-Function Linkage Database HMM + active-site residue check
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: biotools:interproscan
      ref: PMID:24271391
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl SFLD -f TSV   # or sfld_preprocess -i {input.fasta} -h sfld.hmm"
  UniProtKB:
    - name: UniProt UniRule / ARBA / InterProScan feature & keyword annotation
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_0361
      tool: biotools:uniprot
      ref: PMID:36408920
      eco: ECO:0000250
      recipe: "interproscan.sh -i {input.fasta} -iprlookup -goterms -pa -f TSV   # apply UniRule/InterPro annotations"
  curated:
    - name: Multi-tool sequence & structure trait annotation (InterProScan + DSSP + Foldseek)
      method_type: STRUCTURAL_ALGORITHM
      edam: EDAM:operation_0361
      tool: biotools:interproscan
      ref: PMID:24451626
      eco: ECO:0000041
      recipe: "interproscan.sh -i {input.fasta} -f TSV   # see category-specific method below for exact algorithm"
  eLife metallophores:
    - name: antiSMASH metallophore / NRP-metallophore BGC rule + HMMER scan
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: biotools:antismash
      ref: PMID:37140036
      eco: ECO:0000203
      recipe: "antismash --cb-general --asf {input.gbk}   # or hmmsearch --cut_tc metallophore_bgc.hmm {input.fasta}"
  manual:
    - name: OrthoFinder + eggNOG-mapper evolutionary & functional trait profiling
      method_type: HOMOLOGY_TRANSFER
      edam: EDAM:operation_0324
      tool: biotools:orthofinder
      ref: PMID:31727128
      eco: ECO:0000250
      recipe: "orthofinder -f {input.proteomes}/ && emapper.py -i {input.fasta} -o out"
  PIRSF:
    - name: PIRSF whole-protein HMM scan (InterProScan)
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: biotools:interproscan
      ref: PMID:14681371
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl PIRSF -f TSV   # or hmmscan pirsf.hmm {input.fasta}"
  SMART:
    - name: SMART domain HMM scan (InterProScan)
      method_type: HMM_PROFILE
      edam: EDAM:operation_0347
      tool: biotools:smart
      ref: PMID:33068416
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl SMART -f TSV   # or hmmscan smart.hmm {input.fasta}"
  SUPERFAMILY:
    - name: SUPERFAMILY SCOP hidden Markov model scan
      method_type: HMM_PROFILE
      edam: EDAM:operation_0303
      tool: biotools:superfamily
      ref: PMID:21062764
      eco: ECO:0000203
      recipe: "interproscan.sh -i {input.fasta} -appl SuperFamily -f TSV   # or hmmscan supfam.hmm {input.fasta}"

# -------------------------------------------------------------- by CATEGORY ---
by_category:
  SEQ_DISORDER:
    - {name: MobiDB-lite, method_type: ML_PREDICTOR, edam: EDAM:operation_0472, tool: biotools:mobidb-lite, ref: PMID:28453701, eco: ECO:0007653, recipe: "mobidb_lite.py {input.fasta} -o {output.json}"}
    - {name: IUPred3, method_type: ML_PREDICTOR, edam: EDAM:operation_0472, tool: biotools:iupred, ref: PMID:34048569, eco: ECO:0007653, recipe: "iupred3 {input.fasta} long"}
    - {name: AlphaFold pLDDT (< 50 → disorder), method_type: STRUCTURAL_ALGORITHM, edam: EDAM:operation_0472, tool: biotools:alphafold, ref: PMID:34265844, eco: ECO:0000041, recipe: "awk '$1==\"ATOM\" && $3==\"CA\" && $11+0 < 50 {print $4,$6,$11}' {input.pdb}   # extract CA residues with pLDDT < 50"}
  SEQ_SIGNAL_PEPTIDE:
    - {name: SignalP 6.0, method_type: ML_PREDICTOR, edam: EDAM:operation_0418, tool: biotools:signalp, ref: PMID:34980915, eco: ECO:0007653, recipe: "signalp6 --fastafile {input.fasta} --organism other"}
  SEQ_TRANSIT_PEPTIDE:
    - {name: TargetP 2.0, method_type: ML_PREDICTOR, edam: EDAM:operation_0418, tool: biotools:targetp, ref: PMID:31570514, eco: ECO:0007653, recipe: "targetp2 -fasta {input.fasta} -org non-pl"}
  SEQ_TARGETING_SIGNAL:
    - {name: ELM regex / cNLS Mapper (NLS), method_type: SEQUENCE_PATTERN, edam: EDAM:operation_0239, tool: biotools:slimsearch, ref: PMID:26908899, eco: ECO:0000203, recipe: "grep -oP '{pat}' {input.fasta}   # or deeploc2 -f {input.fasta} / cNLS Mapper"}
  SEQ_LEADER_PEPTIDE:
    - {name: antiSMASH / BAGEL4 / RODEO (RiPP), method_type: HMM_PROFILE, edam: EDAM:operation_0436, tool: biotools:antismash, ref: PMID:37140036, eco: ECO:0000203, recipe: "antismash {input.gbk}   # or BAGEL4 web"}
  SEQ_CLEAVAGE_SITE:
    - {name: ProP / SignalP (cleavage) / MEROPS, method_type: ML_PREDICTOR, edam: EDAM:operation_0422, tool: biotools:prop, ref: PMID:15115854, eco: ECO:0007653, recipe: "prop {input.fasta}"}
  SEQ_PROPEPTIDE:
    - {name: ProP (proprotein-convertase sites), method_type: ML_PREDICTOR, edam: EDAM:operation_0422, tool: biotools:prop, ref: PMID:15115854, eco: ECO:0007653, recipe: "prop -c {input.fasta}"}
  SEQ_PTM_SITE:
    - {name: MusiteDeep, method_type: ML_PREDICTOR, edam: EDAM:operation_0417, tool: biotools:musitedeep, ref: PMID:32406920, eco: ECO:0007653, recipe: "musitedeep predict -input {input.fasta}"}
  SEQ_MODIFIED_RESIDUE:
    - {name: MusiteDeep / NetPhos, method_type: ML_PREDICTOR, edam: EDAM:operation_0417, tool: biotools:netphos, ref: PMID:10600390, eco: ECO:0007653, recipe: "netphos {input.fasta}"}
  SEQ_GLYCOSYLATION_SITE:
    - {name: NetNGlyc / NetOGlyc, method_type: ML_PREDICTOR, edam: EDAM:operation_0417, tool: biotools:netnglyc, ref: PMID:32853469, eco: ECO:0007653, recipe: "netNglyc {input.fasta}"}
  SEQ_LIPIDATION_SITE:
    - {name: GPS-Lipid / Myristoylator, method_type: ML_PREDICTOR, edam: EDAM:operation_0417, tool: biotools:gps-lipid, ref: PMID:27087650, eco: ECO:0007653, recipe: "ps_scan.pl -p PS00008 -p PS00294 {input.fasta}   # myristoylation/prenylation PROSITE rules, or GPS-Lipid"}
  SEQ_MOTIF:
    - {name: ps_scan / SLiMSearch, method_type: SEQUENCE_PATTERN, edam: EDAM:operation_0239, tool: biotools:ps_scan, ref: PMID:16845026, eco: ECO:0000203, recipe: "ps_scan.pl {input.fasta}"}
  SEQ_REPEAT:
    - {name: RADAR / HHrepID / T-REKS, method_type: SEQUENCE_PATTERN, edam: EDAM:operation_0237, tool: biotools:t-reks, ref: PMID:19399238, eco: ECO:0000203, recipe: "t-reks -infile {input.fasta}"}
  SEQ_COMPOSITION:
    - {name: SEG / fLPS, method_type: SEQUENCE_PATTERN, edam: EDAM:operation_0429, tool: biotools:flps, ref: PMID:28109103, eco: ECO:0000203, recipe: "fLPS {input.fasta}"}
  SEQ_CONSERVATION:
    - {name: ConSurf / Rate4Site, method_type: ML_PREDICTOR, edam: EDAM:operation_0448, tool: biotools:consurf, ref: PMID:27166375, eco: ECO:0007653, recipe: "rate4site -s {input.aln} -t {input.tree}"}
  SEQ_EPITOPE:
    - {name: BepiPred 3.0 / IEDB, method_type: ML_PREDICTOR, edam: EDAM:operation_0252, tool: biotools:bepipred, ref: PMID:35714009, eco: ECO:0007653, recipe: "bepipred3 {input.fasta}"}
  STRUCT_SECONDARY:
    - {name: DSSP, method_type: STRUCTURAL_ALGORITHM, edam: EDAM:operation_0320, tool: biotools:dssp, ref: PMID:6667333, eco: ECO:0000041, recipe: "mkdssp {input.pdb} {output.dssp}"}
  STRUCT_FOLD:
    - {name: Foldseek / DALI, method_type: STRUCTURAL_ALGORITHM, edam: EDAM:operation_2487, tool: biotools:foldseek, ref: PMID:37156916, eco: ECO:0000041, recipe: "foldseek easy-search {input.pdb} pdb res tmp"}
  STRUCT_DOMAIN:
    - {name: InterProScan / Merizo (structural domain chopping), method_type: HMM_PROFILE, edam: EDAM:operation_3899, tool: biotools:interproscan, ref: PMID:24451626, eco: ECO:0000203, recipe: "interproscan.sh -i {input.fasta}"}
  STRUCT_HOMOLOGOUS_SUPERFAMILY:
    - {name: Gene3D / SUPERFAMILY, method_type: HMM_PROFILE, edam: EDAM:operation_0303, tool: biotools:gene3d, ref: PMID:33021670, eco: ECO:0000203, recipe: "cath-genomescan.pl -i {input.fasta}"}
  STRUCT_ACTIVE_SITE:
    - {name: M-CSA transfer / CSA-3D, method_type: HOMOLOGY_TRANSFER, edam: EDAM:operation_0420, tool: https://www.ebi.ac.uk/thornton-srv/m-csa/, ref: PMID:29140459, eco: ECO:0000250, recipe: "blastp -query {input.fasta} -db mcsa_S95 -evalue 1e-5 -outfmt 6   # transfer conserved M-CSA catalytic triad/residues"}
  STRUCT_BINDING_SITE:
    - {name: fpocket / P2Rank, method_type: STRUCTURAL_ALGORITHM, edam: EDAM:operation_3897, tool: biotools:p2rank, ref: PMID:30109435, eco: ECO:0000041, recipe: "prank predict -f {input.pdb}"}
  STRUCT_CAVITY:
    - {name: fpocket, method_type: STRUCTURAL_ALGORITHM, edam: EDAM:operation_3897, tool: biotools:fpocket, ref: PMID:19961576, eco: ECO:0000041, recipe: "fpocket -f {input.pdb}"}
  STRUCT_METAL_SITE:
    - {name: MetalPDB / BioMetAll, method_type: STRUCTURAL_ALGORITHM, edam: EDAM:operation_3899, tool: https://metalpdb.cerm.unifi.it/, ref: PMID:29846656, eco: ECO:0000041, recipe: "biometall {input.pdb}   # or Metal3D / Masterov search vs MetalPDB templates"}
  STRUCT_DISULFIDE:
    - {name: DiANNA / DISULFIND, method_type: ML_PREDICTOR, edam: EDAM:operation_0418, tool: biotools:disulfind, ref: PMID:16844986, eco: ECO:0007653, recipe: "disulfind {input.fasta}"}
  STRUCT_STABILITY:
