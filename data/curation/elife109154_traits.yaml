# Agent-curated interpretations of Reitz, Pourmohsenin et al., eLife 109154.
# Model identities and thresholds come from Zenodo 18866949, hmmdetails.txt.
# Chemical products are context, not protein traits or equivalent xrefs.
traits:
  EntA:
    label: EntA-type catechol biosynthesis dehydrogenase family
    category: SEQ_FAMILY
    chelator: catechol (2,3-dihydroxybenzoate)
    definition: >-
      Protein sequence family recognized by the EntA profile of the bacterial NRP
      metallophore detection system. Members include dehydrogenases that oxidize
      2,3-dihydro-2,3-dihydroxybenzoate during catechol precursor biosynthesis.
      The cluster rule requires EntC together with EntA to distinguish this pathway
      from the related 3-hydroxyanthranilate pathway.
  EntC:
    label: EntC-type catechol biosynthesis isochorismate synthase family
    category: SEQ_FAMILY
    chelator: catechol (2,3-dihydroxybenzoate)
    definition: >-
      Protein sequence family recognized by the EntC profile of the bacterial NRP
      metallophore detection system. Members include isochorismate synthases supplying
      the chorismate-derived precursor for 2,3-dihydroxybenzoate biosynthesis.
      EntA and EntC must co-occur in the cluster rule; an isolated match does not
      establish catechol metallophore production.
  IPL:
    label: Metallophore-associated isochorismate pyruvate-lyase family
    category: SEQ_FAMILY
    chelator: salicylate
    definition: >-
      Protein sequence family recognized by the IPL profile of the bacterial NRP
      metallophore detection system. Members include isochorismate pyruvate-lyases
      that generate salicylate from isochorismate as one route to phenolic
      metallophore precursors. This corrects the abbreviated isopyruvate lyase
      label in the source model table using the article's pathway description.
  SalSyn:
    label: Metallophore-associated bifunctional salicylate synthase family
    category: SEQ_FAMILY
    chelator: salicylate
    definition: >-
      Protein sequence family recognized by the SalSyn profile of the bacterial NRP
      metallophore detection system. Members include bifunctional salicylate synthases
      that convert chorismate to salicylate through an isochorismate intermediate.
      This route is an alternative to a separate isochorismate pyruvate-lyase.
  Orn_monoox:
    label: Metallophore-associated ornithine N5-monooxygenase family
    category: SEQ_FAMILY
    chelator: hydroxamate
    definition: >-
      Protein sequence family recognized by the Orn_monoox profile of the bacterial
      NRP metallophore detection system. Members include flavin-dependent ornithine
      N5-monooxygenases supplying N-hydroxyornithine for hydroxamate biosynthesis.
      Related chemistry also supplies non-metallophore products, so the cluster rule
      excludes nearby KtzT and MetRS-like hits; the profile alone is not specific
      evidence of metallophore production.
  Lys_monoox:
    label: Mycobactin-type lysine N6-monooxygenase family
    category: SEQ_FAMILY
    chelator: hydroxamate
    definition: >-
      Protein sequence family designated Lys_monoox in the bacterial NRP metallophore
      detection system, represented by the source lysine monooxygenase alignment.
      Members include mycobactin-type flavin-dependent lysine N6-monooxygenases
      supplying N-hydroxylysine for hydroxamate formation. The deposited model table
      gives a threshold, but its referenced Lys_monoox.hmm is absent from this release.
  VbsL:
    label: Vicibactin acyl-hydroxyornithine epimerase family
    category: SEQ_FAMILY
    chelator: hydroxamate
    definition: >-
      Protein sequence family recognized by the VbsL profile of the bacterial NRP
      metallophore detection system. Members include pyridoxal-phosphate-dependent
      epimerases acting on acylated hydroxyornithine during vicibactin biosynthesis.
      VbsL serves as an alternative pathway marker because the vicibactin
      ornithine hydroxylase VbsO could not be distinguished by a sufficiently
      specific monooxygenase profile in this study.
  TBH_Asp:
    label: T-E-associated metallophore aspartate beta-hydroxylase family
    category: SEQ_FAMILY
    chelator: beta-hydroxyaspartate
    definition: >-
      Protein sequence family recognized by the TBH_Asp profile of the bacterial NRP
      metallophore detection system. This subtype comprises Fe(II)- and
      2-oxoglutarate-dependent aspartate beta-hydroxylases associated with NRPS
      thiolation-epimerization modules in the biosynthesis of beta-hydroxyaspartate
      chelating residues. Membership identifies the hydroxylase subtype rather
      than a metal preference of the final metabolite.
  IBH_Asp:
    label: Interface-associated metallophore aspartate beta-hydroxylase domain
    category: SEQ_DOMAIN
    chelator: beta-hydroxyaspartate
    definition: >-
      Protein sequence domain recognized by the IBH_Asp profile of the bacterial NRP
      metallophore detection system. The profile identifies an interface-associated
      Fe(II)- and 2-oxoglutarate-dependent aspartate beta-hydroxylase subtype, including
      domains embedded in larger NRPS proteins. The cluster rule excludes the
      competing SBH_Asp subtype associated with non-metallophore phytotoxins.
  IBH_His:
    label: Interface-associated metallophore histidine beta-hydroxylase family
    category: SEQ_FAMILY
    chelator: beta-hydroxyhistidine
    definition: >-
      Protein sequence family recognized by the IBH_His profile of the bacterial NRP
      metallophore detection system. This interface-associated Fe(II)- and
      2-oxoglutarate-dependent hydroxylase subtype installs a beta-hydroxyl group
      on histidine in nonribosomal peptide metallophore biosynthesis, generating
      a potential chelating residue.
  CyanoBH_Asp1:
    label: Putative cyanobacterial metallophore aspartate beta-hydroxylase domain 1
    category: SEQ_DOMAIN
    chelator: beta-hydroxyaspartate
    definition: >-
      Protein sequence domain recognized by the CyanoBH_Asp1 profile of the bacterial
      NRP metallophore detection system. The study tentatively assigns this
      cyanobacterial hydroxylase clade, including NRPS-embedded domains, to
      beta-hydroxyaspartate formation in cyanochelin-related pathways. The functional
      assignment is a prediction supported by phylogeny and cluster context;
      it is not an experimental characterization of every member.
  CyanoBH_Asp2:
    label: Putative cyanobacterial metallophore aspartate beta-hydroxylase domain 2
    category: SEQ_DOMAIN
    chelator: beta-hydroxyaspartate
    definition: >-
      Protein sequence domain recognized by the CyanoBH_Asp2 profile of the bacterial
      NRP metallophore detection system. The study tentatively assigns this
      cyanobacterial hydroxylase clade to beta-hydroxyaspartate formation
      in cyanochelin-related pathways. The assignment relies on phylogeny and
      biosynthetic context and does not establish experimental activity for
      individual members. Although the model table labels this subtype standalone,
      the deposited seed identifiers also refer to larger fusion proteins; the
      domain representation preserves that observed scope.
  GrbD:
    label: GrbD-type graminine biosynthesis protein family
    category: SEQ_FAMILY
    chelator: graminine
    definition: >-
      Protein sequence family recognized by the GrbD profile of the bacterial NRP
      metallophore detection system. Members include proteins implicated with GrbE
      in forming the diazeniumdiolate-containing amino acid graminine from arginine.
      The detection rule requires both GrbD and GrbE; the study does not resolve
      a complete catalytic mechanism for these proteins.
  GrbE:
    label: GrbE-type graminine biosynthesis protein family
    category: SEQ_FAMILY
    chelator: graminine
    definition: >-
      Protein sequence family recognized by the GrbE profile of the bacterial NRP
      metallophore detection system. Members include proteins implicated with GrbD
      in graminine diazeniumdiolate formation from arginine. The two profiles form
      a joint pathway marker, and neither an isolated sequence match nor the
      pathway assignment specifies the final metallophore's preferred metal.
  FbnL:
    label: FbnL-type Dmaq biosynthesis peroxidase subunit family
    category: SEQ_FAMILY
    chelator: Dmaq
    definition: >-
      Protein sequence family recognized by the FbnL profile of the bacterial NRP
      metallophore detection system. Members include the FbnL component of a
      two-protein heme peroxidase that initiates biosynthesis of the Dmaq quinoline
      chelator by oxidizing L-tyrosine to L-DOPA. The partner FbnM is also required
      by the cluster detection rule; FbnL alone is not the complete enzyme.
  FbnM:
    label: FbnM-type Dmaq biosynthesis peroxidase subunit family
    category: SEQ_FAMILY
    chelator: Dmaq
    definition: >-
      Protein sequence family recognized by the FbnM profile of the bacterial NRP
      metallophore detection system. Members include the FbnM component of the
      FbnL-FbnM heme peroxidase initiating Dmaq biosynthesis through L-tyrosine
      hydroxylation to L-DOPA. The two subunit profiles jointly identify the
      pathway; this family is not equivalent to the small-molecule chelator.
  PvdP:
    label: Pyoverdine chromophore maturation tyrosinase family
    category: SEQ_FAMILY
    chelator: pyoverdine chromophore
    definition: >-
      Protein sequence family recognized by the PvdP profile of the bacterial NRP
      metallophore detection system. Members include tyrosinases involved in
      maturation of the fluorescent metal-chelating pyoverdine chromophore.
      PvdP and PvdO are independent detection markers because their genes may
      occupy separate loci; the profiles also capture related azotobactin pathways.
  PvdO:
    label: Pyoverdine chromophore maturation oxidoreductase family
    category: SEQ_FAMILY
    chelator: pyoverdine chromophore
    definition: >-
      Protein sequence family recognized by the PvdO profile of the bacterial NRP
      metallophore detection system. Members include oxidoreductases involved in
      maturation of the fluorescent pyoverdine chromophore. The detection rule
      accepts PvdO independently of PvdP to accommodate dispersed biosynthetic
      loci and also captures related azotobactin chromophore biosynthesis.
  VibH_like:
    label: VibH-like metallophore standalone condensation enzyme family
    category: SEQ_FAMILY
    chelator: catechol or salicylate-associated assembly
    definition: >-
      Protein sequence family recognized by the VibH_like profile of the bacterial
      NRP metallophore detection system. Members include standalone condensation
      enzymes that attach 2,3-dihydroxybenzoyl groups to diamines or polyamines.
      This assembly marker can trigger detection without colocated chelator
      precursor biosynthesis genes and does not itself synthesize catechol.
  Cy_tandem:
    label: Metallophore-associated tandem-system heterocyclization domain
    category: SEQ_DOMAIN
    chelator: catechol or salicylate-associated assembly
    definition: >-
      Protein sequence domain recognized by the Cy_tandem profile of the bacterial
      NRP metallophore detection system. The profile derives from heterocyclization
      domains in tandem systems associated with catecholic or phenolic metallophore
      assembly and Ser, Thr, or Cys cyclization. A match denotes one domain subtype,
      not proof of two tandem domains or of a complete biosynthetic pathway.
excluded_models:
  KtzT: Negative constraint for piperazate biosynthesis; not a positive metallophore marker.
  MetRS-like: Negative constraint for hydrazine-related biosynthesis; not a positive marker.
  SBH_Asp: Competing phytotoxin hydroxylase profile excluded by the IBH_Asp rule.
  FbnE: Exploratory fabrubactin monooxygenase model absent from the final detection rule.
