      definitions:
      - kind: STRUCTURAL
        text: In the PROMOTIF operational definition, four consecutive residues i through i+3 form a beta
          turn when the C-alpha atoms of i and i+3 are separated by less than 7 angstroms and the two central
          residues are nonhelical. Subtypes are classified by the central backbone torsions; the end-to-end
          hydrogen bond is optional.
        source: https://www.uoxray.uoregon.edu/local/manuals/promotif/document_2.html
