descriptors:
- descriptor_id: proteintraitsmech:B25
  inventory_id: B25
  label: Experimental thermal unfolding midpoint
  definition: Temperature of an assay-defined thermal unfolding transition for a specified construct and solution.
  family: Stability
  value_kind: SCALAR
  unit: degC
  interpretation_limits: Method, pH, construct, reporting gaps and source are required. A thermal transition is not an unfolding free energy or a universal thermostability classification.
  references:
  - reference: https://doi.org/10.1371/journal.pone.0019425
- descriptor_id: proteintraitsmech:B26
  inventory_id: B26
  label: Experimental unfolding free energy
  definition: Gibbs free-energy difference G(unfolded)-G(native) at a specified reference state, inferred from a declared equilibrium model and experimental observations.
  family: Stability
  value_kind: SCALAR
  unit: kJ/mol
  interpretation_limits: Positive values favor the native state. Retain source sign conventions and any explicit conversion. Model, temperature, pH and denaturant reference state are mandatory; do not infer from melting temperature.
  references:
  - reference: https://doi.org/10.1371/journal.pone.0019425
- descriptor_id: proteintraitsmech:B27
  inventory_id: B27
  label: Experimental chemical denaturation midpoint
  definition: Denaturant concentration at the assay-defined midpoint of the unfolding transition for a specified construct and solution.
  family: Stability
  value_kind: SCALAR
  unit: mol/L
  interpretation_limits: Denaturant identity, pH, temperature, assay and transition criterion are mandatory. Midpoints from different denaturants or conditions must not be pooled.
  references:
  - reference: https://doi.org/10.1371/journal.pone.0019425
- descriptor_id: proteintraitsmech:B30
  inventory_id: B30
  label: Experimental equilibrium solubility
  definition: Equilibrium mass concentration of dissolved protein in contact with a specified solid phase under stated solution conditions.
  family: Solution behavior
  value_kind: SCALAR
  unit: g/L
  interpretation_limits: Requires temperature, pH, buffer, salt composition, solid phase and equilibrium basis. Expression yield, soluble fraction, aggregation thresholds and transient reactor concentrations are distinct observables.
  references:
  - reference: https://doi.org/10.1021/je980316a
  - reference: https://doi.org/10.1021/cg501359h
    notes: Table 1 reproduces earlier solubility measurements; its reactor concentrations are not equilibrium solubility.
