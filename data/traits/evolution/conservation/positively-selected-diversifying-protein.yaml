identifier: proteintraitsmech:EVO_POSITIVELY_SELECTED_DIVERSIFYING
label: "positively selected diversifying protein (dN/dS > 1)"
definition: >-
  An evolutionary protein regime characterized by an elevated nonsynonymous-to-synonymous substitution rate ratio exceeding unity (omega = dN/dS > 1 across the coding sequence or at specific foreground branches/codon sites), driven by positive (diversifying) Darwinian selection for adaptive sequence innovation such as host-pathogen arms races, immune evasion, toxin diversification, or novel substrate recognition.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: EVOLUTION
trait_category: EVO_CONSERVATION
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:EVO_VARIABLE
synonyms:
  - synonym_text: "diversifying selection protein"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "adaptively evolving protein (omega > 1)"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "positive Darwinian selection protein"
    synonym_type: EXACT_SYNONYM
evolutionary_scope:
  definition_method: "PAML codeml / HyPhy branch-site or site-wise codon substitution model (omega = dN/dS > 1)"
  conservation_metric: "dN/dS (positive diversifying selection, omega > 1)"
  orthology_basis: "codon-aligned orthologous coding sequences"
detection_methods:
  - name: "PAML codeml / HyPhy codon maximum-likelihood dN/dS (omega) selection test"
    method_type: HOMOLOGY_TRANSFER
    edam_operation: EDAM:operation_0554
    tool: "biotools:paml"
    evidence_code: ECO:0007669
    reference: PMID:17483113
    recipe: "codeml codeml.ctl"
evidence:
  - reference: PMID:17483113
    notes: "Maximum-likelihood phylogenetic comparison of protein-coding genes in PAML detects positive Darwinian selection where the nonsynonymous substitution rate exceeds the synonymous rate (omega = dN/dS > 1)."
