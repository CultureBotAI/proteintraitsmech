identifier: proteintraitsmech:EVO_SUBFUNCTIONALIZED_DUPLICATE_PARALOG
label: "subfunctionalized duplicate paralog protein"
definition: >-
  A gene-duplicate paralog protein class preserved by duplication-degeneration-complementation (DDC) in which complementary degenerative mutations partition ancestral subfunctions, expression subpatterns, or modular interaction specificities between the two sister copies so that both paralogs are required to fulfill the ancestral functional repertoire.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: EVOLUTION
trait_category: EVO_CONSERVATION
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:EVO_CONSERVED
synonyms:
  - synonym_text: "DDC subfunctionalized paralog"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "subfunctionalized gene duplicate"
    synonym_type: EXACT_SYNONYM
evolutionary_scope:
  definition_method: "PAML codeml / HyPhy duplicate-paralog branch-site codon substitution and complementary subfunction partitioning analysis"
  conservation_metric: "dN/dS and complementary subfunction retention across duplicate paralogs"
  orthology_basis: "reconciled gene-duplication trees (OrthoFinder / TreeBeST / Ensembl Compara)"
detection_methods:
  - name: "PAML codeml / HyPhy codon maximum-likelihood dN/dS (omega) selection test"
    method_type: HOMOLOGY_TRANSFER
    edam_operation: EDAM:operation_0554
    tool: "biotools:paml"
    evidence_code: ECO:0007669
    reference: PMID:17483113
    recipe: "codeml codeml.ctl"
evidence:
  - reference: PMID:10101175
    notes: "Force et al. (1999) Genetics 151:1531-1545 formulate the duplication-degeneration-complementation (DDC) model in which complementary degenerative mutations partition ancestral subfunctions across duplicate paralogs."
