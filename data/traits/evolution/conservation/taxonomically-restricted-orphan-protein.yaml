identifier: proteintraitsmech:EVO_TAXONOMICALLY_RESTRICTED_ORPHAN
label: "taxonomically restricted orphan protein"
definition: >-
  An evolutionary protein conservation trait in which a protein-coding family lacks detectable sequence or structural homology outside a single species or narrow taxonomic lineage (orphan / taxonomically restricted gene, TRG), arising through de novo gene birth from non-coding sequence or rapid sequence divergence beyond recognition and often mediating lineage-specific ecological adaptations.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: EVOLUTION
trait_category: EVO_CONSERVATION
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:EVO_CLADE_SPECIFIC
synonyms:
  - synonym_text: "ORFan protein"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "taxonomically restricted gene product"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "lineage-specific orphan protein"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "All-versus-all sequence similarity and phylostratigraphic BLAST/DIAMOND screening for lineage-restricted orphan proteins"
    method_type: HOMOLOGY_TRANSFER
    edam_operation: EDAM:operation_0292
    tool: "biotools:diamond"
    evidence_code: ECO:0000247
    reference: PMID:19716618
    recipe: "diamond blastp --query {input} --db nr.dmnd --out {output} --evalue 1e-3 --outfmt 6"
evidence:
  - reference: PMID:19716618
    notes: "Taxonomically restricted orphan genes (TRGs) lack detectable sequence homology outside a narrow clade and contribute to lineage-specific morphological and ecological adaptations."
