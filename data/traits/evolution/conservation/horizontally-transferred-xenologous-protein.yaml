identifier: proteintraitsmech:EVO_HORIZONTALLY_TRANSFERRED_XENOLOG
label: "horizontally transferred xenologous protein"
definition: >-
  An evolutionary protein conservation and phyletic-distribution trait in which a protein family exhibits a discordant phylogenetic tree topology or patchy taxonomic distribution across distantly related lineages due to horizontal (lateral) gene transfer (HGT), including acquisition of novel genes, paralog acquisition, or xenologous gene displacement of an ancestral ortholog.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: EVOLUTION
trait_category: EVO_CONSERVATION
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:EVO_CLADE_SPECIFIC
synonyms:
  - synonym_text: "laterally transferred protein"
    synonym_type: EXACT_SYNONYM
  - synonym_text: xenolog
    synonym_type: EXACT_SYNONYM
  - synonym_text: "HGT-acquired protein family"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "Maximum-likelihood gene-tree versus species-tree phylogenetic incongruence inference with IQ-TREE"
    method_type: HOMOLOGY_TRANSFER
    edam_operation: EDAM:operation_0324
    tool: "biotools:iq-tree"
    evidence_code: ECO:0000247
    reference: PMID:11544372
    recipe: "iqtree2 -s {input} -m MFP -B 1000 --prefix {output}"
evidence:
  - reference: PMID:11544372
    notes: "Horizontal gene transfer in prokaryotes introduces xenologous proteins via acquisition of novel genes, paralog acquisition, or xenologous gene displacement across lineages."
