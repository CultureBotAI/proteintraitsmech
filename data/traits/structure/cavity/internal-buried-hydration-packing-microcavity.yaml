    description: "A folded polypeptide_domain (SO:0000417) encloses internal microcavities whose lining-residue hydrophobicity (PATO:0001884) determines empty versus water-solvated cavity packing during protein folding (GO:0006457), which is causally upstream of regulation of protein stability (GO:0031647)."
