identifier: proteintraitsmech:CAVITY_BURIED_HYDRATION_MICROCAVITY
label: "internal buried hydration/packing microcavity"
definition: >-
  An enclosed internal structural void or microcavity buried within the tertiary core of a globular protein without direct bulk-solvent tunnel access, occurring either as an apolar empty packing defect or as a partially polar microcavity occupied by ordered structural water molecules that modulate core packing density, compressibility, and conformational stability.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_CAVITY
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:CAVITY
synonyms:
  - synonym_text: "buried internal protein void"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "internal hydration microcavity"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "enclosed core packing cavity"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "fpocket Voronoi alpha-sphere detection of buried internal protein cavities"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0250
    tool: "biotools:fpocket"
    evidence_code: ECO:0000255
    reference: PMID:8073031
    recipe: "fpocket -f {input} -o {output}"
