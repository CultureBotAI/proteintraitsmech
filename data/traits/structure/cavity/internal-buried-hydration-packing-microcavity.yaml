            notes: "Residues enclosing internal microcavities maintain normal rigid packing stability. (ECO:0000269)"
evidence:
  - reference: PMID:8073031
    notes: "Internal cavities in globular proteins reside within the tertiary core as empty hydrophobic voids or polar water-solvated microcavities that modulate packing density and stability."
