discussions:
- discussion_id: STRUCTURE_20261028_CAVITY_SELECTIVITY_FILTER_PORE_DETECTION
  prompt: Pore geometry does not identify the permeating ion or establish selectivity. Require ion-specific
    functional evidence and an explicitly scoped structural model. The KcsA length, carbonyl arrangement
    and K/Na discrimination in PMID9525859 are an example, not a universal Na/Ca-channel architecture.
    CAVER input/configuration requirements are as documented in its manual.
