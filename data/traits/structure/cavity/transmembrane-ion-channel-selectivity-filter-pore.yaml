identifier: proteintraitsmech:CAVITY_SELECTIVITY_FILTER_PORE
label: "transmembrane ion-channel selectivity-filter pore"
definition: >-
  A transmembrane ion-conduction passage containing a localized structural region that
  discriminates among permeating ion species.
definition_source: PMID:9525859
trait_axis: STRUCTURE
trait_category: STRUCT_CAVITY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- proteintraitsmech:TUNNEL
synonyms:
  - synonym_text: "ion channel selectivity filter pore"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "transmembrane conduction pore with selectivity filter"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "selectivity filter and central cavity"
    synonym_type: RELATED_SYNONYM

detection_methods:
- name: CAVER 3.0 candidate transport-path geometry from a configured starting point
  method_type: STRUCTURAL_ALGORITHM
  tool: biotools:caver
  reference: PMID:23093919
  recipe: java -Xmx4g -cp ./lib -jar ./caver.jar -home . -pdb {input} -conf config.txt -out {output}
  edam_operation: EDAM:operation_2406
  evidence_code: ECO:0007669
causal_graphs:
- graph_id: CG_CAVITY_SELECTIVITY_FILTER_PORE
  title: 'KcsA: selectivity-filter geometry supports selective potassium conduction'
  description: Specific structural mechanism proposed for Streptomyces lividans KcsA in Doyle et al.
    (1998), PMID:9525859. Carbonyl geometry supports K+ coordination and discrimination against Na+.
    The source also proposes a multi-ion repulsion mechanism. These assertions do not describe every
    ion-channel selectivity filter.
  nodes:
  - node_id: kcsa_selectivity_filter
    label: KcsA selectivity filter
    node_type: MOTIF
    description: Selectivity-filter region in the KcsA structure studied by Doyle et al. (1998); no
      residue bounds or independent polypeptide-domain identity asserted.
    local: true
  - node_id: GO:0046872
    label: metal ion binding
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0046872
    description: K+ coordination by backbone carbonyls in the studied KcsA selectivity filter.
  - node_id: GO:0005216
    label: monoatomic ion channel activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0005216
    description: Selective potassium-channel function interpreted for the studied KcsA pore.
  edges:
  - subject: kcsa_selectivity_filter
    predicate: enables
    predicate_id: RO:0002327
    object: GO:0046872
    description: KcsA filter carbonyl geometry coordinates K+ while discriminating against smaller Na+.
    evidence:
    - reference: PMID:9525859
      snippet: coordinate K+ ions but not smaller Na+ ions
      notes: Structural interpretation of the studied KcsA filter, not every channel. (ECO:0000269)
  - subject: GO:0046872
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: GO:0005216
    description: In the source structural interpretation, selective K+ coordination contributes to KcsA
      potassium-channel selectivity.
    evidence:
    - reference: PMID:9525859
      snippet: selective K+ conduction
      notes: Source abstract; mechanistic interpretation from KcsA structure. (ECO:0000305)
evidence:
- reference: PMID:9525859
  notes: The KcsA potassium channel pore comprises a wide water-filled central cavity and a narrow 12-angstrom
    selectivity filter lined by main-chain carbonyl oxygens that coordinate dehydrated K+ ions for selective
    conduction.
- reference: PMID:23953065
  notes: Connected passages and surface-to-surface pores are distinguished from enclosed voids; terminology
    varies across methods.
