identifier: proteintraitsmech:CAVITY_SELECTIVITY_FILTER_PORE
label: "transmembrane ion-channel selectivity-filter pore"
definition: >-
  A specialized transmembrane channel cavity architecture consisting of a wide, water-filled central vestibule coupled to a narrow (~12 A long) constricted selectivity filter lined by backbone carbonyl oxygens or side-chain coordination rings that mimic the hydration shell of a specific permeant ion (such as K+, Na+, or Ca2+), enabling rapid, near-diffusion-limited conduction with high ionic selectivity.
