discussions:
- discussion_id: STRUCTURE_20261028_CAVITY_SUBSTRATE_ACCESS_TUNNEL_DETECTION
  prompt: A computed route becomes an access tunnel only with evidence connecting it to substrate/product
    transport. CAVER {input} is a PDB-file directory; config.txt requires a starting point and stated
    probe/shell/clustering parameters. Dynamics, gating and ligand chemistry can invalidate a path suggested
    by one static model.
