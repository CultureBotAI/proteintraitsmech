identifier: proteintraitsmech:CAVITY_SUBSTRATE_ACCESS_TUNNEL
label: "buried active-site substrate/product access tunnel"
definition: >-
  An internal structural tunnel connecting a deeply buried enzyme catalytic cavity to the bulk exterior solvent, characterized by a bottleneck radius, length, curvature, and gating residue lining that control substrate ingress, water/cosubstrate access, reaction-intermediate shielding, and product egress.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
