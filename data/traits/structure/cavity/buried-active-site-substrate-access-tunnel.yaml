identifier: proteintraitsmech:CAVITY_SUBSTRATE_ACCESS_TUNNEL
label: "buried active-site substrate/product access tunnel"
definition: >-
  A passage connecting a buried enzyme active-site region to exterior solvent that serves as a
  route for substrate entry or product release.
definition_source: PMID:23093919
trait_axis: STRUCTURE
trait_category: STRUCT_CAVITY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- proteintraitsmech:TUNNEL
synonyms:
  - synonym_text: "enzyme active-site access tunnel"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "substrate ingress / product egress tunnel"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "gated catalytic access channel"
    synonym_type: RELATED_SYNONYM

detection_methods:
- name: CAVER 3.0 candidate transport-path geometry from a configured starting point
  method_type: STRUCTURAL_ALGORITHM
  tool: biotools:caver
  reference: PMID:23093919
  recipe: java -Xmx4g -cp ./lib -jar ./caver.jar -home . -pdb {input} -conf config.txt -out {output}
  edam_operation: EDAM:operation_2406
  evidence_code: ECO:0007669

evidence:
- reference: PMID:23093919
  notes: CAVER computes candidate pathways between internal regions and exterior solvent. The method
    paper discusses their potential roles in molecular transport; geometry alone does not establish
    substrate identity, flux or catalytic effects.
- reference: PMID:23953065
  notes: Connected passages and surface-to-surface pores are distinguished from enclosed voids; terminology
    varies across methods.
