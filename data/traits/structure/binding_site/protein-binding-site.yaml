identifier: proteintraitsmech:PROTEIN_BINDING_SITE
label: protein binding site
definition: >-
  A contiguous or discontinuous structural patch of amino acid residues on a protein surface or domain that interacts selectively and non-covalently with a polypeptide or protein partner via shape complementarity, hydrogen bonds, salt bridges, and buried hydrophobic contacts to mediate protein-protein recognition and complex assembly.
definition_source: https://linkml.io/valuesets/elements/LocalStructuralFeature/
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: SEEDED
