identifier: proteintraitsmech:BIOLIP_8K8
label: "8K8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-butyl-3-(3-oxidanylpropyl)-8-[(1~{R},5~{S})-3-tricyclo[3.3.1.0^{3,7}]nonanyl]-7~{H}-purine-2,6-dione (8K8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CIBIXJYFYPFMTN-FZUGUKJMSA-N.
