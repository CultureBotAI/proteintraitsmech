identifier: proteintraitsmech:BIOLIP_9ER
label: "9ER-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N1,N1-dimethyl-N2-[(pyridin-3-yl)methyl]-N2-{4-[2,4,6-tri(propan-2-yl)phenyl]-1,3-thiazol-2-yl}ethane-1,2-diamine (9ER) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VVBFISAUNSXQGZ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
