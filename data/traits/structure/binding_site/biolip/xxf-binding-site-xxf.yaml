identifier: proteintraitsmech:BIOLIP_XXF
label: "XXF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3P)-3-[6-chloro-4-(9-methyl-1-oxa-4,9-diazaspiro[5.5]undecan-4-yl)-7H-pyrrolo[2,3-d]pyrimidin-5-yl]benzonitrile (XXF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZNRKSAWCBMXCBN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
