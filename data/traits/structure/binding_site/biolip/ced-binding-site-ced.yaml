identifier: proteintraitsmech:BIOLIP_CED
label: "CED-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-METHYL-2-[2-OXO-1-(2-THIOPHEN-2-YL-ACETYLAMINO)-ETHYL]-3,6-DIHYDRO-2H-[1,3]THIAZINE-4-CARBOXYLIC ACID (CED) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SFVACKBZMIZHCK-ZWNOBZJWSA-N.
