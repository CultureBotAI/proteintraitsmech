identifier: proteintraitsmech:BIOLIP_5RC
label: "5RC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[(1~{R},6~{R})-6-azanyl-2,2-bis(fluoranyl)cyclohexyl]-5-ethyl-4-[6-(trifluoromethyl)pyrazolo[1,5-a]pyrimidin-3-yl]thiophene-2-carboxamide (5RC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QXXZIVGTJXYLQO-CZUORRHYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
