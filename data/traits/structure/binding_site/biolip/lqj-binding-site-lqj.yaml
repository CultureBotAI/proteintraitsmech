identifier: proteintraitsmech:BIOLIP_LQJ
label: "LQJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3'-O-[(R)-{[(2S,3aS,4S,6S,6aS)-6-(6-amino-9H-purin-9-yl)-2-hydroxy-2-oxotetrahydro-2H-2lambda~5~-furo[3,4-d][1,3,2]dioxaphosphol-4-yl]methoxy}(hydroxy)phosphoryl]adenosine (LQJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ZKDCIJKZCQKMKS-RJLGOGMOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
