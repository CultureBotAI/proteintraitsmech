identifier: proteintraitsmech:BIOLIP_3DJ
label: "3DJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-amino-4-(2-amino-3-hydroxyphenyl)-4-oxobutanoic acid (3DJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VCKPUUFAIGNJHC-LURJTMIESA-N.
