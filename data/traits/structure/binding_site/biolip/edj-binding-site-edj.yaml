identifier: proteintraitsmech:BIOLIP_EDJ
label: "EDJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-({5-bromo-2-[(3,4,5-trimethoxyphenyl)amino]pyrimidin-4-yl}oxy)-N-methylbenzene-1-carboximidic acid (EDJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NEXGBSJERNQRSV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
