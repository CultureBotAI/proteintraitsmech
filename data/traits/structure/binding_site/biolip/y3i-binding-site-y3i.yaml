identifier: proteintraitsmech:BIOLIP_Y3I
label: "Y3I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3P)-3-{4-[(3R,5S)-3-amino-5-methylpiperidin-1-yl]-6-chloro-7H-pyrrolo[2,3-d]pyrimidin-5-yl}benzonitrile (Y3I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BSBZFPBEYMSVPJ-SMDDNHRTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
