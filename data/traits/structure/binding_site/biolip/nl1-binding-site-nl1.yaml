identifier: proteintraitsmech:BIOLIP_NL1
label: "NL1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[2-oxidanylidene-2-(piperidin-4-ylamino)ethyl]pyrrolo[2,3-b]pyridine-5-carboxamide (NL1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HSAVAVFDIYQNAY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
