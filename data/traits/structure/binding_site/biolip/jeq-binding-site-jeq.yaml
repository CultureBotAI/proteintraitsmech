identifier: proteintraitsmech:BIOLIP_JEQ
label: "JEQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-azanyl-3-[1-[[(3~{R})-1-(phenylmethyl)piperidin-3-yl]methyl]indol-6-yl]-1~{H}-pyrazole-4-carbonitrile (JEQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RLAAKYCZJLWQDL-LJQANCHMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
