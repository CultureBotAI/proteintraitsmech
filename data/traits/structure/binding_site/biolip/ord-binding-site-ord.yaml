identifier: proteintraitsmech:BIOLIP_ORD
label: "ORD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-ORNITHINE (ORD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey AHLPHDHHMVZTML-SCSAIBSYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
