identifier: proteintraitsmech:BIOLIP_HT1
label: "HT1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2'-(4-ETHOXYPHENYL)-5-(4-METHYL-1-PIPERAZINYL)-2,5'-BI-BENZIMIDAZOLE (HT1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PRDFBSVERLRRMY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
