identifier: proteintraitsmech:BIOLIP_51K
label: "51K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(2-{3-[3,5-bis(trifluoromethyl)phenyl]-1H-1,2,4-triazol-1-yl}ethyl)-1,3,4-oxadiazole (51K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CSKHNYIZBSBQMW-UHFFFAOYSA-N.
