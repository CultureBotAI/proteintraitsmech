identifier: proteintraitsmech:BIOLIP_IAR
label: "IAR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2E)-5-[(diaminomethylidene)amino]-2-iminopentanoic acid (IAR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YWGYOCPWFDUKSA-QPJJXVBHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:IAR
synonyms:
  - synonym_text: "(2E)-5-[(diaminomethylidene)amino]-2-iminopentanoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9HXE3
    protein_label: "3NYC chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3nyc chain A (resolution 1.06 Å); binding residues: Y1053 E1087 R1222 M1240 E1246 Y1249 R1305 G1332"
    source: CURATOR
