identifier: proteintraitsmech:BIOLIP_1QA
label: "1QA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-({[2-(5-cyano-3-hydroxypyridin-2-yl)-1,3-thiazol-4-yl]acetyl}amino)(phenyl)ethanoic acid (1QA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KPGRSPXHOOAVBE-INIZCTEOSA-N.
