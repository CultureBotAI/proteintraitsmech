identifier: proteintraitsmech:BIOLIP_H6U
label: "H6U-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(2-azanyl-1,3-thiazol-4-yl)-N-[4-[2-[[(2R)-2-oxidanyl-2-phenyl-ethyl]amino]ethyl]phenyl]ethanamide (H6U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PBAPPPCECJKMCM-IBGZPJMESA-N.
