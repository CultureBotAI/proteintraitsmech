identifier: proteintraitsmech:BIOLIP_WPI
label: "WPI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,4-bis[(4E)-5-(3,4,5-trimethoxyphenyl)pent-4-en-1-yl]-1,4-diazepane (WPI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey JXXCDAKRSXICGM-AOEKMSOUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:WPI
synonyms:
  - synonym_text: "1,4-bis[(4E)-5-(3,4,5-trimethoxyphenyl)pent-4-en-1-yl]-1,4-diazepane-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P30657
    protein_label: "4EU2 chain N (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4eu2 chain N (resolution 2.509 Å); binding residues: T-2 Y22"
    source: CURATOR
  - protein_id: UniProtKB:P22141
    protein_label: "4EU2 chain Y (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4eu2 chain Y (resolution 2.509 Å); binding residues: E48 Q98"
    source: CURATOR
