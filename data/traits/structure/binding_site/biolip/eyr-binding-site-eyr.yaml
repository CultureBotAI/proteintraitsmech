  A structure-derived ligand-binding site at which the ligand (6~{E},10~{E},14~{E},18~{E},22~{E},26~{E},30~{R})-2,6,10,14,18,22,26,30-octamethyldotriaconta-2,6,10,14,18,22,26-heptaene (EYR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NNAMSNGZQLVMQY-GAPQENEMSA-N.
