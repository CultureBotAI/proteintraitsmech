identifier: proteintraitsmech:BIOLIP_1LG
label: "1LG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,4-DICHLORO-N-(3-CYANO-4,5,6,7-TETRAHYDRO-BENZOTHIOPHEN-2YL)-5-(MORPHOLINE-4-SULFONYL)-BENZAMIDE (1LG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JMCVGASJAJMFPN-UHFFFAOYSA-N.
