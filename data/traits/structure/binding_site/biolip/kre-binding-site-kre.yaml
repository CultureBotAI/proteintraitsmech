identifier: proteintraitsmech:BIOLIP_KRE
label: "KRE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[3-[2-azanyl-5-(4-piperazin-1-ylphenyl)pyridin-3-yl]-5-methoxy-phenyl]methanesulfonamide (KRE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WTNLXMJMLHJDKF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
