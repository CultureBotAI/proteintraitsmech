    protein_label: "6S1F chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6s1f chain A (resolution 3.11 Å); binding residues: V32 A45 K47 T95 M98 L153 D164"
    source: CURATOR
