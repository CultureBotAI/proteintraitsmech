identifier: proteintraitsmech:BIOLIP_SV2
label: "SV2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [{2-[(guanine-9-yl)methyl]propane-1,3-diyl}bis(oxymethylene)]bis(phosphonic acid) (SV2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VGXYLSOVNUSSKA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:SV2
synonyms:
  - synonym_text: "[{2-[(guanine-9-yl)methyl]propane-1,3-diyl}bis(oxymethylene)]bis(phosphonic acid)-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q07010
    protein_label: "6APS chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6aps chain A (resolution 1.762 Å); binding residues: G55 D114 I115 D117 T118 A119 T121 K145 F166 V167 D173 R179"
    source: CURATOR
