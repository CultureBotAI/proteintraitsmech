identifier: proteintraitsmech:BIOLIP_5BX
label: "5BX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S)-5-[(1R)-1-(1H-indol-3-yl)ethyl]-2-(methylamino)-1,3-oxazol-4(5H)-one (5BX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GNTVWGDQPXCYBV-PELKAZGASA-N.
