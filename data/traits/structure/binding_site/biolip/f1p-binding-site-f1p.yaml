identifier: proteintraitsmech:BIOLIP_F1P
label: "F1P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-O-phosphono-beta-D-fructopyranose (F1P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey HXRNACQBNUPKDX-ARQDHWQXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
