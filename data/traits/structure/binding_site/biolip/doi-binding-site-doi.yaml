    protein_label: "2DGN chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2dgn chain A (resolution 2.4 Å); binding residues: G42 D43 K46 A69 G70 H71 T162 T163 N256 L260 V270 T271 V305"
    source: CURATOR
