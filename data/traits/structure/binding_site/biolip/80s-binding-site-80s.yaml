identifier: proteintraitsmech:BIOLIP_80S
label: "80S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[3,4-bis(chloranyl)-5-methyl-1H-pyrrol-2-yl]carbonylamino]-4-[(1S)-1-phenylethoxy]-1,3-benzothiazole-6-carboxylic acid (80S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LXTDDWSYQKHDKA-NSHDSACASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
