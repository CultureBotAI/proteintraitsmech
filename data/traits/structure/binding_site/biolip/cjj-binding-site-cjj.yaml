identifier: proteintraitsmech:BIOLIP_CJJ
label: "CJJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-{5-chloro-4-[(5-cyclopropyl-1H-pyrazol-3-yl)amino]pyrimidin-2-yl}thiophene-2-sulfonamide (CJJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KRMDPWLIHGQVGZ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
