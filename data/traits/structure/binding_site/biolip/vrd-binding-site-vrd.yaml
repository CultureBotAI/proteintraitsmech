    protein_label: "7LYE chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7lye chain A (resolution 1.758 Å); binding residues: L2 G6 P17 Y21 N27 C28 G29 C44 H47 K48 Y51 K60"
    source: CURATOR
