identifier: proteintraitsmech:BIOLIP_76R
label: "76R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [3,3',3'',3'''-(3,8,13,17-tetramethylporphyrin-2,7,12,18-tetrayl-kappa~4~N~21~,N~22~,N~23~,N~24~)tetra(propanoato)(2-)]manganese (76R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OOLOFMBJOQKFOW-RGGAHWMASA-L.
