identifier: proteintraitsmech:BIOLIP_K0I
label: "K0I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[[2-pyridin-2-yl-6-(1,2,4,5-tetrahydro-3-benzazepin-3-yl)pyrimidin-4-yl]amino]propanoic acid (K0I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AVZCPICCWKMZDT-UHFFFAOYSA-N.
