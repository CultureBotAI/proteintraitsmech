identifier: proteintraitsmech:BIOLIP_ZOV
label: "ZOV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(1,3-benzothiazol-5-yl)-7-(1,3-dimethyl-1H-pyrazol-5-yl)thieno[3,2-c]pyridin-4-amine (ZOV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BPKSNNJTKPIZKR-UHFFFAOYSA-N.
