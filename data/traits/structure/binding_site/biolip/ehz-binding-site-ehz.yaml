identifier: proteintraitsmech:BIOLIP_EHZ
label: "EHZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{S}-[2-[3-[[(2~{R})-3,3-dimethyl-2-oxidanyl-4-phosphonooxy-butanoyl]amino]propanoylamino]ethyl] (3~{S})-3-oxidanyltetradecanethioate (EHZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 10 binding-site occurrences across 7 PDB structures; ligand InChIKey JYSKQPQRUCZFIQ-REWPJTCUSA-N.
