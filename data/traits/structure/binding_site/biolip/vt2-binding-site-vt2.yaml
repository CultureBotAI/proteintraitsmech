identifier: proteintraitsmech:BIOLIP_VT2
label: "VT2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (R)-4-((4-((6-(2-(2,4-difluorophenyl)-1,1-difluoro-2-hydroxy-3-(1H-tetrazol-1-yl)propyl)pyridin-3-yl)ethynyl)phenoxy)methyl)benzonitrile (VT2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CHNOUXLXTKTWQU-PMERELPUSA-N.
