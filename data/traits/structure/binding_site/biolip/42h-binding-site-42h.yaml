identifier: proteintraitsmech:BIOLIP_42H
label: "42H-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4R,7R,18Z)-4,7-dihydroxy-N,N,N-trimethyl-10-oxo-3,5,9-trioxa-4-phosphaheptacos-18-en-1-aminium 4-oxide (42H) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YAMUFBLWGFFICM-PTGWMXDISA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
