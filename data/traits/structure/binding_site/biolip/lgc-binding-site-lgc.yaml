identifier: proteintraitsmech:BIOLIP_LGC
label: "LGC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-glucono-1,5-lactone (LGC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey PHOQVHQSTUBQQK-SQOUGZDYSA-N.
