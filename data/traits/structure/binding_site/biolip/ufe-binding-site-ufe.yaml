identifier: proteintraitsmech:BIOLIP_UFE
label: "UFE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Fe(III) Uroporphyrin (UFE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UABKTZYUFZQVBH-RGGAHWMASA-L.
definition_source: "BioLiP2 (Yang/Zhang group)"
