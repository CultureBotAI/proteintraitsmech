label: "VDO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(1R,2R,3S,4S,5S)-2,3,4-TRIHYDROXY-5-{[(1S,4R,5S,6S)-4,5,6-TRIHYDROXY-3-(HYDROXYMETHYL)CYCLOHEX-2-EN-1-YL]AMINO}CYCLOHEXYL]METHYL DIHYDROGEN PHOSPHATE (VDO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZKSTYMJGEHZSFH-MBABXGOBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
