identifier: proteintraitsmech:BIOLIP_ISW
label: "ISW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {3,3'-[(9S)-8,13-diethenyl-3,7,12,17-tetramethyl-9,10-dihydroporphyrin-2,18-diyl-kappa~4~N~21~,N~22~,N~23~,N~24~]dipropanoato(2-)}iron (ISW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey QSWMAEGFLATCMU-JMAPEOGHSA-L.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ISW
synonyms:
