identifier: proteintraitsmech:BIOLIP_A1AIS
label: "A1AIS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(S)-hydroxy{[(1R,2R,3R,4R,5R,6S)-2,3,4,5,6-pentahydroxycyclohexyl]oxy}phosphoryl]oxy}propane-1,2-diyl dihexadecanoate (A1AIS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IBUKXRINTKQBRQ-ZKEAXKCJSA-N.
