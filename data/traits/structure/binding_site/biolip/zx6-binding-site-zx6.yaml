label: "ZX6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(1H-indol-3-yl)-N-{[(2R,3R,4R,5R,6S)-3,4,5-trihydroxy-6-methylpiperidin-2-yl]methyl}acetamide (ZX6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SIWZFSDAFLUSGA-CXQPTDBTSA-N.
