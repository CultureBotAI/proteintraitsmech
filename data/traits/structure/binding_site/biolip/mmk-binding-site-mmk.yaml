identifier: proteintraitsmech:BIOLIP_MMK
label: "MMK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{[(2-{[(E)-2-(dimethylamino)ethenyl](ethyl)amino}-2-oxoethyl)amino]methyl}pyridine-4-carboxylic acid (MMK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RTKGUAPXWDCFNW-BQYQJAHWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
