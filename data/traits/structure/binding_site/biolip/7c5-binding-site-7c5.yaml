identifier: proteintraitsmech:BIOLIP_7C5
label: "7C5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-(2-amino-4-oxo-1,4-dihydropteridine-6-carbonyl)adenosine (7C5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey INIBCQZJBGQGDM-NCEGKOTBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
