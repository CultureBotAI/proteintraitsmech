identifier: proteintraitsmech:BIOLIP_EOI
label: "EOI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [[(2R)-1-(6-aminopurin-9-yl)propan-2-yl]oxymethyl-sulfanyl-phosphoryl] phosphono hydrogen phosphate (EOI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BMDSOWJDBWVWQG-FMWWOLKHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EOI
synonyms:
  - synonym_text: "[[(2R)-1-(6-aminopurin-9-yl)propan-2-yl]oxymethyl-sulfanyl-phosphoryl] phosphono hydrogen phosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P22887
    protein_label: "4CP5 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4cp5 chain A (resolution 2.32 Å); binding residues: K16 H59 F64 L68 R92 T98 R109 V116 N119"
    source: CURATOR
