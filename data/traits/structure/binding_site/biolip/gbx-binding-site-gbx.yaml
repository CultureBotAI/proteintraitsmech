label: "GBX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-AMINO-4-[1-(CARBOXYMETHYL-CARBAMOYL)-2-(9-HYDROXY-7,8-DIOXO-7,8,9,10-TETRAHYDRO-BENZO[DEF]CHRYSEN-10-YLSULFANYL)-ETHYLCARBAMOYL]-BUTYRIC ACID (GBX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey DUWOHLGCRJLRRU-HVYZTVOGSA-N.
