definition: >-
  A structure-derived ligand-binding site at which the ligand 3-{(3M)-3-[6-amino-5-(trifluoromethoxy)pyridin-3-yl]-1-ethyl-7-oxo-1,7-dihydro-6H-pyrazolo[3,4-c]pyridin-6-yl}-1,5-anhydro-3,4-dideoxy-2-O-methyl-D-erythro-pentitol (A1AZ8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NPKZOAIFPSVVPH-HIFRSBDPSA-N.
