identifier: proteintraitsmech:BIOLIP_EGU
label: "EGU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-chloranyl-2-[[5-chloranyl-2-(5-methoxy-1,3-dihydroisoindol-2-yl)-1,3-thiazol-4-yl]carbonyl-methyl-amino]-5-fluoranyl-benzoic acid (EGU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LTJYYDAAQPZAGJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
