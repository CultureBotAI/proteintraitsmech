identifier: proteintraitsmech:BIOLIP_4DC
label: "4DC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-cyclopentyl-2-[4-(methylsulfonyl)phenyl]-N-(1,3-thiazol-2-yl)propanamide (4DC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NEQSWPCDHDQINX-MRXNPFEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
