    protein_label: "4H8V chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4h8v chain A (resolution 1.95 Å); binding residues: D61 Y64 H104 F164 D200 E254 F256 R284 R291 H326 D327 E386 R414"
    source: CURATOR
