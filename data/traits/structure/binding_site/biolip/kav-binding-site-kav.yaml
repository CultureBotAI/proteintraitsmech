identifier: proteintraitsmech:BIOLIP_KAV
label: "KAV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{6-[(1-methyl-2-{[4-(trifluoromethyl)phenyl]amino}-1H-benzimidazol-5-yl)oxy]pyrimidin-4-yl}cyclopropanecarboxamide (KAV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YGSUBARKRPZWKJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
