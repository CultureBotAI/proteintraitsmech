    protein_label: "3TBG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3tbg chain A (resolution 2.1 Å); binding residues: L110 F112 F120 L121 G212 L213 E216 Q244 F247 D301 S304 F483"
    source: CURATOR
