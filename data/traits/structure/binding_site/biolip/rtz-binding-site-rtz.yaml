identifier: proteintraitsmech:BIOLIP_RTZ
label: "RTZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 10-{2-[(2R)-1-methylpiperidin-2-yl]ethyl}-2-(methylsulfanyl)-10H-phenothiazine (RTZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey KLBQZWRITKRQQV-MRXNPFEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:RTZ
synonyms:
  - synonym_text: "10-{2-[(2R)-1-methylpiperidin-2-yl]ethyl}-2-(methylsulfanyl)-10H-phenothiazine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
