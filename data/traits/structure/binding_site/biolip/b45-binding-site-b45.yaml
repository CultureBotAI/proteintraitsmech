identifier: proteintraitsmech:BIOLIP_B45
label: "B45-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(2-chloro-4-fluorophenyl)-1-(2,6-dichlorophenyl)-7-[1-(1-methylethyl)piperidin-4-yl]-3,4-dihydroquinazolin-2(1H)-one (B45) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KXNNHYBPDFMKQK-UHFFFAOYSA-N.
