identifier: proteintraitsmech:BIOLIP_XGC
label: "XGC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(3M)-3-(6-methoxypyridin-3-yl)benzene-1-sulfonyl]-L-cysteinamide (XGC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LQDUHWTWGXAMOC-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
