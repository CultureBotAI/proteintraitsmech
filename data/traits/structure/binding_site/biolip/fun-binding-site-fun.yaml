identifier: proteintraitsmech:BIOLIP_FUN
label: "FUN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(AMINOSULFONYL)-4-CHLORO-2-[(2-FURYLMETHYL)AMINO]BENZOIC ACID (FUN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey ZZUFCTLCJUWOSV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
