identifier: proteintraitsmech:BIOLIP_J9P
label: "J9P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (11alpha,12alpha,13E,16S)-11,16-dihydroxy-16-methyl-9-oxoprost-13-en-1-oic acid (J9P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CNWGPXZGIIOYDL-AGRNYGATSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
