identifier: proteintraitsmech:BIOLIP_OT2
label: "OT2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-oxidanylidene-8-[2-(4-sulfonaphthalen-1-yl)hydrazinyl]-8~{H}-naphthalene-1,3-disulfonic acid (OT2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey DOHFSJYQGWYGDQ-FQEVSTJZSA-N.
