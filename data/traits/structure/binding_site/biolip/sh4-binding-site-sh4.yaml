identifier: proteintraitsmech:BIOLIP_SH4
label: "SH4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R)-1-PHENYLETHYL 4-(ACETYLAMINO)BENZYLPHOSPHONATE (SH4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey YPTMOJMDCPUCJT-ZDUSSCGKSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
