    protein_label: "1UM4 chain H (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1um4 chain H (resolution 1.8 Å); binding residues: L34 Q36 S100 S101 M102 P105 G106 W109"
    source: CURATOR
