identifier: proteintraitsmech:BIOLIP_A1V
label: "A1V-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2'-(6-(2'-(aminomethyl)-[2,4'-bithiazol]-4-yl)pyridine-2,5-diyl)bis(thiazole-4-carboxylic acid) (A1V) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YMFHXIFIYXCKLO-UHFFFAOYSA-N.
