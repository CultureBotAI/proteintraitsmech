identifier: proteintraitsmech:BIOLIP_0OU
label: "0OU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-({3-[(3,5-dichlorobenzyl)amino]propyl}amino)quinolin-4(1H)-one (0OU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DOYVWGPTNKAQGR-UHFFFAOYSA-N.
