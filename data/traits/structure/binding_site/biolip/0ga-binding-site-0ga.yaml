identifier: proteintraitsmech:BIOLIP_0GA
label: "0GA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-{[(1Z)-1-carboxyprop-1-en-1-yl]oxy}-2-hydroxybenzoic acid (0GA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey MPHSNGOSXHODDD-UQCOIBPSSA-N.
