identifier: proteintraitsmech:BIOLIP_QEI
label: "QEI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-amino-5-({[(1S,4S,5R)-4,5-dihydroxycyclopent-2-en-1-yl]amino}methyl)-3,7-dihydro-4H-pyrrolo[2,3-d]pyrimidin-4-one (QEI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WYROLENTHWJFLR-ACLDMZEESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:QEI
synonyms:
