    protein_label: "8DL3 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8dl3 chain B (resolution 2.26 Å); binding residues: W49 H53 N75 Y99 W100 I211 F237 D239 D314 Y315 W318 D319"
    source: CURATOR
