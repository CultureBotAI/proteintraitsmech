identifier: proteintraitsmech:BIOLIP_JL3
label: "JL3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-3-[2-azanylethoxy(oxidanyl)phosphoryl]oxy-2-pentadecanoyloxy-propyl] pentadecanoate (JL3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey SKVKIGSFTGVBOX-MGBGTMOVSA-N.
