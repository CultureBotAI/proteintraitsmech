identifier: proteintraitsmech:BIOLIP_FO9
label: "FO9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand famotidine (FO9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YFGRAZUYIUBWJO-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:FO9
synonyms:
  - synonym_text: "famotidine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P25021
    protein_label: "7UL3 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7ul3 chain A (resolution 3.0 Å); binding residues: D98 K175 V176 D186 T190 Y250 L274"
    source: CURATOR
