identifier: proteintraitsmech:BIOLIP_HXV
label: "HXV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-ethyl-5-(4-{2-[2-(1H-tetrazol-5-yl)ethyl]phenoxy}butoxy)pyrimidine-2,4-diamine (HXV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OUJSJGDTRMGLDA-UHFFFAOYSA-N.
