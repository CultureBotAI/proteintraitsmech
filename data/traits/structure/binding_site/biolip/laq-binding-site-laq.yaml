identifier: proteintraitsmech:BIOLIP_LAQ
label: "LAQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(R)-({5-[(3R)-1,2-DITHIOLAN-3-YL]PENTANOYL}OXY)(HYDROXY)PHOSPHORYL]ADENOSINE (LAQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey QWEGOCJRZOKSOE-ADUAKINBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
