definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S})-~{N}-[1-(aminomethyl)cyclopropyl]-19-chloranyl-5-oxidanylidene-9-(trifluoromethyl)-12,17-dioxa-4-azatricyclo[16.2.2.0^{6,11}]docosa-1(20),6(11),7,9,18,21-hexaene-3-carboxamide (C2K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BNWIQPLOOOQIPB-IBGZPJMESA-N.
