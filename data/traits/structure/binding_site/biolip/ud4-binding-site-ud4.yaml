identifier: proteintraitsmech:BIOLIP_UD4
label: "UD4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand UDP-2-acetamido-4-amino-2,4,6-trideoxy-alpha-D-glucopyranose (UD4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FUUMLYWEEZBCQR-UINYWEPJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
