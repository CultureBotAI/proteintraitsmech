identifier: proteintraitsmech:BIOLIP_LUX
label: "LUX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R,3'R,6'S,9R,9'R,13R,13'S)-4',5'-DIDEHYDRO-5',6',7',8',9,9',10,10',11,11',12,12',13,13',14,14',15,15'-OCTADECAHYDRO-BETA,BETA-CAROTENE-3,3'-DIOL (LUX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey OXVWOOPFXSSEKV-SQYYBNMASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
