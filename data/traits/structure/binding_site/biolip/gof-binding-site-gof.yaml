identifier: proteintraitsmech:BIOLIP_GOF
label: "GOF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[2-(4-methoxyphenyl)-5,5-bis(oxidanylidene)-4,6-dihydrothieno[3,4-c]pyrazol-3-yl]-4-(phenylcarbonyl)benzamide (GOF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FETYBXQBGAFWOV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
