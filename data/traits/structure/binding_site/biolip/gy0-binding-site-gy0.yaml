identifier: proteintraitsmech:BIOLIP_GY0
label: "GY0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 3-[(E,3R,9R)-3,9-bis(oxidanyl)dec-4-enoyl]sulfanylpropanoate (GY0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ALEAPVQZLMYNNX-BAEOLTKYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
