    protein_label: "6QZH chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6qzh chain A (resolution 2.1 Å); binding residues: V79 T82 F86 T91 T93 D94 L97 R154 I262 Y326 V331 K332 F333"
    source: CURATOR
