identifier: proteintraitsmech:BIOLIP_JLW
label: "JLW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[[4-[[(1~{R})-2,2-dimethyl-1-(5-methylfuran-2-yl)propyl]amino]-1,1-bis(oxidanylidene)-1,2,5-thiadiazol-3-yl]amino]-~{N},~{N},6-trimethyl-2-oxidanyl-benzamide (JLW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MAYXLCLBDVEYAL-SFHVURJKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
