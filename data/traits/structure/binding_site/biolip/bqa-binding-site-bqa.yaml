identifier: proteintraitsmech:BIOLIP_BQA
label: "BQA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[4-(4-bromophenyl)-1-{[2-(trifluoromethyl)phenyl]methyl}piperidine-4-carbonyl]-3-cyclopropyl-L-alanine (BQA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XTCYTRMSAWHHGP-QFIPXVFZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
