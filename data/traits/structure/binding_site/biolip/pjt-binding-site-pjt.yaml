identifier: proteintraitsmech:BIOLIP_PJT
label: "PJT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (9~{S})-5-methyl-12-(4-morpholin-4-ylphenyl)-9-oxidanyl-4-thia-2,12-diazatricyclo[7.3.0.0^{3,7}]dodeca-1,3(7),5-trien-8-one (PJT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KUIAFBSRBMWQQP-HXUWFJFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
