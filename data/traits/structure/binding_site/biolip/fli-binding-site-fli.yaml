    protein_label: "3ABA chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3aba chain A (resolution 1.8 Å); binding residues: Q80 P82 L88 W89 M172 M173 G186 L189 N229 I236 A237 G288 V388 F389"
    source: CURATOR
