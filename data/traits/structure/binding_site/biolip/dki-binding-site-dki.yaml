identifier: proteintraitsmech:BIOLIP_DKI
label: "DKI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-AMINO-3-{[4-(AMINOSULFONYL)PHENYL]AMINO}-N-(2,6-DIFLUOROPHENYL)-1H-1,2,4-TRIAZOLE-1-CARBOTHIOAMIDE (DKI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey ARIOBGGRZJITQX-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
