identifier: proteintraitsmech:BIOLIP_NZM
label: "NZM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand cefixime, bound form (NZM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LIFBJXSMIMSLKH-VSOMHRBSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NZM
synonyms:
  - synonym_text: "cefixime, bound form-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P08149
    protein_label: "6P55 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6p55 chain B (resolution 1.74 Å); binding residues: S310 T347 S362 N364 F420 G421 Y422 T498 T500 A501 R502 H514"
    source: CURATOR
