identifier: proteintraitsmech:BIOLIP_NFU
label: "NFU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand formyl[bis(hydrocyanato-1kappaC)]ironnickel(Fe-Ni) (NFU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey QCZROEOIPZWDEO-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
