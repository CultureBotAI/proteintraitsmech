identifier: proteintraitsmech:BIOLIP_UYI
label: "UYI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-azanyl-N-[(2R)-1-[(3R)-3-[dimethylamino(methyl)carbamoyl]-3-(phenylmethyl)piperidin-1-yl]-3-(1H-indol-3-yl)-1-oxidanylidene-propan-2-yl]-2-methyl-propanamide (UYI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VQPFSIRUEPQQPP-MXBOTTGLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
