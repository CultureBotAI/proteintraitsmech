identifier: proteintraitsmech:BIOLIP_FHJ
label: "FHJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand dimethyl (1S,2S,3R,4R)-1-[(1S)-2-(4-methylphenyl)-1-(phenylamino)ethyl]-7-oxabicyclo[2.2.1]hept-5-ene-2,3-dicarboxylate (FHJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AOCBOTNEIQNHIY-OAKYZLIPSA-N.
