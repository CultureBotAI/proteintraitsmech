identifier: proteintraitsmech:BIOLIP_FYJ
label: "FYJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand phenyl 1-thio-beta-D-glucopyranosiduronic acid (FYJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XXJOOMMTHULGSD-LIJGXYGRSA-N.
