identifier: proteintraitsmech:BIOLIP_F3Q
label: "F3Q-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-(4-hydroxyphenyl)-3-[6-[[(3~{S})-3-(morpholin-4-ylmethyl)-3,4-dihydro-1~{H}-isoquinolin-2-yl]carbonyl]-1,3-benzodioxol-5-yl]-~{N}-phenyl-5,6,7,8-tetrahydroindolizine-1-carboxamide (F3Q) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VYXJULKGMXJVGI-XIFFEERXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
