identifier: proteintraitsmech:BIOLIP_1KQ
label: "1KQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(2-methylimidazo[2,1-b][1,3]thiazol-6-yl)-1-[2-[(1R)-5-(6-methylpyrimidin-4-yl)-2,3-dihydro-1H-inden-1-yl]-2,7-diazaspiro[3.5]nonan-7-yl]ethanone (1KQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZIUDADZJCKGWKR-AREMUKBSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
