identifier: proteintraitsmech:BIOLIP_FK4
label: "FK4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-[2-({N-[(2R)-2-hydroxy-4-{[(R)-hydroxy(oxo)-lambda~5~-phosphanyl]oxy}-3,3-dimethylbutanoyl]-beta-alanyl}amino)ethyl] 1H-pyrrole-2-carbothioate (FK4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IYPOXHCBZKSEJQ-ZDUSSCGKSA-N.
