identifier: proteintraitsmech:BIOLIP_10K
label: "10K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(3-cyclopropyl-1H-pyrazol-5-yl)-2-[4-(thiophen-2-yl)phenyl]acetamide (10K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LQBKAYJFACGUCC-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
