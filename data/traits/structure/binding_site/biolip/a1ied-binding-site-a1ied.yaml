identifier: proteintraitsmech:BIOLIP_A1IED
label: "A1IED-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[5-[6-(4-oxidanylcyclohexyl)oxy-1~{H}-pyrrolo[2,3-b]pyridin-5-yl]-1,2-oxazol-3-yl]pyridine-2-carboxamide (A1IED) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HLYKWNVFHAYDMI-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
