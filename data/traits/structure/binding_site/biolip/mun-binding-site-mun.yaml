identifier: proteintraitsmech:BIOLIP_MUN
label: "MUN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S})-2,3-bis(oxidanyl)propyl] (~{E})-undec-2-enoate (MUN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 1 PDB structure; ligand InChIKey INMIULFREHIAOX-LXKVQUBZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
