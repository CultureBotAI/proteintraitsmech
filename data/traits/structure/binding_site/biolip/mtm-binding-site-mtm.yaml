identifier: proteintraitsmech:BIOLIP_MTM
label: "MTM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,4R)-2-(4-AMINO-5H-PYRROLO[3,2-D]PYRIMIDIN-7-YL)-5-[(METHYLSULFANYL)METHYL]PYRROLIDINE-3,4-DIOL (MTM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey YLCQGEBEQIBOOJ-BOFBLULFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
