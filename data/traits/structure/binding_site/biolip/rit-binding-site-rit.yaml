    protein_label: "4EYR chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4eyr chain A (resolution 1.8 Å); binding residues: L23 N25 G27 A28 D29 D30 T82"
    source: CURATOR
