label: "A1AGG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2S)-1-hydroxy-2-{[N-({[(2S)-5-oxo-1-(2-phenylethyl)pyrrolidin-2-yl]methoxy}carbonyl)-L-leucyl]amino}-3-[(3S)-2-oxopyrrolidin-3-yl]propane-1-sulfonic acid (A1AGG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FDODUQVFBIGMCE-KAWFJRQCSA-N.
