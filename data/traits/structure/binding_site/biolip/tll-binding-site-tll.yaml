    protein_label: "4U03 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4u03 chain A (resolution 2.041 Å); binding residues: R40 R108 F109 W110 T111 Q116 Y137 F204 Y238 L240 D260 K262"
    source: CURATOR
