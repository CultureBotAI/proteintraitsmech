identifier: proteintraitsmech:BIOLIP_HJA
label: "HJA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-3-amino-2-{[(4-cyclohexylbutoxy)carbonyl]amino}propanethioic S-acid (HJA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey PRQLPRBNQTXHJV-LBPRGKRZSA-N.
