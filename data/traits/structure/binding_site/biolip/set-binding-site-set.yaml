synonyms:
  - synonym_text: "AMINOSERINE-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A0A7R6WUD2
    protein_label: "8UPI chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8upi chain A (resolution 1.55 Å); binding residues: Y32 W34 W410 I411 D413"
    source: CURATOR
