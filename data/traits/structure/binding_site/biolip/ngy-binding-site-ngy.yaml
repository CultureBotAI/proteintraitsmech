identifier: proteintraitsmech:BIOLIP_NGY
label: "NGY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-acetamido-2-deoxy-6-O-sulfo-alpha-D-glucopyranose (NGY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey WJFVEEAIYIOATH-PVFLNQBWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
