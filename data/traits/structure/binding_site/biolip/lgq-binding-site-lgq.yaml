identifier: proteintraitsmech:BIOLIP_LGQ
label: "LGQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-phenyl-~{N}3-[4-(trifluoromethyl)phenyl]-1~{H}-pyrazolo[3,4-d]pyrimidine-3,4-diamine (LGQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HYUDDHSPJFCULQ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
