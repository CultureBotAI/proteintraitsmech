identifier: proteintraitsmech:BIOLIP_P2H
label: "P2H-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(2-hydroxy-2,2-diphosphonoethyl)-3-phenylpyridinium (P2H) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZYEONEYSNIUGRA-UHFFFAOYSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
