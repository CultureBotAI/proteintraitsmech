identifier: proteintraitsmech:BIOLIP_2LO
label: "2LO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[2-(3-chloro-4-methoxyphenyl)ethyl]-5-(3,5-dimethyl-1,2-oxazol-4-yl)-1-[(2S)-2-(morpholin-4-yl)propyl]-1H-benzimidazole (2LO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey GEPYBHCJBORHCE-SFHVURJKSA-N.
