identifier: proteintraitsmech:BIOLIP_JAA
label: "JAA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {(1R,2R)-3-oxo-2-[(2Z)-pent-2-en-1-yl]cyclopentyl}acetic acid (JAA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey ZNJFBWYDHIGLCU-HWKXXFMVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
