identifier: proteintraitsmech:BIOLIP_NU2
label: "NU2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{R},6~{R})-6-[(2~{S})-butan-2-yl]-3-(2,3-dihydro-1~{H}-inden-2-yl)-1-[(1~{R})-1-(2-methyl-1,3-oxazol-4-yl)-2-morpholin-4-yl-2-oxidanylidene-ethyl]piperazine-2,5-dione (NU2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PLVGDGRBPMVYPB-FDUHJNRSSA-N.
