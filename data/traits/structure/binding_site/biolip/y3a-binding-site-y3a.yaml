identifier: proteintraitsmech:BIOLIP_Y3A
label: "Y3A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(benzyloxy)carbonyl]glycyl-N-[(2S,3R)-4-chloro-3-hydroxy-1-phenylbutan-2-yl]glycinamide (Y3A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WLEADEPGUSFGIL-OALUTQOASA-N.
