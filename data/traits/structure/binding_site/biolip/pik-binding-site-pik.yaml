definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-3-{[(R)-hydroxy{[(1R,2R,3S,4R,5R,6S)-2,3,6-trihydroxy-4,5-bis(phosphonooxy)cyclohexyl]oxy}phosphoryl]oxy}propane-1,2-diyl dihexadecanoate (PIK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey HKWJHKSHEWVOSS-MVLQGUJPSA-N.
