label: "H94-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-{4-[(4R)-4-hydroxy-6-oxo-4-(trifluoromethyl)-4,5,6,7-tetrahydro-2H-pyrazolo[3,4-b]pyridin-3-yl]piperidin-1-yl}-4-(trifluoromethyl)pyridine-3-carbonitrile (H94) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey VTEXGUOJJDWHCA-QGZVFWFLSA-N.
