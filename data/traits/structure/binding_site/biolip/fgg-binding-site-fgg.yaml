identifier: proteintraitsmech:BIOLIP_FGG
label: "FGG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2Z,6E,10E)-2-fluoro-3,7,11,15-tetramethylhexadeca-2,6,10,14-tetraen-1-yl trihydrogen diphosphate (FGG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey NZHGLLPGXYKTDW-HAQLZSGTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
