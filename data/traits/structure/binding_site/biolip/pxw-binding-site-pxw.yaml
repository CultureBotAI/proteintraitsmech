identifier: proteintraitsmech:BIOLIP_PXW
label: "PXW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,2R,4S,7E)-7-[amino(sulfanyl)methylidene]-2-{[(1P)-3-chloro-3'-(1-cyanocyclopropyl)[1,1'-biphenyl]-4-carbonyl]amino}-7-azabicyclo[2.2.1]heptan-7-ium (PXW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QYJCMFNKFUMQPQ-IOMROCGXSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
