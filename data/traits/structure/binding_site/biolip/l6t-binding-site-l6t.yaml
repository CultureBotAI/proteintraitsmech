identifier: proteintraitsmech:BIOLIP_L6T
label: "L6T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand alpha-D-glucopyranosyl 6-O-dodecyl-alpha-D-glucopyranoside (L6T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 8 binding-site occurrences across 3 PDB structures; ligand InChIKey HIJNTEBBIQHGEK-FXPCSOOLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
