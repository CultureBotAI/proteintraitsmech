    protein_label: "6AJF chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6ajf chain A (resolution 2.698 Å); binding residues: Q40 S54 D58 R63 D64 D144 I427"
    source: CURATOR
