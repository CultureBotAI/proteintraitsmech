identifier: proteintraitsmech:BIOLIP_32M
label: "32M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,6,9,12,15,18-hexaoxahexacosan-1-ol (32M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VVSOZSGWKFPDFX-UHFFFAOYSA-N.
