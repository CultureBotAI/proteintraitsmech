identifier: proteintraitsmech:BIOLIP_AQD
label: "AQD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Nemonapride (AQD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KRVOJOCLBAAKSJ-RDTXWAMCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:AQD
synonyms:
  - synonym_text: "Nemonapride-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "5WIV chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5wiv chain A (resolution 2.143 Å); binding residues: L111 D115 C119 S196 S200 F410 F411 H414 Y438"
    source: CURATOR
