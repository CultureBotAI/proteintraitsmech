identifier: proteintraitsmech:BIOLIP_7RZ
label: "7RZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(1R,3'S,5S,6R,8R)-3'-(aminomethyl)-8-(6-aminopurin-9-yl)-4'-bromanyl-7'-[3-[methyl-(phenylmethyl)amino]propoxy]spiro[2,4,7-trioxa-3$l^{4}-borabicyclo[3.3.0]octane-3,1'-3H-2,1$l^{4}-benzoxaborole]-6-yl]methyl dihydrogen phosphate (7RZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OOVYGSSPEYCEFD-LIBJEQSZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
