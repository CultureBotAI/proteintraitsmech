    protein_label: "6EPI chain F (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6epi chain F (resolution 2.8 Å); binding residues: N9 D56 N75 H79 N80 A83 V84 S87 P111 K115 Q135 S141 K145 R175 I187"
    source: CURATOR
