identifier: proteintraitsmech:BIOLIP_I5M
label: "I5M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-deoxy-5'-({(2S)-2-({2-[(N-{(2R)-4-[(dioxo-lambda~5~-phosphanyl)oxy]-2-hydroxy-3,3-dimethylbutanoyl}-beta-alanyl)amino]ethyl}sulfanyl)-2-[(2S)-pyrrolidin-2-yl]ethanesulfonyl}amino)adenosine (I5M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey UUZQPBPCNSKBOR-LCZLERPASA-N.
