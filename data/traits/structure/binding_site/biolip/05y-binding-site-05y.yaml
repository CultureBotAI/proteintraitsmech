identifier: proteintraitsmech:BIOLIP_05Y
label: "05Y-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[1-(2-pyridin-2-ylethyl)benzimidazol-2-yl]propanamide (05Y) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XNCNQSNDNANIRM-UHFFFAOYSA-N.
