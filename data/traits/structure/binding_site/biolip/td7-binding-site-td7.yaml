    protein_label: "2Y0P chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2y0p chain C (resolution 2.4 Å); binding residues: F506 H539 R540 Y578 H579 S604 L606 G644 D645 A646 A647 N678 I680 H747"
    source: CURATOR
