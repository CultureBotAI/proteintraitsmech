identifier: proteintraitsmech:BIOLIP_35P
label: "35P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,4S)-5,5-dimethyl-2-{(1R)-2-oxo-1-[(phenoxyacetyl)amino]ethyl}-1,3-thiazolidine-4-carboxylic acid (35P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OQVOJWZOUWGSDX-KWCYVHTRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
