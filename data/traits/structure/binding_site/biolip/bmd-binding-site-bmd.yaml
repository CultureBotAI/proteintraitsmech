synonyms:
  - synonym_text: "BUTYRAMIDE-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P27017
    protein_label: "1QO0 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1qo0 chain B (resolution 2.25 Å); binding residues: Y83 M84 S85 P107 Y150 Y152"
    source: CURATOR
