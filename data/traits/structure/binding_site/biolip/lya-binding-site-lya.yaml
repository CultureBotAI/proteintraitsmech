identifier: proteintraitsmech:BIOLIP_LYA
label: "LYA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{4-[2-(2-AMINO-4-OXO-4,7-DIHYDRO-3H-PYRROLO[2,3-D]PYRIMIDIN-5-YL)-ETHYL]-BENZOYLAMINO}-PENTANEDIOIC ACID (LYA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey WBXPDJSOTKVWSJ-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
