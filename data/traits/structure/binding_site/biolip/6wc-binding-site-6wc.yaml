identifier: proteintraitsmech:BIOLIP_6WC
label: "6WC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [2-[(6-oxidanylidene-1~{H}-purin-9-yl)methyl]-3-(phosphonomethoxy)propoxy]methylphosphonic acid (6WC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UAIJWVVEDWVBMI-UHFFFAOYSA-N.
