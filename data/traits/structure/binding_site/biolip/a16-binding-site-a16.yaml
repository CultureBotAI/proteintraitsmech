identifier: proteintraitsmech:BIOLIP_A16
label: "A16-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-O-(4,6-dideoxy-4-{[(1S,2S,3S,4R,5S)-2,3,4-trihydroxy-5-(hydroxymethyl)cyclohexyl]amino}-alpha-D-glucopyranosyl)-beta-D-glucopyranose (A16) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey ARPGGXAVVRZVTA-FCTHMPQMSA-N.
