identifier: proteintraitsmech:BIOLIP_2FT
label: "2FT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2-difluoropentanedioic acid (2FT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PIVAHSCRTJPWJU-UHFFFAOYSA-N.
