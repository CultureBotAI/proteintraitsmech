identifier: proteintraitsmech:BIOLIP_JGL
label: "JGL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[4-[2,4-bis(fluoranyl)phenoxy]-3-[2-(1~{H}-imidazol-5-yl)-5-methyl-4-oxidanylidene-furo[3,2-c]pyridin-7-yl]phenyl]ethanesulfonamide (JGL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BWALAYQEQUFOGH-UHFFFAOYSA-N.
