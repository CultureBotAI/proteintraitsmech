identifier: proteintraitsmech:BIOLIP_OVR
label: "OVR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,3S,5R,6S)-6-hydroxy-8-methyl-8-azabicyclo[3.2.1]octan-3-yl (2S)-3-hydroxy-2-phenylpropanoate (OVR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WTQYWNWRJNXDEG-RBZJEDDUSA-N.
