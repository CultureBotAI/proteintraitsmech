    protein_label: "7O48 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7o48 chain B (resolution 2.0 Å); binding residues: I114 Q115 H117 H142 P154 I158 L230 T231 T232"
    source: CURATOR
