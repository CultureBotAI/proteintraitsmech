identifier: proteintraitsmech:BIOLIP_K36
label: "K36-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2S)-2-({N-[(benzyloxy)carbonyl]-L-leucyl}amino)-1-hydroxy-3-[(3S)-2-oxopyrrolidin-3-yl]propane-1-sulfonic acid (K36) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BSPZFJDYQHDZNR-HTCLRFROSA-N.
