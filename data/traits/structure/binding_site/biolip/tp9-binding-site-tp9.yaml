identifier: proteintraitsmech:BIOLIP_TP9
label: "TP9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3Z)-4-{[(4-AMINO-2-METHYLPYRIMIDIN-5-YL)METHYL]AMINO}-3-MERCAPTOPENT-3-EN-1-YL TRIHYDROGEN DIPHOSPHATE (TP9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey WTQDUFKDQLXDPH-YFHOEESVSA-L.
definition_source: "BioLiP2 (Yang/Zhang group)"
