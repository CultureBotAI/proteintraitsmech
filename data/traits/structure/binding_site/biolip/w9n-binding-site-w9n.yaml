definition: >-
  A structure-derived ligand-binding site at which the ligand 1-{(1R,3r,5S)-3-[(3M)-4-methyl-3-{3-methyl-4-[(1-methyl-1H-benzimidazol-5-yl)oxy]phenyl}-1H-pyrazolo[3,4-d]pyrimidin-1-yl]-8-azabicyclo[3.2.1]octan-8-yl}propan-1-one (W9N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HOVNOYPBTGQGSF-JKHIJQBDSA-N.
