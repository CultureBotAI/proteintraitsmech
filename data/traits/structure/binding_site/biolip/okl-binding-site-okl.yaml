identifier: proteintraitsmech:BIOLIP_OKL
label: "OKL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-chloranyl-3-pentyl-7H-purine-2,6-dione (OKL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CGAMDQCXAAOFSR-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
