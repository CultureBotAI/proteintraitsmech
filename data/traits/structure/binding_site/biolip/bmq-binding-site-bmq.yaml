identifier: proteintraitsmech:BIOLIP_BMQ
label: "BMQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(5'-PHOSPHO-BETA-D-RIBOFURANOSYL)BARBITURIC ACID (BMQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey AODYJUNLDJOADV-YXZULKJRSA-N.
