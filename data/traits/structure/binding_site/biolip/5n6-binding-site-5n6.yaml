identifier: proteintraitsmech:BIOLIP_5N6
label: "5N6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 9-O-acetyl-5-acetamido-3,5-dideoxy-D-glycero-alpha-D-galacto-non-2-ulopyranosonic acid (5N6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey NYWZBRWKDRMPAS-CTAKWSDESA-N.
