identifier: proteintraitsmech:BIOLIP_LP3
label: "LP3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (7R)-4,7-DIHYDROXY-N,N,N-TRIMETHYL-10-OXO-3,5,9-TRIOXA-4-PHOSPHAHEPTACOSAN-1-AMINIUM 4-OXIDE (LP3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 4 PDB structures; ligand InChIKey IHNKQIMGVNPMTC-RUZDIDTESA-O.
