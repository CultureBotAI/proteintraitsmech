identifier: proteintraitsmech:BIOLIP_PKA
label: "PKA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2R)-butan-2-yl]-1-(2-chlorophenyl)-N-methylisoquinoline-3-carboxamide (PKA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RAVIZVQZGXBOQO-CQSZACIVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PKA
synonyms:
  - synonym_text: "N-[(2R)-butan-2-yl]-1-(2-chlorophenyl)-N-methylisoquinoline-3-carboxamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
