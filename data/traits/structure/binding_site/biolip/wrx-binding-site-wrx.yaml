definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-1-[(4-fluorophenyl)methylsulfonyl]-~{N}-[(2~{S})-3-(4-fluorophenyl)-1-oxidanylidene-1-(pyridin-3-ylmethylamino)propan-2-yl]piperidine-2-carboxamide (WRX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FCUDWGSHVIZNIL-UIOOFZCWSA-N.
