identifier: proteintraitsmech:BIOLIP_0JO
label: "0JO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{[(E)-{3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene]amino}prop-2-enoic acid (0JO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey BHIGINKEEFZJGX-YIXHJXPBSA-N.
