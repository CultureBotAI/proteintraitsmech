identifier: proteintraitsmech:BIOLIP_55T
label: "55T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(R)-[(S)-[3-(acetylamino)phenyl](phosphono)methoxy](hydroxy)phosphoryl]cytidine (55T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DIZKZDHPUBLUSO-NHMWIVBRSA-N.
