identifier: proteintraitsmech:BIOLIP_AGI
label: "AGI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5,7-dihydroxy-2-(4-hydroxyphenyl)-4H-chromen-4-one (AGI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KZNIFHPLKGYRTM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
