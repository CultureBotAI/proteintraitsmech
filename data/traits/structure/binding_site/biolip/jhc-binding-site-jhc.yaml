    protein_label: "6V9S chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6v9s chain A (resolution 3.5 Å); binding residues: A102 S103 P123 Q126 A127 Q179 E204 I314 N318"
    source: CURATOR
