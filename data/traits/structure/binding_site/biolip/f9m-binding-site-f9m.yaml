definition: >-
  A structure-derived ligand-binding site at which the ligand [6-[[4-(2,4-dimethyl-1,3-thiazol-5-yl)-1,3-thiazol-2-yl]amino]pyridin-3-yl]-[(1~{S},5~{R})-3-[5-(trifluoromethyl)pyrimidin-2-yl]-3,8-diazabicyclo[3.2.1]octan-8-yl]methanone (F9M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JARXMNZSCUFQHX-HDICACEKSA-N.
