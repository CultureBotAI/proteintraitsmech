identifier: proteintraitsmech:BIOLIP_4K7
label: "4K7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5R)-2-(3,4-dichlorobenzyl)-N-(4-methylbenzyl)-2,7-diazaspiro[4.5]decane-7-carboxamide (4K7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YFDASBFQKMHSSJ-XMMPIXPASA-N.
