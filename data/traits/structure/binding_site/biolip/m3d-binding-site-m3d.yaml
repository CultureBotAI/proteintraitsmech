identifier: proteintraitsmech:BIOLIP_M3D
label: "M3D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-(3-cyano-4-hydroxyphenyl)-N-[2-(morpholin-4-yl)ethyl]dibenzo[b,f]oxepine-10-carboxamide (M3D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 1 PDB structure; ligand InChIKey WKDYAACRENBHRU-UHFFFAOYSA-N.
