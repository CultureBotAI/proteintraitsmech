  A structure-derived ligand-binding site at which the ligand PHOSPHORIC ACID 2-AMINO-3-(4-HYDROXY-PHENYL)-PROPYL ESTER ADENOSIN-5'YL ESTER (TYA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JJLCVHBFTXDJMM-KFAHYOAQSA-M.
