identifier: proteintraitsmech:BIOLIP_F6C
label: "F6C-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Chlorophyll F (F6C) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 49 binding-site occurrences across 6 PDB structures; ligand InChIKey YUTLCKLMRUVWDE-FOFJUSMOSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
