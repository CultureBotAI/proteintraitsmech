    protein_label: "4WRI chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4wri chain A (resolution 1.4 Å); binding residues: R44 F48 M58 R61 H65 S107 S108 T110 L131 M150 Q167 V184 R185"
    source: CURATOR
