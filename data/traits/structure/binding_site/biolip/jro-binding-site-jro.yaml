identifier: proteintraitsmech:BIOLIP_JRO
label: "JRO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6,7,9-trihydroxy-3-methyl-1H-benzo[g]isochromen-1-one (JRO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JSPFABGVYLULRJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
