label: "F3W-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (~{E})-3-[3-(3-cyclohexyl-3,5,8,10-tetrazatricyclo[7.3.0.0^{2,6}]dodeca-1(9),2(6),4,7,11-pentaen-4-yl)phenyl]prop-2-enenitrile (F3W) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JIDRJSPIWPPOBL-FNORWQNLSA-N.
