identifier: proteintraitsmech:BIOLIP_4PT
label: "4PT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(S)-{[(2S,3R,5S,6S)-2,6-DIHYDROXY-3,4,5-TRIS(PHOSPHONOOXY)CYCLOHEXYL]OXY}(HYDROXY)PHOSPHORYL]OXY}-2-(1-HYDROXY BUTOXY)PROPYL BUTYRATE (4PT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JPQZDANYJXWKKH-UASGXTILSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
