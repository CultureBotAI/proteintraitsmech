identifier: proteintraitsmech:BIOLIP_A90
label: "A90-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4-[2-[(4-chlorophenyl)sulfonylamino]ethyl]phenyl]ethanoic acid (A90) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IULOBWFWYDMECP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:A90
synonyms:
  - synonym_text: "2-[4-[2-[(4-chlorophenyl)sulfonylamino]ethyl]phenyl]ethanoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00268
    protein_label: "6IIV chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6iiv chain A (resolution 3.0 Å); binding residues: T81 V85 H89 M112 G116 S181 W182 F184 W258 L294 R295 T298 Q301"
    source: CURATOR
