identifier: proteintraitsmech:BIOLIP_1XL
label: "1XL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-deoxy-1-[6-(hydroxymethyl)-2,4-dioxo-3,4-dihydropteridin-8(2H)-yl]-D-arabinitol (1XL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RTNMDIMJQSRAGT-BHNWBGBOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:1XL
synonyms:
