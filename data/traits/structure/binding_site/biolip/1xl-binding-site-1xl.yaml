    protein_label: "4LCC chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4lcc chain C (resolution 3.263 Å); binding residues: Y120 R122 K156 Y175 W182 R207 Y265"
    source: CURATOR
