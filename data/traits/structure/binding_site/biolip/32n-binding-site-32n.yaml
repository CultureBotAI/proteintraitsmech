definition: >-
  A structure-derived ligand-binding site at which the ligand (1S)-4-[(1E,3Z,5E,7E,9E,11E,13E,15E,17E)-3-(hydroxymethyl)-7,12,16-trimethyl-18-[(1R,4S)-2,6,6-trimethyl-4-oxidanyl-cyclohex-2-en-1-yl]octadeca-1,3,5,7,9,11,13,15,17-nonaenyl]-3,5,5-trimethyl-cyclohex-3-en-1-ol (32N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ODGGKCNQKSEQNL-VVAGNOCPSA-N.
