definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R},3~{S},4~{R},5~{R})-5-(6-aminopurin-9-yl)-2-[[[(2~{R},3~{S},4~{R},5~{R})-5-(2-azanyl-6-oxidanylidene-1~{H}-purin-9-yl)-2-(hydroxymethyl)-4-oxidanyl-oxolan-3-yl]oxy-sulfanyl-phosphoryl]oxymethyl]-4-oxidanyl-oxolan-3-yl]oxy-sulfanyl-phosphinic acid (ECI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MLCQGAYMLYXJTJ-WEKBUWATSA-N.
