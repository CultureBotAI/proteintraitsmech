identifier: proteintraitsmech:BIOLIP_86G
label: "86G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[3-(methoxymethyl)phenyl]-N-[4-(1H-pyrazol-4-yl)phenyl]acetamide (86G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LTOKSVFUTQZXGU-UHFFFAOYSA-N.
