identifier: proteintraitsmech:BIOLIP_TGG
label: "TGG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GAMMA-GLUTAMYL-S-(1,2-DICARBOXYETHYL)CYSTEINYLGLYCINE (TGG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PWCIUOASSAHGHI-BIIVOSGPSA-N.
