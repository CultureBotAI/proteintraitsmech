identifier: proteintraitsmech:BIOLIP_U4N
label: "U4N-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2,2-tris(fluoranyl)-~{N}-[4-[3-[2-[[(3~{S})-piperidin-3-yl]amino]pyrimidin-4-yl]pyridin-2-yl]oxynaphthalen-1-yl]ethanesulfonamide (U4N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LVBYPSVRFGNRPW-KRWDZBQOSA-N.
