identifier: proteintraitsmech:BIOLIP_IN1
label: "IN1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(beta-D-glucopyranosyloxy)-2,2-dihydroxybutyl propanoate (IN1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LNJDDDXXDSOXEJ-DVYMNCLGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
