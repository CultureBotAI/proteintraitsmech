    protein_label: "6S3A chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6s3a chain A (resolution 1.52 Å); binding residues: P159 M175 L178 C179 P182 D186 F190 L238"
    source: CURATOR
