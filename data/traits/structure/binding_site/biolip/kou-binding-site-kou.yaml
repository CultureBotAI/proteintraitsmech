identifier: proteintraitsmech:BIOLIP_KOU
label: "KOU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E)-N-({3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene)-L-serine (KOU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey ZTQZHYMXYBDMIL-BIMOUXMDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:KOU
synonyms:
  - synonym_text: "(E)-N-({3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene)-L-serine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:F9UT53
    protein_label: "6LDO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6ldo chain A (resolution 2.75 Å); binding residues: G73 S74 Y97 N144 D169 S191 S193 S321 L322 T336 R356"
    source: CURATOR
