identifier: proteintraitsmech:BIOLIP_TPW
label: "TPW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{4-[(4-AMINO-2-METHYLPYRIMIDIN-5-YL)METHYL]-3-METHYLTHIOPHEN-2-YL}ETHYL TRIHYDROGEN DIPHOSPHATE (TPW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey IOGGWTLVIZLGGZ-UHFFFAOYSA-N.
