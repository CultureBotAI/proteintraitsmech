identifier: proteintraitsmech:BIOLIP_ZLK
label: "ZLK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand zafirlukast (ZLK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YEEZWCHGZNKEEK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ZLK
synonyms:
  - synonym_text: "zafirlukast-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "6RZ5 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6rz5 chain A (resolution 2.53 Å); binding residues: Y104 Y108 T154 P157 F158 P176 L189 S193 Y249 R253 V277 T280"
    source: CURATOR
