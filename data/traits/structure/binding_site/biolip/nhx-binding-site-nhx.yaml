identifier: proteintraitsmech:BIOLIP_NHX
label: "NHX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{(2R)-2-[2-(hydroxyamino)-2-oxoethyl]-4-methylpentanoyl}-3-naphthalen-2-yl-L-alanyl-L-alaninamide (NHX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CRCPLBFLOSEABN-BEVDRBHNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
