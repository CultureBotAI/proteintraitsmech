identifier: proteintraitsmech:BIOLIP_WCJ
label: "WCJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{4-[(5P)-4-amino-5-{3-fluoro-4-[(4-methylpyrimidin-2-yl)oxy]phenyl}-7-methyl-7H-pyrrolo[2,3-d]pyrimidin-6-yl]phenyl}-2-methylpropanamide (WCJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YMFWNWAYNXOSLG-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
