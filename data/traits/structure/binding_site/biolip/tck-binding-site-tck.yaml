identifier: proteintraitsmech:BIOLIP_TCK
label: "TCK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1S)-5-amino-1-(chloroacetyl)pentyl]-4-methylbenzenesulfonamide (TCK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey RDFCSSHDJSZMTQ-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
