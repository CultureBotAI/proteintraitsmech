identifier: proteintraitsmech:BIOLIP_STI
label: "STI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(4-METHYL-PIPERAZIN-1-YLMETHYL)-N-[4-METHYL-3-(4-PYRIDIN-3-YL-PYRIMIDIN-2-YLAMINO)-PHENYL]-BENZAMIDE (STI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey KTUFNOKKBVMGRW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
