identifier: proteintraitsmech:BIOLIP_YTC
label: "YTC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S},4~{S})-4-(1,3-benzodioxol-5-ylmethyl)-3-[(3,4,5-trimethoxyphenyl)methyl]oxolan-2-one (YTC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GMLDZDDTZKXJLU-CVEARBPZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
