    protein_label: "9F8X chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 9f8x chain A (resolution 1.498 Å); binding residues: H132 H133 H181 H323 H378 H429 K450 H490"
    source: CURATOR
