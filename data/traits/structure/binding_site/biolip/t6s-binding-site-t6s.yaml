identifier: proteintraitsmech:BIOLIP_T6S
label: "T6S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand alpha-D-glucopyranosyl 6-O-sulfo-alpha-D-glucopyranoside (T6S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AJWOGPXMZBTABG-LIZSDCNHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
