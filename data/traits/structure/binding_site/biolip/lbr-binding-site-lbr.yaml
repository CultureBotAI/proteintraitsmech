identifier: proteintraitsmech:BIOLIP_LBR
label: "LBR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-1-[(13-bromotridecanoyl)oxy]-3-hydroxypropan-2-yl tetradecanoate (LBR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VHCCBJMTBOAHLF-NDEPHWFRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LBR
synonyms:
  - synonym_text: "(2S)-1-[(13-bromotridecanoyl)oxy]-3-hydroxypropan-2-yl tetradecanoate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A1T557
    protein_label: "4XU5 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4xu5 chain A (resolution 2.1 Å); binding residues: D23 H26 Y34 F49 Y90 G135 V138 E139 L142 F148 Y150 Y168 F171"
    source: CURATOR
