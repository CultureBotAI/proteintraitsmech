identifier: proteintraitsmech:BIOLIP_ELZ
label: "ELZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 10-[2-[(3~{R})-1-methyl-3-oxidanyl-2-oxidanylidene-pyrrolidin-3-yl]ethynyl]-~{N}3-(oxan-4-yl)-5,6-dihydroimidazo[1,2-d][1,4]benzoxazepine-2,3-dicarboxamide (ELZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZGTZKIXFBFZCBL-VWLOTQADSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
