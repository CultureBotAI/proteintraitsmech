identifier: proteintraitsmech:BIOLIP_UIK
label: "UIK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [4-[4-[methyl-[(3-methylphenyl)methyl]amino]-7~{H}-pyrrolo[2,3-d]pyrimidin-6-yl]phenyl]methanol (UIK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KXUSCHVJJBSONI-UHFFFAOYSA-N.
