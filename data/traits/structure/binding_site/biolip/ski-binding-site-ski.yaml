identifier: proteintraitsmech:BIOLIP_SKI
label: "SKI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6,7-dimethoxy-N-(4-phenoxyphenyl)quinazolin-4-amine (SKI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DMWVGXGXHPOEPT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
