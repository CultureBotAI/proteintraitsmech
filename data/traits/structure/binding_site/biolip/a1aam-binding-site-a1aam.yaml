definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,2'S)-3,3'-[carbonylbis(azanediyl-3,1-phenylene)]bis{2-[(3R)-pyrrolidin-1-ium-3-yl]propanoate} (A1AAM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HICCAHJBPZUBFA-TZYAJKAJSA-N.
