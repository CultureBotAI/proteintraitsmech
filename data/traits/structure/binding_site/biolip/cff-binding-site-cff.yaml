identifier: proteintraitsmech:BIOLIP_CFF
label: "CFF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CAFFEINE (CFF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 21 binding-site occurrences across 17 PDB structures; ligand InChIKey RYYVLZVUVIJVGH-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
