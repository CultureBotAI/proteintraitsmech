identifier: proteintraitsmech:BIOLIP_LVY
label: "LVY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-Lenalidomide (LVY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GOTYRUGSSMKFNF-JTQLQIEISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LVY
synonyms:
  - synonym_text: "S-Lenalidomide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q96SW2
    protein_label: "5FQD chain E (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5fqd chain E (resolution 2.45 Å); binding residues: N351 P352 H378 S379 W380 W386 W400 F402"
    source: CURATOR
