identifier: proteintraitsmech:BIOLIP_UHC
label: "UHC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{S}-[2-[3-[[(2~{S})-3,3-dimethyl-2-oxidanyl-4-phosphonooxy-butanoyl]amino]propanoylamino]ethyl] 3-oxidanylideneoctanethioate (UHC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey HGKMRNVHDOTSFB-QGZVFWFLSA-N.
