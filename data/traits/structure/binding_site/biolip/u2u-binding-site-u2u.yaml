identifier: proteintraitsmech:BIOLIP_U2U
label: "U2U-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{2-[(1-aminoisoquinolin-6-yl)oxy]-4-methylphenyl}-2-methoxybenzene-1-sulfonamide (U2U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BWEJNHRMGZUMNU-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
