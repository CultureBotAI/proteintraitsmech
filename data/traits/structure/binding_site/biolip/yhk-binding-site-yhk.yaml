    protein_label: "8W0B chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8w0b chain A (resolution 2.3 Å); binding residues: V416 G417 E418 P419 T442 Y443 W444 Q445 T446 D532 I544 R547 R558"
    source: CURATOR
