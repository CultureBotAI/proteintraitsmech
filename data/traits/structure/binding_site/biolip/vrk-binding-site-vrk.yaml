identifier: proteintraitsmech:BIOLIP_VRK
label: "VRK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{S},3~{R})-3-(1-adamantyl)-1-(aminomethyl)-3,4-dihydro-1~{H}-isochromene-5,6-diol (VRK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QLJOSZATCBCBDR-HHDLIXMQSA-N.
