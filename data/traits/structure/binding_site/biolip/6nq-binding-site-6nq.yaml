identifier: proteintraitsmech:BIOLIP_6NQ
label: "6NQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2'-Bromo-2'-deoxyadenosine 5'-[beta,gamma-imide]triphosphoric acid (6NQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GLCRVGHVCJLAHS-QYYRPYCUSA-N.
