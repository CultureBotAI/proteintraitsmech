identifier: proteintraitsmech:BIOLIP_NKD
label: "NKD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-[[(2~{S})-1-[[(2~{S},3~{S})-3-[[(2~{S})-2-azanyl-3-(3-hydroxyphenyl)propanoyl]-methyl-amino]-1-[[(~{Z})-[(3~{S},4~{R},5~{R})-5-[2,4-bis(oxidanylidene)pyrimidin-1-yl]-3,4-bis(oxidanyl)oxolan-2-ylidene]methyl]amino]-1-oxidanylidene-butan-2-yl]amino]-4-methylsulfanyl-1-oxidanylidene-butan-2-yl]carbamoylamino]-3-(3-hydroxyphenyl)propanoic acid (NKD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FPCKAOGINMZAIN-MNATZBQSSA-N.
