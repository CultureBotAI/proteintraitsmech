    protein_label: "3CL7 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3cl7 chain A (resolution 1.8 Å); binding residues: E36 H126 W130 T165 G166 R167 H259"
    source: CURATOR
