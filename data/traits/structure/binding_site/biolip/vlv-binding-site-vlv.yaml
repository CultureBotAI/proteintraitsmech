identifier: proteintraitsmech:BIOLIP_VLV
label: "VLV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N~3~-{[5-(4-acetylphenyl)-4-methyl-1,3-thiazol-2-yl]carbamoyl}-N-tert-butyl-beta-alaninamide (VLV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IUPXLLWDLOWEBR-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
