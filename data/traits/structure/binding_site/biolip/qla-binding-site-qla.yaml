identifier: proteintraitsmech:BIOLIP_QLA
label: "QLA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(4-fluorophenyl)amino]-3-hydroxynaphthalene-1,4-dione (QLA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AVGHWZUEYVXFON-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
