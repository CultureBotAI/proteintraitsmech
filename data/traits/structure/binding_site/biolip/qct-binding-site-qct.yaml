identifier: proteintraitsmech:BIOLIP_QCT
label: "QCT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(3,4-dihydroxyphenyl)-5,7-dihydroxy-4-oxo-4H-chromen-3-yl 6-deoxy-alpha-L-mannopyranoside (QCT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OXGUCUVFOIWWQJ-HQBVPOQASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
