identifier: proteintraitsmech:BIOLIP_YAG
label: "YAG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(hydroxymethyl)-1-[[2-(3-methoxyphenyl)-1,3-thiazol-5-yl]methyl]piperidin-4-ol (YAG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FXCZNKJONOHACS-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
