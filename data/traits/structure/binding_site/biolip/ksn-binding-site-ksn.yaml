identifier: proteintraitsmech:BIOLIP_KSN
label: "KSN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-[[(4~{S})-4-azanyl-5-oxidanyl-5-oxidanylidene-pentanoyl]amino]pentanedioic acid (KSN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OWQDWQKWSLFFFR-WDSKDSINSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
