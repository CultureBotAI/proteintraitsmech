identifier: proteintraitsmech:BIOLIP_AZJ
label: "AZJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ethyl 6-{4-[(benzylsulfonyl)carbamoyl]piperidin-1-yl}-5-cyano-2-methylpyridine-3-carboxylate (AZJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NEMHKCNXXRQYRF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:AZJ
synonyms:
  - synonym_text: "ethyl 6-{4-[(benzylsulfonyl)carbamoyl]piperidin-1-yl}-5-cyano-2-methylpyridine-3-carboxylate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "4NTJ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4ntj chain A (resolution 2.62 Å); binding residues: V102 Y105 F106 Y109 S156 N159 V190 N191 C194 R256 Y259 K280"
    source: CURATOR
