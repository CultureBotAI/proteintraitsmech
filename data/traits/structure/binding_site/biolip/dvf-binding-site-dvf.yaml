identifier: proteintraitsmech:BIOLIP_DVF
label: "DVF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-methyl-2-(2-propan-2-ylphenyl)-~{N}-(pyridin-2-ylmethyl)pyrrolo[3,2-d]pyrimidin-4-amine (DVF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XIEZMAUGHWKZDR-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
