identifier: proteintraitsmech:BIOLIP_JPI
label: "JPI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S},5~{R},6~{R})-5-[(3~{S},7~{R},12~{S},16~{S},20~{S})-3,7,12,16,20,24-hexamethyl-24-oxidanyl-pentacosyl]-4,4,6-trimethyl-cyclohexane-1,3-diol (JPI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HMWJPEUVPLHAER-VMKFVPKQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
