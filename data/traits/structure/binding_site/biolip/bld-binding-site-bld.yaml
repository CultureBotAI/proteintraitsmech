    protein_label: "3RGZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3rgz chain A (resolution 2.281 Å); binding residues: W564 Y597 Y599 Y642"
    source: CURATOR
  - protein_id: UniProtKB:Q9ZWC8
    protein_label: "4J0M chain A (BioLiP receptor)"
