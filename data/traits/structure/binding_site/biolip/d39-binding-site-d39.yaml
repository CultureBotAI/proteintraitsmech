definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-azanyl-3-[[(2~{R})-3-hexadecanoyloxy-2-[(~{Z})-octadec-9-enoyl]oxy-propoxy]-oxidanyl-phosphoryl]oxy-propanoic acid (D39) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey OIWCYIUQAVBPGV-DAQGAKHBSA-N.
