identifier: proteintraitsmech:BIOLIP_SKT
label: "SKT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{R},4~{R},5~{R})-5-[(~{E})-3-(4-hydroxyphenyl)prop-2-enoyl]oxy-3,4-bis(oxidanyl)cyclohexene-1-carboxylic acid (SKT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GVECSFFLZYNEBO-PDXJTRCTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
