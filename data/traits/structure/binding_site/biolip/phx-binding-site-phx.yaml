identifier: proteintraitsmech:BIOLIP_PHX
label: "PHX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{[(Z)-(5-OXO-2-PHENYL-1,3-OXAZOL-4(5H)-YLIDENE)METHYL]AMINO}BUTANOIC ACID (PHX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PXGNVFUWTUIRCJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
