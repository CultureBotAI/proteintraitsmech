    protein_label: "5KTC chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5ktc chain A (resolution 1.8 Å); binding residues: R28 I37 S38 S40 Q47 W50 Y65 R81 Y83 W94 G95 S96 W97 E131 H143"
    source: CURATOR
