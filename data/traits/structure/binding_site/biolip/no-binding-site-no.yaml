identifier: proteintraitsmech:BIOLIP_NO
label: "NO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand NITRIC OXIDE (NO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey ODUCDPQEXGNKDN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NO
synonyms:
  - synonym_text: "NITRIC OXIDE-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P72181
    protein_label: "1AOM chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1aom chain B (resolution 1.8 Å); binding residues: Y25 H388"
    source: CURATOR
  - protein_id: UniProtKB:P00396
    protein_label: "3ABK chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3abk chain A (resolution 2.0 Å); binding residues: H240 V243 H291"
    source: CURATOR
  - protein_id: UniProtKB:P23295
    protein_label: "5Y5F chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5y5f chain A (resolution 1.5 Å); binding residues: A239 G240"
    source: CURATOR
