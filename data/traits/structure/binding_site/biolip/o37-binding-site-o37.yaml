label: "O37-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(4S,5S)-1-[(1S)-cyclohex-3-en-1-yl]-7-ethyl-4-(4-fluorophenyl)-3-methyl-6-oxo-4,5,6,7-tetrahydro-1H-pyrazolo[3,4-b]pyridin-5-yl]-3-methylbenzamide (O37) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DRGYLPYZJGVISN-AFESJLNVSA-N.
