identifier: proteintraitsmech:BIOLIP_RLK
label: "RLK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-azanyl-~{N}-[2-bromanyl-5-[4-[3-(dimethylamino)propylsulfonyl]piperazin-1-yl]phenyl]-1,3-oxazole-4-carboxamide (RLK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GTJMWLKWMPRNKA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
