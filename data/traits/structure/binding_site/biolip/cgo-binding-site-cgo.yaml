identifier: proteintraitsmech:BIOLIP_CGO
label: "CGO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand sodium 3,3'-(1E,1'E)-biphenyl-4,4'-diylbis(diazene-2,1-diyl)bis(4-aminonaphthalene-1-sulfonate) (CGO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey IQFVPQOLBLOTPF-HKXUKFGYSA-L.
