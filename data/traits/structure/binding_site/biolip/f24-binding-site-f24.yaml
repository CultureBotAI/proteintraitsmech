identifier: proteintraitsmech:BIOLIP_F24
label: "F24-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (7R,12R,13R)-13-formyl-12,14-dihydroxy-3,5,7-trimethyltetradeca-2,4-dienoic acid (F24) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CJCDMTWCUXKYGF-QPILVHKNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
