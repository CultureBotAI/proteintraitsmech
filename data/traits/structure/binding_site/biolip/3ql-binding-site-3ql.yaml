identifier: proteintraitsmech:BIOLIP_3QL
label: "3QL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1R,2S,3R,4R,5R)-2-[(2S,3R,4R,5S,6R)-3-acetamido-6-(hydroxymethyl)-4,5-bis(oxidanyl)oxan-2-yl]oxy-3-oxidanyl-6,8-dioxabicyclo[3.2.1]octan-4-yl]ethanamide (3QL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UVQRTGABPMLDOA-KSKNGZLJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
