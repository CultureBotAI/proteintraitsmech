    protein_label: "7SZA chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7sza chain A (resolution 1.9 Å); binding residues: V58 M113 E115 I116 S119 I182 D183"
    source: CURATOR
