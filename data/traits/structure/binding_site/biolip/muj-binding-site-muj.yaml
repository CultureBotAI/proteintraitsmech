    protein_label: "4AT5 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4at5 chain A (resolution 1.71 Å); binding residues: A586 L608 V617 F633 Y635 M636 F688 N697 L699 G709 D710 F711"
    source: CURATOR
