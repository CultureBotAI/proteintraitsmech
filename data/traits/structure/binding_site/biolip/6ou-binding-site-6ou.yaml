identifier: proteintraitsmech:BIOLIP_6OU
label: "6OU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-1-[2-azanylethoxy(oxidanyl)phosphoryl]oxy-3-hexadecanoyloxy-propan-2-yl] (~{Z})-octadec-9-enoate (6OU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 72 binding-site occurrences across 25 PDB structures; ligand InChIKey FHQVHHIBKUMWTI-OTMQOFQLSA-N.
