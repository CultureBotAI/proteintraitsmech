identifier: proteintraitsmech:BIOLIP_GSU
label: "GSU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand O5'-(L-GLUTAMYL-SULFAMOYL)-ADENOSINE (GSU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YBRKRYFZKHICLS-WERHYGNASA-N.
