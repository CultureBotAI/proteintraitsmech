identifier: proteintraitsmech:BIOLIP_MLD
label: "MLD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GLCNAC(BETA1-4)-MURNAC(1,6-ANHYDRO)-L-ALA-GAMMA-D-GLU-MESO-A2PM-D-ALA (MLD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey UPFMKPIBAIPLHT-RSJSDIDPSA-N.
