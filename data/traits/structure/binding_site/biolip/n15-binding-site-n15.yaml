identifier: proteintraitsmech:BIOLIP_N15
label: "N15-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{4-[3-(1H-benzimidazol-2-yl)-1H-indazol-6-yl]-1H-pyrazol-1-yl}-N-(3-methylbutyl)acetamide (N15) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MBGGBSBQBVZBHN-UHFFFAOYSA-N.
