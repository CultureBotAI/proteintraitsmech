identifier: proteintraitsmech:BIOLIP_MAV
label: "MAV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand alpha-D-mannopyranuronic acid (MAV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 4 PDB structures; ligand InChIKey AEMOLEFTQBMNLQ-BYHBOUFCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
