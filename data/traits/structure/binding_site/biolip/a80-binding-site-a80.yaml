identifier: proteintraitsmech:BIOLIP_A80
label: "A80-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(5,5,8,8-tetramethyl-5,6,7,8-tetrahydronaphthalen-2-yl)carbamoyl]benzoic acid (A80) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MUTNCGKQJGXKEM-UHFFFAOYSA-N.
