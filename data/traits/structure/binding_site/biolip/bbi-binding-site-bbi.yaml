    protein_label: "8E59 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8e59 chain A (resolution 3.1 Å); binding residues: M1019 T1022 A1140 M1144 F1147 Y1448 L1450 F1453"
    source: CURATOR
