identifier: proteintraitsmech:BIOLIP_PMR
label: "PMR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Protochlorophyllide (PMR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 4 PDB structures; ligand InChIKey ZHFORNQMLKGQNN-KKNVGXODSA-L.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PMR
synonyms:
  - synonym_text: "Protochlorophyllide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q7VD37
    protein_label: "2YNM chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2ynm chain C (resolution 2.1 Å); binding residues: F16 T20 V23 S48 A49 M363 W378 I380 F384"
    source: CURATOR
  - protein_id: UniProtKB:Q7VD38
    protein_label: "2YNM chain D (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2ynm chain D (resolution 2.1 Å); binding residues: Y38 L41 L42 M45 I46"
    source: CURATOR
  - protein_id: UniProtKB:P26164
    protein_label: "3AEK chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3aek chain A (resolution 2.3 Å); binding residues: F25 A57 A58 W387 I389 F393"
