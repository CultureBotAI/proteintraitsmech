identifier: proteintraitsmech:BIOLIP_DJH
label: "DJH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[1'-(1~{H}-indazol-5-ylcarbonyl)-4-methyl-2-oxidanylidene-spiro[indole-3,4'-piperidine]-1-yl]-~{N}-[2,2,2-tris(fluoranyl)ethyl]ethanamide (DJH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OQTWZMQWXKMALD-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
