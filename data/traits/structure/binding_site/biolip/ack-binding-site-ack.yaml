identifier: proteintraitsmech:BIOLIP_ACK
label: "ACK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2',3'- cyclic AMP (ACK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KMYWVDDIPVNLME-KQYNXXCUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
