identifier: proteintraitsmech:BIOLIP_4OP
label: "4OP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,4S)-2-carboxy-4-hydroxy-1,1-dimethylpyrrolidinium (4OP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MUNWAHDYFVYIKH-PHDIDXHHSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
