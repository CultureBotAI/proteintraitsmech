identifier: proteintraitsmech:BIOLIP_INI
label: "INI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-NITRO-6-RIBITYL-AMINO-2,4(1H,3H)-PYRIMIDINEDIONE (INI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 10 binding-site occurrences across 5 PDB structures; ligand InChIKey KSKGHNZSCSCHEQ-RPDRRWSUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
