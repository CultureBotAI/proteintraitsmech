identifier: proteintraitsmech:BIOLIP_CZX
label: "CZX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(1~{S})-1-(2,3-dimethylphenyl)ethyl]-1~{H}-imidazole (CZX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey CUHVIMMYOGQXCV-NSHDSACASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
