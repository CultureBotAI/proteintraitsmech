identifier: proteintraitsmech:BIOLIP_DGW
label: "DGW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S,7S)-7-{[4-(2,6-dichlorophenyl)piperidin-1-yl]methyl}-1-methyl-6,7,8,9-tetrahydro-5H-benzo[7]annulen-5-ol (DGW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OHRDCQFCAWLDBP-SBUREZEXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
