identifier: proteintraitsmech:BIOLIP_GLN
label: "GLN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GLUTAMINE (GLN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 35 binding-site occurrences across 34 PDB structures; ligand InChIKey ZDXPYRJPNDTMRX-VKHMYHEASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
