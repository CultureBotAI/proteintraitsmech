identifier: proteintraitsmech:BIOLIP_CAU
label: "CAU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-1-(9H-Carbazol-4-yloxy)-3-(isopropylamino)propan-2-ol (CAU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey BQXQGZPYHWWCEB-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
