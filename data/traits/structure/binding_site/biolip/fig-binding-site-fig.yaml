    protein_label: "5FZI chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5fzi chain A (resolution 1.95 Å); binding residues: R98 Y488 F496 H499 K517"
    source: CURATOR
