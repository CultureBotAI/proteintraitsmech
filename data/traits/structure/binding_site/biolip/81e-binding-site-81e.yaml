definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,3S,5E,7S,11R,13E,15E,17E,19E,21R,23S,24R,25S)-11,24-dimethyl-1,3,7,21,25-pentakis(oxidanyl)-10,27-dioxabicyclo[21.3.1]heptacosa-5,13,15,17,19-pentaen-9-one (81E) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HPNUEFYWFLZIDL-RYQDMBGZSA-N.
