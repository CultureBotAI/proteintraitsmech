identifier: proteintraitsmech:BIOLIP_7MY
label: "7MY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-[(1S)-4-hydroxy-2,3-dihydro-1H-inden-1-yl]-5,5-dimethyl-2-({3-[(pyrrolidin-1-yl)methyl]phenyl}amino)-5,7-dihydro-6H-pyrrolo[2,3-d]pyrimidin-6-one (7MY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey OFIFLUFVENTCNZ-QHCPKHFHSA-N.
