definition: >-
  A structure-derived ligand-binding site at which the ligand N~2~-(2-AMINO-1-METHYL-2-OXOETHYLIDENE)ASPARAGINATE (NSN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YZKQNDLOQTXCHV-BNTYAIEMSA-N.
