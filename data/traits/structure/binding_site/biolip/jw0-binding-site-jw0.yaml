identifier: proteintraitsmech:BIOLIP_JW0
label: "JW0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4~{R})-4-[(3~{R},5~{R},8~{R},9~{S},10~{S},12~{S},13~{R},14~{S},17~{R})-10,13-dimethyl-12-oxidanyl-3-phosphonooxy-2,3,4,5,6,7,8,9,11,12,14,15,16,17-tetradecahydro-1~{H}-cyclopenta[a]phenanthren-17-yl]pentanoic acid (JW0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RDWXGGGYXLRLFX-LLQZFEROSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
