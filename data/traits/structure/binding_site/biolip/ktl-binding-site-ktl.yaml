    protein_label: "3LPP chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3lpp chain B (resolution 2.15 Å); binding residues: D231 W327 D355 W435 W470 D472 M473 K509 R555 D571 F604 H629"
    source: CURATOR
