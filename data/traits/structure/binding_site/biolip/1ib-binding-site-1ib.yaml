identifier: proteintraitsmech:BIOLIP_1IB
label: "1IB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-ethyl-3-fluoranyl-3-[3-fluoranyl-4-(pyrrolidin-1-ylmethyl)phenyl]cyclobutane-1-carboxamide (1IB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SXMBKHYDZOCBMT-PPUGGXLSSA-N.
