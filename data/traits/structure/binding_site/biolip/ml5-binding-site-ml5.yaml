    protein_label: "3V2Y chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3v2y chain A (resolution 2.8 Å); binding residues: Y29 N101 R120 E121 M124 F125 L128 L276 L297"
    source: CURATOR
