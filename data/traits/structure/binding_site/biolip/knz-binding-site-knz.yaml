identifier: proteintraitsmech:BIOLIP_KNZ
label: "KNZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-8-[[4-[4-[2,3-bis(fluoranyl)phenoxy]butoxy]-2-fluoranyl-phenyl]carbonylamino]-4-(4-oxidanyl-4-oxidanylidene-but yl)-2,3-dihydro-1,4-benzoxazine-2-carboxylic acid (KNZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FRDYFKGGRISGHW-VWLOTQADSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
