identifier: proteintraitsmech:BIOLIP_9GF
label: "9GF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(1R,2R,5R)-5-hydroxy-2-(3-hydroxypropyl)cyclohexyl]-5-(2-methyloctan-2-yl)phenol (9GF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YNZFFALZMRAPHQ-SYYKKAFVSA-N.
