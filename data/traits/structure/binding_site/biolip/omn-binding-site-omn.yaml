identifier: proteintraitsmech:BIOLIP_OMN
label: "OMN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-BROMO-3-(5'-CARBOXY-4'-CHLORO-2'-FLUOROPHENYL)-1-METHYL-5-TRIFLUOROMETHYL-PYRAZOL (OMN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YNMHKERYELPEEF-UHFFFAOYSA-N.
