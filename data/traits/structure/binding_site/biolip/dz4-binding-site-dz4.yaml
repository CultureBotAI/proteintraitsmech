identifier: proteintraitsmech:BIOLIP_DZ4
label: "DZ4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2'-deoxy-5'-O-[(R)-hydroxy{[(R)-hydroxy(phosphonooxy)phosphoryl]amino}phosphoryl]adenosine (DZ4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey WKIPJDSLGCBQCU-RRKCRQDMSA-N.
