identifier: proteintraitsmech:BIOLIP_XGZ
label: "XGZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Mycothiol (XGZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MQBCDKMPXVYCGO-FQBKTPCVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
