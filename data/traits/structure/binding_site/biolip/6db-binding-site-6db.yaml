    protein_label: "5ORG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5org chain A (resolution 1.99 Å); binding residues: E30 Y33 W71 A88 A89 M90 S91 R96 N111 Q159 T162 T163 N202"
    source: CURATOR
  - protein_id: UniProtKB:P0A4T4
