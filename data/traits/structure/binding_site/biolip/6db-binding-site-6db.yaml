identifier: proteintraitsmech:BIOLIP_6DB
label: "6DB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand octopine (6DB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey IMXSCCDUAFEIOE-RITPCOANSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
