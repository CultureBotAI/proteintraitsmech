identifier: proteintraitsmech:BIOLIP_2CV
label: "2CV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand HEGA-10 (2CV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 2 PDB structures; ligand InChIKey ITEIKACYSCODFV-ATLSCFEFSA-N.
