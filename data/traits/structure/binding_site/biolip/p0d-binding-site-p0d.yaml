identifier: proteintraitsmech:BIOLIP_P0D
label: "P0D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-3-[(S)-[(1R)-1-aminoethyl](phosphonooxy)phosphoryl]-2-benzylpropanoic acid (P0D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KXASHFLSUHEZCK-UODZXCQVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
