identifier: proteintraitsmech:BIOLIP_D2Y
label: "D2Y-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 2-acetamido-4-O-{2-acetamido-4,6-O-[(1S)-1-carboxyethylidene]-2-deoxy-beta-D-mannopyranosyl}-2-deoxy-beta-D-glucopyranoside (D2Y) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UVHDIWJHCZODAO-MYXXRMNRSA-N.
