    protein_label: "5GZX chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5gzx chain A (resolution 2.35 Å); binding residues: W48 G50 V51 I52 N203 S204 L285"
    source: CURATOR
