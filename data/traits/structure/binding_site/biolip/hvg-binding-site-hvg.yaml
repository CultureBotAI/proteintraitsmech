identifier: proteintraitsmech:BIOLIP_HVG
label: "HVG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(S)-amino(carboxy)methyl]benzene-1,2-dicarboxylic acid (HVG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IJVMOGKBEVRBPP-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
