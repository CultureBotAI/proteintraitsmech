identifier: proteintraitsmech:BIOLIP_TZS
label: "TZS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{[1-(6,7-dimethoxy-5,8-dihydroquinazolin-4-yl)piperidin-4-yl]methyl}sulfuric diamide (TZS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FJBBCXRRTSLXGK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
