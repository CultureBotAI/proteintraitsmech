label: "2S1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-bromo-N-[(2S,3S)-4-{[2-(2,4-dichlorophenyl)ethyl][3-(1,3-dioxo-1,3-dihydro-2H-isoindol-2-yl)propanoyl]amino}-3-hydroxy-1-(3-phenoxyphenyl)butan-2-yl]-4,5-dimethoxybenzamide (2S1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DQHKQRXAVNDAFY-UWXQCODUSA-N.
