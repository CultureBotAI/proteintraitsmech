identifier: proteintraitsmech:BIOLIP_DPM
label: "DPM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[5-{[3-(2-carboxyethyl)-4-(carboxymethyl)-5-methyl-1H-pyrrol-2-yl]methyl}-4-(carboxymethyl)-1H-pyrrol-3-yl]propanoic acid (DPM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey LCAXMKQKEYTFDM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
