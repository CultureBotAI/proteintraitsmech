    protein_label: "5F9T chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5f9t chain A (resolution 2.05 Å); binding residues: R290 I291 D315 D372 Y553 S582 R600 R662 Y695"
    source: CURATOR
