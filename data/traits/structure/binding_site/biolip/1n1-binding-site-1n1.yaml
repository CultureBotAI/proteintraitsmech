identifier: proteintraitsmech:BIOLIP_1N1
label: "1N1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(2-CHLORO-6-METHYLPHENYL)-2-({6-[4-(2-HYDROXYETHYL)PIPERAZIN-1-YL]-2-METHYLPYRIMIDIN-4-YL}AMINO)-1,3-THIAZOLE-5-CARBOXAMIDE (1N1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 5 PDB structures; ligand InChIKey ZBNZXTGUTAYRHI-UHFFFAOYSA-N.
