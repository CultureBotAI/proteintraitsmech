identifier: proteintraitsmech:BIOLIP_NKY
label: "NKY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-{[5-amino-1-(2-fluoro-6-methoxybenzene-1-carbonyl)-1H-1,2,4-triazol-3-yl]amino}-N-methylbenzamide (NKY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IKMWNWITXAECMQ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
