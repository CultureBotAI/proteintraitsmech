identifier: proteintraitsmech:BIOLIP_3UT
label: "3UT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S)-3-(5,6-dihydro-2H-pyran-3-yl)-1-fluoro-7-(2-fluoropyridin-3-yl)spiro[chromeno[2,3-c]pyridine-5,4'-[1,3]oxazol]-2'-amine (3UT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JAZOCUNZCUBRJX-DEOSSOPVSA-N.
