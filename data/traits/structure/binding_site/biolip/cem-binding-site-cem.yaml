identifier: proteintraitsmech:BIOLIP_CEM
label: "CEM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(1-CARBOXY-2-HYDROXY-4-OXO-BUTYL)-N-(3-OXO-CISPROPENYL)AMINE (CEM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DIQBZADGQQVQIO-WHFQOLMOSA-N.
