identifier: proteintraitsmech:BIOLIP_GW7
label: "GW7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{3-chloro-4-[(3-fluorobenzyl)oxy]phenyl}-6-ethylthieno[3,2-d]pyrimidin-4-amine (GW7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ABWPTSQSOHEFDW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
