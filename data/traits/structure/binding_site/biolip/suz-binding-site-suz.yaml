identifier: proteintraitsmech:BIOLIP_SUZ
label: "SUZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(1Z)-5-fluoro-2-methyl-1-{4-[methylsulfinyl]benzylidene}-1H-inden-3-yl]acetic acid (SUZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MLKXDPUZXIRXEP-LQVWSKNFSA-N.
