identifier: proteintraitsmech:BIOLIP_EW5
label: "EW5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-phenyl-3-pyridin-4-yl-~{N}-(pyridin-4-ylmethyl)pyrazole-4-carboxamide (EW5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IOZGCMLGYOLKER-UHFFFAOYSA-N.
