identifier: proteintraitsmech:BIOLIP_K87
label: "K87-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[6-[(4-tert-butylphenyl)sulfonylamino]-5-(2-methoxyphenoxy)-2-pyrimidin-2-yl-pyrimidin-4-yl]oxy-N-(2,6-dimethylphenyl)propanamide (K87) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MTNFANNLCUMCNB-UHFFFAOYSA-N.
