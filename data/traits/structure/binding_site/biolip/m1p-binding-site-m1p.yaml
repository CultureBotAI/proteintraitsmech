identifier: proteintraitsmech:BIOLIP_M1P
label: "M1P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-O-phosphono-alpha-D-mannopyranose (M1P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey HXXFSFRBOHSIMQ-RWOPYEJCSA-N.
