label: "3Z3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{2-amino-3-[5-fluoro-2-(methylamino)quinazolin-6-yl]-4-methylbenzoyl}-1-methyl-2,5-diphenyl-1,2-dihydro-3H-pyrazol-3-one (3Z3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HBWCGZWIVPNFPT-UHFFFAOYSA-N.
