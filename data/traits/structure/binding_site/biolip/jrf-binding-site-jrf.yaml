    protein_label: "7ZK3 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7zk3 chain A (resolution 2.85 Å); binding residues: R515 V543 Y598 V599 K603 E633 I636 Q637"
    source: CURATOR
