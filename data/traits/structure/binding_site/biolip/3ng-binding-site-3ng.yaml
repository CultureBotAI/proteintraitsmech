identifier: proteintraitsmech:BIOLIP_3NG
label: "3NG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(3-chlorophenyl)amino]benzo[c][2,6]naphthyridine-8-carboxylic acid (3NG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey MUOKSQABCJCOPU-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
