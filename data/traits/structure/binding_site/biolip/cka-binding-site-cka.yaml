identifier: proteintraitsmech:BIOLIP_CKA
label: "CKA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-Chlorokynurenic acid (CKA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 1 PDB structure; ligand InChIKey UAWVRVFHMOSAPU-UHFFFAOYSA-N.
