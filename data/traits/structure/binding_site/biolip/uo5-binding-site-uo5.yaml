identifier: proteintraitsmech:BIOLIP_UO5
label: "UO5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[5-chloranyl-2-(oxan-4-ylamino)pyrimidin-4-yl]-2-[2-oxidanylidene-2-(1,2,4,5-tetrahydro-3-benzazepin-3-yl)ethyl]-3~{H}-isoindol-1-one (UO5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CDIPSADLEIZARJ-UHFFFAOYSA-N.
