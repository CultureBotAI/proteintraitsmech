identifier: proteintraitsmech:BIOLIP_7HI
label: "7HI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R,5R)-7-[3-(biphenyl-4-ylcarbamoyl)-2-ethyl-5,6,7,8-tetrahydrocyclohepta[b]pyrrol-1(4H)-yl]-3,5-dihydroxyheptanoic acid (7HI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey OUBFNRRLNMXSKZ-JWQCQUIFSA-N.
