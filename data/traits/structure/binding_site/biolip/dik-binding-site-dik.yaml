identifier: proteintraitsmech:BIOLIP_DIK
label: "DIK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-{[4-(5-methyl-3-oxohex-4-en-1-yl)phenyl]amino}-5-oxopentanoic acid (DIK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SZAPYZUSRJAHQP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
