    protein_label: "3FO9 chain H (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3fo9 chain H (resolution 1.9 Å); binding residues: W33 K93 Y95 F96 Y97"
    source: CURATOR
