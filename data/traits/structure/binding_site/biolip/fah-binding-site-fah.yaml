identifier: proteintraitsmech:BIOLIP_FAH
label: "FAH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand fluoroacetic acid (FAH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 3 PDB structures; ligand InChIKey QEWYKACRFQMRMB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
