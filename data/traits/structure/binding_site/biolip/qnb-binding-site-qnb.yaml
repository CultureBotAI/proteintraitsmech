identifier: proteintraitsmech:BIOLIP_QNB
label: "QNB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-1-azabicyclo[2.2.2]oct-3-yl hydroxy(diphenyl)acetate (QNB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HGMITUYOCPPQLE-IBGZPJMESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:QNB
synonyms:
  - synonym_text: "(3R)-1-azabicyclo[2.2.2]oct-3-yl hydroxy(diphenyl)acetate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00720
    protein_label: "3UON chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3uon chain A (resolution 3.0 Å); binding residues: D103 Y104 S107 N108 F181 T190 A191 F195 W400 Y403 N404 Y426 C429"
    source: CURATOR
