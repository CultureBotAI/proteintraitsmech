identifier: proteintraitsmech:BIOLIP_N32
label: "N32-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,4-dihydroxy-3-({3-[(2S,4aS,8S,8aR)-8-methyl-3-methylidene-7-oxo-1,3,4,7,8,8a-hexahydro-2H-2,4a-ethanonaphthalen-8-yl]propanoyl}amino)benzoic acid (N32) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey DWUHGPPFFABTIY-RLWZQHMASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
