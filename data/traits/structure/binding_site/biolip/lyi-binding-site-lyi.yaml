identifier: proteintraitsmech:BIOLIP_LYI
label: "LYI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-1-octadecoxy-3-[oxidanyl-[(2~{R},3~{R},5~{S},6~{R})-2,3,4,5,6-pentakis(oxidanyl)cyclohexyl]oxy-phosphoryl]oxy-propan-2-yl] (5~{Z},8~{Z},11~{Z},14~{Z})-icosa-5,8,11,14-tetraenoate (LYI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WVZYOWMZDZYUMR-MCRWXTICSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
