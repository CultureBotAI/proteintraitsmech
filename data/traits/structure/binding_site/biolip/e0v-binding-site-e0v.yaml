identifier: proteintraitsmech:BIOLIP_E0V
label: "E0V-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(4-beta-D-glucopyranuronosylpiperazin-1-yl)-2,7-bis(methylamino)pyrido[3',2':4,5]thieno[3,2-d]pyrimidine (E0V) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FTTVFXSMHOJZPZ-KVMGVCFTSA-N.
