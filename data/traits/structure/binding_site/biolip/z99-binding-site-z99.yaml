identifier: proteintraitsmech:BIOLIP_Z99
label: "Z99-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(1S,2S)-2-carboxycyclopropyl]-3-(9H-xanthen-9-yl)-D-alanine (Z99) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey VLZBRVJVCCNPRJ-KPHUOKFYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
