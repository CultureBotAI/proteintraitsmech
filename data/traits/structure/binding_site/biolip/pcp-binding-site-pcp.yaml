identifier: proteintraitsmech:BIOLIP_PCP
label: "PCP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-ALPHA-PYROPHOSPHORYL-2-ALPHA,3-ALPHA-DIHYDROXY-4-BETA-CYCLOPENTANE-METHANOL-5-PHOSPHATE (PCP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey OICBXEWBKALHHB-MOJAZDJTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
