identifier: proteintraitsmech:BIOLIP_6UG
label: "6UG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-fluoranyl-~{N}-[2-(4-fluorophenyl)-6-methyl-pyridin-3-yl]-4-(trifluoromethyl)benzamide (6UG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FBACRSKJFHDTDV-UHFFFAOYSA-N.
