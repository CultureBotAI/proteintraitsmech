identifier: proteintraitsmech:BIOLIP_9ZP
label: "9ZP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[(4R)-5-cyclopentyl-4-ethyl-3a,4-dihydro-3H-[1,2,4]triazolo[4,3-f]pteridin-7-yl]amino]-N-cyclopropyl-3-methoxy-benzamide (9ZP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BNAAGNVFCJFJIF-AUSIDOKSSA-N.
