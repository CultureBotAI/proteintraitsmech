identifier: proteintraitsmech:BIOLIP_OCD
label: "OCD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand octadecanal (OCD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FWWQKRXKHIRPJY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:OCD
synonyms:
  - synonym_text: "octadecanal-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A0A193CDY9
    protein_label: "5K52 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5k52 chain A (resolution 2.4 Å); binding residues: Y21 I24 I27 V28 G31 E32 E60 F117 A118 A121 Y125 E144"
    source: CURATOR
  - protein_id: UniProtKB:Q54765
