label: "2ZW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(2-chlorophenyl)-5-methyl-N-[4-(propan-2-yl)phenyl]-1,2-oxazole-4-carboxamide (2ZW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WRQYTVUHKWFTAU-UHFFFAOYSA-N.
