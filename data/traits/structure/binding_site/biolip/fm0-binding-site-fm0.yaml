identifier: proteintraitsmech:BIOLIP_FM0
label: "FM0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-3-(fluoromethyl)-3-hydroxy-5-{[(S)-hydroxy(phosphonooxy)phosphoryl]oxy}pentanoic acid (FM0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YIGLDWRZXXHIGZ-ZCFIWIBFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
