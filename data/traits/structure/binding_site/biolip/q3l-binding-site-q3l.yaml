label: "Q3L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-3-[2-[(2~{S},3~{R},4~{S},5~{R},6~{R})-6-[(1~{R},2~{R})-1-azanyl-2-oxidanyl-propyl]-3,4,5-tris(oxidanyl)oxan-2-yl]sulfanyl-1~{H}-imidazol-5-yl]-2-(trimethyl-$l^{4}-azanyl)propanoic acid (Q3L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MZDFOQLXMBUKGA-HNXDCMGUSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
