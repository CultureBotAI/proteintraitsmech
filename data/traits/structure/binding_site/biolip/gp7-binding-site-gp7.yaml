identifier: proteintraitsmech:BIOLIP_GP7
label: "GP7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R)-2-{[(S)-(2-aminoethoxy)(hydroxy)phosphoryl]oxy}-1-[(pentadecanoyloxy)methyl]ethyl (12E)-hexadeca-9,12-dienoate (GP7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NMIBJXZODRRZEA-NTSPIXPOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
