    protein_label: "3TYZ chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3tyz chain B (resolution 2.07 Å); binding residues: D96 N115 I117 M139 D185 F190 G217 K221 R255"
    source: CURATOR
