identifier: proteintraitsmech:BIOLIP_4VN
label: "4VN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-{5-[2-chloro-5-(hydroxymethyl)phenyl]pyridin-2-yl}piperidine-4-carboxylic acid (4VN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZHEDDGBFOGXDOY-UHFFFAOYSA-N.
