identifier: proteintraitsmech:BIOLIP_A1IB6
label: "A1IB6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[[(2~{R},3~{S},4~{R},5~{R})-5-[4-azanyl-5-(2-pyridin-3-ylethynyl)pyrrolo[2,3-d]pyrimidin-7-yl]-3,4-bis(oxidanyl)oxolan-2-yl]methyl]-3-cyano-~{N}-ethyl-4-methoxy-benzenesulfonamide (A1IB6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CNRYAFNRBRLDCL-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
