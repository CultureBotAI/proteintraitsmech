identifier: proteintraitsmech:BIOLIP_P7K
label: "P7K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{R})-8-methoxy-3-methyl-3-oxidanyl-2,4-dihydrobenzo[a]anthracene-1,7,12-trione (P7K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XZLGWJORNHETKI-HXUWFJFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
