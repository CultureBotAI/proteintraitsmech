identifier: proteintraitsmech:BIOLIP_TVJ
label: "TVJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [6-methyl-4-[(~{E})-(oxamoylhydrazinylidene)methyl]-5-oxidanyl-pyridin-3-yl]methyl dihydrogen phosphate (TVJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey QXOGMDGTZNDNSY-QLKAYGNNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:TVJ
synonyms:
  - synonym_text: "[6-methyl-4-[(~{E})-(oxamoylhydrazinylidene)methyl]-5-oxidanyl-pyridin-3-yl]methyl dihydrogen phosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P18757
    protein_label: "8J6N chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8j6n chain A (resolution 1.9 Å); binding residues: G90 L91 Y114 E157 N161 D187 S209 T211 K212 E339 S340 T355 R375"
    source: CURATOR
