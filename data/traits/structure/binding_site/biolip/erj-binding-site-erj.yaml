identifier: proteintraitsmech:BIOLIP_ERJ
label: "ERJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 9-beta-D-ribofuranosyl-6-(thiophen-3-yl)-9H-purine (ERJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey UXKNTUXJYSDVTH-LHNIVKCTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
