identifier: proteintraitsmech:BIOLIP_EPY
label: "EPY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-HYDROXY-2-S-GLUTATHIONYL-3-PARA-NITROPHENOXY-PROPANE (EPY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YWXHXYSGHBAIBL-KKUMJFAQSA-N.
