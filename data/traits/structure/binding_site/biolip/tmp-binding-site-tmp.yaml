identifier: proteintraitsmech:BIOLIP_TMP
label: "TMP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand THYMIDINE-5'-PHOSPHATE (TMP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 22 binding-site occurrences across 18 PDB structures; ligand InChIKey GYOZYWVXFNDGLU-XLPZGREQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
