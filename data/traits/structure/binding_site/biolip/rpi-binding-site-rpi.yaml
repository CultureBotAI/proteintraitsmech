identifier: proteintraitsmech:BIOLIP_RPI
label: "RPI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand phospho-arginine (RPI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CCTIOCVIZPCTGO-BYPYZUCNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
