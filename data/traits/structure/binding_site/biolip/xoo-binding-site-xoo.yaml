identifier: proteintraitsmech:BIOLIP_XOO
label: "XOO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{2-[({4-[(2P)-2-(2-aminopyridin-3-yl)-5-phenyl-3H-imidazo[4,5-b]pyridin-3-yl]phenyl}methyl)amino]ethyl}-2-hydroxybenzaldehyde (XOO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OMBAVJOHMDVMKX-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
