    protein_label: "2BSW chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2bsw chain A (resolution 1.63 Å); binding residues: M75 A76 T77 R82 E83 K85 G87 S88 R111 S113 A114 G116 Y117 Y118 K120"
