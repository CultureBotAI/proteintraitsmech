identifier: proteintraitsmech:BIOLIP_F5O
label: "F5O-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[(1R)-2-[5-(2-fluoranyl-3-methoxy-phenyl)-3-[[2-fluoranyl-6-(trifluoromethyl)phenyl]methyl]-4-methyl-2,6-bis(oxidanylidene)pyrimidin-1-yl]-1-phenyl-ethyl]amino]butanoic acid (F5O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HEAUOKZIVMZVQL-VWLOTQADSA-N.
