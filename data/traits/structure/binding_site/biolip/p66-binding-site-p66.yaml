identifier: proteintraitsmech:BIOLIP_P66
label: "P66-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-chloro-N-cyclopropyl-3-{[1-(2,6-difluorophenyl)-1H-pyrazolo[3,4-d]pyridazin-4-yl]amino}benzamide (P66) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZWVCUFJZBBAOFI-UHFFFAOYSA-N.
