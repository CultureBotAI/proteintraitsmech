identifier: proteintraitsmech:BIOLIP_9NY
label: "9NY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Hexacosanoyl-CoA (9NY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FHLYYFPJDVYWQH-CPIGOPAHSA-N.
