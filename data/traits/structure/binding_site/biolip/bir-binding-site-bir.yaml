identifier: proteintraitsmech:BIOLIP_BIR
label: "BIR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[3-[(1-AMINOETHYL)(HYDROXY)PHOSPHORYL]-2-(1,1'-BIPHENYL-4-YLMETHYL)PROPANOYL]ALANINE (BIR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CWJPVKSBGVPXRD-QMTMVMCOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
