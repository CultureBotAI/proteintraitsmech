identifier: proteintraitsmech:BIOLIP_K7I
label: "K7I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand L-alanyl-N-[(1S,2R)-1-benzyl-2-hydroxypropyl]-L-alaninamide (K7I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CPAOOGAUUDSJCS-FMSGJZPZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
