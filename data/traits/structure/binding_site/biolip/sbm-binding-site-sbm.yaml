identifier: proteintraitsmech:BIOLIP_SBM
label: "SBM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[(2~{S})-2-decanoyloxy-3-dodecanoyloxy-propoxy]-oxidanyl-phosphoryl]oxyethyl-trimethyl-azanium (SBM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YCHNJZJVKCSKTN-NDEPHWFRSA-O.
