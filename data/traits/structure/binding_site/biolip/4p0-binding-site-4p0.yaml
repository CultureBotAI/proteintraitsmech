identifier: proteintraitsmech:BIOLIP_4P0
label: "4P0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(1R,6R)-9-azabicyclo[4.2.1]non-2-en-2-yl]ethanone (4P0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SGNXVBOIDPPRJJ-PSASIEDQSA-N.
