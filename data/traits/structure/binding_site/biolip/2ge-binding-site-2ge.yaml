identifier: proteintraitsmech:BIOLIP_2GE
label: "2GE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N~4~-cyclopropyl-6-(2,3-dichlorophenyl)pyrimidine-2,4-diamine (2GE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PNMYJIOQIAEYQL-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
