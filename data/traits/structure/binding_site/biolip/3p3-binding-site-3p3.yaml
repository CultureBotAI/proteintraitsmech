identifier: proteintraitsmech:BIOLIP_3P3
label: "3P3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1S,2R)-2-hydroxy-1-(hydroxycarbamoyl)propyl]-4-(4-phenylbuta-1,3-diyn-1-yl)benzamide (3P3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VUYMSCCEGRLBAF-BEFAXECRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
