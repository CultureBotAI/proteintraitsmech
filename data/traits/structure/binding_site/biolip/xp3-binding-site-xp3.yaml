identifier: proteintraitsmech:BIOLIP_XP3
label: "XP3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5~{R})-2-(hydroxymethyl)-3-[(~{E})-non-3-enyl]-5-oxidanyl-cyclohex-2-en-1-one (XP3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UIYPBPASYFNZQB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
