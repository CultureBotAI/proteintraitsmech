identifier: proteintraitsmech:BIOLIP_EQJ
label: "EQJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E)-N~2~-({3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene)-L-arginine (EQJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PFHOMURYEGODJI-GBCOYWTISA-N.
