    protein_label: "6PDJ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6pdj chain A (resolution 1.81 Å); binding residues: L251 A271 K273 M280 F285 N290 I314 T316 Y318 M319 G322 L371 D382 F383 G384"
    source: CURATOR
