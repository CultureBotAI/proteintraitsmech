identifier: proteintraitsmech:BIOLIP_ODJ
label: "ODJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{4-[(6-methoxypyrazolo[1,5-a]pyridine-3-carbonyl)amino]-3-methylphenyl}-1-methyl-1H-indazole-3-carboxamide (ODJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LXWXQRLCBZDGSZ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ODJ
synonyms:
