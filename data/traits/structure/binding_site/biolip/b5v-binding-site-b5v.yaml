identifier: proteintraitsmech:BIOLIP_B5V
label: "B5V-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 9-(5-O-{(S)-hydroxy[(2-hydroxybenzene-1-carbonyl)oxy]phosphoryl}-alpha-L-lyxofuranosyl)-9H-purin-6-amine (B5V) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AESBJQJIAHTCHE-MZXFEWSRSA-N.
