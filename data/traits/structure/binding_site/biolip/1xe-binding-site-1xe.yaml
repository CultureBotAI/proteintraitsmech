definition: >-
  A structure-derived ligand-binding site at which the ligand [5-(6-amino-9H-purin-9-yl)-4-hydroxy-3-(phosphonooxy)furan-2-yl]methyl (3R)-4-{[3-({(E)-2-[(2,2-dihydroxyethyl)sulfanyl]ethenyl}amino)-3-oxopropyl]amino}-3-hydroxy-2,2-dimethyl-4-oxobutyl dihydrogen diphosphate (1XE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IWZWXZGRAJOFTE-QWNKOJSDSA-N.
