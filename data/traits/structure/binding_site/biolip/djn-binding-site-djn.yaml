    protein_label: "4DO4 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4do4 chain B (resolution 1.4 Å); binding residues: W33 D78 D79 C127 K154 D156 S188 R213 D217"
    source: CURATOR
