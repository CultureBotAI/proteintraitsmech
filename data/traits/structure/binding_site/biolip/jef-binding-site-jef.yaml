identifier: proteintraitsmech:BIOLIP_JEF
label: "JEF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand O-(O-(2-AMINOPROPYL)-O'-(2-METHOXYETHYL)POLYPROPYLENE GLYCOL 500) (JEF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 8 binding-site occurrences across 6 PDB structures; ligand InChIKey ICCXIDTYQFYPNV-RUMGZKRTSA-N.
