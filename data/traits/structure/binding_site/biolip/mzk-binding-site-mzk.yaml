identifier: proteintraitsmech:BIOLIP_MZK
label: "MZK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[4-(trifluoromethyl)phenyl]-3,4-dihydro-1~{H}-quinolin-2-one (MZK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WNVWLPPJRMIRBG-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
