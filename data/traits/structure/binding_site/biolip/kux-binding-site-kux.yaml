    protein_label: "7TZ4 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7tz4 chain A (resolution 1.69 Å); binding residues: H244 N245 F246 C250 G317 S318 R319 V339 L340 G341 M342 A343 I347 D423 V435 K529"
    source: CURATOR
