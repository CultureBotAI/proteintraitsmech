label: "R1T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{4-[(4-AMINO-2-METHYLPYRIMIDIN-5-YL)METHYL]-5-[(1R)-1-HYDROXYETHYL]-3-METHYL-2-THIENYL}ETHYL TRIHYDROGEN DIPHOSPHATE (R1T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey ORVRYSKZCUVOLA-SECBINFHSA-N.
