identifier: proteintraitsmech:BIOLIP_JEY
label: "JEY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[2-(5-methoxy-2-phenyl-1H-indol-3-yl)ethyl]acetamide (JEY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OFCLARYYBGKCHN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:JEY
synonyms:
  - synonym_text: "N-[2-(5-methoxy-2-phenyl-1H-indol-3-yl)ethyl]acetamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00268
    protein_label: "6ME8 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6me8 chain A (resolution 3.1 Å); binding residues: G121 V124 I125 N175 F192 L267 N268 Y294 A297 Y298"
    source: CURATOR
