identifier: proteintraitsmech:BIOLIP_LUN
label: "LUN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5-fluoro-1H-indol-2-yl)[(3R)-1'-[(3R)-piperidin-3-yl]spiro[indole-3,3'-pyrrolidin]-1(2H)-yl]methanone (LUN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ABNVVKAVWJYHCL-KBMIEXCESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
