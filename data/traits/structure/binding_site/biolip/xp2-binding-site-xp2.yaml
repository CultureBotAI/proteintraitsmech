identifier: proteintraitsmech:BIOLIP_XP2
label: "XP2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(R)-hydroxy({(1S,2R,3R,4R,5S,6S)-3,4,5-trihydroxy-2-(alpha-D-mannopyranosyloxy)-6-[(6-O-undecanoyl-beta-D-mannopyranosyl)oxy]cyclohexyl}oxy)phosphoryl]oxy}-2-(octanoyloxy)propyl undecanoate (XP2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey QGXVEMBXLAEQBM-PUGXMYIYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
