identifier: proteintraitsmech:BIOLIP_F7N
label: "F7N-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3~{S},4~{S})-3-methoxyoxan-4-yl]-[(1~{R},3~{S})-3-propan-2-yl-3-[[3-(trifluoromethyl)-7,8-dihydro-5~{H}-1,6-naphthyridin-6-yl]carbonyl]cyclopentyl]azanium (F7N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey MTMDXAIUENDNDL-RJSMDTJLSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
