  title: Binding of ligand MIQ at the ligand MIQ-binding site
  description: Residue-level ligand contact transcribed from BioLiP2 for PDB 8tnq chain C. Residue numbering
    is the PDB author frame BioLiP reports; each residue's identity was checked against BioLiP's own receptor
    sequence. 5 binding residues.
