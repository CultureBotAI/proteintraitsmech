identifier: proteintraitsmech:BIOLIP_MIQ
label: "MIQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(3S)-2,6-dioxopiperidin-3-yl]-5-(morpholin-4-yl)-1H-isoindole-1,3(2H)-dione (MIQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CCCSRHUSXCBFJZ-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:MIQ
synonyms:
  - synonym_text: "2-[(3S)-2,6-dioxopiperidin-3-yl]-5-(morpholin-4-yl)-1H-isoindole-1,3(2H)-dione-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0AEX9
    protein_label: "8TNQ chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8tnq chain C (resolution 2.41 Å); binding residues: F18 C19 I21 C22 G23"
    source: CURATOR
causal_graphs:
