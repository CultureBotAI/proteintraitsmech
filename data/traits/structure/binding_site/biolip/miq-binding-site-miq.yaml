      snippet: F18 C19 I21 C22 G23
      notes: 'BioLiP2 record line for PDB 8tnq chain C, ligand MIQ: binding-site residues in PDB author
        numbering (column 8 of BioLiP_nr.txt), cross-checked against BioLiP''s own receptor sequence via
        its renumbered column 9. BioLiP cites PMID:38484051 for this structure. BioLiP maps this chain
        to several accessions (P0AEX9,Q13422), a chimeric or fusion construct, so no single protein is
