identifier: proteintraitsmech:BIOLIP_MQW
label: "MQW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4~{R})-2-[(1~{R})-1-[[(2~{S})-2-[[(2~{S})-3-methyl-2-[[(4~{Z},6~{S},9~{S},12~{S})-2,8,11-tris(oxidanylidene)-6,9-di(propan-2-yl)-1,4,7,10-tetrazabicyclo[10.3.0]pentadec-4-en-5-yl]amino]butanoyl]amino]-3-phenyl-propanoyl]amino]-3-oxidanyl-3-oxidanylidene-propyl]-4,5-dihydro-1,3-thiazole-4-carboxylic acid (MQW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PXXAKUWJCGKVNK-JQXGNVTOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
