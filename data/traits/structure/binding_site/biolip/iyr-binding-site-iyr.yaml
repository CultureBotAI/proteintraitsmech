identifier: proteintraitsmech:BIOLIP_IYR
label: "IYR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-IODO-TYROSINE (IYR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 3 PDB structures; ligand InChIKey UQTZMGFTRHFAAM-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
