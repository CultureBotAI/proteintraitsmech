identifier: proteintraitsmech:BIOLIP_QRP
label: "QRP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,8aS)-3-(1H-indol-3-ylmethyl)hexahydropyrrolo[1,2-a]pyrazine-1,4-dione (QRP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey RYFZBPVMVYTEKZ-KBPBESRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:QRP
synonyms:
  - synonym_text: "(3S,8aS)-3-(1H-indol-3-ylmethyl)hexahydropyrrolo[1,2-a]pyrazine-1,4-dione-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q4WAW7
    protein_label: "3O2K chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3o2k chain A (resolution 2.4 Å); binding residues: G93 M94 V95 L96 E102 Y203 Y205 Y435"
    source: CURATOR
