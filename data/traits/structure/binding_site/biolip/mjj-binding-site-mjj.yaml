    protein_label: "8Y8B chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8y8b chain A (resolution 3.01 Å); binding residues: N26 Y28 L79 K80 S82 Y84 W89 S246"
    source: CURATOR
