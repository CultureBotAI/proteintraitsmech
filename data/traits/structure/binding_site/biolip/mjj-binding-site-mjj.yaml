identifier: proteintraitsmech:BIOLIP_MJJ
label: "MJJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 9-O-acetyl-5-acetamido-3,5-dideoxy-D-glycero-alpha-D-galacto-non-2-ulopyranosidonic acid (MJJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NIEBVOWRRSQMQG-KXEMTNKZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
