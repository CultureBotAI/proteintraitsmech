identifier: proteintraitsmech:BIOLIP_LMO
label: "LMO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand dodecyl 6-O-alpha-D-galactopyranosyl-beta-D-glucopyranoside (LMO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HBVAWIPMNSJELA-RWNQQKCBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
