identifier: proteintraitsmech:BIOLIP_IFM
label: "IFM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-HYDROXYMETHYL-3,4-DIHYDROXYPIPERIDINE (IFM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey QPYJXFZUIJOGNX-HSUXUTPPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
