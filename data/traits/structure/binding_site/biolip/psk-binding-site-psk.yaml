identifier: proteintraitsmech:BIOLIP_PSK
label: "PSK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3R,4S)-4-HYDROXY-3-METHYL-2-OXOHEXYL]PHOSPHONIC ACID (PSK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UXHVQAJQXZWLAW-RITPCOANSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
