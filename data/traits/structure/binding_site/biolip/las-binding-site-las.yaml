identifier: proteintraitsmech:BIOLIP_LAS
label: "LAS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-acetyl-S-({(2R,3S,4R)-3-hydroxy-2-[(1S)-1-hydroxy-2-methylpropyl]-4-methyl-5-oxopyrrolidin-2-yl}carbonyl)cysteine (LAS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DAQAKHDKYAWHCG-MJZHQVMOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
