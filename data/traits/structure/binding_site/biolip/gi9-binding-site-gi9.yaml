identifier: proteintraitsmech:BIOLIP_GI9
label: "GI9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand tert-butyl (2S)-6-azanyl-2-[[(2R,3S)-3-(1H-indol-3-yl)-2-[[4-(2-oxidanylidene-3H-benzimidazol-1-yl)piperidin-1-yl]carbonylamino]butanoyl]amino]hexanoate (GI9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WFCIXKAZBUIFTR-PKIMSIDOSA-N.
