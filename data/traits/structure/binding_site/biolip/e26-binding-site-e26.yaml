definition: >-
  A structure-derived ligand-binding site at which the ligand (4~{S},5~{R},6~{Z},9~{S},10~{S},12~{E})-16-(ethylamino)-4,5-dimethyl-9,10,18-tris(oxidanyl)-3-oxabicyclo[12.4.0]octadeca-1(14),6,12,15,17-pentaene-2,8-dione (E26) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MWUFVYLAWAXDHQ-HMNLTAHHSA-N.
