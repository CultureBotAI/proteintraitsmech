identifier: proteintraitsmech:BIOLIP_KVI
label: "KVI-binding site"
definition: >-
  A structure-derived ligand-binding site at which ligand KVI is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ARYLRJRVHGPIHO-XPRREXDTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:KVI
canonical_examples:
  - protein_id: UniProtKB:O38732
    protein_label: "3DCK chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3dck chain A (resolution 1.8 Å); binding residues: R8 N25 G27 D29 D30 G48 I50"
    source: CURATOR
