label: "WJX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (6P)-N-(1,3-dimethyl-1H-pyrazole-4-sulfonyl)-6-[3-(3,3,3-trifluoro-2,2-dimethylpropoxy)-1H-pyrazol-1-yl]-2-[(4S)-2,2,4-trimethylpyrrolidin-1-yl]pyridine-3-carboxamide (WJX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MVRHVFSOIWFBTE-INIZCTEOSA-N.
