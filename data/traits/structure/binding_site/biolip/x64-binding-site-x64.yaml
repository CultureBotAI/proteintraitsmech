identifier: proteintraitsmech:BIOLIP_X64
label: "X64-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{[4-amino-5-(2-nitrobenzoyl)-1,3-thiazol-2-yl]amino}benzenesulfonamide (X64) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JXJHPQHLHQTQQI-UHFFFAOYSA-N.
