identifier: proteintraitsmech:BIOLIP_LFD
label: "LFD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R)-1-(2,4-dichlorophenyl)-2-(1H-imidazol-1-yl)ethyl {4-[4-(3,4-dichlorophenyl)piperazin-1-yl]phenyl}carbamate (LFD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RKYWJGOKHMLHHS-MHZLTWQESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
