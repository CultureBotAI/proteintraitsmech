identifier: proteintraitsmech:BIOLIP_CTN
label: "CTN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-AMINO-1-BETA-D-RIBOFURANOSYL-2(1H)-PYRIMIDINONE (CTN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 5 PDB structures; ligand InChIKey UHDGCWIWMRVCDJ-XVFCMESISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
