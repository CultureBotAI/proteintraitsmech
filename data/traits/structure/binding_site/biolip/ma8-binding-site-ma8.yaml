identifier: proteintraitsmech:BIOLIP_MA8
label: "MA8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2R,3R,4S,5S,6R)-2,3,4,5,6-pentahydroxycyclohexyl 2-(L-cysteinylamino)-2-deoxy-alpha-D-glucopyranoside (MA8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZGXSCMBZZVXWGF-BSEFFJTHSA-N.
