identifier: proteintraitsmech:BIOLIP_ULL
label: "ULL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand propan-2-yl {4-[(5S)-1-(4-bromobenzoyl)-5-phenyl-4,5-dihydro-1H-pyrazol-3-yl]phenyl}carbamate (ULL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RWCWONWFSWXBCW-DEOSSOPVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ULL
synonyms:
  - synonym_text: "propan-2-yl {4-[(5S)-1-(4-bromobenzoyl)-5-phenyl-4,5-dihydro-1H-pyrazol-3-yl]phenyl}carbamate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P10415
    protein_label: "8U27 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8u27 chain A; binding residues: F71 M74 L78 L80 A85 R88 V92 A108 F112 M116 W173 L174 L176"
    source: CURATOR
