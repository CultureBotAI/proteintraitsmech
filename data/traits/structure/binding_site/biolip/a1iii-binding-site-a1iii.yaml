definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(3~{R})-3-(cyclopropylmethylamino)piperidin-1-yl]-1-[(1~{R})-1-[4-[5-(dimethylamino)pyridin-3-yl]-1,2,3-triazol-1-yl]ethyl]pyridin-2-one (A1III) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SIMGHJKPZKGPGZ-WIYYLYMNSA-N.
