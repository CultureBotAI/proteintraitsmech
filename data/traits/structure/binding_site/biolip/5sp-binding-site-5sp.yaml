identifier: proteintraitsmech:BIOLIP_5SP
label: "5SP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-O-phosphono-D-xylulose (5SP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FNZLKVNUWIIPSJ-RFZPGFLSSA-N.
