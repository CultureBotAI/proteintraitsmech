    note: "BioLiP2 binding-site occurrence in PDB 5mo4 chain A (resolution 2.17 Å); binding residues: L267 Y272 A288 K290 E305 V308 M309 I332 I334 F336 M337 H380 L389 A399 D400 F401"
    source: CURATOR
