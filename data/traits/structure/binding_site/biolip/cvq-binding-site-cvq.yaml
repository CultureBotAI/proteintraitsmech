identifier: proteintraitsmech:BIOLIP_CVQ
label: "CVQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[3,5-bis(fluoranyl)-4-[[3-[5-methoxy-4-[(3-methoxypyridin-4-yl)amino]pyrimidin-2-yl]indazol-1-yl]methyl]phenoxy]ethanol (CVQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QVOGVAVHOLLLAZ-UHFFFAOYSA-N.
