identifier: proteintraitsmech:BIOLIP_P5V
label: "P5V-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-1'-(cyclopropanecarbonyl)-5-(quinoxalin-6-yl)spiro[indole-3,2'-pyrrolidin]-2(1H)-one (P5V) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PXPGVPPGCPSCSN-QHCPKHFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
