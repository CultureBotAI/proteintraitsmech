identifier: proteintraitsmech:BIOLIP_I4L
label: "I4L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-[2-[4-[3,4-bis(oxidanyl)-9,10-bis(oxidanylidene)anthracen-2-yl]sulfonylpiperazin-1-yl]-2-oxidanylidene-ethyl]-2-oxidanyl-butanedioic acid (I4L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PYHLNZSMOIJZLQ-DEOSSOPVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
