identifier: proteintraitsmech:BIOLIP_DS0
label: "DS0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(4R)-4-azanyl-4,5-dihydro-1,2-oxazol-3-yl] dihydrogen phosphate (DS0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey SFMNESRSKJTEMJ-UWTATZPHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
