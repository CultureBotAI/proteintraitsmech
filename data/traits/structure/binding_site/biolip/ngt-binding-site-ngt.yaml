identifier: proteintraitsmech:BIOLIP_NGT
label: "NGT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3AR,5R,6S,7R,7AR-5-HYDROXYMETHYL-2-METHYL-5,6,7,7A-TETRAHYDRO-3AH-PYRANO[3,2-D]THIAZOLE-6,7-DIOL (NGT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 9 binding-site occurrences across 9 PDB structures; ligand InChIKey DRHXTSWSUAJOJZ-FMDGEEDCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
