identifier: proteintraitsmech:BIOLIP_G45
label: "G45-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[3-[(4~{S})-6-azanyl-5-cyano-3-methyl-4-propan-2-yl-2~{H}-pyrano[2,3-c]pyrazol-4-yl]-5-cyano-phenyl]-~{N},~{N}-dimethyl-thiophene-2-sulfonamide (G45) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey KSCQEXGCEZGBHT-DEOSSOPVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
