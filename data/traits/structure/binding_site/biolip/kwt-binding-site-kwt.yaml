label: "KWT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,6BR,9AS,11R,11BR)-9A,11B-DIMETHYL-1-[(METHYLOXY)METHYL]-3,6,9-TRIOXO-1,6,6B,7,8,9,9A,10,11,11B-DECAHYDRO-3H-FURO[4, 3,2-DE]INDENO[4,5-H][2]BENZOPYRAN-11-YL ACETATE (KWT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QDLHCMPXEPAAMD-QAIWCSMKSA-N.
