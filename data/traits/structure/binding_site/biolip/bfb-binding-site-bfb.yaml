identifier: proteintraitsmech:BIOLIP_BFB
label: "BFB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1S)-1-(AMINOCARBONYL)-4-(ETHANIMIDOYLAMINO)BUTYL]BENZAMIDE (BFB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey LWFFSSMDFWZNNW-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
