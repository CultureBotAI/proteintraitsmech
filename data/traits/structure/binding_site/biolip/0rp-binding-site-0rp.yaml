identifier: proteintraitsmech:BIOLIP_0RP
label: "0RP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ethyl (2R,4S)-4-{[3,5-bis(trifluoromethyl)benzyl](methoxycarbonyl)amino}-2-ethyl-6-(trifluoromethyl)-3,4-dihydroquinoline-1(2H )-carboxylate (0RP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CMSGWTNRGKRWGS-NQIIRXRSSA-N.
