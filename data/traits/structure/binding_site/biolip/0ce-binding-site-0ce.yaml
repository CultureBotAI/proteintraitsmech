identifier: proteintraitsmech:BIOLIP_0CE
label: "0CE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-methyl-11-(1-methylethyl)-8-[(2S)-tetrahydro-2H-pyran-2-yl]-2,11,12,13-tetrahydro-4H-indazolo[5,4-a]pyrrolo[3,4-c]carbazol-4-one (0CE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JPKZOLAMWIKKME-QHCPKHFHSA-N.
