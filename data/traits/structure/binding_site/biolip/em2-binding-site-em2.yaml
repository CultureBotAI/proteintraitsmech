identifier: proteintraitsmech:BIOLIP_EM2
label: "EM2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (6-ethynyl-4-methanoyl-5-oxidanyl-pyridin-3-yl)methyl dihydrogen phosphate (EM2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OAIRLJMOEFCXML-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
