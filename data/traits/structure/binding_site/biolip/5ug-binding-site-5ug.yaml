identifier: proteintraitsmech:BIOLIP_5UG
label: "5UG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3~{S})-2,2-dimethyl-3-oxidanyl-4-oxidanylidene-4-[[3-oxidanylidene-3-(2-sulfanylethylamino)propyl]amino]butyl] phosphono hydrogen phosphate (5UG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UQURMDBHCKDEJS-SECBINFHSA-N.
