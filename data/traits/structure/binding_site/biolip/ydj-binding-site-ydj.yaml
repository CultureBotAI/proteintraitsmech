identifier: proteintraitsmech:BIOLIP_YDJ
label: "YDJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(3-fluorophenyl)-N-[(3S)-3-piperidyl]-3-ureido-thiophene-2-carboxamide (YDJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey IAYGCINLNONXHY-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
