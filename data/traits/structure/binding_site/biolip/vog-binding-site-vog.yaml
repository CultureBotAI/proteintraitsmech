identifier: proteintraitsmech:BIOLIP_VOG
label: "VOG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2S,3R,4S,5S)-5-[(1,3-dihydroxypropan-2-yl)amino]-1-(hydroxymethyl)cyclohexane-1,2,3,4-tetrol (VOG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FZNCGRZWXLXZSZ-CIQUZCHMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
