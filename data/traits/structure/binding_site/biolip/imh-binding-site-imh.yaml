identifier: proteintraitsmech:BIOLIP_IMH
label: "IMH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,4-DIDEOXY-4-AZA-1-(S)-(9-DEAZAHYPOXANTHIN-9-YL)-D-RIBITOL (IMH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey IWKXDMQDITUYRK-KUBHLMPHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
