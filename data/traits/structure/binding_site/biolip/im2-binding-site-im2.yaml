identifier: proteintraitsmech:BIOLIP_IM2
label: "IM2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5R)-5-[(1S,2R)-1-formyl-2-hydroxypropyl]-3-[(2-{[(E)-iminomethyl]amino}ethyl)sulfanyl]-4,5-dihydro-1H-pyrrole-2-carbox ylic acid (IM2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey UACUABDJLSUFFC-IWSPIJDZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
