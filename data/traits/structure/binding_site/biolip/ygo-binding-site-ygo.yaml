identifier: proteintraitsmech:BIOLIP_YGO
label: "YGO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1P)-N-(5-tert-butyl-2-{[(3R)-hexan-3-yl]oxy}phenyl)-1-(2,5-dimethoxyphenyl)-5-methyl-1H-1,2,3-triazole-4-carboxamide (YGO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HPFQSDGKIYUBEE-HXUWFJFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
