synonyms:
  - synonym_text: "(2R)-2-hydroxy-3-(phosphonooxy)propyl (9E)-octadec-9-enoate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P43657
    protein_label: "9ITE chain R (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 9ite chain R (resolution 3.06 Å); binding residues: Y97 A151 F172 W177 I188 Y252 R256"
    source: CURATOR
