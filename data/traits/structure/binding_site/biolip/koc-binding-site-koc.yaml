identifier: proteintraitsmech:BIOLIP_KOC
label: "KOC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{5-[difluoro(phosphono)methyl]-1-benzothiophene-2-carbonyl}-3-methyl-L-valyl-L-prolyl-N,N-dimethyl-N~3~-[4-(1,3-thiazol-2-yl)phenyl]-beta-alaninamide (KOC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KJJHAYNANYPNEE-ABYGYWHVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
