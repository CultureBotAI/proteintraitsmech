identifier: proteintraitsmech:BIOLIP_1PZ
label: "1PZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3R,4E)-2-(dodecanoylamino)-3-hydroxyoctadec-4-en-1-yl dihydrogen phosphate (1PZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KXEMZGPJXBKYJP-VARSQMIESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
