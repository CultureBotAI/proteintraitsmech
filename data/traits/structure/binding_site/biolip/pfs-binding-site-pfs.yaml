    protein_label: "8XYD chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8xyd chain A (resolution 2.9 Å); binding residues: W73 Y77 F98 F174 Y177 I187 H188 F190 I191 S194 W255"
    source: CURATOR
