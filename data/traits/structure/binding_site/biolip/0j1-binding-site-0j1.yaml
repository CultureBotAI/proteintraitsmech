identifier: proteintraitsmech:BIOLIP_0J1
label: "0J1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(R)-hydroxy{[(1S,2R,3S,4S,5R,6R)-2,3,4,6-tetrahydroxy-5-(phosphonooxy)cyclohexyl]oxy}phosphoryl]oxy}propane-1,2-diyl dinonanoate (0J1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey IELCLCXLJSIZNX-ZAIPYKEWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
