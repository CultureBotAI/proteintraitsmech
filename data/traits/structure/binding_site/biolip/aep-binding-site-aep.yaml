identifier: proteintraitsmech:BIOLIP_AEP
label: "AEP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[(1-AMINO-2-CARBOXY-ETHYL)-HYDROXY-PHOSPHINOYL]-2-METHYL-PROPIONIC ACID (AEP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NJOTXUMMTTYQMQ-RFZPGFLSSA-N.
