identifier: proteintraitsmech:BIOLIP_B4J
label: "B4J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,4-dimethoxy-N-({3-[(5-methyl-4,5,6,7-tetrahydro[1,3]thiazolo[5,4-c]pyridin-2-yl)carbamoyl]phenyl}methyl)benzamide (B4J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FDNORQUIWSIWKF-UHFFFAOYSA-N.
