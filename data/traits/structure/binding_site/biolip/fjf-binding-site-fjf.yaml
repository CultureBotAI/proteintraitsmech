identifier: proteintraitsmech:BIOLIP_FJF
label: "FJF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(2~{S},3~{R},4~{S},5~{R})-5-(hydroxymethyl)-3,4-bis(oxidanyl)oxolan-2-yl]-1~{H}-pyrimidine-2,4-dione (FJF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PTJWIQPHWPFNBW-GBNDHIKLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
