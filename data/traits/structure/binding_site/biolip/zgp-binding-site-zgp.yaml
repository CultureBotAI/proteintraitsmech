identifier: proteintraitsmech:BIOLIP_ZGP
label: "ZGP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(R)-hydroxy{[2-hydroxy-3,5-dimethyl-6-(2-oxo-2-sulfanylethyl)pyridin-4-yl]oxy}phosphoryl]guanosine (ZGP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JZNXQNYXQOKUIF-ACDAHVMNSA-N.
