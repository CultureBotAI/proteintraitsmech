identifier: proteintraitsmech:BIOLIP_AKM
label: "AKM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2R,4S,6R)-4-azanyl-4,6-dimethyl-5,5-bis(oxidanyl)oxan-2-yl] [[(2R,3S,5R)-5-[5-methyl-2,4-bis(oxidanylidene)pyrimidin-1-yl]-3-oxidanyl-oxolan-2-yl]methoxy-oxidanyl-phosphoryl] hydrogen phosphate (AKM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GACNZVKWDHTCBB-HHMBNNFFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
