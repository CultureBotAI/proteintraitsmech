identifier: proteintraitsmech:BIOLIP_4KZ
label: "4KZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1R)-1-(dihydroxyboranyl)-2-phenylethyl]-Nalpha-(pyrazin-2-ylcarbonyl)-L-phenylalaninamide (4KZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ILENEQWIGPQYCQ-ICSRJNTNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
