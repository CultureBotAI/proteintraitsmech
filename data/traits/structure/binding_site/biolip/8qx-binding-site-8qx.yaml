identifier: proteintraitsmech:BIOLIP_8QX
label: "8QX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-(4-bromanyl-2-fluoranyl-phenoxy)-2-methyl-3-[[(3~{S})-1-propan-2-ylpiperidin-3-yl]methyl]pyrido[3,2-d]pyrimidin-4-one (8QX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LMBFVVBQYYWDKN-INIZCTEOSA-N.
