identifier: proteintraitsmech:BIOLIP_PGT
label: "PGT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S)-2-{[{[(2R)-2,3-DIHYDROXYPROPYL]OXY}(HYDROXY)PHOSPHORYL]OXY}-1-[(PALMITOYLOXY)METHYL]ETHYL STEARATE (PGT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 9 binding-site occurrences across 4 PDB structures; ligand InChIKey KBPVYRBBONZJHF-AMAPPZPBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
