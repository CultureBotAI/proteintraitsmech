identifier: proteintraitsmech:BIOLIP_PAZ
label: "PAZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2R)-2-hydroxy-3,3-dimethyl-4-(phosphonooxy)butanoyl]-beta-alanine (PAZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XHFVGHPGDLDEQO-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
