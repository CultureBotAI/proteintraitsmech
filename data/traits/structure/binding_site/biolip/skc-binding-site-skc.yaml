identifier: proteintraitsmech:BIOLIP_SKC
label: "SKC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2E,4aR,7aS)-6-[3-(4-chlorophenyl)pyridin-2-yl]-7a-(2,5-difluorophenyl)-2-imino-3-methyloctahydro-4H-pyrrolo[3,4-d]pyrimidin-4-one (SKC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JZQJSLYBFWXABF-YADARESESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
