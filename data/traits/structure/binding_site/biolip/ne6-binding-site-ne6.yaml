identifier: proteintraitsmech:BIOLIP_NE6
label: "NE6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl [(1E,5R)-5-{(3S)-3-[(2E,4E)-2,5-dimethylocta-2,4-dienoyl]-2,4-dioxo-3,4-dihydro-2H-pyran-6-yl}hexylidene]carbamate (NE6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LTDLIPXLSBMTFP-FSAISGGASA-N.
