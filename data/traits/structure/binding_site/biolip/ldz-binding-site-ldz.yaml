identifier: proteintraitsmech:BIOLIP_LDZ
label: "LDZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(benzyloxy)carbonyl]-L-leucyl-N-[(2S)-4-methyl-1-oxopentan-2-yl]-L-leucinamide (LDZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 2 PDB structures; ligand InChIKey TZYWCYJVHRLUCT-VABKMULXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LDZ
synonyms:
  - synonym_text: "N-[(benzyloxy)carbonyl]-L-leucyl-N-[(2S)-4-methyl-1-oxopentan-2-yl]-L-leucinamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P28074
    protein_label: "8CVS chain K (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8cvs chain K (resolution 3.1 Å); binding residues: T2 R20 A21 T22 K34 M46 A47 G48 A50"
    source: CURATOR
  - protein_id: UniProtKB:P28072
    protein_label: "8CVT chain n (BioLiP receptor)"
