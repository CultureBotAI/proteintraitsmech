identifier: proteintraitsmech:BIOLIP_ZK1
label: "ZK1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {[7-morpholin-4-yl-2,3-dioxo-6-(trifluoromethyl)-3,4-dihydroquinoxalin-1(2H)-yl]methyl}phosphonic acid (ZK1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 18 binding-site occurrences across 8 PDB structures; ligand InChIKey WZMQMKNCWDCCMT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
