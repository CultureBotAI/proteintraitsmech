identifier: proteintraitsmech:BIOLIP_YRH
label: "YRH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-(5-oxidanylidene-4~{H}-[1,2]dithiolo[4,3-b]pyrrol-6-yl)hexanamide (YRH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YBDAGRFUBLIKGW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
