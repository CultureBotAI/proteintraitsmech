definition: >-
  A structure-derived ligand-binding site at which the ligand 4-methyl-2-(2-naphthalen-1-yl-2-oxidanylidene-ethyl)sulfanyl-1~{H}-pyrimidin-6-one (7NC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KKPLVAUVHOSUPR-UHFFFAOYSA-N.
