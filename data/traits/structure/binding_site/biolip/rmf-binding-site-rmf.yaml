identifier: proteintraitsmech:BIOLIP_RMF
label: "RMF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[[5,6-bis(chloranyl)-1~{H}-benzimidazol-2-yl]methyl]-9-(1-methylpyrazol-4-yl)-2-morpholin-4-yl-purin-6-amine (RMF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FSELUFUYNUNZKD-UHFFFAOYSA-N.
