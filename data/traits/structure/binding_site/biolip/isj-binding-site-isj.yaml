    protein_label: "8HX9 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8hx9 chain A (resolution 2.03 Å); binding residues: I499 K500 G501 T502 M593 Y616 R636 V649 G650 G651 A652 E665 K669"
    source: CURATOR
