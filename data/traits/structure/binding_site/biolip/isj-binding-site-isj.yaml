identifier: proteintraitsmech:BIOLIP_ISJ
label: "ISJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R,4R)-3-[(1-carboxyethenyl)oxy]-4-hydroxycyclohexa-1,5-diene-1-carboxylic acid (ISJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WTFXTQVDAKGDEY-HTQZYQBOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ISJ
synonyms:
  - synonym_text: "(3R,4R)-3-[(1-carboxyethenyl)oxy]-4-hydroxycyclohexa-1,5-diene-1-carboxylic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
