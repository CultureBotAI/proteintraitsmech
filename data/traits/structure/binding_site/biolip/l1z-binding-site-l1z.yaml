label: "L1Z-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[3-[1-[[4-(5-methyl-6-oxidanylidene-3-phenyl-1~{H}-pyrazin-2-yl)phenyl]methyl]piperidin-4-yl]-2-oxidanylidene-1~{H}-benzimidazol-5-yl]propanamide (L1Z) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HCHZPUXPCDNSSQ-UHFFFAOYSA-N.
