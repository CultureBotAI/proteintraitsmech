identifier: proteintraitsmech:BIOLIP_AI9
label: "AI9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2R,3S,4S,5E)-5-[[5-azanyl-2,4-bis(oxidanylidene)-1H-pyrimidin-6-yl]imino]-2,3,4-tris(oxidanyl)pentyl] dihydrogen phosphate (AI9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XKTZRTIKRCUGRX-ODDLNGBBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
