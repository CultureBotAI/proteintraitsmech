identifier: proteintraitsmech:BIOLIP_NRK
label: "NRK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{R},2~{S})-2-[(2,4-dimethylpyrimidin-5-yl)oxymethyl]-~{N}-(5-fluoranylpyridin-2-yl)-2-(3-fluorophenyl)cyclopropane-1-carboxamide (NRK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MUGXRYIUWFITCP-PGRDOPGGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
