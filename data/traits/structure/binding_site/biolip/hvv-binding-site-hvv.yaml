identifier: proteintraitsmech:BIOLIP_HVV
label: "HVV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4S,5R)-4,5-dihydroxy-5-[(3E,6E)-octa-3,6-dien-1-yl]pyrrolidin-2-one (HVV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VIMHNMLESUAQPL-JFDNTZKISA-N.
