identifier: proteintraitsmech:BIOLIP_R6K
label: "R6K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-azanyl-~{N}-[(1~{S},2~{S})-2-[[4-[4-[(4-methylpiperazin-1-yl)methyl]phenyl]phenyl]methoxy]cyclopentyl]-5-(1-methylpyrazol-4-yl)pyridine-3-carboxamide (R6K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GTVWQFJFCAUNFY-ACHIHNKUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
