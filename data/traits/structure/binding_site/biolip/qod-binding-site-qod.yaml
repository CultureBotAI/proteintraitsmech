    protein_label: "7M72 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7m72 chain A (resolution 2.4 Å); binding residues: Q14 S28 Y73 S76 D80 L100 V118 F120 W133 L150 D153 T156 T159 V160"
    source: CURATOR
