identifier: proteintraitsmech:BIOLIP_G5M
label: "G5M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-{[2-(L-cysteinylamino)-2-deoxy-alpha-D-glucopyranosyl]oxy}butanedioic acid (G5M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UHNHELGKNQMNGF-AOQKXWSCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
