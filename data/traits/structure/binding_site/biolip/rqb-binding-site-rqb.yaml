identifier: proteintraitsmech:BIOLIP_RQB
label: "RQB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,5S,8aS)-3-[(1-methyl-1H-indol-3-yl)methyl]hexahydropyrrolo[1,2-a]pyrazine-1,4-dione (RQB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey MAIUHPJZIUPKLB-ZFWWWQNUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
