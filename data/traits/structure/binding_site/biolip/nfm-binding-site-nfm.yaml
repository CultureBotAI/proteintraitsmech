identifier: proteintraitsmech:BIOLIP_NFM
label: "NFM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(4-amino-2-methylpyrimidin-5-yl)methyl]formamide (NFM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PVWNFAGYFUUDRC-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NFM
synonyms:
  - synonym_text: "N-[(4-amino-2-methylpyrimidin-5-yl)methyl]formamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9K9G5
    protein_label: "3IX1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3ix1 chain A (resolution 2.4 Å); binding residues: D38 W39 Y90 I142 N145 G186 Y188 E192"
    source: CURATOR
