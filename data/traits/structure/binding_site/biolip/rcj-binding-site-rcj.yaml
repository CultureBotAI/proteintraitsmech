identifier: proteintraitsmech:BIOLIP_RCJ
label: "RCJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},4~{S},5~{R},6~{R},7~{S},8~{R})-5-acetamido-2,4,6,7,8,9-hexakis(oxidanyl)nonanoic acid (RCJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey REORMAHRVILHOU-HQBQHRAMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
