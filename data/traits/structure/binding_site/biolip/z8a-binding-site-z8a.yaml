identifier: proteintraitsmech:BIOLIP_Z8A
label: "Z8A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2S,3S,4R)-1,3,4-trihydroxyoctadecan-2-yl]hexacosanamide (Z8A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey GKRXVCWVXYHWOD-KZRDWULCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
