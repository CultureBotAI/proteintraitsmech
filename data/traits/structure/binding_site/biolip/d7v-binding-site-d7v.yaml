identifier: proteintraitsmech:BIOLIP_D7V
label: "D7V-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3Z)-3-(dibenzo[b,e]oxepin-11(6H)-ylidene)-N,N-dimethylpropan-1-amine (D7V) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ODQWQRRAPPTVAG-BOPFTXTBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
