identifier: proteintraitsmech:BIOLIP_KG2
label: "KG2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3~{S})-1-methyl-1-azoniabicyclo[2.2.2]octan-3-yl] 2-oxidanyl-2,2-diphenyl-ethanoate (KG2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HOOSGZJRQIVJSZ-LLBVYWAGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
