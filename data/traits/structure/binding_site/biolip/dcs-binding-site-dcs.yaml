identifier: proteintraitsmech:BIOLIP_DCS
label: "DCS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-[3-HYDROXY-2-METHYL-5-PHOSPHONOOXYMETHYL-PYRIDIN-4-YLMETHYL]-N,O-CYCLOSERYLAMIDE (DCS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 4 PDB structures; ligand InChIKey NNRZSZJOQKAGTO-SECBINFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
