identifier: proteintraitsmech:BIOLIP_XNC
label: "XNC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (11S)-11-[4-(benzyloxy)-2-fluorophenyl]-3,3-dimethyl-10-[(6-methylpyridin-2-yl)carbonyl]-2,3,4,5,10,11-hexahydrothiopyrano[3,2-b][1,5]benzodiazepin-6-ol 1,1-dioxide (XNC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CLEOWFBQYYBWRR-HKBQPEDESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
