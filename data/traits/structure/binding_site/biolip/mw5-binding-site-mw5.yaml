identifier: proteintraitsmech:BIOLIP_MW5
label: "MW5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-benzyl-5-chloro[1,2,4]triazolo[1,5-a]pyrimidin-7(3H)-one (MW5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MQEBPOLOTAZMKF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
