identifier: proteintraitsmech:BIOLIP_MMW
label: "MMW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(3~{S})-3-azanylpiperidin-1-yl]-4-[[3-(trifluoromethyl)phenyl]amino]pyrimidine-5-carboxamide (MMW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ASMLDRAEBPYENO-NSHDSACASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
