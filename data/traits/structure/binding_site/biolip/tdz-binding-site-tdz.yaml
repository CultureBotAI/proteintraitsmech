identifier: proteintraitsmech:BIOLIP_TDZ
label: "TDZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5R)-5-(4-{[(2R)-6-HYDROXY-2,5,7,8-TETRAMETHYL-3,4-DIHYDRO-2H-CHROMEN-2-YL]METHOXY}BENZYL)-1,3-THIAZOLIDINE-2,4-DIONE (TDZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey GXPHKUHSUJUWKP-NTKDMRAZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
