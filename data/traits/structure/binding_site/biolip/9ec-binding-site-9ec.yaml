identifier: proteintraitsmech:BIOLIP_9EC
label: "9EC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,2R,4S,5S,7s)-7-({[4-fluoro-2-(thiophen-2-yl)phenyl]carbamoyl}oxy)-9,9-dimethyl-3-oxa-9-azatricyclo[3.3.1.0~2,4~]nonan-9-ium (9EC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YBYUWXNCRPKGOH-ADYDWEGLSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
