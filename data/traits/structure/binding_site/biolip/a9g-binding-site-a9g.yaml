identifier: proteintraitsmech:BIOLIP_A9G
label: "A9G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(2S)-butan-2-yl]-N-[(4,6-dimethyl-2-oxo-1,2-dihydropyridin-3-yl)methyl]-3-methyl-6-[6-(piperazin-1-yl)pyridin-3-yl]-1H-indole-4-carboxamide (A9G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey FKSFKBQGSFSOSM-QFIPXVFZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
