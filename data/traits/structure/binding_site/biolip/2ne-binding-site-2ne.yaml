identifier: proteintraitsmech:BIOLIP_2NE
label: "2NE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Salicylyl CoA (2NE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey YTKKDFTVSNSVEE-TYHXJLICSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
