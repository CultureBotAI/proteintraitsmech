identifier: proteintraitsmech:BIOLIP_A1D5N
label: "A1D5N-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S})-5-methyl-3-[[1-pentan-3-yl-2-(thiophen-2-ylmethyl)benzimidazol-5-yl]carbonylamino]hexanoic acid (A1D5N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey VCQKKZXFASLXAH-SFHVURJKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
