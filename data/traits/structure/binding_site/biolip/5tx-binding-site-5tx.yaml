identifier: proteintraitsmech:BIOLIP_5TX
label: "5TX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ((3S,5S)-1,5-dihydroxy-3-methyl-2-oxopyrrolidin-3-yl)phosphonic acid (5TX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VVBLYPMICKYZTP-UCORVYFPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
