identifier: proteintraitsmech:BIOLIP_2LJ
label: "2LJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-deoxy-1-({2,6-dioxo-5-[(E)-propylideneamino]-1,2,3,6-tetrahydropyrimidin-4-yl}amino)-D-ribitol (2LJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey YCMPUNANLDFPQG-FHZGFTDOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
