    protein_label: "6CI6 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6ci6 chain A (resolution 2.8 Å); binding residues: N390 F402 Y410 V432 G433 L452 S488"
    source: CURATOR
