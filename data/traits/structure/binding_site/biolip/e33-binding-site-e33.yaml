identifier: proteintraitsmech:BIOLIP_E33
label: "E33-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (8~{a}~{R},12~{a}~{S},13~{a}~{R})-12-ethylsulfonyl-3-methoxy-5,6,8,8~{a},9,10,11,12~{a},13,13~{a}-decahydroisoquinolino[2,1-g][1,6]naphthyridine (E33) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UMGBFFAJXFXOIL-AYOQOUSVSA-N.
