identifier: proteintraitsmech:BIOLIP_KRT
label: "KRT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (~{E})-3-[3-(dihydroxyboranyl)phenyl]prop-2-enoic acid (KRT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QCHIEOGZUMAQKI-SNAWJCMRSA-N.
