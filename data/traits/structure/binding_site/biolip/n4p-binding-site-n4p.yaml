identifier: proteintraitsmech:BIOLIP_N4P
label: "N4P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N,N-bis(3-aminopropyl)butane-1,4-diamine (N4P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CAARYRKDWMNHCB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
