    protein_label: "5XNC chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5xnc chain B (resolution 1.84 Å); binding residues: D126 A128 D159 D160 D225 P226 E228 G254 T256 Y290 Y295 Y316 T350"
    source: CURATOR
