identifier: proteintraitsmech:BIOLIP_E5S
label: "E5S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-3-({2-benzyl-6-[(3R,4S)-3-hydroxy-4-methoxypyrrolidin-1-yl]pyridin-3-yl}ethynyl)-1-azabicyclo[2.2.2]octan-3-ol (E5S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NDEOTZXSBKCQLS-RMTZWNOUSA-N.
