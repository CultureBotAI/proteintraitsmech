label: "4EY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-methanethioyl-1-(5-O-phosphono-beta-D-ribofuranosyl)-5-(sulfanylcarbonyl)pyridin-1-ium (4EY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey NSIYRWZYSRADIJ-GWOFURMSSA-O.
