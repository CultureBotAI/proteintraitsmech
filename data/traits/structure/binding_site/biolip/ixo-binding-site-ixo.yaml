identifier: proteintraitsmech:BIOLIP_IXO
label: "IXO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(4,5-dihydro-1,2-oxazol-3-yloxy)-N,N,N-trimethylbut-2-yn-1-aminium (IXO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey WXXOCGISBCTWPW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
