identifier: proteintraitsmech:BIOLIP_OSA
label: "OSA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-amino-4-hydroxy-3-[(E)-(5-hydroxy-7-sulfonaphthalen-2-yl)diazenyl]naphthalene-2-sulfonic acid (OSA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZSHNSNDVNDUHIM-GHVJWSGMSA-N.
