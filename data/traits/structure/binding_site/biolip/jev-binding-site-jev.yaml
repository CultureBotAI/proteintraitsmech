identifier: proteintraitsmech:BIOLIP_JEV
label: "JEV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{2-[(8S)-1,6,7,8-tetrahydro-2H-indeno[5,4-b]furan-8-yl]ethyl}propanamide (JEV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey YLXDSYKOBKBWJQ-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:JEV
synonyms:
  - synonym_text: "N-{2-[(8S)-1,6,7,8-tetrahydro-2H-indeno[5,4-b]furan-8-yl]ethyl}propanamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P48039
    protein_label: "6ME2 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6me2 chain A (resolution 2.8 Å); binding residues: M107 G108 N162 F179 Q181 V191 L254"
    source: CURATOR
  - protein_id: UniProtKB:P00268
    protein_label: "6ME9 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6me9 chain B (resolution 3.3 Å); binding residues: G121 I125 N175 F192 V204 L267"
    source: CURATOR
