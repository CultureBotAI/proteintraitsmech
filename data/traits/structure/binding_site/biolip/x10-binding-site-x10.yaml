identifier: proteintraitsmech:BIOLIP_X10
label: "X10-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1R)-2-(hydroxyamino)-2-oxo-1-(3',4',5'-trifluoro[1,1'-biphenyl]-4-yl)ethyl]-N~2~-phenylglycinamide (X10) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NAFBHKRYHPXZDP-OAQYLSRUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
