identifier: proteintraitsmech:BIOLIP_FTJ
label: "FTJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-2-{4-[(6-chloroquinoxalin-2-yl)oxy]phenoxy}propanoic acid (FTJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ABOOPXYCKNFDNJ-SNVBAGLBSA-N.
