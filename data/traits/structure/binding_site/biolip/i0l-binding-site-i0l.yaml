identifier: proteintraitsmech:BIOLIP_I0L
label: "I0L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4R)-4-[(2E)-4,4-diethyl-2-imino-6-oxo-1,3-diazinan-1-yl]-N-[(4S)-2,2-dimethyl-3,4-dihydro-2H-1-benzopyran-4-yl]-3,4-dihydro-2H-1-benzopyran-6-carboxamide (I0L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey ZSZSSSHEMYULPX-FCHUYYIVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
