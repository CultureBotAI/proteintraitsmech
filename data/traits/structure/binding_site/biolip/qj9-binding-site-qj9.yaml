identifier: proteintraitsmech:BIOLIP_QJ9
label: "QJ9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-{(3S)-1-[4-(1-benzofuran-2-yl)pyrimidin-2-yl]piperidin-3-yl}-3-ethyl-1,3-dihydro-2H-benzimidazol-2-one (QJ9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NXTBLPPTZRPJCA-IBGZPJMESA-N.
