    protein_label: "1BZS chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1bzs chain A (resolution 1.7 Å); binding residues: I159 L160 A161 H197 E198 H201 H207 L214 P217 N218 Y219"
    source: CURATOR
