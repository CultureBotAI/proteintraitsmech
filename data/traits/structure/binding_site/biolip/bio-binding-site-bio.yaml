identifier: proteintraitsmech:BIOLIP_BIO
label: "BIO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand BIOPTERIN (BIO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey LHQIJBMDNUYRAM-AWFVSMACSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
