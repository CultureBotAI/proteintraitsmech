identifier: proteintraitsmech:BIOLIP_HCZ
label: "HCZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-chloro-3,4-dihydro-2H-1,2,4-benzothiadiazine-7-sulfonamide 1,1-dioxide (HCZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JZUFKLXOESDKRF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
