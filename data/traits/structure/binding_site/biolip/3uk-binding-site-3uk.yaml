identifier: proteintraitsmech:BIOLIP_3UK
label: "3UK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(S)-[(2-aminobenzoyl)oxy](hydroxy)phosphoryl]adenosine (3UK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey XZXXWUQOHYJTTC-XNIJJKJLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
