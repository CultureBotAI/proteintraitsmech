identifier: proteintraitsmech:BIOLIP_G9L
label: "G9L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-fluoro-2-(3-piperidin-1-ylpropanoyl)-1,3,4,5-tetrahydrobenzo[c][1,6]naphthyridin-6(2H)-one (G9L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CTOQXIXQHAILCA-UHFFFAOYSA-N.
