identifier: proteintraitsmech:BIOLIP_BQ6
label: "BQ6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(3-cyano-3-methylazetidine-1-carbonyl)-N-[(3S)-7-fluoro-6-methyl-3,4-dihydro-2H-1-benzopyran-3-yl]-5-methyl-1H-pyrrole-2-sulfonamide (BQ6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PKIDWDVQYYRRMY-HNNXBMFYSA-N.
