identifier: proteintraitsmech:BIOLIP_FSX
label: "FSX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand BIS-(MU-2-OXO),[(MU-3--SULFIDO)-BIS(MU-2--SULFIDO)-TRIS(CYS-S)-TRI-IRON] (AQUA)(GLU-O)IRON(II) (FSX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey BIOGFUMNBIDAOG-UHFFFAOYSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
