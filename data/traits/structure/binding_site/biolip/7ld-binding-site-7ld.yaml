identifier: proteintraitsmech:BIOLIP_7LD
label: "7LD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (8alpha)-N,N-diethyl-6-methyl-9,10-didehydroergoline-8-carboxamide (7LD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey VAYOSLLFUXYJDT-RDTXWAMCSA-N.
