definition: >-
  A structure-derived ligand-binding site at which the ligand (4R)-4-(2-chloro-2,2-difluoroethyl)-1-{[(4R)-2-(methoxymethyl)-6-(trifluoromethyl)imidazo[2,1-b][1,3,4]thiadiazol-5-yl]methyl}pyrrolidin-2-one (X3U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DCXFIOLWWRXEQH-SSDOTTSWSA-N.
