identifier: proteintraitsmech:BIOLIP_04C
label: "04C-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,2,4-trideoxy-4-methyl-2-{[N-(morpholin-4-ylacetyl)-L-alanyl-O-methyl-L-tyrosyl]amino}-1-phenyl-D-xylitol (04C) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SLVOSRJOLWNALP-QAKIEGLASA-N.
