definition: >-
  A structure-derived ligand-binding site at which the ligand {4-[(4-{(Z)-[3-(4-FLUOROBENZYL)-2,4-DIOXO-1,3-THIAZOLIDIN-5-YLIDENE]METHYL}PHENOXY)METHYL]PHENYL}(TRIHYDROXY)BORATE(1-) (SWH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PZWLRHOIUSLISO-XKZIYDEJSA-N.
