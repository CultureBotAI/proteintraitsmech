identifier: proteintraitsmech:BIOLIP_J2J
label: "J2J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(S)-[(2,3-dihydroxybenzene-1-carbonyl)oxy](hydroxy)phosphoryl]adenosine (J2J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ULPVJDOMCRTJSN-RVXWVPLUSA-N.
