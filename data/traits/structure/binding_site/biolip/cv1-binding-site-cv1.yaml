definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3R,4S,5R,13R,14S,15R,16R)-24-amino-18-bromo-3,4,14,15-tetrahydroxy-7,9,11,25,26-pentaoxa-17,19,22-triaza-1-azonia-8 ,10-diphosphapentacyclo[18.3.1.1^2,5^.1^13,16^.0^17,21^]hexacosa-1(24),18,20,22-tetraene-8,10-diolate 8,10-dioxide (CV1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WDGMEOAIDHHBSJ-AIKIOGRUSA-M.
