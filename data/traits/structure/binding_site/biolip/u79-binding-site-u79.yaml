identifier: proteintraitsmech:BIOLIP_U79
label: "U79-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 2-[(9~{S})-7-[4-[4-[[4-[(3-cyano-4-methyl-1~{H}-indol-7-yl)sulfamoyl]phenyl]methylcarbamoyl]phenyl]phenyl]-4,5,13-trimethyl-3-thia-1,8,11,12-tetrazatricyclo[8.3.0.0^{2,6}]trideca-2(6),4,7,10,12-pentaen-9-yl]ethanoate (U79) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HHSZFSOLNUHGMP-BHVANESWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
