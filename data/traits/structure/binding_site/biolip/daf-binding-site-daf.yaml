identifier: proteintraitsmech:BIOLIP_DAF
label: "DAF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4,6-dideoxy-4-{[(1S,5R,6S)-3-formyl-5,6-dihydroxy-4-oxocyclohex-2-en-1-yl]amino}-alpha-D-xylo-hex-5-enopyranose (DAF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ZGWNRGISVMYHTF-KKXLKBQTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
