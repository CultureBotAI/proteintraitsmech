identifier: proteintraitsmech:BIOLIP_DU1
label: "DU1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{[3-(8-cyclohexyl-2,6-dioxo-1-propyl-1,2,6,7-tetrahydro-3H-purin-3-yl)propyl]carbamoyl}benzene-1-sulfonyl fluoride (DU1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KAJVJPLKXGLLDA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:DU1
synonyms:
  - synonym_text: "4-{[3-(8-cyclohexyl-2,6-dioxo-1-propyl-1,2,6,7-tetrahydro-3H-purin-3-yl)propyl]carbamoyl}benzene-1-sulfonyl fluoride-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "5UEN chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5uen chain A (resolution 3.2 Å); binding residues: Y12 L88 F171 E172 W247 L250 N254 Y271"
    source: CURATOR
