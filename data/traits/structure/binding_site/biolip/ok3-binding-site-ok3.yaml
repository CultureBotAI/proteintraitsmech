identifier: proteintraitsmech:BIOLIP_OK3
label: "OK3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4~{R})-4-[[4-(aminomethyl)phenyl]carbonylamino]-3,3-bis(oxidanyl)-2-oxa-3-boranuidabicyclo[4.4.0]deca-1(10),6,8-triene-10-carboxylic acid (OK3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QLXKUYDHLJOWQG-AWEZNQCLSA-N.
