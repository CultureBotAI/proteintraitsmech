  A structure-derived ligand-binding site at which the ligand (1R,2S,4R)-4-[[4-(5,6-dimethoxypyridazin-3-yl)phenyl]methylamino]-2-[methyl-[6-[2,2,2-tris(fluoranyl)ethyl]thieno[2,3-d]pyrimidin-4-yl]amino]cyclopentan-1-ol (7IX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FFHYBSANKGPTCW-VOQZNFBZSA-N.
