identifier: proteintraitsmech:BIOLIP_AHZ
label: "AHZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ADENOSINE DIPHOSPHATE 5-(BETA-ETHYL)-4-METHYL-THIAZOLE-2-CARBOXYLIC ACID (AHZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey VGXBGQACJQRWLV-LKGUXBDMSA-K.
