identifier: proteintraitsmech:BIOLIP_1PL
label: "1PL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,3aS,5aR,8aS)-1,7,7-trimethyl-1,2,3,3a,5a,6,7,8-octahydrocyclopenta[c]pentalene-4-carboxylic acid (1PL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DCFDRCCHOOORSB-JOXOIDLHSA-N.
