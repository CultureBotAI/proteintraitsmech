identifier: proteintraitsmech:BIOLIP_EDT
label: "EDT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {[-(BIS-CARBOXYMETHYL-AMINO)-ETHYL]-CARBOXYMETHYL-AMINO}-ACETIC ACID (EDT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 11 binding-site occurrences across 11 PDB structures; ligand InChIKey KCXVZYZYPLLWCC-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
