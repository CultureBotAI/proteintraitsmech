identifier: proteintraitsmech:BIOLIP_1YJ
label: "1YJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[4-({[(6R)-2-amino-4-oxo-3,4,5,6,7,8-hexahydropteridin-6-yl]methyl}amino)benzoyl]-L-glutamic acid (1YJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MSTNYGQPCMXVAQ-NEPJUHHUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
