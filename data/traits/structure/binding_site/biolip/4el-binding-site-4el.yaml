identifier: proteintraitsmech:BIOLIP_4EL
label: "4EL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(6-methoxypyridin-3-yl)-5-[({4-[(5-methyl-1,3,4-thiadiazol-2-yl)sulfamoyl]phenyl}amino)methyl]benzoic acid (4EL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 1 PDB structure; ligand InChIKey CBZPCOUPBNLTKW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
