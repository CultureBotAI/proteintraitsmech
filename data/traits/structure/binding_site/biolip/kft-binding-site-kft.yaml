identifier: proteintraitsmech:BIOLIP_KFT
label: "KFT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},3~{R},4~{S},5~{R})-5-(hydroxymethyl)-3,4-bis(oxidanyl)-~{N}-pentyl-pyrrolidine-2-carboxamide (KFT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QKDMGVVHKYSWEM-XFWSIPNHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
