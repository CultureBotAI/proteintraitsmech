identifier: proteintraitsmech:BIOLIP_1FN
label: "1FN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(4-fluorophenyl)-N-[3-fluoro-4-(1H-pyrrolo[2,3-b]pyridin-4-yloxy)phenyl]-2-oxo-1,2-dihydropyridine-3-carboxamide (1FN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OBSFXHDOLBYWRJ-UHFFFAOYSA-N.
