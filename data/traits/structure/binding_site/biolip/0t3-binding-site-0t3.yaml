identifier: proteintraitsmech:BIOLIP_0T3
label: "0T3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(5R)-5,6,7,8-tetrahydroimidazo[1,5-a]pyridin-5-yl]benzonitrile (0T3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CLPFFLWZZBQMAO-CQSZACIVSA-N.
