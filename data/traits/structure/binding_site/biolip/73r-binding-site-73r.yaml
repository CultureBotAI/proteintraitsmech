identifier: proteintraitsmech:BIOLIP_73R
label: "73R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-1-{(1S,2R,4R)-4-[methyl(propan-2-yl)amino]-2-propylcyclohexyl}-3-{[6-(trifluoromethyl)quinazolin-4-yl]amino}pyrrolidin-2-one (73R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NUJWKQSEJDYCDB-GNRVTEMESA-N.
