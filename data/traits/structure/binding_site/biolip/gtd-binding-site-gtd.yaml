identifier: proteintraitsmech:BIOLIP_GTD
label: "GTD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(S-GLUTATHIONYL)-2,4,6-TRINITROCYCLOHEXA-2,5-DIENE (GTD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VQUXYLXGOSJDJJ-OSGJSWLFSA-N.
