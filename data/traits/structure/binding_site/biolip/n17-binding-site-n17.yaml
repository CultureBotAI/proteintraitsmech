identifier: proteintraitsmech:BIOLIP_N17
label: "N17-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(4-methyl-1H-imidazol-1-yl)-N-[4-(pyridin-4-yloxy)phenyl]benzamide (N17) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey TXKSFDQJSFSHRB-UHFFFAOYSA-N.
