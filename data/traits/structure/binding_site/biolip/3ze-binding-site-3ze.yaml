identifier: proteintraitsmech:BIOLIP_3ZE
label: "3ZE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {2-[(3S,4R)-3-(2-amino-6-oxo-1,6-dihydro-9H-purin-9-yl)-4-hydroxypyrrolidin-1-yl]-2-oxoethyl}phosphonic acid (3ZE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PIHCTBQWWHFPNB-NTSWFWBYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
