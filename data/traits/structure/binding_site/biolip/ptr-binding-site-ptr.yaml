identifier: proteintraitsmech:BIOLIP_PTR
label: "PTR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand O-PHOSPHOTYROSINE (PTR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey DCWXELXMIBXGTH-QMMMGPOBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PTR
synonyms:
  - synonym_text: "O-PHOSPHOTYROSINE-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P40479
    protein_label: "2J17 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2j17 chain B (resolution 2.84 Å); binding residues: H111 S140 Q141 C142 L144 S145 R146"
    source: CURATOR
  - protein_id: UniProtKB:D3HJY4
    protein_label: "6E8I chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6e8i chain A (resolution 1.68 Å); binding residues: R46 S48 S49 T50 T56 H69 R71 K84"
    source: CURATOR
  - protein_id: UniProtKB:Q9KTG5
    protein_label: "6U1Q chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6u1q chain A (resolution 2.87 Å); binding residues: R515 G548 G550 K551 T553 R583"
    source: CURATOR
