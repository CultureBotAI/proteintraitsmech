identifier: proteintraitsmech:BIOLIP_L74
label: "L74-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-{[4-(4-chlorophenyl)piperazin-1-yl]methyl}-1H-pyrrolo[2,3-b]pyridine (L74) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OGJGQVFWEPNYSB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
