identifier: proteintraitsmech:BIOLIP_L6A
label: "L6A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-azanyl-7-[3-(hydroxymethyl)phenyl]quinazoline-6-carboxamide (L6A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UNWGLQGHMTWDJL-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
