identifier: proteintraitsmech:BIOLIP_AFY
label: "AFY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3-{[2-({N-[(2R)-2-hydroxy-3,3-dimethyl-4-(phosphonooxy)butanoyl]-beta-alanyl}amino)ethyl]sulfanyl}oxetan-3-yl)acetic acid (AFY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WYVQKYVITQEIME-ZDUSSCGKSA-N.
