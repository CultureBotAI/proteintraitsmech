identifier: proteintraitsmech:BIOLIP_XS4
label: "XS4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-~{tert}-butyl-3-[6-(3,5-dimethoxyphenyl)-2-[[1-[1-(phenylmethyl)piperidin-4-yl]-1,2,3-triazol-4-yl]methylamino]pyrido[2,3-d]pyrimidin-7-yl]urea (XS4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ICLLNANNWBTXCO-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
