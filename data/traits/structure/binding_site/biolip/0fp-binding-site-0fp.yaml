identifier: proteintraitsmech:BIOLIP_0FP
label: "0FP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(6-aminohexanoyl)-3-methyl-L-valyl-3-methyl-L-valyl-N~1~-[(2S,3S)-3-hydroxy-4-oxo-4-{[(1R)-1-phenylpropyl]amino}butan-2-yl]-N~4~,N~4~-dimethyl-L-aspartamide (0FP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RICYNZHPHSJRNO-GYZAPQSVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
