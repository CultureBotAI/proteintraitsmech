identifier: proteintraitsmech:BIOLIP_85I
label: "85I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-2-[2-(methylamino)ethoxy-oxidanyl-phosphoryl]oxy-2-(13-methyltetradecanoyloxy)ethyl] 13-methyltetradecanoate (85I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 1 PDB structure; ligand InChIKey JRBIDHJPLMRMHE-PGUFJCEWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
