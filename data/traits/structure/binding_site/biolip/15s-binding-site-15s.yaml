identifier: proteintraitsmech:BIOLIP_15S
label: "15S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{(2S)-1-[4-(4-fluorophenyl)-3,6-dihydropyridin-1(2H)-yl]-1-oxopropan-2-yl}-2-[(9aR)-7-oxo-2,3,7,8,9,9a-hexahydro-1H-benzo[de][1,7]naphthyridin-1-yl]acetamide (15S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GXUDQLGOCXKORM-SBUREZEXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
