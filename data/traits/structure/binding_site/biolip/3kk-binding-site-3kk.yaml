identifier: proteintraitsmech:BIOLIP_3KK
label: "3KK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-{(3R,5R,9R)-1-[(2R,3S,4R,5R)-5-(6-amino-9H-purin-9-yl)-4-hydroxy-3-(phosphonooxy)tetrahydrofuran-2-yl]-3,5,9-trihydroxy-8,8-dimethyl-3,5-dioxido-10,14-dioxo-2,4,6-trioxa-11,15-diaza-3lambda~5~,5lambda~5~-diphosphaheptadecan-17-yl} 2-hydroxy-2-methylpropanethioate (3KK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FFVUICCDNWZCRC-ZSJPKINUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
