identifier: proteintraitsmech:BIOLIP_QRE
label: "QRE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[3,6-bis(oxidanyl)-9~{H}-xanthen-9-yl]-5-[(6-oxidanyl-6-oxidanylidene-hexyl)carbamothioylamino]benzoic acid (QRE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RDYFZBSVNLLBMW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
