identifier: proteintraitsmech:BIOLIP_ZLA
label: "ZLA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-{2-[3,5-dicyclopropyl-4-(4-{[(quinoxaline-2-carbonyl)amino]methyl}-1H-1,2,3-triazol-1-yl)phenyl]acetamido}cyclohexane-1-carboxylic acid (ZLA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BZXDUAKTLARJRN-UHFFFAOYSA-N.
