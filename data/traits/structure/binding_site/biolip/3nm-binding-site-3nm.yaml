identifier: proteintraitsmech:BIOLIP_3NM
label: "3NM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-methyl-5-[2-(phosphonooxy)ethyl]-1,3-thiazole-2-carboxylic acid (3NM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XWECMAHAKFWYNV-UHFFFAOYSA-N.
