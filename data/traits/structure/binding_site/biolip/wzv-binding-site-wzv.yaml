identifier: proteintraitsmech:BIOLIP_WZV
label: "WZV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(2,2,2-Trifluoro-ethoxy)-pyridine-2-carboxylic acid [3-((S)-2-amino-1,4-dimethyl-6-oxo-1,4,5,6-tetrahydro-pyrimidin-4-yl)-phenyl]-amide (WZV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZJFIBYCNZHIVEL-IBGZPJMESA-N.
