identifier: proteintraitsmech:BIOLIP_HZL
label: "HZL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2S)-3-[2-[(E)-[(2E,4E,6E,8E)-3,7-dimethyl-9-(2,6,6-trimethylcyclohexen-1-yl)nona-2,4,6,8-tetraenylidene]amino]ethoxy-oxidanyl-phosphoryl]oxy-2-[(Z)-octadec-9-enoyl]oxy-propyl] (Z)-octadec-9-enoate (HZL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey DCJYQTYECYRVQM-JOQDOZEYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
