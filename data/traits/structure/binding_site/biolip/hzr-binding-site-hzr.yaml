identifier: proteintraitsmech:BIOLIP_HZR
label: "HZR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-butyl-3-chloranyl-4-(4-phenylpiperidin-1-yl)pyridin-2-one (HZR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HYOGJHCDLQSAHX-UHFFFAOYSA-N.
