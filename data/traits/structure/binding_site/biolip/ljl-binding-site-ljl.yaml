    protein_label: "8ABV chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8abv chain A (resolution 1.683 Å); binding residues: Y31 F55 Y70 W73 F74 R77 F78 H93 E139 Y143 Y161 H179 L180"
    source: CURATOR
