identifier: proteintraitsmech:BIOLIP_LJL
label: "LJL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,2S)-1,2-bis(3-methoxy-4-oxidanyl-phenyl)propane-1,3-diol (LJL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DFUOJBWSSSODTR-PXAZEXFGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
