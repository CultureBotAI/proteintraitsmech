    protein_label: "3E3K chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3e3k chain B (resolution 2.8 Å); binding residues: Y22 M27 W100 R137 W398 Y402 S415 H416"
    source: CURATOR
