identifier: proteintraitsmech:BIOLIP_HCT
label: "HCT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-butane-1,2,4-tricarboxylic acid (HCT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LOGBRYZYTBQBTB-SCSAIBSYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
