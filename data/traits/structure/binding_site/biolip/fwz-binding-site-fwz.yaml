label: "FWZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},4~{R})-~{N}-[[2-[2-[4-[[4-[3-azanyl-6-(2-hydroxyphenyl)pyridazin-4-yl]piperazin-1-yl]methyl]phenyl]ethoxy]-4-(4-methyl-1,3-thiazol-5-yl)phenyl]methyl]-1-[(2~{S})-2-[(1-fluoranylcyclopropyl)carbonylamino]-3,3-dimethyl-butanoyl]-4-oxidanyl-pyrrolidine-2-carboxamide (FWZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UTZVLJZPTDCKCT-XBPZXCMESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
