identifier: proteintraitsmech:BIOLIP_LCY
label: "LCY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-methylpyrrolidine-2,5-dione (LCY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KYEACNNYFNZCST-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
