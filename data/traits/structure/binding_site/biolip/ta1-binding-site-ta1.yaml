identifier: proteintraitsmech:BIOLIP_TA1
label: "TA1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand TAXOL (TA1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RCINICONZNJXQF-MZXODVADSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
