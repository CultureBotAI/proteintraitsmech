identifier: proteintraitsmech:BIOLIP_LFC
label: "LFC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-deoxy-L-galactonic acid (LFC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NBFWIISVIFCMDK-RSJOWCBRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LFC
synonyms:
  - synonym_text: "6-deoxy-L-galactonic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A6X5V3
    protein_label: "4OVT chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4ovt chain A (resolution 1.8 Å); binding residues: K72 I88 D90 Y146 R149 R169 P171 N209"
    source: CURATOR
