identifier: proteintraitsmech:BIOLIP_KQD
label: "KQD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,4S,3'S,4'S)-1,1'-(1,4-phenylenedicarbonyl)bis{N~3~,N~4~-bis[(1S,2R)-2-phenylcyclopropyl]pyrrolidine-3,4-dicarboxami de} (KQD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ABZBNXFGYUSVCJ-UYMKNZQYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
