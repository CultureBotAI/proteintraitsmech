identifier: proteintraitsmech:BIOLIP_BS0
label: "BS0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[2-(phenoxymethyl)-1,3-thiazol-4-yl]-3,4-dihydro-1H-quinolin-2-one (BS0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QXHYTMRDSBLWLI-UHFFFAOYSA-N.
