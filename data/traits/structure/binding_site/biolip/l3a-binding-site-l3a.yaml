identifier: proteintraitsmech:BIOLIP_L3A
label: "L3A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-[(R)-[(1R)-1-amino-3-methylbutyl](hydroxy)phosphoryl]-2-methylpropanoic acid (L3A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey PYHFMEIRRPJIRC-JGVFFNPUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
