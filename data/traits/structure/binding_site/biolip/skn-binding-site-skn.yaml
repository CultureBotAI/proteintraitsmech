    protein_label: "7B12 chain w (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7b12 chain w (resolution 2.43 Å); binding residues: T1 R19 A20 T21 C31 K33 H35 G47 A49 E53"
    source: CURATOR
