identifier: proteintraitsmech:BIOLIP_SKN
label: "SKN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ((R)-2-(3-ethylphenyl)-1-((S)-3-phenyl-2-(pyrazine-2-carboxamido)propanamido)ethyl)boronic acid (SKN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RQXXOBNVVACHIB-UNMCSNQZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
