identifier: proteintraitsmech:BIOLIP_EL5
label: "EL5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[(2Z)-2-({3-(2-carboxyethyl)-5-[(E)-(4-ethenyl-3-methyl-5-oxo-1,5-dihydro-2H-pyrrol-2-ylidene)methyl]-4-methyl-1H-pyrrol-2-yl}methylidene)-5-{(Z)-[(3E,4S)-3-ethylidene-4-methyl-5-oxopyrrolidin-2-ylidene]methyl}-4-methyl-2H-pyrrol-3-yl]propanoic acid (EL5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey SNHIGJASYQUMKZ-IDFYGOSVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
