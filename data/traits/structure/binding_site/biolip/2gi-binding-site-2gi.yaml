identifier: proteintraitsmech:BIOLIP_2GI
label: "2GI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(3~{R})-3-[4-azanyl-3-[1-(2-phenylethyl)-1,2,3-triazol-4-yl]pyrazolo[3,4-d]pyrimidin-1-yl]piperidin-1-yl]propan-1-one (2GI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DQBPZDXMZGPVRU-QGZVFWFLSA-N.
