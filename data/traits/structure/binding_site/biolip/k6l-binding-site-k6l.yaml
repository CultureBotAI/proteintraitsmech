identifier: proteintraitsmech:BIOLIP_K6L
label: "K6L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-2-[5-(2-hexylphenyl)pentanoylamino]-3-oxidanyl-propyl] dihydrogen phosphate (K6L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LYWONSBDWRVEKO-LJQANCHMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
