identifier: proteintraitsmech:BIOLIP_DWY
label: "DWY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [4-({4-[(5Z)-5-(3,4-dichlorobenzylidene)-4-oxo-4,5-dihydro-1,3-thiazol-2-yl]piperazin-1-yl}methyl)phenyl]boronic acid (DWY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CKUAZJLGUCZSNN-UNOMPAQXSA-N.
