identifier: proteintraitsmech:BIOLIP_T7M
label: "T7M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-1-(heptadecanoyloxy)-3-{[(R)-hydroxy{[(1R,2R,3R,4R,5S,6R)-2,3,5,6-tetrahydroxy-4-(phosphonooxy)cyclohexyl]oxy}phosphoryl]oxy}propan-2-yl (5Z,8Z,11Z,14Z)-icosa-5,8,11,14-tetraenoate (T7M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey WSLBJQQQZZTFBA-NPJVAJNNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
