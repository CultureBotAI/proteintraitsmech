identifier: proteintraitsmech:BIOLIP_EKY
label: "EKY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{4-[(2,5-difluorophenyl)methoxy]phenoxy}-5-ethoxyaniline (EKY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey YSUBLPUJDOWYDP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EKY
synonyms:
  - synonym_text: "2-{4-[(2,5-difluorophenyl)methoxy]phenoxy}-5-ethoxyaniline-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P32418
    protein_label: "8JP0 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8jp0 chain A (resolution 3.5 Å); binding residues: L137 T138 H200 C245 E279 D828 G832 G836"
    source: CURATOR
