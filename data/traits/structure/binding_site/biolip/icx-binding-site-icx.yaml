identifier: proteintraitsmech:BIOLIP_ICX
label: "ICX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl N-[(5Z)-6-({[4-(4-iodobenzyl)phenyl]carbonyl}amino)hex-5-enoyl]glycinate (ICX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GJXNVOLPXGNHOU-CPSFFCFKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
