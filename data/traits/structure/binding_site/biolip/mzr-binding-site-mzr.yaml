    protein_label: "3B1N chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3b1n chain B (resolution 1.55 Å); binding residues: S8 D12 G48 C49 N52 F117 Q169 D253"
    source: CURATOR
