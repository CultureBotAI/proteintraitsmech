definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2S,3R,6S)-4-(HYDROXYMETHYL)-6-{[(1S,2S,3S,4R,5R)-2,3,4-TRIHYDROXY-5-(HYDROXYMETHYL)CYCLOHEXYL]AMINO}CYCLOHEX-4-ENE-1,2,3-TRIOL (VDM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey YCJYNBLLJHFIIW-MBABXGOBSA-N.
