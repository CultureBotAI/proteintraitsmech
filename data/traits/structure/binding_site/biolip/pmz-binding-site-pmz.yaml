identifier: proteintraitsmech:BIOLIP_PMZ
label: "PMZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[10-(3-DIMETHYLAMINO-PROPYL)-10H-PHENOTHIAZIN-2-YL]-ETHANONE (PMZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NOSIYYJFMPDDSA-UHFFFAOYSA-N.
