    protein_label: "4PXZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4pxz chain A (resolution 2.5 Å); binding residues: R93 C97 S101 V102 Y105 S156 N159 C175 K179 H187 V190 N191 C194 R256 Y259 Q263 K280"
    source: CURATOR
  - protein_id: UniProtKB:P47900
