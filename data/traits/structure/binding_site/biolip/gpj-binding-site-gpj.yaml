    protein_label: "3NVS chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3nvs chain A (resolution 1.021 Å); binding residues: K22 G96 R124 Q172 D314 E342 R345 H386 R387"
    source: CURATOR
  - protein_id: UniProtKB:Q83E11
