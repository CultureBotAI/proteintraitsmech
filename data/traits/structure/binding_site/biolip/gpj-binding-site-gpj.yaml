identifier: proteintraitsmech:BIOLIP_GPJ
label: "GPJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GLYPHOSATE (GPJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey XDDAORKBJWWYJS-UHFFFAOYSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
