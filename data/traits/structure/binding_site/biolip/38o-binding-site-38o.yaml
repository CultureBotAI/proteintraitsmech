identifier: proteintraitsmech:BIOLIP_38O
label: "38O-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-amino-5-fluoro-3-[5-(4-methylpiperazin-1-yl)-1H-benzimidazol-2-yl]quinolin-2(1H)-one (38O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey PIQCTGMSNWUMAF-UHFFFAOYSA-N.
