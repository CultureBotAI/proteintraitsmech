    protein_label: "4RZM chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4rzm chain B (resolution 2.33 Å); binding residues: D170 S174 W175 R177 H186 M189 S224 H231 I249 Y251 W270"
    source: CURATOR
