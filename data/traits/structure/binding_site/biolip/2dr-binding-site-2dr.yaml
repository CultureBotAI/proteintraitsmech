identifier: proteintraitsmech:BIOLIP_2DR
label: "2DR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-deoxy-beta-D-erythro-pentofuranose (2DR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PDWIQYODPROSQH-VPENINKCSA-N.
