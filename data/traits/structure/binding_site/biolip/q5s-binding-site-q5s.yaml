definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(acetylamino)-2-deoxy-1-O-[(S)-hydroxy{[(S)-hydroxy{[(2Z,6Z,10Z,14Z,18Z,22Z,26Z)-3,7,11,15,19,23,27,31-octamethyldotriaconta-2,6,10,14,18,22,26,30-octaen-1-yl]oxy}phosphoryl]oxy}phosphoryl]-alpha-D-glucopyranose (Q5S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UHEQUFGFBDQLSB-MUZKLJMZSA-N.
