identifier: proteintraitsmech:BIOLIP_WV8
label: "WV8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,4S)-4-[(2S)-2-phenylbutyl]-1,3-oxazolidin-2-amine (WV8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IXDKFUBXESWHSL-JQWIXIFHSA-N.
