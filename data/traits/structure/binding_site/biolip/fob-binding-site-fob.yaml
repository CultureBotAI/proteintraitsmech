    protein_label: "4GAE chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4gae chain A (resolution 2.3 Å); binding residues: D231 S232 S269 S270 W296 S306 N311 K312 C338"
    source: CURATOR
