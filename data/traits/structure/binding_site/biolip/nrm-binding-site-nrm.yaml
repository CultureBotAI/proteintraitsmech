    protein_label: "3NRM chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3nrm chain A (resolution 3.05 Å); binding residues: R137 L139 L194 L210 Y212 A213 P214 G216 L263 A273 D274"
    source: CURATOR
