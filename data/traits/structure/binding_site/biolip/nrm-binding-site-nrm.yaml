identifier: proteintraitsmech:BIOLIP_NRM
label: "NRM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(3-methylisothiazol-5-yl)-3-(1H-pyrazol-4-yl)imidazo[1,2-a]pyrazin-8-amine (NRM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XWFNCZUACYBPGT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NRM
synonyms:
