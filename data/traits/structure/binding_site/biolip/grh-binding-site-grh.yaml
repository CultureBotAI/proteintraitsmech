identifier: proteintraitsmech:BIOLIP_GRH
label: "GRH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{R})-~{N}-[4-(3-chloranylphenoxy)-3-sulfamoyl-phenyl]-2-phenyl-propanamide (GRH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QEACKKQHBTVOBS-CQSZACIVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
