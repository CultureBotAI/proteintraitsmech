definition: >-
  A structure-derived ligand-binding site at which the ligand N-(tert-butoxycarbonyl)-3-methyl-L-valyl-(4R)-N-{(2S)-1-[(cyclopropylsulfonyl)amino]-4,4-difluoro-1-oxobutan-2-yl}-4-[(7-methoxy-2-phenylquinolin-4-yl)oxy]-L-prolinamide (Z1B) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LGOOHMFDMLUYDW-RXAGJDKHSA-N.
