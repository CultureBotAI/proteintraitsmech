identifier: proteintraitsmech:BIOLIP_PN1
label: "PN1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,6R)-6-{[(2R)-2-AMINO-2-PHENYLETHANOYL]AMINO}-3,3-DIMETHYL-7-OXO-4-THIA-1-AZABICYCLO[3.2.0]HEPTANE-2-CARBOXYLIC ACID (PN1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AVKUERGKIZMTKX-BBGACYKPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
