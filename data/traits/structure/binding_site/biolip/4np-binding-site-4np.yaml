identifier: proteintraitsmech:BIOLIP_4NP
label: "4NP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-NITROPHENYL PHOSPHATE (4NP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey XZKIHKMTEMTJQX-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
