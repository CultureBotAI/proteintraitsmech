definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R},3~{S},4~{R},5~{R})-5-[4-(acetamidomethyl)-1,2,3-triazol-1-yl]-3,4-bis(oxidanyl)oxolan-2-yl]methyl dihydrogen phosphate (LJN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WKSDLIPBAPRDGN-ZYUZMQFOSA-N.
