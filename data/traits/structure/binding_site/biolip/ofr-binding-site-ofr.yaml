definition: >-
  A structure-derived ligand-binding site at which the ligand prop-2-en-1-yl (5S)-1-ethyl-7-methyl-5-(4-methylphenyl)-2,4-dioxo-1,2,3,4,5,8-hexahydropyrido[2,3-d]pyrimidine-6-carboxylate (OFR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WWSMMSQOAGMCFL-MRXNPFEDSA-N.
