identifier: proteintraitsmech:BIOLIP_R5F
label: "R5F-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Rotigotine (R5F) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey KFQYTPMOWPVWEJ-INIZCTEOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:R5F
synonyms:
  - synonym_text: "Rotigotine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "8IRV chain R (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8irv chain R (resolution 3.1 Å); binding residues: D120 S219 S229 S233 F312 F313 F341 V345 W349"
    source: CURATOR
