identifier: proteintraitsmech:BIOLIP_TOY
label: "TOY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand TOBRAMYCIN (TOY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 8 binding-site occurrences across 5 PDB structures; ligand InChIKey NLVFBUXFDBBNBW-PBSUHMDJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
