identifier: proteintraitsmech:BIOLIP_D4R
label: "D4R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4R,7aR,12bS)-7,9-dimethoxy-3-methyl-2,4,7a,13-tetrahydro-1H-4,12-methanobenzofuro[3,2-e]isoquinoline (D4R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FQXXSQDCDRQNQE-VMDGZTHMSA-N.
