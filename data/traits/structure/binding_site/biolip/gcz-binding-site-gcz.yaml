identifier: proteintraitsmech:BIOLIP_GCZ
label: "GCZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(3aR,6aS)-hexahydrocyclopenta[c]pyrrol-2(1H)-ylcarbamoyl]-4-methylbenzenesulfonamide (GCZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BOVGTQGAOIONJV-BETUJISGSA-N.
