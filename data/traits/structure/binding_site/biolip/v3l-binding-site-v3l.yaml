identifier: proteintraitsmech:BIOLIP_V3L
label: "V3L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2'-O-(5-O-phosphono-alpha-D-ribofuranosyl)adenosine 5'-(dihydrogen phosphate) (V3L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BHIWBSNWEZIHHL-KEOHHSTQSA-N.
