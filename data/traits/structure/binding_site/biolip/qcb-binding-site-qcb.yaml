identifier: proteintraitsmech:BIOLIP_QCB
label: "QCB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},3~{R})-2-[2-[[(2~{R},3~{S},4~{R},5~{R})-5-(6-aminopurin-9-yl)-3,4-bis(oxidanyl)oxolan-2-yl]methoxy-oxidanyl-phosphoryl]ethanoylamino]-3-oxidanyl-butanoic acid (QCB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DWVLLSYZUNNOOL-JOHRSRDASA-N.
