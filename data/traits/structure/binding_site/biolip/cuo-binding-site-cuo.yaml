identifier: proteintraitsmech:BIOLIP_CUO
label: "CUO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CU2-O2 CLUSTER (CUO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 18 binding-site occurrences across 5 PDB structures; ligand InChIKey PCGDDKBKPXANNY-UHFFFAOYSA-N.
