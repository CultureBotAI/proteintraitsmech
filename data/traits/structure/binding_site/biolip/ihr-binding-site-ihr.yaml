    protein_label: "7Z8W chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7z8w chain B (resolution 1.9 Å); binding residues: K416 S417 Y418 D422 W432 C433 W486 W491 D528"
    source: CURATOR
