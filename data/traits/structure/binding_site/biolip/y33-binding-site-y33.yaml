  A structure-derived ligand-binding site at which the ligand (5R)-3-{[(3S,5S)-5-(dimethylcarbamoyl)pyrrolidin-3-yl]sulfanyl}-5-[(2S,3R)-3-hydroxy-1-oxobutan-2-yl]-5-methyl-4,5-dihydro-1H-pyrrole-2-carboxylic acid (Y33) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VXMSHTHJORSDKD-YTOYJYLESA-N.
