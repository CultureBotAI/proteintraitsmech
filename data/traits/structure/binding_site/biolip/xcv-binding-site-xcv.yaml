identifier: proteintraitsmech:BIOLIP_XCV
label: "XCV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1R)-1-(5-cyano-1H-pyrazol-3-yl)ethyl]-3-methyl-4-{1-[6-(trifluoromethyl)pyridin-3-yl]cyclopropyl}-1H-pyrrole-2-carboxamide (XCV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey POQZTSJDTKESSW-GFCCVEGCSA-N.
