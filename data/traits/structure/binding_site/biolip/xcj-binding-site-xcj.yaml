identifier: proteintraitsmech:BIOLIP_XCJ
label: "XCJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[6-(methylsulfonyl)-1,3-benzothiazol-2-yl]-2-[2-(1H-pyrrol-1-yl)-1,3-thiazol-4-yl]acetamide (XCJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KRKFVNMZGZWPHC-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
