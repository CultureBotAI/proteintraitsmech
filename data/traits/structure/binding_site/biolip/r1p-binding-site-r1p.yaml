identifier: proteintraitsmech:BIOLIP_R1P
label: "R1P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-O-phosphono-alpha-D-ribofuranose (R1P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 4 PDB structures; ligand InChIKey YXJDFQJKERBOBM-TXICZTDVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
