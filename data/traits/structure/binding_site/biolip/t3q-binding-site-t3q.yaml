identifier: proteintraitsmech:BIOLIP_T3Q
label: "T3Q-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3R,4S,5S,6R)-4-amino-3,5-dihydroxy-6-methyloxan-2-yl][hydroxy-[[(2R,3S,5R)-3-hydroxy-5-(5-methyl-2,4-dioxopyrimidin-1-yl)oxolan-2-yl]methoxy]phosphoryl] hydrogen phosphate (T3Q) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey KVYJLJOGNUNRJK-HALQBZCBSA-N.
