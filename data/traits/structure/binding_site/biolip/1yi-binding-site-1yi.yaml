identifier: proteintraitsmech:BIOLIP_1YI
label: "1YI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[2-(dimethylamino)ethyl]-2-methyl-2-[4-[4-[[2-methyl-5-[(2S,3R,4R,5S,6R)-6-methylsulfanyl-3,4,5-tris(oxidanyl)oxan-2-yl]phenyl]methyl]phenyl]butanoylamino]propanamide (1YI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BNPZTRDIESRGTC-IXYVTWBDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
