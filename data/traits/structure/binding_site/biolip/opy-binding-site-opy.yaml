identifier: proteintraitsmech:BIOLIP_OPY
label: "OPY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-4-oxo-4-piperidin-1-ylbutane-1,3-diamine (OPY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RKBKYSFKXFKBBM-QMMMGPOBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
