identifier: proteintraitsmech:BIOLIP_C5U
label: "C5U-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand dimethyl 2,6-dimethyl-4-(2-nitrophenyl)-1,4-dihydropyridine-3,5-dicarboxylate (C5U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HYIMSNHJOBLJNT-UHFFFAOYSA-N.
