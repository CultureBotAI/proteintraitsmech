identifier: proteintraitsmech:BIOLIP_A1IJL
label: "A1IJL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-methyl-~{N}-[(1~{S})-1-(1-methylpyrazol-3-yl)-2-oxidanyl-ethyl]-4-[4-(trifluoromethyl)phenyl]pyrazolo[3,4-b]indole-7-carboxamide (A1IJL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OQLMDCHCWZTHBV-HXUWFJFHSA-N.
