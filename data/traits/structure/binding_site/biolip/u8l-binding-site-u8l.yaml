identifier: proteintraitsmech:BIOLIP_U8L
label: "U8L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,8S,13S)-8-[(4-hydroxy-9,10-dioxo-9,10-dihydroanthracen-1-yl)amino]-12-methoxy-10-methylbicyclo[7.3.1]trideca-9,11-diene-2,6-diyne-13-carbaldehyde (U8L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NLNOIBOHBHXKKN-NYVOZVTQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
