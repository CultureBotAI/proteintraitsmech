identifier: proteintraitsmech:BIOLIP_J4G
label: "J4G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3'-deoxy-3'-[(L-alpha-glutamyl)amino]adenosine 5'-(dihydrogen phosphate) (J4G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SDRBGGWQNQDMBH-HQMNMZSFSA-N.
