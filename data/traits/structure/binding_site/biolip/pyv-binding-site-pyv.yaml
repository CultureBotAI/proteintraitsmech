identifier: proteintraitsmech:BIOLIP_PYV
label: "PYV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-bromo-N-(pyridin-2-ylmethyl)naphthalene-1-sulfonamide (PYV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 4 PDB structures; ligand InChIKey GJSDYQXOSHKOGX-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
