identifier: proteintraitsmech:BIOLIP_11D
label: "11D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 11-({[5-(dimethylamino)naphthalen-1-yl]sulfonyl}amino)undecanoic acid (11D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CEPGVMDMVJGHFQ-UHFFFAOYSA-N.
