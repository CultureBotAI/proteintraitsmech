identifier: proteintraitsmech:BIOLIP_CER
label: "CER-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S, 3R)-3-HYDROXY-4-OXO-7,10-TRANS,TRANS-DODECADIENAMIDE (CER) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey QEPYZBPOTYDXNA-FECJWDPASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
