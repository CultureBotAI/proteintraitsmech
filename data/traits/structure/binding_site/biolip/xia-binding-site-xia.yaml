identifier: proteintraitsmech:BIOLIP_XIA
label: "XIA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3S)-2-methyl-2-(4-methylpent-3-enyl)-3-oxidanyl-3,4-dihydrochromene-6-carboxylic acid (XIA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZBMFQFAGMKFJIS-DOTOQJQBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:XIA
synonyms:
