    protein_label: "6ISL chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6isl chain A (resolution 1.77 Å); binding residues: Y46 A50 Y90 F93 H102 W118 E136 Y153 P157"
    source: CURATOR
