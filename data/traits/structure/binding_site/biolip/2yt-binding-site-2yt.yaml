identifier: proteintraitsmech:BIOLIP_2YT
label: "2YT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand L-phenylalanyl-N-[(2S,3S)-6-carbamimidamido-1-chloro-2-hydroxyhexan-3-yl]-L-phenylalaninamide (2YT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZKHBINZTIMXMQW-MYGLTJDJSA-N.
