identifier: proteintraitsmech:BIOLIP_OV3
label: "OV3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{S},2~{R},3~{R},4~{S},6~{S})-3,4,6-tris(oxidanyl)-2-[2-[2,2,2-tris(fluoranyl)ethanoylamino]ethoxy]cyclohexane-1-carboxylic acid (OV3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LCSQNEOJAYNASK-QYYLWSOASA-N.
