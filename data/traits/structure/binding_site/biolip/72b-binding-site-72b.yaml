definition: >-
  A structure-derived ligand-binding site at which the ligand [(amino-kappaN)methanethiolato](3-fluoro-9-methoxypyrido[2,3-a]pyrrolo[3,4-c]carbazole-5,7(6H,12H)-dionato-kappa~2~N,N')(N-methyl-1,4,7-trithiecan-9-amine-kappa~3~S~1~,S~4~,S~7~)ruthenium (72B) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OGOOURRFJRRMJC-UHFFFAOYSA-M.
