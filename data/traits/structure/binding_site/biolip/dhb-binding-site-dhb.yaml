identifier: proteintraitsmech:BIOLIP_DHB
label: "DHB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,4-DIHYDROXYBENZOIC ACID (DHB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey YQUVCSBJEUQKSH-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
