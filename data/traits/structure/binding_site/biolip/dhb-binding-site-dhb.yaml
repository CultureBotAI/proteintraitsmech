    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P22636
    protein_label: "1B4U chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1b4u chain B (resolution 2.2 Å); binding residues: P14 H61 H127 H195 S269 N270 T271"
    source: CURATOR
