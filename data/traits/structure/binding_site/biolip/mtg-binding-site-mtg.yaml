identifier: proteintraitsmech:BIOLIP_MTG
label: "MTG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [METHYLTHIO]ACETATE (MTG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HGTBAIVLETUVCG-UHFFFAOYSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
