identifier: proteintraitsmech:BIOLIP_EB4
label: "EB4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N,N',N''-[(3S,7S,11S)-2,6,10-trioxo-1,5,9-trioxacyclododecane-3,7,11-triyl]tris(2,3-dihydroxybenzamide) (EB4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey SERBHKJMVBATSJ-BZSNNMDCSA-N.
