identifier: proteintraitsmech:BIOLIP_FMC
label: "FMC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S)-1-(7-amino-1H-pyrazolo[4,3-d]pyrimidin-3-yl)-1,4-anhydro-D-ribitol (FMC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey KBHMEHLJSZMEMI-KSYZLYKTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
