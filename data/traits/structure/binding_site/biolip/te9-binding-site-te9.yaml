identifier: proteintraitsmech:BIOLIP_TE9
label: "TE9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand delafloxacin (TE9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DYDCPNMLZGFQTM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:TE9
synonyms:
  - synonym_text: "delafloxacin-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P72525
    protein_label: "8QMB chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8qmb chain A (resolution 2.0 Å); binding residues: L412 D435 R456 S1079"
    source: CURATOR
causal_graphs:
- graph_id: ligand_binding
  title: Binding of delafloxacin at the delafloxacin-binding site
  description: Residue-level ligand contact transcribed from BioLiP2 for PDB 8qmb chain A. Residue numbering
    is the PDB author frame BioLiP reports; each residue's identity was checked against BioLiP's own receptor
    sequence. 4 binding residues.
