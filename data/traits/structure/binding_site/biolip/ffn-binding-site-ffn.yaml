identifier: proteintraitsmech:BIOLIP_FFN
label: "FFN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(4-fluorophenyl)-2-methyl-3~{H}-thieno[2,3-d]pyrimidin-4-one (FFN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PEYKEBUFADUZJK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
