definition: >-
  A structure-derived ligand-binding site at which the ligand 4-amino-4-deoxy-1-O-[(S)-hydroxy{[(2E,6E,10Z,14Z,18Z,22E,26E,30E)-3,7,11,15,19,23,27,31,35-nonamethylhexatriaconta-2,6,10,14,18,22,26,30,34-nonaen-1-yl]oxy}phosphoryl]-alpha-L-arabinopyranose (I0O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GWCJFQXZVUXOPR-BFSVMLBVSA-N.
