    protein_label: "5Y7Z chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5y7z chain A (resolution 2.804 Å); binding residues: L46 K69 C126 K127 G128 E132 L180 C190"
    source: CURATOR
