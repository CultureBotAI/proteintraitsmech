identifier: proteintraitsmech:BIOLIP_U9I
label: "U9I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl (3R)-4-[(3,4-dichlorophenyl)acetyl]-3-[(pyrrolidin-1-yl)methyl]piperazine-1-carboxylate (U9I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HJUAKZYKCANOOZ-OAHLLOKOSA-N.
