identifier: proteintraitsmech:BIOLIP_KKX
label: "KKX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},5~{S},6~{S})-2-acetamido-6-[[2-methyl-3-oxidanyl-5-(phosphonooxymethyl)pyridin-4-yl]methylamino]-5,7-bis(oxidanyl)heptanoic acid (KKX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FNGADGGFBAIBRP-KKUMJFAQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
