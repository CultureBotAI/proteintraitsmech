identifier: proteintraitsmech:BIOLIP_NGV
label: "NGV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand METHYL 5,7-DIHYDROXY-2-METHYL-4,6,11-TRIOXO-3,4,6,11-TETRAHYDROTETRACENE-1-CARBOXYLATE (NGV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey QHNJNOBWURJIEK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
