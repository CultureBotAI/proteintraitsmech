definition: >-
  A structure-derived ligand-binding site at which the ligand (5R,6R)-6-(methylamino)-5,6,7,8-tetrahydronaphthalene-1,2,5-triol (G1I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey VJBMHARWYAGTQQ-PSASIEDQSA-N.
