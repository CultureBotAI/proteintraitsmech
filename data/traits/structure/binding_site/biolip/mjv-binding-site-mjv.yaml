identifier: proteintraitsmech:BIOLIP_MJV
label: "MJV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{2-[4-(5-chloro-2-oxo-2,3-dihydro-1H-benzimidazol-1-yl)piperidin-1-yl]ethyl}-4-fluorobenzamide (MJV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NBHPRWLFLUBAIE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
