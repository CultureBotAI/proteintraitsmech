identifier: proteintraitsmech:BIOLIP_KKF
label: "KKF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-[(2E)-3-(4-chlorophenyl)prop-2-enoyl]-3-[(3,4-dichlorophenyl)methyl]-1-oxa-3,8-diazaspiro[4.5]decan-2-one (KKF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RDDLWMWIRXGSJM-XBXARRHUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
