identifier: proteintraitsmech:BIOLIP_FHC
label: "FHC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-FLUORO-3-(4-HYDROXYPHENYL)-2E-PROPENEOATE (FHC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey SBIZDOWXYPNTOJ-VMPITWQZSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
