identifier: proteintraitsmech:BIOLIP_STL
label: "STL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand RESVERATROL (STL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 16 binding-site occurrences across 9 PDB structures; ligand InChIKey LUKBXSAWLPMMSZ-OWOJBTEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
