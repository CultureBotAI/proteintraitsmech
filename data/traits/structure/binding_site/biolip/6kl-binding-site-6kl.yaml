identifier: proteintraitsmech:BIOLIP_6KL
label: "6KL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 4,5-bisacetamido-3,4,5-trideoxy-D-glycero-alpha-D-galacto-non-2-ulopyranosidonic acid (6KL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey YEXCUFMMPWRNRI-KXEMTNKZSA-N.
