identifier: proteintraitsmech:BIOLIP_J1O
label: "J1O-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[(2R)-3,3-dimethyl-2-oxidanyl-4-phosphonooxy-butanoyl]amino]butanoic acid (J1O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PLUYTYOYZMZCNI-QMMMGPOBSA-N.
