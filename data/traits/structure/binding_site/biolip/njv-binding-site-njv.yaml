identifier: proteintraitsmech:BIOLIP_NJV
label: "NJV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(4-cyclopropyl-1H-imidazol-1-yl)-2-fluoro-4-methyl-N-{6-[4-(propan-2-yl)-4H-1,2,4-triazol-3-yl]pyridin-2-yl}benzamide (NJV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey YIDDLAAKOYYGJG-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
