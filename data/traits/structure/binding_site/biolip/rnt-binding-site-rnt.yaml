identifier: proteintraitsmech:BIOLIP_RNT
label: "RNT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand L-RHAMNITOL (RNT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SKCKOFZKJLZSFA-BXKVDMCESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
