identifier: proteintraitsmech:BIOLIP_0JH
label: "0JH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand tert-butyl (2S)-3-[4-amino-7-(3-hydroxypropyl)-5-(4-methylphenyl)-7H-pyrrolo[2,3-d]pyrimidin-6-yl]-2-cyanopropanoate (0JH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YQNJEMHLWSEPFO-KRWDZBQOSA-N.
