    protein_label: "3DG6 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3dg6 chain A (resolution 1.6 Å); binding residues: F21 T54 M134 K160 K162 D191 N193 D242 K266 N293 Q294 I295"
