identifier: proteintraitsmech:BIOLIP_UPW
label: "UPW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[6-[(4-nitrophenyl)amino]-3-oxidanyl-pyridin-2-yl]carbonylamino]ethanoic acid (UPW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ISGBDWMUHZDQRG-UHFFFAOYSA-O.
