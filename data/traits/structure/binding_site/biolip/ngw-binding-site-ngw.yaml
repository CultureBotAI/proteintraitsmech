identifier: proteintraitsmech:BIOLIP_NGW
label: "NGW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3aR,5R,6S,7R,7aR)-5-(hydroxymethyl)-2-methyl-2,3a,5,6,7,7a-hexahydro-1H-pyrano[3,2-d][1,3]thiazole-6,7-diol (NGW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XWPUWEBFKDEDIF-GUHFPMLUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
