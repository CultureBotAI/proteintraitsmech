synonyms:
  - synonym_text: "N-(5-Chloro-2,4-dimethoxyphenyl)-N'-(5-methyl-3-isoxazolyl)-urea-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "8V8D chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8v8d chain B (resolution 3.31 Å); binding residues: L212 N213 P217 F252"
    source: CURATOR
