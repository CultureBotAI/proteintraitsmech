identifier: proteintraitsmech:BIOLIP_KWH
label: "KWH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{S})-1-propyl-2,3,4,9-tetrahydro-1~{H}-pyrido[3,4-b]indole (KWH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BBOAWHADGQBLBD-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
