label: "ZY8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4bS,8R,8aS,14bR)-7-(cyclopropylmethyl)-5,6,7,8,9,14b-hexahydro-8aH-4,8-methanobis[1]benzofuro[3,2-e:2',3'-g]isoquinoline-1,8a-diol (ZY8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZHVWWEYETMPAMX-IFKAHUTRSA-N.
