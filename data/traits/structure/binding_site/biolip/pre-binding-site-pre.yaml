identifier: proteintraitsmech:BIOLIP_PRE
label: "PRE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand PREPHENIC ACID (PRE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FPWMCUPFBRFMLH-XGAOUMNUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PRE
synonyms:
  - synonym_text: "PREPHENIC ACID-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:L8A208
    protein_label: "5J6F chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5j6f chain A (resolution 2.75 Å); binding residues: R27 I34 K38 Y46 D47 R50 M54"
    source: CURATOR
