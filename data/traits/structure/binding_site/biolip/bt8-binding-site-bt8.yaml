identifier: proteintraitsmech:BIOLIP_BT8
label: "BT8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-ethoxy-6-{2-[1-(6-methylpyridazin-3-yl)piperidin-4-yl]ethoxy}-1,2-benzoxazole (BT8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DKSVBVKHUICELN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
