identifier: proteintraitsmech:BIOLIP_FM4
label: "FM4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2R,3S)-3-methyloxiran-2-yl]-phosphonooxy-phosphinic acid (FM4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WODGUJUDEVOKET-STHAYSLISA-N.
