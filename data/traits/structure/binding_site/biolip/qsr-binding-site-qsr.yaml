identifier: proteintraitsmech:BIOLIP_QSR
label: "QSR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (9Z,21R,24R,30R,33R,44Z)-24,27,30-trihydroxy-18,24,30,36-tetraoxo-19,23,25,29,31,35-hexaoxa-24lambda~5~,30lambda~5~-dip hosphatripentaconta-9,44-diene-21,33-diyl (9Z,9'Z)di-octadec-9-enoate (QSR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey TWHQNHQPSCPQNY-WVRHUKEESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
