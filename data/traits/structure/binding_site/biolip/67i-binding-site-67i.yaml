identifier: proteintraitsmech:BIOLIP_67I
label: "67I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-azanyl-3-[5,7-bis(bromanyl)-1H-indol-3-yl]propanoic acid (67I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UURVQGNSCUCIQS-VIFPVBQESA-N.
