    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q8A397
    protein_label: "7OZ9 chain BBB (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7oz9 chain BBB (resolution 1.907 Å); binding residues: S88 W109 K153 H155 H182 H248 K330 H423"
    source: CURATOR
