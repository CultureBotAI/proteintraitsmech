identifier: proteintraitsmech:BIOLIP_CQI
label: "CQI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S},3~{S},4~{S},5~{R},6~{S})-6-[(2~{S})-3-butanoyloxy-2-heptanoyloxy-propoxy]-3,4,5-tris(oxidanyl)oxan-2-yl]methanesulfonic acid (CQI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IJGQUULJVRLGQW-CPYLTBOFSA-N.
