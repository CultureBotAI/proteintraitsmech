definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3S,4R,5R,6R)-5-acetamido-6-[[[(2R,3S,4R,5R)-5-(2,4-dioxopyrimidin-1-yl)-3,4-dihydroxy-oxolan-2-yl]methoxy-hydroxy-phosphoryl]oxy-hydroxy-phosphoryl]oxy-3,4-dihydroxy-oxane-2-carboxylic acid (HP7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey DZOGQXKQLXAPND-HHKCBAECSA-N.
