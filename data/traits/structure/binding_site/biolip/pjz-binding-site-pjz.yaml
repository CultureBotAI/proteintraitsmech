identifier: proteintraitsmech:BIOLIP_PJZ
label: "PJZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-2-(dodecanoyloxy)propyl (4E,6E,8E,10E,12E)-pentadeca-4,6,8,10,12-pentaenoate (PJZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ONKSLGBBXPETKB-WGIZECGSSA-N.
