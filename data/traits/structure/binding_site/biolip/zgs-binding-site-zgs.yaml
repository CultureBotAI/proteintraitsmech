identifier: proteintraitsmech:BIOLIP_ZGS
label: "ZGS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-2-oxidanyl-3-[oxidanyl-[2-(trimethyl-$l^{4}-azanyl)ethoxy]phosphoryl]oxy-propyl] (9~{Z},12~{Z},15~{Z})-octadeca-9,12,15-trienoate (ZGS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey WKQNRCYKYCKESD-YVHLTTHBSA-O.
