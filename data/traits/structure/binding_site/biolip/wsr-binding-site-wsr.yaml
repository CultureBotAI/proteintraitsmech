identifier: proteintraitsmech:BIOLIP_WSR
label: "WSR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,3aS,3bR,5aR,7R,9aS,9bS,11aR)-1-[(2R)-6-fluoro-5-oxohexan-2-yl]-9a,11a-dimethylhexadecahydro-1H-cyclopenta[a]phenanthren-7-yl hydrogen sulfate (non-preferred name) (WSR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey MVPISWRWXKQVBV-CIQXVCGBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
