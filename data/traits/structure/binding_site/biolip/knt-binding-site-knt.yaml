identifier: proteintraitsmech:BIOLIP_KNT
label: "KNT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand pranlukast (KNT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NBQKINXMPLXUET-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:KNT
synonyms:
  - synonym_text: "pranlukast-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "6RZ4 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6rz4 chain A (resolution 2.7 Å); binding residues: Y104 Y108 F158 F174 P176 L189 S193 R253 H256 L257 L281"
    source: CURATOR
