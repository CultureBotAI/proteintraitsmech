      snippet: Y104 Y108 F158 F174 P176 L189 S193 R253 H256 L257 L281
      notes: 'BioLiP2 record line for PDB 6rz4 chain A, ligand KNT: binding-site residues in PDB author
        numbering (column 8 of BioLiP_nr.txt), cross-checked against BioLiP''s own receptor sequence via
