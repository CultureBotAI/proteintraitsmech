- graph_id: ligand_binding
  title: Binding of pranlukast at the pranlukast-binding site
  description: Residue-level ligand contact transcribed from BioLiP2 for PDB 6rz4 chain A. Residue numbering
    is the PDB author frame BioLiP reports; each residue's identity was checked against BioLiP's own receptor
    sequence. 11 binding residues.
