identifier: proteintraitsmech:BIOLIP_CXT
label: "CXT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Carboxyatractyloside (CXT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey AQFATIOBERWBDY-LNQSNDDKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
