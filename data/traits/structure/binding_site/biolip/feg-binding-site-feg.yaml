identifier: proteintraitsmech:BIOLIP_FEG
label: "FEG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(S)-{[2-(carboxymethyl)-6-hydroxy-3,5-dimethylpyridin-4-yl]oxy}(hydroxy)phosphoryl]guanosine (FEG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey GTHOTKPHMGEHFD-ACDAHVMNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
