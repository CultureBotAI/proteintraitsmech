identifier: proteintraitsmech:BIOLIP_PO9
label: "PO9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2R)-2-hexadecanoyloxy-3-[oxidanyl-[(2S)-2-oxidanyl-3-phosphonooxy-propoxy]phosphoryl]oxy-propyl] (Z)-octadec-9-enoate (PO9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WQMDYQSTTXRXLQ-HGWHEPCSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
