    protein_label: "4N4W chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4n4w chain A (resolution 2.8 Å); binding residues: M230 F274 W281 M326 V329 S387 F391 Y394 V463 T466 H470 E518 N521 L522 M525 T528"
    source: CURATOR
