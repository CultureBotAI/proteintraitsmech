identifier: proteintraitsmech:BIOLIP_SNT
label: "SNT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E)-N-(4-benzylpiperazin-1-yl)-1-(3,5-dimethyl-1-phenyl-1H-pyrazol-4-yl)methanimine (SNT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FOORCIAZMIWALX-JJIBRWJFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:SNT
synonyms:
