identifier: proteintraitsmech:BIOLIP_NMY
label: "NMY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand NEOMYCIN (NMY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey PGBHMTALBVVCIT-VCIWKGPPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
