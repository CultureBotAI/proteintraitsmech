identifier: proteintraitsmech:BIOLIP_H73
label: "H73-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-S-[(2R,4R)-1-{2-[(2-amino-7,7-dimethyl-4-oxo-3,4,7,8-tetrahydropteridine-6-carbonyl)amino]ethyl}-2-carboxypiperidin-4-yl]-5'-thioadenosine (H73) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey DFLAELLQWVMGCU-NERDUYAPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
