identifier: proteintraitsmech:BIOLIP_AC8
label: "AC8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2R,3R,4R,5R)-5-(6-amino-9H-purin-9-yl)-3,4-bis(phosphonooxy)tetrahydrofuran-2-yl]methyl (3R)-3-hydroxy-2,2-dimethyl-4-oxo-4-({3-oxo-3-[(2-sulfanylethyl)amino]propyl}amino)butyl dihydrogen diphosphate (AC8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SAXULFDJRFDTDN-IBOSZNHHSA-N.
