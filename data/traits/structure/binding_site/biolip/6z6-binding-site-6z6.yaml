identifier: proteintraitsmech:BIOLIP_6Z6
label: "6Z6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-Amino-5,6,7,8-tetrahydro-4-(4-methoxyphenyl)-7-(naphthalen-1-yl)-5-oxo-4H-chromene-3-carbonitrile (6Z6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YBMGNDPBARCLFT-YDONVPIESA-N.
