identifier: proteintraitsmech:BIOLIP_JJ5
label: "JJ5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(3,4-dichlorophenyl)methyl]-7~{H}-pyrrolo[3,2-c]pyridin-4-one (JJ5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GULZPFKZRPRXPF-UHFFFAOYSA-N.
