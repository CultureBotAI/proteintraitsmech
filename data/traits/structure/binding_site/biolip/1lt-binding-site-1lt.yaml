identifier: proteintraitsmech:BIOLIP_1LT
label: "1LT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-N~1~-{4-methyl-5-[2-(1,1,1-trifluoro-2-methylpropan-2-yl)pyridin-4-yl]-1,3-thiazol-2-yl}pyrrolidine-1,2-dicarboxamide (1LT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey STUWGJZDJHPWGZ-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
