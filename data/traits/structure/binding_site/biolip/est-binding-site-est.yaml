    protein_label: "1A27 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1a27 chain A (resolution 1.9 Å); binding residues: S142 V143 G144 M147 L149 Y155 V225 F259 M279"
    source: CURATOR
  - protein_id: UniProtKB:Q99LC4
    protein_label: "1JNN chain H (BioLiP receptor)"
