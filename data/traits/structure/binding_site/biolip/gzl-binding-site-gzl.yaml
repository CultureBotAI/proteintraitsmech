identifier: proteintraitsmech:BIOLIP_GZL
label: "GZL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand beta-D-galactofuranose (GZL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 11 binding-site occurrences across 4 PDB structures; ligand InChIKey AVVWPBAENSWJCB-DGPNFKTASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
