    protein_label: "5FBU chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5fbu chain A (resolution 2.85 Å); binding residues: V333 Q336 Q337 Y351 T355 P356 V368 L387 L478 F479 M491 R666 M673 H825"
    source: CURATOR
