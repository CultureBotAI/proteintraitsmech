    protein_label: "3AGN chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3agn chain A (resolution 0.96 Å); binding residues: Y39 H41 Y44 E46 E49 E62 R85 H101 D108 F110"
    source: CURATOR
