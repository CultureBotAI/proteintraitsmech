identifier: proteintraitsmech:BIOLIP_86I
label: "86I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[(7-methyl-2-propyl-imidazo[4,5-b]pyridin-4-yl)methyl]-2-[2-(1H-1,2,3,4-tetrazol-5-yl)phenyl]-1,3-benzothiazole (86I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LGDMZWWVVLGYPR-UHFFFAOYSA-N.
