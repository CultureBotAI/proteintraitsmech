identifier: proteintraitsmech:BIOLIP_2W2
label: "2W2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1S)-4-carbamimidamido-1-carboxybutyl]-D-glutamic acid (2W2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LMKYZBGVKHTLTN-NKWVEPMBSA-N.
