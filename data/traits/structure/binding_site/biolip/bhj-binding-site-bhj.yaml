identifier: proteintraitsmech:BIOLIP_BHJ
label: "BHJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {(3S)-7-[(2-chloro-5-{5-(methylsulfonyl)-1-[3-(morpholin-4-yl)propyl]-4,5,6,7-tetrahydro-1H-pyrazolo[4,3-c]pyridin-3-yl}phenyl)ethynyl]-1,2,3,4-tetrahydroisoquinolin-3-yl}(piperidin-1-yl)methanone (BHJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BIYANWMTXPESQI-UMSFTDKQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
