identifier: proteintraitsmech:BIOLIP_03P
label: "03P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{2-[4-({3-chloro-4-[3-(trifluoromethyl)phenoxy]phenyl}amino)-5H-pyrrolo[3,2-d]pyrimidin-5-yl]ethyl}-3-hydroxy-3-methylbutanamide (03P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZYQXEVJIFYIBHZ-UHFFFAOYSA-N.
