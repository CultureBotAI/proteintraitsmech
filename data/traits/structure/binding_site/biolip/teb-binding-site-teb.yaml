identifier: proteintraitsmech:BIOLIP_TEB
label: "TEB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4R,5S)-3-(1-(4,5-dihydrothiazol-2-yl)azetidin-3-ylthio)-5-((2S,3R)-3-hydroxy-1-oxobutan-2-yl)-4-methyl-4,5- dihydro-1H-pyrrole-2-carboxylic acid (TEB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PGCJBZBFZXWIGF-CNVPUSNMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
