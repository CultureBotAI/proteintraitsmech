identifier: proteintraitsmech:BIOLIP_EVY
label: "EVY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-hexyl-N-[(3S)-2-oxooxolan-3-yl]decanamide (EVY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XGYNUFAUHRHVSH-ROUUACIJSA-N.
