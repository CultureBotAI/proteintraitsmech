    protein_label: "6CBO chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6cbo chain C (resolution 1.6 Å); binding residues: T16 G107 T108 Y132 H133 S178 D206 V208 K209 K232 D345 N346 A393 D395"
    source: CURATOR
