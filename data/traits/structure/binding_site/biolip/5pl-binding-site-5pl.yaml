identifier: proteintraitsmech:BIOLIP_5PL
label: "5PL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,4S,6R)-6-({[2-(ACETYLAMINO)-2-DEOXY-ALPHA-D-GLUCOPYRANOSYL]OXY}METHYL)-4-HYDROXY-1-{[(15-METHYLHEXADECANOYL)OXY]METHYL}-4-OXIDO-7-OXO-3,5-DIOXA-8-AZA-4-PHOSPHAHEPTACOS-1-YL 15-METHYLHEXADECANOATE (5PL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey LEQHPGOQHCQGAI-TYASGWLASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
