identifier: proteintraitsmech:BIOLIP_N37
label: "N37-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 9-{9-amino-6-[(3-carbamoylphenyl)ethynyl]-5,6,7,8,9-pentadeoxy-D-glycero-alpha-L-talo-decofuranuronosyl}-9H-purin-6-amine (N37) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QRKSTGPKAQGBDD-GGPTZFPQSA-N.
