identifier: proteintraitsmech:BIOLIP_BMJ
label: "BMJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (12R)-12-methyltetradecanoic acid (BMJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XKLJLHAPJBUBNL-CQSZACIVSA-N.
