definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[2-methyl-5-[8-[4-(methylsulfonylamino)phenyl]-2-oxidanylidene-benzo[h][1,6]naphthyridin-1-yl]phenyl]-3-oxidanyl-propanamide (H88) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PBOKXQRUWSFTHG-UHFFFAOYSA-N.
