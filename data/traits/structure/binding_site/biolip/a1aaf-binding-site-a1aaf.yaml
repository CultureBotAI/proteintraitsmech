definition: >-
  A structure-derived ligand-binding site at which the ligand methyl (1S,2R,3S,4R,5R)-4-{2-[(5-chlorothiophen-2-yl)ethynyl]-6-(methylamino)-9H-purin-9-yl}-2,3-dihydroxybicyclo[3.1.0]hexane-1-carboxylate (A1AAF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OXHKHNQYCDYUIU-LJARFEBYSA-N.
