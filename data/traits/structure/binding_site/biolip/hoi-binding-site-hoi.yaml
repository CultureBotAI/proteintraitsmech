identifier: proteintraitsmech:BIOLIP_HOI
label: "HOI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[4-[[2-methoxy-5-[(2~{S})-5-oxidanyl-4-oxidanylidene-3-(phenylmethyl)-1,2-dihydroquinazolin-2-yl]phenyl]methoxy]phenyl]ethanamide (HOI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JRVXFGNCHKHBPA-PMERELPUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
