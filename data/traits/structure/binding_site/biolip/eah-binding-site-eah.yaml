identifier: proteintraitsmech:BIOLIP_EAH
label: "EAH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S,7E,9E,11Z,14Z)-5-hydroxyicosa-7,9,11,14-tetraenoic acid (EAH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey DVGDBDLZYCUGNU-LBIUVHPXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EAH
synonyms:
  - synonym_text: "(5S,7E,9E,11Z,14Z)-5-hydroxyicosa-7,9,11,14-tetraenoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q95NY5
    protein_label: "3NHI chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3nhi chain A (resolution 1.43 Å); binding residues: L13 Y16 Y20 W37 W40 L42 Y52 V56 L60 Y117 G134 T135 K152"
    source: CURATOR
  - protein_id: UniProtKB:F8QQG5
    protein_label: "3U3U chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3u3u chain C (resolution 2.5 Å); binding residues: H53 W59 V126 H130 K133"
    source: CURATOR
