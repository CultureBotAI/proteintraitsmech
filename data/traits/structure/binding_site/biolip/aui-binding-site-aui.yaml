identifier: proteintraitsmech:BIOLIP_AUI
label: "AUI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[(2E,6E,9R)-9-hydroxy-3,7,11-trimethyldodeca-2,6,10-trien-1-yl]-2-methylquinolin-4(1H)-one (AUI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ODRSQPIWTIGZOH-ZDQFAWOQSA-N.
