identifier: proteintraitsmech:BIOLIP_DCR
label: "DCR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand icosanoic acid (DCR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey VKOBVWXKNCXXDE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:DCR
synonyms:
  - synonym_text: "icosanoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q7S6N4
    protein_label: "3EUT chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3eut chain A (resolution 2.0 Å); binding residues: L26 I31 R60 A152 S186 T187 V190 F210 F252 V261"
    source: CURATOR
  - protein_id: UniProtKB:E9NSU2
    protein_label: "5M0P chain A (BioLiP receptor)"
