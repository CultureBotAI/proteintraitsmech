identifier: proteintraitsmech:BIOLIP_SW6
label: "SW6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4-[(4-azanyl-2-methyl-pyrimidin-5-yl)methyl]-3-methyl-5-propanoyl-thiophen-2-yl]ethyl dihydrogen phosphate (SW6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey UPALPHQNKOKTHW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
