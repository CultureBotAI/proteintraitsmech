synonyms:
  - synonym_text: "Tamsulosin-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P35348
    protein_label: "7YMJ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7ymj chain A (resolution 3.35 Å); binding residues: W102 D106 M292"
    source: CURATOR
  - protein_id: UniProtKB:Q8BHY3
    protein_label: "8XLR chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8xlr chain A (resolution 2.93 Å); binding residues: R605 G608 P610 K839"
    source: CURATOR
