identifier: proteintraitsmech:BIOLIP_RHB
label: "RHB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[9-(2-carboxyphenyl)-6-(diethylamino)-3H-xanthen-3-ylidene]-N-ethylethanaminium (RHB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey CVAVMIODJQHEEH-UHFFFAOYSA-O.
