identifier: proteintraitsmech:BIOLIP_ZDA
label: "ZDA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2',5'-dideoxyadenosine 3'-(tetrahydrogen triphosphate) (ZDA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ZJGUOEYCABTFNH-DSYKOEDSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
