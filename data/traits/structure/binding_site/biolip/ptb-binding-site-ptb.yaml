identifier: proteintraitsmech:BIOLIP_PTB
label: "PTB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5-TERT-BUTYL-1,3,4-OXADIAZOL-2-YL)[(2R)-PYRROLIDIN-2-YL]METHANONE (PTB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YUKGJYBQODPVBL-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
