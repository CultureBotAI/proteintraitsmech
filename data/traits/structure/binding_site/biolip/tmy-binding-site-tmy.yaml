identifier: proteintraitsmech:BIOLIP_TMY
label: "TMY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ethyl (2,3,4-trimethoxy-6-octanoylphenyl)acetate (TMY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey WCYMJQXRLIDSAQ-UHFFFAOYSA-N.
