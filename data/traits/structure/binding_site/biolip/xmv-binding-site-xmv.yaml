identifier: proteintraitsmech:BIOLIP_XMV
label: "XMV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{[5-({(2S)-2-butyl-5-oxo-4-[3-(trifluoromethoxy)phenyl]piperazin-1-yl}methyl)-1H-imidazol-1-yl]methyl}benzonitrile (XMV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VSMQDFPGHHELTG-QHCPKHFHSA-N.
