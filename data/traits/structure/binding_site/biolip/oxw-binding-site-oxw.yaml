identifier: proteintraitsmech:BIOLIP_OXW
label: "OXW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-fluoranyl-2-[5-[[1-(1-methylpiperidin-4-yl)pyrazol-4-yl]amino]-[1,2,3]triazolo[4,5-d]pyrimidin-3-yl]benzenecarbonitrile (OXW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AWEOBSGKFWBFJW-UHFFFAOYSA-N.
