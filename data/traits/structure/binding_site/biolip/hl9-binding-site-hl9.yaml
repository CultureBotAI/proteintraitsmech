identifier: proteintraitsmech:BIOLIP_HL9
label: "HL9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(3~{a}~{S},4~{S},6~{a}~{R})-2-oxidanylidene-1,3,3~{a},4,6,6~{a}-hexahydrothieno[3,4-d]imidazol-4-yl]-~{N}-(1-pyridin-4-ylpiperidin-4-yl)pentanamide (HL9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GEHXEZPHNHPYOB-LNLFQRSKSA-N.
