identifier: proteintraitsmech:BIOLIP_ERT
label: "ERT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand METHYL (4R)-2-ETHYL-2,5,12-TRIHYDROXY-7-METHOXY-6,11-DIOXO-4-{[2,3,6-TRIDEOXY-3-(DIMETHYLAMINO)-BETA-D-RIBO-HEXOPYRANOSYL]OXY}-1H,2H,3H,4H,6H,11H-TETRACENE-1-CARBOXYLATE (ERT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XSSVYBYWQBNYOH-QJIXERIWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
