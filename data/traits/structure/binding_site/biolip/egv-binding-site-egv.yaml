identifier: proteintraitsmech:BIOLIP_EGV
label: "EGV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4S)-5-carbamimidamido-4-hydroxy-2-oxopentanoic acid (EGV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RPBOKETVUMOUHD-VKHMYHEASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EGV
synonyms:
  - synonym_text: "(4S)-5-carbamimidamido-4-hydroxy-2-oxopentanoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:G8WNK6
    protein_label: "6C3A chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6c3a chain A (resolution 1.53 Å); binding residues: T17 E20 A33 H34 F119 N121 X235 R367"
    source: CURATOR
