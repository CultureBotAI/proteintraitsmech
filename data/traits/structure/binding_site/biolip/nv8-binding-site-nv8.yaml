    protein_label: "6TQ4 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6tq4 chain A (resolution 2.299 Å); binding residues: C99 I122 P123 Q126 Q179 F219 I314 N318"
    source: CURATOR
