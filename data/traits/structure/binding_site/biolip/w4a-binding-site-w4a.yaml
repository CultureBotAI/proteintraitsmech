identifier: proteintraitsmech:BIOLIP_W4A
label: "W4A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-methyl-~{N}-[2-(4-methylpiperazin-1-yl)-5-(trifluoromethyl)phenyl]furan-2-carboxamide (W4A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey STWLHUZLPCVTAS-UHFFFAOYSA-N.
