identifier: proteintraitsmech:BIOLIP_VK5
label: "VK5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[[3-[4-[(dimethylamino)methyl]phenyl]imidazo[1,2-a]pyridin-6-yl]methyl]-~{N}-methyl-5-[3-methyl-5-(1,3,5-trimethylpyrazol-4-yl)pyridin-2-yl]-1,3,4-oxadiazol-2-amine (VK5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CZIXXCVLEHVEBZ-UHFFFAOYSA-N.
