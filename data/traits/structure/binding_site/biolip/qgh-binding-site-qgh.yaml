identifier: proteintraitsmech:BIOLIP_QGH
label: "QGH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{R})-1-methyl-2,3,4,9-tetrahydro-1~{H}-pyrido[3,4-b]indole (QGH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LPIJOZBIVDCQTE-MRVPVSSYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
