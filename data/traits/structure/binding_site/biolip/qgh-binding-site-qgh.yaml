    protein_label: "6ZEA chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6zea chain A (resolution 1.54 Å); binding residues: Y124 I154 M155 V183 F201"
    source: CURATOR
