identifier: proteintraitsmech:BIOLIP_FOL
label: "FOL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand FOLIC ACID (FOL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OVBPIULPVIDEAO-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:FOL
synonyms:
  - synonym_text: "FOLIC ACID-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
