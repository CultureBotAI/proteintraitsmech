    protein_label: "4LRH chain D (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4lrh chain D (resolution 2.8 Å); binding residues: Y60 D81 Y85 W102 W134 H135 K136 G137 W138 W140 W171 S174 Y175"
    source: CURATOR
