identifier: proteintraitsmech:BIOLIP_U30
label: "U30-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[2-azanyl-6-[1-[[6-(2-oxidanylpropan-2-yl)pyridin-2-yl]methyl]-1,2,3-triazol-4-yl]pyrimidin-4-yl]-2-methyl-benzenecarbonitrile (U30) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BUXIAWLTBSXYSW-UHFFFAOYSA-N.
