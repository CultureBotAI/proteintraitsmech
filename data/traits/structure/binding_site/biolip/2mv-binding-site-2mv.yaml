identifier: proteintraitsmech:BIOLIP_2MV
label: "2MV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2S,3R,5Z,7E,14beta,17alpha)-17-[(2S,4S)-4-(2-hydroxy-2-methylpropyl)-2-methyltetrahydrofuran-2-yl]-2-methyl-9,10-secoandrosta-5,7,10-triene-1,3-diol (2MV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CDTXSCLKUNDXBZ-SIYPKADPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
