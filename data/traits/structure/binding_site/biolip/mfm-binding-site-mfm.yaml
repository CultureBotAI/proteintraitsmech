identifier: proteintraitsmech:BIOLIP_MFM
label: "MFM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E)-3-(5((5-(4-CHLOROPHENYL)FURAN-2-YL)METHYLENE)-4-OXO-2-THIOXOTHIAZOLIDIN-3-YL)PROPANOIC ACID (MFM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YZLFZFALAZYTCI-NTEUORMPSA-N.
