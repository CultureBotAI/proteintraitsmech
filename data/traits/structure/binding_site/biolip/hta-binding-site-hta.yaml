identifier: proteintraitsmech:BIOLIP_HTA
label: "HTA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[3-(N'-HYDROXYCARBOXAMIDO)-2-(2-METHYLPROPYL)-PROPANOYL]-O-TYROSINE-N-METHYLAMIDE (HTA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QYZPDCGWIJYZMN-ZBFHGGJFSA-N.
