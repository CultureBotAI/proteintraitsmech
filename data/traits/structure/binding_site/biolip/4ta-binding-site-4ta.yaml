identifier: proteintraitsmech:BIOLIP_4TA
label: "4TA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand P1-(5'-ADENOSYL)P4-(5'-(2'-DEOXY-THYMIDYL))TETRAPHOSPHATE (4TA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WLGHSSFVEUABFP-SLFMBYJQSA-J.
