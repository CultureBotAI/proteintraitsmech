label: "FB9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,4R,8R,9R,10S)-N-(4-cyclopropyloxyphenyl)-10-(methoxymethyl)-3,4-bis(oxidanyl)-9-[4-(2-phenylethynyl)phenyl]-1,6-diazabicyclo[6.2.0]decane-6-carboxamide (FB9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DJCBDEOPQMQGCA-AXJMTRDLSA-N.
