identifier: proteintraitsmech:BIOLIP_HXG
label: "HXG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,2-dihexanoyl-sn-glycero-3-phosphocholine (HXG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey DVZARZBAWHITHR-GOSISDBHSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
