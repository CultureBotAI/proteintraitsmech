identifier: proteintraitsmech:BIOLIP_G5O
label: "G5O-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[2-chloranyl-5-(phenylsulfonyl)phenyl]carbonylamino]benzoic acid (G5O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CLAUJSRBKSRTGQ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
