identifier: proteintraitsmech:BIOLIP_GAS
label: "GAS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(P-CYANOPHENYL)-N'-DIPHENYLMETHYL-GUANIDINE-ACETIC ACID (GAS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey KGHMYJFHUHFOGL-UHFFFAOYSA-N.
