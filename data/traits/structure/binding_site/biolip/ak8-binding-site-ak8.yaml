identifier: proteintraitsmech:BIOLIP_AK8
label: "AK8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[3-methyl-4-({3-[2-(methylamino)pyrimidin-4-yl]pyridin-2-yl}oxy)phenyl]-3-[3-(trifluoromethyl)phenyl]urea (AK8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey INFGJUQNPPGDNS-UHFFFAOYSA-N.
