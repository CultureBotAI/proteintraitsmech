identifier: proteintraitsmech:BIOLIP_WYB
label: "WYB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2'-[(2-chloro-5-cyano-1,3-phenylene)bis(azanediyl)]bis(oxoacetic acid) (WYB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RVGLGHVJXCETIO-UHFFFAOYSA-N.
