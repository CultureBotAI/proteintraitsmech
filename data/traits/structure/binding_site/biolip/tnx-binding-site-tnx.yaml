identifier: proteintraitsmech:BIOLIP_TNX
label: "TNX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,5-anhydro-2-deoxy-2-(ethanethioylamino)-D-arabino-hex-1-enitol (TNX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VWPHMQQBRGEPGS-BWZBUEFSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
