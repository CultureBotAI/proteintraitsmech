identifier: proteintraitsmech:BIOLIP_QFX
label: "QFX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4S)-6-[([1,1'-biphenyl]-2-yl)oxy]-3-chloro[1,2,4]triazolo[4,3-b]pyridazine (QFX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XWHTYUYQMHCFMT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
