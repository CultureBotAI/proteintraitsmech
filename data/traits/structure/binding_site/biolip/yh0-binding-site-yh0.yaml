identifier: proteintraitsmech:BIOLIP_YH0
label: "YH0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(4-{[2-(1H-benzimidazol-2-yl)ethyl]carbamoyl}phenyl)-1H-benzimidazole-7-carboxamide (YH0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HKMBTWRJKUMZJX-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
