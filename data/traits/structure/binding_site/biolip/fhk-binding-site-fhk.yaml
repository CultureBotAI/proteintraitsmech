identifier: proteintraitsmech:BIOLIP_FHK
label: "FHK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[4-[1,3-bis(oxidanylidene)isoindol-2-yl]phenyl]sulfonylamino]benzoic acid (FHK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey KCHARURJHJMOQX-UHFFFAOYSA-N.
