identifier: proteintraitsmech:BIOLIP_Q6Q
label: "Q6Q-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[1-(7-chloranylquinolin-4-yl)-5-(2,6-dimethoxyphenyl)pyrazol-3-yl]carbonylamino]adamantane-2-carboxylic acid (Q6Q) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DYLJVOXRWLXDIG-LWXMPVTCSA-N.
