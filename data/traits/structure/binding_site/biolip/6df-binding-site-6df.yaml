identifier: proteintraitsmech:BIOLIP_6DF
label: "6DF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [6-methyl-5-oxidanyl-4-[(~{E})-[(1~{R})-1-phenylethyl]iminomethyl]pyridin-3-yl]methyl dihydrogen phosphate (6DF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZBWJIKYNMPWLJE-PBFYJAPKSA-N.
