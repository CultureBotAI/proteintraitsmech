    protein_label: "4PB1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4pb1 chain A (resolution 2.803 Å); binding residues: L259 N331 E332 F333 F366"
    source: CURATOR
  - protein_id: UniProtKB:A0A7G8JUR3
    protein_label: "8KI6 chain A (BioLiP receptor)"
