    protein_label: "4U1W chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4u1w chain A (resolution 3.25 Å); binding residues: P494 F495 S497 S729 K730 L751 S754"
    source: CURATOR
