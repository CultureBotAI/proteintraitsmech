identifier: proteintraitsmech:BIOLIP_DZJ
label: "DZJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-benzyl-8-chloro-2-hydroxy-4H-pyrimido[2,1-b][1,3]benzothiazol-4-one (DZJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LTTZBQUWRGBLKU-UHFFFAOYSA-N.
