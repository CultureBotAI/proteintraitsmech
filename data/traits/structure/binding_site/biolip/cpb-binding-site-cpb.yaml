identifier: proteintraitsmech:BIOLIP_CPB
label: "CPB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(2-CHLORO-PHENYL)-5,7-DIHYDROXY-8-(3-HYDROXY-1-METHYL-PIPERIDIN-4-YL)-4H-BENZOPYRAN-4-ONE (CPB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BIIVYFLTOXDAOV-YVEFUNNKSA-N.
