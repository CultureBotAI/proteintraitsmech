identifier: proteintraitsmech:BIOLIP_A1D5I
label: "A1D5I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Macitentan (A1D5I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JGCMEBMXRHSZKX-UHFFFAOYSA-N.
