identifier: proteintraitsmech:BIOLIP_9EU
label: "9EU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-ethynyl-3-{3-fluoro-4-[(2-methyl-1H-imidazo[4,5-c]pyridin-1-yl)methyl]benzene-1-carbonyl}-N,N-dimethyl-1H-indole-1-carboxamide (9EU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GDLNHSUSOZEAOR-UHFFFAOYSA-N.
