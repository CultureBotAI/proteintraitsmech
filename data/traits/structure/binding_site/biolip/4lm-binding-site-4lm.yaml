identifier: proteintraitsmech:BIOLIP_4LM
label: "4LM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2E)-2-{[(1E)-{3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene]amino}but-2-enoic acid (4LM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BBYSOXSBJOWRNU-VMTXVVAMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
