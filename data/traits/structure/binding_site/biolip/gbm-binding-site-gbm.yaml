identifier: proteintraitsmech:BIOLIP_GBM
label: "GBM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-chloro-N-(2-{4-[(cyclohexylcarbamoyl)sulfamoyl]phenyl}ethyl)-2-methoxybenzamide (GBM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 6 PDB structures; ligand InChIKey ZNNLBTZKUZBEKO-UHFFFAOYSA-N.
