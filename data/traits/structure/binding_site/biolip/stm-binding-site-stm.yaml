    protein_label: "5HDP chain D (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5hdp chain D (resolution 2.9 Å); binding residues: A102 Y104 A185 L186 I221 I222 A245 N277 F279 A282 V287 H349"
    source: CURATOR
