label: "66I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {(2R,3S,4R,5R)-5-[4-amino-3-(difluoromethoxy)-1H-pyrazolo[3,4-d]pyrimidin-1-yl]-3,4-dihydroxyoxolan-2-yl}methyl [(2S)-2-amino-3-(4-hydroxyphenyl)propanoyl]sulfamate (non-preferred name) (66I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MUBAQGITUFCKMG-IFHUHSRSSA-N.
