identifier: proteintraitsmech:BIOLIP_HAH
label: "HAH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,2S,3R,6R)-6-[(2-hydroxybenzyl)amino]cyclohex-4-ene-1,2,3-triol (HAH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IXUCFEUMPUFAGK-XEZLXBQYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
