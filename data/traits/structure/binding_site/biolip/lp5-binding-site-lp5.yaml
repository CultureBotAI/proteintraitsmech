identifier: proteintraitsmech:BIOLIP_LP5
label: "LP5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (R)-((2R,3S,4R,5R,6R)-3-HYDROXY-2-(HYDROXYMETHYL)-5-((R)-3-HYDROXYTETRADECANAMIDO)-6-(PHOSPHONOOXY)TETRAHYDRO-2H-PYRAN-4-YL) 3-HYDROXYTETRADECANOATE (LP5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 9 binding-site occurrences across 9 PDB structures; ligand InChIKey HEHQDWUWJVPREQ-XQJZMFRCSA-N.
