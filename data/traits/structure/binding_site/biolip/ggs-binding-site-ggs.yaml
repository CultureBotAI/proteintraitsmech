    protein_label: "7PAY chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7pay chain A (resolution 2.4 Å); binding residues: M33 D34 G35 N36 R37 R38 H51 G54 F55 A77 R85 L93 A97 F154"
    source: CURATOR
