identifier: proteintraitsmech:BIOLIP_SFF
label: "SFF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4aS,8aR)-N-cyclohexyl-4a,5,6,7,8,8a-hexahydro-4,1,2-benzoxathiazin-3-amine 1,1-dioxide (SFF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZMDVQNCMHSXAPA-NWDGAFQWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
