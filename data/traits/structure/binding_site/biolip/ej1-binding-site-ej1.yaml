identifier: proteintraitsmech:BIOLIP_EJ1
label: "EJ1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2E)-5-carbamimidamido-2-{[(Z)-{3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4(1H)-ylidene}methyl]imino}pentanoic acid (EJ1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RHCMSTSZICWJMS-GXVFZPQQSA-N.
