identifier: proteintraitsmech:BIOLIP_TDC
label: "TDC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5A,6-ANHYDROTETRACYCLINE (TDC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey CXCVEERYMJZMMM-DOCRCCHOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
