identifier: proteintraitsmech:BIOLIP_PIB
label: "PIB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(BUTANOYLOXY)-1-{[(HYDROXY{[2,3,4,6-TETRAHYDROXY-5-(PHOSPHONOOXY)CYCLOHEXYL]OXY}PHOSPHORYL)OXY]METHYL}ETHYL BUTANOATE (PIB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey NKJZZWLREOAJGO-HODIZBBFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
