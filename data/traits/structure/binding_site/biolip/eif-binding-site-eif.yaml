identifier: proteintraitsmech:BIOLIP_EIF
label: "EIF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R},3~{R},4~{R},5~{R})-5-(2-azanyl-6-oxidanylidene-1~{H}-purin-9-yl)-4-fluoranyl-4-methyl-3-oxidanyl-oxolan-2-yl]methyl dihydrogen phosphate (EIF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey BOEZKCHYGLAVGV-GITKWUPZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EIF
synonyms:
  - synonym_text: "[(2~{R},3~{R},4~{R},5~{R})-5-(2-azanyl-6-oxidanylidene-1~{H}-purin-9-yl)-4-fluoranyl-4-methyl-3-oxidanyl-oxolan-2-yl]methyl dihydrogen phosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q16774
    protein_label: "8PTS chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8pts chain A (resolution 1.76 Å); binding residues: S37 R41 R44 Y53 E72 F76 Y81 G82"
    source: CURATOR
  - protein_id: UniProtKB:Q6DHV7
    protein_label: "8QCH chain H (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8qch chain H (resolution 2.442 Å); binding residues: H26 L27 N28 F67 F70 H74 S106 T107 G181 H208 E211 D294"
    source: CURATOR
