identifier: proteintraitsmech:BIOLIP_HJF
label: "HJF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(3S)-5,5-dimethyloxolan-3-yl]-6-methoxy-3-(2-methoxypyridin-4-yl)pyrazolo[1,5-a]pyrimidine (HJF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PETJVBHONPBYQW-CYBMUJFWSA-N.
