identifier: proteintraitsmech:BIOLIP_SP5
label: "SP5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[3-({4-[(3-aminopropyl)amino]butyl}amino)propyl]acetamide (SP5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GUNURVWAJRRUAV-UHFFFAOYSA-N.
