identifier: proteintraitsmech:BIOLIP_VL5
label: "VL5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-[(Z)-[1-(2-azanyl-1,3-thiazol-4-yl)-2-[[(2S)-3-methyl-1-oxidanylidene-3-(sulfooxyamino)butan-2-yl]amino]-2-oxidanylidene-ethylidene]amino]oxy-3-[4-[N-[(3R)-piperidin-3-yl]carbamimidoyl]phenoxy]propanoic acid (VL5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NFNVPYWCKFTXAX-OOLKDPNPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
