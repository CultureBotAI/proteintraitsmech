    protein_label: "4Q24 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4q24 chain A (resolution 2.9 Å); binding residues: G35 C37 M152 A155 N159 Y178 E182 F186 Y202 T206"
    source: CURATOR
