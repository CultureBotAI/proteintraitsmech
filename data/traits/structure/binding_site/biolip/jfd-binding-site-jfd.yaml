identifier: proteintraitsmech:BIOLIP_JFD
label: "JFD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-amino-5-bromo-1,2,3,4-tetrahydropyrimidine-2,4-dione (JFD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FSLBEEVCUZFKRL-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
