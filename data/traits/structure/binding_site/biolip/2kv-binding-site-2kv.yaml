identifier: proteintraitsmech:BIOLIP_2KV
label: "2KV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[cis-4-(aminomethyl)-4-(3-chlorophenyl)cyclohexyl]piperidin-2-one (2KV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HPAJLBAQCKXNNT-SAABIXHNSA-N.
