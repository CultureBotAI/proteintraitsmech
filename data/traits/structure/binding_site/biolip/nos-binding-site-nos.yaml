identifier: proteintraitsmech:BIOLIP_NOS
label: "NOS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand INOSINE (NOS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 11 binding-site occurrences across 10 PDB structures; ligand InChIKey UGQMRVRMYYASKQ-KQYNXXCUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
