identifier: proteintraitsmech:BIOLIP_CKL
label: "CKL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(2-azanyl-4-oxidanylidene-7,8-dihydro-3~{H}-pteridin-6-yl)methylamino]-~{N}-(5,6-dimethoxypyrimidin-4-yl)benzenesulfonamide (CKL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YQBRQWRFWGQPMG-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
