identifier: proteintraitsmech:BIOLIP_OTQ
label: "OTQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-(5-nitrofuran-2-yl)-2,3,5,6,7,8-hexahydro-1~{H}-[1]benzothiolo[2,3-d]pyrimidin-4-one (OTQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MOKSPNCNIWVHBB-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
