identifier: proteintraitsmech:BIOLIP_FGR
label: "FGR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(N-FORMYLGLYCYL)-5-O-PHOSPHONO-BETA-D-RIBOFURANOSYLAMINE (FGR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VDXLUNDMVKSKHO-XVFCMESISA-N.
