identifier: proteintraitsmech:BIOLIP_CP6
label: "CP6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(4-CHLORO-PHENYL)-6-ETHYL-PYRIMIDINE-2,4-DIAMINE (CP6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey WKSAUQYGYAYLPV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
