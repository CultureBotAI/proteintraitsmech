definition: >-
  A structure-derived ligand-binding site at which the ligand N-(TRANS-4'-NITRO-4-STILBENYL)-N-METHYL-5-AMINO-PENTANOIC ACID (TNS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey QLLZAVDYYAQESE-AATRIKPKSA-N.
