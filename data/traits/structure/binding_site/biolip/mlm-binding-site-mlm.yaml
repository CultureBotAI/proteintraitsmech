identifier: proteintraitsmech:BIOLIP_MLM
label: "MLM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-AMINO-3-OXOPROPANOIC ACID (MLM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CGJMROBVSBIBKP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
