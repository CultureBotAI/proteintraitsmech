identifier: proteintraitsmech:BIOLIP_TD6
label: "TD6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4S)-4-{3-[(4-amino-2-methylpyrimidin-5-yl)methyl]-5-(2-{[(S)-hydroxy(phosphonooxy)phosphoryl]oxy}ethyl)-4-methyl-1,3lambda~5~-thiazol-2-yl}-4-hydroxybutanoic acid (TD6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RWCNVMPVYGBSHH-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
