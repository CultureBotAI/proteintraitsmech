identifier: proteintraitsmech:BIOLIP_84T
label: "84T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2S,4S,5R)-5-(6-aminopurin-9-yl)-4-oxidanyl-oxolan-2-yl]methoxy-N-[(2S,3R)-4-methyl-2,3-bis(oxidanyl)pentanoyl]phosphonamidic acid (84T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KHSKVNAFZAVNFC-UVIICUSPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
