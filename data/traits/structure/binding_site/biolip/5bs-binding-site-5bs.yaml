identifier: proteintraitsmech:BIOLIP_5BS
label: "5BS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(5,10-dimethyl-6-oxo-6,10-dihydro-5H-pyrimido[5,4-b]thieno[3,2-e][1,4]diazepin-2-yl)amino]benzenesulfonamide (5BS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YRDHKIFCGOZTGD-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
