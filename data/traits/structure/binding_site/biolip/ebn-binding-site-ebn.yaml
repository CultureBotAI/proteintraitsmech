identifier: proteintraitsmech:BIOLIP_EBN
label: "EBN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (S)-6-amino-N-((S)-6-amino-1-(((1r,4S)-4-guanidinocyclohexyl)methylamino)-1-oxohexan-2-yl)-2-(2-(3,4-dichlorophenyl)acetamido)hexanamide (EBN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OWKCLMWSCHVRNJ-BTDFZRAWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
