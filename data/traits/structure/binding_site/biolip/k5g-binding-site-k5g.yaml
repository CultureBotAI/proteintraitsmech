identifier: proteintraitsmech:BIOLIP_K5G
label: "K5G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(3-bromophenoxy)-N-[(3S)-2-oxothiolan-3-yl]butanamide (K5G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey WTRVPDIAMVDWRQ-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:K5G
synonyms:
