    protein_label: "7R3G chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7r3g chain B (resolution 2.15 Å); binding residues: A44 C46 M60 F61 Y64 W68 Q69 Y72 D81 T83 I84 W96 F101 S135"
    source: CURATOR
