    protein_label: "7R3E chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7r3e chain A (resolution 3.46 Å); binding residues: A375 V391 G393 Y395 W399 L400 D412 I415 W427 S466"
    source: CURATOR
