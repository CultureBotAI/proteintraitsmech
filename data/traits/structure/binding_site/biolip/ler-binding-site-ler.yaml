synonyms:
  - synonym_text: "L-Erythrulose-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9WYP7
    protein_label: "5H1W chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5h1w chain A (resolution 1.631 Å); binding residues: E149 L151 E155 H185 H208 R214 E243"
    source: CURATOR
