    protein_label: "1FSG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1fsg chain A (resolution 1.05 Å); binding residues: K79 G80 K116 S117 Y118 E146 D147 I148 D150 T151 G152 T154 R212"
    source: CURATOR
