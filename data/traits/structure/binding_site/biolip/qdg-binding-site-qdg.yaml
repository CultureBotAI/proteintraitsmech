identifier: proteintraitsmech:BIOLIP_QDG
label: "QDG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(3-bromo-4-{4-[4-({(2R,4S)-2-(2,4-dichlorophenyl)-2-[(1H-1,2,4-triazol-1-yl)methyl]-1,3-dioxolan-4-yl}methoxy)phenyl]piperazin-1-yl}phenyl)-2-[(2S)-butan-2-yl]-2,4-dihydro-3H-1,2,4-triazol-3-one (QDG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NLXNHAVZBIVNIU-DIDXUJGESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
