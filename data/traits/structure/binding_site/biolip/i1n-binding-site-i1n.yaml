identifier: proteintraitsmech:BIOLIP_I1N
label: "I1N-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3R,4R,5S,6S)-2,3,4,5,6-PENTAHYDROXYCYCLOHEXANONE (I1N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VYEGBDHSGHXOGT-REJXVDBHSA-N.
