identifier: proteintraitsmech:BIOLIP_U2F
label: "U2F-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand URIDINE-5'-DIPHOSPHATE-2-DEOXY-2-FLUORO-ALPHA-D-GLUCOSE (U2F) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey NGTCPFGWXMBZEP-NQQHDEILSA-N.
