    protein_label: "7ES1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7es1 chain A (resolution 1.66 Å); binding residues: W22 H27 V129 F130 M155 E283 G380"
    source: CURATOR
