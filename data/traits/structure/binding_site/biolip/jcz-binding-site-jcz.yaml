identifier: proteintraitsmech:BIOLIP_JCZ
label: "JCZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(1~{H}-indol-6-yl)-1~{H}-pyrazol-5-amine (JCZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WGNBSWSUVHVDSW-UHFFFAOYSA-N.
