definition: >-
  A structure-derived ligand-binding site at which the ligand 5-methyl-N-(4-methylpyrimidin-2-yl)-4-(1H-pyrazol-4-yl)-1,3-thiazol-2-amine (BQI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MIQNXKWDQRNHAU-UHFFFAOYSA-N.
