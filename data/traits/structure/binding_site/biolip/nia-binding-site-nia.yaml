identifier: proteintraitsmech:BIOLIP_NIA
label: "NIA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ((2R,3S,4R,5R)-5-(5-AMINO-4-NITRO-1H-IMIDAZOL-1-YL)-3,4-DIHYDROXYTETRAHYDROFURAN-2-YL)METHYL DIHYDROGEN PHOSPHATE (NIA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YVRCVGZPIYHJLU-AFCXAGJDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
