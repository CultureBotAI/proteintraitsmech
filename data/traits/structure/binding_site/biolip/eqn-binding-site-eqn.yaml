    protein_label: "7AOS chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7aos chain B (resolution 2.55 Å); binding residues: F228 L231 S232 C235 L269 I273 F286 S287 F302 G391 V395"
    source: CURATOR
