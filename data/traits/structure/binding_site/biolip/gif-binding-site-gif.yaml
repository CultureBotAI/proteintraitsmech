    protein_label: "4CU7 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4cu7 chain A (resolution 2.2 Å); binding residues: R288 H484 E564 E645 S648 W685 W708 E716 F733"
    source: CURATOR
  - protein_id: UniProtKB:A0A2D0TCC8
