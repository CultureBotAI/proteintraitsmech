    protein_label: "6LON chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6lon chain A (resolution 2.2 Å); binding residues: R183 L186 Q187 S305 W368 G461 C462 E464 R672"
    source: CURATOR
