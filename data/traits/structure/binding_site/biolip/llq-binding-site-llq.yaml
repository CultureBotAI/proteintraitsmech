identifier: proteintraitsmech:BIOLIP_LLQ
label: "LLQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2,3-bis(oxidanyl)propane-1-sulfonic acid (LLQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YPFUJZAAZJXMIP-VKHMYHEASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
