identifier: proteintraitsmech:BIOLIP_A1L3E
label: "A1L3E-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(3-bromanyl-5-ethoxy-4-oxidanyl-phenyl)-~{N}-(2-methoxyphenyl)-2-methyl-5-oxidanylidene-4,6,7,8-tetrahydro-1~{H}-quinoline-3-carboxamide (A1L3E) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VFIAGZFUJFJECK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
