identifier: proteintraitsmech:BIOLIP_GTA
label: "GTA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand P1-7-METHYLGUANOSINE-P3-ADENOSINE-5',5'-TRIPHOSPHATE (GTA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey QQOHNVHGNZYSBP-XPWFQUROSA-O.
