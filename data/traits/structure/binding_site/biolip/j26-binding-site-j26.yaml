label: "J26-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2S)-1-[(4-cyanophenyl)amino]-4-cyclopropyl-1-oxidanylidene-butan-2-yl]-3,6,6-trimethyl-4-oxidanylidene-5,7-dihydro-1H-indole-2-carboxamide (J26) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OWORSODZTADOQX-IBGZPJMESA-N.
