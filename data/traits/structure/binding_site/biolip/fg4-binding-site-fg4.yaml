identifier: proteintraitsmech:BIOLIP_FG4
label: "FG4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {2-[(1-benzofuran-2-ylmethoxy)carbonyl]-5-methoxy-1H-indol-1-yl}acetic acid (FG4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CKGFVKXFHXZPEW-UHFFFAOYSA-N.
