    protein_label: "5DTE chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5dte chain B (resolution 2.7 Å); binding residues: K36 N40 Y42 D118 N172 R176 W200 D252 Q272"
    source: CURATOR
