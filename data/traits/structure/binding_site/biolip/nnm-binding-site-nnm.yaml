    protein_label: "6P25 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6p25 chain A (resolution 3.2 Å); binding residues: H98 K234 W235 L238 F239 T242 G245 A270 L274 L277 L278 W545 N548 M647 R649 H655"
    source: CURATOR
