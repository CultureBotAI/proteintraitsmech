identifier: proteintraitsmech:BIOLIP_OS9
label: "OS9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-[[3-(2-methoxyphenoxy)phenyl]methyl]-1-(2-phenylethyl)-1,3,8-triazaspiro[4.5]decan-4-one (OS9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MRXASGVUQJVWMP-UHFFFAOYSA-N.
