definition: >-
  A structure-derived ligand-binding site at which the ligand (9cis)-retinoic acid (9CR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey SHGAZHPCJJPHSC-ZVCIMWCZSA-N.
