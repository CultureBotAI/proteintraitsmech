identifier: proteintraitsmech:BIOLIP_BLG
label: "BLG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-O-(4-O-SULFONYL-N-ACETYLGLUCOSAMININYL)-5-METHYLHYDROXY-L-PROLINE-TAURINE (BLG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey RPNZWZDLNYCCIG-HMMVDTEZSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
