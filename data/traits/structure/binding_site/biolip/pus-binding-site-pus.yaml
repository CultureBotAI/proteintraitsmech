identifier: proteintraitsmech:BIOLIP_PUS
label: "PUS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E)-O-(carbamoylamino)-N-({3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene)-L-serine (PUS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LKTMSPZJJUSLRR-FUOCOAHQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PUS
synonyms:
  - synonym_text: "(E)-O-(carbamoylamino)-N-({3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene)-L-serine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:D2Z027
    protein_label: "3X44 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3x44 chain A (resolution 1.9 Å); binding residues: T70 S71 N73 V74 S121 Q142 F176 G177 T178 T179 T181 G221 L222 P224 S265 P291 D292"
    source: CURATOR
