identifier: proteintraitsmech:BIOLIP_P6E
label: "P6E-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[4-(3-chloranylphenoxy)-3-sulfamoyl-phenyl]-2-phenyl-ethanamide (P6E) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CSJYMAFXYMYNCK-UHFFFAOYSA-N.
