identifier: proteintraitsmech:BIOLIP_FNU
label: "FNU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-amino-5-fluorouridine 5'-(dihydrogen phosphate) (FNU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey OLBMCLUPWOAIRA-UMMCILCDSA-N.
