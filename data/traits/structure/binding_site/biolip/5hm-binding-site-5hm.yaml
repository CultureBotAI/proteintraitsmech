identifier: proteintraitsmech:BIOLIP_5HM
label: "5HM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(hydroxymethyl)cytidine 5'-(dihydrogen phosphate) (5HM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey KPUOHXMVCZBWQC-JXOAFFINSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
