identifier: proteintraitsmech:BIOLIP_DUT
label: "DUT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand DEOXYURIDINE-5'-TRIPHOSPHATE (DUT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey AHCYMLUZIRLXAA-SHYZEUOFSA-N.
