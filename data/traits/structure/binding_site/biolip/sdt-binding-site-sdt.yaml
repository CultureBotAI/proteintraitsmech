identifier: proteintraitsmech:BIOLIP_SDT
label: "SDT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,4-dihydroxy-9,10-secoandrosta-1(10),2,4-triene-9,17-dione (SDT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YUHVBHDSVLKFNI-NJSLBKSFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
