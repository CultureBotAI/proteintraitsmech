identifier: proteintraitsmech:BIOLIP_DXL
label: "DXL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-xylaric acid (DXL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NPTTZSYLTYJCPR-FFEAPLRNSA-N.
