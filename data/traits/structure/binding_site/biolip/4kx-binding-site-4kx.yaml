identifier: proteintraitsmech:BIOLIP_4KX
label: "4KX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,5 Dienoyl-CoA (4KX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey IHXBZDHPKCDGKN-TYHXJLICSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
