    protein_label: "4Z3W chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4z3w chain C (resolution 2.208 Å); binding residues: P249 W259 H260 F323 L436 L438 S439 M440 Y445 T458 E461 Q466 P499 R500 S504"
