identifier: proteintraitsmech:BIOLIP_NGH
label: "NGH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-ISOBUTYL-N-[4-METHOXYPHENYLSULFONYL]GLYCYL HYDROXAMIC ACID (NGH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey JIRXORZYIXSWOB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
