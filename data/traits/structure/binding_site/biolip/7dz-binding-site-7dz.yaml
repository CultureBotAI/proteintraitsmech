identifier: proteintraitsmech:BIOLIP_7DZ
label: "7DZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (7S)-2-[(3,5-difluoro-4-hydroxyphenyl)amino]-5,7-dimethyl-8-(3-methylbutyl)-7,8-dihydropteridin-6(5H)-one (7DZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DTEKTGDVSARYDS-NSHDSACASA-N.
