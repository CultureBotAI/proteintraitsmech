identifier: proteintraitsmech:BIOLIP_OWQ
label: "OWQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(4-methoxyphenyl)-~{N}-[(3~{R})-1-pyridin-4-ylpyrrolidin-3-yl]-[1,2,3]triazolo[4,5-d]pyrimidin-5-amine (OWQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GDSSVNNRCKMPPZ-CQSZACIVSA-N.
