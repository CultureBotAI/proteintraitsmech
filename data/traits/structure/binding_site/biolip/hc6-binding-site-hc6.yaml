identifier: proteintraitsmech:BIOLIP_HC6
label: "HC6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,2'S)-2,2'-biphenyl-4,4'-diylbis(2-hydroxy-4,4-dimethylmorpholin-4-ium) (HC6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JIWUESGGKYLPPG-DNQXCXABSA-N.
