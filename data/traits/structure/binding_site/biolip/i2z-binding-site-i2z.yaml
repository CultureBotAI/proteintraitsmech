identifier: proteintraitsmech:BIOLIP_I2Z
label: "I2Z-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-amino-1-benzyl-5-(methylamino)pyrimidine-2,4(1H,3H)-dione (I2Z) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ROGMXQYZAWKCLY-ZJUUUORDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
