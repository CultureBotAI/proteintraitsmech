definition: >-
  A structure-derived ligand-binding site at which the ligand 4-amino-1-[(2S,4aR,6R,7R,7aS)-2,7-dihydroxy-2-oxidotetrahydro-4H-furo[3,2-d][1,3,2]dioxaphosphinin-6-yl]pyrimidin-2(1H)-one (CC7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WCPTXJJVVDAEMW-XVFCMESISA-N.
