identifier: proteintraitsmech:BIOLIP_GC5
label: "GC5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-[2-[3-[[(2R)-3,3-dimethyl-2-oxidanyl-4-phosphonooxy-butanoyl]amino]propanoylamino]ethyl] (Z)-hex-2-enethioate (GC5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IGFUSVMDVYHKKE-XHPSBEMXSA-N.
