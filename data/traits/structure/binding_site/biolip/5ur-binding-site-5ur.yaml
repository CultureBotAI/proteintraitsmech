identifier: proteintraitsmech:BIOLIP_5UR
label: "5UR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S)-1-(2,4-dichlorophenyl)-2-(1H-imidazol-1-yl)ethyl 3-(trifluoromethyl)benzoate (5UR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SBOYKSSFXZSLMV-QGZVFWFLSA-N.
