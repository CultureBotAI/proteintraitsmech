identifier: proteintraitsmech:BIOLIP_E6D
label: "E6D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ethyl (3S)-3-hydroxy-4-({(2S)-4-methyl-1-[(3-methylbutyl)amino]-1-oxopentan-2-yl}amino)-4-oxobutanoate (E6D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FGRTVYZNNRCSAS-KBPBESRZSA-N.
