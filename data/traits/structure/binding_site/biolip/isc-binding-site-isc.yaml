identifier: proteintraitsmech:BIOLIP_ISC
label: "ISC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S,6S)-5-[(1-carboxyethenyl)oxy]-6-hydroxycyclohexa-1,3-diene-1-carboxylic acid (ISC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey NTGWPRCCOQCMGE-YUMQZZPRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ISC
synonyms:
  - synonym_text: "(5S,6S)-5-[(1-carboxyethenyl)oxy]-6-hydroxycyclohexa-1,3-diene-1-carboxylic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0DPB9
    protein_label: "1NF8 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1nf8 chain A (resolution 1.6 Å); binding residues: F43 Q78 R87 W94 K122 V150 Y151 G155"
    source: CURATOR
  - protein_id: UniProtKB:P0AEJ2
    protein_label: "3HWO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3hwo chain A (resolution 2.3 Å); binding residues: G214 S215 E241 H276 I346 R347 A360 G361 E376 K380"
    source: CURATOR
