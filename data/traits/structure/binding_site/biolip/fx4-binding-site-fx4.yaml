    protein_label: "3FX4 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3fx4 chain A (resolution 1.99 Å); binding residues: W22 Y50 H113 R218 A219 F298 I299 V300"
    source: CURATOR
