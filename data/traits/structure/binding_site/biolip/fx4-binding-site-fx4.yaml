identifier: proteintraitsmech:BIOLIP_FX4
label: "FX4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(5Z)-5-{[3-(carboxymethoxy)-4-methoxyphenyl]methylidene}-2,4-dioxo-1,3-thiazolidin-3-yl]acetic acid (FX4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DLKPSHJFPIKYCB-WZUFQYTHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
