    protein_label: "1EJB chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1ejb chain A (resolution 1.85 Å); binding residues: W26 G59 S60 Y61 E62 V89 L90 I91 G93 S94 T95 I101"
    source: CURATOR
