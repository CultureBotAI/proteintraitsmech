identifier: proteintraitsmech:BIOLIP_INJ
label: "INJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(6-D-RIBITYLAMINO-2,4-DIHYDROXYPYRIMIDIN-5-YL)-1-PENTYL-PHOSPHONIC ACID (INJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey BMATWAHJJFXMFA-AXFHLTTASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
