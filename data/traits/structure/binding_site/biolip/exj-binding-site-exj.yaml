identifier: proteintraitsmech:BIOLIP_EXJ
label: "EXJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-3-(3-chlorophenyl)-3-[(5-methyl-7-oxo-6,7-dihydro[1,2,4]triazolo[1,5-a]pyrimidin-2-yl)amino]propanenitrile (EXJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NHMPMHHRMRFBHQ-GFCCVEGCSA-N.
