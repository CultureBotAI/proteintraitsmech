identifier: proteintraitsmech:BIOLIP_XNM
label: "XNM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4-{[4-(4-chlorophenyl)pyrimidin-2-yl]amino}phenyl)[4-(2-hydroxyethyl)piperazin-1-yl]methanone (XNM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HMSMXFYWPQNMCE-UHFFFAOYSA-N.
