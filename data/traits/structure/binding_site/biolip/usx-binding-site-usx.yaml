identifier: proteintraitsmech:BIOLIP_USX
label: "USX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4-[[(2S)-1-ethanoyl-3-oxidanylidene-2H-indol-2-yl]methyl]-2-methoxy-phenoxy]ethanamide (USX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DUXGCVPXJWCVOO-INIZCTEOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:USX
synonyms:
