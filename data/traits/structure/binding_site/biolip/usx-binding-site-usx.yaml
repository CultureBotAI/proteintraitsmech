    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P04049
    protein_label: "8JNB chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8jnb chain B (resolution 1.62 Å); binding residues: E94 C95 D132 L136"
    source: CURATOR
