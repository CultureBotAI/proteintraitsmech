identifier: proteintraitsmech:BIOLIP_2ID
label: "2ID-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(1R,2S,4S,5S)-4-[2-iodo-6-(methylamino)-9H-purin-9-yl]-2-(phosphonooxy)bicyclo[3.1.0]hex-1-yl]methyl dihydrogen phosphate (2ID) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NMVWLEUONAKGCD-SMWKGLLFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:2ID
synonyms:
  - synonym_text: "[(1R,2S,4S,5S)-4-[2-iodo-6-(methylamino)-9H-purin-9-yl]-2-(phosphonooxy)bicyclo[3.1.0]hex-1-yl]methyl dihydrogen phosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00268
    protein_label: "4XNW chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4xnw chain C (resolution 2.7 Å); binding residues: C42 K46 R195 D204 T205 N283 R287 Q291 Y303 Y306"
    source: CURATOR
