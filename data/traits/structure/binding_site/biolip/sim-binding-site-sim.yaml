identifier: proteintraitsmech:BIOLIP_SIM
label: "SIM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Simvastatin acid (SIM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XWLXKKNPFMNSFA-HGQWONQESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:SIM
synonyms:
  - synonym_text: "Simvastatin acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9Y7D1
    protein_label: "3HLF chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3hlf chain A (resolution 2.0 Å); binding residues: A76 Y146 R173 Y188 Y258 I325 G366 W390"
    source: CURATOR
