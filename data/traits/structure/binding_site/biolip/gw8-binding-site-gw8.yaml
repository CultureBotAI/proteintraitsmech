identifier: proteintraitsmech:BIOLIP_GW8
label: "GW8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(4-{methyl[2-({4-[(methylsulfonyl)methyl]phenyl}amino)pyrimidin-4-yl]amino}phenyl)-3-{3-[(4-methylpiperazin-1-yl)carbonyl]phenyl}urea (GW8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HKWWFBIVSCKLOB-UHFFFAOYSA-N.
