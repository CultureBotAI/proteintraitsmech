identifier: proteintraitsmech:BIOLIP_XVR
label: "XVR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S)-5-[(6R)-6-hydroxy-6-methyl-5-oxooctyl]furan-2(5H)-one (XVR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UOBYXVHBYDUQMN-GXFFZTMASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
