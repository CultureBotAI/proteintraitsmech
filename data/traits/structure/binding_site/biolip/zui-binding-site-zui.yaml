identifier: proteintraitsmech:BIOLIP_ZUI
label: "ZUI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[1-[[5-(3-chloranylphenoxy)pyridin-3-yl]methyl]piperidin-4-yl]-5-methyl-pyrimidine-2,4-dione (ZUI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RNTPQXGZOHDUAY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ZUI
synonyms:
