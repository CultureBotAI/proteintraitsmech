    protein_label: "5NRQ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5nrq chain A (resolution 2.1 Å); binding residues: P37 L52 F70 R74 R95 S99 N100 Y103 R107 L171 Q172"
    source: CURATOR
