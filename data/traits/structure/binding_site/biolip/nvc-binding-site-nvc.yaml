    protein_label: "3E3U chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3e3u chain A (resolution 1.56 Å); binding residues: G49 V50 G51 Q56 G105 C106 L107 L141 H148 E149 H152 F195"
    source: CURATOR
