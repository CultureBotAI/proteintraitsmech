identifier: proteintraitsmech:BIOLIP_NVC
label: "NVC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2R)-2-{[(2S)-2-(1,3-benzoxazol-2-yl)pyrrolidin-1-yl]carbonyl}hexyl]-N-hydroxyformamide (NVC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 1 PDB structure; ligand InChIKey QDDZLTVSNABZIK-ZBFHGGJFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NVC
synonyms:
