identifier: proteintraitsmech:BIOLIP_03G
label: "03G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(4-chlorophenyl)-N'-(2,2,6,6-tetramethylpiperidin-4-yl)ethanediamide (03G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZKXLQCIOURANAD-UHFFFAOYSA-N.
