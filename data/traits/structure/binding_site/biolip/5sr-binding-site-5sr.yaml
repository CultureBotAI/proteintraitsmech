    protein_label: "5EXE chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5exe chain C (resolution 1.88 Å); binding residues: T50 G51 C52 I74 G109 D110 G111 Y136 N138 S140 Y141 A142 N143 T144"
    source: CURATOR
