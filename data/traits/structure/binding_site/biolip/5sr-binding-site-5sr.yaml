identifier: proteintraitsmech:BIOLIP_5SR
label: "5SR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [2-[3-[(4-azanyl-2-methyl-pyrimidin-5-yl)methyl]-2-carboxy-4-methyl-1,3-thiazol-3-ium-5-yl]ethoxy-oxidanyl-phosphoryl] hydrogen phosphate (5SR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SXXTZHDPRYKKAS-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
