identifier: proteintraitsmech:BIOLIP_9HO
label: "9HO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (9S,10E,12Z)-9-hydroxyoctadeca-10,12-dienoic acid (9HO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NPDSHTNEKLQQIJ-UINYOVNOSA-N.
