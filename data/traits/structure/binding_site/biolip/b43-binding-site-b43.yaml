identifier: proteintraitsmech:BIOLIP_B43
label: "B43-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-Amino-5-(4-phenoxyphenyl)-7H-pyrrolo[2,3-d]pyrimidin-7-yl-cyclopentane (B43) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FMETVQKSDIOGPX-UHFFFAOYSA-N.
