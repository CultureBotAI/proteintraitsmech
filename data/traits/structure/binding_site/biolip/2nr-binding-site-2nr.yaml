identifier: proteintraitsmech:BIOLIP_2NR
label: "2NR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-(2-fluoro-6-methoxyphenyl)-N-(3,4,5-trimethoxyphenyl)-1,3-benzoxazol-2-amine (2NR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZDYXRELDNKSUBF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
