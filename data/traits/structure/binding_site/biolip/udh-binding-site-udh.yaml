identifier: proteintraitsmech:BIOLIP_UDH
label: "UDH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-AMINOHEXYL-URIDINE-C1,5'-DIPHOSPHATE (UDH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MLWJBKPFDKRHBM-FMKGYKFTSA-N.
