    protein_label: "2AGD chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2agd chain A (resolution 1.9 Å); binding residues: P183 F184 R185 R187 F222 D248 V249 D250 K275 W310 H343 R345 D346"
    source: CURATOR
