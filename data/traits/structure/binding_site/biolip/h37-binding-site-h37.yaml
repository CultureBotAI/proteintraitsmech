identifier: proteintraitsmech:BIOLIP_H37
label: "H37-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-phenylalanyl-N-[(3S)-6-carbamimidamido-1-chloro-2-oxohexan-3-yl]-L-phenylalaninamide (H37) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PJFSUJMJVYGASC-HKBOAZHASA-N.
