definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[4-(4-aminophenyl)buta-1,3-diyn-1-yl]-N-[(2S,3R)-3-hydroxy-2-methyl-1-nitroso-1-oxobutan-2-yl]benzamide (2CW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey TVYJPPDJMQUKRB-QRQCRPRQSA-N.
