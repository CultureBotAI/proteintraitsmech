    protein_label: "8FBM chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8fbm chain A (resolution 1.9 Å); binding residues: V110 D112 F119 Y121 Y225 F240 Y390 N421 T441 R443 L444 F466"
    source: CURATOR
