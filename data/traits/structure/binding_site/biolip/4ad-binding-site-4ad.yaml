identifier: proteintraitsmech:BIOLIP_4AD
label: "4AD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-AMINO-1,4-DIOXOBUTAN-2-AMINIUM ADENOSINE-5'-MONOPHOSPHATE (4AD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey BZHVCXQAFQWXPZ-VWJPMABRSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
