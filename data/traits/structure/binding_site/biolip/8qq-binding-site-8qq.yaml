definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[4-(aminomethyl)phenyl]-2-methyl-6-[[4-oxidanyl-1-[(3~{R})-4,4,4-tris(fluoranyl)-3-phenyl-butanoyl]piperidin-4-yl]methyl]pyrazolo[4,3-d]pyrimidin-7-one (8QQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RLPQYKGBXQQARM-JOCHJYFZSA-N.
