identifier: proteintraitsmech:BIOLIP_EVV
label: "EVV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(2-ethoxy-4-{5-[({[(2R)-2-{(1R)-1-[formyl(hydroxy)amino]propyl}heptanoyl]amino}methyl)carbamoyl]furan-2-yl}benzene-1-carbonyl)-L-aspartic acid (EVV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SFAJGGFDBDWTMC-BAGYTPMASA-N.
