    protein_label: "7YZM chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7yzm chain A (resolution 1.82 Å); binding residues: C75 V76 Y77 C113 I116 T142 C143 K146 T282 P283 C308 C340 C373 Y376"
    source: CURATOR
