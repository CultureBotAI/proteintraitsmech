    protein_label: "7Q0M chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7q0m chain A (resolution 2.54 Å); binding residues: R31 Y35 K133 I162 N163 S166 F311 A314 F318 Q341 N344 F386 L416 E420"
    source: CURATOR
