identifier: proteintraitsmech:BIOLIP_TZD
label: "TZD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{3-[(4-AMINO-2-METHYLPYRIMIDIN-5-YL)METHYL]-4-METHYL-2-OXO-2,3-DIHYDRO-1,3-THIAZOL-5-YL}ETHYL TRIHYDROGEN DIPHOSPHATE (TZD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 3 PDB structures; ligand InChIKey ZGJUYGIRPQSCFA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
