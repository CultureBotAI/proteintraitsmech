identifier: proteintraitsmech:BIOLIP_5OD
label: "5OD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-(4-azanyl-4-methyl-piperidin-1-yl)-3-[2,3-bis(chloranyl)phenyl]pyrazin-2-amine (5OD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YGUFCDOEKKVKJK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
