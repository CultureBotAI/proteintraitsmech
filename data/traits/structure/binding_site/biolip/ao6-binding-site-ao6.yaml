identifier: proteintraitsmech:BIOLIP_AO6
label: "AO6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-methyl-1-[(2R)-2-oxidanylpropyl]-9H-carbazole-3,4-dione (AO6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey HADDOKGXXGGODW-MRVPVSSYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
