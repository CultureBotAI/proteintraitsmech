identifier: proteintraitsmech:BIOLIP_ISX
label: "ISX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R,4R,5R)-4-hydroxy-5-(hydroxymethyl)piperidin-3-yl beta-D-glucopyranoside (ISX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BEXVSXHKIARRKH-FYKVHUBJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
