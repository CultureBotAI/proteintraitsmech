    protein_label: "2BVD chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2bvd chain A (resolution 1.6 Å); binding residues: W14 F41 E70 E109 Y115 Y185 W187 E222 F256 E258 K260 E261"
    source: CURATOR
