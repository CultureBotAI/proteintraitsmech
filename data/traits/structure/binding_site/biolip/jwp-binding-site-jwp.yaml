identifier: proteintraitsmech:BIOLIP_JWP
label: "JWP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2S)-1-(hydroxyamino)-3-methyl-3-{[(oxetan-3-yl)methyl]sulfonyl}-1-oxobutan-2-yl]-4-(6-hydroxyhexa-1,3-diyn-1-yl)benzamide (JWP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HUQFNHQVVJRSBA-IBGZPJMESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
