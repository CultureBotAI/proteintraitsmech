identifier: proteintraitsmech:BIOLIP_PAM
label: "PAM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand PALMITOLEIC ACID (PAM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 5 PDB structures; ligand InChIKey SECPZKHBENQXJG-FPLPWBNLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
