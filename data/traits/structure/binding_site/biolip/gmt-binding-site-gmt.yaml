identifier: proteintraitsmech:BIOLIP_GMT
label: "GMT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-{[2-acetamido-2-deoxy-alpha-D-glucopyranosyl]oxy}butanedioic acid (GMT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey COBMRTSHZAUOCY-BVKYVCSXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:GMT
synonyms:
  - synonym_text: "(2S)-2-{[2-acetamido-2-deoxy-alpha-D-glucopyranosyl]oxy}butanedioic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P42982
    protein_label: "5D00 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5d00 chain A (resolution 2.15 Å); binding residues: G16 S17 Y95 H121 V151 N174 N207 E283 S284 F285 G286"
    source: CURATOR
