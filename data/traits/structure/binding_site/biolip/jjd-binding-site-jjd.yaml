identifier: proteintraitsmech:BIOLIP_JJD
label: "JJD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(4R)-4-(4-cyanophenyl)-5-ethanoyl-6-methyl-2-oxidanylidene-1-[3-(trifluoromethyl)phenyl]-4H-pyrimidin-3-yl]ethanoic acid (JJD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RRKQYMJDNSVFCG-OAQYLSRUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
