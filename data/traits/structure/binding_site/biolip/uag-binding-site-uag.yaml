identifier: proteintraitsmech:BIOLIP_UAG
label: "UAG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand URIDINE-5'-DIPHOSPHATE-N-ACETYLMURAMOYL-L-ALANINE-D-GLUTAMATE (UAG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey OJZCATPXPWFLHF-HPUCEMLMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
