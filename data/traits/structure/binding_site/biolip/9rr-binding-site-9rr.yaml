identifier: proteintraitsmech:BIOLIP_9RR
label: "9RR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5,5'-[propane-1,3-diylbis(oxy-4,1-phenylene)]bis(6-ethylpyrimidine-2,4-diamine) (9RR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CWKNXRKHGBGSLU-UHFFFAOYSA-N.
