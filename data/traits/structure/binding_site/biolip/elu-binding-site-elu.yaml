    protein_label: "6LOO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6loo chain A (resolution 1.99 Å); binding residues: R51 K52 H55 G58 Q81 T210 H245 I306"
    source: CURATOR
