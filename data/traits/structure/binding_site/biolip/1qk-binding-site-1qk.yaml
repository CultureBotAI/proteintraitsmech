identifier: proteintraitsmech:BIOLIP_1QK
label: "1QK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[({3-ethyl-5-[(2S)-2-(2-hydroxyethyl)piperidin-1-yl]pyrazolo[1,5-a]pyrimidin-7-yl}amino)methyl]-1-hydroxypyridinium (1QK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WBUFFOKXERTKGU-SFHVURJKSA-N.
