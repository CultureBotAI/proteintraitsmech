definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,4AR,5AR,11AR,12AS)-8-AMINO-2-HYDROXY-4A,5A,9,11,11A,12A-HEXAHYDRO[1,3,2]DIOXAPHOSPHININO[4',5':5,6]PYRANO[3,2-G]PTERIDINE-10,12(4H,6H)-DIONE 2-OXIDE (8CS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey PWFXLXMPGSLEOZ-RNCCKPSGSA-N.
