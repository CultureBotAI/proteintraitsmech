identifier: proteintraitsmech:BIOLIP_MW9
label: "MW9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (21R,24R,27S)-24,27,28-trihydroxy-18,24-dioxo-19,23,25-trioxa-24lambda~5~-phosphaoctacosan-21-yl (9Z)-octadec-9-enoate (MW9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 12 binding-site occurrences across 3 PDB structures; ligand InChIKey ZEFGRNLJASLRBZ-QIJYXWHJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
