identifier: proteintraitsmech:BIOLIP_T3X
label: "T3X-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-methyl-N-{4-[(4-methylpiperazin-1-yl)methyl]-3-(trifluoromethyl)phenyl}-3-[(1H-pyrazolo[3,4-b]pyridin-5-yl)ethynyl]benzamide (T3X) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey TZKBVRDEOITLRB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
