identifier: proteintraitsmech:BIOLIP_D1X
label: "D1X-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,6-dioxo-1,2,3,6-tetrahydropyridine-4-carboxylic acid (D1X) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RELAYXOQOWYDAT-UHFFFAOYSA-N.
