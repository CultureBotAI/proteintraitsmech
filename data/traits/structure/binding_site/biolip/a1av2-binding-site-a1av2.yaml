definition: >-
  A structure-derived ligand-binding site at which the ligand (3P)-5-[(1R)-1-(3,5-dichloropyridin-4-yl)ethoxy]-3-{6-[6-(methanesulfonyl)-2,6-diazaspiro[3.3]heptan-2-yl]pyridin-3-yl}-1H-indazole (A1AV2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JOAFWIHZEBKYQK-OAHLLOKOSA-N.
