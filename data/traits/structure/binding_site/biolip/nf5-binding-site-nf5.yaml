identifier: proteintraitsmech:BIOLIP_NF5
label: "NF5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-bromo-N-(2,3,4,5-tetrahydro-1H-3-benzazepin-7-yl)benzamide (NF5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey YMOUEQZHQYODQT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
