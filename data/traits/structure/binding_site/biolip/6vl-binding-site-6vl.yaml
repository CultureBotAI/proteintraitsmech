identifier: proteintraitsmech:BIOLIP_6VL
label: "6VL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4~{S})-4-ethyl-7,7-dimethyl-4-phenyl-2,6,8,9-tetrahydropyrazolo[3,4-b]quinolin-5-one (6VL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NCKLQXXBRWCYMA-FQEVSTJZSA-N.
