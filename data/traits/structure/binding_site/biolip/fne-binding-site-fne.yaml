identifier: proteintraitsmech:BIOLIP_FNE
label: "FNE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (MU-SULPHIDO)-BIS(MU-CYS,S)-[TRICARBONYLIRON-DI-(CYS,S)NICKEL(II)](FE-NI) (FNE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RSNJUOPWNIKDNA-UHFFFAOYSA-N.
