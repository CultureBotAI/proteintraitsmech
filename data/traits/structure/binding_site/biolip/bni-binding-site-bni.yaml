identifier: proteintraitsmech:BIOLIP_BNI
label: "BNI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(2-OXO-HEXAHYDRO-THIENO[3,4-D]IMIDAZOL-6-YL)-PENTANOIC ACID (4-NITRO-PHENYL)-AMIDE (BNI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PORZMUYPQKOFQY-YDHLFZDLSA-N.
