identifier: proteintraitsmech:BIOLIP_6RM
label: "6RM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-[(4-fluoranylphenoxy)methyl]-3-[(1~{R},2~{R})-2-(hydroxymethyl)cyclopropyl]-2-methyl-[1,3]thiazolo[3,2-a]pyrimidin-5-one (6RM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey CJDCZVBFZVDWJU-XHDPSFHLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
