    protein_label: "8B6S chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8b6s chain A (resolution 1.8 Å); binding residues: Y38 K40 F222 D340 A379 T382 F383 E404 G405 T406 M409 N506"
    source: CURATOR
