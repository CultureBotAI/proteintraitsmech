identifier: proteintraitsmech:BIOLIP_OEH
label: "OEH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [9-[2-carboxy-5-[2-[2-(6-chloranylhexoxy)ethoxy]ethylcarbamoyl]phenyl]-6-(dimethylamino)xanthen-3-ylidene]-dimethyl-azanium (OEH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YORHEDWUCXZZLS-UHFFFAOYSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:OEH
synonyms:
