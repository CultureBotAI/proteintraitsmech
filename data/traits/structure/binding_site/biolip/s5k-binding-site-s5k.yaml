identifier: proteintraitsmech:BIOLIP_S5K
label: "S5K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(1R)-2-(1-benzofuran-3-yl)-1-{[(1S,2R,4R)-7-oxabicyclo[2.2.1]heptan-2-yl]formamido}ethyl]boronic acid (S5K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RFQDLTYXNINJON-OYNZBZHQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
