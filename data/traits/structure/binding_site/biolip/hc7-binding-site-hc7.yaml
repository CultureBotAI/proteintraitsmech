identifier: proteintraitsmech:BIOLIP_HC7
label: "HC7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-[4'-({dimethyl[2-(phosphonooxy)ethyl]ammonio}acetyl)biphenyl-4-yl]-2-hydroxy-4,4-dimethylmorpholin-4-ium (HC7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MERLSFHNUMSODQ-XMMPIXPASA-P.
