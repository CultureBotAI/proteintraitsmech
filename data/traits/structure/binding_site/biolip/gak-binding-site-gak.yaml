identifier: proteintraitsmech:BIOLIP_GAK
label: "GAK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [2Ga-2S] cluster (GAK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VXAXRCXBFUALTA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:GAK
synonyms:
  - synonym_text: "[2Ga-2S] cluster-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P27320
    protein_label: "5AUK chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5auk chain A (resolution 1.62 Å); binding residues: Y37 S38 C39 R40 G42 C44 C47 C77"
    source: CURATOR
