identifier: proteintraitsmech:BIOLIP_NTD
label: "NTD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{HYDROXY[2-NITRO-4-(TRIFLUOROMETHYL)PHENYL]METHYLENE}CYCLOHEXANE-1,3-DIONE (NTD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PMHVFNYNPNKNRO-UHFFFAOYSA-N.
