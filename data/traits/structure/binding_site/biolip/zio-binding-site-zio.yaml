identifier: proteintraitsmech:BIOLIP_ZIO
label: "ZIO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,5R,6S,7R,8R,11R,12S,13R,14S,15S)-6-HYDROXY-5,7,8,11,13,15-HEXAMETHYL-4,10-DIOXO-14-{[3,4,6-TRIDEOXY-3-(DIMETHYLAMINO)-BETA-D-XYLO-HEXOPYRANOSYL]OXY}-1,9-DIOXASPIRO[2.13]HEXADEC-12-YL 2,6-DIDEOXY-3-O-METHYL-ALPHA-L-ARABINO-HEXOPYRANOSIDE (ZIO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RZPAKFUAFGMUPI-KGIGTXTPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
