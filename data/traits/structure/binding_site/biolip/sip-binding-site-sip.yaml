    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "7DFP chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7dfp chain A (resolution 3.1 Å); binding residues: V91 V111 D114 C118 I184 W386 F390"
    source: CURATOR
