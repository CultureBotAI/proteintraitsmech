identifier: proteintraitsmech:BIOLIP_SIP
label: "SIP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-[4-(4-fluorophenyl)-4-oxidanylidene-butyl]-1-phenyl-1,3,8-triazaspiro[4.5]decan-4-one (SIP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DKGZKTPJOSAWFA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:SIP
synonyms:
