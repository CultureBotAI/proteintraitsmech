    protein_label: "6SUL chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6sul chain A (resolution 1.35 Å); binding residues: E36 E159 Q161 D202 H204 H205 G206 D222 N238 Y242 I290 L293"
    source: CURATOR
