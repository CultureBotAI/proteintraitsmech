    protein_label: "3PBL chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3pbl chain A (resolution 2.89 Å); binding residues: D110 V111 I183 S192 F345 F346 H349 Y373"
    source: CURATOR
