    protein_label: "5IRP chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5irp chain A (resolution 2.1 Å); binding residues: Y43 L85 R139 H169 N209 T210 R225 G227 I228 Y364"
    source: CURATOR
