identifier: proteintraitsmech:BIOLIP_W97
label: "W97-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-ethynyl-1-(pentan-3-yl)-1H-imidazo[4,5-b]pyrazin-2-ol (W97) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RSQGZEAXODVTOL-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
