identifier: proteintraitsmech:BIOLIP_PMV
label: "PMV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-3-HYDROXY-3-METHYL-5-(PHOSPHONOOXY)PENTANOIC ACID (PMV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey OKZYCXHTTZZYSK-ZCFIWIBFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
