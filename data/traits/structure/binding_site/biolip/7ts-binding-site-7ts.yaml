identifier: proteintraitsmech:BIOLIP_7TS
label: "7TS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5-hydroxy-6-methyl-4-{[(3-oxo-2,3-dihydro-1,2-oxazol-4-yl)amino]methyl}pyridin-3-yl)methyl dihydrogen phosphate (7TS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PXWFNGNWQUPGPJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
