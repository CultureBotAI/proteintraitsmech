identifier: proteintraitsmech:BIOLIP_HJB
label: "HJB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[7,7-bis(oxidanyl)-8-oxa-7-boranuidabicyclo[4.3.0]nona-1(6),2,4-trien-5-yl]propanoic acid (HJB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CKXGLMTUQXTCMV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
