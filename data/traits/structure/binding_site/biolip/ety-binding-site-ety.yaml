identifier: proteintraitsmech:BIOLIP_ETY
label: "ETY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-ethylphenol (ETY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HXDOZKJGKXYMEW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ETY
synonyms:
  - synonym_text: "4-ethylphenol-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q29147
    protein_label: "2RA6 chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2ra6 chain C (resolution 1.5 Å); binding residues: L61 G63 L78 T79 A80 F112 F114 F129"
    source: CURATOR
