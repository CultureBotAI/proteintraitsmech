identifier: proteintraitsmech:BIOLIP_FPG
label: "FPG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S)-1-[(1R)-1-FLUOROETHYL]-1,5-DIMETHYLHEXYL TRIHYDROGEN DIPHOSPHATE (FPG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JUOIVVAWJCVSPX-ZJUUUORDSA-N.
