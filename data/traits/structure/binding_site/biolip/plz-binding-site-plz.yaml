identifier: proteintraitsmech:BIOLIP_PLZ
label: "PLZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[({3-HYDROXY-2-METHYL-5-[(PHOSPHONOOXY)METHYL]PYRIDIN-4-YL}METHYL)AMINO]BUTANOIC ACID (PLZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey DOHWOHSLOVXAFH-UHFFFAOYSA-N.
