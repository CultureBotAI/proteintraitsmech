identifier: proteintraitsmech:BIOLIP_7IJ
label: "7IJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,8-bis(oxidanyl)-7-(piperidin-1-ylmethyl)-[1]benzofuro[3,2-c]chromen-6-one (7IJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SORWCEYAEWEEFV-UHFFFAOYSA-N.
