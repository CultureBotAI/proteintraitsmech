identifier: proteintraitsmech:BIOLIP_CRT
label: "CRT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand SPIRILLOXANTHIN (CRT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 41 binding-site occurrences across 14 PDB structures; ligand InChIKey VAZQBTJCYODOSV-RISZBRKMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
