identifier: proteintraitsmech:BIOLIP_3ED
label: "3ED-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[(3S,4S)-4-amino-3-methyl-2-oxa-8-azaspiro[4.5]decan-8-yl]-3-(2,3-dichlorophenyl)-2-methylpyrimidin-4(3H)-one (3ED) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WYUIJDCKOPRFJO-HXPMCKFVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
