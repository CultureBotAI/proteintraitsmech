identifier: proteintraitsmech:BIOLIP_7ZQ
label: "7ZQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-chloranyl-N-[2-oxidanylidene-2-[[(1S)-1-phenylethyl]amino]ethyl]benzamide (7ZQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MWDVCHRYCKXEBY-LBPRGKRZSA-N.
