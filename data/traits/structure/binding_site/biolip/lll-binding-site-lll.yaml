identifier: proteintraitsmech:BIOLIP_LLL
label: "LLL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3R,4R,5R)-2-((1S,2S,3R,4S,6R)-4,6-DIAMINO-3-((2R,3R,6S)-3-AMINO-6-(AMINOMETHYL)-TETRAHYDRO-2H-PYRAN-2-YLOXY)-2-HYDR OXYCYCLOHEXYLOXY)-5-METHYL-4-(METHYLAMINO)-TETRAHYDRO-2H-PYRAN-3,5-DIOL (LLL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey VEGXETMJINRLTH-BOZYPMBZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
