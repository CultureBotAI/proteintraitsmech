identifier: proteintraitsmech:BIOLIP_BFN
label: "BFN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-acetamido-9-(benzoylamino)-3,5,9-trideoxy-3-fluoro-D-erythro-alpha-L-manno-non-2-ulopyranosonic acid (BFN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MROQLLHLBMWCPR-LQUZZVICSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
