identifier: proteintraitsmech:BIOLIP_MTN
label: "MTN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-[(1-oxyl-2,2,5,5-tetramethyl-2,5-dihydro-1H-pyrrol-3-yl)methyl] methanesulfonothioate (MTN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 9 binding-site occurrences across 6 PDB structures; ligand InChIKey MXZPGYFBZHBAQM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
