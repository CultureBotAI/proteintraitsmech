identifier: proteintraitsmech:BIOLIP_B2O
label: "B2O-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[6-(2-naphthalen-1-ylethoxy)-2,3,4,5-tetrahydro-1H-3-benzazepin-3-ium-3-yl]butanoic acid (B2O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XIMAYLMGLVYUOJ-UHFFFAOYSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
