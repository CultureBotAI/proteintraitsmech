identifier: proteintraitsmech:BIOLIP_4IR
label: "4IR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {N-(4-{[2-(amino-kappaN)ethyl]sulfamoyl-kappaN}phenyl)-5-[(3aS,4S,6aR)-2-oxohexahydro-1H-thieno[3,4-d]imidazol-4-yl]pentanamide}(chloro)[(1,2,3,4,5-eta)-1,2,3,4,5-pentamethylcyclopentadienyl]iridium(III) (4IR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey OPJZDGOSRZOXTM-DYKJULMGSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
