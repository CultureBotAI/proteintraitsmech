label: "J06-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3S,6Z,10Z,14Z,18Z,22Z,26Z,30Z,34Z,39S,43S)-3,7,11,15,19,23,27,31,35,39,43,47-dodecamethyloctatetraconta-6,10,14,18,22,26,30,34-octaenyl] dihydrogen phosphate (J06) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XTTHNPQIJYVHIB-WHVVPYAWSA-N.
