identifier: proteintraitsmech:BIOLIP_HNX
label: "HNX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-azanyl-7-(naphthalen-1-ylmethoxy)-3,4-dihydro-1~{H}-naphthalene-2-carboxylic acid (HNX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HRZHVSYWPDDNHF-QFIPXVFZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
