    protein_label: "7DSK chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7dsk chain B (resolution 2.9 Å); binding residues: T62 I63 S66 G67 I140 S143 S144 F252 G255 Y259 V396 I397 N404"
    source: CURATOR
