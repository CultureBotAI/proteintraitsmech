    protein_label: "3RC1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3rc1 chain A (resolution 1.71 Å); binding residues: R23 R24 F159 I161 P162 Y240 T260"
    source: CURATOR
