identifier: proteintraitsmech:BIOLIP_IBD
label: "IBD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-amino-4-{2,4-dichloro-5-[2-(diethylamino)ethoxy]phenyl}-N-ethylthieno[2,3-d]pyrimidine-6-carboxamide (IBD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KQRDVNUCOWRFLN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:IBD
synonyms:
  - synonym_text: "2-amino-4-{2,4-dichloro-5-[2-(diethylamino)ethoxy]phenyl}-N-ethylthieno[2,3-d]pyrimidine-6-carboxamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q8I0V4
    protein_label: "3PEH chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3peh chain B (resolution 2.75 Å); binding residues: A110 I151 G152 M153 D157 N161 I165 F194"
    source: CURATOR
