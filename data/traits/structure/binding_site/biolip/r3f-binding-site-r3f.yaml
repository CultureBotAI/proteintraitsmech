definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[2-[2-[4-[[(2R,3S,4R,5S,6S)-6-methyl-3,4,5-tris(oxidanyl)oxan-2-yl]oxymethyl]-1,2,3-triazol-1-yl]ethoxy]ethoxy]ethyl 2-[3,6-bis(diethylamino)-9H-xanthen-9-yl]benzoate (R3F) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey UATRTQBFYDMLCB-WXZSZNCQSA-N.
