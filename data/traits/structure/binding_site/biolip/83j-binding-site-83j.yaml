label: "83J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[4-(benzenecarbonyl)piperazin-1-yl]-2-[4-methoxy-7-(3-methyl-1H-1,2,4-triazol-1-yl)-1H-pyrrolo[2,3-c]pyridin-3-yl]ethane-1,2-dione (83J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QRPZBKAMSFHVRW-UHFFFAOYSA-N.
