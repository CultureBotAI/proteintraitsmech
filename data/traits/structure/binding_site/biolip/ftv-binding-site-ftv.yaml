identifier: proteintraitsmech:BIOLIP_FTV
label: "FTV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-2-(2,4-dichlorophenoxy)propanoic acid (FTV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MZHCENGPTKEIGP-RXMQYKEDSA-N.
