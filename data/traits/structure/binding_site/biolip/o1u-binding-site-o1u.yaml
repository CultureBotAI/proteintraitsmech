identifier: proteintraitsmech:BIOLIP_O1U
label: "O1U-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{Z},4~{E},6~{E},8~{E},10~{E},12~{E},14~{E},16~{E})-4,8,13,17-tetramethyl-3-oxidanyl-19-[(4~{R})-2,6,6-trimethyl-4-oxidanyl-cyclohexen-1-yl]-1-[(1~{R},4~{S})-1,2,2-trimethyl-4-oxidanyl-cyclopentyl]nonadeca-2,4,6,8,10,12,14,16-octaen-18-yn-1-one (O1U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey WSLGBPCJDUQFND-BBPSKTQQSA-N.
