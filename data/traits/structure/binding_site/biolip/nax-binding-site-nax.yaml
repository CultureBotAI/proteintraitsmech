identifier: proteintraitsmech:BIOLIP_NAX
label: "NAX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand BETA-6-HYDROXY-1,4,5,6-TETRHYDRONICOTINAMIDE ADENINE DINUCLEOTIDE (NAX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey IDBZKGQRLBFUFQ-VPHRTNKSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
