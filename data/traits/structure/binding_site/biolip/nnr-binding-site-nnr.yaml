identifier: proteintraitsmech:BIOLIP_NNR
label: "NNR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Nicotinamide riboside (NNR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JLEBZPBDRKPWTD-TURQNECASA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NNR
synonyms:
  - synonym_text: "Nicotinamide riboside-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:D2ZZC1
    protein_label: "4QTN chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4qtn chain C (resolution 2.8 Å); binding residues: C53 V54 V57 V72 Y95 Q171 W185 N189"
    source: CURATOR
