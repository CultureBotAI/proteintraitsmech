definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3R,4S,5R,6S)-2-(hydroxymethyl)-5-methoxy-6-[(3R,4R,5S)-4-oxidanyl-5-(4-pyrimidin-5-yl-1,2,3-triazol-1-yl)oxan-3-yl]sulfanyl-4-[4-[3,4,5-tris(fluoranyl)phenyl]-1,2,3-triazol-1-yl]oxan-3-ol (H5O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XUWUKOCAMCFANQ-COQUQQDQSA-N.
