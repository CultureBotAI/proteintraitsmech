    protein_label: "6MCW chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6mcw chain A (resolution 2.4 Å); binding residues: Y79 F92 E178 M179 I181 Q182 A257 H260 V434"
    source: CURATOR
