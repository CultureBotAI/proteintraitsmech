identifier: proteintraitsmech:BIOLIP_ULP
label: "ULP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3S,4R,5R,6R)-5-(acetylamino)-6-{[(R)-{[(S)-{[(2R,3S,4R,5R)-5-(2,4-dioxo-3,4-dihydropyrimidin-1(2H)-yl)-3,4-dihydroxytetrahydrofuran-2-yl]methoxy}(hydroxy)phosphoryl]oxy}(hydroxy)phosphoryl]oxy}-3-hydroxy-4-{[(1E)-{3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene]amino}tetrahydro-2H-pyran-2-carboxylic acid (non-preferred name) (ULP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IGKBPIFLZAFLLV-IOECPDIJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
