identifier: proteintraitsmech:BIOLIP_56W
label: "56W-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,6R)-2-{[(R)-[(3R)-3-(acetylamino)-3-carboxypropyl](hydroxy)phosphoryl]methyl}-6-aminoheptanedioic acid (56W) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AWMPEAXWUINOES-HBNTYKKESA-N.
