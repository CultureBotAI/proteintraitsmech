    protein_label: "3MJM chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3mjm chain A (resolution 1.87 Å); binding residues: H18 R20 H139 C221 L222 A252 H254 A266 G267"
    source: CURATOR
