    protein_label: "5NWK chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5nwk chain B (resolution 3.3 Å); binding residues: E19 N49 V53 F126 K129 P174 D222 I226"
    source: CURATOR
