    protein_label: "7MQX chain E (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7mqx chain E (resolution 1.914 Å); binding residues: V22 K166 D195 N197 E247 H297 E317"
    source: CURATOR
