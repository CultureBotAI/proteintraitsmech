identifier: proteintraitsmech:BIOLIP_ZMD
label: "ZMD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-2,1-benzoxaborole-1,3(3H)-diol (ZMD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GKXMUTRKNBAUGN-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
