identifier: proteintraitsmech:BIOLIP_MCU
label: "MCU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 4-O-methyl-beta-D-glucopyranuronate (MCU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MKGHDZIEKZPBCZ-ULQPCXBYSA-N.
