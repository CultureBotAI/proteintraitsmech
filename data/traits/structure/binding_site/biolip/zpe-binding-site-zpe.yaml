identifier: proteintraitsmech:BIOLIP_ZPE
label: "ZPE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(S)-(2-aminoethoxy)(hydroxy)phosphoryl]oxy}-2-(tetradec-5-enoyloxy)propyl (11Z)-octadec-11-enoate (ZPE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SWNDXEVFPWKPGK-SPZKJSGBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
