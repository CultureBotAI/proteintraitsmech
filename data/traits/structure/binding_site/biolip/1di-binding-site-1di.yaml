identifier: proteintraitsmech:BIOLIP_1DI
label: "1DI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-2-amino-3-(2,4-dichlorophenyl)-1-(1,3-dihydro-2H-isoindol-2-yl)propan-1-one (1DI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JFWNERIMAUEHNN-MRXNPFEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
