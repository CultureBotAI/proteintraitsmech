identifier: proteintraitsmech:BIOLIP_GOA
label: "GOA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GLYCOLIC ACID (GOA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 9 binding-site occurrences across 9 PDB structures; ligand InChIKey AEMRFAOFKBGASW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
