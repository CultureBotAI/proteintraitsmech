identifier: proteintraitsmech:BIOLIP_W40
label: "W40-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[3,5-bis(fluoranyl)phenyl]-1-[(1S)-1-phenylethyl]pyrimidine-2,4-dione (W40) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PDFBJEYJDVRNBX-NSHDSACASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
