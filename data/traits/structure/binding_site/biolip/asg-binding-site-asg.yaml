identifier: proteintraitsmech:BIOLIP_ASG
label: "ASG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-acetamido-2-deoxy-4-O-sulfo-beta-D-galactopyranose (ASG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 12 binding-site occurrences across 5 PDB structures; ligand InChIKey WHCJUIFHMJFEFZ-UIAUGNHASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
