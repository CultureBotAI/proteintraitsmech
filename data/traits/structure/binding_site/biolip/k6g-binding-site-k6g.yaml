identifier: proteintraitsmech:BIOLIP_K6G
label: "K6G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-2-oxidanyl-3-[oxidanyl-[2-(trimethyl-$l^{4}-azanyl)ethoxy]phosphoryl]oxy-propyl] hexadecanoate (K6G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SCBAYHQXYOJTRE-UHFFFAOYSA-N.
