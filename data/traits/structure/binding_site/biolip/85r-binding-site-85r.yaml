identifier: proteintraitsmech:BIOLIP_85R
label: "85R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-2-hexadecanoyloxy-3-[oxidanyl-[(2~{S},3~{S},5~{R},6~{S})-2,3,4,5,6-pentakis(oxidanyl)cyclohexyl]oxy-phosphoryl]oxy-propyl] hexadecanoate (85R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IBUKXRINTKQBRQ-PLWKSVIPSA-N.
