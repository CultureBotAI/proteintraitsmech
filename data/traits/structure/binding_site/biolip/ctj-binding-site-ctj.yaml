identifier: proteintraitsmech:BIOLIP_CTJ
label: "CTJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-({(2R)-2-[(1R)-1-{[(2Z)-2-(2-amino-1,3-thiazol-4-yl)-2-{[(2-carboxypropan-2-yl)oxy]imino}acetyl]amino}-2-oxoethyl]-4-carboxy-3,6-dihydro-2H-1,3-thiazin-5-yl}methyl)pyridinium (CTJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BJJNSFSVDFPVPL-QNLDICNMSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
