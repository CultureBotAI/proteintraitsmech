identifier: proteintraitsmech:BIOLIP_CG7
label: "CG7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-{[6-chloro-5-(2'-hydroxy[1,1'-biphenyl]-4-yl)-1H-imidazo[4,5-b]pyridin-2-yl]oxy}-2-methylbenzoic acid (CG7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey MEZQZPGDJJEQPZ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
