identifier: proteintraitsmech:BIOLIP_ZGR
label: "ZGR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,4-dihydroxy-6-[(1E,10S)-10-hydroxy-6-oxoundec-1-en-1-yl]benzoic acid (ZGR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KZABMNZGZHPCFB-QBODLPLBSA-N.
