identifier: proteintraitsmech:BIOLIP_RJK
label: "RJK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[4-[4-(aminomethyl)pyrazol-1-yl]-3-chloranyl-phenyl]-3-[(3~{R})-6-bromanyl-3,4-dihydro-2~{H}-chromen-3-yl]urea (RJK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DHIWXRKMNHPISE-MRXNPFEDSA-N.
