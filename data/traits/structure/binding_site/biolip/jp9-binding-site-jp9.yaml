identifier: proteintraitsmech:BIOLIP_JP9
label: "JP9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S},4~{S})-2,3,4-tris(oxidanyl)-5-oxidanylidene-6-phosphonooxy-hexane-1-sulfonic acid (JP9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BXFAKMQEOMYBNM-HSUXUTPPSA-N.
