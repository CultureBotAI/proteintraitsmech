identifier: proteintraitsmech:BIOLIP_08G
label: "08G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[4-(hydroxymethyl)-1H-pyrazolo[4,3-c]pyridin-6-yl]-3-[(1S)-1-phenylethyl]urea (08G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RAXZSEGXMBWYQK-JTQLQIEISA-N.
