    protein_label: "6XKD chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6xkd chain A (resolution 3.2 Å); binding residues: T238 F239 N259 L272 K277 P305 D308 Y322 Y353 D358 H362 H517"
    source: CURATOR
