identifier: proteintraitsmech:BIOLIP_IJE
label: "IJE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {2-[1-(6,7-dimethoxyquinazolin-4-yl)piperidin-4-yl]ethyl}phosphonic acid (IJE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SNLWMWQNJTVWKD-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
