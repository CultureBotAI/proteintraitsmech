identifier: proteintraitsmech:BIOLIP_H5L
label: "H5L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-[2-[3-[[(2R)-4-[[[(2R,3S,4R,5R)-5-(6-aminopurin-9-yl)-4-oxidanyl-3-phosphonooxy-oxolan-2-yl]methoxy-oxidanyl-phosphoryl]oxy-oxidanyl-phosphoryl]oxy-3,3-dimethyl-2-oxidanyl-butanoyl]amino]propanoylamino]ethyl] (E)-3-[3,4-bis(oxidanyl)phenyl]prop-2-enethioate (H5L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QHRGJMIMHCLHRG-ZSELIEHESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
