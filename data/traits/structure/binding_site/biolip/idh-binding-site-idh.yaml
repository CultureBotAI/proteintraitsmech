identifier: proteintraitsmech:BIOLIP_IDH
label: "IDH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S)-5-IODODIHYDRO-2,4(1H,3H)-PYRIMIDINEDIONE (IDH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YGKCTZPSAOUUMT-REOHCLBHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
