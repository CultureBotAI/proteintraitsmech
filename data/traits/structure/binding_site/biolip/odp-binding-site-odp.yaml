    protein_label: "1LQT chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1lqt chain B (resolution 1.05 Å); binding residues: H57 R110 N155 G156 N157 V158 D161 R199 R200 E211 V322 W359 G366"
    source: CURATOR
