    protein_label: "5B2E chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5b2e chain A (resolution 1.8 Å); binding residues: H44 D46 D47 G77 R92 D115 H152 H155"
    source: CURATOR
