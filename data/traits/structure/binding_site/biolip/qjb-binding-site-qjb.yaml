identifier: proteintraitsmech:BIOLIP_QJB
label: "QJB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(2~{S},3~{S},4~{R},4~{a}~{S},10~{a}~{S})-2-methyl-3,4-bis(oxidanyl)-3,4,4~{a},10~{a}-tetrahydro-2~{H}-pyrano[2,3-b][1,4]benzoxathiin-7-yl]-~{N}-(3-oxidanylpropyl)ethanamide (QJB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey REDZBLYPLDKUEX-SSFHUKSJSA-N.
