identifier: proteintraitsmech:BIOLIP_MF6
label: "MF6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,3R,4R,6R,9S,11R,14R,15S,16R,18R)-4-(6-amino-9H-purin-9-yl)-9,11,15,16,18-pentahydroxy-2,5,8,10,12,17-hexaoxa-9lambda~5~,11lambda~5~-diphosphatricyclo[12.2.1.1~3,6~]octadecane-9,11-dione (MF6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FWMYLCHFFTZWAN-ZQSHOCFMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
