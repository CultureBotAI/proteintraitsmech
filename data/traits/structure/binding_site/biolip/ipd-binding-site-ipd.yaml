    protein_label: "4RW3 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4rw3 chain A (resolution 1.72 Å); binding residues: H12 E32 H48 D92 K94 Y223 W225"
    source: CURATOR
