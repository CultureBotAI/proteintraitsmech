identifier: proteintraitsmech:BIOLIP_MZM
label: "MZM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(3-methyl-5-sulfamoyl-1,3,4-thiadiazol-2(3H)-ylidene)acetamide (MZM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FLOSMHQXBMRNHR-DAXSKMNVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:MZM
synonyms:
  - synonym_text: "N-(3-methyl-5-sulfamoyl-1,3,4-thiadiazol-2(3H)-ylidene)acetamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00915
    protein_label: "1BZM chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1bzm chain A (resolution 2.0 Å); binding residues: F91 H94 L198 T199 H200"
    source: CURATOR
