identifier: proteintraitsmech:BIOLIP_ME8
label: "ME8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [[(2R,3S,4R,5R)-5-(6-aminopurin-9-yl)-3,4-dihydroxy-oxolan-2-yl]methoxy-hydroxy-phosphoryl] (2S)-2-azanyl-4-methylsulfanyl-butanoate (ME8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey RZQLXQQLNKBFRX-TWBCTODHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
