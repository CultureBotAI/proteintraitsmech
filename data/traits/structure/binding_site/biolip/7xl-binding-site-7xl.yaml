identifier: proteintraitsmech:BIOLIP_7XL
label: "7XL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [[(2R,3S,4R,5R)-5-(4-azanyl-2-oxidanylidene-pyrimidin-1-yl)-3,4-bis(oxidanyl)oxolan-2-yl]methoxy-oxidanyl-phosphoryl]oxy-(2-hydroxyethyl)phosphinic acid (7XL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ODFOOQGQRDVSPW-PEBGCTIMSA-N.
