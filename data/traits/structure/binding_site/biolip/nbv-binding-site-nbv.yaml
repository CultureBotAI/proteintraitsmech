identifier: proteintraitsmech:BIOLIP_NBV
label: "NBV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3R,4R,5S)-1-BUTYL-2-(HYDROXYMETHYL)PIPERIDINE-3,4,5-TRIOL (NBV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UQRORFVVSGFNRO-UTINFBMNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
