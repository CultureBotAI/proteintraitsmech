identifier: proteintraitsmech:BIOLIP_RJB
label: "RJB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[2-(1,3-benzothiazol-2-ylmethylcarbamoyl)-1,3-dihydroinden-2-yl]ethanoic acid (RJB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OYMIHDNBNWVHIU-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:RJB
synonyms:
  - synonym_text: "2-[2-(1,3-benzothiazol-2-ylmethylcarbamoyl)-1,3-dihydroinden-2-yl]ethanoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:E3ULB4
    protein_label: "7AJR chain AAA (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7ajr chain AAA (resolution 1.75 Å); binding residues: E111 N112 F129 V137 H140 E141 H144 E164 I186 G187 I190 L197 R198 H223"
    source: CURATOR
