identifier: proteintraitsmech:BIOLIP_KYJ
label: "KYJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2Z)-2-[(4-{[2-(1H-benzimidazol-2-yl)ethyl]carbamoyl}phenyl)methylidene]-3-oxo-2,3-dihydro-1-benzofuran-7-carboxamide (KYJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UNPLREWLHBUEMG-STZFKDTASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
