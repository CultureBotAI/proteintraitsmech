    protein_label: "5FH7 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5fh7 chain A (resolution 1.47 Å); binding residues: I683 F684 L687 Y696 M731 A735 N739 I745"
    source: CURATOR
