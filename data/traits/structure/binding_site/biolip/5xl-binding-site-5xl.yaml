identifier: proteintraitsmech:BIOLIP_5XL
label: "5XL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-chloranyl-3-[(dimethylamino)methyl]-4~{H}-pyrrolo[1,2-a]quinazolin-5-one (5XL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FSTYDISPXAAJMK-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
