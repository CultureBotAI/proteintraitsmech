label: "M2A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R},3~{R},4~{R},5~{S})-2-(6-aminopurin-9-yl)-4-oxidanyl-5-[[oxidanyl(phosphonooxy)phosphoryl]oxymethyl]oxolan-3-yl] 2-(methylamino)benzoate (M2A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FYQOZQIQCITNBC-ZCTGUTNYSA-N.
