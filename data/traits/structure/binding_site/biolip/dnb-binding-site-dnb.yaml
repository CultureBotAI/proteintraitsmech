    protein_label: "3G5I chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3g5i chain A (resolution 2.1 Å); binding residues: D14 N39 V81 H82 M150 E164 F165 N166 H240 D241"
    source: CURATOR
