identifier: proteintraitsmech:BIOLIP_DNB
label: "DNB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3S,4R,5R)-2-(3,4-diaminophenyl)-5-(hydroxymethyl)pyrrolidine-3,4-diol (DNB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YAYMFJWCRXEXGZ-YTWAJWBKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
