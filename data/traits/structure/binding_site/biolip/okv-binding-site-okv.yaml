identifier: proteintraitsmech:BIOLIP_OKV
label: "OKV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[5-({4-[3-(trifluoromethyl)phenyl]piperazin-1-yl}sulfonyl)-2,3-dihydro-1H-indol-1-yl]ethan-1-one (OKV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JRTCXCIMCOKGMN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
