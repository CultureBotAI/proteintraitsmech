identifier: proteintraitsmech:BIOLIP_ZS4
label: "ZS4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(difluoromethyl)-1-(4,6-dimorpholin-4-yl-1,3,5-triazin-2-yl)-1H-benzimidazole (ZS4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HGVNLRPZOWWDKD-UHFFFAOYSA-N.
