identifier: proteintraitsmech:BIOLIP_08T
label: "08T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [[[(2R,3S,4R,5R)-5-(6-aminopurin-9-yl)-3,4-bis(oxidanyl)oxolan-2-yl]methoxy-oxidanyl-phosphoryl]oxy-oxidanyl-phosphoryl]oxy-tris(fluoranyl)beryllium (08T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 4 PDB structures; ligand InChIKey WOGYHYSOODLXII-KWIZKVQNSA-J.
