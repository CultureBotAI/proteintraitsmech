identifier: proteintraitsmech:BIOLIP_8NU
label: "8NU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[2-[4-(6-fluoranyl-1,2-benzoxazol-3-yl)piperidin-1-yl]ethyl]-2-methyl-6,7,8,9-tetrahydropyrido[1,2-a]pyrimidin-4-one (8NU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RAPZEAPATHNIPO-UHFFFAOYSA-N.
