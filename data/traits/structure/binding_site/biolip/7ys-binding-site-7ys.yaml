definition: >-
  A structure-derived ligand-binding site at which the ligand (10R)-7-amino-11-chloro-12-fluoro-1-(2-hydroxyethyl)-3,10,16-trimethyl-16,17-dihydro-1H-8,4-(azeno)pyrazolo[4,3-h][2,5,11]benzoxadiazacyclotetradecin-15(10H)-one (7YS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VFRJEYJOQSRCNK-LLVKDONJSA-N.
