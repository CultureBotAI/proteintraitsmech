definition: >-
  A structure-derived ligand-binding site at which the ligand (6aS,8aR,12aS,12bR,13aR)-5,6a,9,9,12a,13a-hexamethyl-7,8,8a,9,11,12,12a,12b,13,13a-decahydro-3H-benzo[a]furo[3,4-j]xanthene-3,4,10(1H,6aH)-trione (9FR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CALHDWXNCZWYDF-MZTDULQMSA-N.
