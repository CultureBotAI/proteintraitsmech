identifier: proteintraitsmech:BIOLIP_5QT
label: "5QT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2-dimethylpropyl 2-[(3-oxidanylidene-5-sulfanylidene-2~{H}-1,2,4-triazin-6-yl)amino]ethanoate (5QT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey REFYLRHEWINELP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
