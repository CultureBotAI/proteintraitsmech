identifier: proteintraitsmech:BIOLIP_L9R
label: "L9R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-3-(octadecanoyloxy)-2-[(9Z)-octadec-9-enoyloxy]propyl 2-(trimethylammonio)ethyl phosphate (L9R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey ATHVAWFAEPLPPQ-FLHXZNPISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
