identifier: proteintraitsmech:BIOLIP_6CR
label: "6CR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-chloro-9-(beta-D-ribofuranosyl)-9H-purin-2-amine (6CR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey TXWHPSZYRUHEGT-UUOKFMHZSA-N.
