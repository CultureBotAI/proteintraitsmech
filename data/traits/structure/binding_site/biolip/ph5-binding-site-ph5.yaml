identifier: proteintraitsmech:BIOLIP_PH5
label: "PH5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand benzyl 3,5-dideoxy-5-(propanoylamino)-D-glycero-alpha-D-galacto-non-2-ulopyranosidonic acid (PH5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XDURJXFZCXMSHL-YZKZVDITSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
