    protein_label: "6B11 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6b11 chain A (resolution 1.99 Å); binding residues: G102 E103 E105 L111 A195 R197 P198 A204 L255"
    source: CURATOR
