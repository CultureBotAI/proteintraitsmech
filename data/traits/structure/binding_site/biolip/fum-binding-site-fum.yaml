identifier: proteintraitsmech:BIOLIP_FUM
label: "FUM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand FUMARIC ACID (FUM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 27 binding-site occurrences across 17 PDB structures; ligand InChIKey VZCYOOQTPOCHFL-OWOJBTEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
