identifier: proteintraitsmech:BIOLIP_WFT
label: "WFT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-azanyl-N-[(2S)-6-[(1S,5R)-3,8-diazabicyclo[3.2.1]octan-3-yl]-1,2,3,4-tetrahydronaphthalen-2-yl]-6-methyl-thieno[2,3-b]pyridine-2-carboxamide (WFT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UZKKSCQGVUDMFY-GBESFXJTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
