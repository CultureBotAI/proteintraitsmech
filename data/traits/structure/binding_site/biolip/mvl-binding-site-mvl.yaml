identifier: proteintraitsmech:BIOLIP_MVL
label: "MVL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5R,6R,7S,8R)-5-(HYDROXYMETHYL)-5,6,7,8-TETRAHYDROIMIDAZO[1,2-A]PYRIDINE-6,7,8-TRIOL (MVL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey RZRDQZQPTISYKY-JWXFUTCRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
