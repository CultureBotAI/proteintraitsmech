    protein_label: "8JTZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8jtz chain A (resolution 3.27 Å); binding residues: K214 W217 Q241 F244 T443 I446 Q447 C473"
    source: CURATOR
