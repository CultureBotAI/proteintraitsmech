identifier: proteintraitsmech:BIOLIP_VIS
label: "VIS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-chloranyl-~{N}-(4-chloranyl-3-pyridin-2-yl-phenyl)-4-methylsulfonyl-benzamide (VIS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BPQMGSKTAYIVFO-UHFFFAOYSA-N.
