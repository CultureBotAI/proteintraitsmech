identifier: proteintraitsmech:BIOLIP_ZFB
label: "ZFB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-3-{[(BENZYLOXY)CARBONYL]AMINO}-2-OXO-4-PHENYLBUTANE-1-DIAZONIUM (ZFB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VLIGBVLLNSWVMI-MRXNPFEDSA-O.
