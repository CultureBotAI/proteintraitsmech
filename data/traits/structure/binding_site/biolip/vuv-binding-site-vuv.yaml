identifier: proteintraitsmech:BIOLIP_VUV
label: "VUV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[(2~{S},3~{R})-2-carboxypyrrolidin-3-yl]propyl-$l^{3}-oxidanyl-bis(oxidanyl)boranuide (VUV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SKGPQQUJOITTRF-RQJHMYQMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
