identifier: proteintraitsmech:BIOLIP_CNI
label: "CNI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-nitro-2,3-dioxo-2,3-dihydroquinoxaline-6-carbonitrile (CNI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IAWXTSMHXFRLQR-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:CNI
synonyms:
  - synonym_text: "7-nitro-2,3-dioxo-2,3-dihydroquinoxaline-6-carbonitrile-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P19492
    protein_label: "4F1Y chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4f1y chain A (resolution 1.79 Å); binding residues: Y61 P89 L90 T91 R96 T174 E193"
    source: CURATOR
