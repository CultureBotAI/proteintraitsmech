identifier: proteintraitsmech:BIOLIP_ZD7
label: "ZD7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5,7-diethyl-1-{[2'-(1H-tetrazol-5-yl)biphenyl-4-yl]methyl}-3,4-dihydro-1,6-naphthyridin-2(1H)-one (ZD7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BFVNEYDCFJNLGN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
