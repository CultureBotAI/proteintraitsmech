identifier: proteintraitsmech:BIOLIP_MV4
label: "MV4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-[(3R)-3-aminopyrrolidin-1-yl]-6-(naphthalen-1-yl)pyrido[2,3-d]pyrimidin-2-amine (MV4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LGFLKSRFTIOLSI-OAHLLOKOSA-N.
