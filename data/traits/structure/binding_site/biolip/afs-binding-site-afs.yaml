identifier: proteintraitsmech:BIOLIP_AFS
label: "AFS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1R)-1-phosphonoethyl]-L-alaninamide (AFS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BHAYDBSYOBONRV-IUYQGCFVSA-N.
