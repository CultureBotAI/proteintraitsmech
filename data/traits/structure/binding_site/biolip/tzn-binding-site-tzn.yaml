identifier: proteintraitsmech:BIOLIP_TZN
label: "TZN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [4-(4-amino-6,7-dimethoxyquinazolin-2-yl)piperazin-1-yl][(2R)-tetrahydrofuran-2-yl]methanone (TZN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VCKUSRYTPJJLNI-CQSZACIVSA-N.
