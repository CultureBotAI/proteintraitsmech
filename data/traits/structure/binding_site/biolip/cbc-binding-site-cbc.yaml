identifier: proteintraitsmech:BIOLIP_CBC
label: "CBC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N'-(5-CHLOROBENZOFURAN-2-CARBONYL)-2-(TRIFLUOROMETHYL)BENZENESULFONOHYDRAZIDE (CBC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZLQBZYKAQQWOTK-UHFFFAOYSA-N.
