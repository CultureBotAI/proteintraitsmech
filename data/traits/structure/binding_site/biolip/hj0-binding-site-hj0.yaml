identifier: proteintraitsmech:BIOLIP_HJ0
label: "HJ0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-azanyl-7-(1-methylcyclopropyl)-~{N}-(5-methyl-1~{H}-pyrazol-3-yl)pyrrolo[2,3-d]pyrimidine-5-carboxamide (HJ0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VKNSWNWSJODLGL-UHFFFAOYSA-N.
