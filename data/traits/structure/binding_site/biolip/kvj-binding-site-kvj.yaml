identifier: proteintraitsmech:BIOLIP_KVJ
label: "KVJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4S,5R)-3-[2'-amino-2-(morpholin-4-yl)-4'-(trifluoromethyl)[4,5'-bipyrimidin]-6-yl]-4-(hydroxymethyl)-5-methyl-1,3-oxazolidin-2-one (KVJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IEYOHYVYEJVEJJ-SKDRFNHKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
