label: "GAB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-AMINOBENZOIC ACID (GAB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XFDUHJPVQKIXHO-UHFFFAOYSA-N.
