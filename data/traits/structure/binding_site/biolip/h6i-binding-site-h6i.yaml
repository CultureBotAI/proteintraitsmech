identifier: proteintraitsmech:BIOLIP_H6I
label: "H6I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(cyclopenten-1-yl)-2-[(3-sulfophenyl)sulfonylamino]benzoic acid (H6I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RWEPOFSCKPELAA-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
