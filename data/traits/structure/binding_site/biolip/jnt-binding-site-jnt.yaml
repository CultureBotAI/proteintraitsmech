    protein_label: "6R0R chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6r0r chain A (resolution 1.45 Å); binding residues: D10 I11 A22 N24 S30 G32 V33 C34 S110 T111 G112 T113 F114 W148"
    source: CURATOR
