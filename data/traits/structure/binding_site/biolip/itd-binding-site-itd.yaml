identifier: proteintraitsmech:BIOLIP_ITD
label: "ITD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (6,6-dimethyl-5,6-dihydroimidazo[2,1-b][1,3]thiazol-3-yl)methyl N,N'-dicyclohexylimidothiocarbamate (ITD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey OOSUDWRRWZVFEB-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ITD
synonyms:
  - synonym_text: "(6,6-dimethyl-5,6-dihydroimidazo[2,1-b][1,3]thiazol-3-yl)methyl N,N'-dicyclohexylimidothiocarbamate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00720
    protein_label: "3ODU chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3odu chain A (resolution 2.5 Å); binding residues: W94 D97 Y116 I185 C186 D187 E288"
    source: CURATOR
