identifier: proteintraitsmech:BIOLIP_11G
label: "11G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (7R)-8-cyclopentyl-7-ethyl-5-methyl-7,8-dihydropteridin-6(5H)-one (11G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WQXIWGBBMQMEGH-LLVKDONJSA-N.
