identifier: proteintraitsmech:BIOLIP_2P2
label: "2P2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(2R,5S)-2-tert-butyl-5-({(2S)-2-[(1R)-1,2-dihydroxyethyl]pyrrolidin-1-yl}carbonyl)pyrrolidin-1-yl]-4-phenylbutan-1-one (2P2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JCVMLVYNFGCSKG-MYGLTJDJSA-N.
