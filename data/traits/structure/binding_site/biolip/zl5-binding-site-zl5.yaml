identifier: proteintraitsmech:BIOLIP_ZL5
label: "ZL5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[2-fluoro-5-(trifluoromethyl)phenyl]-7-methyl-1-[(2-methyl-2H-tetrazol-5-yl)methyl]-1H-indazole (ZL5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MMEFXWUINPSTPN-UHFFFAOYSA-N.
