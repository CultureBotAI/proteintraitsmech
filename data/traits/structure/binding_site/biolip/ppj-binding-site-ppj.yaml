identifier: proteintraitsmech:BIOLIP_PPJ
label: "PPJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(HYDROXY{3-HYDROXY-2-METHYL-5-[(PHOSPHONOOXY)METHYL]PYRIDIN-4-YL}METHYL)NORVALINE (PPJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey XZPXXYMXESJHME-PMICCBOBSA-N.
