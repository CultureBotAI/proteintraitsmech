identifier: proteintraitsmech:BIOLIP_BIX
label: "BIX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-{[(S)-[(3S)-3-amino-3-carboxypropyl](hydroxy)phosphoryl]methyl}pentanedioic acid (BIX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YLHAQDFYEKJARV-RQJHMYQMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
