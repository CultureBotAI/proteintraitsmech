    protein_label: "3FED chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3fed chain A (resolution 1.29 Å); binding residues: R200 N247 D377 E414 E415 G508 R524 R526 Y542 H543 K689 Y690"
    source: CURATOR
