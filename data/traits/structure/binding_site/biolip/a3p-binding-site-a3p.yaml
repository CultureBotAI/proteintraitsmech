identifier: proteintraitsmech:BIOLIP_A3P
label: "A3P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ADENOSINE-3'-5'-DIPHOSPHATE (A3P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 40 binding-site occurrences across 38 PDB structures; ligand InChIKey WHTCPDAXWFLDIH-KQYNXXCUSA-N.
