identifier: proteintraitsmech:BIOLIP_GBQ
label: "GBQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[[(2~{R},3~{S})-2-[(1~{R})-1-[3,5-bis(trifluoromethyl)phenyl]ethoxy]-3-(4-fluorophenyl)morpholin-4-yl]methyl]-1,2-dihydro-1,2,4-triazol-3-one (GBQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ATALOFNDEOCMKK-OITMNORJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:GBQ
synonyms:
  - synonym_text: "5-[[(2~{R},3~{S})-2-[(1~{R})-1-[3,5-bis(trifluoromethyl)phenyl]ethoxy]-3-(4-fluorophenyl)morpholin-4-yl]methyl]-1,2-dihydro-1,2,4-triazol-3-one-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00720
    protein_label: "6J20 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6j20 chain A (resolution 2.7 Å); binding residues: N109 P112 I113 Q165 I182 W184 E193 H197 I204 W261 F264 F268"
    source: CURATOR
