identifier: proteintraitsmech:BIOLIP_JTO
label: "JTO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [2-[(4-oxidanylidene-3,5-dihydropyrrolo[3,2-d]pyrimidin-7-yl)sulfanyl]phenoxy]methylphosphonic acid (JTO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VOAJLIGXNWIOPN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:JTO
synonyms:
