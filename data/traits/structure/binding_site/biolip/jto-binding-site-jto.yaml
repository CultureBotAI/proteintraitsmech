    protein_label: "7ZSQ chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7zsq chain C (resolution 1.77 Å); binding residues: G35 S36 R88 H90 Y92 N119 A120 A121 G122 Y188 E189 V205 M207 S208 N231"
    source: CURATOR
