identifier: proteintraitsmech:BIOLIP_G1T
label: "G1T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-(oxidanylamino)-2-piperidin-1-yl-6-(trifluoromethyl)-1,3-benzothiazin-4-one (G1T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NFTFZGDVDRYPDT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
