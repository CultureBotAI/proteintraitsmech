    protein_label: "1CBK chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1cbk chain A (resolution 2.02 Å); binding residues: K44 L46 Y54 N56 W89 R92 F123"
    source: CURATOR
