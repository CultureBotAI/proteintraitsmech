identifier: proteintraitsmech:BIOLIP_G4T
label: "G4T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[2-chloranyl-5-[[1-[[4-(5-oxidanylidene-3-phenyl-6~{H}-1,6-naphthyridin-2-yl)phenyl]methyl]piperidin-4-yl]carbamoylamino]phenyl]propanamide (G4T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JIITZXKZXZZBIZ-UHFFFAOYSA-N.
