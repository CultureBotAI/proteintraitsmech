identifier: proteintraitsmech:BIOLIP_VI4
label: "VI4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 13-(3-Amino-2,3,6-trideoxy-alpha-L-ribo-hexopyranosyl)-6,7,12,13-tetrahydro-5H-indolo[2,3-a]pyrrolo[3,4-c]carbazol-5-one (VI4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey QNQXRLNOOGRQEB-FUJFFIKUSA-N.
