identifier: proteintraitsmech:BIOLIP_PXP
label: "PXP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand PYRIDOXINE-5'-PHOSPHATE (PXP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey WHOMFKWHIQZTHY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
