identifier: proteintraitsmech:BIOLIP_SJ5
label: "SJ5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,4R,5R)-4,5-dihydroxypiperidine-3-carboxylic acid (SJ5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey SSMLJUWXZFXWSF-VPENINKCSA-N.
