identifier: proteintraitsmech:BIOLIP_2NG
label: "2NG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-({4-methyl-3-[(3-nitrobenzoyl)amino]benzoyl}amino)naphthalene-1,5-disulfonic acid (2NG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 8 binding-site occurrences across 2 PDB structures; ligand InChIKey HRJXRQKWGJTVEE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
