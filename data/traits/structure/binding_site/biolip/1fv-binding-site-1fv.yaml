identifier: proteintraitsmech:BIOLIP_1FV
label: "1FV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{3-[(5-cyclopropyl-2-{[3-(morpholin-4-ylmethyl)phenyl]amino}pyrimidin-4-yl)amino]propyl}cyclobutanecarboxamide (1FV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey UKBGBACORPRCGG-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
