identifier: proteintraitsmech:BIOLIP_BQX
label: "BQX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[4-(6-aminopurin-9-yl)butylsulfamoyl]-3-[4-[(4~{S})-2-oxidanylidene-1,3,3~{a},4,6,6~{a}-hexahydrothieno[3,4-d]imidazol-4-yl]butyl]urea (BQX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NMZPYNDZFONMFP-IHRRRGAJSA-N.
