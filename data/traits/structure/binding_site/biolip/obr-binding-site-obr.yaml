identifier: proteintraitsmech:BIOLIP_OBR
label: "OBR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4R)-7-methyl-N-[4-(pentafluoro-lambda~6~-sulfanyl)phenyl]imidazo[1,2-a]pyrimidin-5-amine (OBR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WQQKDMYAYLYJLV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
