identifier: proteintraitsmech:BIOLIP_QLI
label: "QLI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S,6S)-6-amino-5-[(1-carboxyethenyl)oxy]cyclohexa-1,3-diene-1-carboxylic acid (QLI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OKLGKGPAZUNROU-YUMQZZPRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:QLI
synonyms:
  - synonym_text: "(5S,6S)-6-amino-5-[(1-carboxyethenyl)oxy]cyclohexa-1,3-diene-1-carboxylic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q51790
    protein_label: "3R77 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3r77 chain B (resolution 1.9 Å); binding residues: H37 F43 Q78 R87 W94 K122 V150 Y151 V154 G155"
    source: CURATOR
