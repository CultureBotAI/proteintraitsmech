identifier: proteintraitsmech:BIOLIP_P4Z
label: "P4Z-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{R})-2-[[2-[4-(3-chloranyl-2-fluoranyl-phenyl)phenyl]-3-cyano-1,7-naphthyridin-4-yl]amino]butanamide (P4Z) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LACMSNCHWBQXEK-HXUWFJFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
