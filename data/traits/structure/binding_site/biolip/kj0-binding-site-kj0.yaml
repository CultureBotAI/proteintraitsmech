definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2S)-3-cyclohexyl-1-[[(2S,3S)-4-(cyclopropylamino)-3-oxidanyl-4-oxidanylidene-1-[(3S)-2-oxidanylidenepiperidin-3-yl]butan-2-yl]amino]-1-oxidanylidene-propan-2-yl]-1-benzofuran-2-carboxamide (KJ0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FLHCDUBGBDAQOK-SZBRSHHCSA-N.
