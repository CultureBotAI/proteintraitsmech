identifier: proteintraitsmech:BIOLIP_ZNC
label: "ZNC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[1-(3-phenylpropyl)-1,2,3,6-tetrahydropyridin-4-yl]-1H-pyrrolo[2,3-b]pyridine (ZNC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IWLWNPOFKPUZCM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
