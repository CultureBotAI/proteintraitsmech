identifier: proteintraitsmech:BIOLIP_VPI
label: "VPI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3~{R})-4-[[3-(6-acetamidohexylamino)-3-oxidanylidene-propyl]amino]-2,2-dimethyl-3-oxidanyl-4-oxidanylidene-butyl] dihydrogen phosphate (VPI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KSMJRHVJQGTOAX-HNNXBMFYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
