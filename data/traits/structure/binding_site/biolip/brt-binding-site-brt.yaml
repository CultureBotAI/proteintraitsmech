    protein_label: "1GXZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1gxz chain A (resolution 2.1 Å); binding residues: R126 G127 S147 S148 F160 Q187 E189"
    source: CURATOR
