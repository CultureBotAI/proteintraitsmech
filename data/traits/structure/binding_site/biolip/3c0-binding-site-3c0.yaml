    protein_label: "5YC8 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5yc8 chain A (resolution 2.5 Å); binding residues: D103 Y104 S107 N108 W155 A191 A194 W400 Y403 N404 Y426 C429"
    source: CURATOR
