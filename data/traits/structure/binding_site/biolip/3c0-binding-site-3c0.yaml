      snippet: D103 Y104 S107 N108 W155 A191 A194 W400 Y403 N404 Y426 C429
      notes: 'BioLiP2 record line for PDB 5yc8 chain A, ligand 3C0: binding-site residues in PDB author
        numbering (column 8 of BioLiP_nr.txt), cross-checked against BioLiP''s own receptor sequence via
