identifier: proteintraitsmech:BIOLIP_PSJ
label: "PSJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-psicose (PSJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey BJHIKXHVCXFQLS-PUFIMZNGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PSJ
synonyms:
  - synonym_text: "D-psicose-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:O50580
    protein_label: "4PFH chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4pfh chain A (resolution 1.9 Å); binding residues: F7 N37 C66 W113 E152 E158 H188 H211 R217 E246"
    source: CURATOR
  - protein_id: UniProtKB:A0A171J5T1
    protein_label: "8JQ5 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8jq5 chain B (resolution 1.73 Å); binding residues: I61 H97 W187 E228 K230 H264 D328 F330"
    source: CURATOR
