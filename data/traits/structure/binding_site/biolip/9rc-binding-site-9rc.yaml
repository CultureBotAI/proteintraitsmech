identifier: proteintraitsmech:BIOLIP_9RC
label: "9RC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(S)-hydroxy(4-nitrophenoxy)phosphoryl]thymidine (9RC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 1 PDB structure; ligand InChIKey RWOAVOYBVRQNIZ-BFHYXJOUSA-N.
