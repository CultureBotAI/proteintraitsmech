identifier: proteintraitsmech:BIOLIP_PIR
label: "PIR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(4-AMINO-PHENYL)-5-HYDROXYMETHYL-PYRROLIDINE-3,4-DIOL (PIR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SQENVZNKXLCDLF-YTWAJWBKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PIR
synonyms:
  - synonym_text: "2-(4-AMINO-PHENYL)-5-HYDROXYMETHYL-PYRROLIDINE-3,4-DIOL-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
