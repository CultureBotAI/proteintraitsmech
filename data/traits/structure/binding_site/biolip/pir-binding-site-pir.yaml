    protein_label: "2MAS chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2mas chain A (resolution 2.3 Å); binding residues: D14 N39 I81 M152 E166 F167 N168 D242"
    source: CURATOR
