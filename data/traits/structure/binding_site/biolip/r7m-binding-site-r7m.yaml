identifier: proteintraitsmech:BIOLIP_R7M
label: "R7M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-2-hydroxy-7-methoxy-2-(pentafluoroethyl)-2,3-dihydro-4H-1-benzopyran-4-one (R7M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NQJASZMLBMBHRG-SNVBAGLBSA-N.
