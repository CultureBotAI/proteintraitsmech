identifier: proteintraitsmech:BIOLIP_GJY
label: "GJY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl-9Z,12Z,15Z-octadecatrienylphosphonofluoridate (GJY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MEHJVKGETWKOKY-SINQZMEQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
