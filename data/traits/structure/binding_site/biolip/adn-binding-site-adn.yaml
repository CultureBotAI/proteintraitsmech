identifier: proteintraitsmech:BIOLIP_ADN
label: "ADN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ADENOSINE (ADN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 55 binding-site occurrences across 51 PDB structures; ligand InChIKey OIRDTQYFTABQOQ-KQYNXXCUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
