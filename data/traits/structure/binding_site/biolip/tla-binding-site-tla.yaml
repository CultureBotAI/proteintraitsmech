    protein_label: "3A3U chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3a3u chain A (resolution 1.65 Å); binding residues: V39 K55 S57 T106 T107 A108 H145"
    source: CURATOR
  - protein_id: UniProtKB:Q1KLR5
    protein_label: "8WBQ chain B (BioLiP receptor)"
