identifier: proteintraitsmech:BIOLIP_F0G
label: "F0G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E)-N-({3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}methylidene)-L-alanine (F0G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey UPOKXKNJCNHZTH-ASMSWWRESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
