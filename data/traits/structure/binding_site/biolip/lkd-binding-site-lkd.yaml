identifier: proteintraitsmech:BIOLIP_LKD
label: "LKD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-chloro-4,7-difluoro-N-{[2-methoxy-5-(pyridin-4-yl)phenyl]methyl}-N-[trans-4-(methylamino)cyclohexyl]-1-benzothiophene-2-carboxamide (LKD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YVIFQUJDZSAFKG-MEMLXQNLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
