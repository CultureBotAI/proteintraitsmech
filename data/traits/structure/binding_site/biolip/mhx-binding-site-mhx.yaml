identifier: proteintraitsmech:BIOLIP_MHX
label: "MHX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Binuclear [FeFe], di(thiomethyl)amine, carbon monoxide, cyanide cluster (-CO form) (MHX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HQBPXMLEPWPPEN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:MHX
synonyms:
  - synonym_text: "Binuclear [FeFe], di(thiomethyl)amine, carbon monoxide, cyanide cluster (-CO form)-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P07598
    protein_label: "8RU6 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8ru6 chain B (resolution 1.15 Å); binding residues: A107 P108 A109 C178 P203 I204 M232 P233 K237 F296 M376 C382"
    source: CURATOR
