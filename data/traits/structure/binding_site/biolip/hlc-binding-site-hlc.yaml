    protein_label: "3QP5 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3qp5 chain A (resolution 3.249 Å); binding residues: L57 W84 Y88 W111 M135 S155"
    source: CURATOR
