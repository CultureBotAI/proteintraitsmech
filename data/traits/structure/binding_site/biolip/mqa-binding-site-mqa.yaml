identifier: proteintraitsmech:BIOLIP_MQA
label: "MQA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(1aS,8S,8aR,8bS)-6,8a-dimethoxy-5-methyl-4,7-dioxo-1,1a,2,4,7,8,8a,8b-octahydroazireno[2',3':3,4]pyrrolo[1,2-a]indol-8-yl]methyl carbamate (MQA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HYFMSAFINFJTFH-NGSRAFSJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
