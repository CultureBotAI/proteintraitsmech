    protein_label: "4CYG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4cyg chain A (resolution 2.3 Å); binding residues: E79 F182 E185 C211 F212 A237 W238 M239 F338"
    source: CURATOR
