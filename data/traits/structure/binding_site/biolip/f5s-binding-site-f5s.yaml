identifier: proteintraitsmech:BIOLIP_F5S
label: "F5S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1aR,2Z,4E,6E,14R,15aR)-9,11-dihydroxy-6-{[(4-methoxyphenyl)methoxy]imino}-14-methyl-1a,6,7,14,15,15a-hexahydro-12H-oxireno[e][2]benzoxacyclotetradecin-12-one (F5S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PACPIEIVCXUTPG-XVFAOPLPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
