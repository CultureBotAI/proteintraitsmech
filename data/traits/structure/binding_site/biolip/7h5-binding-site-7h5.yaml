definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-8-(2-amino-6-{(1R)-1-[5-chloro-3'-(methylsulfonyl)[1,1'-biphenyl]-2-yl]-2,2,2-trifluoroethoxy}pyrimidin-4-yl)-2,8-diazaspiro[4.5]decane-3-carboxylic acid (7H5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VILFJXJLOMHHDU-XUZZJYLKSA-N.
