definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,4R)-4-hydroxy-1-((S)-2-(2-(4-(3-methoxy-4-((4-((2-(methylcarbamoyl)phenyl)amino)-5-(trifluoromethyl)pyridin-2-yl)amino)phenyl)piperazin-1-yl)acetamido)-3,3-dimethylbutanoyl)-N-((S)-1-(4-(4-methylthiazol-5-yl)phenyl)ethyl)pyrrolidine-2-carboxamide (7QB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZGSWGXNEXAXEGV-XFCHVEHOSA-N.
