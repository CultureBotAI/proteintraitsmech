definition: >-
  A structure-derived ligand-binding site at which the ligand rhenium (IV) hexachloride (RHE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 15 binding-site occurrences across 1 PDB structure; ligand InChIKey GSGIQJBJGSKCDZ-UHFFFAOYSA-H.
definition_source: "BioLiP2 (Yang/Zhang group)"
