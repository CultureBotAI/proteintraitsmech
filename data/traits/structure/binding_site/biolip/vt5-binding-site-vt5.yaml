identifier: proteintraitsmech:BIOLIP_VT5
label: "VT5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{R})-1-(4-chloranyl-2-fluoranyl-phenyl)-2-cyclohexyl-3-ethanoyl-4-oxidanyl-2~{H}-pyrrol-5-one (VT5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VQNLJXWZGVRLBA-MRXNPFEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
