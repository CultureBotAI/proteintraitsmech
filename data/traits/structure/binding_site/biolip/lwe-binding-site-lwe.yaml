    protein_label: "8AEJ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8aej chain A (resolution 1.84 Å); binding residues: F57 M59 F93 F106 E121 Y123"
    source: CURATOR
