    protein_label: "9G9G chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 9g9g chain A (resolution 3.38 Å); binding residues: D529 I530 N532 L533 S555 G582 D583 K643"
    source: CURATOR
