identifier: proteintraitsmech:BIOLIP_KDM
label: "KDM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand deamino-alpha-neuraminic acid (KDM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CLRLHXKNIYJWAW-LSRLBZCKSA-N.
