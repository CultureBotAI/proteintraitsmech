    protein_label: "7YX0 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7yx0 chain A (resolution 1.6 Å); binding residues: V19 D52 C53 R54 Q57 R61 R70 L73 L83 N85 L97 L99 Q116"
    source: CURATOR
