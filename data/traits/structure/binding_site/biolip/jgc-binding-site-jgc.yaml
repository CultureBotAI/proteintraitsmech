identifier: proteintraitsmech:BIOLIP_JGC
label: "JGC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Flavin mononucleotide (semi-quinone intermediate) (JGC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JNFNEOXSUODPSY-DGAVXFQQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:JGC
synonyms:
  - synonym_text: "Flavin mononucleotide (semi-quinone intermediate)-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
