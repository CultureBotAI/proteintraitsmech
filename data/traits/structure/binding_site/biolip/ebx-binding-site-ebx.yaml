identifier: proteintraitsmech:BIOLIP_EBX
label: "EBX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[3,4-bis(oxidanylidene)-2-[[(1~{R})-1-(4-propan-2-ylfuran-2-yl)propyl]amino]cyclobuten-1-yl]amino]-~{N},~{N}-dimethyl-3-oxidanyl-pyridine-2-carboxamide (EBX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey JSZQMZJVSCVDMA-CYBMUJFWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EBX
synonyms:
  - synonym_text: "4-[[3,4-bis(oxidanylidene)-2-[[(1~{R})-1-(4-propan-2-ylfuran-2-yl)propyl]amino]cyclobuten-1-yl]amino]-~{N},~{N}-dimethyl-3-oxidanyl-pyridine-2-carboxamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P25025
    protein_label: "6LFL chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6lfl chain A (resolution 3.2 Å); binding residues: V72 I73 G79 R80 S81 T83 D84 R144 E249 I253 Y314 G318 K320 F321"
    source: CURATOR
