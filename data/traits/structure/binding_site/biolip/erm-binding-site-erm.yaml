  title: Binding of Ergotamine at the Ergotamine-binding site
  description: Residue-level ligand contact transcribed from BioLiP2 for PDB 6bqg chain A. Residue numbering
    is the PDB author frame BioLiP reports; each residue's identity was checked against BioLiP's own receptor
    sequence. 12 binding residues.
