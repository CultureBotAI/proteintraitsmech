      snippet: D134 V135 S138 T139 V208 L209 G218 F327 S334 V335 E347 L350
      notes: 'BioLiP2 record line for PDB 6bqg chain A, ligand ERM: binding-site residues in PDB author
        numbering (column 8 of BioLiP_nr.txt), cross-checked against BioLiP''s own receptor sequence via
        its renumbered column 9. BioLiP cites PMID:29398112 for this structure. BioLiP maps this chain
        to several accessions (P0ABE7,P28335), a chimeric or fusion construct, so no single protein is
