identifier: proteintraitsmech:BIOLIP_ERM
label: "ERM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Ergotamine (ERM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XCGSFFUVFURLIX-VFGNJEKYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ERM
synonyms:
  - synonym_text: "Ergotamine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "6BQG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6bqg chain A (resolution 3.0 Å); binding residues: D134 V135 S138 T139 V208 L209 G218 F327 S334 V335 E347 L350"
    source: CURATOR
