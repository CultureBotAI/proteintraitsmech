identifier: proteintraitsmech:BIOLIP_FZA
label: "FZA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (13bS)-4,9-dimethoxy-14-methyl-8,13,13b,14-tetrahydroindolo[2',3':3,4]pyrido[2,1-b]quinazolin-5(7H)-one (FZA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FFAIVCGLKMKWII-FQEVSTJZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
