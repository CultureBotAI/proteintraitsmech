    protein_label: "3QCU chain H (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3qcu chain H (resolution 1.979 Å); binding residues: L33 Y56 F96 G97 Y98 Y99 G100 S100A G100B N100C Y100D"
    source: CURATOR
