label: "4YH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-(3,4-dimethoxyphenyl)-5-{[2-(3,4-dimethoxyphenyl)ethyl](methyl)amino}-2-(propan-2-yl)pentanenitrile (4YH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey SGTNSNPWRIOYBX-MHZLTWQESA-N.
