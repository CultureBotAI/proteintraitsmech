identifier: proteintraitsmech:BIOLIP_IEP
label: "IEP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S})-1-octadecanoyloxy-3-[oxidanyl-[(1~{R},2~{R},3~{S},4~{S},5~{S},6~{S})-2,3,6-tris(oxidanyl)-4,5-diphosphonooxy-cyclohexyl]oxy-phosphoryl]oxy-propan-2-yl] icosa-5,8,11,14-tetraenoate (IEP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey CNWINRVXAYPOMW-UWUKCHIJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
