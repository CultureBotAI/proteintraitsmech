identifier: proteintraitsmech:BIOLIP_VSE
label: "VSE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-[trans-4-(4-methylpiperazin-1-yl)cyclohexyl]-5-(4-phenoxyphenyl)-7H-pyrrolo[2,3-d]pyrimidin-4-amine (VSE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FDVSOQRNTAPCHB-YHBQERECSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
