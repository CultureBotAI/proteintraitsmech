identifier: proteintraitsmech:BIOLIP_BJX
label: "BJX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Repaglinide (BJX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey FAEKWTJYAYMJKF-QHCPKHFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
