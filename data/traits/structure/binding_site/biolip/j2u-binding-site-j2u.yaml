identifier: proteintraitsmech:BIOLIP_J2U
label: "J2U-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-6-(4-hydroxyphenyl)-2-[(4-hydroxyphenyl)methyl]-4-(phenylmethyl)-2,3-dihydroinden-1-one (J2U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BBBVODRPSLPZKR-DEOSSOPVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
