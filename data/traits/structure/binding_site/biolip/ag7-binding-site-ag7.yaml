identifier: proteintraitsmech:BIOLIP_AG7
label: "AG7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{2-(4-FLUORO-BENZYL)-6-METHYL-5-[(5-METHYL-ISOXAZOLE-3-CARBONYL)-AMINO]-4-OXO-HEPTANOYLAMINO}-5-(2-OXO-PYRROLIDIN-3-YL)-PENTANOIC ACID ETHYL ESTER (AG7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey LMIUALQNZXJHOG-IFILWLFVSA-N.
