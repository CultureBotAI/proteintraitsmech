identifier: proteintraitsmech:BIOLIP_TSA
label: "TSA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 8-HYDROXY-2-OXA-BICYCLO[3.3.1]NON-6-ENE-3,5-DICARBOXYLIC ACID (TSA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 7 PDB structures; ligand InChIKey KRZHNRULRHECRF-JQCUSGDOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
