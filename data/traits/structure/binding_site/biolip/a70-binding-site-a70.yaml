definition: >-
  A structure-derived ligand-binding site at which the ligand N-ethyl-N-[(4-methylpiperazin-1-yl)carbonyl]-D-phenylalanyl-N-[(1S,2S,4R)-4-(butylcarbamoyl)-1-(cyclohexylmethyl)-2-hyd roxy-5-methylhexyl]-L-norleucinamide (A70) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NGCGSAFHWCZMPV-AKHKZFQHSA-N.
