    protein_label: "3H77 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3h77 chain B (resolution 1.8 Å); binding residues: T28 F32 X112 R153 M220 G222 R223 M225 F226 H257 P259 N260 R262 I263"
    source: CURATOR
