identifier: proteintraitsmech:BIOLIP_4PS
label: "4PS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4'-diphospho pantetheine (4PS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UQURMDBHCKDEJS-VIFPVBQESA-N.
