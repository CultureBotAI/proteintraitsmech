identifier: proteintraitsmech:BIOLIP_MK6
label: "MK6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5aR,6S,6aS)-3-({2',6'-dimethyl-4'-[3-(methylsulfonyl)propoxy][1,1'-biphenyl]-3-yl}methoxy)-5,5a,6,6a-tetrahydrocyclopropa[4,5]cyclopenta[1,2-c]pyridine-6-carboxylic acid (MK6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CODQKEMYZZKQAE-QPVYNBJUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
