identifier: proteintraitsmech:BIOLIP_YPG
label: "YPG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [3-[(3~{R},4~{R})-3-(2-azanyl-6-oxidanylidene-1~{H}-purin-9-yl)-4-[(2~{S})-2-oxidanyl-2-phosphono-ethoxy]pyrrolidin-1-y l]-3-oxidanylidene-propyl]phosphonic acid (YPG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey RBYFDIJTTUISNF-MRTMQBJTSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
