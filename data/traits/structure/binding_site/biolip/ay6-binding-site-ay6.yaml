identifier: proteintraitsmech:BIOLIP_AY6
label: "AY6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(4-chlorophenyl)-1-(2,4-dichlorophenyl)-4-methyl-N-(piperidin-1-yl)-1H-pyrazole-3-carboxamide (AY6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JZCPYUJPEARBJL-UHFFFAOYSA-N.
