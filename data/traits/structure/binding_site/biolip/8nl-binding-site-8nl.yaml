label: "8NL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2-methyl-3-phenyl-phenyl)methyl (1~{S})-3-[(~{E})-2-chloranyl-3,3,3-tris(fluoranyl)prop-1-enyl]-2,2-dimethyl-cyclopropane-1-carboxylate (8NL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OMFRMAHOUUJSGP-AZUAARDMSA-N.
