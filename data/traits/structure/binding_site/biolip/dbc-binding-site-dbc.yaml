    protein_label: "3I2G chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3i2g chain A (resolution 2.5 Å); binding residues: Y44 S117 Y118 W151 W166 F261 H287"
    source: CURATOR
