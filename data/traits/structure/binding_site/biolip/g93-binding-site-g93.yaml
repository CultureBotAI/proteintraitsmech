identifier: proteintraitsmech:BIOLIP_G93
label: "G93-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{2-(4-amino-1,2,5-oxadiazol-3-yl)-1-ethyl-7-[(3S)-piperidin-3-ylmethoxy]-1H-imidazo[4,5-c]pyridin-4-yl}-2-methylbut-3 -yn-2-ol (G93) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KGPGFQWBCSZGEL-ZDUSSCGKSA-N.
