definition: >-
  A structure-derived ligand-binding site at which the ligand (4R)-3-{(2S,3S)-2-hydroxy-3-[(3-hydroxy-2-methylbenzoyl)amino]-4-phenylbutanoyl}-5,5-dimethyl-N-(2-methylbenzyl)-1,3-thiazolidine-4-carboxamide (JE2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CUFQBQOBLVLKRF-RZDMPUFOSA-N.
