    protein_label: "6SQ0 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6sq0 chain A (resolution 1.77 Å); binding residues: L346 L384 F404 G521 H524 L525"
    source: CURATOR
