identifier: proteintraitsmech:BIOLIP_NT6
label: "NT6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3s,5s,7s)-N-(4,5-dichloropyridin-2-yl)adamantane-1-carboxamide (NT6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RBBBMHRIAFVEFR-XMEMTASGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
