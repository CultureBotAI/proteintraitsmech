identifier: proteintraitsmech:BIOLIP_U8Z
label: "U8Z-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(~{E})-2,3-bis(oxidanyl)prop-1-enyl] dihydrogen phosphate (U8Z) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MCQBMKDEIFHCJL-NSCUHMNNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
