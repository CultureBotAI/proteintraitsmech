label: "9VG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl (2E)-3-[(1aS,11S,11aS,14Z,18R)-3,18-dihydroxy-4,9-dioxo-4,9,10,11-tetrahydro-11aH-11,1a-hept[3]ene[1,5]diynonaphtho[2,3-h]oxireno[c]quinolin-11a-yl]but-2-enoate (9VG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VNWTWPJYWHYMNF-PUHZCEAISA-N.
