identifier: proteintraitsmech:BIOLIP_LXY
label: "LXY-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4R,5S)-4-fluoro-1-[(4-fluorophenyl)sulfonyl]-5-methyl-N-({5-(trifluoromethyl)-2-[2-(trifluoromethyl)pyrimidin-5-yl]pyridin-4-yl}methyl)-L-prolinamide (LXY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RGXNECXVRZKGGH-UOXRKKOCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
