identifier: proteintraitsmech:BIOLIP_UB7
label: "UB7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand terephthalic acid (UB7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey KKEYFWRCBNTPAC-UHFFFAOYSA-N.
