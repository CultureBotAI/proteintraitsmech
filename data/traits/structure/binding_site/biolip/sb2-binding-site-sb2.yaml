identifier: proteintraitsmech:BIOLIP_SB2
label: "SB2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[5-(4-FLUORO-PHENYL)-2-(4-METHANESULFINYL-PHENYL)-3H-IMIDAZOL-4-YL]-PYRIDINE (SB2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CDMGBJANTYXAIV-MHZLTWQESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
