identifier: proteintraitsmech:BIOLIP_LFL
label: "LFL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3R,4R,5S,6R)-2-[4-chloranyl-3-[(4-ethoxyphenyl)methyl]phenyl]-6-methylsulfanyl-oxane-3,4,5-triol (LFL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QKDRXGFQVGOQKS-CRSSMBPESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
