    note: "BioLiP2 binding-site occurrence in PDB 8c0z chain A (resolution 3.22 Å); binding residues: R75 N92 G94 R181 A183 G184 R185 E329 E331 N356 P362 L465 D504 V510 F511"
    source: CURATOR
