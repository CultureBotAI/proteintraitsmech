identifier: proteintraitsmech:BIOLIP_PBU
label: "PBU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(R)-HYDROXY{[(1R,2R,3S,4R,5R,6S)-2,3,6-TRIHYDROXY-4,5-BIS(PHOSPHONOOXY)CYCLOHEXYL]OXY}PHOSPHORYL]OXY}PROPANE-1 ,2-DIYL DIBUTANOATE (PBU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey DHAFWWKSHUBGAH-BXJBXBQISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
