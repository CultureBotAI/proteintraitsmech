identifier: proteintraitsmech:BIOLIP_HYV
label: "HYV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [4-(phenylmethyl)piperidin-1-yl]-[1-(5-pyrrol-1-yl-1,3,4-thiadiazol-2-yl)piperidin-4-yl]methanone (HYV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QREVWNVSFCZWGU-UHFFFAOYSA-N.
