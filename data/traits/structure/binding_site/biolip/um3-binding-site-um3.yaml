identifier: proteintraitsmech:BIOLIP_UM3
label: "UM3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2'-DEOXYURIDINE 3'-MONOPHOSPHATE (UM3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey LXKGKXYIAAKOCT-SHYZEUOFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
