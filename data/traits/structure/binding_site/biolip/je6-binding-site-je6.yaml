identifier: proteintraitsmech:BIOLIP_JE6
label: "JE6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[4-[(3~{S})-3-cyano-3-cyclopropyl-2-oxidanylidene-pyrrolidin-1-yl]-6-methyl-pyridin-2-yl]-2-phenyl-ethanamide (JE6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FLWLQSFDWRRFDA-JOCHJYFZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
