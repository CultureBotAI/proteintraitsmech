identifier: proteintraitsmech:BIOLIP_JLQ
label: "JLQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R})-3-[2-azanylethoxy(oxidanyl)phosphoryl]oxy-2-tetradecanoyloxy-propyl] hexadecanoate (JLQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey MMLCPRRXWWDUCM-MGBGTMOVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
