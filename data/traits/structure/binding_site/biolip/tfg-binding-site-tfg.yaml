identifier: proteintraitsmech:BIOLIP_TFG
label: "TFG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2,2-TRIFLUORO-1-{5-[(3-PHENYL-5,6-DIHYDROIMIDAZO[1,2-A]PYRAZIN-7(8H)-YL)CARBONYL]THIOPHEN-2-YL}ETHANE-1,1-DIOL (TFG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey OFBFUNBBOQCNFX-UHFFFAOYSA-N.
