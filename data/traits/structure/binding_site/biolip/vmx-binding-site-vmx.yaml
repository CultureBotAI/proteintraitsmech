identifier: proteintraitsmech:BIOLIP_VMX
label: "VMX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-{[(3-aminopropyl)sulfonyl]amino}-5'-deoxyadenosine (VMX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GCNSCCULRVBOML-QYVSTXNMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
