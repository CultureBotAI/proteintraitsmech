    protein_label: "3GQL chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3gql chain A (resolution 2.8 Å); binding residues: L484 V492 A512 I545 E562 Y563 A564 L630 D641"
    source: CURATOR
