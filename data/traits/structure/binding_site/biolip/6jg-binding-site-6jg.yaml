identifier: proteintraitsmech:BIOLIP_6JG
label: "6JG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{4-[2-([1,3]thiazolo[5,4-c]pyridin-2-yl)phenoxy]phenyl}acetamide (6JG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OPOGWEXFOKBMCJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
