    protein_label: "7YNI chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7yni chain A (resolution 3.26 Å); binding residues: H83 E102 L286 Y290 F453 Q457"
    source: CURATOR
