    protein_label: "3GMA chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3gma chain B (resolution 2.6 Å); binding residues: M118 S151 G152 V153 E154 F155 T192 A195 G196"
    source: CURATOR
