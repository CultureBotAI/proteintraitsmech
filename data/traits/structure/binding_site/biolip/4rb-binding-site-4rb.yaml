identifier: proteintraitsmech:BIOLIP_4RB
label: "4RB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(6-{[(1R)-1-(hydroxymethyl)propyl]amino}imidazo[1,2-b]pyridazin-3-yl)benzoic acid (4RB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KKZYGUVAFJCULH-CYBMUJFWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
