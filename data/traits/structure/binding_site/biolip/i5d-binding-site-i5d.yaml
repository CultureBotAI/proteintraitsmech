identifier: proteintraitsmech:BIOLIP_I5D
label: "I5D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[6-azanyl-3,5-dicyano-4-[4-(cyclopropylmethoxy)phenyl]pyridin-2-yl]sulfanylethanamide (I5D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZTYHZMAZUWOXNC-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
