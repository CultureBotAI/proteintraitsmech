identifier: proteintraitsmech:BIOLIP_VAK
label: "VAK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl (1R,2R,4S)-2-ethyl-2,4,5,7-tetrahydroxy-6,11-dioxo-1,2,3,4,6,11-hexahydrotetracene-1-carboxylate (VAK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey RACGRCLGVYXIAO-YOKWENHESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:VAK
synonyms:
  - synonym_text: "methyl (1R,2R,4S)-2-ethyl-2,4,5,7-tetrahydroxy-6,11-dioxo-1,2,3,4,6,11-hexahydrotetracene-1-carboxylate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q54530
    protein_label: "3IHG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3ihg chain A (resolution 2.49 Å); binding residues: A47 F79 M202 W222 Y224 P315 T316 G317 G318"
    source: CURATOR
