identifier: proteintraitsmech:BIOLIP_IRX
label: "IRX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-methyl-N-[2-(2-oxidanylideneazepan-1-yl)ethyl]-2-phenyl-1,3-oxazole-4-carboxamide (IRX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QHOJMCXWPJSDFS-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:IRX
synonyms:
  - synonym_text: "5-methyl-N-[2-(2-oxidanylideneazepan-1-yl)ethyl]-2-phenyl-1,3-oxazole-4-carboxamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P42212
    protein_label: "7YDQ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7ydq chain A (resolution 4.04 Å); binding residues: W53 Q135 F139"
    source: CURATOR
