    predicate: molecularly interacts with
    predicate_id: RO:0002436
    object: ligand
    description: W156 contacts the bound VARENICLINE.
    evidence:
    - reference: PDB:6usf
      snippet: W156 T157 C199 C200 Y204
      notes: 'BioLiP2 record line for PDB 6usf chain A, ligand QMR: binding-site residues in PDB author
        numbering (column 8 of BioLiP_nr.txt), cross-checked against BioLiP''s own receptor sequence via
        its renumbered column 9. BioLiP cites PMID:32221310 for this structure. BioLiP maps this chain
        to several accessions (P0ABE7,P43681), a chimeric or fusion construct, so no single protein is
        asserted for these residues.'
