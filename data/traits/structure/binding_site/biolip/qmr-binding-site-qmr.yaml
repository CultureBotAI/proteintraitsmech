identifier: proteintraitsmech:BIOLIP_QMR
label: "QMR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand VARENICLINE (QMR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey JQSHBVHOMNKWFT-DTORHVGOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:QMR
synonyms:
  - synonym_text: "VARENICLINE-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ABE7
    protein_label: "6USF chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6usf chain A (resolution 3.87 Å); binding residues: W156 T157 C199 C200 Y204"
    source: CURATOR
causal_graphs:
- graph_id: ligand_binding
  title: Binding of VARENICLINE at the VARENICLINE-binding site
  description: Residue-level ligand contact transcribed from BioLiP2 for PDB 6usf chain A. Residue numbering
    is the PDB author frame BioLiP reports; each residue's identity was checked against BioLiP's own receptor
    sequence. 5 binding residues.
  nodes:
  - node_id: ligand
    label: VARENICLINE
    node_type: LIGAND
    grounding: CHEBI:84500
    xrefs:
    - pdb.ligand:QMR
  - node_id: site
    label: VARENICLINE-binding site
    node_type: MOTIF
    grounding: proteintraitsmech:BIOLIP_QMR
    description: KB trait record (STRUCT_BINDING_SITE) — the site this interaction defines.
  - node_id: resW156
    label: binding residue W156 (PDB 6usf chain A author numbering; no UniProt position asserted)
    node_type: RESIDUE
