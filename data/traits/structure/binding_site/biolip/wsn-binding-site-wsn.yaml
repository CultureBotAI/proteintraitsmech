identifier: proteintraitsmech:BIOLIP_WSN
label: "WSN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2R)-4-amino-1-imino-4-oxobutan-2-yl]-1-(1-{4-[(2,4-difluorophenyl)methoxy]phenyl}cyclopropane-1-carbonyl)-L-prolinamide (WSN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UTRUAJSKSGNHPD-DIJIZMSBSA-N.
