    protein_label: "3WQ5 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3wq5 chain A (resolution 1.8 Å); binding residues: Q53 H157 N202 E203 S206 Y345 F389 E416 W463 E470 W471 S473 Q477 F479"
    source: CURATOR
