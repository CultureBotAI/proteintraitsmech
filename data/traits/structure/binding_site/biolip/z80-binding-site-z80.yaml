identifier: proteintraitsmech:BIOLIP_Z80
label: "Z80-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(2-chloro-10H-phenothiazin-10-yl)-N,N-dimethylpropan-1-amine (Z80) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey ZPEIMTDSQAKGNT-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:Z80
synonyms:
