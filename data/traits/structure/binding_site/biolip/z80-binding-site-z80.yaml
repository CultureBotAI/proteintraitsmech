    protein_label: "3APX chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3apx chain A (resolution 2.2 Å); binding residues: F49 V88 R90 H97 V98 A99 F112 Y127"
    source: CURATOR
