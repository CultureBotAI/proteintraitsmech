identifier: proteintraitsmech:BIOLIP_A1LWL
label: "A1LWL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand vesamicol (A1LWL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YSSBJODGIYRAMI-IRXDYDNUSA-N.
