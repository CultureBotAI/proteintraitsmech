identifier: proteintraitsmech:BIOLIP_GAW
label: "GAW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[3,5-bis(trifluoromethyl)phenyl]-~{N},2-dimethyl-~{N}-[4-(2-methylphenyl)-6-(4-methylpiperazin-1-yl)pyridin-3-yl]propanamide (GAW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WAXQNWCZJDTGBU-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
