    protein_label: "6HLP chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6hlp chain A (resolution 2.2 Å); binding residues: N89 N109 P112 Q165 H197 I204 W261 F264 H265 F268 Y272 M295"
    source: CURATOR
