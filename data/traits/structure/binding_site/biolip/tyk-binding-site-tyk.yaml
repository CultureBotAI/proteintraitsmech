identifier: proteintraitsmech:BIOLIP_TYK
label: "TYK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand TYLOSIN (TYK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey WBPYTXDJUQJLPQ-VMXQISHHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
