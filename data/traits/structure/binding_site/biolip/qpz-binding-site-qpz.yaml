identifier: proteintraitsmech:BIOLIP_QPZ
label: "QPZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1,4-dimethyl-2-oxidanylidene-~{N}-(phenylmethyl)quinoline-6-sulfonamide (QPZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KBXRBUMRPUNHEH-UHFFFAOYSA-N.
