identifier: proteintraitsmech:BIOLIP_EE5
label: "EE5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(8-methyl-4-oxidanylidene-7-prop-1-ynyl-3~{H}-quinazolin-2-yl)methylsulfanyl]benzoic acid (EE5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RMIJZTKTCJJVSA-UHFFFAOYSA-N.
