identifier: proteintraitsmech:BIOLIP_G52
label: "G52-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R,3aS,3bR,6aS,7aS)-octahydrodifuro[2,3-b:3',2'-d]furan-3-yl [(1S,2R)-1-benzyl-2-hydroxy-3-{[(4-methoxyphenyl)sulfonyl](2-methylpropyl)amino}propyl]carbamate (G52) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey QWMNYFXRFHGYGS-DDGGWZRMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
