definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(4-{[1-(2-AMINO-5-FORMYL-7-METHYL-4-OXO-3,4,5,6,7,8-HEXAHYDROPTERIDIN-6-YL)ETHYL]AMINO}PHENYL)-5-DEOXY-1-O-{5-O-[(1,3-DICARBOXYPROPOXY)(HYDROXY)PHOSPHORYL]PENTOFURANOSYL}PENTITOL (H4Z) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RMPHWTMYCVTPKB-BKULHTCLSA-N.
