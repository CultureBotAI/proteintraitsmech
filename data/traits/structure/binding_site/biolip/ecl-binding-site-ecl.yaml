synonyms:
  - synonym_text: "1-[(2R)-2-[(4-chlorobenzyl)oxy]-2-(2,4-dichlorophenyl)ethyl]-1H-imidazole-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
