identifier: proteintraitsmech:BIOLIP_P6L
label: "P6L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-3-{[{[(2S)-2,3-DIHYDROXYPROPYL]OXY}(HYDROXY)PHOSPHORYL]OXY}-2-[(6E)-HEXADEC-6-ENOYLOXY]PROPYL (8E)-OCTADEC-8-ENOATE (P6L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 4 PDB structures; ligand InChIKey WLVNRDXLPAAELE-GDRYEXQRSA-N.
