identifier: proteintraitsmech:BIOLIP_DYF
label: "DYF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3~{R})-2,2-dimethyl-4-[[3-[2-[[(~{E})-oct-2-enoyl]amino]ethylamino]-3-oxidanylidene-propyl]amino]-3-oxidanyl-4-oxidanylidene-butyl] dihydrogen phosphate (DYF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey KFHBREMVHHVYJE-IJDCCNJMSA-N.
