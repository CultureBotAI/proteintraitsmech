identifier: proteintraitsmech:BIOLIP_DXV
label: "DXV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-cyclopentyl-4-(5-phenyl-1H-pyrrolo[2,3-b]pyridin-3-yl)benzoic acid (DXV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WVSBGSNVCDAMCF-UHFFFAOYSA-N.
