    protein_label: "6MU1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6mu1 chain A (resolution 4.1 Å); binding residues: G268 R269 Q270 A272 T273 S274 A275 R504 Q507 K508 D566 Y567 R568 K569 N570"
    source: CURATOR
