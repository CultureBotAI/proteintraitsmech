identifier: proteintraitsmech:BIOLIP_MU7
label: "MU7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[2-(5,8-dimethoxy-2-oxo-1,2-dihydroquinolin-3-yl)ethyl]-2-iodobenzamide (MU7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RJARQBKOBDUFBP-UHFFFAOYSA-N.
