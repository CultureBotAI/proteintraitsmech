identifier: proteintraitsmech:BIOLIP_IP9
label: "IP9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(R)-{[(1S,2S,3R,4S,5S,6S)-2,6-dihydroxy-3,4,5-tris(phosphonooxy)cyclohexyl]oxy}(hydroxy)phosphoryl]oxy}propane -1,2-diyl dioctanoate (IP9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey ANFYVAHJWGJYAT-QLCNXWICSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
