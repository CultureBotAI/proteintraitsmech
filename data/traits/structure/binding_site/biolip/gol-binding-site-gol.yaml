identifier: proteintraitsmech:BIOLIP_GOL
label: "GOL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GLYCEROL (GOL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 165 binding-site occurrences across 101 PDB structures; ligand InChIKey PEDCQBHIVMGVHV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
