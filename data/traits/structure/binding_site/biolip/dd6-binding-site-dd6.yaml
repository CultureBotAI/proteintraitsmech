identifier: proteintraitsmech:BIOLIP_DD6
label: "DD6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,3'R,5R,6S,7cis)-7',8'-didehydro-5,6-dihydro-5,6-epoxy-beta,beta-carotene-3,3'-diol (DD6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 218 binding-site occurrences across 13 PDB structures; ligand InChIKey OGHZCSINIMWCSB-WMTIXGNLSA-N.
