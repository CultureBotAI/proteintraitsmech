identifier: proteintraitsmech:BIOLIP_J9R
label: "J9R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(1-methylpyrazol-4-yl)-7-[[(2~{S})-2-(trifluoromethyl)morpholin-4-yl]methyl]quinoline-2-carboxamide (J9R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PUIAIYDBFPDZPF-SFHVURJKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
