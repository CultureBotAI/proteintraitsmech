identifier: proteintraitsmech:BIOLIP_ERG
label: "ERG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ERGOSTEROL (ERG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 28 binding-site occurrences across 15 PDB structures; ligand InChIKey DNVPQKQSNYMLRS-APGDWVJJSA-N.
