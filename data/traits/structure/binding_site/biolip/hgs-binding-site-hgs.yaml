identifier: proteintraitsmech:BIOLIP_HGS
label: "HGS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-gamma-glutamyl-L-cysteinyl-beta-alanine (HGS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey HKBNQXMLSMKLJV-RQJHMYQMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
