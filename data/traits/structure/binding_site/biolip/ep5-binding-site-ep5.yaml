identifier: proteintraitsmech:BIOLIP_EP5
label: "EP5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[5-[2-[4-(4-cyanophenyl)piperazin-1-yl]-2-oxidanylidene-ethoxy]-1~{H}-indol-3-yl]ethylazanium (EP5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SOHCKWZVTCTQBG-UHFFFAOYSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
