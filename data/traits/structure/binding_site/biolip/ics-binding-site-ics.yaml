identifier: proteintraitsmech:BIOLIP_ICS
label: "ICS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand iron-sulfur-molybdenum cluster with interstitial carbon (ICS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey DDQFAOMIVKLFON-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ICS
synonyms:
  - synonym_text: "iron-sulfur-molybdenum cluster with interstitial carbon-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A9H5W5
    protein_label: "5KOH chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5koh chain A (resolution 1.83 Å); binding residues: V86 R112 H211 Y245 C291 S294 G372 G373 L374 R375 F397 H458"
    source: CURATOR
  - protein_id: UniProtKB:P00467
    protein_label: "5VPW chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5vpw chain C (resolution 1.85 Å); binding residues: V61 R87 H186 Y216 C262 S265 G344 G345 S346 R347 F369 H482"
    source: CURATOR
  - protein_id: UniProtKB:P07328
    protein_label: "8ENO chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8eno chain C (resolution 2.71 Å); binding residues: V70 R96 Q191 H195 Y229 C275 R277 S278 I355 G356 G357 L358 R359 H442"
    source: CURATOR
