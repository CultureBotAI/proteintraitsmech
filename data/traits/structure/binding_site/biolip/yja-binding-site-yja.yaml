identifier: proteintraitsmech:BIOLIP_YJA
label: "YJA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[5-[[7-[3-[ethyl(2-hydroxyethyl)amino]propoxy]quinazolin-4-yl]amino]-1H-pyrazol-3-yl]-N-(3-fluorophenyl)ethanamide (YJA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QYZOGCMHVIGURT-UHFFFAOYSA-N.
