identifier: proteintraitsmech:BIOLIP_KUN
label: "KUN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (E,4S)-4-[[5-[2-[2,6-bis(azanyl)-4-oxidanylidene-1H-pyrimidin-5-yl]ethanoylamino]-3-fluoranyl-pyridin-2-yl]carbonylamino]pent-2-enedioic acid (KUN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ALGPVOJFIGPPPX-VIFPVBQESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
