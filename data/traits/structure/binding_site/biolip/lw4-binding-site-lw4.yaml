identifier: proteintraitsmech:BIOLIP_LW4
label: "LW4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(1H-indol-3-yl)-4-[2-(4-methylpiperazin-1-yl)quinazolin-4-yl]-1H-pyrrole-2,5-dione (LW4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OAVGBZOFDPFGPJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
