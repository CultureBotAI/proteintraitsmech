identifier: proteintraitsmech:BIOLIP_LXV
label: "LXV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,5-dibromo-N-{(3R,5S)-1-[(Z)-iminomethyl]-5-methylpyrrolidin-3-yl}benzenesulfonamide (LXV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HCQNBMQEPLAEIJ-NCAHPRJNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
