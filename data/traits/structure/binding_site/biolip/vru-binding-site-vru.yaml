identifier: proteintraitsmech:BIOLIP_VRU
label: "VRU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-ethyl-4-[5-[1-(2-hydroxyethyl)pyrazol-4-yl]benzimidazol-1-yl]-2,6-dimethoxy-benzamide (VRU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FCJGMZMSVIAAJU-UHFFFAOYSA-N.
