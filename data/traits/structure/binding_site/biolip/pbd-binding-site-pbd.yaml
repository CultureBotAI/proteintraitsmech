identifier: proteintraitsmech:BIOLIP_PBD
label: "PBD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(3,4-dimethoxyphenyl)-3-[3-(1H-imidazol-1-yl)propyl]thiourea (PBD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey FZQXMGLQANXZRP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:PBD
synonyms:
  - synonym_text: "1-(3,4-dimethoxyphenyl)-3-[3-(1H-imidazol-1-yl)propyl]thiourea-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9VRQ9
    protein_label: "4F9V chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4f9v chain A (resolution 2.1 Å); binding residues: D131 E170 E171 W176 D218 D271 F292 W296 H297"
    source: CURATOR
  - protein_id: UniProtKB:Q86PD7
    protein_label: "4FAI chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4fai chain B (resolution 1.65 Å); binding residues: D153 E190 E191 W196 D228 E292 F313 H318"
    source: CURATOR
