    protein_label: "8F5F chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8f5f chain A (resolution 3.149 Å); binding residues: I72 L128 L129 H132 V136 R167 I170 R171 Y346"
    source: CURATOR
