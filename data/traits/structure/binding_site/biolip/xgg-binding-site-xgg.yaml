identifier: proteintraitsmech:BIOLIP_XGG
label: "XGG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2P)-2-[(4P)-4-{6-[(1-ethylcyclopropyl)methoxy]pyridin-3-yl}-1,3-thiazol-2-yl]benzoic acid (XGG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NMOXDKZFTLXESP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
