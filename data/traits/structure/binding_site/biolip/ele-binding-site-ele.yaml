    protein_label: "6G3Z chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6g3z chain A (resolution 2.35 Å); binding residues: P7 G42 T43 T44 Y130 Y132 K155 T157"
    source: CURATOR
