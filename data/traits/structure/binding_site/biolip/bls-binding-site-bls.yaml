    protein_label: "2Z3I chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2z3i chain A (resolution 1.8 Å); binding residues: E25 D26 S28 V29 Y47 C54 Q56 R82 S86"
    source: CURATOR
