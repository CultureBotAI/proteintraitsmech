identifier: proteintraitsmech:BIOLIP_BXK
label: "BXK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-[[(2~{R})-4-methyl-1-oxidanyl-1-oxidanylidene-pentan-2-yl]carbamoyloxy]pentanedioic acid (BXK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WQDZXAWSGIQGKR-SFYZADRCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
