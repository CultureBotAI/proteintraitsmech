identifier: proteintraitsmech:BIOLIP_DO1
label: "DO1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-{(R)-(2-chlorophenyl)[2-(piperidin-1-yl)ethoxy]methyl}-1H-pyrrolo[3,2-b]pyridine-7-carboxylic acid (DO1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AWPYWZMMJZGPOX-OAQYLSRUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
