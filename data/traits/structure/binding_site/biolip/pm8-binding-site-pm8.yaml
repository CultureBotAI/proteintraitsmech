identifier: proteintraitsmech:BIOLIP_PM8
label: "PM8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-(2-{[N-(2-HYDROXY-4-{[HYDROXY(OXIDO)PHOSPHINO]OXY}-3,3-DIMETHYLBUTANOYL)-BETA-ALANYL]AMINO}ETHYL) DECANETHIOATE (PM8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 3 PDB structures; ligand InChIKey BPRKYNVKIAROET-IBGZPJMESA-N.
