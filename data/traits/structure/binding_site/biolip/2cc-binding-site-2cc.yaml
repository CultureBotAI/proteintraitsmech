identifier: proteintraitsmech:BIOLIP_2CC
label: "2CC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,4-bis(7-chloro-1H-indol-3-yl)-1H-pyrrole-2,5-dicarboxylic acid (2CC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OAMCCJASDLMTOO-UHFFFAOYSA-N.
