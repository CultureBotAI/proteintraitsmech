definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[(3~{Z},6~{S},7~{R},8~{R},8~{a}~{S})-7,8-bis(oxidanyl)-3-(phenylmethyl)imino-1,5,6,7,8,8~{a}-hexahydro-[1,3]thiazolo[3,4-a]pyridin-6-yl]ethanamide (1XI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DWUFYAAHHCWFAW-OZFNUUMKSA-N.
