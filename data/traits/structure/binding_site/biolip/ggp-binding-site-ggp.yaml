identifier: proteintraitsmech:BIOLIP_GGP
label: "GGP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand BETA-1,2,3,4,6-PENTA-O-GALLOYL-D-GLUCOPYRANOSE (GGP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QJYNZEYHSMRWBK-CGKDMBANSA-N.
