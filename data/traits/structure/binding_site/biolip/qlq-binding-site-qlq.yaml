identifier: proteintraitsmech:BIOLIP_QLQ
label: "QLQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[(2~{R})-3-(7-methyl-2~{H}-indazol-5-yl)-1-oxidanylidene-1-[[(2~{S})-1-oxidanylidene-3-piperidin-4-yl-1-(4-pyridin-4-ylpiperazin-1-yl)propan-2-yl]amino]propan-2-yl]-2-oxidanylidene-spiro[1~{H}-pyrido[2,3-d][1,3]oxazine-4,4'-piperidine]-1'-carboxamide (QLQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LIPVCPUZWNTQHV-SAIUNTKASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:QLQ
synonyms:
