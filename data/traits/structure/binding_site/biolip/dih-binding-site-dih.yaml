identifier: proteintraitsmech:BIOLIP_DIH
label: "DIH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-[[(3R,4R)-3-(hydroxymethyl)-4-oxidanyl-pyrrolidin-1-ium-1-yl]methyl]-3,5-dihydropyrrolo[3,2-d]pyrimidin-4-one (DIH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 4 PDB structures; ligand InChIKey AFNHHLILYQEHKK-BDAKNGLRSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
