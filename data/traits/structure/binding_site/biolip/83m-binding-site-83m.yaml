identifier: proteintraitsmech:BIOLIP_83M
label: "83M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1R)-1-{(6S)-6-[(2-amino-2-oxoethyl)carbamoyl]-1,4,5,6-tetrahydropyrimidin-2-yl}-2-(4-hydroxyphenyl)ethyl]-N~2~-tetradecanoyl-L-glutamine (83M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DGAYEIHJKULBKL-HZFUHODCSA-N.
