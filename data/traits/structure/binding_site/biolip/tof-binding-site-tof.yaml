    protein_label: "5JE1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5je1 chain A (resolution 1.95 Å); binding residues: F14 F17 Q23 W112 N115 Y116 F179 F187 F189 L237"
    source: CURATOR
