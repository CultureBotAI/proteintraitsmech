definition: >-
  A structure-derived ligand-binding site at which the ligand (5P)-N,N-diethyl-2-fluoro-5-(2-[({1-[2-(methylamino)-2-oxoethyl]cyclohexyl}methyl)amino]-6-{methyl[1-(2-methyl-1-phenyl-1H-1,3-benzimidazole-5-carbonyl)piperidin-4-yl]amino}pyrimidin-4-yl)benzamide (A1AJC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HMDXTOLTWKZGHP-UHFFFAOYSA-N.
