identifier: proteintraitsmech:BIOLIP_J0J
label: "J0J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-alanyl-N-[(2S,6R)-6-amino-6-carboxy-1-{[(1R)-1-carboxyethyl]amino}-1-oxohexan-2-yl]-D-glutamine (J0J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VFGFFQOPKZHQLZ-PZWNZHSQSA-N.
