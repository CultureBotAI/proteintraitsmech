identifier: proteintraitsmech:BIOLIP_OZN
label: "OZN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4-[4-[[(6Z)-5-chloranyl-6-pyrazolo[1,5-a]pyridin-3-ylidene-1H-pyrimidin-2-yl]amino]-3,5-dimethyl-pyrazol-1-yl]piperidin-1-yl]-N,N-dimethyl-ethanamide (OZN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AMADJQZSXUFWNT-CLCOLTQESA-N.
