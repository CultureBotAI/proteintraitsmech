identifier: proteintraitsmech:BIOLIP_S4M
label: "S4M-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-[(S)-(3-AMINOPROPYL)(METHYL)-LAMBDA~4~-SULFANYL]-5'-DEOXYADENOSINE (S4M) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey KIZZALRCMBIHBH-IDTAVKCVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
