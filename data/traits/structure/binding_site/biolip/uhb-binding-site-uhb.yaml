identifier: proteintraitsmech:BIOLIP_UHB
label: "UHB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4-[(2S,3S,4R,5R)-5-(6-aminopurin-9-yl)-3,4-bis(oxidanyl)oxolan-2-yl]carbonylpiperazin-1-yl]-N-(1-oxidanylidene-2,3-dihydroisoindol-4-yl)ethanamide (UHB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QEUOCRGVJJDDTK-VBFAUCSFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
