    protein_label: "4IMG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4img chain A (resolution 1.85 Å); binding residues: A10 G46 S47 T48 Y136 F140 T166 G188 F189 D190 E191 G206 S207 Y251"
    source: CURATOR
