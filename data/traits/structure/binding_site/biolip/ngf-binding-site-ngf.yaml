identifier: proteintraitsmech:BIOLIP_NGF
label: "NGF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,5-dideoxy-5-[(hydroxyacetyl)amino]-D-glycero-D-galacto-non-2-ulosonic acid (NGF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SUHQNCLNRUAGOO-KQCZLNONSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:NGF
synonyms:
  - synonym_text: "3,5-dideoxy-5-[(hydroxyacetyl)amino]-D-glycero-D-galacto-non-2-ulosonic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
