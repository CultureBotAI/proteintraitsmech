identifier: proteintraitsmech:BIOLIP_ZOB
label: "ZOB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-{[(3,5-difluoropyridin-4-yl)methyl]amino}-N-(4-ethoxy-6-methylpyrimidin-2-yl)-2-methoxy-N-(2-methoxyethyl)pyridine-3-sulfonamide (ZOB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey APXQLSSVLHYGGM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
