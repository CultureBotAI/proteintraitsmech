identifier: proteintraitsmech:BIOLIP_O1S
label: "O1S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-(5-methyl-1H-pyrazol-4-yl)-2-[(pyrrolidin-1-yl)methyl]thieno[3,2-d]pyrimidin-4(3H)-one (O1S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MUYIKPWUBQUQAV-UHFFFAOYSA-N.
