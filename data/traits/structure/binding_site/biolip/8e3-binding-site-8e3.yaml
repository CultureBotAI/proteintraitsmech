label: "8E3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-fluoranyl-2-(4,5,6,7-tetrahydrofuro[2,3-c]pyridin-2-yl)-1~{H}-benzimidazole-4-carboxamide (8E3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BLVQSAHMDXWBNC-UHFFFAOYSA-N.
