definition: >-
  A structure-derived ligand-binding site at which the ligand cyclohexyl (S)-methylphosphonofluoridoate (WW2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey SNTRKUOVAPUGAY-NSHDSACASA-N.
