identifier: proteintraitsmech:BIOLIP_EVM
label: "EVM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand L-Serine, N-[[3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]-4-pyridinyl]methylene] (EVM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JFLJYKRWFQAEDK-QLKAYGNNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:EVM
synonyms:
  - synonym_text: "L-Serine, N-[[3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]-4-pyridinyl]methylene]-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q5M0B4
    protein_label: "6TGH chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6tgh chain A (resolution 2.12 Å); binding residues: S35 S97 G98 S99 H126 S176 D201 A203 H204 K230 R363"
    source: CURATOR
