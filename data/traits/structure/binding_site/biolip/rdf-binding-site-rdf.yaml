identifier: proteintraitsmech:BIOLIP_RDF
label: "RDF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-ALPHA-L-RHAMNOPYRANOSYLOXY(HYDROXYPHOSPHINYL)-L-LEUCYL-L-TRYPTOPHAN (RDF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 4 PDB structures; ligand InChIKey ZPHBZEQOLSRPAK-XLCYBJAPSA-N.
