identifier: proteintraitsmech:BIOLIP_P35
label: "P35-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-({5-[(piperidin-4-yl)amino]-1,3-dihydro-2H-isoindol-2-yl}sulfonyl)benzene-1,3-diol (P35) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HQHMYMINMCVYMC-UHFFFAOYSA-N.
