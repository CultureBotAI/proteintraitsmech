identifier: proteintraitsmech:BIOLIP_CMK
label: "CMK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CYTIDINE 5'-MONOPHOSPHATE 3-DEOXY-BETA-D-GULO-OCT-2-ULO-PYRANOSONIC ACID (CMK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 4 PDB structures; ligand InChIKey YWWJKULNWGRYAS-UOVSKDHASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
