identifier: proteintraitsmech:BIOLIP_8DS
label: "8DS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-chloranyl-N-[2-(4-chlorophenyl)ethyl]thieno[2,3-c]pyridine-2-carboxamide (8DS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QRJZINDCUNBUGT-UHFFFAOYSA-N.
