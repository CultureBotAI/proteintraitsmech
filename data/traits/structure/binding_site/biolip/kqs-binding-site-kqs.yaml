identifier: proteintraitsmech:BIOLIP_KQS
label: "KQS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-3-(2-fluorophenyl)-N-((2-oxo-2,3-dihydro-1H-benzo[d]imidazol-5-yl)methyl)butanamide) (KQS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey JYQMTEASQYBLAO-NSHDSACASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
