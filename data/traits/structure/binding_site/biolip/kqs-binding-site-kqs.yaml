    protein_label: "5ADZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5adz chain A (resolution 2.2 Å); binding residues: D303 R515 G525 E526 S527 Y578 Y580 F581 H616 H617"
    source: CURATOR
