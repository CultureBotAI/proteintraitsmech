identifier: proteintraitsmech:BIOLIP_YLL
label: "YLL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,2S,3S,4S,5R,6R)-6-(HYDROXYMETHYL)CYCLOHEXANE-1,2,3,4,5-PENTOL (YLL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 5 PDB structures; ligand InChIKey QFYQIWDMMSKNFF-NYLBLOMBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
