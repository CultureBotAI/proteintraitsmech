    protein_label: "7YP3 chain F (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7yp3 chain F (resolution 2.1 Å); binding residues: S12 H13 S69 N72 L74 S75 V96 S97 Y102 W150 Y155 G321 F322 Y342 A343 W345"
    source: CURATOR
