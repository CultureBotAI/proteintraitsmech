identifier: proteintraitsmech:BIOLIP_FFT
label: "FFT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2Z,6Z)-3,7,11-trimethyldodeca-2,6,10-trien-1-yl dihydrogen phosphate (FFT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ALEWCKXBHSDCCT-FBXUGWQNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:FFT
synonyms:
  - synonym_text: "(2Z,6Z)-3,7,11-trimethyldodeca-2,6,10-trien-1-yl dihydrogen phosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9PP99
    protein_label: "3UGS chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3ugs chain B (resolution 2.457 Å); binding residues: V10 M11 D12 G13 F55 A56 L76 R172 R178 S180"
    source: CURATOR
