    protein_label: "8UFD chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8ufd chain A (resolution 3.26 Å); binding residues: A316 V319 T373 I374 G377 Y378 L380 I412 A415 L419 A498 I499 V501 G502"
    source: CURATOR
