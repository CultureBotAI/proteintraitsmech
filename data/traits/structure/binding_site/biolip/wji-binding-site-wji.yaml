identifier: proteintraitsmech:BIOLIP_WJI
label: "WJI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S,3S)-N-[6-bromo-5-(pyrimidin-2-yl)pyridin-2-yl]-2,2-dimethyl-3-(2-methylpropyl)cyclopropane-1-carboxamide (WJI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KQDXNUOVSJVMBP-DZGCQCFKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:WJI
synonyms:
  - synonym_text: "(1S,3S)-N-[6-bromo-5-(pyrimidin-2-yl)pyridin-2-yl]-2,2-dimethyl-3-(2-methylpropyl)cyclopropane-1-carboxamide-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
