    protein_label: "1JOC chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1joc chain A (resolution 2.2 Å); binding residues: D1352 R1370 R1371 H1372 H1373 R1375"
    source: CURATOR
  - protein_id: UniProtKB:O14964
