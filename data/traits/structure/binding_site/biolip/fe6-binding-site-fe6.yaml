definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(4-bromanyl-2-fluoranyl-phenyl)methyl]-4-chloranyl-pyrazolo[3,4-d]pyrimidin-6-amine (FE6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UKBISIPKUKNJKU-UHFFFAOYSA-N.
