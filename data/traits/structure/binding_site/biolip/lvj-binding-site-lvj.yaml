identifier: proteintraitsmech:BIOLIP_LVJ
label: "LVJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[2,6-bis(chloranyl)-3-[(2,2-dimethylpropanoylamino)methyl]phenyl]amino]-1-methyl-6-(2-methyl-2-oxidanyl-propoxy)-N-[2,2,2-tris(fluoranyl)ethyl]benzimidazole-5-carboxamide (LVJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CHFOASGROVVRSK-UHFFFAOYSA-N.
