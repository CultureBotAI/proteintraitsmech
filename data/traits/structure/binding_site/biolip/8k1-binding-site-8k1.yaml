identifier: proteintraitsmech:BIOLIP_8K1
label: "8K1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(R)-hydroxy{[(7beta,8alpha,9beta,10alpha,11beta,13alpha)-7-hydroxy-19-oxo-11,16-epoxykauran-19-yl]oxy}phosphoryl]adenosine (8K1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FXLLSKDPBMRMHG-INWXLQENSA-N.
