identifier: proteintraitsmech:BIOLIP_VPP
label: "VPP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,4S)-2-[(R)-carboxy{[(2R)-2-{[(4-ethyl-2,3-dioxopiperazin-1-yl)carbonyl]amino}-2-phenylacetyl]amino}methyl]-5,5-dimethyl-1,3-thiazolidine-4-carboxylic acid (VPP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OKSUEATVFIVTFV-AESZEHBQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
