    protein_label: "1BP4 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1bp4 chain A (resolution 2.2 Å); binding residues: Q19 S21 G23 C25 Q142 H159 W177"
    source: CURATOR
