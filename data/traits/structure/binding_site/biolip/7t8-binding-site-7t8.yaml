definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,4R,4aR,6S,6aS,12R,12aS,12bS)-4-[(acetyloxy)methyl]-12-hydroxy-4,6a,12b-trimethyl-11-oxo-9-(pyridin-3-yl)-1,3,4,4a,5,6,6a,12,12a,12b-decahydro-2H,11H-naphtho[2,1-b]pyrano[3,4-e]pyran-3,6-diyl diacetate (7T8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PMMQOFWSZRQWEV-RVTXXDJVSA-N.
