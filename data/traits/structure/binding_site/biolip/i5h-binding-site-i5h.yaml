identifier: proteintraitsmech:BIOLIP_I5H
label: "I5H-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5S)-5-(1H-indol-3-ylmethyl)imidazolidine-2,4-dione (I5H) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RUUREKIGAKIKIL-JTQLQIEISA-N.
