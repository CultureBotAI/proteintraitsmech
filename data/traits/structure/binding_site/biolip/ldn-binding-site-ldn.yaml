    protein_label: "3MDY chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3mdy chain A (resolution 2.05 Å); binding residues: I210 V218 A229 L259 H282 E283 G285 D289 L339 D350"
    source: CURATOR
