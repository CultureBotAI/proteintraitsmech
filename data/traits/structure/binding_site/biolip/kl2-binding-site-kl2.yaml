    protein_label: "6RVZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6rvz chain A (resolution 2.1 Å); binding residues: N173 L179 N183 L186 E220 H310 Y313 D351 N353 H533"
    source: CURATOR
