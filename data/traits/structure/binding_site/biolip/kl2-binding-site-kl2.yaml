identifier: proteintraitsmech:BIOLIP_KL2
label: "KL2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand adenosine-2',3'-vanadate (KL2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VVVFQERUKYCTSH-KWIZKVQNSA-K.
definition_source: "BioLiP2 (Yang/Zhang group)"
