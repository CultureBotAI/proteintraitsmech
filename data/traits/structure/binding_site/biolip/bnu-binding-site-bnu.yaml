identifier: proteintraitsmech:BIOLIP_BNU
label: "BNU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-bromo-1-ethyl-4-oxo-7-(piperazin-1-yl)-1,4-dihydroquinoline-3-carboxylic acid (BNU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DAPHRWWQHCSXBW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
