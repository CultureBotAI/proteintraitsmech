identifier: proteintraitsmech:BIOLIP_1UD
label: "1UD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 6-[6-amino-2-(methylamino)-8-oxo-7,8-dihydro-1H-imidazo[4,5-g]quinazolin-4-yl]-5,6-dideoxy-3-O-methyl-beta-D-ribo-hexofuranoside (1UD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AYNKUXIALNGELF-DSPGLSBSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
