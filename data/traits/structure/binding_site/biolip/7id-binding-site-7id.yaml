identifier: proteintraitsmech:BIOLIP_7ID
label: "7ID-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-4-[[(2~{S})-5-[[azanyl($l^{4}-azanylidene)methyl]amino]-1-$l^{1}-oxidanyl-1-oxidanylidene-pentan-2-yl]amino]-2-$l^{2}-azanyl-4-oxidanylidene-butanoic acid (7ID) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QCGCETFHYOEVAI-WDSKDSINSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
