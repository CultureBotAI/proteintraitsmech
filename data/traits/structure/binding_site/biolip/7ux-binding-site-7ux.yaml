identifier: proteintraitsmech:BIOLIP_7UX
label: "7UX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-methyl-N-(5-phenyl-1,3-thiazol-2-yl)piperidine-4-carboxamide (7UX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey BTZKRRFKIKIADV-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
