identifier: proteintraitsmech:BIOLIP_VCW
label: "VCW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2S,3S,4S,5R,6S)-6-[(2R)-2,3-bis(oxidanyl)propoxy]-3,4,5-tris(oxidanyl)oxan-2-yl]methanesulfonic acid (VCW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JTXHNMDHGMNPEG-NZJLWHDDSA-N.
