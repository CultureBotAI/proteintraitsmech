identifier: proteintraitsmech:BIOLIP_QNX
label: "QNX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S})-3-(1~{H}-imidazol-4-yl)-2-[[2-methyl-3-oxidanyl-5-(phosphonooxymethyl)pyridin-4-yl]methylamino]propyl] dihydrogen phosphate (QNX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey WJUXYPJSYWWQCX-LBPRGKRZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
