identifier: proteintraitsmech:BIOLIP_UP3
label: "UP3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3,3',3'',3'''-[3,8,13,17-tetrakis(carboxymethyl)porphyrin-2,7,12,18-tetrayl]tetrapropanoic acid (UP3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VZVFNUAIRVUCEW-XFMUOGEMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
