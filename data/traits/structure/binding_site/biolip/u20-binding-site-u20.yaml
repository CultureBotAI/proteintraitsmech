definition: >-
  A structure-derived ligand-binding site at which the ligand uridine-5'-diphosphate-3-O-(R-3-hydroxymyristoyl)-N-acetyl-D-glucosamine (U20) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey TZSJGZGYQDNRRX-MPLCHSTDSA-N.
