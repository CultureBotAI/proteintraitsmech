identifier: proteintraitsmech:BIOLIP_3Z0
label: "3Z0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(3R)-3-aminopiperidin-1-yl][2-(1-ethyl-1H-pyrrolo[2,3-b]pyridin-2-yl)-7-methoxy-1-methyl-1H-benzimidazol-5-yl]methanone (3Z0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JCCVZBCVMBEDEN-QGZVFWFLSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
