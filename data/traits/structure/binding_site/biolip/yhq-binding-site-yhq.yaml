identifier: proteintraitsmech:BIOLIP_YHQ
label: "YHQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-{(R)-hydroxy[(propan-2-yl)oxy]phosphoryl}adenosine (YHQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UCVFYZHKFZWYCU-QYVSTXNMSA-N.
