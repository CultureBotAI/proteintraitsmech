identifier: proteintraitsmech:BIOLIP_PCJ
label: "PCJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(2S)-3-HYDROXY-2-(PALMITOYLAMINO)PROPYL]THIO}PROPANE-1,2-DIYL DIHEXADECANOATE (PCJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey GBQDHEZHWNJSLG-OKPYTHRESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
