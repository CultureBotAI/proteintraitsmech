identifier: proteintraitsmech:BIOLIP_UGU
label: "UGU-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (Z)-7-[(1R,2R,3R,5S)-3,5-bis(oxidanyl)-2-[(E,3S)-3-oxidanyloct-1-enyl]cyclopentyl]hept-5-enoic acid (UGU) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PXGPLTODNUVGFL-YNNPMVKQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
