    protein_label: "7MHD chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7mhd chain A (resolution 2.03 Å); binding residues: I250 S308 Y343 Y347 T348 Y351 R352 A363 E366 A367 Y424 L427 E431"
    source: CURATOR
