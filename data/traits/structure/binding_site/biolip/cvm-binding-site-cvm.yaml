identifier: proteintraitsmech:BIOLIP_CVM
label: "CVM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CYMAL-4 (CVM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JRNQXDHDSXBSFV-WXFJLFHKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:CVM
synonyms:
  - synonym_text: "CYMAL-4-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A5HEI4
    protein_label: "2WIE chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2wie chain A (resolution 2.13 Å); binding residues: N4 L5"
    source: CURATOR
