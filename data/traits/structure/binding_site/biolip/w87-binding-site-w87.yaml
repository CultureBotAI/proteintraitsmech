identifier: proteintraitsmech:BIOLIP_W87
label: "W87-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-{4-[5-(methoxycarbonyl)naphthalen-2-yl]butyl}-2,6-dioxo-1,2,3,6-tetrahydropyrimidine-4-carboxylic acid (W87) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ILXUNLFRSXVJJZ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
