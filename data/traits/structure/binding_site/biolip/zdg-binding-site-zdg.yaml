identifier: proteintraitsmech:BIOLIP_ZDG
label: "ZDG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[4-[2-(2,4-dichlorophenyl)-4-methyl-5-(piperidin-1-ylcarbamoyl)pyrazol-3-yl]phenyl]but-3-ynyl nitrate (ZDG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KXXKUWQMQUYUSE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:ZDG
synonyms:
  - synonym_text: "4-[4-[2-(2,4-dichlorophenyl)-4-methyl-5-(piperidin-1-ylcarbamoyl)pyrazol-3-yl]phenyl]but-3-ynyl nitrate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00323
    protein_label: "5TGZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5tgz chain A (resolution 2.8 Å); binding residues: F102 M103 G166 F170 V196 T197 F268 L359 S383 M384 C386 L387"
    source: CURATOR
