identifier: proteintraitsmech:BIOLIP_VDX
label: "VDX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-{2-[1-(5-HYDROXY-1,5-DIMETHYL-HEXYL)-7A-METHYL-OCTAHYDRO-INDEN-4-YLIDENE]-ETHYLIDENE}-4-METHYLENE-CYCLOHEXANE-1,3-DIOL (VDX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey GMRQFYUYWCNGIN-NKMMMXOESA-N.
