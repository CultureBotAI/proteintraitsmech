identifier: proteintraitsmech:BIOLIP_ASW
label: "ASW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[4-(acridin-9-ylamino)-3-methoxyphenyl]methanesulfonamide (ASW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XCPGHVQEEXUHNC-UHFFFAOYSA-N.
