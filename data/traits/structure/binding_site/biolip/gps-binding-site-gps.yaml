    protein_label: "1B4P chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1b4p chain A (resolution 1.7 Å); binding residues: Y6 W7 V9 G11 R42 W45 K49 N58 L59 Q71 S72 Y115 F208 A209"
    source: CURATOR
