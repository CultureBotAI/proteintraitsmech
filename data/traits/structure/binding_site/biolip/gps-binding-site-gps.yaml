identifier: proteintraitsmech:BIOLIP_GPS
label: "GPS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand L-gamma-glutamyl-S-[(9S,10S)-10-hydroxy-9,10-dihydrophenanthren-9-yl]-L-cysteinylglycine (GPS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey JNNIZILNBMPOAC-GPHNJDIKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
