identifier: proteintraitsmech:BIOLIP_LUB
label: "LUB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(Hydroxymethyl)-2-propylfuran-3-carboxylic acid (LUB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZQVNOVXAPYHZNS-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LUB
synonyms:
  - synonym_text: "4-(Hydroxymethyl)-2-propylfuran-3-carboxylic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9JN89
    protein_label: "6SRN chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6srn chain A (resolution 1.5 Å); binding residues: Y85 F117 Q130 P143 Y144 W147 F181 F182"
    source: CURATOR
