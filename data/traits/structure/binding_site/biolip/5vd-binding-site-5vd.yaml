identifier: proteintraitsmech:BIOLIP_5VD
label: "5VD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl (1~{R},2~{R},4~{S})-2-methyl-2,4,5,7,10-pentakis(oxidanyl)-6,11-bis(oxidanylidene)-3,4-dihydro-1~{H}-tetracene-1-carboxylate (5VD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZBSRQGXAWDQXFX-SBOBAANCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
