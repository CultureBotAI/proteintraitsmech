identifier: proteintraitsmech:BIOLIP_PID
label: "PID-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand PERIDININ (PID) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 75 binding-site occurrences across 6 PDB structures; ligand InChIKey UYRDHEJRPVSJFM-FROCQLDGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
