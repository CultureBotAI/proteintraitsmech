label: "F6L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[2-[(E)-2-[4-[(2S,3R,4S,5R,6R)-6-(hydroxymethyl)-3,4,5-tris(oxidanyl)oxan-2-yl]oxyphenyl]ethenyl]-3,3-dimethyl-2H-indol-1-yl]methyl]benzoic acid (F6L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZRXNUVMWWIBYNP-BARJCIPKSA-O.
