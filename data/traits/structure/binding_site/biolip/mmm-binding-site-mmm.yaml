identifier: proteintraitsmech:BIOLIP_MMM
label: "MMM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (S,E)-3-HYDROXY-2-((3-HYDROXY-2-METHYL-5-(PHOSPHONOOXYMETHYL)PYRIDIN-4-YL)METHYLENEAMINO)-2-METHYLPROPANOIC ACID (MMM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ASXDVUDIJQGHKR-DRRTZOGYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
