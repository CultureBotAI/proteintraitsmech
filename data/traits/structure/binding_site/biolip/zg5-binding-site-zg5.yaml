identifier: proteintraitsmech:BIOLIP_ZG5
label: "ZG5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 11-(4-beta-D-glucopyranuronosylpiperazin-1-yl)dibenzo[b,f][1,4]thiazepine (ZG5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UKCFGNFADWVWOZ-SXFAUFNYSA-N.
