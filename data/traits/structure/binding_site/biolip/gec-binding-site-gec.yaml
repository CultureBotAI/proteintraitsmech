identifier: proteintraitsmech:BIOLIP_GEC
label: "GEC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(3S,3aR,6S,6aR)-6-(3-methoxy-4-oxidanyl-phenyl)-1,3,3a,4,6,6a-hexahydrofuro[3,4-c]furan-3-yl]-2-methoxy-phenol (GEC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HGXBRUKMWQGOIE-AFHBHXEDSA-N.
