label: "C0C-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[1-(4-chlorophenyl)cyclopentane-1-carbonyl]-N-{[3-(methylcarbamoyl)phenyl]methyl}-D-prolinamide (C0C) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FKSCOWJURPRAGR-JOCHJYFZSA-N.
