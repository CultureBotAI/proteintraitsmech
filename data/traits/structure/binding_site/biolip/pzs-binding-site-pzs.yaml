definition: >-
  A structure-derived ligand-binding site at which the ligand (5~{S},8~{S},9~{R})-2-[(~{E})-hex-1-enyl]-8-methoxy-3-methyl-9-oxidanyl-8-(phenylcarbonyl)-1-oxa-7-azaspiro[4.4]non-2-ene-4,6-dione (PZS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WDHGEYIVJHPIOB-HVQJOPHCSA-N.
