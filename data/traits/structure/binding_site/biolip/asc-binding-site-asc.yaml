    protein_label: "3FXR chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3fxr chain A (resolution 2.5 Å); binding residues: H150 R199 A203 I204 N207 P266 P268"
    source: CURATOR
  - protein_id: UniProtKB:Q9SWS1
