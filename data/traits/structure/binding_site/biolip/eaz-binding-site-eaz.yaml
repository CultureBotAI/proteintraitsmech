identifier: proteintraitsmech:BIOLIP_EAZ
label: "EAZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-4-methyl-1-[5-(3-methyl-2~{H}-indazol-5-yl)pyridin-3-yl]oxy-pentan-2-amine (EAZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CEDLXWRFEZCVEU-INIZCTEOSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
