identifier: proteintraitsmech:BIOLIP_STR
label: "STR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand PROGESTERONE (STR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 10 binding-site occurrences across 9 PDB structures; ligand InChIKey RJKFOVLPORLFTN-LEKSSAKUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
