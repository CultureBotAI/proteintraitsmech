definition: >-
  A structure-derived ligand-binding site at which the ligand 2-cyclohexyl-6-methoxy-~{N}-methyl-~{N}-(1-propan-2-ylpiperidin-4-yl)-7-(3-pyrrolidin-1-ylpropoxy)quinazolin-4-amine (QQS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ATORKVYCKKBNTF-UHFFFAOYSA-N.
