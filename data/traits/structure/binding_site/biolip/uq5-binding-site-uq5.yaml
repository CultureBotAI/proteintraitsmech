identifier: proteintraitsmech:BIOLIP_UQ5
label: "UQ5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,3-DIMETHOXY-5-METHYL-6-(3,11,15,19-TETRAMETHYL-EICOSA-2,6,10,14,18-PENTAENYL)-[1,4]BENZOQUINONE (UQ5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 3 PDB structures; ligand InChIKey NYFAQDMDAFCWPU-UVCHAVPFSA-N.
