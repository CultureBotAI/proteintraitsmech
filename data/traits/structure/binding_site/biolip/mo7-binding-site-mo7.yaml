identifier: proteintraitsmech:BIOLIP_MO7
label: "MO7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand bis(mu4-oxo)-bis(mu3-oxo)-octakis(mu2-oxo)-dodecaoxo-heptamolybdenum (VI) (MO7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CFQDGBTUZUJXQE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
