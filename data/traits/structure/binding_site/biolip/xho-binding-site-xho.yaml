    protein_label: "8F6P chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8f6p chain A (resolution 3.2 Å); binding residues: Q372 V406 C899 F1420 S1712 F1762 V1766"
    source: CURATOR
