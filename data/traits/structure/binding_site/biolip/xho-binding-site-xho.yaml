identifier: proteintraitsmech:BIOLIP_XHO
label: "XHO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (R)-ranolazine (XHO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XKLMZUWKNUAPSZ-HXUWFJFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:XHO
synonyms:
  - synonym_text: "(R)-ranolazine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
