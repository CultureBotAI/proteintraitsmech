identifier: proteintraitsmech:BIOLIP_2H3
label: "2H3-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1r,2r,3r,4r,5r,6r)-cyclohexane-1,2,3,4,5,6-hexol (2H3) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CDAISMWEOUEBRE-CDRYSYESSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
