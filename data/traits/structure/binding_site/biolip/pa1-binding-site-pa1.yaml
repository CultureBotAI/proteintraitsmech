identifier: proteintraitsmech:BIOLIP_PA1
label: "PA1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-amino-2-deoxy-alpha-D-glucopyranose (PA1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey MSWZFWKMSRAUBD-UKFBFLRUSA-N.
