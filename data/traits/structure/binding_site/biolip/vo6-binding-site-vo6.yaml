identifier: proteintraitsmech:BIOLIP_VO6
label: "VO6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{R},4~{S})-2-[4-[[4,6-bis(azanyl)-1,3,5-triazin-2-yl]amino]phenyl]-1,3,2-dithiarsolan-4-yl]methanol (VO6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JCYZMTMYPZHVBF-TVQRCGJNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
