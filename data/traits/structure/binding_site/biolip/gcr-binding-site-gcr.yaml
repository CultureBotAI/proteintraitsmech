identifier: proteintraitsmech:BIOLIP_GCR
label: "GCR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GALLICHROME (GCR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BEDMDXBTNSVNGS-GSJIPYROSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:GCR
synonyms:
  - synonym_text: "GALLICHROME-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P07822
    protein_label: "1EFD chain N (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1efd chain N (resolution 1.9 Å); binding residues: W68 R84 Y106 I183 L189 W217 W273 Y275"
    source: CURATOR
