identifier: proteintraitsmech:BIOLIP_POL
label: "POL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-PROPANOL (POL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 28 binding-site occurrences across 13 PDB structures; ligand InChIKey BDERNNFJNOPAEC-UHFFFAOYSA-N.
