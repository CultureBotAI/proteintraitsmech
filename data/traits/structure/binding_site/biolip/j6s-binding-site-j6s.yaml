identifier: proteintraitsmech:BIOLIP_J6S
label: "J6S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3E,5E)-6-(4-nitrophenyl)-2-oxohexa-3,5-dienoic acid (J6S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YFKMPGYOVOFESP-ZPUQHVIOSA-N.
