definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},3~{S},4~{R},5~{S},6~{S})-2-[[(2~{R},3~{S},4~{R},6~{S})-2-(hydroxymethyl)-6-methoxy-3-oxidanyl-oxan-4-yl]methyl]-6-methyl-oxane-3,4,5-triol (DTK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 1 PDB structure; ligand InChIKey ZKQNJYZBKMAROQ-UDZHPATASA-N.
