identifier: proteintraitsmech:BIOLIP_G5J
label: "G5J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-O-[(S)-hydroxy{[(R)-hydroxy{[(S)-hydroxy(methoxy)phosphoryl]oxy}phosphoryl]oxy}phosphoryl]guanosine (G5J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DJZJYVFASQUZKQ-KQYNXXCUSA-N.
