identifier: proteintraitsmech:BIOLIP_D0D
label: "D0D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(5P)-2-chloro-5-(4-{[(1R)-1-phenylethyl]amino}quinazolin-6-yl)pyridin-3-yl]methanesulfonamide (D0D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LPJIZDSOUGHTNB-CQSZACIVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
