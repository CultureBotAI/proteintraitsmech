identifier: proteintraitsmech:BIOLIP_APJ
label: "APJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N~2~-1H-benzimidazol-5-yl-N~4~-(3-cyclopropyl-1H-pyrazol-5-yl)pyrimidine-2,4-diamine (APJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WJNBSTLIALIIEW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
