definition: >-
  A structure-derived ligand-binding site at which the ligand [(1~{R},5~{R},6~{S},8~{R})-8-(6-aminopurin-9-yl)-4'-[(~{R})-oxidanyl-[4-(2-oxidanylidenepropylsulfanyl)phenyl]methyl]spiro[2,4,7-trioxa-3-boranuidabicyclo[3.3.0]octane-3,7'-7-boranuidabicyclo[4.3.0]nona-1(6),2,4-triene]-6-yl]methoxy-tris(oxidanyl)phosphanium (FGX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YYNKFKBRIAWSCO-QTPLPVLTSA-N.
