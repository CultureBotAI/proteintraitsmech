identifier: proteintraitsmech:BIOLIP_VTB
label: "VTB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-O-phosphono-alpha-L-galacto-hept-2-ulopyranose (VTB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CBIDVWSRUUODHL-CXNFULCWSA-N.
