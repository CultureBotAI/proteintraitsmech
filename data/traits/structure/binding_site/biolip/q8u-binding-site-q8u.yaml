definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(3,4-diazatricyclo[9.4.0.0^{2,7}]pentadeca-1(11),2(7),3,5,12,14-hexaen-5-yl)-~{N}3-[(7~{S})-7-pyrrolidin-1-yl-6,7,8,9-tetrahydro-5~{H}-benzo[7]annulen-3-yl]-1,2,4-triazole-3,5-diamine (Q8U) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KXMZDGSRSGHMMK-VWLOTQADSA-N.
