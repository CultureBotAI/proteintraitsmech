identifier: proteintraitsmech:BIOLIP_HG0
label: "HG0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[bis(azanyl)methylidene]-3-methylsulfonyl-4-propan-2-yl-benzamide (HG0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IWXNYAIICFKCTM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
