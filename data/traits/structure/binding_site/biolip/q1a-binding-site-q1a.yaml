identifier: proteintraitsmech:BIOLIP_Q1A
label: "Q1A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[4-(1-aminoisoquinolin-5-yl)phenyl]-3-(5-tert-butyl-1,2-oxazol-3-yl)urea (Q1A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SLRYMOUSQMDJPH-UHFFFAOYSA-N.
