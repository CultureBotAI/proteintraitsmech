identifier: proteintraitsmech:BIOLIP_Z1T
label: "Z1T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(2S,3R,4E)-1,3-dihydroxyoctadec-4-en-2-yl]tetracosanamide (Z1T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey ZJVVOYPTFQEGPH-AUTSUKAISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
