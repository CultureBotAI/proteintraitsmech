    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P39075
    protein_label: "3D6Y chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3d6y chain A (resolution 2.7 Å); binding residues: P144 N149 Y170 F224 P226 Y229 Y268"
    source: CURATOR
