identifier: proteintraitsmech:BIOLIP_8VP
label: "8VP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[1-(5-ethylpyrimidin-2-yl)piperidin-4-yl]-4-[[4-(1,2,3,4-tetrazol-1-yl)phenoxy]methyl]-1,3-thiazole (8VP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NFTMKHWBOINJGM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
