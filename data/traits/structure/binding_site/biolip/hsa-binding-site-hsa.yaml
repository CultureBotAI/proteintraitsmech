identifier: proteintraitsmech:BIOLIP_HSA
label: "HSA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand PHOSPHORIC ACID MONO-[2-AMINO-3-(3H-IMIDAZOL-4-YL)-PROPYL]ESTER (HSA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey CWNDERHTHMWBSI-YFKPBYRVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
