definition: >-
  A structure-derived ligand-binding site at which the ligand {[(1R,3S,4S,5R,6S)-2,4,5,6-tetrakis(phosphonooxy)cyclohexane-1,3-diyl]bis[oxy(2-oxoethane-2,1-diyl)]}bis(phosphonic acid) (4WY) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KMLKNZLYFKMCMH-COQVWMOOSA-N.
