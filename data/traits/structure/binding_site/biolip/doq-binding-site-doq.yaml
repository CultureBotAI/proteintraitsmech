identifier: proteintraitsmech:BIOLIP_DOQ
label: "DOQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3S,4S)-2-CARBOXY-4-[(1Z,3E,5R)-5-CARBOXY-1-METHYL-1,3-HEXADIENYL]-3-PYRROLIDINEACETIC ACID (DOQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VZFRNCSOCOPNDB-AOKDLOFSSA-N.
