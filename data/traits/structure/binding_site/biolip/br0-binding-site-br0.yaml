identifier: proteintraitsmech:BIOLIP_BR0
label: "BR0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3aS,4R,9bR)-9-nitro-3a,4,5,9b-tetrahydro-3H-cyclopenta[c]quinoline-4,6-dicarboxylic acid (BR0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CTXNQOWRJIPUOM-KEHGIVTQSA-N.
