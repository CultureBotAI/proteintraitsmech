identifier: proteintraitsmech:BIOLIP_VTJ
label: "VTJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand compound (VTJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey DQCBLCPTXXGKPW-GDLZYMKVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
