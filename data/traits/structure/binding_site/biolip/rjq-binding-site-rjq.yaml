identifier: proteintraitsmech:BIOLIP_RJQ
label: "RJQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S},7~{R},10~{R},13~{S})-4-[(3~{S},6~{R},8~{a}~{S})-1'-[(2~{S})-2-acetamido-3-(2-chlorophenyl)propanoyl]-5-oxidanylidene-spiro[1,2,3,8~{a}-tetrahydroindolizine-6,2'-pyrrolidine]-3-yl]carbonyl-2-oxidanylidene-1,4-diazatricyclo[8.3.0.0^{3,7}]tridec-8-ene-13-carboxamide (RJQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ITMFJTSTZSWDEK-QHVDBZGRSA-N.
