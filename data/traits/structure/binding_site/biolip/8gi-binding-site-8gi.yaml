identifier: proteintraitsmech:BIOLIP_8GI
label: "8GI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(1,2,3,5,6,7-hexahydro-s-indacen-4-yl)-3-[4-(2-oxidanylpropan-2-yl)furan-2-yl]sulfonyl-urea (8GI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HUUSXLKCTQDPGL-UHFFFAOYSA-N.
