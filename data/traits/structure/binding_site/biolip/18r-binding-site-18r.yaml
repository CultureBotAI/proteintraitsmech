identifier: proteintraitsmech:BIOLIP_18R
label: "18R-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-{1-[(3R)-1-acryloylpiperidin-3-yl]-4-amino-1H-pyrazolo[3,4-d]pyrimidin-3-yl}-N-(3-tert-butylphenyl)benzamide (18R) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RMAUIYTVKFMOGP-HSZRJFAPSA-N.
