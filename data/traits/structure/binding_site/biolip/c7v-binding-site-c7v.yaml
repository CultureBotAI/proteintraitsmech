identifier: proteintraitsmech:BIOLIP_C7V
label: "C7V-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-methyl-N-(1-{[4-(trifluoromethyl)phenyl]methyl}-1H-indazol-3-yl)-1,2-oxazole-5-carboxamide (C7V) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KHOZFUGNWQHUQI-UHFFFAOYSA-N.
