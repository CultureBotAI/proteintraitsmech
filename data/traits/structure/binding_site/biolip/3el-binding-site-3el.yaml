identifier: proteintraitsmech:BIOLIP_3EL
label: "3EL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{4-[(3-{2-[(trans-4-aminocyclohexyl)amino]pyrimidin-4-yl}pyridin-2-yl)oxy]naphthalen-1-yl}benzenesulfonamide (3EL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DXCOZKXVDMXKGR-HZCBDIJESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
