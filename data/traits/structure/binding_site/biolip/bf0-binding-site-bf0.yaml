identifier: proteintraitsmech:BIOLIP_BF0
label: "BF0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 4-{[(5beta,6alpha)-17-(cyclopropylmethyl)-3,14-dihydroxy-4,5-epoxymorphinan-6-yl]amino}-4-oxobutanoate (BF0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PGIBGSVRAVGQMY-OIUZVZFJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
