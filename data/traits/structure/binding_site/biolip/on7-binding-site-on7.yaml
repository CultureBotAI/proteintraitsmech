identifier: proteintraitsmech:BIOLIP_ON7
label: "ON7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {1-[(2S,3S)-2-(2,3-dihydro-1H-inden-2-ylmethyl)-3-(3,5-dimethoxy-4-methylphenyl)-3-hydroxypropyl]-4-(methoxycarbonyl)-1 H-pyrrol-3-yl}acetic acid (ON7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PMPFDANPLYTSTM-PWUYWRBVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
