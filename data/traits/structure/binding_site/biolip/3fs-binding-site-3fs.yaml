identifier: proteintraitsmech:BIOLIP_3FS
label: "3FS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(3,5-dichlorophenyl)acetyl]-L-threonyl-N-[(2Z)-2-iminoethyl]glycinamide (3FS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MDMRSQQSLSAMBM-QMIWAGOPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
