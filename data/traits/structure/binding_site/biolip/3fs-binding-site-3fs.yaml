    protein_label: "4PIQ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4piq chain A (resolution 2.07 Å); binding residues: S3 S4 E5 T24 H25 D26 N44 A46 G47 R48 G51 G52 V53 W55 A120 C122"
    source: CURATOR
