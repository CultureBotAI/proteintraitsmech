identifier: proteintraitsmech:BIOLIP_CAC
label: "CAC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CACODYLATE ION (CAC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 6 PDB structures; ligand InChIKey OGGXGZAMXPVRFZ-UHFFFAOYSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
