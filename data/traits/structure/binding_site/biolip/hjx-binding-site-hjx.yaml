identifier: proteintraitsmech:BIOLIP_HJX
label: "HJX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-hydroxy-6-(tetradecyloxy)benzoic acid (HJX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey COUQHIRIFUVLDU-UHFFFAOYSA-N.
