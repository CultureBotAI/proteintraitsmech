identifier: proteintraitsmech:BIOLIP_T3B
label: "T3B-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(2-methylpropanoylamino)-~{N}-[2-[(phenylmethyl)-[4-(phenylsulfamoyl)phenyl]carbonyl-amino]ethyl]-1,3-thiazole-5-carboxamide (T3B) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YVPYJSSYGACUSE-UHFFFAOYSA-N.
