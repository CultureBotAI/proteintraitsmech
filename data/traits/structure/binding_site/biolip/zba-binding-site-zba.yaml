identifier: proteintraitsmech:BIOLIP_ZBA
label: "ZBA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 12,13-Epoxytrichothec-9-ene-3,4,8,15-tetrol-4,15-diacetate-8-isovalerate (ZBA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey JESYGVLQSIZOBZ-QYWOHJEZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
