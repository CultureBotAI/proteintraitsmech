identifier: proteintraitsmech:BIOLIP_UL2
label: "UL2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-((1S,2R)-1-hydroxy-1-(o-tolyl)pentan-2-yl)-2-oxo-2,3-dihydrobenzo[d]oxazole-5-carboxamide (UL2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SNFRXTGIONJORR-QAPCUYQASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
