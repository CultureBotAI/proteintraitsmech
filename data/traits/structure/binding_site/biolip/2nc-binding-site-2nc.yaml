identifier: proteintraitsmech:BIOLIP_2NC
label: "2NC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{(2S)-2-[(N-acetyl-L-threonyl-L-isoleucyl)amino]hexyl}-L-norleucyl-L-glutaminyl-N~5~-[amino(iminio)methyl]-L-ornithinamide (2NC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MQPXOVRKKPPKFZ-QYKDHROSSA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
