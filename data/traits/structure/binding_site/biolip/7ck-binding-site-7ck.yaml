label: "7CK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-carboxy-5-hydroxy-12,13-dihydro-6H-indolo[2,3-a]pyrrolo[3,4-c]carbazole (7CK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LTOZELYBRTWMHC-UHFFFAOYSA-N.
