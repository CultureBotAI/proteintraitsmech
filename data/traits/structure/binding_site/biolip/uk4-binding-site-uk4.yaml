identifier: proteintraitsmech:BIOLIP_UK4
label: "UK4-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(4-{6-[(4-cyano-2-fluorophenyl)methoxy]pyridin-2-yl}piperidin-1-yl)methyl]-1-{[(2S)-oxetan-2-yl]methyl}-1H-benzimidazole-6-carboxylic acid (UK4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HYBAKUMPISVZQP-DEOSSOPVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
