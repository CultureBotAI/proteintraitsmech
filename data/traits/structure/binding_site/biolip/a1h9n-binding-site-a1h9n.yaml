identifier: proteintraitsmech:BIOLIP_A1H9N
label: "A1H9N-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[2-[(1R,2S)-2-[[(2S,5S)-2-(6-azanylpyridin-3-yl)-5-methyl-morpholin-4-yl]methyl]cyclopropyl]ethyl]-1H-indole-2-carboxamide (A1H9N) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JQBHQHNVJCDNEL-SLHLXQHXSA-N.
