identifier: proteintraitsmech:BIOLIP_CKK
label: "CKK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{[4-({5-[(4-aminopiperidin-1-yl)methyl]pyrrolo[2,1-f][1,2,4]triazin-4-yl}oxy)-3-fluorophenyl]carbamoyl}-2-(4-fluorophenyl)acetamide (CKK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YQQFRBUHZZNTGY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
