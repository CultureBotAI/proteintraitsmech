identifier: proteintraitsmech:BIOLIP_SUS
label: "SUS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-deoxy-3,6-di-O-sulfo-2-(sulfoamino)-alpha-D-glucopyranose (SUS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VPSCBZXJXYLJOH-UKFBFLRUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
