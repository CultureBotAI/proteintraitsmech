identifier: proteintraitsmech:BIOLIP_JLN
label: "JLN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-(FORMYLAMINO)-1-(5-O-PHOSPHONO-BETA-D-RIBOFURANOSYL)-1H-IMIDAZOLE-4-CARBOXYLIC ACID (JLN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UEBVPQPUWAADHX-FJGDRVTGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
