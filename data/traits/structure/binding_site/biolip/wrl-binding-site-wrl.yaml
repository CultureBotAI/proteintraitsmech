identifier: proteintraitsmech:BIOLIP_WRL
label: "WRL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{S},5~{S},6~{R})-10-[3,5-bis(chloranyl)phenyl]sulfonyl-5-(hydroxymethyl)-3-[(1~{S})-1-pyridin-2-ylethyl]-3,10-diazabicyclo[4.3.1]decan-2-one (WRL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UHJFWSJLAJJMIN-RSMHBEIYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
