identifier: proteintraitsmech:BIOLIP_PDM
label: "PDM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[4-(2,5-DIOXO-PYRROLIDIN-1-YL)-PHENYLAMINO]-4-HYDROXY-BUTYRIC ACID (PDM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SUETUOGYOWOLNJ-NSHDSACASA-N.
