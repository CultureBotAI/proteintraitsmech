identifier: proteintraitsmech:BIOLIP_ZOE
label: "ZOE-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-({5-[(3aS,4S,5S,6aR)-5-oxido-2-oxohexahydro-1H-thieno[3,4-d]imidazol-4-yl]pentanoyl}amino)hexanoic acid (ZOE) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WVGTVVXHODUEJR-XNCOPMLMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
