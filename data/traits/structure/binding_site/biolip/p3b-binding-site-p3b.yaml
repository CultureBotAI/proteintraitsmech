identifier: proteintraitsmech:BIOLIP_P3B
label: "P3B-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3E,4R,5R)-4,5-dihydroxy-3-{[(Z)-{3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4(1H)-ylidene}methyl]imino}cyclohex-1-ene-1-carboxylic acid (P3B) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KOPNIGHVUGDBMS-FEZKIMOASA-N.
