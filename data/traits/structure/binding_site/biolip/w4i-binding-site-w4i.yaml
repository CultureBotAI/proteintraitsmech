identifier: proteintraitsmech:BIOLIP_W4I
label: "W4I-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S})-3-[(2~{R},3~{R},4~{S},5~{R},6~{R})-6-[[(2~{S},3~{R},4~{S},5~{R},6~{R})-6-(hydroxymethyl)-3,4,5-tris(oxidanyl)oxan-2-yl]oxymethyl]-3,4,5-tris(oxidanyl)oxan-2-yl]oxy-2-[(6~{Z},9~{Z},12~{Z},15~{Z})-octadeca-6,9,12,15-tetraenoyl]oxy-propyl] (5~{Z},8~{Z},11~{Z},14~{Z},17~{Z})-icosa-5,8,11,14,17-pentaenoate (W4I) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 1 PDB structure; ligand InChIKey NCMDMZMGJSDWGY-ZKVZYNAYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
