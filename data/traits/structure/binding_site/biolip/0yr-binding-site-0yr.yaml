identifier: proteintraitsmech:BIOLIP_0YR
label: "0YR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3R,4R)-N,2,3,4,5-pentakis(oxidanyl)pentanamide (0YR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AGVYHANDLPZRFS-BXXZVTAOSA-N.
