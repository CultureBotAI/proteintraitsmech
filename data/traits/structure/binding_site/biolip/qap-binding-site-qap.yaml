    protein_label: "4GQ0 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4gq0 chain A (resolution 2.1 Å); binding residues: W21 Y49 H111 F123 P124 K125 V301 L302"
    source: CURATOR
