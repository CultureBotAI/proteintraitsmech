identifier: proteintraitsmech:BIOLIP_QAP
label: "QAP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-phenylethyl (2E)-3-(3,4-dihydroxyphenyl)prop-2-enoate (QAP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SWUARLUWKZWEBQ-VQHVLOKHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
