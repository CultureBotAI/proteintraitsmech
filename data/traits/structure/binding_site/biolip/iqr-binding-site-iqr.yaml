    protein_label: "7ZHO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7zho chain A (resolution 2.08 Å); binding residues: I48 A61 K63 E77 M107 Q110 L175 D176 F177"
    source: CURATOR
