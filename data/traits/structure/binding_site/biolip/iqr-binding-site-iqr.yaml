identifier: proteintraitsmech:BIOLIP_IQR
label: "IQR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[3-(2-azanylpyrimidin-4-yl)-1~{H}-indol-5-yl]-2-methyl-but-3-yn-2-ol (IQR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YYAZUVAPGBAUDQ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
