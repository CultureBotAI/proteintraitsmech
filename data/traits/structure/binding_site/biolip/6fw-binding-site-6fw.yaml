identifier: proteintraitsmech:BIOLIP_6FW
label: "6FW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-amino-8-[(4-chlorophenyl)sulfanyl]-9-[(2S,4aR,6R,7R,7aS)-2,7-dihydroxy-2-oxotetrahydro-2H,4H-2lambda~5~-furo[3,2-d][1,3,2]dioxaphosphinin-6-yl]-3,9-dihydro-6H-purin-6-one (6FW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ZDJHIEHUVPCEDK-IDTAVKCVSA-N.
