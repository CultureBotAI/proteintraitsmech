identifier: proteintraitsmech:BIOLIP_KDF
label: "KDF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-deoxy-alpha-D-erythro-hex-2-ulofuranosonic acid (KDF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RCUMQJPRQWRUNN-MRKVFDINSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:KDF
synonyms:
  - synonym_text: "3-deoxy-alpha-D-erythro-hex-2-ulofuranosonic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
