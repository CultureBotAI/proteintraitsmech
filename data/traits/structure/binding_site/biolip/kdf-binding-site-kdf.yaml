    protein_label: "2VAR chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2var chain A (resolution 2.1 Å); binding residues: L11 G34 S35 Y90 Y106 R108 I137 R166 G255 D258"
    source: CURATOR
