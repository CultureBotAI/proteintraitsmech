identifier: proteintraitsmech:BIOLIP_402
label: "402-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand dicarbonyl[bis(cyanide-kappaC)]-mu-(iminodimethanethiolatato-1kappaS:2kappaS)-mu-(oxomethylidene)diiron(2+) (402) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey LJPDYWPSPOWMIB-UHFFFAOYSA-N.
