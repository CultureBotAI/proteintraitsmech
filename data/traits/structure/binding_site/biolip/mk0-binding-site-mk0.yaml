identifier: proteintraitsmech:BIOLIP_MK0
label: "MK0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-O-[(S)-hydroxy{[(4S,8S,16S,20S)-4,8,12,16,20-pentamethylheptacosyl]oxy}phosphoryl]-beta-D-mannopyranose (MK0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BWDAWKXFHWFXEQ-RIEBCBCMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:MK0
synonyms:
  - synonym_text: "1-O-[(S)-hydroxy{[(4S,8S,16S,20S)-4,8,12,16,20-pentamethylheptacosyl]oxy}phosphoryl]-beta-D-mannopyranose-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P29016
    protein_label: "3OV6 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3ov6 chain A (resolution 2.502 Å); binding residues: V12 Q14 G28 G39 W40 L69 F70 F72 Y73 L74 L162 C167 F170"
    source: CURATOR
