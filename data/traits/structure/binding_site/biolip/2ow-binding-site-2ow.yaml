identifier: proteintraitsmech:BIOLIP_2OW
label: "2OW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl 4-(2-fluoro-3-{[(6-methylpyridin-3-yl)carbamoyl]amino}benzyl)piperazine-1-carboxylate (2OW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey RFUBTTPMWSKEIW-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:2OW
synonyms:
  - synonym_text: "methyl 4-(2-fluoro-3-{[(6-methylpyridin-3-yl)carbamoyl]amino}benzyl)piperazine-1-carboxylate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P12883
    protein_label: "4PA0 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4pa0 chain A (resolution 2.25 Å); binding residues: A91 S118 F121 M493 V698 G701 I702 C705 P710 N711 R712"
    source: CURATOR
