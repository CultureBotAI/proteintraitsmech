identifier: proteintraitsmech:BIOLIP_B6G
label: "B6G-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-amino-3-methylbutanoyl (2S,3S,4R,5R)-5-(6-amino-9H-purin-9-yl)-3,4-dihydroxyoxolan-2-yl hydrogen (S)-phosphate (B6G) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PJUFCHCQTYUTMG-JDUCOKCXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
