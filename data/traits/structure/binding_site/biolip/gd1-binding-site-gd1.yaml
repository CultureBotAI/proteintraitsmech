identifier: proteintraitsmech:BIOLIP_GD1
label: "GD1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-amino-5-[(Z)-iminomethyl]-3,7-dihydro-4H-pyrrolo[2,3-d]pyrimidin-4-one (GD1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 2 PDB structures; ligand InChIKey BETPBINTBSWYLZ-QPIMQUGISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
