    protein_label: "1L3L chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1l3l chain B (resolution 1.66 Å); binding residues: L40 Y53 W57 Y61 D70 W85 F101 Y102 A105"
    source: CURATOR
