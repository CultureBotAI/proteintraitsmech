identifier: proteintraitsmech:BIOLIP_HSM
label: "HSM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand HISTAMINE (HSM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 11 binding-site occurrences across 8 PDB structures; ligand InChIKey NTYJJOPFIAHURM-UHFFFAOYSA-N.
