identifier: proteintraitsmech:BIOLIP_R34
label: "R34-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-{[6-chloro-5-(1-methyl-1H-indol-5-yl)-1H-benzimidazol-2-yl]oxy}-N-hydroxy-2-methylbenzamide (R34) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey SCEVBRBKKQZTKM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
