identifier: proteintraitsmech:BIOLIP_9DJ
label: "9DJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[({(1R)-6-[methyl(phenyl)amino]-1,2,3,4-tetrahydronaphthalen-1-yl}methyl)amino]pyridine-4-carboxylic acid (9DJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XSMABFRQESMONQ-SFHVURJKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
