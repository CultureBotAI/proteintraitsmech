identifier: proteintraitsmech:BIOLIP_HO6
label: "HO6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(4-methylphenyl)sulfanyl]-1,2,3-thiadiazole-4-carboxylic acid (HO6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PNOGJHWZHLJICV-UHFFFAOYSA-N.
