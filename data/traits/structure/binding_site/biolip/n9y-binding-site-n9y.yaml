identifier: proteintraitsmech:BIOLIP_N9Y
label: "N9Y-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S)-2-{(2R)-2-(cyclopentylmethyl)-3-[formyl(hydroxy)amino]propanoyl}-N-(pyridin-2-yl)hexahydropyridazine-3-carboxamide (N9Y) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IGYIJLMSSQSKHF-SJORKVTESA-N.
