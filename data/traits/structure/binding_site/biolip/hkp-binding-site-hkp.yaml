identifier: proteintraitsmech:BIOLIP_HKP
label: "HKP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (7R)-8-cyclopentyl-7-(cyclopentylmethyl)-2-[(3,5-dichloro-4-hydroxyphenyl)amino]-5-methyl-7,8-dihydropteridin-6(5H)-one (HKP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AEZJZTFWCDAUDF-LJQANCHMSA-N.
