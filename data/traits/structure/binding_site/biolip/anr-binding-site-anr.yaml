identifier: proteintraitsmech:BIOLIP_ANR
label: "ANR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ANHYDRORETINOL (ANR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FWNRILWHNGFAIN-OYUWDNMLSA-N.
