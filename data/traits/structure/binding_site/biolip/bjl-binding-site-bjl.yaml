identifier: proteintraitsmech:BIOLIP_BJL
label: "BJL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(3R)-4-ethoxy-3-hydroxy-4-oxobutanoyl]-L-tyrosine (BJL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NGFYRWHZMJJCIF-NWDGAFQWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
