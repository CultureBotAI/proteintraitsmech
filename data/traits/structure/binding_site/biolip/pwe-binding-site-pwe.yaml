    protein_label: "6WHG chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6whg chain A (resolution 3.1 Å); binding residues: S297 F298 W299 F302 P346 F347 S350 L354 E357 L366 K370 L476 Q479 R483"
    source: CURATOR
