identifier: proteintraitsmech:BIOLIP_PLG
label: "PLG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-GLYCINE-[3-HYDROXY-2-METHYL-5-PHOSPHONOOXYMETHYL-PYRIDIN-4-YL-METHANE] (PLG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 14 binding-site occurrences across 9 PDB structures; ligand InChIKey FEVQWBMNLWUBTF-UHFFFAOYSA-N.
