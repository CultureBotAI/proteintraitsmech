identifier: proteintraitsmech:BIOLIP_E2J
label: "E2J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-(2-{4-[bis(4-fluorophenyl)methylidene]piperidin-1-yl}ethyl)-7-methyl-5H-[1,3]thiazolo[3,2-a]pyrimidin-5-one (E2J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JUQLTPCYUFPYKE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
