identifier: proteintraitsmech:BIOLIP_SSV
label: "SSV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3E,5E,7E,9E,11E,13E)-pentadeca-3,5,7,9,11,13-hexaen-2-one (SSV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IKKRHADMXZRWGK-IDFWPVMJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
