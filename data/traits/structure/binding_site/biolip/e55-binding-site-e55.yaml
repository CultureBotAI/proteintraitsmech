definition: >-
  A structure-derived ligand-binding site at which the ligand 3-O-DECYL-2-DEOXY-6-O-{2-DEOXY-3-O-[(3R)-3-METHOXYDECYL]-6-O-METHYL-2-[(11Z)-OCTADEC-11-ENOYLAMINO]-4-O-PHOSPHONO-BETA-D-GLUCOPYRANOSYL}-2-[(3-OXOTETRADECANOYL)AMINO]-1-O-PHOSPHONO-ALPHA-D-GLUCOPYRANOSE (E55) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BPSMYQFMCXXNPC-MFCPCZTFSA-N.
