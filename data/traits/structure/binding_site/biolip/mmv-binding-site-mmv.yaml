    protein_label: "7K62 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7k62 chain A (resolution 2.05 Å); binding residues: I4 W5 A6 D26 L27 F30 K31 L49 P50 L56 R59 I94"
    source: CURATOR
