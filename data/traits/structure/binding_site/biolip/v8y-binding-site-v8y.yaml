identifier: proteintraitsmech:BIOLIP_V8Y
label: "V8Y-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 7-{[(5-chloronaphthalen-1-yl)sulfonyl]amino}heptanoic acid (V8Y) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MGDCSPFNRAHLFD-UHFFFAOYSA-N.
