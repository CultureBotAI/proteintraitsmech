identifier: proteintraitsmech:BIOLIP_VNR
label: "VNR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-deoxy-1-[(4aR)-4a-[(2Z)-2-(2-{[(S)-hydroxy(phosphonooxy)phosphoryl]oxy}ethyl)but-2-en-1-yl]-7,8-dimethyl-2,4-dioxo-3,4,4a,5-tetrahydrobenzo[g]pteridin-10(2H)-yl]-5-O-phosphono-D-ribitol (VNR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OAOWJIIZSRFUAL-QCJQWHCGSA-N.
