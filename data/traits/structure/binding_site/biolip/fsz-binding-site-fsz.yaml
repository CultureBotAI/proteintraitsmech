identifier: proteintraitsmech:BIOLIP_FSZ
label: "FSZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[3-piperidin-4-yl-5-(trifluoromethyl)phenyl]guanidine (FSZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SVJLJEMEWHBCNB-UHFFFAOYSA-N.
