identifier: proteintraitsmech:BIOLIP_WJP
label: "WJP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand methyl (3R,6Z,10E,14E)-3,7,11,15,19-pentamethylicosa-6,10,14,18-tetraen-1-yl dihydrogen diphosphate (WJP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey GDOCHZBDTMOKKR-FEJNUDJDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:WJP
synonyms:
  - synonym_text: "methyl (3R,6Z,10E,14E)-3,7,11,15,19-pentamethylicosa-6,10,14,18-tetraen-1-yl dihydrogen diphosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q29466
    protein_label: "7KHR chain a (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7khr chain a (resolution 3.62 Å); binding residues: S535 K539 I591 K594 S608 L609 L610 I614"
    source: CURATOR
  - protein_id: UniProtKB:P25286
    protein_label: "9BRD chain a (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 9brd chain a (resolution 3.5 Å); binding residues: S535 K539 S608 L609 L610 I733"
    source: CURATOR
