identifier: proteintraitsmech:BIOLIP_T1K
label: "T1K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[5-[ethyl(methyl)amino]imidazo[1,2-a]pyrimidin-7-yl]phenol (T1K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SYAAVLGXDXOBNI-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
