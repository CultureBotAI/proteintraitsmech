identifier: proteintraitsmech:BIOLIP_HVD
label: "HVD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1'R,2'R)-5'-methyl-6-pentyl-2'-(prop-1-en-2-yl)-1',2',3',4'-tetrahydro[1,1'-biphenyl]-2,4-diol (HVD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey YWEZXUNAYVCODW-RBUKOAKNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
