definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,3S,Z)-5-(2-((3aS,7aS,E)-1-(6-hydroxy-6-methylhept-1-en-1-ylidene)-7a-methyloctahydro-4H-inden-4-ylidene)ethylidene)-4-methylenecyclohexane-1,3-diol (T0H) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZUEJBGWNHJHNIO-PIOXGFLRSA-N.
