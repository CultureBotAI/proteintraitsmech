identifier: proteintraitsmech:BIOLIP_ACJ
label: "ACJ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[2-CHLORO-4-(TRIFLUOROMETHYL)PHENOXY]-2-NITROBENZOIC ACID (ACJ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey NUFNQYOELLVIPL-UHFFFAOYSA-N.
