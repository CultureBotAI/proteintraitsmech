definition: >-
  A structure-derived ligand-binding site at which the ligand tri(methyl)-[2-[[(2~{R})-2-[(~{Z})-octadec-9-enoyl]oxy-3-[(~{E})-1-oxidanylideneoctadec-9-enoxy]propoxy]-oxidanyl-phosphoryl]oxyethyl]azanium (WSS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 11 binding-site occurrences across 1 PDB structure; ligand InChIKey SNKAWJBJQDLSFF-TWROKUQOSA-O.
