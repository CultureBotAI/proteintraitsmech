identifier: proteintraitsmech:BIOLIP_TPT
label: "TPT-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,2':6',2''-TERPYRIDINE PLATINUM(II) Chloride (TPT) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 3 PDB structures; ligand InChIKey XTQMQLRZXBEQCS-UHFFFAOYSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
