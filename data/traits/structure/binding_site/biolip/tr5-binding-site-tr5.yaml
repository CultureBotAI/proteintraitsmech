identifier: proteintraitsmech:BIOLIP_TR5
label: "TR5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-methyl-1-(5-O-phosphono-beta-D-ribofuranosyl)-1,5-dihydro-1,4,5,6,8-pentaazaacenaphthylen-3-amine (TR5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey URLYINUFLXOMHP-HTVVRFAVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
