identifier: proteintraitsmech:BIOLIP_5P2
label: "5P2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-cyano-4-[2-[2-(1-ethylazetidin-3-yl)pyrazol-3-yl]-4-(trifluoromethyl)phenoxy]-~{N}-(1,2,4-thiadiazol-5-yl)benzenesulfonamide (5P2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UCAVSLIXTXZSRD-UHFFFAOYSA-N.
