identifier: proteintraitsmech:BIOLIP_OZ2
label: "OZ2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R)-3-{[(R)-{[(2S)-2,3-dihydroxypropyl]oxy}(hydroxy)phosphoryl]oxy}-2-[(6Z)-tridec-6-enoyloxy]propyl (9Z)-octadec-9-enoate (OZ2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YOPHQENQMRACBJ-BMAOJOIDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
