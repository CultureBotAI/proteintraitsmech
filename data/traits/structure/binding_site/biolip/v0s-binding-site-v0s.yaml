    protein_label: "7ZI0 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7zi0 chain A (resolution 3.0 Å); binding residues: I215 N219 L221 M301 Y394 K395 D577 E585 F588 P617 E622"
    source: CURATOR
