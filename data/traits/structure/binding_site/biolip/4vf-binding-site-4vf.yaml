identifier: proteintraitsmech:BIOLIP_4VF
label: "4VF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[(1S)-1-(3-chlorophenyl)-2-hydroxyethyl]-7-[2-(tetrahydro-2H-pyran-4-ylamino)pyrimidin-4-yl]-3,4-dihydropyrrolo[1,2-a]pyrazin-1(2H)-one (4VF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PJPXAFCTLKCTJP-JOCHJYFZSA-N.
