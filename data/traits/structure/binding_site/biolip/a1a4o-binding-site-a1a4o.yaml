identifier: proteintraitsmech:BIOLIP_A1A4O
label: "A1A4O-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,7P)-7-[4-ethyl-3-(hydroxymethyl)-5-oxo-4,5-dihydro-1H-1,2,4-triazol-1-yl]-6-fluoro-3-(2-methylphenyl)-1-(propan-2-yl)-2,3-dihydroquinolin-4(1H)-one (A1A4O) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NFPQVNXNEFSIKP-GOSISDBHSA-N.
