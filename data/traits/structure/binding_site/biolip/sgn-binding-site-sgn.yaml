identifier: proteintraitsmech:BIOLIP_SGN
label: "SGN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-deoxy-6-O-sulfo-2-(sulfoamino)-alpha-D-glucopyranose (SGN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 23 binding-site occurrences across 15 PDB structures; ligand InChIKey DQTRACMFIGDHSN-UKFBFLRUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
