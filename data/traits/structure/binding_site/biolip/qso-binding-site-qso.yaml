identifier: proteintraitsmech:BIOLIP_QSO
label: "QSO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5,7-dihydroxy-3-(4-methoxyphenyl)-4H-chromen-4-one (QSO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WUADCCWRTIWANL-UHFFFAOYSA-N.
