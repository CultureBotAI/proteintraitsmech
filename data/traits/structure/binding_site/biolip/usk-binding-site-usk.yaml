identifier: proteintraitsmech:BIOLIP_USK
label: "USK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S})-4-(4-hydroxyphenyl)-~{N}-oxidanyl-3-[5-[[(5-phenylthiophen-2-yl)sulfonylamino]methyl]-1,2,3-triazol-1-yl]butanamide (USK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YNJVRCJGXCXRMB-SFHVURJKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
