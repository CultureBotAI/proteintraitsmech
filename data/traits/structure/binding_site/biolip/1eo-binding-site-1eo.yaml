identifier: proteintraitsmech:BIOLIP_1EO
label: "1EO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1s,4s)-4-[8-(2-fluorophenoxy)[1,2,4]triazolo[4,3-a]pyridin-3-yl]bicyclo[2.2.1]heptan-1-ol (1EO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey WEOITARZWXYXSX-KDURUIRLSA-N.
