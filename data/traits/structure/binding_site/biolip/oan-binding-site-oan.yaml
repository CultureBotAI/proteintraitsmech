identifier: proteintraitsmech:BIOLIP_OAN
label: "OAN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand O-(2-ACETAMIDO-2-DEOXY D-GLUCOPYRANOSYLIDENE) AMINO-N-PHENYLCARBAMATE (OAN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey PBLNJFVQMUMOJY-JXZOILRNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
