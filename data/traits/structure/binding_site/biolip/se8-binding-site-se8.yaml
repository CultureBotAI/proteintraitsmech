definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(2-{[(3S)-5-{[(2S)-2-amino-2-carboxyethyl]amino}-3-carboxy-3-hydroxy-5-oxopentanoyl]amino}ethyl)amino]-2,5-dioxopentanoic acid (SE8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SIAZVTIHOHTZDD-PWJLMRLQSA-N.
