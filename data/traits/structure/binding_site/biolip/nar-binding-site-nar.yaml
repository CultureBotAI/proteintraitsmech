identifier: proteintraitsmech:BIOLIP_NAR
label: "NAR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand NARINGENIN (NAR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 7 binding-site occurrences across 6 PDB structures; ligand InChIKey FTVWIRXFELQLPI-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
