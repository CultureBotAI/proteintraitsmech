identifier: proteintraitsmech:BIOLIP_3DS
label: "3DS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4S,5R)-4,5-dihydroxy-3-oxocyclohex-1-ene-1-carboxylic acid (3DS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey SLWWJZMPHJJOPH-PHDIDXHHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
