identifier: proteintraitsmech:BIOLIP_G9S
label: "G9S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand S-[2-({N-[(2S)-2-hydroxy-3,3-dimethyl-4-(phosphonooxy)butanoyl]-beta-alanyl}amino)ethyl] hexadecanethioate (G9S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JSWBEHRITPIXLC-RUZDIDTESA-N.
