identifier: proteintraitsmech:BIOLIP_UMA
label: "UMA-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand URIDINE-5'-DIPHOSPHATE-N-ACETYLMURAMOYL-L-ALANINE (UMA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey NTMMCWJNQNKACG-KBKUWGQMSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:UMA
synonyms:
