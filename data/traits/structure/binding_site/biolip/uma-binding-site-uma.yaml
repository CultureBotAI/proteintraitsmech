    protein_label: "2JFN chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2jfn chain A (resolution 1.9 Å); binding residues: L100 R104 G113 V114 V115 P116 A117 K119 P120 S227 A230 I231 R234"
    source: CURATOR
