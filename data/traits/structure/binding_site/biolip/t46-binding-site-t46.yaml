identifier: proteintraitsmech:BIOLIP_T46
label: "T46-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand dTDP-4-keto-6-deoxyglucose (T46) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey PSXWNITXWWECNY-UCBTUHGZSA-N.
