identifier: proteintraitsmech:BIOLIP_ZL1
label: "ZL1-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[4-({2-[(cyclopropanecarbonyl)amino]pyridin-4-yl}oxy)-3-fluorophenyl]-1-(4-fluorophenyl)-2-oxo-1,2-dihydropyridine-3-carboxamide (ZL1) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UFWJGUUHERHCOL-UHFFFAOYSA-N.
