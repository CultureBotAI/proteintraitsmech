identifier: proteintraitsmech:BIOLIP_VTN
label: "VTN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{2-[4-chloro-3-(3-chloro-5-cyanophenoxy)phenyl]ethyl}prop-2-enamide (VTN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NTQXELUQORLKIR-UHFFFAOYSA-N.
