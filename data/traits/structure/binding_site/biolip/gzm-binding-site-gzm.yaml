identifier: proteintraitsmech:BIOLIP_GZM
label: "GZM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[(3',5'-dichloro[1,1'-biphenyl]-4-yl)methyl]-N-ethyl-1-(methoxyacetyl)piperidine-4-carboxamide (GZM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CRYYCXAJUDVWAO-UHFFFAOYSA-N.
