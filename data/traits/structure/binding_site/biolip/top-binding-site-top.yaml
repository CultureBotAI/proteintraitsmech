identifier: proteintraitsmech:BIOLIP_TOP
label: "TOP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand TRIMETHOPRIM (TOP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 6 binding-site occurrences across 6 PDB structures; ligand InChIKey IEDVJHCEMCRBQM-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
