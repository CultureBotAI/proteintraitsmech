definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[2-[[5-[(1~{R})-1-[3,5-bis(chloranyl)pyridin-4-yl]ethoxy]-1~{H}-indazol-3-yl]amino]-3-fluoranyl-5-(4-morpholin-4-ylpiperidin-1-yl)phenyl]propanamide (90F) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DZCSXXJKTFXZJX-LJQANCHMSA-N.
