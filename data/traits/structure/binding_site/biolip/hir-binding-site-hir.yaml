    protein_label: "7UOR chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7uor chain A (resolution 3.16 Å); binding residues: M68 L69 H76 R80 G210 G213 T214 P253 R259 S309 F310 H315 G317 L318 G319"
    source: CURATOR
