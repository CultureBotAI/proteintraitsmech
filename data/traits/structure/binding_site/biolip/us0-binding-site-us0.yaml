identifier: proteintraitsmech:BIOLIP_US0
label: "US0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[3,5-bis(fluoranyl)phenyl]carbonylamino]-~{N}-piperidin-4-yl-1~{H}-pyrazole-3-carboxamide (US0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NIHAFOURWLZLFN-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
