identifier: proteintraitsmech:BIOLIP_MKG
label: "MKG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-fluoro-N-{(2S)-1-[(5R)-5-(3-fluorophenyl)-2-oxo-1-oxa-3,9-diazaspiro[5.5]undecan-9-yl]propan-2-yl}benzamide (MKG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey QLCFHHJOCOKGIV-KKSFZXQISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
