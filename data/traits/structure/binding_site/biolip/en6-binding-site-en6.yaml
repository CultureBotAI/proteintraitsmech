identifier: proteintraitsmech:BIOLIP_EN6
label: "EN6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-(2-hydroxyethyl)-5-(hydroxymethyl)-3-methyl-1-[2-[[3-(trifluoromethyl)phenyl]methyl]-1-benzothiophen-7-yl]pyrazole-4-carboxamide (EN6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey VJMRKWPMFQGIPI-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
