    protein_label: "6ZFZ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6zfz chain A (resolution 2.17 Å); binding residues: S78 Y82 D105 Y106 S109 C178 Y404 Y408"
    source: CURATOR
