identifier: proteintraitsmech:BIOLIP_GFR
label: "GFR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[(3S,4S,5R)-4-(hydroxymethyl)-5-(3-methoxy-4-oxidanyl-phenyl)oxolan-3-yl]methyl]-2-methoxy-phenol (GFR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MHXCIKYXNYCMHY-SXGZJXTBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
