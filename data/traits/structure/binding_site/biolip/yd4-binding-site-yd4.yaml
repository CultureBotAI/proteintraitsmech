definition: >-
  A structure-derived ligand-binding site at which the ligand 4-({[(3R,4R)-4-{[3-methyl-5-(5-methylpyridin-3-yl)-2-oxo-1,2-dihydro-1,7-naphthyridin-8-yl]amino}piperidin-3-yl]oxy}methyl)-1lambda~6~-thiane-1,1-dione (YD4) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZIRMKCLZUOCUSC-DHIUTWEWSA-N.
