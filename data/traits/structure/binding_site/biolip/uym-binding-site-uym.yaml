identifier: proteintraitsmech:BIOLIP_UYM
label: "UYM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,6S)-3,6-bis[(1H-indol-3-yl)methyl]piperazine-2,5-dione (UYM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DNHODRZUCGXYKU-PMACEKPBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
