identifier: proteintraitsmech:BIOLIP_N22
label: "N22-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[3-(2,5-dimethoxyphenyl)prop-1-yn-1-yl]-6-ethylpyrimidine-2,4-diamine (N22) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey NNFDQABYXZBKRK-UHFFFAOYSA-N.
