identifier: proteintraitsmech:BIOLIP_5KR
label: "5KR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-({3-[(4-bromophenyl)sulfamoyl]-4-methylbenzoyl}amino)benzoic acid (5KR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey UMIZGACLAWLSMJ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
