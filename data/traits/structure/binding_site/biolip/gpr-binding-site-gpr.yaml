identifier: proteintraitsmech:BIOLIP_GPR
label: "GPR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (9R,10R)-9-(S-GLUTATHIONYL)-10-HYDROXY-9,10-DIHYDROPHENANTHRENE (GPR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JNNIZILNBMPOAC-MOXQZVSFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
