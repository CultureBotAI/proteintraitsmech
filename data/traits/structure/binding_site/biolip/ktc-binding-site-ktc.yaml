identifier: proteintraitsmech:BIOLIP_KTC
label: "KTC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 10-oxooctadecanoic acid (KTC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey BGKROBBCCGUUCF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
