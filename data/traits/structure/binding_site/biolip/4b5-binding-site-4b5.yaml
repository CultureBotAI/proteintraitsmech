identifier: proteintraitsmech:BIOLIP_4B5
label: "4B5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{(2R,4S,5S)-2-benzyl-5-[(tert-butoxycarbonyl)amino]-4-hydroxy-6-phenylhexanoyl}-L-leucyl-L-phenylalaninamide (4B5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MURCDOXDAHPNRQ-OWIQAHIBSA-N.
