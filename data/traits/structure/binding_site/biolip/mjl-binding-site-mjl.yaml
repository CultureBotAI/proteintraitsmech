label: "MJL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S},3~{S},4~{R},5~{R},6~{R})-4,5-diacetamido-6-[[[(2~{R},3~{S},4~{R},5~{R})-5-[2,4-bis(oxidanylidene)pyrimidin-1-yl]-3,4-bis(oxidanyl)oxolan-2-yl]methoxy-oxidanyl-phosphoryl]oxy-oxidanyl-phosphoryl]oxy-3-oxidanyl-oxane-2-carboxylic acid (MJL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GZLIMKLKXDFTJR-LTMKHLKMSA-N.
