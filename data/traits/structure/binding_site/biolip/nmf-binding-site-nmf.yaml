identifier: proteintraitsmech:BIOLIP_NMF
label: "NMF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-[(2R)-2-(fluoromethyl)-3-hydroxy-propyl]-1,5-dimethyl-pyrimidine-2,4-dione (NMF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OHXHFKXQCMBBKV-ZETCQYMHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
