    protein_label: "3HDM chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3hdm chain A (resolution 2.6 Å); binding residues: I104 G107 V112 A125 L176 I179 E183 L229 T239"
    source: CURATOR
