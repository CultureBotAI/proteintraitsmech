identifier: proteintraitsmech:BIOLIP_MMG
label: "MMG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-(5-phenyl-1H-pyrrolo[2,3-b]pyridin-3-yl)benzoic acid (MMG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KSFDVNIKNYXUIP-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:MMG
synonyms:
