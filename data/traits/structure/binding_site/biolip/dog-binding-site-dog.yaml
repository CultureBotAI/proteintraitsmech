identifier: proteintraitsmech:BIOLIP_DOG
label: "DOG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand DIGOXIGENIN (DOG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 4 PDB structures; ligand InChIKey SHIBSTMRCDJXLN-KCZCNTNESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
