synonyms:
  - synonym_text: "DIGOXIGENIN-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:Q9HYR3
    protein_label: "4J8T chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4j8t chain A (resolution 2.05 Å); binding residues: L14 Y34 H54 F58 Y101 Y115 L117 V124"
    source: CURATOR
