identifier: proteintraitsmech:BIOLIP_GS0
label: "GS0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Bacteriochlorophyll A isomer (GS0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey DSJXIQQMORJERS-NDWDOOJPSA-M.
