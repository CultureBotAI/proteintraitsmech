identifier: proteintraitsmech:BIOLIP_OAX
label: "OAX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-chloranyl-N-[[cyclopropylmethyl(methanoyl)amino]methyl]benzamide (OAX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZKBKHQJPIDEDKI-UHFFFAOYSA-N.
