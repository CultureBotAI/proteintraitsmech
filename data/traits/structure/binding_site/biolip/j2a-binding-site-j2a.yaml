identifier: proteintraitsmech:BIOLIP_J2A
label: "J2A-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,5R,7R,8R,10R,12aR,14R,15R,15aS,16R)-7-(2-amino-6-oxo-3,6-dihydro-9H-purin-9-yl)-14-(6-amino-9H-purin-9-yl)-15,16-dihydroxy-2,10-disulfanyloctahydro-2H,10H,12H-5,8-methano-2lambda~5~,10lambda~5~-furo[3,2-l][1,3,6,9,11,2,10]pentaoxadiphosphacyclotetradecine-2,10-dione (J2A) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NVOTUSOAWRDABP-JRZJYRHUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
