definition: >-
  A structure-derived ligand-binding site at which the ligand 2-hydroxy-7-methoxy-5-methyl naphthoic acid (7NA) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LYGUXQMPYLCEGL-UHFFFAOYSA-N.
