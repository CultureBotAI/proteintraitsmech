identifier: proteintraitsmech:BIOLIP_A1AHH
label: "A1AHH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(4-cyclopropylphenyl)-N-{(1R)-1-[5-(2,2,2-trifluoroethoxy)pyridin-2-yl]ethyl}acetamide (A1AHH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GEYDMBNDOVPFJL-CYBMUJFWSA-N.
