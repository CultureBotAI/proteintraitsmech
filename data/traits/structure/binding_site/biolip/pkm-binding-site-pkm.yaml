identifier: proteintraitsmech:BIOLIP_PKM
label: "PKM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-O-acetyl-5-acetamido-3,5-dideoxy-D-glycero-alpha-D-galacto-non-2-ulopyranosonic acid (PKM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey LVBIMVQYUKOENY-CYBLFPARSA-N.
