    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P00720
    protein_label: "6D26 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6d26 chain A (resolution 2.798 Å); binding residues: F87 F111 R170 M181 C182 Y184 Y2262 P2287 T2290"
    source: CURATOR
