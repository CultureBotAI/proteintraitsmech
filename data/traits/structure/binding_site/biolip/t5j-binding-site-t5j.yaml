identifier: proteintraitsmech:BIOLIP_T5J
label: "T5J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(3-fluoro-4-methyl-anilino)-4-methyl-quinolin-5-ol (T5J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YIACXICIQWGRMA-UHFFFAOYSA-N.
