identifier: proteintraitsmech:BIOLIP_0LI
label: "0LI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-(imidazo[1,2-b]pyridazin-3-ylethynyl)-4-methyl-N-{4-[(4-methylpiperazin-1-yl)methyl]-3-(trifluoromethyl)phenyl}benzam ide (0LI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey PHXJVRSECIGDHY-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
