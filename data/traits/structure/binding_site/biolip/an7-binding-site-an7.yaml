identifier: proteintraitsmech:BIOLIP_AN7
label: "AN7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3E)-4-{3-hydroxy-2-methyl-5-[(phosphonooxy)methyl]pyridin-4-yl}-2-oxobut-3-enoic acid (AN7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey FYMYHYJKCICXRI-NSCUHMNNSA-N.
