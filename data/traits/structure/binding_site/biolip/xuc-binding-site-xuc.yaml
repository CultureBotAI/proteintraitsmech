identifier: proteintraitsmech:BIOLIP_XUC
label: "XUC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4-[(2~{R})-2-[(4-chlorophenyl)methyl]pyrrolidin-1-yl]piperidin-1-yl]pyridine (XUC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XCVVDQHGTQAUAD-HXUWFJFHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
