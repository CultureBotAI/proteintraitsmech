identifier: proteintraitsmech:BIOLIP_2OX
label: "2OX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3R,4S,5S)-2-methyl-5-(1-phenyl-1H-1,2,3-triazol-4-yl)pyrrolidine-3,4-diol (2OX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HPPFSIKUULBMIZ-KNDHEWATSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
