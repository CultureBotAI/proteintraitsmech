identifier: proteintraitsmech:BIOLIP_81D
label: "81D-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (S)-3-(Aminomethyl)-4-chloro-7-(2-hydroxyethoxy)benzo[c][1,2]oxaborol-1(3H)-ol (81D) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YICHWMJUJYFTAX-RIMGRJFKSA-N.
