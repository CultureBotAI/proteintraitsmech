label: "HZB-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{R},3~{S},4~{R},5~{R})-5-[(2~{S},3~{R},4~{S},5~{R})-3,4,5-tris(oxidanyl)oxan-2-yl]oxycyclohexane-1,2,3,4-tetrol (HZB) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SGBDCDJBWZGHGQ-VBGDNJFTSA-N.
