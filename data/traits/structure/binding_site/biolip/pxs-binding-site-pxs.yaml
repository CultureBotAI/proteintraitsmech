    protein_label: "3A79 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3a79 chain A (resolution 2.9 Å); binding residues: L261 F266 L269 F284 L317 F325 S346 K347 V348 F349 L350 P352 F355"
    source: CURATOR
