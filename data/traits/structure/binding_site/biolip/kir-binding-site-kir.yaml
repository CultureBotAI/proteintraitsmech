identifier: proteintraitsmech:BIOLIP_KIR
label: "KIR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand KIRROMYCIN (KIR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey HMSYAPGFKGSXAJ-PAHGNTJYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:KIR
synonyms:
  - synonym_text: "KIRROMYCIN-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0CE48
    protein_label: "1OB2 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1ob2 chain A (resolution 3.35 Å); binding residues: L120 R123 Q124 Y160 D161 D314 E315 R333 R373 F374 A375 A385"
    source: CURATOR
  - protein_id: UniProtKB:Q5SHN6
    protein_label: "4V5P chain AZ (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4v5p chain AZ (resolution 3.1 Å); binding residues: L121 R124 Q125 V126 Y161 E162 E327 G328 Y343 F344 R385 F386 A387 T394 A397"
    source: CURATOR
