identifier: proteintraitsmech:BIOLIP_RCP
label: "RCP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3R)-1'-(9-ANTHRYLCARBONYL)-3-(MORPHOLIN-4-YLCARBONYL)-1,4'-BIPIPERIDINE (RCP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey LDQKDRLEMKIYMC-XMMPIXPASA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
