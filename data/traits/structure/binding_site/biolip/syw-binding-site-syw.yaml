label: "SYW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (R)-6-((2-methyl-4-(1-methyl-1H-indole-5-carbonyl)piperazin-1-yl)sulfonyl)benzo[d]oxazol-2(3H)-one (SYW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RNXDBFXSUVUJIV-CQSZACIVSA-N.
