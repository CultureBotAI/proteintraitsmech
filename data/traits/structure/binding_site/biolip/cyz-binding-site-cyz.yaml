      snippet: P494 F495 M496 S497 K763
      notes: 'BioLiP2 record line for PDB 5weo chain A, ligand CYZ: binding-site residues in PDB author
        numbering (column 8 of BioLiP_nr.txt), cross-checked against BioLiP''s own receptor sequence via
