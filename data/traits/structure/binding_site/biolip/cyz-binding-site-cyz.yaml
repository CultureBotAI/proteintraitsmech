identifier: proteintraitsmech:BIOLIP_CYZ
label: "CYZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CYCLOTHIAZIDE (CYZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey BOCUKUHCLICSIY-KSCJFIISSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:CYZ
synonyms:
  - synonym_text: "CYCLOTHIAZIDE-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:O88602
    protein_label: "5WEO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5weo chain A (resolution 4.2 Å); binding residues: P494 F495 M496 S497 K763"
    source: CURATOR
causal_graphs:
