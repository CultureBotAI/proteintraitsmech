identifier: proteintraitsmech:BIOLIP_LTX
label: "LTX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5~{S},6~{R},7~{E},9~{E},11~{Z},14~{Z})-6-[(2~{R})-2-[[(4~{S})-4-azanyl-5-oxidanyl-5-oxidanylidene-pentanoyl]amino]-3-( 2-hydroxy-2-oxoethylamino)-3-oxidanylidene-propyl]sulfanyl-5-oxidanyl-icosa-7,9,11,14-tetraenoic acid (LTX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GWNVDXQDILPJIG-NXOLIXFESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
