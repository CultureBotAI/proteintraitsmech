definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S})-2-(6-chloranyl-7-methyl-1~{H}-benzimidazol-2-yl)-2-methyl-pyrrolidin-1-yl]-[5-methoxy-2-(1,2,3-triazol-2-yl)phenyl]methanone (NS2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NBGABHGMJVIVBW-QHCPKHFHSA-N.
