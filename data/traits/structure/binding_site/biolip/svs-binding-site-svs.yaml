identifier: proteintraitsmech:BIOLIP_SVS
label: "SVS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5'-deoxy-5'-({[2-(2-hydroxyphenyl)ethyl]sulfonyl}amino)adenosine (SVS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NIEGSPNRJDKALY-SCFUHWHPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:SVS
synonyms:
  - synonym_text: "5'-deoxy-5'-({[2-(2-hydroxyphenyl)ethyl]sulfonyl}amino)adenosine-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P0ADI4
    protein_label: "3RG2 chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3rg2 chain C (resolution 3.1 Å); binding residues: N235 Y236 G309 A310 R311 V331 F332 G333 M334 A335 D415 V427"
    source: CURATOR
