identifier: proteintraitsmech:BIOLIP_NU8
label: "NU8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(5,6-dimethoxypyridin-3-yl)-1,1-bis(oxidanylidene)-4-[[2,4,6-tris(fluoranyl)phenyl]methyl]pyrido[2,3-e][1,2,4]thiadiazin-3-one (NU8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SUQZCEUKWPKXEE-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
