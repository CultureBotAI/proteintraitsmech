identifier: proteintraitsmech:BIOLIP_62C
label: "62C-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-deoxy-2-{[(2E)-3-(3,4-dichlorophenyl)prop-2-enoyl]amino}-alpha-D-glucopyranose (62C) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 1 PDB structure; ligand InChIKey ZBHWRKZTEDNOAJ-GJAUZLMESA-N.
