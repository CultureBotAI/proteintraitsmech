identifier: proteintraitsmech:BIOLIP_D8K
label: "D8K-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[(5~{S},8~{S},11~{S},15~{R})-8-[(4-fluorophenyl)methyl]-5-(hydroxymethyl)-2,7,10,14-tetrakis(oxidanylidene)-1,6,9,13-tetrazabicyclo[13.3.0]octadecan-11-yl]-5-methyl-1,2-oxazole-3-carboxamide (D8K) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XGIISLQJIYRWPH-BLKABHOGSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
