label: "N7T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{S})-2-[[(3~{S},4~{R},5~{R})-3,4,5,6-tetrakis(oxidanyl)-2-oxidanylidene-hexyl]amino]pentanedioic acid (N7T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PUFNBARRTADWAC-AJGMQJJTSA-N.
