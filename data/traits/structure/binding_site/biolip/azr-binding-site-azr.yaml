identifier: proteintraitsmech:BIOLIP_AZR
label: "AZR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-({[(1Z)-1-(2-amino-1,3-thiazol-4-yl)-2-oxo-2-{[(2S,3S)-1-oxo-3-(sulfoamino)butan-2-yl]amino}ethylidene]amino}oxy)-2-methylpropanoic acid (AZR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey OEVQTUTXOVDNJO-GEEOIBTQSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
