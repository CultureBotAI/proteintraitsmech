identifier: proteintraitsmech:BIOLIP_T2Q
label: "T2Q-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[[3-(4-methylsulfonylpiperidin-1-yl)phenyl]methyl]-5-[3-[4-(trifluoromethyloxy)phenyl]-1,2,4-oxadiazol-5-yl]pyridin-2-one (T2Q) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IFOZIXCZFLEIQV-UHFFFAOYSA-N.
