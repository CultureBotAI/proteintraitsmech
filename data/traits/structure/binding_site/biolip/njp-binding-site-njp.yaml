identifier: proteintraitsmech:BIOLIP_NJP
label: "NJP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-hydroxy-NICOTINAMIDE-ADENINE-DINUCLEOTIDE PHOSPHATE (NJP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey PDVSLSLEJOIQNF-NNYOXOHSSA-O.
