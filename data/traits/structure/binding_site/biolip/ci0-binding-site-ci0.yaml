label: "CI0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-(1-{(2S)-1-[(3R,5R)-3,5-dimethylpiperazin-1-yl]-1-oxopropan-2-yl}piperidin-4-yl)-1,3-dihydro-2H-benzimidazol-2-one (CI0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LWPPVRZWNRKLJH-OAGGEKHMSA-N.
