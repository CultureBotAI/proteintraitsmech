identifier: proteintraitsmech:BIOLIP_CTS
label: "CTS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CASTANOSPERMINE (CTS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JDVVGAQPNNXQDW-TVNFTVLESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
