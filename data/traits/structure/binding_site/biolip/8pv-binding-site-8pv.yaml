identifier: proteintraitsmech:BIOLIP_8PV
label: "8PV-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-benzyl-3-({[5-(pyridin-4-yl)-4H-1,2,4-triazol-3-yl]methyl}amino)benzamide (8PV) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XWJOKKXDMHSILW-UHFFFAOYSA-N.
