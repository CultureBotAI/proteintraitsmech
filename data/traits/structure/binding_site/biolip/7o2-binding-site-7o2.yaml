label: "7O2-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [(2~{S})-2-[[(2~{S})-1-azanyl-1-oxidanylidene-3-phenyl-propan-2-yl]carbamoyl]-4,4-diphenyl-butyl]-[(1~{R})-1-azanyl-3-phenyl-propyl]phosphinic acid (7O2) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey FDAGDZVCWKCEEX-NGYIUDBNSA-N.
