identifier: proteintraitsmech:BIOLIP_05X
label: "05X-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2,4,6-tris(fluoranyl)-N-[6-(1-methylpiperidin-4-yl)carbonylpyridin-2-yl]benzamide (05X) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XEDHVZKDSYZQBF-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
