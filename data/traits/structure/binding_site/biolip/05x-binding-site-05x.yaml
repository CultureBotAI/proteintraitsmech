    protein_label: "7EXD chain R (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7exd chain R (resolution 3.4 Å); binding residues: D103 I104 C107 T108 I174 H176 T182 W306 F309 E313 Y337"
    source: CURATOR
