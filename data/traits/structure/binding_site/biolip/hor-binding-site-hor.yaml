identifier: proteintraitsmech:BIOLIP_HOR
label: "HOR-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-[[(1R,2R)-2-[(3R)-3-azanylpiperidin-1-yl]-2,3-dihydro-1H-inden-1-yl]oxy]-3-chloranyl-benzenecarbonitrile (HOR) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RLKRLNQEXBPQGQ-OZOXKJRCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
