identifier: proteintraitsmech:BIOLIP_TAG
label: "TAG-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand D-tagatose (TAG) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey BJHIKXHVCXFQLS-PQLUHFTBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:TAG
synonyms:
  - synonym_text: "D-tagatose-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:B8I944
    protein_label: "3VNL chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3vnl chain A (resolution 2.15 Å); binding residues: Y6 H66 E150 E156 H186 R215 E244 F246"
    source: CURATOR
