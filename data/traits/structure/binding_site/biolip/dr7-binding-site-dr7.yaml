identifier: proteintraitsmech:BIOLIP_DR7
label: "DR7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,8S,9S,12S)-3,12-BIS(1,1-DIMETHYLETHYL)-8-HYDROXY-4,11-DIOXO-9-(PHENYLMETHYL)-6-[[4-(2-PYRIDINYL)PHENYL]METHYL]-2,5, 6,10,13-PENTAAZATETRADECANEDIOIC ACID DIMETHYL ESTER (DR7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AXRYRYVKAWYZBR-GASGPIRDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
