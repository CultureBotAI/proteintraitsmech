identifier: proteintraitsmech:BIOLIP_ART
label: "ART-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ARSENATE (ART) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 4 binding-site occurrences across 4 PDB structures; ligand InChIKey DJHGAFSJWGLOIV-UHFFFAOYSA-K.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
