label: "2MD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand GUANYLATE-O'-PHOSPHORIC ACID MONO-(2-AMINO-5,6-DIMERCAPTO-4-OXO-3,5,6,7,8A,9,10,10A-OCTAHYDRO-4H-8-OXA-1,3,9,10-TETRAAZA-ANTHRACEN-7-YLMETHYL) ESTER (2MD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 2 PDB structures; ligand InChIKey YDYCAANTTOPADF-JKOCJXFLSA-N.
