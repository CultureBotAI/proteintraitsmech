identifier: proteintraitsmech:BIOLIP_EWS
label: "EWS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,4S)-4-[(5-bromo-1H-indole-3-carbonyl)amino]-2-[(4-chlorophenyl)methyl]piperidin-1-ium (EWS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey GGXKHDYKPGTZBA-DLBZAZTESA-O.
definition_source: "BioLiP2 (Yang/Zhang group)"
