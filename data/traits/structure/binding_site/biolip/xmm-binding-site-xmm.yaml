    protein_label: "5T7P chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5t7p chain A (resolution 2.16 Å); binding residues: A80 D81 G99 F123 N125 G216 A217 E218"
    source: CURATOR
