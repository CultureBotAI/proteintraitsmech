identifier: proteintraitsmech:BIOLIP_XMM
label: "XMM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 5-bromo-4-chloro-1H-indol-3-yl alpha-D-mannopyranoside (XMM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 3 PDB structures; ligand InChIKey OPIFSICVWOWJMJ-HAAGFXOZSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:XMM
synonyms:
  - synonym_text: "5-bromo-4-chloro-1H-indol-3-yl alpha-D-mannopyranoside-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:P83304
    protein_label: "1ZGS chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 1zgs chain A (resolution 2.5 Å); binding residues: G310 G311 D386 F388 G431 D432 Y433 D435"
    source: CURATOR
  - protein_id: UniProtKB:P08902
    protein_label: "2JE9 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 2je9 chain A (resolution 2.1 Å); binding residues: Y14 N16 G100 L101 Y102 A209 D210 G229 R230"
    source: CURATOR
