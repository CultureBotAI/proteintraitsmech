identifier: proteintraitsmech:BIOLIP_LLP
label: "LLP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-amino-6-[[3-hydroxy-2-methyl-5-(phosphonooxymethyl)pyridin-4-yl]methylideneamino]hexanoic acid (LLP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 5 binding-site occurrences across 2 PDB structures; ligand InChIKey YQSOQJORMNSDJL-QFULYMJESA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LLP
synonyms:
  - synonym_text: "(2S)-2-amino-6-[[3-hydroxy-2-methyl-5-(phosphonooxymethyl)pyridin-4-yl]methylideneamino]hexanoic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:A1SR00
    protein_label: "4XG1 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4xg1 chain A (resolution 2.5 Å); binding residues: K61 D80 S103 H200 S203 G240 E274 G276 R277 R313 Y317 Y376"
    source: CURATOR
  - protein_id: UniProtKB:P53555
    protein_label: "6WNN chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6wnn chain A (resolution 2.59 Å); binding residues: F17 W54 S112 G113 A114 Y146 H147 D251 V253 K280 R410"
    source: CURATOR
