identifier: proteintraitsmech:BIOLIP_C5P
label: "C5P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand CYTIDINE-5'-MONOPHOSPHATE (C5P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 29 binding-site occurrences across 27 PDB structures; ligand InChIKey IERHLVCPSMICTF-XVFCMESISA-N.
