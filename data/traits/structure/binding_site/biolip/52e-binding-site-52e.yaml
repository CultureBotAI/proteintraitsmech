identifier: proteintraitsmech:BIOLIP_52E
label: "52E-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 4-{[(2-chloro-3-fluorobenzyl)carbamoyl](methyl)amino}-3,4-dideoxy-5-O-(isoquinolin-3-ylcarbamoyl)-D-erythro-pentitol (52E) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HLEXQOJKMXKUKE-RBUKOAKNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
