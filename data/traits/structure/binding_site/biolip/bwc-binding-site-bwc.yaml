definition: >-
  A structure-derived ligand-binding site at which the ligand 5-[(Z)-(5-fluoranyl-2-oxidanylidene-1H-indol-3-ylidene)methyl]-2,4-dimethyl-N-(2-pyrrolidin-1-ylethyl)-1H-pyrrole-3-carboxamide (BWC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SRSGVKWWVXWSJT-ATVHPVEESA-N.
