    protein_label: "3CV6 chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3cv6 chain A (resolution 2.1 Å); binding residues: A24 L25 L27 K31 Y55 H117 Y118 Y224 W227"
    source: CURATOR
