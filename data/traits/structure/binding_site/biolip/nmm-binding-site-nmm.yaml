identifier: proteintraitsmech:BIOLIP_NMM
label: "NMM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-amino-5-[(N-methylcarbamimidoyl)amino]pentanoic acid (NMM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NTNWOCRCBQPEKQ-YFKPBYRVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
