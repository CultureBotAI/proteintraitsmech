    protein_label: "3ELZ chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3elz chain B (resolution 2.2 Å); binding residues: W49 F63 T73 V74 I92 Y97 Q99 T101"
    source: CURATOR
