identifier: proteintraitsmech:BIOLIP_1PW
label: "1PW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3R,4E)-2-(acetylamino)-3-hydroxyoctadec-4-en-1-yl dihydrogen phosphate (1PW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HWPZKJVGDYNEAW-QUDYQQOWSA-N.
