identifier: proteintraitsmech:BIOLIP_H46
label: "H46-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand ~{N}-[4-[4-[(1~{S})-2-(diethylamino)-2-oxidanylidene-1-phenyl-ethyl]piperazin-1-yl]-3-fluoranyl-phenyl]-2-pyridin-3-yl-benzamide (H46) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey OVUNRYUVDVWTTE-YTTGMZPUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
