identifier: proteintraitsmech:BIOLIP_R9T
label: "R9T-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1~{R})-1-[(3,4-dimethoxyphenyl)methyl]-6,7-dimethoxy-1,2,3,4-tetrahydroisoquinoline (R9T) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YXWQTVWJNHKSCC-MRXNPFEDSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
