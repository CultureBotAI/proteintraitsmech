identifier: proteintraitsmech:BIOLIP_UED
label: "UED-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N~2~-[(benzyloxy)carbonyl]-N-{(2S)-1-hydroxy-3-[(3S)-2-oxopyrrolidin-3-yl]propan-2-yl}-L-leucinamide (UED) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey JUCVXDDMQHPCKT-BZSNNMDCSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
