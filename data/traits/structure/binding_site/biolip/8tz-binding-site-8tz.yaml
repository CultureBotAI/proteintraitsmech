identifier: proteintraitsmech:BIOLIP_8TZ
label: "8TZ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (~{S})-(4-fluoranyl-2-propyl-phenyl)-(1~{H}-imidazol-2-yl)methanol (8TZ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IDFPQEHZYBXIFO-LBPRGKRZSA-N.
