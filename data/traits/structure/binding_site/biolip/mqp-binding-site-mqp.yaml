    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:G3XD33
    protein_label: "7EMO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7emo chain A (resolution 1.5 Å); binding residues: H32 P34 V37 T43 P50 F51 Y75 F78 H83 L85 R129 H134 V137 Y138 M141"
    source: CURATOR
