identifier: proteintraitsmech:BIOLIP_MQP
label: "MQP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [5,10,15,20-tetraphenylporphyrinato(2-)-kappa~4~N~21~,N~22~,N~23~,N~24~]iron (MQP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZWYCMWUUWAFXIA-DAJBKUBHSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:MQP
synonyms:
