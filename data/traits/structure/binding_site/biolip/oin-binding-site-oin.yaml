identifier: proteintraitsmech:BIOLIP_OIN
label: "OIN-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,5S)-8-METHYL-8-AZABICYCLO[3.2.1]OCT-3-YL (2R)-3-HYDROXY-2-PHENYLPROPANOATE (OIN) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RKUNBYITZUJHSG-QKPAOTATSA-N.
