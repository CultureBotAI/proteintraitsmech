identifier: proteintraitsmech:BIOLIP_3DK
label: "3DK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[1-(2,5-difluorobenzyl)-1H-pyrazol-4-yl]-5-(1-methyl-1H-pyrazol-4-yl)-1H-pyrrolo[2,3-b]pyridine (3DK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SDWMCZUOCJDBOJ-UHFFFAOYSA-N.
