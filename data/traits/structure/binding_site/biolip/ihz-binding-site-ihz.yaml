    protein_label: "3DKO chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3dko chain A (resolution 2.0 Å); binding residues: A663 E682 M686 I711 M714 L765 S775 D776"
    source: CURATOR
