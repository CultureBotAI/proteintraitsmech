    protein_label: "5H2Q chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5h2q chain A (resolution 1.66 Å); binding residues: M785 N826 A838 V841 T842 F845 M862 G874 Q875 F878"
    source: CURATOR
