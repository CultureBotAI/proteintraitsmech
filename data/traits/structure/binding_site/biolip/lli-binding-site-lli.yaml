identifier: proteintraitsmech:BIOLIP_LLI
label: "LLI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (4~{a}~{S},8~{a}~{R})-2-cycloheptyl-4-[4-methoxy-3-[2-(2-oxidanylideneimidazolidin-1-yl)ethoxy]phenyl]-4~{a},5,8,8~{a}-tetrahydrophthalazin-1-one (LLI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YLCZKQRIIGKMHV-FCHUYYIVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LLI
synonyms:
