identifier: proteintraitsmech:BIOLIP_XEQ
label: "XEQ-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3~{S},11~{b}~{R})-9,10-dimethoxy-3-(2-methylpropyl)-1,3,4,6,7,11~{b}-hexahydrobenzo[a]quinolizin-2-one (XEQ) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MKJIEFSOBYUXJB-GOEBONIOSA-N.
