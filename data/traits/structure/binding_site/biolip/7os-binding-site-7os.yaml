identifier: proteintraitsmech:BIOLIP_7OS
label: "7OS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S,3R)-3-cyclopropyl-3-[(2R)-2-(1-{(1S)-1-[5-fluoro-2-(trifluoromethoxy)phenyl]ethyl}piperidin-4-yl)-3,4-dihydro-2H-1-benzopyran-7-yl]-2-methylpropanoic acid (7OS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ADYYYLTWZYYGNX-LJYIQKJHSA-N.
