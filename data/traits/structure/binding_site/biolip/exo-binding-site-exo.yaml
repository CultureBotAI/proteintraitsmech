identifier: proteintraitsmech:BIOLIP_EXO
label: "EXO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R,2S,3S,4R)-5-METHYLENECYCLOHEXANE-1,2,3,4-TETRAOL (EXO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DRZDCPGIBPDBFY-JWXFUTCRSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
