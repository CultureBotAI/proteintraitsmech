identifier: proteintraitsmech:BIOLIP_QAK
label: "QAK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (6~{R},10~{S},14~{R},19~{R},23~{S},24~{E},27~{S},28~{E})-2,6,10,14,19,23,27,31-octamethyldotriaconta-24,28-dien-2-ol (QAK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NKXXNXZGYNRQNV-BTRAWPHCSA-N.
