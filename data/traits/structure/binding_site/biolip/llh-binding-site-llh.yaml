identifier: proteintraitsmech:BIOLIP_LLH
label: "LLH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3S,4R)-2,3,4-TRIHYDROXY-5-(HYDROXYAMINO)-5-OXOPENTANOIC ACID (LLH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey DMGBHBFPSRKPBV-ZVHKOUPVSA-N.
