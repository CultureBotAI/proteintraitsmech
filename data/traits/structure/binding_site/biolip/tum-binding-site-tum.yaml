identifier: proteintraitsmech:BIOLIP_TUM
label: "TUM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Tunicamycin (TUM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey YJQCOFNZVFGCAF-DCSBULBVSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:TUM
synonyms:
  - synonym_text: "Tunicamycin-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:R0BTE9
    protein_label: "5JNQ chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 5jnq chain A (resolution 2.6 Å); binding residues: K111 N172 F173 D175 G176 L177 D178 F228 D231 V268 P288 H290 H291"
    source: CURATOR
  - protein_id: UniProtKB:Q9H3H5
    protein_label: "6BW5 chain D (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6bw5 chain D (resolution 3.1 Å); binding residues: L46 N119 W122 K125 L126 N185 A188 G189 F249 D252 F286 R303"
    source: CURATOR
