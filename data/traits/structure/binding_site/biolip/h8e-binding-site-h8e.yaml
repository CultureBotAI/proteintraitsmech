identifier: proteintraitsmech:BIOLIP_H8E
label: "H8E-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand benzyl-N-[(2S)-1-[[(3S)-7-amino-1-(benzylamino)-1,2-dioxoheptan-3-yl]amino]-5-(2-methyl-2-phenylhydrazinyl)-1,5-dioxopentan-2-yl]carbamate (H8E) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey XDVSKHGOOXWVDB-VMPREFPWSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
