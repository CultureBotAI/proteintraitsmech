definition: >-
  A structure-derived ligand-binding site at which the ligand 2-azanyl-5-[(2~{E},6~{E},8~{E},10~{E},12~{E},14~{E},18~{E},22~{E},26~{E},30~{E},34~{E})-3,7,11,15,19,23,27,31,35,39-decamethyltetraconta-2,6,8,10,12,14,18,22,26,30,34,38-dodecaenyl]-3-methoxy-6-methyl-cyclohexa-2,5-diene-1,4-dione (RQ0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey WXESXKLCRFKYIR-NBYUNPNPSA-N.
