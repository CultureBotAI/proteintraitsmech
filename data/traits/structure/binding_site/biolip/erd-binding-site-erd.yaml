identifier: proteintraitsmech:BIOLIP_ERD
label: "ERD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2S)-2-(3,4-DIHYDROXYPHENYL)-5,7-DIHYDROXY-2,3-DIHYDRO-4H-CHROMEN-4-ONE (ERD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SBHXYTNGIZCORC-ZDUSSCGKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
