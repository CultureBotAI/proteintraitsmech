    protein_label: "4QOX chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 4qox chain A (resolution 2.748 Å); binding residues: L76 G77 K78 V84 A97 K99 M131 L145 D148 Y150 L200"
    source: CURATOR
