identifier: proteintraitsmech:BIOLIP_NJS
label: "NJS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Itaconyl coenzyme A (NJS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SJCVDYMGDNNJTF-BIBYKGKUSA-N.
