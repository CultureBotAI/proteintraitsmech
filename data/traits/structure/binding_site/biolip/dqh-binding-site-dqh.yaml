identifier: proteintraitsmech:BIOLIP_DQH
label: "DQH-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2R,3R)-2-(3,4-DIHYDROXYPHENYL)-3,5,7-TRIHYDROXY-2,3-DIHYDRO-4H-CHROMEN-4-ONE (DQH) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CXQWRCVTCMQVQX-LSDHHAIUSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
