    protein_label: "6DJZ chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6djz chain B (resolution 3.084 Å); binding residues: W89 Y103 L105 S117 Y120 D126 F133 Q135 H154 V162 E172 L182 A185"
    source: CURATOR
