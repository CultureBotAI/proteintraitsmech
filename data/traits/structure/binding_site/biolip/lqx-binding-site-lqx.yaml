identifier: proteintraitsmech:BIOLIP_LQX
label: "LQX-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 1-[(2,5-dimethylpyrazol-3-yl)methyl]-N-(1-methylcyclopropyl)-3-[(2-methyl-1,3-thiazol-5-yl)methyl]-2,4-bis(oxidanylidene)quinazoline-6-sulfonamide (LQX) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IFWUBRBMMNTBRZ-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
