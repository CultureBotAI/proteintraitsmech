label: "6K0-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-{4-[4-amino-7-(propan-2-yl)-7H-pyrrolo[2,3-d]pyrimidine-5-carbonyl]pyridin-2-yl}-N'-(2,4-difluorophenyl)urea (6K0) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey RPNUUULYRBUSBJ-UHFFFAOYSA-N.
