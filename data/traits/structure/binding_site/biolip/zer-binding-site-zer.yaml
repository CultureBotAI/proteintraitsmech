identifier: proteintraitsmech:BIOLIP_ZER
label: "ZER-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,11E)-14,16-dihydroxy-3-methyl-3,4,5,6,9,10-hexahydro-1H-2-benzoxacyclotetradecine-1,7(8H)-dione (ZER) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey MBMQEIFVQACCCH-QBODLPLBSA-N.
