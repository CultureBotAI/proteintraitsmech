identifier: proteintraitsmech:BIOLIP_VPD
label: "VPD-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-chloro-N-cyclopentyl-1-{5-O-[(2R)-1-hydroxy-3-methoxy-2-phosphonopropan-2-yl]-beta-D-ribofuranosyl}-1H-pyrazolo[3,4-d]pyrimidin-4-amine (VPD) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey BQCRMLSBGAKPFW-RTPDKIPNSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
