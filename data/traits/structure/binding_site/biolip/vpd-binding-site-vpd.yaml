    protein_label: "7JV8 chain C (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 7jv8 chain C (resolution 2.46 Å); binding residues: D85 N117 H118 D121 L184 H243 R354 N390 G392 G393 R395 F417 G447 F500 D506"
    source: CURATOR
