identifier: proteintraitsmech:BIOLIP_I2L
label: "I2L-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4,8-dimethyl-2-oxidanylidene-7-[[3-(trifluoromethyl)phenyl]methoxy]chromen-3-yl]ethanoic acid (I2L) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey NSSHMSRIOYOKOP-UHFFFAOYSA-N.
