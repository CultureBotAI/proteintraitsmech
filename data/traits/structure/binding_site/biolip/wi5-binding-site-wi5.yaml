identifier: proteintraitsmech:BIOLIP_WI5
label: "WI5-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand {(3R)-5-methyl-3-[(morpholin-4-yl)methyl]-2,3-dihydro[1,4]oxazino[2,3,4-hi]indol-6-yl}(naphthalen-1-yl)methanone (WI5) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey HQVHOQAKMCMIIM-HXUWFJFHSA-N.
