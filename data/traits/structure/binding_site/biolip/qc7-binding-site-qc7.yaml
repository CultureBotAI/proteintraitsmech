identifier: proteintraitsmech:BIOLIP_QC7
label: "QC7-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5R,6R)-6-[(1S,2R,4aS,4bS,7R,8aS,10R,10aS)-7,10-dihydroxy-1,2,4b-trimethyltetradecahydrophenanthren-2-yl]-5-methylheptan-2-one (QC7) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SZOBNGKCEOANMX-IBSCZREMSA-N.
