identifier: proteintraitsmech:BIOLIP_3PI
label: "3PI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1S)-2-(1-HYDROXYBUTOXY)-1-{[(HYDROXY{[(2R,3S,5R,6S)-2,4,6-TRIHYDROXY-3,5-BIS(PHOSPHONOOXY)CYCLOHEXYL]OXY}PHOSPHORYL)OXY]METHYL}ETHYL BUTYRATE (3PI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SEWBGVDZVBOXHU-DSHZNZJQSA-N.
