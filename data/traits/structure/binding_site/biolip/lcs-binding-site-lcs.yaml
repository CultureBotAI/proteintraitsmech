identifier: proteintraitsmech:BIOLIP_LCS
label: "LCS-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [5-hydroxy-6-methyl-4-({[(4E)-3-oxo-1,2-oxazolidin-4-ylidene]amino}methyl)pyridin-3-yl]methyl dihydrogen phosphate (LCS) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey KFCQHWOGBVCKHR-UKTHLTGXSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:LCS
synonyms:
  - synonym_text: "[5-hydroxy-6-methyl-4-({[(4E)-3-oxo-1,2-oxazolidin-4-ylidene]amino}methyl)pyridin-3-yl]methyl dihydrogen phosphate-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:F4KWH0
    protein_label: "8AHU chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 8ahu chain A (resolution 1.41 Å); binding residues: F33 R52 R137 K143 Y147 E176 A178 R179 S180 L199 G201 I202 T203 S238 T239"
    source: CURATOR
