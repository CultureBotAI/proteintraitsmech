identifier: proteintraitsmech:BIOLIP_MAP
label: "MAP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand MAGNESIUM-5'-ADENYLY-IMIDO-TRIPHOSPHATE (MAP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 2 binding-site occurrences across 2 PDB structures; ligand InChIKey QTQJEIANUKJRTB-IDIVVRGQSA-M.
definition_source: "BioLiP2 (Yang/Zhang group)"
