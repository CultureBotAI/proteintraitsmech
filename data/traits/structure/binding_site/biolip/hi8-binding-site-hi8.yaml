label: "HI8-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (6M)-1-[(2R)-3,3-dimethylbutan-2-yl]-6-[(5S)-5-methyl-4-oxo-5-phenyl-4,5-dihydro-1H-imidazol-2-yl]-1,3-dihydro-2H-benzimidazol-2-one (HI8) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AYFDMSNHRFJPTL-FATZIPQQSA-N.
