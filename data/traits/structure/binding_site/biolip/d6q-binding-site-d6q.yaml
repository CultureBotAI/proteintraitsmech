definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[4,5-bis(fluoranyl)-2-oxidanylidene-1'-(1~{H}-pyrazolo[3,4-b]pyridin-5-ylcarbonyl)spiro[indole-3,4'-piperidine]-1-yl]-~{N}-[2,2,2-tris(fluoranyl)ethyl]ethanamide (D6Q) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey IJPAFYMYOCLEBL-UHFFFAOYSA-N.
