definition: >-
  A structure-derived ligand-binding site at which the ligand 2-[[2,6-bis(chloranyl)-3-phenylmethoxy-phenyl]amino]pyridine-3-carboxylic acid (GH6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AYGDOYFDJDUPSS-UHFFFAOYSA-N.
