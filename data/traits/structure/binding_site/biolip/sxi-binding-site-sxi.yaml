identifier: proteintraitsmech:BIOLIP_SXI
label: "SXI-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (3S,4aS,6S,8aR)-6-[3-chloro-2-(1H-tetrazol-5-yl)phenoxy]decahydroisoquinoline-3-carboxylic acid (SXI) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey LAKQPSQCICNZII-NOHGZBONSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
