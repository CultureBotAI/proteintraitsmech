identifier: proteintraitsmech:BIOLIP_D7S
label: "D7S-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (5beta,14beta,17alpha,25S)-3-oxocholest-7-en-26-oic acid (D7S) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SQTAVUCHOVVOFD-OBRBSRNPSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
