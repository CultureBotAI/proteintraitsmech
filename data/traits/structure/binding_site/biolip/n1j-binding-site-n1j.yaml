identifier: proteintraitsmech:BIOLIP_N1J
label: "N1J-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[5-(6-ethyl-2,6-diazaspiro[3.3]heptan-2-yl)pyridin-2-yl]-5-fluoro-4-[(4R)-4-methyl-5,6,7,8-tetrahydro-4H-pyrazolo[1,5-a]azepin-3-yl]pyrimidin-2-amine (N1J) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey KMRYRPPWJDYHAL-QGZVFWFLSA-N.
