identifier: proteintraitsmech:BIOLIP_M6P
label: "M6P-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 6-O-phosphono-alpha-D-mannopyranose (M6P) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 9 binding-site occurrences across 8 PDB structures; ligand InChIKey NBSCHQHZLSJFNQ-PQMKYFCFSA-N.
