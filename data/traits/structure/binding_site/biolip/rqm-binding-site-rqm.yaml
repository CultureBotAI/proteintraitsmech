identifier: proteintraitsmech:BIOLIP_RQM
label: "RQM-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Fe(3)-Ni(1)-S(4) cluster (RQM) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey QGLWBXDZIHZONR-UHFFFAOYSA-N.
