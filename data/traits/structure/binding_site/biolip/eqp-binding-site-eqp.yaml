identifier: proteintraitsmech:BIOLIP_EQP
label: "EQP-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (1R)-4-acetamido-1,5-anhydro-2,4-dideoxy-1-phosphono-D-glycero-D-galacto-octitol (EQP) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey QITAGYVZDNZULE-IHICSVBISA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
