identifier: proteintraitsmech:BIOLIP_UOW
label: "UOW-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{R})-2-[5-[5-chloranyl-2-(oxan-4-ylamino)pyrimidin-4-yl]-3-oxidanylidene-1~{H}-isoindol-2-yl]-~{N}-[(1~{S})-1-(2-methoxypyridin-4-yl)-2-oxidanyl-ethyl]propanamide (UOW) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey ZLOVQLWPDDOBBX-WAIKUNEKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
