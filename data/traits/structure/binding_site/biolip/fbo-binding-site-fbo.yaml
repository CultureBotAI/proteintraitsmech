    protein_label: "3Q7J chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 3q7j chain A (resolution 2.91 Å); binding residues: H99 Q101 A229 G230 A231 E233 E266 T292 R316 E348 Y351 G352"
    source: CURATOR
