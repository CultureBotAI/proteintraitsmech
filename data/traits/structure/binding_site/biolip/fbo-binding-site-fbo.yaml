identifier: proteintraitsmech:BIOLIP_FBO
label: "FBO-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand L-phenylalanyl-N6-[(benzyloxy)carbonyl]-N1-hydroxy-L-lysinamide (FBO) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey YGHNIVJEKSKDJB-PMACEKPBSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
