identifier: proteintraitsmech:BIOLIP_2NF
label: "2NF-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand [[(2R,3S,4R,5R)-5-(6-aminopurin-9-yl)-3,4-dihydroxyoxolan-2-yl]methoxy-hydroxyphosphoryl] [(2R,3S,4R,5R)-5-(3-carbamoylpyridin-1-ium-1yl)- 3-fluoro-,4- hydroxyoxolan-2-yl]methyl phosphate (2NF) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey JSGNSBZQCQQLEF-OZCXFSBSSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
