identifier: proteintraitsmech:BIOLIP_QC9
label: "QC9-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand (2~{R},3~{S},4~{S})-2,3,4,6-tetrakis(oxidanyl)hexane-1-sulfonic acid (QC9) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey CASIPAVAJJTHFL-ZLUOBGJFSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
