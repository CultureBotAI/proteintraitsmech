    protein_label: "6OB6 chain B (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6ob6 chain B (resolution 2.9 Å); binding residues: T25 L26 W29 I119 I150 G154 Q158 F300 T303 I304 R345"
    source: CURATOR
