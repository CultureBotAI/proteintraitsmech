identifier: proteintraitsmech:BIOLIP_GDL
label: "GDL-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(acetylamido)-2-deoxy-D-glucono-1,5-lactone (GDL) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 3 binding-site occurrences across 3 PDB structures; ligand InChIKey NELQYZRSPDCGRQ-DBRKOABJSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
