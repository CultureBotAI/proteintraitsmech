identifier: proteintraitsmech:BIOLIP_DZ6
label: "DZ6-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 3-[2-[6-(4-aminophenyl)imidazo[1,2-a]pyrazin-3-yl]ethynyl]-2-methyl-~{N}-[3-(4-methylpiperazin-1-yl)-5-propan-2-yl-phenyl]benzamide (DZ6) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VBGZPGTYAGJBAX-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
