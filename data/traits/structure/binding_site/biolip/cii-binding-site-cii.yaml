identifier: proteintraitsmech:BIOLIP_CII
label: "CII-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand N-[(1S)-2-methyl-1-(pyridin-4-ylcarbamoyl)propyl]cyclohexanecarboxamide (CII) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey VYLDPSVXLWTIAJ-HNNXBMFYSA-N.
