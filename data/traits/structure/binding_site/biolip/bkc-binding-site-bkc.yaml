identifier: proteintraitsmech:BIOLIP_BKC
label: "BKC-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand Bongkrekic acid (BKC) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey SHCXABJSXUACKU-WUTQZGRKSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: REVIEWED
xrefs:
  - pdb.ligand:BKC
synonyms:
  - synonym_text: "Bongkrekic acid-binding site"
    synonym_type: EXACT_SYNONYM
    source: BioLiP2
canonical_examples:
  - protein_id: UniProtKB:G2QNH0
    protein_label: "6GCI chain A (BioLiP receptor)"
    note: "BioLiP2 binding-site occurrence in PDB 6gci chain A (resolution 3.3 Å); binding residues: K30 R88 Y89 T92 Q93 N96 S134 L135 D142 I193 Y196 R197 R287 G291"
    source: CURATOR
