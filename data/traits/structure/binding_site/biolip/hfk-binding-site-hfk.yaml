identifier: proteintraitsmech:BIOLIP_HFK
label: "HFK-binding site"
definition: >-
  A structure-derived ligand-binding site at which the ligand 2-(1,3-benzoxazol-2-ylamino)spiro[1,6,7,8-tetrahydroquinazoline-4,1'-cyclohexane]-5-one (HFK) is bound to a receptor protein chain, defined from 3D protein–ligand complexes. BioLiP2 catalogues this binding site over 1 binding-site occurrence across 1 PDB structure; ligand InChIKey AZBGHUMVHJKFOO-UHFFFAOYSA-N.
definition_source: "BioLiP2 (Yang/Zhang group)"
