identifier: proteintraitsmech:QUATERNARY_HOMOHEXAMER
label: "homohexameric quaternary structure"
definition: >-
  A quaternary assembly composed of six identical polypeptide subunits (stoichiometry A6), adopting either a cyclic C6 ring (such as AAA+ ATPases and replicative helicases) or a dihedral D3 trimer-of-dimers.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
