identifier: proteintraitsmech:QUATERNARY_HOMOPENTAMER
label: "homopentameric quaternary structure"
definition: >-
  A quaternary assembly composed of five identical polypeptide subunits (stoichiometry A5) arranged in a closed C5 cyclic ring, characteristic of pentameric ligand-gated ion channels, mechanosensitive channels, and AB5 toxin B-subunits.
