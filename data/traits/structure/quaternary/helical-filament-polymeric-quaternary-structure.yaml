identifier: proteintraitsmech:QUATERNARY_HELICAL_FILAMENT
label: "helical filament polymeric quaternary structure"
definition: >-
  An open-ended or length-regulated non-covalent polymeric quaternary assembly in which protomers repeat along a screw axis (helical symmetry), as in cytoskeletal filaments, recombinase nucleoprotein filaments, and metabolic cytoophidia.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
