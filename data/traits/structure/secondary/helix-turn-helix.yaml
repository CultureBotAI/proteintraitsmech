evidence:
- reference: SO:0001081
  notes: The ontology describes a two-helix structural motif. DNA binding and sequence-screen predictions
    are separate claims.
- reference: https://github.com/The-Sequence-Ontology/SO-Ontologies/blob/master/LICENSE
  notes: Sequence Ontology CC-BY-4.0 terms inspected 2026-10-28; definition paraphrased from the 2026-08-07
    ontology. Cited papers and software retain their own terms.
- reference: PMID:2402433
  notes: The Dodd-Egan matrix estimates HTH likelihood from sequence. The linked EMBOSS implementation
    is a screening method; a hit does not establish the 3D motif or DNA-binding activity.
- reference: PMID:1387915
  notes: The lambda repressor-operator study explicitly describes its HTH region. PDB 1LMB is a representative
    structure containing that region; no local residue selection or qualified UniProt occurrence is
    asserted.
structural_geometry_representations:
- structure_ref: PDB:1LMB
  structure_source: PDB, entry version 1.3
  evidence_source: PMID:1387915; https://www.rcsb.org/structure/1LMB; inspected 2026-10-28. Lambda repressor
    chains C/D (author 3/4), X-ray 1.8 angstrom. Structure containing the source-described HTH region;
    motif bounds unspecified.
