identifier: proteintraitsmech:BETA_ARCH
label: beta arch
definition: A supersecondary motif comprising two successive beta strands joined by a connecting segment,
  without hydrogen-bond pairing between the two flanking strands.
definition_source: DOI:10.1038/s41467-022-33004-6
trait_axis: STRUCTURE
trait_category: STRUCT_SECONDARY
term_kind: CLASS
mapping_status: PROPOSED
