  state_alphabet: TOPOLOGY
  topology_string: E-connection-E(no-flanking-strand-pairing)
  evidence_source: DOI:10.1038/s41467-022-33004-6; Methods, beta-arch structural analysis
detection_methods:
- name: DSSP assignment followed by connected-strand and hydrogen-bond pairing review
  method_type: STRUCTURAL_ALGORITHM
  tool: https://github.com/PDB-REDO/dssp
