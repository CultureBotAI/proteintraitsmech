identifier: proteintraitsmech:BETA_TURN
label: beta turn
definition: >-
  A local four-residue backbone turn with a compact, nonhelical central conformation; an i-to-i+3
  backbone hydrogen bond may be present.
definition_source: SO:0001133
trait_axis: STRUCTURE
trait_category: STRUCT_SECONDARY
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- proteintraitsmech:POLYPEPTIDE_STRUCTURAL_MOTIF
secondary_structure_representations:
- method: curated
  state_alphabet: TOPOLOGY
  topology_string: turn
  evidence_source: SO:0001133
definitions:
- kind: STRUCTURAL
  text: In the PROMOTIF operational definition, four consecutive residues i through i+3 form a beta
    turn when the C-alpha atoms of i and i+3 are separated by less than 7 angstroms and the two central
    residues are nonhelical. Subtypes are classified by the central backbone torsions; the end-to-end
    hydrogen bond is optional.
  source: https://www.uoxray.uoregon.edu/local/manuals/promotif/document_2.html
  method: GENERATED
xrefs:
- SO:0001133
detection_methods:
- name: PROMOTIF coordinate motif classification (licensed external prerequisite)
  method_type: STRUCTURAL_ALGORITHM
  tool: https://www.uoxray.uoregon.edu/local/manuals/promotif/document_2.html
  reference: PMID:8745398
  recipe: promotif {input.pdb}
  edam_operation: EDAM:operation_2406
  evidence_code: ECO:0007669
evidence:
- reference: SO:0001133
  notes: The geometric beta-turn convention can include motifs without the end-to-end hydrogen bond
    required by the narrower DSSP T assignment.
- reference: https://github.com/The-Sequence-Ontology/SO-Ontologies/blob/master/LICENSE
