identifier: proteintraitsmech:DYNAMICS_DOMAIN_SWAPPING_HINGE_LOOP
label: "3D domain-swapping hinge loop"
definition: >-
  A conformationally bistable polypeptide loop that folds back on its own chain in the closed monomeric state but adopts an extended conformation in the 3D domain-swapped state, allowing an adjacent secondary-structure element or tertiary domain to exchange into the equivalent position of an identical partner subunit to form an intertwined dimer or higher oligomer.
