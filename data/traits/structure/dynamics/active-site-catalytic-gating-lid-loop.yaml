identifier: proteintraitsmech:DYNAMICS_CATALYTIC_GATING_LOOP
label: "active-site catalytic gating/lid loop"
definition: >-
  A conformationally mobile surface loop flanking an enzyme active site or substrate binding pocket that undergoes reversible open-to-closed transitions (microsecond-to-millisecond timescale) upon ligand binding, desolvating the catalytic pocket, positioning catalytic residues, and preventing premature hydrolysis or escape of reactive reaction intermediates (exemplified by triosephosphate isomerase loop 6, dihydrofolate reductase Met20 loop, and lipase interfacial lids).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DYNAMICS
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - PATO:0001543
synonyms:
  - synonym_text: "catalytic omega-loop lid"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "substrate-gated active-site closure loop"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "ProDy / ANM anisotropic network model & conformational ensemble PCA"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0244
    tool: "biotools:prody"
    evidence_code: ECO:0007669
    reference: PMID:21471012
    recipe: "prody anm {input} -n 20 -o {output}"
evidence:
  - reference: PMID:30703322
    notes: "Substrate binding drives conformational closure of flexible active-site gating loops (such as the triosephosphate isomerase loop 6), sequestering the reaction intermediate from bulk water and stabilizing the catalytic transition state."
