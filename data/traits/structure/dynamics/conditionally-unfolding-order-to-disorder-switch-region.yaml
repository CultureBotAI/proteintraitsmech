    title: "Transient environmental or post-translational modification awakens dormant disorder via local unfolding to activate protein binding"
    description: "A folded polypeptide_domain (SO:0000417) harboring dormant disorder undergoes transient protein modification or environmental perturbation (GO:0036211) that induces local unfolding and increased conformational flexibility (PATO:0001543), which is causally upstream of effector or client protein binding (GO:0005515)."
    nodes:
