identifier: proteintraitsmech:DYNAMICS_ORDER_TO_DISORDER_REGULATORY_SWITCH
label: "conditionally unfolding order-to-disorder regulatory switch region"
definition: >-
  A conditionally or transiently disordered protein region (cryptic disorder segment) that adopts a well-ordered, autoinhibited or chaperone-inactive tertiary conformation under resting conditions but undergoes a reversible, stimulus-triggered order-to-disorder transition (local or global unfolding induced by oxidative stress, pH shifts, temperature, mechanical force, or post-translational modification) to expose binding sites or activate holdase/signaling function.
