identifier: proteintraitsmech:DYNAMICS_ALLOSTERIC_ENSEMBLE_TRANSMISSION_PATHWAY
label: "allosteric dynamic-coupling residue network"
definition: >-
  A contiguous network of dynamically coupled residues spanning the tertiary interior between a distal allosteric site and an orthosteric catalytic or binding site, through which correlated side-chain rotamer and backbone fluctuations propagate allosteric free-energy perturbations across community interfaces, including entropically driven allostery without large mean-backbone displacement.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
