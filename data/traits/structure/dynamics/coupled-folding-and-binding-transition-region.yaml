identifier: proteintraitsmech:DYNAMICS_COUPLED_FOLDING_AND_BINDING_TRANSITION
label: "coupled folding-and-binding disorder-to-order transition region"
definition: >-
  A dynamically disordered polypeptide segment or domain that populates an ensemble of unfolded or partially preformed states in isolation and undergoes a concerted disorder-to-order conformational transition (via induced fit or conformational selection) into a well-defined alpha-helical, beta-strand, or irregular tertiary structure only upon engaging its cognate macromolecular binding partner.
