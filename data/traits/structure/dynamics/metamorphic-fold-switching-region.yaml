identifier: proteintraitsmech:DYNAMICS_METAMORPHIC_FOLD_SWITCH
label: "metamorphic fold-switching region"
definition: >-
  A polypeptide region or domain capable of reversible, large-scale remodeling of its secondary and tertiary structure (such as alpha-helix to beta-sheet interconversion) between two or more distinct, stable native fold topologies under physiological conditions (exemplified by RfaH C-terminal domain, XCL1 lymphotactin, KaiB, and Mad2), exposing distinct functional surfaces in each fold state.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DYNAMICS
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - PATO:0001543
synonyms:
  - synonym_text: "fold-switching metamorphic protein segment"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "reversible secondary- and tertiary-structure remodeling region"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "ProDy / ANM anisotropic network model & conformational ensemble PCA"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0244
    tool: "biotools:prody"
    evidence_code: ECO:0007669
    reference: PMID:21471012
    recipe: "prody anm {input} -n 20 -o {output}"
evidence:
  - reference: PMID:18583598
    notes: "Metamorphic proteins reversibly interconvert between two distinct, stable native fold topologies with different secondary-structure elements and biological functions under physiological conditions."
  - reference: PMID:20591649
    notes: "Fold-switching proteins remodel secondary and tertiary structure across flexible regions to expose alternative binding surfaces and expand biological function."
