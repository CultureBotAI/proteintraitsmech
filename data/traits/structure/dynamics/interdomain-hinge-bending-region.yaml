identifier: proteintraitsmech:DYNAMICS_DOMAIN_HINGE
label: "interdomain hinge-bending region"
definition: >-
  A short flexible polypeptide segment or pair of beta-strands/alpha-helical joints connecting two quasi-rigid tertiary domains where localized main-chain torsion-angle rotations (phi/psi changes) drive large-amplitude rigid-body hinge-bending domain closure and opening (as in periplasmic binding proteins, adenylate kinase, lactoferrin, and immunoglobulins).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DYNAMICS
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:ELBOW
  - PATO:0001543
synonyms:
  - synonym_text: "domain hinge axis linker"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "hinge-bending interdomain pivot"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "ProDy / ANM anisotropic network model & conformational ensemble PCA"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0244
    tool: "biotools:prody"
    evidence_code: ECO:0007669
    reference: PMID:21471012
    recipe: "prody anm {input} -n 20 -o {output}"
evidence:
  - reference: PMID:8204609
    notes: "Large-scale rigid-body domain movements in proteins are mediated by localized backbone dihedral rotations within flexible interdomain hinge regions where packing constraints are minimal."
