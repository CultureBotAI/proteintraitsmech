    title: "Inter-subunit effector binding couples quaternary interface rearrangement to cooperative catalysis"
    description: "An effector (CHEBI:35224) binds via small molecule binding (GO:0036094) at an oligomeric subunit boundary mediated by protein homodimerization activity (GO:0042803), driving enzyme regulator activity (GO:0030234) that cooperatively modulates catalytic activity (GO:0003824) across protomers."
    nodes:
      - node_id: "CHEBI:35224"
        label: effector
        node_type: LIGAND
        grounding: "CHEBI:35224"
        description: "Effector ligand binding at the inter-subunit interface pocket."
      - node_id: "GO:0036094"
        label: "small molecule binding"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0036094"
        description: "Small-molecule effector binding across the oligomeric interface."
      - node_id: "GO:0042803"
        label: "protein homodimerization activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0042803"
        description: "Quaternary subunit-subunit interface coupling oligomeric protomers."
      - node_id: "GO:0030234"
        label: "enzyme regulator activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0030234"
        description: "Cooperative quaternary T-to-R or R-to-T transition across subunits."
      - node_id: "GO:0003824"
        label: "catalytic activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003824"
        description: "Cooperative catalytic activity across active sites of the oligomer."
    edges:
      - subject: "GO:0036094"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:35224"
        description: "Small molecule binding at the inter-subunit cavity engages the allosteric effector."
        evidence:
          - reference: PMID:42628823
            snippet: "Solvent mapping using FTMap and FTMove across oligomeric ensembles revealed multiple high-confidence cavities predominantly located at subunit interfaces, in addition to canonical catalytic sites."
            notes: "Inter-subunit cavity detection across oligomeric ensembles (PMID:42628823). (ECO:0000305)"
      - subject: "GO:0036094"
        predicate: regulates
        predicate_id: RO:0002211
        object: "GO:0042803"
        description: "Interface pocket occupancy modulates subunit-subunit packing geometry."
        evidence:
          - reference: PMID:42628823
            snippet: "Across all four enzymes, interface-localized pockets consistently emerged as promising candidate regulatory regions, suggesting that protein-protein interfaces may represent valuable targets for allosteric modulation."
            notes: "Protein-protein interface pockets as allosteric regulatory regions (PMID:42628823). (ECO:0000305)"
      - subject: "GO:0042803"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0030234"
        description: "Conformational changes across the dimer interface propagate allosteric regulation between protomers."
        evidence:
          - reference: PMID:42539251
            snippet: "Consistent with the conformational asymmetry observed in apo -FraB crystal structures, our findings establish a half-site reactivity mechanism in which post-binding conformational changes across the dimer interface restrict substrate cleavage to one active site even though both protomers are able to bind substrate."
            notes: "Dimer interface conformational coupling (PMID:42539251). (ECO:0000269)"
      - subject: "GO:0030234"
        predicate: regulates
        predicate_id: RO:0002211
        object: "GO:0003824"
        description: "Cooperative quaternary transition regulates catalytic activity across protomers."
        evidence:
          - reference: PMID:42628823
            snippet: "Across all four enzymes, interface-localized pockets consistently emerged as promising candidate regulatory regions, suggesting that protein-protein interfaces may represent valuable targets for allosteric modulation."
            notes: "Cooperative catalytic regulation across subunit interfaces (PMID:42628823). (ECO:0000305)"
