identifier: proteintraitsmech:ALLOSTERIC_SUBUNIT_INTERFACE_SITE
label: "subunit-interface allosteric site"
definition: >-
  An allosteric regulatory site situated at the inter-protomer boundary of an oligomeric protein complex, where effector binding couples quaternary subunit rotation directly to cooperative transitions across multiple active sites.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
