identifier: proteintraitsmech:ALLOSTERIC_METAL_ION_REGULATORY_SITE
label: "allosteric metal-ion regulatory binding site"
definition: >-
  A topographically distinct metal-cation coordination pocket (such as the Na+-binding allosteric activation loop of thrombin and clotting proteases, or monovalent/divalent cation regulatory sites in pyruvate kinase and ribonucleotide reductase) where metal ion binding outside the catalytic center stabilizes the active conformational ensemble to modulate substrate affinity or turnover.
