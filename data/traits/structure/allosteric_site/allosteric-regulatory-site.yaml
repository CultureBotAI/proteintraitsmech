identifier: proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
label: "allosteric regulatory site"
definition: >-
  A topographically distinct ligand- or effector-binding pocket, physically separate from the orthosteric active or substrate-binding site, whose occupancy shifts the conformational ensemble or dynamic coupling of the protein to modulate functional activity.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:POCKET
synonyms:
  - synonym_text: "allosteric site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "allosteric effector pocket"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "Fpocket / AlloSitePro allosteric & cryptic pocket geometry predictor"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_2575
    tool: "biotools:fpocket"
    evidence_code: ECO:0007669
    reference: PMID:26950260
    recipe: "fpocket -f {input} -d && mv {input}_out {output}"
causal_graphs:
  - graph_id: allosteric_effector_ensemble_regulation
    title: "Allosteric effector pocket occupancy shifts conformational ensemble to regulate orthosteric activity"
    description: "An allosteric effector ligand (CHEBI:24020) binds at a topographically distinct small molecule binding pocket (GO:0036094), shifting the conformational ensemble to enable enzyme regulator activity (GO:0030234) that modulates orthosteric catalytic activity (GO:0003824)."
    nodes:
      - node_id: "CHEBI:24020"
        label: effector
        node_type: LIGAND
        grounding: "CHEBI:24020"
        description: "Allosteric modulator or physiological effector binding outside the active site."
      - node_id: "GO:0036094"
        label: "small molecule binding"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0036094"
        description: "Non-orthosteric effector binding at the allosteric regulatory cavity."
      - node_id: "GO:0030234"
        label: "enzyme regulator activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0030234"
        description: "Allosteric conformational coupling across the protein scaffold."
      - node_id: "GO:0003824"
        label: "catalytic activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003824"
        description: "Orthosteric enzyme catalytic activity modulated at a distance."
    edges:
      - subject: "CHEBI:24020"
        predicate: "molecularly interacts with"
        predicate_id: RO:0002436
        object: "GO:0036094"
        description: "Allosteric effector binds at the topographically distinct regulatory pocket."
        evidence:
          - reference: PMID:20971780
            snippet: "Allostery is the regulation of protein function, structure and/or flexibility induced by the binding of a ligand at a site topographically distinct from the orthosteric site."
            notes: "ASD definition and mechanism of allosteric sites (PMID:20971780). (ECO:0000305)"
      - subject: "GO:0036094"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0030234"
        description: "Ligand occupancy at the allosteric pocket redistributes the protein conformational ensemble."
        evidence:
          - reference: PMID:18722889
            snippet: "Allosteric ligands shift the population of pre-existing conformational states in the protein ensemble, propagating a regulatory signal to the distant functional site."
            notes: "Population-shift ensemble mechanism of allostery (PMID:18722889). (ECO:0000305)"
      - subject: "GO:0030234"
        predicate: regulates
        predicate_id: RO:0002211
        object: "GO:0003824"
        description: "Allosteric conformational coupling regulates orthosteric catalytic activity."
        evidence:
          - reference: PMID:20971780
            snippet: "Allostery is the regulation of protein function, structure and/or flexibility induced by the binding of a ligand at a site topographically distinct from the orthosteric site."
            notes: "Orthosteric activity regulation via allosteric site (PMID:20971780). (ECO:0000305)"
evidence:
