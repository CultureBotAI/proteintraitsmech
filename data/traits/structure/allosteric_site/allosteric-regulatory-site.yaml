identifier: proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
label: "allosteric regulatory site"
definition: >-
  A protein site distinct from an orthosteric functional site, whose engagement by an effector
  changes activity or affinity at that other site through coupling within the protein or protein
  complex.
definition_source: PMID:31665428
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: PROPOSED
synonyms:
- synonym_text: allosteric site
  synonym_type: EXACT_SYNONYM
- synonym_text: allosteric effector pocket
  synonym_type: NARROW_SYNONYM
detection_methods:
- name: fpocket candidate surface-pocket detection (allosteric function requires independent evidence)
  method_type: STRUCTURAL_ALGORITHM
  tool: biotools:fpocket
  reference: PMID:19486540
  recipe: fpocket -f {input}
  edam_operation: EDAM:operation_2575
  evidence_code: ECO:0007669

evidence:
- reference: PMID:31665428
  notes: AlloDriver and ASD characterize allosteric regulation induced by ligand binding at a site topographically
    distinct from an orthosteric site.
- reference: PMID:31707700
  notes: Allosteric mechanisms propagate the effect of ligand binding at one site to a spatially distant
    orthosteric locus, affecting activity.
- reference: PMID:19486540
  notes: Candidate pocket geometry is computational evidence; allosteric coupling requires independent
    support.
- reference: PMID:31665428
  notes: The ASD resource provides context for modulation at a site distinct from the orthosteric site;
    it does not impose one conformational or kinetic model.
