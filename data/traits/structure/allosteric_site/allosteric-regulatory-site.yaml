identifier: proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
label: "allosteric regulatory site"
definition: >-
  A topographically distinct ligand- or effector-binding pocket, physically separate from the orthosteric active or substrate-binding site, whose occupancy shifts the conformational ensemble or dynamic coupling of the protein to modulate functional activity.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:POCKET
synonyms:
  - synonym_text: "allosteric site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "allosteric effector pocket"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "Fpocket / AlloSitePro allosteric & cryptic pocket geometry predictor"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_2575
    tool: "biotools:fpocket"
    evidence_code: ECO:0007669
    reference: PMID:26950260
    recipe: "fpocket -f {input} -d && mv {input}_out {output}"
causal_graphs:
  - graph_id: allosteric_effector_ensemble_regulation
    title: "Allosteric effector pocket occupancy shifts conformational ensemble to regulate orthosteric activity"
    description: "An allosteric effector ligand (CHEBI:35224) binds at a topographically distinct small molecule binding pocket (GO:0036094), shifting the conformational ensemble to enable enzyme regulator activity (GO:0030234) that modulates orthosteric catalytic activity (GO:0003824)."
    nodes:
      - node_id: "CHEBI:35224"
        label: effector
        node_type: LIGAND
        grounding: "CHEBI:35224"
        description: "Allosteric modulator or physiological effector binding outside the active site."
      - node_id: "GO:0036094"
        label: "small molecule binding"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0036094"
        description: "Non-orthosteric effector binding at the allosteric regulatory cavity."
      - node_id: "GO:0030234"
        label: "enzyme regulator activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0030234"
        description: "Allosteric conformational coupling across the protein scaffold."
      - node_id: "GO:0003824"
        label: "catalytic activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003824"
        description: "Orthosteric enzyme catalytic activity modulated at a distance."
    edges:
      - subject: "GO:0036094"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:35224"
        description: "Small molecule binding at the topographically distinct regulatory pocket engages the allosteric effector."
        evidence:
          - reference: PMID:31665428
            snippet: "Allosteric regulation is one of the most direct and efficient ways to fine-tune protein function; it is induced by the binding of a ligand at an allosteric site that is topographically distinct from an orthosteric site."
            notes: "Allosteric site ligand binding definition (PMID:31665428). (ECO:0000305)"
      - subject: "GO:0036094"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0030234"
        description: "Ligand occupancy at the allosteric pocket propagates a conformational signal across the protein."
        evidence:
          - reference: PMID:31707700
            snippet: "An allosteric mechanism refers to the biological regulation process wherein macromolecules propagate the effect of ligand binding at one site to a spatially distant orthosteric locus, thus affecting activity."
            notes: "Propagation of ligand binding to distant orthosteric site (PMID:31707700). (ECO:0000305)"
      - subject: "GO:0030234"
        predicate: regulates
        predicate_id: RO:0002211
        object: "GO:0003824"
        description: "Allosteric conformational coupling regulates orthosteric catalytic activity."
        evidence:
          - reference: PMID:31665428
            snippet: "Allosteric regulation is one of the most direct and efficient ways to fine-tune protein function; it is induced by the binding of a ligand at an allosteric site that is topographically distinct from an orthosteric site."
            notes: "Orthosteric activity regulation via allosteric site (PMID:31665428). (ECO:0000305)"
evidence:
  - reference: PMID:31665428
    notes: "AlloDriver and ASD characterize allosteric regulation induced by ligand binding at a site topographically distinct from an orthosteric site."
  - reference: PMID:31707700
    notes: "Allosteric mechanisms propagate the effect of ligand binding at one site to a spatially distant orthosteric locus, affecting activity."
