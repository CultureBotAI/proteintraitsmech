identifier: proteintraitsmech:ALLOSTERIC_COVALENT_REGULATORY_SITE
label: "covalent allosteric regulatory site"
definition: >-
  An allosteric regulatory pocket containing a solvent-accessible or cryptically exposed nucleophilic residue (most commonly a reactive cysteine sulfhydryl, or lysine/tyrosine side chain) at which covalent adduct formation by an endogenous electrophile, reactive metabolite, or targeted covalent allosteric modulator allosterically shifts the protein conformational ensemble and regulates orthosteric ligand affinity, catalysis, or effector binding.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
synonyms:
  - synonym_text: "targeted covalent allosteric pocket"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "cysteine-reactive allosteric site"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "electrophile-modified allosteric regulatory site"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "Fpocket / AlloSitePro allosteric & cryptic pocket geometry predictor"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_2575
    tool: "biotools:fpocket"
    evidence_code: ECO:0007669
    reference: PMID:26950260
    recipe: "fpocket -f {input} -d && mv {input}_out {output}"
causal_graphs:
  - graph_id: covalent_allosteric_cysteine_adduct_regulation
    title: "Covalent effector modification of a nucleophilic residue in an allosteric pocket shifts the conformational ensemble to regulate protein activity"
    description: "An electrophilic allosteric effector binds within a topographically distinct allosteric pocket and forms a covalent bond with a nucleophilic cysteine side chain, remodeling surrounding switch loops to allosterically regulate nucleotide affinity and downstream effector or enzymatic activity."
    nodes:
      - node_id: "CHEBI:35224"
        label: effector
