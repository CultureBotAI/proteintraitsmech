identifier: proteintraitsmech:ALLOSTERIC_CRYPTIC_POCKET
label: "cryptic allosteric pocket"
definition: >-
  An allosteric ligand-binding pocket that is absent or occluded in a specified reference
  unliganded conformation and accessible in another conformational state.
definition_source: PMID:24256730
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
- proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
- proteintraitsmech:POCKET
synonyms:
- synonym_text: cryptic binding pocket
  synonym_type: BROAD_SYNONYM
- synonym_text: transient allosteric cavity
  synonym_type: RELATED_SYNONYM
detection_methods:
- name: fpocket candidate surface-pocket detection (allosteric function requires independent evidence)
  method_type: STRUCTURAL_ALGORITHM
  tool: biotools:fpocket
  reference: PMID:19486540
  recipe: fpocket -f {input}
  edam_operation: EDAM:operation_2575
  evidence_code: ECO:0007669

evidence:
- reference: PMID:42734533
  notes: 'Computational pocket-opening study: cryptic ligand-binding sites are inaccessible in a reference
    apo conformation and accessible after conformational change. This does not establish allosteric
    function.'
- reference: PMID:42821008
  notes: Perspective on allosteric and cryptic pockets as drug-target opportunities; contextual discussion,
    not a primary causal experiment.
- reference: PMID:19486540
  notes: Candidate pocket geometry is computational evidence; allosteric coupling requires independent
    support.
- reference: PMID:31665428
  notes: The ASD resource provides context for modulation at a site distinct from the orthosteric site;
    it does not impose one conformational or kinetic model.
- reference: PMID:24256730
  notes: The KRAS(G12C) switch-II pocket supplies one experimentally studied example of a previously
    unobserved pocket with effects on nucleotide preference and Raf interaction.
