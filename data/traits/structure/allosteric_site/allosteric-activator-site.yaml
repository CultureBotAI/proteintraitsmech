            snippet: "Allosteric activators bind to a distinct allosteric site and stabilize the active conformation of the enzyme or receptor."
            notes: "R-state stabilization by allosteric activators (PMID:20971780). (ECO:0000305)"
      - subject: "GO:0008047"
