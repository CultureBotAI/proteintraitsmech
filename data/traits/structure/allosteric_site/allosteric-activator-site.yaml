identifier: proteintraitsmech:ALLOSTERIC_ACTIVATOR_SITE
label: "allosteric activator site"
definition: >-
  An allosteric regulatory site whose engagement by an effector increases a specified functional
  activity or orthosteric ligand affinity under defined conditions.
definition_source: PMID:31665428
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
