identifier: proteintraitsmech:ALLOSTERIC_ACTIVATOR_SITE
label: "allosteric activator site"
definition: >-
  An allosteric regulatory pocket whose binding by a positive effector stabilizes the high-affinity or catalytically competent (R-state) conformation, increasing substrate affinity (K-type) or catalytic turnover (V-type).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
synonyms:
  - synonym_text: "positive allosteric modulator site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "PAM binding site"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "Fpocket / AlloSitePro allosteric & cryptic pocket geometry predictor"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_2575
    tool: "biotools:fpocket"
    evidence_code: ECO:0007669
    reference: PMID:26950260
    recipe: "fpocket -f {input} -d && mv {input}_out {output}"
causal_graphs:
  - graph_id: allosteric_activator_r_state_stabilization
    title: "Positive allosteric modulator binding stabilizes the active R-state to enhance catalysis"
    description: "A positive allosteric modulator (CHEBI:35224) binds the activator pocket via small molecule binding (GO:0036094), driving enzyme activator activity (GO:0008047) that positively regulates orthosteric catalytic activity (GO:0003824)."
    nodes:
      - node_id: "CHEBI:35224"
        label: effector
        node_type: LIGAND
        grounding: "CHEBI:35224"
        description: "Positive allosteric modulator (PAM) or physiological activator ligand."
      - node_id: "GO:0036094"
        label: "small molecule binding"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0036094"
        description: "Positive effector binding at the allosteric activator pocket."
      - node_id: "GO:0008047"
        label: "enzyme activator activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0008047"
        description: "Stabilization of the high-affinity/high-turnover R-state conformation."
      - node_id: "GO:0003824"
        label: "catalytic activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003824"
        description: "Enhanced orthosteric substrate affinity (K-type) or catalytic rate (V-type)."
    edges:
      - subject: "GO:0036094"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:35224"
        description: "Small molecule binding at the activator pocket engages the positive allosteric effector."
        evidence:
          - reference: PMID:31665428
            snippet: "Allosteric regulation is one of the most direct and efficient ways to fine-tune protein function; it is induced by the binding of a ligand at an allosteric site that is topographically distinct from an orthosteric site."
            notes: "Allosteric activator site ligand engagement (PMID:31665428). (ECO:0000305)"
      - subject: "GO:0036094"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0008047"
        description: "Activator pocket occupancy propagates an activating conformational change to the orthosteric site."
        evidence:
          - reference: PMID:31707700
            snippet: "An allosteric mechanism refers to the biological regulation process wherein macromolecules propagate the effect of ligand binding at one site to a spatially distant orthosteric locus, thus affecting activity."
            notes: "Allosteric propagation to enzyme activation (PMID:31707700). (ECO:0000305)"
      - subject: "GO:0008047"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0003824"
        description: "Enzyme activator activity increases orthosteric catalytic turnover or substrate affinity."
        evidence:
          - reference: PMID:31665428
            snippet: "Allosteric regulation is one of the most direct and efficient ways to fine-tune protein function; it is induced by the binding of a ligand at an allosteric site that is topographically distinct from an orthosteric site."
            notes: "Positive regulation of catalytic activity (PMID:31665428). (ECO:0000305)"
evidence:
