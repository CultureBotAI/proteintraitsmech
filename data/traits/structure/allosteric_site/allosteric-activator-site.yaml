        evidence:
          - reference: PMID:20971780
            snippet: "Allosteric modulators are classified into three categories in ASD: activators, which increase the activity of the target protein; inhibitors, which decrease the activity; and regulators."
            notes: "Allosteric activator classification in ASD (PMID:20971780). (ECO:0000305)"
      - subject: "GO:0036094"
        predicate: "causally upstream of"
