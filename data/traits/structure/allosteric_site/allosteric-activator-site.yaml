    title: "Positive allosteric modulator binding stabilizes the active R-state to enhance catalysis"
    description: "A positive allosteric modulator (CHEBI:24020) binds the activator pocket via small molecule binding (GO:0036094), driving enzyme activator activity (GO:0008047) that positively regulates orthosteric catalytic activity (GO:0003824)."
