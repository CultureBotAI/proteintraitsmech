identifier: proteintraitsmech:ALLOSTERIC_INHIBITOR_SITE
label: "allosteric inhibitor site"
definition: >-
  An allosteric regulatory site whose engagement by an effector decreases a specified functional
  activity or orthosteric ligand affinity under defined conditions.
definition_source: PMID:31665428
