        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:35224"
        description: "Small molecule binding at the allosteric inhibitor pocket engages the negative effector."
        evidence:
          - reference: PMID:31665428
            snippet: "Allosteric regulation is one of the most direct and efficient ways to fine-tune protein function; it is induced by the binding of a ligand at an allosteric site that is topographically distinct from an orthosteric site."
            notes: "Allosteric inhibitor pocket ligand engagement (PMID:31665428). (ECO:0000305)"
      - subject: "GO:0036094"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0004857"
        description: "Inhibitor pocket occupancy propagates an inhibitory conformational signal to the orthosteric site."
        evidence:
          - reference: PMID:31707700
            snippet: "An allosteric mechanism refers to the biological regulation process wherein macromolecules propagate the effect of ligand binding at one site to a spatially distant orthosteric locus, thus affecting activity."
            notes: "Allosteric propagation to enzyme inhibition (PMID:31707700). (ECO:0000305)"
      - subject: "GO:0004857"
        predicate: "negatively regulates"
        predicate_id: RO:0002212
        object: "GO:0003824"
        description: "Allosteric enzyme inhibitor activity non-competitively attenuates orthosteric catalysis."
        evidence:
