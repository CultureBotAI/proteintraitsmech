identifier: proteintraitsmech:ALLOSTERIC_INHIBITOR_SITE
label: "allosteric inhibitor site"
definition: >-
  An allosteric regulatory pocket whose occupancy by a negative effector or feedback inhibitor stabilizes a low-affinity or catalytically autoinhibited (T-state) conformation, reducing orthosteric activity non-competitively.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
synonyms:
  - synonym_text: "negative allosteric modulator site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "NAM binding site"
    synonym_type: RELATED_SYNONYM
  - synonym_text: "feedback inhibition allosteric site"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "Fpocket / AlloSitePro allosteric & cryptic pocket geometry predictor"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_2575
    tool: "biotools:fpocket"
    evidence_code: ECO:0007669
    reference: PMID:26950260
    recipe: "fpocket -f {input} -d && mv {input}_out {output}"
causal_graphs:
