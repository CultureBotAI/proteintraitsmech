    description: "A negative allosteric modulator or feedback inhibitor (CHEBI:24020) binds at the allosteric inhibitor pocket via small molecule binding (GO:0036094), mediating enzyme inhibitor activity (GO:0004857) that negatively regulates orthosteric catalytic activity (GO:0003824)."
