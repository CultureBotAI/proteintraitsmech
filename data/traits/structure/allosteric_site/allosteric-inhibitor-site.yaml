    title: "Negative allosteric modulator binding stabilizes the T-state to inhibit catalysis"
    description: "A negative allosteric modulator or feedback inhibitor (CHEBI:35224) binds at the allosteric inhibitor pocket via small molecule binding (GO:0036094), mediating enzyme inhibitor activity (GO:0004857) that negatively regulates orthosteric catalytic activity (GO:0003824)."
    nodes:
