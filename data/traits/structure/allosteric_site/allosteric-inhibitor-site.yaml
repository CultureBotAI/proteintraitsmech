identifier: proteintraitsmech:ALLOSTERIC_INHIBITOR_SITE
label: "allosteric inhibitor site"
definition: >-
  An allosteric regulatory pocket whose occupancy by a negative effector or feedback inhibitor stabilizes a low-affinity or catalytically autoinhibited (T-state) conformation, reducing orthosteric activity non-competitively.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
