  - node_id: product1
    label: 1-deoxy-D-xylulose 5-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57792
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu373 deprotonates the N1 position of TDP. Charge delocalisation across the conjugated
      molecule results in concomitant deprotonation of the thiazole ring, activating the cofactor for
      the next steps in catalysis. The ionisation of TDP is fast compared to enzymatic turnover, and is
      therefore not rate determining [PMID:19476486].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The TDP carbanion, stabilised as an ylid, attacks the carbonyl of pyruvate forming a
      covalently bound intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion intermediate collapses to generate carbon dioxide and a TDP-enol intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The carbanion attacks at the glyceraldehyde group to form a tetrahedral oxyanion intermediate.
      Electron delocalisation across the thiazole ring allows for several resonance structures.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The tetrahedral intermediate collapses releasing the TDP ylid and 1-deoxy-D-xylulose
      5-phosphate, the product which enters the isoprenoid biosynthesis pathway [PMID:19778006].
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The cofactor is reprotonated.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The cofactor is reprotonated in an inferred return step.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
