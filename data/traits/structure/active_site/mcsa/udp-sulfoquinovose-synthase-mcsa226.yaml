  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Tyr182 deprotonates the 4'-hydroxyl of UDP-glucose causing the formation of a ketone
      with concomitant hydride transfer from C4' of the substrate to C4 of NAD<sup>+</sup>.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: His183 deprotonates C5' of the intermediate and causes the elimination of the O6' hydroxyl
      group to form a C5'=C6' double bond. Due to lack of evidence it has been inferred that protonated
      water acts as the proton donor for the O6' hydroxyl leaving group.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Sulfite is added across the double bond by electrophilic addition with His183 protonating
      the C5' position.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: NADH transfers a hydride from C4 of NADH to C4' of the intermediate. The resulting alkoxide
      is protonated by Tyr182.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
  - node_id: active_site
    label: UDP-sulfoquinovose synthase catalytic site
