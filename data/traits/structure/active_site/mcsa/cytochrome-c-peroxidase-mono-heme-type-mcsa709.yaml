causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of cytochrome-c peroxidase (mono-heme type)
  description: Stepwise mechanism transcribed from M-CSA entry 709 (8 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: ala48
    label: catalytic Ala48 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00431
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: his52
    label: catalytic His52 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00431
    description: 'M-CSA roles: electrostatic stabiliser, proton acceptor, proton donor.'
  - node_id: trp191
    label: catalytic Trp191 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00431
    description: 'M-CSA roles: single electron acceptor, single electron donor.'
  - node_id: reactant0
    label: iron(2+)
    node_type: CHEMICAL
    grounding: CHEBI:29033
  - node_id: reactant1
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: reactant2
    label: hydrogen peroxide
    node_type: CHEMICAL
    grounding: CHEBI:16240
  - node_id: product0
    label: iron(3+)
    node_type: CHEMICAL
    grounding: CHEBI:29034
  - node_id: product1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His52 acts as a general base to abstract a proton from the peroxide. The peroxide then
      binds to the Fe3+ centre.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxygen-oxygen bond is cleaved heterolytically leaving an electron-deficient 'oxene'
      bound to the heme iron. His52 donates its proton to the hydroxide to form water. The electron-deficient
      'oxene' is stabilised by electron transfer from the porphyrin ring and heme iron, resulting in a
      oxy-ferryl Fe(IV) porphyrin pi-cation radical species.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Trp191 reduces the porphryin pi-cation radical to generate the stable form of CcP Compound
      I (Cpd-I).
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Cc(Fe2+) binds to the high affinity binding site and transfers an electron to Trp191,
      forming Compound II (CpdII) and Cc(Fe3+).
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The oxy-ferryl heme is reduced by Trp191 and the radical Trp191 cation is regenerated.
      Oxygen accepts a proton to form a hydroxide ion.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The hydroxide ion accepts another proton and a second molecule of water is produced.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Cc3+ dissociates and a second molecule of Cc2+ binds. The Trp191 radical cation is reduced
      and Cc3+ is formed. Cc3+ dissociates and the native state of the enzyme is restored.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: cytochrome-c peroxidase (mono-heme type) catalytic site
    node_type: MOTIF
    grounding: MCSA:709
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 1.10.520.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:1.10.520.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: cytochrome-c peroxidase (mono-heme type) activity
    node_type: MOLECULAR_FUNCTION
    xrefs:
    - EC:1.11.1.5
