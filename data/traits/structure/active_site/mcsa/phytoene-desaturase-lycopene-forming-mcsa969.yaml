    node_type: STATE
    description: Arg152 and Arg148 polarise the C = C double bond,  thereby acidifying the neighbouring
      C-H functionality. Asp149 abstracts a proton from the substrate, facilitating a hydride transfer
      to FAD from the substrate and forms a C-C double bond. Following this, a <i>cis</i> to <i>trans</i>
      isomerisation occurs in the substrate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: FADH<sup>-</sup> accepts a proton to stabilise the negative charge following hydride
      addition. FADH<sub>2</sub> then leaves the active site and is replaced by a new FAD while also regenerating
      the native state of the enzyme. This step is inferred by the curator.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Asp149 deprotonates a saturated bond, allowing FAD to abstract a hydride. Arg152 and
      Arg148 acidify the saturated bond while Glu31 binds the FAD in place.
