    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/208/
      snippet: The alkoxide of the semi-quinone intermediate initiates a second single electron transfer
        (forming the first quinone product) through two heme groups to the quinone substrate, which initiates
        double bond rearrangement generating a semi-quinone intermediate. The second electron oxidation
        of the semiquinone occurs at the Qo site. This second electron is transferred to hemes bL (HEM401)
        and bH (HEM402) in sequence, ending at the quinone in the Qi site. The rotational displacement
        of Glu295 in the Qo site is favourable for its proton transfer in the next reaction step. The
        first electron reduction of quinone occurs in the Qi site and is shown here as being concurrent
        with the second electron oxidation. However, it is unclear of the exact timings of these events.
        It has been documented [PMID:12885240] that the ubisemiquinone radical produced during this step
        required an alkaline pH to be stable in the Qi site, consistent with the assumption that both
        Asp228 and His201 are deprotonated. Furthermore, electron nuclear double resonance experiments
        showed exchangeable H-bonds bonds to the ubisemiquinone radical, suggesting that the water-mediated
        H-bonding acts to stabilise the free radical formed.
      notes: M-CSA entry 208, mechanism 1; M-CSA cites PMID:11726495, PMID:12885240, PMID:16005845, PMID:17145759,
        PMID:18973379; step 2
