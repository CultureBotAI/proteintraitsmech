      snippet: Water deprotonates His161, which initiates a single electron transfer from the Rieske iron-sulfur
        complex to the heme group of cytochrome-c1. Concurrently, water deprotonates Glu272. This step
        represents the regeneration of the Qo active site in order that the second quinol molecule may
        be oxidised. The transfer of the electron from the iron-sulfur cluster is shown here as being
        a concerted transfer from the iron-sulfur cluster to the cytochrome-c1 and then to the soluble
        electron acceptor. However, the exact timings of these transfers with respect to the mechanism
        is unclear. The rotational displacement of Glu272 occurs prior to this step and is favourable
        for the transfer of its proton to the bulk solvent. The Rieske iron-sulfur cluster (now Fe(II)Fe(III)S2)
        also undergoes a conformational change to allow it to reach the cytochrome-c1 (HEM3) for the electron
        transfer. These local movements are clearly complexed with the oxidation of heme bH and ubiquinone
        reduction.
      notes: M-CSA entry 208, mechanism 1; M-CSA cites PMID:11726495, PMID:12885240, PMID:16005845, PMID:17145759,
        PMID:18973379; step 3
