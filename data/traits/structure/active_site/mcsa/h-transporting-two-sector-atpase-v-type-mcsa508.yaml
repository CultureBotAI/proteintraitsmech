    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Cys1 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/508/
      snippet: Protein splicing begins with an acyl rearrangement at the N-terminal junction where Cys
        1 attacks the carbonyl carbon of the preceding residue forming a thioester intermediate. The nucleophilicity
        of the cysteine residue is increased by polarisation by Asn 76, which acts as a general base catalyst,
        and the transition state is stabilised by the backbone nitrogen of Gly 433. His 79 protonates
        the amide nitrogen of Cys 1 to promote breakdown of the tetrahedral intermediate to a thioester.
        Cys 455, activated by a zinc ion, nucleophilically attacks the same carbonyl carbon as Cys 1 causing
        release of Cys 1. Cyclisation of Asn 454 follows, with nucleophilic attack by the nitrogen activated
        by the carbonyl oxygen of Ile 434 on the carbonyl carbon, with the transition state stabilised
        by the zinc ion. On cleavage of the peptide bond His 453, activated by Zn, can act as a proton
        donor to Cys 455. Stabilisation is also provided by Asn 76 and Thr 78.
      notes: M-CSA entry 508, mechanism 1; M-CSA cites PMID:10601013, PMID:10828056, PMID:11123916, PMID:12219083,
        PMID:7988548, PMID:8703028; step 1
