    label: mechanism step 2
    node_type: STATE
    description: The tetrahedral intermediate collapses and eliminates 6-aminopenicillanate, with proton
      transfer from the alpha amine to the leaving group. Proton transfer between the alpha-amine and
      the amine leaving group may be mediated by water.
