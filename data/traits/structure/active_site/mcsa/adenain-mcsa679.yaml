    grounding: UniProtKB:P03252
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: reactant0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: reactant1
    label: dipeptide zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:90799
  - node_id: product0
    label: L-alpha-amino acid zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:59869
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His54 deprotonate Cys122 activating it so that it can attack the carbon of the peptide
      bond in a nucleophilic addition.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination resulting in the cleavage of the peptide bond.
      The N-terminal product then accepts a proton from His54 which prevents reformation of the peptide
      bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His54 deprotonates water activating it so that it can attack the carbon of the thioester
      bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates another elimination resulting in the cleavage of the thioester
      bond. The released Cys122 accepts a proton from His54 which returns the enzyme to its native state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
  - node_id: active_site
    label: adenain catalytic site
    node_type: MOTIF
    grounding: MCSA:679
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.395.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.40.395.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: adenain activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0004197
    description: Grounded to the EC *class*-level GO term (cysteine-type endopeptidase activity); GO's ec2go has no term for the exact EC:3.4.22.39, so this is broader than the enzyme's specific activity.
    xrefs:
    - EC:3.4.22.39
