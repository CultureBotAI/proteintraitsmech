    label: catalytic His54 (M-CSA/PDB numbering; UniProt residue 54)
    node_type: RESIDUE
    grounding: UniProtKB:P03252
    description: 'M-CSA roles: proton acceptor, proton donor.'
  - node_id: glu71
    label: catalytic Glu71 (M-CSA/PDB numbering; UniProt residue 71)
    node_type: RESIDUE
    grounding: UniProtKB:P03252
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: gln115
