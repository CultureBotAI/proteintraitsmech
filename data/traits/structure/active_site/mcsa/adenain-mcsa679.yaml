    node_type: RESIDUE
    grounding: UniProtKB:P03252
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: cys122
    label: catalytic Cys122 (M-CSA/PDB numbering; UniProt residue 122)
