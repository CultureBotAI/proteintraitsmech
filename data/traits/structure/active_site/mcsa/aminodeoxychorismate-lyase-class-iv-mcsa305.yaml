  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amine of the substrate attacks the PLP cofactor in a nucleophilic addition and the
      bound Lys159 deprotonates the newly attached amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine initiates an elimination of the covalently bound lysine, forming
      free PLP and lysine in a neutral state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys159 deprotonates the CH adjacent to the bound amine, resulting in double bond rearrangement
      with the PLP cofactor acting as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The PLP feeds the electrons back, resulting in the cleavage of the C-O attached to the
      aromatic ring and the C=C of the released substrate deprotonating Lys159.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The amine of Lys159 attacks the PLP in a nucleophilic addition reaction, the secondary
      amine of the attached substrate reprotonates from the bound Lys159.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound product, resulting in 4-aminobenzoate and the regenerated PLP cofactor
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
