  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The substrate undergoes heterolysis. The diphosphate product remains associated with
      the active site, and the cabocation is delocalised over the three terminal carbon atoms of the intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The diphosphate initiates nucleophilic attack at the C4 carbon, which causes double bond
      rearrangement and the formation of the linalyl diphosphate intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Isomerisation to linalyl diphosphate allows rotation of the newly formed C2-C3 bond to
      the cisoid conformer.  The  linalyl diphosphate undergoes heterolysis. The diphosphate product remains
      associated with the active site, and the cabocation is delocalised over the three terminal carbon
      atoms of the intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The terminal double bond adds to the newly formed carbocation in an intramolecular electrophilic
      addition resulting in a cyclic intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The remaining double bond adds to the newly formed carbocation in an intramolecular electrophilic
      addition resulting in a bicyclic intermediate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The diphosphate initiates nucleophilic attack at the carbocation, forming the final product.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
