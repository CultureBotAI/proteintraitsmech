  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "In the initial state Gfa exists in the presence of both oxidized and reduced glutathione,\
      \ with the zinc being coordinated to the three cys residues in a trigonal planar conformation.
\
      
Cys56 forms a disulphide bond with glutathione by performing a nucleophilic attack on the oxidized\
      \ form.
This results in the zinc being dislocated from the cys residues."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "The zinc is now coordinated to three glutathiones, a ligand thought to be either water\
      \ or histidine, and the formaldehyde.
The zinc polarizes the thiol group of one of the reduced\
      \  glutathiones as well as the formaldehyde. This facillitates the nucelophilic attack of the thiol\
      \ onto the formaldehyde carbonyl. Forming the product. 
The other reduced glutathione forms a\
      \ disulphide bond with the Cys"
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Products.
