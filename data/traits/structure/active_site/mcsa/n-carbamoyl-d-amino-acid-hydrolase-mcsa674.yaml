      snippet: The proposed mechanism suggests that Glu46 acts as a base to deprotonate the thiol group
        of Cys171 to promote its nucleophilic attack on the carbonyl carbon of the substrate to form an
        acylenzyme intermediate and ammonia. Glu46 then protonates the leaving group and activates a water
        molecule to restore the enzyme from the acylenzyme intermediate. The released N-carboxy-amino
        acid spontaneously collapses and converts to the corresponding D-amino acid and carbon dioxide.
        The negatively charged transition state in the reaction is stabilised by an oxyanion hole formed
        by Lys126.
