    label: mechanism step 5
    node_type: STATE
    description: The ThDP C-2 and the 4'-amino group bond reforms which causes nucleophilic attack of
      the double bond on a second equivalent of pyruvate. A proton is subsequently transferred between
      the developing oxyanion on the second pyruvate and the other hydroxyl group.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The tetrahedral oxyanion intermediate collapses, releasing ThDP and the product.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: In an inferred step the C2 carbanion of ThDP is reprotonated to regenerate the neutral
