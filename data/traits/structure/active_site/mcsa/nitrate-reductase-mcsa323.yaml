  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Nitrite substitutes water at the heme proximal coordination site.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ferredoxin donates one electron to the siroheme centre, via the iron-sulfur cluster,
      which is then shuttled to the nitrite ligand.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: A second Ferredoxin donates one electron to the siroheme centre which is again shuttled
      to the nitrite, followed by either deprotonation of a proximate basic residue or protonation by
      a solvent molecule.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The reduced nitrate eliminates water. It is unclear whether residues or solvent molecules
      act as proton donors in this reaction. Conservation of Arg109, Arg223 and Lys224, and their close
      proximity to both the active site and a solvent channel suggests that these residues may be involved
      in providing protons for the reaction. Equally though, solvent molecules from the channel could
      act as proton d
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The iron centre donates a single electron to the nitric oxide radical, initiating protonation
      at the nitrogen.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The active site residues are reprotonated for the next round of reduction. Crystallographic
      and circular diachrosim studies have shown the binding or lack of binding of ferredoxin to control
      solvent access to the active site [PMID:14717606]. It is postulated that when ferredoxon is not
      bound, the solvent channel opens, increasing the pKa of ionisable residues and reprotonating those
      thought to act
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Another molecule of reduced ferredoxin donates a single electron through the cluster
      and heme cofactors to the nitrogen-oxygen ligand.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Another molecule of reduced ferredoxin donates a single electron through the cluster
      and heme cofactors, this time to the radical nitrogen-oxygen ligand, forming hydroxylamine. While
      very little information is known about the reaction intermediates of nitrate reductase, kinetic
      studies have shown the presence of hydroxylamine, the intermediate formed in this step, to drive
      the reduction of ascorba
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The active site residues are reprotonated for the next round of reduction
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Reduced ferredoxin donates a single electron through the cluster and heme cofactors initiating
      the elimination of water.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Reduced ferredoxin donates a single electron through the cluster and heme cofactors to
      the axial nitrogen ligand, initiating protonation to form ammonia.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The ammonia ligand is protonated and substituted by a water molecule. The departing ammonia
      could abstract a proton from either a solvent molecule located in the solvent channel, or from a
      protonated residue within the active site.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: The ionisable residues surrounding the active site are reprotonated in the absence of
      ferredoxin binding. As inferred from structural and spectroscopic studies, the ionisable residues
      proxmiate to the active site and solvent channel are reprotonated for the next round of catalysis
      [PMID:19226104].
