  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His117/Asp120 dyad and the two zinc ions activate a water molecule to perform a nucleophiliic
      attack on the phosphate group. This forms a penta-covalent intermediate stabilized by the arginine
      residues. The bridging water is thought to be the nucleophile as it has the lowest pKa out of the
      potential water molecules.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Since no acidic residues are positioned to protonate the leaving group this role is thought
      to be performed by a solvent water molecule. This leaves a tetrahedral phosphate bound to the zinc
      ions.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Phosphate leaves the active site and the active site transitions to its resting state
      with each zinc ion being 5 coordinate and no terminal water molecules coordianted.
