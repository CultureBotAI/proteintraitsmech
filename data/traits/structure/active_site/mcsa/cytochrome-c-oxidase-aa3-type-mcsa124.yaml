  - node_id: reactant0
    label: dioxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
  - node_id: reactant1
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: reactant2
    label: iron(2+)
    node_type: CHEMICAL
    grounding: CHEBI:29033
  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: iron(3+)
    node_type: CHEMICAL
    grounding: CHEBI:29034
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Dioxygen initiates a electrophilic attack on Fe(II).
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Dioxygen transfers two electrons to Fe(II). Through a series of homolytic reactions,
      the copper centre then transfers a single electron to Tyr244, and the dioxygen bond is cleaved.
      The net result is Fe(IV) with a oxo group bound,a tyrosyl radical and Cu(II) with a hydroxide group
      bound.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Water deprotonates His291. The Cu(II) bound hydroxide deprotonates bulk water through
      a proton relay chain that includes 11 water molecules, Glu242, Ser157, Ser156 and Asp91.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A single electron is transferred from ferrocytochrome C, to CuA, Haem A to Haem A3 and
      thence to Cu(II), which immediately donates its electron to the tyrosyl radical. His291 deprotonates
      water, which deprotonates Arg438, thence Trp126 which deprotonates bulk water through a proton relay
      chain that includes 10 water molecules, Glu242, Ser157, Ser156 and Asp91.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Tyr244 deprotonates Cu(II) bound water.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Water deprotonates His291. The Cu(II) bound hydroxide deprotonates bulk water through
      a proton relay chain that includes 11 water molecules, Glu242, Ser157, Ser156 and Asp91.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: A single electron is transferred from ferrocytochrome C, to CuA, Haem A to Haem A3 and
      thence to Cu(II). His291 deprotonates water, which deprotonates Arg438, thence Trp126 which deprotonates
      bulk water through a proton relay chain that includes 10 water molecules, Glu242, Ser157, Ser156
      and Asp91.
  - node_id: step8
