      snippet: Transaldimation of the substrate, forming a Schiff base with the PLP cofactor follows from
        the deprotonation of C(alpha) by Tyr111. This external aldimine has the alpha-carboxylate and
        sulphur atom aligned for proton transfer from the alpha-carbon to the epsilon-N of Lys210. In
        C-S bond cleavage, Lys210 abstracts the alpha-C proton, forming a quinoid intermediate. The residue's
        positive charge attracts the anionic phosphate of the coenzyme, aligning Lys210 to donate a proton
        to the gamma sulphur. Elimination of homocysteine generates the PLP derivative of aminoacrylate,
        which having accepting a proton from Tyr111 is converted to iminopropionate. This product is hydrolysed
        to pyruvate and ammonia outside of the enzyme.
