  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Hydrogen peroxide binds to the Fe(III) centre of the heme cofactor, displacing water.
      The hydrogen peroxide undergoes self de-protonation to produce the activated species.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The activated hydrogen peroxide species collapses, with concomitant movement of an electron
      pair to the iron centre of heme, and shuttling of a single electron out into the porphyrin ring
      of the cofactor. This generates the so-called compound I.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The chloride ion initiates a nucleophilic attack on the oxo group of Compound I in an
      addition reaction which results in the donation of two electrons to the iron centre, and a single
      electron being transferred to the prophyrin ring.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The intermediate deprotonates Glu183, which in turn deprotonates His105.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: His105 deprotonates Glu183, which in turn deprotonates the alkane. This initiates a nucleophilic
      attack upon the heme-bound hypochlorous acid in a substitution reaction. R represents the organic
      portion of the substrate to be halogenated. The exact mechanism of this step is unclear and may
      well depend upon the nature of the R group.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The exact mechanism by which the hydroxide is re-protonated and then dissociates from
      the Fe(III) centre is not entirely clear. The proton probably comes from a water molecule.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: chloride peroxidase (heme dependent) catalytic site
    node_type: MOTIF
    grounding: MCSA:250
