    label: mechanism step 1
    node_type: STATE
    description: Asp50 deprotonates the ammonium ion to produce ammonia. This activates ammonia.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Substrate nucleophilically attacks Phosphorus on ATP resulting in the γ-phosphate being
      transferred to glutamate. This activates glutamate by increasing its electerophilicity.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Ammonia nucleophilically attacks the δ‐carbon of γ‐glutamyl phosphate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Phosphate deprotonates Glutamine. The enzyme is not regenerated in this last step since
      Asp50 is still protonated. This proton will probably be released into the solution to return the
      enzyme to its original state.
