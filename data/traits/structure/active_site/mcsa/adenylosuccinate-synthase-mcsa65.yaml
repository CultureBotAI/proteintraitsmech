definitions:
  - kind: MECHANISTIC
    text: >-
      Adenylosuccinate synthetase is an essential enzyme in Escherichia coli and many other forms of life, catalysing the first committed step in de novo biosyntheses of AMP: The catalytic mechanism proceeds with the initial formation of 6-phosphoryl-IMP by nucleophilic attack of the 6-oxo group of IMP on the gamma-phosphorus atom of GTP, followed by the nucleophilic displacement of the 6-phosphoryl group by L -aspartate to form adenylosuccinate.
    source: "M-CSA"
    method: SOURCED
causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of adenylosuccinate synthase
  description: Stepwise mechanism transcribed from M-CSA entry 65 (5 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +1).
  nodes:
  - node_id: asp13
    label: catalytic Asp13 (M-CSA/PDB numbering; UniProt residue 14)
    node_type: RESIDUE
    grounding: UniProtKB:P0A7D4
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, hydrogen bond donor,
      metal ligand, proton acceptor, proton donor.'
  - node_id: lys16
    label: catalytic Lys16 (M-CSA/PDB numbering; UniProt residue 17)
    node_type: RESIDUE
    grounding: UniProtKB:P0A7D4
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond donor.'
  - node_id: gly40
    label: catalytic Gly40 (M-CSA/PDB numbering; UniProt residue 41)
    node_type: RESIDUE
    grounding: UniProtKB:P0A7D4
    description: 'M-CSA roles: metal ligand.'
  - node_id: his41
    label: catalytic His41 (M-CSA/PDB numbering; UniProt residue 42)
    node_type: RESIDUE
    grounding: UniProtKB:P0A7D4
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, hydrogen bond donor,
      proton acceptor, proton donor.'
  - node_id: gln224
    label: catalytic Gln224 (M-CSA/PDB numbering; UniProt residue 225)
    node_type: RESIDUE
    grounding: UniProtKB:P0A7D4
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond donor.'
  - node_id: reactant0
    label: IMP(2-)
    node_type: CHEMICAL
    grounding: CHEBI:58053
  - node_id: reactant1
    label: GTP(4-)
    node_type: CHEMICAL
    grounding: CHEBI:37565
  - node_id: reactant2
    label: L-aspartate(1-)
    node_type: CHEMICAL
    grounding: CHEBI:29991
  - node_id: product0
    label: N(6)-(1,2-dicarboxylatoethyl)-AMP(4-)
    node_type: CHEMICAL
    grounding: CHEBI:57567
  - node_id: product1
    label: GDP(3-)
    node_type: CHEMICAL
    grounding: CHEBI:58189
  - node_id: product2
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: product3
    label: hydrogenphosphate
    node_type: CHEMICAL
    grounding: CHEBI:43474
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp13 deprotonates IMP with concomitant tautomerisation to give the oxyanion, which is
      stabilised by a hydrogen bond from Gln224. Activated IMP is produced. His41 and Mg stabilise the
      GTP.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Activated IMP acts as a nucleophile and attacks the gamma-phosphate of GTP in a substitution
      reaction. GDP and phosphorylated IMP are produced. His41 and Mg stabilise the GTP, Asp13 and Gln223
      stabilise the activated IMP.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The amine nitrogen of L-aspartate acts as a nucleophile upon the C6 of the phosphorylated
      IMP in a substitution reaction at an aromatic species. The IMP intermediate is dephosphorylated.
      The liberated phosphate group accepts a proton from the stabilising His41. Asp13 and Gln223 continue
      to stabilise the IMP intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Inferred return step in which His41 deprotonates the bound phosphate, which in turn deprotonates
      Asp13. It is assumed that the positive nitrogen of the product loses its extra proton to either
      one of the carboxylate groups (shown) or bulk solvent.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products
  - node_id: active_site
    label: adenylosuccinate synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:65
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
