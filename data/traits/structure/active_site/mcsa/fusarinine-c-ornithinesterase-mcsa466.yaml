      snippet: "Computational studies on the pKa and proton relay chains in the active site of EstB have\
        \ suggested the following mechanism:<ol>
<li>Ser75 is activated by bonds to Tyr181 (held in\
        \ place by H-bonds with Lys 78 and Trp 348 side chains). Ser75 is deprotonated by a proton relay\
        \ chain that involves  Lys78, Tyr133, HOH and Asp186. Once activated, Ser75 initiates the nucleophilic\
        \ attack on the substrate. The main chain amide groups of Ser 75 and Val 351 can hydrogen bond\
        \ to the ester substrate, activating the ester bond as an electrophile.</li>
<li>The intermediate\
        \ collapses, acylating Ser 75. The hydroxyl leaving group is protonated through the same proton\
        \ relay chain as in step 1.</li>
<li>Deacylation of the acyl-enzyme is by hydrolysis, the catalytic\
        \ residues playing the same roles as they did in the acylation steps.</li></ol>"
