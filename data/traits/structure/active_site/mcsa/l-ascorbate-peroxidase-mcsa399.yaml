    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: "The mechanism can be broken down into four steps: 
<ol>
<li>Fe(III) + H2O2 = Compound\
      \ I (Fe(IV) radical) + H2O. This first step is catalysed by residues on the distal side of the heme\
      \ group. H2O2 enters the active site and binds to the heme Fe, His 42, and Arg 38. The oxygen of\
      \ H2O2 that is bound to the Fe donates a proton to the NE of the histidine. The histidine then in\
      \ turn donates the proton"
