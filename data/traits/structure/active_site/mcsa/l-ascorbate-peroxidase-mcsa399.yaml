<ol>
<li>Fe(III) + H2O2 = Compound\
        \ I (Fe(IV) radical) + H2O. This first step is catalysed by residues on the distal side of the\
        \ heme group. H2O2 enters the active site and binds to the heme Fe, His 42, and Arg 38. The oxygen\
