causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of protein-arginine deiminase
  description: Stepwise mechanism transcribed from M-CSA entry 594 (6 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +0).
  nodes:
