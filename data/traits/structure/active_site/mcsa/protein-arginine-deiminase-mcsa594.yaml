    label: catalytic Asp350 (M-CSA/PDB numbering; UniProt residue 350)
    node_type: RESIDUE
    grounding: UniProtKB:Q9UM07
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: his471
    label: catalytic His471 (M-CSA/PDB numbering; UniProt residue 471)
    node_type: RESIDUE
    grounding: UniProtKB:Q9UM07
    description: 'M-CSA roles: proton acceptor, proton donor.'
  - node_id: asp473
    label: catalytic Asp473 (M-CSA/PDB numbering; UniProt residue 473)
    node_type: RESIDUE
    grounding: UniProtKB:Q9UM07
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: cys645
    label: catalytic Cys645 (M-CSA/PDB numbering; UniProt residue 645)
    node_type: RESIDUE
    grounding: UniProtKB:Q9UM07
    description: 'M-CSA roles: nucleofuge, nucleophile, proton acceptor, proton donor.'
  - node_id: reactant0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: reactant1
    label: L-argininium residue
    node_type: CHEMICAL
    grounding: CHEBI:29965
  - node_id: product0
    label: L-citrulline residue
    node_type: CHEMICAL
    grounding: CHEBI:83397
  - node_id: product1
    label: ammonium
    node_type: CHEMICAL
    grounding: CHEBI:28938
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His471 deprotonates Cys645 to activate it for nucleophilic attack.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "Cys647 nucleophilically attacks the guanidinum carbon of arginine. Within this
step,\
      \ His471 acts as a general acid, protonating the guanidinium group"
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The tetrahedral collapses as ammonia leaves.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: His471 abstracts a proton from a water which activates it to nucleophilically attack
      the carbon of the C=N bond.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The second tetrahedral intermediate formed protonates Cys645 which initiates the elimination
      resulting in the cleavage of the acyl-enzyme bond and the release of the citrullinated product.The
      ammonia released prior can accept a proton from His471 to return the active site to its native state.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products
