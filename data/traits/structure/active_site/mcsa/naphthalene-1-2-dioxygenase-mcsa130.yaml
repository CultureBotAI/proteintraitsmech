  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: NAD initiates a hydride transfer to the FAD cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: FAD undergoes a double bond rearrangement that results in the transfer of a single electron
      from the FAD to one of the iron-sulfur clusters. This then initiates an electron relay through a
      second iron-sulfur cluster to a third.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The electron is transferred from the final iron-sulfur cluster to a dioxygen molecule,
      which also accepts a second electron from another Fe(II) centre, and deprotonates a water molecule.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The peroxo group attacks the naphthalene substrate in a nucleophilic addition that causes
      the double bond to attack the peroxo group, cleaving the O-O bond and forming the epoxide intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The epoxide intermediate collapses in a heterolysis resulting in a carbocation and anioinc
      oxygen bound to the Fe(III) centre.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The iron-bound hydroxide group attacks the carbocation in a coordination reaction.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: An unidentified base deprotonates the FAD, initiating a single electron transfer to the
      one of the iron-sulfur clusters. This then initiates an electron relay through a second iron-sulfur
      cluster to a third.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The electron is transferred from the final iron-sulfur cluster to the Fe(III) centre
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The cis-1,2-dihydronaphthalene-1,2-diol product deprotonates a water molecule and de-coordinates
      from the Fe(II) centre.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: naphthalene 1,2-dioxygenase catalytic site
    node_type: MOTIF
    grounding: MCSA:130
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
