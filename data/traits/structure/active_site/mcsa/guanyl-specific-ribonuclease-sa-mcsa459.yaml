  edges:
  - subject: glu56
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Glu56 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/459/
      snippet: "The cleavage of substrate by ribonucleases is a two-step reaction: the first step is a\
        \ transesterification of which a nucleophilic displacement at the phosphorus atom of the 5' leaving\
        \ group by the 2' entering oxygen atom takes place, forming a guanosine 2',3'-cyclophosphate intermediate,\
        \ which is hydrolysed in the second step to yield 3' guanylic acid. The mechanism proceeds as\
        \ follows:<ol> 
<li>The 2' hydroxyl group of the substrate is made more nucleophilic by deprotonation\
        \ by Glu 56.</li>
<li>The 2' hydroxyl attacks the phosphorus attached to the 3' carbon of the\
        \ same ribose ring, displacing the 5' oxygen of the next nucleotide. The charge on the trigonal\
        \ bipyramidal transition state is stabilised by Arg 67 and Arg 71.</li>
<li>The 5' oxygen of\
        \ the next nucleotide is made a better leaving group by protonation by His 86. </li>
</ol>\
        
The product is a cyclophosphodiester between the 3' and 2' carbons of the guanosine nucleotide.\
        \ This is hydrolysed in the second step of the reaction, which is the reverse of the first step\
        \ with water as the nucleophile, displacing the 2' hydroxyl. His 86 activates water by deprotonation\
        \ and Glu 56 protonates the 2' hydroxyl leaving group. Arg 67 and Arg 71 stabilise the transition\
        \ state."
      notes: M-CSA entry 459, mechanism 2; M-CSA cites PMID:14500895, PMID:15213380, PMID:19558492, PMID:4364371,
        PMID:8396032; step 1
