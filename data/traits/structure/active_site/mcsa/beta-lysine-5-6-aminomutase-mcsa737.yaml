    node_type: CHEMICAL
    grounding: CHEBI:57436
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The reaction starts with nucleophilic attack from the substrate to the internal aldimine
      bond between PLP and Lys 144. Forming an intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "A new aldimine bond is formed between the substrate lysine and PLP, this leads to the\
      \ cleavage of Lys 144 from PLP. 
Simultaneously to lysine transaldimination, homolytic cleavage\
      \ of the Co-C bond occurs creating a 5'
-deoxyadenosyl radical  and cob(II)alamin. 
Lys 370\
      \ and and Asp 298 form a salt bridge with the alpha carboxylate and amino group, respectively, of\
      \ the substrate . These interacti"
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "Hydrogen is abstracted by 5'
-dAdo from the substrate generating
deoxyadenosine\
      \ and the substrate related radical."
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A reversible tautomerization occurs generating a more stable radical which is stabilized
      by Tyr 263.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: "Intramolecular radical isomerization occurs generating a cyclic aziridincarbinyl-PLP\
      \ radical.
Which is again stabilized by Tyr263."
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Further radical isomerization occurs leading to collapse of the cyclic aziridincarbinyl-PLP
      radical.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The substrate abstracts a hydrogen radical from 5'-deoxyadenosine, forming a 5'-deoxyadenosyl
      radical. This leaves what will become the product bound to PLP.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: There is  nucleophilic attack from Lys 144 to the aldimine bond between the product and
      PLP. The transaldimination of lysines occurs simultaneously with the formation of the Co-C leading
      to radical termination, similarly to the first lysine substitution.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The aldimine bond between Lys144 and PLP is reformed. This leads to the product being
      cleaved from PLP.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products
