causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of tryptophan 7-halogenase
  description: Stepwise mechanism transcribed from M-CSA entry 977 (8 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +0).
  nodes:
  - node_id: lys79
    label: catalytic Lys79 (M-CSA/PDB numbering; UniProt residue 79)
    node_type: RESIDUE
    grounding: UniProtKB:P95480
    description: 'M-CSA roles: activator, hydrogen bond donor, proton donor.'
  - node_id: glu346
    label: catalytic Glu346 (M-CSA/PDB numbering; UniProt residue 346)
    node_type: RESIDUE
    grounding: UniProtKB:P95480
    description: 'M-CSA roles: proton acceptor.'
  - node_id: reactant0
    label: chloride
    node_type: CHEMICAL
    grounding: CHEBI:17996
  - node_id: reactant1
    label: FADH2(2-)
    node_type: CHEMICAL
    grounding: CHEBI:58307
  - node_id: reactant2
    label: L-tryptophan zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:57912
  - node_id: reactant3
    label: dioxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
  - node_id: product0
    label: 7-chloro-L-tryptophan zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:58713
  - node_id: product1
    label: FAD(3-)
    node_type: CHEMICAL
    grounding: CHEBI:57692
  - node_id: product2
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: NADPH donates a hydride to FAD. Mechanism inferred by curator.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Proton-coupled electron transfer (PCET) from FADH<sup>-</sup> to molecular oxygen and
      to the C4a-carbon atom of the isoalloxazine ring, leading to formation of FADH• and OOH• radicals.
      Inferred by curator.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: FADH• and OOH• radicals colligate, in which each of the molecular fragments donate one
      of the bonding electrons, resulting in formation of C4a-hydroperoxyflavin (C4aOOH) intermediate.
      Inferred by curator.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A chloride anion makes a nucleophilic attack on the flavin peroxide yielding hypochlorous
      acid (HClO) and C(4a) hydroxyflavin.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Dehydration of C(4a) hydroxyflavin gives oxidised FAD (not shown). HOCl formed in the
      FAD binding site moves through a tunnel in the enzyme and becomes activated to chlorinate the substrate
      in the tryptophan binding site.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: A hydrogen bonding interaction between HOCl and Lys79 activates HOCl by increasing its
      electrophilicity. The chlorine atom is inserted and forms a Wheland intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Deprotonation of the Wheland intermediate by Glu346 forms the product. This is rate-limiting.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: '-'
  - node_id: active_site
    label: tryptophan 7-halogenase catalytic site
    node_type: MOTIF
    grounding: MCSA:977
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.50.50.60 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.50.50.60
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
