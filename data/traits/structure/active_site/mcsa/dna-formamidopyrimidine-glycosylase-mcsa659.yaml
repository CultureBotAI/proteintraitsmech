    node_type: STATE
    description: Glu2 protonates the deoxyribose ring, facilitating nucleophilic attack by Pro1 and the
      opening of the deoxyribose ring.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Glu2 reorientates itself and deprotonates Pro1.
