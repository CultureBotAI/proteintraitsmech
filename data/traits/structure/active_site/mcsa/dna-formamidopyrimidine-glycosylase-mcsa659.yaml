    label: mechanism step 3
    node_type: STATE
    description: The nitrogen of the oxidised base is protonated by the hydroxyl group on the open ring
      deoxyribose which itself then abstracts a proton from Glu2. This facilitates N-glycosydic bond cleavage
      resulting in the formation of an excised base and Schiff base- like covalent intermediate.
