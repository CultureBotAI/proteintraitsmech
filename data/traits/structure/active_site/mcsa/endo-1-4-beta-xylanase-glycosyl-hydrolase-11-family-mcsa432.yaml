    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/432/
      snippet: "Hydrolysis proceeds through a glycosyl-enzyme intermediate that is formed and hydrolysed\
        \ via transition states with substantial oxocarbenium ion character. More specifically: Glu172\
        \ acts as a general acid to protonate the leaving oxygen atom, leading to a oxocarbenium-like\
        \ transtion state from xylan substrate, activating the substrate for nucleophilic attack by Glu78.\
        \ This forms a glycosyl-enzyme intermediate. Glu172 acts as a general base to activate the water\
        \ molecule, which makes a  nucleophilic attack on the C1 atom of the intermediate. Again, the\
        \ reaction proceeds through an oxocarbenium-like transition state to complete.
<br/><br/>\
        
