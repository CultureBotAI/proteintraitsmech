  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: pH profile studies suggest that the alanine binds as the monoanion. The amine of alanine
      initiates the elimination of the hydride ion, which adds to NAD. Subsequently, a conformational
      change occurs that allows a water molecule to enter the active site.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp269 deprotonates His95, which undergoes double bond rearrangement and deprotonates
      water, which initiates a nucleophilic attack on the carbinolamine carbon in an addition reaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The amine deprotonates the hydroxide added, which initiates an elimination of ammoina.
  - node_id: step4
