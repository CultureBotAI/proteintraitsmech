    node_type: STATE
    description: In a series of inferred steps the newly formed disulfide bond between Cys440 and Cys495
      is reduced by thioredoxin. This begins with nucleophilic attack on the disulfide bond by a thioredoxin
      thiol.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The second thioredoxin residue initiates nucleophilic attack on the thioredoxin Cys495
      disulfide bond, eliminating Cys495 and forming a new disulfide bond.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: In an inferred step His480 and His477 are both reprotonated to regenerate the native
      state of the enzyme.
