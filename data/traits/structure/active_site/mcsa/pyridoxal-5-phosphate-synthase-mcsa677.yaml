  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: The reaction involves the oxidation of PNP to PLP using the cofactor FMN. It proceeds
      through hydride transfer from the 4'Carbon to the N7 of FMN, with steric strain from Arg 197 acting
      to place the substrate and cofactor in correct orientation for this to occur. This forms an electron
      deficient transition state; the oxygen lone pair then forms a bond to the 4'Carbon to result in
      the product.
