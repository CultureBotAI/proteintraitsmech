  edges:
  - subject: glu110
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Glu110 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/919/
      snippet: The mechanism for this enzyme is currently unclear, however an SN2-like mechanism has been
        proposed. Here, the attacking nucleophile may be the substrate arginine, diphthamide or asparagine,
        depending on the toxin involved, and may even be water in auto-hydrolysis. This nucleophile is
        then deprotonated by a conserved active site glutamate (Glu110?). The activated nucleophile then
        attacks the anomeric carbon of the ribose ring which, due to the conformation of the NAD, has
        been exposed to the solvent forming a pentacoordinate oxocarbenium transition state intermediate.
        This intermediate is  partially stabilised by a catalytic glutamate (Glu112) forming a hydrogen
        bond with the O2 atom on the nicotinamide ribose. This makes the ring more electronegative, which
        stabilises the positively charged oxocarbenium ion before the N-glycosidic bond is cleaved, completing
        the transfer of the ADP-ribose+ moiety on to the substrate.
      notes: M-CSA entry 919, mechanism 1; M-CSA cites PMID:15049684, PMID:7658473; step 1
