  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: The mechanism for this enzyme is currently unclear, however an SN2-like mechanism has
      been proposed. Here, the attacking nucleophile may be the substrate arginine, diphthamide or asparagine,
      depending on the toxin involved, and may even be water in auto-hydrolysis. This nucleophile is then
      deprotonated by a conserved active site glutamate (Glu110?). The activated nucleophile then attacks
      the anome
