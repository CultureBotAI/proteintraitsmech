  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: '<p>Hydrolysis of the MgATP (via Asp129E abstracting a proton from water) is thought
      to cause a conformational change in the protein which enables an electron to be transferred from
      the Fe4S4 cluster to the FeMo cofactors.</p><p>After hydrolysis and electron transfer the two proteins
      dissociate, allowing for the Fe protein to be re-reduced (step 2). Whilst this reaction is only
      shown once here, it '
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Once the electron has been transferred from the Fe protein to the MoFe protein, the two
      proteins dissociate (thought to be rate limiting),. This step occurs only in the Fe protein, and
      involves the  exchange of ATP back into the Fe protein and also the reduction of the Fe protein
      using an external reducing agent.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The proton on the S3B is transferred to a different atom in the cofactor and a second
      proton is transferred via the water chain.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Dihydrogen is eliminated from the Fe-Mo-S cluster cofactor. Formation of the dihydrogen
      is required before the dinitrogen can bind and requires the accumulation of at least two electron
      equivalents in the MoFe protein. The location of the dihydrogen molecule within the FeMo-cofactor
      is arbitary.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Dinitrogen will only bind to the FeMo-cofactor when it reaches an appropriate oxidation
      state. Before dinitrogen is bound, a further two protons are transferred from the bulk solvent to
      the FeMo-cofactor. Dinitrogen is then bound to one of the iron atoms in the Fe-Mo-S cluster cofactor
      in a nucleophilic addition.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Dinitrogen is bound in a bidentate manner through an electrophilic addition.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: A proton is transferred to the bound dinitrogen from the S3B thiol, which reprotonates
      from water.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: A second proton is transferred to the bound dinitrogen from the S3B thiol, which reprotonates
      from water.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: In a nucleophilic substitution, the diimide becomes bound in a monodentate manner, and
      another proton is transferred from the S3B thiol, which reprotonates from water.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The hydrazine intermediate gains another proton from the S3B thiol, which reprotonates
      from water.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: In an elimination reaction, the N-N bond is cleaved, resulting in ammonia and a further
      proton being transferred from the S3B thiol, which reprotonates from water.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: In a nucleophilic substitution reaction the cental nitrogen atom of the cofactor reforms
      one of its bonds to the one of the iron centres.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: The amine then deprotonates one of the thiol groups, resulting in a thiolate.
  - node_id: step14
    label: mechanism step 14
    node_type: STATE
    description: The thiolate attacks the iron centre to which the amine group is bound in a nucleophilic
      substitution, producing the second ammonia.
  - node_id: step15
    label: mechanism step 15
    node_type: STATE
    description: The cofactor regenerates its initial protonation state through proton transfer.
  - node_id: step16
    label: mechanism step 16
    node_type: STATE
    description: Products.
