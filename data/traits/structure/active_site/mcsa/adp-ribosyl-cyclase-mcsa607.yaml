  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: Glu203 nucleophilically attacks the ribose C1' which nicotinamide attached to. The nucleophilic
      attack eliminates the nicotinamide and leads to the formation of a Glu179-R5P intermediate. N1 of
      purine group then acts as a nucleophile to attack the ester bond between Glu203 and ribose, resulting
      in cyclisation to form cADPR. Glu122 provides stabilisation of hydrolysis at ribose C1' by Glu203.
