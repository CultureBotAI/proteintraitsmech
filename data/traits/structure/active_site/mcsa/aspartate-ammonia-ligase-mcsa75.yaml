  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The carboxylate group of the L-aspartate side chain acts as a nucleophile and attacks
      the alpha-phosphate of ATP in a substitution reaction that liberates pyrophosphate. Mg(II), Arg100
      and Gln116 stabilise the intermediates formed.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp46 deprotonates the ammonia molecule, which acts as a nucleophile to attack the carbonyl
      group (attached to the phosphate) of the L-aspartate in an addition reaction. Mg(II), Arg100 and
      Gln116 stabilise the intermediates formed.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion formed re-forms the carbonyl group, cleaving the P-O bond in a conjugate
      base elimination reaction liberating AMP and the L-asparagine. Asp46 donates its proton back to
      the liberated AMP. Mg(II), Arg100 and Gln116 stabilise the intermediates formed.
