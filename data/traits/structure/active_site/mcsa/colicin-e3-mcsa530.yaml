  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu517 acts as a base abstracting a proton from the 2' hydroxyl group of the A1493 sub-unit.
      This increases the nucleophilicity of the group allowing it to attack the phosphate group and form
      a penta-covalent intermediate which is stabilized by Arg545.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp510 activates His513 enabling His513 to act as an acid donating a proton to the 5'
      hydroxyl. The penta-covalent intermediate collapses and the bond between the phosphate and the 5'
      hydroxyl is cleaved.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His513 now acts as a base activating a water molecule for nucleophillic attack on the
      phosphate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The penta-covalent intermediate collapses breaking the bond between the 2' hydroxyl and
      the phosphate with Glu517 acting as an acid.
  - node_id: step5
    label: mechanism step 5
