        \ for proline residues with a phosphorylated threonine or serine immediately proceeding it.  The\
        \ main effect of Pin1 on the isomerization reaction is the reduction of the free energy barrier.\
        \ This is accomplished by a combined rotation of the ψ backbone angle of the threonine residue\
        \ and the amide bond. The enzyme works via the electrostatic stabilization of the phosphate group\
        \ of the threonine residue through the basic triad and the hydrogen bonds between the enzyme Gln\
        \ 131 and the peptide which fix one part of the peptide in the catalytic site, hindering its rotation.
