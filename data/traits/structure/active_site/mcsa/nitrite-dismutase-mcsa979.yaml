    label: mechanism step 1
    node_type: STATE
    description: Oxygen atom transfer (OAT) from the coordinated NO<sub>2</sub><sup>-</sup> to a second
      NO<sub>2</sub><sup>-</sup> ion in the protein pocket, forming an FeNO intermediate and an NO<sub>3</sub><sup>-</sup>
      ion. Proton transfer to Asp30 from solvent.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Proton-coupled electron transfer (PCET). The FeNO intermediate reacts with a third NO<sub>2</sub><sup>-</sup>
      in the protein pocket, forming a radical. Oxidation of this intermediate forms a second NO and water.
      The exact mechanism of this step remains uncertain and is here largely inferred by the curator.
  - node_id: step3
