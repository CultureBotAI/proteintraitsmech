      snippet: "The mechanism of this protein is still unresolved, with some debate as to the exact role\
        \ of Asp141A. It catalyses the conversion of the cyclic tetrahydrodipicolinate (THDP) into the\
        \ acyclic compound N-succinyl L-2-amino-6-oxopimelate using succinyl-CoA. It is known to be activated\
        \ by divalent metal ions, but it is still unclear if these are catalytic or not. A mechanism has\
        \ been postulated where in a first step of the reaction succinyl-CoA delivers the succinyl group\
        \ to the active site residue Asp141, which would become succinylated by
forming an anhydride\
