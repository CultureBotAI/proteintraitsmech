  edges:
  - subject: asp10
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Asp10 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/471/
      snippet: "The catalytic reaction involves cleavage of the N-glycosidic bond between ribose and the\
        \ purine base of the substrate. fast hydrolysis of the substrate scissile bond is followed by\
        \ a slow, two-step release of ribose and a conformational change of the enzyme-ribose complex.\
        \  
<br/><br/>
The enzyme binds to the pyridine base of the substrate between the aromatic\
        \ side chains of Trp 83 and Trp 260, resulting in a face-to-face stacking arrangement. This raises\
        \ the pKa of the aromatic substrate, and hence promotes protonation of the purine ring by elevating\
        \ its basicity.  
<br/><br/>
N7 protonation of the substrate from bulk solvent occurs since\
        \ the solvent water is hydrogen bonded to the substrate N7. This results in quaternization of\
        \ N in the substrate, and induces a positive charge in the purine ring, giving a chemically activated\
        \ leaving group. Therefore the water molecule acts as a general acid to protonate the departing\
        \ nucleobase anion. The N7-bonded water is in turn hydrogen bonded to waters in a channel.   
\
        
<br/><br/>
The soft, electron rich indole ring of Trp 260 stabilises the positive charge\
        \ on the N. 
<br/><br/>
The activated purine ring is now a good leaving group. A ribooxocarbenium\
        \ ion-like transition state is formed. The hydrolysis of the scissile bond is by a calcium-bound\
        \ water molecule, Wat 1, which is hydrogen bonded to the general base, Asp 10, and the amide group\
        \ of Asn 186. 
<br/><br/>
The side chain of Asp 10 is hydrogen bonded to the nucleophilic\
        \ water. This Asp 10 acts as a general base by abstracting a proton form Wat 1, activating it\
        \ towards nucleophilic attack of the scissile bond. The Asn 186 side chain carbonyl stabilises\
        \ the transition state by migrating closer to the O4' and its amide -NH hydrogen bonds to O3'\
        \ of the substrate.  
<br/><br/>
Cleavage of the N-glycosidic bond occurs, and  there is\
        \ a conformational change of the enzyme-ribose complex. 
<br/><br/>
The ribose product is\
        \ released from the active site, regenerating the enzyme."
      notes: M-CSA entry 471, mechanism 3; M-CSA cites PMID:11292348, PMID:11854281, PMID:15050818, PMID:15909995,
        PMID:16630632, PMID:19281874, PMID:23897478, PMID:26575755; step 1
