      snippet: Bound GSH is deprotonated by the formation of a hydrogen bond of gamma-S (of GSH) to O
        atom of Tyr8. Isomerisation is initiated when PGH2 binds to the cleft in H-PGDS (formed by 3 active
        site pockets), the thiolic anion of the (bound) deprotonated GSH performs nucleophilic attack
        on the C-11 oxygen of PGH2. Successive base attack on C-11 hydrogen by a deprotonated GSH found
        free in solution (GS-) causes O-S bond cleavage, forming C-11 carbonyl in a concerted, sterically-restricted
