  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His285 acts as a general base activating the Ser87 hydroxyl group for nucleophilic attack
      on the carbonyl carbon of the ester bond. The third component of this catalytic triad- Asp263 acts
      to increase the basicity of the histidine. The oxyanion intermediate formed is stabilized by the
      amide groups of Gln88 and Leu17. The calcium ion may also play a role in stabilization.
  - node_id: step2
