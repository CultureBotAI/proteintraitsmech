      bond acceptor.'
  - node_id: reactant0
    label: L-serine zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:33384
  - node_id: product0
    label: D-serine zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:35247
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The neutral amine group of L-serine attacks the imine functionality of the pyridoxal-5-phosphate
      cofactor, forming a Schiff base precursor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The tetrahedral intermediate collapses, generating the external aldimine, PDD-substrate
      complex.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Either Lys57 or Ser82 acts as a general base towards the C-alpha of the covalently bound
      serine, forming a planar sterocentre [PMID:19640845]. Lys57 shown here in analogy to other PLP-dependent
      enzymes.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Either Lys57 or Ser82 returns a proton to the serine C-alpha position from the alternative
      face of the molecule, reversing the previous stereochemistry. Ser82 shown as this reaction results
      in a different steroisomer to the original molecule.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Ser82 abstracts a proton from Lys57. The deprotonated Lys57 acts as a nucleophile towards
      the PLP-serine complex, forming a precursor to the regeneration of the internal aldimine.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The tetrahedral intermediate collapses releasing L/D-serine, inverted at the c-alpha
      relative to the starting material, and the internal aldimine is regenerated.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products
  - node_id: active_site
    label: serine racemase catalytic site
    node_type: MOTIF
    grounding: MCSA:330
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
