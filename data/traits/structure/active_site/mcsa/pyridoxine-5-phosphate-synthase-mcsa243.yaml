  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The 3-amino-2-oxopropyl phosphate substrate initiates a nucleophilic attack upon the
      1-deoxy-D-xylulose 5-phosphate in the first step of a Schiff base formation. The carbonyl oxygen
      is assumed to deprotonate the amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The newly formed secondary amine initiates a intramolecular elimination of water, which
      obtains its proton first from Glu72, and then from water. The nature of the proton donor in this
      step is not entirely clear, it has been assumed to be a water molecule, due to the presence of a
      water channel in the enzyme [PMID:12206776].
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His45 deprotonates the C3 of the intermediate, which initiates double bond rearrangement,
      with the Schiff base acting as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The Schiff base reforms, initiating a double bond rearrangement and resulting in the
      elimination of water, which obtains it's proton from Glu72.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Glu72 deprotonates the remaining hydroxide, which initiates a double bond rearrangement
      and eliminates phosphate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His12 activates water, which initiates a nucleophilic addition to the newly formed C=C.
      This causes ring closure, and the resulting oxyanion is protonated by His193. Glu72 is activated
      by a water molecule. It is suggested that one of the histidines at the top of the active site are
      responsible for the activation of water in this step. His12 and His52 are both candidates [PMID:12206776].
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Glu72 deprotonates the C4 carbon, initiating the elimination of hydroxide, which obtains
      a proton from His12.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: His193 deprotonates C6, initiating a double bond rearrangement that results in the protonation
      of O3' by His45.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Product
  - node_id: active_site
    label: pyridoxine 5'-phosphate synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:243
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.20.20.70 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.20.20.70
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
