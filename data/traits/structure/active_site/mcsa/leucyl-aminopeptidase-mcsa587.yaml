    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/587/
      snippet: Bicarbonate ion acts as a general base to deprotonate a water molecule bound by the two
        active site zinc ions, creating a hydroxide nucleophile. Zinc1 (Zinc488) and a hydrogen bond from
        Lys262 polarises the carbonyl group of the substrate, to increase its electrophilicity. In concert
        with the bicarbonate ion deprotonating the water molecule, it nucleophilically attacks the polarised
        carbonyl group to form a tetrahedral gem-diolate intermediate. The negative charge is subsequently
        stabilised by the Lys262 and Zinc1. Collapse of the tetrahedral intermediate leads to protonation
        of the amine leaving group by the bicarbonate ion, which shuttles the proton from water to it.
        Arg336 provides a positively charged pocket for the bicarbonate ion.
