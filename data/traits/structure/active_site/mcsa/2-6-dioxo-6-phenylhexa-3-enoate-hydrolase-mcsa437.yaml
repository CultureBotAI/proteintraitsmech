    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/437/
      snippet: "The exact mechanism is currently unclear and two proposals have been put forward. 
\
        <br/><br/>
The first (shown here) suggests that the Ser-His-Asp triad of the alpha/beta hydrolase\
        \ fold superfamily members performs in the traditional way, with a covalent intermediate being\
        \ formed between the serine and substrate.
<br/><br/>
In this mechanism, the free enzyme\
        \ (E) binds and the 2-hydroxy-6-oxo-6-phenylhexa-2,4-dienoic acid substrate undergoes keto-enol\
        \ tautomerisation (<i>via</i> His263-catalysed transfer of a proton to the proS position at C-5),\
        \ generating the first intermediate. Nucleophilic attack of Ser110 on this intermediate generates\
        \ the first tetrahedral (covalently bound) intermediate, the negative charge of which is stabilised\
        \ by the main chain amide protons of the 'oxyanion hole' residues, Met111 and Gly40. Collapse\
        \ of this intermediate involves C-C fragmentation onto the re face of the double bond, generating\
        \ the acyl-enzyme intermediate, and releasing 2-hydroxy-penta-2,4-dienoic acid with the inserted\
        \ proton at the H-5E position. His263 activates water to attack at the acyl-enzyme carbonyl, generating\
        \ the second tetrahedral intermediate, collapse of which releases benzoate and regenerates free\
        \ enzyme."
      notes: M-CSA entry 437, mechanism 1; M-CSA cites PMID:11399084, PMID:16964968, PMID:17442675, PMID:17932031,
