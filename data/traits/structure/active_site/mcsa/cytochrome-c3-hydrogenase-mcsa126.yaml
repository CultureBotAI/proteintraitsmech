  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Hydrogen molecules diffuse from the surface of the protein and this is unlikely to be
      rate-limiting. Hydrogen easily permeates the protein and moves preferentially in channels to the
      Ni side of the active site. [PMID:17715982]. Dihydrogen coordinates to the Ni(II) centre, and a
      single electron is transferred from Ni(II) to the electron acceptor through the iron-sulfur clusters.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Cys530 acts as a general base, deprotonating the hydrogen molecules, which forms a hydride
      ion that bridges the two metal centres.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Cys530 loses its proton to bulk solvent in which Glu18 acts as a proton relay.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Cys530 acts as a general base, accepting the bridging hydride, with the electron pair
      being donated to the Ni(III) centre.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Cys530 loses its proton to bulk solvent in which Glu18 acts as a proton relay. A single
      electron is transferred from the Ni(III) centre to the electron acceptor via the iron-sulfur clusters.
