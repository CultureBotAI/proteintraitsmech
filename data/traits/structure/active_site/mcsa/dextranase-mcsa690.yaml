    node_type: CHEMICAL
    grounding: CHEBI:4167
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp395 donates a proton to the oxygen of the glycosidic bond, this promotes the cleavage
      of the bond and the formation of a carbonium ion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbonium ion intermediate can be stabilized by movement of electrons from the neighboring
      oxygen.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Asp376 activates a water molecule for nucleophilic attack on the ion and another glucose
      unit is produced.
  - node_id: step4
