    node_type: RESIDUE
    grounding: UniProtKB:P48845
    description: 'M-CSA roles: activator, increase nucleophilicity, proton acceptor, proton donor.'
  - node_id: asp395
    label: catalytic Asp395 (M-CSA/PDB numbering; UniProt residue 429)
    node_type: RESIDUE
