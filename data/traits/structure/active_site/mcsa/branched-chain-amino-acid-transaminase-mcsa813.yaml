  edges:
  - subject: lys159
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Lys159 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/813/
      snippet: The mechanism of branched-chain amino acid aminotransferase has a double substrate recognition
        component for the reversibility of this enzyme. The substrate approaches, and the C4' of PLP,
        activated by protonation of the Schiff base, is nucleophilically attacked by the substrate alpha-amino
        group and through the tetrahedral intermediate a new Schiff base is formed, with release of Lys
        159 by protonation with the substrate. Lys 159 makes a hydrogen bond to the O3' of PLP to lower
        the free energy of the transition states. This Lys also facilitates proton transfer to the C-alpha
        atom of the substrate and the C4' of the cofactor. The deprotonated Lys 159 abstracts a proton
        from the substrate to yield the quinonoid intermediate. After this alpha-proton elimination, Lys
        159 adds a proton to the C4' atom of the quinonoid intermediate to yield the ketimine intermediate.
        The ketimine intermediate is hydrolysed using Lys 159 to activate the water as a general base
        catalyst to yield 2-oxoglutarate and PMP.
      notes: M-CSA entry 813, mechanism 1; M-CSA cites PMID:12667063; step 1
