  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu96 deprotonatesa water which in turn accepts a proton from Lys132.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys132 nucleophilically attacks the carbonyl carbon meanwhile the oxyanion produced is
      also protonated by Lys132
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: To form the Fructose 6-phosphate Schiff base which elimates the hydroxyl group which
      will then accept a proton from the catalytic water which will then accepts a proton from Glu96.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Glu96 deprotonates water so that it can act as a base which deprotonates the C4-OH and
      results in the heterolytic cleavage and the release of the first product, G3P.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The carbanion undergoes an isomerisation in which the lone pair of electrons migrate
      to the nitrogen of Lys132.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The lysine-bound intermediate attacks the carbonyl carbon of the D-erythrose 4-phosphate
      substrate in a 1,4-nucleophilic addition. The formed oxyanion deprotonates Glu96.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Glu96 deprotonates a water molecule, which attacks the carbamylated carbon of the intermediate
      in a nucleophilic addition.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Lys132 deprotonates the bound water, initiating an elimination reaction that releases
      the D-sedoheptulose 7-phosphate product from the enzyme.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Regeneration of the active site in which the Lys132 deprotonates a bound water that in
      turn deprotonates Glu96.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products
