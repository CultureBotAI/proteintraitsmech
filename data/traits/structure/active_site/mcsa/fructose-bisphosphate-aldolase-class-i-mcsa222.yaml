  - node_id: product0
    label: D-fructofuranose 1,6-bisphosphate(4-)
    node_type: CHEMICAL
    grounding: CHEBI:49299
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Lys229 attacks the carbonyl carbon of D-glyceraldehyde 3- phosphate in a nucleophilic
      addition. First step in the formation of the Schiff base. Lttlechild <i>et al.</i> suggest that
      the Lys229 is uncharged at the start of the reaction [PMID:8488556]. St-Jean <i>et al.</i> suggest
      that a proton relay can occur through the Glu187 [PMID:17728250,PMID:15870069].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion formed deprotonates the bound Lys229.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys229 initiates an elimination of water, which gains an extra proton from Glu187.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: "The phosphate of the bound intermediate deprotonates water, which in turn deprotonates\
      \ Tyr363. 
The C-terminal tyrosine is highly mobile and the temporary binding of the C-terminus\
      \ expels one of the catalytic waters from the active site. The tyrosine is activated by sequential\
      \ proton transfer through a conserved water molecule that is hydrogen-bonded to the iminium phosphate\
      \ dianion that acts as "
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Tyr363 deprotonates the C1-H of the bound intermediate, initiating a double bond rearrangement
      that leaves Lys229 with a lone pair of electrons. Ser300 stabilises the enamine form. There is interconversion
      between the iminium and enamine forms of the covalently bound substrate [PMID:17728250].
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: "Glu187 deprotonates water, which deprotonates a second water which deprotonates the\
      \ phosphate of the bound intermediate.

C-terminal expulsion allows rebinding of one of the\
      \ catalytic waters. Ser300 stabilises the enamine form. There is interconversion between the iminium\
      \ and enamine forms of the covalently bound substrate [PMID:17728250]. The enamine phosphate catalyses\
      \ proton transfer through "
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Glycerone phosphate binds, displacing one of the water molecules. Lys229 initiates a
      nucleophilic addition of the bound intermediate to the glycerone phosphate. The formed oxyanion
      deprotonates Glu187.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Glu187 deprotonates water, which attacks the imine carbon of the covalenlty bound intermediate
      in a nucleophilic addition.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Lys229 deprotonates the formed hydroxyl group, which initiates an elimination of the
      linear form of D-fructose 1,6-bisphosphate and neutral Lys229.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: There is evidence in archea that the ring opening/closing reaction is enzyme catalysed
      by the Lys229. Phosphate deprotonates hydroxyl, and the carbonyl oxygen re-protonates from Lys229,
      which in turn re-protonates from the phosphate. [PMID:15766250] thus catalysing the ring closure
      of D-fructose 1,6-bisphosphate.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Products.
