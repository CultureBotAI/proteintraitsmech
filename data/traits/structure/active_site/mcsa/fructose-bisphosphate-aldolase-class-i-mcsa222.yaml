  - node_id: reactant0
    label: D-glyceraldehyde 3-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:59776
  - node_id: reactant1
    label: glycerone phosphate(2-)
    node_type: CHEMICAL
