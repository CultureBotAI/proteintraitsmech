    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/439/
      snippet: "Binding of the enzyme utilises its largely positive cleft to the negatively charged hyaluronan\
        \ substrate and the precise relative positioning of HA and the enzyme by the hydrophobic patch\
        \ residues Trp371, Trp372, and Phe423 interacting with hydrophobic sugar rings of HA. 
<br/><br/>
\
        
In the active center, Asn349 attracts electrons on the carboxylate group of glucuronic acid,\
        \ making the C5 proton more acidic. This is followed by the removal of a relatively acidic C5\
        \ proton by the Tyr408 side chain, which is negatively charged in the enzyme ground state thoruhg\
        \ its interactions with His399 and Arg362. This results in the formation of an unsaturated C4–C5\
        \ bond and elimination of the product which abstracts a proton from Tyr408, regenerating the active\
        \ site.
<br/><br/>
The consecutive release of the generated disaccharide product from the\
        \ cleft uses the electrostatic repulsion of the negative product from the residues of the negative\
        \ patch Glu468, Asp478, and Thr480. The final step is the translocation of the remaining truncated\
        \ HA substrate in the cleft by one disaccharide unit in the direction of the reducing end of HA."
