  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: This reaction takes place in the glutaminase domain. The N-terminus of Cys1 deprotonates
      water, which deprotonates the thiol group of Cys1, initiating a nucleophilic attack on the amide
      carbon in an addition reaction.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: This reaction takes place in the glutaminase domain. The oxyanion initiates an elimination
      that cleaves ammonia from the bound L-glutamine substrate. Ammonia deprotonates water, which deprotonates
      the N-terminus of Cys1. The ammonia product is then transferred to the second domain of the enzyme
      through an internal ion channel
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: This reaction occurs in the glutaminase domain. The N-terminus of Cys1 deprotonates water,
      which initiates a nucleophilic attack on the carbonyl carbon of the covalently bound intermediate
      in an addition reaction.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: This reaction occurs in the glutaminase domain. The oxyanion initiates an elimination
      that cleaves the C-S bond, the thiolate of Cys1 deprotonates water, which deprotonates the N-terminus
      of Cys1.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: "This reaction occurs in the ligase domain of the enzyme. 
The aspartate substrate\
      \ initiates a nucleophilic attack on the alpha phosphate of ATP in an addition reaction."
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: This reaction occurs in the ligase domain of the enzyme. The pentavalent intermediate
      collapses to eliminate the diphosphate product and the beta-Asp-AMP intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: This reaction occurs in the ligase domain of the enzyme. The ammonia nitrogen initiates
      a nucleophilic attack on the carbonyl carbon of the beta-Asp-AMP intermediate in an addition reaction.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: This reaction occurs in the ligase domain of the enzyme. The oxyanion initiates an elimination
      that cleaves the C-O bond, the phosphate of AMP deprotonates the ammonium group, releasing the AMP
      and Asparagine products.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Products
