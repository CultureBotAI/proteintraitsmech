      snippet: "<p>UCH  hydrolyses the peptide bond at the C-terminus of ubiquitin to regenerate active\
        \ ubiquitin from adducts with small nucleophiles and is thought to use the same catalytic mechanism\
        \ as that established for the well-studied papain family of cysteine proteases. </p>

<p>The\
        \ catalytic Cys residue acts as a nucleophile to attack the peptide bond carbonyl and form an\
        \ acyl-enzyme intermediate which is subsequently attacked and hydrolysed by a water molecule.\
        \ His 169 functions to deprotonate Cys 95 and so generate the nucleophilic thiolate. It also protonates\
        \ the departing amine leaving group during formation of the acyl-enzyme intermediate, and deprotonates\
        \ the hydrolytic water molecule. Its pKa is modified by Asp 184. The backbone NH of Cys 95 and\
        \ the sidechain amide of Gln 89 form an 'oxyanion-hole' that stabilises accumulation of negative\
        \ charge on the carbonyl oxygen during nucleophilic attack on the peptide group.</p>"
