  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: 6-phosphofructose acts as an allosteric activator. On binding, 6-phosphofructose induces
      a reactive conformation which orientates both itself and ATP for base-catalysed phosphate transfer.
      6-phosphofructose is activated as a nucleophile on deprotonation of the O-1 functional group by
      Asp128. The oxygen abstracts the gamma phosphate from ATP, forming ADP.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp128 is deprotonated. Kinetic studies indicate that for the reverse reaction, Asp128
      must be protonated. Crystal structures show a water molecule within the active site. This is thought
      to facilitate proton transfer from and to Asp128.
