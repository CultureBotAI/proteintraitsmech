  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: isopenicillin N(1-)
    node_type: CHEMICAL
    grounding: CHEBI:58399
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Thiol of the substrate, delta(L-2-aminoadipyl)-L-cysteinyl-D-valine, coordinates to the
      iron cofactor in a nucleophilic substitution reaction, eliminating water.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The iron cofactor initiates a homolytic addition to dioxygen, resulting in an iron bound
      dioxygen radical and iron in the Fe(III) oxidation step.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The iron coordinated sulfur eliminates a hydride from the bound intermediate, resulting
      in a peroxo species bound to the iron, and a single electron transfer back to the iron, regenerating
      the Fe(II) oxidation state.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Iron is oxidised from Fe(II) to Fe(IV), forming an oxo group bound to the iron and causing
      the cleavage of the peroxo O-O bond, which deprotonates the a coordinated water in the Fe coordination
      sphere
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The water molecule produced in the last step is deprotonated by the Fe coordinated hydroxyl
      which enable it to accept a proton from the amide of the intermediate, resulting in the formation
      of the four-membered beta-lactam ring bound to the iron cofactor.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The oxygen coordinated to Fe initiates a homolytic addition and accepts the proton from
      the tertiary carbon, resulting in a tertiary carbon radical and converts Fe(IV) to Fe(III).
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The radical intermediate drives the thiazoladine closure via colligation from the homolysis
      of the S-Fe bond.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Product
  - node_id: active_site
    label: isopenicillin-N synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:145
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 2.60.120.330 superfamily fold
    node_type: DOMAIN
    grounding: CATH:2.60.120.330
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: isopenicillin-N synthase activity
    node_type: MOLECULAR_FUNCTION
