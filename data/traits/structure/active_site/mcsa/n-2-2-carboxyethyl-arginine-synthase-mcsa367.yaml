    label: mechanism step 1
    node_type: STATE
    description: The active form of the thiamine pyrophosphate is formed on deprotonation by Glu45. Residue
      Phe438 orientates the thiamine pyrophosphate group in the active V conformation through steric interactions.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The stabilised, zwitterionic carbanion situated on the cofactor then attacks the glycer-aldehyde-3-phosphate
      carbonyl group, forming a cofactor-substrate adduct.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The cofactor 4-amino group deprotonates the alpha carbon.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The carbon anion eliminates water, forming an alkene in an E1cb mechanism. The departing
      water molecule abstracts a proton from the TPP subunit, which in turn abstracts a proton from Glu57.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The phosphate group is proposed to activate the enol towards 1,3 elimination of itself
      by acting as a base, releasing orthophosphate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: L-arginine attacks at the reactive alkene of the intermediate adduct, with concomitant
      protonation of the 1,3 ketone.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The enol undergoes unassisted tautomerisation.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Water attacks at the ketone carbonyl, initiating release of the carboxyethyl-arginine
      product.
  - node_id: step9
