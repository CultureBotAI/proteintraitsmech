  - node_id: product1
    label: L-dopa zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:57504
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The Fe(II) centre donates a single electron to the dioxygen molecule in a homolytic addition.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The bound dioxygen radical initiates an electrophilic addition to the aromatic tetrahydrobiopterin
      which causes a single electron to be transferred back to the Fe(III) centre.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The Fe(II) centre donates an electron pair to the oxygen bound directly to the Fe ion,
      eliminating the 4a-hydroxytetrahydrobiopterin product by cleaving the peroxo bond. The product undergoes
      an internal proton transfer to generate the final state.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Tyrosine initiates an electrophilic addition to the bound iron-bound oxo group, causing
      the iron centre to accept two electrons.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: In an NIH shift, the alkoxide group forms a ketone group, initiating an internal hydride
      transfer.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The intermediate undergoes a keto-enol tautomerisation forming the 3,4-dihydroxy-L-phenylalanine
      tautomer of the product.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: tyrosine 3-monooxygenase catalytic site
    node_type: MOTIF
    grounding: MCSA:134
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
