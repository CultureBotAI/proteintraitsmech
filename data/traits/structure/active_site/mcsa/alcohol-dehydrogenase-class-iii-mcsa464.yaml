    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/464/
      snippet: "This reaction proceeds via a random bi-bi mechanism, thus either the cofactor or substrate\
        \ may bind first. The active site is in the cleft between the two domains and has a zinc ion that\
        \ coordinates the hydroxyl and carbonyl groups of the substrates and activates them for hydride\
        \ transfer.   
<br/><br/>
Structural studies have shown that the active-site zinc moves\
        \ back and forth between two positions during the catalytic cycle of FDH. Further, the catalytic\
        \ domain conformation is about midway between the open and closed conformations seen in class\
        \ I ADH and undergoes very little change upon binding of the cofactor.    
<br/><br/>
Once\
        \ both the cofactor and substrate are bound, bulk water initiates the proton transfer pathway\
        \ via HIs47 and Thr48 to ultimately abstract a proton from the substrate alcohol and initiate\
        \ the hydride transfer to the NAD cofactor."
