  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amino group of tRNA-SEC attacks the Schiff base immine, forming a substrate-cofactor-enzyme
      intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: A proton is transferred from the tRNA-SEC nitrogen to that of the Lys278.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: An external aldamine adduct is formed between the tRNA-SEC substrate and PLP cofactor
      on elimination of Lys278.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lys278 abstracts a proton from the C(a) of the external aldimine.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Electron delocalization across the aromatic ring facilitates rapid beta-elimination of
      phosphate, forming dehydroalanyl-tRNASec as the product.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: An activated water molecule attacks the selenophosphate phosphate substrate, resulting
      in displacement if selenium which attacks the dehydroalanyl intermediate. A proton is donated to
      the intermediate from Lys278.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Lys278 attacks the external aldimine.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: An internal proton rearrangement occurs.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The side chain nitrogen of Lys278 displaces the anionic form of L-Selenocysteinyl-tRNA(Sec),
      reforming the internal aldimine.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The terminal amine group deprotonates the unidentified base.  The unidentified base is
      thought to correspond to an active site arginine residue, as seen in related mechanisms [PMID:18158303].
