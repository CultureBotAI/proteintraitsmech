causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of formate dehydrogenase
  description: Stepwise mechanism transcribed from M-CSA entry 562 (5 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +0).
  nodes:
  - node_id: lys44
    label: catalytic Lys44 (M-CSA/PDB numbering; UniProt residue 44)
    node_type: RESIDUE
    grounding: UniProtKB:P07658
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: sec140
    label: catalytic Sec140 (M-CSA/PDB numbering; UniProt residue 140)
    node_type: RESIDUE
    grounding: UniProtKB:P07658
    description: 'M-CSA roles: electrophile, metal ligand, nucleofuge, nucleophile, proton acceptor, proton
      donor.'
  - node_id: his141
    label: catalytic His141 (M-CSA/PDB numbering; UniProt residue 141)
    node_type: RESIDUE
    grounding: UniProtKB:P07658
    description: 'M-CSA roles: electrostatic stabiliser, proton acceptor.'
  - node_id: arg333
    label: catalytic Arg333 (M-CSA/PDB numbering; UniProt residue 333)
    node_type: RESIDUE
    grounding: UniProtKB:P07658
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond donor.'
  - node_id: reactant0
    label: acceptor
    node_type: CHEMICAL
    grounding: CHEBI:15339
  - node_id: reactant1
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: reactant2
    label: formate
    node_type: CHEMICAL
    grounding: CHEBI:15740
  - node_id: product0
    label: hydrogen donor
    node_type: CHEMICAL
    grounding: CHEBI:17499
  - node_id: product1
    label: carbon dioxide
    node_type: CHEMICAL
    grounding: CHEBI:16526
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Catalysis begins with the formate displacing the Mo-bound Sec140 group in the oxidised
      form of the enzyme.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The formate proton is abstracted by Sec140. The CO2 molecule is released and two electrons
      are transferred to Mo, forming Mo(IV).
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: An electron is shuttled from Mo(IV) to an electron acceptor (R) through an MGD ligand,
      a water molecule, then the Fe4S4 cluster. This results in a Mo(V) intermediate. The formate proton
      is transferred from Sec140 to His141. This leads to hydrogen bond formation between His141 and Sec140.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Once the Fe4S4 cluster is reoxidized, a second electron is transferred from Mo(V) to
      the Fe4S4 cluster. The oxidation of Mo(V) to Mo(VI) causes the hydrogen bond between Sec140 and
      His141 to break, releasing the proton of His141 to solvent. Sec140 re-cordinates to the Mo(VI) centre.
      After the Fe4S4 cluster is reoxidised for a second time, the enzyme is restored to its initial state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: formate dehydrogenase catalytic site
    node_type: MOTIF
    grounding: MCSA:562
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 2.20.25.90 superfamily fold
    node_type: DOMAIN
    grounding: CATH:2.20.25.90
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: formate dehydrogenase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0008863
    description: GO molecular function for EC:1.17.1.9, via GO's own ec2go mapping.
    xrefs:
    - EC:1.17.1.9
