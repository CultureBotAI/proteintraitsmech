      snippet: Catalysis begins with the formate displacing the Mo-bound Sec140 group in the oxidised
        form of the enzyme.
      notes: M-CSA entry 562, mechanism 1; M-CSA cites PMID:16830149, PMID:18671310, PMID:9036855; step
