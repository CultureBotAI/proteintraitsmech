  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu73B deprotonates water, which attacks the carbon of the carbonyl group in a nucleophilic
      addition. This results in coordination of the oxyanion to Zinc.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage of the peptide bond.
      The N-terminal product then accepts a proton from Glu73B.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The N-terminal product deprotonates the C-terminal product to form kinetically favourable
