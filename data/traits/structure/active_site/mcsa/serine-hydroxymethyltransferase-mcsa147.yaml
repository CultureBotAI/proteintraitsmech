    node_type: RESIDUE
    grounding: UniProtKB:P07511
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: thr226
    label: catalytic Thr226 (M-CSA/PDB numbering; UniProt residue 254)
    node_type: RESIDUE
    grounding: UniProtKB:P07511
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor.'
  - node_id: lys229
    label: catalytic Lys229 (M-CSA/PDB numbering; UniProt residue 257)
    node_type: RESIDUE
    grounding: UniProtKB:P07511
    description: 'M-CSA roles: covalently attached, electron pair acceptor, electron pair donor, hydrogen
      bond donor, nucleofuge, nucleophile, proton acceptor, proton donor.'
  - node_id: arg235
    label: catalytic Arg235 (M-CSA/PDB numbering; UniProt residue 263)
    node_type: RESIDUE
    grounding: UniProtKB:P07511
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: reactant0
    label: L-serine zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:33384
  - node_id: reactant1
    label: (6S)-5,6,7,8-tetrahydrofolate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57453
  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: glycine zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:57305
  - node_id: product2
    label: (6R)-5,10-methylenetetrahydrofolate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:15636
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amine of the substrate L-serine attacks the PLP cofactor in a nucleophilic addition
      and the bound Lys229 deprotonates the newly attached amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound lysine, resulting in free PLP and lysine in a neutral state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Water deprotonates the second substrate (tetrahydrofolate), which attacks the L-serine-PLP
      complex, transferring the Me-OH group the tetrahydrofolate. PLP acts as an electron sink ofr this
      nucleophilic substitution reaction.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The methoxylated nitrogen of the tetrahydrofolate intermediate initiates an elimination
      of the hydroxide group, which reprotonates from Glu57B.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Glu57B deprotonates the methylated tetrahydrofolate intermediate at the secondary amine,
      which forms an intramolecular nucleophilic addition to the added carbon, forming 5,10-methylenetetrahydrofolate
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The amine of Lys229 attacks the PLP in a nucleophilic addition reaction, the secondary
      amine of the attached substrate protonates from the bound Lys229.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound product, resulting in glycine and the regenerated PLP cofactor.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: serine hydroxymethyltransferase catalytic site
    node_type: MOTIF
    grounding: MCSA:147
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.640.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.40.640.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: serine hydroxymethyltransferase activity
    node_type: MOLECULAR_FUNCTION
    xrefs:
