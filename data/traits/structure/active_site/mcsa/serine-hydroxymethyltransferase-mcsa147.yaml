definitions:
  - kind: MECHANISTIC
    text: >-
      serine hydroxymethyltransferase (SHMT) is a PLP-dependent protein that catalyses the reversible interconversion of serine and glycine with tetrahydrofolate serving as the one-carbon carrier. This reaction serves as the major source of one-carbon groups required for the biosynthesis of purines, thymidylate, methionine and many neurotransmitters.
    source: "M-CSA"
    method: SOURCED
causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of serine hydroxymethyltransferase
  description: Stepwise mechanism transcribed from M-CSA entry 147 (8 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
