      snippet: PNK catalyses the transfer of the gamma-phosphate from adenosine triphosphate or other
        nucleoside triphosphates to the 5'-OH of polynucleotides. The activity proceeds via an ordered
        sequential mechanism. Phosphoryl transfer results in an inversion of configuration at the phosphorous.
        The attacking nucleophile is the 5'-OH of the nucleoside, attacking the gamma phosphorous of ATP.
        Abstraction of the 5'-OH proton by Asp 35 activates the nucleophile, giving it the role of general
        base catalyst. The pentacoordinate transition state is stabilised by Lys 15 and Arg 126 side chains.
        The phosphatase proceeds via a covalent phospho-aspartic acid and is dependent on magnesium for
        activity. Asp 165 acts as the nucleophile attacking the 3'-phosphorous in an SN2 phosphoryl transfer
        reaction.
