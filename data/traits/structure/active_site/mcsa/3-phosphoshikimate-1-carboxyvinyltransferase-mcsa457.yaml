    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/457/
      snippet: "An aspartate residue deprotonates the 5-OH of the shikimate 3-phosphate, activating the\
        \ oxygen to attack at the C2 of  phospho-enolpyruvate with concomitant protonation at C3 by Glu341.\
        \ A tetrahedral intermediate is formed. Glu341 is then thought to act as a general base at C3,\
        \ initiating the collapse of the intermediate, elimination of phosphate and the formation of enolpyruvylshikimate\
        \ 3-phosphate.   
<br/><br/>
The most recent work suggests a hybrid acid/base- electrostatic\
        \ reaction, with catalytic residues optimised for acid/base and electrostatic roles. Glu341 is\
        \ thought to act as both a general acid, protonating C3 in the addition step, and a general base,\
        \ deprotonating C3 in the elimination step while also stabilising the cationic intermediate. This\
        \ is achieved by the formation of  an electrostatic 'sandwich' with Asp313."
