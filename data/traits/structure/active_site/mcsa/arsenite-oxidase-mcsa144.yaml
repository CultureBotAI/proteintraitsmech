    node_type: STATE
    description: Arsenic of the arsenite substrate attacks one of the molybdenum coordinating oxo groups,
      resulting in a Mo(VI) to Mo(IV) reduction.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The attacking oxo group forms a second bond to the arsenic, forming the product arsenate
      and resulting in the loss of the oxo group from the molybdenum complex and the remaining oxo group
      binding in a much stronger interaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: An unidentified base (shown as water for simplicity) activates water to attack the Mo(IV),
      forming a hydroxide group in place of the lost oxo group in a nucleophilic addition to the Mo(IV).
  - node_id: step4
