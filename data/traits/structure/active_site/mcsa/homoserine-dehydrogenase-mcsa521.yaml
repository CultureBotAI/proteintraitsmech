    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/521/
      snippet: The NAD(P)H dependent reduction of L aspartate semi-aldehyde proceeds via hydride transfer.
        The hydride donating NAD(P)H cofactor is bound in the Rossmann fold, where enzyme-cofactor hydrogen
        bond interactions exist between cofactor phosphate moieties and sugar hydroxyl groups and the
        enzyme amide back bone groups. The amino substrate is thought to bind predominantly in the aldehyde
        rather than the hydrate form through hydrogen bond interactions with Asp 214, Glu 208, and a water
        molecule (460). The catalytic Lys 223 donates a proton to the developing alkoxide tetrahedral
        intermediate during hydride transfer. Asp 219 is key in positioning the catalytic residue, while
        the N terminal helix alpha J is important in stabilising the developing negative charge on the
        substrate carbonyl.
      notes: M-CSA entry 521, mechanism 1; M-CSA cites PMID:10700284, PMID:11341915, PMID:15210149; step
