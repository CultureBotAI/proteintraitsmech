  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "The nitrate oxyanion attacks the molybdenum coordination in a displacement reaction,\
      \ eliminating the Cys152 sulfur which results in the formation of a disulfide bridge within the\
      \ coordination sphere.

Physiological conditions allow an equilibrium between Mo(V) and Mo(VI)\
      \ to exist [PMID:19360810]."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The nitrate ligand undergoes heterolytic dissociation from molybdenum to form the nitrite
      product. The oxygen ligand is left behind at the metal centre. Theoretical studies have shown an
      inner sphere mechanism to be more favourable than a potential second sphere alternative [PMID:19360810].
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The electron is relayed to the iron-sulfur cluster from a mobile electron carrier present
      in the quinol oxidation respiratory electron transport chain. The close proximity iron sulfur cluster
      provides an electron to the molybdenum centre via a bridging lysine residue.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A solvent molecule acts as a proton donor to the dianionic molybdenum centre. The proton
      donor is presumed to be a solvent molecule because of the identification of solvent channels close
      to the metal coordination site. However, the possibility of a residue acting as a general acid has
      not been ruled out [PMID:10368307].
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The close proximity iron sulfur cluster provides an electron to the molybdenum centre
      via a bridging lysine residue. The electron is relayed to the iron-sulfur cluster from a mobile
      electron carrier present in the quinol oxidation respiratory electron transport chain.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: A solvent molecule acts as a proton donor, forming a water ligand within the metal coordination
      sphere. The proton donor is presumed to be a solvent molecule because of the identification of solvent
      channels close to the metal coordination site. However, the possibility of a residue acting as a
      general acid has not been ruled out [PMID:10368307].
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The Cys152 sulfur atom substitutes the water molecule coordinated to the molybdenum centre.
      The lone pair of electrons on the bridging sulfur substitutes the coordinated water. Both sulfur
      atoms of the disulfide bond are coordinated to the metal. In the absence of nitrate, the metal coordination
      sphere returns to its ground state.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
