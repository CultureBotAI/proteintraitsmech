  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Lys201 carries out a nucleophilic attack on a CO2 molecule. This will produce an intermediate
      which will become a carbamate which will coordinate the magnesium ion in the later stages of catalysis.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "The intermediate tautomerizes into the carbamate.
Magnesium and RUBP binding then\
      \ occur sequentially."
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "The uncoordinated oxyanion of the carbamate deprotonates C3, causing a keto-enol tautomerization.\
      
The enolate is stabilized by the magnesium ion and Lys175."
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: "Water attacks C3 of the C=C bond and C2 attacks a CO2 molecule.
His294 abstracts\
      \ a proton from the C3 hydroxyl."
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The C3-C2 bond is cleaved forming one of the 3-phosphoglycerate  products and an enolate
      of another 3PG molecule.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The enolate intermediate tautomerizes into 3PG, this is assisted by protonation from
      Lys175 and the Lys201 carbamate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
