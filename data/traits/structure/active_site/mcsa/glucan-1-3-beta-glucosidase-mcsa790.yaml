    predicate_id: RO:0002436
    object: step1
    description: Asp285 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/790/
      snippet: The reaction follows a double displacement mechanism at the anomeric chiral centre.  Hydrolysis
        of the glycosidic linkage is believed to be initiated by protonation of the glycosidic oxygen
        atom via proton transfer from an active site-located general acid catalyst (Glu491) to form an
        oxonium ion.  Following protonation, the aglycone part of the substrate is released from the enzyme
        surface and the reducing terminal residue is converted to a positively charged oxycarbenium ion.
        The carbocation is stabilised by a nucleophilic amino acid residue (Asp285) acting as a base to
        form a covalent glucosyl-enzyme intermediate. Glu491, acting as a base catalyst by proton abstraction,
        activates a water molecule which hydrolyses the covalent intermediate, resulting in the regeneration
        of the enzyme and the formation of the glucose product. The glucose remains bound to the enzyme
        until a new substrate approaches the enzyme.
      notes: M-CSA entry 790, mechanism 1; M-CSA cites PMID:10368285, PMID:11709165, PMID:23201198; step
        1
