      for determining the substrate selectivity, both in terms of peptide backbone recognition and methylation
      state. JMJD2A is more active with tri- rather than di-methylated substrate, and inactive in the
      presence of
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The carbon radical initiates a homolytic substitution which forms the 1-hydroxy-2-amino-lysine
      product and results in a single electron transfer to the Fe(III) centre.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The hydroxy-methyl lysine decomposes outside of the active site to produce formaldehyde
      and the demethylated histone lysine residue.
