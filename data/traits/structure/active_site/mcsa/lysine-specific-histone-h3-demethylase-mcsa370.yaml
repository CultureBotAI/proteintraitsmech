  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Fe(II) donates a single electron to the dioxygen molecule, forming a covalent bond between
      dioxygen and the resulting Fe(III).
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Fe(III) donates a single electron to the bound peroxo group. The terminal oxygen of the
      peroxo group attacks the carbonyl carbon of the 2-oxoglutarate cofactor in a nucleophilic addition.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Carbon dioxide is eliminated from the intermediate to form succinate and an iron-bound
      oxo anion. Succinate is thought to decoordinate from the active site prior to hydroxylation [PMID:21555854].
      Stopped-flow absorption and freeze-quench Mossbauer experiments have suggested the Fe centre to
      hold a highly oxidising (IV) intermediate state.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The iron-bound oxygen donates an electron to the Fe(IV) centre and abstracts a proton
