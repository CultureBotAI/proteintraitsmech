  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Zinc activated water initiates a nucleophilic attack on the C8 of the substrate in an
      aromatic addition reaction. The nitrogen, N7, which receives the lone pair of electrons gains a
      proton from His112.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: His179 deprotonates the added hydroxyl group, cleaving the C8-N9 bond in an elimination
      which results in the cleavage of the C1-O4 bond in the ribose ring and concomitant deprotonation
      of His112 by O4.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His112 deprotonates the newly formed hydroxyl group, which initiates the reformation
      of the ribose ring in a nucleophilic addition reaction, which causes the N9 to deprotonate His179.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: His179 acts as a general base, deprotonating water, which is activated by zinc, this
      hydroxide then initiates a nucleophilic attack on the amide carbon of the intermediate in a substitution
      reaction which eliminates formate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: First step in the Amadori Rearrangement. His112 donates a proton to the intermediate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Second step of the Amadori Rearrangement . Tautomerisation of the N=C-C bonds.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Next step of the Amadori Rearrangement. Keto-enol tautomerisation.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Final step of the Amadori Rearrangement. N7 initiates a nucleophilic attack on the carbonyl
      carbon, forming the new six-membered ring.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Water is eliminated, forming a new double bond which extends the conjugation across the
      molecule.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Inferred return step in which His179 and 112 are reprotonated from bulk solvent water
      molecules, and the activated water molecule zinc ligand is regenerated.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Products
  - node_id: active_site
    label: GTP cyclohydrolase I catalytic site
    node_type: MOTIF
    grounding: MCSA:38
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
