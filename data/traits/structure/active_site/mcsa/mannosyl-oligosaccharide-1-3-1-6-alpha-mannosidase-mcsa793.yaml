causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of mannosyl-oligosaccharide 1,3-1,6-alpha-mannosidase
  description: Stepwise mechanism transcribed from M-CSA entry 793 (5 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: his90
    label: catalytic His90 (M-CSA/PDB numbering; UniProt residue 153)
    node_type: RESIDUE
    grounding: UniProtKB:Q24451
    description: 'M-CSA roles: metal ligand.'
  - node_id: asp92
    label: catalytic Asp92 (M-CSA/PDB numbering; UniProt residue 155)
    node_type: RESIDUE
    grounding: UniProtKB:Q24451
    description: 'M-CSA roles: metal ligand.'
  - node_id: asp204
    label: catalytic Asp204 (M-CSA/PDB numbering; UniProt residue 267)
    node_type: RESIDUE
    grounding: UniProtKB:Q24451
    description: 'M-CSA roles: covalently attached, metal ligand, nucleofuge, nucleophile.'
  - node_id: asp341
    label: catalytic Asp341 (M-CSA/PDB numbering; UniProt residue 404)
    node_type: RESIDUE
    grounding: UniProtKB:Q24451
    description: 'M-CSA roles: activator, increase nucleophilicity, proton acceptor, proton donor.'
  - node_id: his471
    label: catalytic His471 (M-CSA/PDB numbering; UniProt residue 534)
    node_type: RESIDUE
    grounding: UniProtKB:Q24451
    description: 'M-CSA roles: metal ligand.'
  - node_id: reactant0
    label: alpha-D-Manp-(1->3)-alpha-D-Manp-(1->2)-alpha-D-Manp
    node_type: CHEMICAL
    grounding: CHEBI:64167
  - node_id: reactant1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product0
    label: alpha-D-mannose
    node_type: CHEMICAL
    grounding: CHEBI:28729
  - node_id: product1
    label: alpha-D-mannose
    node_type: CHEMICAL
    grounding: CHEBI:28729
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp267 attacks C1 of the C1-C6 linkage, this causes the linkage to break. Asp404 donates
      a proton to the leaving group.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp404 activates a water for nucleophillic attack on C1 this displaces Asp267 and the
      first mannose unit is released. There is then a rearrangement of the substrates in the active site
      with a new mannose unit being ligated to the zinc.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The mechanism repeats for the C1-C3 linkage.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The final mannose unit is formed.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: mannosyl-oligosaccharide 1,3-1,6-alpha-mannosidase catalytic site
