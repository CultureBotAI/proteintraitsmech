  edges:
  - subject: asp313
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Asp313 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/478/
      snippet: "Recent studies have shown the hydrolysis of 18-family chitinase to proceed through a substrate\
        \ assisted mechanism with retention of configuration in the product. A putative oxocarbonium ion\
        \ intermediate is stabilised by the anchimeric assistance of the sugar N-acetyl group after the\
        \ donation of a proton from the catalytic carboxylate to the departing N acetylglucosamine unit.\
        \ The anionic glutamate activates a hydrolytic water by abstracting a proton, forming a hydroxide\
        \ which kicks out the N-acyl group in a SN2 mechanism and forms the C1-OH group of the product.\
        \ The active site is then restored.
<br/><br/>
Glu315 is protonated and poised to cleave\
        \ the glycosidic linkage between −1 and +1 sugar residues. One water molecule is H-bonded to the\
        \ phenol hydroxyl of Tyr390 and to the NH of the 2-N-acetyl group. The approach of acidic residue\
        \ Asp313 toward Glu315 forces the acetamido group of the -1 sugar to rotate around its C2−N2 bond,\
        \ thus displacing the water molecule into the vicinity of Glu315.  A proton from the water molecule\
        \ will be taken up by the gamma carboxylate of Glu315 and the remaining hydroxide ion will be\
        \ taken up by the anomeric C1 atom of the -1 sugar residue. Once hydrolysis is completed, the\
        \ monosaccharide departs from subsite -1, and the disaccharide remains bound at the enzyme subsites\
        \ +1, +2."
      notes: M-CSA entry 478, mechanism 1; M-CSA cites PMID:10794597, PMID:11560481, PMID:11846790, PMID:12369923,
