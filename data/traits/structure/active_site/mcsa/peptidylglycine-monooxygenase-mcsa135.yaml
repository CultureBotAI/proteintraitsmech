definitions:
  - kind: MECHANISTIC
    text: >-
      peptidylglycine monooxygenase is a copper protein that acts on the terminal glycine residue of peptidylglycines. Peptidylglycines with a neutral amino acid residue in the penultimate position are the best substrates for the enzyme. In Rattus norvegicus this is functionality is part of a bifunctional enzyme. The monooxygenase part produces an unstable peptidyl(2-hydroxyglycine) as its product, which is then transported and dismutated to glyoxylate and the corresponding desglycine peptide amide by the lyase part. The C-terminal amidation of peptides such as neuropeptides is essential for full biological activity and involved in the final step of biosynthesis of alpha-melanotropin and related biologically active peptides.
    source: "M-CSA"
    method: SOURCED
causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of peptidylglycine monooxygenase
  description: Stepwise mechanism transcribed from M-CSA entry 135 (8 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +0).
  nodes:
  - node_id: his107
    label: catalytic His107 (M-CSA/PDB numbering; UniProt residue 107)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: metal ligand.'
  - node_id: his108
    label: catalytic His108 (M-CSA/PDB numbering; UniProt residue 108)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: hydrogen bond donor, metal ligand, single electron acceptor, single electron
      donor, single electron relay.'
  - node_id: gln170
    label: catalytic Gln170 (M-CSA/PDB numbering; UniProt residue 170)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: hydrogen bond acceptor, single electron acceptor, single electron donor,
      single electron relay.'
  - node_id: his172
    label: catalytic His172 (M-CSA/PDB numbering; UniProt residue 172)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: metal ligand.'
  - node_id: his242
    label: catalytic His242 (M-CSA/PDB numbering; UniProt residue 242)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: metal ligand.'
  - node_id: his244
    label: catalytic His244 (M-CSA/PDB numbering; UniProt residue 244)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: metal ligand.'
  - node_id: met314
    label: catalytic Met314 (M-CSA/PDB numbering; UniProt residue 314)
    node_type: RESIDUE
    grounding: UniProtKB:P14925
    description: 'M-CSA roles: metal ligand.'
  - node_id: reactant0
    label: dioxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
  - node_id: reactant1
    label: L-ascorbate
    node_type: CHEMICAL
    grounding: CHEBI:38290
  - node_id: reactant2
    label: glycino(1-) group
    node_type: CHEMICAL
    grounding: CHEBI:83148
  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: L-dehydroascorbate
    node_type: CHEMICAL
    grounding: CHEBI:58539
  - node_id: product2
    label: alpha-hydroxyglycino(1-) group
    node_type: CHEMICAL
    grounding: CHEBI:85224
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Ascorbate donates a single electron to one of the Cu(II) centres, which causes the hydroxide
      ligand to dissociate from the Cu(II) centre.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: A second ascorbate donates a single electron to the other Cu(II) centre, which causes
      the water ligand to dissociate from the Cu(II) centre.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: One of the Cu(I) centres donates a single electron to a dioxygen molecule, which causes
      it to bind in a bidentate manner and displace the water ligand.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The bound superoxide abstracts a hydrogen from the peptide substrate, and water displaces
      one of the bonds between the superoxide and the Cu(II) centre.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: In a homolytic substitution, the O-O bond is broken resulting in the hydroxylation of
      the peptide intermediate and the Cu(II) bound peroxo.
  - node_id: step6
