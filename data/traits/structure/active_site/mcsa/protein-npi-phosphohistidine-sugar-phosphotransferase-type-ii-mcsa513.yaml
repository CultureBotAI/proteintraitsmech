      snippet: An associative phosphoryl transfer mechanism is assumed, the P atom passes from a tetrahedron
        in phospho-HPr, through a trigonal bipyramid in the transition state, to an inverted tetrahedron
        in phospho-IIAglc. In order to bring the hydrated phosphoryl group of phospho-HPr into the transition
        state, we assume that hydrogen bonds to water are replaced by H bonds. These hydrogen bonds are
        presumably optimised to stabilise the transition state, they are likely to be stronger and this
        in turn should enhance the electrophilicity of the P atom. In turn the H bond from Gly85 to to
        His83 should make the reactive Nepsilon2 more nucleophilic.
