  - subject: lys188
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Lys188 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/419/
      snippet: The aromatization of aminoDHS to AHBA involves the formation of a Schiff base between the
        substrate and PLP (and eventually between Lys188 and PLP to eliminate the final product), and
        several proton transfer steps; that is, (1) abstraction of the C-5 proton, (2) protonation of
        4-OH to make it a better leaving group, (3) protonation of the C-3 carbonyl group as part of the
        enolisation and (4) abstraction of the pro-6S proton. A modelled structure of AHBA synthase with
        bound substrate shows that the Lys-188 eta-amino group is positioned in proximity to 4-OH, H-5
        and H-6S, and it is proposed that this residue mediates sequentially the steps (1), (2) and (4).
        However, it is too far removed from 3-O to catalyse step (3) and no other amino acid is close
        enough to catalyse this protonation directly. Instead, it is proposed that Q185 assists in the
        elimination of the protonated 4-OH as water and then the transfer of a proton from this water
        molecule to 3-O in a relay mechanism.
      notes: M-CSA entry 419, mechanism 2; M-CSA cites PMID:10433690, PMID:21081954, PMID:9497318; step
        1
