    predicate_id: RO:0002436
    object: step1
    description: Arg96 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/845/
      snippet: Although the exact mechanism and roles of the catalytic residues are currently unclear.
        It has been suggested that the cyanate carbon atom is activated by water molecule (activated by
        Glu99) to make it more electrophilic, and a nucleophilic attack by the bicarbonate carboxylate
        oxygen results in the formation of the proposed dianion intermediate (stabilised by Arg96 and
        possibly Ser122). This intermediate then decarboxylates to CO2 and carbamate. The structure of
        the catalytic site suggests that ‘on-the-enzyme’ decarboxylation of the dianion is likely, as
        opposed to dissociation and subsequent nonenzymatic decarboxylation.
      notes: M-CSA entry 845, mechanism 1; M-CSA cites PMID:10801492; step 1
