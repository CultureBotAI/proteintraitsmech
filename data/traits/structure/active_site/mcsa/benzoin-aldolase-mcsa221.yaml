    label: mechanism step 1
    node_type: STATE
    description: Glu50B deprotonates the thiamine diphosphate cofactor, which initiates double bond rearrangement
      that results in the deprotonation of the N=CH-S group, activating the cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbanion of thiamine diphosphate attacks the carbonyl carbon of benzoin in a nucleophilic
      addition. Kneen <i>et al.</i> suggest that the protonation event might be mediated through a water
      molecule and the His29B, with the Gln113B activating the His29B [PMID:16226928].
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His29B deprotonates one of the hydroxyl groups (again, mediated through a water molecule)
      of the bound intermediate, initiating an elimination that productes one of the benzaldehyde products.
      Thiamine diphosphate acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Thiamine diphosphate initiates a double bond rearrangement, which results in the intermediate
      being protonated by His29B.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: His29B deprotonates the second hydroxyl group of the intermediate, initiating an elimination
      that results in a reformation of the carbanionic activated cofactor and the second benzaldehyde
      product.)Substrates=(M0221-I3,2ag0-His29B
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The carbanion of the thiamine diphosphate cofactor deprotonates the adjacent amine, which
      initiates double bond rearrangement that results in the deprotonation of Glu50B.
  - node_id: step7
