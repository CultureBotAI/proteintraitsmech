  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "Proton-coupled electron
transfer (PCET) from FMNH- to molecular oxygen and to C4a-carbon\
      \ atom of the isoalloxazine ring, leading to formation of FMNH• and OOH• radicals."
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: FMNH• and OOH• radicals covalently bond with each other in which each of the molecular
      fragments donate one of the bonding electrons, resulting in formation of C4a-hydroperoxyflavin (C4aOOH)
      intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: DBT sulfur atom performs a nucleophilic attack towards the distal oxygen atom (Od) of
      the C4aOOH intermediate. DBT (dibenzothiophene) is oxidized to DBTO (dibenzothiophene oxide) by
      following a SN2 mechanism.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Deprotonation of Ser163- hydroxyl group by the Nε atom of His92 residue.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Ser163 deprotonates the N5 of C4aOH intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: "Tyr96 promotes dehydration of C4aOH intermediate by cleavage of the C4a−Op bond. 
\
      (Op = proximal oxygen atom)
Generation of oxidized FMN cofactor."
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Tyr96-phenoxide deprotonates the His92-imidazolium, allowing for regeneration of the
      original catalytic residues.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Final products.
