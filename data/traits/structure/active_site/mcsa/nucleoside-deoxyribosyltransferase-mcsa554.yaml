  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: The mechanism is thought the proceed via double displacement, resulting in retention
      of stereochemical configuration in the product, much like the retaining glycosidases. The catalytic
      nucleophile Glu98 attacks at the scissile glycosidic bond of 2'-deoxyribose-nucleoside, forming
      an enzyme-substrate intermediate which then collapses on attack by the second base, forming a new
      deoxyribosyl nucleosi
