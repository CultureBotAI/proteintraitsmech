    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Asp72 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/554/
      snippet: The mechanism is thought the proceed via double displacement, resulting in retention of
        stereochemical configuration in the product, much like the retaining glycosidases. The catalytic
        nucleophile Glu98 attacks at the scissile glycosidic bond of 2'-deoxyribose-nucleoside, forming
        an enzyme-substrate intermediate which then collapses on attack by the second base, forming a
        new deoxyribosyl nucleoside. Asp92 is thought to act as a general acid to the departing glycosidic
        oxygen while Asp72 stabilises the oxo-carbenium character transition state. It is then proposed
        for the incoming nucleobase act as a nucleophile to form a new 2'-deoxyribonucleoside. What is
        still unclear is whether the mechanism is Sn1, with oxocarbenium ion intermediates or Sn2 through
        a oxocarbenium ion like transition state. More research is needed to identify this and also the
        exact nature attack of the nucleobase in the latter part of the mechanism.
