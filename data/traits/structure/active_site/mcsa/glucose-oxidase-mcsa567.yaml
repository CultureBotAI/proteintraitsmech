causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of glucose oxidase
  description: Stepwise mechanism transcribed from M-CSA entry 567 (2 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: his516
    label: catalytic His516 (M-CSA/PDB numbering; UniProt residue 538)
    node_type: RESIDUE
    grounding: UniProtKB:P13006
    description: 'M-CSA roles: proton acceptor.'
  - node_id: reactant0
    label: beta-D-glucose
    node_type: CHEMICAL
    grounding: CHEBI:15903
  - node_id: reactant1
    label: dioxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
  - node_id: product0
    label: hydrogen peroxide
    node_type: CHEMICAL
    grounding: CHEBI:16240
  - node_id: product1
    label: D-glucono-1,5-lactone
    node_type: CHEMICAL
    grounding: CHEBI:16217
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "In the reductive half-reaction 
there is concerted transfer of a proton from glucose\
      \ to His516 and a hydride from glucose to FAD, forming FADH- and the product. FADH- is reoxidized\
      \ by oxygen in the oxidative half-reaction. This proceeds via two single-electron transfer steps\
      \ and involves superoxide anion radical and flavin semiquinone radical intermediates."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: glucose oxidase catalytic site
    node_type: MOTIF
    grounding: MCSA:567
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
