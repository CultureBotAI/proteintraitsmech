  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu51B deprotonates the thiamine diphosphate cofactor, which initiates double bond rearrangement
      that results in the deprotonation of the N=CH-S group, activating the cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbanion of thiamine diphosphate attacks the carbonyl carbon of pyruvate in a nucleophilic
      addition that results in the cofactor undergoing double bond rearrangement that results in the deprotonation
      of Glu51B.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Carbon dioxide eliminates from the covalently attached pyruvate intermediate. Thiamine
      diphosphate acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Thiamine diphosphate initiates a double bond rearrangement, which results in the intermediate
      deprotonating Asp28B, which in turn deprotonates His115B.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Glu51B deprotonates thiamine diphosphate, which initiates a double bond rearrangement,
      that deprotonates the hydroxide of the intermediate, and results in a reformation of the carbanionic
      activated cofactor and the acetaldehyde product.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His115B deprotonates water. The carbanion of the thiamine diphosphate cofactor deprotonates
      the adjacent amine, which initiates double bond rearrangement that results in the deprotonation
      of Glu51B.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
