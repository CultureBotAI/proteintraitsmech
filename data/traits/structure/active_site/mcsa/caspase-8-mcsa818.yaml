  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His317 deprotonates Cys360 which activates it so that it can attack the carbon of the
      carbonyl in a nucleophilic addition which produces the oxyanion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination which results in cleavage of the peptide bond.
      His317 protonates the amino group of the N-terminal product which prevents the reformation of the
      peptide bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His317 deprotonates a water which activates it allowing it to attack the carbon of the
      thioester bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage of the thioester
      bond. Cys360 now accepts a proton from His317 which regenerates the enzyme to its native state.
  - node_id: step5
