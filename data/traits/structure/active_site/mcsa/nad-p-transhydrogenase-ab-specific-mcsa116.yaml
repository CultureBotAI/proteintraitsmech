      in
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: NAD eliminates a hydride ion, which adds to NADP.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Asp132C releases its proton. The release of the products causes the proton to be released
