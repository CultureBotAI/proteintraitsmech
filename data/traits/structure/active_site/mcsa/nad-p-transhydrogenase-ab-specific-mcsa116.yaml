    object: step1
    description: Arg127 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/116/
      snippet: Asp132C obtains a proton, causing a rearrangement of the active site. The full proton translocation
        pathways is not well defined. However, as a consequence of a step in the proton translocation
        pathway a change in the ionisation of a group (possibly Asp132C) leads to a transition between
        the open and occluded states. This transition brings the C4 atoms of the NADP<sup>+</sup> and
