    node_type: CHEMICAL
    grounding: CHEBI:15398
  - node_id: product1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product2
    label: di-mu-sulfido-diiron(2+)
    node_type: CHEMICAL
    grounding: CHEBI:33737
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: When camphor binds, it displaces the axial water ligand and an inversion of the spin
      state is observed. Putidaredoxin donates a single electron to the Fe(III) centre of the heme cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: In a homolytic addition, Fe(II) donates a single electron to the dioxygen substrate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Putidaredoxin donates a second electron to the bound peroxo moiety, which initiates a
      proton transfer relay through Thr252, water, Asp251, Arg186 to bulk solvent.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Iron donates a single electron to the bound peroxo moiety, which eliminates water and
      initiates a proton transfer relay through Thr252, water, Asp251, Arg186 to bulk solvent.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The oxyferryl intermediate (starting state) can be envisioned as the product of an intramolecular
      single-electron transfer reaction from the porphyrin ligand to a putative Fe(V) centre, to give
      Fe(IV) moiety and a radicaloid porphyrin ligand [PMID:10698731]. The iron-bound oxy group abstracts
      a hydrogen from the camphor substrate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The camphor radical initiates a homolytic substitution, hydroxylating the intermediate
      to form 5-hydroxycamphor. The iron centre accepts a single electron and water displaces the product
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: camphor 5-monooxygenase catalytic site
    node_type: MOTIF
    grounding: MCSA:133
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
