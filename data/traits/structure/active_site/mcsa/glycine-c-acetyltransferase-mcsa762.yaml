  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His213 acts as an acid catalyst for the transaldimation reaction. The amine of the substrate
      L-2-amino-3-oxobutanoic acid attacks the PLP cofactor in a nucleophilic addition and the bound Lys244
      deprotonates the newly attached amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: His213 accepts a proton from the secondary amine that results from the initial attack
      which also initiates an elimination of the covalently bound lysine, resulting in free PLP and lysine
      in a neutral state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: CoA thiol group attacks PLP-substrate to form a tetrahedral intermediate in which Lys244
      removes the excess proton. Ser185 stabilises oxyanion intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Unimolecular elimination to form acetyl-CoA , which is released and also a quinoid intermediate,
      PLP acts an electron sink.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Lys244 protonates the quinoid intermediate, PLP feeds an electron pair back to form the
      glycine external aldimine.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: In the reverse reaction, this is the first step of the His213 catalysed Lys244 displacing
      the product glycine.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Unimolecular elimination to release the product glycine.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Proton transfer from PLP to His213 to regenerate active site.
  - node_id: step9
    label: mechanism step 9
