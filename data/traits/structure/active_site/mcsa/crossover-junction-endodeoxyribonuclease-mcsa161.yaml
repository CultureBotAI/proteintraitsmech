        on the phosphorus atom. This causes the P-O3' bond to break, and at the same time, His 105' protonates
        the O3' atom of the leaving group. Ca2+ (and possibly His 43) stabilise the pentavalent transition
        state.
      notes: M-CSA entry 161, mechanism 1; M-CSA cites PMID:10075917, PMID:11327769; CATH domain 3.40.1800.10
