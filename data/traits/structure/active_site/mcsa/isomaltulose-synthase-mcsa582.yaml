    node_type: CHEMICAL
    grounding: CHEBI:18394
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: There is nucleophilic attack from Asp 241 on the C1 atom of the glucose component, this
      is in concert with oxygen of the glycosidic link being protonated by Glu 295. This results in the
      link being broken in an SN2 reaction and an enzyme bound intermediate being formed.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: There is a second SN2 reaction where C6 hydroxyl of the fructose attacks C1 of the Asp-glucose
      intermediate. This results in a new glycosidic linkage and the formation of Isomaltulose.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Products.
