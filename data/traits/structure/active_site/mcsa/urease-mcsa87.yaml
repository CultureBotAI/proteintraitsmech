    label: carbon dioxide
    node_type: CHEMICAL
    grounding: CHEBI:16526
  - node_id: product1
    label: ammonia
    node_type: CHEMICAL
    grounding: CHEBI:16134
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp221 deprotonates His219, which in turn deprotonates the nickel bound urea, forming
      the active conformer for this mechanism.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: His320 deprotonates nickel bound water, which initiates a nucleophilic attack on the
      nickel bound urea in an addition reaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The tetrahedral intermediate collapses, eliminating ammonia with concomitant deprotonation
      of His320.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Carbamate dissociates from the active site and is spontaneously converted to carbon dioxide
      and a second molecule of ammonia
