    label: mechanism step 1
    node_type: STATE
    description: Carboxylate group of the deamino-NAD acts as a nucleophile and attacks the gamma-phosphate
      of the ATP in a substitution reaction, liberating pyrophosphate. The two Mg(II) ions stabilise the
      intermediates formed
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbonyl group of the phosphorylated substrate accepts a proton from the ammonium
      ion, thus increasing the electrophilicity of the carbon atom.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Water deprotonates the ammonia molecule, which then acts as a nucleophile and attacks
      the carboxyl carbon of the phosphorylated intermediate in a substitution reaction, liberating AMP.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A second water molecule deprotonates the alcohol group formed in the previous step, regenerating
