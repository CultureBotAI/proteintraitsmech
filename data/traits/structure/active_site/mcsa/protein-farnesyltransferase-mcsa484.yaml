      snippet: "The difficulty in obtaining experimental evidence for the mechanism of FTase has led to\
        \ increased interest in computation studies of the enzyme. A quantum mechanical active-site model\
        \ has elucidated key transition states of the reaction, and allowed the first description of the\
        \ mechanism. <br/><br/>
The farnesylation of the cysteine residue from the peptide substrate\
        \ is thought to proceed via a concerted associative mechanism, with partial dissociative character,\
        \ as previously postulated form experimental studies. The FPP unit attacks the peptide Cys sulphur,\
        \ forming a covalent bond to the residue and displacing the Zn metal. The metal centre is crucial\
        \ in polarising the S-C bond, enhancing its electrophilic character.
<br/><br/>
The free\
        \ coordination site left on the Zn is filled by the second carboxylate of the metal binding Asp297(B).\
        \ The divalent magnesium cation present is proposed to stabilise the build up of negative charge\
        \ on the diphosphate moiety and is implicated in activating the leaving group."
