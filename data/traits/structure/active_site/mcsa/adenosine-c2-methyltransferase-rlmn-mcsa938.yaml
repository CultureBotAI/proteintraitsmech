  edges:
  - subject: glu105
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Glu105 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/938/
      snippet: The first SAM molecule donates its methyl group to Cys355. SAH dissociates and a second
        molecule of SAM binds. This second molecule binds at the apical iron of the [4Fe-4S]-cluster.
        SAM binds at this free iron and undergoes homolytic cleavage to form the 5'-deoxyadenosyl radical
        essential for the reaction. This radical then abstracts a hydrogen atom from the methyl group
        attached to Cys355. RNA then binds, the methyl radical attacks the adenine base to form a new
        radical species. Glu105 abstracts a proton from the adenine base and a single electron is lost
        to ferredoxin. Cys118 then forms a disulfide bond with Cys355, eliminating the methylated RNA.
        The anionic species formed then abstracts a proton from Glu105 to form the final species. The
        enzyme's active site is regenerated through the reduction of  the disulfide bond with the gain
        of two protons and loss of two electrons; the exact mechanism of this regeneration is currently
        unclear.
      notes: M-CSA entry 938, mechanism 2; M-CSA cites PMID:18025251, PMID:20184321, PMID:21368151, PMID:21415317,
