  - subject: gly135
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Gly135 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/795/
      snippet: The reaction proceeds via a series of reaction intermediates involving the heme iron in
        different oxidation states. In the first stage of the reaction, dioxygen binds to the iron (III)
        ion in heme, and accepts an electron from the surrounding environment causing heterolytic fission
        of the pi bond. Concomitant protonation of the dioxygen by a water molecule, activated by Asp
        136, results in the formation of an Fe-OOH species. The OH group then acts as a nucleophile, attacking
        the alpha position of the porphyrin ring. Steric strain from Gly 135 and Gly 140 causes the destabilisation
        of all the other possible positions, thus stabilising the alpha meso hydroxylated intermediate.
        Binding of oxygen to this species liberates CO and forms Fe2+, which is then released when another
        molecule of dioxygen binds to the heme and cleaves the central cycle to form the biliverdin product.
        Thus the heme substrate acts as a cofactor in the reaction, by activating the dioxygen.
      notes: M-CSA entry 795, mechanism 1; M-CSA cites PMID:11439033, PMID:12070167, PMID:12235152, PMID:12842469,
        PMID:15528205, PMID:19154182; step 1
