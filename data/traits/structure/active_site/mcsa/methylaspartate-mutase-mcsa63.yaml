  - node_id: product0
    label: threo-3-methyl-L-aspartate(1-)
    node_type: CHEMICAL
    grounding: CHEBI:58724
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The Co(II)-C bond of the B12 cofactor undergoes homoloysis, forming the adenosyl radical
      and Co(I).
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The adenosyl radical abstracts a hydrogen from the substrate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The substrate undergoes homolytic elimination producing prop-2-enoic acid and a glycyl
      radical with concomitant deprotonation of the positively charged amine of the glycyl radical by
      Glu171B.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The glycyl radical adds to the double bond of prop-2-enoic acid, forming the product
      radical with concomitant deprotonation of Glu171B by the glycyl amine.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The substrate radical abstracts a hydrogen from the adenosine, re-forming the adenosyl
      radical.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The adenosyl radical and Co(I) undergo colligation, reforming the B12 cofactor.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products
