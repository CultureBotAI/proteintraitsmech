causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of 3-methyl-2-oxobutanoate dehydrogenase (2-methylpropanoyl-transferring)
  description: Stepwise mechanism transcribed from M-CSA entry 280 (8 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +45).
  nodes:
  - node_id: glu76
    label: catalytic Glu76 (M-CSA/PDB numbering; UniProt residue 121)
    node_type: RESIDUE
    grounding: UniProtKB:P12694
    description: 'M-CSA roles: activator, hydrogen bond acceptor, hydrogen bond donor, proton acceptor,
      proton donor, steric role.'
  - node_id: ser162
    label: catalytic Ser162 (M-CSA/PDB numbering; UniProt residue 207)
    node_type: RESIDUE
    grounding: UniProtKB:P12694
    description: 'M-CSA roles: hydrogen bond acceptor, steric role.'
  - node_id: his291
    label: catalytic His291 (M-CSA/PDB numbering; UniProt residue 336)
    node_type: RESIDUE
    grounding: UniProtKB:P12694
    description: 'M-CSA roles: activator, hydrogen bond acceptor, hydrogen bond donor, proton acceptor,
      proton donor.'
  - node_id: ser292
    label: catalytic Ser292 (M-CSA/PDB numbering; UniProt residue 337)
    node_type: RESIDUE
    grounding: UniProtKB:P12694
    description: 'M-CSA roles: hydrogen bond acceptor, hydrogen bond donor.'
  - node_id: reactant0
    label: 3-methyl-2-oxobutanoate
    node_type: CHEMICAL
    grounding: CHEBI:11851
  - node_id: reactant1
    label: N(6)-[(R)-lipoyl]-L-lysine residue
    node_type: CHEMICAL
    grounding: CHEBI:83099
  - node_id: reactant2
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: product0
    label: carbon dioxide
    node_type: CHEMICAL
    grounding: CHEBI:16526
  - node_id: product1
    label: N(6)-[(R)-S(8)-isobutyryldihydrolipoyl]-L-lysine residue
    node_type: CHEMICAL
    grounding: CHEBI:83142
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu76' abstracts a proton from the N(1)a position of the thiamine diphosphate cofactor,
      inducing a proton transfer which activates the cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The thiamine cofactor polarises the substrate carbonyl, increasing its reactivity towards
      the carbanion [PMID:10426958]. The cofactor anion attacks at the substrate carbonyl, forming a tetrahedral
      intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The tetrahedral anion intermediate removes the N(1) proton from the imine ring. This
      results in the deprotonation of Glu76'.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: His291 induces decarboxylation from the cofactor-substrate intermediate by abstracting
      a proton. The presence of a proton acceptor close to the departing carboxyl group lowers the activation
      barrier associated with decarboxylation [PMID:10426958].
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The disulfide bridge of lipoamide E is broken by nucleophilic attack.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His291 initiates the collapse of the intermediate with concomitant product formation.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The thiamine diphosphate cofactor is regenerated by abstracting a proton from the positively
      charged imidazole ring of His291.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: 3-methyl-2-oxobutanoate dehydrogenase (2-methylpropanoyl-transferring) catalytic site
    node_type: MOTIF
    grounding: MCSA:280
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.50.970 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.40.50.970
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: 3-methyl-2-oxobutanoate dehydrogenase (2-methylpropanoyl-transferring) activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0003863
    description: GO molecular function for EC:1.2.4.4, via GO's own ec2go mapping.
    xrefs:
