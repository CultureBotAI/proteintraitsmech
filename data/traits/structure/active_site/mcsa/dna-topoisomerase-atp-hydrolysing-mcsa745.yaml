  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "His 78 deprotonates Tyr 122, activating the phenol group.
The oxygen of the phenol\
      \ is coordinated to the second Mg ion which stabilizes the conjugate base."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "There is nucleophilic attack from Tyr 122 on to the scissile phosphate group.
This\
      \ forms a penta-covalent intermediate which is stabilized by both the Mg ions and Arg 32."
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "The bond between the phosphate and the 3'hydroxyl is cleaved. 
The bridging oxygen\
      \ is coordinated to the first Mg ion this makes the 3'-oxyanion a better leaving group. The 3'oxy-anion\
      \ accepts a proton (from an unknown source).
This concludes the cleavage step of the gyrase action."
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: "The following steps concern the religation process, which occurs after the topological\
      \ change of DNA.
Intramolecular proton transfer between the phosphate and the 3'  hydroxyl of\
      \ the cleaved DNA promotes the nucleophilic attack of the hydroxyl on to the scissile phosphate.\
      \ 
Forming the same intermediate as before."
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A water molecule deprotonates the scissile phosphate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Tyr 122 is cleaved from the phosphate and is protonated by a hydrononium ion. This completes
      the religation process.
