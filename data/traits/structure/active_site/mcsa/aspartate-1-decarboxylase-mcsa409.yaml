    label: mechanism step 2
    node_type: STATE
    description: Water is eliminated forming an iminium ion intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The iminium intermediate is decarboxylated with the carbonyl  of the pyruvoyl group acting
      as an electron sink causing it to tautomerise into an enolate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The enolate tautomerises back into a keto group. This causes the iminium ion to accept
      a proton from Tyr58.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Tyr58 now acts as a base to activate a water molecule to begin the hydrolysis of the
      iminium ion.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The product is formed and the pyruvoyl group is regenerated.
  - node_id: step7
