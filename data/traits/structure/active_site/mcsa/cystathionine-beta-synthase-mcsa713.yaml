    label: mechanism step 5
    node_type: STATE
    description: Lys119 performs a nucleophilic attack on the aldimine bond in a second transaldimination
      reaction.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The product is eliminated from PLP, regenerating the enzyme in its native state.
  - node_id: step7
