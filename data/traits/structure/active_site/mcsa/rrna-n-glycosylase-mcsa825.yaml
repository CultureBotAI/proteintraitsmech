  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: When in the active site, the substrate is in a strained high energy conformation which
      serves to weaken the C1-N9 bond. Both Arg186 and Ile94 act as electrostatic stabilisers by hydrogen
      bonding to N3 and N1 in adenine respectively, withdrawing electrons from this N-glycosidic bond
      thus facilitating bond cleavage.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The resulting ribose oxycarbenium ion is stabilised by the positively charged Glu183.
      Adenine rotates 15° so that the nucleophile, water can enter and attack the oxocarbenium ion. Adenine
      is protonated by the released proton from water.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Products.
