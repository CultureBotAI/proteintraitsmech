    label: poly(deoxyadenylic acid)
    node_type: CHEMICAL
    grounding: CHEBI:73276
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Lys34 acts as a nucleophile and attacks the alpha-phosphate of ATP in a substitution
      reaction, liberating pyrophosphate and forming an intermediate covalently bound to the enzyme. Mg(II),
      Lys238 and Lys240 stabilise the intermediates formed, Lys238 positions the pyrophosphate leaving
      group, allowing for the in-line mechanism to occur.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The phosphate group of the first strand of DNA acts as a nucleophile and attacks the
      phosphate bound to Lys34 in a substitution reaction, liberating Lys34 and forming a DNA-AMP complex.
      Mg(II), Lys238 and Lys240 stabilise the intermediates formed.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The AMP phosphate deprotonates the hydroxyl group of the second DNA molecule, which then
      acts as a nucleophile and attacks the DNA phosphate of the DNA-AMP complex in a substitution reaction,
      liberating AMP and the ligated DNA. Mg(II), Lys238 and Lys240 stabilise the intermediates formed.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Products
  - node_id: active_site
    label: DNA ligase (ATP) catalytic site
    node_type: MOTIF
    grounding: MCSA:202
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
