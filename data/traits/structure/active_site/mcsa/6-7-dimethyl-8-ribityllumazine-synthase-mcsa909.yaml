  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: It has been proposed that the first step of the mechanism involves the formation of a
      Schiff base intermediate between the two substrates. The position 7 hydrogen of the intermediate
      is removed by His88, which facilitates the loss of the phosphate group. The intermediate then undergoes
      tautomerisation and rotation of the enol motif. This positions the carbonyl group for the final
      ring closure.
