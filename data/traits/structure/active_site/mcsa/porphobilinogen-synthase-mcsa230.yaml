  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The zinc activated water deprotonates Lys260, activating it for the first step in Schiff
      base formation.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys260 initiates a nucleophilic attack at the substrate's C4 carbonyl carbon in the first
      step of Schiff base formation.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: In a proton rearrangement, the newly formed oxyanion deprotonates the positively charged
      nitrogen of Lys260.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The long pair of Lys260 initiates the elimination of the hydroxyl group as water, with
      the extra proton being donated by the zinc activated water.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The zinc activated water deprotonates Lys205, activating it for the first step in Schiff
      base formation.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Lys205 initiates a nucleophilic attack at the second substrate's C4 carbonyl carbon in
      the first step of Schiff base formation.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: In a proton rearrangement, the newly formed oxyanion deprotonates the positively charged
      nitrogen of Lys205.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The long pair of Lys260 initiates the elimination of the hydroxyl group as water, with
      the extra proton being donated by the zinc activated water.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Zinc activated water deprotonates the Lys205 bound intermediate at the C3 carbon, initiating
      a tautomerisation.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The lone pair of Lys205 initiates a double bond rearrangement that results in a nucleophilic
      attack of the Lys205 bound intermediate upon the C4 carbonyl carbon of the Lys260 bound intermediate,
      forming the new C3-C4 double bond.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The amine group of the Lys260 bound intermediate initiates an intramolecular nucleophilic
      attack upon the C4 of the Lys205 bound intermediate, which in turn deprotonates the zinc activated
      water.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: Zinc activated water deprotonates the intermediate, causing an elimination of Lys205.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: The covalently attached Lys260 deprotonates the zinc activated water.
  - node_id: step14
    label: mechanism step 14
    node_type: STATE
    description: Zinc activated water deprotonates the intermediate, causing an elimination of Lys260.
  - node_id: step15
    label: mechanism step 15
    node_type: STATE
    description: Lys260 deprotonates the intermediate causing a double bond rearrangement that results
      in the final, aromatic, product.
  - node_id: step16
    label: mechanism step 16
    node_type: STATE
    description: Lys205 deprotonates the zinc activated water to regenerate the enzyme's starting state.
