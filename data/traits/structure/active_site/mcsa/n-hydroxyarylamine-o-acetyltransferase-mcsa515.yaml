      snippet: The N-acetylation mechanism involves the transfer of an acetyl group from acetyl coenzyme
        A to the aryl substrate. The main catalytic residue, Cys 69 has been shown to form a reactive
        acyl-enzyme intermediate which is readily deacetylated by the basic N atom of the amine substrate.
        The close proximity Arg 64, along with the conserved Glu 39 are thought to stabilise the conformation
        of the Cys 69, and are not involved in a general base activation mechanism at Cys 69 as has been
        suggested in some work. The low pKa of Cys 69 associated with the formation of a nucleophilic
        thiolate at physiological pH levels results in a highly activated acetyl- enzyme intermediate
        (the lower the pKa, the more stable the conjugate acid).
