  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His171 deprotonates Ser328 activating it to attack the carbon of the peptide bond in
      a nucleophilic addition.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The tetrahedral transition state collapses, forming an acyl-enzyme and His171 acts as
      a general acid, protonating the amide leaving group
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His171 abstracts a proton from a water which in turn activates it to attack the carbon
      of the ester bond in a nucleophilic addition to produce another transition state tetrahedral intermediate
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The tetrahedral transition state collapses, forming the acid component of the substrate
      and Ser328. His171 acts as a general acid, protonating the leaving group Ser328 which returns the
      enzyme to its native state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
  - node_id: active_site
    label: subtilisin catalytic site
