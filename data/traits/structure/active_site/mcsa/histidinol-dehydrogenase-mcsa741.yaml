  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His327 deprotonates the hydroxyl group of L-histidinol. The NAD+ molecule accepts a hydride
      from the carbon bound to this hydroxide group in an aromatic bimolecular nucleophilic addition reaction,
      forming L-histindinaldehyde and NADP. The reactive carbon centre now adopts the sp2 configuration.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Prior to this step the reduced NADH cofactor leaves and is replaced by a second NAD+
      molecule. A water molecule is activated for nucleophilic attack at the L-histinaldehyde carbonyl
      carbon by Glu326. The aldehyde oxygen is protonated by His327 and L-histidindiol is formed. The
      reactive carbon centre is converted back to sp3 hybridisation.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His327 abstracts a proton from one of the hydroxyl groups of L-histidiniol. The hydride
      attached to the reactive carbon is transferred to a second NAD+ molecule in a second aromatic bimolecular
      nucleophilic addition reaction, forming L-histidine and NADH. The reactive carbon now has the sp2
      configuration.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: In an inferred reaction step His327 and Glu326 are deprotonated to regenerate the native
      state of the enzyme.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: histidinol dehydrogenase catalytic site
    node_type: MOTIF
    grounding: MCSA:741
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
