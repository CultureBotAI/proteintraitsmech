  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His399 activates Ser189 to  nucleophilically attack the substrate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ser189 performs a nucleophilic attack on to the carbonyl carbon creating the acyl-enzyme
      intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The nitroaniline is cleaved off the rest of the enzyme-acyl complex by recieving a proton
      from His399. The double bond reforms in the carbonyl oxygen. This step was inferred from the curator.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: His399 removes a proton from a water molecule creating a hydroxide that binds to the
      carbonyl carbon of the substrate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: His399 donates a proton to Ser189 collapsing the intermediate. This cleaves the substrate
      from the enzyme and regenerates the enzymes native state.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The final product.
