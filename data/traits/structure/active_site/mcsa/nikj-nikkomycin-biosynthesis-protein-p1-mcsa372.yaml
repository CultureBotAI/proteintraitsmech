  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: SAM is activated by the [Fe4S4]-AdoMet cluster to produce the methionine substrate and
      the 5'-deoxyadenosyl radical (5'-dA). The 5'-dA abstracts a hydrogen atom from the substrate, which
      then undergoes rearrangement to form the second ring structure. This then abstracts a hydrogen atom
      from Cys199 to give the final product. It is not yet clear how this residue is regenerated.
