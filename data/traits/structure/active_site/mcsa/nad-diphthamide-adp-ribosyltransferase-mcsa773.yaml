    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: "The enzyme transfers the ADP-ribosyl group transfer, from NAD to a diphthamide (modified\
      \ histidine) residue of EF-2. The mechanism is essentially migration of an electrophilic ribooxacarbenium\
      \ group, from the nicotinamide moiety of NAD to the imidazole group of diphthamide in EF-2.
\
      \  Glu 148 stabilises the positively charged, ion-like transition state."
