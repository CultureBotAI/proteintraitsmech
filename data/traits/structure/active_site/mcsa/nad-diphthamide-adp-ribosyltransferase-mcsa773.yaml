causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of NAD+---diphthamide ADP-ribosyltransferase
  description: Mechanism transcribed from M-CSA entry 773. M-CSA does not resolve this one into steps,
    so the whole mechanism is a single node quoting its `mechanism_text`; residue edges are still per-residue.
    Every edge quotes the M-CSA entry; M-CSA's primary references are in the edge notes. Residue nodes
    carry M-CSA/PDB author numbering only — no unique offset to the record's reference sequence could
    be verified, so no UniProt position is asserted.
  nodes:
  - node_id: glu148
    label: catalytic Glu148 (M-CSA/PDB numbering; UniProt residue 180)
    node_type: RESIDUE
    grounding: UniProtKB:P00588
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: reactant0
    label: NAD(1-)
    node_type: CHEMICAL
    grounding: CHEBI:57540
  - node_id: reactant1
    label: diphthamide residue
    node_type: CHEMICAL
