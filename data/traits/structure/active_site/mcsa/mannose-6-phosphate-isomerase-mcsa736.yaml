    label: mechanism step 1
    node_type: STATE
    description: "Lys 298 accepts a proton from the C1 hydroxyl. The ring oxygen accepts a proton from\
      \ His 219. This leads to the ring opening.
Following this step there is a 180 degree rotation\
      \ about the C3-C4 bond followed by rotation about the C2-C3 bond."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "Glu 203 accepts a proton from C2. This leads to the formation of a cis-enediolate intermediate\
      \ stabilized by Arg 135.
Following this step there is rotation about the C2-C3 bond."
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "The C=C bond of the enediolate intermediate accepts a proton from Glu 203. Simultaneously,\
      \ there is an intramolecular proton transfer where C1 oxygen accepts a proton from the C2 hydroxyl.\
      \ 
These proton transfers lead to a second tautomerization, forming a keto group on C2 and a\
      \ hydroxyl group on C1.
Following this step there is a 180 degree rotation about the C3-C4 bond."
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: 'The ring closes in the reverse process of step 1. This creates the final product: D-fructose
      6-phosphate.'
