    label: mechanism step 1
    node_type: STATE
    description: The reduced electron transfer flavoprotein delivers electron to the FAD cofactor via
      the iron sulfur cluster. Mutagenesis and kinetic calculations have shown the electron to relay through
      the Fe4S4 cluster before reaching the FAD cofactor, rather than being directly donated to the flavin
      [PMID:18672901]. The electron is relayed to FAD from the iron sulfur cluster through interactions
      between the c
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxidised electron transfer flavoprotein donates a proton to the FAD cofactor
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The one electron oxidised electron transfer flavoprotein donates a second electron to
      the iron sulfur cluster. On the addition of a second electron from the ET-transport flavin, both
      the flavin cofactor and Fe-S cluster are in a single electron reduced states, i.e a semi-quinone
      and +1 state, respecitively [PMID:17050691].
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The semiquinone FAD intermediate reduces the bound ubiquinone substrate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A second electron is donated from the Fe4S4 cluster to the FAD. The centres are coupled
      by the interaction between the Cys556 carbonyl and Arg331 [PMID:18672901].
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The oxidised electron transfer flavoprotein donates a proton to the FAD cofactor
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: FAD now donates a second reducing equivalent to the ubiquinone, forming the quinol product
      and regenerating the cofactor.
