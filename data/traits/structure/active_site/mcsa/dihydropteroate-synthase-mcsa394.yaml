    description: DHPS catalyses the reaction of para-aminobenzoic acid (pABA) with 7,8-dihydropterin-pyrophosphate
      to form pyrophosphate and 7,8-dihydropteroate. The condensation of pABA with DHPPP to form 7,8-dihydropteroate
      occurs via an SN1 reaction mechanism in an ordered manner in which DHPPP first binds DHPS, which
      then eliminates its pyrophosphate group (PPi) prior to pABA binding by stabilizing the cationi
