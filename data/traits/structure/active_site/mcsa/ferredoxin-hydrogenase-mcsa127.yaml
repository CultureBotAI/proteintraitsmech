  - node_id: reactant1
    label: di-mu-sulfido-diiron(1+)
    node_type: CHEMICAL
    grounding: CHEBI:33738
  - node_id: product0
    label: dihydrogen
    node_type: CHEMICAL
    grounding: CHEBI:18276
  - node_id: product1
    label: di-mu-sulfido-diiron(2+)
    node_type: CHEMICAL
    grounding: CHEBI:33737
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Each of the Fe(I) centres donates a single electron to one of the Lys237 protons, forming
      a 2-electron-3-centre bond bridging the two Fe(II) centres. The loss of the proton from Lys237 initiates
      a proton relay chain that involves Glu240, three water molecules and Glu245 before terminating in
      the bulk solvent.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: One of the iron-bound thiolates deprotonates Cys178, which initiates a proton relay chain
      that involves water,Glu156, Ser198 and Glu159 before terminating in bulk solvent.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The bridging hydride deprotonates the thiol, reforming the bound thiolate and a hydrogen
      molecule bound to one of the Fe(II) centres in a bidentate fashion.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Ferrocytochrome C2 donates a single electron through three iron-sulfur clusters and to
      the on the Fe(II) centres. This initiates the coordination of the hydrogen molecule through a single
      hydrogen atom to both iron centres.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: One of the carbon monoxide ligands initiates a nucleophilic substitution, resulting in
      the hydrogen molecule being bound to the Fe(II) centre in a bidentate fashion.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Ferrocytochrome C3 donates a second electron through three iron-sulfur clusters to the
      second Fe(II) centre, initiating the heterolysis of the bond between the hydrogen molecule and Fe(II)
      centre.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: ferredoxin hydrogenase catalytic site
    node_type: MOTIF
    grounding: MCSA:127
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.950.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.40.950.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
