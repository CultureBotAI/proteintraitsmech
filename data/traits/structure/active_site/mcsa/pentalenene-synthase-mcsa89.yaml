  - node_id: product1
    label: diphosphate(3-)
    node_type: CHEMICAL
    grounding: CHEBI:33019
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The substrate undergoes heterolysis. The diphosphate product remains associated with
      the active site, and the cabocation is delocalised over the three terminal carbon atoms of the intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The terminal double bond adds to the terminal carbocation in an intramolecular electrophilic
      addition resulting in a cyclic intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The cyclic intermediate undergoes a [1,2]-hydride shift.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Double bond rearrangement.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The substrate undergoes a dyotropic rearrangement. This  is an unusual elementary step
      in this terpene cyclisation, especially because the cationic centre seems to be not involved and
      rather plays a role as a spectator, but certainly the neighbouring migrating C–C-bond of the cyclobutane
      is substantially weakened and thus more reactive due to the presence of the cation.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The phosphate acts as a general acid/base, abstracting the proton from the final intermediate
      and generating the final product.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products
  - node_id: active_site
    label: pentalenene synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:89
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
