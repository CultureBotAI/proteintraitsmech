    label: catalytic Tyr547 (M-CSA/PDB numbering; UniProt residue 547)
    node_type: RESIDUE
    grounding: UniProtKB:P27487
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond donor.'
  - node_id: ser630
    label: catalytic Ser630 (M-CSA/PDB numbering; UniProt residue 630)
    node_type: RESIDUE
    grounding: UniProtKB:P27487
    description: 'M-CSA roles: covalently attached, hydrogen bond acceptor, hydrogen bond donor, nucleofuge,
      nucleophile, proton acceptor, proton donor.'
  - node_id: tyr631
    label: catalytic Tyr631 (M-CSA/PDB numbering; UniProt residue 631)
    node_type: RESIDUE
    grounding: UniProtKB:P27487
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond donor.'
  - node_id: asp708
    label: catalytic Asp708 (M-CSA/PDB numbering; UniProt residue 708)
    node_type: RESIDUE
    grounding: UniProtKB:P27487
    description: 'M-CSA roles: activator, electrostatic stabiliser, hydrogen bond acceptor.'
  - node_id: his740
    label: catalytic His740 (M-CSA/PDB numbering; UniProt residue 740)
    node_type: RESIDUE
    grounding: UniProtKB:P27487
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, hydrogen bond donor,
      proton acceptor, proton donor.'
  - node_id: reactant0
    label: Xaa-Pro-Zaa
    node_type: CHEMICAL
    grounding: CHEBI:137048
  - node_id: reactant1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product0
    label: Dipeptide (Xaa-Pro)
    node_type: CHEMICAL
    grounding: CHEBI:4635
  - node_id: product1
    label: alpha-amino acid
    node_type: CHEMICAL
    grounding: CHEBI:33704
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His740 in a Ser-His-Asp triad deprotonates Ser630.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ser730 attacks the carbonyl carbon of the peptide bond in a nucleophilic addition.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion initiates an elimination reaction that cleaves the peptide bond, releasing
      the new N-terminus of the protein, which protonates from His740.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: His740 deprotonates water, which attacks the carbonyl carbon bound to Ser630 in a nucleophilic
      addition.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The oxyanion initiates an elimination that cleaves the acyl bond to Ser630, releasing
      the L-aminoacyl-Lproline product. Ser630 then deprotonates His740, regenerating the active site.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Product
