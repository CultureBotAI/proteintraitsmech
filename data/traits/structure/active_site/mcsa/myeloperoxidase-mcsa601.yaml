<ol>
<li>Peroxidase (FE3+) +\
      \ H2O2 = Compound I (FE4+') + H20 </li>
<li> Compound I (FE4+') + AH2 = Compound II (FE4+) +\
      \ AH'</li>
<li>Compound II (FE4+) + AH2 = Peroxidase (FE3+) + AH'</li>
<li> 2AH' = A2H2 or\
      \ A + AH2 
</li></ol>
