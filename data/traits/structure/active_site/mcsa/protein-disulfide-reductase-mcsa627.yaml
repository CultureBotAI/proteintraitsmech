      Disulfide bond (Dsb) proteins are required to form disulphide bonds which enable the folding of secreted proteins within the periplasm of Escherichia coli. DsbA catalyses the oxidation of a pair of cysteine sulfhydryl groups, forming disulphide bonds. Electrons generated from the oxidation are transferred from DsbA to DsbB then into the electron transport chain. DsbC, DsbD, DsbE and DsbG repair improperly formed disulfides. The N terminal region of the thioloxidoreductase enzyme DsbD from E. coli is able to reduce the disulphide bond in DsbC and thus participates in the pathway whereby electrons from NADPH are used to break incorrectly formed disulphides in proteins in the periplasm. It displays a unique Ig fold, but still shows homology with the thioloxidoreductase family.
