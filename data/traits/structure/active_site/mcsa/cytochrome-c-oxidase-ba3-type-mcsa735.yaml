    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/735/
      snippet: "<p>The ba3-type COX has a copper CuA centre (comprising two copper ions), a haem b, and\
        \ a redox active binuclear centre comprising CuB and a haem As3 iron. Tyr 237 is near CuB and\
        \ haem As3, and has a low pKa due to a covalent bond with His 233. In the resting (oxidised or\
        \ O) state, the haem As3 contains Fe(III) and CuB is Cu(II). A hydroxide ion is bound by Fe and\
        \ CuB. Cytochrome c docks, transferring an electron (via Phe 88 and Phe 86) to the CuA centre.\
        \ From here the electron is transferred (via Arg 450, Arg 449, haem b, His 386, Phe 385 and His\
        \ 384) to the binuclear centre, giving a semi-reduced E state. This occurs at the same time as\
        \ a proton is accepted by the hydroxide to give a water, which leaves. A second cytochrome c delivers\
        \ an electron (via the same route as the first) to give the fully reduced R state, in which the\
        \ binuclear centre contains Fe(II) and Cu(I). Molecular oxygen then binds to Fe(II), giving a\
        \ short-lived A state. The next intermediate depends on whether there is an electron available\
        \ on haem b (which will be delivered by a third cytochrome c via the same route as before):</p>\
        
<ol>
<li>If there is an electron available on haem b, four electrons (one from haem b, one\
        \ from CuB, two from haem as3) reduce oxygen to yield a oxo-ferryl adduct with Fe(IV)=O and Cu(II)\
        \ (the PR state). Water is produced, with the protons from a pool of water above the active site\
        \ and/or Tyr 237.</li>
<li>If there is no electron available on haem b, four electrons (one\
        \ from CuB, two from haem as3, one from Tyr 237) reduce oxygen to yield a oxo-ferryl adduct with\
        \ Fe(IV)=O, Cu(II) and a Tyr 237 radical (the PM state). Water is produced, with the protons from\
        \ a pool of water above the active site and Tyr 237.  Both the P states decay to the F state (by\
        \ protonation of Tyr 237 for PR, and reduction and protonation for PM) which also has Fe(IV)=O\
        \ and Cu(II) but a regenerated Tyr 237.  An electron from a fourth cytochrome c is delivered to\
        \ give the resting O state with Fe(III), Cu(II), hydroxide and protonated Tyr 237.</li>
</ol>\
        
<p>The route of proton transfer (either for water formation or the coupled proton pumping) is\
        \ not exactly known. However, recent work has deomonstrated that this protein probably utilises\
        \ the K-pathway. That being said, mutagensis of Asp372 (the Q-pathway) demonstrated a severe inhibition\
        \ of proton transport. The three identified possible routes in ba3-type COX are known as the K-,\
        \ D- and Q-pathways. The K- and D- pathways are thought to be the relevant routes in bovine mitochondrial\
        \ COX, but ba3-type COX shows low homology for the residues involved, and it is possible for other\
        \ pathways to be active in <i>T. thermophilus</i>. The three pathways are as follows:</p>
\
        <ul>
<li>K-pathway: Glu 516, Asp 517, His 8 (subunit II), Ser 261, Glu 15 (subunit II), Thr\
        \ 312, Ser 309, Tyr 237 and His 233.</li>
<li>D-pathway: Glu 17, Tyr 91, Thr 21, two water\
        \ molecules, then some or all of: Ser 109, Gln 86, Ser 155, Thr 156, Gln 82, then to a water-filled\
        \ cavity; from there, directly to the binuclear centre, or via Ser 197 and Thr 231.</li>
<li>Q-pathway:\
