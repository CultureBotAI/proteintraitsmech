    label: catalytic His195 (M-CSA/PDB numbering; UniProt residue 340)
    node_type: RESIDUE
    grounding: UniProtKB:P0C0J0
    description: 'M-CSA roles: proton shuttle (general acid/base).'
  - node_id: trp212
