  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: Cys 47 acts as the nucleophile for initial attack on the peptide substrate. The tetrahedral
      intermediate then collapses on protonation of the leaving group by His 195. This leaves an acyl-enzyme
      intermediate which is hydrolysed by an activated water molecule to complete the reaction.
