  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Sulfite initiates a nucleophilic attack upon one of the oxo groups coordinated to the
      Mo(VI) centre in an addition reaction, resulting in a two electron reduction of the centre to Mo(IV).
      It seems very likely that only one of the two oxygen ligands is the catalytically labile oxygen,
      whereas the other oxygen cannot be attacked owing to steric hindrance in the active site of the
      enzyme [PMID:924290
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Water displaces the sulfate as a ligand to the Mo(IV) centre.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Water deprotonates Tyr322, which deprotonates the Mo-bound water causing a single electron
      to be transferred from the Mo(IV) centre to Haem and thence to ferricyrochrome C.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Water deprotonates Tyr322, which deprotonates the Mo-bound hydroxide causing a single
      electron to be transferred from the Mo(V) centre to Haem and thence to ferricyrochrome C and regenerating
      the cofactor.
