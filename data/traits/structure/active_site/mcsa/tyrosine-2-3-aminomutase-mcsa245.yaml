  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amine of the substrate tyrosine initiates a nucleophilic attack upon the 4-ene carbon
      of the MIO cofator, resulting in double bond rearrangement and the formation of an oxyanion.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Tyr63 deprotonates the covalently bound tyrosine substrate initiating an elimination
      that results in the aminated cofactor and coumarate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion collapses, eliminating the ammonia group, which initiates a nucleophilic
      attack on the coumarate intermediate in an addition reaction with concomitant deprotonation of Tyr63
