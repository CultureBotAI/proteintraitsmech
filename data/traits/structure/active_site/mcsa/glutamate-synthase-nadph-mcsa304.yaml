  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: NADP reduces the FAD cofactor. It is not yet clear exactly how this step occurs and what
      residues, if any, are involved
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The FMN is in the synthase domain. A single electron is transferred from FAD, via the
      iron-sulfur clusters and Met479 to the FMN cofactor. Studies suggest that the 2-oxoglutarate substrate
      needs to bind before the electron transfer can occur [PMID:11331018]. This is the first of two single
      electron transfers. The identity of the proton donors/acceptors is currently unclear.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The FMN is in the synthase domain. A second single electron is transferred from FAD,
      via the iron-sulfur clusters and Met479 to the FMN cofactor.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: This reaction occurs in the glutaminase domain. The N-terminus of Cys1 deprotonates water,
      which deprotonates the thiol group of Cys1, initiating a nucleophilic attack on the amide carbon
      in an addition reaction. The N-terminus of Cys1 may also directly deprotonate the thiol group of
      Cys1 and not involve a water molecule.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: This reaction occurs in the glutaminase domain. The oxyanion initiates an elimination
      that cleaves ammonia from the bound L-glutamine substrate. Ammonia deprotonates water, which deprotonates
      the N-terminus of Cys1.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: This reaction occurs in the glutaminase domain. The N-terminus of Cys1 deprotonates water,
      which initiates a nucleophilic attack on the carbonyl carbon of the covalently bound intermediate
      in an addition reaction.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: This reaction occurs in the glutaminase domain. The oxyanion initiates an elimination
      that cleaves the C-S bond, the thiolate of Cys1 deprotonates water, which deprotonates the N-terminus
      of Cys1.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: This reaction occurs in the synthase domain. Ammonia initiates a nucleophilic attack
      on the C2 of 2-oxoglutarate in an addition reaction.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: This reaction occurs in the synthase domain. Water is produced through an intramolecular
      elimination forming the 2-iminoglutarate intermediate.
  - node_id: step10
