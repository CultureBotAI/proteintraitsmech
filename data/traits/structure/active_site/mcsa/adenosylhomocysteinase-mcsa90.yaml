  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp189 deprotonates Lys185 and Glu155 deprotonates Asp130.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys185 deprotonates 3'-OH of the substrate. This cause the elimination of a hydride ion,
      which is transferred to the NAD cofactor. Concurrently, Asp130 deprotonates the C4' position to
      produce the 3′-keto-4′-dehydro-AdoHcy carbanion.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: C5′–SD bond is cleaved by H54, and Hcy and 3′-keto-4′,5′-dehydro-Ado are produced. Hcy
      is released through the solvent channel, and the catalytic domain increases in mobility because
      the domain and the intermediate interactions are decreased.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A water molecule enters the SD-binding site, is polarized by H54, and nucleophilically
      attacks the C5′ of 3′-keto-4′, 5′-dehydroadenosine to produce Ado.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The NAD cofactor eliminates the hydride ion, which adds to the 3'-C initiating the oxyanion
      to deprotonate Lys185.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The catalytic cleft is opened by rotating the catalytic domain by 18°, and Ado is released
      from the active site and the native state of the protein is regenerated.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products
