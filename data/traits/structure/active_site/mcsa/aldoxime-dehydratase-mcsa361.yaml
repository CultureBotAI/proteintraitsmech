    node_type: STATE
    description: 'The Fe(III) centre donates a second single electron to the N of the aldoxime. Spectroscopic
      studies suggest the Fe metal to adopt an oxidation state like that observed in horse radish peroxidase:
      a highly oxidised (+4) feryl-oxo heme species [PMID20826798:].'
  - node_id: step3
