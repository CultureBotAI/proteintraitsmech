    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/882/
      snippet: Catalysis occurs by a three-step mechanism, starting with the activation of the enzyme
        by ATP, forming a phosphoramide bond between adenylate and a histidine (His309, activated by Glu14)
        residue [PMID:10574971, PMID:19690099]. The adenylate group is then transferred to the 3'-phosphate
        terminus of the substrate, forming the capped structure [RNA]-3'-(5'-diphosphoadenosine). Finally,
        the enzyme catalyses an attack of the vicinal O-2' on the 3'-phosphorus, which results in formation
        of cyclic phosphate and release of the adenylate. As with other ATP-dependent enzymes, it is thought
        that the magnesium ion is bound directly to the phosphate groups of ATP.
      notes: M-CSA entry 882, mechanism 1; M-CSA cites PMID:19690099, PMID:20399182, PMID:21098490, PMID:22167800,
