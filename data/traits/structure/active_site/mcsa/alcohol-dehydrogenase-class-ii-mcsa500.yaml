    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Thr48 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/500/
      snippet: 'Mouse ADH2 follows an ordered bi-bi mechanism, and hydride transfer is rate-limiting for
        oxidation of benzyl alcohols. The general mechanism is thought to proceed in the same manner as
        for other zinc-dependent ADHs: the substrate binds to a zinc ion at the active site, which allows
        deprotonation of the OH group by Thr48 or Ser182 and probably active site water in a proton relay
        system, because the zinc ion stabilises the oxyanion thus reducing the pKa of the OH to around
        8.4. This allows hydride transfer from C2 to the NAD<sup>+</sup> with the oxygen lone pair overlapping
        with the sigma* orbital of C2 to create the double bond that characterises the product.'
      notes: M-CSA entry 500, mechanism 1; M-CSA cites PMID:10514444, PMID:10970744, PMID:14756569; step
