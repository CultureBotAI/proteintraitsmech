  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Lys183 abstracts a proton from the sugar substrate, eliminating a hydride ion, which
      is added to the NADP cosubstrate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The NADPH rotates away from the active centre. The substrate than undergoes decarboxylation
      and Lys183 donates a proton back to the intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Carbon dioxide diffuses from the active site. Lys183 initiates an assisted keto-enol
      tautomerisation to form the final product which diffuses from the active site along with NADPH.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Inferred return step to regenerate the active site protonation states. We assume that
      the proton can be directly transferred from Glu190 to Lys183.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products.
