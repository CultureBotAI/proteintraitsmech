      formed deprotonates Glu3294B.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Glu1294B deprotonates the hydroxyl formed from the oxyanion, initiating the elimination
      of ammonia, which gains a proton from Glu1294B.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The Asp-Lys-Thr triad activates water, which initiates a nucleophilic attack on the carbonyl
      carbon of the covalently attached intermediate. The formed oxyanion deprotonates the water which
      attacked.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Glu1294B deprotonates the hydroxyl formed from the oxyanion, initiating the elimination
      of Thr1020, which in turn deprotonates Tyr1034, which then deprotonates Glu1294B.
