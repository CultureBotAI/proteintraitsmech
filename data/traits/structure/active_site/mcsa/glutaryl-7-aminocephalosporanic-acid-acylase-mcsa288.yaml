  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: A water molecule acts as a proton carrier in the deprotonation of the Ser170A side chain
      hydroxyl by the N terminal amine group. The presence of low barrier hydrogen bonds between Ser170,
      His193, Glu525 and the conserved water molecule facilitates proton transfer by lowering the activation
      energy associated with each step.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The side chain hydroxide of Ser170A attacks the substrate amide carbonyl, forming a tetrahedral
      intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The tetrahedral intermediate collapses, forming a serine linked glutarate intermediate
      and eliminating 7-Aminocephalosporanic acid.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Water is activated by the non-protonated terminal amine of Ser170 to attack at the enzyme-substrate
      intermediate's carbonyl group, forming a second tetrahedral intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The tetrahedral anion intermediate collapses, releasing glutarate and the N terminal
      serine.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The anionic serine side chain undergoes an intamolecular deprotonation, removing a proton
      from the terminal amine group via a conserved water molecule.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products
