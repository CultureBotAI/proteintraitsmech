  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu232 moves into proximity of the MEcPP C3 hydroxyl group. This amino acid then accepts
      a proton released on formation of the alkoxide complex.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: IspG catalyzes positional isotopic exchange of the MEcPP's external diphosphate oxygen
      atoms that causes a reversible C2-O bond cleavage and ring opening. The C2 atom turns to a carbocation.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The carbocation turns to a radical state, mediated by the first electron transfer from
      FMN via the [Fe4S4]<sup>2+/3+</sup> cluster.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The second electron transfer creates a carbanion and the loose phosphate gets protonated
      from the solution.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The C2 carbanion then forms a double bond with C3, which in the same time loses its oxygen.
      The C3 oxygen is lost by protonation from Glu232 and afterwards the solution.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Final product.
