  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: "The ketyl radical ion eliminates water at the C4 position to form a dienoxy radical,\
      \ this is aided by protonation from Glu455.

Thr190 and Glu257 both act to deprotonate the\
      \ neutral semiquinone, reforming the semiquinone anion."
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The dienoxy radical abstracts an electron from the semiquinone forming a dienolate and
      quinone.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The dienolate tautomerizes via protonation at C4 from Glu455 to form the product crotonyl-CoA.
