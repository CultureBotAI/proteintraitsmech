  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Water deprotonates the 7,8-diaminononanoate substrate, activating it for a nucleophilic
      attack upon the carbon dioxide in an addition reaction. Lys37 stabilises the formation of the negatively
      charged intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carboxylated intermediate acts as a nucleophile and attacks the gamma phosphate of
      ATP in a substitution reaction. Lys37, Lys15 and two Mg(II) ions stabilise the intermediates.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The newly attached phosphate group deprotonates the terminal primary amine, which in
      turn acts as a nucleophile to attack the phosphorylated carbonyl carbon in an internal addition
      reaction. Lys37, Lys15 and the main chain amide of Ser41 all stabilise the intermediates.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion formed re-forms the carbonyl group, cleaving the P-O bond in a conjugate
      base elimination reaction. The leaving phosphate group deprotonates the newly formed secondary amine.
      Lys15, Lys37 and the main chain amide of Ser41 all stabilise the intermediates.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products
  - node_id: active_site
    label: dethiobiotin synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:74
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
