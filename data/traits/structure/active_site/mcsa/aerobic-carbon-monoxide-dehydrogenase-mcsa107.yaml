  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The Carbanion of carbon monoxide initiates a nucleophilic attack on the oxo group coordinated
      to the Mo(VI) centre, which results in the reduction of the molybdenum to Mo(IV). The C#O triple
      bond reduces in order to C=O.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The sulfur dianion bridging the Mo(IV) and Cu(I) centres initiates a nucleophilic attack
      on the carbocation in a substitution reaction that displaces the carbon from the Cu(I) centre.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The carbonyl oxygen initiates a nucleophilic attack on the Cu(I) centre in a substitution
      reaction that displaces the bridging sulfur ligand from the Cu(I) centre.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Glu763 deprotonates water,  initiates a nucleophilic attack on the Mo(IV) centre, displacing
      the negatively charged oxygen of the carboxylate group in a substitution reaction, which initiates
      an elimination of the sulfur group, to reform the bridging sulfur dianion and the formation of carbon
      dioxide, which decoordinates from the metal centre.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Water deprotonates Glu763, which then deprotonates the Mo(V) bound hydroxide, initiating
      the second single electron transfer, through two iron-sulfur clusters to FAD, and thence to an external
      electron acceptor. This regenerates the cofactor.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The second single electron transfer from the Mo(V) through two iron-sulfur clusters to
      FAD, and thence to an external electron acceptor. This regenerates the cofactor.
