    label: mechanism step 1
    node_type: STATE
    description: Monodentate coordination of oxalate monoanion, displacing one solvent molecule from the
      Mn(II) centre.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Dioxygen binding to Mn(II) displaces another solvent molecule, and forms an Mn(III) superoxide
      metalloradical complex.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Activation of the Mn(III)-bound oxalate through deprotonation (inferred by curator).
      This causes the oxalate bridging oxygen to transfer an electron to the Mn(III) centre.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Decarboxylation of the radical oxalyl anion.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The superoxide radical binds to the the radical carbonyl group.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: A second decarboxylation occurs and along with two proton transfers, to form hydrogen
      peroxide.
  - node_id: step7
