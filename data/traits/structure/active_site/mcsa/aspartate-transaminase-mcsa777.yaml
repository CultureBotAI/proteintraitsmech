  - subject: asp223
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Asp223 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/777/
      snippet: "The reaction follows a ping-pong mechanism.   

In the enzyme, PLP is anchored to\
        \ the protein at Lys258 with its pyridoxal moiety in the reactive bipolar ionic form. In the first\
        \ step, the cofactor PLP is transferred from Lys 258 to the aspartate alpha amino group. The alpha-amino\
        \ group of the aspartate attacks the PLP C4' from the front side in a direction perpendicular\
        \ to the plane of the pyridine ring. The attraction of opposite charges on the substrate N atom\
        \ and O3' of the coenzyme brings about a 90 degrees rotation of the 2 C-N bonds around C4-C4'\
        \ which brings Lys258 behind the plane of the pyridine ring and hence Lys258 can be released.\
        \ Trp 140 sterically constraining the PLP to allow the attack of aspartate.<br/>The deprotonation\
        \ of the alpha-carbon of aspartate gives rise to the quinonoid intermediate, which is stabilised\
        \ by the electron link of the protonated pyridine ring. Asp223 facilitates the deprotonation by\
        \ stabilising the positive charge at N1 of PLP with a salt bridge and hence enhancing the electron\
        \ withdrawing capacity of the amino acid substrate. Lys 258 acts as a base here. Lys258 then protonates\
        \ C4' from the si side, giving rise to keimine intermediate. It then deprotonates a water molecule\
        \ to allow its nucleophilic attack on the alpha-carbon. The tetrahedral intermediate dissociates\
        \ into PMP and oxo-acid product. Subsequent reversal of the reaction steps described occurs except\
        \ with the carboxyl group of the alpha keto-glutarate acting as the nucleophile leading to the\
        \ formation of glutamate and the completion of the reaction cycle."
      notes: M-CSA entry 777, mechanism 1; M-CSA cites PMID:1610831, PMID:2513875, PMID:6143829; step
        1
