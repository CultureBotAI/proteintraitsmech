  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: 2-oxoglutarate initiates an electrophilic addition to dioxygen, which coordinates to
      the Fe(II) cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Carbon dioxide is eliminated from the intermediate to form a planar peroxo intermediate.
      Carbon dioxide is still coordinated to the Fe(II) cofactor.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Fe(II) initiates an elimination reaction by donating two electrons to the bound peroxo
      moiety, cleaving the peroxo bond and producing the succinate product and iron as a ferryl species.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Penicillin binds, displacing the succinate and carbon dioxide as iron ligands. The oxo
      group deprotonates the CH<sub>3</sub> of the penicillin, generating a alkyl radical and resulting
      in the donation of a single electron to Fe(IV).
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A colligation occurs between the alkyl radical and the sulfur of the  five membered ring
      in the penicillin.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The C-S bond of the original five-mebered ring homolyses, producing the six-membered
      ring.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The carbon radical in the ring donates a single electron to the Fe(III) cofactor, which
      causes the bound hydroxide to deprotonate the C3 of the thiazolidine ring generating the final deacetoxycephalosporin
      C product.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: deacetoxycephalosporin-C synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:137
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
