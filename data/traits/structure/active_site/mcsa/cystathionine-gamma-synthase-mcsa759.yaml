    label: succinate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:30031
  - node_id: product1
    label: L-cystathionine dizwitterion
    node_type: CHEMICAL
    grounding: CHEBI:58161
  - node_id: product2
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Tyr101 initiates transaldimination by abstracting a proton from the substrate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The substrate amine nucleophilically attacks the C4' on the internal aldimine.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The secondary aminethaat results from the initial attack initiates an elimination of
      Lys198.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lys198 deprotonates the allylic Cα atom of intermediate which results in the rearrangement
      of double bonds and PLP acting as an electron sink.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: PLP feeds the electron back so that the C4' can accept a proton from Lys198.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Lys198 then deprotonates the beta carbon.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Tyr101 facilitates the release of succinate by protonating the oxygen which results in
      the cleavage of succinate from the substrate and the rearrangement of double bonds.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The gamma carbon now has pronounced electron deficiency and so cysteine can attack it
      by Michael nucleophilic addition.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Beta carbon is protonated by Lys198
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Lys198 deprotonates the C4' carbon which results in the arrangement of double bonds as
      PLP acts as an electron sink.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: PLP feeds the electrons back which results in the protonation of the alpha carbon.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The amine of Lys198 attacks the PLP in a nucleophilic addition reaction, the secondary
      amine of the attached substrate reprotonates from the bound Lys198.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound product, resulting in cystathionine and the regenerated PLP cofactor.
  - node_id: step14
    label: mechanism step 14
    node_type: STATE
    description: Products
  - node_id: active_site
    label: cystathionine gamma-synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:759
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.640.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.40.640.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
