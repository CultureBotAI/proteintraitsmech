  - node_id: product2
    label: 2'-deoxyribonucleoside 5'-triphosphate(4-)
    node_type: CHEMICAL
    grounding: CHEBI:61560
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The cofactor (a deoxy derivative of vitamin B12) decomposes via a homolysis reaction
      to produce B12 (the cobalamine, cobalt containing, portion) and deoxyadenosyl portion.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The deoxyadenosyl radical is transferred to Cys408 via a hydrogen transfer reaction
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The radical on the sulfur of Cys408 is transferred to the ribonucleoside triphosphate
      substrate via a hydrogen transfer reaction.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Glu410 deprotonates the ribonucleoside radical, reducing the secondary alcohol group
      to a ketone group and transfers the radical to the next carbon along, resulting in the elimination
      of water and concomitant deprotonation of Cys119.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The deoxyibonucleoside intermediate acquires a hydrogen from Cys419, transferring the
      radical to this residue. Cys419 then undergoes attack from Cys119, forming a disulfide bond
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The radical on the Cys419-Cys119 species is transferred through a chain of hydrogen bonded
      active site residues, Asn406 and Glu410, to the substrate 2'-position. The ketone group is then
      re-oxidised to a secondary alcohol with concomitant deprotonation of Glu410
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The 2'-deoxyribonucleoside triphosphate product is formed by hydrogen transfer from Cys408,
      generating a thiyl radical
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The thiyl radical of Cys408 is transferred back to the deoxyadenosine via a hydrogen
      transfer.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The cofactor is regenerated via a colligation reaction between the cobalamine portion
      and the deoxyadenosyl portion
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The disulfide bond between Cys119 and Cys419 is transferred to Cys419 and Cys731 with
      concomitant proton transfer to Cys119. The exact order of events is unclear
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The disulfide bond between Cys419 and Cys731 is transferred to Cys731 and Cys736 with
      concomitant proton transfer to Cys419. The exact order of events is unclear
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The disulfide bond between Cys731 and Cys736 is transferred to Cys736 and the thioredoxin
      acceptor with concomitant proton transfer to Cys731. The exact order of events is unclear
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: The disulfide bond between Cys736 and thioredoxin is transferred to the second free thiol
      of thioredoxin with concomitant proton transfer to Cys736, regenerating the enzyme and producing
      the fully oxidised thioredoxin. The exact order of events is unclear
  - node_id: step14
    label: mechanism step 14
    node_type: STATE
    description: Products.
