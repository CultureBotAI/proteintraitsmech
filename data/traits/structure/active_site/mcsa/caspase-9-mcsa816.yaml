  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His237 deprotonates Cys287, activating it to so it can nucleophilically attack the carbon
      of the carbonyl which produces the oxyanion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage of the peptide bond.
      His237 then donates a proton to the amino group of the N-terminal product preventing reformation
      of the peptide bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His237 deprotonates a water, activating it so that it can attack the carbon of the thioester
      bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage of the thioester
      bond. Cys287 now accepts a proton from His237 which returns the enzyme to its native state.
