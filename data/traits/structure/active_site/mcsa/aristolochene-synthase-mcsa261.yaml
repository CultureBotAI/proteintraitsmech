  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Initial carbocation formation is triggered by coordination of the diphospahte leaving
      group to the divalent metal cation cofactors. The C10-C11 double bond initiates an electrophilic
      substitution at the C1, eliminating the diphosphate product.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys206 deprotonates the C12, producing the neutral Germacrene A intermediate.  A hydrogen
      bond network linking Lys206 to the bulk solvent through Asp203 and Arg200 may provide a proton shuttle
      from the bulk solvent.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The C2-C3 double bond initiates an electrophilic attack on the C7, which causes the protonation
      of C6 from Lys206 to form the Eudesmane cation intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lys206 deprotonates the C8 carbon, which forms a double bond between C8 and C7. This
      initiates the migration of the C14 methyl from C7 to C8 and a migration of a hydride from C2 to
      C3 to form the Aristolochene product.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Inferred return step. The Lys206 is likely deprotonated <i>via</i> a hydrogen bond network
      linking Lys206 to the bulk solvent through Asp203 and Arg200.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products.
