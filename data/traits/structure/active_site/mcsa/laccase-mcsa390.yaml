        \ electrons taken from the substrates are transferred, through two intramolecular electron transfer\
        \ pathway starting from the T1 copper ligand Cys452 and subsequently splitting between His451\
        \ and His453 which bind to the T3(a) and T3(b) copper ions respectively in the second active site.\
        \ Here the oxygen molecules bind and are reduced to water molecules. It is composed by a trinuclear\
        \ copper cluster, with a T2 Cu ion and two T3 Cu ions arranged in a triangular way, embedded between\
        \ domains I and III and bound to eight histidine residues and two water molecules. T2 Cu is tricoordinated\
        \ and bound to His64, His397 and one water molecule.  The two T3 coppers are tetracoordinated:\
        \ T3(a) Cu binds to residues His111, His399 and His449, T3(b) Cu binds to residues His66, His109\
        \ and His453; moreover there is a water molecule asymmetrically bound between the two T3 copper\
        \ ions."
      notes: M-CSA entry 390, mechanism 3; M-CSA cites PMID:12118243, PMID:12163489, PMID:16510995, PMID:17897461,
