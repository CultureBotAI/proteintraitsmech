        \ found and where organic substrates (mainly phenols or arylamines) are oxidized releasing electrons\
        \ to the T1 copper ion through a bound His residue (His457). The coordination of the T1 copper\
        \ ion, which is not solvent exposed, is completed by His394 and Cys452.   
<br/><br/>
