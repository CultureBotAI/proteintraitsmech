  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: In the α-active site there is a proton transfer from Glu49 to IGP via a water molecule.
      The substrate is held by a network of hydrogen bonds.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The anionic Glu49 abstracts a proton from the intermediate via a water molecule. This
      triggers C-C bond cleavage to give indole and G3P. The indole molecule is transferred to the β-active
      site of the enzyme via a tunnel. G3P remains in the α-subunit until the enzyme conformation changes
      to an open state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: 'In the β-active site, in the presence of the L-Ser substrate, a transimination reaction
      takes place in which the PLP cofactor is covalently bound to the substrate, forming an external
      aldimine (Aex-Ser). This step has not been studied in this enzyme but is shown here  in a similar
      fashion to other PLP transamination reactions (see M-CSA ID: 66, for example).'
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lys87 is eliminated from the covalent intermediate, leading to the formation of an external
      aldimine (Aex-Ser).
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Abstraction of a proton from Aex-Ser by Lys87 forms a quinonoid intermediate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The anionic intermediate is stabilised by the conjugated pi system provided by the PLP
      cofactor. Following dihedral rotation to align the hydroxyl group with Lys87, there is a proton
      transfer from Lys87 to the intermediate. Another intermediate is formed and a water molecule is
      released. Overall a C-C double bond forms.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The indole molecule reaches the β-active site and is well aligned to react with the intermediate,
      forming a Trp quinonoid intermediate.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Proton transfer to Lys87, forming a third Trp quinonoid reaction intermediate.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Proton transfer from Lys87 to the intermediate forming the tryptophan product covalently
      bonded to the PLP cofactor.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Aex-Trp undergoes a transamination reaction starting with a nucleophilic attack of Lys87
      on the PLP cofactor.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The transamination reaction is completed to restore the Lys87 double bond to the PLP
      cofactor and produce a free tryptophan residue.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: Products
