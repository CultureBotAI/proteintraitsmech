  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The interactions between the zinc bound hydroxide, Thr199 and Gu106 serve to enhance
      the nucleophilicity of the hydroxide and help to orient the substrate (carbon dioxide) in the active
      site [PMID:12500287]. Zinc activated water attacks the carbon of carbon dioxide in a nucleophilic
      addition, which results in the bicarbonate moiety being bound to the zinc in a bidentate manner.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The bicarbonate ion formed at the end of the first step is displaced by a water molecules
      before this step occurs [PMID:12500287]. His64 deprotonates the zinc bound water.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Evidence suggests that upon receiving the proton from the water, the His64 flips from
      the "in" configuration to the "out" configuration to deliver its proton to the solution. It is possible
      there is a longer proton relay chain present [PMID:15667203].
