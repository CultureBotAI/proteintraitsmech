causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of pyrogallol hydroxytransferase
  description: Stepwise mechanism transcribed from M-CSA entry 146 (10 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +0).
  nodes:
  - node_id: his144
    label: catalytic His144 (M-CSA/PDB numbering; UniProt residue 144)
    node_type: RESIDUE
    grounding: UniProtKB:P80563
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, hydrogen bond donor,
      proton acceptor, proton donor.'
  - node_id: asp174
    label: catalytic Asp174 (M-CSA/PDB numbering; UniProt residue 174)
    node_type: RESIDUE
    grounding: UniProtKB:P80563
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, hydrogen bond donor,
      proton acceptor, proton donor.'
  - node_id: tyr404
    label: catalytic Tyr404 (M-CSA/PDB numbering; UniProt residue 404)
    node_type: RESIDUE
    grounding: UniProtKB:P80563
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, hydrogen bond donor,
      proton acceptor, proton donor.'
  - node_id: reactant0
    label: 1,2,3,5-tetrahydroxybenzene
    node_type: CHEMICAL
    grounding: CHEBI:16746
  - node_id: reactant1
    label: pyrogallol
    node_type: CHEMICAL
    grounding: CHEBI:16164
  - node_id: product0
    label: phloroglucinol
    node_type: CHEMICAL
    grounding: CHEBI:16204
  - node_id: product1
    label: 1,2,3,5-tetrahydroxybenzene
    node_type: CHEMICAL
    grounding: CHEBI:16746
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His144 deprotonates the pyrogallol substrate at the C3-OH position, the activated substrate
      then attacks the molybdenum cofactor in a nucleophilic substitution, resulting in the loss of a
      water molecule from the Mo(VI) coordination sphere.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp174 deprotonates the bound intermediate at the C2-OH position, resulting in a isomerisation
      to form the diquinone form of the substrate, and a two electron reduction of the molybdenum cofactor
      resulting in an Mo(IV) oxidation state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Tyr404 deprotonates the second substrate (1,2,3,5-tetrahydroxybenzene) at the C2-OH position.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The activated 1,2,3,5-tetrahydroxybenzene then attacks the Mo-coordinated intermediate
      in a nucleophilic addition, which is reprotonated from His144 at the C2=O position.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Water deprotonates the C5 position of the original substrate, resulting in double bond
      isomerisation.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Water deprotonates the C5 hydroxyl of the original 1,2,3,5-tetrahydroxybenzene molecule,
      resulting in double bond isomerisations that lead to the protonation of the C2 position of the original
      1,2,3,5-tetrahydroxybenzene molecule from water.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The negatively charged oxygen at the 2 position of the original pyrogallol substrate
      initiates an elimination reaction which produces the diquinone form of 1,2,3,5-tetrahydroxybenzene
      (this is the molecule that was pyrogallol) and the product phloroglucinol from the molecule that
      was 1,2,3,5-tetrahydroxybenzene
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Mo(IV) donates a single electron into the bound quinone, resulting in the protonation
      of the ketone group at the 2 position from Asp174.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Mo(V) donates a second electron to the bound quinone, causing the ketone at the 5 position
      to protonate from Tyr404. The 1,2,3,5-tetrahydroxybenzene is displaced from the molybdenum's coordination
      sphere by water.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: pyrogallol hydroxytransferase catalytic site
    node_type: MOTIF
    grounding: MCSA:146
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: activity
    label: pyrogallol hydroxytransferase activity
    node_type: MOLECULAR_FUNCTION
    xrefs:
