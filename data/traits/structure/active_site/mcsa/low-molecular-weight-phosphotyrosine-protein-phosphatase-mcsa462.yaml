  edges:
  - subject: cys12
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Cys12 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/462/
      snippet: "The mechanism is thought to be primarily dissociative, with more catalytic importance\
        \ placed on stabilising the negative charge on the leaving group, rather than activation of the\
        \ nucleophile. Phosphoryl transfer occurs in a single step, with an inline displacement mechanism.\
        \  <ol>
<li>Ser 20 hydrogen bonds to Cys 13, lowering Cys 13's pKa and stabilising a thiolate\
        \ anion on this residue.</li>
<li>Asp 132 is protonated, and acts as a general acid to protonate\
        \ the substrate tyrosine residue, promoting phosphoryl transfer.</li>
<li>The trigonal bipyramid\
        \ transition state is stabilised by Arg 19.</li>
<li>Cys 13 becomes phosphorylated. The substrate\
        \ is released and water enters the active site.</li>
<li>Asp 132 activates the water molecule\
        \ by hydrogen bonding.</li>
<li>During phosphoryl transfer, Ser 19 stabilises the growing negative\
        \ charge on the thiolate of Cys 12. Arg 18 again stabilises the transition state.</li>
<li>Inorganic\
        \ phosphate is formed, with Asp 129 deprotonating the nucleophilic water to regenerate its protonated\
        \ state.</li>
</ol>
There is computational evidence that suggests that, for low molecular\
        \ weight PTPs, Cys 12 is protonated in the ground state, and transfers its proton to the phosphoryl\
        \ group (i.e. substrate assisted catalysis) before nucleophilic attack."
      notes: M-CSA entry 462, mechanism 2; M-CSA cites PMID:10409830, PMID:10684639, PMID:12882518, PMID:17975835,
        PMID:21988196, PMID:27676368, PMID:8132604, PMID:8993313; step 1
