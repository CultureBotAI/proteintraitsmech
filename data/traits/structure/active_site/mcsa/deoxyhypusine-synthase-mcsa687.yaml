    label: mechanism step 4
    node_type: STATE
    description: The lysine residue from eIF5A to be modified then attacks as a nucleophile on the carbon
      of the C=N bond. The double bond will then accept a proton from the eIF5A lysine.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The secondary amine produced initiates an elimination which releases Lys329 which when
      released will accept a proton from the substrate nitrogen.
  - node_id: step6
