    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/482/
      snippet: DGD is an unusual PLP dependent enzyme in that it catalyses both decarboxylation and transamination
        reactions in its ping pong catalytic cycle. The first half reaction is an oxidative decarboxylation.
        The external aldimime is formed by a transamination reaction where the substrate alpha amino group
        displaces the E-amino group of Lys272. This intermediate is activated towards decarboxylation
        through interactions with Arg406 and Glu210 which hold the external aldimine is an orientation
        which maximises overlap between the pi orbitals of the conjugated system, stabilising the transition
        state and therefore accelerating the rate of bond cleavage.  Loss of carbon dioxide gives the
        quinoid, which on protonation of C(4) forms a ketimine intermediate. This is hydrolysed, resulting
        in the pyridoxamine form of DGD (DGD-PMP) and a ketone. The catalytic cycle is then completed
        by a classical transamination half-reaction between DGD-PMP and an alpha keto-acid, preferably
        pyruvate regenerating the aldehyde form of the coenzyme and giving an L-amino acid product.
      notes: M-CSA entry 482, mechanism 1; M-CSA cites PMID:10556038, PMID:16342932, PMID:20540501, PMID:25500286,
        PMID:7799433, PMID:8342040, PMID:9890912; step 1
