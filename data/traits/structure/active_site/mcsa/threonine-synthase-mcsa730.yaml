    label: catalytic Lys124 (M-CSA/PDB numbering; UniProt residue 124)
    node_type: RESIDUE
    grounding: UniProtKB:P16120
    description: 'M-CSA roles: covalently attached, electron pair acceptor, electron pair donor, increase
      nucleophilicity, nucleofuge, nucleophile, proton acceptor, proton donor, proton relay.'
  - node_id: reactant0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: reactant1
    label: O-phosphonato-L-homoserine(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57590
  - node_id: product0
    label: L-threonine zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:57926
  - node_id: product1
    label: hydrogenphosphate
    node_type: CHEMICAL
    grounding: CHEBI:43474
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amino group of the serine  performs a nucleophilic attack on the imine carbon of
      the lys-bound PLP forming a tetrahedral intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys124 is cleaved from PLP leaving the substrate bound.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys124 abstracts a proton from the alpha carbon of the substrate causing  tautomerization
      of the imine.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lys124 abstracts a proton from the beta carbon causing a second tautomerization from
      imine to enamine.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Phosphate is eliminated from the homoserine and another imine is formed.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Lys124 acts as a proton relay causing another tautomerization reaction to occur.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Water performs a nucleophilic attack on the C=C bond of the substrate, forming a carboanion.  The
      water is activated by Lys124.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The carboanion abstracts a proton from Lys124.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The amino group of Lys124 performs a nucleophilic attack on the imine carbon of the thr-bound
      PLP forming a tetrahedral intermediate.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Threonine is cleaved from PLP leaving Lys124 bound.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: threonine synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:730
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
