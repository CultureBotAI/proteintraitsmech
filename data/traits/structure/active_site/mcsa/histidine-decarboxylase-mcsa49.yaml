    label: mechanism step 1
    node_type: STATE
    description: The C-terminal serine deprotonates the amine of the substrate, which attacked the terminal
      carbonyl carbon of the PTM pyruvoyl residue in the first step of a Schiff base formation. The oxyanion
      deprotonates Tyr62.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Tyr62 deprotonates the newly formed secondary amine, which causes the elimination of
      water with concomitant deprotonation of the C-terminal serine residue, forming the Schiff base.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The intermediate undergoes decarboxylation, with double bond rearrangement in which the
      pyruvoyl moiety acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion formed initiates double bond rearrangement that results in the deprotonation
      of Glu197F at the CA position of the covalently attached histamine.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The C-terminal serine residue deprotonates water, which in turn attacks the imine carbon
      in a nucleophilic addition, the nitrogen deprotonates Tyr62.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Tyr62 deprotonates the hydroxyl group of the pyruvoyl residue, which eliminated the histamine
      substrate with concomitant deprotonation of the C-terminal residue.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Glu197F deprotonates water in an inferred step.
