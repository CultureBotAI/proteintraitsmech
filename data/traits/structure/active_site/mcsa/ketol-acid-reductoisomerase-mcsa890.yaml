  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: A magnesium activated water molecule abstracts the proton from the alcohol, initiating
      a 1,2-alkyl shift with concomitant deprotonation of the conserved Lys252 residue.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: NADPH eliminates a hydride ion, that is added to the newly formed carbonyl group, which
      in turn abstracts the proton from the magnesium bound water molecule, regenerating the bound hydroxide
      ion.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: In an inferred return step, water donates a proton to the lysine to regenerate the enzyme's
      active site.
  - node_id: step4
