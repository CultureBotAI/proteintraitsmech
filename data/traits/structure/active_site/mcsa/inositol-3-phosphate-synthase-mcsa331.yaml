  - node_id: reactant0
    label: D-glucopyranose 6-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:61548
  - node_id: product0
    label: 1D-myo-inositol 3-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:58401
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The substrate is oxidised at the C5' by NAD+, with direct hydride transfer from C5 to
      C4 of the nicotinamide ring in concert with proton loss from the C5' hydroxyl group of D-glucose-6-phosphate.
      This proton is transferred to the Lys369 side chain.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The pro-R hydrogen of C6 is eliminated. Evidence from crystallographic data suggests
      the phosphate-mono ester acts as the base in the enolisation step. The developing negative charge
      on the enolate oxygen is stabilised by two lysine residues, Lys369 and Lys489.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: In this aldol condensation step either the monophosphate or Lys412 acts as a general
      acid to O1 in the cyclisation step. The side chain of Lys373 is thought to aid in stabilising the
      O1 negative charge [PMID:14684747].
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The last mechanistic step is reduction by NADPH. The hydride that was transferred in
      the first step is returned to the C5 position of the intermediate myo-2-inose 1-phosphate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The active site is regenerated on protonation.
  - node_id: step6
    label: mechanism step 6
