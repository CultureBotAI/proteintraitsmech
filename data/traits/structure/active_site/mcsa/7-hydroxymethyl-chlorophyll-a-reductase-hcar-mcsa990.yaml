  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp237 protonates the OH group on the 7-hydroxychlorophyll a (HMChl). This causes a water
      molecule to leave HMChl. The substrate then goes through bond rearrangement and creates a double
      bond towards the carbon atom that lost its hydroxyl group to stabilise the molecule.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ferrodoxin donates a electron to the 4Fe-4S molecules which relay them to FAD. This process
      is stabilised by Gln332 and Glu262. The protonation from the bulk solvent is inferred.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Ferrodoxin donates a second electron which is used to fully reduce FAD. Another proton
      from solution is used to stabilise the negative charge.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The electrons gained by FAD are given to the chlorophyll substrate in the form of a hydride
      transfer. Asp237 is regenerated to its protonated state. The chlorophyll substrate undergoes some
      bond rearrangements to stabilise the added electrons.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Final product.
