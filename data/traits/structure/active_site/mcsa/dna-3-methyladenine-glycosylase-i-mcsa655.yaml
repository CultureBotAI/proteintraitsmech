    object: step1
    description: Tyr16 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/655/
      snippet: The reaction proceeds via hydrolysis of the glycosidic bond by nucleophilic attack on C1'
        of the ribose sugar, freeing the base from the sugar phosphate backbone. As the breaking of the
        glycosidic bond results in a negative charge developing on the N9 of the base, the transition
        state is overall neutral on the base. This distorts the structure of the base sufficiently so
        that hydrogen bonds between Glu38 and the N6 and N7 of 3mA become optimal, as do bonds between
        Tyr 16 and N1. Moreover, the distance between the base and Trp 46 becomes optimal for van der
        waal's forces. This stabilisation of the transition state means that the glycosidic bond is weakened,
        so hydrolysis is enhanced.
