  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: There is intramolecular proton transfer within the cofactor, resulting in an ylide being
      formed.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carboanion of the ylide performs a nucleophilic attack on the carbonyl carbon resulting
      in an oxyanion intermediate being formed.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion accepts a proton from His70, which accepts a proton from Glu28 in a proton
      relay.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Carbon dioxide is eliminated from the intermediate, with TDP acting as an electron sink.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: TDP initiates a double bond rearrangement which results in an intramolecular proton transfer
      within the intermediate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The hydroxyl oxygen is deprotonated by the Glu28/His70 proton relay system, resulting
      in the formation of another oxyanion.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The imine nitrogen of the cofactor  then accepts a proton from the relay system.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The collapse of the oxyanion leads to the elimination of TDP and the formation of the
      product.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The cofactor is regenerated in its native state via an intramolecular proton transfer.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products.
