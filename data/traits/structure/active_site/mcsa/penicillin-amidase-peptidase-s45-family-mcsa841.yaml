    grounding: CHEBI:29067
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Ser 290 N-terminus deprotonates its own hydroxyl group which activates it to nucleophilically
      attack the carbonyl group of the amide bond of penicillin.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage of the amide bond
      and the N-terminal product accepts a proton from the N-terminus of Ser290.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The N-terminus of Ser290 abstracts a proton from a water molecule which activates it
      to nucleophilically attack the carbon of the carbonyl group.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage acyl-enzyme bond
      which releases Ser290 which then accepts a proton from  its N-terminus and thus returns the active
      site to its native state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
