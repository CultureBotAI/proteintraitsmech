    node_type: CHEMICAL
    grounding: CHEBI:58121
  - node_id: product0
    label: (2S)-2-hydroxy-3-oxobutyl phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:58830
  - node_id: product1
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: product2
    label: formate
    node_type: CHEMICAL
    grounding: CHEBI:15740
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The mechanism starts with  enolisation, with Glu 174 acting as a general base catalyst
      in concert with His 136 (stabilised by Asp 99) acting as a general acid catalyst.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The enolate collapses, in a dehydration reaction facilitated by Cys66 which acts as a
      general acid catalysis.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: There is a second tautomerization reaction from enol to ketone. This is facilitated by
      Glu174 acting as a general acid in concert with His136 acting as a general base.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: There is a 1,2 skeleton shift facilitated by the Asp41 deprotonating the C4 hydroxyl.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A water activated by one of the Mn ions performs a nucleophilic attack on the  C3 carbonyl
      forming a tetrahedral intermediate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His136 donates a proton to the C2 carbonyl this results in formate being eliminated and
      the enolate of 3,4-dihydroxy-2-butanone-4-phosphate being produced.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Loss of the formate results in a shift in coordination which allows a water molecule
      associated to both Mn ions to act as a proton donor in concert with Glu 174 acting as a general
      base catalyst to facilitate a final tautomerization reaction which generates the final product.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
