    label: 3,4-dihydroxy-2-butanone-4-phosphate synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:683
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
