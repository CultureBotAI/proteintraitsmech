    label: catalytic Cys42 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00392
    description: 'M-CSA roles: activator, covalently attached, hydrogen bond acceptor, metal ligand, nucleofuge,
      nucleophile, proton acceptor, proton donor.'
  - node_id: cys47
    label: catalytic Cys47 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00392
    description: 'M-CSA roles: activator, electrofuge, electrophile, metal ligand, nucleofuge, nucleophile,
      polar interaction.'
  - node_id: cys464
    label: catalytic Cys464 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00392
    description: 'M-CSA roles: activator, electrostatic stabiliser, metal ligand, nucleofuge, nucleophile,
      proton acceptor, proton donor.'
  - node_id: cys465
    label: catalytic Cys465 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P00392
    description: 'M-CSA roles: activator, covalently attached, electrostatic stabiliser, hydrogen bond
      acceptor, metal ligand, nucleofuge, nucleophile, proton acceptor, proton donor.'
  - node_id: reactant0
    label: mercury(2+)
    node_type: CHEMICAL
    grounding: CHEBI:16793
  - node_id: reactant1
    label: NADPH(4-)
    node_type: CHEMICAL
    grounding: CHEBI:57783
  - node_id: product0
    label: mercury(0)
    node_type: CHEMICAL
    grounding: CHEBI:16170
  - node_id: product1
    label: NADP(3-)
    node_type: CHEMICAL
    grounding: CHEBI:58349
  - node_id: product2
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The catalytic centre is activated towards its function in the presence of NADPH. The
      group reduces a disulfide bond between Cys141 and Cys136, forming the dithiol species which is necessary
      for catalysis to occur. A charge transfer complex exists between the FAD cofactor and Cys141 [DOI:10.1021/ar00177a006].
      The two N terminal Cys residues (Cys11/Cys14) form part of a soft-metal binding domain. Th
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The thiolate anion formed on the substrate acts as a base towards the protonated Cys11.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The adjacent sulfur of Cys14 acts as a nucleophile towards the mercury-enzyme adduct.
      This releases the mercury free thiol-thiolate molecule with concomitant formation of a bridged thio-mercury
      enzyme complex.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The charged sulfur of the eliminated group removes a proton from the positively charged
      mercury-cysteine adduct. The dithiol equivalent of the substrate is released.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The mercury metal is transferred from the N terminal binding site to a thiol pair situated
      more closely within the active site [PMID:16114877]. Cys559AA acts as a nucleophile towards the
      Hg(II) metal, displacing it from the metal binding motif.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The Cys11 thiolate now acts as a base towards the positively charged Cys559AA, regenerating
      one of the soft-metal binding motif thiols.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Cys558AA now attacks the mercury, forming a sulfide-mercury link while eliminating the
      Cys14 thiolate.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The thiolate form of Cys14 abstracts a proton from the positively charged sulfur of Cys558AA.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Cys136 acts as a nucleophile towards the close proximity mercury-thiol adduct, forming
      another metal-ligand bridging intermediate.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The resulting positively charged sulfur is deprotonated by Cys559AA
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Cys141 displaces Cys558AA within the metal coordination sphere.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The NADPH substrate transfers a hydride to the FAD cofactor.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: The FAD cofactor now attacks the mercury centre, eliminating Cys136 and forming a carbon-mercury
      intermediate.
  - node_id: step14
    label: mechanism step 14
    node_type: STATE
    description: Cys136 abstracts a proton from the flavin-mercury adduct, initiating a reductive elimination
      of the mercury metal and thiolate Cys141.
  - node_id: step15
    label: mechanism step 15
    node_type: STATE
    description: The active site is regenerated when Cys558AA is reprotonated. In this inferred return
      step, the identiy of the proton donor is not clear.
  - node_id: step16
    label: mechanism step 16
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: mercury(II) reductase catalytic site
    node_type: MOTIF
    grounding: MCSA:277
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.50.50.60 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.50.50.60
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
