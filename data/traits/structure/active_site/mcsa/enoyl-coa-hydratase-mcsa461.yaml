    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/461/
      snippet: "The water residue is activated as a nucleophile by the side chains of Asp 193 and His\
        \ 198 (both are deprotonated, and coordinate the protons on water, with the carbonyl of Ile 213\
        \ reducing the pKa of His 198).   
<br/><br/>
A lone pair on water attacks C3 of the enoyl\
        \ substrate (the electrophilic alkene). The reaction is proposed to have a concerted transition\
        \ state, where the water proton coordinated to His 813 is delivered to C2 of the substrate, and\
        \ the bond between that proton and the oxygen of water begins to break.  
<br/><br/>
