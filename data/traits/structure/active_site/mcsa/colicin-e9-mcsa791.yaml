  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His551 activates a water molecule allowing the water  to perform a nucleophilic attack
      on the scissile phosphate group. This leads to a penta-covalent intermediate being formed which
      is stabilized by Arg453. After this has occurred a second water molecule replaces His579 in its
      coordination to the Zn ion.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The second water molecule is activated by the Zn ion allowing it to transfer a proton
      to the 3' hydroxyl leaving group. This proton transfer facilitates the collapse of the intermediate
      and the formation of the products.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: In this inferred reaction step His551 donates a proton to the hydroxide ion to regenerate
      the active site.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Products.
  - node_id: active_site
