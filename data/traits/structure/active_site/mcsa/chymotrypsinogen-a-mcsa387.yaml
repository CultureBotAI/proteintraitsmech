      snippet: "The general mechanism for chymotrypsin is the classic serine protease mechanism.   
\
        <br/><br/>
Hydrolytic proteolysis by alpha-chymotrypsin begins with initial nucleophilic attack\
        \ on the peptide bond by Ser 195, activated by deprotonation by His 57. This leads to the formation\
        \ of a tetrahedral intermediate, stabilised by the amide groups of Ser 195 and Gly 193. Subsequent\
        \ collapse of this intermediate, assisted by protonation of the leaving group by His 57 and Asp\
        \ 102 leads to an acyl enzyme intermediate. Activation of a water molecule by His 57 and Asp 102\
        \ facilitates hydrolysis of this intermediate, resulting in the reformation of the catalytically\
