  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu687 deprotonates water which activates water to attack the carbonyl of the peptide
      bond by nucleophilc addition. This results in the coordination of the oxyanion to Zinc. Tyr728 and
      Zn interaction with the negatively charged oxygen of the carbonyl serves as an oxyanion hole which
      stabilises the transition state.
