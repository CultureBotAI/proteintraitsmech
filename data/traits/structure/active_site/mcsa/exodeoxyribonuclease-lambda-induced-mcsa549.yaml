    object: step1
    description: Lys83 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/549/
      snippet: There are several proposed mechanisms for the action of 5'-3' exonuclease, taking into
        account many possible mechanisms involving up to three catalytic divalent metal ions.  The most
        accepted mechanism implies the involvement of two catalytic Mg(2+) ions. A water molecule is deprotonated
        by the conserved basic Lys 83, which remains deprotonated at pH 6 through interactions with a
        positively charged dicationic metal and the positively charged guanidinium group of Arg 86 (also
        a conserved residue). This water molecule then acts as a nucleophile towards the scissile phosphate.
        The pentavalent intermediate is stabilised by a second dicationic Mg while the scissile phosphate
        oxygen is coordinated to both metal centres. The collapse of the intermediate and reprotonation
        of the 3' leaving group from the Lys 83 gives the hydrolysis products.  Crystallographic evidence
        suggests a two-metal-ion catalytic process in homologous enzymes, although this pdb doesn't show
        the Mg atoms implicated. Later kinetic evidence suggests the presence of three metal cations is
        necessary. It has also been proposed on evidence from mutagenesis reactions that the endo- and
        exonucleolytic cleavage mechanisms are distinct.
      notes: M-CSA entry 549, mechanism 1; M-CSA cites PMID:12606565, PMID:15077103, PMID:16600865, PMID:18697748,
        PMID:21734257, PMID:26884332, PMID:27273516, PMID:27526030, PMID:9874768; step 1
