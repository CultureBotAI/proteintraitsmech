    label: mechanism step 1
    node_type: STATE
    description: His102 deprotonates the 7 position methyl group of the first substrate molecule in an
      initial activation step.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Cys48 initiates a nucleophilic attack on the second substrate in an addition reaction
      with the concomitant deprotonation of solvent water.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion of the first activated substrate collapses, initiating a nucleophilic attack
      on the second activate substrate with concomitant deprotonation of His102.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: His102 deprotonates the intermediate, initiating a double bond rearrangement, re-forming
      the oxyanion.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The intermediate tautomerises.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Water deprotonates the amine with concomitant double bond rearrangement which initiates
      a nucleophilic attack on the carbon to which the Cys48 is covalently attached in a substitution
      reaction.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The oxyanion collapses, initiating double bond rearrangement that results in the cleavage
      of the C-N bond in an intramolecular elimination with concomitant deprotonation of His102.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Cys48 deprotonates the ring CH<sub>2</sub> group, initiating an elimination reaction,
      which liberates the reaction products.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: This step probably occurs in a concerted manner with step 8 (shown separately for clarity).
      The riboflavin product deprotonates Cys48 to regenerate the active site and produce the final product.
