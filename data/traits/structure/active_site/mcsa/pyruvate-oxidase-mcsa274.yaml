  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The TTP cofactor adopts the V configuration which brings the 4 imino group of the aminopyrimidine
      ring close to the C2 carbon of the thiazolium ring [PMID:16680160]. Hydrogen bonding of the carboxylate
      group from Glu59' to N1' of the aminopyrimidine ring increases the basic nature of the 4' position
      by stabilising the 4'-imino tautomeric form, allowing the group to deprotonate the C1 position of
      t
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbanion of thiamine diphosphate initiates a nucleophilic attack on the carbonyl
      carbon of pyruvate in an addition reaction. The conjugated double bond system of the cofactor undergoes
      rearrangement which results in the deprotonation of Glu59'. The 4' enamine tautomer is favoured
      by the formation of a strong hydrogen bond between the side chain carbonyl group of Glu59' and the
      N1 hydrogen.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The covalently bound pyruvate undergoes decarboxylation.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A single electron is transferred from the high energy thamine diphosphate enamine intermediate
      to the FAD, resulting in bond order rearrangement and deprotonation of the alcohol group present
      on the intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Tautomerisation of the resulting radical intermediate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The thiamine ring nitrogen acts as an electron sink in the formation of the radical tautomer.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Phosphate attacks the kinetically stable anion radical adduct. Kinetics experiments have
      shown the presence of phosphate to enhance the rate of electron transfer [PMID:19476487]. The negative
      charge resulting from the nucleophilic attack by phosphate is thought to reduce the potential of
      the intermediate and therefore increase the driving force of the following electron transfer to
      FAD.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The high energy phosphate radical delivers a second reducing equivalent to the FAD semiquinone.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Prior to this step there is a rearrangement of electrons in the TPP-substrate adduct
      which results in a negative charge on the oxygen atom. The tetrahedral anion intermediate collapses.
      This forms the high energy metabolite acetyl-phosphate.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The FAD diradical transfers one of its electrons to dioxygen with subsequent loss of
      a single proton.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The FADH transfers the second radical and proton to the dioxygen to regenerate the FAD
      cofactor and hydrogen peroxide.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The C2 atom of the thamine ring is exposed to the solvent. Reprotonation of the anion
      regenerates the TPP cofactor.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: pyruvate oxidase catalytic site
    node_type: MOTIF
    grounding: MCSA:274
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
