      the FAD cofactor [PMID:19438211].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The anionic Cys178A attacks the C4 position of FAD, initiating protonation of the N5
      position.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The Cys350 dithiolate acts as a nucleophile towards the enzyme cofactor adduct, forming
      a three centre sulfur intermediate and the reduced form of FAD. The steric bulk brought about by
      the presence of an elongated sulfur chain attached Cys350A directs the anionic Cys178A towards nucleophilic
      attack at Cys350A, reforming the active site disulfide bridge.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: 'Ubiquinone, the physiological electron acceptor accepts a hydride from reduced FAD,
