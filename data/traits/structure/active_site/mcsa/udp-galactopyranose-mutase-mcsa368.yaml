  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The lone pair of electrons present on the reduced FAD attack the anomeric carbon, forming
      a substrate-cofactor covalent complex.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The FAD N5 atom uses electron density accumulating from the cleavage of the N-H bond
      to initiate an internal elimination reaction, resulting in the cleavage of the sugar ring while
      covalently attached to the cofactor. The rearrangements of protonation states have been inferred.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The opened ring now undergoes a five exo-tet cyclisation reaction with the C4-OH, which
      is enthalpically more favourable to the six exo-tet attack, which would give the original six-membered
      ring. The rearrangements of protonation states have been inferred.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The phosphate group then attacks the intermediate anomeric carbon to eliminate the FAD
      cofactor and generate the final product.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products
