  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The thiosulphate is brought in and stabilised by Arg109 and Arg119 through their positively
      charged side chains. The negative sulphur from the thiosulphate donates its electrons to form a
      S-S bond between itself and the Cys123. The Cys123 relays the electrons it gained to the heme 1
      iron reducing it to Fe(II) while forming a bond with thiosulphate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The iron atoms in the heme molecules are regenerated to Fe(III) by transferring electrons
      further down the enzyme.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The second thiosulphate is brought in to react with the S-S bond between Cys123 and the
      first thiosulphate. This causes the two thiosulphates to form tetrathionate and Cys123 to become
      negatively charged and coordinate the iron atom of the same heme molecule again.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Final step.
  - node_id: active_site
    label: Thiosulfate dehydrogenase catalytic site
    node_type: MOTIF
    grounding: MCSA:986
