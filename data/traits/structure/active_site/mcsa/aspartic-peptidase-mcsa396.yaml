    label: mechanism step 1
    node_type: STATE
    description: Asp215 deprotonates the catalytic water molecule, which performs a nucleophilic attack
      to the carbonyl carbon of the scissile peptide bond. Simultaneously, Asp32 protonates the carbonyl
      oxygen of the scissile peptide bond, generating a gem-diol intermediate. This molecule possesses
      two hydroxyl groups bound to the carbon atom of the scissile peptide bond.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Asp215 (protonated in the previous step) protonates the amide nitrogen of the scissile
      peptide bond, which is simultaneously and progressively weakened and elongated.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Asp32 deprotonates the hydroxyl group of the second intermediate, concomitantly with
      deprotonation of the other hydroxyl group by the Asp215 residue.
