    label: dUMP(2-)
    node_type: CHEMICAL
    grounding: CHEBI:246422
  - node_id: reactant1
    label: (6R)-5,10-methylenetetrahydrofolate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:15636
  - node_id: product0
    label: dTMP(2-)
    node_type: CHEMICAL
    grounding: CHEBI:63528
