    node_type: CHEMICAL
    grounding: CHEBI:57451
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The methylenetetrahydrofolate undergoes decyclisation, the secondary amine released deprotonates
      Tyr146.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Cys198 initiates a nucleophilic attack on the ene carbon of dUMP in a Michael (1,4) addition
      reaction. The oxyanion formed deprotonates water, which in turn deprotonates Glu60.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Glu60 deprotonates water, which deprotonates the hydroxyl group, which initiates a nucleophilic
      attack upon the activated methylenetetrahydrofolate at the CH<sub>2</sub>=N carbon.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Tyr146 deprotonates water, which deprotonates the carbon newly connected to the methylenetetrahydrofolate.
      This causes the formation of a C=C and the oxyanion formed deprotonates water, which in turn deprotonates
      Glu60.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Glu60 deprotonates water, which deprotonates the hydroxyl group, eliminating the negatively
      charged dihydrofolate.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The negatively charged nitrogen of dihydrofolate eliminates a hydride ion, which adds
      to the CH<sub>2</sub>=C group of the covalently attached methyl-dUMP, causing the elimination of
      Cys198.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: thymidylate synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:31
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.30.572.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.30.572.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: thymidylate synthase activity
    node_type: MOLECULAR_FUNCTION
