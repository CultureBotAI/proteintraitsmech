    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: This PLP-dependent reaction proceeds via a ping-pong mechanism that requires two half-reactions
      to complete one cycle of transamination. In the first half-reaction the catalytic lysine is displaced
      from the PLP-cofactor by the ornithine substrate. This substrate is then deamminated to form the
      L-glutamate-gamma-semialdehyde. In the second half-reaction, the 2-oxoglutarate enters the active
      site an
