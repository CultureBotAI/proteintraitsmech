  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His207 deprotonates the alkyl peroxide, which then coordinates to the Fe(III) centre
      of the haem cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The peroxo bond collapses, donating two electrons to the Fe(III) centre, which immediately
      shuttles one into the porphyrin ring, creating Fe(IV). The liberated alkoxide deprotonates His207
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The porphyrin radical abstracts a hydrogen from Tyr385.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Tyr385 abstracts a hydrogen from the arachidonic acid, initiating double bond rearrangement.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The carbon radical initiates a homolytic attack on a dioxygen molecule in an addition
      reaction.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The oxygen radical initiates a homolytic attack on the carbon chain, forming a four-membered
      ring in an addition reaction. This initiates a second homolytic attack, through double bond rearrangement,
      which causes the formation of a five-membered carbon rind, and initiates homolytic attack on a second
      dioxygen molecule in an addition reaction.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The oxygen radical of the peroxo group abstracts a hydrogen from Tyr385.
  - node_id: step8
    label: mechanism step 8
