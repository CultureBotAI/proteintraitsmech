  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu86 deprotonates His143, which deprotonates Lys170, activating it.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys170 attacks the carbonyl carbon of the substrate in a nucleophilic addition.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: A proton is transferred from the covalently attached lysine to the newly formed hydroxide.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lys170 initiates an elimination of water (which obtains its proton from His143, which
      deprotonates Glu86) forming the Schiff base intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Glu86 deprotonates His143, which deprotonates the intermediate at the carbon adjacent
      to the covalently bound lysine which acts as an electron sink.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Lys170 donates its lone pair of electrons back into the ring, initiating a double bond
      rearrangement and elimination of water, which obtains its proton from His143, which deprotonates
      Glu86.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Glu86 deprotonates His143, which deprotonates water, which then attacks the carbon to
      which Lys170 is covalently attached.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Lys170 deprotonates the hydroxide, which causes Lys170 to be eliminated and the product
      to be formed.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Lys170 deprotonates His143, which deprotonates Glu86 in an inferred step that returns
      the enzyme to its starting state.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products
