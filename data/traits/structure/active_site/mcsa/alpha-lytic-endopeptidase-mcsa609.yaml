    label: mechanism step 3
    node_type: STATE
    description: His235 abstracts a proton from a water which activates it to attack the carbon of the
      acylenzyme, forming a second tetrahedral intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: This intermediate collapses, expelling Ser 342 as the leaving group, assisted by the
