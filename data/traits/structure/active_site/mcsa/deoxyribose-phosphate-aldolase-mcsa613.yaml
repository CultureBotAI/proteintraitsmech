    description: 'M-CSA roles: increase nucleophilicity, proton acceptor, proton donor, proton relay.'
  - node_id: lys167
    label: catalytic Lys167 (M-CSA/PDB numbering; UniProt residue 167)
    node_type: RESIDUE
    grounding: UniProtKB:P0A6L0
    description: 'M-CSA roles: covalently attached, electron pair acceptor, electron pair donor, nucleofuge,
      nucleophile, proton acceptor, proton donor.'
  - node_id: lys201
    label: catalytic Lys201 (M-CSA/PDB numbering; UniProt residue 201)
    node_type: RESIDUE
    grounding: UniProtKB:P0A6L0
    description: 'M-CSA roles: increase nucleophilicity, proton acceptor, proton donor, proton relay.'
  - node_id: reactant0
    label: acetaldehyde
    node_type: CHEMICAL
    grounding: CHEBI:15343
  - node_id: reactant1
    label: D-glyceraldehyde 3-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:59776
  - node_id: product0
    label: 2-deoxy-D-ribose 5-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57651
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp102 deprotonates Lys167, this activates the amine group for nucleophilic attack on
      the carbonyl carbon of acetaldehyde, forming a tetrahedral intermediate. The carbonyl oxygen is
      protonated by Lys201 via a water molecule .
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Water is eliminated and a Schiff base intermediate is formed. This elimination is aided
      by general acid/base catalysis from Asp102 and  Lys201.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The schiff base tautomerizes via acid/base catalysis to form a nucleophilic C=C bond.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The C=C bond performs a nucleophilic attack upon the carbonyl carbon of  the glyceraldehyde
      3-phosphate in an aldol addition. Which is again assisted by acid/base catalysis.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A hydrolytic water performs a nucleophilic attack upon the the schiff base, forming a
      tetrahedral intermediate. The water is activated by deprotonation from Lys201.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Lys167 is cleaved from the substrate forming the product and regenerating the enzyme
      in its native state.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: deoxyribose-phosphate aldolase catalytic site
    node_type: MOTIF
    grounding: MCSA:613
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.20.20.70 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.20.20.70
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
