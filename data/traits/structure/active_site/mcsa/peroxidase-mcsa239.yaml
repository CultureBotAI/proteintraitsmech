    node_type: RESIDUE
    grounding: UniProtKB:P00433
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor, increase acidity, increase
      basicity.'
  - node_id: his170
    label: catalytic His170 (M-CSA/PDB numbering; UniProt residue 200)
    node_type: RESIDUE
    grounding: UniProtKB:P00433
    description: 'M-CSA roles: metal ligand.'
  - node_id: reactant0
    label: hydrogen peroxide
    node_type: CHEMICAL
    grounding: CHEBI:16240
  - node_id: reactant1
    label: phenol
    node_type: CHEMICAL
    grounding: CHEBI:15882
  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: phenolic radical
    node_type: CHEMICAL
    grounding: CHEBI:137811
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His42 deprotonates a water molecule which deprotonates hydrogen peroxide. The resulting
      anion coordinates to the Fe(III) centre of Hem350, displacing water and forming Cpd0.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The O-O bond of Cpd0 undergoes heterolytic cleavage and the resulting hydroxide is protonated
      by His42. The porphryin ring and Fe(III) donate an electron each to the oxygen bound to the metal.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His42 deprotonates water, which then deprotonates the phenolic derivative substrate.
      The phenolate transfers an electron to the porphyrin ring, forming a phenolic radical and Cpd1.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxygen of Cpd1 is protonated by water, which is in turn protonated by His42.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The porphyrin ring transfers an electron to the Fe(IV) centre to give an isomer of Cpd1.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Arg38 transfers a proton to the oxygen of Cpd1.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: "Upon binding of the second phenol derivative, Arg38 deprotonates Cpd2.

The doubly-protonated\
      \ form of Cpd2 is less stable in the presence of the phenol derivative than in the presence of the\
      \ phenolic radical. Therefore when the phenolic radical product dissociates and the phenolic derivative\
      \ substrate associates, there is proton transfer to form the more stable isomer of Cpd2."
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: His42 deprotonates water, which then deprotonates the phenolic derivative substrate.
      The phenolate transfers an electron to the porphyrin ring radical, forming a phenolic radical.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The metal-bound hydroxide is protonated by water, which is in turn protonated by His42.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: peroxidase catalytic site
    node_type: MOTIF
    grounding: MCSA:239
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
