  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: FMNH2 undergoes a double bond rearrangement which results in the single electron transfer
      to a dioxygen molecule which results in the homolysis of a bond and production of a superoxide radical.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The radical species produced colligate to form the FMN-peroxo adduct. The generation
      of the excited C4a-peroxyflavin emitter originates from the fission of the O-O bond of an intermediate
      along the reaction mechanism. The intermediate formed in this step can undergo a competing dark
      decay via the scission of the C4a-O bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The peroxo intermediate nucleophilically attacks the carbonyl carbon of the aldehyde
      substrate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The flavin C(4a)-peroxyhemiacetal adduct decomposes resulting in the production of dioxirane
      and the excited state of the C(4a)-hydroxyflavin intermediate which when that decays to ground state
      will emit blue-green light.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The FMN-bound hydroxyl group initiates an intramolecular elimination of water, generating
      the product FMN.
  - node_id: step6
