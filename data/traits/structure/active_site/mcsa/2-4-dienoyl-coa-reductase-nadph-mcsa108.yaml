    label: mechanism step 1
    node_type: STATE
    description: "NADP eliminates a hydride ion, which is added to FAD. 
The nicotinamide ring of NADP\
      \ interacts with the re-face of the isoalloxazine ring, resulting in fully reduced FAD [PMID:12840019]."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: FAD transfers a single electron, through Gln339 and an iron-sulfur cluster, to FMN, which
      deprotonates water.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Water deprotonates FAD, which initiates a second single electron transfer, through Gln339
      and an iron-sulfur cluster, to FMN. This regenerates the FAD cofactor, and produces fully reduced
      FMN.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: FMN eliminates a hydride ion, which is added to the C5 of the substrate. This initiates
      double bond rearrangement, resulting in an oxyanion on the C1.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The oxyanion collapses, initiating double bond rearrangement, the C4 of the intermediate
      deprotonates Tyr166.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Tyr166 deprotonates water in an inferred return step.
