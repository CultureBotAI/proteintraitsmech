  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: In the first step of the initial transaldimination reaction the substrate tyrosine initiates
      a nucleophilic attack on the PLP cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: In the final step of the transaldimination Lys257 is eliminated from the PLP cofactor.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys257 abstracts a proton from the covalently bound intermediate, which initiates a double
      bond rearrangement in which PLP acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A highly unstable quinoid species is formed by deprotonation of Tyr71B.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The PLP cofactor initiates a double bond rearrangement that results in the elimination
      of the phenol group.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Tyr71B abstracts a proton from Lys257A, activating it for the reverse transaldimination
      reaction.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Lys257A initiates a nucleophilic attack on the PLP cofactor in the first step of the
      final transaldimination reaction.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Lys257A eliminates the 2-aminoprop-2-enoate enzyme product.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: It is likely that the rest of the mechanism occurs outside of the active site. The product
      undergoes tautomerisation.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Water initiates a nucleophilic attack on the imine carbon.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The final products are formed by an intramolecular elimination.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: Products
  - node_id: active_site
    label: tyrosine phenol-lyase catalytic site
    node_type: MOTIF
    grounding: MCSA:933
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.640.10 superfamily fold
