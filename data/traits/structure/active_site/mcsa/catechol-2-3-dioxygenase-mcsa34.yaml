    node_type: CHEMICAL
    grounding: CHEBI:17236
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The leaving hydroxide ion deprotonates the catechol, which binds to the Fe(II) centre
      in a substitution reaction.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Iron donates an electron to the oxygen substrate, which becomes a ligand of the iron
      in a redox reaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His199 deprotonates the remaining hydroxyl group of the bound catechol, initiating double
      bond rearrangement that results in a single electron transfer from the catechol to the iron centre
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The dioxygen iron ligand initiates a nucleophilic attack on the carbon adjacent to the
      radical formed in the previous step in an addition reaction. The oxygen of the catechol bound to
      the iron donates one electron to the radical iron-bound oxygen, and another to the carbon radical,
      forming a carbonyl bond. Double bond rearrangement from the addition results in deprotonation of
      His199.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: His199 deprotonates the hydroxide, initiating double bond rearrangement which results
      in extension of the ring by one atom and cleavage of the peroxo bond in a substitution reaction.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The oxo iron-ligand initiated a nucleophilic attack on the carbonyl carbon in a substitution
      reaction, cleaving the rind and initiating double bond rearrangement that results in the deprotonation
      of His199.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The product deprotonates a water molecule and is displaced from the iron centre by the
      hydroxide and water in an inferred return step.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: catechol 2,3-dioxygenase catalytic site
    node_type: MOTIF
    grounding: MCSA:34
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
