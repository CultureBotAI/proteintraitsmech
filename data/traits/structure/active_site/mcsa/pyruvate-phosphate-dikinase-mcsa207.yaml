  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His455 attacks the beta phosphate of the ATP in a nucleophilic substitution that results
      in His455 carrying a pyrophosphate moiety and the AMP product.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Free phosphate attacks the terminal phosphate of the His455 pyrophosphate moiety in a
      nuclephilic substitution, resulting in free pyrophosphate and phosphorylated His455.
