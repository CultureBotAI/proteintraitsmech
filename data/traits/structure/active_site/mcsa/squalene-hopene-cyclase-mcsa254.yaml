  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Protonation of the terminal double bond, by Asp376, initiates the reaction cascade [PMID:18033581].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: An intramolecular Markovnikov-type cation–olefin addition first produces a 6.6 bicyclic
      tertiary cation, which is stabilised by the pi-electrons and dipoles of aromatic residues including
      Phe365, Tyr420, Trp489, and Tyr609 [PMID:18033581].
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: 'The initial cyclisation cascade to form the 6.6.6.5 tetracyclic intermediate cation
      is thought to proceed almost concomitantly and without significant conformational changes. Then,
      a six-membered C-ring is formed directly in concert with formation of a Markovnikov-type five-membered
      D-ring, generating a 6.6.6.5-fused tetracyclic intermediate tertiary cation, which is stabilized
      by Phe601, Phe605, '
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The cyclisation reaction is subsequently followed by D-ring expansion and Markovnikov
      E-ring closure, yielding the tertiary hopanyl C-22 cation with the 6.6.6.6.5-fused pentacyclic ring
      system, which is likely to be stabilized by the conserved Phe605 pi-electrons [PMID:18033581].
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: 'Finally, the enzyme reaction is terminated by either regiospecific elimination of the
      Z-methyl group to the major product hop-22(29)-ene. It has been proposed that the water molecules
      are polarised by residues in the hydrogen-bonding network around Glu45 at the bottom of the active-site
      cavity; a polarised water molecule abstracts the proton or attacks the E-ring cation, to terminate
      the reaction '
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Asp376 is reprotonated after turnover via a proton relay chain involving Asp376, Water,
      Tyr495 and disordered water in the upper cavity of the active site [PMID:9931258].
  - node_id: step7
    label: mechanism step 7
