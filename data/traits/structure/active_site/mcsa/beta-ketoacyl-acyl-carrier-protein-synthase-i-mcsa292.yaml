  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The side chain thiolate of Cys163 acts as a nucleophile towards the carbonyl group of
      acyl ACP in a transesterification reaction that forms a Cys163-linked tetrahedral anion intermediate.
      The positive end of an alpha helix dipole enhances the nucleophilic character of Cys163 by stabilising
      the anionic thiolate form [PMID:11286890].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The tetrahedral intermediate collapses, releasing a terminal thiol anion form of ACP.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His292 deprotonates the carboxyl group of malonyl ACP.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The deprotonated malonyl ACP undergoes decarboxylation.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The ACP bound acetyl carbanion attacks the thioester carbon of the bound fatty acid,
      and a second tetrahedral intermediate is formed. Accumulation of negative charge on the thioester
      carbonyl of malonyl CoA during formation of the enolate is stabilised by a hydrogen bond from His
      333. The pK<sub>a</sub> of His298 is modified by Lys328 (acting indirectly via a hydroxide ion)
      and by a C-H---O hydrog
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The tetrahedral intermediate collapses, eliminating the Cys163 thiolate and generating
      an extended carbon chain, with an acyl-carrier protein component still attached.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The anionic form of ACP removes a proton from His298A, regenerating the active site for
      further catalysis.
  - node_id: step8
    label: mechanism step 8
