  - node_id: reactant0
    label: nitrile
    node_type: CHEMICAL
    grounding: CHEBI:18379
  - node_id: reactant1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product0
    label: aliphatic amide
    node_type: CHEMICAL
    grounding: CHEBI:65285
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The nitrile displaces a water molecule. The Cso hydroxide then initates a nucleophilic
      attack on the carbon of the nitrile.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Cys109A initiates a nucleophilic attack on the sulfur of Cso114, forming a disulfide
      bond and eliminating the nitrile intermediate. A proton is transferred from Tyr72B, via Ser113A,
      to the ngatvely charged nitrogen of the intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The negatively charged nitrogen abstracts a proton from Arg56B.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Two water molecules enter the active site, one binds to the iron ion, displacing the
      substrate. Then, the negatively charged Tyrosine (Tyr72B) abstracts a proton Ser113A, which in turn
      abstracts a proton from the iron bound water. This then abstracts a proton from a second water molecule,
      which initiates a nucleophilic attack on the sulfur of Cso114, cleaving the disulfide bond.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: It is unclear if this step occurs in a concerted manner with the previous one. The Arg56B
      abstracts a proton from the OH of Cso114A, regenerating the enzyme ground state.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products
  - node_id: active_site
    label: nitrile hydratase catalytic site
    node_type: MOTIF
    grounding: MCSA:57
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 1.10.472.20 superfamily fold
    node_type: DOMAIN
    grounding: CATH:1.10.472.20
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
