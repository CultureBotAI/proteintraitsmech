    description: The first step in the mechanism is nucleophilic attack of the glutamate amine nitrogen
      at the R-group carbonyl carbon of alpha-aminoadipate-delta-semialdehyde. This occurs with concomitant
      transfer of a proton to AASA's R group carbonyl oxygen and loss of a proton from the bridging amine
      to give a carbinolamine intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbinolamine intermediate undergoes a 1,3 intramolecular proton transfer to the
      hydroxyl group. There is then loss of water and formation of an unprotonated Schiff base intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The Schiff base intermediate is reduced via hydride transfer from NADPH with concomitant
      protonation of the developing amine nitrogen. The identity of the proton donor is currently unknown.
