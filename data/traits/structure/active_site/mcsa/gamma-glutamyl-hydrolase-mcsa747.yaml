  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His244 deprotonates Cys134 which activates it so it can attack the carbon of the peptide
      bond in a nucleophilic addition.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination which results in the cleavage of the peptide bond.
      The N-terminal product then accepts a proton from His244.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His244 abstracts a proton from a water which activates it so it can attack the carbon
      of the thioester bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates another elimination which results in the cleavage of the thioester
      bond. The released Cys134 can now accept a proton from His244 which returns the enzyme to its native
      state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
