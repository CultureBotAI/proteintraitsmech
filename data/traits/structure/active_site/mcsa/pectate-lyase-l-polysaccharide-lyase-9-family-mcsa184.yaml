    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination reaction that releases the products, and the poly(1,4-alpha-D-galacturonate)
      deprotonates an acid. As there is no obvious enzyme or substrate Bronsted acid to protonate the
      glycosidic oxygen in this enzyme, protonation is presumed to occur via solvent water [PMID:14670977].
