    node_type: CHEMICAL
    grounding: CHEBI:46761
  - node_id: product0
    label: L-alpha-amino acid
    node_type: CHEMICAL
    grounding: CHEBI:15705
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His164 deprotonates Cys25, activating it so that it can nucleophilically attack the carbon
      of the scissille bond which produces the oxyanion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimantion resulting in the cleavage of the scissille bond.
      The amino group of the N-terminal product then accepts a proton from His164 which prevents reformation
      of the peptide bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His164 abstracts a proton from water resulting in the activation of it so that it can
      go on to attack the carbon of the thioester bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates another elimination resulting in the cleavage of the thioester
      bond. The released Cys25 can now accept a proton from His164 resulting in the regeneration of the
      native state of the enzyme.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
  - node_id: active_site
    label: cathepsin S catalytic site
    node_type: MOTIF
    grounding: MCSA:814
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
