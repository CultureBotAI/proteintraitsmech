  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The phosphate of the PLP deprotonates the amine of L-serine, which in turn attacks the
      PLP cofactor in a nucleophilic addition and the bound Lys41 deprotonates the newly attached amine.
      This is the first step of the transaldimination reaction.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound lysine, resulting in free PLP and lysine in a neutral state. Final step of
      the transaldimination reaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "<p>Lys41 deprotonates the CA of the covalently bound L-serine, eliminating the hydroxyl\
      \ group, which deprotonates the phosphate group.</p>

<p>Since N1 of PLP is not protonated,\
      \ the pyridine ring cannot take a quinone-like structure. Therefore, abstraction of the alpha-hydrogen\
      \ from CA of serine  by Lys41 would not occur. However, since the phosphate OH group can act as\
      \ a general acid to donate "
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Phosphate of PLP deprotonates Lys41, which attacks the PLP in a nucleophilic addition
      reaction, the secondary amine of the attached substrate reprotonates from the bound Lys41. First
      step of the transaldimination reaction. In analogy to step 1, we infer that the phosphate group
      acts as a base in this step.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound product, resulting in 2- aminoacrylate and the regenerated PLP cofactor. Final
      step of the transaldimination reaction. We assume that the base in the previous step is the acid
      in this step.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Hydrolysis of the 2-aminoacrylate  enzymatic product into pyruvate and ammonia occurs
      outside the enzyme active site.
  - node_id: step7
