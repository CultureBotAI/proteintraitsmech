    node_type: CHEMICAL
    grounding: CHEBI:57453
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: N10 of CH2THF is protonated by a water molecule which is subsequently reprotonated by
      Glu60.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The 5 membered ring of CH2THF collapses.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Cys148 acts as a nucleophile to attack the cytosine ring of dCMP. dCMP then accepts a
      proton from Asp179.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Asp179 abstracts a the proton from the nitrogen of dCMP which triggers the nucleophilic
      attack on the CH2THF intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: There is loss of a proton from the intermediate. This is likely to be lost to the solvent.
      The intermediate accepts a proton from Asp179.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Asp179 abstracts the proton from the nitrogen of the cytosine intermediate. This causes
      a double bond to be formed at the new bridging methyl with concomitant lysis of the C-THF bond.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Water attacks the newly formed double bond which causes the elimination of Cys148.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: In an inferred step the hydroxyl group is deprotonated to form the product and Glu60
      is reprotonated to regenerate the native state of the enzyme.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Products.
