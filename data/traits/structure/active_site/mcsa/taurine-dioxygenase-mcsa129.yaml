  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Fe(II) donates a single electron to the dioxygen molecule, resulting in the dioxygen
      being bound to the Fe(III) centre.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Fe(III) donates a single electron to the bound peroxo group. The terminal oxygen of the
      peroxo group attacks the carbonyl carbon of the 2-oxoglutarate substrate in a nucleophilic addition.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Carbon dioxide is eliminated from the intermediate to form succinate and a iron-bound
      oxo anion.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The iron-bound oxo anion donates an electron to the Fe(IV) centre and abstracts a proton
      from the taurine substrate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The carbon radical initiates a homolytic subsitution which forms the 1-hydroxy-2-aminoethanesulfonic
      acid product and results in a single electron transfer to the Fe(III) centre.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The 1-hydroxy-2-aminoethanesulfonic acid decomposes to aminoacetaldehyde and sulfite.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: taurine dioxygenase catalytic site
    node_type: MOTIF
    grounding: MCSA:129
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
