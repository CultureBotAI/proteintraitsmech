    node_type: CHEMICAL
    grounding: CHEBI:16490
  - node_id: product1
    label: 7,8-diaminononanoate cation
    node_type: CHEMICAL
    grounding: CHEBI:58500
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amine of the substrate SAM attacks the PLP cofactor in a nucleophilic addition and
      the bound Lys274 deprotonates the newly attached amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound lysine, resulting in free PLP and lysine in a neutral state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys274 deprotonates the CH adjacent to the bound amine, resulting in double bond rearrangement
      as the PLP acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The PLP feeds the electrons back, resulting in the C=C attached to the aromatic ring
      deprotonates Lys274.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Lys274 deprotonates water, which initiates a nucleophilic attack on the carbon of the
      C=N group in an addition reaction.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The secondary amine deprotonates the attached hydroxyl group, initiating an elimination
      which releases S-adenosyl-4-methylthio-2-oxobutanoate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The amine of PMP initiates a nucleophilic attack on the carbonyl carbon of 8-amino-7-oxononanoate.
      The oxyanion deprotonates the newly formed secondary amine in the first step of a Schiff base formation.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The secondary amine initiates an elimination, forming the Schiff base and releasing water
      with concomitant deprotonation of Lys274.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Lys274 deprotonates the CH<sub>2</sub> adjacent to the nitrogen, resulting in double
      bond rearrangement as the PLP acts as an electron sink.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The PLP feeds the electrons back, the N<sup>+</sup>=C bond deprotonates Lys274.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The amine of Lys274 attacks the PLP in a nucleophilic addition reaction, the secondary
      amine of the attached substrate reprotonates from the bound Lys274.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound product, resulting in 7,8-diaminononanoate and the regenerated PLP cofactor.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: Product
