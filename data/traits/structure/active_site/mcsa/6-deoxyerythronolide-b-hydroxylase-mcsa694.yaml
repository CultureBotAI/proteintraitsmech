  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: After the substrate binds a water molecule is released from the active site which increases
      the redox potential. This facilitates the first one electron reduction of Fe(III) to Fe(II) by NADPH.
      Electron transfer is illustrated from a general donor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Molecular oxygen binds to Fe(II) to form the oxyferrous intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The second reduction forms a peroxo intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The peroxy oxygen accepts a proton from the C5 hydroxyl group of 6-DEB.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: "A second proton transfer from Glu244 occurs. Glu244 is well connected to bulk water
\
      
and can easily replenish its proton from bulk water."
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The O-O bond breaks, releasing water from the metal centre and Fe(III) is oxidised to
      Fe(IV). The C5 hydroxyl group of DEB is reprotonated. This is likely to be by the solvent.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The Fe(IV)-oxo complex undergoes spin inversion to form a radical oxo group which removes
      a hydrogen from the substrate to form a radical carbon centre and an alcohol group on Fe(IV).
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The carbon radical attacks the hydroxyl group to form the alcohol product and reduce
      Fe(IV) to Fe(III).
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Products.
