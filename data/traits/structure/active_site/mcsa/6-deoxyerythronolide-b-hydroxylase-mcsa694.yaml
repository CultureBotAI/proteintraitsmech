    label: 6-deoxyerythronolide B hydroxylase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0016713
    description: Grounded to the EC *class*-level GO term (oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, reduced iron-sulfur protein as one donor, and incorporation of one atom of oxygen); GO's ec2go has no term for the exact EC:1.14.15.35, so this is broader than the enzyme's specific activity.
