definitions:
  - kind: MECHANISTIC
    text: >-
      Transketolase (EC:2.2.1.1) (TK) catalyses the reversible transfer of a two-carbon ketol unit from xylulose 5-phosphate to an aldose receptor, such as ribose 5-phosphate, to form sedoheptulose 7-phosphate and glyceraldehyde 3- phosphate. This enzyme, together with transaldolase, provides a link between the glycolytic and pentose-phosphate pathways. TK requires thiamine pyrophosphate and a divalent metal cation as a cofactor. Catalytic activity has been noted with a wide variety of divalent metal ions coordinating the diphosphate group of the cofactor [PMID:9924800] and whilst there is still some debate as to the exact nature of the native metal cation (most of the work on the determination of the mechanism has utilised the magnesium cation), Esakova et al. have determined that the enzyme is more stable in the presence of Ca(II), making this the more likely native metal cation [PMID:16125202] .
    source: "M-CSA"
    method: SOURCED
causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of transketolase
  description: Stepwise mechanism transcribed from M-CSA entry 219 (6 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: his30
    label: catalytic His30 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P29401
    description: 'M-CSA roles: activator, hydrogen bond donor, steric role.'
  - node_id: lys244
    label: catalytic Lys244 (M-CSA/PDB numbering; UniProt residue 244)
    node_type: RESIDUE
    grounding: UniProtKB:P29401
    description: 'M-CSA roles: proton acceptor, proton donor.'
  - node_id: his258
    label: catalytic His258 (M-CSA/PDB numbering; UniProt residue 258)
    node_type: RESIDUE
    grounding: UniProtKB:P29401
    description: 'M-CSA roles: proton acceptor, proton donor.'
  - node_id: his263
    label: catalytic His263 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P29401
    description: 'M-CSA roles: hydrogen bond acceptor, hydrogen bond donor, proton acceptor, proton donor.'
  - node_id: glu418
    label: catalytic Glu418 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P29401
    description: 'M-CSA roles: hydrogen bond acceptor, hydrogen bond donor, proton acceptor, proton donor.'
  - node_id: his481
    label: catalytic His481 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P29401
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor.'
  - node_id: reactant0
    label: D-glyceraldehyde 3-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:59776
  - node_id: reactant1
    label: sedoheptulose 7-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57483
  - node_id: product0
    label: D-xylulose 5-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57737
  - node_id: product1
    label: aldehydo-D-ribose 5-phosphate(2-)
    node_type: CHEMICAL
    grounding: CHEBI:58273
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The carbanion of thiamine diphosphate (ThDP) attacks the carbonyl carbon of D-xylulose-5-phosphate
      in a nucleophilic addition that results in the cofactor undergoing double bond rearrangement. Simultaneously,
      the carbonyl oxygen of D-xylulose-5-phosphate deprotonates the amine group of the ThDP cofactor.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys244 deprotonates His258, thereby activating it. Activated His258 deprotonates the
      2-OH group of the covalently attached intermediate, initiating the elimination of D-glyceraldehyde
      3-phosphate via cleavage of the C-C scissile bond. Thiamine diphosphate acts as an electron sink.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Formation of D-glyceraldehyde-3-phosphate product.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: "Thiamine diphosphate initiates a double bond rearrangement, which results in the intermediate\
      \ attacking the aldose D-erythrose-4-phosphate substrate in a nucleophilic addition. This resulted\
      \ in a more
negative carbonyl oxygen which is subsequently implicated in a series of proton transfers\
      \ for restoration of the initial protonation state of His258 and Lys244 catalytic residues."
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: ThDP cofactor initiates a double bond rearrangement, that deprotonates the hydroxide
      of the intermediate, and results in a reformation of the carbanionic activated cofactor and the
      D-fructose-6-phosphate product.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Final products.
