    label: D-alanine zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:57416
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amine of the substrate L-glutamate attacks the PLP cofactor in a nucleophilic addition
      and the bound Lys145 deprotonates the newly attached amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound lysine, resulting in free PLP and lysine in a neutral state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys145 deprotonates the CH adjacent to the bound amine, resulting in double bond rearrangement
      as the PLP acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The PLP feeds the electrons back, resulting in the C=C attached to the aromatic ring
      deprotonates Lys145.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Lys145 deprotonates water, which initiates a nucleophilic attack on the carbon of the
      C=N group in an addition reaction.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The secondary amine deprotonates the attached hydroxyl group, initiating an elimination
      which releases 2-oxoglutarate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The amine of PMP initiates a nucleophilic attack on the carbonyl carbon of pyruvate.
      The oxyanion deprotonates the newly formed secondary amine in the first step of a Schiff base formation.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The secondary amine initiates an elimination, forming the Schiff base and releasing water
      with concomitant deprotonation of Lys145.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Lys145 deprotonates the CH2 adjacent to the nitrogen, resulting in double bond rearrangement
      as the PLP acts as an electron sink.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The PLP feeds the electrons back, the N<sup>+</sup>=C bond deprotonates Lys145.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The amine of Lys145 attacks the PLP in a nucleophilic addition reaction, the secondary
      amine of the attached substrate reprotonates from the bound Lys145.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound product, resulting in alanine and the regenerated PLP cofactor.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: Products
  - node_id: active_site
    label: D-alanine transaminase catalytic site
    node_type: MOTIF
    grounding: MCSA:66
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
