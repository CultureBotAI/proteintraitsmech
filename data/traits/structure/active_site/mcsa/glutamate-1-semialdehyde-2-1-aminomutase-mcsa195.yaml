- graph_id: catalysis
  title: Catalytic mechanism of glutamate-1-semialdehyde 2,1-aminomutase
  description: Stepwise mechanism transcribed from M-CSA entry 195 (13 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +0).
  nodes:
  - node_id: tyr150
    label: catalytic Tyr150 (M-CSA/PDB numbering; UniProt residue 150)
    node_type: RESIDUE
    grounding: UniProtKB:P24630
    description: 'M-CSA roles: steric role.'
  - node_id: asp245
    label: catalytic Asp245 (M-CSA/PDB numbering; UniProt residue 245)
    node_type: RESIDUE
    grounding: UniProtKB:P24630
    description: 'M-CSA roles: electrostatic stabiliser, hydrogen bond acceptor.'
  - node_id: lys273
    label: catalytic Lys273 (M-CSA/PDB numbering; UniProt residue 273)
    node_type: RESIDUE
    grounding: UniProtKB:P24630
    description: 'M-CSA roles: covalently attached, electron pair acceptor, electron pair donor, hydrogen
      bond acceptor, hydrogen bond donor, nucleofuge, nucleophile, proton acceptor, proton donor.'
  - node_id: reactant0
    label: (S)-4-amino-5-oxopentanoic acid zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:57501
  - node_id: product0
    label: 5-ammoniolevulinate
    node_type: CHEMICAL
    grounding: CHEBI:356416
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The amine of the PMP cofactor attacks the carbonyl carbon of the (S)-4-amino-5-oxopentanoate
      substrate in a nucleophilic addition. This results in a the oxyanion formed deprotonating the newly
      attached amine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      water, resulting in the substrate being covalently bound as a Schiff base.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The amine of Lys273 deprotonates the C1 of the PMP, which acts as an electron sink and
      undergoes a double bond rearrangement.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The PMP initiates a deprotonation of the Lys273 through its conjugated pi-bond system,
      resulting in the protonation at the covalently bound carbon of the intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The amine of Lys273 attacks the PMP in a nucleophilic addition reaction, the secondary
      amine of the attached intermediate reprotonates from the bound Lys229
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound PMP, and the free diamino intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The original amine of the intermediate attacks the covalently bound PMP cofactor in a
      nucleophilic addition and the bound Lys273 deprotonates the newly attached amine.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The secondary amine that results from the attack initiates an elimination of the covalently
      bound lysine, resulting in free PMP and lysine in a neutral state.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Lys273 deprotonates the carbon next to the covalently attached nitrogen, which initiates
      a double bond rearrangement through the conjugated pi-bond system of PMP.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The PMP initiates a deprotonation of the Lys273 through its conjugated pi-bond system,
      resulting in the protonation at the C1 of the PMP cofactor.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Water attacks the imine in a nucleophilic addition reaction, which deprotonates the attacking
      water.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: Lys273 deprotonates the hydroxyl group, initiating an elimination of the PMP cofactor
      and 5-aminolevulinate product.
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: glutamate-1-semialdehyde 2,1-aminomutase catalytic site
    node_type: MOTIF
    grounding: MCSA:195
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
