  - node_id: reactant2
    label: dioxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
  - node_id: reactant3
    label: methane
    node_type: CHEMICAL
    grounding: CHEBI:16183
  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: NAD(1-)
    node_type: CHEMICAL
    grounding: CHEBI:57540
  - node_id: product2
    label: methanol
    node_type: CHEMICAL
    grounding: CHEBI:17790
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The first step in the reaction involves the departure of the loosely coordinated water
      molecule trans to the histidines 147 and 246.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Molecular oxygen binds to the diiron centre, forming peroxo intermediate P.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Glu243 opens up and there is temporary dissociation of Glu144 and the water molecule,
      allowing for a trans-u-1,2 conformation. The peroxide O-O bond breaks and intermediate Q is formed.
      The water molecule and Glu144 then rebind to their respective Fe centres. Glu243 forms a hydrogen
      bond to the water molecule.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: 'The hydroxylation reaction shown is the Friesner-Lippard model (PMID: ). There is single
      electron transfer from one bound oxygen to one of the Fe(IV) centres, reducing it to Fe(III). The
      electrophilicity of the oxo moiety is greatly enhanced by this distortion.'
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A methane C-H bond is broken by the oxidised oxygen to form a methane radical.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Another electron is transferred from the reduced hydroxyl to the remaining Fe(IV) centre,
      increasing the electrophilicity of the oxygen moiety.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: "The newly formed OH group reacts with the methyl radical to give the final product.\
      

The active site of the hydroxylase (MMOH) is restored by the reductase protein (MMOR) which\
      \ also makes up the sMMO enzyme. MMOR contains Fe2S2 and FAD cofactors that enable it to accept\
      \ electrons from NADH and transfer them to the hydroxylase (not shown here). This reduces the Fe\
      \ ions to Fe(II)."
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
