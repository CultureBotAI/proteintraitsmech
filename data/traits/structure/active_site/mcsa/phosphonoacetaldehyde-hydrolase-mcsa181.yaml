  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Lys53 attacks the carbonyl carbon of the phosphonoacetaldehyde aldehyde in a nucleophilic
      addition.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion deprotonates the covalently attached Lys53.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys53 initiates an elimination that results in the loss of the alcohol group, which deprotonates
      a water which in turn deprotonates His56.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Asp12 attacks the phosphate of the covalently bound intermediate in a nucleophilic substitution
      that cleaved the C-P bond and results in a phosphorylated Asp12 and alkylated Lys53
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Lys53 initiates a double bond rearrangement that causes the reduction of the C=C in the
      alkylated intermediate and deprotonates water. The activated water attacks the phosphate in a nucleophilic
      substitution that releases Asp12 and the phosphate product.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His56 deprotonates water, which deprotonates a second water, which attacks the carbon
      of the C=N bond in a nucleophilic addition.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Lys53 deprotonates the newly formed alcohol group.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The oxyanion initiates an elimination that releases the acetaldehyde product and regenerates
      the active site Lys53.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Products
  - node_id: active_site
    label: phosphonoacetaldehyde hydrolase catalytic site
    node_type: MOTIF
    grounding: MCSA:181
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
