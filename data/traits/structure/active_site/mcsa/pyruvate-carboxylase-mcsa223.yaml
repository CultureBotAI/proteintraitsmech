  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Reaction occurs in the BC domain. The bicarbonate is deprotonated by Glu305 and then
      acts as a nucleophile and attacks the gamma-phosphate in a substitution reaction, liberating ADP.
      Mg(II) stabilises/activates the ATP
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Reaction occurs in the BC domain. The phosphorylated bicarbonate undergoes a decarboxylation
      reaction (E1cb) to liberate carbon dioxide and phosphate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Reaction occurs in the BC domain. The phosphate deprotonates one of the N-H groups of
      biotin with concomitant tautomerisation to produce an oxyanion.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Reaction occurs in the BC domain. The oxyanion re-forms the carbonyl group, causing the
      C=N bond of the activated biotin to add to the carbon dioxide in a nucleophilic manner.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Reaction occurs in the CT domain. Carbon dioxide is eliminated from the biotin moiety.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The activated biotin moiety abstracts a proton from Thr882, which in turn abstracts a
      proton from the pyruvate substrate forming the enol intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The enolate intermediate initiates a nucleophilic attack on the carbon dioxide molecule
      to form the final product.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Inferred return step to regenerate the active site of the BC domain.
