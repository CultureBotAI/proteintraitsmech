  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "With the aid of nitrogen lone pair donation, the acetyl oxygen of acetyllysine is the\
      \ nucleophile for nucleophilic attack on the C1' position of NAD+, resulting in a substitution reaction\
      \ in which nicotinamide is the leaving group. This produces a 1'-O-alkylamidate intermediate.
\
      
The ground state of NAD+ is destabilised because the positively-charged nicotinamide group is\
      \ positioned in a hydroph"
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: His135 deprotonates the 3'-hydroxyl of the 1'-O-alkylamidate intermediate, which then
      itself deprotonates the 2'-hydroxyl. The resulting alkoxide is the nucleophile for intramolecular
      nucleophilic attack on the acetyl carbon. This produces a 1',2'-cyclic intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Nicotinamide can dissociate from the enzyme after NAD+ cleavage. It has been shown to
      leave before this step so that the previous step can illustrate how the enzyme prevents nicotinamide
      exchange. His135 protonates the lysine nitrogen in the 1',2'-cyclic intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Lysine dissociates from the 1',2'-cyclic intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Water, positioned and possibly activated by Asn116, attacks the carbocation.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The product lysine deprotonates the positively-charged oxygen.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The ring of the intermediate is opened when the exocyclic hydroxyl forms a carbonyl,
      with elimination and subsequent protonation of the endocyclic O1'.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products
