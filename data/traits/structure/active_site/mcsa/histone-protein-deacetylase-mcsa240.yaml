    predicate_id: RO:0002436
    object: step1
    description: Phe44 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/240/
      snippet: "With the aid of nitrogen lone pair donation, the acetyl oxygen of acetyllysine is the\
        \ nucleophile for nucleophilic attack on the C1' position of NAD+, resulting in a substitution\
        \ reaction in which nicotinamide is the leaving group. This produces a 1'-O-alkylamidate intermediate.\
        

The ground state of NAD+ is destabilised because the positively-charged nicotinamide group\
        \ is positioned in a hydrophobic pocket. Also, Asp118 forces the carboxamide of NAD+ to rotate\
        \ 150 degrees from its lower energy conformer and this disrupts electronic resonance between the\
        \ carboxamide and the pyridine ring. After NAD+ cleavage Phe44 moves between the two products\
        \ to prevent nicotinamide exchange. Nicotinamide rotates around to carboxamide group to form interactions\
        \ between the nitrogen of the ring and residues. This prevents nicotinamide exchange by positioning\
        \ the nitrogen nucleophile away from the the intermediate."
      notes: M-CSA entry 240, mechanism 1; M-CSA cites PMID:11336676, PMID:11427894, PMID:14604530, PMID:15023335,
