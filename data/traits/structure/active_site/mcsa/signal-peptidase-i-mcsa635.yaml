  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Lys 146 deprotonates Ser 91 which activates it to nucleophilically attack the carbon
      of the carbonyl to form the oxyanion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Lys 146 protonates the amine of the peptide bond which results in the collapse of the
      tetrahedral intermediate and the cleavage of the peptide bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys 146 abstracts a proton from a water which activates it to attack the carbon of the
      ester bond in a nucleophilic addition once again producing the oxyanion intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The tetrahedral intermediate collapse again resulting in the release of Ser91 which then
      accepts a proton from Lys 146 returning the active site to its native state.
