    text: >-
      Gingipains are key virulence factors of Porphyromonas gingivalis. They are cysteine proteinases with a high specificity for Arg-Xaa or Lys-Xaa. These proteins are single polypeptides with two domains that show homology to the caspases. Gingipain R is implicated in tissue inflammation associated with periodontal diseases. Elucidation of a chemical mechanism for the active site of gingipain R may be useful in design of drugs in the fight against peridontal diseases.
    source: "M-CSA"
    method: SOURCED
causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of gingipain R
  description: Stepwise mechanism transcribed from M-CSA entry 806 (5 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: glu152
    label: catalytic Glu152 (M-CSA/PDB numbering; UniProt residue 381)
    node_type: RESIDUE
    grounding: UniProtKB:P95493
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: his211
    label: catalytic His211 (M-CSA/PDB numbering; UniProt residue 440)
    node_type: RESIDUE
    grounding: UniProtKB:P95493
    description: 'M-CSA roles: proton acceptor, proton donor.'
  - node_id: gly212
    label: catalytic Gly212 (M-CSA/PDB numbering; UniProt residue 441)
    node_type: RESIDUE
    grounding: UniProtKB:P95493
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: cys244
    label: catalytic Cys244 (M-CSA/PDB numbering; UniProt residue 473)
    node_type: RESIDUE
    grounding: UniProtKB:P95493
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: reactant0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: reactant1
    label: dipeptide
    node_type: CHEMICAL
    grounding: CHEBI:46761
  - node_id: product0
    label: L-alpha-amino acid
    node_type: CHEMICAL
    grounding: CHEBI:15705
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His440 deprotonates Cys473 which activates it so that it can attack the carbon of the
      carbonyl in a nucleophilic addition which produces the oxyanion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The oxyanion initiates an elimination resulting in the cleavage of the peptide bond.
      The amino group of the N-terminal product accepts a proton from His440 and this prevents reformation
      of the peptide bond.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His440 deprotonates a water, activating the water so that it can attack the carbon of
      the thioester bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The oxyanion initiates another elimination which results in the cleavage of the thioester
      bond. The released Cys437 now accepts an electron from His440 which returns the enzyme to its native
      state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products
  - node_id: active_site
    label: gingipain R catalytic site
    node_type: MOTIF
    grounding: MCSA:806
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 3.40.50.1460 superfamily fold
    node_type: DOMAIN
    grounding: CATH:3.40.50.1460
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: gingipain R activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0004197
    description: Grounded to the EC *class*-level GO term (cysteine-type endopeptidase activity); GO's ec2go has no term for the exact EC:3.4.22.37, so this is broader than the enzyme's specific activity.
    xrefs:
    - EC:3.4.22.37
