  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ca2+ binding causes the Tyr190-His175 hydrogen bon to become stronger. His175 acts as
      a base to deprotonate Tyr190. The hydroperoxide protonatesd the tyrosinate, forming a peroxy anion.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: There is irreversible nucleophilic attack of the peroxy anion on the C3-carbon of coelenterazine
      to form a dioxetanone intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The dioxetanone intermediate collapses and carbon dioxide is released.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The oxyanion collapses to form the amide anion excited state of the product.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Subsequent excited state proton transfer is proposed to transform the product into the
      excited phenolate ion-pair responsible for bioluminescence emission at longer wavelength. His22
      acts as a base to deprotonate the phenol group. The product and native state of the enzyme can be
      restored by reversible proton transfer.
