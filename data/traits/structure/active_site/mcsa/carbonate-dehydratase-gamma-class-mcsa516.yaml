This hydroxyl ligand then abstracts\
      \ a proton from the adjacent liganded water molecule. The newly formed hydroxide ligand is stabilised\
      \ by hydrogen bonding to Gln 75."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: "The proton bound to Glu62 is then abstracted by Glu84 where it is shuttled into the\
      \ solution. 
CO2 is polarised by Asn 202 to make the carbon more attractive for nucleophilic\
      \ attack. The hydroxide ligand nucleophilically attacks the carbon atom of CO2, resulting in a bound\
      \ HCO3-."
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: An oxygen atom of HCO3- displaces a liganded water molecule from Co to form a bidentate
      HCO3- ligand.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Glu 62 destabilises HCO3- by hydrogen bonding to it. A water molecule replaces one of
      the bound oxygens of the HCO3- ligand.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: A second water molecule replaces the other bound oxygen atom of HCO3-, displacing it
