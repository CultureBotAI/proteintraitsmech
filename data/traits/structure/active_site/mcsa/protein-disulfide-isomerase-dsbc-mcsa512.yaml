  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "There is nucleophilic attack from Cys 98 to one of the sulfur atoms of the protein disulphide\
      \ bond. 
The nucleophilicity of Cys 98 is increased by electrostatic interactions of  the Asp\
      \ and Arg residues. 
This results in an SN2 reaction, where a new disulphide bond is formed between\
      \ Cys 98 and the substrate protein, leaving a thiolate group on the other sulfur of the old disulphide\
      \ bond."
