  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The reaction cycle starts by NADPH reducing the Moco bound molybdenum. One of the molybdenum
      bound oxygens turns into a hydroxide group.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The nitrate then displaces the OH molecule from the coordination sphere of molybdenum.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The Mo metal then creates a double bond with the bound nitrate oxygen, releasing nitrite
      into the solution. This oxidises the Mo back to its (VI) state. The transition state is stabilised
      by Asp271 and Asn272.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The nitrite leaves the coordination sphere and the cofactor is regenerated completing
      the cycle.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Final product.
