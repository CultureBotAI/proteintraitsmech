  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: Kinetic investigations supported a one-site ping-pong mechanism and showed the second
      half-reaction to be the rate-limiting step for DHODA. In the first half-reaction, a hydride is transferred
      from dihydroorotate to FMN, giving orotate and FMNH2(reduced form). In the second half-reaction,
      the FMN is regenerated using molecular oxygen and producing hydrogen peroxide.
