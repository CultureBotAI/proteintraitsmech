  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Fe(II) transfers an electron to the triplet state dioxygen.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The superoxide attacks the keto group of 2-oxoglutarate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: There is oxidative decarboxylation, resulting in the formation of succinate, CO2 and
      the ferryl species.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The ferryl oxygen abstracts a proton from leucocyanidin to form a radical intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The hydroxide adds to the radical intermediate, reducing Fe(III) to Fe(II) and forming
      an acetal.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Lys213 acts as a base to deprotonate the acetal intermediate, causing the elimination
      of the hydroxyl and formation of a carbon-carbon double bond.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: In an inferred step the product of step 6 tautomerises to form the taxifolin product.
      The succinate product and hydroxyl are released from the Fe(II) centre and the native state of the
      enzyme is restored.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
