    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Tyr44 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/465/
      snippet: "CocE is a serine hydrolase employing a chymotrypsin-like Ser-His-Asp catalytic triad and\
        \ mechanism; the residues are Ser 117, His 287 and Asp 259. The oxyanion hole is formed by Tyr\
        \ 44 and Tyr 118 main chain. The mechanism occurs as follows:
<ol>
<li>Asp 259 hydrogen\
        \ bonds to His 287, increasing His 287 pKa. His 287 can then activate Ser 117 as a nucleophile\
        \ by deprotonation.</li>
<li>Trp 166 hydrogen bonds to Tyr 44, increasing Tyr 44 pKa. Tyr 44\
        \ can then activate the substrate ester bond as an electrophile, along with the main chain amide\
        \ of Tyr 117 and the helix dipole.</li>
<li>Ser 117 attacks the carbon of the substrate benzoyl\
        \ ester. A tetrahedral transition state is formed. Tyr 44 and Tyr 117 stabilise the charge on\
        \ this transition state.</li>
<li>The transition state collapses, acylating Ser 117 with a\
        \ benzoyl group. The hydroxyl leaving group is presumably protonated by the proton belonging to\
        \ Ser 117.</li>
<li>Deacylation of the acyl-enzyme is by hydrolysis, the catalytic residues\
        \ playing the same roles as they did in the acylation steps.</li>
</ol>"
