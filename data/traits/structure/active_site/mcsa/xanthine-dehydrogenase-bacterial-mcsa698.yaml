  edges:
  - subject: arg310
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Arg310 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/698/
      snippet: XDH cycles between mainly 2-electron and 4-electron reduced states during enzyme turnover.  Catalysis
        is initiated by the abstraction of a proton from the Mo-OH group by Glu730, followed by a nucleophilic
        attack on the carbon centre to be hydroxylated (the C-8 position of the substrate) and the concomitant
        hydride transfer from the C-8 carbon centre to the Mo(VI)=S of the molybdenum centre. This yields
        an LMo(IV)(SH)(OR) transition state intermediate, with L representing a unique pyranopterin cofactor
        coordinated to the metal via an enedithiolate sidechain, and OR representing the now hydroxylated
        product coordinated to the molybdenum via the newly introduced hydroxyl group. The accumulation
        of negative charge on the transition state is stabilised by Arg310. The bound product is displaced
        from the molybdenum coordination sphere by hydroxide from the solvent, electron transfer out of
        the molybdenum centre to FAD via the iron-sulphur centres, and deprotonation of the Mo-SH to regenerate
        the original, oxidised LMo(VI)OS(OH). The iron-sulphur centres, as well as providing an electron
        transfer pathway from molybdenum to FAD, also act as electron sinks, storing reducing equivalents
        during catalysis, and so control the reactivity of FAD by way of its one-electron-reduced or fully-reduced
        state. Electron transfer to FAD from the iron-sulphur centre occurs by one-electron steps, followed
        by a two-electron transfer to react with NAD+. After binding of NAD+, fully reduced FAD is oxidised
        concomitantly with the reduction of NAD+.
      notes: M-CSA entry 698, mechanism 1; M-CSA cites PMID:15265866, PMID:17327224, PMID:25258317, PMID:4367215,
        PMID:9988690; step 1
