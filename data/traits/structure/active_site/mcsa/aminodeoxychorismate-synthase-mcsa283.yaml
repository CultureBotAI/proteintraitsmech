    node_type: CHEMICAL
    grounding: CHEBI:29985
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The chlorismate substrate binds in the synthase domain before glutamine is present [PMID:9575335]..
      Chorismate is attacked at C(2) by the nucleophilic Lys274, resulting in the conjugate elimination
      of water from C(4). Glu258 acts as a general acid to the departing water. The reaction proceeds
      via a Sn2" which maintains the stereochemistry at C(4). A single displacement mechanism would result
      in st
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The imidazol of His168 is proposed to act as a general base towards Cys79, activating
      the thiol towards nucleophilic attack at the glutamine carbonyl.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The anionic tetrahedral intermediate collapses. This generates the ammonia. The ammonia
      produced in this step is then relayed to the active site contained in PapB (where the 4-amino 4-deoxychorismate
      is formed) through a channel; similar to the reactions of  GMP and CTP synthetase [PMID:11841211].
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Ammonia formed from the hydrolysis of glutamine attacks at the C(4) position of the chorismate-enzyme
      adduct, eliminating Lys274.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Glu258 acts as a general base, abstracting a proton from the C(4) amino group and regenerating
      the synthase catalytic site.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His168 deprotonates the water, which attacks the enzyme-glutamine complex, forming a
      tetrahedral intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The tetrahedral intermediate collapses, eliminating Cys79, which deprotonates His168.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Product
