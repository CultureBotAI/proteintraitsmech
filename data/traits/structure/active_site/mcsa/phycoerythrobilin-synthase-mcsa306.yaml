      conserved region of positively charged residues on the protein surface binds the electron transfer
      protein ferredoxin. The ionisable carboxylate side chains on the biliverdin substrate are proposed
      to be involved in m
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The single electron oxidised ferredoxin donates a second electron in conjunction with
      Asp105A donating a proton to the C15 position of biliverdin.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Asp105A initiates tautomerisation in the intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Asp105A is deprotonated in a stereospecific manner, completing the initial tautomerisation.
      The catalytic aspartate residues are positioned as to act as stereospecific general bases towards
      the reaction intermediates [PMID:19887371, PMID:21050180].
  - node_id: step6
