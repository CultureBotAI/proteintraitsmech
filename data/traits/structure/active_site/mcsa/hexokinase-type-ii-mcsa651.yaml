  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: The reaction proceeds via an SN2 mechanism with the 6C OH of the glucose acting as a
      nucleophile, due to deprotonation by Asp 211, to attack the gamma phosphate of ATP. In doing so
      the position of glucose in the binding site changes to bring it within optimum hydrogen bonding
      distance of Ser 158, thus stabilising the reaction's transition state. The pentavalent phosphate
      is stabilised by electrost
  - node_id: active_site
    label: hexokinase (type II) catalytic site
    node_type: MOTIF
