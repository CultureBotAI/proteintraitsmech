  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The nitrogen of trimethylamine initiates a nucleophilic attack on the FMN.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: It is likely that this step occurs in a concerted manner with step 1. The carbanion formed
      collapses,  resulting in the two electron oxidation of the flavin cofactor and the immine product.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The first single electron transfer from FMN to ETF, which passes through a single iron-sulfur
      cluster.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The second single electron transfer from FMN to ETF, which passes through a single iron-sulfur
      cluster. The transfer is facilitated by the abstraction of a proton from the FMN by water.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The product of the enzyme undergoes spontaneous hydrolysis outside of the active site
      to produce formaldehyde and dimethylamine (first step).
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The product of the enzyme undergoes spontaneous hydrolysis outside of the active site
      to produce formaldehyde and dimethylamine (second step).
