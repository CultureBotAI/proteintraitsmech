    node_type: CHEMICAL
    grounding: CHEBI:46911
  - node_id: product0
    label: L-proline zwitterion
    node_type: CHEMICAL
    grounding: CHEBI:60039
  - node_id: product1
    label: ammonium
    node_type: CHEMICAL
    grounding: CHEBI:28938
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Asp 228 abstracts a proton from the alpha-amino nitrogen, which causes a hydride to be
      transferred from the alpha-carbon to the re face of NAD+
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Glu 56 acts as a general base by deprotonating the nitrogen atom of the delta-amino group,
      activating it for nucleophilic attack on the alpha-carbon atom. This results in the double bond
      between the alpha-carbon and nitrogen breaking, and the alpha-nitrogen being protonated by Asp 228.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Asp 228, which loses a proton to an unknown base between the previous step and this one
      then deprotonates the delta-nitrogen, causing it to nucleophilically attack the alpha-carbon again,
      forming a double bond and eliminating ammonia.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The electrophilic C2 centre  then accepts a hydride from NADH, breaking the C=N to form
      L-proline and reforming NAD+.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: ornithine cyclodeaminase catalytic site
