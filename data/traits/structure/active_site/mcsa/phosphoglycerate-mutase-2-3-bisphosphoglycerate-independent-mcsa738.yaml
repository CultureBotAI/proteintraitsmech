    label: mechanism step 1
    node_type: STATE
    description: The water molecule coordinating the first Mn ion is replaced by the ester oxygen of 2-phospho-D-glycerate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ser 62 is polarized by the second Mn ion. This polarization leads to Lys 336 deprotonating
      Ser 62, which activates the thiol group.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "There is nucleophilic attack from Ser 62 onto the phosphate group of 2-phospho-D-glycerate.
\
      
This leads to glycerate being displaced in an SN2 reaction forming a phospho-serine intermediate."
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Asp 154 deprotonates the C2 hydroxyl of the glycerate, this activates the hydroxyl group.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: "There is a second nucleophilic substitution reaction where the C2 oxygen attacks the\
      \ phosphate group displacing Ser 62.
This forms the (deprotonated) product of the reaction."
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Ser 62 is reprotonated and Asp 154 is deprotonated regenerating the enzyme in its native
      state.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Water displaces the ester oxygen to coordinate the first Mn ion.
