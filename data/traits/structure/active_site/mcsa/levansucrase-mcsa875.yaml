  edges:
  - subject: asp86
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Asp86 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/875/
      snippet: The canonical reaction mechanism of retaining glycosidases implies that Asp86 and Glu342
        need to be in different protonation states upon substrate binding in the double displacement reaction
        mechanism of fructosyl transfer. The optimum of levansucrase enzymatic activity is at pH 6.0.
        During the first reaction step of the double displacement mechanism, nucleophilic Asp86 forms
        a covalent intermediate with the fructofuranosyl, while Glu342 protonates the glucosyl leaving
        group. In the second reaction step of the double displacement mechanism, the acceptor substrate
        binds and, through nucleophilic attack of the terminal 6'-hydroxyl (assuming a polymer with β
        (2 → 6) linkage) on the anomeric carbon, the enzyme-bound fructosyl is added to the acceptor.
      notes: M-CSA entry 875, mechanism 1; M-CSA cites PMID:14517548, PMID:16870166, PMID:18366639, PMID:18596022,
