    node_type: STATE
    description: The enzyme-malonyl carbonyl linkage acts as an electrophile towards the terminal thiol
      of the acyl carrier protein which is deprotonated by the general acid His201.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The tetrahedral intermediate collapses eliminating the malonyl acyl-carrier protein adduct
