    node_type: RESIDUE
    grounding: UniProtKB:Q9HU21
    description: 'M-CSA roles: proton acceptor, proton donor.'
  - node_id: lys74
    label: catalytic Lys74 (M-CSA/PDB numbering; UniProt residue 71)
    node_type: RESIDUE
    grounding: UniProtKB:Q9HU21
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: tyr134
    label: catalytic Tyr134 (M-CSA/PDB numbering; UniProt residue 131)
    node_type: RESIDUE
    grounding: UniProtKB:Q9HU21
    description: 'M-CSA roles: proton acceptor, proton donor, proton relay.'
  - node_id: asp171
    label: catalytic Asp171 (M-CSA/PDB numbering; UniProt residue 168)
    node_type: RESIDUE
    grounding: UniProtKB:Q9HU21
    description: 'M-CSA roles: electrostatic stabiliser, increase acidity, increase basicity.'
  - node_id: reactant0
    label: dTDP-4-dehydro-6-deoxy-alpha-D-glucose(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57649
  - node_id: product0
    label: dTDP-4-dehydro-beta-L-rhamnose(2-)
    node_type: CHEMICAL
    grounding: CHEBI:62830
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His65 abstracts a proton from the acidic 5' position, accelerated by the electrostatic
      interaction with Asp171, to form the enolate-tautomer. Biochemical investigations suggest that epimerisation
      at the 5' centre occurs before that at the 3' centre [PMID:17046787].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Inorder for His65 to act as a general base in the following reaction steps the residue
      must be deprotonated. Crystallography shows solvent molecules to be present within the active site
      [PMID:17046787]. Water may potentially act as a specific base, deprotonating His65 for the next
      round of catalysis.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Tyr134 acts as a general base towards the C3' carbon in a stereo-selective manner. Solvent
      molecules within the active site have been shown to be involved in the stereo-selectve reprotonation
      stages, although mutagenesis and kinetics studies have shown Tyr134 to be crucial for catalyic activity
      [PMID:17046787].
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The second epimerisation is initiated by His65 at the C3' position. Inorder for the C3'
      proton to be made acidic enough to be removed, it must be orientated orthogonally to the carbonyl
      group. This is acheived by a ring inversion at the C4' carbonyl between step four and step five
      [PMID:17046787].
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The enolate collapses with stereo-selective reprotonation of the C3' by Tyr134.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The regeneration of the active site by reprotonation of Tyr134 and His65.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: dTDP-6-deoxy-D-xylo-4-hexulose 3,5 epimerase catalytic site
    node_type: MOTIF
    grounding: MCSA:329
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
