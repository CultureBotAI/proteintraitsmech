- graph_id: catalysis
  title: Catalytic mechanism of dTDP-6-deoxy-D-xylo-4-hexulose 3,5 epimerase
  description: Stepwise mechanism transcribed from M-CSA entry 329 (7 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset -3).
