  edges:
  - subject: arg325
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Arg325 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/404/
      snippet: "AspRS performs two sequential reactions. The first reaction is the formation of aspartyladenylate\
        \ from the free amino acid and ATP, releasing pyrophosphate. The second reaction is the displacement\
        \ of the adenylate moiety by the 3’-OH of the terminal adenosine of the tRNAAsp acceptor arm,\
        \ yielding the covalently linked Asp-tRNAAsp. 
<br/><br/>
The first reaction occurs through\
        \ an in-line mechanism with the inversion of configuration at the alpha-phosphorus (the reactive\
        \ oxygen of the carboxylate group of aspartic acid is located at 2.4 Angstroms from the alpha-phosphate\
        \ of ATP). This step proceeds via a trigonal bipyramidal pentacovalent  intermediate, with the\
        \ entering and leaving groups occupying apical positions. Stabilization  of  this  reaction  intermediate\
        \ requires a decrease  in  the  negative  charge  of  the alpha-phosphate. The positive charges\
        \ carried by the guanidium groups of Arg333, Arg325 and Arg531, the imidazole ring of His334 and\
        \ the magnesium ions altogether participate in the delocalization of the negative charges of the\
        \ triphosphate moiety of ATP. The  binding  of  one substrate (ATP-Mg2+ or Asp) orients the side\
        \ chains of the strictly conserved Arg325 and Ser481 such that their side chains are in positions\
        \  favouring  their  interaction  with  the  second substrate. This results in a positive coupling\
        \ which partly compensates for the electrostatic repulsion  between  the  negative  charges  of\
        \  the  attacking carboxylate group and the receiving alpha-phosphoryl, thereby preparing the\
        \ catalytic step and stabilising the transition states."
      notes: M-CSA entry 404, mechanism 2; M-CSA cites PMID:10873455, PMID:11566892, PMID:16774919, PMID:17690095,
