        (0.88). To achieve an efficient production of singlet excited species, the breakdown of the dioxetanone
        ring intermediate is suggested to be activated by an intramolecular chemically initiated electron
        exchange luminescence (CIEEL) process. In this process, the electron transfer from the benzothiazolyl
