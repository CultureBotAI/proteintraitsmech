    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/128/
      snippet: To oxidise luciferin, luciferase must abstract the C4 proton producing a carbanion that
        undergoes electrophilic attack by molecular oxygen. This process is greatly facilitated by the
        activating effect of AMP which increases the acidity of C4 and is a good leaving group, allowing
        the formation of the dioxetanone ring. The abstraction of the proton from C4 is the rate-limiting
        step of the oxygenase reaction [PMID:12530517]. Due to lack of evidence suggesting an enzymatic
        base we have assumed that the base is water.
