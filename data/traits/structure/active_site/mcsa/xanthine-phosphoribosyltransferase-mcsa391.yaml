    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: alpha-D-5-phosphoribosyl 1-pyrophosphate binds before the purine in an ordered sequential
      mechanism. Once both substrates are in the active site, Asp92 deprotonates the purine which initiates
      a nucleophilic attack upon the C2 of the ribose ring of alpha-D-5-phosphoribosyl 1-pyrophosphate
      in a substitution reaction, eliminating diphosphate.
