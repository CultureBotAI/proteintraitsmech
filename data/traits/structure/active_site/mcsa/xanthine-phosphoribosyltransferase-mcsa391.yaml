  title: Catalytic mechanism of xanthine phosphoribosyltransferase
  description: Mechanism transcribed from M-CSA entry 391. M-CSA does not resolve this one into steps,
    so the whole mechanism is a single node quoting its `mechanism_text`; residue edges are still per-residue.
    Every edge quotes the M-CSA entry; M-CSA's primary references are in the edge notes. Residue nodes
    carry M-CSA/PDB author numbering; the UniProt position in each label was verified against the reference
    sequence (offset +0).
