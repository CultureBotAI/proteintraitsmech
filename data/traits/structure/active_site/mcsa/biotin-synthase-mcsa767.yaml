    predicate_id: RO:0002436
    object: step1
    description: Cys53 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/767/
      snippet: Formation of biotin from dethiobiotin (DTB) requires the abstraction of 2 hydrogen atoms
        from the DTB C6 and C9 carbons. This is carried out by the product of AdoMet reduction, the 5'-deoxyadenosyl
        radical. Two hydrogen atoms are selectively removed from the C9 methyl and C6 methylene positions
        of DTB.  Radicals of C6 and C9 can then react with sulpur atoms , leading to C-S bond formations
        at these positions. [4Fe-4S] clusters of +1 oxidation state are required for this process. Since
        the Fe/S clusters are essential for catalysis, the 3 cluster-chelating Cys residues (Cys 53, Cys
        57 and Cys 60) also have a catalytic effect, and are arranged in a conserved C-X3-C-X2-C cysteine
        triad motif. A fourth cluster ligand, Arg 260 is also essential for catalysis.  The +1 iron-sulphur
        cluster injects one electron into the AdoMet bound in its close proximity. The resulting, unstable
        suphuranyl radical breaks down into methionine and the 5'-deoxyadenosyl radical. This subsequently
        abstracts a hydrogen from a specific carbon atom of a glycine residue in the polypeptide chain.
      notes: M-CSA entry 767, mechanism 1; M-CSA cites PMID:11834738, PMID:11862544, PMID:14704425, PMID:14967042,
        PMID:16042606, PMID:17014080, PMID:21370834, PMID:21859080; step 1
