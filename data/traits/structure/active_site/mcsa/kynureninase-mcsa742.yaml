  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The phosphate of PLP accepts a proton from Tyr226 which then accepts a proton from the
      amine group of L-kynurenine which then nucleophilically attacks the carbon of the C-N bond between
      PLP and Lys227 and as a result releases Lys227.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The secondary amine that results from the initial attack initiates an elimination of
      the covalently bound lysine, resulting in free PLP and lysine in a neutral state.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Lys227 deprotonates the CH adjacent to the bound amine, resulting in double bond rearrangement
      as the PLP acts as an electron sink.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The PLP feeds the electrons back, resulting in the C=C attached to the aromatic ring
      deprotonating Lys227
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Lys227 then abstracts a proton from water so that it can nucleophilically attack the
      carbon of the carbonyl in the Kyurenine ketimine intermediate. The oxygen of the carbonyl accepts
      a proton from Tyr226 which produces the gemdiol intermediate. Tyr266 then accepts a proton from
      the phosphate group.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Tyr226 is deprotonated by the phosphate group of PLP so that in turn it can then deprotonate
      the hydroxyl group of the gemdiol intermediate which results in the cleavage of anthranilate from
      the enamine intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The enamine accepts a proton on its beta carbon.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Lys227 deprotonates the CH adjacent to the amine, resulting in double bond rearrangement
      as PLP acts as an electron sink.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The PLP feeds the electrons back, resulting in the N=C bond deprotonating Lys227.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Lys227 nucleophilically attacks the carbon of the C=N bond which results in the cleavage
      of L-alanine from PLP and its substitution for Lys227 and the proton on the phosphate group is lost
      to the environment which returns the active site back to its native state.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Product
  - node_id: active_site
    label: kynureninase catalytic site
    node_type: MOTIF
    grounding: MCSA:742
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
