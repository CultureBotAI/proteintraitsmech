    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/460/
      snippet: "The catalytic mechanism is a two-step process: (a) The glycosylation step- formation of\
        \ the gycosyl-enzyme complex with aglycon departure. (b) Deglycosylation - hydrolysis of the glycosyl-enzyme\
        \ complex by a nucleophilic water molecule. The mechanism proceeds as follows:
<ol>
<li>The\
        \ substrate binds to the enzyme in the hydrophobic pocket by glucosinolate hydrophobic side chains,\
        \ and with two arginine residues positioned appropriately for interaction with the substrate sulphate\
        \ group. This is via nucleophilic attack of Glu 409 on the substrate anomeric carbon, with aglycon\
        \ departure. Ser 190 defines Glu 409 position and stabilises the glycosyl-enzyme complex by hydrogen\
        \ bonding to the substrate sulphate group. Gln 187 activates a water molecule to assist acglycon\
        \ departure, rather than acting as an acidic residue itself. </li>

<li>The sugar ring is\
        \ bound to the enzyme via an alpha-glycosidic linkage to the Glu 409 residue, the catalytic nucleophile.</li>\
        

<li>Upon formation of the glycosyl-enzyme complex, the salt bridge between Glu 409 and Arg\
        \ 95 is disrupted, and the side chain of Glu 409 aletrs its conformation. </li>

<li>A water\
        \ molecule hydrogen bonds to the Arg 95, whose charge becomes buried. </li>

<li>Formation\
        \ of the glycosyl-enzyme complex is also accompanied by the change in position of Tyr 330, whose\
        \ hydroxyl group points towards the sugar ring O. </li>

<li>hydrolysis of the glycosyl-enzyme\
        \ intermediate by water. During the earlier nucleophilic attack, the water molecule moves closer\
        \ to the C1 of the gly-enzyme complex by hydrogen bonding to the Oe1 of Gln 187. The Gln 187 position\
        \ is defined by hydrogen bonds between Ser 190 gamma-O and Ne2 of Gln 187, and also between N-delta\
        \ -2 of Asn 328 with Oe1 of Gln 187. This ensures precise positioning of the nucleophilic water\
        \ molecule that is required for hydrolysis. If ascorbate is present, then this can activate the\
        \ nucleophilic water <i>via</i> proton abstraction.</li>"
      notes: M-CSA entry 460, mechanism 1; M-CSA cites PMID:10978344, PMID:15889170, PMID:16291087, PMID:19703694,
        PMID:21236711, PMID:26703735, PMID:8952475, PMID:9195886; step 1
