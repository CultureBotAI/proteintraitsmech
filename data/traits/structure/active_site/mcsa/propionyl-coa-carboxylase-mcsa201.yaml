  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Reaction occurs in the alpha-subunit. The bicarbonate is deprotonated by an unidentified
      base (shown as water here). The activate bicarbonate then acts as a nucleophile and attacks the
      gamma-phosphate in a substitution reaction, liberating ADP. Mg(II) stabilises/activates the ATP
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Reaction occurs in the alpha-subunit. The phosphorylated bicarbonate undergoes a decarboxylation
      reaction (E1cb) to liberate carbon dioxide and phosphate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Reaction occurs in the alpha-subunit. The phosphate deprotonates one of the N-H groups
      of biotin with concomitant tautomerisation to produce an oxyanion.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Reaction occurs in the alpha-subunit. The oxyanion re-forms the carbonyl group, causing
      the C=N bond of the activated biotin to add to the carbon dioxide in a nucleophilic manner.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Reaction occurs in the beta-subunit. Once the carboxylated biotin has relocated to the
      beta-subunit, the biotin undergoes a decarboxylation reaction (E1cb) to liberate carbon dioxide
      and the activated biotin molecule. the main chain amides of Gly419B and Ala420B stabilise the oxyanion
      of the activated biotin.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Reaction occurs in the beta-subunit. The oxyanion re-forms the carbonyl group, causing
      the C=N bond of the activated biotin to deprotonate the propanoyl-CoA with concomitant tautomerisation.
      The main chain amides of Gly182 and Gly183 stabilise the activated propanoyl-CoA, the main chain
      amides of Gly419B and Ala420B stabilise the oxyanion of the activated biotin.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Reaction occurs in the beta-subunit. The oxyanion re-forms the carbonyl group causing
      the C=C bond of the activated propanoyl-CoA to add to the carbon dioxide molecule in an electrophilic
      manner.
