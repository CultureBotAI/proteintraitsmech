      It has been suggested that the ground state is destabilised due to the interactions between the
      hydrophobic pocket and the negatively-charged carboxylate of 3-dehydro-L-gulonate 6-phosphate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The enediolate can be protonated from either the re- or si-face. The si-face water is
      protonated by His136 to allow it to act as a proton shuttle. However, if the protonation occurs
      at the re-face, Arg139A has been proposed to be the proton source. Since protonation at the si-face
      is favoured in a roughly 2:1 ratio, this is the mechanism that has been shown.
