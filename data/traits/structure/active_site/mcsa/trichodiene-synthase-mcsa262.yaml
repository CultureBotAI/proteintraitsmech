  - node_id: reactant0
    label: 2-trans,6-trans-farnesyl diphosphate(3-)
    node_type: CHEMICAL
    grounding: CHEBI:175763
  - node_id: product0
    label: trichodiene
    node_type: CHEMICAL
    grounding: CHEBI:15861
  - node_id: product1
    label: diphosphate(3-)
    node_type: CHEMICAL
    grounding: CHEBI:33019
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The binding of the substrate causes a conformation change in the active site, which promotes
      the elimination of the pyrophosphate. The substrate is ionised by the dipohsphate interactions with
      the Mg(II) ions, Arg304, Lys232, Arg182 and Tyr305. Positive charge of carbo cation delocalised
      over the three terminal carbon atoms.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Recapture of one of the alpha-phosphate oxygens by the C3 cation results in formation
      of (3R)-nerolidyl diphosphate [PMID:11698643] in a nucleophilic addition reaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: "Intramolecular elimination of the pyrophosphate. 
Free rotation about the C2-C3 bond\
      \ from the transoid to cisoid conformation orientates the empty p orbital of C1 in the cation towards\
      \ the C6-C7 pi orbital to facilitate the C1-C6 bond formation. It is currently unclear is this is\
      \ concomitant with, or prior to the dipohsphate departure [PMID:11698643]. The positive charge of\
      \ carbo cation delocalis"
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Intramolecular electrophilic addition across the C1-C6 bond to form the six-membered
      ring. Positive charge on the C7 may be stabilised by the cation-pi interaction with the side chain
      of Tyr93.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Intramolecular electrophilic addition across the C10-C7 bond to form the five-membered
      ring. The C10 carbocation is stabilised through long range electrostatic interactions with Asp100
      and the pyrophosphate [PMID:11698643].
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: This final carbocation is quenched by proton elimination from C12, mediated by the pyrophosphate.
      This proton abstraction initiates the first methyl migration, followed by a second methyl migration
      and finally a 1,4-hydride shift.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: trichodiene synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:262
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
