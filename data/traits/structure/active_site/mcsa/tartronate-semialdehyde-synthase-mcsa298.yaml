  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The cofactor undergoes an intramolecular proton transfer between the pyrimidine and thiazole
      ring, forming a carbon-nitrogen ylid.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbanion of thiamine diphosphate initiates a nucleophilic attack on the carbonyl
      carbon of glyoxylate in an addition reaction. The conjugated double bond system of the cofactor
      undergoes rearrangement.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The glyoxylate-TDP adduct undergoes decarboxylation with concomitant bond rearrangement
      on the thiazole ring. The aliphatic region around the cofactor encourages decarboxylation through
      polar, non-polar interactions, which act to increase the ground state energy of the intermediate
      towards that of the transition state [PMID:18176558, PMID:15501823, PMID:15709735]
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The nitrogen of the thiazole ring initiates conjugate nucleophilic attack at the carbonyl
      of the second glyoxylate molecule, with inferred, concomitant, intramolecular proton rearrangement.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The oxyanion initiates elimination, forming the single S enantiomer of 2-Hydroxy-3-oxopropanoate
      and regenerating the activated form of the thiamine diphosphate cofactor.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Protonation at the C2 position regenerates the thiamine diphosphate cofactor, and the
      enzyme active site.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
