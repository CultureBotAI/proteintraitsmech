    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Tyr140 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/371/
      snippet: The oxidation reaction is believed to occur in two steps - dehydrogenation at the alpha-carbon
        to form a carbonyl and decarboxylation at the beta-carbon. First, Asp 222 B deprotonates the 2-hydroxy
        oxygen, followed by the formation of a double bond forcing hydride transfer from C2 to NAD(P).
        In the case of isocitrate dehydrogenase, the intermediate so formed is oxalosuccinate and is stable
        enough to be isolated. In vivo, however, the beta-carboxylate group is rapidly lost and C3 is
        stereospecifically protonated to form the product. Lys 190 B is vital for the decarboxylation
        step in providing the proton, and the Tyr 140 A hydroxyl is very important for the oxidation step
        in participating in hydride transfer. Magnesium stabilises the negative charge on the hydroxyl
        oxygen during the dehydrogenation and decarboxylation steps.
      notes: M-CSA entry 371, mechanism 2; M-CSA cites PMID:12855708, PMID:16767773, PMID:17634983, PMID:1888729,
