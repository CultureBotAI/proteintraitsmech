causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of aldehyde dehydrogenase (FAD-independent)
  description: Stepwise mechanism transcribed from M-CSA entry 105 (5 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: glu869
    label: catalytic Glu869 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:Q46509
    description: 'M-CSA roles: covalently attached, hydrogen bond acceptor, hydrogen bond donor, metal
      ligand, nucleofuge, nucleophile, proton acceptor, proton donor.'
  - node_id: reactant0
    label: aldehyde
    node_type: CHEMICAL
    grounding: CHEBI:17478
  - node_id: reactant1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: reactant2
    label: 1,4-benzoquinones
    node_type: CHEMICAL
    grounding: CHEBI:132124
  - node_id: product0
    label: carboxylic acid
    node_type: CHEMICAL
    grounding: CHEBI:33575
  - node_id: product1
    label: hydroquinones
    node_type: CHEMICAL
    grounding: CHEBI:24646
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu869 deprotonates the water in the coordination sphere of Mo(VI), which initiates a
      nucleophilic attack on the aldehyde in a substitution reaction, which eliminates a hydride ion,
      which adds to the sulfur dianion which is also in the Mo(VI) coordination sphere, eventually reducing
      Mo(VI) to Mo(IV).
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Water deprotonates Glu869, which initiates a nucleophilic attack on the Mo(IV) centre,
      displacing the carboxylic acid product in a substitution reaction.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: A single electron is transferred from Mo(IV) to an acceptor via two iron-sulfur clusters.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Water deprotonates the thiolate group part of the Mo(V) coordination sphere, causing
      the elimination of Glu869 from the Mo(V) coordination sphere, and transfer of the second electron
      from Mo(V) to the acceptor via two iron-sulfur clusters.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: aldehyde dehydrogenase (FAD-independent) catalytic site
    node_type: MOTIF
    grounding: MCSA:105
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
