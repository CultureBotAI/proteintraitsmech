  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The carboxylate group of the substrate L-tyrosine acts as a nucleophile and attacks the
      alpha-phosphate of the ATP in a substitution reaction that liberates pyrophosphate. Mg(II) and all
      catalytic residues stabilise the intermediates formed. Thr234 also affects the steric outcome of
      the reaction.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The phosphate of the tyrosine-AMP complex deprotonates the OH of the ribose ring, which
      acts as a nucleophile to attack the carbonyl group of the tyrosine in the tyrosine-AMP complex in
      a substitution reaction, liberating AMP. Mg(II), Thr40, His48, Lys82, Arg86 and Gln173 all stabilise
      the intermediates formed.
