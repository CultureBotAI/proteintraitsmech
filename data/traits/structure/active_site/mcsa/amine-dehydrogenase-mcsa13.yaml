    label: mechanism step 1
    node_type: STATE
    description: Asp76 deprotonates methylamine.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Methylamine initiates a nucleophilic attack on the carbonyl carbon of the TQQ cofactor
      in an addition reaction with concomitant deprotonation of the amine nitrogen.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The amine nitrogen lone pair initiates the elimination of water with concomitant deprotonation
      of the amine nitrogen.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Water deprotonates Asp76.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Asp76 deprotonated the alpha-carbon with concomitant double bond rearrangement into the
      TQQ cofactor.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The amide nitrogen deprotonates water, which initiates a nucleophilic attack on the alpha-carbon
      in an addition reaction.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Asp32 deprotonates the newly added hydroxyl group, eliminating the cofactor with concomitant
      deprotonation of Asp76, the formaldehyde products is released.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Asp76 deprotonates the amine nitrogen, with concomitant double bond rearrangement and
      a single electron transfer from the cofactor to amicyanin. Produces a delocalised radical charge
      over the intermediate N-C=C-O and the aromatic ring.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: A single electron is transferred to the heme group of the cytochrome.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The amide nitrogen deprotonates water, which initiates a nucleophilic attack on the carbon
      of the cofactor in an addition reaction
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The amine nitrogen deprotonates the newly added hydroxyl group, which eliminates ammonia.
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: Ammonia deprotonates Asp32 and water deprotonates Asp76 in an inferred return step.
  - node_id: step13
