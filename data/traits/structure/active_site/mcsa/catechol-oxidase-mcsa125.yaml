    label: 1,2-benzoquinone
    node_type: CHEMICAL
    grounding: CHEBI:17253
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The bridging hydroxide deprotonates the benzene-1,2-diol, which initiates a nucleophilic
      attack on the Cu(I) centre, initiating a single electron transfer to dioxygen. The dioxygen radical
      then replaces the water as the bridging ligand between the two copper centres.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The dioxygen radical abstracts a hydrogen from the other hydroxyl group on the Cu-bound
      intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion collapses, initiating double bond rearrangement that forms 1,2-benzoquinone
      and causes a single electron to be transferred to the Cu(II) centre.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The anionic oxygen of the peroxide group deprotonates the second molecule of  benzene-1,2-diol,
      which causes a hydride to be eliminated from the second phenol group, and cleaved of the peroxo
      bond. The second Cu(I) centre donates a single electron to the second phenol group.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The phenolate undergoes double bond rearrangement that causes a single electron to be
      donated back to the Cu(II) centre, and formation of 1,2-benzoquinone.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: catechol oxidase catalytic site
    node_type: MOTIF
    grounding: MCSA:125
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
