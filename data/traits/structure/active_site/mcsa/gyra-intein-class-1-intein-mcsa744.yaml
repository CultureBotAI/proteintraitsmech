  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Cys1 performs a N-S switch by attacking the carbonly carbon of Ala0. The adjacent N-C
      bond is broken and a S-C bond is formed.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: His75 donates a proton causing the intermediate to collapse. Thr199 performs a nucleophilic
      attack on the carbonyl carbon of Ala0. Its inferred that the hydrogen from Thr199 is taken by the
      solution.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His187 deprotonates Asn198 nitrogen side chain while Val182 stabilises the deprotonated
      nitrogen via its main chain amide. Asn198 then proceeds to attack the upstream carbonyl carbon between
      itself and Thr199. Creating a cyclic molecule and detaching Thr199 and C-extein from the rest of
      the intein.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The last step is the O-N shift which proceeds by the main chain amide of Thr199 attacking
      the carbonyl carbon and breaking the C-O bond. This step is stabilised by a oxyanion hole made out
      of Asn74 and Thr72. Its inferred by the curator that the Thr199 oxygen receives its proton from
      the -NH<sub>2</sub> group.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Final product.
  - node_id: active_site
    label: GyrA intein (Class 1 intein) catalytic site
    node_type: MOTIF
    grounding: MCSA:744
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
