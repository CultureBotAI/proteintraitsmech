  - subject: glu114
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Glu114 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/749/
      snippet: 'The mechanism is not yet clearly understood, but a mechanism using a oxo-ferryl intermediate
        is consistent with spectroscopic, mutagenic and structural evidence. LP heme is the peroxidatic
        heme, and HP heme is the route of electron transfer from the cytochromes to the LP heme. Trp 94
        is likely to function as an electron transfer residue, connecting the propionate groups of the
        two heme cofactors. The most supported model for the redox mechanism is:  The inactive form of
        the enzyme has no calcium, HP heme with Fe(III) in high / low spin equilibrium, and LP heme with
        low spin Fe(III). Calcium binds; cytochrome c delivers an electron to HP heme which becomes low
        spin with Fe(II). The enzyme is now activated.  Hydrogen peroxide binds to LP heme. Glu 114 acts
        as an acid/base catalyst to transfer one of the protons of H2O2 to the other oxygen atom, thus
        encouraging O-O bond cleavage and loss of water. An LP heme Fe(IV)=O oxo-ferryl species is formed.
        HP heme is oxidised to Fe(III).  A second cytochrome c delivers an electron to LP heme (via HP
        heme and Trp 94); along with two protons (method of proton delivery not known), this reduces the
        Fe(IV)=O into Fe(III) and water. A third cytochrome c delivers an electron to HP heme, reducing
        its Fe(III) into Fe(II). The enzyme is now back in the active mixed valence form.'
      notes: M-CSA entry 749, mechanism 1; M-CSA cites PMID:15274917, PMID:16314410, PMID:2169873, PMID:23558243,
