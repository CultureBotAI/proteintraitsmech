    predicate_id: RO:0002436
    object: step1
    description: Ser202 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/453/
      snippet: The enzyme contains a catalytic triad Ser202-His338-Asp308. The mechanism is believed to
        follow that of a typical esterase. Ser202 is deprotonated by His338 and subsequently attacks the
        carbonyl moiety in the ester linkage. The tetrahedral intermediate collapses and the negatively
        charged oxygen deprotonates His338 to form an alcohol functional group. His338 then deprotonates
        a water molecule to form a nucleophile, which subsequently attacks the carbonyl moiety, forming
        a second tetrahedral intermediate. The collapse of this results in Ser202 being eliminated as
        a leaving group and a carboxylic acid function group being formed resulting in the products of
        hydrolysis.
      notes: M-CSA entry 453, mechanism 2; M-CSA cites PMID:10201402, PMID:11061974, PMID:17625021, PMID:27328716,
