  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: "DsbB contains the Cys41-Cys44 and Cys104-Cys130 disulfide bonds in the resting state.\
      

In the DsbA-DsbB complex, DsbA causes a conformational change which separates Cys104 and Cys130.\
      


The rapid pathway begins when Cys33 of DsbA attacks the intermolecular Cys104 (DsbB) -\
      \ Cys30 (DbsA) disulfide bond. This forms the Cys30 - Cys33 disulfide product in DsbA."
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Cys130 then initiates nucleophilic attack the Cys44-Cys41 disulfide bond. This is the
      first step in a dithiol disulfide exchange between the active site residues.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: There is nucleophilic attack of Cys104 on the Cys130-Cys41 disulfide bond. In comparison
      to the original resting state of DsbB, the Cys41-Cys44 disulfide bond has been reduced by two electrons.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Cys44 forms a charge transfer complex with ubiquinone before initiating nucleophilic
      attack and forming an adduct. Arg48 stabilises Cys44 and the adduct formed.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The S-C covalent linkage in the adduct is attacked by Cys41, reforming the Cys41-Cys44
      disulfide bond and resulting in a quinol. The quinol is subsequently protonated to complete the
      reaction.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: protein disulfide oxidoreductase catalytic site
    node_type: MOTIF
    grounding: MCSA:734
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 1.20.1550.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:1.20.1550.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
