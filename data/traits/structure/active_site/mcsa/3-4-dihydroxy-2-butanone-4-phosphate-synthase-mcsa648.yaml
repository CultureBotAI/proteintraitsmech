  - subject: asp30
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Asp30 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/648/
      snippet: A His-Asn dyad is central to the proposed mechanism of L-3,4-Dihydroxy-2-butanone-4-phosphate
        synthase. An initial enolisation step is mediated by Glu 185 acting as a general base to abstract
        the C3 proton in concert with the donation of a proton to the C2 carbonyl oxygen by His 147. Stabilisation
        of the enolate occurs via His 147, Asn 106 and Tyr 95. Dehydration is assisted by Cys 55 acting
        as a general acid. The enol is ketonised by an acid-base process with the C2 hydroxyl deprotonated
        by His 147 and a proton donated to C1 by Glu 185. A skeleton rearrangement is initiated by deprotonation
        of the C4 hydroxyl by Asp 30. Hydration by a magnesium-associated water follows with proton donation
        from His 147 yields the enolate intermediate, which binds to one magnesium only so that Glu 185
        can deprotonate the C2 hydroxyl and the final product is generated by protonation by a magnesium-activated
        water.
      notes: M-CSA entry 648, mechanism 1; M-CSA cites PMID:11827524, PMID:12200440, PMID:12904291; step
        1
