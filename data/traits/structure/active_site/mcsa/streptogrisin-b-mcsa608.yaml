  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: His147 deprotonates Ser255 which activates it to attack the carbon of the peptide bond
      in a nucleophilic addition and form the oxyanion intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Collapse of the tetrahedral intermediate with protonation of the departing amine leaving
      group by His147 generates an acyl-enzyme intermediate and releases one product.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: His147 abstracts a proton from a water which activates it to attack the carbon of the
      ester bond in a nucleophilic addition.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The tetrahedral intermediate collapses which results in the cleavage of the ester bond
      releasing Ser255 and the other product. The released Ser255 then accepts a proton from His147 which
      returns the enzyme to its native state.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Product
  - node_id: active_site
    label: streptogrisin B catalytic site
