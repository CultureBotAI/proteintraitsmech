    label: mechanism step 1
    node_type: STATE
    description: The anionic Cys164 attacks at the 4-coumaroyl-CoA thio-carbonyl, forming an anionic tetrahedral
      intermediate.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The tetrahedral intermediate collapses, eliminating coenzyme A and foming a covalently
      bonded substrate-enzyme intermediate.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The polar-nonpolar interaction of Phe215 and malonyl-CoA drives decarboxylation to form
      the enolate intermediate which is stabilised through hydrogen bonding with Asn336.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The enolate intermediate attacks the thio-carbonyl, forming an anionic tetrahedral intermediate
      while extending the carbon chain by two units.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The tetrahedral intermediate collapses, eliminating the Cys164 sidechain. The position
