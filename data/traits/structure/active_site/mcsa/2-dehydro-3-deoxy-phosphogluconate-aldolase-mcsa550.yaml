  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The glyceraldehyde-3-phosphate is then attacked by this intermediate at its carbonyl
      functionality in an aldol addition, with simultaneous protonation from Glu45 via the water molecule.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: A hydrolytic water then attacks the imine upon deprotonation by Glu45 forming a tetrahedral
      intermediate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The amine group of the intermediate accepts a proton from Glu45 via a water molecule,
      to create a better leaving group.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The tetrahedral intermediate collapses releasing  Lys133 and forming the product with
      concomitant deprotonation of the hydroxyl by Glu45.
