  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The activated Lys133 performs a nucleophilic attack on the pyruvate carbonyl.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The concomitant protonation of the hydroxyl by Glu45 leads to  water being eliminated
      and an imine intermediate being formed.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Glu45 initiates tautomerisation via proton transfer with the eliminated water, forming
