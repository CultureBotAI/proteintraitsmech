  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The carboxylate group of gamma-L-glutamyl-L-cysteine acts as a nucleophile and attacks
      the alpha-phoposphate of ATP in a substitution reaction, liberating ADP. The two Mg(II) ions, Lys160,
      Arg210 and Arg225 all stabilise the intermediates formed.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The amine group of L-glycine acts as a nucleophile and attacks the carbonyl group of
      the phosphorylated substrate in an addition reaction. The two Mg(II) ions, Lys160, Arg210 and Arg225
      all stabilise the intermediates formed.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion formed re-forms the carbonyl group, cleaving the P-O bond in a conjugate
      base elimination reaction. The leaving phosphate group deprotonates the newly formed secondary amine.
      The two Mg(II) ions, Lys160, Arg210 and Arg225 all stabilise the intermediates formed.
