    object: step1
    description: Gly91 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/779/
      snippet: The reaction proceeds through in-line nucleophilic attack of a water molecule on the gamma
        phosphate of ATP which happens via Asp 235 which activates the water molecule by accepting a proton.
        Thus the nucleophile can then go on to attack the gamma phosphate. This results in a pentavalent
        phosphate transition state stabilised by contacts with the amide groups and side chains of Gly
        91, Gly 93, Lys 94, Ser 95, Tyr 96 and the Magnesium ion at the active site. The pentavalent phosphate
        transition state then collapses to release ADP and Pi, resulting in the conformational change
        that powers the extension of the microtubules.
