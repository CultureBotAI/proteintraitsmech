  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The carbanion of thiamine diphosphate initiates a nucleophilic attack on the carbonyl
      carbon of pyruvate in an addition reaction
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The oxyanion formed deprotonates His271C
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The covalently bound intermediate undergoes decarboxylation.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The carbanion formed by decarboxylation initiates a nucleophilic attack on the second
      substrate in an addition reaction with concomitant deprotonation of His128.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: His271C deprotonates the hydroxyl in an elimination which reforms the carbanionic form
      of ThDP and produces the second product.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The carbanion of the thiamine diphosphate cofactor deprotonates the adjacent amine, which
      initiates double bond rearrangement that results in the deprotonation of Glu59.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: His128 deprotonates water in an inferred return step.
