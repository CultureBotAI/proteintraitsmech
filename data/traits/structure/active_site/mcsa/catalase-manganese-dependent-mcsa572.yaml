    label: mechanism step 4
    node_type: STATE
    description: Glu178 protonates the peroxide bridge, polarising the O-O bond and activating it towards
      heterolytic cleavage. There is loss of a water molecule and the Mn cluster is reoxidised by two
      electron tranfser to regenerate the active site.
