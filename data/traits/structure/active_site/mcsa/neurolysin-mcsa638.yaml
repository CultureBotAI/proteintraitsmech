    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: Glu498 and the Zinc ion act together to activate water by deprotonation so that it can
      act as a nucleophile and attack the peptide bond. This will form a tetrahedral intermediate, which
      is stabilised by the oxyanion hole, made up of the Zinc ion and the OH group of Tyr613. Subsequent
      protonation of the leaving group by Glu498 results in the collapse of the intermediate and the formation
      of product
