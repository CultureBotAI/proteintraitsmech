  - subject: lys116
    predicate: participates in (chemical step)
    predicate_id: RO:0002436
    object: step1
    description: Lys116 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/450/
      snippet: "The overall mechanism involves three reversible steps. The nicked DNA substrate is formed\
        \ by annealing two short oligonucleotides to a longer complementary oligonucleotide. First, a\
        \ covalently adenylated enzyme intermediate is formed by the transfer of the adenylate group of\
        \ NAD+ to the E-amino group of Lys116. Second, the adenylate moiety is transferred from the enzyme\
        \ to the 5'-terminal phosphate on one of the oligomers (oligomer A). Finally, a phosphodiester\
        \ bond is formed by a nucleophilic attack of the 3'-hydroxyl terminus of the other oligomer (oligomer\
        \ B) on the activated 5'-phosphoryl group of oligomer A in an Sn2 like mechanism with a pentavalent\
        \ phosphorous transition state. 

Two Mg(2+) binding sites have been identified within the\
        \ catalytic site (although the metals are not present in the pdb 1dgs) . The positive charge stabilises\
        \ the developing negative charge of the pentavalent transition state and also the charged reaction\
        \ intermediates."
