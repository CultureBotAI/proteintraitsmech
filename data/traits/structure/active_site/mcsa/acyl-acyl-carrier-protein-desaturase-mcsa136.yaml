  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Ferredoxin donates a single electron, through Trp62, Asp228 and His146, to one of the
      Fe(III) centres.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Ferredoxin donates a second single electron, through Trp62, Asp228 and His146, to the
      second Fe(III) centre, which initiates the loss of the bridging O<sup>2-</sup> ion. This oxygen
      atom is displaced by dioxygen.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: Water coordinates to one of the Fe(II) centres, which causes the centre to donate a single
      electron to the dioxide molecule, initiating the first of two homolytic additions of the dioxygen
      molecule to both Fe(II) centres and the second Fe(II) centre also donates a single electron to the
      dioxygen bridge.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Both Fe(III) centres donate a single electron to the bridging dioxygen, cleaving the
      O-O bond and initiating one of the oxygen atoms to deprotonates the bound water and regenerating
      the oxo-bridge.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The hydroxide on the first Fe(IV) centre deprotonates the stearoyl-[acyl-carrier protein]
      substrate, initiating the elimination of a hydride ion, which attacks the second Fe(IV) bound hydroxide.
      The excess electrons are donated singly to both Fe(IV) centres, regenerating the enzyme.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products.
