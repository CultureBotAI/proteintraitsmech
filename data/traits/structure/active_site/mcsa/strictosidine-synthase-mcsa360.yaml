causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of strictosidine synthase
  description: Stepwise mechanism transcribed from M-CSA entry 360 (7 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering
    only — no unique offset to the record's reference sequence could be verified, so no UniProt position
    is asserted.
  nodes:
  - node_id: glu309
    label: catalytic Glu309 (M-CSA/PDB numbering; UniProt position not established)
    node_type: RESIDUE
    grounding: UniProtKB:P68175
    description: 'M-CSA roles: activator, hydrogen bond acceptor, hydrogen bond donor, increase nucleophilicity,
      proton acceptor, proton donor.'
  - node_id: reactant0
    label: tryptaminium
    node_type: CHEMICAL
    grounding: CHEBI:57887
  - node_id: reactant1
    label: (-)-secologanin
    node_type: CHEMICAL
    grounding: CHEBI:18002
  - node_id: product0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product1
    label: 3alpha(S)-strictosidinium(1+)
    node_type: CHEMICAL
    grounding: CHEBI:58193
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu309 deprotonates the primary amine of tryptamine, initiating nucleophilic attack at
      the aldehyde group of secologanin.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: An internal proton rearrangement occurs.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The secondary amine eliminates water, forming a Schiff base intermediate.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The indole double bond attacks the imine, forming a carbon-carbon bond and a carbocation
      stabilised through conjugation.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: The Glu309 abstracts the proton alpha to the carbocation, forming a double bond.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The secondary amide deprotonates Glu309, regenerating the active site. The active site
      is burried, preventing access of solvent molecules to the intermediates formed during the reaction.
      Therefore, the product is shown here as deprotonating the general base, to allow for further catalysis,
      rather than proton abstraction by a solvent molecule [PMID:18280746].
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: strictosidine synthase catalytic site
    node_type: MOTIF
    grounding: MCSA:360
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
