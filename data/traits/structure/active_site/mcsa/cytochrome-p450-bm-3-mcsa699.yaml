definitions:
  - kind: MECHANISTIC
    text: >-
      Cytochromes P450, a gene superfamily of heme proteins found in all eukaryotes, most prokaryotes, and Archaea, catalyse the mono-oxygenation of a wide variety of organic molecules. P450 reactions of biological significance include steroid bio-genesis, drug metabolism, procarcinogen activation, xenobiotic detoxification, and fatty acid metabolism. P450BM-3 consists of heme (BMP) and FMN/FAD containing reductase domains linked together by a single polypeptide.
    source: "M-CSA"
    method: SOURCED
causal_graphs:
- graph_id: catalysis
  title: Catalytic mechanism of cytochrome P450 (BM-3)
  description: Stepwise mechanism transcribed from M-CSA entry 699 (8 steps). Every edge quotes the M-CSA
    entry; M-CSA's primary references are in the edge notes. Residue nodes carry M-CSA/PDB author numbering;
    the UniProt position in each label was verified against the reference sequence (offset +1).
  nodes:
  - node_id: thr268
    label: catalytic Thr268 (M-CSA/PDB numbering; UniProt residue 269)
    node_type: RESIDUE
    grounding: UniProtKB:P14779
    description: 'M-CSA roles: electrostatic stabiliser, steric role.'
  - node_id: phe393
    label: catalytic Phe393 (M-CSA/PDB numbering; UniProt residue 394)
    node_type: RESIDUE
    grounding: UniProtKB:P14779
    description: 'M-CSA roles: electrostatic stabiliser, steric role.'
  - node_id: cys400
    label: catalytic Cys400 (M-CSA/PDB numbering; UniProt residue 401)
    node_type: RESIDUE
    grounding: UniProtKB:P14779
    description: 'M-CSA roles: electrostatic stabiliser.'
  - node_id: reactant0
    label: dioxygen
    node_type: CHEMICAL
    grounding: CHEBI:15379
  - node_id: reactant1
    label: estrone
    node_type: CHEMICAL
    grounding: CHEBI:17263
  - node_id: reactant2
    label: hydron
    node_type: CHEMICAL
    grounding: CHEBI:15378
  - node_id: reactant3
    label: NADH(2-)
    node_type: CHEMICAL
    grounding: CHEBI:57945
  - node_id: product0
    label: NAD(+)
    node_type: CHEMICAL
    grounding: CHEBI:15846
  - node_id: product1
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: product2
    label: 2-hydroxyestrone
    node_type: CHEMICAL
    grounding: CHEBI:1156
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: The substrate binds to the active site. Fe(III) is reduced to Fe(II) by an electron which
      is transferred from the FAD/FMN domain via NADH, FAD and FMN.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: Oxygen binds to the heme group and Fe(II) is oxidised back to Fe(III).
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: A second electron is transferred to the heme from NADH, forming NAD and a superoxide
      species.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The superoxide is rapidly protonated by a water molecule to form a hyroperoxide.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Further protonation of the hydroperoxide oxygen atom leads to heterolysis of the O-O
      bond and release of water.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The radical oxo group removes a hydrogen from the substrate.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: The carbon radical attacks the oxygen of the hydroxyl group and forms the product. Fe(IV)
      is reduced back to Fe(III) and the native state of the enzyme is restored.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: cytochrome P450 (BM-3) catalytic site
    node_type: MOTIF
    grounding: MCSA:699
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
  - node_id: fold
    label: 1.10.630.10 superfamily fold
    node_type: DOMAIN
    grounding: CATH:1.10.630.10
    description: KB trait record; CATH domain assigned by M-CSA to the catalytic chain.
  - node_id: activity
    label: cytochrome P450 (BM-3) activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0016712
    description: GO molecular function for EC:1.14.14.1, via GO's own ec2go mapping.
    xrefs:
    - EC:1.14.14.1
  edges:
  - subject: step1
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: step2
    description: Step 1 leads to step 2.
