  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: The mechanism proceeds via a two step process. In the first step, the enzyme is oxidised
      by hydrogen peroxide to an intermediate, Compound I, which in the second stage is reduced back to
      the original resting state releasing water and molecular oxygen. The total reaction is 2 moles of
      hydrogen peroxide gives 2 moles of water and one mole of oxygen.  H2O2 enters the active site and
      binds to the heme
