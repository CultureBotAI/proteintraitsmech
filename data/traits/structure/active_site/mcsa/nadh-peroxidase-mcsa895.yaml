    description: His10 acts in step 1.
    evidence:
    - reference: https://www.ebi.ac.uk/thornton-srv/m-csa/entry/895/
      snippet: "<p>Initially, Cys42 is present as the thiolate S- ion which is catalytically competent.\
        \ The peroxide binds to the active site and is predicted to hydrogen bond via an oxygen to the\
        \ His10 N-H group. As the thiolate anion performs nucleophilic attack on the O-O bond of peroxide,\
        \ His10 donates a proton the the leaving hydroxide to form water. Simultaneously a proton is donated\
        \ by Arg303 to the second His10 nitrogen maintaining its neutral charge. As a result sulfenic\
        \ acid is formed, which is then reduced to complete the catalytic cycle. </p>   

<p>NADH\
        \ binds parallel to FAD on the re face with C4 in a position such that a direct hydride transfer\
        \ to N5 of FAD occurs. FAD is thus reduced to FADH2 with the aid of a proton. A hydride is then\
        \ transferred to Cys-SOH, which lies parallel to the si face of FAD, causing lysis of the S-O\
        \ bond and formation of a second water and thiolate, returning the enzyme to its initial state.</p>"
