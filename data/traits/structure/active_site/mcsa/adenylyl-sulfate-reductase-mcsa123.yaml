        \ an addition reaction.</p>

<p>The negative charge is delocalised primarily over the N1-C=O2\
        \ group but also over the entire isoalloxazine ring including atom N5. The counter-balancing positive\
        \ charge necessary to maintain the unprotonated state is provided by two hydrogen bonds donated\
        \ from the polypeptide to the O2 atom of FAD and by the large dipole of the 30 Angstroms long\
        \ helix that is pointing with its N-terminus directly toward the N1 atom [PMID:11842205]. By inspection\
        \ of the crystal structure we attribute the stabilisation role to the main-chain amide of Asn74\
        \ and to the side-chain of Ser449. Main-chain amide of Ser449 is an hydrogen bond donor to N1\
        \ of the isoalloxazine ring. The formation of the short-lived FAD-APS transition state is most\
        \ likely the rate-limiting step [PMID:16503650].</p>"
