    node_type: CHEMICAL
    grounding: CHEBI:28053
  - node_id: product0
    label: D-galactopyranose
    node_type: CHEMICAL
    grounding: CHEBI:4139
  - node_id: product1
    label: D-glucopyranose
    node_type: CHEMICAL
    grounding: CHEBI:4167
  - node_id: step1
    label: overall catalytic mechanism (not resolved into steps by M-CSA)
    node_type: STATE
    description: Glycoside hydrolase family 27 enzymes are all thought to proceed via a double displacement
      mechanism with retention of sterochemistry at the anomeric carbon. In this mechanism, one of the
      two catalytic aspartate residues acts as a nucleophile and becomes attached to the anomeric carbon
      of the sugar substrate. The other aspartate acts as a general acid/base which activates the catalytic
      water.
