- graph_id: catalysis
  title: Catalytic mechanism of alpha-galactosidase
  description: Mechanism transcribed from M-CSA entry 913. M-CSA does not resolve this one into steps,
    so the whole mechanism is a single node quoting its `mechanism_text`; residue edges are still per-residue.
    Every edge quotes the M-CSA entry; M-CSA's primary references are in the edge notes. Residue nodes
    carry M-CSA/PDB author numbering only — no unique offset to the record's reference sequence could
    be verified, so no UniProt position is asserted.
  nodes:
  - node_id: asp130
    label: catalytic Asp130 (M-CSA/PDB numbering; UniProt residue 185)
    node_type: RESIDUE
    grounding: UniProtKB:Q9FXT4
    description: 'M-CSA roles: covalent catalysis.'
  - node_id: asp185
    label: catalytic Asp185 (M-CSA/PDB numbering; UniProt residue 240)
    node_type: RESIDUE
    grounding: UniProtKB:Q9FXT4
    description: 'M-CSA roles: proton shuttle (general acid/base).'
  - node_id: reactant0
    label: water
    node_type: CHEMICAL
    grounding: CHEBI:15377
  - node_id: reactant1
