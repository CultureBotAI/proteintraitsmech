      cofactor. In the methylated form of the enzyme, His759 and Asp757 share a single proton with one
      neg
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The cob(I)alamin initiates a nucleophilic attack on the methyl group of methyltetrahydrofolate,
      proceeding through a three centre two electron bond, to form the methylcobalamin and covalently
      bound tetrahydrofolate. It is assumed that this reaction proceeds <i>via</i> a three center, two
      electron bond between the N, Co and C of the methyl group [PMID:11076529].
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The tetrahydrofolate product dissociated from the cobalamin cofactor with protonation
      (assumed to be from the bulk solvent). It is not clear when the protonation occurs, it is thought
      that protonation of the leaving group is esential for the cleavage of the Co-N bond. It is assumed
      that this proton comes from the bulk solvent. [PMID:11076529]
