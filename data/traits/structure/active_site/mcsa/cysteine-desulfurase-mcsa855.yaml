      intermediate. It is proposed His123 acts as the general base.
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: Cys354 acts as a general acid to protonate C4 to form a ketimine intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Cys364 is activated to act as a nucleophile and attack the thiol group on the substrate
      cysteine.
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Ala-enamine intermediate is protonated at C-beta by His123 to form Ala-ketamine.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: His123 deprotonates C4 on Ala-ketimine to form Ala-quinonoid intermediate.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: Quinonoid intermediate deprotonates His123 to form an Ala-aldimine intermediate.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: Lys226 acts as a nucleophile and attacks C4  to again form a geminal diamine intermediate.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: Like before, tetrahedral intermediate collapse is coupled to proton transfer releasing
      L-alanine product.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: Products.
