  - node_id: product2
    label: acetate
    node_type: CHEMICAL
    grounding: CHEBI:30089
  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Glu50' deprotonates the thiamine diphosphate cofactor at the N1 position. This initiates
      double bond rearrangement which results in the deprotonation of the N=CH-S group. This activates
      the cofactor towards electrophilic attack.
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The thiamine diphosphate cofactor maintains the canonical V conformation [PMID:18988747].
      The carbanion of thiamine diphosphate initiates a nucleophilic attack on the carbonyl carbon of
      pyruvate in an addition reaction. The conjugated double bond system of the cofactor undergoes rearrangement
      which results in the deprotonation of Glu50'.
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The covalently bound pyruvate undergoes decarboxylation. The interactions between the
      thiamine diphosphate-pyruvate adduct and surrounding residues direct a reactive conformation which
      lowers the reaction barrier towards decarboxylation [PMID:18988747, PMID:11104678]. This step is
      not thought to be rate determining [PMID:19476487].
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: A single electron is transferred from the high energy thamine diphosphate enamine intermediate
      to the FAD cofactor. This results in bond order rearrangement and deprotonation of the alcohol group
      present on the intermediate.
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Tautomerisation of the radical intermediate occurs. The product of the rearrangement
      is required in the next reaction step [PMID:19476487].
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: The thiamine ring nitrogen acts as an electron sink in the formation of a second radical
      tautomer.
  - node_id: step7
    label: mechanism step 7
    node_type: STATE
    description: Water acts as a nucleophile towards the neutral radical thiamine diphosphate-pyruvate
      adduct.
  - node_id: step8
    label: mechanism step 8
    node_type: STATE
    description: The hydrolysis product delivers a second reducing equivalent to the FAD cofactor.
  - node_id: step9
    label: mechanism step 9
    node_type: STATE
    description: The tetrahedral intermediate collapses, eliminating acetate and regenerating the carbanionic
      form of thiamine diphosphate.
  - node_id: step10
    label: mechanism step 10
    node_type: STATE
    description: The thiamine diphosphate cofactor is regenerated on deprotonation of the pyruvate product.
  - node_id: step11
    label: mechanism step 11
    node_type: STATE
    description: The reduction of FAD initiates a conformational rearrangement of the C terminus. This
      results in the exposure of a high lipid affinity binding site.<br/>Pyruvate oxidase from <i>E. coli</i>
      does not use molecular oxygen as a final electron acceptor, unlike its <i>Lactobacillus plantarum</i>
      analogue [PMID:18988747, PMID:11104678]. Once pyruvate has adhered to a biological membrane, the
      prior struc
  - node_id: step12
    label: mechanism step 12
    node_type: STATE
    description: The second reducing equivalent is transferred to the bound ubiquinone. This forms the
      electron transport agent ubiquinol and regenerates the FAD cofactor. Ubiquinol acts as a mobile
      electron carrier in the electron transport chain [PMID:18988747].
  - node_id: step13
    label: mechanism step 13
    node_type: STATE
    description: Products.
  - node_id: active_site
    label: pyruvate dehydrogenase (cytochrome) catalytic site
    node_type: MOTIF
    grounding: MCSA:275
    description: KB trait record (STRUCT_ACTIVE_SITE) — the catalytic site this mechanism runs in.
