  - node_id: step1
    label: mechanism step 1
    node_type: STATE
    description: Tyr115 and Tyr287' play a central role in orientating the OSB C7 carboxylate group so
      that it can abstract the pro-2S proton. The resulting enolate oxyanion is stabilised in the oxyanion
      hole formed by the backbone amides of Gly105 and Gly161 [PMID:21830810].
  - node_id: step2
    label: mechanism step 2
    node_type: STATE
    description: The intramolecular proton transfer in the previous step increases the electrophilicity
      of the protonated carboxylate, allowing the attack of a C=C bond to the C atom of the carboxylate.
      The C7 tetrahedral intermediate formed is stabilised by oxyanion hole formed by the two Tyr residues
      [PMID:21830810].
  - node_id: step3
    label: mechanism step 3
    node_type: STATE
    description: The tetrahedral oxyanion intermediate, aided by surrounding hydrogen bond network, collapses
      through an internal elimination producing a molecule of water
  - node_id: step4
    label: mechanism step 4
    node_type: STATE
    description: The intermediate tautomerises to produce 1,4-dihydroxy-2-napthoyl-CoA with the aid of
      Asp185 and Ser190
  - node_id: step5
    label: mechanism step 5
    node_type: STATE
    description: Inferred step to return the enzyme to its native state, involving reprotonation of Tyr287'
      by a hydronium ion
  - node_id: step6
    label: mechanism step 6
    node_type: STATE
    description: Products.
