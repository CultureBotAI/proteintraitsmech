      snippet: Hydrolysis is effected in two steps, starting with a nucleophilic attack of the enzyme
        on the phosphate group of the substrate to produce an enzyme-phosphate adduct. The phosphorylated
        residue has been identified as His12 (numbering from rat enzyme) and Asp258 protonates the leaving
        group of the substrate. The second step involves the attack of water on the phosphorous atom to
        release inorganic phosphate from the enzyme, in such a way as to return to the original configuration
        of the phosphorous atom. Crystal structures with vanadate, a believed transition state analogue,
        indicate that positively charged His and Arg residues in the active site are involved in correctly
        orientating the phosphate group and transition state stabilisation.
