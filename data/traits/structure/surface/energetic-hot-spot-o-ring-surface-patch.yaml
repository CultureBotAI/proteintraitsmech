identifier: proteintraitsmech:SURFACE_HOT_SPOT_BINDING_EPITOPE_PATCH
label: "energetic hot-spot O-ring surface interface patch"
definition: >-
  A localized cluster of surface-exposed interface residues (enriched in tryptophan, tyrosine, and arginine) that contributes the majority of the binding free energy (Delta-Delta-G >= 2.0 kcal/mol upon alanine mutation) at a protein-protein interaction surface and is surrounded by a concentric 'O-ring' of polar and charged residues that occlude bulk solvent to lower the local dielectric constant.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
