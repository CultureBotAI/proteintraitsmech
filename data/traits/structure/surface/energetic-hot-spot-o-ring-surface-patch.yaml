    title: "Solvent-occluded Trp/Tyr/Arg hot-spot patches concentrate binding free energy to drive protein complex assembly"
    description: "A solvent-occluded interface patch with localized aromatic/amphipathic hydrophobicity (PATO:0001884) surrounded by an O-ring of polar residues concentrates free energy for high-affinity protein binding (GO:0005515), driving protein-containing complex assembly (GO:0065003) into a stable protein-containing complex (GO:0032991)."
