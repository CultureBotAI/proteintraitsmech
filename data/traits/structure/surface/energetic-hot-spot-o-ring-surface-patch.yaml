    synonym_type: EXACT_SYNONYM
  - synonym_text: "O-ring solvent-occluded hot-spot patch"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "energetic binding epitope hot spot"
    synonym_type: EXACT_SYNONYM
