identifier: proteintraitsmech:SURFACE_ELECTROSTATIC_PATCH
label: "solvent-accessible electrostatic surface patch"
definition: >-
  A contiguous region on a protein's solvent-accessible molecular surface exhibiting a pronounced positive or negative electrostatic potential (typically |phi| >= 1 to 2 kT/e as computed by Poisson-Boltzmann continuum electrostatics over clustered ionizable side chains and polar backbone atoms), governing long-range electrostatic steering, macromolecular partner recognition, pH-dependent stability, and diffusional encounter rates.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - PATO:0002193
synonyms:
  - synonym_text: "electrostatic potential surface patch"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "charged solvent-accessible surface cluster"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "FreeSASA / APBS solvent-accessible surface area & electrostatic patch calculation"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0387
    tool: "biotools:freesasa"
    evidence_code: ECO:0007669
    reference: PMID:26973785
    recipe: "freesasa --format=json {input} > {output}"
evidence:
  - reference: PMID:7761829
    notes: "Numerical solution of the Poisson-Boltzmann equation maps electrostatic potentials across protein solvent-accessible surfaces that govern macromolecular recognition and electrostatic steering."
  - reference: PMID:11517324
    notes: "Continuum electrostatic calculations with APBS characterize biomolecular surface electrostatic potential patches across proteins and supramolecular assemblies."
