identifier: proteintraitsmech:SURFACE_ELECTROSTATIC_PATCH
label: "solvent-accessible electrostatic surface patch"
definition: >-
  A contiguous region on a protein's solvent-accessible molecular surface exhibiting a pronounced positive or negative electrostatic potential (typically |phi| >= 1 to 2 kT/e as computed by Poisson-Boltzmann continuum electrostatics over clustered ionizable side chains and polar backbone atoms), governing long-range electrostatic steering, macromolecular partner recognition, pH-dependent stability, and diffusional encounter rates.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
