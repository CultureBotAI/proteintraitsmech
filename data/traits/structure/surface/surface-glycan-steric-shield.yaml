            snippet: "The HIV-1-envelope (Env) trimer is covered by a glycan shield of ~90 N-linked oligosaccharides, which comprises roughly half its mass and is a key component of HIV evasion from humoral immunity."
            notes: "The surface N-glycan shield is a primary determinant of humoral immune evasion. (ECO:0000269)"
evidence:
  - reference: PMID:12646921
    notes: "Dense N-linked glycosylation across the solvent-accessible surface of viral envelope glycoproteins forms an evolving glycan shield that sterically occludes underlying neutralizing epitopes."
  - reference: PMID:27114034
    notes: "Cryo-EM and crystallographic structures of fully glycosylated HIV-1 Env trimers reveal an interlocking network of N-linked oligosaccharides that sterically encases the underlying protein surface to evade antibody binding."
