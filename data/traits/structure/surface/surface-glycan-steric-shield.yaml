identifier: proteintraitsmech:SURFACE_GLYCOSYLATION_SHIELD
label: "surface glycan steric shield"
definition: >-
  A dense array of covalently attached N-linked or O-linked oligosaccharide chains distributed across a protein's solvent-accessible surface whose conformational ensembles collectively occlude underlying polypeptide surface area from macromolecular probes, shielding viral envelope glycoproteins and secreted cell-surface proteins from neutralizing antibodies and host proteases.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "glycan shield"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "N-glycan surface steric canopy"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "FreeSASA / APBS solvent-accessible surface area & electrostatic patch calculation"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0387
    tool: "biotools:freesasa"
    evidence_code: ECO:0007669
    reference: PMID:26973785
    recipe: "freesasa --format=json {input} > {output}"
evidence:
  - reference: PMID:12646921
    notes: "Dense N-linked glycosylation across the solvent-accessible surface of viral envelope glycoproteins forms an evolving glycan shield that sterically occludes underlying neutralizing epitopes."
