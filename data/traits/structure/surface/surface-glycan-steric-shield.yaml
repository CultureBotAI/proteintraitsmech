    title: "Surface N-glycan steric shield occlusion of antibody binding and immune evasion"
    description: "Dense N-linked glycosylation across a glycoprotein's solvent-accessible surface forms a crowded network of interlocking oligosaccharides that sterically encases the underlying polypeptide domain, inhibiting neutralizing antibody binding and modulating the host humoral immune response."
