identifier: proteintraitsmech:SURFACE_GLYCOSYLATION_SHIELD
label: "surface glycan steric shield"
definition: >-
  A dense array of covalently attached N-linked or O-linked oligosaccharide chains distributed across a protein's solvent-accessible surface whose conformational ensembles collectively occlude underlying polypeptide surface area from macromolecular probes, shielding viral envelope glycoproteins and secreted cell-surface proteins from neutralizing antibodies and host proteases.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
