identifier: proteintraitsmech:SURFACE_BASIC_CATIONIC_PATCH
label: "positively charged cationic surface patch"
definition: >-
  A solvent-accessible electrostatic surface patch with a strong net positive electrostatic potential formed by spatially clustered basic side chains (arginine, lysine, and protonated histidine) in 3D structure even when non-contiguous in primary sequence, mediating electrostatic recognition of polyanionic partners such as duplex DNA, RNA, heparin/heparan sulfate glycosaminoglycans, and anionic phospholipid headgroups (PIP2, phosphatidylserine, cardiolipin).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
