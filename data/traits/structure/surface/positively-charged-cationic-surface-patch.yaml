identifier: proteintraitsmech:SURFACE_BASIC_CATIONIC_PATCH
label: "positively charged cationic surface patch"
definition: >-
  A solvent-accessible electrostatic surface patch with a strong net positive electrostatic potential formed by spatially clustered basic side chains (arginine, lysine, and protonated histidine) in 3D structure even when non-contiguous in primary sequence, mediating electrostatic recognition of polyanionic partners such as duplex DNA, RNA, heparin/heparan sulfate glycosaminoglycans, and anionic phospholipid headgroups (PIP2, phosphatidylserine, cardiolipin).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:SURFACE_ELECTROSTATIC_PATCH
  - PATO:0002195
synonyms:
  - synonym_text: "basic electrostatic surface patch"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "cationic Arg/Lys surface patch"
    synonym_type: RELATED_SYNONYM
  - synonym_text: "polyanion-binding positive surface patch"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "FreeSASA / APBS solvent-accessible surface area & electrostatic patch calculation"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0387
    tool: "biotools:freesasa"
    evidence_code: ECO:0007669
    reference: PMID:26973785
    recipe: "freesasa --format=json {input} > {output}"
evidence:
  - reference: PMID:14654279
    notes: "DNA-binding and polyanion-binding sites on protein structures coincide with solvent-accessible surface patches exhibiting the largest positive electrostatic potential scores."
