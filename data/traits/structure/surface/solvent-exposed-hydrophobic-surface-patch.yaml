identifier: proteintraitsmech:SURFACE_HYDROPHOBIC_PATCH
label: "solvent-exposed hydrophobic surface patch"
definition: >-
  A contiguous cluster of solvent-accessible nonpolar side chains (Leu, Ile, Val, Phe, Trp, Met, Tyr, Ala) exposed on the exterior surface of a folded protein domain (quantified by spatial aggregation propensity SAP or structure-corrected CamSol hydrophobicity), providing the thermodynamic desolvation driving force for high-affinity protein-protein interaction hot spots, peripheral membrane association, or concentration-dependent self-association and aggregation.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - PATO:0001884
synonyms:
  - synonym_text: "nonpolar solvent-accessible surface patch"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "spatial aggregation propensity (SAP) hydrophobic patch"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "FreeSASA / APBS solvent-accessible surface area & electrostatic patch calculation"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0387
    tool: "biotools:freesasa"
    evidence_code: ECO:0007669
    reference: PMID:26973785
    recipe: "freesasa --format=json {input} > {output}"
evidence:
  - reference: PMID:19571001
    notes: "Spatial aggregation propensity (SAP) identifies dynamically exposed hydrophobic surface patches on folded proteins that mediate protein-protein interaction and self-association."
  - reference: PMID:25451785
    notes: "CamSol profiles solvent-exposed hydrophobic and polar surface patches to quantify native-state protein solubility."
