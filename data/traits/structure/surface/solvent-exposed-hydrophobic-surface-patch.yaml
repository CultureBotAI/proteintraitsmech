identifier: proteintraitsmech:SURFACE_HYDROPHOBIC_PATCH
label: "solvent-exposed hydrophobic surface patch"
definition: >-
  A contiguous cluster of solvent-accessible nonpolar side chains (Leu, Ile, Val, Phe, Trp, Met, Tyr, Ala) exposed on the exterior surface of a folded protein domain (quantified by spatial aggregation propensity SAP or structure-corrected CamSol hydrophobicity), providing the thermodynamic desolvation driving force for high-affinity protein-protein interaction hot spots, peripheral membrane association, or concentration-dependent self-association and aggregation.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
