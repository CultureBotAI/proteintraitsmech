identifier: proteintraitsmech:SURFACE_MEMBRANE_ANCHORING_AROMATIC_BELT
label: "interfacial aromatic tryptophan/tyrosine membrane belt"
definition: >-
  A ring-like surface arrangement of solvent- and lipid-exposed tryptophan and tyrosine side chains flanking the hydrophobic transmembrane barrel or alpha-helical bundle of an integral membrane protein at the membrane-water interface (~12 to 15 A from the bilayer midplane), anchoring vertical orientation and matching bilayer thickness via dipolar, quadrupolar, and hydrogen-bonding interactions with lipid glycerol/carbonyl headgroups.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_SURFACE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "membrane-water interfacial aromatic girdle"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "Trp/Tyr transmembrane flanking aromatic ring belt"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "FreeSASA / APBS solvent-accessible surface area & electrostatic patch calculation"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0387
    tool: "biotools:freesasa"
    evidence_code: ECO:0007669
    reference: PMID:26973785
    recipe: "freesasa --format=json {input} > {output}"
evidence:
  - reference: PMID:9778346
    notes: "Transmembrane alpha-helical bundles and beta-barrels display a conserved surface belt of tryptophan and tyrosine residues positioned at the lipid-water carbonyl/glycerol interface that anchors vertical membrane orientation."
