identifier: proteintraitsmech:SURFACE_ACIDIC_ANIONIC_PATCH
label: "negatively charged acidic surface patch"
definition: >-
  A solvent-accessible electrostatic surface patch with a strong net negative electrostatic potential formed by spatially clustered acidic carboxylate side chains (aspartate and glutamate) on the 3D molecular surface, mediating long-range electrostatic steering of cationic protein partners (such as barnase-barstar or cytochrome c complexes), nucleic-acid mimicry, divalent cation recruitment, or halophilic hydration-shell stabilization.
