  - PATO:0002196
synonyms:
  - synonym_text: "acidic electrostatic surface patch"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "anionic Asp/Glu surface patch"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "FreeSASA / APBS solvent-accessible surface area & electrostatic patch calculation"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0387
    tool: "biotools:freesasa"
    evidence_code: ECO:0007669
    reference: PMID:26973785
    recipe: "freesasa --format=json {input} > {output}"
evidence:
  - reference: PMID:8638017
    notes: "Clustered negatively charged acidic surface residues generate long-range electrostatic steering potentials that accelerate macromolecular association and enhance aqueous solvation."
  - reference: PMID:7761829
    notes: "Poisson-Boltzmann surface electrostatic potential calculations resolve anionic surface patches on proteins."
