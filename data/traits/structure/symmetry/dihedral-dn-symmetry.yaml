identifier: proteintraitsmech:SYMMETRY_DIHEDRAL_DN
label: "dihedral (Dn) point-group symmetry"
definition: >-
  Global closed symmetry of Schoenflies group Dn (n >= 2), combining an n-fold principal rotational axis with n perpendicular two-fold (C2) dyad axes, formed by stacking two Cn rings face-to-face or assembling n dimers.
