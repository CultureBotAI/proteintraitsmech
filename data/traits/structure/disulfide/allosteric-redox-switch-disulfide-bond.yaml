identifier: proteintraitsmech:DISULFIDE_ALLOSTERIC_REDOX_SWITCH
label: "allosteric/catalytic redox-switch disulfide bond"
definition: >-
  Reversibly cleaved disulfide bond (characteristically adopting a high-strain -RHStaple, +/-RHHook, or -LHHook dihedral configuration) whose thiol-disulfide exchange regulates protein conformation or directly mediates dithiol-disulfide catalysis.
