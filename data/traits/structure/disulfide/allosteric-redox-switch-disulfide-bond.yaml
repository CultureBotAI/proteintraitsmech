identifier: proteintraitsmech:DISULFIDE_ALLOSTERIC_REDOX_SWITCH
label: "allosteric/catalytic redox-switch disulfide bond"
definition: >-
  Reversibly cleaved disulfide bond (characteristically adopting a high-strain -RHStaple, +/-RHHook, or -LHHook dihedral configuration) whose thiol-disulfide exchange regulates protein conformation or directly mediates dithiol-disulfide catalysis.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:DISULFIDE_BOND
synonyms:
  - synonym_text: "allosteric disulfide bond"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "redox-active disulfide switch"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "mkdssp / Geometry-based Sgamma-Sgamma disulfide bond & dihedral χ3 assignment"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_1836
    tool: "biotools:dssp"
    evidence_code: ECO:0007669
    reference: PMID:25352545
    recipe: "mkdssp -i {input} -o {output}"
causal_graphs:
  - graph_id: allosteric_disulfide_redox_switch_regulation
    title: "Reversible thiol-disulfide modification of allosteric cystine bonds controls protein activity"
    description: "Protein-disulfide reductase activity (GO:0015035) modifies an allosteric L-cystine (cross-link) (MOD:00034) into reduced L-cysteine residues (CHEBI:29950), driving conformational enzyme regulator activity (GO:0030234) that regulates target catalytic activity (GO:0003824)."
    nodes:
      - node_id: "MOD:00034"
        label: "L-cystine (cross-link)"
        node_type: PTM
        grounding: "MOD:00034"
        description: "Allosteric disulfide bond in an intracellular or extracellular protein."
      - node_id: "GO:0015035"
        label: "protein-disulfide reductase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0015035"
        description: "Thiol isomerase / oxidoreductase modifying allosteric disulfide bonds."
      - node_id: "CHEBI:29950"
        label: "L-cysteine residue"
        node_type: RESIDUE
        grounding: "CHEBI:29950"
        description: "Reduced dithiol cysteine pair generated upon allosteric disulfide cleavage."
      - node_id: "GO:0030234"
        label: "enzyme regulator activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0030234"
        description: "Redox-coupled allosteric switch controlling mature protein function."
      - node_id: "GO:0003824"
        label: "catalytic activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003824"
        description: "Target protein function controlled by allosteric disulfide modification."
    edges:
      - subject: "GO:0015035"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "MOD:00034"
        description: "PDI family oxidoreductases act on redox-active protein disulfide bonds."
        evidence:
          - reference: PMID:28044432
            snippet: "Many of the PDI family members catalyze disulfide-bond formation, reduction, and isomerization through redox-active disulfides and perturbed PDI activity is characteristic of carcinomas and neurodegenerative diseases."
            notes: "PDI family catalysis of disulfide reduction and isomerization (PMID:28044432). (ECO:0000305)"
      - subject: "GO:0015035"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "CHEBI:29950"
        description: "Reductases such as glutaredoxin and thioredoxin reduce redox-active disulfides into cysteine dithiols."
        evidence:
          - reference: PMID:28044432
            snippet: "The oxidation and reduction of redox-active disulfides are mediated by cellular reactive oxygen species and activity of reductases, such as glutaredoxin and thioredoxin."
            notes: "Reductase-mediated reduction of redox-active disulfides (PMID:28044432). (ECO:0000305)"
      - subject: "GO:0015035"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0030234"
        description: "Modification of redox-active disulfides acts as a regulatory switch responding to oxidative changes."
        evidence:
          - reference: PMID:28044432
            snippet: "In addition to catalytic function in oxidoreductases, redox-active disulfides are also found on a diverse array of cellular proteins and act to regulate protein activity and localization in response to oxidative changes in the local environment."
            notes: "Redox-active disulfides regulate protein activity and localization (PMID:28044432). (ECO:0000305)"
      - subject: "GO:0030234"
        predicate: regulates
        predicate_id: RO:0002211
        object: "GO:0003824"
        description: "Allosteric disulfide bonds provide responsive, transient switch-like regulation of protein function."
        evidence:
          - reference: PMID:35130281
            snippet: "Allosteric disulfide bonds permit highly responsive, transient 'switch-like' properties that are ideal for processes like coagulation and inflammation that require rapid and localised responses to damage or injury."
            notes: "Switch-like regulation by allosteric disulfide bonds (PMID:35130281). (ECO:0000305)"
evidence:
  - reference: PMID:42681370
    notes: "Thiol isomerases modify allosteric disulfide bonds in intracellular and extracellular proteins, thereby controlling protein function."
  - reference: PMID:28044432
    notes: "Redox-active disulfides are oxidized and reduced by reductases and regulate protein activity and localization in response to oxidative changes."
  - reference: PMID:35130281
    notes: "Allosteric disulfide bonds permit transient switch-like regulation of protein function."
