identifier: proteintraitsmech:DISULFIDE_INTRACHAIN
label: "intrachain structural disulfide bond"
definition: >-
  Covalent cystine crosslink formed between two cysteine thiolates within the same polypeptide chain, reducing unfolded-state chain entropy and stabilizing tertiary fold topology.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:DISULFIDE_BOND
synonyms:
  - synonym_text: "intramolecular disulfide bridge"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "intrachain cystine bridge"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "mkdssp / Geometry-based Sgamma-Sgamma disulfide bond & dihedral χ3 assignment"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_1836
    tool: "biotools:dssp"
    evidence_code: ECO:0007669
    reference: PMID:25352545
    recipe: "mkdssp -i {input} -o {output}"
causal_graphs:
  - graph_id: intrachain_disulfide_oxidative_folding
    title: "Oxidative thiol-disulfide crosslinking of intrachain cysteines stabilizes tertiary protein folding"
    description: "Protein disulfide isomerase activity (GO:0003756) oxidizes paired L-cysteine residues (CHEBI:29950) within the same polypeptide chain to form an intrachain L-cystine (cross-link) (MOD:00034), positively regulating tertiary protein folding (GO:0006457)."
    nodes:
      - node_id: "CHEBI:29950"
        label: "L-cysteine residue"
        node_type: RESIDUE
        grounding: "CHEBI:29950"
        description: "Paired reduced L-cysteine thiolates within the same polypeptide chain."
      - node_id: "GO:0003756"
        label: "protein disulfide isomerase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003756"
        description: "Thiol-disulfide oxidoreductase/isomerase (PDI / DsbA, EC:5.3.4.1) catalyzing cystine formation."
      - node_id: "MOD:00034"
        label: "L-cystine (cross-link)"
        node_type: PTM
        grounding: "MOD:00034"
        description: "Intrachain covalent cystine disulfide bridge."
      - node_id: "GO:0006457"
        label: "protein folding"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0006457"
        description: "Thermodynamic stabilization of native tertiary structure via intramolecular disulfide formation."
    edges:
      - subject: "GO:0003756"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:29950"
        description: "Protein disulfide isomerase family oxidases act on paired intrachain L-cysteine thiolates during folding."
        evidence:
          - reference: PMID:28044432
            snippet: "The proper formation of these bonds often relies on folding chaperones and oxidases such as members of the protein disulfide isomerase (PDI) family."
            notes: "Oxidation of paired intrachain cysteine residues by PDI family oxidases (PMID:28044432). (ECO:0000305)"
      - subject: "GO:0003756"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "MOD:00034"
        description: "PDI family members catalyze disulfide-bond formation and isomerization to yield intramolecular L-cystine crosslinks."
        evidence:
          - reference: PMID:28044432
            snippet: "Many of the PDI family members catalyze disulfide-bond formation, reduction, and isomerization through redox-active disulfides and perturbed PDI activity is characteristic of carcinomas and neurodegenerative diseases."
            notes: "Catalyzed formation of intramolecular cystine crosslinks (PMID:28044432). (ECO:0000305)"
      - subject: "GO:0003756"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0006457"
        description: "Intramolecular disulfide bonds formed in the secretory pathway are essential to structural stability and native folding."
        evidence:
          - reference: PMID:28044432
            snippet: "Disulfide bonds are essential to the structural stability of many proteins within the secretory pathway and can exist as intramolecular or inter-domain disulfides."
            notes: "Intramolecular disulfide bonds stabilize tertiary protein folding (PMID:28044432). (ECO:0000305)"
evidence:
  - reference: PMID:42829235
    notes: "Protein disulfide isomerase catalyzes intramolecular disulfide bond formation during oxidative protein folding."
  - reference: PMID:28044432
    notes: "Disulfide bonds are essential to the structural stability of many proteins within the secretory pathway and can exist as intramolecular or inter-domain disulfides formed by protein disulfide isomerase (PDI) family members."
