      - node_id: "GO:0003756"
        label: "protein disulfide isomerase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003756"
        description: "Thiol-disulfide oxidoreductase/isomerase (PDI / DsbA, EC:5.3.4.1) catalyzing cystine formation."
      - node_id: "MOD:00034"
        label: "L-cystine (cross-link)"
        node_type: PTM
        grounding: "MOD:00034"
        description: "Intrachain covalent cystine disulfide bridge."
      - node_id: "GO:0006457"
        label: "protein folding"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0006457"
        description: "Thermodynamic stabilization of native tertiary structure via intramolecular disulfide formation."
    edges:
      - subject: "GO:0003756"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:29950"
        description: "Protein disulfide isomerase oxidizes paired intrachain L-cysteine thiolates."
        evidence:
          - reference: PMID:42829235
            snippet: "Here, we developed an expression system for recombinant human serum albumin (rHSA) by fusing the a domain of human protein disulfide isomerase (PDI) to the N-terminus of HSA."
            notes: "Oxidation of paired intrachain cysteine residues by PDI (PMID:42829235). (ECO:0000269)"
      - subject: "GO:0003756"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "MOD:00034"
        description: "Oxidative thiol coupling yields covalent intramolecular L-cystine crosslinks."
        evidence:
          - reference: PMID:42829235
            snippet: "Purified E. coli-rHSA was predominantly monomeric and had the molecular mass expected for HSA containing 17 intramolecular disulfide bonds."
            notes: "Formation of intramolecular cystine crosslinks (PMID:42829235). (ECO:0000269)"
      - subject: "GO:0003756"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0006457"
        description: "PDI-catalyzed intramolecular disulfide bond formation promotes structurally native-like and functionally competent protein folding."
        evidence:
          - reference: PMID:42829235
            snippet: "These results demonstrate that PDI(a)-mediated cis-fusion enables high-yield production of structurally native-like and functionally competent HSA in the bacterial cytosol and provides a practical platform for producing complex disulfide-rich proteins in E. coli."
            notes: "Intramolecular disulfide formation promotes native folding (PMID:42829235). (ECO:0000269)"
evidence:
  - reference: PMID:42829235
    notes: "Protein disulfide isomerase catalyzes intramolecular disulfide bond formation during oxidative protein folding."
