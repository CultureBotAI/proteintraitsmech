identifier: proteintraitsmech:DISULFIDE_VICINAL_CYSTINE_RING
label: "sequence-adjacent vicinal disulfide eight-membered ring"
definition: >-
  A rare intrachain covalent disulfide crosslink formed between two sequence-adjacent cysteine residues (Cys(i)-Cys(i+1)), cyclizing the intervening peptide group and side chains into a strained eight-membered ring that enforces a sharp backbone turn, stabilizes tightly packed internal cores, or presents a rigid hydrophobic platform for carbohydrate and multi-ring ligand binding.
