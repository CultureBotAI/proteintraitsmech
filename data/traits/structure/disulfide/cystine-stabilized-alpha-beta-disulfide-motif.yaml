identifier: proteintraitsmech:DISULFIDE_CYSTINE_STABILIZED_ALPHA_BETA
label: "cystine-stabilized alpha-helix/beta-sheet disulfide motif"
definition: >-
  A conserved structural disulfide-crosslinked scaffold (the CS-alpha-beta or cystine-stabilized alpha/beta motif) in which an alpha-helix carrying a Cys-Xaa3-Cys segment is covalently tethered via two parallel disulfide bridges to a central beta-strand carrying a Cys-Xaa-Cys segment (typically supplemented by a third N-terminal-to-beta-sheet disulfide), stabilizing invertebrate/plant/fungal defensins and scorpion neurotoxins.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
