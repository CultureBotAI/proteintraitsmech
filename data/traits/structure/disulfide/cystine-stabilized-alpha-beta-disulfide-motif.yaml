    synonym_type: EXACT_SYNONYM
  - synonym_text: "CSab disulfide motif"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "cysteine-stabilized alpha-beta scaffold"
    synonym_type: EXACT_SYNONYM
sequence_pattern: "C[A-Z]{3}C[A-Z]+C[A-Z]C"
