synonyms:
  - synonym_text: "intermolecular disulfide bridge"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "inter-subunit disulfide bond"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "mkdssp / Geometry-based Sgamma-Sgamma disulfide bond & dihedral χ3 assignment"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_1836
    tool: "biotools:dssp"
    evidence_code: ECO:0007669
    reference: PMID:25352545
    recipe: "mkdssp -i {input} -o {output}"
causal_graphs:
  - graph_id: interchain_disulfide_quaternary_crosslinking
    title: "Inter-subunit cystine crosslinking covalently stabilizes quaternary dimer/oligomer assembly"
    description: "Protein disulfide isomerase activity (GO:0003756) oxidizes L-cysteine residues (CHEBI:29950) across juxtaposed polypeptide subunits to form an interchain L-cystine (cross-link) (MOD:00034) that drives covalent protein complex oligomerization (GO:0051259)."
    nodes:
      - node_id: "CHEBI:29950"
        label: "L-cysteine residue"
        node_type: RESIDUE
        grounding: "CHEBI:29950"
        description: "Cysteine residues positioned across an inter-subunit quaternary interface."
      - node_id: "GO:0003756"
        label: "protein disulfide isomerase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003756"
        description: "Oxidative thiol-disulfide formation across partner polypeptide chains."
      - node_id: "MOD:00034"
        label: "L-cystine (cross-link)"
        node_type: PTM
        grounding: "MOD:00034"
        description: "Interchain covalent cystine disulfide bridge linking two subunits."
      - node_id: "GO:0051259"
        label: "protein complex oligomerization"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0051259"
        description: "Covalent quaternary subunit assembly via interchain disulfide bonds."
    edges:
      - subject: "GO:0003756"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:29950"
        description: "Oxidative disulfide formation consumes available cysteine thiols across identical and different subunits."
        evidence:
          - reference: PMID:19005088
            snippet: "Here, we have addressed these issues by analyzing the formation of interchain disulfide bonds between identical and different LMW-GS and by studying the assembly of mutants lacking individual intrachain disulfides."
            notes: "Inter-subunit cysteine oxidation (PMID:19005088). (ECO:0000269)"
      - subject: "GO:0003756"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "MOD:00034"
        description: "Oxidation forms an interchain L-cystine covalent bridge between companion subunits."
        evidence:
          - reference: PMID:19005088
            snippet: "Our results indicate that individual cysteine residues that remain available for disulfide bond formation in the folded monomer can form interchain disulfide bonds with a variety of different cysteine residues present in a companion subunit."
            notes: "Interchain cystine crosslink formation (PMID:19005088). (ECO:0000269)"
      - subject: "GO:0003756"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0051259"
        description: "Interchain disulfide bond formation covalently links companion subunits into polymeric structures."
        evidence:
          - reference: PMID:19005088
            snippet: "These results imply that the coordinated expression of many different LMW-GS in wheat endosperm cells can potentially lead to the formation of a large set of distinct polymeric structures, in which subunits can be arranged in different configurations."
            notes: "Covalent subunit cross-linking into oligomers (PMID:19005088). (ECO:0000269)"
evidence:
  - reference: PMID:19005088
    notes: "Available cysteine residues in folded monomers form interchain disulfide bonds with cysteine residues in companion subunits."
