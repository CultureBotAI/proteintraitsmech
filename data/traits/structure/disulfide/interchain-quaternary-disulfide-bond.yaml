identifier: proteintraitsmech:DISULFIDE_INTERCHAIN
label: "interchain quaternary disulfide bond"
definition: >-
  Covalent cystine crosslink joining cysteine residues on two distinct polypeptide chains (or mature proteolytically cleaved chains, as in insulin and immunoglobulins), locking quaternary subunit stoichiometry.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
