identifier: proteintraitsmech:DISULFIDE_BOND
label: disulfide bond
definition: >-
  A covalent sulfur-sulfur (S-S) cross-link (L-cystine, MOD:00034) formed by oxidative coupling of the thiol side chains of two cysteine residues (CHEBI:29950) within the same polypeptide chain (intrachain) or between distinct chains (interchain), catalyzed by thiol-disulfide oxidoreductases to stabilize tertiary/quaternary fold or act as a redox-reversible allosteric switch.
definition_source: https://linkml.io/valuesets/elements/LocalStructuralFeature/
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
