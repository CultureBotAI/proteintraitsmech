identifier: proteintraitsmech:DISULFIDE_BOND
label: disulfide bond
definition: >-
  A covalent sulfur-sulfur (S-S) cross-link (L-cystine, MOD:00034) formed by oxidative coupling of the thiol side chains of two cysteine residues (CHEBI:29950) within the same polypeptide chain (intrachain) or between distinct chains (interchain), catalyzed by thiol-disulfide oxidoreductases to stabilize tertiary/quaternary fold or act as a redox-reversible allosteric switch.
definition_source: https://linkml.io/valuesets/elements/LocalStructuralFeature/
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
xrefs:
- valuesets:LocalStructuralFeature
- SO:0001088
causal_graphs:
- graph_id: CG_DISULFIDE_BOND
  title: Thiol-isomerase-catalyzed oxidation of cysteine pairs into structural and allosteric disulfide
    bonds
  description: Paired L-cysteine residues (CHEBI:29950) undergo oxidative thiol-disulfide exchange catalyzed
    by protein disulfide isomerase activity (GO:0003756) to yield a covalent L-cystine disulfide cross-link
    (MOD:00034), which positively regulates oxidative protein folding and structural integrity (GO:0006457).
  nodes:
  - node_id: CHEBI:29950
    label: L-cysteine residue
    node_type: RESIDUE
    grounding: CHEBI:29950
    description: Paired thiol-bearing L-cysteine residues juxtaposed in the nascent or mature polypeptide
      chain
  - node_id: GO:0003756
    label: protein disulfide isomerase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0003756
    description: Thiol-disulfide oxidoreductase activity catalyzing disulfide bond formation and rearrangement
  - node_id: MOD:00034
    label: L-cystine (cross-link)
    node_type: PTM
    grounding: MOD:00034
    description: Covalent S-S disulfide cross-link bridging two cysteine residues
  - node_id: GO:0006457
    label: protein folding
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0006457
    description: Oxidative protein folding and stabilization of native tertiary/quaternary structural
      integrity
  edges:
  - subject: CHEBI:29950
    predicate: participates in
    predicate_id: RO:0000056
    object: GO:0003756
    description: Reduced cysteine thiol pairs in nascent polypeptides participate as substrates in protein
      disulfide isomerase-catalyzed disulfide formation.
    evidence:
    - reference: PMID:28044432
      snippet: The proper formation of these bonds often relies on folding chaperones and oxidases such
        as members of the protein disulfide isomerase (PDI) family.
      notes: Protein disulfide isomerase family members assist proper disulfide bond formation (PMID:28044432)
        (ECO:0000305)
  - subject: GO:0003756
    predicate: has output
    predicate_id: RO:0002234
    object: MOD:00034
    description: Protein disulfide isomerase redox-active disulfide catalysis generates covalent L-cystine
      (S-S) cross-links.
    evidence:
    - reference: PMID:28044432
      snippet: Many of the PDI family members catalyze disulfide-bond formation, reduction, and isomerization
        through redox-active disulfides and perturbed PDI activity is characteristic of carcinomas and
        neurodegenerative diseases.
      notes: PDI redox-active disulfides catalyze disulfide-bond formation and isomerization (PMID:28044432)
        (ECO:0000305)
  - subject: MOD:00034
    predicate: positively regulates
    predicate_id: RO:0002213
    object: GO:0006457
    description: Covalent disulfide cross-links stabilize native tertiary and quaternary protein folding
      and subunit assembly.
    evidence:
    - reference: PMID:19005088
      snippet: Our results indicate that individual cysteine residues that remain available for disulfide
        bond formation in the folded monomer can form interchain disulfide bonds with a variety of different
        cysteine residues present in a companion subunit.
      notes: Disulfide cross-links form during monomer folding and subunit assembly (PMID:19005088) (ECO:0000269)
evidence:
- reference: PMID:19005088
  notes: Protein disulfide isomerase (PDI) catalyzes cysteine oxidation and disulfide bond formation during
    oxidative protein folding and subunit assembly.
- reference: PMID:28044432
  notes: Bechtel and Weerapana (2017) review structural, catalytic, and allosteric disulfide bonds and
    their formation, reduction, and isomerization by protein disulfide isomerase (PDI) family oxidoreductases.
