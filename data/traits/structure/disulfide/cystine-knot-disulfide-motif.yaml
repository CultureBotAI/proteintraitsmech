identifier: proteintraitsmech:DISULFIDE_CYSTINE_KNOT
label: "cystine-knot three-disulfide topology"
definition: >-
  Topological disulfide motif of three conserved cystine bridges (CysI-CysIV, CysII-CysV, CysIII-CysVI) in which the third disulfide bond threads through the macrocycle formed by the first two, conferring extreme thermal and proteolytic stability.
