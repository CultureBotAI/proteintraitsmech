identifier: proteintraitsmech:DISULFIDE_CATALYTIC_CXXC
label: "catalytic CXXC dithiol-disulfide active-site motif"
definition: >-
  A redox-active catalytic disulfide/dithiol motif (canonical consensus C-X-X-C, such as CGPC in thioredoxin, CPYC in glutaredoxin, CGHC in protein disulfide isomerase, and CPHC in DsbA) positioned at the N-terminus of an alpha-helix in thioredoxin-fold oxidoreductases, where the solvent-exposed N-terminal cysteine has a depressed pKa and initiates nucleophilic dithiol-disulfide exchange on substrate proteins while the buried C-terminal resolving cysteine completes intramolecular disulfide formation or substrate reduction.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: STRUCTURE
trait_category: STRUCT_DISULFIDE
term_kind: CLASS
mapping_status: SEEDED
