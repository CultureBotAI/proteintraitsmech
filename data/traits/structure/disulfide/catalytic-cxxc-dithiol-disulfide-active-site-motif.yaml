  - synonym_text: "redox-active CXXC dithiol/disulfide couple"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "attacking and resolving cysteine CXXC motif"
    synonym_type: RELATED_SYNONYM
sequence_pattern: "C[A-Z]{2}C"
