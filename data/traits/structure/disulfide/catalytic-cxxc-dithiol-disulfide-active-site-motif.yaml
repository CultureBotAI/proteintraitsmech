causal_graphs:
  - graph_id: catalytic_cxxc_dithiol_disulfide_exchange
    title: "Nucleophilic attack by the N-terminal CXXC thiolate and resolution by the C-terminal cysteine catalyze thiol-disulfide oxidoreduction"
    description: "In thiol:disulfide oxidoreductases, the low-pKa thiolate of the N-terminal cysteine in the active-site CXXC motif performs a nucleophilic attack on a substrate disulfide bond to form a mixed-disulfide intermediate, which is resolved by the C-terminal CXXC cysteine to yield an intramolecular CXXC cystine cross-link and maintain cellular redox homeostasis."
