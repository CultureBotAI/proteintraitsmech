identifier: proteintraitsmech:METAL_BINDING_SITE
label: metal binding site
definition: >-
  A local three-dimensional arrangement of protein donor atoms, together with any associated
  nonprotein ligands, that coordinates one or more metal ions in a protein structure.
definition_source: PMID:23155064
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: PROPOSED
evidence:
- reference: PMID:23155064
  notes: Andreini et al. (2013) characterize metal-binding Minimal Functional Sites (MFSs) in MetalPDB
    and their structural and catalytic roles in metalloproteins.
- reference: https://linkml.io/valuesets/elements/LocalStructuralFeature/
  notes: Source enum member retained as provenance, not an equivalent identifier.
- reference: https://metalpdb.cerm.unifi.it/
  notes: MetalPDB organizes structural metal-site information; structural occurrence alone does not
    identify physiological metal usage or catalytic function.
- reference: PMID:1433293
  notes: The carbonic-anhydrase-II study describes the zinc environment in PDB 2CBA. It supports a metal-site
    representative, not a universal link from metal binding to folding or catalysis.
- reference: https://github.com/CultureBotAI/proteintraitsmech/blob/main/LICENSE
  notes: Project-authored factual synthesis and annotations are CC-BY-4.0 under LICENSE/ LICENSE-DATA.
    Legacy valuesets provenance retains Apache-2.0 attribution. The MetalPDB article's CC-BY-NC-3.0
    terms do not authorize redistribution of MetalPDB data here. PDB archive metadata are CC0-1.0; primary
    structural article rights are separate. No MetalPDB tables, article prose, figures or coordinates
    are copied.
