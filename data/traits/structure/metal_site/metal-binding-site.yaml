- discussion_id: STRUCTURE_20261028_METAL_BINDING_SITE_DETECTION
  prompt: Verify metal identity, occupancy, donor atoms, geometry and experimental context. A modeled
    metal or plausible coordination site does not establish physiological binding, folding effects or
    catalysis; distinguish the coordinating shell from larger comparison templates. No validated executable
    metal-site detector was established here.
