identifier: proteintraitsmech:METALPDB_RE_DINUCLEAR
label: "dinuclear rhenium site"
definition: >-
  A structural metal-binding site in which rhenium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a dinuclear rhenium site (2 metal ions per site). Across the MetalPDB release this class aggregates 1 metal-site occurrences in 1 PDB structures (1+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Glu (1); Asp (1).
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:49882
    role: COFACTOR
    name: rhenium
canonical_examples:
  - protein_id: UniProtKB:P00698
    protein_label: "Lysozyme C"
    taxon_label: "Gallus gallus"
    note: "MetalPDB dinuclear rhenium site occurrence in PDB 5nbj"
causal_graphs:
- graph_id: metal_coordination
  title: Coordination of rhenium at the dinuclear rhenium site
  description: Protein residues coordinating the metal, transcribed from MetalPDB across 1 exemplar site(s).
    Residue numbering is the PDB author frame MetalPDB reports; no UniProt position is asserted.
  nodes:
  - node_id: metal
    label: rhenium
    node_type: CHEMICAL
    grounding: CHEBI:49882
  - node_id: site
    label: dinuclear rhenium site
    node_type: MOTIF
    grounding: proteintraitsmech:METALPDB_RE_DINUCLEAR
    description: KB trait record (STRUCT_METAL_SITE) — the coordination class this site belongs to.
  - node_id: res5nbjGLU35A
