    protein_label: "ookinete surface protein Pvs25"
    taxon_label: "Plasmodium vivax"
    note: "MetalPDB tetranuclear ytterbium site occurrence in PDB 1z1y"
  - protein_id: UniProtKB:P00488
    protein_label: "Coagulation factor XIII A chain"
    taxon_label: "Homo sapiens"
    note: "MetalPDB tetranuclear ytterbium site occurrence in PDB 1ggy"
