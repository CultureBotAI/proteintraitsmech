    protein_label: "Probable bifunctional tRNA threonylcarbamoyladenosine biosynthesis protein"
    taxon_label: "Methanocaldococcus jannaschii"
    note: "MetalPDB trinuclear tantalum site occurrence in PDB 3en9"
  - protein_id: UniProtKB:Q68RJ5
    protein_label: "Intraflagellar transport protein 81"
    taxon_label: "Chlamydomonas reinhardtii"
    note: "MetalPDB trinuclear tantalum site occurrence in PDB 4lvp"
