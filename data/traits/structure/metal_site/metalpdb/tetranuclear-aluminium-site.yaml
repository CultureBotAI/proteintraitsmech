identifier: proteintraitsmech:METALPDB_AL_TETRANUCLEAR
label: "tetranuclear aluminium site"
definition: >-
  A structural metal-binding site in which aluminium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a tetranuclear aluminium site (4 metal ions per site). Across the MetalPDB release this class aggregates 9 metal-site occurrences in 4 PDB structures (3+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Ser (4). Typical coordination geometry: trigonal bipyramid with a vacancy, trigonal bipyramid.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:28984
    role: COFACTOR
    name: aluminium
canonical_examples:
  - protein_id: UniProtKB:P00634
    protein_label: "Alkaline phosphatase"
    taxon_label: "Escherichia coli"
    note: "MetalPDB tetranuclear aluminium site occurrence in PDB 1kh5"
  - protein_id: UniProtKB:P0A6W9
    protein_label: "Glutamate--cysteine ligase"
    taxon_label: "Escherichia coli"
    note: "MetalPDB tetranuclear aluminium site occurrence in PDB 2d33"
  - protein_id: UniProtKB:Q57ZH3
    protein_label: "Deoxyuridine triphosphatase, putative"
    taxon_label: "Trypanosoma brucei"
    note: "MetalPDB tetranuclear aluminium site occurrence in PDB 4dl8"
