identifier: proteintraitsmech:METALPDB_K_HEXANUCLEAR
label: "hexanuclear potassium site"
definition: >-
  A structural metal-binding site in which potassium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a hexanuclear potassium site (6 metal ions per site). Across the MetalPDB release this class aggregates 31 metal-site occurrences in 29 PDB structures (5+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Thr (5); Tyr (4); VX(0)G (3). Typical coordination geometry: irregular, square antiprism.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:26216
    role: COFACTOR
    name: potassium
canonical_examples:
  - protein_id: UniProtKB:P0A334
    protein_label: "Voltage-gated potassium channel"
    taxon_label: "Streptomyces lividans"
    note: "MetalPDB hexanuclear potassium site occurrence in PDB 2p7t"
  - protein_id: UniProtKB:P21616
    protein_label: "Proton pyrophosphatase"
    taxon_label: "Vigna radiata"
    note: "MetalPDB hexanuclear potassium site occurrence in PDB 4a01"
  - protein_id: UniProtKB:P97438
    protein_label: "Potassium channel subfamily K member 2"
    taxon_label: "Mus musculus"
    note: "MetalPDB hexanuclear potassium site occurrence in PDB 5vkn"
