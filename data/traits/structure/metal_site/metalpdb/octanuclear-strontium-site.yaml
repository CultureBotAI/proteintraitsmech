identifier: proteintraitsmech:METALPDB_SR_OCTANUCLEAR
label: "octanuclear strontium site"
definition: >-
  A structural metal-binding site in which strontium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a octanuclear strontium site (8 metal ions per site). Across the MetalPDB release this class aggregates 3 metal-site occurrences in 3 PDB structures (2+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Gln (1); Asn (1). Typical coordination geometry: irregular, trigonal plane with a vacancy.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:33324
    role: COFACTOR
    name: strontium
canonical_examples:
  - protein_id: UniProtKB:P00735
    protein_label: Prothrombin
    taxon_label: "Bos taurus"
    note: "MetalPDB octanuclear strontium site occurrence in PDB 2spt"
causal_graphs:
- graph_id: metal_coordination
  title: Coordination of strontium at the octanuclear strontium site
  description: Protein residues coordinating the metal, transcribed from MetalPDB across 1 exemplar site(s).
    Residue numbering is the PDB author frame MetalPDB reports; no UniProt position is asserted.
  nodes:
  - node_id: metal
    label: strontium
    node_type: CHEMICAL
    grounding: CHEBI:33324
  - node_id: site
    label: octanuclear strontium site
    node_type: MOTIF
    grounding: proteintraitsmech:METALPDB_SR_OCTANUCLEAR
    description: KB trait record (STRUCT_METAL_SITE) — the coordination class this site belongs to.
  - node_id: res2sptASN2A
    label: coordinating ASN2 (PDB 2spt chain A author numbering; no UniProt position asserted)
    node_type: RESIDUE
    grounding: UniProtKB:P00735
  edges:
  - subject: res2sptASN2A
    predicate: molecularly interacts with (coordinates)
    predicate_id: RO:0002436
    object: metal
    description: ASN2 donates a donor atom to the coordinated strontium.
    evidence:
    - reference: PDB:2spt
      snippet: residue_name ASN; residue_pdb_number 2; chain_letter A
      notes: MetalPDB site 2spt_1 (PDB 2spt, octanuclear Strontium, coordination number 3; geometry irregular
        (n/a)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating
        ligands (water, nucleotides) that are not written as nodes here.
  - subject: res2sptASN2A
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: A coordinating residue of this metal site.
    evidence:
    - reference: PDB:2spt
      snippet: residue_name ASN; residue_pdb_number 2; chain_letter A
      notes: MetalPDB site 2spt_1 (PDB 2spt, octanuclear Strontium, coordination number 3; geometry irregular
        (n/a)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating
        ligands (water, nucleotides) that are not written as nodes here.
  - subject: metal
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: The coordinated metal ion of this site.
    evidence:
    - reference: PDB:2spt
      snippet: periodic_symbol Sr; coordination_number 3
      notes: MetalPDB site 2spt_1 metal record.
