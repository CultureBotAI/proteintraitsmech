identifier: proteintraitsmech:METALPDB_AS_TRINUCLEAR
label: "trinuclear arsenic site"
definition: >-
  A structural metal-binding site in which arsenic is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a trinuclear arsenic site (3 metal ions per site). Across the MetalPDB release this class aggregates 104 metal-site occurrences in 56 PDB structures (42+ distinct UniProt proteins). Typical coordination geometry: tetrahedron, irregular.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:27563
    role: COFACTOR
    name: arsenic
canonical_examples:
  - protein_id: UniProtKB:A0A060GPP4
    protein_label: "Phosphotriesterase variant PTE-revR6"
    taxon_label: "Brevundimonas diminuta"
    note: "MetalPDB trinuclear arsenic site occurrence in PDB 4pbe"
