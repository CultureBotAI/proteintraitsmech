identifier: proteintraitsmech:METALPDB_GA_TETRANUCLEAR
label: "tetranuclear gallium site"
definition: >-
  A structural metal-binding site in which gallium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a tetranuclear gallium site (4 metal ions per site). Across the MetalPDB release this class aggregates 1 metal-site occurrences in 1 PDB structures (1+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Glu (4). Typical coordination geometry: square pyramid with a vacancy, octahedron.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
