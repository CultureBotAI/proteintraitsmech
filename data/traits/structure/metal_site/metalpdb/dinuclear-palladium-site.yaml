identifier: proteintraitsmech:METALPDB_PD_DINUCLEAR
label: "dinuclear palladium site"
definition: >-
  A structural metal-binding site in which palladium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a dinuclear palladium site (2 metal ions per site). Across the MetalPDB release this class aggregates 28 metal-site occurrences in 18 PDB structures (3+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Cys (11); His (9); EX(2)C (9). Typical coordination geometry: irregular, trigonal plane with a vacancy.
definition_source: "MetalPDB (CERM, University of Florence)"
