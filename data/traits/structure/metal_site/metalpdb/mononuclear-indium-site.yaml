      snippet: residue_name TYR; residue_pdb_number 642; chain_letter A
      notes: MetalPDB site 3vtm_1 (PDB 3vtm, mononuclear Indium, coordination number 5; geometry square
        pyramid (regular)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein
        coordinating ligands (water, nucleotides) that are not written as nodes here.
  - subject: metal
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: The coordinated metal ion of this site.
