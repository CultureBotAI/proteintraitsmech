    description: KB trait record (STRUCT_METAL_SITE) — the coordination class this site belongs to.
  - node_id: res3vtmTYR642A
    label: coordinating TYR642 (PDB 3vtm chain A author numbering; no UniProt position asserted)
    node_type: RESIDUE
    grounding: UniProtKB:Q931P4
  edges:
