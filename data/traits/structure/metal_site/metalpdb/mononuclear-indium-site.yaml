identifier: proteintraitsmech:METALPDB_IN_MONONUCLEAR
label: "mononuclear indium site"
definition: >-
  A structural metal-binding site in which indium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a mononuclear indium site (1 metal ion per site). Across the MetalPDB release this class aggregates 3 metal-site occurrences in 2 PDB structures (2+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Tyr (2); His (1). Typical coordination geometry: square pyramid, pentagonal bipyramid.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:30430
    role: COFACTOR
    name: indium
canonical_examples:
  - protein_id: UniProtKB:Q931P4
    protein_label: "Iron-regulated surface determinant protein H"
    taxon_label: "Staphylococcus aureus subsp. aureus Mu50"
    note: "MetalPDB mononuclear indium site occurrence in PDB 3vtm"
causal_graphs:
- graph_id: metal_coordination
  title: Coordination of indium at the mononuclear indium site
  description: Protein residues coordinating the metal, transcribed from MetalPDB across 1 exemplar site(s).
    Residue numbering is the PDB author frame MetalPDB reports; no UniProt position is asserted.
  nodes:
