    protein_label: "Voltage-gated potassium channel"
    note: "MetalPDB trinuclear rubidium site occurrence in PDB 2hfe"
  - protein_id: UniProtKB:P0A334
    protein_label: "Voltage-gated potassium channel"
    taxon_label: "Streptomyces lividans"
    note: "MetalPDB trinuclear rubidium site occurrence in PDB 1jvm"
  - protein_id: UniProtKB:P25522
    protein_label: "tRNA modification GTPase MnmE"
    taxon_label: "Escherichia coli BL21(DE3)"
    note: "MetalPDB trinuclear rubidium site occurrence in PDB 2gj9"
