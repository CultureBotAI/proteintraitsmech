      snippet: residue_name ASP; residue_pdb_number 124; chain_letter A
      notes: MetalPDB site 4lvp_2 (PDB 4lvp, mononuclear Tantalum, coordination number 1; geometry n/a).
        Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating ligands
        (water, nucleotides) that are not written as nodes here.
  - subject: res4lvpASP124A
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: A coordinating residue of this metal site.
    evidence:
    - reference: PDB:4lvp
      snippet: residue_name ASP; residue_pdb_number 124; chain_letter A
      notes: MetalPDB site 4lvp_2 (PDB 4lvp, mononuclear Tantalum, coordination number 1; geometry n/a).
        Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating ligands
        (water, nucleotides) that are not written as nodes here.
  - subject: metal
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: The coordinated metal ion of this site.
    evidence:
    - reference: PDB:4lvp
      snippet: periodic_symbol Ta; coordination_number 1
      notes: MetalPDB site 4lvp_2 metal record.
