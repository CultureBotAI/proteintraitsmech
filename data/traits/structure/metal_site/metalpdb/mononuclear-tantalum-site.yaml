    description: KB trait record (STRUCT_METAL_SITE) — the coordination class this site belongs to.
  - node_id: res4lvpASP124A
    label: coordinating ASP124 (PDB 4lvp chain A author numbering; no UniProt position asserted)
    node_type: RESIDUE
    grounding: UniProtKB:Q68RJ5
  edges:
