identifier: proteintraitsmech:METALPDB_TA_MONONUCLEAR
label: "mononuclear tantalum site"
definition: >-
  A structural metal-binding site in which tantalum is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a mononuclear tantalum site (1 metal ion per site). Across the MetalPDB release this class aggregates 1 metal-site occurrences in 1 PDB structures (1+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Asp (1).
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:33348
    role: COFACTOR
    name: tantalum
canonical_examples:
  - protein_id: UniProtKB:Q68RJ5
    protein_label: "Intraflagellar transport protein 81"
    taxon_label: "Chlamydomonas reinhardtii"
    note: "MetalPDB mononuclear tantalum site occurrence in PDB 4lvp"
causal_graphs:
- graph_id: metal_coordination
  title: Coordination of tantalum at the mononuclear tantalum site
  description: Protein residues coordinating the metal, transcribed from MetalPDB across 1 exemplar site(s).
    Residue numbering is the PDB author frame MetalPDB reports; no UniProt position is asserted.
  nodes:
  - node_id: metal
    label: tantalum
    node_type: CHEMICAL
    grounding: CHEBI:33348
  - node_id: site
    label: mononuclear tantalum site
    node_type: MOTIF
