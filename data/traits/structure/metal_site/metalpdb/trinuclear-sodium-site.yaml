    protein_label: "lactate dehydrogenase"
    taxon_label: Apicomplexa
    note: "MetalPDB trinuclear sodium site occurrence in PDB 4plg"
  - protein_id: UniProtKB:A0A0B6VPP7
    protein_label: Beta-lactamase
    taxon_label: "Serratia marcescens"
