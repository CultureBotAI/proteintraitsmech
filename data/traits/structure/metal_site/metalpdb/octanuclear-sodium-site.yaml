identifier: proteintraitsmech:METALPDB_NA_OCTANUCLEAR
label: "octanuclear sodium site"
definition: >-
  A structural metal-binding site in which sodium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a octanuclear sodium site (8 metal ions per site). Across the MetalPDB release this class aggregates 5 metal-site occurrences in 5 PDB structures (3+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Glu (4); Gln (2); NX(2)S (2). Typical coordination geometry: tetrahedron with a vacancy, irregular.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:26708
    role: COFACTOR
    name: sodium
canonical_examples:
  - protein_id: UniProtKB:Q0GMU3
    protein_label: Beta-glucosidase
    taxon_label: "uncultured bacterium"
    note: "MetalPDB octanuclear sodium site occurrence in PDB 3fiz"
  - protein_id: UniProtKB:Q93009
    protein_label: "Ubiquitin carboxyl-terminal hydrolase 7"
    taxon_label: "Homo sapiens"
    note: "MetalPDB octanuclear sodium site occurrence in PDB 1yy6"
