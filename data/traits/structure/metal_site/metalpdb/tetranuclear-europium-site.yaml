identifier: proteintraitsmech:METALPDB_EU_TETRANUCLEAR
label: "tetranuclear europium site"
definition: >-
  A structural metal-binding site in which europium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a tetranuclear europium site (4 metal ions per site). Across the MetalPDB release this class aggregates 2 metal-site occurrences in 1 PDB structures (1+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are E, E (2). Typical coordination geometry: square pyramid with a vacancy, square plane.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:32999
    role: COFACTOR
    name: europium
canonical_examples:
