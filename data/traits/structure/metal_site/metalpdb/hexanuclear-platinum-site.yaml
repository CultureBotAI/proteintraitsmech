identifier: proteintraitsmech:METALPDB_PT_HEXANUCLEAR
label: "hexanuclear platinum site"
definition: >-
  A structural metal-binding site in which platinum is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a hexanuclear platinum site (6 metal ions per site). Across the MetalPDB release this class aggregates 2 metal-site occurrences in 2 PDB structures (1+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are His (10). Typical coordination geometry: irregular, trigonal bipyramid with a vacancy.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:33364
    role: COFACTOR
    name: platinum
canonical_examples:
  - protein_id: UniProtKB:P00698
    protein_label: "Lysozyme C"
    taxon_label: "Gallus gallus"
    note: "MetalPDB hexanuclear platinum site occurrence in PDB 4mwk"
causal_graphs:
- graph_id: metal_coordination
  title: Coordination of platinum at the hexanuclear platinum site
  description: Protein residues coordinating the metal, transcribed from MetalPDB across 1 exemplar site(s).
    Residue numbering is the PDB author frame MetalPDB reports; no UniProt position is asserted.
  nodes:
  - node_id: metal
    label: platinum
    node_type: CHEMICAL
    grounding: CHEBI:33364
  - node_id: site
    label: hexanuclear platinum site
    node_type: MOTIF
    grounding: proteintraitsmech:METALPDB_PT_HEXANUCLEAR
    description: KB trait record (STRUCT_METAL_SITE) — the coordination class this site belongs to.
  - node_id: res4mwkHIS15A
    label: coordinating HIS15 (PDB 4mwk chain A author numbering; no UniProt position asserted)
    node_type: RESIDUE
    grounding: UniProtKB:P00698
  edges:
  - subject: res4mwkHIS15A
    predicate: molecularly interacts with (coordinates)
    predicate_id: RO:0002436
    object: metal
    description: HIS15 donates a donor atom to the coordinated platinum.
    evidence:
    - reference: PDB:4mwk
      snippet: residue_name HIS; residue_pdb_number 15; chain_letter A
      notes: MetalPDB site 4mwk_1 (PDB 4mwk, hexanuclear Platinum, coordination number 3; geometry irregular
        (n/a)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating
        ligands (water, nucleotides) that are not written as nodes here.
  - subject: res4mwkHIS15A
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: A coordinating residue of this metal site.
    evidence:
    - reference: PDB:4mwk
      snippet: residue_name HIS; residue_pdb_number 15; chain_letter A
      notes: MetalPDB site 4mwk_1 (PDB 4mwk, hexanuclear Platinum, coordination number 3; geometry irregular
        (n/a)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating
        ligands (water, nucleotides) that are not written as nodes here.
  - subject: metal
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: The coordinated metal ion of this site.
    evidence:
    - reference: PDB:4mwk
      snippet: periodic_symbol Pt; coordination_number 3
      notes: MetalPDB site 4mwk_1 metal record.
