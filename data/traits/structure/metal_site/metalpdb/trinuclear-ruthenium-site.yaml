    description: KB trait record (STRUCT_METAL_SITE) — the coordination class this site belongs to.
  - node_id: res3aseHIS81A
    label: coordinating HIS81 (PDB 3ase chain A author numbering; no UniProt position asserted)
    node_type: RESIDUE
    grounding: UniProtKB:P02185
  edges:
