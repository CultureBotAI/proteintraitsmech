identifier: proteintraitsmech:METALPDB_RU_TRINUCLEAR
label: "trinuclear ruthenium site"
definition: >-
  A structural metal-binding site in which ruthenium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a trinuclear ruthenium site (3 metal ions per site). Across the MetalPDB release this class aggregates 4 metal-site occurrences in 3 PDB structures (3+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are His (2); HX(15)E (1). Typical coordination geometry: linear, octahedron.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:30682
    role: COFACTOR
    name: ruthenium
canonical_examples:
  - protein_id: UniProtKB:P02185
    protein_label: Myoglobin
    taxon_label: "Physeter catodon"
    note: "MetalPDB trinuclear ruthenium site occurrence in PDB 3ase"
  - protein_id: UniProtKB:P02791
    protein_label: "Ferritin light chain"
    taxon_label: "Equus caballus"
    note: "MetalPDB trinuclear ruthenium site occurrence in PDB 3wvw"
  - protein_id: UniProtKB:P97438
    protein_label: "Potassium channel subfamily K member 2"
    taxon_label: "Mus musculus"
    note: "MetalPDB trinuclear ruthenium site occurrence in PDB 6v37"
