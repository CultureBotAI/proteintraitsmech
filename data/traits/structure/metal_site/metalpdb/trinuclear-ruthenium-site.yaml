        (regular)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating
        ligands (water, nucleotides) that are not written as nodes here.
  - subject: res3aseHIS81A
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: A coordinating residue of this metal site.
    evidence:
