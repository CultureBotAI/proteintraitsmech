      snippet: residue_name HIS; residue_pdb_number 81; chain_letter A
      notes: MetalPDB site 3ase_1 (PDB 3ase, trinuclear Ruthenium, coordination number 2; geometry linear
        (regular)). Field values quoted from flat_db_file.xml.gz; MetalPDB also lists non-protein coordinating
        ligands (water, nucleotides) that are not written as nodes here.
  - subject: metal
    predicate: part of
    predicate_id: BFO:0000050
    object: site
    description: The coordinated metal ion of this site.
    evidence:
