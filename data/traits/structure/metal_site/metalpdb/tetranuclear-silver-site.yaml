    protein_label: "Putative copper chaperone"
    taxon_label: "Salmonella enterica"
    note: "MetalPDB tetranuclear silver site occurrence in PDB 5f0u"
  - protein_id: UniProtKB:O00244
    protein_label: "Copper transport protein ATOX1"
    taxon_label: "Homo sapiens"
