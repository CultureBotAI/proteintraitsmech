    protein_label: ALPHA-GALACTOSIDASE
    taxon_label: "Lactobacillus acidophilus NCFM"
    note: "MetalPDB tetranuclear platinum site occurrence in PDB 2xn0"
  - protein_id: UniProtKB:P00698
    protein_label: "Lysozyme C"
    taxon_label: "Gallus gallus"
    note: "MetalPDB tetranuclear platinum site occurrence in PDB 4mwm"
