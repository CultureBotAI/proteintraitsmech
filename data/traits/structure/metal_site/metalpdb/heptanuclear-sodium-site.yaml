    protein_label: "Nitrogenase molybdenum-iron protein alpha chain"
    taxon_label: "Azotobacter vinelandii"
    note: "MetalPDB heptanuclear sodium site occurrence in PDB 6o7s"
  - protein_id: UniProtKB:P20279
    protein_label: "50S ribosomal protein L3P"
