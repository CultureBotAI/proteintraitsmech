    protein_label: "Lysozyme C"
    taxon_label: "Gallus gallus"
    note: "MetalPDB trinuclear rhodium site occurrence in PDB 3a94"
  - protein_id: UniProtKB:P02791
    protein_label: "Ferritin light chain"
    taxon_label: "Equus caballus"
    note: "MetalPDB trinuclear rhodium site occurrence in PDB 2zur"
