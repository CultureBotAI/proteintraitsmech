identifier: proteintraitsmech:METALPDB_RH_TRINUCLEAR
label: "trinuclear rhodium site"
definition: >-
  A structural metal-binding site in which rhodium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a trinuclear rhodium site (3 metal ions per site). Across the MetalPDB release this class aggregates 2 metal-site occurrences in 2 PDB structures (2+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Asn (2); His (1). Typical coordination geometry: trigonal plane with a vacancy, square pyramid.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:33359
    role: COFACTOR
    name: rhodium
canonical_examples:
