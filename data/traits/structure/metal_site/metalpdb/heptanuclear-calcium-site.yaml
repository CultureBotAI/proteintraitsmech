identifier: proteintraitsmech:METALPDB_CA_HEPTANUCLEAR
label: "heptanuclear calcium site"
definition: >-
  A structural metal-binding site in which calcium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a heptanuclear calcium site (7 metal ions per site). Across the MetalPDB release this class aggregates 3 metal-site occurrences in 3 PDB structures (2+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Asn (1); Ala (1). Typical coordination geometry: irregular, square antiprism.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:22984
    role: COFACTOR
    name: calcium
canonical_examples:
