    protein_label: Prothrombin
    taxon_label: "Bos taurus"
    note: "MetalPDB heptanuclear calcium site occurrence in PDB 2pf2"
  - protein_id: UniProtKB:P08709
    protein_label: "Coagulation factor VII"
    taxon_label: "Homo sapiens"
    note: "MetalPDB heptanuclear calcium site occurrence in PDB 4ibl"
