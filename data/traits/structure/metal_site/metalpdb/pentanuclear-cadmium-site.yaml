    protein_label: "Phosphoribosyl-AMP cyclohydrolase"
    taxon_label: "Methanothermobacter thermautotrophicus"
    note: "MetalPDB pentanuclear cadmium site occurrence in PDB 1zps"
  - protein_id: UniProtKB:O31097
    protein_label: 3-phytase
    taxon_label: "Bacillus subtilis"
    note: "MetalPDB pentanuclear cadmium site occurrence in PDB 3ams"
  - protein_id: UniProtKB:P02791
    protein_label: "Ferritin light chain"
    taxon_label: "Equus caballus"
    note: "MetalPDB pentanuclear cadmium site occurrence in PDB 5gu2"
