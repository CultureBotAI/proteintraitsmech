identifier: proteintraitsmech:METALPDB_HF_TRINUCLEAR
label: "trinuclear hafnium site"
definition: >-
  A structural metal-binding site in which hafnium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a trinuclear hafnium site (3 metal ions per site). Across the MetalPDB release this class aggregates 1 metal-site occurrences in 1 PDB structures (1+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Tyr (2). Typical coordination geometry: pentagonal bipyramid.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
