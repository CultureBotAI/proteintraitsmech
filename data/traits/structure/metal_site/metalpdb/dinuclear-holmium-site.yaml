identifier: proteintraitsmech:METALPDB_HO_DINUCLEAR
label: "dinuclear holmium site"
definition: >-
  A structural metal-binding site in which holmium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a dinuclear holmium site (2 metal ions per site). Across the MetalPDB release this class aggregates 5 metal-site occurrences in 3 PDB structures (3+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are DX(1)E (2); Asp (2); DX(3)EX(22)DX(4)EX(0)D (2). Typical coordination geometry: irregular, square antiprism with a vacancy.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - proteintraitsmech:METAL_BINDING_SITE
chemical_participants:
  - chebi: CHEBI:49648
    role: COFACTOR
    name: holmium
canonical_examples:
  - protein_id: UniProtKB:O31663
    protein_label: "Methylthioribose kinase"
    taxon_label: "Bacillus subtilis"
    note: "MetalPDB dinuclear holmium site occurrence in PDB 2olc"
  - protein_id: UniProtKB:P00748
    protein_label: "Coagulation factor XII"
    taxon_label: "Homo sapiens"
    note: "MetalPDB dinuclear holmium site occurrence in PDB 4bdw"
  - protein_id: UniProtKB:P19999
    protein_label: "Mannose-binding protein A"
    taxon_label: "Rattus rattus"
    note: "MetalPDB dinuclear holmium site occurrence in PDB 1msb"
