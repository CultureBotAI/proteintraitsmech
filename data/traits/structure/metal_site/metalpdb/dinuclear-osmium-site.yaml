identifier: proteintraitsmech:METALPDB_OS_DINUCLEAR
label: "dinuclear osmium site"
definition: >-
  A structural metal-binding site in which osmium is coordinated by protein side-chain, backbone and/or exogenous ligands, classified by MetalPDB as a dinuclear osmium site (2 metal ions per site). Across the MetalPDB release this class aggregates 496 metal-site occurrences in 15 PDB structures (6+ distinct UniProt proteins). The most frequent endogenous coordination signatures (MetalPDB ligands_pattern) are Asp (2). Typical coordination geometry: octahedron, irregular.
definition_source: "MetalPDB (CERM, University of Florence)"
trait_axis: STRUCTURE
trait_category: STRUCT_METAL_SITE
term_kind: CLASS
mapping_status: REVIEWED
