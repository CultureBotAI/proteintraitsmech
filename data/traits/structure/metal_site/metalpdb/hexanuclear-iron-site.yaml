    protein_label: "Quinolinate synthase A"
    taxon_label: "Pyrococcus horikoshii"
    note: "MetalPDB hexanuclear iron site occurrence in PDB 4zk6"
  - protein_id: UniProtKB:P07598
    protein_label: "Periplasmic [Fe] hydrogenase large subunit"
    taxon_label: "Desulfovibrio vulgaris str. Hildenborough"
    note: "MetalPDB hexanuclear iron site occurrence in PDB 1hfe"
