    protein_label: "Interstitial collagenase"
    taxon_label: "Homo sapiens"
    note: "MetalPDB dinuclear samarium site occurrence in PDB 2tcl"
  - protein_id: UniProtKB:P0AFC0
    protein_label: "Dihydroneopterin triphosphate pyrophosphatase"
    taxon_label: "Escherichia coli"
    note: "MetalPDB dinuclear samarium site occurrence in PDB 2o5w"
  - protein_id: UniProtKB:P10688
    protein_label: "1-phosphatidylinositol-4,5-bisphosphate phosphodiesterase delta-1"
    taxon_label: "Rattus norvegicus"
    note: "MetalPDB dinuclear samarium site occurrence in PDB 1qat"
  - protein_id: UniProtKB:P39748
