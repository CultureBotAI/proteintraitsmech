causal_graphs:
- graph_id: resistance
  title: Mycobacterium tuberculosis rpsL mutations conferring resistance to Streptomycin → mechanism →
    resistance (curated from ARO relations + literature)
  description: 'Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family''s verbatim literature evidence
    (ARO:3003395). rpsL -- target alteration IN TRANS: the determinant is a protein, but the drug''s binding
    partner CARD names is the 16S rRNA. CARD says S12 ''stabilizes'' the pseudoknot; PMID:7934937, its
    source, says only that the region ''has been linked to'' S12 -- so THAT edge is `correlated with`,
    not a causal one. The conferral edges DO follow CARD (#363): CARD is the only source that states conferral,
    and refusing it there would leave the record asserting a mechanism with no one claiming the outcome.
    The record follows the weaker source on the one claim where the two disagree, not everywhere.'
