      snippet: We also describe the crystal structure of the 30S subunit complexed with the antibiotics
        paromomycin, streptomycin and spectinomycin, which interfere with decoding and translocation.
      notes: Carter 2000. Establishes streptomycin binds the 30S subunit and interferes with decoding
        and translocation. It does NOT state the 16S rRNA contact residue-by-residue; that specificity
        is CARD's, cited alongside.
    - reference: ARO:3003395
      snippet: Ribosomal protein S12 stabilizes the highly conserved pseudoknot structure formed by 16S
        rRNA. Amino acid substitutions in RpsL affect the higher-order structure of 16S rRNA and confer
        streptomycin resistance by disrupting interactions between 16S rRNA and streptomycin.
      notes: '''interactions between 16S rRNA and streptomycin'' -- CARD names the partner.'
