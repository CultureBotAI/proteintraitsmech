    predicate_id: RO:0002436
    object: rrna16s
    description: The drug-action arm. Streptomycin acts on the 30S subunit; CARD names the 16S rRNA as
      its interaction partner on this record. The drug0 node is the CLASS (ARO:0000016), which is as specific
