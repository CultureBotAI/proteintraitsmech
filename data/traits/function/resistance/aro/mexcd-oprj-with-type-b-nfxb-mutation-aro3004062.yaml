    description: CARD classifies this NfxB-mutant MexCD-OprJ pump under the antibiotic efflux resistance
      mechanism.
    evidence:
    - reference: ARO:3004062
      snippet: MexCD-OprJ with Type B NfxB mutions are more resistant to tetracycline and chloramphenicol,
        as well as ofloxacin, erythromycin, and the new zwitterionic cephems, than was PAO1, and they
        are four to eight times more susceptible to carbenicillin, sulbenicillin, imipenem, panipenem,
        biapenem, moxalactam, aztreonam, gentamicin, and kanamycin than PAO1.
      notes: CARD definition for MexCD-OprJ with type B NfxB mutation.
    - reference: ARO:3000797
      snippet: MexCD-OprJ is a multidrug efflux protein expressed in the Gram-negative Pseudomonas aeruginosa.
        MexC is the membrane fusion protein; MexD is the inner membrane transporter; and OprJ is the outer
        membrane channel. MexAB-OprM is associated with resistance to fluoroquinolones, chloramphenicol,
        and macrolides. MexCD-OprJ is typically quiescent in wild-type cells, with expression following
        mutation of the nfxB gene that is divergently transcribed from the mexCD-oprJ operon and encodes
        a repressor of mexCD-oprJ expression. Expression of mexCD–oprJ is controlled by a single known
        regulator, the NfxB repressor encoded by the nfxB gene, which is transcribed divergently from
        the efflux genes.
      notes: CARD definition for the MexCD-OprJ efflux pump.
    - reference: ARO:0010004
      snippet: Directed pumping of antibiotic out of a cell to confer resistance. Resistance-nodulation-division
        (RND) proteins are found in both prokaryotic and eukaryotic cells and have diverse substrate specificities
        and physiological roles.
      notes: CARD definition for RND antibiotic efflux pumps.
    - reference: ARO:3000159
