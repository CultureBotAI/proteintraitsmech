      notes: CARD definition for the antibiotic efflux resistance mechanism.
    - reference: PMID:16915237
      snippet: The structures indicate that drugs are exported by a three-step functionally rotating mechanism
        in which substrates undergo ordered binding change.
      notes: Evidence for RND pump-mediated drug export.
