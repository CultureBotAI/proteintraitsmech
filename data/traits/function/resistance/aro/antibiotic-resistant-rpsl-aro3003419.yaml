      notes: '''a pseudoknot structure in a region'' of the 16S rRNA.'
  - subject: altered_structure
    predicate: characteristic of (a structure of the 16S rRNA)
    predicate_id: RO:0000052
    object: rrna16s
    description: A conformation INHERES IN a molecule; it is not a mereological part of one. BFO:0000050
      was used here until review noted the snippet's genitive -- 'the higher-order structure OF 16S rRNA'
      -- is the inherence reading (#384).
    evidence:
    - reference: ARO:3003419
      snippet: Ribosomal protein S12 stabilizes the highly conserved pseudoknot structure formed by 16S
        rRNA. Amino acid substitutions in RpsL affect the higher-order structure of 16S rRNA and confer
        antibiotic resistance.
      notes: '''the higher-order structure OF 16S rRNA''.'
  - subject: determinant
    predicate: correlated with (linked to the pseudoknot region)
    predicate_id: RO:0002610
    object: pseudoknot
    description: 'Same treatment as ARO:3003395: CARD says S12 ''stabilizes'', its source says the region
      ''has been linked to'' S12, and the edge follows the source on the one claim they disagree about.'
    evidence:
    - reference: PMID:7934937
      snippet: The 16S rRNA region mutated perturbs a pseudoknot structure in a region which has been
        linked to ribosomal S12 protein.
      notes: '''has been linked to ribosomal S12 protein'' -- hedged.'
    - reference: ARO:3003419
      snippet: Ribosomal protein S12 stabilizes the highly conserved pseudoknot structure formed by 16S
        rRNA. Amino acid substitutions in RpsL affect the higher-order structure of 16S rRNA and confer
        antibiotic resistance.
      notes: CARD's stronger 'stabilizes', recorded so the gap is on the edge.
  - subject: determinant
    predicate: causally upstream of (substitution alters the higher-order structure)
    predicate_id: RO:0002411
    object: altered_structure
    description: 'The furthest this record''s own definition goes. ARO:3003395 continues to the drug interaction;
      this one does not, and no drug-binding node is written. The object is the CONFORMATION, not the
      molecule: ''affects the higher-order structure'' does not say the rRNA''s function is decreased
      (#377). A STATE object is fine -- round 121''s ARO:3003395 uses one. That is a CORPUS convention,
      not something RO licenses: RO:0002212 reads ''decreases the rate or magnitude of EXECUTION of q''
      (#385, #388).'
    evidence:
    - reference: ARO:3003419
      snippet: Ribosomal protein S12 stabilizes the highly conserved pseudoknot structure formed by 16S
        rRNA. Amino acid substitutions in RpsL affect the higher-order structure of 16S rRNA and confer
        antibiotic resistance.
      notes: '''substitutions in RpsL AFFECT THE HIGHER-ORDER STRUCTURE of 16S rRNA and confer antibiotic
        resistance''. NOT asserted: any disruption of a drug-rRNA interaction, which this definition --
        unlike ARO:3003395''s -- does not mention.'
