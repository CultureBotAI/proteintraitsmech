    (ARO:3003419). rpsL, drug-agnostic. Its definition ends at 'confer antibiotic resistance' where ARO:3003395
    continues 'by disrupting interactions between 16S rRNA and streptomycin'. NO drug-binding arm is written,
    because this record names no drug interaction to disrupt -- see the test that pins the difference.
