    evidence:
    - reference: PMID:11290327
      snippet: The inhibitor binds in a pocket of the RNAP beta subunit deep within the DNA/RNA channel,
        but more than 12 A away from the active site.
      notes: Campbell et al. 2001, crystal structure of Thermus aquaticus core RNAP with rifampicin.
  - subject: rif_pocket
    predicate: negatively regulates (blocks the elongating transcript)
    predicate_id: RO:0002212
    object: rnap_activity
    evidence:
    - reference: PMID:11290327
      snippet: The structure, combined with biochemical results, explains the effects of Rif on RNAP function
        and indicates that the inhibitor acts by directly blocking the path of the elongating RNA when
        the transcript becomes 2 to 3 nt in length.
      notes: Blocking happens once the transcript reaches 2-3 nt -- which is why rifampicin stops initiation
        rather than ongoing elongation.
  - subject: rrdr
    predicate: negatively regulates (substitution weakens drug binding)
    predicate_id: RO:0002212
    object: rif_pocket
    description: 'The causal core: substitutions in the RRDR reshape the pocket the drug binds, and resistance
      is high-level and single-step.'
    evidence:
    - reference: PMID:8095569
      snippet: Thus, substitution of a limited number of highly conserved aminoacids encoded by the rpoB
        gene appears to be the molecular mechanism responsible for “single step” high-level resistance
        to rifampicin in M tuberculosis.
      notes: Telenti et al. 1993. The RRDR is defined by where resistance substitutions fall; Campbell
        et al. 2001 later showed that region lines the drug's pocket.
