    object: determinant
    evidence:
    - reference: Pfam:PF04563
      snippet: RNA polymerases catalyse the DNA dependent polymerisation of RNA. Prokaryotes contain a
        single RNA polymerase compared to three in eukaryotes. This domain forms one of the two distinctive
        lobes of the Rpb2 structure.
      notes: KB trait record Pfam:PF04563; snippet is the InterPro:IPR007644 abstract that record's definition
        is taken from. Rpb2 is the structural name for the beta subunit, which is what makes this the
        right domain for an rpoB determinant.
  - subject: rrdr
    predicate: part of (the RRDR lies in the beta subunit)
    predicate_id: BFO:0000050
    object: domain
    evidence:
    - reference: PMID:8095569
      snippet: Mutations involving 8 conserved aminoacids were identified in 64 of 66 rifampicin-resistant
        isolates of diverse geographical origin, but in none of 56 sensitive isolates. All mutations were
        clustered within a region of 23 aminoacids.
      notes: Telenti et al. 1993 located the substitutions to a 23-residue region of rpoB.
    - reference: PMID:11290327
      snippet: The inhibitor binds in a pocket of the RNAP beta subunit deep within the DNA/RNA channel,
        but more than 12 A away from the active site.
      notes: Campbell et al. 2001 place the drug's pocket in that same beta subunit. The containment is
        an inference FROM THESE TWO SOURCES TOGETHER, not a single asserted statement.
  - subject: domain
    predicate: enables (transcription elongation)
