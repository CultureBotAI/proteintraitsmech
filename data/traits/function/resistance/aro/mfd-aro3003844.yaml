  - subject: dna_repair
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: resistance
    description: Mfd-coupled repair promotes the mutation frequency that allows fluoroquinolone resistance
      to develop.
    evidence:
    - reference: ARO:3003844
      snippet: mfd dissociates transcription elongation complexes blocked at nonpairing lesions and mediates
        recruitment of DNA repair proteins. The Mfd (mutation frequency decline) protein, also known as
        transcription-repair coupling factor, is responsible for ATP-dependent removal of stalled RNA
        polymerase from DNA lesions by inducing forward movement of the RNA polymerase and subsequent
        recruitment of nucleotide excision repair machinery to the sites of the lesions.
      notes: CARD definition for mfd.
    - reference: PMID:18535657
      snippet: Mutation of the mfd gene resulted in an approximately 100-fold reduction in the rate of
        spontaneous mutation to ciprofloxacin resistance, while overexpression of mfd elevated the mutation
        frequency.
      notes: Mfd activity increased the mutation frequency leading to ciprofloxacin resistance.
    - reference: PMID:18535657
      snippet: In addition, loss of mfd in C. jejuni significantly reduced the development of fluoroquinolone-resistant
        Campylobacter in culture media or chickens treated with fluoroquinolones.
      notes: Loss of mfd reduced fluoroquinolone-resistance development both in culture and in fluoroquinolone-treated
        chickens.
