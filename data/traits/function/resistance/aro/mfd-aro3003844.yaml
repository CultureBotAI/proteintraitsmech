  title: mfd → transcription-coupled DNA repair → fluoroquinolone resistance emergence
  description: Curated Mfd graph that replaces the stale inherited Qnr pentapeptide-repeat target-protection
    scaffold. Mfd is a transcription-repair coupling factor whose ATP-dependent handling of stalled transcription
    complexes promotes the mutation supply from which fluoroquinolone-resistant Campylobacter emerges.
