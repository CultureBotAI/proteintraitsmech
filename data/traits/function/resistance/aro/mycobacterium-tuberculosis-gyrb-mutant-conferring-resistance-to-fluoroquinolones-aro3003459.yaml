  - subject: cleavage_complex
    predicate: causally upstream of (drug-stabilised breaks kill the cell)
    predicate_id: RO:0002411
    object: cell_death
    description: Unresolved topoisomerase-DNA cleavage complexes block replication and transcription and
      can become lethal DNA lesions.
    evidence:
    - reference: PMID:24576155
      snippet: If the strand breaks overwhelm these processes, they can lead to cell death. This is the
        primary mechanism that quinolones use to kill bacterial cells
      notes: Aldred 2014.
    - reference: DOI:10.3390/molecules25235662
      snippet: 'If the cleavage complex is not processed, DNA replication and transcription are blocked,
        eventually leading to cell death: slow death.'
      notes: Bush et al. 2020, linking unresolved topoisomerase-DNA cleavage complexes to blocked replication/transcription
        and death.
