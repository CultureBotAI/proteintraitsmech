    predicate_id: RO:0002411
    object: cleavage_complex
    evidence:
    - reference: PMID:24576155
      snippet: To maintain genomic integrity during this process, the enzymes form covalent bonds between
        active site tyrosine residues and the newly generated 5′-DNA termini.
      notes: Aldred 2014. The cleavage complex is the enzyme's own catalytic intermediate, present with
        or without drug.
    - reference: PMID:15659402
      snippet: Topoisomerase (topo) IV and gyrase are bacterial type IIA DNA topoisomerases essential
        for DNA replication and chromosome segregation that act via a transient double-stranded DNA break
        involving a covalent enzyme-DNA "cleavage complex."
      notes: Leo et al. 2005, supporting the type-II-topoisomerase cleavage-complex intermediate.
    description: Type IIA topoisomerase activity transiently forms a covalent enzyme-cleaved-DNA intermediate.
