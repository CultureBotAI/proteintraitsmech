    evidence:
    - reference: Pfam:PF00204
      snippet: 'There are four functional domains in topoisomerase II: domain 1 (N-terminal of gyrB) is
        an ATPase, domain 2 (C-terminal of gyrB) is responsible for subunit interactions, domain 3 (N-terminal
        of gyrA) is responsible for the breaking-rejoining function through its capacity to form protein-DNA
        bridges, and domain 4 (C-terminal of gyrA) is able to non-specifically bind DNA.'
      notes: KB trait record Pfam:PF00204; snippet is the InterPro:IPR013506 abstract that record's definition
        is taken from.
    - reference: ARO:3003459
      snippet: Point mutation in Mycobacterium tuberculosis gyrB resulting in fluoroquinolone resistance.
      notes: CARD definition for Mycobacterium tuberculosis gyrB mutant conferring resistance to fluoroquinolones.
    - reference: InterPro:IPR013506
      snippet: 'There are four functional domains in topoisomerase II: domain 1 (N-terminal of gyrB) is
        an ATPase, domain 2 (C-terminal of gyrB) is responsible for subunit interactions, domain 3 (N-terminal
        of gyrA) is responsible for the breaking-rejoining function through its capacity to form protein-DNA
        bridges, and domain 4 (C-terminal of gyrA) is able to non-specifically bind DNA.'
      notes: InterPro abstract behind Pfam:PF00204, the shared GyrB/ParE subunit-B domain in this KB.
    - reference: PMID:24576155
      snippet: The subunits in gyrase are GyrA and GyrB. The homologous subunits in topoisomerase IV are
        ParC and ParE in Gram-negative species and GrlA and GrlB in Gram-positive species. GyrA (and the
