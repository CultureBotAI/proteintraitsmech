  - subject: determinant
    predicate: negatively regulates (the defective EthA cannot activate the prodrug)
    predicate_id: RO:0002212
    object: monooxygenase
    description: 'The causal core, and it runs backwards as katG''s does: resistance is the ABSENCE of
      an activity.'
    evidence:
    - reference: PMID:10944230
      snippet: We have demonstrated that overproduction of Rv3855 (EtaR), a putative regulatory protein
        from MTb, confers ETA resistance whereas overproduction of an adjacent, clustered monooxygenase
        (Rv3854c, EtaA) confers ETA hypersensitivity.
      notes: 'Shown by the converse rather than by knockout: overproduction gives hypersensitivity, so
        loss gives resistance.'
