    evidence:
    - reference: PMID:10944230
      snippet: Synthesis of radiolabeled ETA and an examination of drug metabolites formed by whole cells
        of Mycobacterium tuberculosis (MTb) have allowed us to demonstrate that ETA is activated by S-oxidation
        before interacting with its cellular target.
      notes: The paper says activation happens 'before interacting with its cellular target'; that the
        target is InhA is curated on ARO:3003417 from PMID:8284673, which showed inhA mutations confer
