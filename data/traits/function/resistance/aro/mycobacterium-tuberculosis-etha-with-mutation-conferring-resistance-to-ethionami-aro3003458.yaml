      notes: Activation precedes target engagement -- the drug as given does nothing.
  - subject: monooxygenase
    predicate: causally upstream of (activates the prodrug)
    predicate_id: RO:0002411
    object: activated_eta
    evidence:
    - reference: PMID:10944230
      snippet: We have demonstrated that overproduction of Rv3855 (EtaR), a putative regulatory protein
        from MTb, confers ETA resistance whereas overproduction of an adjacent, clustered monooxygenase
        (Rv3854c, EtaA) confers ETA hypersensitivity.
      notes: 'More EtaA, more sensitivity: the activity is what converts the prodrug.'
    - reference: PMID:10944230
      snippet: ETA is metabolized by MTb to a 4-pyridylmethanol product remarkably similar in structure
        to that formed by the activation of isoniazid by the catalase-peroxidase KatG.
      notes: And the product is 'remarkably similar in structure' to isoniazid's KatG-activated product,
        which is why the two drugs share a target and a resistance logic (round 27).
