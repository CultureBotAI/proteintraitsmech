        on the membrane surface. This confers resistance to cationic peptides that disrupt the cell membrane,
        including defensins. Additionally, large-scale mutations causing loss of function of the gene
        result in increased susceptibility to daptomycin.
      notes: CARD definition for Bacillus subtilis mprF.
    - reference: ARO:3003421
      snippet: Catalyzes the transfer of a lysyl group from L-lysyl-tRNA(Lys) to membrane-bound phosphatidylglycerol
        (PG), which produces lysylphosphatidylglycerol (LPG), a major component of the bacterial membrane
        with a positive net charge. LPG synthesis contributes to bacterial virulence as it is involved
        in the resistance mechanism against cationic antimicrobial peptides (CAMP) produces by the host's
        immune system (defensins, cathelicidins) and by the competing microorganisms (bacteriocins).
      notes: CARD definition for the antibiotic-resistant mprF parent term.
    - reference: PMID:11342591
      snippet: We describe a novel staphylococcal gene, mprF, which determines resistance to several host
        defense peptides such as defensins and protegrins.
      notes: Peschel et al. 2001 identified the gene by the resistance it confers to defensins and protegrins.
