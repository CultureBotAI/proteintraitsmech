identifier: ARO:3004910
label: "isoniazid resistant nat"
definition: >-
  Arylamine N-acetyltransferase catalyzes the transfer of the acetyl group from acetyl coenzyme A to the free amino group of arylamines and hydrazines. Reports have shown that overexpression of this enzyme may be responsible for increased resistance to isoniazid.
definition_source: ARO
trait_axis: FUNCTION
trait_category: FUNC_RESISTANCE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - ARO:3004909
trait_relations:
  - predicate: RO:0000056
    object: ARO:3000212
    relation_source: "ARO participates_in (mechanism) via ARO:0000031 antibiotic resistant gene variant or mutant"
  - predicate: biolink:related_to
    object: ARO:3007152
    relation_source: "ARO confers_resistance_to_drug_class via ARO:3004910 isoniazid resistant nat"
causal_graphs:
- graph_id: resistance
  title: isoniazid resistant nat → mechanism → resistance (curated from ARO relations + literature)
  description: 'Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family''s verbatim literature evidence
    (ARO:3004910). nat -- CARD names the chemistry (''arylamines and hydrazines'') and, separately, that
    overexpression may confer isoniazid resistance. NOT asserted: that isoniazid is the enzyme''s substrate.
    Isoniazid IS a hydrazine, so the inference is one step away -- and CARD does not take it. The Pfam
    record makes the link for HUMAN NAT, which is not evidence about this organism and carries no edge
    of its own (#396).'
  nodes:
  - node_id: determinant
    label: isoniazid resistant nat
    node_type: PROTEIN
    grounding: ARO:3004910
    description: CARD names the chemistry and the resistance separately on this record and never joins
      them. The mutation->overexpression link belongs to ARO:3004930, whose own definition supplies it
      (#395).
  - node_id: mech0
    label: mutation conferring antibiotic resistance
    node_type: MOLECULAR_FUNCTION
    grounding: ARO:3000212
  - node_id: drug0
    label: isoniazid-like antibiotic
    node_type: CHEMICAL
    grounding: ARO:3007152
  - node_id: family
    label: N-acetyltransferase
    node_type: DOMAIN
    grounding: Pfam:PF00797
    description: KB protein-trait record carrying the mechanism.
  - node_id: acetylation
    label: arylamine N-acetyltransferase activity
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0004060
    description: The EXACT term, and a KB record. GO:0008080 (N-acetyltransferase activity) was used until
      review noted its definition never names acetyl-CoA and its scope includes histone and rRNA acetyltransferases
      (#399).
  - node_id: acetyl_coa
    label: acetyl-CoA
    node_type: CHEMICAL
    grounding: CHEBI:15351
  - node_id: overexpression
    label: overexpression of the enzyme
    node_type: STATE
    description: The route CARD names.
  - node_id: resistance
    label: antibiotic resistance phenotype
    node_type: PHENOTYPE
    grounding: GO:0046677
    description: 'Resistance phenotype conferred by this determinant. Grounded to the nearest available
      superclass: ARO models determinants and mechanisms but has no term for the resistance phenotype
      itself.'
  edges:
  - subject: determinant
    predicate: participates in (resistance mechanism)
    predicate_id: RO:0000056
    object: mech0
    evidence:
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance. Examples included modified antibiotic targets with lower binding affinities and the
        deactivation of repressors that result in increased expression of genes that inactivate or pump
        out antibiotics.
      notes: The mechanism term's own definition, which names both point mutations and 'increased expression'
        among its examples (#393, corrected).
  - subject: mech0
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance. Examples included modified antibiotic targets with lower binding affinities and the
        deactivation of repressors that result in increased expression of genes that inactivate or pump
        out antibiotics.
      notes: ARO:3000212's own definition states that such mutations 'may result in antibiotic resistance'.
  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3004910
      snippet: Arylamine N-acetyltransferase catalyzes the transfer of the acetyl group from acetyl coenzyme
        A to the free amino group of arylamines and hydrazines. Reports have shown that overexpression
        of this enzyme may be responsible for increased resistance to isoniazid.
      notes: 'Quoted whole because BOTH qualifications matter: ''REPORTS HAVE SHOWN'' attributes the claim
        and ''MAY BE responsible'' hedges it.'
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance. Examples included modified antibiotic targets with lower binding affinities and the
        deactivation of repressors that result in increased expression of genes that inactivate or pump
        out antibiotics.
      notes: The mechanism term's own definition, which names 'increased expression' among its examples
        -- so an overexpression route is IN SCOPE for ARO:3000212, not a mismatch with it (#393, corrected).
  - subject: determinant
    predicate: confers resistance to (drug class)
    predicate_id: ARO:2000001
    object: drug0
    description: CARD asserts that this determinant confers resistance to isoniazid-like antibiotic.
    evidence:
    - reference: ARO:3004910
      snippet: 'relationship: confers_resistance_to_drug_class ARO:3007152 ! isoniazid-like antibiotic'
      notes: Asserted directly on ARO:3004910 (isoniazid resistant nat) in the CARD/ARO release in data/raw/aro/aro.obo.
  - subject: family
    predicate: part of (the N-acetyltransferase family assignment)
    predicate_id: BFO:0000050
    object: determinant
    evidence:
    - reference: Pfam:PF00797
      snippet: Arylamine N-acetyltransferase (NAT) facilitates the transfer of an acetyl group from acetyl
        coenzyme A on to a wide range of arylamine, N-hydroxyarylamines and hydrazines. Acetylation of
        these compounds generally results in inactivation.
      notes: 'KB trait: the NAT family. Its abstract names arylamine N-acetyltransferase itself (#196).'
  - subject: determinant
    predicate: enables (arylamine N-acetyltransferase activity)
