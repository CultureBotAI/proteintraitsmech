identifier: ARO:3005082
label: "Ribosomal protein mutation conferring resistance to pleuromutilin antibiotics"
definition: >-
  Ribosomal protein mutations that interfere with the rRNA conformation at the active site thus conferring antibiotic resistance.
definition_source: ARO
trait_axis: FUNCTION
trait_category: FUNC_RESISTANCE
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
  - ARO:0000031
trait_relations:
  - predicate: RO:0000056
    object: ARO:3000212
    relation_source: "ARO participates_in (mechanism) via ARO:0000031 antibiotic resistant gene variant or mutant"
  - predicate: biolink:related_to
    object: ARO:3000670
    relation_source: "ARO confers_resistance_to_drug_class via ARO:3005082 Ribosomal protein mutation conferring resistance to pleuromutilin antibiotics"
xrefs:
