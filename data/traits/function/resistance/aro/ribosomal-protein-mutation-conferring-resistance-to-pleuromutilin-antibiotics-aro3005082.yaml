      snippet: Chemical footprinting experiments show a reduced binding of tiamulin to mutant ribosomes.
      notes: 'Measured, not inferred: chemical footprinting.'
    - reference: PMID:12936991
      snippet: It is inferred that the L3 mutation, which points into the peptidyl transferase cleft,
