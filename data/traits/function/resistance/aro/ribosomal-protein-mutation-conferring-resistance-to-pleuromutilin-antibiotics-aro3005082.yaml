    evidence:
    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: 'CARD''s own sentence, which is all this record has: it names no protein, so Bosling 2003''s
        L3 experiments are the child term ARO:3005081''s evidence and are not cited here (#374, #382).'
  - subject: drug_binding
    predicate: negatively regulates (bound drug blocks peptide bond formation)
    predicate_id: RO:0002212
    object: peptide_bond
    description: 'Why losing the binding rescues the cell: the binding is what stops translation.'
