    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: CARD's own sentence. The L3-specific mechanism sentence belongs to ARO:3005081 (#382).
  - subject: determinant
    predicate: negatively regulates (mutation reduces drug binding)
    predicate_id: RO:0002212
    object: drug_binding
