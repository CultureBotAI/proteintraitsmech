    evidence:
    - reference: PMID:12936991
      snippet: The antibiotic tiamulin targets the 50S subunit of the bacterial ribosome and interacts
        at the peptidyl transferase center.
      notes: '''tiamulin ... INTERACTS AT the peptidyl transferase center'' -- the drug half, from a sentence
        about the DRUG rather than about the L3 mutant, whose experiment belongs to ARO:3005081 (#382).'
  - subject: drug_binding
    predicate: has part (the site it binds)
    predicate_id: BFO:0000051
    object: ptc
    evidence:
    - reference: PMID:15554968
      snippet: Our results show that tiamulin is located within the peptidyl transferase center (PTC)
        of the 50S ribosomal subunit with its tricyclic mutilin core positioned in a tight pocket at the
        A-tRNA binding site.
      notes: The site half of the same binding state.
  - subject: determinant
