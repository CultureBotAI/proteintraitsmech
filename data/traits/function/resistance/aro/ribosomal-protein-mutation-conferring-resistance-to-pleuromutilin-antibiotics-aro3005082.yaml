      notes: NOTE the drug0 node is the drug CLASS (ARO:3000670, pleuromutilin antibiotic); tiamulin is
        the member both papers studied (#353).
    - reference: PMID:12936991
      snippet: The antibiotic tiamulin targets the 50S subunit of the bacterial ribosome and interacts
        at the peptidyl transferase center.
      notes: Bosling 2003 states the same target independently.
