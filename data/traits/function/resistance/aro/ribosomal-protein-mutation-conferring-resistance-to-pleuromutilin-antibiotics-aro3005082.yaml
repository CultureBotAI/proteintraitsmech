evidence:
- reference: DOI:10.3390/antibiotics9060313
  notes: PMID:32526926 (aro citation)
causal_graphs:
- graph_id: resistance
  title: Ribosomal protein mutation → 23S rRNA conformational change → pleuromutilin resistance
  description: Curated resistance-causation graph for generic ribosomal-protein substitutions that alter
    local 23S rRNA conformation in trans and confer pleuromutilin resistance without naming one protein
    family.
  nodes:
  - node_id: determinant
    label: Ribosomal protein mutation conferring resistance to pleuromutilin antibiotics
    node_type: PROTEIN
    grounding: ARO:3005082
    description: 'CARD names no specific ribosomal protein on this record. The uL3 identity, its Pfam:PF00297
      family node and Bosling 2003''s L3 experiments all belong to the child term ARO:3005081 and are
      deliberately absent here (#371, #374, #380).'
  - node_id: mech0
    label: mutation conferring antibiotic resistance
    node_type: MOLECULAR_FUNCTION
    grounding: ARO:3000212
  - node_id: drug0
    label: pleuromutilin antibiotic
    node_type: CHEMICAL
    grounding: ARO:3000670
  - node_id: ptc
    label: peptidyl transferase centre (the drug's binding site)
    node_type: STATE
    description: 'Ungrounded. GO:0000048 is `peptidyltransferase activity`, the FUNCTION, and this node
      is the structural site the drug occupies -- not the same thing, so it is not reused (#346''s rule:
      a live CURIE that means something else is worse than none).'
  - node_id: subunit50s
    label: large ribosomal subunit (50S)
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0015934
    description: What the snippet actually locates the PTC in. The earlier `ptc part of rrna23s` edge
      asserted the PTC's COMPOSITION, which no snippet on this record states -- and PF00297's own hedge
      (L3 'may participate in the formation of the PTC') says the PTC is not wholly 23S rRNA anyway (#373).
  - node_id: rrna23s
    label: 23S ribosomal RNA
    node_type: NUCLEIC_ACID
    description: Grounded to the broad Sequence Ontology rRNA term because no stable narrower bacterial
      23S rRNA CURIE is available in the local curation evidence.
    grounding: SO:0000252
  - node_id: peptide_bond
    label: peptidyl transferase activity
    node_type: MOLECULAR_FUNCTION
    description: The ribosomal activity that synthesizes peptide bonds and is blocked when tiamulin binds
      at the PTC.
    grounding: GO:0000048
  - node_id: altered_conformation
    label: altered local 23S rRNA conformation at the active site
    node_type: STATE
    description: 'What the substitution produces. A STATE because the object of the causal edge should
      be the CONFORMATION, not the molecule: ''interferes with the rRNA conformation'' does not say the
      rRNA''s function is decreased, and resistant ribosomes still translate (#377). NOT because a STATE
      object is disallowed -- round 121''s ARO:3003395 points RO:0002212 at a STATE, and so does this
      graph, twice (#385).'
  - node_id: drug_binding
    label: tiamulin-ribosome binding
    node_type: STATE
    description: 'The drug-ribosome interaction. On THIS record nothing connects the substitution to it:
      CARD names no drug interaction here, so #387 removed both edges that asserted the mutation affected
      it. The uL3 record ARO:3005081 keeps those edges and the stronger wording (#406).'
  - node_id: resistance
    label: antibiotic resistance phenotype
    node_type: PHENOTYPE
    grounding: GO:0046677
    description: 'Resistance phenotype conferred by this determinant. Grounded to the nearest available
      superclass: ARO models determinants and mechanisms but has no term for the resistance phenotype
      itself.'
  edges:
  - subject: determinant
    predicate: participates in (resistance mechanism)
    predicate_id: RO:0000056
    object: mech0
    evidence:
    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: Family mechanism ARO:3000212.
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance.
      notes: CARD definition for mutation conferring antibiotic resistance.
    description: CARD classifies this ribosomal-protein determinant under mutation-conferring resistance.
  - subject: mech0
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: Mechanism ARO:3000212 → resistance.
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance.
      notes: CARD definition for mutation conferring antibiotic resistance.
    description: The inherited mutation mechanism captures altered gene products that cause resistance.
  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: CARD states the causation -- 'thus conferring resistance'.
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance.
      notes: CARD definition for mutation conferring antibiotic resistance.
