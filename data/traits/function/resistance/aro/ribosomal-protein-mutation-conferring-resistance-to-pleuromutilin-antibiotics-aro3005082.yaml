      at the active site.
  - subject: determinant
    predicate: confers resistance to (drug class)
    predicate_id: ARO:2000001
    object: drug0
    description: CARD asserts that this ribosomal-protein mutation class confers resistance to pleuromutilin
      antibiotics.
    evidence:
    - reference: ARO:3005082
      snippet: 'relationship: confers_resistance_to_drug_class ARO:3000670 ! pleuromutilin antibiotic'
      notes: Asserted directly on ARO:3005082 (Ribosomal protein mutation conferring resistance to pleuromutilin
        antibiotics) in the CARD/ARO release in data/raw/aro/aro.obo.
    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: CARD definition for ribosomal protein mutations conferring resistance to pleuromutilin antibiotics.
    - reference: PMID:32526926
      snippet: Tiamulin is a semisynthetic pleuromutilin antibiotic
      notes: Killeavy 2020 isolated tiamulin-resistant Thermus thermophilus mutants; tiamulin is the tested
        pleuromutilin-class member.
  - subject: ptc
    predicate: part of (the PTC of the 50S subunit)
    predicate_id: BFO:0000050
    object: subunit50s
    description: Tiamulin binds in the peptidyl transferase center of the 50S ribosomal subunit.
    evidence:
    - reference: PMID:15554968
      snippet: Our results show that tiamulin is located within the peptidyl transferase center (PTC)
        of the 50S ribosomal subunit with its tricyclic mutilin core positioned in a tight pocket at the
        A-tRNA binding site.
      notes: '''the peptidyl transferase center (PTC) OF THE 50S RIBOSOMAL SUBUNIT''. NOT asserted: the
        PTC''s composition, which this sentence does not give.'
    - reference: PMID:12936991
      snippet: The antibiotic tiamulin targets the 50S subunit of the bacterial ribosome and interacts
        at the peptidyl transferase center.
      notes: Bosling 2003 identified the tiamulin interaction site.
    - reference: GO:0015934
      snippet: large ribosomal subunit
      notes: GO grounding for the large ribosomal subunit.
  - subject: drug0
    predicate: molecularly interacts with (binds the peptidyl transferase centre)
    predicate_id: RO:0002436
    object: ptc
    description: Tiamulin represents the pleuromutilin drug class and binds the PTC.
    evidence:
    - reference: PMID:15554968
      snippet: Our results show that tiamulin is located within the peptidyl transferase center (PTC)
        of the 50S ribosomal subunit with its tricyclic mutilin core positioned in a tight pocket at the
        A-tRNA binding site.
      notes: NOTE the drug0 node is the drug CLASS (ARO:3000670, pleuromutilin antibiotic); tiamulin is
        the member both papers studied (#353).
    - reference: PMID:12936991
      snippet: The antibiotic tiamulin targets the 50S subunit of the bacterial ribosome and interacts
        at the peptidyl transferase center.
      notes: Bosling 2003 states the same target independently.
  - subject: drug_binding
    predicate: has part (the antibiotic)
    predicate_id: BFO:0000051
    object: drug0
    description: The modeled drug-binding state includes the pleuromutilin-class drug tiamulin.
    evidence:
    - reference: PMID:12936991
      snippet: The antibiotic tiamulin targets the 50S subunit of the bacterial ribosome and interacts
        at the peptidyl transferase center.
      notes: '''tiamulin ... INTERACTS AT the peptidyl transferase center'' -- the drug half, from a sentence
        about the DRUG rather than about the L3 mutant, whose experiment belongs to ARO:3005081 (#382).'
    - reference: PMID:15554968
      snippet: Our results show that tiamulin is located within the peptidyl transferase center (PTC)
        of the 50S ribosomal subunit with its tricyclic mutilin core positioned in a tight pocket at the
        A-tRNA binding site.
      notes: Schlunzen 2004 located tiamulin in the 50S-subunit peptidyl transferase center.
  - subject: drug_binding
    predicate: has part (the site it binds)
    predicate_id: BFO:0000051
    object: ptc
    evidence:
    - reference: PMID:15554968
      snippet: Our results show that tiamulin is located within the peptidyl transferase center (PTC)
        of the 50S ribosomal subunit with its tricyclic mutilin core positioned in a tight pocket at the
        A-tRNA binding site.
      notes: The site half of the same binding state.
    - reference: PMID:12936991
      snippet: The antibiotic tiamulin targets the 50S subunit of the bacterial ribosome and interacts
        at the peptidyl transferase center.
      notes: Bosling 2003 identified the tiamulin interaction site.
    description: The modeled drug-binding state includes the PTC drug-binding site.
  - subject: determinant
    predicate: causally upstream of (the substitution alters the conformation)
    predicate_id: RO:0002411
    object: altered_conformation
    description: The ribosomal-protein substitution acts in trans by altering local 23S rRNA conformation.
    evidence:
    - reference: ARO:3005082
      snippet: Ribosomal protein mutations that interfere with the rRNA conformation at the active site
        thus conferring antibiotic resistance.
      notes: CARD's own words -- 'interfering with local rRNA conformation' / 'interfere with the rRNA
        conformation at the active site'.
    - reference: PMID:32526926
      snippet: amino acid substitutions in uL3 are predicted to act indirectly by destabilizing rRNA conformation
