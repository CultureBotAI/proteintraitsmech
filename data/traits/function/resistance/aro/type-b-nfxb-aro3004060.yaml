      notes: CARD definition for Type B NfxB.
    - reference: ARO:3000820
      snippet: NfxB is a repressor of the efflux pump mexCD-oprJ and itself (NfxB binds upstream of the
        nfxB gene and negatively regulates its own expression). Increased expression of MexCD–OprJ brought
        about by mutations in NfxB.
      notes: CARD definition for the NfxB repressor parent.
    - reference: ARO:3000797
      snippet: MexCD-OprJ is a multidrug efflux protein expressed in the Gram-negative Pseudomonas aeruginosa.
        MexC is the membrane fusion protein; MexD is the inner membrane transporter; and OprJ is the outer
        membrane channel. MexCD-OprJ is typically quiescent in wild-type cells, with expression following
        mutation of the nfxB gene that is divergently transcribed from the mexCD-oprJ operon and encodes
        a repressor of mexCD-oprJ expression.
      notes: CARD definition for the MexCD-OprJ efflux pump repressed by NfxB.
    - reference: ARO:0010000
