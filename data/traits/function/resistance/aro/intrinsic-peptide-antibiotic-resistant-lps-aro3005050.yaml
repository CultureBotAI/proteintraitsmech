causal_graphs:
- graph_id: resistance
  title: Intrinsic peptide antibiotic resistant Lps → mechanism → resistance (curated from ARO relations
    + literature)
  description: 'Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family''s verbatim literature evidence
    (PMID:14665678). The mirror of efflux: the drug never gets in, rather than being pumped out.'
  nodes:
  - node_id: determinant
    label: Intrinsic peptide antibiotic resistant Lps
    node_type: PROTEIN
    grounding: ARO:3005050
  - node_id: mech0
    label: reduced permeability to antibiotic
    node_type: MOLECULAR_FUNCTION
    grounding: ARO:3000244
  - node_id: drug0
    label: peptide antibiotic
    node_type: CHEMICAL
    grounding: ARO:3000053
  - node_id: influx
    label: xenobiotic transport (drug influx across the outer membrane)
    node_type: BIOLOGICAL_PROCESS
    grounding: GO:0042908
    description: GO:0042908 is the transport process; which channel carries it differs per record and
      is named in that record's own definition.
  - node_id: barrier
    label: outer membrane permeability barrier
    node_type: STATE
    description: 'Ungrounded: a property of the envelope rather than a compound.'
  - node_id: resistance
    label: antibiotic resistance phenotype
    node_type: PHENOTYPE
    grounding: GO:0046677
    description: 'Resistance phenotype conferred by this determinant. Grounded to the nearest available
      superclass: ARO models determinants and mechanisms but has no term for the resistance phenotype
      itself.'
  edges:
  - subject: determinant
    predicate: participates in (resistance mechanism)
    predicate_id: RO:0000056
    object: mech0
    evidence:
    - reference: PMID:14665678
      snippet: Although outer membrane components often play important roles in the interaction of symbiotic
        or pathogenic bacteria with their host organisms, the major role of this membrane must usually
        be to serve as a permeability barrier to prevent the entry of noxious compounds and at the same
        time to allow the influx of nutrient molecules.
      notes: Family mechanism ARO:3000244.
  - subject: mech0
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: PMID:14665678
      snippet: Although outer membrane components often play important roles in the interaction of symbiotic
        or pathogenic bacteria with their host organisms, the major role of this membrane must usually
        be to serve as a permeability barrier to prevent the entry of noxious compounds and at the same
        time to allow the influx of nutrient molecules.
      notes: Mechanism ARO:3000244 → resistance.
  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: PMID:14665678
      snippet: Although outer membrane components often play important roles in the interaction of symbiotic
        or pathogenic bacteria with their host organisms, the major role of this membrane must usually
        be to serve as a permeability barrier to prevent the entry of noxious compounds and at the same
        time to allow the influx of nutrient molecules.
      notes: Nikaido 2003. The outer membrane is a permeability barrier by default; channels are what
        let a drug across it, so losing a channel raises the barrier.
    - reference: ARO:3000270
      snippet: Enzymes or other proteins either directly or indirectly reducing overall permeability to
        antibiotics.
      notes: CARD's definition of the family term these records sit under -- the claim at exactly the
        level this config makes it. Each record's own definition names the channel and the drug class
        IT admits.
  - subject: determinant
    predicate: confers resistance to (drug class)
    predicate_id: ARO:2000001
    object: drug0
    description: CARD asserts that this determinant confers resistance to peptide antibiotic.
    evidence:
    - reference: ARO:3005050
      snippet: 'relationship: confers_resistance_to_drug_class ARO:3000053 ! peptide antibiotic'
      notes: Asserted directly on ARO:3005050 (Intrinsic peptide antibiotic resistant Lps) in the CARD/ARO
        release in data/raw/aro/aro.obo.
  - subject: determinant
    predicate: enables (admits the drug across the membrane)
    predicate_id: RO:0002327
    object: influx
    description: The wild-type function. Resistance is its loss or down-regulation, which is why these
      records are channels rather than resistance enzymes.
    evidence:
    - reference: ARO:3000244
      snippet: Reduction in permeability to antibiotic, generally through reduced production of porins,
        can provide resistance.
      notes: 'CARD''s mechanism term, stated as the loss: permeability falls when the channel does, which
        is this edge read backwards. General to every record here; each names its own channel and drug.'
  - subject: barrier
    predicate: negatively regulates (the membrane excludes what has no channel)
    predicate_id: RO:0002212
    object: influx
    evidence:
    - reference: PMID:14665678
      snippet: Although outer membrane components often play important roles in the interaction of symbiotic
        or pathogenic bacteria with their host organisms, the major role of this membrane must usually
        be to serve as a permeability barrier to prevent the entry of noxious compounds and at the same
        time to allow the influx of nutrient molecules.
      notes: 'Nikaido 2003: exclusion is the outer membrane''s default, and channels are the exception
        to it.'
  - subject: influx
    predicate: causally upstream of (the drug reaches its target)
    predicate_id: RO:0002411
    object: drug0
    description: 'The causal core inverted: with the channel lost or down-regulated, this step does not
      happen and the drug never reaches its target.'
    evidence:
    - reference: PMID:14665678
      snippet: Although outer membrane components often play important roles in the interaction of symbiotic
        or pathogenic bacteria with their host organisms, the major role of this membrane must usually
        be to serve as a permeability barrier to prevent the entry of noxious compounds and at the same
        time to allow the influx of nutrient molecules.
      notes: A drug that cannot cross the barrier cannot act, whatever its target.
