  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: PMID:1556077
      snippet: Synthesis of these enzymes was regulated at the transcriptional level by the VanS-VanR
        two-component regulatory system encoded by the proximal part of the cluster.
      notes: Arthur et al. 1992. vanS is part of the two-component system that regulates the resistance
        enzymes; it is not one of them.
    - reference: PMID:10817725
      snippet: 'Three genes are sufficient for resistance: vanC-1 encodes a ligase that synthesizes the
        dipeptide D-Ala-D-Ser for addition to UDP-MurNAc-tripeptide, vanXY(C) encodes a D,D-dipeptidase-carboxypeptidase
        that hydrolyzes D-Ala-D-Ala and removes D-Ala from UDP-MurNAc-pentapeptide[D-Ala], and vanT encodes
        a membrane-bound serine racemase that provides D-Ser for the synthetic pathway.'
      notes: In a D-Ala-D-Ser cluster the enzymes it induces are the ligase, vanT and vanXY -- all three
        curated records (round 23).
    - reference: ARO:3002940
      snippet: Also known as vanSN, is a vanS variant found in the vanN gene cluster.
      notes: CARD definition for vanS gene in vanN cluster.
    - reference: ARO:3000071
      snippet: VanS is similar to histidine protein kinases like EnvZ and acts as a response regulator
        by activating VanR. VanS is required for high level transcription of other van glycopeptide resistance
        genes.
      notes: CARD definition for vanS.
    - reference: PMID:1556077
      snippet: Analysis of transcriptional fusions with a reporter gene and RNA mapping indicated that
        the VanR-VanS two-component regulatory system activates a promoter used for cotranscription of
        the vanH, vanA, and vanX resistance genes.
      notes: Arthur et al. 1992 mapped the VanR/VanS-activated vanHAX promoter.
    - reference: PMID:1556077
      snippet: The distal part of the van cluster encodes VanH, VanA, and a third enzyme, VanX, all of
        which are necessary for resistance.
      notes: Arthur et al. 1992.
    - reference: PMID:1556077
      snippet: VanS stimulated VanR-dependent transcription and was related to membrane-associated histidine
        protein kinases which control the level of phosphorylation of response regulators.
      notes: Arthur et al. 1992.
    description: VanS confers resistance indirectly by regulating transcription of van resistance genes.
