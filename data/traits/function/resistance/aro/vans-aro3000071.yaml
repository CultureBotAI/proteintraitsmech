  - subject: vanh_gene
    predicate: causally upstream of (the mechanism this regulator induces)
    predicate_id: RO:0002411
    object: resistance
    description: VanH supplies D-lactate for the modified precursor that lowers vancomycin binding.
    evidence:
    - reference: PMID:1556077
      snippet: The distal part of the van cluster encodes VanH, VanA, and a third enzyme, VanX, all of
        which are necessary for resistance.
      notes: Arthur et al. 1992. VanH's own mechanism is curated on ARO:3000006 (round 21).
    - reference: ARO:3000006
      snippet: VanH is a D-specific alpha-ketoacid dehydrogenase that synthesizes D-lactate. D-lactate
        is incorporated into the end of the peptidoglycan subunits, decreasing vancomycin binding affinity.
      notes: CARD definition for vanH.
    - reference: ARO:3000213
      snippet: Peptidoglycan precursors ending in D-Ala-D-Lac or D-Ala-D-Ser instead of D-Ala-D-Ala conferring
        high level glycopeptide resistance.
      notes: CARD definition for restructuring of bacterial cell wall.
  - subject: vanx_gene
    predicate: causally upstream of (the mechanism this regulator induces)
    predicate_id: RO:0002411
    object: resistance
    description: VanX depletes D-Ala-D-Ala so modified peptidoglycan precursors are used.
    evidence:
    - reference: PMID:1556077
      snippet: The distal part of the van cluster encodes VanH, VanA, and a third enzyme, VanX, all of
        which are necessary for resistance.
      notes: Arthur et al. 1992. VanX's own mechanism is curated on ARO:3000011 (round 20).
    - reference: ARO:3000011
      snippet: VanX is a D,D-dipeptidase that cleaves D-Ala-D-Ala but not D-Ala-D-Lac, ensuring that the
        latter dipeptide that has reduced binding affinity with vancomycin is used to synthesize peptidoglycan
        substrate.
      notes: CARD definition for vanX.
    - reference: ARO:3000213
      snippet: Peptidoglycan precursors ending in D-Ala-D-Lac or D-Ala-D-Ser instead of D-Ala-D-Ala conferring
        high level glycopeptide resistance.
      notes: CARD definition for restructuring of bacterial cell wall.
