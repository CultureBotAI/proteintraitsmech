      snippet: The antibiotic erythromycin inhibits protein synthesis by binding to the 50 S ribosomal
        subunit, where the drug interacts with the unpaired bases 2058A and 2059A in the peptidyl transferase
        loop of 23 S rRNA.
      notes: The drug interacts with unpaired 2058A and 2059A in this loop.
  - subject: drug0
    predicate: molecularly interacts with (binds the unpaired bases)
    predicate_id: RO:0002436
    object: pt_loop
    evidence:
    - reference: PMID:7689111
      snippet: The antibiotic erythromycin inhibits protein synthesis by binding to the 50 S ribosomal
        subunit, where the drug interacts with the unpaired bases 2058A and 2059A in the peptidyl transferase
        loop of 23 S rRNA.
      notes: 'Drug action: erythromycin inhibits protein synthesis from this site.'
  - subject: determinant
    predicate: causally upstream of (opens the loop)
    predicate_id: RO:0002411
    object: conformation
    description: The substitutions do not remove a contact; they change the loop's shape.
    evidence:
    - reference: PMID:7689111
      snippet: We used a chemical modification approach to analyse conformational changes that are induced
        by mutations in the peptidyl transferase loop, and to determine how these changes affect drug
        interaction.
      notes: Conformational change read by chemical modification, and the paper's framing of what the
        mutations do.
  - subject: conformation
    predicate: negatively regulates (the open loop binds the drug up to 10,000-fold worse)
    predicate_id: RO:0002212
    object: pt_loop
    description: 'The causal core, graded rather than binary -- and the control matters: substitutions
      at 2032 in the adjacent hairpin alter drug tolerance yet change neither the loop''s structure nor
      erythromycin binding, so the effect is specific to this loop.'
    evidence:
    - reference: PMID:7689111
      snippet: Erythromycin still protects against chemical modification in the mutant peptidyl transferase
        loops, but the affinity of the drug interaction is reduced 20-fold in the 2057A mutant, 10(3)-fold
        in the 2058U mutant and 10(4)-fold in the 2058G mutant.
      notes: 20-fold, 1,000-fold and 10,000-fold for 2057A, 2058U and 2058G.
    - reference: PMID:7689111
      snippet: Single mutations at position 2032 in the adjacent hairpin loop, which have previously been
        shown to alter drug tolerances, gave no detectable effects on the structure of the peptidyl transferase
        loop or on erythromycin binding.
      notes: 'The negative control in the same paper: a nearby position that affects tolerance but NOT
        this loop or this binding. It is what makes the causal claim specific rather than positional.'
