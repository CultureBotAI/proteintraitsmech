      snippet: Erythromycin still protects against chemical modification in the mutant peptidyl transferase
        loops, but the affinity of the drug interaction is reduced 20-fold in the 2057A mutant, 10(3)-fold
        in the 2058U mutant and 10(4)-fold in the 2058G mutant.
