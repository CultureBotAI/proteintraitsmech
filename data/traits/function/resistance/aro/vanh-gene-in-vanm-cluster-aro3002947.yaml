      notes: Establishes what VanH is, by purification.
    - reference: NCBIfam:NF000492
      snippet: D-lactate dehydrogenase VanH
      notes: 'NCBIfam''s own product name for profile-HMM NF000492 — the KB trait record this node grounds
        to. The join of the two is stated rather than implied: the paper says what VanH does, NCBIfam
        names the family that does it. NOT the KB record''s definition text, which this repo composes.'
  - subject: family
    predicate: enables (D-specific alpha-keto acid reduction)
    predicate_id: RO:0002327
    object: dh_activity
    evidence:
