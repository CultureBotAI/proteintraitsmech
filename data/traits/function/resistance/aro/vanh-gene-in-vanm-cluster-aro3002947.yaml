    predicate: causally upstream of (is esterified and incorporated)
    predicate_id: RO:0002411
    object: depsipeptide
    description: The VanH product is esterified to D-alanine by the ligase and the ester is incorporated
      into the precursor.
    evidence:
    - reference: PMID:1931965
      snippet: The VanA product D-alanyl-D-2-hydroxybutyrate could then be incorporated into the UDPMurNAc-pentapeptide
        peptidoglycan precursor by D-Ala-D-Ala adding enzyme from Escherichia coli or by crude extract
        from E. faecium BM4147.
      notes: Incorporation shown with both a purified E. coli adding enzyme and a crude E. faecium extract.
  - subject: depsipeptide
    predicate: negatively regulates (>1000-fold weaker binding)
    predicate_id: RO:0002212
    object: van_complex
    description: 'The causal core, and it is quantified: replacing the terminal D-Ala raises the vancomycin
      Kd from 54 microM to >73 mM.'
    evidence:
    - reference: PMID:1931965
      snippet: The vancomycin binding constant of a synthetic modified peptidoglycan analogue N-acetyl-D-alanyl-D-2-hydroxybutyrate
        (Kd greater than 73 mM) was greater than 1000-fold higher than the binding constant for N-acetyl-D-alanyl-D-alanine
        (Kd = 54 microM), partly due to the disruption of a hydrogen bond in the vancomycin-target complex,
        thus providing a molecular rationale for high-level vancomycin resistance.
      notes: The authors' own molecular rationale for high-level resistance, including the disrupted hydrogen
        bond.
  - subject: van_complex
    predicate: has part (the bound glycopeptide)
    predicate_id: BFO:0000051
    object: drug0
    description: 'Defines the complex: vancomycin bound to the precursor terminus, Kd = 54 microM against
      D-Ala-D-Ala. This is what the depsipeptide prevents.'
    evidence:
    - reference: PMID:1931965
      snippet: The vancomycin binding constant of a synthetic modified peptidoglycan analogue N-acetyl-D-alanyl-D-2-hydroxybutyrate
        (Kd greater than 73 mM) was greater than 1000-fold higher than the binding constant for N-acetyl-D-alanyl-D-alanine
        (Kd = 54 microM), partly due to the disruption of a hydrogen bond in the vancomycin-target complex,
        thus providing a molecular rationale for high-level vancomycin resistance.
      notes: 'The same sentence carries both arms: the drug''s normal affinity and its loss.'
