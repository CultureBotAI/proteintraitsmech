    object: determinant
    evidence:
    - reference: PMID:11014183
      snippet: This work reveals the structural basis for the action of these antibiotics, and leads to
        a model for the role of the universally conserved 16S RNA residues A1492 and A1493 in the decoding
        process.
      notes: Carter et al. 2000 place A1492 and A1493 in the decoding process; Recht et al. 1999 place
        1408 in the same drug-binding site.
  - subject: decoding_site
    predicate: causally upstream of (decoding and translocation)
    predicate_id: RO:0002411
    object: decoding
    evidence:
    - reference: PMID:11014183
      snippet: This work reveals the structural basis for the action of these antibiotics, and leads to
        a model for the role of the universally conserved 16S RNA residues A1492 and A1493 in the decoding
        process.
      notes: The universally conserved residues of this site are what read the codon-anticodon match.
  - subject: drug0
    predicate: molecularly interacts with (binds the decoding site)
    predicate_id: RO:0002436
    object: decoding_site
    description: Drug action, from the 30S crystal structures with paromomycin, streptomycin and spectinomycin.
    evidence:
    - reference: PMID:11014183
      snippet: We also describe the crystal structure of the 30S subunit complexed with the antibiotics
        paromomycin, streptomycin and spectinomycin, which interfere with decoding and translocation.
      notes: Carter et al. 2000. The drugs interfere with decoding and translocation, which is why they
        are bactericidal.
  - subject: determinant
    predicate: negatively regulates (substitution lowers drug affinity)
    predicate_id: RO:0002212
    object: drug0
    description: 'The causal core, measured rather than inferred: chemical footprinting shows the drug
      binds the substituted sequence less well.'
    evidence:
    - reference: PMID:10357824
      snippet: Chemical footprinting experiments indicate that resistance arises from the lower affinity
        of the drug for the eukaryotic rRNA sequence.
      notes: Recht et al. 1999.
  - subject: decoding_site
    predicate: molecularly interacts with (its identity at 1408 sets drug selectivity)
    predicate_id: RO:0002436
    object: drug0
    description: Why these drugs are prokaryote-selective at all -- and why the resistant ribosome is
      the eukaryotic sequence.
    evidence:
    - reference: PMID:10357824
      snippet: A major difference in the binding site for these antibiotics between prokaryotic and eukaryotic
        ribosomes is the identity of the nucleotide at position 1408 (Escherichia coli numbering), which
        is an adenosine in prokaryotic ribosomes and a guanosine in eukaryotic ribosomes.
      notes: Recht et al. 1999. The resistance substitution makes the bacterial site look eukaryotic,
        which is the same fact that makes aminoglycosides selective in the first place.
