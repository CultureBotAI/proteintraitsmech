  edges:
  - subject: determinant
    predicate: participates in (efflux mechanism)
    predicate_id: RO:0000056
    object: mech0
    description: ARO classifies AxyZ under antibiotic efflux because resistance-associated AxyZ variants
      increase expression of the AxyXY-OprZ efflux system.
    evidence:
    - reference: ARO:3004145
      snippet: AxyZ is a transcriptional regulator of the AxyXY-OprZ efflux pump system.
      notes: CARD definition for the AxyZ regulator.
    - reference: ARO:3004141
      snippet: 'In-frame axyZ gene deletion assay led to increased MICs of antibiotic substrates of the
        efflux system: aminoglycosides, cefepime, fluoroquinolones, tetracyclines and erythromycin, indicating
        that the product of axyZ negatively regulates expression of axyXY-oprZ. Moreover a 45 amino-acid
        substitution at position 29 of AxyZ (V29G) was identified in a clinical Achromobacter strain that
        occurred during the course of chronic respiratory tract colonization in a cystic fibrosis (CF)
        patient. This substitution, also detected in 3 other strains exposed in vitro to tobramycin, led
        to the increase in axyY transcription level (5 to 17-fold) together with the increase in antibiotic
        resistance level.'
      notes: CARD definition for AxyXY-OprZ, recording the axyZ deletion and AxyZ V29G observations that
        increased axyY transcription and substrate MICs.
    - reference: ARO:3000219
      snippet: Efflux regulatory proteins with mutations that result in increased expression of efflux
        proteins.
      notes: CARD definition for mutant efflux regulators that increase efflux-protein expression.
    - reference: ARO:3000451
      snippet: Protein(s) and two component regulatory systems that directly or indirectly change rates
        of antibiotic efflux.
      notes: CARD parent class for regulators that modulate antibiotic efflux.
    - reference: ARO:0010000
      snippet: Antibiotic resistance via the transport of antibiotics out of the cell.
      notes: CARD definition for the antibiotic-efflux resistance mechanism.
    - reference: DOI:10.1128/AAC.00290-17
      notes: PMID:28584156 (aro citation)
