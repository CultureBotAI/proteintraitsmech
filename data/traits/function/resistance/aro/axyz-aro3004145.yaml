  description: Curated AxyZ graph for variants that increase AxyXY-OprZ efflux-pump expression. The graph
    keeps CARD's mutation and antibiotic-efflux mechanism classes, models elevated AxyXY-OprZ expression
    as a described local state, and grounds the downstream efflux pump to ARO:3004141.
