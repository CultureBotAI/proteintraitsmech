            notes: "Mechanism ARO:3000212 → resistance."
      - subject: determinant
        predicate: causally upstream of (confers resistance)
        predicate_id: RO:0002411
        object: resistance
        evidence:
          - reference: PMID:24576155
            snippet: the amino acids that most frequently are associated with quinolone resistance are Ser83 (based on E. coli GyrA numbering) and an acidic residue four amino acids downstream
            notes: Determinant → resistance phenotype.
      - subject: resistance
        predicate: related to (resistance is to)
        predicate_id: biolink:related_to
        object: drug0
        evidence:
          - reference: PMID:24576155
            snippet: "Furthermore, mutation of either residue significantly decreases the affinity of gyrase or topoisomerase IV for quinolones, and mutation of both residues abolishes the ability of clinically relevant quinolones to stabilize cleavage complexes."
            notes: Resistance to fluoroquinolone antibiotic.
      - subject: domain
        predicate: part of (the subunit-A domain of this determinant)
        predicate_id: BFO:0000050
        object: determinant
        evidence:
          - reference: Pfam:PF00521
            snippet: "This entry represents a domain found in type IIA topoisomerases, such as bacterial DNA topoisomerase IV (C subunit, ParC), bacterial DNA gyrases (A subunit, GyrA), and mammalian DNA toposiomerases II."
            notes: "KB trait record Pfam:PF00521; snippet is the InterPro:IPR002205 abstract that record's definition is taken from, not this repo's prose."
      - subject: qrdr
        predicate: part of (the QRDR lies in the subunit-A domain)
        predicate_id: BFO:0000050
        object: domain
        description: >-
          The QRDR is the N-terminal GyrA region in which quinolone-resistance substitutions occur.
        evidence:
          - reference: PMID:2168148
            snippet: "quinolone resistance was caused by a point mutation within the region between amino acids 67 and 106, especially in the vicinity of amino acid 83, of the GyrA protein"
            notes: "Yoshida et al. 1990, the paper that defined the QRDR; cited by these ARO records themselves."
          - reference: InterPro:IPR002205
            snippet: domain 3 (N-terminal of gyrA) is responsible for the breaking-rejoining function through its capacity to form protein-DNA bridges
            notes: "Places the N-terminal GyrA region inside this domain entry. The containment of residues 67-106 in it is an inference FROM THESE TWO SOURCES TOGETHER, not a single asserted statement."
      - subject: domain
        predicate: enables (type II topoisomerase activity)
        predicate_id: RO:0002327
        object: gyrase_activity
        evidence:
          - reference: PMID:24576155
            snippet: "The subunits in gyrase are GyrA and GyrB. The homologous subunits in topoisomerase IV are ParC and ParE in Gram-negative species and GrlA and GrlB in Gram-positive species. GyrA (and the equivalent topoisomerase IV subunit) contains the active site tyrosine residue. GyrB (and the equivalent topoisomerase IV subunit) contains the ATPase domain as well as the TOPRIM domain, which binds the divalent metal ions involved in DNA cleavage and ligation."
            notes: "Aldred 2014, the subunit/domain architecture of gyrase and topoisomerase IV."
      - subject: gyrase_activity
        predicate: causally upstream of (forms the covalent intermediate)
        predicate_id: RO:0002411
        object: cleavage_complex
        evidence:
          - reference: PMID:24576155
            snippet: "To maintain genomic integrity during this process, the enzymes form covalent bonds between active site tyrosine residues and the newly generated 5′-DNA termini."
            notes: "Aldred 2014. The cleavage complex is the enzyme's own catalytic intermediate, present with or without drug."
      - subject: drug0
        predicate: molecularly interacts with (intercalates and blocks ligation)
        predicate_id: RO:0002436
        object: cleavage_complex
        description: >-
          Quinolone action: the drug binds the cleaved complex and blocks religation, raising the steady-state level of DNA breaks.
        evidence:
          - reference: PMID:24576155
            snippet: "As a result of their intercalation, quinolones increase the steady-state concentration of cleavage complexes by acting as physical blocks to ligation."
            notes: Aldred 2014. This is the drug-ACTION arm; resistance is the loss of it.
      - subject: qrdr
        predicate: negatively regulates (substitution lowers drug action)
        predicate_id: RO:0002212
        object: cleavage_complex
        description: >-
          The causal core: a QRDR substitution reduces the drug's ability to trap this enzyme, so fewer drug-stabilised cleavage complexes form at a given drug concentration.
        evidence:
          - reference: PMID:24576155
            snippet: "Furthermore, mutation of either residue significantly decreases the affinity of gyrase or topoisomerase IV for quinolones, and mutation of both residues abolishes the ability of clinically relevant quinolones to stabilize cleavage complexes."
            notes: "Aldred 2014. Mutation of the QRDR serine or the acidic residue, which together form the water-metal ion bridge to the drug."
      - subject: cleavage_complex
        predicate: causally upstream of (drug-stabilised breaks kill the cell)
        predicate_id: RO:0002411
        object: cell_death
        description: >-
          Why fewer stabilised complexes means survival: the complexes are what kill the cell.
        evidence:
          - reference: PMID:24576155
            snippet: "If the strand breaks overwhelm these processes, they can lead to cell death. This is the primary mechanism that quinolones use to kill bacterial cells"
            notes: Aldred 2014.
