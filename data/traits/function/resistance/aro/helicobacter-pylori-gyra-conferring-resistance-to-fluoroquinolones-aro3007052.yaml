causal_graphs:
  - graph_id: resistance
    title: Helicobacter pylori gyrA conferring resistance to fluoroquinolones → mechanism → resistance (curated from ARO relations + literature)
    description: >-
      Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited mechanism → resistance phenotype → drug classes; edges carry the family's verbatim literature evidence (PMID:24576155). Target alteration, not drug inactivation: GyrA is the quinolone's target, and QRDR substitutions reduce drug binding to the gyrase-DNA cleavage complex.
    nodes:
      - node_id: determinant
        label: Helicobacter pylori gyrA conferring resistance to fluoroquinolones
        node_type: PROTEIN
        grounding: ARO:3007052
      - node_id: mech0
        label: mutation conferring antibiotic resistance
        node_type: MOLECULAR_FUNCTION
        grounding: ARO:3000212
      - node_id: drug0
        label: fluoroquinolone antibiotic
        node_type: CHEMICAL
        grounding: ARO:0000001
      - node_id: domain
        label: "DNA gyrase/topoisomerase IV, subunit A domain (carries the QRDR)"
        node_type: DOMAIN
        grounding: Pfam:PF00521
        description: KB protein-trait record carrying the mechanism.
      - node_id: qrdr
        label: "quinolone resistance-determining region (QRDR) of GyrA, substituted in this determinant"
        node_type: MOTIF
        description: >-
          GyrA residues 67-106, Ser83 and the acidic residue four positions downstream being the most frequently substituted. Positions are stated in the E. coli GyrA frame; the equivalent positions differ per organism (e.g. Ala90/Asp94 in M. tuberculosis), so no per-record residue node is asserted. Ungrounded: no ontology term denotes the QRDR.
      - node_id: gyrase_activity
        label: "DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity"
        node_type: MOLECULAR_FUNCTION
        grounding: GO:0003918
      - node_id: cleavage_complex
        label: enzyme-DNA cleavage complex
        node_type: STATE
        description: >-
          The covalent enzyme-cleaved DNA intermediate that quinolones bind and stabilise. Ungrounded, as with the M-CSA reaction-intermediate STATE nodes.
      - node_id: cell_death
        label: bacterial cell death
        node_type: PHENOTYPE
        grounding: GO:0008219
      - node_id: resistance
        label: antibiotic resistance phenotype
        node_type: PHENOTYPE
        grounding: GO:0046677
        description: >-
          Resistance phenotype conferred by this determinant. Grounded to the nearest
          available superclass: ARO models determinants and mechanisms but has no term
          for the resistance phenotype itself.
