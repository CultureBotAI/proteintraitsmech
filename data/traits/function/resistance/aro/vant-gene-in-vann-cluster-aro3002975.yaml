    evidence:
    - reference: PMID:10817725
      snippet: Glycopeptide-resistant enterococci of the VanC type synthesize UDP-muramyl-pentapeptide[D-Ser]
        for cell wall assembly and prevent synthesis of peptidoglycan precursors ending in D-Ala.
      notes: The precursor named here is the one the drug binds; the VanC route prevents its synthesis.
