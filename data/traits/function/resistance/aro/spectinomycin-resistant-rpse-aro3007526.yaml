    predicate: part of (located on the 30S subunit)
    predicate_id: BFO:0000050
    object: subunit30s
    evidence:
    - reference: ARO:3007526
      snippet: Amino acid substitutions in ribosomal protein S5, the product of the rpsE gene, is associated
        with resistance to spectinomycin (SpcR). This protein is located on the 30S subunit and interacts
        with 16S rRNA and other proteins.
      notes: '''This protein is located on the 30S subunit''.'
  - subject: determinant
    predicate: molecularly interacts with (interacts with 16S rRNA)
    predicate_id: RO:0002436
    object: rrna16s
    evidence:
    - reference: ARO:3007526
      snippet: Amino acid substitutions in ribosomal protein S5, the product of the rpsE gene, is associated
        with resistance to spectinomycin (SpcR). This protein is located on the 30S subunit and interacts
        with 16S rRNA and other proteins.
      notes: '''and interacts with 16S rRNA and other proteins''. The ''other proteins'' are NOT given
        nodes -- CARD does not name them.'
    - reference: PMID:42450237
      snippet: Modelling showed that these mutations perturb the conserved network of stabilizing contacts
        between RpsE residues Lys25 (Lys23 in E. coli numbering) and Lys28 (Lys26), as well as helix 34
        nucleotides G922, A923, and C1069 of 16S rRNA, potentially altering the architecture of the spectinomycin-binding
        site.
      notes: 'CONTEXT ONLY, carrying three qualifications at once: it is a MODELLING result (''Modelling
        showed''), it is HEDGED (''potentially altering''), and it is Neisseria, whereas these records
        are Bacillus subtilis and unspecified. It is attached to the interaction edge CARD already supports,
        and licenses no edge of its own.'
  - subject: drug0
    predicate: molecularly interacts with (spectinomycin acts on the 30S subunit)
    predicate_id: RO:0002436
    object: subunit30s
    description: The drug-action arm, from the 30S crystal structures.
    evidence:
    - reference: PMID:11014183
      snippet: We also describe the crystal structure of the 30S subunit complexed with the antibiotics
        paromomycin, streptomycin and spectinomycin, which interfere with decoding and translocation.
      notes: 'Carter 2000 solved the 30S subunit with spectinomycin bound. NOTE the drug0 node is the
        drug CLASS (ARO:0000016, aminoglycoside antibiotic); spectinomycin is an aminocyclitol that CARD
        files under it, and the `requires` guard can only check the class (#353). NOT asserted: that S5
        is part of that binding site, which this abstract does not say and CARD does not claim.'
  - subject: determinant
    predicate: correlated with (substitutions are associated with resistance)
    predicate_id: RO:0002610
    object: resistance
    description: The honest strength of CARD's claim, written explicitly because the fixed determinant->resistance
      edge cannot express it (#345).
    evidence:
    - reference: ARO:3007526
      snippet: Amino acid substitutions in ribosomal protein S5, the product of the rpsE gene, is associated
        with resistance to spectinomycin (SpcR). This protein is located on the 30S subunit and interacts
        with 16S rRNA and other proteins.
      notes: '''is associated with resistance to spectinomycin''. Association is all CARD asserts, so
        association is all this edge asserts.'
