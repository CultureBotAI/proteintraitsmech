  title: spectinomycin resistant rpsE → mechanism → resistance (curated from ARO relations + literature)
  description: 'Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family''s verbatim literature evidence
    (ARO:3007526). rpsE -- an ASSOCIATION, not a mechanism. CARD supplies two structural facts (S5 is
    on the 30S subunit; it interacts with 16S rRNA) and links substitutions to resistance without joining
    them. No MECHANISM edge connects the substitution to the drug -- the promoter''s fixed `confers resistance
    to (drug class)` edge is still emitted and still carries CARD''s own assertion (#345, #350).'
