      snippet: gpsI codes for polyribonucleotide nucleotidyltransferase which is a protein involved in
        mRNA degradation. It catalyzes the phosphorolysis of single-stranded polyribonucleotides in the
        3'- to 5'-direction.
      notes: CARD definition for pyrazinamide resistant gpsI.
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance.
      notes: CARD definition for mutation conferring antibiotic resistance.
    - reference: DOI:10.1128/AAC.00070-17
      snippet: Njire et al. found two PZA-resistant clinical isolates with the same Rv2783c G199A/Asp67Asn
        substitution and showed that expressing Rv2783c-Asp67Asn increased the pyrazinamide MIC in M.
        tuberculosis.
      notes: Experimental evidence that an Rv2783c/gpsI missense mutation confers PZA resistance.
    - reference: DOI:10.1128/AAC.00070-17
      snippet: Wild-type Rv2783 bound pyrazinoic acid, whereas Rv2783-Asp67Asn did not bind pyrazinoic
        acid detectably in the titration assay.
      notes: Experimental evidence that the gpsI resistance mutation reduces active-drug binding.
    - reference: DOI:10.1128/AAC.00070-17
      snippet: Pyrazinoic acid significantly inhibited wild-type Rv2783 RNA polymerization and phosphorolysis
        activities but not those of the Rv2783-Asp67Asn mutant protein.
      notes: Experimental evidence that the mutant gpsI activity withstands POA inhibition.
