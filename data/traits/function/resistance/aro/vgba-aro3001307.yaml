    - reference: ARO:3000376
      snippet: vgb (Virginiamycin B) lyase inactivates type B streptogramin antibiotics by linearizing
        the streptogramin lactone ring at the ester linkage through an elimination mechanism, thus conferring
        resistance to these compounds.
      notes: CARD definition for the streptogramin vgb lyase parent term.
