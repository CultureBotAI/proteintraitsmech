      snippet: Enzymatic inactivation of antibiotic to confer drug resistance.
      notes: CARD definition for the antibiotic inactivation mechanism.
    - reference: ARO:3000233
      snippet: 'Resistance to streptogramin antibiotics may be conferred through enzymatic inactivation.
        There are two known mechanisms of streptogramin inactivation shown clinically to confer resistance:
        1) vgB lyase enzymes linearize type B streptogramin antibiotics by breaking the ester linkage;
        2) vat acetyltransferase enzymes modify type A streptogramin antibiotics by transferring an acetyl
        group from acetyl-CoA to the secondary streptogramin hydroxyl. Both mechanisms result in antibiotic
        inactivation thus conferring resistance.'
      notes: CARD definition for the streptogramin inactivation enzyme parent, separating Vgb type-B linearization
        from Vat type-A acetylation.
