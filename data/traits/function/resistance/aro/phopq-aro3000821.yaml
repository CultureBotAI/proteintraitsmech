    evidence:
    - reference: ARO:3000702
      snippet: AcrR is a repressor of the AcrAB-TolC multidrug efflux complex. AcrR mutations result in
        high level antibiotic resistance.
      notes: The resistance follows from pump over-expression, not from any change to the pump itself.
