    evidence:
    - reference: ARO:3004333
      snippet: DNA gyrase is responsible for DNA supercoiling and consists of two alpha and two beta subunits.
        Point mutations in gyrA have been shown to decrease susceptibility to the antibiotic triclosan.
        Although the mechanism is unclear, it is hypothesized that changes in supercoiling activity of
        mutant DNA gyrase proteins alters expression of stress response pathways thereby indirectly decreasing
        triclosan susceptibility. It has been shown that triclosan does not interact directly with gyrA.
      notes: CARD definition for the triclosan-resistant gyrA parent term.
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance. Examples included modified antibiotic targets with lower binding affinities and the
        deactivation of repressors that result in increased expression of genes that inactivate or pump
        out antibiotics.
      notes: CARD definition for the broad mutation-conferring resistance mechanism.
    - reference: ARO:3004334
