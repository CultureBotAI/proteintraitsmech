        equivalent topoisomerase IV subunit) contains the ATPase domain as well as the TOPRIM domain,
        which binds the divalent metal ions involved in DNA cleavage and ligation.
      notes: Aldred 2014, the subunit architecture of gyrase and topoisomerase IV.
    description: The grounded GyrA/ParC N-terminal subunit-A domain contains the QRDR.
