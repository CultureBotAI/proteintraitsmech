  description: Conservative Llm-family resistance graph for RlmK-like 23S rRNA methyltransferases. The
    graph models lincosamide resistance via methylation of a 23S rRNA antibiotic-target site without assuming
    the Cfr radical-SAM domain, the Cfr partial TIM-barrel fold, or a specific modified nucleotide.
