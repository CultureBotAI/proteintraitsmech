  title: vanR gene in vanG cluster → mechanism → resistance (curated from ARO relations + literature)
  description: 'Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family''s verbatim literature evidence
    (PMID:1556077). Regulation, not resistance: VanR activates the promoter of the vanHAX operon, and
    resistance is inducible for that reason.'
