      snippet: Synthesis of these enzymes was regulated at the transcriptional level by the VanS-VanR
        two-component regulatory system encoded by the proximal part of the cluster.
      notes: Mechanism ARO:3000213 → resistance.
  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: PMID:1556077
      snippet: VanR was a transcriptional activator related to response regulators of the OmpR subclass.
      notes: Arthur et al. 1992. VanR is a transcriptional activator, not a resistance enzyme.
    - reference: PMID:1556077
      snippet: The distal part of the van cluster encodes VanH, VanA, and a third enzyme, VanX, all of
        which are necessary for resistance.
      notes: 'What it activates is what confers resistance: the resistance step is one edge further down
        this graph, on ARO:3000006 and ARO:3000011.'
