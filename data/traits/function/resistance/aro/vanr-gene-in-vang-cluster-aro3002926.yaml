      notes: Arthur et al. 1992 mapped the promoter by transcriptional fusion and RNA mapping; vanH is
        one of the three genes cotranscribed from it.
  - subject: transcription
    predicate: positively regulates (cotranscribed from the induced promoter)
    predicate_id: RO:0002213
    object: vanx_gene
