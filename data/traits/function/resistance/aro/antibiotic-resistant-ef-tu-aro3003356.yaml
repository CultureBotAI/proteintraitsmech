    predicate: participates in (resistance mechanism)
    predicate_id: RO:0000056
    object: mech0
    evidence:
    - reference: ARO:3003356
      snippet: Sequence variants of elongation factor Tu that confer resistance to different classes of
        antibiotics.
      notes: Family mechanism ARO:3000212.
  - subject: mech0
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3003356
      snippet: Sequence variants of elongation factor Tu that confer resistance to different classes of
        antibiotics.
      notes: Mechanism ARO:3000212 → resistance.
  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3003356
      snippet: Sequence variants of elongation factor Tu that confer resistance to different classes of
        antibiotics.
      notes: 'CARD''s whole claim for this family: variants confer resistance. Stated causally -- ''confer'',
        unlike the nim family''s ''associated with'' (round 65).'
    - reference: ARO:3001312
      snippet: Sequence variants of elongation factor Tu that confer resistance to elfamycin antibiotics.
      notes: And the drug class for most members. Neither sentence says HOW the variant resists.
    - reference: ARO:3000212
      snippet: Point mutations in the DNA may lead to an altered gene product that may result in antibiotic
        resistance.
      notes: CARD's generic mutation mechanism, quoted only as far as it goes. Its examples cover BOTH
        lower target affinity and repressor deactivation, so it cannot pin this family's route -- which
        is why no mechanism edge is written below.
  - subject: determinant
    predicate: enables (elongation factor activity)
    predicate_id: RO:0002327
    object: ef_activity
    description: What the determinant IS, which is the one mechanistic fact CARD's own naming supplies.
    evidence:
    - reference: ARO:3003356
      snippet: Sequence variants of elongation factor Tu that confer resistance to different classes of
        antibiotics.
      notes: '''elongation factor Tu'' -- a functional name, and the only functional claim CARD makes
        about these records.'
  - subject: ef_activity
    predicate: part of (translational elongation)
    predicate_id: BFO:0000050
    object: elongation
    evidence:
    - reference: ARO:3003356
      snippet: Sequence variants of elongation factor Tu that confer resistance to different classes of
        antibiotics.
      notes: 'The process the factor serves. NOT asserted: that the drug inhibits it, or that the variant
        prevents drug binding -- CARD states neither.'
