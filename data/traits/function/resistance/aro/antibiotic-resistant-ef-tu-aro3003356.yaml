- graph_id: resistance
  title: Antibiotic resistant EF-Tu → mechanism → resistance (curated from ARO relations + literature)
  description: Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family's verbatim literature evidence
    (ARO:3003356). Mechanism deliberately NOT asserted. CARD states that EF-Tu variants confer resistance
    and never states how; the elfamycin-binding story is well known and uncited here. The graph carries
    the determinant's function and its resistance, and stops.
  nodes:
