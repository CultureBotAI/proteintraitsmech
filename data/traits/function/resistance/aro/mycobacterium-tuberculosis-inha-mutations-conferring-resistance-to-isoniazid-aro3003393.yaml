    predicate_id: BFO:0000050
    object: mycolic
    description: 'Why inhibiting InhA kills: mycolic acids are essential to the mycobacterial envelope.'
    evidence:
    - reference: PMID:8284673
      snippet: The InhA protein shows significant sequence conservation with the Escherichia coli enzyme
        EnvM, and cell-free assays indicate that it may be involved in mycolic acid biosynthesis.
      notes: The pathway the enzyme belongs to.
  - subject: inh_nad
    predicate: negatively regulates (inhibits the target)
    predicate_id: RO:0002212
    object: inha_activity
    description: 'Drug action: the activated drug is covalently attached to the NAD in InhA''s own active
      site.'
    evidence:
    - reference: PMID:9417034
      snippet: Data from x-ray crystallography and mass spectrometry reveal that the mechanism of isoniazid
        action against InhA is covalent attachment of the activated form of the drug to the nicotinamide
        ring of nicotinamide adenine dinucleotide bound within the active site of InhA.
      notes: Rozwarski et al. 1998. The species doing this exists only because katG activated the prodrug
        -- curated on ARO:3004266 in round 27.
  - subject: determinant
    predicate: negatively regulates (altered target binds the adduct less well)
    predicate_id: RO:0002212
    object: inh_nad
    description: 'Route 1: a missense substitution in InhA reduces the drug-NAD adduct''s grip on it.'
    evidence:
    - reference: PMID:8284673
      snippet: A missense mutation within the mycobacterial inhA gene was shown to confer resistance to
        both INH and ethionamide (ETH) in M. smegmatis and in M. bovis.
      notes: Banerjee et al. 1994. The paper shows the mutation confers resistance; that it does so by
        weakening adduct binding is the reading Rozwarski et al. 1998 later supported structurally.
  - subject: determinant
    predicate: positively regulates (overexpression titrates the drug)
    predicate_id: RO:0002213
    object: inha_activity
    description: 'Route 2, and it needs no change to the protein at all: more copies of the wild-type
      target than the activated drug can modify.'
    evidence:
    - reference: PMID:8284673
      snippet: The wild-type inhA gene also conferred INH and ETH resistance when transferred on a multicopy
        plasmid vector to M. smegmatis and M. bovis BCG.
      notes: Banerjee et al. 1994, multicopy plasmid in two hosts. This is why promoter substitutions
        upstream of inhA (the fabG1-inhA operon) are resistance alleles without touching the coding sequence.
