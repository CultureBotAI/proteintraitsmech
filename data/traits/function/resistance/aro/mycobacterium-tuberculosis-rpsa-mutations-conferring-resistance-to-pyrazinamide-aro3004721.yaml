    ARO:3004721 says mutations resist 'maintaining rpsA function', and Shi 2011 says POA inhibited 'trans-translation
    rather than canonical translation'. Two independent statements that nothing is lost, so NO loss-of-function
    edge is written -- see the test that pins the omission.
  nodes:
