    - reference: PMID:21835980
      snippet: Here, we identify a previously unknown target of POA as the ribosomal protein S1 (RpsA),
        a vital protein involved in protein translation and the ribosome-sparing process of trans-translation.
      notes: '''a vital protein involved in protein translation and the ribosome-sparing process of trans-translation''.'
  - subject: poa
    predicate: negatively regulates (inhibits trans-translation)
    predicate_id: RO:0002212
