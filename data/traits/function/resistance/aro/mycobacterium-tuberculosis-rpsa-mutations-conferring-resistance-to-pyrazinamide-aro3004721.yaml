      notes: Mechanism ARO:3000212 → resistance.
  - subject: determinant
    predicate: causally upstream of (confers resistance)
    predicate_id: RO:0002411
    object: resistance
    evidence:
    - reference: ARO:3004722
      snippet: The 30S ribosomal protein S1 of Mycobacterium tuberculosis is required for mRNA translation
        initiation, playing a particular role in trans-translation. Mutations to rpsA prevent pyrazinoic
        acid, the active form of pyrazinamide catalyzed by pncA, from targeting RpsA to inhibit translation.
      notes: CARD makes the causal claim ('Mutations to rpsA PREVENT pyrazinoic acid ... from targeting
        RpsA'), so CARD carries the edge that asserts it (#354).
    - reference: PMID:21835980
      snippet: Three PZA-resistant clinical isolates without pncA mutation harbored RpsA mutations.
      notes: 'Corroboration, and explicitly a CO-OCCURRENCE, not a conferral: three isolates resistant
        WITHOUT a pncA mutation that carried RpsA mutations. Shi''s conferral result is about OVEREXPRESSION,
        not about these mutations, so it is not cited here.'
  - subject: determinant
    predicate: confers resistance to (drug class)
    predicate_id: ARO:2000001
    object: drug0
    description: CARD asserts that this determinant confers resistance to pyrazine antibiotic.
    evidence:
    - reference: ARO:3004722
      snippet: 'relationship: confers_resistance_to_drug_class ARO:3007155 ! pyrazine antibiotic'
      notes: Asserted on ARO:3004722 (pyrazinamide resistant rpsA), an is_a ancestor of this record's
        ARO:3004721; inherited by this variant. CARD/ARO release in data/raw/aro/aro.obo.
  - subject: drug0
    predicate: causally upstream of (hydrolysed to the active form)
    predicate_id: RO:0002411
    object: poa
    description: Pyrazinamide is a prodrug; PZase (pncA) makes the species that acts.
    evidence:
    - reference: PMID:21835980
      snippet: PZA is hydrolyzed intracellularly to pyrazinoic acid (POA) by pyrazinamidase (PZase, encoded
        by pncA), an enzyme frequently lost in PZA-resistant strains, but the target of POA in Mycobacterium
        tuberculosis has remained elusive.
      notes: 'The activation step CARD ARO:3004722 names (''catalyzed by pncA''). NOTE the drug0 node
        is the drug CLASS (ARO:3007155, pyrazine antibiotic) and this claim holds for pyrazinamide specifically,
        not for every pyrazine (#353). NOT asserted: loss of pncA, a different determinant and this abstract''s
        own contrast case.'
  - subject: poa
    predicate: molecularly interacts with (binds drug-sensitive RpsA)
    predicate_id: RO:0002436
    object: rpsa_wt
    description: The drug's normal action. Its object is the drug-SENSITIVE protein, not this record's
      determinant -- pointing it at the determinant made the graph assert both that POA binds it and that
      it abolishes POA binding (#349).
    evidence:
    - reference: PMID:21835980
      snippet: RpsA overexpression conferred increased PZA resistance, and we confirmed that POA bound
        to RpsA (but not a clinically identified ΔAla mutant) and subsequently inhibited trans-translation
        rather than canonical translation.
      notes: '''POA bound to RpsA'' -- and the parenthesis says which RpsA: ''but not a clinically identified
