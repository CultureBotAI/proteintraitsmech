      snippet: Here, we identify a previously unknown target of POA as the ribosomal protein S1 (RpsA),
        a vital protein involved in protein translation and the ribosome-sparing process of trans-translation.
      notes: What the drug-sensitive protein does, which is what the drug interrupts.
  - subject: determinant
    predicate: enables (ribosome-sparing trans-translation)
    predicate_id: RO:0002327
    object: trans_translation
    description: The resistant variant STILL does this.
    evidence:
    - reference: ARO:3004721
      snippet: RpsA, the 30S ribosomal protein S1 of Mycobacterium tuberculosis, is involved in trans-translation
        and is targeted by pyrazinonic acid, the active form of the antibiotic pyrazinamide, which disrupts
        the initiation of mRNA translation. Mutations in the amino acid sequence of rpsA can confer resistance
        to pyrazinamide maintaining rpsA function.
      notes: 'The claim the description makes, cited where it is actually made: ''maintaining rpsA function''.
        Round 2 of review found the description asserting this over evidence that did not say it (#359).
        NOTE this is the more specific term ARO:3004721; ARO:3004722''s own definition says mutations
        ''prevent pyrazinoic acid from TARGETING RpsA'' and does not itself state that the function is
