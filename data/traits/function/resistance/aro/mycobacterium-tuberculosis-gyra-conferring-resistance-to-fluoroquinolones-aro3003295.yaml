causal_graphs:
- graph_id: resistance
  title: Mycobacterium tuberculosis gyrA conferring resistance to fluoroquinolones → mechanism → resistance
    (curated from ARO relations + literature)
  description: 'Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family''s verbatim literature evidence
    (PMID:24576155). Target alteration, not drug inactivation: GyrA is the quinolone''s target, and QRDR
    substitutions reduce drug binding to the gyrase-DNA cleavage complex.'
  nodes:
  - node_id: determinant
