    node_type: DOMAIN
    grounding: Pfam:PF00521
    description: KB protein-trait record carrying the mechanism.
  - node_id: qrdr
    label: quinolone resistance-determining region (QRDR) of GyrA, substituted in this determinant
    node_type: MOTIF
    description: 'GyrA residues 67-106, Ser83 and the acidic residue four positions downstream being the
      most frequently substituted. Positions are stated in the E. coli GyrA frame; the equivalent positions
      differ per organism (e.g. Ala90/Asp94 in M. tuberculosis), so no per-record residue node is asserted.
      Ungrounded: no ontology term denotes the QRDR.'
  - node_id: gyrase_activity
