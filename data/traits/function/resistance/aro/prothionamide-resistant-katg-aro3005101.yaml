      snippet: A single M. tuberculosis gene, katG, encoding both catalase and peroxidase, restored sensitivity
        to INH in a resistant mutant of Mycobacterium smegmatis, and conferred INH susceptibility in some
        strains of Escherichia coli.
      notes: The peroxidase half is the one isoniazid activation needs.
  - subject: peroxidase
    predicate: causally upstream of (activates the prodrug)
    predicate_id: RO:0002411
    object: activated_inh
    description: Isoniazid is inert as given; katG converts it to the species that inhibits InhA.
    evidence:
    - reference: PMID:1501713
      snippet: A single M. tuberculosis gene, katG, encoding both catalase and peroxidase, restored sensitivity
        to INH in a resistant mutant of Mycobacterium smegmatis, and conferred INH susceptibility in some
        strains of Escherichia coli.
      notes: Restoring katG restores INH sensitivity in two host species, so the gene's product is what
        makes the drug work.
    - reference: PMID:9417034
      snippet: Data from x-ray crystallography and mass spectrometry reveal that the mechanism of isoniazid
        action against InhA is covalent attachment of the activated form of the drug to the nicotinamide
        ring of nicotinamide adenine dinucleotide bound within the active site of InhA.
      notes: Rozwarski et al. 1998 name the acting species 'the activated form of the drug'. That katG
        is what activates it is an inference FROM THESE TWO SOURCES TOGETHER.
  - subject: inh
    predicate: causally upstream of (is the substrate of activation)
    predicate_id: RO:0002411
    object: activated_inh
    evidence:
    - reference: PMID:9417034
      snippet: The preferred antitubercular drug isoniazid specifically targets a long-chain enoyl-acyl
        carrier protein reductase (InhA), an enzyme essential for mycolic acid biosynthesis in Mycobacterium
        tuberculosis.
      notes: 'Rozwarski et al. 1998: isoniazid is the drug whose activated form does the work.'
  - subject: activated_inh
    predicate: causally upstream of (forms the covalent adduct)
    predicate_id: RO:0002411
    object: inh_nad
    evidence:
    - reference: PMID:9417034
      snippet: Data from x-ray crystallography and mass spectrometry reveal that the mechanism of isoniazid
        action against InhA is covalent attachment of the activated form of the drug to the nicotinamide
        ring of nicotinamide adenine dinucleotide bound within the active site of InhA.
      notes: Covalent attachment to the nicotinamide ring of NAD bound in the InhA active site, shown
        by crystallography and mass spectrometry.
  - subject: inh_nad
    predicate: negatively regulates (inhibits the target)
    predicate_id: RO:0002212
    object: inha
    description: InhA is essential for mycolic acid biosynthesis, so inhibiting it is what kills the cell.
    evidence:
    - reference: PMID:9417034
      snippet: The preferred antitubercular drug isoniazid specifically targets a long-chain enoyl-acyl
        carrier protein reductase (InhA), an enzyme essential for mycolic acid biosynthesis in Mycobacterium
        tuberculosis.
      notes: Rozwarski et al. 1998 identify InhA as the target and why it matters.
  - subject: determinant
    predicate: negatively regulates (the defective katG cannot activate the prodrug)
    predicate_id: RO:0002212
    object: peroxidase
    description: 'THE CAUSAL CORE, and it runs backwards compared with every earlier round: this determinant
      confers resistance by NOT doing something. A katG that has lost peroxidase activity leaves isoniazid
      inert, so none of the chain below it happens.'
    evidence:
    - reference: PMID:1501713
      snippet: Deletion of katG from the chromosome was associated with INH resistance in two patient
        isolates of M. tuberculosis.
      notes: Deletion -- the extreme case of loss -- confers resistance in patient isolates. Clinical
        katG resistance mutations are usually point substitutions that reduce rather than abolish the
        activity.
