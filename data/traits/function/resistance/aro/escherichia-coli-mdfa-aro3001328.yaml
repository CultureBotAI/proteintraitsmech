causal_graphs:
- graph_id: resistance
  title: How MdfA confers multidrug resistance by active efflux (determinant → mechanism → phenotype)
  description: 'Resistance-causation graph for the MdfA efflux determinant. Unlike the β-lactamase determinant
    GOB-10 (which chemically inactivates the drug), MdfA confers resistance without modifying the antibiotic:
    it is a major-facilitator superfamily (MFS) H+-coupled antiporter that uses the proton-motive force
    to actively expel intact drugs from the cytoplasm, lowering the intracellular concentration. Same
    ARO edge shape (determinant → mechanism → phenotype), a genuinely different mechanism (antibiotic
    efflux, ARO:0010000, vs antibiotic inactivation, ARO:0001004).'
