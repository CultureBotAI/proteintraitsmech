causal_graphs:
- graph_id: resistance
  title: Thermus thermophilus uL3 mutations conferring resistance to pleuromutilin antibiotics → mechanism
    → resistance (curated from ARO relations + literature)
  description: Curated resistance-causation graph (promoted from the ARO auto-draft). Determinant → inherited
    mechanism → resistance phenotype → drug classes; edges carry the family's verbatim literature evidence
    (ARO:3005081). uL3 -- target alteration IN TRANS on the large subunit, the same shape round 121 named
    for rpsL and the first family whose primary paper states it outright. The record names the protein,
    so the L3 KB trait is used.
  nodes:
