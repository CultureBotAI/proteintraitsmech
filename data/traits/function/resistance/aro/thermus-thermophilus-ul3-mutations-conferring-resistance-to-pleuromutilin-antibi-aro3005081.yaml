identifier: ARO:3005081
label: "Thermus thermophilus uL3 mutations conferring resistance to pleuromutilin antibiotics"
definition: >-
  Thermus thermophilus ribosomal protein uL3 containing various mutations conferring resistance to tiamulin. Mutations in the ribosomal protein of uL3 acts by interfering with local rRNA conformation thus conferring resistance.
