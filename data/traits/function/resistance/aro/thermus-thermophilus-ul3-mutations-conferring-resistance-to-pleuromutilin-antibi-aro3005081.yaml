causal_graphs:
- graph_id: resistance
  title: Thermus thermophilus uL3 mutation → 23S rRNA conformational change → pleuromutilin resistance
  description: Curated resistance-causation graph for Thermus thermophilus uL3 substitutions that alter
    local 23S rRNA conformation in trans, reduce tiamulin binding at the peptidyl transferase center,
    and confer pleuromutilin resistance.
  nodes:
  - node_id: determinant
    label: Thermus thermophilus uL3 mutations conferring resistance to pleuromutilin antibiotics
    node_type: PROTEIN
    grounding: ARO:3005081
  - node_id: mech0
    label: mutation conferring antibiotic resistance
    node_type: MOLECULAR_FUNCTION
    grounding: ARO:3000212
  - node_id: drug0
    label: pleuromutilin antibiotic
    node_type: CHEMICAL
    grounding: ARO:3000670
  - node_id: family
    label: Ribosomal protein L3
    node_type: DOMAIN
    grounding: Pfam:PF00297
    description: KB protein-trait record carrying the mechanism.
  - node_id: ptc
    label: peptidyl transferase centre (the drug's binding site)
    node_type: STATE
    description: 'Ungrounded. GO:0000048 is `peptidyltransferase activity`, the FUNCTION, and this node
      is the structural site the drug occupies -- not the same thing, so it is not reused (#346''s rule:
      a live CURIE that means something else is worse than none).'
  - node_id: subunit50s
    label: large ribosomal subunit (50S)
    node_type: CELLULAR_LOCALIZATION
    grounding: GO:0015934
    description: What the snippet actually locates the PTC in. The earlier `ptc part of rrna23s` edge
      asserted the PTC's COMPOSITION, which no snippet on this record states -- and PF00297's own hedge
      (L3 'may participate in the formation of the PTC') says the PTC is not wholly 23S rRNA anyway (#373).
  - node_id: rrna23s
    label: 23S ribosomal RNA
    node_type: NUCLEIC_ACID
    description: Grounded to the broad Sequence Ontology rRNA term because no stable narrower bacterial
      23S rRNA CURIE is available in the local curation evidence.
    grounding: SO:0000252
  - node_id: peptide_bond
    label: peptidyl transferase activity
    node_type: MOLECULAR_FUNCTION
    description: The ribosomal activity that synthesizes peptide bonds and is blocked when tiamulin binds
      at the PTC.
    grounding: GO:0000048
  - node_id: altered_conformation
    label: altered local 23S rRNA conformation at the active site
    node_type: STATE
    description: 'What the substitution produces. A STATE because the object of the causal edge should
      be the CONFORMATION, not the molecule: ''interferes with the rRNA conformation'' does not say the
      rRNA''s function is decreased, and resistant ribosomes still translate (#377). NOT because a STATE
      object is disallowed -- round 121''s ARO:3003395 points RO:0002212 at a STATE, and so does this
      graph, twice (#385).'
  - node_id: drug_binding
    label: tiamulin-ribosome binding
    node_type: STATE
    description: The interaction the mutation reduces.
  - node_id: resistance
    label: antibiotic resistance phenotype
    node_type: PHENOTYPE
    grounding: GO:0046677
    description: 'Resistance phenotype conferred by this determinant. Grounded to the nearest available
      superclass: ARO models determinants and mechanisms but has no term for the resistance phenotype
      itself.'
