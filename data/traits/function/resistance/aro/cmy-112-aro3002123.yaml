        on the chromosome of many Gram-negative bacteria including Citrobacter, Serratia, Enterobacter
        species, and P. aeruginosa where its expression is usually inducible; it may also occur on Escherichia
        coli but is not usually inducible, although it can be hyperexpressed. AmpC type beta-lactamases
        may also be carried on plasmids. AmpC beta-lactamases, in contrast to ESBLs, hydrolyse broad and
