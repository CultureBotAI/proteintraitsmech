  SufS family cysteine desulfurase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01979 (subfamily); catalyses cysteine desulfurase; associated with iron-sulfur cluster assembly, pyridoxal phosphate binding, cysteine desulfurase activity.
