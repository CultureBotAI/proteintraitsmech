identifier: NCBIfam:TIGR01694
label: "S-methyl-5'-thioadenosine phosphorylase"
definition: >-
  S-methyl-5'-thioadenosine phosphorylase (mtnP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01694 (equivalog); catalyses S-methyl-5'-thioadenosine phosphorylase; associated with adenine salvage, S-methyl-5-thioadenosine phosphorylase activity, L-methionine cycle.
