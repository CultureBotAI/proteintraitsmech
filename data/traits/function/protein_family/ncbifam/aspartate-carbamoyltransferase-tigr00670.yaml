  aspartate carbamoyltransferase (pyrB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00670 (equivalog); catalyses aspartate carbamoyltransferase; associated with aspartate carbamoyltransferase activity, 'de novo' pyrimidine nucleobase biosynthetic process.
