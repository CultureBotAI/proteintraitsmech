  assimilatory sulfite reductase (NADPH) flavoprotein subunit — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01931 (equivalog); catalyses assimilatory sulfite reductase (NADPH); associated with sulfite reductase (NADPH) activity, sulfur compound metabolic process, sulfite reductase complex (NADPH), FMN binding.
