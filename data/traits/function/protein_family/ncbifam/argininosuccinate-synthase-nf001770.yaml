identifier: NCBIfam:NF001770
label: "argininosuccinate synthase"
definition: >-
  argininosuccinate synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001770 (equivalog); catalyses argininosuccinate synthase; associated with argininosuccinate synthase activity, ATP binding, L-arginine biosynthetic process.
