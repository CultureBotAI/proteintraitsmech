identifier: NCBIfam:TIGR00500
label: "type I methionyl aminopeptidase"
definition: >-
  type I methionyl aminopeptidase (map) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00500 (equivalog); catalyses methionyl aminopeptidase; associated with proteolysis, metalloaminopeptidase activity.
