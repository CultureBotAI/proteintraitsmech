identifier: NCBIfam:TIGR01890
label: "amino-acid N-acetyltransferase"
definition: >-
  amino-acid N-acetyltransferase (argA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01890 (equivalog); catalyses amino-acid N-acetyltransferase; associated with L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor, cytoplasm, L-arginine biosynthetic process. Members occur in Pseudomonadati.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
