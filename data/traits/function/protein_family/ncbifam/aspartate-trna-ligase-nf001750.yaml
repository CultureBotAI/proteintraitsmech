identifier: NCBIfam:NF001750
label: "aspartate--tRNA ligase"
definition: >-
  aspartate--tRNA ligase (aspS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001750 (equivalog); catalyses aspartate--tRNA ligase; associated with nucleotide binding, aminoacyl-tRNA ligase activity, ATP binding, tRNA aminoacylation for protein translation.
