identifier: NCBIfam:NF008643
label: "peptidoglycan glycosyltransferase/peptidoglycan DD-transpeptidase MrcA"
definition: >-
  peptidoglycan glycosyltransferase/peptidoglycan DD-transpeptidase MrcA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008643 (equivalog); catalyses peptidoglycan glycosyltransferase, serine-type D-Ala-D-Ala carboxypeptidase; associated with penicillin binding. Members occur in Enterobacterales.
