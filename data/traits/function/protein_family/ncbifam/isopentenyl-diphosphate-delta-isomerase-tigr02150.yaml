identifier: NCBIfam:TIGR02150
label: "isopentenyl-diphosphate delta-isomerase"
definition: >-
  isopentenyl-diphosphate delta-isomerase (idi) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02150 (equivalog); catalyses isopentenyl-diphosphate Delta-isomerase; associated with isopentenyl-diphosphate delta-isomerase activity, isoprenoid biosynthetic process.
