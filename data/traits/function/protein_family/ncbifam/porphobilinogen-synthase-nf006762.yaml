identifier: NCBIfam:NF006762
label: "porphobilinogen synthase"
definition: >-
  porphobilinogen synthase (hemB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006762 (equivalog); catalyses porphobilinogen synthase; associated with catalytic activity, porphobilinogen synthase activity, tetrapyrrole biosynthetic process, metal ion binding.
