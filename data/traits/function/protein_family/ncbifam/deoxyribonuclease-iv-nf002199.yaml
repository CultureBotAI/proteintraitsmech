  deoxyribonuclease IV (nfo) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002199 (equivalog); catalyses deoxyribonuclease IV; associated with DNA binding, DNA repair, zinc ion binding. Members occur in Pseudomonadati.
