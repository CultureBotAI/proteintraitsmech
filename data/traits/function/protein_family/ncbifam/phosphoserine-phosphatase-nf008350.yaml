  phosphoserine phosphatase (serB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008350 (equivalog); catalyses phosphoserine phosphatase; associated with L-serine biosynthetic process, L-phosphoserine phosphatase activity. Members occur in Gammaproteobacteria.
