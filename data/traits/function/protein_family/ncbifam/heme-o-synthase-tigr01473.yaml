identifier: NCBIfam:TIGR01473
label: "heme o synthase"
definition: >-
  heme o synthase (cyoE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01473 (equivalog); catalyses heme o synthase; associated with heme biosynthetic process, protoheme IX farnesyltransferase activity, membrane.
