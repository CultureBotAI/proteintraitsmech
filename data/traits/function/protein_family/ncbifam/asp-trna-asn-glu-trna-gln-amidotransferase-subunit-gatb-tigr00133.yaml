identifier: NCBIfam:TIGR00133
label: "Asp-tRNA(Asn)/Glu-tRNA(Gln) amidotransferase subunit GatB"
definition: >-
  Asp-tRNA(Asn)/Glu-tRNA(Gln) amidotransferase subunit GatB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00133 (equivalog); associated with glutamyl-tRNA aminoacylation, carbon-nitrogen ligase activity, with glutamine as amido-N-donor, glutamyl-tRNA(Gln) amidotransferase complex, glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity.
