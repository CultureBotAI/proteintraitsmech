identifier: NCBIfam:NF002211
label: "bifunctional DNA-formamidopyrimidine glycosylase/DNA-(apurinic or apyrimidinic site) lyase"
definition: >-
  bifunctional DNA-formamidopyrimidine glycosylase/DNA-(apurinic or apyrimidinic site) lyase (mutM) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002211 (equivalog); catalyses DNA-formamidopyrimidine glycosylase, DNA-(apurinic or apyrimidinic site) lyase; associated with nucleic acid binding, damaged DNA binding, DNA-(apurinic or apyrimidinic site) endonuclease activity, DNA repair.
