  lipid A ABC transporter ATP-binding protein/permease MsbA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008381 (equivalog); catalyses ABC-type lipopolysaccharide transporter; associated with ATP binding, membrane, ATPase-coupled lipid transmembrane transporter activity, transmembrane transport. Members occur in Gammaproteobacteria.
