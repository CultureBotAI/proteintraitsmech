identifier: NCBIfam:TIGR00535
label: "adenosylmethionine decarboxylase"
definition: >-
  adenosylmethionine decarboxylase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00535 (equivalog); catalyses adenosylmethionine decarboxylase; associated with adenosylmethionine decarboxylase activity, spermine biosynthetic process, spermidine biosynthetic process.
