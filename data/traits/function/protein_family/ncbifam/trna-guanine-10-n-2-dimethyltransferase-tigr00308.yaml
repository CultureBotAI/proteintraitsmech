    synonym_type: EXACT_SYNONYM
    source: NCBIfam
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: guanosine(10) in tRNA + 2 S-adenosyl-L-methionine = N(2)- dimethylguanosine(10) in tRNA + 2 S-adenosyl-L-homocysteine + 2 H(+)
    source: "mapped enzyme EC:2.1.1.213"
    method: SOURCED
