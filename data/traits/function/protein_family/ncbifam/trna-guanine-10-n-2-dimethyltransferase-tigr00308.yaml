identifier: NCBIfam:TIGR00308
label: "tRNA (guanine(10)-N(2))-dimethyltransferase"
definition: >-
  tRNA (guanine(10)-N(2))-dimethyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00308 (equivalog); catalyses tRNA (guanine(10)-N(2))-dimethyltransferase; associated with RNA binding, tRNA processing, tRNA (guanine(10)-N2)-methyltransferase activity.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
