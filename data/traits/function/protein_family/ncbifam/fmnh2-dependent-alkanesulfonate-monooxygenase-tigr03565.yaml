label: "FMNH2-dependent alkanesulfonate monooxygenase"
definition: >-
  FMNH2-dependent alkanesulfonate monooxygenase (ssuD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03565 (equivalog); catalyses alkanesulfonate monooxygenase; associated with sulfur compound metabolic process, alkanesulfonate monooxygenase activity, FMN binding.
