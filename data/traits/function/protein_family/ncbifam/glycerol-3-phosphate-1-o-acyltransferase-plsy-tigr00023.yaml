  glycerol-3-phosphate 1-O-acyltransferase PlsY — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00023 (equivalog); catalyses glycerol-3-phosphate 1-O-acyltransferase; associated with plasma membrane, phosphatidic acid biosynthetic process, acyltransferase activity, transferring groups other than amino-acyl groups.
