identifier: NCBIfam:TIGR00457
label: "asparagine--tRNA ligase"
definition: >-
  asparagine--tRNA ligase (asnS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00457 (equivalog); catalyses asparagine--tRNA ligase; associated with nucleotide binding, asparagine-tRNA ligase activity, ATP binding, asparaginyl-tRNA aminoacylation.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
