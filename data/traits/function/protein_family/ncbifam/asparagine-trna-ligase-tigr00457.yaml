definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: tRNA(Asn) + L-asparagine + ATP = L-asparaginyl-tRNA(Asn) + AMP + diphosphate + H(+)
    source: "mapped enzyme EC:6.1.1.22"
    method: SOURCED
