  3-hydroxyisobutyrate dehydrogenase (mmsB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01692 (equivalog); catalyses 3-hydroxyisobutyrate dehydrogenase; associated with L-valine catabolic process, 3-hydroxyisobutyrate dehydrogenase activity, NAD binding.
