  aminomethyl-transferring glycine dehydrogenase subunit GcvPB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003346 (equivalog); catalyses glycine dehydrogenase (aminomethyl-transferring); associated with glycine dehydrogenase (decarboxylating) activity, glycine catabolic process.
