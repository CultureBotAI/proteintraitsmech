identifier: NCBIfam:NF003792
label: "CTP synthase"
definition: >-
  CTP synthase (pyrG) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003792 (equivalog); catalyses CTP synthase (glutamine hydrolyzing); associated with CTP synthase activity, pyrimidine nucleotide biosynthetic process, CTP biosynthetic process.
