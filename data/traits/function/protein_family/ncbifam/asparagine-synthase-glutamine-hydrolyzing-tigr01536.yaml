identifier: NCBIfam:TIGR01536
label: "asparagine synthase (glutamine-hydrolyzing)"
definition: >-
  asparagine synthase (glutamine-hydrolyzing) (asnB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01536 (equivalog); catalyses asparagine synthase (glutamine-hydrolyzing); associated with asparagine synthase (glutamine-hydrolyzing) activity, L-asparagine biosynthetic process.
