  Delta(5) desaturase DesA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF052548 (equivalog); associated with fatty acid biosynthetic process, oxidoreductase activity, acting on paired donors, with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
