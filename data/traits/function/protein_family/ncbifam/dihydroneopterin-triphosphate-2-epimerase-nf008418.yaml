label: "dihydroneopterin triphosphate 2'-epimerase"
definition: >-
  dihydroneopterin triphosphate 2'-epimerase (folX) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008418 (equivalog); catalyses dihydroneopterin triphosphate 2'-epimerase; associated with dihydroneopterin aldolase activity, folic acid-containing compound metabolic process. Members occur in Gammaproteobacteria.
