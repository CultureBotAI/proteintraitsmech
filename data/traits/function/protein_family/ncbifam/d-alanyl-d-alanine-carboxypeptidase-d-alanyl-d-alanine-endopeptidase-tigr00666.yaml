identifier: NCBIfam:TIGR00666
label: "D-alanyl-D-alanine carboxypeptidase/D-alanyl-D-alanine endopeptidase"
definition: >-
  D-alanyl-D-alanine carboxypeptidase/D-alanyl-D-alanine endopeptidase (dacB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00666 (equivalog); catalyses serine-type D-Ala-D-Ala carboxypeptidase; associated with endopeptidase activity, serine-type D-Ala-D-Ala carboxypeptidase activity, peptidoglycan biosynthetic process.
