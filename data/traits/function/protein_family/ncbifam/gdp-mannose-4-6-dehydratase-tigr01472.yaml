identifier: NCBIfam:TIGR01472
label: "GDP-mannose 4,6-dehydratase"
definition: >-
  GDP-mannose 4,6-dehydratase (gmd) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01472 (equivalog); catalyses GDP-mannose 4,6-dehydratase; associated with polysaccharide biosynthetic process, GDP-mannose 4,6-dehydratase activity, GDP-mannose metabolic process.
