definition: >-
  bifunctional phosphopantothenoylcysteine decarboxylase/phosphopantothenate--cysteine ligase CoaBC — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00521 (equivalog); catalyses phosphopantothenoylcysteine decarboxylase, phosphopantothenate--cysteine ligase (CTP); associated with phosphopantothenate--cysteine ligase activity, phosphopantothenoylcysteine decarboxylase activity, FMN binding, coenzyme A biosynthetic process.
