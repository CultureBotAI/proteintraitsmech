identifier: NCBIfam:NF005012
label: "NADH-quinone oxidoreductase subunit NuoB"
definition: >-
  NADH-quinone oxidoreductase subunit NuoB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF005012 (subfamily); catalyses NADH:ubiquinone reductase (non-electrogenic); associated with NADH dehydrogenase (ubiquinone) activity, quinone binding, iron-sulfur cluster binding.
