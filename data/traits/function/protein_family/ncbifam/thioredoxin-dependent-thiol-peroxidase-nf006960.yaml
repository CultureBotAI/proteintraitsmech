identifier: NCBIfam:NF006960
label: "thioredoxin-dependent thiol peroxidase"
definition: >-
  thioredoxin-dependent thiol peroxidase (bcp) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006960 (equivalog); catalyses thioredoxin-dependent peroxiredoxin; associated with antioxidant activity, oxidoreductase activity.
