  factor-independent urate hydroxylase (pucL) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03383 (equivalog); catalyses factor independent urate hydroxylase; associated with urate oxidase activity, urate catabolic process.
