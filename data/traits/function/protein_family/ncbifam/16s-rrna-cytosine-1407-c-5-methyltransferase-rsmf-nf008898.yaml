identifier: NCBIfam:NF008898
label: "16S rRNA (cytosine(1407)-C(5))-methyltransferase RsmF"
definition: >-
  16S rRNA (cytosine(1407)-C(5))-methyltransferase RsmF — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008898 (equivalog); catalyses 16S rRNA (cytosine(1407)-C(5))-methyltransferase; associated with RNA methylation, RNA binding, rRNA methyltransferase activity. Members occur in Gammaproteobacteria.
