identifier: NCBIfam:TIGR02749
label: "solanesyl diphosphate synthase"
definition: >-
  solanesyl diphosphate synthase (sds) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02749 (equivalog); associated with plastoquinone biosynthetic process, all-trans-nonaprenyl-diphosphate synthase (geranyl-diphosphate specific) activity. Members occur in Cyanobacteriota.
