  15-cis-phytoene desaturase (pds) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02731 (equivalog); catalyses 15-cis-phytoene desaturase; associated with carotenoid biosynthetic process, phytoene dehydrogenase activity. Members occur in Cyanobacteriota.
