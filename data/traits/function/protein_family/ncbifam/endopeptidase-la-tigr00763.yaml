definition: >-
  endopeptidase La (lon) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00763 (equivalog); catalyses endopeptidase La; associated with serine-type endopeptidase activity, ATP binding, proteolysis, ATP hydrolysis activity.
