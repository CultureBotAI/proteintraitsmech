identifier: NCBIfam:TIGR01885
label: "ornithine--oxo-acid transaminase"
definition: >-
  ornithine--oxo-acid transaminase (rocD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01885 (equivalog); catalyses ornithine aminotransferase; associated with L-ornithine transaminase activity.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
synonyms:
