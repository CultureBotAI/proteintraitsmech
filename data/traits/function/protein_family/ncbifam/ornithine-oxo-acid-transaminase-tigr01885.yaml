    synonym_type: EXACT_SYNONYM
    source: NCBIfam
  - synonym_text: rocD
    synonym_type: EXACT_SYNONYM
    source: NCBIfam
xrefs:
  - EC:2.6.1.13
  - GO:0004587
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: a 2-oxocarboxylate + L-ornithine = L-glutamate 5-semialdehyde + an L-alpha-amino acid
    source: "mapped enzyme EC:2.6.1.13"
    method: SOURCED
