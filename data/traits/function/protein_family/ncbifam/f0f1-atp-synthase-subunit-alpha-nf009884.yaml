identifier: NCBIfam:NF009884
label: "F0F1 ATP synthase subunit alpha"
definition: >-
  F0F1 ATP synthase subunit alpha — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF009884 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with ATP binding, proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex, proton-transporting ATP synthase activity, rotational mechanism.
