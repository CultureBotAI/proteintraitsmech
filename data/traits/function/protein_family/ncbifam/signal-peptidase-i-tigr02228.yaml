identifier: NCBIfam:TIGR02228
label: "signal peptidase I"
definition: >-
  signal peptidase I — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02228 (equivalog); catalyses signal peptidase I; associated with serine-type endopeptidase activity, membrane, protein maturation.
