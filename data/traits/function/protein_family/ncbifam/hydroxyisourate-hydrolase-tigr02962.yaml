  hydroxyisourate hydrolase (uraH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02962 (equivalog); catalyses hydroxyisourate hydrolase; associated with purine nucleobase metabolic process, hydroxyisourate hydrolase activity.
