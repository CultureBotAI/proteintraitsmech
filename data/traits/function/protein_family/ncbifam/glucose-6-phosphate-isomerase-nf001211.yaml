identifier: NCBIfam:NF001211
label: "glucose-6-phosphate isomerase"
definition: >-
  glucose-6-phosphate isomerase (pgi) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001211 (equivalog); catalyses glucose-6-phosphate isomerase; associated with glucose-6-phosphate isomerase activity, gluconeogenesis, glycolytic process.
