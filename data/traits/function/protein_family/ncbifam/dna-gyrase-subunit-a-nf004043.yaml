  DNA gyrase subunit A — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004043 (equivalog); catalyses DNA topoisomerase (ATP-hydrolyzing); associated with DNA binding, DNA topoisomerase activity, DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity, ATP binding.
