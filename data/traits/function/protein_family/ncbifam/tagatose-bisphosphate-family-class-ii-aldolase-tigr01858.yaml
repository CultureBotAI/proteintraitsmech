  tagatose bisphosphate family class II aldolase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01858 (equivalog); catalyses tagatose-bisphosphate aldolase; associated with carbohydrate metabolic process, zinc ion binding, tagatose-bisphosphate aldolase activity.
