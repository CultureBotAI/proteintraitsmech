identifier: NCBIfam:TIGR01330
label: "3'(2'),5'-bisphosphate nucleotidase"
definition: >-
  3'(2'),5'-bisphosphate nucleotidase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01330 (equivalog); catalyses 3'(2'),5'-bisphosphate nucleotidase; associated with sulfur compound metabolic process, 3'(2'),5'-bisphosphate nucleotidase activity.
