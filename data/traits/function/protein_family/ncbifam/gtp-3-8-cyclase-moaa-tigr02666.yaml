identifier: NCBIfam:TIGR02666
label: "GTP 3',8-cyclase MoaA"
definition: >-
  GTP 3',8-cyclase MoaA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02666 (equivalog); catalyses GTP 3',8-cyclase; associated with Mo-molybdopterin cofactor biosynthetic process, metal ion binding, 4 iron, 4 sulfur cluster binding.
