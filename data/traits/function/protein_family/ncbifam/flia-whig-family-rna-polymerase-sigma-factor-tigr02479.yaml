definition: >-
  FliA/WhiG family RNA polymerase sigma factor — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02479 (subfamily); associated with DNA binding, DNA-directed RNA polymerase activity, DNA-templated transcription initiation, regulation of DNA-templated transcription.
