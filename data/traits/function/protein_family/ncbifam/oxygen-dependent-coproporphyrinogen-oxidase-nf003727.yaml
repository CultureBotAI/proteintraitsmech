  - GO:0004109
  - GO:0006779
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: coproporphyrinogen III + O2 + 2 H(+) = protoporphyrinogen IX + 2 CO2 + 2 H2O
    source: "mapped enzyme EC:1.3.3.3"
    method: SOURCED
