identifier: NCBIfam:NF003727
label: "oxygen-dependent coproporphyrinogen oxidase"
definition: >-
  oxygen-dependent coproporphyrinogen oxidase (hemF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003727 (equivalog); catalyses coproporphyrinogen oxidase; associated with coproporphyrinogen oxidase activity, porphyrin-containing compound biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
