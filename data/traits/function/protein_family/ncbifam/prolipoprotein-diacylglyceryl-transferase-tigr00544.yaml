  prolipoprotein diacylglyceryl transferase (lgt) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00544 (equivalog); catalyses phosphatidylglycerol--prolipoprotein diacylglyceryl transferase; associated with phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity, protein lipoylation, membrane.
