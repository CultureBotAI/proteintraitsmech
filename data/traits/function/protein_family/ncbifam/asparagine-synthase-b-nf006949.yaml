  asparagine synthase B (asnB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006949 (equivalog); catalyses asparagine synthase (glutamine-hydrolyzing); associated with asparagine synthase (glutamine-hydrolyzing) activity, L-asparagine biosynthetic process.
