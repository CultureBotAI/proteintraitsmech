label: "chitin disaccharide deacetylase"
definition: >-
  chitin disaccharide deacetylase (chbG) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002559 (equivalog); catalyses chitin disaccharide deacetylase; associated with polysaccharide catabolic process, hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides.
