identifier: NCBIfam:NF006054
label: "purine-nucleoside phosphorylase"
definition: >-
  purine-nucleoside phosphorylase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006054 (equivalog); catalyses purine-nucleoside phosphorylase; associated with purine-nucleoside phosphorylase activity, nucleoside metabolic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
xrefs:
  - EC:2.4.2.1
  - GO:0004731
  - GO:0009116
synonyms:
  - synonym_text: PRK08202.1
    synonym_type: EXACT_SYNONYM
    source: NCBIfam
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a purine D-ribonucleoside + phosphate = a purine nucleobase + alpha- D-ribose 1-phosphate. (2) a purine 2'-deoxy-D-ribonucleoside + phosphate = a purine nucleobase + 2-deoxy-alpha-D-ribose 1-phosphate
    source: "mapped enzyme EC:2.4.2.1"
    method: SOURCED
