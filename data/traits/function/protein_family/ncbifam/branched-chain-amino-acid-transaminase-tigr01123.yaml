identifier: NCBIfam:TIGR01123
label: "branched-chain-amino-acid transaminase"
definition: >-
  branched-chain-amino-acid transaminase (ilvE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01123 (equivalog); catalyses branched-chain-amino-acid transaminase; associated with branched-chain-amino-acid:2-oxoglutarate transaminase activity, branched-chain amino acid metabolic process.
