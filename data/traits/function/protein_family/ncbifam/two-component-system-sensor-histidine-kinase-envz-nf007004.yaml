identifier: NCBIfam:NF007004
label: "two-component system sensor histidine kinase EnvZ"
definition: >-
  two-component system sensor histidine kinase EnvZ — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007004 (equivalog); catalyses histidine kinase; associated with phosphorelay sensor kinase activity, signal transduction, membrane, phosphorylation. Members occur in Gammaproteobacteria.
