identifier: NCBIfam:TIGR00447
label: "aminoacyl-tRNA hydrolase"
definition: >-
  aminoacyl-tRNA hydrolase (pth) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00447 (equivalog); catalyses peptidyl-tRNA hydrolase; associated with peptidyl-tRNA hydrolase activity.
