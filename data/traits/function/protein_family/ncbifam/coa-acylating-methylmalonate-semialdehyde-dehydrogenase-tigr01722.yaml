label: "CoA-acylating methylmalonate-semialdehyde dehydrogenase"
definition: >-
  CoA-acylating methylmalonate-semialdehyde dehydrogenase (mmsA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01722 (subfamily); catalyses methylmalonate-semialdehyde dehydrogenase (CoA acylating); associated with methylmalonate-semialdehyde dehydrogenase (acylating, NAD) activity.
