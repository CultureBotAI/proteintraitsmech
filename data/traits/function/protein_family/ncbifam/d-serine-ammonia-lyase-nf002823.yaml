  D-serine ammonia-lyase (dsdA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002823 (equivalog); catalyses D-serine ammonia-lyase; associated with D-serine ammonia-lyase activity, pyridoxal phosphate binding, D-amino acid metabolic process.
