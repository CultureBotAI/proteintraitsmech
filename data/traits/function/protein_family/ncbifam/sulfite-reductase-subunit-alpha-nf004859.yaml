  sulfite reductase subunit alpha — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004859 (equivalog); catalyses assimilatory sulfite reductase (NADPH); associated with oxidoreductase activity, iron-sulfur cluster binding.
