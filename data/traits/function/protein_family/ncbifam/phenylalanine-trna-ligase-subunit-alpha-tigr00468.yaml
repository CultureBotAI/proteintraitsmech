identifier: NCBIfam:TIGR00468
label: "phenylalanine--tRNA ligase subunit alpha"
definition: >-
  phenylalanine--tRNA ligase subunit alpha (pheS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00468 (equivalog); catalyses phenylalanine--tRNA ligase; associated with nucleotide binding, phenylalanine-tRNA ligase activity, ATP binding, cytoplasm.
