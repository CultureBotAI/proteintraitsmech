identifier: NCBIfam:TIGR00414
label: "serine--tRNA ligase"
definition: >-
  serine--tRNA ligase (serS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00414 (equivalog); catalyses serine--tRNA ligase; associated with nucleotide binding, serine-tRNA ligase activity, ATP binding, seryl-tRNA aminoacylation.
