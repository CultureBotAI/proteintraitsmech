identifier: NCBIfam:TIGR00225
label: "C-terminal processing peptidase"
definition: >-
  C-terminal processing peptidase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00225 (subfamily); catalyses C-terminal processing peptidase; associated with serine-type endopeptidase activity, proteolysis.
