  F0F1 ATP synthase subunit B (atpF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01144 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton transmembrane transporter activity, proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex.
