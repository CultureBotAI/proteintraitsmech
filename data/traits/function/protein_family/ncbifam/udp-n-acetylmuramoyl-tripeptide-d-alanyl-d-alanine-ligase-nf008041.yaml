label: "UDP-N-acetylmuramoyl-tripeptide--D-alanyl-D-alanine ligase"
definition: >-
  UDP-N-acetylmuramoyl-tripeptide--D-alanyl-D-alanine ligase (murF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008041 (equivalog); catalyses UDP-N-acetylmuramoyl-tripeptide--D-alanyl-D-alanine ligase; associated with ATP binding, biosynthetic process, UDP-N-acetylmuramoyl-tripeptide-D-alanyl-D-alanine ligase activity, cell wall organization. Members occur in Gammaproteobacteria.
