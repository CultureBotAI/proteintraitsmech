identifier: NCBIfam:TIGR01101
label: "V-type ATPase subunit F"
definition: >-
  V-type ATPase subunit F — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01101 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with P-type proton-exporting transporter activity, vacuolar proton-transporting V-type ATPase complex, proton transmembrane transport. Members occur in Klebsiella pneumoniae.
