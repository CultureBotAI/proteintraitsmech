identifier: NCBIfam:NF003470
label: "GMP reductase"
definition: >-
  GMP reductase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003470 (equivalog); catalyses GMP reductase; associated with GMP reductase activity, nucleotide metabolic process. Members occur in Pseudomonadati.
