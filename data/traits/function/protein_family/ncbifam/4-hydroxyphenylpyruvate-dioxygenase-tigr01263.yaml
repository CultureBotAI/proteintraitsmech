label: "4-hydroxyphenylpyruvate dioxygenase"
definition: >-
  4-hydroxyphenylpyruvate dioxygenase (hppD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01263 (equivalog); catalyses 4-hydroxyphenylpyruvate dioxygenase; associated with 4-hydroxyphenylpyruvate dioxygenase activity, L-phenylalanine catabolic process, L-tyrosine catabolic process.
