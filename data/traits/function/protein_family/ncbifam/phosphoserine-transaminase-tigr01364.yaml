identifier: NCBIfam:TIGR01364
label: "phosphoserine transaminase"
definition: >-
  phosphoserine transaminase (serC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01364 (equivalog); catalyses phosphoserine transaminase; associated with O-phospho-L-serine:2-oxoglutarate transaminase activity, L-serine biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
