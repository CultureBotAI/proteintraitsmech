  nicotinate phosphoribosyltransferase (pncB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01513 (equivalog); catalyses nicotinate phosphoribosyltransferase; associated with nicotinate phosphoribosyltransferase activity, NAD+ biosynthetic process.
