  translation initiation factor IF-5A (eif5A) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00037 (equivalog); associated with RNA binding, translation elongation factor activity, ribosome binding, positive regulation of translational elongation.
