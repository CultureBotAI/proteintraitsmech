identifier: NCBIfam:TIGR00471
label: "phenylalanine--tRNA ligase subunit beta"
definition: >-
  phenylalanine--tRNA ligase subunit beta (pheT) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00471 (equivalog); catalyses phenylalanine--tRNA ligase; associated with nucleotide binding, phenylalanine-tRNA ligase activity, ATP binding, cytoplasm.
