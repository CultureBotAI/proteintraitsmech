identifier: NCBIfam:NF003468
label: "acetylornithine/succinyldiaminopimelate transaminase"
definition: >-
  acetylornithine/succinyldiaminopimelate transaminase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003468 (subfamily); catalyses acetylornithine transaminase, succinyldiaminopimelate transaminase. Members occur in Pseudomonadota.
