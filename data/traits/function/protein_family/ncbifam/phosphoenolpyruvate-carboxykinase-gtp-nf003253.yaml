identifier: NCBIfam:NF003253
label: "phosphoenolpyruvate carboxykinase (GTP)"
definition: >-
  phosphoenolpyruvate carboxykinase (GTP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003253 (equivalog); catalyses phosphoenolpyruvate carboxykinase (GTP); associated with phosphoenolpyruvate carboxykinase activity, GTP binding, gluconeogenesis, purine nucleotide binding.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
