  F420-non-reducing hydrogenase Vhu subunit A (vhuA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF041785 (equivalog); associated with ferredoxin hydrogenase activity, nickel cation binding. Members occur in Methanococcales.
