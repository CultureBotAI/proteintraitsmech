identifier: NCBIfam:TIGR00096
label: "16S rRNA (cytidine(1402)-2'-O)-methyltransferase"
definition: >-
  16S rRNA (cytidine(1402)-2'-O)-methyltransferase (rsmI) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00096 (equivalog); catalyses 16S rRNA (cytidine(1402)-2'-O)-methyltransferase; associated with rRNA 2'-O-methylation, rRNA methyltransferase activity, S-adenosylmethionine-dependent methyltransferase activity.
