identifier: NCBIfam:TIGR01464
label: "uroporphyrinogen decarboxylase"
definition: >-
  uroporphyrinogen decarboxylase (hemE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01464 (equivalog); catalyses uroporphyrinogen decarboxylase; associated with uroporphyrinogen decarboxylase activity, porphyrin-containing compound biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
