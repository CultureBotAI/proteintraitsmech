  - EC:1.2.4.2
  - GO:0004591
  - GO:0006099
  - GO:0030976
synonyms:
  - synonym_text: PRK09404.1
    synonym_type: EXACT_SYNONYM
    source: NCBIfam
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: N(6)-[(R)-lipoyl]-L-lysyl-[protein] + 2-oxoglutarate + H(+) = N(6)-[(R)- S(8)-succinyldihydrolipoyl]-L-lysyl-[protein] + CO2
    source: "mapped enzyme EC:1.2.4.2"
    method: SOURCED
