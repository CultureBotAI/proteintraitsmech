identifier: NCBIfam:TIGR01224
label: imidazolonepropionase
definition: >-
  imidazolonepropionase (hutI) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01224 (equivalog); catalyses imidazolonepropionase; associated with cytoplasm, L-histidine catabolic process, hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in cyclic amides, imidazolonepropionase activity.
