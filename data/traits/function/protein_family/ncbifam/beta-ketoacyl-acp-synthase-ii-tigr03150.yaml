identifier: NCBIfam:TIGR03150
label: "beta-ketoacyl-ACP synthase II"
definition: >-
  beta-ketoacyl-ACP synthase II (fabF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03150 (equivalog); catalyses beta-ketoacyl-[acyl-carrier-protein] synthase II; associated with 3-oxoacyl-[acyl-carrier-protein] synthase activity, fatty acid biosynthetic process.
