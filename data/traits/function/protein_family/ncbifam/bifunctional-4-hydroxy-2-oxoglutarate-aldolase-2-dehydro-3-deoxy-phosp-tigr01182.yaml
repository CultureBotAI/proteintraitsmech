identifier: NCBIfam:TIGR01182
label: "bifunctional 4-hydroxy-2-oxoglutarate aldolase/2-dehydro-3-deoxy-phosphogluconate aldolase"
definition: >-
  bifunctional 4-hydroxy-2-oxoglutarate aldolase/2-dehydro-3-deoxy-phosphogluconate aldolase (eda) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01182 (subfamily); catalyses 2-dehydro-3-deoxy-phosphogluconate aldolase, 4-hydroxy-2-oxoglutarate aldolase; associated with 2-dehydro-3-deoxy-phosphogluconate aldolase activity, (R,S)-4-hydroxy-2-oxoglutarate aldolase activity, Entner-Doudoroff pathway.
