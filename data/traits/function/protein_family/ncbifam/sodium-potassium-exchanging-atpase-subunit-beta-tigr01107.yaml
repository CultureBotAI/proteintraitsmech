identifier: NCBIfam:TIGR01107
label: "sodium/potassium-exchanging ATPase subunit beta"
definition: >-
  sodium/potassium-exchanging ATPase subunit beta — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01107 (equivalog); catalyses Na(+)/K(+)-exchanging ATPase; associated with P-type sodium:potassium-exchanging transporter activity, sodium:potassium-exchanging ATPase complex, potassium ion transport, sodium ion transport.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
