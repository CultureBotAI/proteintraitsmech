identifier: NCBIfam:NF003591
label: "uracil-DNA glycosylase"
definition: >-
  uracil-DNA glycosylase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003591 (equivalog); catalyses uracil-DNA glycosylase; associated with uracil DNA N-glycosylase activity, DNA repair, base-excision repair.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
