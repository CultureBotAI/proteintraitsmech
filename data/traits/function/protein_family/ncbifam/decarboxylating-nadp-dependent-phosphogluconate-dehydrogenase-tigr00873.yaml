identifier: NCBIfam:TIGR00873
label: "decarboxylating NADP(+)-dependent phosphogluconate dehydrogenase"
definition: >-
  decarboxylating NADP(+)-dependent phosphogluconate dehydrogenase (gnd) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00873 (equivalog); catalyses phosphogluconate dehydrogenase (NADP(+)-dependent, decarboxylating); associated with phosphogluconate dehydrogenase (decarboxylating) activity, cytoplasm, pentose-phosphate shunt.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
