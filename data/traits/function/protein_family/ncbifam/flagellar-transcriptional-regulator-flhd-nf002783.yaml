label: "flagellar transcriptional regulator FlhD"
definition: >-
  flagellar transcriptional regulator FlhD — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002783 (equivalog); associated with DNA binding, positive regulation of DNA-templated transcription, regulation of bacterial-type flagellum assembly. Members occur in Pseudomonadati.
