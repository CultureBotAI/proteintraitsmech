identifier: NCBIfam:TIGR01240
label: "diphosphomevalonate decarboxylase"
definition: >-
  diphosphomevalonate decarboxylase (mvaD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01240 (equivalog); catalyses diphosphomevalonate decarboxylase; associated with diphosphomevalonate decarboxylase activity, cytosol, isopentenyl diphosphate biosynthetic process, mevalonate pathway.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
