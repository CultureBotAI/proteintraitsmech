identifier: NCBIfam:TIGR00071
label: "tRNA pseudouridine(38-40) synthase TruA"
definition: >-
  tRNA pseudouridine(38-40) synthase TruA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00071 (equivalog); catalyses tRNA pseudouridine(38-40) synthase; associated with pseudouridine synthesis, RNA binding, RNA modification, pseudouridine synthase activity.
