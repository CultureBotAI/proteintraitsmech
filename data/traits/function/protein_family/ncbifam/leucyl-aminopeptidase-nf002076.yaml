identifier: NCBIfam:NF002076
label: "leucyl aminopeptidase"
definition: >-
  leucyl aminopeptidase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002076 (equivalog); catalyses leucyl aminopeptidase.
