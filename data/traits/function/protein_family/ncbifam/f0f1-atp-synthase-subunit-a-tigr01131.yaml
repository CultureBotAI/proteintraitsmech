identifier: NCBIfam:TIGR01131
label: "F0F1 ATP synthase subunit A"
definition: >-
  F0F1 ATP synthase subunit A (atpB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01131 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex, proton-transporting ATP synthase activity, rotational mechanism.
