  F0F1 ATP synthase subunit gamma — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004145 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex, proton-transporting ATP synthase activity, rotational mechanism.
