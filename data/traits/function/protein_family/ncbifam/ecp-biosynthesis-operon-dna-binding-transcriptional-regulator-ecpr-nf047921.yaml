definition: >-
  ECP biosynthesis operon DNA-binding transcriptional regulator EcpR — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF047921 (equivalog); associated with DNA binding, regulation of DNA-templated transcription, regulation of bacterial-type flagellum-dependent cell motility. Members occur in Enterobacteriaceae.
