  glucosamine-6-phosphate deaminase (nagB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001685 (equivalog); catalyses glucosamine-6-phosphate deaminase; associated with glucosamine-6-phosphate deaminase activity, N-acetylglucosamine metabolic process. Members occur in Gammaproteobacteria.
