label: "16S rRNA (adenine(1518)-N(6)/adenine(1519)-N(6))-dimethyltransferase RsmA"
definition: >-
  16S rRNA (adenine(1518)-N(6)/adenine(1519)-N(6))-dimethyltransferase RsmA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00755 (equivalog); catalyses 16S rRNA (adenine(1518)-N(6)/adenine(1519)-N(6))-dimethyltransferase; associated with rRNA modification, rRNA (adenine-N6,N6-)-dimethyltransferase activity, rRNA processing.
