identifier: NCBIfam:TIGR01988
label: "ubiquinone biosynthesis hydroxylase, UbiH/UbiF/VisC/COQ6 family"
definition: >-
  ubiquinone biosynthesis hydroxylase, UbiH/UbiF/VisC/COQ6 family — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01988 (subfamily); associated with ubiquinone biosynthetic process, oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, flavin adenine dinucleotide binding.
