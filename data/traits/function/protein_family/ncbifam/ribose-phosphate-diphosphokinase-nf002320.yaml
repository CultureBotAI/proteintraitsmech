  ribose-phosphate diphosphokinase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002320 (subfamily); catalyses ribose-phosphate diphosphokinase; associated with ribose phosphate diphosphokinase activity, ribonucleoside monophosphate biosynthetic process.
