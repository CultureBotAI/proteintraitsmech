  3D-(3,5/4)-trihydroxycyclohexane-1,2-dione acylhydrolase (decyclizing) (iolD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR04377 (equivalog); catalyses 3D-(3,5/4)-trihydroxycyclohexane-1,2-dione acylhydrolase (decyclizing); associated with hydrolase activity, acting on carbon-carbon bonds, in ketonic substances, inositol catabolic process, thiamine pyrophosphate binding.
