identifier: NCBIfam:TIGR03182
label: "pyruvate dehydrogenase (acetyl-transferring) E1 component subunit alpha"
definition: >-
  pyruvate dehydrogenase (acetyl-transferring) E1 component subunit alpha (pdhA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03182 (equivalog); catalyses pyruvate dehydrogenase (acetyl-transferring); associated with pyruvate dehydrogenase (acetyl-transferring) activity, pyruvate decarboxylation to acetyl-CoA, pyruvate dehydrogenase complex.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
