identifier: NCBIfam:NF003764
label: "3-phosphoserine/phosphohydroxythreonine transaminase"
definition: >-
  3-phosphoserine/phosphohydroxythreonine transaminase (serC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003764 (equivalog); catalyses phosphoserine transaminase; associated with catalytic activity, O-phospho-L-serine:2-oxoglutarate transaminase activity, L-serine biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
