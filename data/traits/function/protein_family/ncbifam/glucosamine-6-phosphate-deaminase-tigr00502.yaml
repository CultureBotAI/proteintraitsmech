  - GO:0004342
  - GO:0006044
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: alpha-D-glucosamine 6-phosphate + H2O = beta-D-fructose 6-phosphate + NH4(+)
    source: "mapped enzyme EC:3.5.99.6"
    method: SOURCED
