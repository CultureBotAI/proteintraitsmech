identifier: NCBIfam:TIGR00502
label: "glucosamine-6-phosphate deaminase"
definition: >-
  glucosamine-6-phosphate deaminase (nagB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00502 (equivalog); catalyses glucosamine-6-phosphate deaminase; associated with glucosamine-6-phosphate deaminase activity, N-acetylglucosamine metabolic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
