identifier: NCBIfam:TIGR03284
label: "thymidylate synthase"
definition: >-
  thymidylate synthase (thyA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03284 (equivalog); catalyses thymidylate synthase; associated with thymidylate synthase activity, dTMP biosynthetic process.
