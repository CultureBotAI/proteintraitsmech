identifier: NCBIfam:NF005959
label: "bifunctional acyl-ACP--phospholipid O-acyltransferase/long-chain-fatty-acid--ACP ligase"
definition: >-
  bifunctional acyl-ACP--phospholipid O-acyltransferase/long-chain-fatty-acid--ACP ligase (aas) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF005959 (equivalog); catalyses acyl-[acyl-carrier-protein]--phospholipid O-acyltransferase, medium-chain-fatty-acid--[acyl-carrier-protein] ligase; associated with fatty acid metabolic process, phospholipid biosynthetic process, acyl-[acyl-carrier-protein]-phospholipid O-acyltransferase activity, long-chain fatty acid [acyl-carrier-protein] ligase activity. Members occur in Gammaproteobacteria.
