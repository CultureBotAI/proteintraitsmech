identifier: NCBIfam:TIGR00138
label: "16S rRNA (guanine(527)-N(7))-methyltransferase RsmG"
definition: >-
  16S rRNA (guanine(527)-N(7))-methyltransferase RsmG — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00138 (equivalog); catalyses 16S rRNA (guanine(527)-N(7))-methyltransferase; associated with methyltransferase activity, rRNA methylation, 7-methylguanosine biosynthetic process.
