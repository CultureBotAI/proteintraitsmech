  molybdate ABC transporter permease subunit (modB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02141 (equivalog); associated with plasma membrane, ABC-type molybdate transporter activity, molybdate ion transport, ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing.
