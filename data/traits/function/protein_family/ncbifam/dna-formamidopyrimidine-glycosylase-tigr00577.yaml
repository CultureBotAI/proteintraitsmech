identifier: NCBIfam:TIGR00577
label: "DNA-formamidopyrimidine glycosylase"
definition: >-
  DNA-formamidopyrimidine glycosylase (mutM) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00577 (equivalog); catalyses DNA-formamidopyrimidine glycosylase; associated with cytoplasm, DNA repair, oxidized purine nucleobase lesion DNA N-glycosylase activity, metal ion binding.
