identifier: NCBIfam:TIGR01986
label: "glutathione synthase"
definition: >-
  glutathione synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01986 (equivalog); catalyses glutathione synthase; associated with glutathione synthase activity, glutathione biosynthetic process. Members occur in Cyanophyceae.
