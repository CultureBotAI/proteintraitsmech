  multifunctional oxoglutarate decarboxylase/oxoglutarate dehydrogenase thiamine pyrophosphate-binding subunit/dihydrolipoyllysine-residue succinyltransferase subunit — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008907 (equivalog); catalyses 2-oxoglutarate decarboxylase; associated with oxoglutarate dehydrogenase (succinyl-transferring) activity, tricarboxylic acid cycle, acyltransferase activity, thiamine pyrophosphate binding.
