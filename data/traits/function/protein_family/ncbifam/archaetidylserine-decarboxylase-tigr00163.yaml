identifier: NCBIfam:TIGR00163
label: "archaetidylserine decarboxylase"
definition: >-
  archaetidylserine decarboxylase (asd) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00163 (equivalog); catalyses phosphatidylserine decarboxylase; associated with phosphatidylserine decarboxylase activity, phospholipid biosynthetic process.
