identifier: NCBIfam:TIGR01512
label: "cadmium family heavy metal-translocating P-type ATPase"
definition: >-
  cadmium family heavy metal-translocating P-type ATPase (cadA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01512 (subfamily); catalyses Cd(2+)-exporting ATPase; associated with ABC-type cadmium transporter activity, cadmium ion transport.
