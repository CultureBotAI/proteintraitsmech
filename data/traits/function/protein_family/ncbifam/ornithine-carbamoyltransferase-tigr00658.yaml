  ornithine carbamoyltransferase (argF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00658 (equivalog); catalyses ornithine carbamoyltransferase; associated with ornithine carbamoyltransferase activity, L-arginine biosynthetic process.
