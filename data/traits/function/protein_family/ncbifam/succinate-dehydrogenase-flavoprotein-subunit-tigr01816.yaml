label: "succinate dehydrogenase flavoprotein subunit"
definition: >-
  succinate dehydrogenase flavoprotein subunit (sdhA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01816 (equivalog); associated with tricarboxylic acid cycle, oxidoreductase activity, acting on the CH-CH group of donors, flavin adenine dinucleotide binding.
