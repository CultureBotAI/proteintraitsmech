  ATP synthase F1 subunit delta (atpH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01145 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex, proton-transporting ATP synthase activity, rotational mechanism.
