identifier: NCBIfam:TIGR00169
label: "3-isopropylmalate dehydrogenase"
definition: >-
  3-isopropylmalate dehydrogenase (leuB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00169 (equivalog); catalyses 3-isopropylmalate dehydrogenase; associated with 3-isopropylmalate dehydrogenase activity, L-leucine biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
