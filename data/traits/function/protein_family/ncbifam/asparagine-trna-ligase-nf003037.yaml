identifier: NCBIfam:NF003037
label: "asparagine--tRNA ligase"
definition: >-
  asparagine--tRNA ligase (asnS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003037 (equivalog); catalyses asparagine--tRNA ligase; associated with asparagine-tRNA ligase activity, ATP binding, asparaginyl-tRNA aminoacylation.
