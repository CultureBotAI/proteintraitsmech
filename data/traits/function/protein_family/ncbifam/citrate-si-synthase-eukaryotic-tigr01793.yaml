identifier: NCBIfam:TIGR01793
label: "citrate (Si)-synthase, eukaryotic"
definition: >-
  citrate (Si)-synthase, eukaryotic — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01793 (equivalog); catalyses citrate (Si)-synthase; associated with tricarboxylic acid cycle, citrate metabolic process, citrate synthase activity. Members occur in Pseudomonadati.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
