identifier: NCBIfam:NF008805
label: "polyribonucleotide nucleotidyltransferase"
definition: >-
  polyribonucleotide nucleotidyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008805 (equivalog); catalyses polyribonucleotide nucleotidyltransferase; associated with RNA binding, polyribonucleotide nucleotidyltransferase activity, RNA processing, mRNA catabolic process.
