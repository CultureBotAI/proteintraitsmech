label: "adenylate kinase"
definition: >-
  adenylate kinase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01360 (equivalog); catalyses adenylate kinase; associated with AMP kinase activity, ATP binding, cytoplasm, purine deoxyribonucleotide metabolic process.
