identifier: NCBIfam:NF003802
label: "bifunctional glutamate N-acetyltransferase/amino-acid acetyltransferase ArgJ"
definition: >-
  bifunctional glutamate N-acetyltransferase/amino-acid acetyltransferase ArgJ — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003802 (equivalog); catalyses amino-acid N-acetyltransferase, glutamate N-acetyltransferase; associated with L-glutamate N-acetyltransferase activity, acting on acetyl-L-ornithine as donor, L-arginine biosynthetic process.
