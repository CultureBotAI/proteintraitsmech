identifier: NCBIfam:TIGR00222
label: "3-methyl-2-oxobutanoate hydroxymethyltransferase"
definition: >-
  3-methyl-2-oxobutanoate hydroxymethyltransferase (panB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00222 (equivalog); catalyses 3-methyl-2-oxobutanoate hydroxymethyltransferase; associated with 3-methyl-2-oxobutanoate hydroxymethyltransferase activity, pantothenate biosynthetic process.
