identifier: NCBIfam:NF001097
label: "uracil phosphoribosyltransferase"
definition: >-
  uracil phosphoribosyltransferase (upp) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001097 (equivalog); catalyses uracil phosphoribosyltransferase; associated with uracil phosphoribosyltransferase activity, nucleoside metabolic process.
