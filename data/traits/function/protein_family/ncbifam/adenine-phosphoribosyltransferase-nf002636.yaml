identifier: NCBIfam:NF002636
label: "adenine phosphoribosyltransferase"
definition: >-
  adenine phosphoribosyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002636 (equivalog); catalyses adenine phosphoribosyltransferase; associated with adenine phosphoribosyltransferase activity, nucleoside metabolic process.
