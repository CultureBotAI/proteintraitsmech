  bifunctional aspartate kinase/homoserine dehydrogenase II (metL) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007003 (subfamily); catalyses homoserine dehydrogenase, aspartate kinase. Members occur in Pseudomonadati.
