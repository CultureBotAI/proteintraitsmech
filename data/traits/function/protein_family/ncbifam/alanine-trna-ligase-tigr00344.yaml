identifier: NCBIfam:TIGR00344
label: "alanine--tRNA ligase"
definition: >-
  alanine--tRNA ligase (alaS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00344 (equivalog); catalyses alanine--tRNA ligase; associated with nucleotide binding, alanine-tRNA ligase activity, cytoplasm, alanyl-tRNA aminoacylation.
