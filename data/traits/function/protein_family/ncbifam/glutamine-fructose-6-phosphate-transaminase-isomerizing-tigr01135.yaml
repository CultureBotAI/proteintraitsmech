identifier: NCBIfam:TIGR01135
label: "glutamine--fructose-6-phosphate transaminase (isomerizing)"
definition: >-
  glutamine--fructose-6-phosphate transaminase (isomerizing) (glmS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01135 (equivalog); catalyses glutamine--fructose-6-phosphate transaminase (isomerizing); associated with L-glutamine:D-fructose-6-phosphate transaminase (isomerizing) activity, carbohydrate derivative biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
