definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: D-fructose 6-phosphate + L-glutamine = D-glucosamine 6-phosphate + L-glutamate
    source: "mapped enzyme EC:2.6.1.16"
    method: SOURCED
