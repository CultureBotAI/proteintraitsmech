identifier: NCBIfam:NF047954
label: "bifunctional L-1,2-propanediol dehydrogenase/glycerol dehydrogenase"
definition: >-
  bifunctional L-1,2-propanediol dehydrogenase/glycerol dehydrogenase (gldA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF047954 (equivalog); catalyses glycerol dehydrogenase, (R)-aminopropanol dehydrogenase; associated with glycerol dehydrogenase (NAD+) activity, (R)-aminopropanol dehydrogenase activity, anaerobic glycerol catabolic process, methylglyoxal catabolic process. Members occur in Enterobacteriaceae.
