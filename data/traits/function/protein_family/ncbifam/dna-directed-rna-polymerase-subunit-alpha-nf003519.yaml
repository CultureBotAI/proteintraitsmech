  DNA-directed RNA polymerase subunit alpha — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003519 (equivalog); catalyses DNA-directed RNA polymerase; associated with DNA binding, DNA-directed RNA polymerase activity, DNA-templated transcription, protein dimerization activity.
