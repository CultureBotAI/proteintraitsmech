  bifunctional NADP-dependent 3-hydroxy acid dehydrogenase/3-hydroxypropionate dehydrogenase YdfG — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007829 (equivalog); catalyses 3-hydroxypropionate dehydrogenase (NADP(+)), 3-hydroxy acid dehydrogenase; associated with oxidoreductase activity. Members occur in Pseudomonadota.
