identifier: NCBIfam:TIGR01349
label: "pyruvate dehydrogenase complex dihydrolipoamide acetyltransferase"
definition: >-
  pyruvate dehydrogenase complex dihydrolipoamide acetyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01349 (equivalog); catalyses dihydrolipoyllysine-residue acetyltransferase; associated with dihydrolipoyllysine-residue acetyltransferase activity, pyruvate metabolic process, pyruvate dehydrogenase complex.
