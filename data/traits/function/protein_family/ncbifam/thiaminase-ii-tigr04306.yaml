label: "thiaminase II"
definition: >-
  thiaminase II (tenA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR04306 (equivalog); catalyses aminopyrimidine aminohydrolase; associated with thiamine metabolic process, thiaminase activity.
