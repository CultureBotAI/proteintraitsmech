  glutamate synthase large subunit (gltB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008730 (equivalog); catalyses glutamate synthase (NADPH); associated with catalytic activity, metabolic process, glutamate synthase activity, oxidoreductase activity.
