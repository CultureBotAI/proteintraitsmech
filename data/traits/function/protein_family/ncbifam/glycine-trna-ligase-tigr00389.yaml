  glycine--tRNA ligase (glyS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00389 (equivalog); catalyses glycine--tRNA ligase; associated with nucleotide binding, glycine-tRNA ligase activity, ATP binding, cytoplasm.
