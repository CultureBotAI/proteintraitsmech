identifier: NCBIfam:TIGR02093
label: "glycogen/starch/alpha-glucan family phosphorylase"
definition: >-
  glycogen/starch/alpha-glucan family phosphorylase (glgP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02093 (subfamily); catalyses glycogen phosphorylase; associated with 1,4-alpha-oligoglucan phosphorylase activity, carbohydrate metabolic process, pyridoxal phosphate binding.
