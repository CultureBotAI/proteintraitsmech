identifier: NCBIfam:TIGR01260
label: "ATP synthase F0 subunit C"
definition: >-
  ATP synthase F0 subunit C (atpE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01260 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton transmembrane transporter activity, proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex.
