identifier: NCBIfam:TIGR00512
label: "S-methyl-5-thioribose-1-phosphate isomerase"
definition: >-
  S-methyl-5-thioribose-1-phosphate isomerase (mtnA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00512 (equivalog); catalyses S-methyl-5-thioribose-1-phosphate isomerase; associated with L-methionine cycle, S-methyl-5-thioribose-1-phosphate isomerase activity.
