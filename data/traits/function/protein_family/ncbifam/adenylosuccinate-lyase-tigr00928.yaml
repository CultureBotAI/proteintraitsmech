identifier: NCBIfam:TIGR00928
label: "adenylosuccinate lyase"
definition: >-
  adenylosuccinate lyase (purB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00928 (equivalog); catalyses adenylosuccinate lyase; associated with N6-(1,2-dicarboxyethyl)AMP AMP-lyase (fumarate-forming) activity, purine ribonucleotide biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: purB
    synonym_type: EXACT_SYNONYM
    source: NCBIfam
xrefs:
  - EC:4.3.2.2
  - GO:0004018
  - GO:0009152
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) N(6)-(1,2-dicarboxyethyl)-AMP = fumarate + AMP. (2) (2S)-2-[5-amino-1-(5-phospho-beta-D-ribosyl)imidazole-4- carboxamido]succinate = 5-amino-1-(5-phospho-beta-D-ribosyl)imidazole-4- carboxamide + fumarate
    source: "mapped enzyme EC:4.3.2.2"
    method: SOURCED
