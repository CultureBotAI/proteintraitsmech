    text: >-
      Catalyses: (6S)-5-formyl-5,6,7,8-tetrahydrofolate + ATP = (6R)-5,10- methenyltetrahydrofolate + ADP + phosphate
    source: "mapped enzyme EC:6.3.3.2"
