identifier: NCBIfam:TIGR02727
label: "5-formyltetrahydrofolate cyclo-ligase"
definition: >-
  5-formyltetrahydrofolate cyclo-ligase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02727 (equivalog); catalyses 5-formyltetrahydrofolate cyclo-ligase; associated with one-carbon metabolic process, 5-formyltetrahydrofolate cyclo-ligase activity.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
