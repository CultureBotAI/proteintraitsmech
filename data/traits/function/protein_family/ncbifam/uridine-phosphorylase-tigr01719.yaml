identifier: NCBIfam:TIGR01719
label: "uridine phosphorylase"
definition: >-
  uridine phosphorylase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01719 (equivalog); catalyses uridine phosphorylase; associated with purine-nucleoside phosphorylase activity, nucleobase-containing compound metabolic process.
