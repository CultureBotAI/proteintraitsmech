  2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate synthase (menH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008340 (equivalog); catalyses 2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate synthase; associated with menaquinone biosynthetic process, 2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate synthase activity. Members occur in Gammaproteobacteria.
