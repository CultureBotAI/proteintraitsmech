  ferrochelatase (hemH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00109 (equivalog); catalyses protoporphyrin ferrochelatase; associated with protoporphyrin ferrochelatase activity, porphyrin-containing compound biosynthetic process.
