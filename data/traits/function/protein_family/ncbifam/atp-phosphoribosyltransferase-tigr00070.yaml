  ATP phosphoribosyltransferase (hisG) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00070 (equivalog); catalyses ATP phosphoribosyltransferase; associated with L-histidine biosynthetic process, ATP phosphoribosyltransferase activity, cytoplasm.
