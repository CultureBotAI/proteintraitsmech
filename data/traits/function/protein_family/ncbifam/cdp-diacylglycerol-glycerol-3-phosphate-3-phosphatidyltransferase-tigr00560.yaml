  CDP-diacylglycerol--glycerol-3-phosphate 3-phosphatidyltransferase (pgsA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00560 (equivalog); catalyses CDP-diacylglycerol--glycerol-3-phosphate 1-phosphatidyltransferase; associated with CDP-diacylglycerol-glycerol-3-phosphate 3-phosphatidyltransferase activity, phospholipid biosynthetic process, membrane.
