  NAD-dependent DNA ligase LigB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF005987 (equivalog); catalyses DNA ligase (NAD(+)); associated with DNA ligase (NAD+) activity, DNA replication, DNA repair. Members occur in Gammaproteobacteria.
