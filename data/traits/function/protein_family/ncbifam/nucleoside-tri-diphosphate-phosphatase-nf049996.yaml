label: "nucleoside tri-diphosphate phosphatase"
definition: >-
  nucleoside tri-diphosphate phosphatase (ntdP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF049996 (equivalog); associated with nucleoside metabolic process, nucleoside diphosphate phosphatase activity, ribonucleoside triphosphate phosphatase activity. Members occur in Bacillota.
