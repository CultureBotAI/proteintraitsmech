identifier: NCBIfam:TIGR00120
label: "bifunctional ornithine acetyltransferase/N-acetylglutamate synthase"
definition: >-
  bifunctional ornithine acetyltransferase/N-acetylglutamate synthase (argJ) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00120 (equivalog); catalyses amino-acid N-acetyltransferase, glutamate N-acetyltransferase; associated with L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor, L-glutamate N-acetyltransferase activity, acting on acetyl-L-ornithine as donor, L-arginine biosynthetic process, L-ornithine biosynthetic process.
