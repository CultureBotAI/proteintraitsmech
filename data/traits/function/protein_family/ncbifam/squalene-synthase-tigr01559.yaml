identifier: NCBIfam:TIGR01559
label: "squalene synthase"
definition: >-
  squalene synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01559 (equivalog); catalyses squalene synthase. Members occur in Bacteroidota.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
