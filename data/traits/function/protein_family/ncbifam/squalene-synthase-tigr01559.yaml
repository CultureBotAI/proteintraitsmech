  - synonym_text: squal_synth
    synonym_type: EXACT_SYNONYM
    source: NCBIfam
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 2 (2E,6E)-farnesyl diphosphate + NADPH + H(+) = squalene + 2 diphosphate + NADP(+). (2) 2 (2E,6E)-farnesyl diphosphate + NADH + H(+) = squalene + 2 diphosphate + NAD(+)
    source: "mapped enzyme EC:2.5.1.21"
    method: SOURCED
