identifier: NCBIfam:TIGR00628
label: "uracil-DNA glycosylase"
definition: >-
  uracil-DNA glycosylase (ung) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00628 (equivalog); catalyses uracil-DNA glycosylase; associated with uracil DNA N-glycosylase activity, DNA repair, base-excision repair.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
