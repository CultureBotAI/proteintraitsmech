identifier: NCBIfam:NF002073
label: "leucyl aminopeptidase"
definition: >-
  leucyl aminopeptidase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002073 (equivalog); catalyses leucyl aminopeptidase; associated with proteolysis, manganese ion binding, metalloaminopeptidase activity.
