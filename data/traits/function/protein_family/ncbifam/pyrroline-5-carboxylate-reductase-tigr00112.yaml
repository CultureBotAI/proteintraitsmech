identifier: NCBIfam:TIGR00112
label: "pyrroline-5-carboxylate reductase"
definition: >-
  pyrroline-5-carboxylate reductase (proC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00112 (equivalog); catalyses pyrroline-5-carboxylate reductase; associated with pyrroline-5-carboxylate reductase activity, L-proline biosynthetic process.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
