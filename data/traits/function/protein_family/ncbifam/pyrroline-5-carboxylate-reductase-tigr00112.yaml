definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) L-proline + NAD(+) = (S)-1-pyrroline-5-carboxylate + NADH + 2 H(+). (2) L-proline + NADP(+) = (S)-1-pyrroline-5-carboxylate + NADPH + 2 H(+)
    source: "mapped enzyme EC:1.5.1.2"
    method: SOURCED
