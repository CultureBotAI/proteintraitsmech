identifier: NCBIfam:TIGR00209
label: "galactose-1-phosphate uridylyltransferase"
definition: >-
  galactose-1-phosphate uridylyltransferase (galT) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00209 (equivalog); catalyses UDP-glucose--hexose-1-phosphate uridylyltransferase; associated with galactose metabolic process, UDP-glucose:hexose-1-phosphate uridylyltransferase activity, zinc ion binding.
