definition: >-
  tryptophan synthase subunit alpha (trpA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00262 (equivalog); catalyses tryptophan synthase; associated with L-tryptophan biosynthetic process, tryptophan synthase activity.
