  ubiquinol-cytochrome c reductase iron-sulfur subunit (petA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01416 (equivalog); catalyses quinol--cytochrome-c reductase; associated with quinol-cytochrome-c reductase activity, electron transfer activity, aerobic respiration, respiratory chain complex III.
