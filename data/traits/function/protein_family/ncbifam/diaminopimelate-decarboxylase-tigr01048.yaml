identifier: NCBIfam:TIGR01048
label: "diaminopimelate decarboxylase"
definition: >-
  diaminopimelate decarboxylase (lysA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01048 (equivalog); catalyses diaminopimelate decarboxylase; associated with diaminopimelate decarboxylase activity, L-lysine biosynthetic process.
