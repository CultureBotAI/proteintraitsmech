identifier: NCBIfam:NF002537
label: "phosphoadenylyl-sulfate reductase"
definition: >-
  phosphoadenylyl-sulfate reductase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002537 (equivalog); catalyses phosphoadenylyl-sulfate reductase (thioredoxin); associated with sulfate assimilation, catalytic activity, phosphoadenylyl-sulfate reductase (thioredoxin) activity.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
