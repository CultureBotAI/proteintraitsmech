  glutamate--tRNA ligase (gltX) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00464 (equivalog); catalyses glutamate--tRNA ligase; associated with nucleotide binding, glutamate-tRNA ligase activity, ATP binding, glutamyl-tRNA aminoacylation.
