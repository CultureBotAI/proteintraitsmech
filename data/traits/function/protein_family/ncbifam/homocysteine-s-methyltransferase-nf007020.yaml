identifier: NCBIfam:NF007020
label: "homocysteine S-methyltransferase"
definition: >-
  homocysteine S-methyltransferase (mmuM) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007020 (equivalog); catalyses homocysteine S-methyltransferase; associated with betaine-homocysteine S-methyltransferase activity, L-methionine biosynthetic process.
