identifier: NCBIfam:TIGR00347
label: "dethiobiotin synthase"
definition: >-
  dethiobiotin synthase (bioD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00347 (equivalog); catalyses dethiobiotin synthase; associated with magnesium ion binding, dethiobiotin synthase activity, ATP binding, biotin biosynthetic process.
