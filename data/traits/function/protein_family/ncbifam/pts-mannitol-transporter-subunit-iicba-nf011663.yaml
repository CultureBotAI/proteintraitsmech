  PTS mannitol transporter subunit IICBA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF011663 (subfamily); catalyses protein-N(pi)-phosphohistidine--D-mannitol phosphotransferase; associated with phosphoenolpyruvate-dependent sugar phosphotransferase system, protein-N(PI)-phosphohistidine-mannitol phosphotransferase system transmembrane transporter activity.
