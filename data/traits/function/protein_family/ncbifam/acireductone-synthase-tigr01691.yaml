identifier: NCBIfam:TIGR01691
label: "acireductone synthase"
definition: >-
  acireductone synthase (mtnC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01691 (equivalog); catalyses acireductone synthase; associated with magnesium ion binding, L-methionine cycle, acireductone synthase activity.
