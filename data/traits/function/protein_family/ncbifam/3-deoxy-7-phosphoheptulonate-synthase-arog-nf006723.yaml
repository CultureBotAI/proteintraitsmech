  3-deoxy-7-phosphoheptulonate synthase AroG — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006723 (equivalog); catalyses 3-deoxy-7-phosphoheptulonate synthase; associated with 3-deoxy-7-phosphoheptulonate synthase activity, aromatic amino acid biosynthetic process. Members occur in Pseudomonadota.
