  NADP-dependent isocitrate dehydrogenase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006156 (equivalog); catalyses isocitrate dehydrogenase (NADP(+)); associated with magnesium ion binding, isocitrate dehydrogenase (NADP+) activity, isocitrate metabolic process, NAD binding.
