identifier: NCBIfam:TIGR02397
label: "DNA polymerase III subunit gamma/tau"
definition: >-
  DNA polymerase III subunit gamma/tau (dnaX) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02397 (equivalog); catalyses DNA-directed DNA polymerase; associated with DNA-directed DNA polymerase activity, ATP binding, DNA replication, DNA polymerase III complex.
