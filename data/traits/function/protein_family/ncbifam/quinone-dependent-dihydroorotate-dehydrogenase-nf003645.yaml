identifier: NCBIfam:NF003645
label: "quinone-dependent dihydroorotate dehydrogenase"
definition: >-
  quinone-dependent dihydroorotate dehydrogenase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003645 (equivalog); catalyses dihydroorotate dehydrogenase (quinone); associated with dihydroorotate dehydrogenase activity, 'de novo' pyrimidine nucleobase biosynthetic process, membrane.
