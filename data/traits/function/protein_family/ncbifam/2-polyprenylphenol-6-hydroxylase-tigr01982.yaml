identifier: NCBIfam:TIGR01982
label: "2-polyprenylphenol 6-hydroxylase"
definition: >-
  2-polyprenylphenol 6-hydroxylase (ubiB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01982 (equivalog); associated with ubiquinone biosynthetic process, oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen.
