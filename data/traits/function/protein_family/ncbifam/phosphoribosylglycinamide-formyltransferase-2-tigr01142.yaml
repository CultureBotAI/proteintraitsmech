  phosphoribosylglycinamide formyltransferase 2 (purT) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01142 (equivalog); associated with magnesium ion binding, phosphoribosylglycinamide formyltransferase activity, ATP binding, purine ribonucleotide biosynthetic process.
