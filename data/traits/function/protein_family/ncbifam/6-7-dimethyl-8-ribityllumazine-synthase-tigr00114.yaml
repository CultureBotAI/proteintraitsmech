identifier: NCBIfam:TIGR00114
label: "6,7-dimethyl-8-ribityllumazine synthase"
definition: >-
  6,7-dimethyl-8-ribityllumazine synthase (ribH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00114 (equivalog); catalyses 6,7-dimethyl-8-ribityllumazine synthase; associated with 6,7-dimethyl-8-ribityllumazine synthase activity, riboflavin biosynthetic process, riboflavin synthase complex.
