  thiamine diphosphokinase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01378 (equivalog); catalyses thiamine diphosphokinase; associated with thiamine diphosphokinase activity, thiamine metabolic process.
