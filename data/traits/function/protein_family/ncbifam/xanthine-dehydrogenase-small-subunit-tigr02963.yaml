  xanthine dehydrogenase small subunit (xdhA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02963 (equivalog); catalyses xanthine dehydrogenase; associated with xanthine dehydrogenase activity, xanthine catabolic process, flavin adenine dinucleotide binding.
