identifier: NCBIfam:NF000801
label: "ribonuclease Z"
definition: >-
  ribonuclease Z — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF000801 (equivalog); catalyses ribonuclease Z; associated with RNA endonuclease activity producing 5'-phosphomonoesters, hydrolytic mechanism, tRNA 3'-end processing.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
xrefs:
  - EC:3.1.26.11
  - GO:0016891
  - GO:0042780
synonyms:
  - synonym_text: PRK00055.1-3
    synonym_type: EXACT_SYNONYM
    source: NCBIfam
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: Endonucleolytic cleavage of RNA, removing extra 3' nucleotides from tRNA precursor, generating 3' termini of tRNAs. A 3'-hydroxy group is left at the tRNA terminus and a 5'-phosphoryl group is left at the trailer molecule
    source: "mapped enzyme EC:3.1.26.11"
    method: SOURCED
