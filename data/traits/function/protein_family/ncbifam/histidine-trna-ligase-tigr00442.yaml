  histidine--tRNA ligase (hisS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00442 (equivalog); catalyses histidine--tRNA ligase; associated with histidine-tRNA ligase activity, ATP binding, cytoplasm, histidyl-tRNA aminoacylation.
