  flagella biosynthesis regulatory protein FliT — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007836 (equivalog); associated with protein targeting, bacterial-type flagellum assembly, negative regulation of bacterial-type flagellum assembly. Members occur in Enterobacterales.
