  DNA-directed RNA polymerase subunit omega (rpoZ) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00690 (equivalog); catalyses DNA-directed RNA polymerase; associated with DNA-directed RNA polymerase activity, DNA-templated transcription.
