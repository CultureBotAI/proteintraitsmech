  glucose-6-phosphate isomerase (pgi) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF040629 (equivalog); catalyses glucose-6-phosphate isomerase; associated with glucose-6-phosphate isomerase activity, gluconeogenesis. Members occur in Methanococcales.
