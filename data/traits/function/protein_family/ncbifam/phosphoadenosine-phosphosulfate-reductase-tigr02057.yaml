identifier: NCBIfam:TIGR02057
label: "phosphoadenosine phosphosulfate reductase"
definition: >-
  phosphoadenosine phosphosulfate reductase (cysH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02057 (equivalog); catalyses phosphoadenylyl-sulfate reductase (thioredoxin); associated with sulfate assimilation, phosphoadenylyl-sulfate reductase (thioredoxin) activity.
