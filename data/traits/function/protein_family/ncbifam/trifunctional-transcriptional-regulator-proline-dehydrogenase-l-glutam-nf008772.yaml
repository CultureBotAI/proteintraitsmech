identifier: NCBIfam:NF008772
label: "trifunctional transcriptional regulator/proline dehydrogenase/L-glutamate gamma-semialdehyde dehydrogenase"
definition: >-
  trifunctional transcriptional regulator/proline dehydrogenase/L-glutamate gamma-semialdehyde dehydrogenase (putA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008772 (equivalog); associated with DNA-binding transcription factor activity, L-glutamate gamma-semialdehyde dehydrogenase activity, proline dehydrogenase activity, regulation of DNA-templated transcription. Members occur in Pseudomonadota.
