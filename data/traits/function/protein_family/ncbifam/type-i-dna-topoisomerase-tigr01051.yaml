  type I DNA topoisomerase (topA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01051 (equivalog); catalyses DNA topoisomerase; associated with DNA binding, DNA topoisomerase type I (single strand cut, ATP-independent) activity, cytoplasm, DNA replication.
