identifier: NCBIfam:TIGR03026
label: "nucleotide sugar dehydrogenase"
definition: >-
  nucleotide sugar dehydrogenase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03026 (subfamily); associated with polysaccharide biosynthetic process, oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor, NAD binding.
