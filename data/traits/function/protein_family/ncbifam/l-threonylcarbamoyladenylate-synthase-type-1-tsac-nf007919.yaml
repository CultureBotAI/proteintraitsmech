identifier: NCBIfam:NF007919
label: "L-threonylcarbamoyladenylate synthase type 1 TsaC"
definition: >-
  L-threonylcarbamoyladenylate synthase type 1 TsaC — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007919 (equivalog); catalyses L-threonylcarbamoyladenylate synthase; associated with tRNA threonylcarbamoyladenosine modification, double-stranded RNA binding, ATP binding. Members occur in Pseudomonadota.
