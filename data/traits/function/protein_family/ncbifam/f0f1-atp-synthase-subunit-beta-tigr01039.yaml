identifier: NCBIfam:TIGR01039
label: "F0F1 ATP synthase subunit beta"
definition: >-
  F0F1 ATP synthase subunit beta (atpD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01039 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex, proton-transporting ATP synthase activity, rotational mechanism.
