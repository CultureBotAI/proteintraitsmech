label: "lysine/arginine/ornithine ABC transporter substrate-binding protein"
definition: >-
  lysine/arginine/ornithine ABC transporter substrate-binding protein — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01096 (subfamily); associated with outer membrane-bounded periplasmic space, nitrogen compound transport, ABC-type transporter activity. Members occur in Pseudomonadota.
