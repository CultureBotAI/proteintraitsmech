identifier: NCBIfam:NF010713
label: "2,3-diphosphoglycerate-dependent phosphoglycerate mutase"
definition: >-
  2,3-diphosphoglycerate-dependent phosphoglycerate mutase (gpmA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF010713 (equivalog); catalyses phosphoglycerate mutase (2,3-diphosphoglycerate-dependent); associated with phosphoglycerate mutase activity, glycolytic process.
