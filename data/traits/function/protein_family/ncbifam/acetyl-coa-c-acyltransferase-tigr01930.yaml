  acetyl-CoA C-acyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01930 (subfamily); catalyses acetyl-CoA C-acyltransferase; associated with acetyl-CoA C-acetyltransferase activity, fatty acid metabolic process.
