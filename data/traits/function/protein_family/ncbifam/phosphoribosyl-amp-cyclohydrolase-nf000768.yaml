identifier: NCBIfam:NF000768
label: "phosphoribosyl-AMP cyclohydrolase"
definition: >-
  phosphoribosyl-AMP cyclohydrolase (hisI) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF000768 (equivalog); catalyses phosphoribosyl-AMP cyclohydrolase; associated with L-histidine biosynthetic process, phosphoribosyl-AMP cyclohydrolase activity.
