identifier: NCBIfam:TIGR00566
label: "glutamine amidotransferase of anthranilate synthase or aminodeoxychorismate synthase"
definition: >-
  glutamine amidotransferase of anthranilate synthase or aminodeoxychorismate synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00566 (subfamily); associated with carbon-nitrogen ligase activity, with glutamine as amido-N-donor.
