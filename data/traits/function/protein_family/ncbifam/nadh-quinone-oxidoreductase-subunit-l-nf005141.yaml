identifier: NCBIfam:NF005141
label: "NADH-quinone oxidoreductase subunit L"
definition: >-
  NADH-quinone oxidoreductase subunit L (nuoL) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF005141 (equivalog); catalyses NADH:ubiquinone reductase (H(+)-translocating); associated with NADH dehydrogenase (ubiquinone) activity, ATP synthesis coupled electron transport.
