  pyridoxal kinase (pdxY) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00687 (equivalog); catalyses pyridoxal kinase; associated with pyridoxal kinase activity, pyridoxal 5'-phosphate salvage.
