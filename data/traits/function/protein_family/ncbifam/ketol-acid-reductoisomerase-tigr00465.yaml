identifier: NCBIfam:TIGR00465
label: "ketol-acid reductoisomerase"
definition: >-
  ketol-acid reductoisomerase (ilvC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00465 (equivalog); catalyses ketol-acid reductoisomerase (NADP(+)); associated with ketol-acid reductoisomerase activity, branched-chain amino acid biosynthetic process, oxidoreductase activity.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
