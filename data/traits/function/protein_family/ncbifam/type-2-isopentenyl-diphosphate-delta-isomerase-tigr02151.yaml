  type 2 isopentenyl-diphosphate Delta-isomerase (fni) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02151 (equivalog); catalyses isopentenyl-diphosphate Delta-isomerase; associated with isopentenyl-diphosphate delta-isomerase activity, isoprenoid biosynthetic process, FMN binding.
