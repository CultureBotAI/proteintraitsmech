  HTH-type transcriptional regulator Cbl — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF009324 (equivalog); associated with DNA-binding transcription factor activity, regulation of DNA-templated transcription. Members occur in Gammaproteobacteria.
