identifier: NCBIfam:NF008759
label: "phosphoglycerate dehydrogenase"
definition: >-
  phosphoglycerate dehydrogenase (serA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008759 (equivalog); catalyses phosphoglycerate dehydrogenase; associated with oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor, NAD binding.
