  16S rRNA (cytosine(1402)-N(4))-methyltransferase RsmH — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00006 (equivalog); catalyses 16S rRNA (cytosine(1402)-N(4))-methyltransferase; associated with rRNA modification, rRNA (cytosine) methyltransferase activity.
