  nitrate/nitrite two-component system sensor histidine kinase NarQ — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008184 (equivalog); catalyses histidine kinase; associated with phosphorelay sensor kinase activity, phosphorelay signal transduction system, membrane, protein dimerization activity. Members occur in Gammaproteobacteria.
