identifier: NCBIfam:TIGR01546
label: "phosphorylating glyceraldehyde-3-phosphate dehydrogenase"
definition: >-
  phosphorylating glyceraldehyde-3-phosphate dehydrogenase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01546 (equivalog); catalyses glyceraldehyde-3-phosphate dehydrogenase (NAD(P)(+)) (phosphorylating); associated with cytoplasm, glycolytic process, oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor, NADP binding.
