label: "NAD-dependent dihydropyrimidine dehydrogenase subunit PreA"
definition: >-
  NAD-dependent dihydropyrimidine dehydrogenase subunit PreA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006183 (equivalog); catalyses dihydrouracil dehydrogenase (NAD(+)); associated with thymine catabolic process, uracil catabolic process, dihydropyrimidine dehydrogenase (NADP+) activity.
