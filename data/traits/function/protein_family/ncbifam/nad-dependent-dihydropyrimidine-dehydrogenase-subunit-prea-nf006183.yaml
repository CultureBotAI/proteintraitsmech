definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 5,6-dihydrouracil + NAD(+) = uracil + NADH + H(+). (2) 5,6-dihydrothymine + NAD(+) = thymine + NADH + H(+)
    source: "mapped enzyme EC:1.3.1.1"
