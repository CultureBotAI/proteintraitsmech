label: sortase
definition: >-
  sortase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01076 (subfamily); catalyses sortase A; associated with cysteine-type endopeptidase activity, protein processing, establishment of protein localization.
