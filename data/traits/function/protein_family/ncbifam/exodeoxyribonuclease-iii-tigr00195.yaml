identifier: NCBIfam:TIGR00195
label: "exodeoxyribonuclease III"
definition: >-
  exodeoxyribonuclease III (xth) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00195 (equivalog); catalyses exodeoxyribonuclease III; associated with DNA repair, double-stranded DNA 3'-5' DNA exonuclease activity.
