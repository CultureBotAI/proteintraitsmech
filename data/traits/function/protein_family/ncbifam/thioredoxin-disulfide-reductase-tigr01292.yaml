identifier: NCBIfam:TIGR01292
label: "thioredoxin-disulfide reductase"
definition: >-
  thioredoxin-disulfide reductase (trxB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01292 (equivalog); catalyses thioredoxin-disulfide reductase (NADPH); associated with thioredoxin-disulfide reductase (NADPH) activity, cytoplasm, removal of superoxide radicals, FAD binding.
