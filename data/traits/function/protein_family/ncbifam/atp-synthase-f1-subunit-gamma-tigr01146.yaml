identifier: NCBIfam:TIGR01146
label: "ATP synthase F1 subunit gamma"
definition: >-
  ATP synthase F1 subunit gamma (atpG) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01146 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton motive force-driven ATP synthesis, proton-transporting ATP synthase complex, proton-transporting ATP synthase activity, rotational mechanism.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
