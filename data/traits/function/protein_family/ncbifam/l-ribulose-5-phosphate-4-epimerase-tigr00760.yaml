identifier: NCBIfam:TIGR00760
label: "L-ribulose-5-phosphate 4-epimerase"
definition: >-
  L-ribulose-5-phosphate 4-epimerase (araD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00760 (equivalog); catalyses L-ribulose-5-phosphate 4-epimerase; associated with zinc ion binding, L-ribulose-phosphate 4-epimerase activity, arabinose catabolic process.
