identifier: NCBIfam:TIGR00348
label: "HsdR family type I site-specific deoxyribonuclease"
definition: >-
  HsdR family type I site-specific deoxyribonuclease — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00348 (subfamily); catalyses type I site-specific deoxyribonuclease; associated with DNA binding, ATP binding, type I site-specific deoxyribonuclease activity, DNA restriction-modification system.
