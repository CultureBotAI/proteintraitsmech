identifier: NCBIfam:NF042946
label: "3-phenylpropionate/cinnamic acid dioxygenase subunit alpha"
definition: >-
  3-phenylpropionate/cinnamic acid dioxygenase subunit alpha (hcaE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF042946 (equivalog); catalyses 3-phenylpropanoate dioxygenase; associated with 3-phenylpropionate dioxygenase activity, 3-phenylpropionate catabolic process. Members occur in Gammaproteobacteria.
