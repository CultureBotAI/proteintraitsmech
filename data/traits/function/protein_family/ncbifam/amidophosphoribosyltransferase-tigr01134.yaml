  amidophosphoribosyltransferase (purF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01134 (equivalog); catalyses amidophosphoribosyltransferase; associated with amidophosphoribosyltransferase activity, purine nucleobase biosynthetic process.
