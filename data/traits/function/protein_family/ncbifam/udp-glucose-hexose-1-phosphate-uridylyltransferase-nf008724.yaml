identifier: NCBIfam:NF008724
label: "UDP-glucose--hexose-1-phosphate uridylyltransferase"
definition: >-
  UDP-glucose--hexose-1-phosphate uridylyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008724 (equivalog); catalyses UDP-glucose--hexose-1-phosphate uridylyltransferase; associated with galactose metabolic process, UDP-glucose:hexose-1-phosphate uridylyltransferase activity.
