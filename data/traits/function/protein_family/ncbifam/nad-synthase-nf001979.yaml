  NAD(+) synthase (nadE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001979 (equivalog); catalyses NAD(+) synthase; associated with NAD+ synthase (glutamine-hydrolyzing) activity, glutaminase activity, NAD+ synthase activity, NAD+ biosynthetic process.
