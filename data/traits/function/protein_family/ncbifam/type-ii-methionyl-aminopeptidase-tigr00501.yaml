  type II methionyl aminopeptidase (map) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00501 (equivalog); catalyses methionyl aminopeptidase; associated with proteolysis, metalloaminopeptidase activity.
