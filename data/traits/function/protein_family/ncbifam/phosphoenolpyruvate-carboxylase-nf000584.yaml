identifier: NCBIfam:NF000584
label: "phosphoenolpyruvate carboxylase"
definition: >-
  phosphoenolpyruvate carboxylase (ppc) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF000584 (equivalog); catalyses phosphoenolpyruvate carboxylase; associated with tricarboxylic acid cycle, phosphoenolpyruvate carboxylase activity, carbon fixation.
