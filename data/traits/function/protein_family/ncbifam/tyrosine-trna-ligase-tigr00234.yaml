identifier: NCBIfam:TIGR00234
label: "tyrosine--tRNA ligase"
definition: >-
  tyrosine--tRNA ligase (tyrS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00234 (equivalog); catalyses tyrosine--tRNA ligase; associated with nucleotide binding, tyrosine-tRNA ligase activity, ATP binding, tyrosyl-tRNA aminoacylation.
