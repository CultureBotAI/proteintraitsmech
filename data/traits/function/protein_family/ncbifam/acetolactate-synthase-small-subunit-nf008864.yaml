identifier: NCBIfam:NF008864
label: "acetolactate synthase small subunit"
definition: >-
  acetolactate synthase small subunit (ilvN) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008864 (equivalog); catalyses acetolactate synthase; associated with branched-chain amino acid biosynthetic process, acetolactate synthase regulator activity.
