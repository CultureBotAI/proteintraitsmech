label: "type I glyceraldehyde-3-phosphate dehydrogenase"
definition: >-
  type I glyceraldehyde-3-phosphate dehydrogenase (gap) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01534 (equivalog); associated with glucose metabolic process, oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor, NADP binding, NAD binding.
