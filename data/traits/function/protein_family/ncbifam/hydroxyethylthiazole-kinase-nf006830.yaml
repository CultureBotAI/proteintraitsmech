  hydroxyethylthiazole kinase (thiM) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006830 (equivalog); catalyses hydroxyethylthiazole kinase; associated with hydroxyethylthiazole kinase activity, thiamine biosynthetic process.
