identifier: NCBIfam:TIGR01040
label: "V-type ATPase subunit B"
definition: >-
  V-type ATPase subunit B — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01040 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with P-type proton-exporting transporter activity, vacuolar proton-transporting V-type ATPase complex, proton transmembrane transport.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
