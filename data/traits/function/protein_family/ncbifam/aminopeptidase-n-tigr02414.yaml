  aminopeptidase N (pepN) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02414 (equivalog); catalyses membrane alanyl aminopeptidase; associated with aminopeptidase activity, proteolysis, metallopeptidase activity, zinc ion binding.
