identifier: NCBIfam:TIGR02506
label: "ribonucleoside-diphosphate reductase subunit alpha"
definition: >-
  ribonucleoside-diphosphate reductase subunit alpha — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02506 (equivalog); catalyses ribonucleoside-diphosphate reductase; associated with ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor, ribonucleoside-diphosphate reductase complex, 2'-deoxyribonucleotide biosynthetic process.
