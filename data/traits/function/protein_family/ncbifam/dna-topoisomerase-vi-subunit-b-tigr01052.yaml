  DNA topoisomerase VI subunit B (top6B) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01052 (equivalog); catalyses DNA topoisomerase (ATP-hydrolyzing); associated with DNA binding, DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity, ATP binding, DNA topological change.
