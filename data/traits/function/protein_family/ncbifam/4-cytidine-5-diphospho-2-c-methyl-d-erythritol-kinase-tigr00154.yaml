label: "4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase"
definition: >-
  4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase (ispE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00154 (equivalog); catalyses 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase; associated with terpenoid biosynthetic process, 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity.
