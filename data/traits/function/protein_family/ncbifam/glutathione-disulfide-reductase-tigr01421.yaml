identifier: NCBIfam:TIGR01421
label: "glutathione-disulfide reductase"
definition: >-
  glutathione-disulfide reductase (gor) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01421 (equivalog); catalyses glutathione-disulfide reductase; associated with glutathione-disulfide reductase (NADPH) activity, glutathione metabolic process, cell redox homeostasis, flavin adenine dinucleotide binding.
