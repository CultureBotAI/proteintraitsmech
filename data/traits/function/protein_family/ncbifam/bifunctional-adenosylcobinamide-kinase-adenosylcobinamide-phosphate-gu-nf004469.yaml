label: "bifunctional adenosylcobinamide kinase/adenosylcobinamide-phosphate guanylyltransferase"
definition: >-
  bifunctional adenosylcobinamide kinase/adenosylcobinamide-phosphate guanylyltransferase (cobU) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004469 (equivalog); catalyses adenosylcobinamide kinase, adenosylcobinamide-phosphate guanylyltransferase; associated with nucleotide binding, cobalamin biosynthetic process, adenosylcobinamide kinase activity.
