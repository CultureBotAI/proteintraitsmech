identifier: NCBIfam:TIGR03399
label: "RNA 3'-terminal phosphate cyclase"
definition: >-
  RNA 3'-terminal phosphate cyclase (rtcA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03399 (equivalog); catalyses RNA 3'-terminal-phosphate cyclase (ATP); associated with RNA-3'-phosphate cyclase activity, RNA processing.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
