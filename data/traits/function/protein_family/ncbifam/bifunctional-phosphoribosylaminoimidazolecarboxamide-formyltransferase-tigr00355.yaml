identifier: NCBIfam:TIGR00355
label: "bifunctional phosphoribosylaminoimidazolecarboxamide formyltransferase/IMP cyclohydrolase"
definition: >-
  bifunctional phosphoribosylaminoimidazolecarboxamide formyltransferase/IMP cyclohydrolase (purH) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00355 (equivalog); catalyses phosphoribosylaminoimidazolecarboxamide formyltransferase, IMP cyclohydrolase; associated with IMP cyclohydrolase activity, phosphoribosylaminoimidazolecarboxamide formyltransferase activity, purine ribonucleotide biosynthetic process.
