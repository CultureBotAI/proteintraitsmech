identifier: NCBIfam:TIGR00140
label: "HyaD/HybD family hydrogenase maturation endopeptidase"
definition: >-
  HyaD/HybD family hydrogenase maturation endopeptidase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00140 (subfamily); associated with aspartic-type endopeptidase activity, ferredoxin hydrogenase complex, metal ion binding, protein maturation. Members occur in Pseudomonadati.
