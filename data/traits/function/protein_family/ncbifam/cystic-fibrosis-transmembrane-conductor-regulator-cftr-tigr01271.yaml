identifier: NCBIfam:TIGR01271
label: "cystic fibrosis transmembrane conductor regulator (CFTR)"
definition: >-
  cystic fibrosis transmembrane conductor regulator (CFTR) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01271 (equivalog); catalyses channel-conductance-controlling ATPase; associated with intracellularly ATP-gated chloride channel activity, transepithelial chloride transport.
