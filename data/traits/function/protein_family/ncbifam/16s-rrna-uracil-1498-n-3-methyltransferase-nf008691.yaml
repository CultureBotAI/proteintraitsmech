label: "16S rRNA (uracil(1498)-N(3))-methyltransferase"
definition: >-
  16S rRNA (uracil(1498)-N(3))-methyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008691 (equivalog); catalyses 16S rRNA (uracil(1498)-N(3))-methyltransferase; associated with rRNA processing, methyltransferase activity. Members occur in Bacillota.
