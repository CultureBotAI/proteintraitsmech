identifier: NCBIfam:TIGR00420
label: "tRNA 2-thiouridine(34) synthase MnmA"
definition: >-
  tRNA 2-thiouridine(34) synthase MnmA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00420 (equivalog); catalyses tRNA-uridine 2-sulfurtransferase; associated with tRNA wobble position uridine thiolation, tRNA (5-methylaminomethyl-2-thiouridylate)(34)-methyltransferase activity, cytoplasm, RNA processing.
