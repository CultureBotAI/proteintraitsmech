label: "dihydroneopterin aldolase"
definition: >-
  dihydroneopterin aldolase (folB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00525 (equivalog); catalyses dihydroneopterin aldolase; associated with dihydroneopterin aldolase activity, folic acid-containing compound metabolic process.
