label: "phosphatidate cytidylyltransferase"
definition: >-
  phosphatidate cytidylyltransferase (cdsA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008635 (equivalog); catalyses phosphatidate cytidylyltransferase; associated with transferase activity, transferring phosphorus-containing groups. Members occur in Enterobacterales.
