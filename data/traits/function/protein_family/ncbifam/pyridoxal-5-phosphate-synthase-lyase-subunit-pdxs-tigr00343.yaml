identifier: NCBIfam:TIGR00343
label: "pyridoxal 5'-phosphate synthase lyase subunit PdxS"
definition: >-
  pyridoxal 5'-phosphate synthase lyase subunit PdxS — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00343 (equivalog); catalyses pyridoxal 5'-phosphate synthase (glutamine hydrolyzing); associated with vitamin B6 biosynthetic process, pyridoxal 5'-phosphate biosynthetic process.
