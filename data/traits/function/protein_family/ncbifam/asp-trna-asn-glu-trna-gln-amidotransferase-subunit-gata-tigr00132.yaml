identifier: NCBIfam:TIGR00132
label: "Asp-tRNA(Asn)/Glu-tRNA(Gln) amidotransferase subunit GatA"
definition: >-
  Asp-tRNA(Asn)/Glu-tRNA(Gln) amidotransferase subunit GatA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00132 (equivalog); associated with translation, glutamyl-tRNA aminoacylation, glutamyl-tRNA(Gln) amidotransferase complex, glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity.
