  ureidoglycolate dehydrogenase (allD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF011599 (equivalog); catalyses ureidoglycolate dehydrogenase [NAD(P)(+)]; associated with oxidoreductase activity.
