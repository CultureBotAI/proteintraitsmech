identifier: NCBIfam:NF042947
label: "3-phenylpropionate/cinnamic acid dioxygenase subunit beta"
definition: >-
  3-phenylpropionate/cinnamic acid dioxygenase subunit beta (hcaF) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF042947 (equivalog); catalyses 3-phenylpropanoate dioxygenase; associated with 3-phenylpropionate dioxygenase activity, 3-phenylpropionate catabolic process. Members occur in Gammaproteobacteria.
