  pyruvate kinase (pyk) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01064 (equivalog); catalyses pyruvate kinase; associated with magnesium ion binding, pyruvate kinase activity, glycolytic process, potassium ion binding.
