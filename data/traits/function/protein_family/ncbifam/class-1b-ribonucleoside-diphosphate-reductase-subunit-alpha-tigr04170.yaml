  class 1b ribonucleoside-diphosphate reductase subunit alpha (nrdE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR04170 (exception); catalyses ribonucleoside-diphosphate reductase; associated with ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor, ATP binding, DNA replication.
