label: "DNA topoisomerase IV subunit B"
definition: >-
  DNA topoisomerase IV subunit B (parE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01058 (equivalog); catalyses DNA topoisomerase (ATP-hydrolyzing); associated with DNA binding, DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity, ATP binding, chromosome. Members occur in Bacillati.
