identifier: NCBIfam:TIGR00235
label: "uridine kinase"
definition: >-
  uridine kinase (udk) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00235 (equivalog); catalyses uridine/cytidine kinase; associated with uridine kinase activity, cytoplasm, uridine metabolic process.
