  bifunctional tetrahydrofolate synthase/dihydrofolate synthase (folC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008101 (equivalog); catalyses dihydrofolate synthase, tetrahydrofolate synthase; associated with tetrahydrofolylpolyglutamate synthase activity, ATP binding, folic acid-containing compound biosynthetic process, ligase activity.
