identifier: NCBIfam:TIGR00068
label: "lactoylglutathione lyase"
definition: >-
  lactoylglutathione lyase (gloA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00068 (equivalog); catalyses lactoylglutathione lyase; associated with lactoylglutathione lyase activity, metal ion binding, methylglyoxal catabolic process.
