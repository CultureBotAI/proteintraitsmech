identifier: NCBIfam:TIGR00330
label: "class II fructose-bisphosphatase"
definition: >-
  class II fructose-bisphosphatase (glpX) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00330 (equivalog); catalyses fructose-bisphosphatase; associated with glycerol metabolic process, gluconeogenesis, fructose 1,6-bisphosphate 1-phosphatase activity.
