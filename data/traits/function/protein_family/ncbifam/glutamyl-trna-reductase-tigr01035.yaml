identifier: NCBIfam:TIGR01035
label: "glutamyl-tRNA reductase"
definition: >-
  glutamyl-tRNA reductase (hemA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01035 (equivalog); catalyses glutamyl-tRNA reductase; associated with glutamyl-tRNA reductase activity, NADP binding.
