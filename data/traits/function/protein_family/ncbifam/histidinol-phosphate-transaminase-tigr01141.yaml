identifier: NCBIfam:TIGR01141
label: "histidinol-phosphate transaminase"
definition: >-
  histidinol-phosphate transaminase (hisC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01141 (equivalog); catalyses histidinol-phosphate transaminase; associated with L-histidine biosynthetic process, L-histidinol-phosphate:2-oxoglutarate transaminase activity.
