  TRC40/GET3/ArsA family transport-energizing ATPase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00345 (subfamily); associated with ATP binding, ATPase-coupled arsenite transmembrane transporter activity, ATP hydrolysis activity.
