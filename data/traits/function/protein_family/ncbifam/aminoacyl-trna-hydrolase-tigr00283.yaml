identifier: NCBIfam:TIGR00283
label: "aminoacyl-tRNA hydrolase"
definition: >-
  aminoacyl-tRNA hydrolase (pth2) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00283 (equivalog); catalyses peptidyl-tRNA hydrolase; associated with peptidyl-tRNA hydrolase activity, translation.
