identifier: NCBIfam:NF045485
label: "farnesyl diphosphate synthase"
definition: >-
  farnesyl diphosphate synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF045485 (subfamily); catalyses (2E,6E)-farnesyl diphosphate synthase; associated with (2E,6E)-farnesyl diphosphate synthase activity, isoprenoid biosynthetic process.
