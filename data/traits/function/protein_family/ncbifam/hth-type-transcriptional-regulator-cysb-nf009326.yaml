  HTH-type transcriptional regulator CysB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF009326 (equivalog); associated with DNA-binding transcription factor activity, regulation of DNA-templated transcription. Members occur in Pseudomonadota.
