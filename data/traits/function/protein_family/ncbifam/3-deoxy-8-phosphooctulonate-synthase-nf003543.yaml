  3-deoxy-8-phosphooctulonate synthase (kdsA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003543 (equivalog); catalyses 3-deoxy-8-phosphooctulonate synthase; associated with 3-deoxy-8-phosphooctulonate synthase activity, biosynthetic process.
