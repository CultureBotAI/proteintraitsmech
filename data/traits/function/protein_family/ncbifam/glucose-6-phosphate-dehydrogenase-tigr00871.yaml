identifier: NCBIfam:TIGR00871
label: "glucose-6-phosphate dehydrogenase"
definition: >-
  glucose-6-phosphate dehydrogenase (zwf) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00871 (equivalog); catalyses glucose-6-phosphate dehydrogenase (NADP(+)); associated with glucose-6-phosphate dehydrogenase activity, glucose metabolic process, pentose-phosphate shunt, oxidoreductase activity, acting on CH-OH group of donors.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
