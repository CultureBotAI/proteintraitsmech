identifier: NCBIfam:NF002497
label: "thymidylate synthase"
definition: >-
  thymidylate synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002497 (equivalog); catalyses thymidylate synthase; associated with thymidylate synthase activity, dTMP biosynthetic process.
