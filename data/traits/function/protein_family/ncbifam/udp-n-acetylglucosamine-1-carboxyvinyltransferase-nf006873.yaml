  UDP-N-acetylglucosamine 1-carboxyvinyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006873 (subfamily); catalyses UDP-N-acetylglucosamine 1-carboxyvinyltransferase; associated with transferase activity, transferring alkyl or aryl (other than methyl) groups.
