  2-dehydro-3-deoxygluconokinase (kdgK) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF052444 (equivalog); catalyses 2-dehydro-3-deoxygluconokinase; associated with nucleotide binding, ATP binding, 2-dehydro-3-deoxygluconokinase activity. Members occur in Gammaproteobacteria.
