identifier: NCBIfam:NF004011
label: "Asp-tRNA(Asn)/Glu-tRNA(Gln) amidotransferase subunit GatB"
definition: >-
  Asp-tRNA(Asn)/Glu-tRNA(Gln) amidotransferase subunit GatB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004011 (equivalog); associated with ATP binding, translation, asparaginyl-tRNA synthase (glutamine-hydrolyzing) activity, glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity. Members occur in Bacillota.
