  V-type ATPase subunit A — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01042 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with P-type proton-exporting transporter activity, vacuolar proton-transporting V-type ATPase complex, proton transmembrane transport. Members occur in Methanopyrus.
