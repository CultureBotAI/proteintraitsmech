identifier: NCBIfam:TIGR01833
label: "hydroxymethylglutaryl-CoA synthase"
definition: >-
  hydroxymethylglutaryl-CoA synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01833 (equivalog); catalyses hydroxymethylglutaryl-CoA synthase. Members occur in Gammaproteobacteria.
