label: "NADH-quinone oxidoreductase subunit NuoK"
definition: >-
  NADH-quinone oxidoreductase subunit NuoK — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004319 (equivalog); catalyses NADH:ubiquinone reductase (non-electrogenic); associated with oxidoreductase activity, acting on NAD(P)H, ATP synthesis coupled electron transport. Members occur in Gammaproteobacteria.
