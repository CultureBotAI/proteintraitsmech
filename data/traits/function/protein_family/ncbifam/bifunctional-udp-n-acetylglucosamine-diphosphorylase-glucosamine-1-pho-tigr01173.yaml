  bifunctional UDP-N-acetylglucosamine diphosphorylase/glucosamine-1-phosphate N-acetyltransferase GlmU — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01173 (equivalog); catalyses glucosamine-1-phosphate N-acetyltransferase, UDP-N-acetylglucosamine diphosphorylase; associated with magnesium ion binding, cell morphogenesis, UDP-N-acetylglucosamine diphosphorylase activity, cytoplasm.
