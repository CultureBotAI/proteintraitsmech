definition: >-
  sepiapterin reductase (L-erythro-7,8-dihydrobiopterin forming) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01500 (equivalog); catalyses sepiapterin reductase (L-erythro-7,8-dihydrobiopterin forming); associated with sepiapterin reductase (NADP+) activity, tetrahydrobiopterin biosynthetic process.
