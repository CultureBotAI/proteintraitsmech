identifier: NCBIfam:TIGR00461
label: "aminomethyl-transferring glycine dehydrogenase"
definition: >-
  aminomethyl-transferring glycine dehydrogenase (gcvP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00461 (equivalog); catalyses glycine dehydrogenase (aminomethyl-transferring); associated with glycine dehydrogenase (decarboxylating) activity, glycine decarboxylation via glycine cleavage system.
