  two-component system sensor histidine kinase CreC — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008312 (equivalog); catalyses histidine kinase; associated with phosphorelay sensor kinase activity, signal transduction, membrane, phosphorylation. Members occur in Pseudomonadati.
