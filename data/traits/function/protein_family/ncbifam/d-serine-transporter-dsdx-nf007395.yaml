  D-serine transporter DsdX — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007395 (equivalog); associated with gluconate transmembrane transporter activity, membrane, gluconate transmembrane transport. Members occur in Gammaproteobacteria.
