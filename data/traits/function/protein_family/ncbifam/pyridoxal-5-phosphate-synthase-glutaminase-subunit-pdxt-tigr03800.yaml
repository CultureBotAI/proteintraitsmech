identifier: NCBIfam:TIGR03800
label: "pyridoxal 5'-phosphate synthase glutaminase subunit PdxT"
definition: >-
  pyridoxal 5'-phosphate synthase glutaminase subunit PdxT — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03800 (equivalog); catalyses glutaminase, pyridoxal 5'-phosphate synthase (glutamine hydrolyzing); associated with glutaminase activity, pyridoxal 5'-phosphate synthase (glutamine hydrolysing) activity, pyridoxal 5'-phosphate biosynthetic process.
