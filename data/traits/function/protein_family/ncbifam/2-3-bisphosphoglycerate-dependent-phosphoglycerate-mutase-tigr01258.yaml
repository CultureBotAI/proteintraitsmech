identifier: NCBIfam:TIGR01258
label: "2,3-bisphosphoglycerate-dependent phosphoglycerate mutase"
definition: >-
  2,3-bisphosphoglycerate-dependent phosphoglycerate mutase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01258 (subfamily); catalyses phosphoglycerate mutase (2,3-diphosphoglycerate-dependent); associated with phosphoglycerate mutase activity, glycolytic process, intramolecular phosphotransferase activity.
