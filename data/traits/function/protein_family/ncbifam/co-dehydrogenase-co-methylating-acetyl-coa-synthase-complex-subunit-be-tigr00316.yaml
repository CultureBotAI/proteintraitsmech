identifier: NCBIfam:TIGR00316
label: "CO dehydrogenase/CO-methylating acetyl-CoA synthase complex subunit beta"
definition: >-
  CO dehydrogenase/CO-methylating acetyl-CoA synthase complex subunit beta (cdhC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00316 (equivalog); catalyses CO-methylating acetyl-CoA synthase; associated with acetyl-CoA metabolic process, CO-methylating acetyl-CoA synthase activity, anaerobic carbon-monoxide dehydrogenase activity.
