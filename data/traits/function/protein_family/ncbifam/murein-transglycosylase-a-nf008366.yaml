  murein transglycosylase A (mltA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008366 (equivalog); associated with hydrolase activity, hydrolyzing O-glycosyl compounds, peptidoglycan turnover, outer membrane. Members occur in Gammaproteobacteria.
