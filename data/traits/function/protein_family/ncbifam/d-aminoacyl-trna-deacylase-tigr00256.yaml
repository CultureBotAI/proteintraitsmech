  notes: PMID:11568181 (ncbifam citation)
- reference: DOI:10.3389/fcell.2016.00032
  notes: PMID:27200345 (ncbifam citation)
definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a D-aminoacyl-tRNA + H2O = a tRNA + a D-alpha-amino acid + H(+). (2) glycyl-tRNA(Ala) + H2O = tRNA(Ala) + glycine + H(+)
    source: "mapped enzyme EC:3.1.1.96"
    method: SOURCED
