identifier: NCBIfam:TIGR00094
label: "tRNA pseudouridine(13) synthase TruD"
definition: >-
  tRNA pseudouridine(13) synthase TruD — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00094 (equivalog); catalyses tRNA pseudouridine(13) synthase; associated with pseudouridine synthesis, RNA binding, RNA modification, pseudouridine synthase activity.
