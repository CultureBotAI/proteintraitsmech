  cytochrome c nitrite reductase pentaheme subunit (nrfB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008659 (equivalog); catalyses nitrite reductase (cytochrome; ammonia-forming); associated with metabolic process, periplasmic space. Members occur in Gammaproteobacteria.
