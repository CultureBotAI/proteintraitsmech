identifier: NCBIfam:NF001299
label: "NAD(+) diphosphatase"
definition: >-
  NAD(+) diphosphatase (nudC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001299 (equivalog); catalyses NAD(+) diphosphatase; associated with NAD+ diphosphatase activity, hydrolase activity.
