  fatty acid oxidation complex subunit alpha FadB — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008727 (equivalog); associated with fatty acid metabolic process, oxidoreductase activity, NAD+ binding. Members occur in Pseudomonadota.
