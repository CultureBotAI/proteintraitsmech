identifier: NCBIfam:NF003483
label: "aspartate--tRNA(Asn) ligase"
definition: >-
  aspartate--tRNA(Asn) ligase (aspS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003483 (equivalog); catalyses aspartate--tRNA(Asn) ligase; associated with nucleotide binding, nucleic acid binding, aspartate-tRNA ligase activity, ATP binding.
