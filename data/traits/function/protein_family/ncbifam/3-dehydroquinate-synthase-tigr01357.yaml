  3-dehydroquinate synthase (aroB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01357 (equivalog); catalyses 3-dehydroquinate synthase; associated with 3-dehydroquinate synthase activity, cytoplasm, aromatic amino acid biosynthetic process, chorismate biosynthetic process.
