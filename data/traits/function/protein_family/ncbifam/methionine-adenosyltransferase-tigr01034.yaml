definition: >-
  methionine adenosyltransferase (metK) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01034 (equivalog); catalyses methionine adenosyltransferase; associated with methionine adenosyltransferase activity, ATP binding, S-adenosylmethionine biosynthetic process.
