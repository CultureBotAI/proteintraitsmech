identifier: NCBIfam:TIGR00751
label: "1,4-dihydroxy-2-naphthoate octaprenyltransferase"
definition: >-
  1,4-dihydroxy-2-naphthoate octaprenyltransferase (menA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00751 (equivalog); catalyses 1,4-dihydroxy-2-naphthoate polyprenyltransferase; associated with menaquinone biosynthetic process, 1,4-dihydroxy-2-naphthoate polyprenyltransferase activity.
