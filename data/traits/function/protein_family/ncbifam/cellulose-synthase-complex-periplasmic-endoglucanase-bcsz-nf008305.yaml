identifier: NCBIfam:NF008305
label: "cellulose synthase complex periplasmic endoglucanase BcsZ"
definition: >-
  cellulose synthase complex periplasmic endoglucanase BcsZ — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008305 (equivalog); catalyses cellulase; associated with hydrolase activity, hydrolyzing O-glycosyl compounds, carbohydrate metabolic process. Members occur in Pseudomonadota.
