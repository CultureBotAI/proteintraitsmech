identifier: NCBIfam:NF002999
label: "NAD(P)H:quinone oxidoreductase"
definition: >-
  NAD(P)H:quinone oxidoreductase (wrbA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002999 (equivalog); catalyses NAD(P)H dehydrogenase (quinone); associated with NAD(P)H dehydrogenase (quinone) activity, FMN binding.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
