identifier: NCBIfam:TIGR01015
label: "homogentisate 1,2-dioxygenase"
definition: >-
  homogentisate 1,2-dioxygenase (hmgA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01015 (equivalog); catalyses homogentisate 1,2-dioxygenase; associated with homogentisate 1,2-dioxygenase activity, L-phenylalanine catabolic process, L-tyrosine catabolic process.
