identifier: NCBIfam:TIGR00396
label: "leucine--tRNA ligase"
definition: >-
  leucine--tRNA ligase (leuS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00396 (equivalog); catalyses leucine--tRNA ligase; associated with nucleotide binding, leucine-tRNA ligase activity, ATP binding, leucyl-tRNA aminoacylation.
