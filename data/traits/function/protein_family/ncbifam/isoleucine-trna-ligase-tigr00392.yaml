identifier: NCBIfam:TIGR00392
label: "isoleucine--tRNA ligase"
definition: >-
  isoleucine--tRNA ligase (ileS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00392 (equivalog); catalyses isoleucine--tRNA ligase; associated with nucleotide binding, isoleucine-tRNA ligase activity, ATP binding, isoleucyl-tRNA aminoacylation.
