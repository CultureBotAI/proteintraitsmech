identifier: NCBIfam:TIGR01253
label: "thiamine/thiamine pyrophosphate ABC transporter permease"
definition: >-
  thiamine/thiamine pyrophosphate ABC transporter permease (thiP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01253 (equivalog); associated with thiamine transport, membrane, thiamine pyrophosphate transmembrane transport, ABC-type thiamine transporter activity. Members occur in Pseudomonadota.
