  tRNA (adenosine(37)-N6)-threonylcarbamoyltransferase complex ATPase subunit type 1 TsaE — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF007931 (equivalog); catalyses N(6)-L-threonylcarbamoyladenine synthase; associated with tRNA threonylcarbamoyladenosine modification. Members occur in Enterobacterales.
