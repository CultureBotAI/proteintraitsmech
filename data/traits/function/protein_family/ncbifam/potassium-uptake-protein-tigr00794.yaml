  potassium uptake protein (kup) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00794 (equivalog); associated with potassium ion transport, potassium ion transmembrane transporter activity, membrane. Members occur in Gammaproteobacteria.
