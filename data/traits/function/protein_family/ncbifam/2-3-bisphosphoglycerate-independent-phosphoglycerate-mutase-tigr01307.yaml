identifier: NCBIfam:TIGR01307
label: "2,3-bisphosphoglycerate-independent phosphoglycerate mutase"
definition: >-
  2,3-bisphosphoglycerate-independent phosphoglycerate mutase (gpmI) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01307 (equivalog); catalyses phosphoglycerate mutase (2,3-diphosphoglycerate-independent); associated with phosphoglycerate mutase activity, glycolytic process.
