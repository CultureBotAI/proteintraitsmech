  DNA-directed RNA polymerase (rpoE) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00448 (equivalog); catalyses DNA-directed RNA polymerase; associated with DNA binding, DNA-directed RNA polymerase activity, DNA-templated transcription.
