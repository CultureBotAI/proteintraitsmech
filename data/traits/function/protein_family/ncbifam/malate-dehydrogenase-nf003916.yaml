  malate dehydrogenase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003916 (equivalog); catalyses (S)-malate dehydrogenase (NAD(+), oxaloacetate-forming); associated with malate metabolic process, malate dehydrogenase activity.
