identifier: NCBIfam:NF008854
label: "pyruvate dehydrogenase complex E1 component subunit beta"
definition: >-
  pyruvate dehydrogenase complex E1 component subunit beta — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008854 (equivalog); catalyses pyruvate dehydrogenase (acetyl-transferring); associated with pyruvate dehydrogenase (acetyl-transferring) activity, pyruvate decarboxylation to acetyl-CoA.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
