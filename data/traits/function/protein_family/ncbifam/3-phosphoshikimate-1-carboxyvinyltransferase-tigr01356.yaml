  3-phosphoshikimate 1-carboxyvinyltransferase (aroA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01356 (equivalog); catalyses 3-phosphoshikimate 1-carboxyvinyltransferase; associated with 3-phosphoshikimate 1-carboxyvinyltransferase activity, aromatic amino acid biosynthetic process.
