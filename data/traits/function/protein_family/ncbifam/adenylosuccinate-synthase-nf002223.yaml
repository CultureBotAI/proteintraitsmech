identifier: NCBIfam:NF002223
label: "adenylosuccinate synthase"
definition: >-
  adenylosuccinate synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002223 (equivalog); catalyses adenylosuccinate synthase; associated with adenylosuccinate synthase activity, GTP binding, purine nucleotide biosynthetic process.
