  2-hydroxy-3-oxopropionate reductase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01505 (equivalog); catalyses 2-hydroxy-3-oxopropionate reductase; associated with 2-hydroxy-3-oxopropionate reductase activity, galactarate metabolic process.
