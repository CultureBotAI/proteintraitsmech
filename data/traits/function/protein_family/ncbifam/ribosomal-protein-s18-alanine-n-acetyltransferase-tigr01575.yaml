label: "ribosomal protein S18-alanine N-acetyltransferase"
definition: >-
  ribosomal protein S18-alanine N-acetyltransferase (rimI) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01575 (equivalog); catalyses [ribosomal protein bS18]-alanine N-acetyltransferase; associated with protein-N-terminal-alanine acetyltransferase activity, protein modification process, ribosome biogenesis.
