identifier: NCBIfam:NF005492
label: "phosphoribosylaminoimidazolecarboxamide formyltransferase"
definition: >-
  phosphoribosylaminoimidazolecarboxamide formyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF005492 (equivalog); catalyses phosphoribosylaminoimidazolecarboxamide formyltransferase; associated with IMP cyclohydrolase activity, phosphoribosylaminoimidazolecarboxamide formyltransferase activity, purine nucleotide biosynthetic process.
