label: "arginine ABC transporter permease ArtM"
definition: >-
  arginine ABC transporter permease ArtM — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008336 (equivalog); catalyses ABC-type polar-amino-acid transporter; associated with membrane, transmembrane transporter activity, ATP-binding cassette (ABC) transporter complex, nitrogen compound transport. Members occur in Gammaproteobacteria.
