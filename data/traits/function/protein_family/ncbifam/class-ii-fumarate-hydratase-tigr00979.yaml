identifier: NCBIfam:TIGR00979
label: "class II fumarate hydratase"
definition: >-
  class II fumarate hydratase (fumC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00979 (equivalog); catalyses fumarate hydratase; associated with fumarate hydratase activity, fumarate metabolic process, tricarboxylic acid cycle heteromeric enzyme complex.
