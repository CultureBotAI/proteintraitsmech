identifier: NCBIfam:NF008058
label: "bifunctional methylenetetrahydrofolate dehydrogenase/methenyltetrahydrofolate cyclohydrolase FolD"
definition: >-
  bifunctional methylenetetrahydrofolate dehydrogenase/methenyltetrahydrofolate cyclohydrolase FolD — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008058 (equivalog); catalyses methylenetetrahydrofolate dehydrogenase (NADP(+)), methenyltetrahydrofolate cyclohydrolase; associated with methylenetetrahydrofolate dehydrogenase (NADP+) activity.
