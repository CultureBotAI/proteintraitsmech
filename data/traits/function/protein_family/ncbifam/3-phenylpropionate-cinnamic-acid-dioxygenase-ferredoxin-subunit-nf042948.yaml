label: "3-phenylpropionate/cinnamic acid dioxygenase ferredoxin subunit"
definition: >-
  3-phenylpropionate/cinnamic acid dioxygenase ferredoxin subunit (hcaC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF042948 (equivalog); associated with 3-phenylpropionate dioxygenase activity, 3-phenylpropionate catabolic process. Members occur in Gammaproteobacteria.
