identifier: NCBIfam:TIGR01100
label: "V-type ATPase subunit C"
definition: >-
  V-type ATPase subunit C — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01100 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with P-type proton-exporting transporter activity, vacuolar proton-transporting V-type ATPase complex, proton transmembrane transport. Members occur in unclassified Salmonella.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
