  phosphomethylpyrimidine synthase ThiC — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006763 (equivalog); catalyses phosphomethylpyrimidine synthase; associated with thiamine biosynthetic process, iron-sulfur cluster binding.
