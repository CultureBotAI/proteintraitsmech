  hydroxymethylbilane synthase (hemC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00212 (equivalog); catalyses hydroxymethylbilane synthase; associated with hydroxymethylbilane synthase activity, tetrapyrrole biosynthetic process.
