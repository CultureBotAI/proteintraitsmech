identifier: NCBIfam:NF006943
label: "bifunctional 2-methylcitrate dehydratase/aconitate hydratase"
definition: >-
  bifunctional 2-methylcitrate dehydratase/aconitate hydratase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006943 (equivalog); catalyses aconitate hydratase, 2-methylcitrate dehydratase; associated with propionate catabolic process, 2-methylcitrate dehydratase activity, 2 iron, 2 sulfur cluster binding.
