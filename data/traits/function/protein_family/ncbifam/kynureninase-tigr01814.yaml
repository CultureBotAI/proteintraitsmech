  kynureninase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01814 (equivalog); catalyses kynureninase; associated with cytoplasm, L-tryptophan catabolic process, NAD+ biosynthetic process, pyridoxal phosphate binding.
