  gamma-glutamyltransferase (ggt) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00066 (equivalog); catalyses gamma-glutamyltransferase; associated with glutathione biosynthetic process, glutathione catabolic process, glutathione gamma-glutamate hydrolase.
