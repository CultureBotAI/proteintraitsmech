  formyltetrahydrofolate deformylase (purU) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00655 (equivalog); catalyses formyltetrahydrofolate deformylase; associated with 'de novo' IMP biosynthetic process, formyltetrahydrofolate deformylase activity.
