label: "molybdenum ABC transporter ATP-binding protein ModC"
definition: >-
  molybdenum ABC transporter ATP-binding protein ModC — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008355 (equivalog); catalyses ABC-type molybdate transporter; associated with ATP binding, molybdate ion transmembrane transporter activity, molybdate ion transport, membrane. Members occur in Gammaproteobacteria.
