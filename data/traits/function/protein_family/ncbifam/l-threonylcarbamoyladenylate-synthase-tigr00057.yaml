identifier: NCBIfam:TIGR00057
label: "L-threonylcarbamoyladenylate synthase"
definition: >-
  L-threonylcarbamoyladenylate synthase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00057 (equivalog); catalyses L-threonylcarbamoyladenylate synthase; associated with double-stranded RNA binding, tRNA modification, L-threonylcarbamoyladenylate synthase activity.
