definitions:
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a ribonucleoside 5'-diphosphate + ATP = a ribonucleoside 5'-triphosphate + ADP. (2) a 2'-deoxyribonucleoside 5'-diphosphate + ATP = a 2'-deoxyribonucleoside 5'-triphosphate + ADP
    source: "mapped enzyme EC:2.7.4.6"
    method: SOURCED
