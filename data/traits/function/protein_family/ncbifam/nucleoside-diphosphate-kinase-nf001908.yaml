identifier: NCBIfam:NF001908
label: "nucleoside-diphosphate kinase"
definition: >-
  nucleoside-diphosphate kinase (ndk) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001908 (equivalog); catalyses nucleoside-diphosphate kinase; associated with nucleoside diphosphate kinase activity.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
mapping_status: SEEDED
