  arabinose-5-phosphate isomerase KdsD — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008141 (equivalog); catalyses arabinose-5-phosphate isomerase; associated with isomerase activity, carbohydrate derivative binding, carbohydrate derivative metabolic process. Members occur in Gammaproteobacteria.
