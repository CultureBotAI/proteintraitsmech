  F0F1 ATP synthase subunit A — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF004482 (equivalog); catalyses H(+)-transporting two-sector ATPase; associated with proton transmembrane transporter activity, proton motive force-driven ATP synthesis.
