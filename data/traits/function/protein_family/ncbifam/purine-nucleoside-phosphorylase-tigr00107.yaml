label: "purine-nucleoside phosphorylase"
definition: >-
  purine-nucleoside phosphorylase (deoD) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00107 (equivalog); catalyses purine-nucleoside phosphorylase; associated with purine-nucleoside phosphorylase activity, nucleobase-containing compound metabolic process.
