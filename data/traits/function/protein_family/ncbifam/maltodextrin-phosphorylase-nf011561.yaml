identifier: NCBIfam:NF011561
label: "maltodextrin phosphorylase"
definition: >-
  maltodextrin phosphorylase (malP) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF011561 (equivalog); catalyses glycogen phosphorylase; associated with carbohydrate metabolic process, glycogen phosphorylase activity, pyridoxal phosphate binding. Members occur in Gammaproteobacteria.
