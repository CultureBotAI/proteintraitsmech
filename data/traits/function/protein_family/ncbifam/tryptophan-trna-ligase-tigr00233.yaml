identifier: NCBIfam:TIGR00233
label: "tryptophan--tRNA ligase"
definition: >-
  tryptophan--tRNA ligase (trpS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00233 (equivalog); catalyses tryptophan--tRNA ligase; associated with nucleotide binding, tryptophan-tRNA ligase activity, ATP binding, tryptophanyl-tRNA aminoacylation.
