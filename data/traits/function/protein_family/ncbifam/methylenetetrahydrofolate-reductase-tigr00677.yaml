label: "methylenetetrahydrofolate reductase"
definition: >-
  methylenetetrahydrofolate reductase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00677 (equivalog); associated with methylenetetrahydrofolate reductase [NAD(P)H] activity, folic acid-containing compound biosynthetic process, FAD binding. Members occur in Aquificaceae.
