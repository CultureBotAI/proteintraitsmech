  PTS glucose transporter subunit IIA (crr) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006962 (equivalog); catalyses protein-N(pi)-phosphohistidine--D-glucose phosphotransferase; associated with phosphoenolpyruvate-dependent sugar phosphotransferase system. Members occur in Pseudomonadati.
