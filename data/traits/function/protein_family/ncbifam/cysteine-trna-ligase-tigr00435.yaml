identifier: NCBIfam:TIGR00435
label: "cysteine--tRNA ligase"
definition: >-
  cysteine--tRNA ligase (cysS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00435 (equivalog); catalyses cysteine--tRNA ligase; associated with cysteine-tRNA ligase activity, ATP binding, cytoplasm, cysteinyl-tRNA aminoacylation.
