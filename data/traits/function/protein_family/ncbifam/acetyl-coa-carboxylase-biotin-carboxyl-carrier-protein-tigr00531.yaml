  acetyl-CoA carboxylase biotin carboxyl carrier protein (accB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00531 (equivalog); catalyses acetyl-CoA carboxylase; associated with acetyl-CoA carboxylase activity, fatty acid biosynthetic process, acetyl-CoA carboxylase complex.
