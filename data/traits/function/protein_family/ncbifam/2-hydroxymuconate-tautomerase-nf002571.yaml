  2-hydroxymuconate tautomerase (thmT) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002571 (equivalog); catalyses 2-hydroxymuconate tautomerase; associated with metabolic process, intramolecular oxidoreductase activity, interconverting keto- and enol-groups.
