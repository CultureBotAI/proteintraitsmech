identifier: NCBIfam:TIGR00493
label: "ATP-dependent Clp endopeptidase proteolytic subunit ClpP"
definition: >-
  ATP-dependent Clp endopeptidase proteolytic subunit ClpP — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00493 (equivalog); catalyses endopeptidase Clp; associated with ATP-dependent peptidase activity, serine-type endopeptidase activity, proteolysis, endopeptidase Clp complex.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
