  phosphoglucosamine mutase (glmM) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01455 (equivalog); catalyses phosphoglucosamine mutase; associated with magnesium ion binding, carbohydrate metabolic process, phosphoglucosamine mutase activity, peptidoglycan biosynthetic process.
