identifier: NCBIfam:TIGR01347
label: "dihydrolipoyllysine-residue succinyltransferase"
definition: >-
  dihydrolipoyllysine-residue succinyltransferase (sucB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01347 (equivalog); catalyses dihydrolipoyllysine-residue succinyltransferase; associated with dihydrolipoyllysine-residue succinyltransferase activity, tricarboxylic acid cycle, oxoglutarate dehydrogenase complex.
definition_source: NCBIfam PGAP (composed from product and EC/GO annotations)
trait_axis: FUNCTION
trait_category: FUNC_PROTEIN_FAMILY
term_kind: CLASS
