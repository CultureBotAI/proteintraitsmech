identifier: NCBIfam:TIGR00324
label: "tRNA-intron lyase"
definition: >-
  tRNA-intron lyase (endA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00324 (equivalog); catalyses tRNA-intron lyase; associated with tRNA splicing, via endonucleolytic cleavage and ligation.
