  calcium-translocating P-type ATPase, PMCA-type — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01517 (equivalog); catalyses P-type Ca(2+) transporter; associated with P-type calcium transporter activity, ATP binding, calcium ion transport, membrane.
