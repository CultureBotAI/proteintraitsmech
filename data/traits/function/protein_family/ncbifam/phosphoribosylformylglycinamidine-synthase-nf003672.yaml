identifier: NCBIfam:NF003672
label: "phosphoribosylformylglycinamidine synthase"
definition: >-
  phosphoribosylformylglycinamidine synthase (purL) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF003672 (equivalog); catalyses phosphoribosylformylglycinamidine synthase; associated with phosphoribosylformylglycinamidine synthase activity.
