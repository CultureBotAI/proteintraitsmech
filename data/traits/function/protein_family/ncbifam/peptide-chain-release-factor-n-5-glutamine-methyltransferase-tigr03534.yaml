identifier: NCBIfam:TIGR03534
label: "peptide chain release factor N(5)-glutamine methyltransferase"
definition: >-
  peptide chain release factor N(5)-glutamine methyltransferase (prmC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR03534 (equivalog); catalyses peptide chain release factor N(5)-glutamine methyltransferase; associated with translation, S-adenosylmethionine-dependent methyltransferase activity, peptidyl-glutamine methylation.
