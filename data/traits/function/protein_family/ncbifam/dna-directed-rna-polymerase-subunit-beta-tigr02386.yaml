  DNA-directed RNA polymerase subunit beta' (rpoC) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR02386 (equivalog); catalyses DNA-directed RNA polymerase; associated with DNA binding, DNA-directed RNA polymerase activity, DNA-templated transcription.
