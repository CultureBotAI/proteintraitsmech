label: "guanosine-5'-triphosphate,3'-diphosphate diphosphatase"
definition: >-
  guanosine-5'-triphosphate,3'-diphosphate diphosphatase (gppA) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008260 (equivalog); catalyses guanosine-5'-triphosphate,3'-diphosphate diphosphatase; associated with guanosine-5'-triphosphate,3'-diphosphate diphosphatase activity, guanosine pentaphosphate catabolic process. Members occur in Gammaproteobacteria.
