identifier: NCBIfam:TIGR00499
label: "lysine--tRNA ligase"
definition: >-
  lysine--tRNA ligase (lysS) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00499 (equivalog); catalyses lysine--tRNA ligase; associated with lysine-tRNA ligase activity, ATP binding, cytoplasm, lysyl-tRNA aminoacylation.
