identifier: NCBIfam:NF006629
label: "nicotinate phosphoribosyltransferase"
definition: >-
  nicotinate phosphoribosyltransferase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF006629 (equivalog); catalyses nicotinate phosphoribosyltransferase; associated with nicotinate-nucleotide diphosphorylase (carboxylating) activity, NAD+ biosynthetic process.
