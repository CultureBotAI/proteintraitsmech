identifier: NCBIfam:TIGR01060
label: "phosphopyruvate hydratase"
definition: >-
  phosphopyruvate hydratase (eno) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR01060 (equivalog); catalyses phosphopyruvate hydratase; associated with phosphopyruvate hydratase complex, magnesium ion binding, phosphopyruvate hydratase activity, glycolytic process.
