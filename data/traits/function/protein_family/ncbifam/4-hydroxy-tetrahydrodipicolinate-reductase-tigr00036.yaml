  4-hydroxy-tetrahydrodipicolinate reductase (dapB) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM TIGR00036 (equivalog); catalyses 4-hydroxy-tetrahydrodipicolinate reductase; associated with 4-hydroxy-tetrahydrodipicolinate reductase activity, L-lysine biosynthetic process.
