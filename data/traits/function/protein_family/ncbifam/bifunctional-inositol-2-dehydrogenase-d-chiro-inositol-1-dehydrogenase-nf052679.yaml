label: "bifunctional inositol 2-dehydrogenase/D-chiro-inositol 1-dehydrogenase"
definition: >-
  bifunctional inositol 2-dehydrogenase/D-chiro-inositol 1-dehydrogenase (iolG) — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF052679 (equivalog); catalyses inositol 2-dehydrogenase, D-chiro-inositol 1-dehydrogenase; associated with nucleotide binding, inositol catabolic process, inositol 2-dehydrogenase (NAD+) activity.
