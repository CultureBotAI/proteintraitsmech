identifier: NCBIfam:NF008606
label: "macrolide transporter subunit MacA"
definition: >-
  macrolide transporter subunit MacA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF008606 (equivalog); associated with extrinsic component of membrane, transmembrane transporter activity, macrolide transmembrane transporter complex, xenobiotic detoxification by transmembrane export across the plasma membrane. Members occur in Pseudomonadota.
