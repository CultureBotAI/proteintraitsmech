identifier: NCBIfam:NF001924
label: "ribose-5-phosphate isomerase RpiA"
definition: >-
  ribose-5-phosphate isomerase RpiA — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF001924 (equivalog); catalyses ribose-5-phosphate isomerase; associated with ribose-5-phosphate isomerase activity, pentose-phosphate shunt, non-oxidative branch.
