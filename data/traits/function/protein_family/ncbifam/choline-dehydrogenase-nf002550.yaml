  choline dehydrogenase — a functionally conserved protein family grouped by the NCBIfam full-length profile-HMM NF002550 (subfamily); catalyses choline dehydrogenase; associated with oxidoreductase activity, acting on CH-OH group of donors, flavin adenine dinucleotide binding.
