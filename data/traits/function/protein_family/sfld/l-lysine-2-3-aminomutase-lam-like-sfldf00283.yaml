identifier: SFLD:SFLDF00283
label: "L-lysine 2,3-aminomutase (LAM-like)"
definition: >-
  This entry describes lysine-2,3-aminomutase as found along with beta-lysine acetyltransferase in a two-enzyme pathway for making the compatible solute N-epsilon-acetyl-beta-lysine. This compatible solute, or osmolyte, is known to protect a number of methanogenic archaea against salt stress. The proteins matched by this entry represent a tight clade with essentially full-length homology, and are distinct from additional homologues that are shorter or highly diverged in the C-terminal region. All members of this family have the radical SAM motif CXXXCXXC, while some but not all have a second copy of the motif in the C-terminal region.
definition_source: "InterPro:IPR022459 abstract (SFLD SFLDF00283 is a member signature)"
