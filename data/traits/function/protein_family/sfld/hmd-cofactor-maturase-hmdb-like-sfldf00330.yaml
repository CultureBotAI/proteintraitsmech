identifier: SFLD:SFLDF00330
label: "HMD cofactor maturase (HmdB-like)"
definition: >-
  This protein family includes 6-carboxymethyl-5-methyl-4-hydroxy-2-pyridinol synthase HcgA from Methanococcus maripaludis (MMP0126, ) and similar prokaryotic proteins. HcgA is a radical S-adenosyl methionine enzyme involved in the biosynthesis of the iron-guanylylpyridinol (FeGP) cofactor.
