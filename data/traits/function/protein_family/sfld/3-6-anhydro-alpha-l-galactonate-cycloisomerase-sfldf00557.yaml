identifier: SFLD:SFLDF00557
label: "3,6-anhydro-alpha-L-galactonate cycloisomerase"
definition: >-
  3,6-anhydro-alpha-L-galactonate (AHGA) cycloisomerase catalyzes the conversion of 3,6-anhydro-alpha-L-galactonate to 2-dehydro-3-deoxy-D-galactonate, as part of the breakdown of 3,6-anhydro-L-galactose, the major monomeric sugar of red macroalgae.
