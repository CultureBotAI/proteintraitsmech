identifier: SFLD:SFLDF00157
label: "2,3-diketo-5-methylthiopentyl-1-phosphate enolase"
definition: >-
  Members of this family are the methionine salvage pathway enzyme 2,3-diketo-5-methylthiopentyl-1-phosphate enolase, a homologue of RuBisCO. They catalyze the tautomerization of 2,3-diketo-5-methylthiopentane 1-phosphate (DK-MTP 1-P). This is an important step in the methionine salvage pathway in which 5-methylthio-D-ribose (MTR) derived from 5'-methylthioadenosine is converted to methionine. This protein family seems restricted to Bacillus subtilis and close relatives, where two separate proteins carry the enolase and phosphatase activities that in other species occur in a single protein, MtnC ( InterPro:IPR023943 ).
definition_source: "InterPro:IPR017717 abstract (SFLD SFLDF00157 is a member signature)"
