identifier: SFLD:SFLDF00555
label: "cis-3-hydroxy-L-proline dehydratase"
definition: >-
  Characterised enzymes in the cis-3-hydroxy-L-proline dehydratase family catalyse the dehydration of cis-3-hydroxy-L-proline to form delta1-pyrroline-2-carboxylate as part of a metabolic pathway allowing usage of several isomeric 3- and 4-hydroxyprolines as sole carbon sources.
