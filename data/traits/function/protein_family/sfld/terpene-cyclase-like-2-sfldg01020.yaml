identifier: SFLD:SFLDG01020
label: "Terpene Cyclase Like 2"
definition: >-
  Characterised enzymes in the terpene cyclase like 2 family include sesquiterpene cyclases, such as epi-isozizaene synthase and pentalenene synthase, as well as 2-methylisoborneol synthase, which processes a naturally occurring noncanonical isoprenoid substrate. As with other enzymes with the 'terpenoid synthase fold', they have two conserved metal binding motifs, proposed to coordinate Mg2 ion-bridged binding of the diphosphate moiety of FPP to the enzymes. Metal-triggered substrate ionisation initiates catalysis, and the α-barrel active site serves as a template to channel and stabilise the conformations of reactive carbocation intermediates through a complex cyclisation cascade. These enzymes function in the monomeric form and are found mostly in fungi, bacteria and some plant species.
definition_source: "InterPro:IPR034686 abstract (SFLD SFLDG01020 is a member signature)"
