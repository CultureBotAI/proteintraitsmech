identifier: SFLD:SFLDF00571
label: "Tte1186a maturase"
definition: >-
  Tte1186 catalyzes the formation of a thioether cross-link in the peptide Tte1186a, which is encoded by an orf located upstream of the maturase, under reducing conditions in the presence of SAM. Tte1186 contains three [4Fe-4S] clusters that are indispensable for thioether cross-link formation; however, only one cluster catalyzes the reductive cleavage of SAM.
