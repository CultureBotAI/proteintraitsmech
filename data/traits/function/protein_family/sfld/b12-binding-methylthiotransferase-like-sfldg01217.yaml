identifier: SFLD:SFLDG01217
label: "B12-binding methylthiotransferase like"
definition: >-
  Members of this family, which are found in methanogenic archaea, have both a B12 binding homology domain ( Pfam:PF02310 ) and a radical SAM domain ( Pfam:PF04055 ). They occur only once per genome. Some species that express proteins of this family also express a related protein with a similar domain architecture (see NCBIfam:TIGR04013 ).
