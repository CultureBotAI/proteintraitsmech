identifier: SFLD:SFLDF00316
label: "C-terminal tyrosine decarboxylase (MftC-like)"
definition: >-
  Mycofactocin maturase MftC is a radical S-adenosylmethionine (SAM) enzyme responsible for the first step of the biosynthesis of the enzyme cofactor mycofactocin (MFT). It catalyzes two reactions at the C terminus of the mycofactocin precursor (the MftA peptide): the first one is the oxidative decarboxylation of the C-terminal L-tyrosine of MftA, forming an unsaturated tyramine moiety; the second reaction is the cross-linking of the tyramine with the penultimate L-valine residue, forming a five-membered lactam ring. Its activity requires the presence of the MftB chaperone and it is also required for alcohol metabolism in Mycobacteria.
