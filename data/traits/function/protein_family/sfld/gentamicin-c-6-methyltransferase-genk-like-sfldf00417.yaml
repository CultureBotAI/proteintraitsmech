identifier: SFLD:SFLDF00417
label: "gentamicin C-6' methyltransferase (GenK-like)"
definition: >-
  Responsible for the methylation of gentamicin at the C6 position. It has recently been shown that GenK (UniProtKB:Q70KE5) acts at the X2 Branch Point and is essential for the production of G418 and Gentamicins C2a, C2, and C1. It also acts (with the same function) at the A and A2 branch points.
