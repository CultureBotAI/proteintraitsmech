identifier: SFLD:SFLDF00291
label: "arginine 2,3-aminomutase"
definition: >-
  Members of this family are arginine 2,3-aminomutase, a radical SAM enzyme more closely related to lysine 2,3-aminomutase than to glutamate 2,3-aminomutase. The enzyme makes L-beta-arginine, sometimes in the context of antibiotic biosynthesis (blasticidin S, mildiomycin, etc). Activity is proven in Streptomyces griseochromogenes, which makes blasticidin S (Prabhakaran, et al., J. Am. Chem. SOC. 1988, 110. 5785-5791).
