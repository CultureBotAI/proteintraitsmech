identifier: SFLD:SFLDF00289
label: "anaerobic Cys-type sulfatase-maturating enzyme"
definition: >-
  To be active, all sulfatases require a maturation process, this is the group of proteins that perform this maturation. The proteins in this family are thought to favour the Cys-type sulfatases. The Cys residue is covalently attached to one of the [4Fe-4S] clusters and the C-beta proton is abstracted by the 5'-deoxyadenosyl radical. The Cys-SH group is first reduced to Cys=S and then hydrolysed to the formylglycyl C=O group.
definition_source: "InterPro:IPR034485 abstract (SFLD SFLDF00289 is a member signature)"
