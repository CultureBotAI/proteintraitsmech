identifier: SFLD:SFLDF00414
label: "bacteriochlorophyll C12 methyltransferase"
definition: >-
  Bacteriochlorophyllide d C-12(1)-methyltransferase (bchR, EC 2.1.1.331) catalyses the transfer of a methyl groups to C-12 methyl carbon in the biosynthesis of certain bacteriochlorophylls in Chlorobium tepidum, and has the sequence motifs that tentatively assigns it to the cobalamin-dependent P-methylase subfamily.
