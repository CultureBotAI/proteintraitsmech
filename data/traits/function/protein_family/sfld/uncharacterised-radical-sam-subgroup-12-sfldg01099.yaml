identifier: SFLD:SFLDG01099
label: "Uncharacterised Radical SAM Subgroup 12"
definition: >-
  Proteins in this entry are uncharacterised but contain a single [4Fe-4S] cluster, with the metal thought to be co-ordinated by three cysteines and an exchangeable S-adenosyl-L-methionine. This entry includes protein MJ0674 from the archaean Methanocaldococcus jannaschii.
