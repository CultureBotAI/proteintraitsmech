identifier: SFLD:SFLDF00562
label: "HemN-like, clustered with heat shock genes"
definition: >-
  Proteins in this entry include HemW (also known as oxygen-independent coproporphyrinogen-III oxidase-like protein). HemW is a heme chaperone catalyzing the insertion of heme into hemoproteins. Experimentally determined examples of oxygen-independent coproporphyrinogen III oxidase, an enzyme that replaces HemF function under anaerobic conditions, belong to a family of proteins called HemN ( InterPro:IPR004558 ). This family contains a closely related protein, shorter at the amino end and lacking the region containing the motif PYRT[SC]YP found in members of the hemN family. Several species, including Escherichia coli, Helicobacter pylori, Aquifex aeolicus, and Chlamydia trachomatis, have members of both this family and the Escherichia coli hemN family. The member of this family from Bacillus subtilis was shown to complement a hemF/hemN double mutant of Salmonella typhimurium and to prevent accumulation of coproporphyrinogen III under anaerobic conditions, but the exact role of this protein is still uncertain. It is found in a number of species that do not synthesize haem de novo.
definition_source: "InterPro:IPR004559 abstract (SFLD SFLDF00562 is a member signature)"
