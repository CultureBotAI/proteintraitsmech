identifier: SFLD:SFLDF00299
label: "anaerobic ribonucleoside-triphosphate reductase activase"
definition: >-
  This enzyme is a member of the radical-SAM protein and utilises S-adenosyl methionine, an iron-sulphur cluster and a reductant (dihydroflavodoxin ) to produce a glycine-centred radical in the class III (anaerobic) ribonucleotide triphosphate reductase (NrdD, ). The two components form an alpha-2/beta-2 heterodimer.
