identifier: SFLD:SFLDF00315
label: "antilisterial bacteriocin subtilosin biosynthesis protein (AlbA-like)"
definition: >-
  This radical S-adenosylmethionine enzyme is encoded by the sbo-alb operon and comprises two [4Fe-4S] clusters. One [4Fe-4S] cluster is coordinated by the prototypical C[X]3C[X]2C motif and is responsible for the observed S-adenosylmethionine cleavage reaction, whereas the second [4Fe-4S] cluster is required for the generation of all three thioether linkages in subtilosin A. The mature subtilosin has been shown to display spermicidal activity and antimicrobial activity against a range of Gram-positive and Gram-negative bacteria. Initially, an electron from an external reducing agent (for example, sodium dithionite) is transferred to the first [4Fe-4S] cluster (coordinated by the CXXXCXXC motif) to convert it into its active reduced form. Subsequently, coordinated SAM is reductively cleaved into methionine and the 5'-dA radical by the transfer of the electron onto SAM. SboA coordinates with the unique iron of the second [4Fe-4S] cluster (coordinated by Cys408, Cys414, Cys417) via a thiol group of a cysteine residue, which is deprotonated upon binding to the cluster. The generated 5'-dA radical abstracts a hydrogen atom from the a-carbon of the threonine or phenylalanine residues. In the last step, the carbon-centred radical attacks the coordinated sulfur atom by forming the thioether bond, and the Fe-S cluster acts as the acceptor of the second electron. This reaction step is similar to the key aspect of the BioB- and isopenicillin N synthase-catalyzed reactions, which involve the attack of a carbon-centred radical on a sulfur atom that is ligated to an iron atom and acts as an electron acceptor. The reduced form of the second cluster may be able to transfer the electron to the first cluster via intramolecular electron channeling, converting both clusters into their activ
