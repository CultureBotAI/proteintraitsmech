identifier: SFLD:SFLDF00349
label: "3-methylornithine synthase (PylB-like)"
definition: >-
  This entry represents PylB, which is part of a three-gene cassette that directs the biosynthesis of pyrrolysine, the twenty-second amino acid, that is incorporated in some species at a UAG canonical stop codon. PylB possesses signature residues suggesting it to be a radical SAM protein, which mediate radical-catalysed reactions. It catalyses the isomerisation of L-lysine to (2R,3R)-3-methylornithine.
