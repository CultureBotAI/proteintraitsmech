identifier: SFLD:SFLDF00403
label: "phosphonoacetaldehyde methylase (fom3-like)"
definition: >-
  This family contains Cytidylyl-2-hydroxyethylphosphonate methyltransferase Fom3 which catalyzes the C-methylation of cytidylyl-2-hydroxyethylphosphonate (HEP-CMP) to form cytidylyl-2-hydroxypropylphosphonate (HPP-CMP). It is involved in fosfomycin biosynthesis.
