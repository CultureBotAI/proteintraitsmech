identifier: SFLD:SFLDF00556
label: "4R-hydroxyproline betaine 2-epimerase"
definition: >-
  Characterised enzymes in the 4R-hydroxyproline betaine 2-epimerase family catalyse the 2-epimerization of trans-4-hydroxy-L-proline betaine to cis-4-hydroxy-D-proline betaine as part of a pathway by which trans-4-hydroxy-L-proline betaine is converted to alpha-ketoglutarate.
