identifier: SFLD:SFLDG01138
label: "C1.6.2: Deoxy-d-mannose-octulosonate 8-phosphate Phosphatase Like"
definition: >-
  This entry is a part of the haloacid dehalogenase (HAD) superfamily of hydrolases, mainly from beta, gamma and epsilon proteobacteria, Aquifex, Fusobacterium, Porphyromonas and Methanosarcina. All characterised members of the HAD-superfamily hydrolase, subfamily IIIA and most characterised members of the HAD superfamily are phosphatases. HAD superfamily phosphatases contain active site residues in several conserved catalytic motifs, all of which are found conserved in this family. Lipopolysaccharides of Gram-negative bacteria consist of a heteropolysaccharide component (O-antigen) and a hydrophobic component (lipid A). Linking the two portions is 3-Deoxy-D-manno-octulosonate (KDO), an 8-carbon sugar. Biosynthesis of KDO linked to lipid A proceeds via five steps, one of which involves removal of a phosphate from KDO 8-P via the action of KDO 8-P phosphatase ( EC:3.1.3.45 ). This entry includes two homologues with divergent functions: 2-keto-3-deoxy-d-manno-octulosonate 8-phosphate phosphohydrolase (KDO8P phosphatase, KDO8PP, KdsC) and 2-keto-3-deoxy-9-O-phosphonononic acid phosphohydrolase (KDN9P phosphatase, KDN9PP). KDO8PP and KDN9PP catalyze the final step in the synthesis of KDO and the 9-carbon derivative KDN, respectively. One member of this family, the YrbI protein from Haemophilus influenzae has been cloned, expressed, purified and found to be an active phosphatase. Furthermore, its crystal structure has been determined. The sequence from Methanosarcina acetivorans, UniProtKB:Q8TJL6, is distinctive in that it is linked to an N-terminal cytidylyltransferase domain ( InterPro:IPR003329 ) and is annotated as acylneuraminate cytidylyltransferase.
