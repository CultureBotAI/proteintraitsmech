identifier: SFLD:SFLDF00311
label: "heme degradation proteins (HutW/ChuW-like)"
definition: >-
  HutW is a radical SAM enzyme distinct from HemN and more similar to the class C RSMTs (radical SAM methyltransferases). It is an anaerobic heme-degrading enzyme that uses a mechanism similar to what has been reported for other RSMTs.
