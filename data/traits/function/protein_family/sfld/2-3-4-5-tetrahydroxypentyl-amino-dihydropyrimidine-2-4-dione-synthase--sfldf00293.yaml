identifier: SFLD:SFLDF00293
label: "((2,3,4,5-tetrahydroxypentyl)amino)dihydropyrimidine-2,4-dione synthase (CofH-like)"
definition: >-
  This enzyme (CofH), together with CofG, complete the biosynthesis of 7,8-didemethyl-8-hydroxy-5-deazariboflavin synthase, the chromophore of coenzyme F420. The chromophore is also used in cyanobacteria DNA photolyases. CofH catalyzes the radical-mediated synthesis of 5-amino-5-(4-hydroxybenzyl)-6-(D-ribitylimino)-5,6-dihydrouracil from 5-amino-6-(D-ribitylamino)uracil and L-tyrosine.
