identifier: SFLD:SFLDG01119
label: "spectinomycin biosynthesis (SpcY-like)"
definition: >-
  Proteins in this family are involved in spectinomycin biosynthesis and are thought to play a role in generating TDP-actinospectose. Although the reaction is somewhat similar to that of DesII, these proteins are not detectably similar.
