identifier: SFLD:SFLDG01387
label: "BtrN-like SPASM domain containing"
definition: >-
  This entry contains non-canonical members of the SPASM/twitch domain containing family, including Cmo, also known as tungsten-containing aldehyde ferredoxin oxidoreductase cofactor-modifying protein and AdoMet-dependent heme synthase (ahbD) involved in the siroheme-dependent heme b biosynthesis, catalysing the conversion of Fe-coproporphyrin III into heme by the oxidative decarboxylation of two propionate side chains.
