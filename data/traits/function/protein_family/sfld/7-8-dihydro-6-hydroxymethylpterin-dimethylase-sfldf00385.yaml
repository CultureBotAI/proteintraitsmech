identifier: SFLD:SFLDF00385
label: "7,8-dihydro-6-hydroxymethylpterin dimethylase"
definition: >-
  This entry includes GDGT/MA synthase (MJ0619, formerly known as 7,8-dihydro-6-hydroxymethylpterin dimethyltransferase) and its homologues mostly from archaea. This is the pioneer enzyme of class D radical S-adenosylmethionine methylases (RSMT) subclass. The MJ0619 protein from Methanocaldococcus jannaschii was first thought to be responsible for catalysing the methylation at both C-7 and C-9 of the 7,8-dihydro-6-hydroxymethylpterin substrate. However, this could not be corroborated and the X-ray structure of MJ0619 revealed that this enzyme is, actually, involved in isoprenoid-based ether-linked membrane lipids synthesis and catalyses the biphytanyl chain formation between the termini of two lipid tails within one glycerophospholipid to generate the macrocyclic archaeol or between the termini of two lipid tails from two glycerophospholipids to generate the macrocycle glycerol dibiphytanyl glycerol tetraether (GDGT). These lipids enable archaea to resist extreme environmental conditions. Therefore, MJ0619 has been renamed GDGT/MA synthase or GDGT/MAS. It contains three Fe4-S4 clusters and a mononuclear rubredoxin-type Fe2/3 cofactor.
definition_source: "InterPro:IPR034471 abstract (SFLD SFLDF00385 is a member signature)"
