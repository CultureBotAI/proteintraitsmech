identifier: SFLD:SFLDF00563
label: "galactarate dehydratase 3"
definition: >-
  This entry includes galactarate dehydratase III (UniProtKB:A9CG74) from Agrobacterium tumefaciens C58. It catalyzes the dehydration of m-galactarate to 2-keto-3-deoxy-galactarate, as part of the synthesis of alpha-ketoglutarate. It has also been shown to convert D-galacturonate to 3-deoxy-D-xylo-hexarate or 3-deoxy-D-lyxo-hexarate, an unexpected reaction for an enolase superfamily member, because it involves abstraction of a proton alpha to an aldehyde group rather than a proton alpha to a carboxylate group.
definition_source: "InterPro:IPR034623 abstract (SFLD SFLDF00563 is a member signature)"
