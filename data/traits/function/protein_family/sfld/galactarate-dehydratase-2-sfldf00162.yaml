identifier: SFLD:SFLDF00162
label: "galactarate dehydratase 2"
definition: >-
  Enzymes in the galactarate dehydratase 2 family catalyze the dehydration of galactarate. The product of this reaction is the enantiomer of the product of the galactarate dehydratase reaction catalyzed by the L-talarate/galactarate dehydratase family in the mandelate racemase subgroup. Though the overall reaction catalyzed is the same as that of enzymes in the galactarate dehydratase 3 family, a distinct set of catalytic residues are used by enzymes in families 2 and 3. galactarate(2-) -> 3-deoxy-D-threo-hex-2-ulosarate(2-) + H 2 O
definition_source: "InterPro:IPR033977 abstract (SFLD SFLDF00162 is a member signature)"
