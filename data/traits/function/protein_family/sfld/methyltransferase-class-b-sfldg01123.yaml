identifier: SFLD:SFLDG01123
label: "methyltransferase (Class B)"
definition: >-
  These enzymes all belong to the Class B Radical SAM Methyltransferases, i.e. most of them are B12-dependent methyltransferases that utilise two SAM moieties, the first to generate the 5'-deoxyadenosyl radical and the second to regenerate the methylcobalamin cofactor. This entry also includes 2-(S-pantetheinyl)-carbapenam-3-carboxylate synthase (ThnL), a protein involved in the biosynthesis of the beta-lactam carbapenem antibiotic thienamycin. It catalyses the formation of a thioether bond between pantetheine and C-2 of the carbapenam precursor (3S,5S)-carbapenam-3-carboxylate, leading to the formation of 2-(S-pantetheinyl)-carbapenam-3-carboxylate. ThnL also has reversible thiol/disulphide redox activity.
definition_source: "InterPro:IPR034466 abstract (SFLD SFLDG01123 is a member signature)"
