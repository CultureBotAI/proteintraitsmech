identifier: SFLD:SFLDF00155
label: "muconate cycloisomerase (anti)"
definition: >-
  Enzymes in the muconate cycloisomerase (anti) family catalyze the conversion of cis,cis-muconate to muconolactone, in the beta-ketoadipate pathway. Although the enzymes in this family catalyze the same reaction as those in the muconate cycloisomerase (syn) family, the two families use stereochemically distinct mechanisms, and may have evolved independently within the superfamily.
