identifier: SFLD:SFLDF00435
label: "carbapenem intermediate methyltransferase (ThnK-like)"
definition: >-
  This entry includes the 2-(S-pantetheinyl)-carbapenam-3-carboxylate methyltransferase ThnK from S. cattleyicolor and Cobalamin-dependent radical SAM methyltransferase TokK from S. tokunonensis. ThnK is involved in the biosynthesis of the beta-lactam carbapenem antibiotic thienamycin. This enzyme catalyses two consecutive S-adenosyl-L-methionine-dependent methylations to build out the C6-ethyl side chain in a stereocontrolled manner. TokK is involved in the biosynthesis of the beta-lactam carbapenem antibiotic asparenomycin. It catalyses three consecutive S-adenosyl-L-methionine-dependent methylations to build out the C6-isopropyl side chain in a stereocontrolled manner.
