identifier: SFLD:SFLDF00376
label: "7-carboxy-7-deazaguanine synthase, Cx14CxxC type"
definition: >-
  In the pathway of 7-cyano-7-deazaquanine (preQ0) biosynthesis, the radical SAM enzyme QueE is quite variable. This entry represents a variant form in which the three-Cys motif that binds the signature 4Fe-4S cluster takes the form Cx14CxxC, as in Burkholderia multivorans ATCC 17616. The crystal structure is known.
