identifier: SFLD:SFLDF00292
label: "spore photoproduct lyase 1"
definition: >-
  These enzymes are involved in the repair of UV radiation-induced DNA damage during spore germination. They can repair thymine dimer 5-thyminyl-5,6-dihydrothymine (known as spore photoproduct (SP)) by in situ monomerization of spore photoproduct to two thymines. This family of enzymes uses the SAM as a cofactor (rather than in a stoichiometric manner). This entry represents spore photoproduct lyases from Bacilli.
