identifier: SFLD:SFLDG01258
label: "(chloro)muconate cycloisomerase (syn) like"
definition: >-
  This family consists of muconate cycloisomerase (or Muconate Lactonizing Enzyme (MLE); EC:5.5.1.1) and chloromuconate cycloisomerase (or chloromuconate lactonizing enzymes (Cl-MLEs); EC:5.5.1.7), enzymes that often overlap in specificity. It does not include more distantly related proteins such as mandelate racemase (EC:5.1.2.2). MLE, a homooctameric enzyme, catalyses the conversion of cis,cis-muconate to muconolactone in the catechol branch of the beta-ketoadipate pathway. This pathway is used in soil microbes to breakdown lignin-derived aromatics, catechol and protocatechuate, to citric acid cycle intermediates. Some bacterial species are also capable of dehalogenating chloroaromatic compounds by the action of Cl-MLEs. MLEs are members of the enolase superfamily characterised by the presence of an enolate anion intermediate which is generated by abstraction of the alpha-proton of the carboxylate substrate by an active site residue and that is stabilised by coordination to the essential Mg2+ ion.
