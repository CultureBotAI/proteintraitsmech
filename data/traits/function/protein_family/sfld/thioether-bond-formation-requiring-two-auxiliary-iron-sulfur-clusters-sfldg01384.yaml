identifier: SFLD:SFLDG01384
label: "thioether bond formation requiring two auxiliary iron-sulfur clusters"
definition: >-
  Proteins in this entry include ChuR from Bacteroides thetaiotaomicron and AnSME (also known as CPF_0616) from Clostridium perfringens. ChuR is involved in 'Ser-type' sulfatase maturation under anaerobic conditions, while AnSME is involved in 'Cys-type' sulfatase maturation under anaerobic conditions. Members of this protein family are radical SAM family enzymes, maturases that prepare the oxygen-sensitive radical required in the active site of anaerobic sulphatases. This maturase role has led to many misleading legacy annotations suggesting that this enzyme maturase is instead a sulphatase regulatory protein. All members of the seed alignment are radical SAM enzymes encoded next to or near an anaerobic sulphatase. Note that a single genome may encode more than one sulphatase/maturase pair.
definition_source: "InterPro:IPR023867 abstract (SFLD SFLDG01384 is a member signature)"
