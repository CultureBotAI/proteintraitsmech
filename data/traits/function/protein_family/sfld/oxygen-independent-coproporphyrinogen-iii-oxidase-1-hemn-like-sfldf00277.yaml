identifier: SFLD:SFLDF00277
label: "oxygen-independent coproporphyrinogen-III oxidase 1 (HemN-like)"
definition: >-
  This family represents HemN, the oxygen-independent coproporphyrinogen III oxidase that replaces HemF function under anaerobic conditions. HemN catalyses the anaerobic transformation of coproporhyrinogen-III into protoporphyrinogen-IX during porphyrin biosynthesis. Several species, including Escherichia coli, Helicobacter pylori, and Aquifex aeolicus, have both a member of this family and a member of another, closely related family for which there is no evidence of coproporphyrinogen III oxidase activity, InterPro:IPR004559. Members of this family have a perfectly conserved motif PYRT[SC]YP in a region N-terminal to the region of homology with the related uncharacterised protein.
definition_source: "InterPro:IPR004558 abstract (SFLD SFLDF00277 is a member signature)"
