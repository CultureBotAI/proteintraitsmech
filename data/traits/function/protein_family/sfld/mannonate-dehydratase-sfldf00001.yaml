identifier: SFLD:SFLDF00001
label: "mannonate dehydratase"
definition: >-
  Characterised enzymes in the mannonate dehydratase family catalyse the dehydration of mannonate to 2-dehydro-3-deoxy-D-gluconate, as part of the catabolism of D-glucuronate. Generally, genomes that encode a member of the mannonate dehydratase family do not have a UxuA homologue. Though UxuA also has the TIM barrel fold, it is not a member of the enolase superfamily. Thus, the enolase superfamily mannonate dehydratase family and the UxuAs are an example of convergent evolution of function.
definition_source: "InterPro:IPR034587 abstract (SFLD SFLDF00001 is a member signature)"
