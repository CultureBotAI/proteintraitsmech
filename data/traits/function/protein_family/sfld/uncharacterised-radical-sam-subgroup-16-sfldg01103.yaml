identifier: SFLD:SFLDG01103
label: "Uncharacterised Radical SAM Subgroup 16"
definition: >-
  This entry describes HxsC, one of a pair of uncharacterised radical SAM proteins, regularly found in the context of a small protein with four or more repeats of the tripeptide His-Xaa-Ser (HXS). This enzyme may be be part of a peptide modification system.
