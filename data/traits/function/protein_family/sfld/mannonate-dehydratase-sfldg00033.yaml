identifier: SFLD:SFLDG00033
label: "mannonate dehydratase"
definition: >-
  The mannonate dehydratase (manD) group consists of the subset of enolase superfamily enzymes with a conserved tyrosine, presumably acting as an active site base, at the position of Y159 in the experimentally characterised manD from Novosphingobium aromaticivorans. An additional conserved arginine controls the p K a of this tyrosine (R147 in N. aromaticivorans manD). At the present time, mannan dehydratase is the only characterised family within this group. Other enzymes within the group have been shown to catalyze the low efficiency dehydration of D-gluconate and/or D-mannonate, but the biologically relevant function of these enzymes is unclear.
definition_source: "InterPro:IPR034589 abstract (SFLD SFLDG00033 is a member signature)"
