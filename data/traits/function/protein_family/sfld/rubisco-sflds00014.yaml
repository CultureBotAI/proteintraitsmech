identifier: SFLD:SFLDS00014
label: RuBisCO
definition: >-
  Structurally characterised enzymes in the RuBisCO superfamily are dimers with an active site located at the interface of the N-terminal α+β domain of one polypeptide and the C-terminal TIM β/α-barrel of the second polypeptide. Though most of the enzymes in the superfamily are thought to function as D-Ribulose 1,5-bisphosphate carboxylase/oxygenase (RuBisCO), a smaller number of enzymes, termed the RuBisCO-like proteins, do not catalyse carboxylation reactions. Despite these differences, superfamily enzymes share a common active site architecture used to stabilise an enolate intermediate.
definition_source: "InterPro:IPR033966 abstract (SFLD SFLDS00014 is a member signature)"
