identifier: SFLD:SFLDG01097
label: "Uncharacterised Radical SAM Subgroup 10"
definition: >-
  Members of this family highly conserved in some Firmicutes have an N-terminal radical SAM domain ( InterPro:IPR007197 ) and a C-terminal domain ( InterPro:IPR014866 ) with a CxCxxxxC motif that suggests binding to an additional metallocluster. It appears all correct sequences in this family are about 370 amino acids in length, containing the YfkA and YfkB regions originally reported as separate ORFs in Bacillus subtilis. Partial Phylogenetic Profiling shows occurrences almost exclusively in the Bacilli, with very few examples of either lateral transfer or gene loss. The essentially monophyletic distribution suggests a housekeeping function. Members have no well-conserved gene neighbourhood. The function is unknown.
definition_source: "InterPro:IPR031004 abstract (SFLD SFLDG01097 is a member signature)"
