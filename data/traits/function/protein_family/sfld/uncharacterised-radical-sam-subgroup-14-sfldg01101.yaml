identifier: SFLD:SFLDG01101
label: "Uncharacterised Radical SAM Subgroup 14"
definition: >-
  Members of this protein family are uncharacterised radical SAM enzymes that occur in a prokaryotic three-gene system along with homologs of mammalian proteins Memo (Mediator of ErbB2-driven cell MOtility) and AMMERCR1 (Alport syndrome, Mental Retardation, Midface hypoplasia, and Elliptocytosis). Among radical SAM enzymes that have been experimentally characterised, the most closely related in sequence include activases of pyruvate formate-lyase and of benzylsuccinate synthase.
definition_source: "InterPro:IPR027596 abstract (SFLD SFLDG01101 is a member signature)"
