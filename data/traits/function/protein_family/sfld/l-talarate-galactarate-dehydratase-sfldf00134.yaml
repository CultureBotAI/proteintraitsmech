identifier: SFLD:SFLDF00134
label: "L-talarate/galactarate dehydratase"
definition: >-
  Enzymes in the L-talarate/galactarate dehydratase family catalyze the dehydration of L-talarate (also called L-altrarate), the dehydration of galactarate, and the epimerization of L-talarate to galactarate.
