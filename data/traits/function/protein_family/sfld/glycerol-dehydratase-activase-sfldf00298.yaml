identifier: SFLD:SFLDF00298
label: "glycerol dehydratase activase"
definition: >-
  Glycerol dehydratase activase (GD-AE) contains the canonical [Fe4S4] binding motif and two additional ferredoxin-like [4Fe-4S] cluster binding domains. It is an organic radical activase that forms a glycyl radical on the B12-independent glycerol dehydratase and, counter to the paradigm of the common activation step of the Radical SAM superfamily, produces 5'-deoxy-5'-(methylthio)adenosine (MTA) and 2-aminobutyrate rather than 5'-deoxyadenosine (5'-dA) and methionine. The formation of MTA rather than 5'-dA is somewhat analogous to the Radical SAM 3-amino-3-carboxypropyl radical forming Superfamily and thus a similar radical intermediate has been proposed. This alternative reductive cleavage pathway for SAM is surprising given the structural similarities between the GD and PFL at the level of both primary and tertiary structure, it is difficult at this time to determine exactly why the GD-AE follows a different reductive cleavage pathway during glycyl radical formation. The precise identity of the radical intermediate in the GD-AE activation mechanism is still under investigation. glycerol dehydratase (inactive) + S-adenosyl-L-methioninate + 1,5-dihydroflavin ->glycerol dehydratase (active) + L-methionine zwitterion + 5'-deoxyadenosine+semiquinone
definition_source: "InterPro:IPR033974 abstract (SFLD SFLDF00298 is a member signature)"
