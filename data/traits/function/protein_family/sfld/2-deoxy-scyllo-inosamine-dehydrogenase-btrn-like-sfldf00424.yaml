identifier: SFLD:SFLDF00424
label: "2-deoxy-scyllo-inosamine dehydrogenase (BtrN-like)"
definition: >-
  BtrN catalyses an unusual radical mediated dehydrogenation during aminoglycoside biosynthesis: oxidation of 2-deoxy-scyllo-inosamine (DOIA) to amino-dideoxy-scyllo-inosose (amino-DOI) in the biosynthetic pathway of butirosin. Butirosin is an amino cyclitol glycoside antibiotic produced by Bacillus circulans, and bears a unique (S)-4-amino-2-hydroxybutyrate (AHBA) side chain. BtrN contains two [4Fe-4S] clusters, the first is the canonical radical SAM cluster, the second is implicated in substrate-radical oxidation (oxidises a secondary alcohol to a ketone). This family of proteins has a non-canonical structural architecture with a β5/α4 motif.
definition_source: "InterPro:IPR034386 abstract (SFLD SFLDF00424 is a member signature)"
