identifier: SFLD:SFLDF00279
label: "4-hydroxyphenylacetate decarboxylase activase"
definition: >-
  This family of enzymes is responsible for the creation of a glycyl radical in the ground state of the enzyme 4-hydroxyphenylacetate decarboxylase. This enzyme is unique amongst the glycyl radical enzymes in having a small subunit and being a functional hetero-octamer (made up of four large subunits and four small subunits) in the biologically active state. The small subunit is responsible for metal binding and is also involved in the regulation of the enzymes' oligomeric state and activity, which are triggered by reversible serine phosphorylation of the glycyl radical subunits. These enzymes differ from their PFL-AE and Nrd counterparts in that they contain up to two iron-sulfur centres, in addition to the characteristic SAM cluster, these extra clusters are thought to be involved in the electron transfer to the SAM cluster but do not directly participate in the reductive cleavage of SAM.
definition_source: "InterPro:IPR034438 abstract (SFLD SFLDF00279 is a member signature)"
