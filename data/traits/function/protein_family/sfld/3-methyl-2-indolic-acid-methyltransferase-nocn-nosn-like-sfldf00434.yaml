identifier: SFLD:SFLDF00434
label: "3-methyl-2-indolic acid methyltransferase (NocN/NosN like)"
definition: >-
  NocN shares 75% sequence identity with NosN and thus is thought to have a very similar function. NosN shares high sequence similarity to various putative methyltransferases with a radical S-AdoMet-dependent manner, including Tlm-Orf11 (32% identity) in tallysomycin biosynthesis. Experimental characterization shows that NosN functions as a methyltransferase and acts on the 3-methylindolyl group (product of the NosL enzyme's reaction) at the C-4 position for furnishing the 3,4-dimethylindolyl moiety.
