identifier: SFLD:SFLDF00421
label: "avilamycin epimerase"
definition: >-
  The biosynthesis of avilamycin, an oligosaccharide antibiotic, starts with the formation of a disaccharide synthesised from D-glucose. AviX12 is involved in C-2 epimerization of the glucose moiety after the whole avilamycin molecule has been formed to form the d-mannose stereoisomer. Unusually, the C-2 carbon is an uncativated centre, and it is thought that AviX12 generates the 5'deoxyadenosyl radical, which abstracts a hydrogen atom a position C-2 of the mannose moiety to form a radical intermediate. This intermediate undergoes epimerization by an unknown mechanism. avilamycin A precursor + S-adenosyl-L-methionine zwitterion ->avilamycin A+5'-deoxyadenosine + L-methionine zwitterion This family includes avilamycin epimerase AviX12 and related proteins from Actinobacteria.
definition_source: "InterPro:IPR033971 abstract (SFLD SFLDF00421 is a member signature)"
