identifier: SFLD:SFLDG01102
label: "Uncharacterised Radical SAM Subgroup 15"
definition: >-
  This entry represents a family of uncharacterised protein of about 400 amino acids in length that contains a radical SAM domain in the N-terminal half. Members of this family are present in about twenty percent of prokaryotic genomes, always paired with a member of the conserved hypothetical protein NCBIfam:TIGR03915. Roughly forty percent of the members of that family exist as fusions with a uracil-DNA glycosylase-like region, NCBIfam:TIGR03914. In DNA, uracil results from deamidation of cytosine, forming U/G mismatches that lead to mutation, and so uracil-DNA glycosylase is a DNA repair enzyme. This indirect connection, and the recurring role or radical SAM proteins in modification chemistries, suggest that this protein may act in DNA modification, repair, or both.
definition_source: "InterPro:IPR023874 abstract (SFLD SFLDG01102 is a member signature)"
