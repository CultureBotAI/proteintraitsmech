identifier: SFLD:SFLDF00008
label: "gluconate dehydratase"
definition: >-
  Enzymes in the gluconate dehydratase family catalyse the dehydration of gluconate to 2-dehydro-3-deoxy-d-gluconate as part of the Entner-Doudoroff pathway. The experimentally characterised enzyme from Sulfolobus solfataricus also catalyses the dehydration of galactonate, while the experimentally characterised enzyme from Thermoproteus tenax does not.
