identifier: SFLD:SFLDF00275
label: "adenosine C2 methyltransferase (RlmN-like)"
definition: >-
  This entry represents the RlmN family, that includes dual-specificity RNA methyltransferase RlmN and ribosomal RNA large subunit methyltransferase Cfr. Dual-specificity RNA methyltransferase RlmN specifically methylates position 2 of adenine 2503 in 23S rRNA. This nucleotide is located in a functionally important region of the ribosome, at the entrance to the nascent peptide exit tunnel, and may thus be involved in the interaction with the nascent peptide. It also methylates position 2 of adenine 37 in tRNAs. Unmodified tRNA is not a suitable substrate for RlmN, which suggests that RlmN works in a late step during tRNA maturation. Ribosomal RNA large subunit methyltransferase Cfr specifically methylates position 8 of adenine 2503 in 23S rRNA. It can also methylate position 2 of A2503 after the primary methylation is complete, to form 2,8-dimethyladenosine. Cfr confers antibiotic resistance in bacteria. The antibiotic resistance is provided by methylation at the 8 position and is independent of methylation at the 2 position of A2503.
definition_source: "InterPro:IPR004383 abstract (SFLD SFLDF00275 is a member signature)"
