identifier: SFLD:SFLDF00319
label: "[Fe] hydrogenase maturase (HydG-like)"
definition: >-
  This entry describes the radical SAM protein HydG. It is part of an enzyme metallocentre maturation system, working together with GTP-binding protein HydF and another radical SAM enzyme, HydE, in H-cluster maturation in [FeFe] hydrogenases.
