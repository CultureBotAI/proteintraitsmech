identifier: SFLD:SFLDF00425
label: "dTDP-4-amino-4,6-dideoxy-D-glucose ammonia-lyase (DesII-like)"
definition: >-
  DesII is a member of the radical S-adenosyl-L-methionine (SAM) enzyme superfamily involved in the biosynthesis of TDP-D-desosamine. D-Desosamine is found in a number of macrolide antibiotics produced by Streptomyces venezuelae. DesII catalyses the deamination of TDP-4-amino-4,6-dideoxy-d-glucose to form TDP-3-keto-4,6-dideoxy-d-glucose. It can act as a deaminase or a dehydrogenase depending on the nature of its TDP-sugar substrate.
definition_source: "InterPro:IPR016863 abstract (SFLD SFLDF00425 is a member signature)"
