identifier: SFLD:SFLDF00004
label: "mandelate racemase"
definition: >-
  Mandelate racemase (EC:5.1.2.2) (MR) in certain bacteria, including Pseudomonas putida, utilise D or L mandelic acid as sole carbon source for energy. Mandelate racemase and muconate lactonizing enzyme (EC:5.5.1.1) (MLE) are two bacterial enzymes involved in aromatic acid catabolism. They catalyze mechanistically distinct reactions yet they are related at the level of their primary, quaternary (homooctamer) and tertiary structures. A crystal structure has been described.
