identifier: SFLD:SFLDG01216
label: "thioether bond formation requiring one auxiliary iron-sulfur cluster"
definition: >-
  A class of ribosomally assembled and post-translationally modified natural product peptides. All members are assembled from gene encoded precursor peptides that maturate to the corresponding core peptide after the introduction of at least one thioether bond, bridging the sulfur of a cysteine residue with a highly unreactive α-carbon of an acceptor amino acid. To date, all known sactipeptides derive from Bacillus species, but putative members have now also been identified in Clostridium species.
