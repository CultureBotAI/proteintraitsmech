identifier: SFLD:SFLDF00306
label: "carbapenem intermediate methyltransferase (ThnL-like)"
definition: >-
  The enzyme in this family is responsible for the vitamin B12 dependent methylation of the beta-lactam ring in the thienamycin (thn) gene cluster. ThnL catalyses the formation of a thioether bond between pantetheine and C-2 of the carbapenam precursor (3S,5S)-carbapenam-3-carboxylate, leading to the formation of 2-(S-pantetheinyl)-carbapenam-3-carboxylate.
