identifier: SFLD:SFLDG01204
label: Grx2-like.1
definition: >-
  This family includes the highly abundant Escherichia coli GrxB (Grx2) glutaredoxin which is notably longer than either GrxA or GrxC. Unlike the other two E. coli glutaredoxins, Grx2 appears to be unable to reduce ribonucleotide reductase, and may have more to do with resistance to redox stress. Purified Grx2 exhibits glutathione S-transferase activity indicating that it may have a dual-function as glutaredoxin and glutathione S-transferase.
