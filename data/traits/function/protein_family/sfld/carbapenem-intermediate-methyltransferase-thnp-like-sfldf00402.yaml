identifier: SFLD:SFLDF00402
label: "carbapenem intermediate methyltransferase (ThnP-like)"
definition: >-
  ThnP is thought to be responsible for the vitamin B12 dependent methylation of the beta-lactam ring in the thienamycin (thn) gene cluster. It is currently not known what the methyl donor is, but in keeping with the other B12-dependent methyltransferases, it has been shown as methylcobalamin here. Mutagenesis performed on the thnP gene product demonstrated that thnP is essential for thienamycin biosynthesis. However, the mutant retained the ability to produce cephamycin, thus showing that ThnP is not involved in cephamycin C biosynthesis.
definition_source: "InterPro:IPR033975 abstract (SFLD SFLDF00402 is a member signature)"
