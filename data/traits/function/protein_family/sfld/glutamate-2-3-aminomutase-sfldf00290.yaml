identifier: SFLD:SFLDF00290
label: "glutamate 2,3-aminomutase"
definition: >-
  Glutamate 2,3-aminomutase is a radical SAM enzyme with a pyridoxal phosphate group. It catalyses the interconversion of L-glutamate and L-beta-glutamate. It is closely related to lysine 2,3-aminomutase, but can be distinguished by architecture (longer N-terminal region, shorter C-terminal region) and replacement of key lysine-binding residues.
