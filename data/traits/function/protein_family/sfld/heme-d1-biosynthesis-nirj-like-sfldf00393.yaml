identifier: SFLD:SFLDF00393
label: "heme D1 biosynthesis (NirJ-like)"
definition: >-
  Heme D1 occurs in the cytochrome Cd1 subunit of nitrite reductase in species such as Pseudomonas stutzeri. NirJ is a radical SAM protein that contains two iron-sulfur clusters. It catalyzes the removal of two propionate side chains during heme D1 biosynthesis. In a number of species, distinct genes NirJ1 and NirJ2 are found in similar genomic regions; this entry describes NirJ from genomes with NirJ only.
