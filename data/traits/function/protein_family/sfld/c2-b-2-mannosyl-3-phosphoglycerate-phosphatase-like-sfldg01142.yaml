identifier: SFLD:SFLDG01142
label: "C2.B.2: Mannosyl-3-phosphoglycerate Phosphatase Like"
definition: >-
  This group of proteins is a member of the IIB subfamily of the haloacid dehalogenase (HAD) superfamily of aspartate-nucleophile hydrolases. It consists of mannosyl-3-phosphoglycerate phosphatase from Pyrococcus horikoshii and related proteins, including GpgP from Methanococcoides burtonii and Persephonella marina, which can catalyse the dephosphorylation of both glucosyl-3-phosphoglycerate and mannosyl-3-phosphoglycerate.
