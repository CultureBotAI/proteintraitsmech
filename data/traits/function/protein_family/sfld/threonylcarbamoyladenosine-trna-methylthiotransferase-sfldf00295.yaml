identifier: SFLD:SFLDF00295
label: "threonylcarbamoyladenosine tRNA methylthiotransferase"
definition: >-
  The enzyme in this family catalyses the methylthiolation of N6-threonylcarbamoyladenosine (t6A), leading to the formation of 2-methylthio-N6-threonylcarbamoyladenosine (ms2t6A) at position 37 in tRNAs that read codons beginning with adenine. The enzyme binds two 4Fe-4S clusters. One cluster is coordinated with three cysteines and an exchangeable S-adenosyl-L-methionine.
