identifier: SFLD:SFLDG01094
label: "Uncharacterised Radical SAM Subgroup 6"
definition: >-
  This enzyme is a member of the radical-SAM family. It is often gene clustered with the class III (anaerobic) ribonucleotide triphosphate reductase (NrdD, ) and presumably fulfils the identical function as NrdG, which utilises S-adenosyl methionine, an iron-sulphur cluster and a reductant (dihydroflavodoxin) to produce a glycine-centred radical in NrdD.
