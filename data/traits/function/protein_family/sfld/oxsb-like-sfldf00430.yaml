identifier: SFLD:SFLDF00430
label: OxsB-like
definition: >-
  OxsB is involved in the biosynthesis of a unique four-membered oxetane ring found in the oxetanocin A, a nucleoside analog with antitumor, antiviral and antibacterial properties. The biosynthetic pathway is currently unknown. In addition, OxsB has methyltransferase activity in vitro and is able to catalyse the radical mediated, stereoselective C2'-methylation of dAMP to form methylated 2'-dAMP. It also catalyses the demethylation of S-adenosyl-L-methionine (SAM) to S-adenosyl-L-homocysteine (SAH).
