identifier: SFLD:SFLDF00324
label: "bacteriocin maturation"
definition: >-
  Members of this family of peptide-modifying radical SAM proteins include BstC, BstF, and BstJ, three enzymes involved in the biosynthesis of the antibiotic bottromycin D from a ribosomally translated peptide precursor that lacks a leader peptide. They appear to perform methylations of carbon atoms. Other members of the family occur in genomic contexts with RiPP family precursors in the Nif11-like and NHLP families, as well as other peptide maturases from the lanthionine synthase and cyclodehydratase families.
