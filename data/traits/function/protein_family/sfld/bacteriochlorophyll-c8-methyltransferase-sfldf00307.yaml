identifier: SFLD:SFLDF00307
label: "bacteriochlorophyll C8 methyltransferase"
definition: >-
  The enzyme in this family, bacteriochlorophyllide d C-8(2)-methyltransferase (bchQ, EC 2.1.1.332), catalyses the transfer of a methyl group to the C-8 ethyl carbon in the biosynthesis of certain bacteriochlorophylls in Chlorobium tepidum, and has the sequence motif that tentatively assigns it to the cobalamin-dependent P-methylase subfamily.
