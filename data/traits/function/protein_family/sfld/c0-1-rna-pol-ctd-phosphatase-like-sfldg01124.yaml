identifier: SFLD:SFLDG01124
label: "C0.1: RNA Pol CTD Phosphatase Like"
definition: >-
  CTD phosphatases catalyse the dephosphorylation of the C-terminal domain of the largest RNA polymerase (RNAP) II subunit. This promotes the activity of RNA polymerase II. Small CTD phosphatases (SCPs) preferentially catalyse the dephosphorylation of Ser5 within the consensus repeat, whereas yeast Fcp1 dephosphorylates Ser2 and Ser5. Structurally characterised enzymes in this group have the C0 cap type (only small inserts seen at either of the two points of cap insertion). This entry also matches the Phosphatase Herzog which is a prion-like protein found in Drosophila melanogaster, a membrane-associated phosphatase controlling embryonic patterning.
definition_source: "InterPro:IPR040078 abstract (SFLD SFLDG01124 is a member signature)"
