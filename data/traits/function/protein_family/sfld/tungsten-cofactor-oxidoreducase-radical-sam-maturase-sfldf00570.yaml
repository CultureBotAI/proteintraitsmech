identifier: SFLD:SFLDF00570
label: "tungsten cofactor oxidoreducase radical SAM maturase"
definition: >-
  Members of this family are radical SAM enzymes involved in the maturation of tungsten (W)-containing cofactors in the enzymes aldehyde ferredoxin oxidoreductase, formaldehyde ferredoxin oxidoreductase and others; and tend to be encoded by an adjacent gene.
