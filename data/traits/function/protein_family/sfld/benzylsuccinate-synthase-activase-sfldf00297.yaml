identifier: SFLD:SFLDF00297
label: "benzylsuccinate synthase activase"
definition: >-
  Proteins in this entry are thought to be radical SAM benzylsuccinate synthase-activating enzymes. These are a glycyl radical active site-creating enzyme related to pyruvate formate lyase-activating enzyme and additional uncharacterised homologues which activate additional glycyl radical-containing enzymes.
