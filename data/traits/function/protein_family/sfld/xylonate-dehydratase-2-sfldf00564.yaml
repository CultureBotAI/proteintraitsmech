identifier: SFLD:SFLDF00564
label: "xylonate dehydratase 2"
definition: >-
  The experimentally characterised member of the xylonate dehydratase 2 family from Haloferax volcanii has been shown to catalyse the dehydration of D-xylonate to 2-dehydro-3-deoxy-D-xylonate as part of the D-xylose degradation pathway. The enzyme also turns over D-gluconate. Though this enzyme catalyses the same overall reaction as those in the xylonate dehydratase 1 family, it is more closely related to other characterised enzymes in the mandelate racemase subgroup, and thus has been categorised as a separate family.
definition_source: "InterPro:IPR034624 abstract (SFLD SFLDF00564 is a member signature)"
