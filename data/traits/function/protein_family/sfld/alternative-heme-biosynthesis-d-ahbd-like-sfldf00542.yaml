identifier: SFLD:SFLDF00542
label: "alternative heme biosynthesis D (AhbD-like)"
definition: >-
  Members of this family are AhbD (alternative heme biosynthetic protein D), a radical SAM enzyme in sulfate-reducing bacteria and methanogens that performs the last decarboxylations to synthesise heme b from Fe-coproporphyrin III. This entry includes DVU_0855 from Desulfovibrio vulgaris, which may be involved in heme d1 biosynthesis.
