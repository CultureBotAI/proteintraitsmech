identifier: SFLD:SFLDF00344
label: ELP3-like
definition: >-
  The elongator complex is a major component of the RNA polymerase II (RNAPII) holoenzyme responsible for transcriptional elongation. It binds to both naked and nucleosomal DNA, can acetylate both core and nucleosomal histones, and is involved in chromatin remodelling. It acetylates histones H3, preferentially at 'Lys-14', and H4, preferentially at 'Lys-8'. ELP3 is required for the complex integrity and for the association of the complex with nascent RNA transcript. ELP3 is thought to act as a highly conserved histone acetyltransferase (HAT) capable of acetylating core histones in vitro, however, it is clearly a multi-domain protein. The HAT activity is thought to be present only in the C-terminal GNAT domain (histone acyltransferase domain). Recent work suggests that both the histone acetyltransferase and radical S-adenosylmethionine domains are essential for function, although the exact role of the Radical SAM domain is still unclear. The radical SAM domain is important for the structural integrity of the protein complex, and in yeast (previously demonstrated). However, an alternative may be that ELP3 binds and cleave SAM, as seen in the archaean M. jannaschii. It has also been shown in previous studies that the mouse ELP3 does not require the histone acyltransferase domain for zygotic paternal genome demethylation. The archaeal protein which is the homologue of the third subunit of the eukaryotic elongator complex (Elp3), catalyses the tRNA wobble uridine modification at C5: the same reaction as the eukaryotic elongator complex. The proposed mechanism of action by Elp3 represents an unprecedented chemistry performed on acetyl-CoA in which the methyl group of the acetly-CoA is activated by the 5'-deoxyadenosyl radical. This then adds to the uridine of tRNA. Some bacteri
