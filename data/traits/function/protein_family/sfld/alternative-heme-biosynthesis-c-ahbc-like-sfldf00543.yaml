identifier: SFLD:SFLDF00543
label: "alternative heme biosynthesis C (AhbC-like)"
definition: >-
  Fe-coproporphyrin III synthase (encoded by the gene ahbC) ( ) is known to transform didecarboxysirohaem into Fe-coproporphyrin III via homolytic cleavage of the C-C bond connecting the acetate group to the macrocycle, resulting in a double bond in the macrocycle and an acetate radical. It is thought that the acetate radical is transformed into acetate by providing a further electron and proton, which could come from the second Fe-S cluster present in the protein. Two molecules of SAM are consumed for each catalytic turnover, however it is unclear whether these are used stoichiometrically or catalytically.
definition_source: "InterPro:IPR034479 abstract (SFLD SFLDF00543 is a member signature)"
