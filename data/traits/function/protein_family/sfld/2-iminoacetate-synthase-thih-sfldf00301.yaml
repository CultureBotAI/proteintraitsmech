identifier: SFLD:SFLDF00301
label: "2-iminoacetate synthase (ThiH)"
definition: >-
  Members of this protein family are the ThiH proteins (also known as 2-iminoacetate synthase) involved in thiamine biosynthesis. They are homologues of the BioB protein of biotin biosynthesis. Genes encoding these proteins are generally found in operons with other thiamin biosynthesis genes.
