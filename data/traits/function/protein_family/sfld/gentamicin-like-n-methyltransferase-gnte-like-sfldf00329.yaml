identifier: SFLD:SFLDF00329
label: "gentamicin-like N-methyltransferase (GntE-like)"
definition: >-
  These enzymes all perform the cobalamin-dependent N-methyltransferase that transforms gentamicin A into gentamicin X2. Gentamicin A2 + 2(S-adenosyl-L-methionine zwitterion) ->gentamycin A + S-adenosyl-L-homocysteine zwitterion + L-methionine zwitterion + 5'-deoxyadenosine
