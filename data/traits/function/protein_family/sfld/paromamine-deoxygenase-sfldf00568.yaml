identifier: SFLD:SFLDF00568
label: "paromamine deoxygenase"
definition: >-
  This entry represents AprD4 from Streptoalloteichus hindustanus ( ) and similar sequences from actinomycetes. AprD4 is a radical SAM enzyme involved in C3-deoxygenation of the intermediate paromamine during biosynthesis of the aminoglycoside apramycin. It acts as a diol-dehydratase, and works with the partner protein, AprD3, a reductase. Members of this family have a non-canonical CX3CX3C motif for binding of a [4Fe-4S] cluster.
