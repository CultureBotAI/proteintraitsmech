identifier: SFLD:SFLDF00006
label: "rhamnonate dehydratase"
definition: >-
  L-rhamnonate dehydratase belongs to the mandelate racemase/muconate lactonizing enzyme family, specifically the RhamD subfamily. L-rhamnonate dehydratase (EC:4.2.1.90) catalyzes the dehydration of L-rhamnonate to 2-keto-3-deoxy-L-rhamnonate (KDR) L-rhamnonate = 2-dehydro-3-deoxy-L-rhamnonate+ H(2)O. This reaction proceeds via a syn dehydration.
