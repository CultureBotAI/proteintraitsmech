identifier: GO:0015138
label: "fumarate transmembrane transporter activity"
definition: >-
  Enables the transfer of fumarate from one side of a membrane to the other. Fumarate is a key intermediate in metabolism and is formed in the TCA cycle from succinate and converted into malate.
