label: "calmodulin-activated 3',5'-cyclic-GMP phosphodiesterase activity"
definition: >-
  Catalysis of the reactions: nucleoside 3',5'-cyclic GMP + H2O = GMP + H+; this activity is activated by binding to calcium-bound calmodulin.
