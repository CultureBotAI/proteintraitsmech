identifier: GO:0008175
label: "tRNA methyltransferase activity"
definition: >-
  Catalysis of the transfer of a methyl group from a donor to a nucleoside residue in a tRNA molecule. The methyl group can be transfered to the nucleobase or to the ribose group of the nucleoside.
