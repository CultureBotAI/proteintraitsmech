identifier: GO:1990135
label: "flavonoid sulfotransferase activity"
definition: >-
  Catalysis of the reaction: a flavonoid + 3'-phosphoadenosine-5'-phosphosulfate = sulfated flavonoid + adenosine-3',5'-diphosphate. This reaction is the transfer of a sulfate group to the hydroxyl group of a flavonoid acceptor, producing the sulfated flavonoid derivative.
