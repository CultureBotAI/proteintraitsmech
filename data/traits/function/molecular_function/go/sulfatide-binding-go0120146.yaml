identifier: GO:0120146
label: "sulfatide binding"
definition: >-
  Binding to sulfatide, also known as 3-O-sulfogalactosylceramide, SM4, or sulfated galactocerebroside. Sulfatide is a class of sulfoglycolipid, which are glycolipids that contain a sulfate group.
