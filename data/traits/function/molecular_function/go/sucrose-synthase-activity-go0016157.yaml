identifier: GO:0016157
label: "sucrose synthase activity"
definition: >-
  Catalysis of the reaction: an NDP-alpha-D-glucose + D-fructose = a ribonucleoside 5'-diphosphate + H+ + sucrose. The phosphate acceptor can be UDP or ADP.
