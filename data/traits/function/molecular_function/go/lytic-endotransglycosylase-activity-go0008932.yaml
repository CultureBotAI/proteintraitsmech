identifier: GO:0008932
label: "lytic endotransglycosylase activity"
definition: >-
  Catalysis of the endolytic cleavage of the (1->4)-beta-glycosidic linkage between N-acetylmuramic acid (MurNAc) and N-acetylglucosamine (GlcNAc) residues in peptidoglycan with concomitant formation of a 1,6-anhydrobond in the MurNAc residue.
