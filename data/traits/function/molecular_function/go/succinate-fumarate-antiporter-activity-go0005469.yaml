identifier: GO:0005469
label: "succinate:fumarate antiporter activity"
definition: >-
  Enables the transfer of a solute or solutes from one side of a membrane to the other according to the reaction: succinate(out) + fumarate(in) = succinate(in) + fumarate(out).
