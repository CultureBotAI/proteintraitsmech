identifier: GO:0015432
label: "ABC-type bile acid transporter activity"
definition: >-
  Enables the transfer of a solute or solutes from one side of a membrane to the other according to the reaction: cholate(in) + ATP + H2O = cholate(out) + ADP + phosphate + H+.
