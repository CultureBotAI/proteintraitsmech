identifier: GO:0003984
label: "acetolactate synthase activity"
definition: >-
  Catalysis of the reaction: H+ + 2 pyruvate = (2S)-2-acetolactate + CO2. Can also convert 2-oxobutanoate and pyruvate to (S)-2-ethyl-2-hydroxy-3-oxobutanoate.
