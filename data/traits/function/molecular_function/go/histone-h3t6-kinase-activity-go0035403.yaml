identifier: GO:0035403
label: "histone H3T6 kinase activity"
definition: >-
  Catalysis of the reaction: histone H3-threonine (position 6) + ATP = histone H3-phosphothreonine (position 6) + ADP. This reaction is the addition of a phosphate group to the threonine residue at position 6 of histone H3.
