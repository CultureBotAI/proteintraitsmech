identifier: GO:0072354
label: "histone H3T3 kinase activity"
definition: >-
  Catalysis of the reaction: histone H3-threonine (position 3) + ATP = histone H3-phosphothreonine (position 3) + ADP. This reaction is the addition of a phosphate group to the threonine residue at position 3 of histone H3.
