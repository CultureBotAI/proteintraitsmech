identifier: GO:0061463
label: "O-acetyl-ADP-ribose deacetylase activity"
definition: >-
  Catalysis of the reaction O-acetyl-ADP-ribose + H2O = ADP-ribose + acetate. Removes the acetyl group from either the 2'' or 3'' position of O-acetyl-ADP-ribose.
