identifier: GO:0015120
label: "phosphoglycerate transmembrane transporter activity"
definition: >-
  Enables the transfer of phosphoglycerates from one side of a membrane to the other. Phosphoglycerates are important intermediates in glycolysis and 3-phosphoglycerate is a precursor in serine biosynthesis.
