identifier: GO:0047024
label: "5-alpha-androstane-3-beta,17-beta-diol dehydrogenase (NADP+) activity"
definition: >-
  Catalysis of the reaction: 5-alpha-androstane-3-beta,17-beta-diol + NADP+ = 17-beta-hydroxy-5-alpha-androstan-3-one + H+ + NADPH.
