identifier: GO:0046961
label: "proton-transporting ATPase activity, rotational mechanism"
definition: >-
  Enables the transfer of protons from one side of a membrane to the other by a rotational mechanism according to the reaction: ATP + H2O + 4 H+(in) => ADP + phosphate + 5 H+(out).
