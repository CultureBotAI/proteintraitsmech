identifier: GO:0017096
label: "acetylserotonin O-methyltransferase activity"
definition: >-
  Catalysis of the reaction: S-adenosyl-L-methionine + N-acetylserotonin = S-adenosyl-L-homocysteine + melatonin. Melatonin is also known as N-acetyl-5-methoxytryptamine.
