identifier: GO:7770085
label: "protocatechuate 3,4-dioxygenase complex"
definition: >-
  A heterooligomeric non-heme iron dioxygenase enzyme complex composed of alpha (PcaG) and beta (PcaH) protomers (forming (alpha-beta)n assemblies with a catalytic Fe(III) site in the beta subunit) that catalyzes the intradiol ortho-cleavage of protocatechuate (3,4-dihydroxybenzoate) to 3-carboxy-cis,cis-muconate(3-) in the beta-ketoadipate pathway.
