identifier: GO:1990433
label: "CSL-Notch-Mastermind transcription factor complex"
definition: >-
  A DNA-binding transcription factor complex consisting of CSL and mastermind proteins in complex with the cleaved, intracellular domain of Notch. It is required for both repression and activation of Notch target genes.
