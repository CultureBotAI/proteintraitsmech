identifier: GO:0061852
label: "retrograde cargo receptor complex, Golgi to ER"
definition: >-
  Cargo receptor complex that recognizes, binds and returns endoplasmic reticulum (ER) resident proteins that have trafficked to Golgi compartments. Targets proteins lacking the HDEL motif recognised by COPI-coated vesicles.
