identifier: GO:0071254
label: "cytoplasmic U snRNP body"
definition: >-
  A focus in the cytoplasm that contains uridine-rich small nuclear ribonucleoproteins (U snRNPs) and essential snRNP assembly factors. These U bodies are invariably found in association with P bodies.
