identifier: GO:0033001
label: "Fc-gamma receptor III complex"
definition: >-
  A protein complex composed of an Fc-gamma RIII alpha chain and an Fc-epsilon RI gamma chain dimer with or without an Fc-epsilon RI beta chain and additional signaling components. The complex functions primarily as an activating receptor for IgG.
