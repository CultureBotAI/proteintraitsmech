label: "cerebellar climbing fiber to Purkinje cell synapse"
definition: >-
  A synapse of a climbing fiber onto the dendrites of a Purkinje cell in cerebellum. The climbing fiber originates from the inferior olivary nucleus of the medulla oblongata.
