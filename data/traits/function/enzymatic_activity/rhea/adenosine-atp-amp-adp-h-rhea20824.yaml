    grounding: RHEA:20824
    description: 'KB trait record (FUNC_ENZYMATIC_ACTIVITY) — the reaction these residues carry out. Full
      equation: adenosine + ATP = AMP + ADP + H(+)'
  - node_id: mcsa
    label: adenosine kinase
