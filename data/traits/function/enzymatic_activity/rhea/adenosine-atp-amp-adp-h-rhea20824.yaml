- graph_id: catalytic_residues_mcsa209
  title: Catalytic residues of RHEA:20824 (from MCSA:209)
  description: 'The catalytic residues that carry out RHEA:20824, joined from M-CSA entry 209. 2 residues,
    reused verbatim from the MCSA:209 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 209''s reactant set (CHEBI:16335, CHEBI:30616) equals Rhea side 20824_L exactly,
    and its product set (CHEBI:15378, CHEBI:456215, CHEBI:456216) equals side 20824_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
  nodes:
