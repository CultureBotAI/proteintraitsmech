- graph_id: catalytic_residues_mcsa382
  title: Catalytic residues of RHEA:15977 (from MCSA:382)
  description: 'The catalytic residues that carry out RHEA:15977, joined from M-CSA entry 382. 2 residues,
    reused verbatim from the MCSA:382 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 382''s reactant set (CHEBI:16660) equals Rhea side 15977_L exactly, and its product
    set (CHEBI:17597, CHEBI:18407) equals side 15977_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
