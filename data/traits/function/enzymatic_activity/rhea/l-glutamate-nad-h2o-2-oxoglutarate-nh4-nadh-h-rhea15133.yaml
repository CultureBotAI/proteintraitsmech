- graph_id: catalytic_residues_mcsa579
  title: Catalytic residues of RHEA:15133 (from MCSA:579)
  description: 'The catalytic residues that carry out RHEA:15133, joined from M-CSA entry 579. 2 residues,
    reused verbatim from the MCSA:579 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 579''s reactant set (CHEBI:15377, CHEBI:29985, CHEBI:57540) equals Rhea side
    15133_L exactly, and its product set (CHEBI:15378, CHEBI:16810, CHEBI:28938, CHEBI:57945) equals side
    15133_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
