- graph_id: catalytic_residues_mcsa809
  title: Catalytic residues of RHEA:25820 (from MCSA:809)
  description: 'The catalytic residues that carry out RHEA:25820, joined from M-CSA entry 809. 1 residues,
    reused verbatim from the MCSA:809 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 809''s reactant set (CHEBI:15377, CHEBI:15379, CHEBI:57834) equals Rhea side
    25820_L exactly, and its product set (CHEBI:16240, CHEBI:57484, CHEBI:58264) equals side 25820_R exactly.
    EC agreement bounded the candidates but was not sufficient on its own.'
