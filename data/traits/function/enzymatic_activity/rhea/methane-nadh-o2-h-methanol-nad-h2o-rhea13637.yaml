    reused verbatim from the MCSA:600 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 600''s reactant set (CHEBI:15378, CHEBI:15379, CHEBI:16183, CHEBI:57945) equals
    Rhea side 13637_L exactly, and its product set (CHEBI:15377, CHEBI:17790, CHEBI:57540) equals side
