    reused verbatim from the MCSA:314 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 314''s reactant set (CHEBI:29748, CHEBI:58359) equals Rhea side 21732_L exactly,
    and its product set (CHEBI:15361, CHEBI:15378, CHEBI:16567, CHEBI:29985) equals side 21732_R exactly.
    EC agreement bounded the candidates but was not sufficient on its own.'
