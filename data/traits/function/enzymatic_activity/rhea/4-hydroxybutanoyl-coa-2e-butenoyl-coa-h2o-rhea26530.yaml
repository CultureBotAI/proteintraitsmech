- graph_id: catalytic_residues_mcsa750
  title: Catalytic residues of RHEA:26530 (from MCSA:750)
  description: 'The catalytic residues that carry out RHEA:26530, joined from M-CSA entry 750. 8 residues,
    reused verbatim from the MCSA:750 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 750''s reactant set (CHEBI:58574) equals Rhea side 26530_L exactly, and its product
    set (CHEBI:15377, CHEBI:57332) equals side 26530_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
