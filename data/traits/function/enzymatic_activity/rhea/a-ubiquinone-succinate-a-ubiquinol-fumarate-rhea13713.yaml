- graph_id: catalytic_residues_mcsa294
  title: Catalytic residues of RHEA:13713 (from MCSA:294)
  description: 'The catalytic residues that carry out RHEA:13713, joined from M-CSA entry 294. 8 residues,
    reused verbatim from the MCSA:294 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 294''s reactant set (CHEBI:17976, CHEBI:29806) equals Rhea side 13713_R exactly,
    and its product set (CHEBI:16389, CHEBI:30031) equals side 13713_L exactly. EC agreement bounded the
    candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the direction opposite
    to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 13713_R. Both are correct: a Rhea master
    reaction is undirected, and M-CSA records the physiological direction. The disagreement is recorded,
    not reconciled.'
