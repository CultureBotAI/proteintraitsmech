    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 81''s reactant set (CHEBI:29748) equals Rhea side 13897_L exactly, and its product
    set (CHEBI:29934) equals side 13897_R exactly. EC agreement bounded the candidates but was not sufficient
