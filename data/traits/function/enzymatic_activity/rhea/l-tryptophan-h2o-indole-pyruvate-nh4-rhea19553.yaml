  description: 'The catalytic residues that carry out RHEA:19553, joined from M-CSA entry 410. 7 residues,
    reused verbatim from the MCSA:410 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 410''s reactant set (CHEBI:15377, CHEBI:57912) equals Rhea side 19553_L exactly,
    and its product set (CHEBI:15361, CHEBI:16881, CHEBI:28938) equals side 19553_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
