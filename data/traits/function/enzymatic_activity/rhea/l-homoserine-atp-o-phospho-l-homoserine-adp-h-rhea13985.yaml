- graph_id: catalytic_residues_mcsa778
  title: Catalytic residues of RHEA:13985 (from MCSA:778)
  description: 'The catalytic residues that carry out RHEA:13985, joined from M-CSA entry 778. 2 residues,
    reused verbatim from the MCSA:778 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 778''s reactant set (CHEBI:30616, CHEBI:57476) equals Rhea side 13985_L exactly,
    and its product set (CHEBI:15378, CHEBI:456216, CHEBI:57590) equals side 13985_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
