- graph_id: catalytic_residues_mcsa701
  title: Catalytic residues of RHEA:28494 (from MCSA:701)
  description: 'The catalytic residues that carry out RHEA:28494, joined from M-CSA entry 701. 2 residues,
    reused verbatim from the MCSA:701 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 701''s reactant set (CHEBI:15377, CHEBI:16374, CHEBI:17437) equals Rhea side
    28494_L exactly, and its product set (CHEBI:18151, CHEBI:28262) equals side 28494_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
