- graph_id: catalytic_residues_mcsa916
  title: Catalytic residues of RHEA:24576 (from MCSA:916)
  description: 'The catalytic residues that carry out RHEA:24576, joined from M-CSA entry 916. 6 residues,
    reused verbatim from the MCSA:916 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 916''s reactant set (CHEBI:15377, CHEBI:33019) equals Rhea side 24576_L exactly,
    and its product set (CHEBI:15378, CHEBI:43474) equals side 24576_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
