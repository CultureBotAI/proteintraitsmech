- graph_id: catalytic_residues_mcsa22
  title: Catalytic residues of RHEA:25217 (from MCSA:22)
  description: 'The catalytic residues that carry out RHEA:25217, joined from M-CSA entry 22. 5 residues,
    reused verbatim from the MCSA:22 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 22''s reactant set (CHEBI:350546, CHEBI:57288) equals Rhea side 25217_L exactly,
    and its product set (CHEBI:15378, CHEBI:17697, CHEBI:57287) equals side 25217_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
