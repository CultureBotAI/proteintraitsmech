- graph_id: catalytic_residues_mcsa708
  title: Catalytic residues of RHEA:21384 (from MCSA:708)
  description: 'The catalytic residues that carry out RHEA:21384, joined from M-CSA entry 708. 3 residues,
    reused verbatim from the MCSA:708 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 708''s reactant set (CHEBI:58095) equals Rhea side 21384_L exactly, and its product
    set (CHEBI:15669, CHEBI:28938) equals side 21384_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
