- graph_id: catalytic_residues_mcsa138
  title: Catalytic residues of RHEA:20696 (from MCSA:138)
  description: 'The catalytic residues that carry out RHEA:20696, joined from M-CSA entry 138. 8 residues,
    reused verbatim from the MCSA:138 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 138''s reactant set (CHEBI:15378, CHEBI:18421) equals Rhea side 20696_L exactly,
    and its product set (CHEBI:15379, CHEBI:16240) equals side 20696_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
