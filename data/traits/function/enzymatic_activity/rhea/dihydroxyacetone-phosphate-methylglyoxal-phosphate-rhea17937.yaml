- graph_id: catalytic_residues_mcsa85
  title: Catalytic residues of RHEA:17937 (from MCSA:85)
  description: 'The catalytic residues that carry out RHEA:17937, joined from M-CSA entry 85. 7 residues,
    reused verbatim from the MCSA:85 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 85''s reactant set (CHEBI:57642) equals Rhea side 17937_L exactly, and its product
    set (CHEBI:17158, CHEBI:43474) equals side 17937_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
