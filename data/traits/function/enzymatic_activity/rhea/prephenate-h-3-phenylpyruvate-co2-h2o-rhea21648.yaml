- graph_id: catalytic_residues_mcsa485
  title: Catalytic residues of RHEA:21648 (from MCSA:485)
  description: 'The catalytic residues that carry out RHEA:21648, joined from M-CSA entry 485. 2 residues,
    reused verbatim from the MCSA:485 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 485''s reactant set (CHEBI:15378, CHEBI:29934) equals Rhea side 21648_L exactly,
    and its product set (CHEBI:15377, CHEBI:16526, CHEBI:18005) equals side 21648_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
