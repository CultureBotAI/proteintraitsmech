- graph_id: catalytic_residues_mcsa401
  title: Catalytic residues of RHEA:36403 (from MCSA:401)
  description: 'The catalytic residues that carry out RHEA:36403, joined from M-CSA entry 401. 6 residues,
    reused verbatim from the MCSA:401 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 401''s reactant set (CHEBI:15377, CHEBI:17002) equals Rhea side 36403_L exactly,
    and its product set (CHEBI:15378, CHEBI:16113, CHEBI:28868) equals side 36403_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
