- graph_id: catalytic_residues_mcsa642
  title: Catalytic residues of RHEA:13065 (from MCSA:642)
  description: 'The catalytic residues that carry out RHEA:13065, joined from M-CSA entry 642. 6 residues,
    reused verbatim from the MCSA:642 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 642''s reactant set (CHEBI:15377, CHEBI:30616) equals Rhea side 13065_L exactly,
    and its product set (CHEBI:15378, CHEBI:43474, CHEBI:456216) equals side 13065_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
