  title: Catalytic residues of RHEA:16201 (from MCSA:305)
  description: 'The catalytic residues that carry out RHEA:16201, joined from M-CSA entry 305. 3 residues,
    reused verbatim from the MCSA:305 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 305''s reactant set (CHEBI:58406) equals Rhea side 16201_L exactly, and its product
    set (CHEBI:15361, CHEBI:15378, CHEBI:17836) equals side 16201_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
