    reused verbatim from the MCSA:331 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 331''s reactant set (CHEBI:61548) equals Rhea side 10716_L exactly, and its product
    set (CHEBI:58401) equals side 10716_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
