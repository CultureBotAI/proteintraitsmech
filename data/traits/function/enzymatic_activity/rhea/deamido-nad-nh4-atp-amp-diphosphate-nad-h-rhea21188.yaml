- graph_id: catalytic_residues_mcsa200
  title: Catalytic residues of RHEA:21188 (from MCSA:200)
  description: 'The catalytic residues that carry out RHEA:21188, joined from M-CSA entry 200. 2 residues,
    reused verbatim from the MCSA:200 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 200''s reactant set (CHEBI:28938, CHEBI:30616, CHEBI:58437) equals Rhea side
    21188_L exactly, and its product set (CHEBI:15378, CHEBI:33019, CHEBI:456215, CHEBI:57540) equals
    side 21188_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
