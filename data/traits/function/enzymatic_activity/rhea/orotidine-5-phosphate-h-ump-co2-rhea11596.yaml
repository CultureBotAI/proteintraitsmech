- graph_id: catalytic_residues_mcsa50
  title: Catalytic residues of RHEA:11596 (from MCSA:50)
  description: 'The catalytic residues that carry out RHEA:11596, joined from M-CSA entry 50. 6 residues,
    reused verbatim from the MCSA:50 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 50''s reactant set (CHEBI:15378, CHEBI:57538) equals Rhea side 11596_L exactly,
    and its product set (CHEBI:16526, CHEBI:57865) equals side 11596_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
