    reused verbatim from the MCSA:423 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 423''s reactant set (CHEBI:15377, CHEBI:83411) equals Rhea side 17633_L exactly,
    and its product set (CHEBI:30879, CHEBI:58720) equals side 17633_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
