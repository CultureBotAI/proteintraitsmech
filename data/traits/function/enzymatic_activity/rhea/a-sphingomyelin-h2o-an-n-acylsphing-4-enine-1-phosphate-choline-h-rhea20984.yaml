- graph_id: catalytic_residues_mcsa242
  title: Catalytic residues of RHEA:20984 (from MCSA:242)
  description: 'The catalytic residues that carry out RHEA:20984, joined from M-CSA entry 242. 11 residues,
    reused verbatim from the MCSA:242 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 242''s reactant set (CHEBI:15377, CHEBI:17636) equals Rhea side 20984_L exactly,
    and its product set (CHEBI:15354, CHEBI:15378, CHEBI:57674) equals side 20984_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
