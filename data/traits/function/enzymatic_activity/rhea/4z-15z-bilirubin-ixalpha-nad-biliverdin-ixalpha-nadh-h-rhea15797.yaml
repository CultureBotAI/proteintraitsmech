- graph_id: catalytic_residues_mcsa566
  title: Catalytic residues of RHEA:15797 (from MCSA:566)
  description: 'The catalytic residues that carry out RHEA:15797, joined from M-CSA entry 566. 6 residues,
    reused verbatim from the MCSA:566 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 566''s reactant set (CHEBI:15378, CHEBI:57945, CHEBI:57991) equals Rhea side
    15797_R exactly, and its product set (CHEBI:57540, CHEBI:57977) equals side 15797_L exactly. EC agreement
    bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the
    direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 15797_R. Both are correct:
    a Rhea master reaction is undirected, and M-CSA records the physiological direction. The disagreement
    is recorded, not reconciled.'
