- graph_id: catalytic_residues_mcsa476
  title: Catalytic residues of RHEA:17661 (from MCSA:476)
  description: 'The catalytic residues that carry out RHEA:17661, joined from M-CSA entry 476. 4 residues,
    reused verbatim from the MCSA:476 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 476''s reactant set (CHEBI:30031, CHEBI:30616, CHEBI:57287) equals Rhea side
    17661_L exactly, and its product set (CHEBI:43474, CHEBI:456216, CHEBI:57292) equals side 17661_R
    exactly. EC agreement bounded the candidates but was not sufficient on its own.'
