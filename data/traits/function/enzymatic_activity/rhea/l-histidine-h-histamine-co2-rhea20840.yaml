- graph_id: catalytic_residues_mcsa49
  title: Catalytic residues of RHEA:20840 (from MCSA:49)
  description: 'The catalytic residues that carry out RHEA:20840, joined from M-CSA entry 49. 6 residues,
    reused verbatim from the MCSA:49 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 49''s reactant set (CHEBI:15378, CHEBI:57595) equals Rhea side 20840_L exactly,
    and its product set (CHEBI:16526, CHEBI:58432) equals side 20840_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
