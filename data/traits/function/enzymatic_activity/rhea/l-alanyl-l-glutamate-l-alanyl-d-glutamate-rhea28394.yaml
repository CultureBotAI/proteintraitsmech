    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 957''s reactant set (CHEBI:61396) equals Rhea side 28394_L exactly, and its product
    set (CHEBI:61395) equals side 28394_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
