- graph_id: catalytic_residues_mcsa104
  title: Catalytic residues of RHEA:22152 (from MCSA:104)
  description: 'The catalytic residues that carry out RHEA:22152, joined from M-CSA entry 104. 7 residues,
    reused verbatim from the MCSA:104 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 104''s reactant set (CHEBI:16389, CHEBI:4167) equals Rhea side 22152_L exactly,
    and its product set (CHEBI:16217, CHEBI:17976) equals side 22152_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
