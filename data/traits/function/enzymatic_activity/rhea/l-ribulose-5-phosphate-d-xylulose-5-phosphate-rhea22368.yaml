- graph_id: catalytic_residues_mcsa273
  title: Catalytic residues of RHEA:22368 (from MCSA:273)
  description: 'The catalytic residues that carry out RHEA:22368, joined from M-CSA entry 273. 4 residues,
    reused verbatim from the MCSA:273 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 273''s reactant set (CHEBI:58226) equals Rhea side 22368_L exactly, and its product
    set (CHEBI:57737) equals side 22368_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
