    reused verbatim from the MCSA:270 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 270''s reactant set (CHEBI:58121) equals Rhea side 13677_L exactly, and its product
    set (CHEBI:57737) equals side 13677_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
