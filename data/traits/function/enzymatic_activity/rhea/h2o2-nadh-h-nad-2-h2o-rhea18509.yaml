- graph_id: catalytic_residues_mcsa895
  title: Catalytic residues of RHEA:18509 (from MCSA:895)
  description: 'The catalytic residues that carry out RHEA:18509, joined from M-CSA entry 895. 4 residues,
    reused verbatim from the MCSA:895 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 895''s reactant set (CHEBI:15378, CHEBI:16240, CHEBI:57945) equals Rhea side
    18509_L exactly, and its product set (CHEBI:15377, CHEBI:57540) equals side 18509_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
