    reused verbatim from the MCSA:977 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 977''s reactant set (CHEBI:15379, CHEBI:17996, CHEBI:57912, CHEBI:58307) equals
    Rhea side 26494_L exactly, and its product set (CHEBI:15377, CHEBI:57692, CHEBI:58713) equals side
    26494_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
