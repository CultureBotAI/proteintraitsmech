  description: 'The catalytic residues that carry out RHEA:21464, joined from M-CSA entry 284. 5 residues,
    reused verbatim from the MCSA:284 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 284''s reactant set (CHEBI:15377, CHEBI:15378, CHEBI:18022) equals Rhea side
    21464_L exactly, and its product set (CHEBI:16573, CHEBI:28938) equals side 21464_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
