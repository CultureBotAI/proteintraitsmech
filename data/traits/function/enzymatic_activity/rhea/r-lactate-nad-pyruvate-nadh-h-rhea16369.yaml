- graph_id: catalytic_residues_mcsa576
  title: Catalytic residues of RHEA:16369 (from MCSA:576)
  description: 'The catalytic residues that carry out RHEA:16369, joined from M-CSA entry 576. 4 residues,
    reused verbatim from the MCSA:576 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 576''s reactant set (CHEBI:16004, CHEBI:57540) equals Rhea side 16369_L exactly,
    and its product set (CHEBI:15361, CHEBI:15378, CHEBI:57945) equals side 16369_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
