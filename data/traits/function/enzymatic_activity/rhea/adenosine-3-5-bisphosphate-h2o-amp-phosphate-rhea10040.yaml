- graph_id: catalytic_residues_mcsa904
  title: Catalytic residues of RHEA:10040 (from MCSA:904)
  description: 'The catalytic residues that carry out RHEA:10040, joined from M-CSA entry 904. 7 residues,
    reused verbatim from the MCSA:904 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 904''s reactant set (CHEBI:15377, CHEBI:58343) equals Rhea side 10040_L exactly,
    and its product set (CHEBI:43474, CHEBI:456215) equals side 10040_R exactly. EC agreement bounded
    the candidates but was not sufficient on its own.'
