- graph_id: catalytic_residues_mcsa166
  title: Catalytic residues of RHEA:22324 (from MCSA:166)
  description: 'The catalytic residues that carry out RHEA:22324, joined from M-CSA entry 166. 7 residues,
    reused verbatim from the MCSA:166 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 166''s reactant set (CHEBI:15377, CHEBI:57463) equals Rhea side 22324_L exactly,
    and its product set (CHEBI:57461) equals side 22324_R exactly. EC agreement bounded the candidates
    but was not sufficient on its own.'
