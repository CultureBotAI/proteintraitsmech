    reused verbatim from the MCSA:488 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 488''s reactant set (CHEBI:62346) equals Rhea side 23160_L exactly, and its product
    set (CHEBI:17897) equals side 23160_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
