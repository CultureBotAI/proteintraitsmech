    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 334''s reactant set (CHEBI:57609) equals Rhea side 15393_L exactly, and its product
    set (CHEBI:57791) equals side 15393_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
