- graph_id: catalytic_residues_mcsa110
  title: Catalytic residues of RHEA:21816 (from MCSA:110)
  description: 'The catalytic residues that carry out RHEA:21816, joined from M-CSA entry 110. 3 residues,
    reused verbatim from the MCSA:110 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 110''s reactant set (CHEBI:15377, CHEBI:15379, CHEBI:59871) equals Rhea side
    21816_L exactly, and its product set (CHEBI:16240, CHEBI:28938, CHEBI:35179) equals side 21816_R exactly.
    EC agreement bounded the candidates but was not sufficient on its own.'
