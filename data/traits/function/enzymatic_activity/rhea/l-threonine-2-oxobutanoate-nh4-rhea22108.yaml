- graph_id: catalytic_residues_mcsa886
  title: Catalytic residues of RHEA:22108 (from MCSA:886)
  description: 'The catalytic residues that carry out RHEA:22108, joined from M-CSA entry 886. 2 residues,
    reused verbatim from the MCSA:886 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 886''s reactant set (CHEBI:57926) equals Rhea side 22108_L exactly, and its product
    set (CHEBI:16763, CHEBI:28938) equals side 22108_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
