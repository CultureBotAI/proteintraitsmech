- graph_id: catalytic_residues_mcsa30
  title: Catalytic residues of RHEA:11844 (from MCSA:30)
  description: 'The catalytic residues that carry out RHEA:11844, joined from M-CSA entry 30. 4 residues,
    reused verbatim from the MCSA:30 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 30''s reactant set (CHEBI:15361, CHEBI:57287) equals Rhea side 11844_R exactly,
    and its product set (CHEBI:15740, CHEBI:57288) equals side 11844_L exactly. EC agreement bounded the
    candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the direction opposite
    to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 11844_R. Both are correct: a Rhea master
    reaction is undirected, and M-CSA records the physiological direction. The disagreement is recorded,
    not reconciled.'
