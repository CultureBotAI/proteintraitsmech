- graph_id: catalytic_residues_mcsa326
  title: Catalytic residues of RHEA:18157 (from MCSA:326)
  description: 'The catalytic residues that carry out RHEA:18157, joined from M-CSA entry 326. 4 residues,
    reused verbatim from the MCSA:326 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 326''s reactant set (CHEBI:15378, CHEBI:456216, CHEBI:58702) equals Rhea side
    18157_R exactly, and its product set (CHEBI:15361, CHEBI:30616) equals side 18157_L exactly. EC agreement
    bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the
    direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 18157_R. Both are correct:
    a Rhea master reaction is undirected, and M-CSA records the physiological direction. The disagreement
    is recorded, not reconciled.'
