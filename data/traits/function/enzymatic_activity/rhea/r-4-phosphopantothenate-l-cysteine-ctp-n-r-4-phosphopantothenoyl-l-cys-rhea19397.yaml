- graph_id: catalytic_residues_mcsa772
  title: Catalytic residues of RHEA:19397 (from MCSA:772)
  description: 'The catalytic residues that carry out RHEA:19397, joined from M-CSA entry 772. 1 residues,
    reused verbatim from the MCSA:772 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 772''s reactant set (CHEBI:10986, CHEBI:35235, CHEBI:37563) equals Rhea side
    19397_L exactly, and its product set (CHEBI:15378, CHEBI:33019, CHEBI:59458, CHEBI:60377) equals side
    19397_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
