- graph_id: catalytic_residues_mcsa296
  title: Catalytic residues of RHEA:13361 (from MCSA:296)
  description: 'The catalytic residues that carry out RHEA:13361, joined from M-CSA entry 296. 2 residues,
    reused verbatim from the MCSA:296 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 296''s reactant set (CHEBI:15378, CHEBI:37563, CHEBI:57597) equals Rhea side
    13361_L exactly, and its product set (CHEBI:33019, CHEBI:58311) equals side 13361_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
