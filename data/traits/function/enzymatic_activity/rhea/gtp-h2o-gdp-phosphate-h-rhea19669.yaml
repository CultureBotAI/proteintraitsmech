- graph_id: catalytic_residues_mcsa535
  title: Catalytic residues of RHEA:19669 (from MCSA:535)
  description: 'The catalytic residues that carry out RHEA:19669, joined from M-CSA entry 535. 5 residues,
    reused verbatim from the MCSA:535 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 535''s reactant set (CHEBI:15377, CHEBI:37565) equals Rhea side 19669_L exactly,
    and its product set (CHEBI:15378, CHEBI:43474, CHEBI:58189) equals side 19669_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
