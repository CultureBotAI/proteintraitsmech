- graph_id: catalytic_residues_mcsa315
  title: Catalytic residues of RHEA:16105 (from MCSA:315)
  description: 'The catalytic residues that carry out RHEA:16105, joined from M-CSA entry 315. 4 residues,
    reused verbatim from the MCSA:315 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 315''s reactant set (CHEBI:15377, CHEBI:58856) equals Rhea side 16105_R exactly,
    and its product set (CHEBI:57318) equals side 16105_L exactly. EC agreement bounded the candidates
    but was not sufficient on its own. NOTE: M-CSA curates this reaction in the direction opposite to
    Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 16105_R. Both are correct: a Rhea master reaction
    is undirected, and M-CSA records the physiological direction. The disagreement is recorded, not reconciled.'
