- graph_id: catalytic_residues_mcsa569
  title: Catalytic residues of RHEA:12460 (from MCSA:569)
  description: 'The catalytic residues that carry out RHEA:12460, joined from M-CSA entry 569. 4 residues,
    reused verbatim from the MCSA:569 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 569''s reactant set (CHEBI:15589) equals Rhea side 12460_L exactly, and its product
    set (CHEBI:15377, CHEBI:29806) equals side 12460_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
