  title: Catalytic residues of RHEA:18821 (from MCSA:605)
  description: 'The catalytic residues that carry out RHEA:18821, joined from M-CSA entry 605. 4 residues,
    reused verbatim from the MCSA:605 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 605''s reactant set (CHEBI:15354, CHEBI:57288) equals Rhea side 18821_L exactly,
    and its product set (CHEBI:15355, CHEBI:57287) equals side 18821_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
