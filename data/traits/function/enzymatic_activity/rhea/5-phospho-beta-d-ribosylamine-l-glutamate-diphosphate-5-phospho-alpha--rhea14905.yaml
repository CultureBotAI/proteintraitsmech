- graph_id: catalytic_residues_mcsa214
  title: Catalytic residues of RHEA:14905 (from MCSA:214)
  description: 'The catalytic residues that carry out RHEA:14905, joined from M-CSA entry 214. 5 residues,
    reused verbatim from the MCSA:214 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 214''s reactant set (CHEBI:15377, CHEBI:58017, CHEBI:58359) equals Rhea side
    14905_R exactly, and its product set (CHEBI:29985, CHEBI:33019, CHEBI:58681) equals side 14905_L exactly.
    EC agreement bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction
    in the direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 14905_R. Both
    are correct: a Rhea master reaction is undirected, and M-CSA records the physiological direction.
    The disagreement is recorded, not reconciled.'
