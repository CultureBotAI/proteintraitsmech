- graph_id: catalytic_residues_mcsa79
  title: Catalytic residues of RHEA:11196 (from MCSA:79)
  description: 'The catalytic residues that carry out RHEA:11196, joined from M-CSA entry 79. 2 residues,
    reused verbatim from the MCSA:79 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 79''s reactant set (CHEBI:15890, CHEBI:57502) equals Rhea side 11196_L exactly,
    and its product set (CHEBI:15378, CHEBI:32544, CHEBI:57918) equals side 11196_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
