- graph_id: catalytic_residues_mcsa146
  title: Catalytic residues of RHEA:21000 (from MCSA:146)
  description: 'The catalytic residues that carry out RHEA:21000, joined from M-CSA entry 146. 3 residues,
    reused verbatim from the MCSA:146 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 146''s reactant set (CHEBI:16164, CHEBI:16746) equals Rhea side 21000_L exactly,
    and its product set (CHEBI:16204, CHEBI:16746) equals side 21000_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
