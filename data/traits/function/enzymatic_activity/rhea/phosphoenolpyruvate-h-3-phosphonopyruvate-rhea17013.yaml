- graph_id: catalytic_residues_mcsa271
  title: Catalytic residues of RHEA:17013 (from MCSA:271)
  description: 'The catalytic residues that carry out RHEA:17013, joined from M-CSA entry 271. 12 residues,
    reused verbatim from the MCSA:271 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 271''s reactant set (CHEBI:15378, CHEBI:58702) equals Rhea side 17013_L exactly,
    and its product set (CHEBI:71402) equals side 17013_R exactly. EC agreement bounded the candidates
    but was not sufficient on its own.'
