- graph_id: catalytic_residues_mcsa391
  title: Catalytic residues of RHEA:10800 (from MCSA:391)
  description: 'The catalytic residues that carry out RHEA:10800, joined from M-CSA entry 391. 3 residues,
    reused verbatim from the MCSA:391 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 391''s reactant set (CHEBI:33019, CHEBI:57464) equals Rhea side 10800_L exactly,
    and its product set (CHEBI:17712, CHEBI:58017) equals side 10800_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
