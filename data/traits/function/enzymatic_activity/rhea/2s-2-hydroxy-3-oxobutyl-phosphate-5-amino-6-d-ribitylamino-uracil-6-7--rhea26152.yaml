- graph_id: catalytic_residues_mcsa909
  title: Catalytic residues of RHEA:26152 (from MCSA:909)
  description: 'The catalytic residues that carry out RHEA:26152, joined from M-CSA entry 909. 1 residues,
    reused verbatim from the MCSA:909 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 909''s reactant set (CHEBI:15934, CHEBI:58830) equals Rhea side 26152_L exactly,
    and its product set (CHEBI:15377, CHEBI:15378, CHEBI:43474, CHEBI:58201) equals side 26152_R exactly.
    EC agreement bounded the candidates but was not sufficient on its own.'
