- graph_id: catalytic_residues_mcsa923
  title: Catalytic residues of RHEA:14965 (from MCSA:923)
  description: 'The catalytic residues that carry out RHEA:14965, joined from M-CSA entry 923. 2 residues,
    reused verbatim from the MCSA:923 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 923''s reactant set (CHEBI:15377, CHEBI:59918) equals Rhea side 14965_L exactly,
    and its product set (CHEBI:15378, CHEBI:29067, CHEBI:43474) equals side 14965_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
