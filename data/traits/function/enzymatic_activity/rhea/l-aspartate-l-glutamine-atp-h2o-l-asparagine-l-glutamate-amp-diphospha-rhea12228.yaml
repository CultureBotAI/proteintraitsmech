- graph_id: catalytic_residues_mcsa302
  title: Catalytic residues of RHEA:12228 (from MCSA:302)
  description: 'The catalytic residues that carry out RHEA:12228, joined from M-CSA entry 302. 6 residues,
    reused verbatim from the MCSA:302 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 302''s reactant set (CHEBI:15377, CHEBI:29991, CHEBI:30616, CHEBI:58359) equals
    Rhea side 12228_L exactly, and its product set (CHEBI:15378, CHEBI:29985, CHEBI:33019, CHEBI:456215,
    CHEBI:58048) equals side 12228_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
