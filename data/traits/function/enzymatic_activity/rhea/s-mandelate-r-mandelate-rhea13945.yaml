- graph_id: catalytic_residues_mcsa187
  title: Catalytic residues of RHEA:13945 (from MCSA:187)
  description: 'The catalytic residues that carry out RHEA:13945, joined from M-CSA entry 187. 9 residues,
    reused verbatim from the MCSA:187 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 187''s reactant set (CHEBI:32382) equals Rhea side 13945_R exactly, and its product
    set (CHEBI:17756) equals side 13945_L exactly. EC agreement bounded the candidates but was not sufficient
    on its own. NOTE: M-CSA curates this reaction in the direction opposite to Rhea''s left-hand side
    — M-CSA''s reactants are Rhea''s 13945_R. Both are correct: a Rhea master reaction is undirected,
    and M-CSA records the physiological direction. The disagreement is recorded, not reconciled.'
