- graph_id: catalytic_residues_mcsa65
  title: Catalytic residues of RHEA:15753 (from MCSA:65)
  description: 'The catalytic residues that carry out RHEA:15753, joined from M-CSA entry 65. 5 residues,
    reused verbatim from the MCSA:65 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 65''s reactant set (CHEBI:29991, CHEBI:37565, CHEBI:58053) equals Rhea side 15753_L
    exactly, and its product set (CHEBI:15378, CHEBI:43474, CHEBI:57567, CHEBI:58189) equals side 15753_R
    exactly. EC agreement bounded the candidates but was not sufficient on its own.'
