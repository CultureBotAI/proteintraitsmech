- graph_id: catalytic_residues_mcsa521
  title: Catalytic residues of RHEA:15757 (from MCSA:521)
  description: 'The catalytic residues that carry out RHEA:15757, joined from M-CSA entry 521. 2 residues,
    reused verbatim from the MCSA:521 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 521''s reactant set (CHEBI:57476, CHEBI:57540) equals Rhea side 15757_L exactly,
    and its product set (CHEBI:15378, CHEBI:537519, CHEBI:57945) equals side 15757_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
