- graph_id: catalytic_residues_mcsa713
  title: Catalytic residues of RHEA:10112 (from MCSA:713)
  description: 'The catalytic residues that carry out RHEA:10112, joined from M-CSA entry 713. 1 residues,
    reused verbatim from the MCSA:713 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 713''s reactant set (CHEBI:33384, CHEBI:58199) equals Rhea side 10112_L exactly,
    and its product set (CHEBI:15377, CHEBI:58161) equals side 10112_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
