    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 741''s reactant set (CHEBI:15377, CHEBI:57540, CHEBI:57699) equals Rhea side
    20641_L exactly, and its product set (CHEBI:15378, CHEBI:57595, CHEBI:57945) equals side 20641_R exactly.
