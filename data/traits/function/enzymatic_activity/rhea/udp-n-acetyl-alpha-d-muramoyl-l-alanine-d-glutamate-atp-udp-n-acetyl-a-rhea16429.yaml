    from EC: M-CSA entry 317''s reactant set (CHEBI:29986, CHEBI:30616, CHEBI:83898) equals Rhea side
    16429_L exactly, and its product set (CHEBI:15378, CHEBI:43474, CHEBI:456216, CHEBI:83900) equals
    side 16429_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
