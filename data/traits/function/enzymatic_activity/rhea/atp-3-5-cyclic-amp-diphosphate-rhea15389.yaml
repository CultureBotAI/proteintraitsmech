- graph_id: catalytic_residues_mcsa58
  title: Catalytic residues of RHEA:15389 (from MCSA:58)
  description: 'The catalytic residues that carry out RHEA:15389, joined from M-CSA entry 58. 5 residues,
    reused verbatim from the MCSA:58 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 58''s reactant set (CHEBI:30616) equals Rhea side 15389_L exactly, and its product
    set (CHEBI:33019, CHEBI:58165) equals side 15389_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
