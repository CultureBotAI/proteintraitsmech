- graph_id: catalytic_residues_mcsa220
  title: Catalytic residues of RHEA:23368 (from MCSA:220)
  description: 'The catalytic residues that carry out RHEA:23368, joined from M-CSA entry 220. 7 residues,
    reused verbatim from the MCSA:220 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 220''s reactant set (CHEBI:15378, CHEBI:36656) equals Rhea side 23368_L exactly,
    and its product set (CHEBI:16526, CHEBI:17169) equals side 23368_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
