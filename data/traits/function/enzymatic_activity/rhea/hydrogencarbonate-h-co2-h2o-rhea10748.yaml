    from EC: M-CSA entry 517''s reactant set (CHEBI:15377, CHEBI:16526) equals Rhea side 10748_R exactly,
    and its product set (CHEBI:15378, CHEBI:17544) equals side 10748_L exactly. EC agreement bounded the
