    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 151''s reactant set (CHEBI:30616, CHEBI:44841) equals Rhea side 11412_L exactly,
    and its product set (CHEBI:15378, CHEBI:456215, CHEBI:72950) equals side 11412_R exactly. EC agreement
