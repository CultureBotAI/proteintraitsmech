    from EC: M-CSA entry 883''s reactant set (CHEBI:30616, CHEBI:57416) equals Rhea side 11224_L exactly,
    and its product set (CHEBI:15378, CHEBI:43474, CHEBI:456216, CHEBI:57822) equals side 11224_R exactly.
