- graph_id: catalytic_residues_mcsa290
  title: Catalytic residues of RHEA:12973 (from MCSA:290)
  description: 'The catalytic residues that carry out RHEA:12973, joined from M-CSA entry 290. 5 residues,
    reused verbatim from the MCSA:290 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 290''s reactant set (CHEBI:30616, CHEBI:456215) equals Rhea side 12973_L exactly,
    and its product set (CHEBI:456216) equals side 12973_R exactly. EC agreement bounded the candidates
    but was not sufficient on its own.'
