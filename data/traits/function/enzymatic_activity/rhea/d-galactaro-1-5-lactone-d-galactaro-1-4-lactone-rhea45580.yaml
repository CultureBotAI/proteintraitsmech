- graph_id: catalytic_residues_mcsa861
  title: Catalytic residues of RHEA:45580 (from MCSA:861)
  description: 'The catalytic residues that carry out RHEA:45580, joined from M-CSA entry 861. 1 residues,
    reused verbatim from the MCSA:861 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 861''s reactant set (CHEBI:83383) equals Rhea side 45580_L exactly, and its product
    set (CHEBI:85317) equals side 45580_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
