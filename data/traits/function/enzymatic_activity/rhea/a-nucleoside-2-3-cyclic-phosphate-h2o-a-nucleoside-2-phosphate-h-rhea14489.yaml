- graph_id: catalytic_residues_mcsa794
  title: Catalytic residues of RHEA:14489 (from MCSA:794)
  description: 'The catalytic residues that carry out RHEA:14489, joined from M-CSA entry 794. 6 residues,
    reused verbatim from the MCSA:794 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 794''s reactant set (CHEBI:15377, CHEBI:66954) equals Rhea side 14489_L exactly,
    and its product set (CHEBI:15378, CHEBI:78552) equals side 14489_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
