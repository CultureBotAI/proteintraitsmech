- graph_id: catalytic_residues_mcsa725
  title: Catalytic residues of RHEA:15937 (from MCSA:725)
  description: 'The catalytic residues that carry out RHEA:15937, joined from M-CSA entry 725. 4 residues,
    reused verbatim from the MCSA:725 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 725''s reactant set (CHEBI:15734, CHEBI:58349) equals Rhea side 15937_L exactly,
    and its product set (CHEBI:15378, CHEBI:17478, CHEBI:57783) equals side 15937_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
