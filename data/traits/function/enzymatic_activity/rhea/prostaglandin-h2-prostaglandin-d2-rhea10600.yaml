  description: 'The catalytic residues that carry out RHEA:10600, joined from M-CSA entry 719. 3 residues,
    reused verbatim from the MCSA:719 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 719''s reactant set (CHEBI:57405) equals Rhea side 10600_L exactly, and its product
    set (CHEBI:57406) equals side 10600_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
