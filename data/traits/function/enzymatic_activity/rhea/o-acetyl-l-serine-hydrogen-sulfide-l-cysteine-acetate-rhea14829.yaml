- graph_id: catalytic_residues_mcsa865
  title: Catalytic residues of RHEA:14829 (from MCSA:865)
  description: 'The catalytic residues that carry out RHEA:14829, joined from M-CSA entry 865. 2 residues,
    reused verbatim from the MCSA:865 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 865''s reactant set (CHEBI:29919, CHEBI:58340) equals Rhea side 14829_L exactly,
    and its product set (CHEBI:30089, CHEBI:35235) equals side 14829_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
