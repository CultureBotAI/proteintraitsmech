- graph_id: catalytic_residues_mcsa132
  title: Catalytic residues of RHEA:17181 (from MCSA:132)
  description: 'The catalytic residues that carry out RHEA:17181, joined from M-CSA entry 132. 5 residues,
    reused verbatim from the MCSA:132 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 132''s reactant set (CHEBI:15379, CHEBI:17176, CHEBI:57618) equals Rhea side
    17181_L exactly, and its product set (CHEBI:15377, CHEBI:15378, CHEBI:30212, CHEBI:57560, CHEBI:58210)
    equals side 17181_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
