    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 368''s reactant set (CHEBI:66914) equals Rhea side 24132_L exactly, and its product
    set (CHEBI:66915) equals side 24132_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
