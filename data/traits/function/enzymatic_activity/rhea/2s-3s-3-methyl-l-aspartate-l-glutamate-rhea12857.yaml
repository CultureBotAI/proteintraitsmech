- graph_id: catalytic_residues_mcsa63
  title: Catalytic residues of RHEA:12857 (from MCSA:63)
  description: 'The catalytic residues that carry out RHEA:12857, joined from M-CSA entry 63. 4 residues,
    reused verbatim from the MCSA:63 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 63''s reactant set (CHEBI:29985) equals Rhea side 12857_R exactly, and its product
    set (CHEBI:58724) equals side 12857_L exactly. EC agreement bounded the candidates but was not sufficient
    on its own. NOTE: M-CSA curates this reaction in the direction opposite to Rhea''s left-hand side
    — M-CSA''s reactants are Rhea''s 12857_R. Both are correct: a Rhea master reaction is undirected,
    and M-CSA records the physiological direction. The disagreement is recorded, not reconciled.'
