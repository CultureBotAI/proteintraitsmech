- graph_id: catalytic_residues_mcsa892
  title: Catalytic residues of RHEA:30059 (from MCSA:892)
  description: 'The catalytic residues that carry out RHEA:30059, joined from M-CSA entry 892. 2 residues,
    reused verbatim from the MCSA:892 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 892''s reactant set (CHEBI:29806, CHEBI:30864) equals Rhea side 30059_L exactly,
    and its product set (CHEBI:30031, CHEBI:30839) equals side 30059_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
