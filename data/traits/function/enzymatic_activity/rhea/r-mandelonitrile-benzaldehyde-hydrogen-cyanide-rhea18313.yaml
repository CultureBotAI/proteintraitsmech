    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 941''s reactant set (CHEBI:18450) equals Rhea side 18313_L exactly, and its product
    set (CHEBI:17169, CHEBI:18407) equals side 18313_R exactly. EC agreement bounded the candidates but
