- graph_id: catalytic_residues_mcsa343
  title: Catalytic residues of RHEA:21536 (from MCSA:343)
  description: 'The catalytic residues that carry out RHEA:21536, joined from M-CSA entry 343. 4 residues,
    reused verbatim from the MCSA:343 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 343''s reactant set (CHEBI:15377, CHEBI:57346) equals Rhea side 21536_R exactly,
    and its product set (CHEBI:43074) equals side 21536_L exactly. EC agreement bounded the candidates
    but was not sufficient on its own. NOTE: M-CSA curates this reaction in the direction opposite to
    Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 21536_R. Both are correct: a Rhea master reaction
    is undirected, and M-CSA records the physiological direction. The disagreement is recorded, not reconciled.'
