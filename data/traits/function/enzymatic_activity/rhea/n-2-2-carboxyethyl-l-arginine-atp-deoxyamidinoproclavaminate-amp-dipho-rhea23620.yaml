    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 303''s reactant set (CHEBI:30616, CHEBI:57304) equals Rhea side 23620_L exactly,
    and its product set (CHEBI:15378, CHEBI:33019, CHEBI:456215, CHEBI:57303) equals side 23620_R exactly.
    EC agreement bounded the candidates but was not sufficient on its own.'
