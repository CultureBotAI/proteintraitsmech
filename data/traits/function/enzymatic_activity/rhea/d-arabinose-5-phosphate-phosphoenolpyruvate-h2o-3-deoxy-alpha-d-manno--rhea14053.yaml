- graph_id: catalytic_residues_mcsa614
  title: Catalytic residues of RHEA:14053 (from MCSA:614)
  description: 'The catalytic residues that carry out RHEA:14053, joined from M-CSA entry 614. 3 residues,
    reused verbatim from the MCSA:614 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 614''s reactant set (CHEBI:15377, CHEBI:57693, CHEBI:58702) equals Rhea side
    14053_L exactly, and its product set (CHEBI:43474, CHEBI:85985) equals side 14053_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
