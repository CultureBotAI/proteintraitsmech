- graph_id: catalytic_residues_mcsa877
  title: Catalytic residues of RHEA:24568 (from MCSA:877)
  description: 'The catalytic residues that carry out RHEA:24568, joined from M-CSA entry 877. 2 residues,
    reused verbatim from the MCSA:877 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 877''s reactant set (CHEBI:15377, CHEBI:58534) equals Rhea side 24568_L exactly,
    and its product set (CHEBI:30879, CHEBI:91004) equals side 24568_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
