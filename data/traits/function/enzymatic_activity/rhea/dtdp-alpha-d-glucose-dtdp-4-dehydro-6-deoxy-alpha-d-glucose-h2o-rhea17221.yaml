- graph_id: catalytic_residues_mcsa228
  title: Catalytic residues of RHEA:17221 (from MCSA:228)
  description: 'The catalytic residues that carry out RHEA:17221, joined from M-CSA entry 228. 5 residues,
    reused verbatim from the MCSA:228 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 228''s reactant set (CHEBI:57477) equals Rhea side 17221_L exactly, and its product
    set (CHEBI:15377, CHEBI:57649) equals side 17221_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
