- graph_id: catalytic_residues_mcsa873
  title: Catalytic residues of RHEA:10380 (from MCSA:873)
  description: 'The catalytic residues that carry out RHEA:10380, joined from M-CSA entry 873. 2 residues,
    reused verbatim from the MCSA:873 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 873''s reactant set (CHEBI:30839, CHEBI:58017) equals Rhea side 10380_R exactly,
    and its product set (CHEBI:33019, CHEBI:57538) equals side 10380_L exactly. EC agreement bounded the
    candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the direction opposite
    to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 10380_R. Both are correct: a Rhea master
    reaction is undirected, and M-CSA records the physiological direction. The disagreement is recorded,
    not reconciled.'
