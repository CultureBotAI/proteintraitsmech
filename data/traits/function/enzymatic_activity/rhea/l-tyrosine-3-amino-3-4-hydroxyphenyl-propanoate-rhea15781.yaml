- graph_id: catalytic_residues_mcsa245
  title: Catalytic residues of RHEA:15781 (from MCSA:245)
  description: 'The catalytic residues that carry out RHEA:15781, joined from M-CSA entry 245. 2 residues,
    reused verbatim from the MCSA:245 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 245''s reactant set (CHEBI:58315) equals Rhea side 15781_L exactly, and its product
    set (CHEBI:57956) equals side 15781_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
