- graph_id: catalytic_residues_mcsa811
  title: Catalytic residues of RHEA:13509 (from MCSA:811)
  description: 'The catalytic residues that carry out RHEA:13509, joined from M-CSA entry 811. 1 residues,
    reused verbatim from the MCSA:811 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 811''s reactant set (CHEBI:15378, CHEBI:46398, CHEBI:57776) equals Rhea side
    13509_L exactly, and its product set (CHEBI:33019, CHEBI:57705) equals side 13509_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
