    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 275''s reactant set (CHEBI:15361, CHEBI:15377, CHEBI:16389) equals Rhea side
    27405_L exactly, and its product set (CHEBI:16526, CHEBI:17976, CHEBI:30089) equals side 27405_R exactly.
