- graph_id: catalytic_residues_mcsa730
  title: Catalytic residues of RHEA:10840 (from MCSA:730)
  description: 'The catalytic residues that carry out RHEA:10840, joined from M-CSA entry 730. 1 residues,
    reused verbatim from the MCSA:730 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 730''s reactant set (CHEBI:15377, CHEBI:57590) equals Rhea side 10840_L exactly,
    and its product set (CHEBI:43474, CHEBI:57926) equals side 10840_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
