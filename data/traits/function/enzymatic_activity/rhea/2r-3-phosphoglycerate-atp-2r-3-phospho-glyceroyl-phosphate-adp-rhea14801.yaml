- graph_id: catalytic_residues_mcsa40
  title: Catalytic residues of RHEA:14801 (from MCSA:40)
  description: 'The catalytic residues that carry out RHEA:14801, joined from M-CSA entry 40. 4 residues,
    reused verbatim from the MCSA:40 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 40''s reactant set (CHEBI:456216, CHEBI:57604) equals Rhea side 14801_R exactly,
    and its product set (CHEBI:30616, CHEBI:58272) equals side 14801_L exactly. EC agreement bounded the
    candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the direction opposite
    to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 14801_R. Both are correct: a Rhea master
    reaction is undirected, and M-CSA records the physiological direction. The disagreement is recorded,
    not reconciled.'
