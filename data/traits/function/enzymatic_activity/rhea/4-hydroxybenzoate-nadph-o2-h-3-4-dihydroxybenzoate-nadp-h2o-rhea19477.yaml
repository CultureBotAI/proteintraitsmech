- graph_id: catalytic_residues_mcsa131
  title: Catalytic residues of RHEA:19477 (from MCSA:131)
  description: 'The catalytic residues that carry out RHEA:19477, joined from M-CSA entry 131. 5 residues,
    reused verbatim from the MCSA:131 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 131''s reactant set (CHEBI:15378, CHEBI:15379, CHEBI:17879, CHEBI:57783) equals
    Rhea side 19477_L exactly, and its product set (CHEBI:15377, CHEBI:36241, CHEBI:58349) equals side
    19477_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
