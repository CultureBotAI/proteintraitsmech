- graph_id: catalytic_residues_mcsa491
  title: Catalytic residues of RHEA:17869 (from MCSA:491)
  description: 'The catalytic residues that carry out RHEA:17869, joined from M-CSA entry 491. 2 residues,
    reused verbatim from the MCSA:491 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 491''s reactant set (CHEBI:28889, CHEBI:57540) equals Rhea side 17869_L exactly,
    and its product set (CHEBI:15378, CHEBI:30156, CHEBI:57945) equals side 17869_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
