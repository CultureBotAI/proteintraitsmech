- graph_id: catalytic_residues_mcsa619
  title: Catalytic residues of RHEA:10300 (from MCSA:619)
  description: 'The catalytic residues that carry out RHEA:10300, joined from M-CSA entry 619. 2 residues,
    reused verbatim from the MCSA:619 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 619''s reactant set (CHEBI:43474, CHEBI:57540, CHEBI:59776) equals Rhea side
    10300_L exactly, and its product set (CHEBI:15378, CHEBI:57604, CHEBI:57945) equals side 10300_R exactly.
    EC agreement bounded the candidates but was not sufficient on its own.'
