- graph_id: catalytic_residues_mcsa231
  title: Catalytic residues of RHEA:16509 (from MCSA:231)
  description: 'The catalytic residues that carry out RHEA:16509, joined from M-CSA entry 231. 6 residues,
    reused verbatim from the MCSA:231 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 231''s reactant set (CHEBI:15378, CHEBI:30623) equals Rhea side 16509_L exactly,
    and its product set (CHEBI:15740, CHEBI:16526) equals side 16509_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
