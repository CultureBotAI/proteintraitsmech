- graph_id: catalytic_residues_mcsa601
  title: Catalytic residues of RHEA:28218 (from MCSA:601)
  description: 'The catalytic residues that carry out RHEA:28218, joined from M-CSA entry 601. 2 residues,
    reused verbatim from the MCSA:601 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 601''s reactant set (CHEBI:15378, CHEBI:16240, CHEBI:17996) equals Rhea side
    28218_L exactly, and its product set (CHEBI:15377, CHEBI:24757) equals side 28218_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
