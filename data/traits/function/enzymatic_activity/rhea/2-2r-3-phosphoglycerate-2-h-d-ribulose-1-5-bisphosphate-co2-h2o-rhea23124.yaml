- graph_id: catalytic_residues_mcsa797
  title: Catalytic residues of RHEA:23124 (from MCSA:797)
  description: 'The catalytic residues that carry out RHEA:23124, joined from M-CSA entry 797. 7 residues,
    reused verbatim from the MCSA:797 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 797''s reactant set (CHEBI:15377, CHEBI:16526, CHEBI:57870) equals Rhea side
    23124_R exactly, and its product set (CHEBI:15378, CHEBI:58272) equals side 23124_L exactly. EC agreement
    bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the
    direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 23124_R. Both are correct:
    a Rhea master reaction is undirected, and M-CSA records the physiological direction. The disagreement
    is recorded, not reconciled.'
