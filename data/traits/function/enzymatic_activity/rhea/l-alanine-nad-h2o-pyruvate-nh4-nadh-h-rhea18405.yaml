    from EC: M-CSA entry 67''s reactant set (CHEBI:15377, CHEBI:57540, CHEBI:57972) equals Rhea side 18405_L
    exactly, and its product set (CHEBI:15361, CHEBI:15378, CHEBI:28938, CHEBI:57945) equals side 18405_R
