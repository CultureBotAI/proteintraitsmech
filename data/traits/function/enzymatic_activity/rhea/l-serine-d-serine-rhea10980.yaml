- graph_id: catalytic_residues_mcsa330
  title: Catalytic residues of RHEA:10980 (from MCSA:330)
  description: 'The catalytic residues that carry out RHEA:10980, joined from M-CSA entry 330. 6 residues,
    reused verbatim from the MCSA:330 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 330''s reactant set (CHEBI:33384) equals Rhea side 10980_L exactly, and its product
    set (CHEBI:35247) equals side 10980_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
