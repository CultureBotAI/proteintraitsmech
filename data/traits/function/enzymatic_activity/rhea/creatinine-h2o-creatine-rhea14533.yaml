- graph_id: catalytic_residues_mcsa720
  title: Catalytic residues of RHEA:14533 (from MCSA:720)
  description: 'The catalytic residues that carry out RHEA:14533, joined from M-CSA entry 720. 7 residues,
    reused verbatim from the MCSA:720 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 720''s reactant set (CHEBI:15377, CHEBI:16737) equals Rhea side 14533_L exactly,
    and its product set (CHEBI:57947) equals side 14533_R exactly. EC agreement bounded the candidates
    but was not sufficient on its own.'
