- graph_id: catalytic_residues_mcsa107
  title: Catalytic residues of RHEA:48880 (from MCSA:107)
  description: 'The catalytic residues that carry out RHEA:48880, joined from M-CSA entry 107. 4 residues,
    reused verbatim from the MCSA:107 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 107''s reactant set (CHEBI:132124, CHEBI:15377, CHEBI:17245) equals Rhea side
    48880_L exactly, and its product set (CHEBI:16526, CHEBI:24646) equals side 48880_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
