    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 229''s reactant set (CHEBI:15980, CHEBI:30616, CHEBI:57966) equals Rhea side
    10912_L exactly, and its product set (CHEBI:15378, CHEBI:29032, CHEBI:33019, CHEBI:456215) equals
    side 10912_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
