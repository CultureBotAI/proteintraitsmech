- graph_id: catalytic_residues_mcsa622
  title: Catalytic residues of RHEA:18889 (from MCSA:622)
  description: 'The catalytic residues that carry out RHEA:18889, joined from M-CSA entry 622. 2 residues,
    reused verbatim from the MCSA:622 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 622''s reactant set (CHEBI:58885, CHEBI:61548) equals Rhea side 18889_L exactly,
    and its product set (CHEBI:15378, CHEBI:58223, CHEBI:58429) equals side 18889_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
