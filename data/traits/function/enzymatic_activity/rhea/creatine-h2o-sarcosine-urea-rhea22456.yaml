- graph_id: catalytic_residues_mcsa96
  title: Catalytic residues of RHEA:22456 (from MCSA:96)
  description: 'The catalytic residues that carry out RHEA:22456, joined from M-CSA entry 96. 3 residues,
    reused verbatim from the MCSA:96 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 96''s reactant set (CHEBI:15377, CHEBI:57947) equals Rhea side 22456_L exactly,
    and its product set (CHEBI:16199, CHEBI:57433) equals side 22456_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
