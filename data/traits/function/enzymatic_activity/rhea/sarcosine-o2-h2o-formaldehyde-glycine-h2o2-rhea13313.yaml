    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 113''s reactant set (CHEBI:15377, CHEBI:15379, CHEBI:57433) equals Rhea side
    13313_L exactly, and its product set (CHEBI:16240, CHEBI:16842, CHEBI:57305) equals side 13313_R exactly.
