- graph_id: catalytic_residues_mcsa887
  title: Catalytic residues of RHEA:15097 (from MCSA:887)
  description: 'The catalytic residues that carry out RHEA:15097, joined from M-CSA entry 887. 1 residues,
    reused verbatim from the MCSA:887 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 887''s reactant set (CHEBI:29985, CHEBI:57456) equals Rhea side 15097_L exactly,
    and its product set (CHEBI:57453, CHEBI:58928) equals side 15097_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
