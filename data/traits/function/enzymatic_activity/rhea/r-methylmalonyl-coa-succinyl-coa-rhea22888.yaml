- graph_id: catalytic_residues_mcsa62
  title: Catalytic residues of RHEA:22888 (from MCSA:62)
  description: 'The catalytic residues that carry out RHEA:22888, joined from M-CSA entry 62. 6 residues,
    reused verbatim from the MCSA:62 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 62''s reactant set (CHEBI:57292) equals Rhea side 22888_R exactly, and its product
    set (CHEBI:57326) equals side 22888_L exactly. EC agreement bounded the candidates but was not sufficient
    on its own. NOTE: M-CSA curates this reaction in the direction opposite to Rhea''s left-hand side
    — M-CSA''s reactants are Rhea''s 22888_R. Both are correct: a Rhea master reaction is undirected,
    and M-CSA records the physiological direction. The disagreement is recorded, not reconciled.'
