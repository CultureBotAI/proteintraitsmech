    from EC: M-CSA entry 390''s reactant set (CHEBI:15379, CHEBI:17594) equals Rhea side 11276_L exactly,
    and its product set (CHEBI:15377, CHEBI:17977) equals side 11276_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
