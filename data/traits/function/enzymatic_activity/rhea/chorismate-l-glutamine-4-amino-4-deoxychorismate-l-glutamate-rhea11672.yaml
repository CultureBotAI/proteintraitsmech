- graph_id: catalytic_residues_mcsa283
  title: Catalytic residues of RHEA:11672 (from MCSA:283)
  description: 'The catalytic residues that carry out RHEA:11672, joined from M-CSA entry 283. 2 residues,
    reused verbatim from the MCSA:283 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 283''s reactant set (CHEBI:29748, CHEBI:58359) equals Rhea side 11672_L exactly,
    and its product set (CHEBI:29985, CHEBI:58406) equals side 11672_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
