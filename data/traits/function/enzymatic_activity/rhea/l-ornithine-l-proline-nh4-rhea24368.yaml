- graph_id: catalytic_residues_mcsa717
  title: Catalytic residues of RHEA:24368 (from MCSA:717)
  description: 'The catalytic residues that carry out RHEA:24368, joined from M-CSA entry 717. 2 residues,
    reused verbatim from the MCSA:717 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 717''s reactant set (CHEBI:46911) equals Rhea side 24368_L exactly, and its product
    set (CHEBI:28938, CHEBI:60039) equals side 24368_R exactly. EC agreement bounded the candidates but
    was not sufficient on its own.'
