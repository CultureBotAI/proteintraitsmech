- graph_id: catalytic_residues_mcsa967
  title: Catalytic residues of RHEA:13409 (from MCSA:967)
  description: 'The catalytic residues that carry out RHEA:13409, joined from M-CSA entry 967. 5 residues,
    reused verbatim from the MCSA:967 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 967''s reactant set (CHEBI:15378, CHEBI:45075, CHEBI:57783) equals Rhea side
    13409_R exactly, and its product set (CHEBI:58349, CHEBI:58703) equals side 13409_L exactly. EC agreement
    bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the
    direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 13409_R. Both are correct:
    a Rhea master reaction is undirected, and M-CSA records the physiological direction. The disagreement
    is recorded, not reconciled.'
