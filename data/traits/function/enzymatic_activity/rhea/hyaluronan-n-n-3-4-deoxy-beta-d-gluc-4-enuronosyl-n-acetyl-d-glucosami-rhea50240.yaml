- graph_id: catalytic_residues_mcsa439
  title: Catalytic residues of RHEA:50240 (from MCSA:439)
  description: 'The catalytic residues that carry out RHEA:50240, joined from M-CSA entry 439. 4 residues,
    reused verbatim from the MCSA:439 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 439''s reactant set (CHEBI:132153) equals Rhea side 50240_L exactly, and its
    product set (CHEBI:132151, CHEBI:15377) equals side 50240_R exactly. EC agreement bounded the candidates
    but was not sufficient on its own.'
