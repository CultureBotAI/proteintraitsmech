- graph_id: catalytic_residues_mcsa435
  title: Catalytic residues of RHEA:18633 (from MCSA:435)
  description: 'The catalytic residues that carry out RHEA:18633, joined from M-CSA entry 435. 21 residues,
    reused verbatim from the MCSA:435 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 435''s reactant set (CHEBI:15377, CHEBI:17544, CHEBI:30616, CHEBI:58359) equals
    Rhea side 18633_L exactly, and its product set (CHEBI:15378, CHEBI:29985, CHEBI:43474, CHEBI:456216,
    CHEBI:58228) equals side 18633_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
