- graph_id: catalytic_residues_mcsa987
  title: Catalytic residues of RHEA:21132 (from MCSA:987)
  description: 'The catalytic residues that carry out RHEA:21132, joined from M-CSA entry 987. 3 residues,
    reused verbatim from the MCSA:987 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 987''s reactant set (CHEBI:15377, CHEBI:15379, CHEBI:17712) equals Rhea side
    21132_L exactly, and its product set (CHEBI:16240, CHEBI:17775) equals side 21132_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
