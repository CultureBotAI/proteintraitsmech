- graph_id: catalytic_residues_mcsa312
  title: Catalytic residues of RHEA:13769 (from MCSA:312)
  description: 'The catalytic residues that carry out RHEA:13769, joined from M-CSA entry 312. 4 residues,
    reused verbatim from the MCSA:312 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 312''s reactant set (CHEBI:17754, CHEBI:57540) equals Rhea side 13769_L exactly,
    and its product set (CHEBI:15378, CHEBI:16016, CHEBI:57945) equals side 13769_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
