- graph_id: catalytic_residues_mcsa567
  title: Catalytic residues of RHEA:11428 (from MCSA:567)
  description: 'The catalytic residues that carry out RHEA:11428, joined from M-CSA entry 567. 1 residues,
    reused verbatim from the MCSA:567 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 567''s reactant set (CHEBI:15379, CHEBI:15903) equals Rhea side 11428_L exactly,
    and its product set (CHEBI:16217, CHEBI:16240) equals side 11428_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
