- graph_id: catalytic_residues_mcsa843
  title: Catalytic residues of RHEA:15841 (from MCSA:843)
  description: 'The catalytic residues that carry out RHEA:15841, joined from M-CSA entry 843. 3 residues,
    reused verbatim from the MCSA:843 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 843''s reactant set (CHEBI:58349, CHEBI:61548) equals Rhea side 15841_L exactly,
    and its product set (CHEBI:15378, CHEBI:57783, CHEBI:57955) equals side 15841_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
