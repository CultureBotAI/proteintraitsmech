- graph_id: catalytic_residues_mcsa592
  title: Catalytic residues of RHEA:17825 (from MCSA:592)
  description: 'The catalytic residues that carry out RHEA:17825, joined from M-CSA entry 592. 2 residues,
    reused verbatim from the MCSA:592 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 592''s reactant set (CHEBI:30616, CHEBI:4167) equals Rhea side 17825_L exactly,
    and its product set (CHEBI:15378, CHEBI:456216, CHEBI:61548) equals side 17825_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
