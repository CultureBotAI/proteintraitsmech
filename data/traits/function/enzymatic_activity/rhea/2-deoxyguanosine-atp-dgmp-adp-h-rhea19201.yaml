- graph_id: catalytic_residues_mcsa615
  title: Catalytic residues of RHEA:19201 (from MCSA:615)
  description: 'The catalytic residues that carry out RHEA:19201, joined from M-CSA entry 615. 2 residues,
    reused verbatim from the MCSA:615 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 615''s reactant set (CHEBI:17172, CHEBI:30616) equals Rhea side 19201_L exactly,
    and its product set (CHEBI:15378, CHEBI:456216, CHEBI:57673) equals side 19201_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
  nodes:
  - node_id: activity
    label: catalysis of 2'-deoxyguanosine + ATP = dGMP + ADP + H(+)
    node_type: MOLECULAR_FUNCTION
    grounding: RHEA:19201
    description: 'KB trait record (FUNC_ENZYMATIC_ACTIVITY) — the reaction these residues carry out. Full
      equation: 2''-deoxyguanosine + ATP = dGMP + ADP + H(+)'
  - node_id: mcsa
    label: deoxyguanosine kinase
    node_type: MOTIF
    grounding: MCSA:615
    description: KB trait record (STRUCT_ACTIVE_SITE) — the curated catalytic site whose stepwise mechanism
      this reaction's chemistry is.
