- graph_id: catalytic_residues_mcsa563
  title: Catalytic residues of RHEA:29063 (from MCSA:563)
  description: 'The catalytic residues that carry out RHEA:29063, joined from M-CSA entry 563. 3 residues,
    reused verbatim from the MCSA:563 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 563''s reactant set (CHEBI:15378, CHEBI:15740, CHEBI:16374) equals Rhea side
    29063_L exactly, and its product set (CHEBI:16526, CHEBI:18151) equals side 29063_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
