- graph_id: catalytic_residues_mcsa731
  title: Catalytic residues of RHEA:26136 (from MCSA:731)
  description: 'The catalytic residues that carry out RHEA:26136, joined from M-CSA entry 731. 7 residues,
    reused verbatim from the MCSA:731 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 731''s reactant set (CHEBI:15377, CHEBI:2700) equals Rhea side 26136_L exactly,
    and its product set (CHEBI:32395, CHEBI:57603) equals side 26136_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
