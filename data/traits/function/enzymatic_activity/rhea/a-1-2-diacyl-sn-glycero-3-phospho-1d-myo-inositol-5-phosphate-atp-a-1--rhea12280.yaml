- graph_id: catalytic_residues_mcsa662
  title: Catalytic residues of RHEA:12280 (from MCSA:662)
  description: 'The catalytic residues that carry out RHEA:12280, joined from M-CSA entry 662. 2 residues,
    reused verbatim from the MCSA:662 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 662''s reactant set (CHEBI:30616, CHEBI:57795) equals Rhea side 12280_L exactly,
    and its product set (CHEBI:15378, CHEBI:456216, CHEBI:58456) equals side 12280_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
