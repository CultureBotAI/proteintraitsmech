    from EC: M-CSA entry 101''s reactant set (CHEBI:15377, CHEBI:58529) equals Rhea side 13893_L exactly,
    and its product set (CHEBI:15378, CHEBI:456215, CHEBI:456216) equals side 13893_R exactly. EC agreement
