- graph_id: catalytic_residues_mcsa147
  title: Catalytic residues of RHEA:15481 (from MCSA:147)
  description: 'The catalytic residues that carry out RHEA:15481, joined from M-CSA entry 147. 6 residues,
    reused verbatim from the MCSA:147 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 147''s reactant set (CHEBI:33384, CHEBI:57453) equals Rhea side 15481_R exactly,
    and its product set (CHEBI:15377, CHEBI:15636, CHEBI:57305) equals side 15481_L exactly. EC agreement
    bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the
    direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 15481_R. Both are correct:
    a Rhea master reaction is undirected, and M-CSA records the physiological direction. The disagreement
    is recorded, not reconciled.'
