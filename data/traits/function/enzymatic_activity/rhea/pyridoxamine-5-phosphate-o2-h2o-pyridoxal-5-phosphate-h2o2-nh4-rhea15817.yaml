- graph_id: catalytic_residues_mcsa677
  title: Catalytic residues of RHEA:15817 (from MCSA:677)
  description: 'The catalytic residues that carry out RHEA:15817, joined from M-CSA entry 677. 1 residues,
    reused verbatim from the MCSA:677 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 677''s reactant set (CHEBI:15377, CHEBI:15379, CHEBI:58451) equals Rhea side
    15817_L exactly, and its product set (CHEBI:16240, CHEBI:28938, CHEBI:597326) equals side 15817_R
    exactly. EC agreement bounded the candidates but was not sufficient on its own.'
