- graph_id: catalytic_residues_mcsa876
  title: Catalytic residues of RHEA:23372 (from MCSA:876)
  description: 'The catalytic residues that carry out RHEA:23372, joined from M-CSA entry 876. 3 residues,
    reused verbatim from the MCSA:876 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 876''s reactant set (CHEBI:30616, CHEBI:57972, CHEBI:70757) equals Rhea side
    23372_L exactly, and its product set (CHEBI:15378, CHEBI:43474, CHEBI:456216, CHEBI:83898) equals
    side 23372_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
