- graph_id: catalytic_residues_mcsa863
  title: Catalytic residues of RHEA:10388 (from MCSA:863)
  description: 'The catalytic residues that carry out RHEA:10388, joined from M-CSA entry 863. 8 residues,
    reused verbatim from the MCSA:863 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 863''s reactant set (CHEBI:16452, CHEBI:37565) equals Rhea side 10388_L exactly,
    and its product set (CHEBI:16526, CHEBI:58189, CHEBI:58702) equals side 10388_R exactly. EC agreement
    bounded the candidates but was not sufficient on its own.'
