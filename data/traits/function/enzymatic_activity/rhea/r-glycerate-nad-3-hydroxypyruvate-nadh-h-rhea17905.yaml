- graph_id: catalytic_residues_mcsa571
  title: Catalytic residues of RHEA:17905 (from MCSA:571)
  description: 'The catalytic residues that carry out RHEA:17905, joined from M-CSA entry 571. 3 residues,
    reused verbatim from the MCSA:571 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 571''s reactant set (CHEBI:15378, CHEBI:17180, CHEBI:57945) equals Rhea side
    17905_R exactly, and its product set (CHEBI:16659, CHEBI:57540) equals side 17905_L exactly. EC agreement
    bounded the candidates but was not sufficient on its own. NOTE: M-CSA curates this reaction in the
    direction opposite to Rhea''s left-hand side — M-CSA''s reactants are Rhea''s 17905_R. Both are correct:
    a Rhea master reaction is undirected, and M-CSA records the physiological direction. The disagreement
    is recorded, not reconciled.'
