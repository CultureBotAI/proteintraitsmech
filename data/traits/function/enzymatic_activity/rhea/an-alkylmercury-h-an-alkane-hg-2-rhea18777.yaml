- graph_id: catalytic_residues_mcsa297
  title: Catalytic residues of RHEA:18777 (from MCSA:297)
  description: 'The catalytic residues that carry out RHEA:18777, joined from M-CSA entry 297. 3 residues,
    reused verbatim from the MCSA:297 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 297''s reactant set (CHEBI:15378, CHEBI:83725) equals Rhea side 18777_L exactly,
    and its product set (CHEBI:16793, CHEBI:18310) equals side 18777_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
