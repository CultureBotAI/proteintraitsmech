- graph_id: catalytic_residues_mcsa859
  title: Catalytic residues of RHEA:11112 (from MCSA:859)
  description: 'The catalytic residues that carry out RHEA:11112, joined from M-CSA entry 859. 3 residues,
    reused verbatim from the MCSA:859 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 859''s reactant set (CHEBI:15377, CHEBI:29780) equals Rhea side 11112_L exactly,
    and its product set (CHEBI:15361, CHEBI:58764) equals side 11112_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
