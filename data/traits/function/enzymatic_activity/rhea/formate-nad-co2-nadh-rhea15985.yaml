- graph_id: catalytic_residues_mcsa902
  title: Catalytic residues of RHEA:15985 (from MCSA:902)
  description: 'The catalytic residues that carry out RHEA:15985, joined from M-CSA entry 902. 4 residues,
    reused verbatim from the MCSA:902 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 902''s reactant set (CHEBI:15740, CHEBI:57540) equals Rhea side 15985_L exactly,
    and its product set (CHEBI:16526, CHEBI:57945) equals side 15985_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
