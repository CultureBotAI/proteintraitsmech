  title: Catalytic residues of RHEA:17577 (from MCSA:557)
  description: 'The catalytic residues that carry out RHEA:17577, joined from M-CSA entry 557. 3 residues,
    reused verbatim from the MCSA:557 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 557''s reactant set (CHEBI:59967) equals Rhea side 17577_L exactly, and its product
    set (CHEBI:61506) equals side 17577_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
