- graph_id: catalytic_residues_mcsa948
  title: Catalytic residues of RHEA:25900 (from MCSA:948)
  description: 'The catalytic residues that carry out RHEA:25900, joined from M-CSA entry 948. 7 residues,
    reused verbatim from the MCSA:948 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 948''s reactant set (CHEBI:58542) equals Rhea side 25900_L exactly, and its product
    set (CHEBI:57634) equals side 25900_R exactly. EC agreement bounded the candidates but was not sufficient
    on its own.'
