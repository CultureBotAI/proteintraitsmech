- graph_id: catalytic_residues_mcsa851
  title: Catalytic residues of RHEA:16833 (from MCSA:851)
  description: 'The catalytic residues that carry out RHEA:16833, joined from M-CSA entry 851. 3 residues,
    reused verbatim from the MCSA:851 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 851''s reactant set (CHEBI:16240, CHEBI:57925) equals Rhea side 16833_L exactly,
    and its product set (CHEBI:15377, CHEBI:58297) equals side 16833_R exactly. EC agreement bounded the
    candidates but was not sufficient on its own.'
