- graph_id: catalytic_residues_mcsa799
  title: Catalytic residues of RHEA:11348 (from MCSA:799)
  description: 'The catalytic residues that carry out RHEA:11348, joined from M-CSA entry 799. 7 residues,
    reused verbatim from the MCSA:799 record rather than re-derived. M-CSA annotates each residue''s role
    (proton donor, electrostatic stabiliser, …) and whether it is a chemical reactant, an interaction
    partner or a spectator, but does not say which compound a residue acts on — so this graph asserts
    residue-to-reaction causation, not residue-to-substrate. Join verified on chemistry, not inferred
    from EC: M-CSA entry 799''s reactant set (CHEBI:15377, CHEBI:29242, CHEBI:30616) equals Rhea side
    11348_L exactly, and its product set (CHEBI:15378, CHEBI:29242, CHEBI:43474, CHEBI:456216) equals
    side 11348_R exactly. EC agreement bounded the candidates but was not sufficient on its own.'
