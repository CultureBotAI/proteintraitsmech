identifier: EC:1.14.15.11
label: "pentalenic acid synthase"
definition: >-
  Enzymatic activity — pentalenic acid synthase (EC 1.14.15.11). Catalysed reaction: 1-deoxypentalenate + reduced 2[4Fe-4S]-[ferredoxin] + O2 + 2 H(+) = pentalenate + oxidized 2[4Fe-4S]-[ferredoxin] + H2O.
