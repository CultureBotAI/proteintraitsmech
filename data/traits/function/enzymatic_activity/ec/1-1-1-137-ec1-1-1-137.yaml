    text: >-
      An oxidoreductase; acting on the CH-OH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) D-ribitol 5-phosphate + NADP(+) = D-ribulose 5-phosphate + NADPH + H(+). (2) D-ribitol 5-phosphate + NAD(+) = D-ribulose 5-phosphate + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
