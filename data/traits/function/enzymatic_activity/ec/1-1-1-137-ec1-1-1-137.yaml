identifier: EC:1.1.1.137
label: "ribitol-5-phosphate 2-dehydrogenase"
definition: >-
  Enzymatic activity — ribitol-5-phosphate 2-dehydrogenase (EC 1.1.1.137). Catalysed reaction: (1) D-ribitol 5-phosphate + NADP(+) = D-ribulose 5-phosphate + NADPH + H(+). (2) D-ribitol 5-phosphate + NAD(+) = D-ribulose 5-phosphate + NADH + H(+).
