definition: >-
  Enzymatic activity — zealexin A1 synthase (EC 1.14.14.160). Catalysed reaction: (S)-beta-macrocarpene + 3 reduced [NADPH--hemoprotein reductase] + 3 O2 = zealexin A1 + 3 oxidized [NADPH--hemoprotein reductase] + 4 H2O + 4 H(+).
