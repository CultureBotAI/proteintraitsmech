definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with NADH or NADPH as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) caffeine + NADH + O2 + H(+) = theobromine + formaldehyde + NAD(+) + H2O. (2) caffeine + NADPH + O2 + H(+) = theobromine + formaldehyde + NADP(+) + H2O. (3) theophylline + NADPH + O2 + H(+) = 3-methylxanthine + formaldehyde + NADP(+) + H2O. (4) theophylline + NADH + O2 + H(+) = 3-methylxanthine + formaldehyde + NAD(+) + H2O. (5) 1,7-dimethylxanthine + NADH + O2 + H(+) = 7-methylxanthine + formaldehyde + NAD(+) + H2O. (6) 1,7-dimethylxanthine + NADPH + O2 + H(+) = 7-methylxanthine + formaldehyde + NADP(+) + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
