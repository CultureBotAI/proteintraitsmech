    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 3-dehydro-L-gulonate + NAD(+) = 2,3-dioxo-L-gulonate + NADH + H(+). (2) 3-dehydro-L-gulonate + NADP(+) = 2,3-dioxo-L-gulonate + NADPH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
