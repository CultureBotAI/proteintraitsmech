    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a secondary alkyl amine + NAD(+) + H2O = a ketone + NH4(+) + NADH + H(+). (2) a secondary alkyl amine + NADP(+) + H2O = a ketone + NH4(+) + NADPH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
