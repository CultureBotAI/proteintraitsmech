    text: >-
      Catalyses: (1) N(1)-acetylspermidine + O2 + H2O = 3-acetamidopropanal + putrescine + H2O2. (2) N(1)-acetylspermine + O2 + H2O = 3-acetamidopropanal + spermidine + H2O2
    source: "ExPASy ENZYME"
    method: SOURCED
