definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 3,5,6-trichloropyridin-2-ol + FADH2 + O2 = 3,6-dichloropyridine-2,5- dione + FAD + chloride + H2O + 2 H(+). (2) 3,6-dichloropyridine-2,5-diol + FADH2 + O2 = 6-chloro-3- hydroxypyridine-2,5-dione + FAD + chloride + H2O + 2 H(+). (3) 6-chloropyridine-2,3,5-triol + FADH2 + O2 = 3,6-dihydroxypyridine- 2,5-dione + FAD + chloride + H2O + 3 H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
