identifier: EC:1.14.11.78
label: "(R)-3-[(carboxymethyl)amino]fatty acid dioxygenase/decarboxylase"
definition: >-
  Enzymatic activity — (R)-3-[(carboxymethyl)amino]fatty acid dioxygenase/decarboxylase (EC 1.14.11.78). Catalysed reaction: a (3R)-3-[(carboxymethyl)amino]fatty acid + 2 2-oxoglutarate + 2 O2 = a (3R)-3-isocyanyl-fatty acid + 2 succinate + 3 CO2 + 2 H2O.
