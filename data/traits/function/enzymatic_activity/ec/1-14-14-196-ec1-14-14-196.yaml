label: "polyporic acid monooxygenase"
definition: >-
  Enzymatic activity — polyporic acid monooxygenase (EC 1.14.14.196). Catalysed reaction: polyporic acid + reduced [NADPH--hemoprotein reductase] + O2 = ascocorynin + oxidized [NADPH--hemoprotein reductase] + H2O + H(+).
