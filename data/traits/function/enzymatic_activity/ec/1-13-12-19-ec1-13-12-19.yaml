definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on single donors with incorporation of molecular oxygen (oxygenases). The oxygen incorporated need not be derived from O2; with incorporation of one atom of oxygen (internal monooxygenases or internal mixed function oxidases).
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: 2-oxoglutarate + O2 + 2 H(+) = ethene + 3 CO2 + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
