    text: >-
      An oxidoreductase; acting on the CH-OH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (2S)-versicolorone + NADP(+) = 1'-hydroxyversicolorone + NADPH + H(+). (2) (3S)-versiconol acetate + NADP(+) = (2S,3S)-versiconal hemiacetal acetate + NADPH + H(+). (3) (S)-versiconol + NADP(+) = (2S-3S)-versiconal hemiacetal + NADPH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
