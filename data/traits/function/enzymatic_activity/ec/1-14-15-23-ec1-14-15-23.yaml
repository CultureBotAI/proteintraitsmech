label: "chloroacetanilide N-alkylformylase"
definition: >-
  Enzymatic activity — chloroacetanilide N-alkylformylase (EC 1.14.15.23). Catalysed reaction: butachlor + 2 reduced [2Fe-2S]-[ferredoxin] + O2 + 2 H(+) = butyl formate + N-(2,6-diethylphenyl)-2-chloroacetamide + 2 oxidized [2Fe-2S]- [ferredoxin] + H2O.
