identifier: EC:1.14.19.50
label: "noroxomaritidine synthase"
definition: >-
  Enzymatic activity — noroxomaritidine synthase (EC 1.14.19.50). Catalysed reaction: (1) 4'-O-methylnorbelladine + reduced [NADPH--hemoprotein reductase] + O2 = (10bS,4aR)-noroxomaritidine + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+). (2) 4'-O-methylnorbelladine + reduced [NADPH--hemoprotein reductase] + O2 = (10bR,4aS)-noroxomaritidine + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+).
