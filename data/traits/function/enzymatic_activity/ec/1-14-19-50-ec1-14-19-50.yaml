definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 4'-O-methylnorbelladine + reduced [NADPH--hemoprotein reductase] + O2 = (10bS,4aR)-noroxomaritidine + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+). (2) 4'-O-methylnorbelladine + reduced [NADPH--hemoprotein reductase] + O2 = (10bR,4aS)-noroxomaritidine + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
