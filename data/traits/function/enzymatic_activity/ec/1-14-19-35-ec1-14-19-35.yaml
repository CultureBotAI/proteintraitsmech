definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a (7Z,10Z)-hexadecadienoyl-containing glycerolipid + 2 reduced [2Fe- 2S]-[ferredoxin] + O2 + 2 H(+) = a (7Z,10Z,13Z)-hexadecatrienoyl- containing glycerolipid + 2 oxidized [2Fe-2S]-[ferredoxin] + 2 H2O. (2) a (9Z,12Z)-octadecadienoyl-containing glycerolipid + 2 reduced [2Fe- 2S]-[ferredoxin] + O2 + 2 H(+) = (9Z,12Z,15Z)-octadecatrienoyl-containing glycerolipid + 2 oxidized [2Fe-2S]-[ferredoxin] + 2 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
