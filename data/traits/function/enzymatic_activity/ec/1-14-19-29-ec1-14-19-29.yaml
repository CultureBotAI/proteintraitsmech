definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) an N-acyl-(4R)-4-hydroxysphinganine + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a (4R,8E)-4-hydroxysphingenine ceramide + 2 Fe(III)-[cytochrome b5] + 2 H2O. (2) an N-acyl-(4R)-4-hydroxysphinganine + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a (4R,8Z)-4-hydroxysphing-8-enine ceramide + 2 Fe(III)- [cytochrome b5] + 2 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
