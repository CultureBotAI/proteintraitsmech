    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) an n-alkanal + NAD(+) = an alk-2-enal + NADH + H(+). (2) an n-alkanal + NADP(+) = an alk-2-enal + NADPH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
