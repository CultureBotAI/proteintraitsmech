identifier: EC:1.14.13.211
label: "rifampicin monooxygenase"
definition: >-
  Enzymatic activity — rifampicin monooxygenase (EC 1.14.13.211). Catalysed reaction: (1) rifampicin + NADPH + O2 = rifampicin para-naphthoquinone carboxamide + NADP(+) + H2O + H(+). (2) rifampicin + NADH + O2 = rifampicin para-naphthoquinone carboxamide + NAD(+) + H2O + H(+).
