definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (6Z,9Z,12Z)-octadecatrienoyl-containing glycerolipid + 2 Fe(II)- [cytochrome b5] + O2 + 2 H(+) = a (9Z,12Z)-octadeca-9,12-dien-6-ynoyl- containing glycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O. (2) (6Z,9Z,12Z,15Z)-octadecatetraenoyl-containing glycerolipid + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a (9Z,12Z,15Z)-octadeca-9,12,15- trien-6-ynoyl-containing glycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
