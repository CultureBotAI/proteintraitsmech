label: "amorpha-4,11-diene 12 monooxygenase"
definition: >-
  Enzymatic activity — amorpha-4,11-diene 12 monooxygenase (EC 1.14.14.114). Catalysed reaction: (+)-amorpha-4,11-diene + 3 reduced [NADPH--hemoprotein reductase] + 3 O2 = (+)-artemisinate + 3 oxidized [NADPH--hemoprotein reductase] + 4 H2O + 4 H(+).
