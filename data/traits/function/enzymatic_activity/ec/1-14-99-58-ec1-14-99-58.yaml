identifier: EC:1.14.99.58
label: "heme oxygenase (biliverdin-IX-beta and delta-forming)"
definition: >-
  Enzymatic activity — heme oxygenase (biliverdin-IX-beta and delta-forming) (EC 1.14.99.58). Catalysed reaction: (1) heme b + 3 AH2 + 3 O2 + 3 H(+) = biliverdin IXdelta + CO + Fe(2+) + 3 A + 3 H2O. (2) heme b + 3 AH2 + 3 O2 + 2 H(+) = biliverdin IXbeta + CO + Fe(2+) + 3 A + 3 H2O.
