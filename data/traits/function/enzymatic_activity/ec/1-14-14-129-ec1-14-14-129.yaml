definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (9Z)-octadecenoyl-CoA + reduced [NADPH--hemoprotein reductase] + O2 = (9Z)-18-hydroxyoctadecenoyl-CoA + oxidized [NADPH--hemoprotein reductase] + H2O + H(+). (2) (9Z,12Z)-octadecadienoyl-CoA + reduced [NADPH--hemoprotein reductase] + O2 = (9Z,12Z)-18-hydroxyoctadecadienoyl-CoA + oxidized [NADPH- -hemoprotein reductase] + H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
