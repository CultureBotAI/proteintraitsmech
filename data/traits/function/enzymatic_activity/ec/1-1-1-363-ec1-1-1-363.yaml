label: "glucose-6-phosphate dehydrogenase [NAD(P)(+)]"
definition: >-
  Enzymatic activity — glucose-6-phosphate dehydrogenase [NAD(P)(+)] (EC 1.1.1.363). Catalysed reaction: (1) D-glucose 6-phosphate + NADP(+) = 6-phospho-D-glucono-1,5-lactone + NADPH + H(+). (2) D-glucose 6-phosphate + NAD(+) = 6-phospho-D-glucono-1,5-lactone + NADH + H(+).
