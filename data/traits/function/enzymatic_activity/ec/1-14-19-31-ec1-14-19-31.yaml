definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a (7Z,10Z,13Z,16Z,19Z)-docosapentaenoyl-containing glycerolipid + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a (4Z,7Z,10Z,13Z,16Z,19Z)- docosahexaenoyl-containing glycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O. (2) a (7Z,10Z,13Z,16Z)-docosatetraenoyl-containing glycerolipid + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a (4Z,7Z,10Z,13Z,16Z)- docosapentaenoyl-containing glycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
