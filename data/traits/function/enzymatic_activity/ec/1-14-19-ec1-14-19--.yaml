identifier: EC:1.14.19.-
label: "With oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water"
definition: >-
  With oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water — EC 1.14.19.-, an Enzyme Commission classification node.
definition_source: ExPASy ENZYME
trait_axis: FUNCTION
trait_category: FUNC_ENZYMATIC_ACTIVITY
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - EC:1.14.-.-
definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
