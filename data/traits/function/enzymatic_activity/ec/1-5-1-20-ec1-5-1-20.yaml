definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on the CH-NH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (6S)-5-methyl-5,6,7,8-tetrahydrofolate + NADP(+) = (6R)-5,10- methylene-5,6,7,8-tetrahydrofolate + NADPH + H(+). (2) (6S)-5-methyl-5,6,7,8-tetrahydrofolate + NAD(+) = (6R)-5,10- methylene-5,6,7,8-tetrahydrofolate + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
