    synonym_type: EXACT_SYNONYM
  - synonym_text: "heme oxygenase"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "heme oxygenase (decyclizing)"
    synonym_type: EXACT_SYNONYM
