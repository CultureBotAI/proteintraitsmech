definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; miscellaneous.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) heme b + 5 AH2 + 4 O2 + 2 H(+) = delta-staphylobilin + Fe(2+) + formaldehyde + 5 A + 4 H2O. (2) heme b + 5 AH2 + 4 O2 + 2 H(+) = beta-staphylobilin + Fe(2+) + formaldehyde + 5 A + 4 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
