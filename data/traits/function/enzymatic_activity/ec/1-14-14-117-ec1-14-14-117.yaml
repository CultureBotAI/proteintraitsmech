definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 8-O-methylsterigmatocystin + 2 reduced [NADPH--hemoprotein reductase] + 2 O2 = aflatoxin B1 + methanol + 2 oxidized [NADPH--hemoprotein reductase] + CO2 + H2O + 2 H(+). (2) 8-O-methyldihydrosterigmatocystin + 2 reduced [NADPH--hemoprotein reductase] + 2 O2 = aflatoxin B2 + methanol + 2 oxidized [NADPH- -hemoprotein reductase] + CO2 + H2O + 2 H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
