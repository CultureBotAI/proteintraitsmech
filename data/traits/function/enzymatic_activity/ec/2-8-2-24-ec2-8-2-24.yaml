label: "aromatic desulfoglucosinolate sulfotransferase"
definition: >-
  Enzymatic activity — aromatic desulfoglucosinolate sulfotransferase (EC 2.8.2.24). Catalysed reaction: (1) (Z)-desulfoglucotropeolin + 3'-phosphoadenylyl sulfate = (Z)- glucotropeolin + adenosine 3',5'-bisphosphate + H(+). (2) (Z)-indolylmethyl desulfoglucosinolate + 3'-phosphoadenylyl sulfate = (Z)-glucobrassicin + adenosine 3',5'-bisphosphate + H(+).
