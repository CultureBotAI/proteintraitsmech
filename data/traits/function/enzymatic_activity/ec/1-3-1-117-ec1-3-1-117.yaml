  Enzymatic activity — hydroxycinnamoyl-CoA reductase (EC 1.3.1.117). Catalysed reaction: (1) dihydro-4-coumaroyl-CoA + NADP(+) = (E)-4-coumaroyl-CoA + NADPH + H(+). (2) dihydroferuloyl-CoA + NADP(+) = (E)-feruloyl-CoA + NADPH + H(+).
