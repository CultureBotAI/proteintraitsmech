identifier: EC:1.14.14.157
label: "indolin-2-one monooxygenase"
definition: >-
  Enzymatic activity — indolin-2-one monooxygenase (EC 1.14.14.157). Catalysed reaction: indolin-2-one + reduced [NADPH--hemoprotein reductase] + O2 = 3-hydroxyindolin-2-one + oxidized [NADPH--hemoprotein reductase] + H2O + H(+).
