    text: >-
      An oxidoreductase; acting on the aldehyde or oxo group of donors; with an iron-sulfur protein as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: a 2-oxocarboxylate + 2 oxidized [2Fe-2S]-[ferredoxin] + CoA = an acyl-CoA + 2 reduced [2Fe-2S]-[ferredoxin] + CO2 + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
