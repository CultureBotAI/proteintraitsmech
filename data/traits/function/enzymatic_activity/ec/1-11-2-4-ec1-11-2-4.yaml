definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on a peroxide as acceptor; with H2O2 as acceptor, one oxygen atom of which is incorporated into the product.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a 1,2-saturated fatty acid + H2O2 = a 2-hydroxy fatty acid + H2O. (2) a 2,3-saturated fatty acid + H2O2 = a 3-hydroxy fatty acid + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
