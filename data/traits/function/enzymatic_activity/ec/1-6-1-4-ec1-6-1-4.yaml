definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on NADH or NADPH; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: 2 reduced [2Fe-2S]-[ferredoxin] + NADH + 2 NADP(+) + H(+) = 2 oxidized [2Fe-2S]-[ferredoxin] + NAD(+) + 2 NADPH
    source: "ExPASy ENZYME"
    method: SOURCED
