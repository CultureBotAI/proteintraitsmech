label: "phenylacetaldehyde oxime monooxygenase"
definition: >-
  Enzymatic activity — phenylacetaldehyde oxime monooxygenase (EC 1.14.14.44). Catalysed reaction: (E)-phenylacetaldehyde oxime + reduced [NADPH--hemoprotein reductase] + O2 = (R)-mandelonitrile + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+).
