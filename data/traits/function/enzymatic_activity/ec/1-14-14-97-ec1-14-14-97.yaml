definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (S)-cis-N-methylcanadine + reduced [NADPH--hemoprotein reductase] + O2 = allocryptopine + oxidized [NADPH--hemoprotein reductase] + H2O + 2 H(+). (2) (S)-cis-N-methylstylopine + reduced [NADPH--hemoprotein reductase] + O2 = protopine + oxidized [NADPH--hemoprotein reductase] + H2O + 2 H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
