identifier: EC:1.14.13.181
label: "13-deoxydaunorubicin hydroxylase"
definition: >-
  Enzymatic activity — 13-deoxydaunorubicin hydroxylase (EC 1.14.13.181). Catalysed reaction: (1) 13-deoxydaunorubicin + NADPH + O2 + H(+) = 13-dihydrodaunorubicin + NADP(+) + H2O. (2) 13-dihydrodaunorubicin + NADPH + O2 + H(+) = daunorubicin + NADP(+) + 2 H2O.
definition_source: ExPASy ENZYME
trait_axis: FUNCTION
trait_category: FUNC_ENZYMATIC_ACTIVITY
term_kind: CLASS
mapping_status: REVIEWED
