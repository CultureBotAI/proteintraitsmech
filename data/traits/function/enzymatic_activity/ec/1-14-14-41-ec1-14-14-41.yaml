definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (1E,2S)-2-methylbutanal oxime + reduced [NADPH--hemoprotein reductase] + O2 = 2-hydroxy-2-methylbutanenitrile + oxidized [NADPH- -hemoprotein reductase] + 2 H2O + H(+). (2) (E)-2-methylpropanal oxime + reduced [NADPH--hemoprotein reductase] + O2 = 2-hydroxy-2-methylpropanenitrile + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
