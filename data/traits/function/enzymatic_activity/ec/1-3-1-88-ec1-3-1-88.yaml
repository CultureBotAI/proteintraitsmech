      An oxidoreductase; acting on the CH-CH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 5,6-dihydrouridine(16) in tRNA + NADP(+) = uridine(16) in tRNA + NADPH + H(+). (2) 5,6-dihydrouridine(16) in tRNA + NAD(+) = uridine(16) in tRNA + NADH + H(+). (3) 5,6-dihydrouridine(17) in tRNA + NADP(+) = uridine(17) in tRNA + NADPH + H(+). (4) 5,6-dihydrouridine(17) in tRNA + NAD(+) = uridine(17) in tRNA + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
