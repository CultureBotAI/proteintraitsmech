  Enzymatic activity — acyl-lipid Delta(12)-acetylenase (EC 1.14.19.39). Catalysed reaction: a (9Z,12Z)-octadecadienoyl-containing glycerolipid + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a (9Z)-octadec-9-en-12-ynoyl-containing glycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O.
