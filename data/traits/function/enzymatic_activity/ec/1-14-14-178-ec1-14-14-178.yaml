definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a C27-steroid + reduced [NADPH--hemoprotein reductase] + O2 = a (22S)-22-hydroxy C27-steroid + oxidized [NADPH--hemoprotein reductase] + H2O + H(+). (2) a C28-steroid + reduced [NADPH--hemoprotein reductase] + O2 = a (22S)-22-hydroxy C28-steroid + oxidized [NADPH--hemoprotein reductase] + H2O + H(+). (3) a C29-steroid + reduced [NADPH--hemoprotein reductase] + O2 = a (22S)-22-hydroxy C29-steroid + oxidized [NADPH--hemoprotein reductase] + H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
