    synonym_type: EXACT_SYNONYM
  - synonym_text: "alpha-keto-beta-hydroxylacyl reductoisomerase"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "dihydroxyisovalerate dehydrogenase (isomerizing)"
    synonym_type: EXACT_SYNONYM
