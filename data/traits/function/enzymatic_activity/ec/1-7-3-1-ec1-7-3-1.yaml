definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on other nitrogenous compounds as donors; with oxygen as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a primary nitroalkane + O2 + H2O = an aldehyde + nitrite + H2O2 + H(+). (2) a secondary nitroalkane + O2 + H2O = a ketone + nitrite + H2O2 + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
