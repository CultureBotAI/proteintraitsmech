definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced ascorbate as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: 1-aminocyclopropane-1-carboxylate + L-ascorbate + O2 = ethene + L-dehydroascorbate + hydrogen cyanide + CO2 + 2 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
