definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on the CH-CH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 5,6-dihydrouridine(20a) in tRNA + NADP(+) = uridine(20a) in tRNA + NADPH + H(+). (2) 5,6-dihydrouridine(20a) in tRNA + NAD(+) = uridine(20a) in tRNA + NADH + H(+). (3) 5,6-dihydrouridine(20b) in tRNA + NAD(+) = uridine(20b) in tRNA + NADH + H(+). (4) 5,6-dihydrouridine(20b) in tRNA + NADP(+) = uridine(20b) in tRNA + NADPH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
