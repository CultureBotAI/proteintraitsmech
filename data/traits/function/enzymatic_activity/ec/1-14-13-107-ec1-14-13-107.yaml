definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with NADH or NADPH as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (4S)-limonene + NADPH + O2 + H(+) = limonene 1,2-epoxide + NADP(+) + H2O. (2) (4S)-limonene + NADH + O2 + H(+) = limonene 1,2-epoxide + NAD(+) + H2O. (3) (4R)-limonene + NADH + O2 + H(+) = limonene 1,2-epoxide + NAD(+) + H2O. (4) (4R)-limonene + NADPH + O2 + H(+) = limonene 1,2-epoxide + NADP(+) + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
