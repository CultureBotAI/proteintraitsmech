  Enzymatic activity — oryzalexin D synthase (EC 1.14.14.123). Catalysed reaction: ent-sandaracopimaradien-3beta-ol + reduced [NADPH--hemoprotein reductase] + O2 = oryzalexin D + oxidized [NADPH--hemoprotein reductase] + H2O + H(+).
