definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) beta-amyrin + reduced [NADPH--hemoprotein reductase] + O2 = 24-hydroxy-beta-amyrin + oxidized [NADPH--hemoprotein reductase] + H2O + H(+). (2) sophoradiol + reduced [NADPH--hemoprotein reductase] + O2 = soyasapogenol B + oxidized [NADPH--hemoprotein reductase] + H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
