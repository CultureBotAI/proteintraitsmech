identifier: EC:1.14.18.5
label: "sphingolipid C4-monooxygenase"
definition: >-
  Enzymatic activity — sphingolipid C4-monooxygenase (EC 1.14.18.5). Catalysed reaction: a dihydroceramide + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a phytoceramide + 2 Fe(III)-[cytochrome b5] + H2O.
definition_source: ExPASy ENZYME
trait_axis: FUNCTION
trait_category: FUNC_ENZYMATIC_ACTIVITY
term_kind: CLASS
mapping_status: REVIEWED
parent_traits:
