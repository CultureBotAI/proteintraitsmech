definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on the CH-OH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a di-trans,poly-cis-polyprenol + NAD(+) = a di-trans,poly- cis-polyprenal + NADH + H(+). (2) a di-trans,poly-cis-polyprenol + NADP(+) = a di-trans,poly- cis-polyprenal + NADPH + H(+). (3) a di-trans,poly-cis-dolichol + NADP(+) = a di-trans,poly-cis-dolichal + NADPH + H(+). (4) a di-trans,poly-cis-dolichol + NAD(+) = a di-trans,poly-cis-dolichal + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
