identifier: EC:1.14.14.73
label: "albendazole monooxygenase (sufoxide-forming)"
definition: >-
  Enzymatic activity — albendazole monooxygenase (sufoxide-forming) (EC 1.14.14.73). Catalysed reaction: (1) albendazole + reduced [NADPH--hemoprotein reductase] + O2 = albendazole S-oxide + oxidized [NADPH--hemoprotein reductase] + H2O + H(+). (2) fenbendazole + reduced [NADPH--hemoprotein reductase] + O2 = fenbendazole S-oxide + oxidized [NADPH--hemoprotein reductase] + H2O + H(+).
definition_source: ExPASy ENZYME
trait_axis: FUNCTION
trait_category: FUNC_ENZYMATIC_ACTIVITY
term_kind: CLASS
mapping_status: REVIEWED
