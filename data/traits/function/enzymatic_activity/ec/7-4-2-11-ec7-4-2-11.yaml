    text: >-
      A translocase; catalysing the translocation amino acids and peptides; linked to the hydrolysis of a nucleoside triphosphate.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) L-methionine(out) + ATP + H2O = L-methionine(in) + ADP + phosphate + H(+). (2) D-methionine(out) + ATP + H2O = D-methionine(in) + ADP + phosphate + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
