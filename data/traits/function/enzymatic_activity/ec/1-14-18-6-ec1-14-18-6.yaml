definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with another compound as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) an N-(1,2 saturated acyl)-(4R)-hydroxysphinganine + 2 Fe(II)- [cytochrome b5] + O2 + 2 H(+) = an N-(2R-hydroxyacyl)- 4R-hydroxysphinganine + 2 Fe(III)-[cytochrome b5] + H2O. (2) an N-(1,2 saturated very-long-chain fatty acyl)-(R)-4- hydroxysphingoid base + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = an N-(2R-hydroxy-very-long-chain fatty acyl)-(R)-4-hydroxysphingoid base + 2 Fe(III)-[cytochrome b5] + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
