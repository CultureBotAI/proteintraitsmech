identifier: EC:1.14.14.30
label: "isobutylamine N-monooxygenase"
definition: >-
  Enzymatic activity — isobutylamine N-monooxygenase (EC 1.14.14.30). Catalysed reaction: (1) 2-methylpropan-1-amine + FADH2 + O2 = N-(2-methylpropyl)hydroxylamine + FAD + H2O + 2 H(+). (2) 2-methylpropan-1-amine + FMNH2 + O2 = N-(2-methylpropyl)hydroxylamine + FMN + H2O + 2 H(+).
definition_source: ExPASy ENZYME
