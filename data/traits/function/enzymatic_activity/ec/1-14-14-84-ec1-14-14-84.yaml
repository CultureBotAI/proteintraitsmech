  Enzymatic activity — linalool 8-monooxygenase (EC 1.14.14.84). Catalysed reaction: linalool + 2 reduced [NADPH--hemoprotein reductase] + 2 O2 = (6E)-8- oxolinalool + 2 oxidized [NADPH--hemoprotein reductase] + 3 H2O + 2 H(+).
