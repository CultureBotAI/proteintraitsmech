identifier: EC:1.14.19.8
label: "pentalenolactone synthase"
definition: >-
  Enzymatic activity — pentalenolactone synthase (EC 1.14.19.8). Catalysed reaction: pentalenolactone F + 2 reduced [2Fe-2S]-[ferredoxin] + O2 + 2 H(+) = pentalenolactone + 2 oxidized [2Fe-2S]-[ferredoxin] + 2 H2O.
