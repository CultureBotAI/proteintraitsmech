identifier: EC:1.1.1.297
label: "limonene-1,2-diol dehydrogenase"
definition: >-
  Enzymatic activity — limonene-1,2-diol dehydrogenase (EC 1.1.1.297). Catalysed reaction: (1) (1R,2R,4S)-limonene-1,2-diol + NAD(+) = (1R,4S)-1-hydroxylimonen-2- one + NADH + H(+). (2) (1S,2S,4R)-limonene-1,2-diol + NAD(+) = (1S,4R)-1-hydroxylimonen-2- one + NADH + H(+).
