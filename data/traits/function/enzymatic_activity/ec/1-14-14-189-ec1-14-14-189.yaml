label: "strychnine 10-hydroxylase"
definition: >-
  Enzymatic activity — strychnine 10-hydroxylase (EC 1.14.14.189). Catalysed reaction: strychnine + reduced [NADPH--hemoprotein reductase] + O2 = 10-hydroxystrychnine + oxidized [NADPH--hemoprotein reductase] + H2O + H(+).
