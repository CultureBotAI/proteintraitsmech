    text: >-
      Catalyses: a di-trans,poly-cis-dolichyl phosphate + UDP-N-acetyl-alpha-D-glucosamine = an N-acetyl-alpha-D-glucosaminyl-diphospho-di-trans,poly-cis-dolichol + UMP
    source: "ExPASy ENZYME"
    method: SOURCED
