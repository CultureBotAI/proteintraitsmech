definition: >-
  Enzymatic activity — (methylsulfanyl)alkanaldoxime N-monooxygenase (EC 1.14.14.43). Catalysed reaction: an (E)-omega-(methylsulfanyl)-alkanal oxime + glutathione + reduced [NADPH--hemoprotein reductase] + O2 = an S-[(1E)-1-(hydroxyimino)-omega- (methylsulfanyl)alkyl]-L-glutathione + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+).
