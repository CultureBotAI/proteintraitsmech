definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on single donors with incorporation of molecular oxygen (oxygenases). The oxygen incorporated need not be derived from O2; with incorporation of two atoms of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 3-(2,3-dihydroxyphenyl)propanoate + O2 = (2Z,4E)-2-hydroxy-6-oxonona- 2,4-dienedioate + H(+). (2) (2E)-3-(2,3-dihydroxyphenyl)prop-2-enoate + O2 = (2Z,4E,7E)-2- hydroxy-6-oxonona-2,4,7-trienedioate + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
