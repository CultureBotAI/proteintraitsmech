definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 25-hydroxycholesterol + reduced [NADPH--hemoprotein reductase] + O2 = 7alpha,25-dihydroxycholesterol + oxidized [NADPH--hemoprotein reductase] + H2O + H(+). (2) (25R)-cholest-5-ene-3beta,26-diol + reduced [NADPH--hemoprotein reductase] + O2 = (25R)-cholest-5-en-3beta,7alpha,26-triol + oxidized [NADPH--hemoprotein reductase] + H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
