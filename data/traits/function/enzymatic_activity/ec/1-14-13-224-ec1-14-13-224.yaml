definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with NADH or NADPH as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) protoviolaceinate + NADH + O2 + H(+) = violaceinate + NAD(+) + H2O. (2) protoviolaceinate + NADPH + O2 + H(+) = violaceinate + NADP(+) + H2O. (3) protodeoxyviolaceinate + NADPH + O2 + H(+) = deoxyviolaceinate + NADP(+) + H2O. (4) protodeoxyviolaceinate + NADH + O2 + H(+) = deoxyviolaceinate + NAD(+) + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
