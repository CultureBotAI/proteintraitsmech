definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on NADH or NADPH; with oxygen as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) 1,2-dihydro-beta-NAD + O2 + H(+) = H2O2 + NAD(+). (2) 1,2-dihydro-beta-NADP + O2 + H(+) = H2O2 + NADP(+). (3) 1,6-dihydro-beta-NAD + O2 + H(+) = H2O2 + NAD(+). (4) 1,6-dihydro-beta-NADP + O2 + H(+) = H2O2 + NADP(+)
    source: "ExPASy ENZYME"
    method: SOURCED
