definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) a 1-hexacosanoyl-2-acyl-phosphoglycerolipid + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a 1-[(17Z)-hexacos-17-enoyl]-2-acyl- phosphoglycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O. (2) a 1-tetracosanoyl-2-acyl-phosphoglycerolipid + 2 Fe(II)-[cytochrome b5] + O2 + 2 H(+) = a 1-[(15Z)-tetracos-15-enoyl]-2-acyl- phosphoglycerolipid + 2 Fe(III)-[cytochrome b5] + 2 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
