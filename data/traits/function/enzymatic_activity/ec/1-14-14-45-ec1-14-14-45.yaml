identifier: EC:1.14.14.45
label: "aromatic aldoxime N-monooxygenase"
definition: >-
  Enzymatic activity — aromatic aldoxime N-monooxygenase (EC 1.14.14.45). Catalysed reaction: (1) (E)-(indol-3-yl)acetaldehyde oxime + glutathione + reduced [NADPH- -hemoprotein reductase] + O2 = (E)-1-(glutathione-S-yl)-2-(1H-indol-3- yl)acetohydroximate + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+). (2) (E)-phenylacetaldehyde oxime + glutathione + reduced [NADPH- -hemoprotein reductase] + O2 = (Z)-1-(glutathione-S-yl)-2- phenylacetohydroximate + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+).
