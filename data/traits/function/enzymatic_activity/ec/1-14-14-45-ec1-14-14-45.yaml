definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (E)-(indol-3-yl)acetaldehyde oxime + glutathione + reduced [NADPH- -hemoprotein reductase] + O2 = (E)-1-(glutathione-S-yl)-2-(1H-indol-3- yl)acetohydroximate + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+). (2) (E)-phenylacetaldehyde oxime + glutathione + reduced [NADPH- -hemoprotein reductase] + O2 = (Z)-1-(glutathione-S-yl)-2- phenylacetohydroximate + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
