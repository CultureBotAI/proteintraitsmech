identifier: EC:1.14.20.3
label: "(5R)-carbapenem-3-carboxylate synthase"
definition: >-
  Enzymatic activity — (5R)-carbapenem-3-carboxylate synthase (EC 1.14.20.3). Catalysed reaction: (3S,5S)-carbapenam-3-caboxylate + 2-oxoglutarate + O2 = (5R)-carbapen-2- em-3-carboxylate + succinate + CO2 + H2O.
definition_source: ExPASy ENZYME
