identifier: EC:1.14.20.4
label: "anthocyanidin synthase"
definition: >-
  Enzymatic activity — anthocyanidin synthase (EC 1.14.20.4). Catalysed reaction: a (2R,3S,4S)-leucoanthocyanidin + 2-oxoglutarate + O2 = a 4-H- anthocyanidin with a 3-hydroxy group + succinate + CO2 + 2 H2O.
definition_source: ExPASy ENZYME
trait_axis: FUNCTION
trait_category: FUNC_ENZYMATIC_ACTIVITY
term_kind: CLASS
mapping_status: REVIEWED
