definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on the CH-OH group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (R)-3-phenyllactate + NAD(+) = 3-phenylpyruvate + NADH + H(+). (2) (2R)-2-hydroxy-3-(4-hydroxyphenyl)propanoate + NAD(+) = 3-(4-hydroxyphenyl)pyruvate + NADH + H(+). (3) 3-(indol-3-yl)lactate + NAD(+) = indole-3-pyruvate + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
