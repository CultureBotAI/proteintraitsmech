      Catalyses: N(omega)-methyl-L-arginine + 2 NADH + 3 O2 + H(+) = N(delta)-hydroxy- N(omega)-methyl-N(omega)-nitroso-L-citrulline + 2 NAD(+) + 3 H2O
    source: "ExPASy ENZYME"
    method: SOURCED
