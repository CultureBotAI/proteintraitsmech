label: "cholesterol 7-desaturase"
definition: >-
  Enzymatic activity — cholesterol 7-desaturase (EC 1.14.19.21). Catalysed reaction: (1) cholesterol + NADPH + O2 + H(+) = 7-dehydrocholesterol + NADP(+) + 2 H2O. (2) cholesterol + NADH + O2 + H(+) = 7-dehydrocholesterol + NAD(+) + 2 H2O.
