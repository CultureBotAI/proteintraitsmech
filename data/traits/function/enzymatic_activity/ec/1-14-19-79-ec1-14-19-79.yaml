definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with oxidation of a pair of donors resulting in the reduction of molecular oxygen to two molecules of water.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (22S)-22-hydroxycampesterol + reduced [NADPH--hemoprotein reductase] + O2 = (22S)-22-hydroxycampest-4-en-3-one + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+). (2) 6-deoxoteasterone + reduced [NADPH--hemoprotein reductase] + O2 = 3-dehydro-6-deoxoteasterone + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
