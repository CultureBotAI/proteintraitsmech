label: "alkyl sulfatase"
definition: >-
  Enzymatic activity — alkyl sulfatase (EC 1.14.11.77). Catalysed reaction: a primary linear alkyl sulfate ester + 2-oxoglutarate + O2 = an aldehyde + sulfate + succinate + CO2 + H(+).
