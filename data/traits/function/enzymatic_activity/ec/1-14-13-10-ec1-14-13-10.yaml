definition: >-
  Enzymatic activity — 2,6-dihydroxypyridine 3-monooxygenase (EC 1.14.13.10). Catalysed reaction: 2,6-dihydroxypyridine + NADH + O2 + H(+) = 2,3,6-trihydroxypyridine + NAD(+) + H2O.
