definition: >-
  Enzymatic activity — 4-nitrophenol 2-hydroxylase (EC 1.14.13.n7). Catalysed reaction: 4-nitrophenol + NADPH + O2 + H(+) = 4-nitrocatechol + NADP(+) + H2O.
