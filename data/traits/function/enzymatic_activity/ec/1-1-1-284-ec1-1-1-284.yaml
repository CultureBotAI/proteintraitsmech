    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) S-(hydroxymethyl)glutathione + NADP(+) = S-formylglutathione + NADPH + H(+). (2) S-(hydroxymethyl)glutathione + NAD(+) = S-formylglutathione + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
