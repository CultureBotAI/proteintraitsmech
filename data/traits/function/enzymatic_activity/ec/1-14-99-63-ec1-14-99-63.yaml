label: "beta-carotene 4-ketolase"
definition: >-
  Enzymatic activity — beta-carotene 4-ketolase (EC 1.14.99.63). Catalysed reaction: (1) all-trans-beta-carotene + 2 AH2 + 2 O2 = echinenone + 2 A + 3 H2O. (2) echinenone + 2 AH2 + 2 O2 = canthaxanthin + 2 A + 3 H2O.
