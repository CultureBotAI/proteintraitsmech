definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with NADH or NADPH as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) aurachin C + NADH + O2 + H(+) = 4-hydroxy-2-methyl-3-oxo-4-[(2E,6E)- farnesyl]-3,4-dihydroquinoline 1-oxide + NAD(+) + H2O. (2) aurachin C + NADPH + O2 + H(+) = 4-hydroxy-2-methyl-3-oxo-4-[(2E,6E)- farnesyl]-3,4-dihydroquinoline 1-oxide + NADP(+) + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
