definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with reduced iron-sulfur protein as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) toluene + 2 reduced [2Fe-2S]-[ferredoxin] + O2 + 2 H(+) = benzyl alcohol + 2 oxidized [2Fe-2S]-[ferredoxin] + H2O. (2) p-xylene + 2 reduced [2Fe-2S]-[ferredoxin] + O2 + 2 H(+) = 4-methylbenzyl alcohol + 2 oxidized [2Fe-2S]-[ferredoxin] + H2O. (3) m-xylene + 2 reduced [2Fe-2S]-[ferredoxin] + O2 + 2 H(+) = 3-methylbenzyl alcohol + 2 oxidized [2Fe-2S]-[ferredoxin] + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
