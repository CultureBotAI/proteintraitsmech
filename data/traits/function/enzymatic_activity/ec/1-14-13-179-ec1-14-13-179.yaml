definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on paired donors, with incorporation or reduction of molecular oxygen. The oxygen incorporated need not be derived from O2; with NADH or NADPH as one donor, and incorporation of one atom of oxygen.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) theobromine + NADH + O2 + H(+) = 7-methylxanthine + formaldehyde + NAD(+) + H2O. (2) theobromine + NADPH + O2 + H(+) = 7-methylxanthine + formaldehyde + NADP(+) + H2O. (3) 3-methylxanthine + NADH + O2 + H(+) = xanthine + formaldehyde + NAD(+) + H2O. (4) 3-methylxanthine + NADPH + O2 + H(+) = xanthine + formaldehyde + NADP(+) + H2O
    source: "ExPASy ENZYME"
    method: SOURCED
