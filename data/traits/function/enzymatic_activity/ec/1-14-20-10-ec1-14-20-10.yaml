  Enzymatic activity — tyrosine isonitrile desaturase/decarboxylase (EC 1.14.20.10). Catalysed reaction: (2S)-3-(4-hydroxyphenyl)-2-isocyanopropanoate + 2-oxoglutarate + O2 + H(+) = 4-[(E)-2-isocyanoethenyl]phenol + succinate + 2 CO2 + H2O.
