definitions:
  - kind: GENERAL
    text: >-
      An oxidoreductase; acting on the CH-NH2 group of donors; with NAD(+) or NADP(+) as acceptor.
    source: "EC nomenclature (enzclass)"
    method: SOURCED
  - kind: MECHANISTIC
    text: >-
      Catalyses: (1) (2R,4S)-2,4-diaminopentanoate + NADP(+) + H2O = (2R)-2-amino-4- oxopentanoate + NH4(+) + NADPH + H(+). (2) (2R,4S)-2,4-diaminopentanoate + NAD(+) + H2O = (2R)-2-amino-4- oxopentanoate + NH4(+) + NADH + H(+)
    source: "ExPASy ENZYME"
    method: SOURCED
