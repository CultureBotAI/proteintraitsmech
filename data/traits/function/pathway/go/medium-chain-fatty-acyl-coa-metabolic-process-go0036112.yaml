identifier: GO:0036112
label: "medium-chain fatty-acyl-CoA metabolic process"
definition: >-
  The chemical reactions and pathways involving medium-chain fatty-acyl-CoAs, any derivative of coenzyme A in which the sulfhydryl group is in a thioester linkage with a long-chain fatty-acyl group. A medium-chain fatty acid has an aliphatic tail containing 6 to 12 carbons.
