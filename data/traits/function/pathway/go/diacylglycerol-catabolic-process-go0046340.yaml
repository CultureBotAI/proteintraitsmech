identifier: GO:0046340
label: "diacylglycerol catabolic process"
definition: >-
  The chemical reactions and pathways resulting in the breakdown of diacylglycerol, a glyceride in which any two of the R groups (positions not specified) are acyl groups while the remaining R group can be either H or an alkyl group.
