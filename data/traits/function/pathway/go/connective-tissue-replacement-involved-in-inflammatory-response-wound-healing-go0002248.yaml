label: "connective tissue replacement involved in inflammatory response wound healing"
definition: >-
  The series of events leading to growth of connective tissue when loss of tissues that are incapable of regeneration occurs, or when fibrinous exudate cannot be adequately cleared, as part of an inflammatory response.
