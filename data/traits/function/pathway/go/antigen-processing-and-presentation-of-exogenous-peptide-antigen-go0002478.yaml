identifier: GO:0002478
label: "antigen processing and presentation of exogenous peptide antigen"
definition: >-
  The process in which an antigen-presenting cell expresses a peptide antigen of exogenous origin on its cell surface in association with an MHC protein complex. The peptide is typically a fragment of a larger exogenous protein which has been degraded within the cell.
