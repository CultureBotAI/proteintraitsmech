identifier: GO:0002098
label: "tRNA wobble uridine modification"
definition: >-
  The process in which a uridine at position 34 of a tRNA is post-transcriptionally modified. The wobble nucleoside of the tRNA sequence (position 34) corresponds to the first position of the anticodon.
