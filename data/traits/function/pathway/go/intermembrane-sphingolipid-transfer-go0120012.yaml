identifier: GO:0120012
label: "intermembrane sphingolipid transfer"
definition: >-
  The transport of sphingolipids between membranes in which a sphingolipid molecule is transported through an aqueous phase from the outer leaflet of a donor membrane to the outer leaflet of an acceptor membrane. This process does not require metabolic energy and can be either spontaneous or mediated by lipid transfer proteins (LTPs).
