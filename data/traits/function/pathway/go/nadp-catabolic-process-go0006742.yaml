label: "NADP+ catabolic process"
definition: >-
  The chemical reactions and pathways resulting in the breakdown of nicotinamide adenine dinucleotide phosphate (NADP+), a coenzyme that interconverts with its reduced form, NADPH, in many redox and biosynthetic reactions.
