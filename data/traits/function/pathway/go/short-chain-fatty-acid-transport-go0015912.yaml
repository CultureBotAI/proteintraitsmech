identifier: GO:0015912
label: "short-chain fatty acid transport"
definition: >-
  The directed movement of short-chain fatty acids into, out of or within a cell, or between cells, by means of some agent such as a transporter or pore. A short-chain fatty acid has an aliphatic tail containing fewer than 6 carbons.
