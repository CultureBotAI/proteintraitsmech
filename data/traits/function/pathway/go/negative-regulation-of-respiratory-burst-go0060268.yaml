identifier: GO:0060268
label: "negative regulation of respiratory burst"
definition: >-
  Any process that decreases the rate frequency or extent of a phase of elevated metabolic activity, during which oxygen consumption increases; this leads to the production, by an NADH dependent system, of hydrogen peroxide (H2O2), superoxide anions and hydroxyl radicals.
