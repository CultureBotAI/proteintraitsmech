identifier: GO:0061945
label: "regulation of protein K48-linked ubiquitination"
definition: >-
  Any process that modulates the rate, frequency or extent of protein K-48-linked ubiquitination, a protein ubiquitination process in which a polymer of ubiquitin, formed by linkages between lysine residues at position 48 of the ubiquitin monomers, is added to a protein. K48-linked ubiquitination targets the substrate protein for degradation.
