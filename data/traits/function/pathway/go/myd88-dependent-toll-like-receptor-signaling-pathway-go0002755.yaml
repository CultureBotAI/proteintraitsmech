identifier: GO:0002755
label: "MyD88-dependent toll-like receptor signaling pathway"
definition: >-
  A toll-like receptor signaling pathway in which the MyD88 adaptor molecule mediates transduction of the signal. Toll-like receptors directly bind pattern motifs from a variety of microbial sources to initiate an innate immune response.
