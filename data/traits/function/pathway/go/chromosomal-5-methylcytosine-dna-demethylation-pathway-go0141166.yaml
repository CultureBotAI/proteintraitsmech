identifier: GO:0141166
label: "chromosomal 5-methylcytosine DNA demethylation pathway"
definition: >-
  A process that chemically modifies 5-methylcytosine (5meC) to make it a substrate for the base excision repair pathway, which then restores the unmodified cytosine.
