identifier: GO:0038163
label: "thrombopoietin-mediated signaling pathway"
definition: >-
  The series of molecular signals initiated by thrombopoietin binding to its receptor on the surface of a target cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
