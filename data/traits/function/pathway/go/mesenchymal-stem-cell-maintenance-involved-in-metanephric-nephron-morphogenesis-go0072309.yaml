identifier: GO:0072309
label: "mesenchymal stem cell maintenance involved in metanephric nephron morphogenesis"
definition: >-
  The process in which an organism retains a population of mesenchymal stem cells that contributes to the shaping of a nephron in the metanephros. A mesenchymal stem cell is a cell that retains the ability to divide and proliferate throughout life to provide progenitor cells that can differentiate into specialized mesenchymal cells.
