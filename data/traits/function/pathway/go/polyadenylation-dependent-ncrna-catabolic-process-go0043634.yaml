identifier: GO:0043634
label: "polyadenylation-dependent ncRNA catabolic process"
definition: >-
  The chemical reactions and pathways resulting in the breakdown of a noncoding RNA (ncRNA) molecule, initiated by the enzymatic addition of a sequence of adenylyl residues (polyadenylation) at the 3' end the target ncRNA.
