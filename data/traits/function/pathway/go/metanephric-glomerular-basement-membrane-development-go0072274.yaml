identifier: GO:0072274
label: "metanephric glomerular basement membrane development"
definition: >-
  The process whose specific outcome is the progression of the metanephric glomerular basement membrane over time, from its formation to the mature structure. The metanephric glomerular basement membrane is the basal laminal portion of the metanephric glomerulus which performs the actual filtration.
