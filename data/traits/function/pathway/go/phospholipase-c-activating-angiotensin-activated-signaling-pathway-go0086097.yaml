identifier: GO:0086097
label: "phospholipase C-activating angiotensin-activated signaling pathway"
definition: >-
  A phospholipase C-activating G protein-coupled receptor signaling pathway initiated by angiotensin binding to its receptor on the surface of a target cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
