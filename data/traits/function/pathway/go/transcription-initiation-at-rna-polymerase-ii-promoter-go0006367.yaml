identifier: GO:0006367
label: "transcription initiation at RNA polymerase II promoter"
definition: >-
  A transcription initiation process that takes place at a RNA polymerase II gene promoter. Messenger RNAs (mRNA) genes, as well as some non-coding RNAs, are transcribed by RNA polymerase II.
