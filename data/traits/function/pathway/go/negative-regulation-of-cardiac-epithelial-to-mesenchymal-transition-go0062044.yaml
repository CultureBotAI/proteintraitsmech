identifier: GO:0062044
label: "negative regulation of cardiac epithelial to mesenchymal transition"
definition: >-
  Any process that stops or decreases the rate, frequency or extent of cardiac epithelial to mesenchymal transition, a transition where a cardiac epithelial cell loses apical/basolateral polarity, severs intercellular adhesive junctions, degrades basement membrane components and becomes a migratory mesenchymal cell.
