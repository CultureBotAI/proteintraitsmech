identifier: GO:0007193
label: "adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway"
definition: >-
  A G protein-coupled receptor signaling pathway in which the signal is transmitted via the inhibition of adenylyl cyclase activity and a subsequent decrease in the intracellular concentration of cyclic AMP (cAMP).
