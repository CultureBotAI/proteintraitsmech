identifier: GO:0046543
label: "development of animal secondary female sexual characteristics"
definition: >-
  The process whose specific outcome is the progression of the secondary female sexual characteristics over time, from their formation to the mature structures. In female mammals, examples include growth of axillary and pubic hair, breast development and menstrual periods. Their development occurs in response to sex hormone secretion.
