identifier: GO:0021659
label: "rhombomere 3 structural organization"
definition: >-
  The process that contributes to creating the structural organization of rhombomere 3. This process pertains to the physical shaping of a rudimentary structure. Rhombomeres are transverse segments of the developing rhombencephalon. Rhombomeres are lineage restricted, express different genes from one another, and adopt different developmental fates. Rhombomeres are numbered in an anterior to posterior order.
