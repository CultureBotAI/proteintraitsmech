identifier: GO:0070407
label: "oxidation-dependent protein catabolic process"
definition: >-
  The chemical reactions and pathways resulting in the breakdown of a protein or peptide by hydrolysis of its peptide bonds, initiated by the oxidation of one or more amino acid residues in the protein.
