identifier: GO:1900087
label: "positive regulation of G1/S transition of mitotic cell cycle"
definition: >-
  Any signaling pathway that increases or activates a cell cycle cyclin-dependent protein kinase to modulate the switch from G1 phase to S phase of the mitotic cell cycle.
