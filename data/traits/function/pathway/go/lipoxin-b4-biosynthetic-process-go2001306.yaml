identifier: GO:2001306
label: "lipoxin B4 biosynthetic process"
definition: >-
  The chemical reactions and pathways resulting in the formation of lipoxin B4. Lipoxin B4 is a C20 hydroxy fatty acid having (5S)-, (14R)- and (15S)-hydroxy groups as well as (6E)- (8Z)-, (10E)- and (12E)-double bonds.
