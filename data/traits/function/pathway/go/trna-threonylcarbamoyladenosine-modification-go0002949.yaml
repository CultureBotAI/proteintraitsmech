identifier: GO:0002949
label: "tRNA threonylcarbamoyladenosine modification"
definition: >-
  The attachment of a carbonyl group and a threonine to the amino group of the adenine residue immediately 3' of the anticodon, in tRNAs that decode ANN codons (where N is any base).
