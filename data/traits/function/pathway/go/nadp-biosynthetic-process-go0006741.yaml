identifier: GO:0006741
label: "NADP+ biosynthetic process"
definition: >-
  The chemical reactions and pathways resulting in the formation of nicotinamide adenine dinucleotide phosphate (NADP+), a coenzyme that interconverts with its reduced form, NADPH, in many redox and biosynthetic reactions.
