identifier: GO:0038171
label: "cannabinoid signaling pathway"
definition: >-
  A G protein-coupled receptor signaling pathway initiated by a cannabinoid binding to its receptor on the cell surface, and ending with the regulation of a downstream cellular process, e.g. transcription. Cannabinoids are a class of diverse chemical compounds that include the endocannabinoids and the phytocannabinoids.
