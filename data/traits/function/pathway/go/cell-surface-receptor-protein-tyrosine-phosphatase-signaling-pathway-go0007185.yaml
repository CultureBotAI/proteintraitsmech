identifier: GO:0007185
label: "cell surface receptor protein tyrosine phosphatase signaling pathway"
definition: >-
  The series of molecular signals initiated by an extracellular ligand binding to a receptor on the surface of the target cell where the receptor possesses protein tyrosine phosphatase activity, and ending with the regulation of a downstream cellular process, e.g. transcription.
