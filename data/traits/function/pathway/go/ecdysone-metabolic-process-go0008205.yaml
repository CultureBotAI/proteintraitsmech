identifier: GO:0008205
label: "ecdysone metabolic process"
definition: >-
  The chemical reactions and pathways involving ecdysone, (22R)-2-beta,3-beta,14,22,25-pentahydroxycholest-7-en-6-one, an ecdysteroid found in insects. It is the inactive prohormone of the moulting hormone ecdysterone and may have intrinsic hormonal activity at other stages of insect development.
