identifier: GO:0061057
label: "peptidoglycan recognition protein signaling pathway"
definition: >-
  The series of molecular signals initiated by binding of peptidoglycan to a receptor and ending with regulation of a downstream cellular process. The main outcome of the Imd signaling is the production of antimicrobial peptides.
