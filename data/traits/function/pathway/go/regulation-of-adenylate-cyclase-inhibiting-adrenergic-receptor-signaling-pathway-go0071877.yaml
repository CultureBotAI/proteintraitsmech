identifier: GO:0071877
label: "regulation of adenylate cyclase-inhibiting adrenergic receptor signaling pathway"
definition: >-
  Any process that modulates the frequency, rate or extent of an adenylate cyclase-inhibiting adrenergic receptor signaling pathway activity. An adrenergic receptor signaling pathway is the series of molecular signals generated as a consequence of an adrenergic receptor binding to one of its physiological ligands.
