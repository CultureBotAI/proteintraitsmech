identifier: GO:0072213
label: "metanephric capsule development"
definition: >-
  The process whose specific outcome is the progression of the metanephric capsule over time, from its formation to the mature structure. The metanephric capsule is the tough fibrous layer surrounding the metanephros, covered in a thick layer of perinephric adipose tissue. It provides some protection from trauma and damage.
