identifier: GO:0007223
label: "Wnt signaling pathway, calcium modulating pathway"
definition: >-
  A type of non-canonical Wnt signaling in which Wnt binding to its receptor on the surface of a target cell leads to an increase in intracellular calcium and activation of protein kinase C (PKC).
