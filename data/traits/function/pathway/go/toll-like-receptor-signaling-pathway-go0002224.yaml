identifier: GO:0002224
label: "toll-like receptor signaling pathway"
definition: >-
  The series of molecular signals initiated by a ligand binding to a toll-like receptor of a target cell. Toll-like receptors directly bind pattern motifs from a variety of microbial sources to initiate an innate immune response.
