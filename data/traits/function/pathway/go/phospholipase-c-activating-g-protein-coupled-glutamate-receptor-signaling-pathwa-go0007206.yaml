identifier: GO:0007206
label: "phospholipase C-activating G protein-coupled glutamate receptor signaling pathway"
definition: >-
  A phospholipase C-activating G protein-coupled receptor signaling pathway initiated by glutamate binding to its receptor on the surface of a target cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
