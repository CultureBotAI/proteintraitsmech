identifier: GO:0072386
label: "plus-end-directed organelle transport along microtubule"
definition: >-
  The directed movement of an organelle towards the plus end of a microtubule, mediated by motor proteins. This process begins with the attachment of an organelle to a microtubule, and ends when the organelle reaches its final destination.
