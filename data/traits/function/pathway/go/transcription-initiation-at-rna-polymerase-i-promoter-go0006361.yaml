identifier: GO:0006361
label: "transcription initiation at RNA polymerase I promoter"
definition: >-
  A transcription initiation process that takes place at a RNA polymerase I gene promoter. Ribosomal RNAs (rRNA) genes are transcribed by RNA polymerase I.
