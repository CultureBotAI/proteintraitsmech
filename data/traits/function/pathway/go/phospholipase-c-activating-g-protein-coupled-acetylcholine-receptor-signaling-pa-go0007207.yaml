identifier: GO:0007207
label: "phospholipase C-activating G protein-coupled acetylcholine receptor signaling pathway"
definition: >-
  A phospholipase C-activating G protein-coupled receptor signaling pathway initiated by acetylcholine binding to its receptor on the surface of a target cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
