identifier: GO:0034355
label: "NAD+ biosynthetic process via the salvage pathway"
definition: >-
  The chemical reactions and pathways resulting in the formation of nicotinamide-adenine dinucleotide (NAD+) from vitamin B3 derivatives (including nicotinic acid (NA) and nicotinamide (NAM)), beta-nicotinamide D-ribonucleotide (NMN), nicotinamide riboside (NR) or nicotinate riboside (NAR), without de novo synthesis.
