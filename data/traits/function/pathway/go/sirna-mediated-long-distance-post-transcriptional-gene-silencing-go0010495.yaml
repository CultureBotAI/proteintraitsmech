identifier: GO:0010495
label: "siRNA-mediated long-distance post-transcriptional gene silencing"
definition: >-
  An siRNA-mediated posttranscriptional gene silencing pathway in which small interfering RNAs (siRNAs) direct the cleavage of target mRNAs, and in which the silencing signal originates in one tissue and occurs in a different tissue.
