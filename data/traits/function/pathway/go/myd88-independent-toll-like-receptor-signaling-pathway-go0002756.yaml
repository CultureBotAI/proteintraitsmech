label: "MyD88-independent toll-like receptor signaling pathway"
definition: >-
  A toll-like receptor signaling pathway not relying on the MyD88 adaptor molecule. Toll-like receptors directly bind pattern motifs from a variety of microbial sources to initiate innate an immune response.
