identifier: GO:0002101
label: "tRNA wobble cytosine modification"
definition: >-
  The process in which a cytosine at position 34 of a tRNA is post-transcriptionally modified. The wobble nucleoside of the tRNA sequence (position 34) corresponds to the first position of the anticodon.
