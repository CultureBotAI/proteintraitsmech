identifier: GO:0002100
label: "tRNA wobble adenosine to inosine editing"
definition: >-
  The process in which an adenosine at position 34 of a tRNA is post-transcriptionally converted to inosine. The wobble nucleoside of the tRNA sequence (position 34) corresponds to the first position of the anticodon.
