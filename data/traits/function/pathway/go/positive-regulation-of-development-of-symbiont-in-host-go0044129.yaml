identifier: GO:0044129
label: "positive regulation of development of symbiont in host"
definition: >-
  Any process in which the symbiont activates or maintains its progression from an initial condition to a later condition, within the cells or tissues of the host organism. The host is defined as the larger of the organisms involved in the symbiotic interaction.
