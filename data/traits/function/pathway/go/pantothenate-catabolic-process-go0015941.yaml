identifier: GO:0015941
label: "pantothenate catabolic process"
definition: >-
  The chemical reactions and pathways resulting in the breakdown of pantothenate, the anion of pantothenic acid. It is a B complex vitamin that is a constituent of coenzyme A and is distributed ubiquitously in foods.
