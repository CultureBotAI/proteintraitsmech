identifier: GO:0038162
label: "erythropoietin-mediated signaling pathway"
definition: >-
  The series of molecular signals initiated by erythropoietin (EPO) binding to the erythropoietin receptor (EPO-R) on the surface of a target cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
