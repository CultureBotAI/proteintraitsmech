identifier: GO:0038154
label: "interleukin-11-mediated signaling pathway"
definition: >-
  The series of molecular signals initiated by the binding of interleukin-11 to its receptor on the surface of a target cell, and ending with the regulation of a downstream cellular process, e.g. transcription.
