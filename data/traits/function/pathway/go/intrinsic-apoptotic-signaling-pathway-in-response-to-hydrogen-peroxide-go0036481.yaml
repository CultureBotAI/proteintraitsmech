identifier: GO:0036481
label: "intrinsic apoptotic signaling pathway in response to hydrogen peroxide"
definition: >-
  The series of molecular signals in which an intracellular signal is conveyed to trigger the apoptotic death of a cell. The pathway is induced in response to hydrogen peroxide (H2O2).
