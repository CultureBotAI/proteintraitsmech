identifier: proteintraitsmech:COILED_COIL_HEPTAD_REPEAT
label: "heptad-repeat coiled-coil segment"
definition: >-
  A supercoiled alpha-helical bundle motif defined at the sequence level by a seven-residue (abcdefg)n heptad periodicity with hydrophobic residues at core positions a and d and polar/charged residues at e and g, packing via Crick knobs-into-holes geometry.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE_STRUCTURE
trait_category: MIXED_COILED_COIL
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:COILED_COIL
synonyms:
  - synonym_text: "canonical (abcdefg)n coiled coil"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "knobs-into-holes heptad coiled coil"
    synonym_type: EXACT_SYNONYM
xrefs:
  - SO:0001080
detection_methods:
  - name: "DeepCoil2 / Marcoil / LOGICOIL coiled-coil & oligomeric state predictor"
    method_type: ML_PREDICTOR
    edam_operation: EDAM:operation_0268
    tool: "biotools:marcoil"
    evidence_code: ECO:0007669
    reference: PMID:30590416
    recipe: "deepcoil -i {input} -o {output}"
  - name: "SOCKET2 knobs-into-holes coiled-coil geometry assignment"
    method_type: STRUCTURAL_ALGORITHM
    edam_operation: EDAM:operation_0268
    tool: "biotools:socket2"
    evidence_code: ECO:0007669
    reference: PMID:34643705
    recipe: "socket2 -f {input} -c 7.0 -o {output}"
evidence:
  - reference: PMID:28118746
    notes: "Sequence-to-structure rules of heptad and non-heptad coiled coils (Woolfson 2017)."
  - reference: PMID:34643705
    notes: "SOCKET2: geometric identification of knobs-into-holes packing in coiled coils."
