identifier: InterPro:IPR012902
label: "Prokaryotic N-terminal methylation site"
definition: >-
  This short motif directs methylation of the conserved phenylalanine residue. It is most often found at the N terminus of pilins and other proteins involved in secretion (see InterPro:IPR001082, InterPro:IPR010271, InterPro:IPR003413 and InterPro:IPR011453 ).
