identifier: PANTHER:PTHR14523
label: "UNCHARACTERIZED PROTEIN C17ORF53 HOMOLOG"
definition: >-
  This family includes human Homologous recombination OB-fold protein (HROB) and similar eukaryotic proteins. During homologous recombination, HROB acts by recruiting the MCM8-MCM9 helicase complex to sites of DNA damage to promote DNA repair synthesis. A C-terminal region including the OB-fold domain ( InterPro:IPR058570 ) stimulates the helicase activity of MCM8-MCM9 probably by altering its conformation.
