identifier: PANTHER:PTHR15377
label: "TRANSCRIPTION ELONGATION REGULATOR 1"
definition: >-
  This entry includes TCRG1/TCRGL from human and related proteins from animals, fungi and plants. This entry also includes dre4 from fission yeast, URN1 from budding yeast and PRP40C from Arabidopsis. They are predicted to be involved in pre-mRNA splicing. The plant PRP40C binds the phosphorylated C-terminal domain of the largest subunit of RNA polymerase II and its two WW domains were shown to mediate this interaction. TCRG1 (also known as CA150) contains three N-terminal WW domains and six consecutive FF domains (InterPro:IPR002713). WW and FF domains are versatile modules that mediate protein-protein interactions. TCRG1 is a transcription elongation factor that interacts with the splicing factor SF1 and with the phosphorylated C-terminal repeat domain (CTD) of RNA polymerase II (RNAPII) through its WW and FF domains, respectively. It regulates transcription elongation in a TATA box-dependent manner. They bind the phosphorylated C-terminal of RNA polymerase II and mediate interactions with other proteins such as HTATSF1.
definition_source: "InterPro:IPR045148 abstract (PANTHER PTHR15377 is a member signature)"
