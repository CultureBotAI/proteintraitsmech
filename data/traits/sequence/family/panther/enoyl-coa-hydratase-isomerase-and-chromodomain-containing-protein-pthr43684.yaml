      Enoyl-CoA hydratase/isomerase and chromodomain-containing protein — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43684. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 6 of its annotated subfamilies. Subfamilies localise to intracellular membrane-bounded organelle, intracellular anatomical structure.
