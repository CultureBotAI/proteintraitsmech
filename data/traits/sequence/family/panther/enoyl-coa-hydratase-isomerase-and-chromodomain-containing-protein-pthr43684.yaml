  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in various metabolic processes, such as the isomerization of enoyl-CoA species and the dehalogenation of halobenzoyl-CoA compounds. Members of this family exhibit activities like hydratase, isomerase, and dehalogenase, playing roles in fatty acid metabolism, biosynthesis of host-selective toxins, and chromatin modification. Some proteins within this family are involved in epigenetic regulation by recognizing and binding specific histone modifications, influencing gene expression, DNA repair, and chromatin structure. Others are implicated in the biosynthesis of toxins affecting plant pathogens. The family also contains proteins with unclear or uncharacterized functions.
    source: "InterPro:IPR051053 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
