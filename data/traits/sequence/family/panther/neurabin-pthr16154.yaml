identifier: PANTHER:PTHR16154
label: NEURABIN
definition: >-
  This entry includes the SAM domains-containing proteins such as Neurabin-1/Neurabin-2 and SAMD14 (Sterile alpha motif domain-containing protein 14). Most of them are multidomain proteins and in addition to SAM domain they contain other protein-binding domains such as PDZ and actin-binding domains. Members of this family participate in signal transduction. Neurabin-1 is involved in the regulation of Ca(2+) signaling intensity in alpha-adrenergic receptors. It forms a functional pair of opposing regulators with neurabin-2. Neurabins are expressed almost exclusively in neuronal cells. They are known to interact with protein phosphatase 1 and inhibit its activity. They also can bind actin filaments. The function of SAMD14 is not clear.
