definition: >-
  DNA CROSS-LINK REPAIR PROTEIN PSO2/SNM1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23240. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function DNA exonuclease activity, producing 5'-phosphomonoesters, 5'-3' exonuclease activity, damaged DNA binding. Members participate in double-strand break repair via nonhomologous end joining, interstrand cross-link repair.
