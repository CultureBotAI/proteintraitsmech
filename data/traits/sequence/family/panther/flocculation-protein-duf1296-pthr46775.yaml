identifier: PANTHER:PTHR46775
label: "FLOCCULATION PROTEIN (DUF1296)"
definition: >-
  This entry includes GIP1 and GIP1L from plants. GIP1 may act as a coactivator that regulates transcription factors involved in lateral organ development of plants, such as bZIP transcription factors and LBD18. The function of GIP1L is not clear.
