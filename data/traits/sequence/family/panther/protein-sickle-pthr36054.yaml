identifier: PANTHER:PTHR36054
label: "PROTEIN SICKLE"
definition: >-
  Plant protein SICKLE is required for development and abiotic stress tolerance, and is involved in microRNA biogenesis and mRNA splicing. SICKLE, also known as ROTUNDA 3, may contribute to plant development by phosphatase 2A-mediated regulation of auxin transporter recycling.
