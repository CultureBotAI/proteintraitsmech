identifier: PANTHER:PTHR11963
label: "LEUCINE AMINOPEPTIDASE-RELATED"
definition: >-
  The majority of members of this family are zinc-dependent exopeptidases belonging to MEROPS peptidase family M17 (leucyl aminopeptidase, clan MF). Leucyl aminopeptidase (LAP; EC:3.4.11.1) selectively release N-terminal amino acid residues from polypeptides and proteins; in general they are involved in the processing, catabolism and degradation of intracellular proteins. Leucyl aminopeptidase forms a homohexamer containing two trimers stacked on top of one another. Each monomer binds two zinc ions. The zinc-binding and catalytic sites are located within the C-terminal catalytic domain. Leucine aminopeptidase has been shown to be identical with prolyl aminopeptidase (EC:3.4.11.5) in mammals. This entry also includes Crystallomitin S-Lap1-8 from Drosophila melanogaster, which is a structural component of the paracrystalline material found in the major mitochondrial derivative of male germ cells. Although these proteins belong to the peptidase M17 family, they lack the active site Lys and Arg residues and zinc binding sites, suggesting they have no aminopeptidase activity.
