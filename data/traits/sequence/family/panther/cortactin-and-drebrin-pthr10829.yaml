identifier: PANTHER:PTHR10829
label: "CORTACTIN AND DREBRIN"
definition: >-
  CORTACTIN AND DREBRIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10829. PANTHER protein class: cytoskeletal protein, actin or actin-binding cytoskeletal protein, non-motor actin binding protein. Members are annotated with the molecular function actin filament binding. Members participate in regulation of supramolecular fiber organization, regulation of actin filament organization, regulation of actin polymerization or depolymerization. Members localise to cytoplasm, non-membrane-bounded organelle, supramolecular polymer.
