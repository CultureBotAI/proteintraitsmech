identifier: PANTHER:PTHR11814
label: "SULFATE TRANSPORTER"
definition: >-
  The SLC26A/SulP family is a large and ubiquitous family with members derived from archaea, bacteria, fungi, plants and animals. Many organisms including Bacillus subtilis, Synechocystis sp, Saccharomyces cerevisiae, Arabidopsis thaliana and C. elegans possess multiple SulP family paralogues. Many of these proteins are functionally characterised, and most are inorganic anion uptake transporters or anion:anion exchange transporters. Some transport their substrate(s) with high affinities, while others transport it or them with relatively low affinities. SLC26A/SulP family proteins consist of N-and C-termini flanking a transmembrane domain thought to span the lipid bilayer 10-14 times. In most cases, the C-terminal cytoplasmic region includes a STAS (sulfate transporter and anti-sigma factor antagonist) domain. Malfunctions in members of the SLC26A family of anion transporters are involved in three human diseases: diastrophic dysplasia/achondrogenesis type 1B (DTDST), Pendred's syndrome (PDS) and congenital chloride diarrhoea (CLD). These proteins contain 12 transmembrane helices followed by a cytoplasmic STAS domain at the C-terminal. The importance of the STAS domain in these transporters is illustrated by the fact that a number of mutations in PDS and DTDST map to it. Proteins in this family include: Neurospora crassa sulphate permease II (gene cys-14). Yeast sulphate permeases (SUL1 and SUL2). Rat sulphate anion transporter 1 (SAT-1). Mammalian DTDST, a probable sulphate transporter which, in human, is involved in the genetic disease, diastrophic dysplasia (DTD). Sulphate transporters 1, 2 and 3 from the legume Stylosanthes hamata. Human pendrin (gene PDS), which is involved in a number of hearing loss genetic diseases. Human protein DRA (Down-Regulated in Adenoma). Soy
