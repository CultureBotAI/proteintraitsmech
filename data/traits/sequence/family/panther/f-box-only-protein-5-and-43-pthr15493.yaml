identifier: PANTHER:PTHR15493
label: "F-BOX ONLY PROTEIN 5 AND 43"
definition: >-
  This entry represents F-box only protein 5 and 43 (FBX5/43, also known as Emi1/Emi2, respectively) from human and similar proteins from animals. FBX5 is a regulator of the anaphase-promoting complex (APC) activity during mitotic and meiotic cell cycle. It promotes migration and osteogenic differentiation of mesenchymal stem cells. FBX43 is required to establish and maintain the arrest of oocytes at the second meiotic metaphase until fertilization. This protein acts by inhibiting the APC/cyclosome ubiquitin ligase. It probably recognises and binds to some phosphorylated proteins and promotes their ubiquitination and degradation.
definition_source: "InterPro:IPR047147 abstract (PANTHER PTHR15493 is a member signature)"
