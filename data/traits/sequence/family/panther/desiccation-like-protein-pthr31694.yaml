  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the protection and stabilization of specific pigments. One known function is the facilitation of pigment formation through the condensation of specific aldehydes and amino acids, resulting in compounds with stable imine bonds. These pigments serve as visual attractants for pollinators. Additionally, members of this family exhibit catalase activity, protecting the pigment from degradation by reactive oxygen species by catalyzing the conversion of hydrogen peroxide into water and oxygen.
