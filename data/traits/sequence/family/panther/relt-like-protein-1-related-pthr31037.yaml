identifier: PANTHER:PTHR31037
label: "RELT-LIKE PROTEIN 1-RELATED"
definition: >-
  RELT-like protein 1 (RELL1) belongs to the RELT family. Its overexpression induces activation of MAPK14/p38 cascade. RELT (receptor expressed in lymphoid tissues) is a member of the TNFR superfamily. The messenger RNA of RELT is especially abundant in hematologic tissues such as spleen, lymph node, and peripheral blood leukocytes as well as in leukemias and lymphomas. RELT is able to activate the NF-kappaB pathway and selectively binds tumor necrosis factor receptor-associated factor 1. RELT like proteins 1 and 2 (RELL1 and RELL2) are two RELT homologues that bind to RELT. The expression of RELL1 at the mRNA level is ubiquitous, whereas expression of RELL2 mRNA is more restricted to particular tissues.
definition_source: "InterPro:IPR042315 abstract (PANTHER PTHR31037 is a member signature)"
