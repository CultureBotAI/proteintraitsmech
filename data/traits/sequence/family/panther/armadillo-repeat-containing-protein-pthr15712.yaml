identifier: PANTHER:PTHR15712
label: "ARMADILLO REPEAT CONTAINING PROTEIN"
definition: >-
  This family of proteins is involved in the regulation of mitochondrial dynamics, particularly affecting the distribution and transport of mitochondria within neural cells. Members of this family may interact with components of the Trak-kinesin motor complex, linking mitochondria to motor proteins and influencing their movement along axons. The proteins are implicated in processes such as axon regeneration, neuronal survival, and neurite growth. Some family members may also play a role in transcriptional regulation, influencing the expression of genes related to neuronal function. Additionally, certain proteins within this family may have a role in modulating cell survival and growth, and could interact with cellular pathways that involve tumor suppressor proteins.
