identifier: PANTHER:PTHR47192
label: "THIOREDOXIN-LIKE 3-2, CHLOROPLASTIC"
definition: >-
  Thioredoxins play key regulatory roles in chloroplasts by linking photosynthetic light reactions to a series of plastid functions. This entry represents a group of thioredoxin-like proteins, including WCRKC-1 and WCRKC-2 from Arabidopsis. They are targeted to the stroma.
