identifier: PANTHER:PTHR47469
label: MONOOXYGENASE-LIKE
definition: >-
  This family of proteins includes enzymes that are involved in the metabolic breakdown of nicotine, such as 2,6-dihydroxypyridine 3-monooxygenase from Paenarthrobacter nicotinovorans. Specifically, they are responsible for the enzymatic reaction that transforms 2,6-dihydroxypyridine to 2,3,6-trihydroxypyridine. This reaction is a step in the nicotine degradation pathway, which is a process that allows organisms to utilize nicotine as a carbon and nitrogen source. The activity of these enzymes is crucial for the detoxification and catabolism of nicotine compounds.
definition_source: "InterPro:IPR053212 abstract (PANTHER PTHR47469 is a member signature)"
