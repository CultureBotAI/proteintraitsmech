identifier: PANTHER:PTHR16029
label: "CENTROSOMAL PROTEIN OF 192 KDA"
definition: >-
  This entry includes Spd2 (spindle-defective protein 2) from Caenorhabditis elegans, CEP192 (centrosomal protein of 192kDa) from humans, and homologues from metazoa and fungi. Spd2 is required both for centrosome duplication and maturation. CEP19 is required for mitotic centrosome and spindle assembly. They are required for pericentriolar material (PCM) recruitment.
definition_source: "InterPro:IPR039103 abstract (PANTHER PTHR16029 is a member signature)"
