identifier: PANTHER:PTHR47317
label: "PROTEIN LHCP TRANSLOCATION DEFECT"
definition: >-
  Protein LHCP TRANSLOCATION DEFECT (LTD, also known as GDC1) is a chloroplast protein that interacts with both proteins from the signal recognition particle (SRP) pathway and the inner chloroplast envelope. It is required for chloroplast grana formation in Arabidopsis.
