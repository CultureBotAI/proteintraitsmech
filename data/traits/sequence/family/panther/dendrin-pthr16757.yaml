identifier: PANTHER:PTHR16757
label: DENDRIN
definition: >-
  Dendrin is a cytosolic protein that is expressed in the brain, where it interacts with alpha-actinin, possibly modulating the structure of the actin cytoskeleton. Dendrin is also expressed in the kidney. It may have a role in apoptosis of kidney glomerular podocytes.
