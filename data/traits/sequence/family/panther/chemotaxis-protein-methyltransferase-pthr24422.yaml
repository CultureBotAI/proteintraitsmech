  - kind: GENERAL
    text: >-
      The protein family consists of chemotaxis protein methyltransferases that are primarily involved in the post-translational modification of membrane-bound methyl-accepting chemotaxis proteins (MCPs). These enzymes catalyze the methylation of MCPs to form gamma-glutamyl methyl ester residues, a modification that is crucial for the chemotactic response and adaptation in various bacterial species. The methylation process modulates the signaling pathways that govern bacterial movement towards favorable environments or away from repellents. Some family members are also implicated in biofilm formation and may have specific targets such as the McpS and McpB chemoreceptors. Additionally, one member is involved in the aggregation of cells during fruiting body formation in Myxococcus xanthus, indicating a role in complex multicellular behavior.
    source: "InterPro:IPR050903 abstract (LLM-generated, not curator-reviewed)"
