  - kind: GENERAL
    text: >-
      This family of proteins is involved in diverse cellular processes, including post-translational modification and molecular chaperoning. One member is essential for diphthamide biosynthesis, a unique modification of histidine in elongation factor 2, which is crucial for accurate protein synthesis. Another member functions as a molecular chaperone, contributing to the structural organization of cellular compartments and playing a role in plant development. These proteins may also have metal-binding capabilities, with a domain that can bind zinc or iron ions.
