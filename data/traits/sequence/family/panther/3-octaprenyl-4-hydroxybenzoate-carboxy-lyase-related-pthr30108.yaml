identifier: PANTHER:PTHR30108
label: "3-OCTAPRENYL-4-HYDROXYBENZOATE CARBOXY-LYASE-RELATED"
definition: >-
  This family of proteins is found in prokaryotes, archaea and fungi, with two members in Archaeoglobus fulgidus. They are related to UbiD, a 3-octaprenyl-4-hydroxybenzoate carboxy-lyase (also known as polyprenyl p-hydroxybenzoate decarboxylase) from Escherichia coli that is involved in ubiquinone biosynthesis. The member from Helicobacter pylori has a C-terminal extension of just over 100 residues that is shared, in part, by the Aquifex aeolicus homologue. Proteins in this entry includes: Bacterial UbiD that catalyses the decarboxylation of 3-octaprenyl-4-hydroxy benzoate to 2-octaprenylphenol. It is involved in ubiquinone biosynthesis. Budding yeast Fdc1 that catalyses the reversible decarboxylation of aromatic carboxylic acids like ferulic acid, p-coumaric acid or cinnamic acid, producing the corresponding vinyl derivatives 4-vinylphenol, 4-vinylguaiacol, and styrene, respectively, which play the role of aroma metabolites. Fdc1 is not essential for ubiquinone synthesis. 4-hydroxybenzoate decarboxylase subunit C (also known as HBDC) that catalyses the reversible decarboxylation of 4-hydroxybenzoate. Phenolic acid decarboxylase subunit C (YclC) that can catalyse the reversible decarboxylation of 4-hydroxybenzoate and vanillate and can also decarboxylate 3,4-dihydroxybenzoate. Anhydromevalonate phosphate decarboxylase which is involved in Involved in the archaeal mevalonate pathway and catalyses the conversion of trans-anhydromevalonate 5-phosphate (tAHMP) into isopentenyl phosphate.
definition_source: "InterPro:IPR002830 abstract (PANTHER PTHR30108 is a member signature)"
