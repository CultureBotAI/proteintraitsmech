identifier: PANTHER:PTHR23166
label: "FILAMIN/GPBP-INTERACTING PROTEIN"
definition: >-
  The protein family is involved in the regulation of actin dynamics and dendritic spine maintenance in neurons. Members of the family control the distribution of cortactin in hippocampal neurons, influencing dendritic spinogenesis. Some proteins within the family interact with filamin-A and F-actin, affecting cell migration from the ventricular zone and potentially inducing filamin-A degradation. Others regulate lamellipodial actin dynamics in a cortactin-dependent manner, impacting actin branch density and lamellipodial protrusion. Additionally, certain members exhibit antiangiogenic activity in endothelial cells, inhibiting cell proliferation, migration, and inducing apoptosis, and can inhibit tumor growth when expressed in tumor-associated vasculature.
