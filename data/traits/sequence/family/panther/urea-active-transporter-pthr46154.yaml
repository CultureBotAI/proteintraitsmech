identifier: PANTHER:PTHR46154
label: "Urea active transporter"
definition: >-
  This entry represents a group of urea transporters, including Dur3 from budding yeast and its homologues from plants. Budding yeast Dur3 is a plasma membrane transporter for both urea and polyamines. In maize plants, ZmDUR3 functions as an active urea permease with physiological roles in effective urea uptake and nitrogen remobilisation. Arabidopsis AtDUR3 is the major transporter for high-affinity urea uptake in Arabidopsis roots. This entry also includes the spermidine transporter DUR3 from C. albicans, the orthologue of plants and yeast DUR3.
definition_source: "InterPro:IPR031155 abstract (PANTHER PTHR46154 is a member signature)"
