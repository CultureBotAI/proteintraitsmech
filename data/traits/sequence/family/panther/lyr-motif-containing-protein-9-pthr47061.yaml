  - kind: GENERAL
    text: >-
      This family of proteins contains the LYR motif, which is indicative of a role in mitochondrial complex I assembly or function. Members of this family are likely involved in the biogenesis and maintenance of the mitochondrial respiratory chain, specifically complex I, which is responsible for the initial step of electron transport. The LYR motif is known to mediate interactions with iron-sulfur cluster assembly proteins, suggesting a role in the incorporation of iron-sulfur clusters into complex I subunits. As such, these proteins may be essential for cellular energy metabolism and mitochondrial function.
