identifier: PANTHER:PTHR13425
label: "HEADCASE PROTEIN"
definition: >-
  The functions of this group of proteins are unclear. Drosophila headcase(hdc) protein is involved in dendrite pruning and is a branching inhibitor during tracheal development. It also promotes cell survival and niche maintenance in the Drosophila testis. The human headcase protein may be part of the regulatory mechanism in the development of epithelial tube networks such as the circulatory system and lungs and may play an important role in some human cancers.
