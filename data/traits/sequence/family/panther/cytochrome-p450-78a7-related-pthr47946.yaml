identifier: PANTHER:PTHR47946
label: "CYTOCHROME P450 78A7-RELATED"
definition: >-
  The Cytochrome P450 78A family is involved in various developmental processes in plants. Members of this family play crucial roles in regulating the growth of leaves, flowers, seeds, and fruits, often acting in a non-cell-autonomous manner. They are implicated in the timing of lateral organ formation and the duration of vegetative phases, such as the plastochron. Some family members function in association with others to regulate the relative growth of the shoot apical meristem and plant organs, as well as to stimulate cell proliferation in developing ovules, thereby promoting seed growth. The family operates through mechanisms that are distinct from classical phytohormones, suggesting the generation of unique mobile growth signals.
definition_source: "InterPro:IPR051996 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, not curator-reviewed)"
