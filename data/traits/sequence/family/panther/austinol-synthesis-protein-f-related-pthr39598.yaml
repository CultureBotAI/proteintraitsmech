  - kind: GENERAL
    text: >-
      The trt14 isomerase family is involved in the biosynthesis of various fungal meroterpenoids, which are compounds derived from terpenoid and polyketide precursors. Members of this family catalyze critical steps in the formation of complex molecular architectures, including ring expansion and rearrangement reactions. These enzymes play roles in the formation of compounds such as terretonin, acetoxydehydroaustin, and paraherquonin, which exhibit a range of biological activities including mycotoxin production and initiation of conidiation. The isomerases are part of gene clusters that orchestrate the conversion of simpler precursors into structurally diverse and bioactive meroterpenoids through a series of oxidation, prenylation, cyclization, and rearrangement steps.
    source: "InterPro:IPR050977 abstract (LLM-generated, not curator-reviewed)"
