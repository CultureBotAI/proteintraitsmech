  - kind: GENERAL
    text: >-
      The Sorting Nexin family is involved in intracellular trafficking, endosomal sorting, and membrane protein retention. Members of this family play a role in the retention of late Golgi membrane proteins and are part of the retrieval machinery interacting with TGN membrane proteins. They bind phosphatidylinositol 3-phosphate (PtdIns(P3)) for localization and function. Some members are required for multivesicular body formation and endosome-to-TGN retrograde transport, facilitated by the retromer complex. They contribute to the stability and expression of various membrane proteins, including the epithelial sodium channel (ENAC). Additionally, they are involved in phagocytosis regulation, iron homeostasis through transferrin receptor recycling, and may influence neurite outgrowth. Certain members also play a role in the maturation of pathogen-containing vacuoles during infection.
    source: "InterPro:IPR051074 abstract (LLM-generated, not curator-reviewed)"
