identifier: PANTHER:PTHR16932
label: "INTERFERON ALPHA-INDUCIBLE PROTEIN 27"
definition: >-
  This entry represents interferon alpha-inducible proteins IFI6 (also known as IFI-6-16) and IFI27-like (also known as ISG12) which play a role in the apoptotic process and also have pro-apoptotic activity. ISG12a is a mitochondrial protein that contributes to IFN-induced apoptosis through perturbation of normal mitochondrial function.
