identifier: PANTHER:PTHR36148
label: "50 KDA SPICULE MATRIX PROTEIN-RELATED"
definition: >-
  The SM50 family comprises major matrix proteins found in sea urchin embryos' spicules. These proteins are essential for biomineralization, a process where they direct the growth of calcite crystals in specific orientations while inhibiting growth in others. The presence of a repetitive domain within these proteins suggests a role in providing a calcite binding matrix, which is crucial for the structural integrity and formation of the spicule. By controlling crystal growth, the SM50 family plays a pivotal role in the development of the sea urchin's endoskeleton, ensuring proper shape and strength.
