identifier: PANTHER:PTHR47188
label: "PROTEIN TAR1"
definition: >-
  This entry includes transcript antisense to ribosomal RNA protein 1 (TAR1) from Saccharomyces cerevisiae and Kluyveromyces lactis. TAR1 might be involved in regulation of respiratory metabolism expression as it is induced under respiratory conditions to maintain oxidative phosphorylation capacity. Its levels in mitochondria are tightly controlled and usually low. It is down-regulated to manage oxidative stress when respiration is defective. This entry also includes uncharacterised plant proteins.
