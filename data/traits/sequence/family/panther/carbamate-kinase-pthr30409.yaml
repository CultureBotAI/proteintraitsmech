identifier: PANTHER:PTHR30409
label: "CARBAMATE KINASE"
definition: >-
  The arginine dihydrolase (AD) pathway is found in many prokaryotes and some primitive eukaryotes. The three- enzyme anaerobic pathway breaks down L-arginine to form 1 mol of ATP, carbon dioxide and ammonia. In simpler bacteria, the first enzyme, arginine deiminase, can account for up to 10% of total cell protein. Carbamate kinase is involved in the last step of the AD pathway, converting carbamoyl phosphate and ADP into ammonia, carbon dioxide and ATP. The second step of the pathway involves the degradation of L-citrulline to carbamoyl phosphate and L-ornithine, using ornithine carbamoyltransferase. The crystal structure of Enterococcus faecium carbamate kinase has been determined to 2.8A resolution. The enzyme exists as a homodimer of two 33kDa subunits. The hallmark of the dimer is a 16-stranded β-sheet, surrounded by α-helices. Each subunit contains an active site within a large crevice.
definition_source: "InterPro:IPR003964 abstract (PANTHER PTHR30409 is a member signature)"
