identifier: PANTHER:PTHR36156
label: "SLR2101 PROTEIN"
definition: >-
  This family includes bacterial and fungal sequences which contain a cupin domain. This family includes oryzines biosynthesis cluster protein J (OryJ) which is part of the gene cluster that mediates the biosynthesis of oryzines, natural products with an unusual maleidride backbone, VirC, which is part of the gene cluster that mediates the biosynthesis of virensols and trichoxide, fungal natural products that contain or are derived from a salicylaldehyde core.
