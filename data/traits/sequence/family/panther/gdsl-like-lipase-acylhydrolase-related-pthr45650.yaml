  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with esterase and lipase activities, characterized by the presence of a GDSL motif. These enzymes are involved in a variety of biological processes, including lipid metabolism and plant defense mechanisms. One member is specifically implicated in systemic acquired resistance and may participate in long-distance signaling within the plant. The GDSL motif is a conserved sequence that is integral to the catalytic function of these enzymes, which hydrolyze ester bonds in lipids.
