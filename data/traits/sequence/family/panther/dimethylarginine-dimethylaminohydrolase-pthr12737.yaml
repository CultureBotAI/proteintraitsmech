identifier: PANTHER:PTHR12737
label: "DIMETHYLARGININE DIMETHYLAMINOHYDROLASE"
definition: >-
  Mammalian dimethylarginine dimethylaminohydrolases DDAH1 and DDAH2 have homology with microbial arginine deiminases, all of them are included in this entry. DDAH hydrolyzes both N(G),N(G)-dimethyl-L-arginine (ADMA) and N(G)-monomethyl-L-arginine (MMA), two nitric oxide synthase (NOS) inhibitors to yield L-citrulline and the corresponding alkylamine. This way DDAH relieves the inhibition of NOS and promotes NO biosynthesis. Therefore, DDAH1 protects against cardiovascular disease by metabolising the risk factor ADMA, being a target for ADMA-lowering therapies. Two isoforms exist, DDAH1 and DDAH2, encoded by different genes and have 50% identity in their amino acid sequences. Both proteins are widely expressed in multiple tissues at high levels in endothelial cells, kidney, and liver, with DDAH1 being more abundant in tissues that express neuronal NOS and DDAH2 is more abundant highly vascularized tissues that express the endothelial NOS isoform (heart, lungs, and placenta) and in immune tissues that can express iNOS. DDAH2 is incapable of metabolising ADMA and its substrate is currently unknown, and it may be a drug target through an ADMA-independent pathway with biological effects in regulation of angiogenesis, diabetes, and immune responses.
