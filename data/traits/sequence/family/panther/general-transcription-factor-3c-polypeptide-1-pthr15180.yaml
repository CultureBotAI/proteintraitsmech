identifier: PANTHER:PTHR15180
label: "GENERAL TRANSCRIPTION FACTOR 3C POLYPEPTIDE 1"
definition: >-
  This entry includes a group of transcription factors, including Tfc3 from budding yeast, Sfc3 from fission yeasts and TF3C1 (also known as TFIIIC220) from mammals. Tfc3 (also known as Tau138) is one of three subunits of the tauB subcomplex of yeast transcription factor IIIC (TFIIIC) that binds boxB DNA promoter sites of tRNA and similar genes. TFIIIC assembles the initiation complex TFIIIB-TFIIIC-tDNA, sufficient for RNA polymerase III recruitment and function. Tfc3 is essential for cell viability as it is required for RNA polymerase III-mediated transcription.
