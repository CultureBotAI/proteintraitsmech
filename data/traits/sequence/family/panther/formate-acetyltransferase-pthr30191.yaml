identifier: PANTHER:PTHR30191
label: "FORMATE ACETYLTRANSFERASE"
definition: >-
  The Autonomous Glycyl Radical Cofactor family comprises proteins that serve as radical domains for damaged pyruvate formate-lyase (PFL) and potentially other radical proteins. Members of this family are involved in the recovery of radical enzymes by acting as a scaffold that stabilizes the radical species, which is essential for the catalytic activity of these enzymes. The proteins within this family are characterized by their ability to harbor and stabilize a glycyl radical, which is crucial for the function of radical-dependent enzymes, particularly under anaerobic conditions where such enzymes play a vital role in energy metabolism and various biosynthetic processes.
