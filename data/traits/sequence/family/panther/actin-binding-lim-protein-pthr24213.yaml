identifier: PANTHER:PTHR24213
label: "ACTIN-BINDING LIM PROTEIN"
definition: >-
  The Actin-binding LIM protein family is involved in various cellular processes related to actin dynamics and cytoskeleton organization. Members of this family function as scaffold proteins, potentially interacting with other proteins to modulate actin filament assembly and organization. They play roles in cell shape maintenance, motility, and migration by regulating actin bundling and the formation of cell protrusions such as filopodia and lamellipodia. Some family members are implicated in intracellular signaling pathways, including the regulation of protein kinase A (PKA) activity and RhoA activation. They may also participate in transcriptional regulation through ABRA-dependent SRF activity. In specialized cells, they contribute to functions like erythrocyte shape integrity, platelet aggregation, and retinal development. The family includes tumor suppressors that inhibit malignant transformation.
