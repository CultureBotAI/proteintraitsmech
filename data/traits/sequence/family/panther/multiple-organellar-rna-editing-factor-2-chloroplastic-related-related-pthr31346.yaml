identifier: PANTHER:PTHR31346
label: "MULTIPLE ORGANELLAR RNA EDITING FACTOR 2, CHLOROPLASTIC-RELATED-RELATED"
definition: >-
  This entry represents a group of plant proteins, including multiple organellar RNA editing factor 1-9 (MORF1-9) and ORRM1 from Arabidopsis, and DAG protein from Antirrhinum majus. DAG shares protein sequence similarity with MORFs and the N terminus of ORRM1. However, ORRM1 also contains a C-terminal RNA recognition motif (RRM), which is absent in DAG and MORFs. They are involvled in C-to-U RNA editing (deamination of cytidine to uridine), an essential step of RNA maturation in chloroplasts and mitochondria of land plants from bryophytes to angiosperms. They interact selectively with diverse PPR (PLS-class of pentatricopeptide repeat) proteins, and these interactions are important for their RNA editing function. MORFs are required for RNA editing in mitochondria and plastids.
definition_source: "InterPro:IPR039206 abstract (PANTHER PTHR31346 is a member signature)"
