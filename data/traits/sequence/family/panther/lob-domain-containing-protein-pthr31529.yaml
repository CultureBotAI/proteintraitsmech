identifier: PANTHER:PTHR31529
label: "LOB DOMAIN CONTAINING PROTEIN"
definition: >-
  LOB DOMAIN CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31529. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 28 of its annotated subfamilies. Subfamilies participate in positive regulation of DNA-templated transcription, cellular response to hormone stimulus, hormone-mediated signaling pathway. Subfamilies localise to nucleus, intracellular anatomical structure.
