identifier: PANTHER:PTHR22749
label: "RIBOFLAVIN KINASE/FMN ADENYLYLTRANSFERASE"
definition: >-
  This entry represents riboflavin kinase, which occurs as part of a bifunctional enzyme or a stand-alone enzyme. Riboflavin is converted into catalytically active cofactors (FAD and FMN) by the actions of riboflavin kinase (EC:2.7.1.26), which converts it into FMN, and FAD synthetase (EC:2.7.7.2), which adenylates FMN to FAD. Eukaryotes usually have two separate enzymes, while most prokaryotes have a single bifunctional protein that can carry out both catalyses, although exceptions occur in both cases. While eukaryotic monofunctional riboflavin kinase is orthologous to the bifunctional prokaryotic enzyme, the monofunctional FAD synthetase differs from its prokaryotic counterpart, and is instead related to the PAPS-reductase family. The bacterial FAD synthetase that is part of the bifunctional enzyme has remote similarity to nucleotidyl transferases and, hence, it may be involved in the adenylylation reaction of FAD synthetases.
