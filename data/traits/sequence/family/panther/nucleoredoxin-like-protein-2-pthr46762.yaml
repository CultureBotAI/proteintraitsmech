identifier: PANTHER:PTHR46762
label: "NUCLEOREDOXIN-LIKE PROTEIN 2"
definition: >-
  Nucleoredoxin-like protein 2 (Nxnl2, also known as RdCVF2) is a trophic factor with therapeutic potential that are involved in cone photoreceptor survival. It may be involved in the maintenance of both the function and the viability of sensory neurons, including photoreceptors and olfactory neurons.
