identifier: PANTHER:PTHR32116
label: "GALACTURONOSYLTRANSFERASE 4-RELATED"
definition: >-
  Galacturonosyltransferase 1 (GAUT1) is an alpha1,4-D-galacturonosyltransferase that transfers galacturonic acid from uridine 5'-diphosphogalacturonic acid onto the pectic polysaccharide homogalacturonan. The GAUT1-related gene family from Arabidopsis thaliana encodes 15 GAUT and 10 GAUT-like (GATL) proteins. This entry represent the GAUT proteins.
