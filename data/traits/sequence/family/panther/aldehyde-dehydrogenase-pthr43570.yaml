identifier: PANTHER:PTHR43570
label: "ALDEHYDE DEHYDROGENASE"
definition: >-
  Aldehydes are produced as intermediates during the metabolism of many different compounds including amino acids, carbohydrates, lipids vitamins and steroids. They are highly reactive compounds whose buildup to excess levels can cause cytotoxic, genotoxic and carcinogenic effects. Aldehyde dehydrogenases oxidise these compounds to their respective carboxylic acids. This is necessary both for the operation of these metabolic pathways, and to prevent the concentration of aldehydes within the cell from reaching toxic levels. Proteins in this entry are NAD(P)-dependent aldehyde dehydrogenases, found in a variety of organisms, including general aldehyde dehydrogensases ( EC:1.2.1.5 ), fatty aldehyde dehydrogenases ( EC:1.2.1.3 ), and coniferyl aldehyde dehydrogenase ( EC:1.2.1.68 ). Structural studies of the Rattus norvegicus protein ( UniProtKB:P11883 ) show that this enzyme is a homodimer where each subunit consists of two α-β-α domains. The mode of NAD binding differs substantially from that commonly associated with the Rossman fold. Not all enzymes in this family are dehydrogenases. The family also includes beta-apo-4'-carotenal oxygenase from Neurospora crassa which is required for the final step in the synthesis of the carotenoid pigment neurosporaxanthin by oxidising beta-apo-4'-carotenal; and 4,4'-diapolycopene aldehyde oxidase from Methylomonas which is required for the biosynthesis of a C30 carotenoid dialdehyde pigment.
definition_source: "InterPro:IPR012394 abstract (PANTHER PTHR43570 is a member signature)"
