identifier: PANTHER:PTHR38426
label: "MAINTENANCE OF TELOMERE CAPPING PROTEIN 4"
definition: >-
  This is a family of fungal proteins. Mutations in a member from Saccharomyces cerevisiae, YBR255W, affected growth rate. YBR255W has been identified among genes that affect telomere capping, and has been renamed maintenance of telomere capping protein 4.
