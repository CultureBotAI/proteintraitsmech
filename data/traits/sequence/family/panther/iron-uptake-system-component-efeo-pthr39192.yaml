  - kind: GENERAL
    text: >-
      This family of proteins is involved in iron uptake and transport, particularly in the binding and/or electron transfer of ferrous iron (Fe(2+)). Members of this family may contain a Cup-like domain and a peptidase domain, with potential metal-binding sites that could accommodate different metal ions such as Cu(2+) and Fe(3+). Some proteins within this family are known to specifically bind ferric iron (Fe(3+)) after its conversion from Fe(2+) and deliver it to cell membrane permeases for import into the cell. The peptidase domain is implicated in iron binding, and the absence of the Cup-like domain in some members suggests a variation in metal-binding capabilities and functions within the family.
    source: "InterPro:IPR053377 abstract (LLM-generated, not curator-reviewed)"
