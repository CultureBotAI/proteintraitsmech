identifier: PANTHER:PTHR33619
label: "POLYSACCHARIDE EXPORT PROTEIN GFCE-RELATED"
definition: >-
  This entry represents a group of bacterial polysaccharide export proteins, including Wza from Escherichia coli ( ), which is likely to be involved in the export of the extracellular polysaccharide colanic acid (CA) from the cell to medium and Capsule polysaccharide export outer membrane protein CtrA from Neisseria meningitidis, which may function as a membrane anchor for capsular polysaccharides.
