identifier: PANTHER:PTHR32094
label: "FANCONI ANEMIA GROUP E PROTEIN"
definition: >-
  Fanconi anemia (FA) is a human disorder characterised by cancer susceptibility and cellular sensitivity to DNA crosslinks and other damages. The FA complex repairs the interstrand cross-linking (ICL) lesions and coordinates activities of the downstream DNA repair pathway including nucleotide excision repair, translesion synthesis, and homologous recombination. It is required for the monoubiquitylation of FANCD2 and FANCI heterodimer. The FA core complex consists of FANCA, FANCB, FANCC, FANCE, FANCF, FANCG, FANCL, FANCM, FANCT (UBET2), FAAP100 and FAAP24. The FA group E protein (FANCE) has an important role in DNA repair, functioning as the FANCD2-binding protein in the FA core complex.
definition_source: "InterPro:IPR039685 abstract (PANTHER PTHR32094 is a member signature)"
