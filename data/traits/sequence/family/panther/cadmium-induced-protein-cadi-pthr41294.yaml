identifier: PANTHER:PTHR41294
label: "CADMIUM-INDUCED PROTEIN CADI"
definition: >-
  This entry includes Trivalent organoarsenical cleaving enzyme from Thermomonospora curvata (ArsI), Cadmium-induced protein CadI from Mycobacterium tuberculosis, and related bacterial proteins. ArsI is a nonhaeme iron-dependent dioxygenase that can break carbon-arsenic bonds, playing a role in the detoxification of environmental organoarsenical compounds. It catalyses the oxygen-dependent demethylation of highly toxic methylarsonous acid (MAs(III)) to arsenite, which can then be exported out of the cell. Proteins in this entry contain a VOC (Vicinal Oxygen Chelate) domain ( ). Members of this family have an invariant CC sequence motif at about position 95, and have poorly conserved C-terminal regions that frequently contain at least one addition CC motif.
