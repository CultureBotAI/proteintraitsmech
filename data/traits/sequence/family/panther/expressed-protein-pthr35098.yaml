identifier: PANTHER:PTHR35098
label: "EXPRESSED PROTEIN"
definition: >-
  Nodulin-related protein 1 (NRP1) may play a role in the negative-feedback regulation of the abscisic acid (ABA) synthesis pathway. Overexpression of NRP1 enhanced susceptibility to heat stress and was accompanied of decreased accumulation of ABA after heat treatment. The function of NRP2 is not clear.
