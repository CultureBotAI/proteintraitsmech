identifier: PANTHER:PTHR39490
label: "ARRESTIN DOMAIN-CONTAINING PROTEIN D"
definition: >-
  This family of proteins is involved in cellular processes related to adhesion and motility. Members of this family play a role in the dynamic assembly and disassembly of focal adhesions, which are critical for cell movement. They regulate the dephosphorylation of PTK2/FAK1, a key event in focal adhesion turnover, and influence the cell surface expression of integrin beta-1. Additionally, these proteins contain a FYVE-type zinc finger domain that mediates interactions with PTK2/FAK1 and PI(3)P, leading to association with endosomes. The C-terminal region of these proteins is structurally similar to pleckstrin homology (PH) domains but lacks the typical interface for binding phosphatidylinositol phosphate.
