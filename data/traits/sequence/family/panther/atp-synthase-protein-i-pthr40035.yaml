identifier: PANTHER:PTHR40035
label: "ATP SYNTHASE PROTEIN I"
definition: >-
  The atp operon of most prokaryotes contains the structural genes for the F-ATPase (ATP synthase), which are preceded by an atpI gene that encodes a membrane protein of unknown function. AtpI is thought to support optimal ATP synthase assembly and stability. A role in magnesium uptake has also been suggested. Proteins in this entry are found only in Gram-positive bacteria from the phylum Firmicutes.
