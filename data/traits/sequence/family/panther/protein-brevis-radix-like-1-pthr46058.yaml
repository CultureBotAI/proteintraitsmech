identifier: PANTHER:PTHR46058
label: "PROTEIN BREVIS RADIX-LIKE 1"
definition: >-
  This entry include Protein BREVIS RADIX (BRX) and related proteins such as BRXL1-4 from plants. BRX has been identified through a natural loss-of-function allele in the Arabidopsis accession Umkirch-1 (Uk-1), and results in reduced root meristem size, reduced mature cell size, and thus reduced root growth. BRX has been shown to regulate the growth rate in both the root and shoot. It mediates cross-talk between the auxin and brassinosteroid pathways. Despite the protein sequence similarity between Arabidopsis BRXL proteins, analysis of brx brx-like multiple mutants indicates that functional redundancy of BRXLs is limited.
definition_source: "InterPro:IPR044532 abstract (PANTHER PTHR46058 is a member signature)"
