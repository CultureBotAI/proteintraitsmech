identifier: PANTHER:PTHR20515
label: BETA-DEFENSIN
definition: >-
  BETA-DEFENSIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR20515. PANTHER protein class: antimicrobial response protein. Members are annotated with the molecular function chemokine receptor binding, receptor ligand activity. Members participate in defense response to bacterium, defense response to other organism, cell chemotaxis. Members localise to extracellular region.
