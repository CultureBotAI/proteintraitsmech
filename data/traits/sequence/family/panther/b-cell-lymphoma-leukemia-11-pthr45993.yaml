definitions:
  - kind: GENERAL
    text: >-
      B-CELL LYMPHOMA/LEUKEMIA 11 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45993. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, organic cyclic compound binding. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
