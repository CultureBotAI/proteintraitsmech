definitions:
  - kind: GENERAL
    text: >-
      B-CELL LYMPHOMA/LEUKEMIA 11 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45993. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is comprised of transcription factors that play crucial roles in developmental processes, hematopoiesis, and immune system function. Members of the family are involved in the regulation of gene expression by binding to specific DNA motifs, such as the 5'-TGACCA-3' sequence, and may act as transcriptional repressors or corepressors. They are associated with chromatin remodeling complexes and are essential for processes like B-cell formation, T-lymphocyte differentiation, and survival during thymocyte development. Some members negatively regulate the JAK/STAT pathway, affecting developmental pathways in insects. The family also includes proteins that may interact with the P53-signaling pathway, contributing to tumor suppression. The diverse functions of the family reflect its involvement in controlling cell fate decisions and responses to developmental signals across different organisms.
    source: "InterPro:IPR051497 abstract (LLM-generated, not curator-reviewed)"
