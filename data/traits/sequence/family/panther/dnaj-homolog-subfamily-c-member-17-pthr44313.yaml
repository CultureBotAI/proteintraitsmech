definitions:
  - kind: GENERAL
    text: >-
      DNAJ HOMOLOG SUBFAMILY C MEMBER 17 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44313. PANTHER protein class: chaperone. Members participate in mRNA splicing, via spliceosome, protein-containing complex disassembly, protein-RNA complex organization. Members localise to spliceosomal complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in pre-mRNA splicing, a fundamental process in gene expression where introns are removed and exons are joined to form a mature mRNA transcript. Some members of this family are also implicated in the endoplasmic reticulum-associated protein degradation pathway (ERAD), which is responsible for the disposal of misfolded proteins in the endoplasmic reticulum. Additionally, certain proteins within this family may play a role in the regulation of transcription, specifically by negatively affecting the transcription of thyroglobulin, which is mediated by the PAX8 transcription factor.
    source: "InterPro:IPR052094 abstract (LLM-generated, not curator-reviewed)"
