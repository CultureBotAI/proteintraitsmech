  - kind: GENERAL
    text: >-
      This family of proteins includes guanine nucleotide exchange factors (GEFs) that activate Rac proteins by exchanging GDP for GTP, and are synergistically activated by phosphatidylinositol 3,4,5-trisphosphate and beta gamma subunits of heterotrimeric G proteins. Some members function as negative regulators of the mTORC1 and mTORC2 complexes, inhibiting their protein kinase activity and inducing autophagy. Others act as cholesterol-binding proteins that regulate mTORC1 signaling by sensing cholesterol sufficiency, disrupting interactions between GATOR1 and KICSTOR complexes to promote signaling, or inhibiting it during cholesterol starvation.
