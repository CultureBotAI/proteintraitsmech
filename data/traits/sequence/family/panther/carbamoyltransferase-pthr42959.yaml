identifier: PANTHER:PTHR42959
label: CARBAMOYLTRANSFERASE
definition: >-
  This family of proteins includes enzymes involved in the maturation of [NiFe] hydrogenases, a class of enzymes that catalyze the reversible oxidation of hydrogen gas. Members of this family function as carbamoyl transferases, utilizing carbamoylphosphate as a substrate. They transfer the carboxamido moiety in an ATP-dependent reaction to specific cysteine residues of precursor proteins, facilitating the synthesis of CN ligands for the active site iron of [NiFe]-hydrogenases. Some members also exhibit carbamoyl-phosphate phosphatase activity in the absence of other substrates.
