identifier: PANTHER:PTHR30602
label: "AMINO-ACID ACETYLTRANSFERASE"
definition: >-
  This entry represents amino-acid N-acetyltransferase or N-acetylglutamate synthase, which is the product of the argA gene and the first enzyme in arginine biosynthesis. This enzyme displays more diversity between bacteria, fungi and mammals than other enzymes in arginine metabolism, and N-acetylglutamate itself can have different roles in different taxonomic groups: in prokaryotes, lower eukaryotes and plants it is the first intermediate in arginine biosynthesis, while in vertebrates it is an allosteric cofactor for the first enzyme in the urea cycle. In bacteria, arginine can regulate ornithine biosynthesis via a feedback inhibition mechanism. This enzyme may also act on aspartate.
definition_source: "InterPro:IPR010167 abstract (PANTHER PTHR30602 is a member signature)"
