identifier: PANTHER:PTHR14428
label: "NUCLEOLAR COMPLEX PROTEIN 3"
definition: >-
  Budding yeast nucleolar complex-associated protein 3 (Noc3) is required for initiation of DNA replication and for synthesis of 60S ribosomal subunits and the transport of pre-ribosomes from the nucleoplasm to the cytoplasm. This entry also includes Noc3 homologues from animals and plants. The mammalian Noc3 is a positive regulator in adipocyte differentiation.
