identifier: PANTHER:PTHR37299
label: "TRANSCRIPTIONAL REGULATOR-RELATED"
definition: >-
  This family includes a group of LytTR domain-containing proteins, such as the transcriptional regulatory protein LytR and BtsR, the sensory transduction protein LytT and the Accessory gene regulator protein A. LytTR domain is a DNA-binding, potential winged helix-turn-helix (wHTH) domain, named after Bacillus subtilis LytT and Staphylococcus aureus lytR response regulators, involved in the regulation of cell autolysis.
