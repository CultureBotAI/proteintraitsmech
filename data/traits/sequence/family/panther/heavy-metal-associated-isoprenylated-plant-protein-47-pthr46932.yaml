identifier: PANTHER:PTHR46932
label: "HEAVY METAL-ASSOCIATED ISOPRENYLATED PLANT PROTEIN 47"
definition: >-
  This entry includes HIPP47 (At3g20180) and HIPP16 (At3g07600) from Arabidopsis. They contain an apparent HMA-like domain similarly to HIPP01/3/5/6 (InterPro:IPR044594) but lack the core conserved Cys-X-X-Cys motif.
