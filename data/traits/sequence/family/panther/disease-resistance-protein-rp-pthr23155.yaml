identifier: PANTHER:PTHR23155
label: "DISEASE RESISTANCE PROTEIN RP"
definition: >-
  This entry represents a group of plant disease resistance proteins. Plants are attacked by a range of phytopathogenic organisms, including viruses, mycoplasma, bacteria, fungi, nematodes, protozoa and parasites. Resistance to a pathogen is manifested in several ways and is often correlated with a hypersensitive response (HR), localised induced cell death in the host plant at the site of infection. The induction of the plant defence response that leads to HR is initiated by the plants recognition of specific signal molecules (elicitors) produced by the pathogen; R genes are thought to encode receptors for these elicitors. RPS2, N and L6 genes confer resistance to bacterial, viral and fungal pathogens. Sequence analysis has shown that they contain C-terminal leucine-rich repeats, which are characteristic of plant and animal proteins involved in protein-protein interactions. In addition, the sequences contain a conserved nucleotide-binding site towards their N-terminal.
