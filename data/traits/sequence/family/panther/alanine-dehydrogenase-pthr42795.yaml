identifier: PANTHER:PTHR42795
label: "ALANINE DEHYDROGENASE"
definition: >-
  ALANINE DEHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42795. PANTHER protein class: dehydrogenase, metabolite interconversion enzyme. Members are annotated with the molecular function oxidoreductase activity. and participate in alpha-amino acid metabolic process, small molecule catabolic process, nitrogen compound metabolic process. and localise to cell periphery, membrane, plasma membrane.
