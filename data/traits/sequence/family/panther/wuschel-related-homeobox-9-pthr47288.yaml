identifier: PANTHER:PTHR47288
label: "WUSCHEL-RELATED HOMEOBOX 9"
definition: >-
  This entry includes WUSCHEL-related homeobox 8/9 (WOX8/9) from Arabidopsis. They are homeodomain transcription factors that required for embryo development. Cytokinin signaling has been shown to be involved in activation of WOX9 expression in meristematic tissues, which is essential for maintaining the meristematic fate. WOX8 promotes cotyledon boundary formation.
