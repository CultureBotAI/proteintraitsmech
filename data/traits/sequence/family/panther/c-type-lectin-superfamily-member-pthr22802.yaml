identifier: PANTHER:PTHR22802
label: "C-TYPE LECTIN SUPERFAMILY MEMBER"
definition: >-
  This family of proteins includes pathogen-recognition receptors predominantly expressed on the surface of immature dendritic cells, playing a crucial role in the initiation of the primary immune response. They are involved in the endocytosis of pathogens, which are then degraded in lysosomal compartments. Following endocytosis, these receptors return to the cell membrane surface, presenting pathogen-derived antigens to resting T-cells via MHC class II proteins. They are known to recognize high mannose N-linked oligosaccharides on a variety of pathogen antigens in a calcium-dependent manner. Additionally, these proteins act as attachment receptors for various viruses and may interact with ICAM2 and ICAM3, facilitating immune cell interactions and transendothelial migration of dendritic cell precursors. The family is characterized by a tandem repeat domain, also known as the neck domain, which mediates oligomerization.
