identifier: PANTHER:PTHR28042
label: "E3 UBIQUITIN-PROTEIN LIGASE COMPLEX SLX5-SLX8 SUBUNIT SLX5"
definition: >-
  The STUbL pathway is alternative pathway for the elimination of sumoylated proteins. STUbLs (SUMO-targeted ubiquitin ligases), as represented by the Rfp1/Slx8 and Rfp2/Slx8 dimers in Schizosaccharomyces pombe, or the Slx5/Slx8 dimer in Saccharomyces cerevisiae, are conserved ubiquitin E3 enzymes that target sumoylated proteins for ubiquitylation and subsequent degradation or recycling. These complexes function as a two-component Ub ligase that controls genome stability and sumoylation via ubiquitination. This family consists of Rfp1 and Slx5.
