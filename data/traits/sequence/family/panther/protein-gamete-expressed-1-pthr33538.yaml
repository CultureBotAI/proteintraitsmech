identifier: PANTHER:PTHR33538
label: "PROTEIN GAMETE EXPRESSED 1"
definition: >-
  GEX1 and brambleberry belong to a family of karyogamy factors whose functional orthologue in yeast is KAR5 ( ). GEX1 from Arabidopsis is required for correct pollen maturation. Brambleberry is required for pronuclear fusion following fertilization.
