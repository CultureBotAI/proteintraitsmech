  - kind: GENERAL
    text: >-
      This family of proteins is part of the major facilitator superfamily (MFS), which is one of the largest groups of secondary transporters. Members of this family are involved in a variety of cellular processes, including the transport of small solutes across cell membranes. They function by utilizing chemiosmotic ion gradients. Some proteins within this family are known to act as outward-rectifying chloride channels that play a role in endolysosomal chloride homeostasis, membrane fusion, and function. They are involved in regulating lysosomal calcium content, pH in endolysosomal compartments, and may contribute to the progressive acidification from endosome to lysosome. The family includes proteins with SPX domains, which are indicative of their involvement in phosphate homeostasis.
    source: "InterPro:IPR051068 abstract (LLM-generated, not curator-reviewed)"
