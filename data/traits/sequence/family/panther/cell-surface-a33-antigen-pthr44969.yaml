identifier: PANTHER:PTHR44969
label: "CELL SURFACE A33 ANTIGEN"
definition: >-
  A33 antigen is a cell surface glycoprotein of the small intestine and colonic epithelium with homology to tight junction-associated proteins of the immunoglobulin superfamily. It contains two extracellular immunoglobulin domains, a single transmembrane domain, and a short intracellular tail containing four acylation sites proximal to the transmembrane domain. In humans, A33 is expressed in more than 95% of colon cancers and a subset of gastric cancers. An antibody specific to A33 has been used for the development of immunotherapy.
definition_source: "InterPro:IPR042474 abstract (PANTHER PTHR44969 is a member signature)"
