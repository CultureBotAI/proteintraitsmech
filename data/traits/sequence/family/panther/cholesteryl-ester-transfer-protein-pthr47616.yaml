identifier: PANTHER:PTHR47616
label: "CHOLESTERYL ESTER TRANSFER PROTEIN"
definition: >-
  This group represents cholesteryl ester transfer protein, also known as lipid transfer protein 1. This protein shuttles various lipids between lipoproteins, resulting in the net transfer of cholesteryl esters from atheroprotective, high-density lipoproteins (HDL) to atherogenic, lower-density species. Thus, inhibtion of this enzyme raises the concentration of protective HDL and could conceivably be used as a treatment for cardiovascular disease. The protein forms a long tunnel which can accomodate four lipid molecules.
definition_source: "InterPro:IPR017130 abstract (PANTHER PTHR47616 is a member signature)"
