identifier: PANTHER:PTHR47324
label: "PROTEIN IRG-7-RELATED"
definition: >-
  This family of proteins is involved in the innate immune response, likely through interaction with the atf-7 signaling pathway. Members of this family are implicated in providing resistance against pathogenic bacterial infections. Additionally, they may have a regulatory role in determining the lifespan of an organism.
