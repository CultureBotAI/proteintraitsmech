identifier: PANTHER:PTHR12626
label: "PROGRAMMED CELL DEATH 4"
definition: >-
  Programmed cell death protein 4 (PDCD4) binds to eukaryotic initiation factor 4A (eIF4A), inhibits translation initiation, and acts as a tumour suppressor. It contains two C-terminal MA3 domains that bind specifically to the eIF4A N-terminal domain (eIF4A-NTD). This entry also includes MRF1/2/3/4 from plants. They are involved in target of rapamycin (TOR)-egulated translation control, especially under energy-deficient conditions.
