definitions:
  - kind: GENERAL
    text: >-
      IP22168P — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46012. Members are annotated with the molecular function UDP-xylosyltransferase activity, pentosyltransferase activity. and participate in macromolecule glycosylation, protein glycosylation, protein O-linked glycosylation.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The glycosyltransferase 8 family is characterized by its enzymatic function in post-translational modification of proteins. Members of this family are involved in the elongation of O-linked glucose residues that are attached to EGF-like repeats in the extracellular domain of Notch proteins. They achieve this by catalyzing the addition of xylose, thereby playing a crucial role in the modification of Notch signaling molecules, which are essential for various developmental processes. The precise action of these enzymes ensures the proper functioning of Notch protein interactions and signaling pathways.
    source: "InterPro:IPR051993 abstract (LLM-generated, not curator-reviewed)"
