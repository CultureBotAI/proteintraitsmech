identifier: PANTHER:PTHR35081
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 105"
definition: >-
  This entry represents homologues of Tektin-like protein 1 (TEKTL1 also known as Ccdc105). TEKTL1 is a conserved tektin-like sperm microtubule inner protein (MIP) that decorate the lumen of axonemal doublet microtubules (DMTs) and stabilise the structure. The tertiary structure of TEKTL1 is similar to that of tektins. However, the mechanism by which TEKTL1 and tektins assemble into filaments differs slightly. TEKTL1 shares many structural features with tektins, including the overall helix-turn-helix fold and head-to-tail association into filaments, but does not seem to assemble into the large oligomeric bundles associated with tektins. In both sea urchin and bovine sperm, TEKTL1 binds to the outer inter-protofilament cleft of A11/A12, where it may help stabilise the outer junction.
definition_source: "InterPro:IPR038949 abstract (PANTHER PTHR35081 is a member signature)"
