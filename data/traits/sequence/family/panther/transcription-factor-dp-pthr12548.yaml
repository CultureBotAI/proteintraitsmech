identifier: PANTHER:PTHR12548
label: "TRANSCRIPTION FACTOR DP"
definition: >-
  The DP proteins function as binding partners for E2F transcription factors. The association of DP with E2F can either enhances or repress E2F-dependent transcriptional activity. The activities of both DP and E2F proteins are under cell cycle control, being influenced by the level of phosphorylation imparted through the cell cycle regulated activity of cyclin-dependent kinases. Molecules that function to positively regulate the G1/S transition, such as cyclin-cdk complexes, and negatively regulate it, such as the cdk inhibitors, converge on the Rb pathway. A principal role of pRb is in the regulation of the E2F/DP transcription factors, activity of which determines cell-cycle progression. Both DP and E2F proteins are endowed with proto-oncogenic activity and, conversely, have been implicated in regulating apoptosis. The DP proteins have been widely evolutionarily conserved and can be found in organisms ranging from Arabidopsis thaliana (Mouse-ear cress) to Homo sapiens (Human).
