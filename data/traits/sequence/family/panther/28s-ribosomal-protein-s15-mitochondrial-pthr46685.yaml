  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structure and function of the ribosome, which is essential for protein synthesis in all living cells. Members of this family are part of the small ribosomal subunit and play a role in the assembly and stability of the ribosome. One member has been noted to be essential for gut mitochondrial activity and may be involved in tissue-specific growth factor production, suggesting additional specialized functions beyond the general role in ribosome structure.
    source: "InterPro:IPR052137 abstract (LLM-generated, not curator-reviewed)"
