  - kind: GENERAL
    text: >-
      28S RIBOSOMAL PROTEIN S15, MITOCHONDRIAL — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46685. PANTHER protein class: ribosomal protein, translational protein. Members are annotated with the molecular function structural constituent of ribosome, RNA binding, organic cyclic compound binding. Members participate in macromolecule biosynthetic process, macromolecule metabolic process, peptide metabolic process. Members localise to membrane-enclosed lumen, cytoplasm, organellar ribosome.
