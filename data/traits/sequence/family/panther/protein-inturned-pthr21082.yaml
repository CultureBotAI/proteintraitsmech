identifier: PANTHER:PTHR21082
label: "PROTEIN INTURNED"
definition: >-
  Protein inturned is a cilia and planar polarity effector, performing prominent ciliogenic functions during morphogenesis. It links NPHP4 to Daam1 to control the subapical actin network in multiciliated cells. Homologues are found only in metazoa.
