identifier: PANTHER:PTHR34992
label: "HYPHAL ANASTAMOSIS-7 PROTEIN"
definition: >-
  This family is found in fungi and includes copper acquisition factor BIM1 from Cryptococcus neoformans, a cell surface-bound protein that functions in the copper-accumulation pathway shared by the CUF1-dependent copper transporter CTR1. BIM1 facilitates copper acquisition in the brain of mammalian hosts and acts as a copper-dependent virulence trait in fungal meningitis. Members of this entry have a lytic polysaccharide monooxygenase-like (LPMO) fold, which are evolutionarily related to LPMO but have diverged to a different biological function.
definition_source: "InterPro:IPR046936 abstract (PANTHER PTHR34992 is a member signature)"
