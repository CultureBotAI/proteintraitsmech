identifier: PANTHER:PTHR13544
label: "SELENOPROTEIN T"
definition: >-
  This entry represents selenoprotein T (SelT), which is conserved from plants to humans. SelT is localized to the endoplasmic reticulum through a hydrophobic domain. The protein binds to UDP-glucose:glycoprotein glucosyltransferase (UGTR), the endoplasmic reticulum (ER)-resident protein, which is known to be involved in the quality control of protein folding. Selenium (Se) plays an essential role in cell survival and most of the effects of Se are probably mediated by selenoproteins, including selenoprotein T. SelT may have thioredoxin reductase-like oxidoreductase activity and it may have a role in PACAP signaling during PC12 cell differentiation. SelT protects dopaminergic neurons against oxidative stress and cell death and in fibroblasts, it plays a role in anchorage and redox regulation. In pancreatic islets, it is involved in the control of glucose homeostasis, contributes to prolonged ADCYAP1/PACAP-induced insulin secretion.
definition_source: "InterPro:IPR019389 abstract (PANTHER PTHR13544 is a member signature)"
