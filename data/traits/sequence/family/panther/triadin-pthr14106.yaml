identifier: PANTHER:PTHR14106
label: TRIADIN
definition: >-
  Triadin was first identified from rabbit skeletal muscle sarcoplasmic reticulum as an abundant single transmembrane protein. It binds to ryanodine receptor and calsequestrin in a Ca2+-dependent manner. Later, several triadin isoforms produced by the alternative splicing of a single TRDN gene were identified. These isoforms have different localisations and binding partners.
