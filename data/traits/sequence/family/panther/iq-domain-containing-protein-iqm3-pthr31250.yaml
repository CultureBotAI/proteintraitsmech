identifier: PANTHER:PTHR31250
label: "IQ DOMAIN-CONTAINING PROTEIN IQM3"
definition: >-
  This entry includes IQM1-6 from Arabidopsis. They contain the IQ motif, IQxxxRGxxxR, which is one of a few recognition motifs for CaM-binding protein. Besides one copy of IQ motif, they share domains related to pea heavy-metal induced protein 6A and ribosome-inactivating protein, trichosanthin, which is able to bind to and remove adenine residues from rRNA. This entry also includes some uncharacterised bacterial and fungal proteins.
