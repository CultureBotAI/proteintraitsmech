identifier: PANTHER:PTHR15028
label: CD72-RELATED
definition: >-
  This entry includes CD72 from mammals and similar proteins from vertebrates. Human CD72 is a membrane protein expressed mostly in B cells. It contains a C-type lectin-like domain (CTLD) in the extracellular region and an immunoreceptor tyrosine-based inhibition motif (ITIM) in the cytoplasmic region. It is involved in B-cell proliferation and differentiation. It plays a role in regulation of the development of systemic lupus erythematosus (SLE), an autoimmune disease characterised by production of autoantibodies to various nuclear components and inflammatory lesions caused by deposition of immune complexes.
