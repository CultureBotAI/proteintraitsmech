identifier: PANTHER:PTHR11774
label: "GERANYLGERANYL TRANSFERASE TYPE BETA SUBUNIT"
definition: >-
  Prenyltransferases catalyze the covalent attachment of isoprenoid lipids (farnesyl or geranylgeranyl) to a cysteine near the C terminus of their substrates. This entry includes geranylgeranyl transferase type-1/2 subunit beta (Cdc43/Bet2) and farnesyltransferase subunit beta (Ram1). Cdc43/Bet2 catalyzes the transfer of a geranyl-geranyl moiety from geranyl-geranyl diphosphate to proteins having the C-terminal sequence Cys-Ile-Ile-Leu or Cys-Val-Leu-Leu. Ram1 catalyzes the transfer of a farnesyl moiety from farnesyl diphosphate to a cysteine at the fourth position from the C terminus of several proteins having the C-terminal sequence Cys-aliphatic-aliphatic-X where X is Ser, Ala, Met, Cys, or Gln.
