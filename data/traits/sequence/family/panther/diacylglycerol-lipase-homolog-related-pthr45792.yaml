identifier: PANTHER:PTHR45792
label: "DIACYLGLYCEROL LIPASE HOMOLOG-RELATED"
definition: >-
  This family of proteins includes serine hydrolases that are involved in the biosynthesis of the endocannabinoid 2-arachidonoylglycerol (2-AG) by hydrolyzing diacylglycerols (DAGs) containing arachidonic acid. These enzymes preferentially cleave sn-1 fatty acids from DAGs and have minimal activity against other lipid substrates such as monoacylglycerols and phospholipids. They play a crucial role in the central nervous system by regulating 2-AG signaling, which is important for neuronal synapse activity, axonal growth, neurogenesis, and the physiological regulation of anxiety and depressive behaviors. Additionally, they are involved in neuroinflammatory responses and support the metabolic and signaling demands of macrophages by regulating the pools of 2-AG and arachidonic acid for eicosanoid production.
