identifier: PANTHER:PTHR13029
label: "Myelin Regulatory Factor-like"
definition: >-
  This family of proteins includes transcription factors that are key regulators in the maturation and maintenance of the nervous system, particularly in the formation of myelin, which is essential for proper nerve conduction. Members of this family are involved in the activation of gene expression related to myelin production during the maturation of oligodendrocytes. They have a characteristic peptidase S74 domain that mediates autocatalytic cleavage, releasing an N-terminal component that acts as the active transcription factor, while the C-terminal part remains membrane-bound with no transcriptional activity. These proteins are also implicated in synaptic rewiring during nervous system development, indicating a broader role in neuronal function.
