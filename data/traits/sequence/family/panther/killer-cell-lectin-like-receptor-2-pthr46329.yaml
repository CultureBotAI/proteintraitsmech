  - kind: GENERAL
    text: >-
      The Killer cell lectin-like receptor family in mice includes receptors expressed on natural killer (NK) cells. These receptors recognize class I MHC molecules, playing a crucial role in the regulation of NK cell activity and the immune response. They are involved in the surveillance against infected or transformed cells by inhibiting or activating NK cells upon interaction with their ligands. One member, T-cell surface glycoprotein YE1/48, specifically inhibits NK cells from lysing cells presenting H-2d alleles. The family's function is essential for maintaining the balance between immunity and self-tolerance, preventing autoimmunity while allowing effective responses against pathogens.
    source: "InterPro:IPR052013 abstract (LLM-generated, not curator-reviewed)"
