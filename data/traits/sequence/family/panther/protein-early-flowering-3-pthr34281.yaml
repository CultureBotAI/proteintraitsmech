identifier: PANTHER:PTHR34281
label: "PROTEIN EARLY FLOWERING 3"
definition: >-
  This entry represents a group of plant proteins, including protein EARLY FLOWERING 3 (ELF3) from Arabidopsis and Hd17 from rice. ELF3 proteins are involved in circadian clock regulation and photoperiodic flowering control. The full-length proteins function as transcriptional regulators that modulate flowering time under different photoperiodic conditions and are components of the evening complex in the circadian clock. ELF3 proteins are nuclear-localised and play roles in light signalling pathways. Hd17 may function as a modulator of light signal transduction downstream of phytochromes. Hd17 (also known as OsELF3) is involved in rice photoperiodic flowering.
definition_source: "InterPro:IPR039319 abstract (PANTHER PTHR34281 is a member signature)"
