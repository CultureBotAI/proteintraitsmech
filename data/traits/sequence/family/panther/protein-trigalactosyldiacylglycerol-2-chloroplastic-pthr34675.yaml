identifier: PANTHER:PTHR34675
label: "PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 2, CHLOROPLASTIC"
definition: >-
  This entry represents a group of proteins mostly from Cyanobacteria (blue-green algae) and plants, including TRIGALACTOSYLDIACYLGLYCEROL 2 (TGD2) from Arabidopsis. TGD2 is a component of a phosphatidic acid/lipid transport complex in the chloroplast envelope. Proteins in this entry contain a Mce/MlaD domain.
