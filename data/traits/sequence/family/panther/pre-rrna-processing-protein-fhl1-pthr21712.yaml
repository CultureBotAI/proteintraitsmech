identifier: PANTHER:PTHR21712
label: "PRE-RRNA-PROCESSING PROTEIN FHL1"
definition: >-
  This entry represents a group of transcription regulators, including Fhl1 from Saccharomyces cerevisiae and FHA1 from plants. Most of the proteins in this entry contain the forkhead-associated (FHA) domain, which is a phosphopeptide recognition domain found in many regulatory proteins. Fhl1 is a ribosomal protein (RP) transcription regulator that recruits coactivator Ifh1 or corepressor Crf1 to RP gene promoters. Tobacco NtFHA1 consists of an N-terminal FHA domain and a C-terminal acidic region, but lacks a known DNA-binding motif. Its function in plants may be analogous to Fhl1 function in yeast. There are two Arabidopsis homologues of FHA1, designated AtFHA1 (At3g07260) and AtFHA2 (At3g07220). Their function is not clear, however, they have differential expression patterns during plant development. AtFHA2 has been shown to regulate stamen development.
definition_source: "InterPro:IPR045178 abstract (PANTHER PTHR21712 is a member signature)"
