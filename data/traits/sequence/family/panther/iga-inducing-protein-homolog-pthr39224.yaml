identifier: PANTHER:PTHR39224
label: "IGA-INDUCING PROTEIN HOMOLOG"
definition: >-
  This entry includes IgA-inducing proteins (IGIPs) from animals. Monocyte-derived dendritic cells are the primary producers of human IGIP. IGIP induces expression of IgA in the presence of IL-10.
