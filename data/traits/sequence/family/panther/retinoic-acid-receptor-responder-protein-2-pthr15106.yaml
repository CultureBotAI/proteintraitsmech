identifier: PANTHER:PTHR15106
label: "RETINOIC ACID RECEPTOR RESPONDER PROTEIN 2"
definition: >-
  Retinoic acid receptor responder protein 2 (also known as chemerin or TIG2) is an immunomodulating protein secreted predominantly by adipose tissue and skin. It is secreted in an inactive form and further processed to an active form through cleavage of its carboxyl terminus. It regulates adipogenesis, metabolism and inflammation through activation of the chemokine-like receptor 1 (CMKLR1). It also binds to G protein-coupled receptor 1 (GPR1) and C-C chemokine receptor-like 2 (CCRL2). Chemerin has been linked to obesity and inflammation. It also possesses antimicrobiological functions and may serve as a tumorsuppressor in skin.
