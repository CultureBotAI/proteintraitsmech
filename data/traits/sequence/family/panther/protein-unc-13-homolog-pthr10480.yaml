identifier: PANTHER:PTHR10480
label: "PROTEIN UNC-13 HOMOLOG"
definition: >-
  Unc-13 is a phorbol ester/diacylglycerol-binding protein that plays a role in vesicle maturation during exocytosis. Unc-13 disruption causes diverse defects in the nervous system of the nematode Caenorhabditis elegans. This family also includes mammalian homologues A, B and C. Unc13 homologue C is cerebellum-specific and regulates cerebellar synaptic transmission. Homologues A and B are involved in neurotransmitter release by acting in synaptic vesicle priming prior to vesicle fusion. They are essential for synaptic vesicle maturation in most excitatory/glutamatergic but not inhibitory/GABA-mediated synapses.
