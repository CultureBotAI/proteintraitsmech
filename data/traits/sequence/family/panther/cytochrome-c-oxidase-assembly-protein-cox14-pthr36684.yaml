identifier: PANTHER:PTHR36684
label: "CYTOCHROME C OXIDASE ASSEMBLY PROTEIN COX14"
definition: >-
  COX14 plays an essential role in cytochrome oxidase assembly. The COX14 product is a low-molecular weight membrane protein of mitochondria, but it is not a subunit of cytochrome oxidase. Orthology-prediction methods have identified the vertebrate C12orf62 orthologues to be orthologues of the yeast COX14.
definition_source: "InterPro:IPR029208 abstract (PANTHER PTHR36684 is a member signature)"
