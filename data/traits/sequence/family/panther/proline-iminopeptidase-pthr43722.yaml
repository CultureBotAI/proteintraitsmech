identifier: PANTHER:PTHR43722
label: "PROLINE IMINOPEPTIDASE"
definition: >-
  This entry describes a family of proline iminopeptidases ( ), which are Mn2+-requiring enzymes present in the cytosol of mammalian and microbial cells. They release an N-terminal residue from a peptide, preferably (but not exclusively) a proline.
