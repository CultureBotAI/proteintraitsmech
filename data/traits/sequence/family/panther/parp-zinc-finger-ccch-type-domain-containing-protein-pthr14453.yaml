      PARP/ZINC FINGER CCCH TYPE DOMAIN CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14453. Members are annotated with the molecular function transcription corepressor activity. Members participate in negative regulation of gene expression. Members localise to nucleus, cytoplasm.
