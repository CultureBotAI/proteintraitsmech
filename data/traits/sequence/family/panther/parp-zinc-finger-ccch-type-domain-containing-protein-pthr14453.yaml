  - kind: GENERAL
    text: >-
      This family of proteins includes mono-ADP-ribosyltransferases that are involved in various cellular processes, including DNA damage repair, immune responses, and regulation of transcription. Members of this family are capable of mediating mono-ADP-ribosylation of target proteins, which is a post-translational modification affecting protein function and signaling. Some members interact with E3 ligases to modulate ubiquitination, influencing DNA repair mechanisms and the recruitment of repair proteins to DNA damage sites. They also play roles in immune responses by regulating cytokine production and STAT protein phosphorylation. These proteins are distinct from other PARP family members in that they do not support poly-ADP-ribosylation.
    source: "InterPro:IPR052056 abstract (LLM-generated, not curator-reviewed)"
