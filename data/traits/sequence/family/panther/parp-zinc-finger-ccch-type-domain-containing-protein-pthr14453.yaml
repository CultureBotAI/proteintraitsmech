  - kind: GENERAL
    text: >-
      PARP/ZINC FINGER CCCH TYPE DOMAIN CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14453. Members are annotated with the molecular function transcription coregulator activity, transcription regulator activity, transcription corepressor activity. Members participate in negative regulation of gene expression, negative regulation of macromolecule biosynthetic process, regulation of gene expression. Members localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
