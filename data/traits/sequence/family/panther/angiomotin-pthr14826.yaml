identifier: PANTHER:PTHR14826
label: ANGIOMOTIN
definition: >-
  This family of proteins includes Angiomotin and related proteins. These proteins are involved in the regulation of cell polarity, proliferation, and migration, particularly in endothelial cells. They play a key role in angiogenesis and the maintenance of actin filament architecture. Angiomotin-like protein 2 inhibits the Wnt/beta-catenin signaling pathway by sequestering CTNNB1 to recycling endosomes, preventing its nuclear translocation. Additionally, they regulate the translocation of phosphorylated SRC to cell-matrix adhesion sites and selectively promote FGF-induced MAPK activation through SRC. These proteins are also implicated in tight junction maintenance and may interact with ARHGAP17 and angiostatin.
definition_source: "InterPro:IPR051747 abstract (PANTHER PTHR14826 is a member signature)"
