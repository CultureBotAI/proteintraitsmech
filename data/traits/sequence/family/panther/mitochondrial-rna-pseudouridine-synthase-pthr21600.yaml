identifier: PANTHER:PTHR21600
label: "MITOCHONDRIAL RNA PSEUDOURIDINE SYNTHASE"
definition: >-
  The RluA family of pseudouridine synthases is responsible for the isomerization of specific uridine residues to pseudouridine in various RNA molecules, a modification that can influence RNA stability, folding, and function. Members of the family exhibit substrate specificity for different types of RNA, including ribosomal RNA (rRNA), transfer RNA (tRNA), and messenger RNA (mRNA). They play crucial roles in the assembly and function of ribosomes, the translation of mitochondrial mRNAs, and the regulation of mRNA splicing. The family includes enzymes with dual-specificity that modify both rRNA and tRNA, as well as those that target mitochondrial RNAs or function in the nucleus to modify pre-mRNAs. This post-transcriptional modification is essential for maintaining the proper structure and function of the RNA molecules and, consequently, for the accurate translation of the genetic code.
