  - kind: GENERAL
    text: >-
      The Sorting Nexin family is involved in various intracellular trafficking processes, including cytoplasm to vacuole transport (Cvt), pexophagy, and mitophagy. Members of this family are essential for the survival of cells under severe endoplasmic reticulum stress and play a role in the endocytic pathway, retrieving proteins and sorting the v-SNARE protein SNC1. The PX domain within these proteins binds phosphatidylinositol 3-phosphate, facilitating peripheral membrane localization to perivacuolar punctate structures. Some members also contribute to meiosis, vegetative growth, asexual/sexual reproduction, virulence, and biosynthesis of virulence determinants like deoxynivalenol (DON).
    source: "InterPro:IPR051079 abstract (LLM-generated, not curator-reviewed)"
