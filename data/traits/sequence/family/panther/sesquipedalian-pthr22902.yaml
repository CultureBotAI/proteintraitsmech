identifier: PANTHER:PTHR22902
label: SESQUIPEDALIAN
definition: >-
  This entry represents a group of PH domain containing proteins, including Boi1/2 from budding yeasts and PKHJ1/Sesquipedalian1-2/PKHA3 from humans. Budding yeast Boi1/2 are involved in polar growth and required for fusion of secretory vesicles with plasma membrane at sites of polarised growth. Sesquipedalian-1/2 are inositol polyphosphate phosphatase interacting proteins required for receptor recycling from endosomes, both to the trans-Golgi network and to the plasma membrane. PKHA3 plays a role in regulation of vesicular cargo transport from the trans-Golgi network to the plasma membrane. It regulates Golgi phosphatidylinositol 4-phosphate (PtdIns4P) levels and activates the PtdIns4P phosphatase activity of SACM1L when it binds PtdIns4P in 'trans' configuration.
