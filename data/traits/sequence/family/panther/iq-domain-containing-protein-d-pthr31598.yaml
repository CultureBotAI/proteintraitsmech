identifier: PANTHER:PTHR31598
label: "IQ DOMAIN-CONTAINING PROTEIN D"
definition: >-
  Dynein regulatory complex protein 10 (DRC10), also known as IQCD, is a component of the nexin-dynein regulatory complex (N-DRC), a key regulator of ciliary/flagellar motility which maintains the alignment and integrity of the distal axoneme and regulates microtubule sliding in motile axonemes. It interacts with mammalian homologue of C. elegans uncoordinated gene 13 (Munc13) in spermatozoa and may participate in acrosome exocytosis. I
