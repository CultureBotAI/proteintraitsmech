identifier: PANTHER:PTHR35293
label: "EGG CELL-SECRETED PROTEIN 1.5"
definition: >-
  Plant small cysteine-rich EC1 (EGG CELL 1) proteins accumulate in storage vesicles of the egg cell. They are involved in the regulation of gamete interactions during the double fertilization and to prevent multiple-pollen tube attraction. They mediate the redistribution of the gamete fusogen HAP2/GCS1 to the cell surface after secretion upon sperm arrival. This family includes Egg cell-secreted protein 1.1/1.2/1.3/1.4/1.5 from Arabidopsis.
