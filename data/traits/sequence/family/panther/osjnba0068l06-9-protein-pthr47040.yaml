  - kind: GENERAL
    text: >-
      This family of proteins is involved in the processing of mitochondrial precursor proteins. Members of this family function as ATP-independent proteases located within the inner membrane of mitochondria. They are responsible for the cleavage of transit peptides from precursor proteins during their translocation into the mitochondrial inter-membrane space. This proteolytic activity is essential for the proper targeting and functioning of proteins within the mitochondrial matrix and inter-membrane space, thereby playing a crucial role in mitochondrial biogenesis and maintenance.
