identifier: PANTHER:PTHR15012
label: "APICAL PROTEIN/SHROOM-RELATED"
definition: >-
  APICAL PROTEIN/SHROOM-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15012. PANTHER protein class: cytoskeletal protein, actin or actin-binding cytoskeletal protein. Members are annotated with the molecular function actin filament binding. Members participate in actin filament organization. Members localise to cortical actin cytoskeleton, adherens junction, apical junction complex.
