identifier: PANTHER:PTHR35116
label: "HELICASE PROTEIN MOM1"
definition: >-
  This entry represents a group of plant proteins, including MOM1 from Arabidopsis. MOM1 is involved in transcriptional gene silencing (TGS). It may transduce RNA-directed DNA methylation (RdDM) signals to repressive histone modification.
