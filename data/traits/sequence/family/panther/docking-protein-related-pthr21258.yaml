identifier: PANTHER:PTHR21258
label: "DOCKING PROTEIN RELATED"
definition: >-
  The DOK family proteins are enzymatically inert adaptor or scaffolding proteins that provide a docking platform for the assembly of multimolecular signaling complexes. Members of the DOK family are involved in various cellular processes, including negative regulation of insulin and JNK signaling pathways, modulation of integrin activation, and promotion of neurite outgrowth. They play roles in cellular proliferation, MAP kinase activation, and may influence immune responses. The PTB domain is a common feature that mediates receptor interactions, suggesting a role in signal transduction. The family can be divided into Type A and Type B subfamilies, with each member contributing to specific signaling pathways and cellular functions.
