identifier: PANTHER:PTHR45904
label: "TRNA (URACIL-5-)-METHYLTRANSFERASE"
definition: >-
  This entry represents a family of tRNA (uracil-5-)-methyltransferase homologues (EC:2.1.1.35), mainly found in metazoa, including tRNA (uracil-5-)-methyltransferase homologue A (TRMT2A) and B (TRMT2B) from human. TRMT2A catalyses the formation of 5-methyl-uridine in tRNAs and some mRNAs. TRMT2A/B mainly catalyse the methylation of uridine at position 54 (m5U54) in cytosolic tRNAs. This family also includes the plant homologue AtC3H24 (also known as TRNA METHYLTRANSFERASE 2B) and putative RNA methyltransferases R405/407 from Acanthamoeba polyphaga mimivirus. Methyltransferases (EC [ec:2.1.1.-]) constitute an important class of enzymes present in every life form. They transfer a methyl group most frequently from S-adenosyl L-methionine (SAM or AdoMet) to a nucleophilic acceptor such as oxygen leading to S-adenosyl-L-homocysteine (AdoHcy) and a methylated molecule. All these enzymes have in common a conserved region of about 130 amino acid residues that allow them to bind SAM. The substrates that are methylated by these enzymes cover virtually every kind of biomolecules ranging from small molecules, to lipids, proteins and nucleic acids. Methyltransferase are therefore involved in many essential cellular processes including biosynthesis, signal transduction, protein repair, chromatin regulation and gene silencing. More than 230 families of methyltransferases have been described so far, of which more than 220 use SAM as the methyl donor.
