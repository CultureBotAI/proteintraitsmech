  - kind: GENERAL
    text: >-
      The N(4)/N(6)-methyltransferase family is involved in the methylation of adenine residues within specific DNA sequences, which is crucial for the protection of genomic DNA from cleavage by restriction enzymes. Members of this family function as part of type I restriction-modification systems, which are composed of methyltransferase (MTase) and restriction endonuclease (R) subunits. These systems recognize specific DNA sequences and can act as molecular motors that translocate DNA in an ATP-dependent manner. The methylation activity of the MTase subunits modifies adenine residues to prevent DNA cleavage by the associated R subunit. The methylation pattern determines whether DNA is cleaved or further modified, with unmodified DNA being cut and hemimethylated DNA being fully methylated for protection. The family also includes type II methyltransferases that recognize and methylate specific DNA sequences to protect against endonuclease activity.
    source: "InterPro:IPR051537 abstract (LLM-generated, not curator-reviewed)"
