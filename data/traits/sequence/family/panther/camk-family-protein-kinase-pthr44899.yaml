  - kind: GENERAL
    text: >-
      The NEK Ser/Thr protein kinase family, part of the NIMA subfamily, is involved in various cellular processes including cell cycle regulation, DNA damage response, and cellular structure organization. Members of this family play crucial roles in centrosome separation, spindle formation, and chromosome condensation during mitosis and meiosis. They are also implicated in the G2/M checkpoint response to DNA damage by controlling the degradation of key cell cycle regulators. Some family members are essential for cilium assembly and may be involved in replicative senescence and DNA repair. The kinases typically phosphorylate threonine residues, although some also exhibit tyrosine kinase activity.
    source: "InterPro:IPR051131 abstract (LLM-generated, not curator-reviewed)"
