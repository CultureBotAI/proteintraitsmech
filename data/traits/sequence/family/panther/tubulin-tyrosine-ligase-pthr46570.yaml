identifier: PANTHER:PTHR46570
label: "TUBULIN--TYROSINE LIGASE"
definition: >-
  This family of proteins is responsible for the enzymatic activity that attaches a tyrosine residue to the C-terminal end of detyrosinated alpha-tubulin. This post-translational modification is crucial for the restoration of alpha-tubulin's tyrosine residue, which is important for the polymerization and function of microtubules. The reaction catalyzed by these enzymes plays a key role in the tubulin tyrosination/detyrosination cycle, which is implicated in various cellular processes including cell division, intracellular transport, and the maintenance of cell shape and motility.
