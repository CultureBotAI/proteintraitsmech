identifier: PANTHER:PTHR12080
label: "SIGNALING LYMPHOCYTIC ACTIVATION MOLECULE"
definition: >-
  The SLAM/CD2 family of receptors plays important roles in regulating multiple cellular interactions in the adaptive and innate immune systems. Signalling lymphocyte activation molecule (SLAM) receptors are expressed in multiple cells of the immune system, including natural killer cells, T cells, and B cells. SLAM receptors interact with SH2 domain-containing, cytosolic adaptor proteins such as SAP, EAT-2, and SH2D1A, and mediate tyrosine phosphorylation events that contribute to immune cell activation. The finding that mutations in SAP are associated with an X-linked lymphoproliferative disorder suggests that signalling through SLAM receptors can influence the development and effector functions of immune cells. This entry also includes V-set and transmembrane domain-containing protein 5, a cell adhesion-like membrane protein of the central nervous system (CNS) which modulates both the position and complexity of central neurons by altering their membrane morphology and dynamics. It ia involved in the formation of neuronal dendrites and protrusions including dendritic filopodia. In synaptogenesis, regulates synapse formation by altering dendritic spine morphology and actin distribution.
definition_source: "InterPro:IPR015631 abstract (PANTHER PTHR12080 is a member signature)"
