    text: >-
      XANTHOCILLIN BIOSYNTHESIS CLUSTER TRANSCRIPTION FACTOR XANC-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR39607. PANTHER protein class: DNA-binding transcription factor, gene-specific transcriptional regulator.
