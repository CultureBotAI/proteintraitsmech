    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that regulate the expression of gene clusters involved in the biosynthesis of various secondary metabolites with biological activities. Members of this family are characterized by their ability to up-regulate genes responsible for the production of compounds such as isocyanide xanthocillin, lipopeptide antibiotics leucinostatins, and zearalenone, as well as down-regulate certain genes within these clusters. They are also involved in the regulation of genes for the biosynthesis of pestheic acid, a precursor of chloropupukeananes. These transcription factors are noted for containing a basic leucine zipper (bZIP) domain, which is a common motif in DNA-binding and dimerization for transcriptional regulation.
    source: "InterPro:IPR052635 abstract (LLM-generated, not curator-reviewed)"
