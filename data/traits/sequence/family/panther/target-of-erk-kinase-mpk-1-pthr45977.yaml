identifier: PANTHER:PTHR45977
label: "TARGET OF ERK KINASE MPK-1"
definition: >-
  TARGET OF ERK KINASE MPK-1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45977. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 24 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, ubiquitin-protein transferase activity, transferase activity. Subfamilies participate in proteolysis, ubiquitin-dependent protein catabolic process, nitrogen compound metabolic process.
