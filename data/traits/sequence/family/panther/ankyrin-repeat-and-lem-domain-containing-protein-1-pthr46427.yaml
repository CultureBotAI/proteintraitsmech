identifier: PANTHER:PTHR46427
label: "ANKYRIN REPEAT AND LEM DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  ANKLE1 is a LEM protein with a GIY-YIG-type endonuclease activity and unknown function. Although most characterised LEM proteins are components of the inner nuclear membrane, ectopic Ankle1 shuttles between cytoplasm and nucleus. In mammals, ANKLE1 is predominantly expressed in hematopoietic tissues.
