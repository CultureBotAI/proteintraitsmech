identifier: PANTHER:PTHR42282
label: "PANTOATE KINASE-RELATED"
definition: >-
  Pantoate kinase (PoK) is an enzyme that belongs to the GHMP kinase family, specifically the PoK subfamily. It is responsible for phosphorylating (R)-pantoate to form (R)-4-phosphopantoate, a crucial step in the coenzyme A (CoA) biosynthesis pathway. ATP is the preferred phosphate donor for this reaction, although UTP can also serve as a donor with lower efficiency.
