identifier: PANTHER:PTHR12497
label: "TAZ PROTEIN  TAFAZZIN"
definition: >-
  This entry includes tafazzin and its homologues, such as Taz1 from yeasts and N-acylphosphatidylethanolamine synthase from plants. Tafazzin is an enzyme involved in the cardiolipin remodelling pathway. The phospholipid cardiolipin is an important component of the inner mitochondrial membrane that is involved in mitochondrial energy production and apoptosis. In humans tafazzin is expressed at high levels in cardiac and skeletal muscle. As many as 10 isoforms can be present in different amounts in different tissues. Isoforms with hydrophobic N-termini are thought to be membrane anchored, while shorter forms, lacking the hydrophobic stretch, may be cytoplasmic (these latter are found in leukocytes and fibroblasts, but not in heart and skeletal muscle). A central hydrophilic domain may serve as an exposed loop that interacts with other proteins. Defects in the taz gene are the cause of Barth syndrome, a severe inherited disorder, often fatal in childhood. The disease is characterised by cardiac and skeletal myopathy, short stature and neutropenia. In flies tafazzin is a CoA-independent, acyl-specific phospholipid transacylase with substrate preference for cardiolipin and phosphatidylcholine. Budding yeast Taz1 is a lyso-phosphatidylcholine acyltransferase that is required for normal phospholipid content of mitochondrial membranes, whose acyl specificity in the reaction relies on lipid chemical composition.
definition_source: "InterPro:IPR000872 abstract (PANTHER PTHR12497 is a member signature)"
