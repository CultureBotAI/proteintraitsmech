identifier: PANTHER:PTHR12944
label: "SOLUBLE LIVER ANTIGEN/LIVER PANCREAS ANTIGEN"
definition: >-
  In the archaea and eukaryotes, the conversion of the mischarged serine to selenocysteine (Sec) on its tRNA is accomplished in two steps. This enzyme, O-phosphoseryl-tRNA(Sec) selenium transferase, acts second, after a phosphophorylation step catalysed by a homologue of the bacterial SelA protein. It converts O-phosphoseryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec), which is required for selenoprotein biosynthesis.
