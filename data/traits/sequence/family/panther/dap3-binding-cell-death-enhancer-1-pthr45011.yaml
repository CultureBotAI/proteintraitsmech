  - kind: GENERAL
    text: >-
      This family of proteins acts as activators of the integrated stress response (ISR), particularly in response to iron deficiency and mitochondrial stress. Members of this family detect impaired protein import into mitochondria, leading to their localization at the mitochondrial surface. There, they bind to and activate EIF2AK1/HRI, a protein kinase. This activation results in the phosphorylation of eIF-2-alpha, reducing global protein synthesis and promoting the expression of specific genes, including ATF4, a key regulator of the ISR. Additionally, these proteins may play a role in death receptor-mediated apoptosis by influencing caspase activation.
    source: "InterPro:IPR052748 abstract (LLM-generated, not curator-reviewed)"
