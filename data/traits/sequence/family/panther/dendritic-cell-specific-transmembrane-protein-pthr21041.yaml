  - kind: GENERAL
    text: >-
      This family of proteins includes cell surface receptors and enzymes with roles in cellular fusion, differentiation, and immune system homeostasis. Members are involved in processes such as osteoclast bone resorption, osteoclastogenesis, and sperm-egg fusion during fertilization. Some proteins in this family function as E3 ubiquitin-protein ligases, mediating ubiquitination and subsequent proteasomal degradation of specific substrates, thereby regulating signaling pathways. Additionally, these proteins participate in the maintenance of immune self-tolerance and the regulation of antigen presentation by dendritic cells. Domains within these proteins are critical for their function, including interactions with other proteins and intracellular transport.
