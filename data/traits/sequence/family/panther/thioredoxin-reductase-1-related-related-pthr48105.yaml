identifier: PANTHER:PTHR48105
label: "THIOREDOXIN REDUCTASE 1-RELATED-RELATED"
definition: >-
  This entry includes: Ferredoxin--NADP reductase 1 and 2 Thioredoxin reductase Alkyl hydroperoxide reductase subunit F and related reductases. The ferredoxin--NADP reductase family consists of enzymes that play a crucial role in electron transfer processes within cells. These proteins are involved in the reduction of NADP+ to NADPH, a key reaction in the photosynthetic and respiratory electron transport chains. The NADPH produced is essential for various biosynthetic reactions, including fatty acid and nucleotide synthesis, and for the detoxification of reactive oxygen species, contributing to the cell's redox balance and defence against oxidative stress.
