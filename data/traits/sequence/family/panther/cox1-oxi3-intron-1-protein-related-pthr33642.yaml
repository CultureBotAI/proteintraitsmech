identifier: PANTHER:PTHR33642
label: "COX1/OXI3 INTRON 1 PROTEIN-RELATED"
definition: >-
  COX1/OXI3 INTRON 1 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33642. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, transferase activity, transferase activity, transferring phosphorus-containing groups. Subfamilies participate in mitochondrial RNA metabolic process, mitochondrial RNA processing, nucleobase-containing compound metabolic process. Subfamilies localise to intracellular anatomical structure, cytoplasm, mitochondrion.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
