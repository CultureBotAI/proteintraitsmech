identifier: PANTHER:PTHR33642
label: "COX1/OXI3 INTRON 1 PROTEIN-RELATED"
definition: >-
  COX1/OXI3 INTRON 1 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33642. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function DNA polymerase activity. Subfamilies participate in mitochondrial RNA processing, mRNA processing, mitochondrial RNA metabolic process. Subfamilies localise to mitochondrion, intracellular anatomical structure, cytoplasm.
