identifier: PANTHER:PTHR34042
label: "TRANSCRIPTION REPRESSOR OFP17"
definition: >-
  OFP17 is a plant transcriptional repressor belonging to the Ovate Family Proteins (OFPs), which are characterised by a conserved OVATE domain. OFP17 is highly expressed in roots and may regulate multiple aspects of plant growth and development through the regulation of BEL1-LIKE (BLH) and KNOX TALE (KNAT) homeodomain transcription factors.
