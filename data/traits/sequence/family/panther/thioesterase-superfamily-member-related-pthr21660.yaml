identifier: PANTHER:PTHR21660
label: "THIOESTERASE SUPERFAMILY MEMBER-RELATED"
definition: >-
  Acyl-coenzyme A thioesterases hydrolyse acyl-CoA to generate free fatty acid and coenzyme A. Acyl-coenzyme A thioesterase 13 (ACOT13) acts on medium (C12) and long-chain (C18) fatty acyl-CoA substrates. Naturally, it exists as a homotetramer and adopts a hotdog fold. Homologues are found in fungi, archaea and bacteria.
