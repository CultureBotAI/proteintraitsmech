identifier: PANTHER:PTHR11592
label: "GLUTATHIONE PEROXIDASE"
definition: >-
  Glutathione peroxidase (GSHPx) (EC:1.11.1.9) is an enzyme that catalyses the reduction of hydroperoxides by glutathione. Its main function is to protect against the damaging effect of endogenously formed hydroperoxides. In higher vertebrates, several forms of GSHPx are known, including a ubiquitous cytosolic form (GSHPx-1), a gastrointestinal cytosolic form (GSHPx-GI), a plasma secreted form (GSHPx-P), and an epididymal secretory form (GSHPx-EP). In mammals there are eight GPx, divided in two clusters, the classical GPx (GPx1, GPx2, GPx3, GPx5 and GPx6) and phospholipid hydroperoxide GPx (GPx4, GPx7 and GPx8). The classical GPx is multimeric (commonly tetrameric) and soluble, while the phospholipid hydroperoxide (PHGPx) is monomeric and often membrane-associated. In addition to these characterised forms, the sequence of a protein of unknown function has been shown to be evolutionary related to those of GSHPx's. In filarial nematode parasites, the major soluble cuticular protein (gp29) is a secreted GSHPx, which may provide a mechanism of resistance to the immune reaction of the mammalian host by neutralising the products of the oxidative burst of leukocytes. The structure of bovine seleno-glutathione peroxidase has been determined. The protein belongs to the α-β class, with a three layer(aba) sandwich architecture. The catalytic site of GSHPx contains a conserved residue which is either a cysteine or, in many eukaryotic GSHPx, a selenocysteine.
