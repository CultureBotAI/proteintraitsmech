identifier: PANTHER:PTHR20902
label: "41-2 PROTEIN ANTIGEN-RELATED"
definition: >-
  TRS31 (also known as TRAPPC5) is a subunit of the trafficking protein particle complex (TRAPP). It is one of the six core subunits of TRAPP complexes which play a key role in the regulation of ER-to-Golgi and intra-Golgi transport by tethering the vesicle membrane to the target membrane.
