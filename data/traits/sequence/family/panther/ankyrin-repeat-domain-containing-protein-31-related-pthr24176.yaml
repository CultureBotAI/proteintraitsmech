identifier: PANTHER:PTHR24176
label: "ANKYRIN REPEAT DOMAIN-CONTAINING PROTEIN 31-RELATED"
definition: >-
  This family includes Ankyrin repeat domain-containing protein 31 (ANKRD31) from mouse, similar sequences from eukaryotes and some uncharacterised proteins from bacteria. ANKRD31 is required for DNA double-strand breaks (DSBs) formation during meiotic recombination. It regulates the spatial and temporal patterns of pre-DSB recombinosome assembly and recombination activity by acting as a scaffold that anchors REC114 and other factors to specific genomic locations, thereby regulating DSB formation. This protein plays a key role in recombination in the pseudoautosomal regions of sex chromosomes.
