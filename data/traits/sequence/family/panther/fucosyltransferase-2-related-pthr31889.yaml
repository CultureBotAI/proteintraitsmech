identifier: PANTHER:PTHR31889
label: "FUCOSYLTRANSFERASE 2-RELATED"
definition: >-
  Plant cell walls are crucial for development, signal transduction, and disease resistance in plants. Cell walls are made of cellulose, hemicelluloses, and pectins. Xyloglucan (XG), the principal load-bearing hemicellulose of dicotyledonous plants, has a terminal fucosyl residue. This fucosyltransferase adds this residue.
