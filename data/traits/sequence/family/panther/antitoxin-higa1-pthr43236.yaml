  - kind: GENERAL
    text: >-
      This family of proteins includes metalloproteases that are central regulators in DNA repair and protection pathways, particularly in response to radiation stress. They exhibit site-specific proteolytic activity, cleaving and inactivating repressor proteins, which leads to the induction of gene expression necessary for DNA repair and cell survival post-radiation exposure. These proteins are known to regulate the expression of a variety of proteins, including key DNA repair proteins. Structurally, they are characterized by an N-terminal zinc-peptidase domain, a central helix-turn-helix motif indicative of DNA-binding potential, and a C-terminal GAF-type domain. Their protease activity can be modulated by chelating agents such as EDTA.
    source: "InterPro:IPR052345 abstract (LLM-generated, not curator-reviewed)"
