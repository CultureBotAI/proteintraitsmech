identifier: PANTHER:PTHR45732
label: "ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 8"
definition: >-
  ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 8 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45732. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies participate in transport, microtubule-based process, microtubule-based movement. Subfamilies localise to lytic vacuole, intracellular anatomical structure, cytoplasm.
