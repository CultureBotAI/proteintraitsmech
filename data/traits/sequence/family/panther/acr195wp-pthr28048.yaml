identifier: PANTHER:PTHR28048
label: ACR195WP
definition: >-
  This family represents Mitochondrial protein-disulfide reductase DMO2 and related fungal proteins. DMO2 is a protein disulfide reductase that introduces disulfide bonds into inner mitochondrial membrane proteins and chaperones their assembly into multimeric protein complexes. It introduces disulfide bonds into TIM17 and TIM22 and assists their assembly into the TIM23 complex and TIM22 complex, respectively [. It is also involved in the formation of disulfide bonds in COX20.
