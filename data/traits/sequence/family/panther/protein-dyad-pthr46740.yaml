identifier: PANTHER:PTHR46740
label: "PROTEIN DYAD"
definition: >-
  This entry represents a group of plant proteins, including DYAD from Arabidopsis and AMEIOTIC 1 from Zea mays (AM1) and Oryza sativa (OsAM1). DYAD, also known as SWITCH1, is required for the establishment of sister chromatid cohesion and for bivalent formation at meiosis. It may also be required for meiotic recombination initiation. AM1 plays an important role in multiple early meiotic processes and may be required for the initiation of meiosis. OsAM1 has a coiled-coil domain in its central region, it is required for the leptotene-zygotene transition step in meiocytes and plays an important role in the building the proper chromosome structure at the beginning of meiosis.
definition_source: "InterPro:IPR044221 abstract (PANTHER PTHR46740 is a member signature)"
