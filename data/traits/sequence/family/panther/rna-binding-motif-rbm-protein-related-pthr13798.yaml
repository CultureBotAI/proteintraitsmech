identifier: PANTHER:PTHR13798
label: "RNA BINDING MOTIF RBM PROTEIN -RELATED"
definition: >-
  This family of proteins includes RNA-binding subunits of the nuclear exosome targeting (NEXT) complex, which functions as an RNA exosome cofactor. They are involved in the surveillance and turnover of a subset of non-coding short-lived RNAs, including aberrant transcripts. These proteins bind preferentially to polyuridine sequences and are associated with newly synthesized RNAs such as pre-mRNAs, promoter upstream transcripts (PROMPTs), enhancer RNAs (eRNAs), and extended products from small nuclear RNAs (snRNAs). They play roles in biological processes like DNA damage response and stress response, with some members participating in the regulation of alternative splicing during neuron and germ cell differentiation. The RNA recognition motif (RRM) domain is key for RNA binding and interaction with non-coding RNAs.
