identifier: PANTHER:PTHR21427
label: "UBIQUINONE BIOSYNTHESIS PROTEIN COQ9, MITOCHONDRIAL"
definition: >-
  Ubiquinone biosynthesis protein COQ9 is an protein that is required for the biosynthesis of coenzyme Q, which functions in the respiratory electron transport chain and serves as a lipophilic antioxidant. In Saccharomyces cerevisiae (Baker's yeast), Q biosynthesis requires nine Coq proteins (Coq1-Coq9), with the COQ9 product acting subsequent to the prenylation of 4-hydroxybenzoic acid. COQ9 consists of an α-helical globular domain and an amphipathic C-terminal 10th α-helix responsible for membrane association.
