  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in cellular transport processes. Specifically, they are implicated in endocytosis, a mechanism by which cells internalize molecules and particles from their surroundings. Some members of this family are also components of a complex that is essential for the localization of phosphatidylinositol 4-kinase to the plasma membrane. This complex regulates the synthesis of phosphatidylinositol 4-phosphate, a critical lipid signaling molecule. Within the complex, these proteins play a pivotal role in connecting the kinase to other components, facilitating the proper synthesis and distribution of the lipid.
    source: "InterPro:IPR051722 abstract (LLM-generated, not curator-reviewed)"
