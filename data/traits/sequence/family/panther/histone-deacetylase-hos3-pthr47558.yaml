  - kind: GENERAL
    text: >-
      This family of proteins is involved in the removal of acetyl groups from lysine residues at the N-terminal part of core histones, including H2A, H2B, H3, and H4. This action is crucial for epigenetic repression, as it marks the histones for a state that is generally associated with condensed, transcriptionally inactive chromatin. Members of this family are key regulators in the control of gene expression, influencing various cellular processes such as cell cycle progression and development. They function through the assembly of large multiprotein complexes, which are essential for their deacetylase activity.
    source: "InterPro:IPR053244 abstract (LLM-generated, not curator-reviewed)"
