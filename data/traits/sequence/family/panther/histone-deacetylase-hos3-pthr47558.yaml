    text: >-
      HISTONE DEACETYLASE HOS3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47558. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein, histone modifying enzyme. Members are annotated with the molecular function hydrolase activity, histone modifying activity, histone deacetylase activity. Members localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
