identifier: PANTHER:PTHR31576
label: "TATA BOX-BINDING PROTEIN-ASSOCIATED FACTOR RNA POLYMERASE I SUBUNIT B"
definition: >-
  Rrn7 is a subunit of the yeast Pol I core factor. It associates strongly with both Rrn6 and Rrn11 to form a complex which itself binds the TATA-binding protein, and is required for transcription by the core domain of the RNA Pol I promoter. Rrn7 human orthologue, TATA box-binding protein-associated factor RNA polymerase I subunit B (TAF1B), is also a component of RNA polymerase I core factor complex. It acts as a GTF2B/TFIIB-like factor and plays a key role in multiple steps during transcription initiation. Both Rrn7 and TAF1B are TFIIB-like factors. Although distantly related, they share many activities associated with TFIIB-like factors.
definition_source: "InterPro:IPR033599 abstract (PANTHER PTHR31576 is a member signature)"
