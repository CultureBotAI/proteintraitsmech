identifier: PANTHER:PTHR46514
label: AMPHIPHYSIN
definition: >-
  Amphiphysins belong to the expanding BAR (Bin-Amphiphysin-Rvsp) family proteins, all members of which share a highly conserved N-terminal BAR domain, which has predicted coiled-coil structures required for amphiphysin dimerisation and plasma membrane interaction. Almost all members also share a conserved C-terminal Src homology 3 (SH3) domain, which mediates their interactions with the GTPase dynamin and the inositol-5'-phosphatase synaptojanin 1 in vertebrates and with actin in yeast. The central region of all these proteins is most variable. In mammals, the central region of amphiphysin I and amphiphysin IIa contains a proline-arginine-rich region for endophilin binding and a CLAP domain, for binding to clathrin and AP-2. The interactions mediated by both the central and C-terminal domains are believed to be modulated by protein phosphorylation. Amphiphysins are key players in the control of plasma membrane curvature, membrane shaping and membrane remodeling, involved involved in clathrin-mediated endocytosis, the endosomal sorting of membrane proteins, actin function, and signalling pathways. In vertebrates, amphiphysins may regulate, but are not essential for clathrin-mediated endocytosis of SVs. However, in Drosophila amphiphysin is not involved at all in SV endocytosis but is required for T-tubule structure and excitation-contraction coupling muscles and plays a role in membrane morphogenesis in developing photoreceptors and a variety of other cells.
definition_source: "InterPro:IPR003005 abstract (PANTHER PTHR46514 is a member signature)"
