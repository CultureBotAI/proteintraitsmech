identifier: PANTHER:PTHR44259
label: "OS07G0183000 PROTEIN-RELATED"
definition: >-
  This family of proteins includes components of SCF (SKP1-cullin-F-box) E3 ubiquitin ligase complexes, which are involved in the ubiquitination and subsequent proteasomal degradation of various target proteins. They play a crucial role in brassinosteroid signal transduction by mediating the inactivation of specific kinase inhibitors through competitive substrate binding and promotion of ubiquitination and degradation. These proteins are essential for regulating plant growth and development by modulating the stability of key signaling components.
