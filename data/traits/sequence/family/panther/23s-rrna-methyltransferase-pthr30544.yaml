identifier: PANTHER:PTHR30544
label: "23S RRNA METHYLTRANSFERASE"
definition: >-
  The enzymes in this subgroup represent the Class A Radical SAM Methyltransferases. These proteins all have a single canonical Radical SAM core domain and utilise a methylene radical generated on a unique methylated cysteine residues. They use two moles of SAM per turnover, the first being a methyl donor, methylating the conserved Cys residue and the other being reductively cleaved to form the 5'-deoxyadenosyl radical and Methionine.
