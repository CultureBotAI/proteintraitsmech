identifier: PANTHER:PTHR13283
label: "KREV INTERACTION TRAPPED 1-RELATED"
definition: >-
  This family of proteins includes Krev interaction trapped protein 1 (KRIT1), its paralogue FERM domain-containing protein 8 (FRMD8) and closely related proteins. Members of this entry are involved in various cellular processes, including the stabilisation of cell surface proteins, regulation of signaling pathways, and maintenance of cellular homeostasis. FRMD8 promotes the stability of iRhom1/RHBDF1 and iRhom2/RHBDF2, preventing their degradation and facilitating ADAM17-mediated shedding of ligands such as TNF and growth factors. They also play a role in negatively regulating Wnt signaling. KRIT1 is part of the CCM signaling pathway, crucial for cardiovascular development, acting as negative regulators of angiogenesis and influencing endothelial cell functions. They interact with integrins and participate in maintaining intracellular reactive oxygen species homeostasis, which is essential for preventing oxidative damage and modulating cell proliferation [,. Additionally, they are involved in the regulation of macroautophagy and cellular polarity through interactions with various proteins and signaling cascades. Mutations in this proteins are related to cerebral cavernous malformations.
definition_source: "InterPro:IPR051594 abstract (PANTHER PTHR13283 is a member signature)"
