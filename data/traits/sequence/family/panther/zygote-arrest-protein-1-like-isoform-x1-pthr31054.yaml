identifier: PANTHER:PTHR31054
label: "ZYGOTE ARREST PROTEIN 1-LIKE ISOFORM X1"
definition: >-
  This family represents Zygote arrest protein 1 (ZAR1) and its homologues ZAR1-like proteins. ZAR1 is essential for female fertility and oocyte-to-embryo transition by coordinating maternal mRNA storage, translation and degradation. It is a mRNA-binding protein that mediates formation of MARDO (mitochondria-associated ribonucleoprotein domain), a membraneless compartment that stores maternal mRNAs in oocytes. MARDO assembly around mitochondria is directed by an increase in mitochondrial membrane potential during oocyte growth. ZAR1 binds to the 3'-UTR of maternal mRNAs. Maternal mRNAs stored in the MARDO are translationally repressed.
definition_source: "InterPro:IPR026775 abstract (PANTHER PTHR31054 is a member signature)"
