    text: >-
      RING-TYPE DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22791. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity. Members participate in protein ubiquitination.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The RING finger protein family comprises E3 ubiquitin-protein ligases involved in various cellular processes, including apoptotic signaling pathways activated by endoplasmic reticulum stress, the unfolded protein response, autophagy, and nutrient sensing. Members of the family ubiquitinate specific substrates, regulating their localization, stability, and function. For instance, they ubiquitinate BNIP1 affecting its mitochondrial localization, ATF6 to promote UPR, and EPHB2 for autophagy induction. They also control mTORC1 activity by ubiquitinating Sestrin-2. The RING-type domain within these proteins is essential for their ubiquitination activity.
    source: "InterPro:IPR051435 abstract (LLM-generated, not curator-reviewed)"
