identifier: PANTHER:PTHR11141
label: "PROTEIN TRANSPORT PROTEIN SEC23"
definition: >-
  Vesicular carriers mediate a continuous flux of proteins and lipids between endoplasmic reticulum (ER) and the Golgi. Anterograde and retrograde transport is mediated by distinct sets of cytosolic coat proteins, the COPI and COPII coats, respectively, which act on the membrane to capture cargo proteins into nascent vesicles. Sec23 is a component of the coat protein complex II (COPII). Polymerization of the coat requires the recruitment of the Sec13/Sec31 complex (coat outer shell) by the Sec23/Sec24 complex. The Sec23/Sec24 coat complex then sorts the fusion machinery (SNAREs) into vesicles as they bud from the ER. Sec23 has been shown to interact in a sequential manner with other proteins (Sar1, TRAPPI and Hrr25) to control the direction of anterograde membrane flow. This entry also includes the budding yeast Sec23 paralogue, Nel1 (YHR035W). It is a GTPase-activating protein for Sar1 and does not function as a subunit of the coat protein complex II (COPII) coat.
definition_source: "InterPro:IPR037364 abstract (PANTHER PTHR11141 is a member signature)"
