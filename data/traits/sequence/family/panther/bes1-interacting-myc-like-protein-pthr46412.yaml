identifier: PANTHER:PTHR46412
label: "BES1-INTERACTING MYC-LIKE PROTEIN"
definition: >-
  This entry represents a group of plant transcription factors, including BIM1-3. BIM1 interacts with BES1 and binds to E box (CANNTG) sequences present in many BR (brassinosteroid)-induced promoters.
