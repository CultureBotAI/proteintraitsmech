identifier: PANTHER:PTHR33650
label: "CHLOROPLAST ENVELOPE MEMBRANE PROTEIN-RELATED"
definition: >-
  Members of this family are probable integral membrane proteins. Their molecular function is unknown. CemA proteins are found in the inner envelope membrane of chloroplasts but not in the thylakoid membrane. A cyanobacterial member of this family (proton extrusion protein PcxA) is involved in light-induced Na(+)-dependent proton extrusion and has been implicated in CO2 transport, but is probably not a CO2 transporter itself.
