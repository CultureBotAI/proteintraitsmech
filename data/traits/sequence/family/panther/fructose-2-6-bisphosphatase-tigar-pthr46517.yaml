  - kind: GENERAL
    text: >-
      The Phosphoglycerate Mutase Family is characterized by its broad range of phosphatase activities, including the hydrolysis of various phosphorylated substrates such as nucleoside tri- and diphosphates, phosphorylated organic acids, and amino acids. Members of this family, such as TIGAR, act as negative regulators of glycolysis by hydrolyzing fructose-2,6-bisphosphate and fructose-1,6-bisphosphate, leading to the activation of the pentose phosphate pathway and NADPH production. This activity is crucial for the regulation of intracellular reactive oxygen species, contributing to cell protection against oxidative or metabolic stress-induced cell death. Additionally, TIGAR plays roles in mitophagy inhibition, neuroprotection, cancer cell survival, and tissue regeneration. The family includes both metal-independent phosphatases and BPG-dependent PGAM subfamily members, indicating a diversity of enzymatic mechanisms and biological functions.
    source: "InterPro:IPR051695 abstract (LLM-generated, not curator-reviewed)"
