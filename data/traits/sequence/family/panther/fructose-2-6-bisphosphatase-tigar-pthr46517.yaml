  - kind: GENERAL
    text: >-
      FRUCTOSE-2,6-BISPHOSPHATASE TIGAR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46517. PANTHER protein class: phosphatase, hydrolase. Members are annotated with the molecular function sugar-phosphatase activity, phosphatase activity. and participate in regulation of phosphorus metabolic process, negative regulation of cellular metabolic process, regulation of phosphate metabolic process. and localise to cytoplasm, cytosol.
