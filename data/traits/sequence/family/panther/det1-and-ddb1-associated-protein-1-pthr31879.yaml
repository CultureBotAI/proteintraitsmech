identifier: PANTHER:PTHR31879
label: "DET1- AND DDB1-ASSOCIATED PROTEIN 1"
definition: >-
  DDA1 is a core subunit of multiple Cul4-based E3 ligases (CRL4s), involved in ubiquitination and subsequent proteasomal degradation of target proteins, which regulate key developmental and stress responses in eukaryotes. In mammals, DDA1 binds to DET1 and DDB1 to form DDD complexes, which recruit specific ubiquitin-conjugating UBE2E enzymes to form DDD-E2 complexes. The DDD-E2 complex provides a platform for interaction with Cul4A and beta-transducing (also called WD40) repeat proteins. DDA1 is conserved in higher eukaryotes, including Arabidopsis. This entry also includes protein LOWER TEMPERATURE 1 (LOT1) from Arabidopsis which contains the conserved DDA1 domain. LOT1 supports abscisic acid (ABA) responses and drought tolerance by regulating the dynamic localization and stability (preventing degradation by the proteasome) of CAR proteins (C2-domain ABA-related, e.g. CAR9).
definition_source: "InterPro:IPR033575 abstract (PANTHER PTHR31879 is a member signature)"
