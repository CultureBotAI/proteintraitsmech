identifier: PANTHER:PTHR47385
label: CALPONIN
definition: >-
  This family of proteins is associated with the regulation and modulation of smooth muscle contraction. Members are known to bind to actin, calmodulin, and tropomyosin, and their interaction with actin inhibits the actomyosin Mg-ATPase activity. Some family members are implicated in actin filament dynamics, including actin cross-linking, bundling, and stabilization against disassembly. They may also contribute to the maintenance of sarcomeric actin organization in striated muscles and play roles in cellular contractile properties, potentially influencing replicative senescence and cell migration.
