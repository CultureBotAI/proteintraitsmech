identifier: PANTHER:PTHR31500
label: "AT-HOOK MOTIF NUCLEAR-LOCALIZED PROTEIN 9"
definition: >-
  This entry includes AT-hook motif nuclear-localized protein 1-14 (AHL1-14) from Arabidopsis. They have two conserved structural units, the AT-hook motif and the Plant and Prokaryote Conserved (PPC) domain, the latter also known as DUF296. Members of the AHL family regulate diverse aspects of growth and development in plants. AHL1 is a transcription factor that specifically binds AT-rich DNA sequences related to the nuclear matrix attachment regions (MARs).
