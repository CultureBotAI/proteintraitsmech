  - kind: GENERAL
    text: >-
      PHOX (PX) DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45971. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function phosphatidylinositol binding, phosphatidylinositol phosphate binding. Subfamilies localise to intracellular membrane-bounded organelle, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the regulation of autophagy and host defense mechanisms. Members promote autophagosome maturation by facilitating the production of PtdIns(3)P and antagonizing negative regulators of the PI3K/PI3KC3 complex. They bind various phosphoinositides and recruit complexes to autophagosomes, influencing their fusion with lysosomes. Additionally, they regulate lipid and glycogen homeostasis and may act as tumor suppressors. Some members inhibit PIK3C3 activity, negatively regulate endosome maturation, and affect endocytic trafficking. They are also involved in the immune response, promoting NADH oxidase activity and affecting TLR signaling, as well as regulating pro-inflammatory cytokine production following pathogen infection.
    source: "InterPro:IPR052428 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
