identifier: PANTHER:PTHR47371
label: "LIPOTEICHOIC ACID SYNTHASE"
definition: >-
  The OpgB/LTA synthase family is characterized by proteins involved in the biosynthesis of important cell wall components in bacteria. Members of the OpgB subfamily function as phosphoglycerol transferases, transferring phosphoglycerol residues from phosphatidylglycerol to membrane-bound nascent glucan backbones, a crucial step in the production of certain polysaccharides. The LTA synthase subfamily members catalyze the polymerization of lipoteichoic acid (LTA) polyglycerol phosphate, using phosphatidylglycerol as a substrate. This process is essential for bacterial growth and cell division. The family plays a significant role in the structural integrity and functionality of bacterial cell walls, influencing processes such as cell shape maintenance, protection against environmental stress, and interaction with host immune systems.
