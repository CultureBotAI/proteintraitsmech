identifier: PANTHER:PTHR40697
label: "ACETOIN CATABOLISM PROTEIN X"
definition: >-
  Members of this group are predicted to be kinases (possibly ATP-NAD kinases) from prokaryotes. Some of them are known as AcoX, as they are encoded by genes found in clusters responsible for acetoin catabolism in some bacteria and archaea.
