  - kind: GENERAL
    text: >-
      The GDSL lipolytic enzyme family is characterized by a broad range of esterase and lipase activities, acting on various substrates. Members of this family are involved in diverse biological processes, including lipid metabolism, cell signaling, and stress response. Some proteins within the family exhibit specific functions, such as hydrolyzing phospholipids, deacetylating xylo-oligomers, and contributing to salt tolerance and cellular homeostasis. The family is named after the conserved GDSL motif present in the active site of these enzymes. The motif contributes to their catalytic activity, which typically involves the hydrolysis of ester bonds in lipids and other molecules. The versatility of the GDSL enzymes is reflected in their wide distribution across different organisms and their involvement in various physiological functions.
