identifier: PANTHER:PTHR46252
label: "BRORIN FAMILY MEMBER"
definition: >-
  This entry includes VWC2 (also known as Brorin) and VWC2L proteins. Brorin is a secreted BMP antagonist that promotes neurogenesis in mouse neural precursor cells. VWC2L may also play roles in neural development and functions.
