identifier: PANTHER:PTHR11122
label: "APOSPORY-ASSOCIATED PROTEIN C-RELATED"
definition: >-
  APOSPORY-ASSOCIATED PROTEIN C-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11122. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 23 of its annotated subfamilies. Subfamilies are annotated with the molecular function racemase and epimerase activity, acting on carbohydrates and derivatives. Subfamilies localise to intracellular anatomical structure, cytoplasm.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
