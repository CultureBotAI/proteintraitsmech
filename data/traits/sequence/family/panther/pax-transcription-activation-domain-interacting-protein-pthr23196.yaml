  - kind: GENERAL
    text: >-
      The protein family is involved in the DNA damage response (DDR) and transcriptional regulation. Members of the family function as mediators and scaffolds at sites of DNA damage, recognizing and binding to specific phosphorylated histone markers, such as H2AX phosphorylated at 'Ser-139'. They facilitate the recruitment of DNA repair and signal transduction proteins, contributing to cell cycle arrest, kinase activation, and chromosomal stability during mitosis. Some family members also interact with histone methyltransferase (HMT) complexes, influencing transcriptional regulation and playing roles in early development. The family is associated with the repair of double-strand breaks (DSBs) through homologous recombination and may regulate the recruitment of polymerase eta and RAD51 post-DNA damage. Additionally, they are implicated in transcriptional regulation during immunoglobulin class switching in B-cells and may act as transcriptional cofactors in TGF beta signaling.
    source: "InterPro:IPR051579 abstract (LLM-generated, not curator-reviewed)"
