identifier: PANTHER:PTHR14725
label: "RIBOSOME-BINDING FACTOR A, MITOCHONDRIAL-RELATED"
definition: >-
  This entry represents ribosome-binding factor A (RBFA) from human and its homologues. it is a mitochondrial RNA-binding protein that exerts crucial roles in mitoribosome biogenesis. The structure has been solved by NMR (PDB:2e7g) and cryo_EM (PDB:7pnt).
