identifier: PANTHER:PTHR11449
label: "RIBOSOMAL PROTEIN L30"
definition: >-
  This entry includes proteins with a structural fold similar to ribosomal protein eL30, and includes eL30 from archaean 50S ribosomes, eL30 from eukaryotic 60S ribosomes and some uncharacterised bacterial sequences.
