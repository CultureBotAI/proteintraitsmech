  - kind: GENERAL
    text: >-
      The THEM4/THEM5 thioesterase family is characterized by acyl-CoA thioesterase activity, specifically targeting medium and long-chain fatty acyl-CoA substrates, ranging from C14 to C18 in length. Members of the THEM4/THEM5 family are implicated in mitochondrial fatty acid metabolism, contributing to the regulation of energy production and lipid biosynthesis. Additionally, the family plays a role in the apoptotic process, with some members potentially influencing cell survival through the modulation of AKT1 activity. This regulation may involve either inhibition or enhancement of AKT1 phosphorylation and activity, which can affect its translocation to the plasma membrane and subsequent cellular signaling pathways.
