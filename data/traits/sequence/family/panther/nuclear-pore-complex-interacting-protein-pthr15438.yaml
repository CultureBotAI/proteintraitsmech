identifier: PANTHER:PTHR15438
label: "NUCLEAR PORE COMPLEX INTERACTING PROTEIN"
definition: >-
  This family consists of a series of primate-specific nuclear pore complex-interacting protein (NPIP) sequences. NPIP are not considered one of the core structural nucleoporins that form the main scaffold of the nuclear pore complex (NPC), but it is classified as a nucleoporin-associated protein. This family is well conserved from African apes to humans. Nuclear pore complexes (NPCs) are composed of several copies of 30 different proteins called nucleoporins (Nups). NPCs penetrate the nuclear envelope (NE) and regulate the nucleocytoplasmic trafficking of macromolecules. Beyond this vital role, NPC components influence genome functions in a transport-independent manner. Nups play an evolutionarily conserved role in gene expression regulation that, in metazoans, extends into the nuclear interior. Additionally, in proliferative cells, Nups play a crucial role in genome integrity maintenance and mitotic progression.
definition_source: "InterPro:IPR009443 abstract (PANTHER PTHR15438 is a member signature)"
