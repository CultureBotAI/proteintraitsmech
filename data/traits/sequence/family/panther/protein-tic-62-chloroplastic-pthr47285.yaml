identifier: PANTHER:PTHR47285
label: "PROTEIN TIC 62, CHLOROPLASTIC"
definition: >-
  This entry includes a group of NAD(P)-binding domain-containing proteins from plants and Cyanobacteria, including TIC62 from Arabidopsis. TIC62 is part of the Tic complex (a redox regulon) involved in translocation of nuclear-encoded preproteins across the inner envelope of chloroplasts. TIC62 binds to ferredoxin-NADP(H) oxidoreductase (FNR) and acts as a redox sensor of the complex.
