  - kind: GENERAL
    text: >-
      The protein family is comprised of transcription factors that regulate the expression of gene clusters involved in the biosynthesis of various secondary metabolites in fungi. These metabolites include mycotoxins, host-selective toxins, phytohormones, and compounds with potential pharmacological applications such as antitumor agents and cholesterol-lowering drugs. The transcription factors are responsible for the production of a wide range of structurally diverse compounds, including notoamides, agnestins, citrinin, azaphilones, and sorbicillinoids, among others. They play crucial roles in fungal physiology, ecological interactions, and pathogenicity by controlling the synthesis of these bioactive molecules.
