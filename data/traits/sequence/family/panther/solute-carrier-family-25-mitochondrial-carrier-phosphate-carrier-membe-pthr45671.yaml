identifier: PANTHER:PTHR45671
label: "SOLUTE CARRIER FAMILY 25 (MITOCHONDRIAL CARRIER PHOSPHATE CARRIER), MEMBER 3, LIKE-RELATED-RELATED"
definition: >-
  This entry represents a group of mitochondrial phosphate carrier proteins, including Mir1 and Pic2 from budding yeasts and SLC25A3 from animals. They are copper and phosphate carriers that imports copper and inorganic phosphate into mitochondria.
