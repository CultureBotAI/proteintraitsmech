identifier: PANTHER:PTHR47996
label: "TRANSCRIPTION FACTOR DUO1"
definition: >-
  This family of proteins includes transcription factors that play a crucial role in plant development and reproduction. Members of this family are involved in the regulation of gene expression by binding to specific DNA sequences. They function as activators of transcription, promoting the expression of genes that are essential for processes such as male germline development, cell cycle progression, and pollen maturation. These proteins are characterized by their ability to bind to MYB sites within gene promoters, thereby initiating transcriptional programs necessary for the proper functioning of gametic cells and fertilization.
