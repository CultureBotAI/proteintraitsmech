definitions:
  - kind: GENERAL
    text: >-
      CHROMATE REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30543. PANTHER protein class: oxidoreductase, metabolite interconversion enzyme. Members are annotated with the molecular function nucleotide binding, anion binding, carbohydrate derivative binding. Members localise to intracellular anatomical structure, cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in various reductive processes, primarily acting as reductases that utilize NAD(P)H as an electron donor. Members of the family catalyze the reduction of azo bonds in aromatic azo compounds, quinones, and potentially other substrates, producing less reactive or toxic species. These activities are crucial for cellular detoxification pathways, including the metabolism of aromatic compounds and protection against oxidative stress. Some family members also participate in biosynthetic pathways, such as the production of meroterpenoids and arthripenoids, and may be involved in iron assimilation. The family includes enzymes that can reduce chromate, contributing to cellular defense mechanisms against chromate toxicity.
    source: "InterPro:IPR050712 abstract (LLM-generated, not curator-reviewed)"
