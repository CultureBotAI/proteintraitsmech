identifier: PANTHER:PTHR10838
label: SYNAPTOGYRIN
definition: >-
  This entry represents synaptogyrin1-4. They are conserved components of the exocytic apparatus and function as regulators of Ca(2+)-dependent exocytosis. Synaptogyrin-1 is involved in the regulation of short-term and long-term synaptic plasticity.
