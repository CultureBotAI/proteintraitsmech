  - kind: GENERAL
    text: >-
      This family of proteins includes methyltransferases involved in the biosynthesis of specialized lipopeptides, such as gramillins. These enzymes participate in various steps of the biosynthetic pathway, including initiation of fatty acid synthesis, hydroxylation, oxidation, transamination, and disulfide bond formation. They may also play a role in the regulation of this pathway and possess broader enzymatic functions. The proteins are characterized by a SAM-binding motif and are related to the class V-like SAM-binding methyltransferase superfamily. They are implicated in the production of compounds that can induce cell death in specific plant species.
