  - kind: GENERAL
    text: >-
      The SNF2/RAD54 helicase family is involved in various DNA repair processes, particularly homologous recombination (HR), a major pathway for repairing DNA double-strand breaks (DSBs), single-stranded DNA (ssDNA) gaps, and stalled or collapsed replication forks. Family members act as molecular motors during the homology search, guiding RAD51 ssDNA along a donor dsDNA and facilitating synaptic complex formation. They also play roles in transcription-coupled nucleotide excision repair, meiotic recombination, and the regulation of antigenic variation in kinetoplastid parasites. Additionally, some members function as DNA helicases, tension sensors, and chromatin remodelers, influencing the choice of DSB repair pathways and participating in the DNA damage response.
