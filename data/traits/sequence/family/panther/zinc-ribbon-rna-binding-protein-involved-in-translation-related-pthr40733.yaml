identifier: PANTHER:PTHR40733
label: "ZINC-RIBBON RNA-BINDING PROTEIN INVOLVED IN TRANSLATION-RELATED"
definition: >-
  This family represents a group of archaeal proteins, including Small ribosomal subunit protein aS21 (RS21) Haloferax volcanii, which is a component of the small ribosomal subunit. NMR 3D structure analysis revealed the content of four C(P)XCG motifs, suggesting the presence of two zinc-binding pockets. However, only C(P)XCG motifs 2 and 4 (comprising Cys-32 to Cys-35 and Cys-50 to Cys-53) form a zinc binding pocket and binds one zinc atom, while C(P)XCG motifs 1 and 3 (comprising Cys-12 to Cys-15 and Cys-39 to Cys-42) form a four-Cys cluster that do not bind zinc. The four C(P)XCG motifs are critical for protein stability, folding and functionality. Ribosomes are the particles that catalyse mRNA-directed protein synthesis in all organisms. The codons of the mRNA are exposed on the ribosome to allow tRNA binding. This leads to the incorporation of amino acids into the growing polypeptide chain in accordance with the genetic information. Incoming amino acid monomers enter the ribosomal A site in the form of aminoacyl-tRNAs complexed with elongation factor Tu (EF-Tu) and GTP. The growing polypeptide chain, situated in the P site as peptidyl-tRNA, is then transferred to aminoacyl-tRNA, and the new peptidyl-tRNA, extended by one residue, is translocated to the P site with the aid of the elongation factor G (EF-G) and GTP as the deacylated tRNA is released from the ribosome through one or more exit sites. About 2/3 of the mass of the ribosome consists of RNA and 1/3 consists of protein. The proteins are named in accordance with the subunit of the ribosome which they belong to: the small (S1 to S31) and the large (L1 to L44). Usually they decorate the rRNA cores of the subunits. Many ribosomal proteins, particularly those of the large subunit, are composed of a globular, surfa
