identifier: PANTHER:PTHR43246
label: "PEPTIDYL-PROLYL CIS-TRANS ISOMERASE CYP38, CHLOROPLASTIC"
definition: >-
  Cyclophilins exhibit peptidyl-prolyl cis-trans isomerase (PPIase) activity (EC:5.2.1.8), accelerating protein folding by catalysing the cis-trans isomerisation of proline imidic peptide bonds in oligopeptides. They also have protein chaperone-like functions and are the major high-affinity binding proteins for the immunosuppressive drug cyclosporin A (CSA) in vertebrates. Cyclophilins are found in all prokaryotes and eukaryotes, and have been structurally conserved throughout evolution, implying their importance in cellular function. They share a common 109 amino acid cyclophilin-like domain (CLD) and additional domains unique to each member of the family. The CLD domain contains the PPIase activity, while the unique domains are important for selection of protein substrates and subcellular compartmentalisation. This entry includes the cyclophilin-type peptidyl-prolyl cis-trans isomerase mostly found in bacteria, archea and plants, including the E. coli cyclophilin A and Streptomyces antibioticus SanCyp18. Compared to the archetypal cyclophilin human cyclophilin A, these have reduced affinity for cyclosporin A. E. coli cyclophilin A has a similar peptidyl-prolyl cis-trans isomerase activity to the human cyclophilin A. Most members of this subfamily contain a phenylalanine residue at the position equivalent to human cyclophilin W121, where a tryptophan has been shown to be important for cyclophilin binding.
definition_source: "InterPro:IPR044665 abstract (PANTHER PTHR43246 is a member signature)"
