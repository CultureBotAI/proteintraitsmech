identifier: PANTHER:PTHR13131
label: CYSTINOSIN
definition: >-
  Members of this family belong to the cystinosin family and are integral membrane lysosomal proteins and they are thought to transport cystines out of lysosomes. Protein ERS1 has been characterised and encodes a functional homologue of the human lysosomal cystine transporter.
