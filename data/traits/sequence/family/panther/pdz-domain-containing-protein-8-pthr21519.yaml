identifier: PANTHER:PTHR21519
label: "PDZ DOMAIN-CONTAINING PROTEIN 8"
definition: >-
  PDZ domain-containing protein 8 (PDZD8) is a multidomain, membrane-associated protein primarily localised to the endoplasmic reticulum (ER). This protein connects endoplasmic reticulum and mitochondria membranes, and the PDZD8-dependent endoplasmic reticulum-mitochondria membrane tethering is essential for endoplasmic reticulum-mitochondria Ca2+ transfer. PDZD8 utilises distinct domains to interact with Rab7-GTP and the ER transmembrane protein Protrudin and together these components localise to an ER-late endosome membrane contact sites.
