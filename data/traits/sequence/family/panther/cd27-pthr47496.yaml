identifier: PANTHER:PTHR47496
label: CD27
definition: >-
  This family of proteins includes receptors that interact with the CD70/CD27L ligand. Members are involved in the regulation of T-cell survival following activation and may influence apoptotic processes through their association with specific adaptor proteins such as SIVA1. These functions are crucial for the immune response, particularly in the context of T-cell mediated immunity.
