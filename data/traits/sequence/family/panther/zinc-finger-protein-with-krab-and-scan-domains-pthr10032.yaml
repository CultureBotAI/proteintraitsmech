identifier: PANTHER:PTHR10032
label: "ZINC FINGER PROTEIN WITH KRAB AND SCAN DOMAINS"
definition: >-
  Protein ovo from Drosophila melanogaster is required for the survival and differentiation of female germline cells. Ovo plays a role in germline sex determination. It also has a somatic role regulating denticle formation and initiating cytoskeletal remodeling during epidermal differentiation. The different isoforms act antagonistically to each other having transcriptional repressor or activator activity. Ovo-like proteins are members of the zinc finger protein family and serve as transcription factors to regulate gene expression in various differentiation processes. Three different OVOL genes (OVOL1-3) have been identified. Ovo-like 1 in involved in spermatogenesis in mice.
