identifier: PANTHER:PTHR12365
label: SPROUTY
definition: >-
  This family of proteins functions as modulators of cellular signaling pathways, particularly those mediated by fibroblast growth factors (FGFs) and epidermal growth factor receptor (EGFR). Members of this family are known to inhibit FGF-induced differentiation processes, such as retinal lens fiber differentiation, and to suppress various aspects of the MAPK signaling cascade. They play roles in preventing epithelial-to-mesenchymal transition in response to transforming growth factor-beta (TGFB) and can negatively regulate organogenesis and cell growth. Some family members also interfere with integrin-mediated cell spreading and may inhibit ubiquitination processes associated with EGFR.
