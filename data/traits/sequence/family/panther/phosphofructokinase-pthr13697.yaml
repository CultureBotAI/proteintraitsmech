identifier: PANTHER:PTHR13697
label: PHOSPHOFRUCTOKINASE
definition: >-
  PHOSPHOFRUCTOKINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13697. PANTHER protein class: carbohydrate kinase. Members are annotated with the molecular function ATP binding, carbohydrate kinase activity, phosphotransferase activity, alcohol group as acceptor. Members participate in glycolytic process, glucose metabolic process, small molecule catabolic process. Members localise to transferase complex, transferring phosphorus-containing groups, cytoplasm, cytosol.
