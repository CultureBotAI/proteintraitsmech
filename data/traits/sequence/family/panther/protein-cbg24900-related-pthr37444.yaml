identifier: PANTHER:PTHR37444
label: "PROTEIN CBG24900-RELATED"
definition: >-
  This entry represents uncharacterized protein C09G5.7 from Caenorhabditis elegans and similar proteins from nematodes. C09G5.7 is expressed in adult organism and contains multiple disordered regions with compositional bias for basic, acidic, and polar residues. The complete protein shows similarity to other uncharacterised proteins and PHD-type domain-containing worm proteins. The function of this family remains to be determined.
