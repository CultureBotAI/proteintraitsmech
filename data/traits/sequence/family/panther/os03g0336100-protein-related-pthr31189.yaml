  - kind: GENERAL
    text: >-
      This family of proteins primarily serves as seed storage reserves, which are mobilized to provide a source of carbon and nitrogen for the seedling after germination. They accumulate during seed development and are hydrolyzed post-germination. Some members also exhibit additional functionalities, such as lectin-like activity, which may play a role in plant defense by recognizing and binding specific carbohydrate structures, and antimicrobial activity, which provides protection against a range of bacterial and fungal species. A few members are involved in sulfur amino acid provision from seed meals and may have roles in metalloprotease activity or inhibition of enzymes like alpha-amylase.
    source: "InterPro:IPR050253 abstract (LLM-generated, not curator-reviewed)"
