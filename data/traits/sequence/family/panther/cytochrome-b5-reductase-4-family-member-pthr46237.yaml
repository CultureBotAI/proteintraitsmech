    text: >-
      CYTOCHROME B5 REDUCTASE 4 FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46237. PANTHER protein class: reductase, metabolite interconversion enzyme. Members are annotated with the molecular function oxidoreductase activity, acting on NAD(P)H, heme protein as acceptor, heme binding, organic cyclic compound binding. Members localise to intracellular anatomical structure, cytoplasm.
