definitions:
  - kind: GENERAL
    text: >-
      OXIDIZED LOW-DENSITY LIPOPROTEIN RECEPTOR 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47298. Members are annotated with the molecular function cargo receptor activity, low-density lipoprotein particle receptor activity. and participate in lipoprotein metabolic process, nitrogen compound metabolic process, leukocyte cell-cell adhesion. and localise to receptor complex, cell periphery, membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins functions as receptors for oxidatively modified low-density lipoprotein (oxLDL), which is associated with atherosclerosis. They play a role in the internalization and degradation of oxLDL by vascular endothelial cells, leading to pro-inflammatory and pro-oxidative responses, and apoptosis. These proteins are also involved in the activation of NF-kappa-B signaling, reduction of nitric oxide release, monocyte adhesion, and antigen cross-presentation in dendritic cells. Additionally, they serve as receptors for advanced glycation end products, activated platelets, monocytes, apoptotic cells, and bacteria, contributing to the inflammatory process and immune response.
    source: "InterPro:IPR052332 abstract (LLM-generated, not curator-reviewed)"
