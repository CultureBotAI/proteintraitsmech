identifier: PANTHER:PTHR10037
label: "VOLTAGE-GATED CATION CHANNEL  CALCIUM AND SODIUM"
definition: >-
  This entry represents alpha subunits of the voltage-gated sodium channel superfamily. Voltage-dependent calcium channels (VDCC) are a family of molecules that allow cells to couple electrical activity to intracellular calcium signalling. The opening and closing of these channels by depolarizing stimuli allows calcium ions to enter neurons down a steep electrochemical gradient, producing transient intracellular calcium signals. The pore is formed by the alpha-1 subunit which incorporates the conduction pore, the voltage sensor and gating apparatus and the known sites of channel regulation by second messengers, drugs, and toxins. Voltage-dependent sodium channels are transmembrane (TM) proteins are responsible for the depolarising phase of the action potential in most electrically excitable cells. Several structural and functional isoforms are found in mammals, coded for by a multigene family, which leads to different types of sodium ion in excitable tissues. The structure of sodium channels is based on 4 internal repeats of a 6-helix bundle. The basic structural motif (the 6-helix bundle) is also found in potassium and calcium channel alpha subunits.
