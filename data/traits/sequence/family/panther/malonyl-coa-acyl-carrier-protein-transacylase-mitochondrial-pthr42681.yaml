      MALONYL-COA-ACYL CARRIER PROTEIN TRANSACYLASE, MITOCHONDRIAL — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42681. Members are annotated with the molecular function acyltransferase activity, transferring groups other than amino-acyl groups. and participate in organic acid biosynthetic process, fatty acid metabolic process, cellular lipid metabolic process.
