identifier: PANTHER:PTHR11635
label: "CAMP-DEPENDENT PROTEIN KINASE REGULATORY CHAIN"
definition: >-
  cAMP-dependent kinase regulatory subunits play a crucial role in cAMP signaling within cells. They are involved in the regulation of protein kinases (PKA) activity by inhibiting the kinase in the absence of cAMP. Upon binding of cAMP, these regulatory subunits undergo a conformational change that leads to the dissociation of the regulatory subunit dimer from the catalytic subunits, thus activating the kinase. This family is involved in various cellular processes including the regulation of metabolic pathways, cell growth, and proliferation, as well as the rhythmic contraction of muscles and neuronal activity regulation in the brain. This entry also contains cAMP/cGMP-dependent 3',5'-cAMP/cGMP phosphodiesterase B, thought to function as a cAMP-stimulated cAMP-phosphodiesterase which may play a role in regulating the cAMP relay response. Acetyltransferase Pat catalyses the acetylation of the epsilon-amino group of a highly conserved lysine residue in acetyl-CoA synthetase (ACS) and of the universal stress protein (USP) MSMEG_4207. Acetylation results in the inactivation of ACS activity and could be important for mycobacteria to adjust to environmental changes.
definition_source: "InterPro:IPR050503 abstract (PANTHER PTHR11635 is a member signature)"
