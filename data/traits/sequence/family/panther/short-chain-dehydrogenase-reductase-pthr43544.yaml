  - kind: GENERAL
    text: >-
      The Short-chain dehydrogenases/reductases (SDR) family comprises enzymes involved in various biosynthetic pathways for the production of secondary metabolites, including toxins, pigments, and pharmaceutical compounds. Members of the family function as oxidoreductases, catalyzing reactions such as reductions of ketones to alcohols, dehydrations, and stereo-specific reductions. They play roles in the biosynthesis of compounds like pyriculol, pyriculariol, aflatoxins, sterigmatocystin, dothistromin, griseofulvin, and sordarial. These enzymes are characterized by their ability to mediate complex reactions, including ring closures, halogenations, and epoxidations, contributing to the structural diversity of natural products. The SDR family is essential for the formation of bioactive molecules with applications in agriculture, medicine, and industry.
    source: "InterPro:IPR051468 abstract (LLM-generated, not curator-reviewed)"
