identifier: PANTHER:PTHR21052
label: "SPERMATOGENESIS ASSOCIATED 11-RELATED"
definition: >-
  This entry represents a family of eukaryotic proteins that includes ALKBH7 from mammals and the related protein 2OG and iron (Fe(II)) dependent dioxygenase Ofd2 from Schizosaccharomyces pombe. Nine mammalian AlkB homologues exist, ALKBH1-8 and FTO. Differently to other AlkB homologues, AlkB homologue 7 (ALKBH7) does not exhibit any demethylase activity in DNA or RNA and its substrate is still unknown. ALKBH7 is located in the mitochondrial matrix. It is a key protein for programmed necrosis and fat metabolism. After agent-induced DNA-damage, it triggers the collapse of mitochondrial membrane potential and large-scale loss of mitochondrial function that lead to energy depletion and cellular demise.
definition_source: "InterPro:IPR032870 abstract (PANTHER PTHR21052 is a member signature)"
