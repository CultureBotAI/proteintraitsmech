  - kind: GENERAL
    text: >-
      The protein family is part of the tumor necrosis factor superfamily, which includes cytokines involved in a wide range of biological processes such as cell proliferation, differentiation, apoptosis, lipid metabolism, and coagulation. Members of this family are key players in the immune system and inflammatory response. They function as ligands that activate various receptors, including EDAR, EDA2R, TNFRSF13B/TACI, and TNFRSF17/BCMA, influencing cell signaling pathways like NF-kappa-B activation. They are involved in epithelial-mesenchymal signaling during the morphogenesis of ectodermal organs, regulation of tumor cell growth, angiogenesis, endothelial cell proliferation, and the regulation of humoral immunity. Some isoforms may also play roles in cell adhesion and have tumor suppressor activity. The family's involvement extends to the innate immune response and the melanization immune response, as well as the development of thermal allodynia following tissue damage.
    source: "InterPro:IPR051748 abstract (LLM-generated, not curator-reviewed)"
