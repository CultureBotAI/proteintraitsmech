identifier: PANTHER:PTHR15577
label: "ZINC FINGER CONTAINING PROTEIN"
definition: >-
  This family of proteins includes zinc finger matrin-type and zinc finger protein 318. Members of this family are involved in transcriptional regulation, acting as both coactivators and corepressors for androgen receptor (AR)-mediated transactivation. They play a role in spermatogenesis, particularly during meiotic division, suggesting a function in the regulation of gene expression during the development of sperm cells.
