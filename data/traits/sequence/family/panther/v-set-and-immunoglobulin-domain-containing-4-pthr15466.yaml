identifier: PANTHER:PTHR15466
label: "V-SET AND IMMUNOGLOBULIN DOMAIN CONTAINING 4"
definition: >-
  V-set and Ig domain-containing 4 (VSIG4) is a strong negative regulator of T cell proliferation and IL-2 production. It also negatively regulates macrophage activation by activating the PI3K/Akt-STAT3 pathway, leading to pyruvate dehydrogenase kinase-2 (PDK2) upregulation and subsequent phosphorylation of pyruvate dehydrogenase, which results in reduction in pyruvate/acetyl-CoA conversion, reduction in mitochondrial reactive oxygen species secretion, and macrophage inhibition.
