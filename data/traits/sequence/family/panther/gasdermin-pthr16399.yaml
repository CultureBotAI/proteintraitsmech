identifier: PANTHER:PTHR16399
label: GASDERMIN
definition: >-
  The precise function of this protein is unknown. However, it is thought that this entry represents the gasdermin family which plays a role as a secretory or metabolic product involved in the secretory pathway and includes gasdermins A-E (GSDMA-E). A N-terminal fragment released by proteolysis of gasmerdin A binds to lipids and homo-oligomerizes in the membrane forming pores, which may have a bactericidal function. GSDMB (GSDM) may play a role in achieving and maintaining the final differentiation state of epithelial cells. A deletion/insertion mutation in GSDMB (DFNA5) is associated with an autosomal dominant non-syndromic hearing impairment form. Certain gasdermins are cleaved by inflammatory and apoptotic caspases. Gasmedin E is cleaved by caspase-3 and the N-terminal fragment released forms pores in the cell membrane, switching from cell death by apoptosis to pyroptosis.
definition_source: "InterPro:IPR007677 abstract (PANTHER PTHR16399 is a member signature)"
