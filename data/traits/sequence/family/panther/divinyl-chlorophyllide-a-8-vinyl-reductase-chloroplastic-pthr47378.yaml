identifier: PANTHER:PTHR47378
label: "DIVINYL CHLOROPHYLLIDE A 8-VINYL-REDUCTASE, CHLOROPLASTIC"
definition: >-
  This entry represents a group of NAD(P)-binding proteins from plants and bacteria, including divinyl reductase (DVR) from higher plants. DVR converts 8-vinyl groups on various chlorophyll intermediates to ethyl groups, which is indispensable for chlorophyll biosynthesis. Interestingly, DVR proteins from different species have diverse and differing substrate preferences.
