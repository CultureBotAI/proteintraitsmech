identifier: PANTHER:PTHR22625
label: PLEXIN
definition: >-
  Plexins are neuronal receptors for the axon guidance regulators Semaphorins. Semaphorin-plexin interactions play central roles in regulating processes such as neuronal axon guidance, angiogenesis and immune responses. Plexin is activated upon binding of semaphorin to the extracellular region. The GTPase Activating Protein (GAP) domain in the cytoplasmic region mediates intrantracellular signalling. In mammals, nine plexins have been identified, which are grouped into four subfamilies: Plexin-A1-4, Plexin-B1-3, Plexin-C1, and Plexin-D1.
