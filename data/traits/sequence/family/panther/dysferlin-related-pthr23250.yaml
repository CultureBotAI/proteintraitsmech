  - kind: GENERAL
    text: >-
      The Tectonin beta-propeller repeat-containing protein family is involved in a variety of biological processes including autophagy, bacterial recognition, and defense mechanisms. Members of the family act as tethering factors in autophagy, promoting autophagosome maturation and fusion with lysosomes, and are essential for phagophore and preautophagosomal structure biogenesis. Some proteins within the family bind to bacterial lipopolysaccharides and may participate in phagocytosis signaling. Additionally, the family includes pore-forming glycoproteins that can disrupt lipid bilayers, affecting the nervous and digestive systems of mammals, and may also play a role in meiosis and peroxisome biogenesis. The family is characterized by the presence of a PH domain that mediates binding to phosphatidylinositol-3-phosphate, and its members are known to interact with various cellular components such as the ATG5-ATG12 conjugate.
    source: "InterPro:IPR051513 abstract (LLM-generated, not curator-reviewed)"
