identifier: PANTHER:PTHR39468
label: "CHROMOSOME 7, WHOLE GENOME SHOTGUN SEQUENCE"
definition: >-
  This entry represents mitochondrial translation factor 2 (Mtf2) in fungi. Unlike mammalian mitochondrial DNA, yeast mitochondrial genomes contain introns. Specifically, Schizosaccharomyces pombe mitochondrial DNA (mtDNA) contains only three introns: two in the cox1 gene and one in the cob1 gene. The cox1 gene encodes cytochrome c oxidase subunit 1, a crucial component of the mitochondrial electron transport chain. Mtf2 is a translation activation factor that is part of the MRH5C complex. It is essential to ensure proper cytochrome c oxidase expression, as it recruits cox1 mRNA to the mitochondrial ribosome for translation initiation. Interestingly, S. pombe Mtf2 (C5D6.12) shares weak amino acid sequence similarity with its counterpart in Saccharomyces cerevisiae. Additionally, Mtf2 from S. cerevisiae is required for overall mitochondrial protein synthesis, whereas the S. pombe counterpart has a more limited role, as it is required for cox1 gene expression.
definition_source: "InterPro:IPR040009 abstract (PANTHER PTHR39468 is a member signature)"
