identifier: PANTHER:PTHR30537
label: "HTH-TYPE TRANSCRIPTIONAL REGULATOR"
definition: >-
  This family of Lys-type transcriptional regulators includes AmpR from Pseudomonas aeruginosa and similar proteins predominantly found in proteobacteria. AmpR plays a critical role in the expression of beta-lactamase AmpC, acting by positive regulation of the ampC gene. Members of this family are characterised by an N-terminal helix-turn-helix (HTH) motif for DNA binding ( ) and a C-terminal domain. Some members regulate genes involved in amino acid metabolism, such as the tryptophan synthase subunits, and the glycine cleavage system, or control the expression of beta-lactamase genes, which confer antibiotic resistance, and genes related to bacterial adhesion and iron uptake. Some members autoregulate their own expression and may respond to specific inducers or repressors to modulate gene expression dynamically. The LysR family plays a crucial role in bacterial adaptability and pathogenicity by fine-tuning the expression of genes in response to internal and external stimuli.
