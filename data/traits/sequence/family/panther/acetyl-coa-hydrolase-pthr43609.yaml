identifier: PANTHER:PTHR43609
label: "ACETYL-COA HYDROLASE"
definition: >-
  This family contains several enzymes which take part in pathways involving acetyl-CoA. Acetyl-CoA hydrolase from yeast is localized in mitochondria and cytosol and has CoA transferase activity, in particular for CoASH transfer from succinyl-CoA to acetate with minor acetyl-CoA hydrolase activity. It catalyses the formation of acetate from acetyl-CoA. Succinyl-CoA:coenzyme A transferase (CAT1) produces succinyl-CoA, and acetate-CoA transferases utilises acyl-CoA and acetate to form acetyl-CoA.
