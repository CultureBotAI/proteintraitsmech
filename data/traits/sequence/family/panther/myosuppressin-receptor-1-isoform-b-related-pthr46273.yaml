identifier: PANTHER:PTHR46273
label: "MYOSUPPRESSIN RECEPTOR 1, ISOFORM B-RELATED"
definition: >-
  This entry represents the Dmsr-1 (DroMyoSuppressin Receptor related-1) protein, a G-protein coupled receptor that functions as a receptor for FLP-13 neuropeptides in Caenorhabditis elegans. DMSR-1 is activated by neuropeptides with an amidated Arginine-Phenylalanine (RFamide) C terminus motif, particularly FLP-13 peptides. DMSR-1 is expressed in approximately one-tenth of all C. elegans neurons and localises diffusely to neuronal cell membranes. DMSR-1 plays a crucial role in stress-induced sleep (SIS), mediating behavioural quiescence (reduced feeding and body movements) in response to cellular stressors such as heat shock and ultraviolet light exposure. The protein belongs to the RFamide receptor family and is orthologous to Drosophila receptors for the neuropeptides dromyosuppressin and FMRFamide.
