identifier: PANTHER:PTHR42957
label: "HELICASE MJ1565-RELATED"
definition: >-
  This entry includes helicase HerA from archaea and some putative helicases from bacteria. HerA is a DNA helicase able to utilise either 3' or 5' single-stranded DNA extensions for loading and subsequent DNA duplex unwinding. It forms a complex with NurA nuclease, this complex has the 5'-3' DNA end resection activity and is essential for cell viability in the crenarchaeon Sulfolobus islandicus.
