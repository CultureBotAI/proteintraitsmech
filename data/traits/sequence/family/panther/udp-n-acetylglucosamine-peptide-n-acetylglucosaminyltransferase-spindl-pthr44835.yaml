  - kind: GENERAL
    text: >-
      The glycosyltransferase 41 family is characterized by enzymes that modify proteins through the addition of sugar moieties, impacting various biological processes. Members of the O-GlcNAc transferase subfamily, such as SPINDLY, are involved in the gibberellin signaling pathway, affecting plant growth and development. These enzymes catalyze the transfer of N-acetylglucosamine to serine or threonine residues of proteins via O-glycosidic bonds. Some family members also exhibit O-fucosyltransferase activity, influencing protein interactions and stability. Additionally, the family includes enzymes like UDP-glucose:protein N-beta-glucosyltransferase, which transfers glucose to asparagine residues within specific protein motifs. This activity suggests a role in a general protein glycosylation system, with implications for protein function and signaling pathways.
    source: "InterPro:IPR051939 abstract (LLM-generated, not curator-reviewed)"
