  - kind: GENERAL
    text: >-
      The NADPH-dependent pterin aldehyde reductase family is involved in the salvage of pterin aldehydes during folate turnover. Members of this family are capable of reducing a variety of aromatic and aliphatic aldehydes, including acetaldehyde and benzaldehyde, among others. The family is characterized by its ability to convert pterin-6-aldehyde to 6-hydroxymethylpterin, as well as dihydropterin-6-aldehyde to 6-hydroxymethyldihydropterin. However, it is unable to reduce the pterin ring itself. The family is part of the short-chain dehydrogenases/reductases (SDR) superfamily, which is known for its functional diversity in oxidoreductase activity.
    source: "InterPro:IPR053241 abstract (LLM-generated, not curator-reviewed)"
