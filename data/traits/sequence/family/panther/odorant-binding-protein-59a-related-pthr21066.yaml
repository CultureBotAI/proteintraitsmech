identifier: PANTHER:PTHR21066
label: "ODORANT-BINDING PROTEIN 59A-RELATED"
definition: >-
  This family of proteins is found in insects and it is involved in the olfactory system, specifically in the capture and transport of hydrophobic odorant molecules. Members of this family are thought to be present in the fluid surrounding olfactory sensory dendrites, where they play a role in transporting these odorants through the aqueous environment to the olfactory receptors. This process is essential for the perception of smells. Some members, like odorant-binding protein 59a from Drosophila, are also implicated in hygrotaxis behavior, which is the ability to detect and respond to humidity levels.
definition_source: "InterPro:IPR052295 abstract (PANTHER PTHR21066 is a member signature)"
