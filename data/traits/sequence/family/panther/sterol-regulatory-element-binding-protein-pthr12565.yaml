identifier: PANTHER:PTHR12565
label: "STEROL REGULATORY ELEMENT-BINDING PROTEIN"
definition: >-
  This family consists of different transcription factors that have a basic helix-loop-helix and a leucine zipper motif. Many different functions have been identified for these proteins in animals, including the control of cell proliferation and development of specific cell lineages.
