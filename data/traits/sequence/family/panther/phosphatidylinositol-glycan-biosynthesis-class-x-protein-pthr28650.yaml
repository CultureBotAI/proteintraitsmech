identifier: PANTHER:PTHR28650
label: "PHOSPHATIDYLINOSITOL-GLYCAN BIOSYNTHESIS CLASS X PROTEIN"
definition: >-
  PIG-X is an essential component of glycosylphosphatidylinositol-mannosyltransferase I. It probably acts by stabilizing the mannosyltransferase PIG-M. It has also be shown to interact with reticulocalbin 1 (RCN1) and reticulocalbin 2 (RCN2), and may negatively regulate the expression of these two genes.
