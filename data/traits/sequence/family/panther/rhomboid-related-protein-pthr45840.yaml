  - kind: GENERAL
    text: >-
      The Rhomboid-related protein family is characterized by its involvement in regulated intramembrane proteolysis, which facilitates the release of functional polypeptides from their membrane anchors. Members of this family are known to cleave specific substrates, such as EFNB3, and participate in critical signaling pathways, including EGF receptor signaling. Some proteins within this family act as serine proteases with specific roles, such as activating growth factors or transmitting developmental signals. Others may be inactive but still retain similarity to active members. The family plays a role in various biological processes, from embryonic development and dorsoventral axis establishment to neuronal precursor cell fate specification and vulva development.
    source: "InterPro:IPR051739 abstract (LLM-generated, not curator-reviewed)"
