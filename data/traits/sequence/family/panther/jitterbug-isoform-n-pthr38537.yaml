identifier: PANTHER:PTHR38537
label: "JITTERBUG, ISOFORM N"
definition: >-
  Filamin family consists of Filamin-A (FLN-A), Filamin-B (FLN-B) and Filamin-C (FLN-C). They are a group of actin binding proteins that may be involved in actin microfilaments organisation. This entry also includes gelation factor AbpC from Dictyostelium discoideum and protein GAMETE EXPRESSED 2 from Arabidopsis.
