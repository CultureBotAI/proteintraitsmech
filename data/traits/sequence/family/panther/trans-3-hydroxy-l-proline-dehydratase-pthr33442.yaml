identifier: PANTHER:PTHR33442
label: "TRANS-3-HYDROXY-L-PROLINE DEHYDRATASE"
definition: >-
  This family consists of proline racemase (EC:5.1.1.4), 4-hydroxyproline epimerase (EC:5.1.1.8), and trans-L-3-hydroxyproline dehydratase (EC:4.2.1.77). Proline racemase catalyses the interconversion of L- and D-proline in bacteria. Although the mechanisms of aminoacid racemisation and epimerisation are conserved between proline racemase and hydroxyproline epimerase, substrate specificity partly rely on constraints imposed by certain residues distinctively belonging to the catalytic pocket. A human proline racemase-like gene, lacking a specific cysteine residue critical for racemase activity, has been identified as a trans-3-hydroxy-L-proline dehydratase. This family also contains several proteins that remain uncharacterised.
definition_source: "InterPro:IPR008794 abstract (PANTHER PTHR33442 is a member signature)"
