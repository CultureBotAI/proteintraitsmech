identifier: PANTHER:PTHR21016
label: "BETA-AMYLOID BINDING PROTEIN-RELATED"
definition: >-
  This entry represents a group of proteins that contain InterPro:IPR007829, including human TM2 domain-containing protein 1-3 (TM2D1-3). TM2D1, also known as Amyloid-beta-binding protein, may participate in amyloid-beta-induced apoptosis through interactions with beta-APP42. Drosophila member Almondex is involved in the control of cell fates in the neurectoderm and act as positive regulators of the Notch signalling pathway.
