identifier: PANTHER:PTHR46101
label: "Group II amino acid decarboxylase"
definition: >-
  This family of proteins includes enzymes that catalyze the decarboxylation of amino acids. Specifically, members of this family are involved in the biosynthesis of biogenic amines by removing a carboxyl group from their respective amino acid substrates. Some members are known to catalyze the formation of ethanolamine from serine, which is a critical step in the production of important phospholipids like phosphatidylethanolamine (PE) and phosphatidylcholine (PC). These phospholipids are essential for plant growth and membrane formation. Other members of the family are involved in the decarboxylation of histidine, although specific functions for these enzymes are not detailed in the provided annotations. The family belongs to the group II decarboxylase family, indicating a shared evolutionary origin and similar structural features among its members.
