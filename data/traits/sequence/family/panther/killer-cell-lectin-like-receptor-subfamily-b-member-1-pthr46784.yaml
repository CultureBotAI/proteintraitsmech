definitions:
  - kind: GENERAL
    text: >-
      KILLER CELL LECTIN-LIKE RECEPTOR SUBFAMILY B MEMBER 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46784. PANTHER protein class: transmembrane signal receptor. Members are annotated with the molecular function signaling receptor activity. and participate in regulation of natural killer cell mediated immunity, regulation of response to biotic stimulus, regulation of leukocyte mediated cytotoxicity. and localise to cell surface, cell periphery, membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that are primarily involved in the regulation of natural killer (NK) cell cytotoxicity. Members of this family can either stimulate or inhibit NK cell activity. Some proteins in this family contain an immunoreceptor tyrosine-based inhibitor motif (ITIM), which, upon phosphorylation, can bind SH2 domain-containing phosphatases, leading to the down-regulation of cell activation. Other family members are involved in the activation of NK cells or in the costimulation of T-cell proliferation and IL-2 production in response to antigen stimulation. These proteins may also play a role in 'missing-self' recognition, a process by which cells that do not express normal levels of major histocompatibility complex (MHC) molecules are targeted for attack by NK cells. Ligand binding to these receptors can also contribute to the formation of the immunological synapse between T-cells and antigen-presenting cells.
    source: "InterPro:IPR051527 abstract (LLM-generated, not curator-reviewed)"
