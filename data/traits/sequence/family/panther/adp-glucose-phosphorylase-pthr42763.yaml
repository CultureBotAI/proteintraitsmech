  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in carbohydrate metabolism, specifically in the synthesis of sugar nucleotides. Members of this family are responsible for catalyzing the formation of glucose-1-phosphate from ADP-glucose, releasing ADP in the process. This reaction is a key step in the biosynthesis of glycogen and starch, serving as a glucose donor for the polymerization reactions. The enzymatic activity is crucial for energy storage in various organisms, as it regulates the conversion of glucose for storage as a complex carbohydrate. Despite sharing a name with galactose-1-phosphate uridylyltransferase, these proteins do not exhibit that specific enzymatic function.
    source: "InterPro:IPR053177 abstract (LLM-generated, not curator-reviewed)"
