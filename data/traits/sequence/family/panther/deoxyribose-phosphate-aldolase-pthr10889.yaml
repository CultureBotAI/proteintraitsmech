identifier: PANTHER:PTHR10889
label: "DEOXYRIBOSE-PHOSPHATE ALDOLASE"
definition: >-
  Aldolases play important roles in essential metabolic pathways, such as gluconeogenesis and glycolysis. They are classified with respect to their catalytic mechanism into two classes: class I adolases are are characterised by formation of covalent Schiff base intermediates, while class II aldolases are metallodependent enzymes and use a divalent transition metal ion to polarize the substrate ketose. Deoxyribose-phosphate aldolase (DERA) belongs to the class I aldolases. It is a widely distributed enzyme, which catalyses the following reversible reaction: 2-deoxy-D-ribose 5-phosphate = D-glyceraldehyde 3-phosphate + acetaldehyde While the physiological role of this enzyme remains unknown in eukaryotes, in prokaryotes it is thought to function in the catabolism of deoxyribonucleotides. In all studied structures, the deoxyribose-phosphate aldolase subunits adopt the classical eight-bladed TIM barrel fold. The oligomerization state of the enzyme appears to depend on the living temperature of the organism - the Escherichia coli enzyme (UniProtKB:P0A6L0) is a homodimer, while the enzymes from the thermophilic microorganisms Thermus thermophilus and Aeropyrum pernix (UniProtKB:Q9Y948) are homotetramers. The degree of oligomerization does not, however, appear to affect catalysis. Deoxyribose-phosphate aldolase is unique in catalysing the aldol reaction between two aldehydes, and its broad substrate specificity confers considerable utility as a biocatalyst, offering an environmentally benign alternative to chiral transition metal catalysis of the asymmetric aldol reaction. This entry also includes divergent deoxyribose-phosphate aldolase-like protein (DPA) from Toxoplasma gondii which is involved in regulation of actin dynamics. This protein has likely diverged to the point of l
