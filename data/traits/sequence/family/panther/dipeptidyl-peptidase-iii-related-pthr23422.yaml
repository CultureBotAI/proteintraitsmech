identifier: PANTHER:PTHR23422
label: "DIPEPTIDYL PEPTIDASE III-RELATED"
definition: >-
  Peptidase family M49 contains exopeptidases that remove dipeptides from the N terminus of peptides and proteins and are known as dipeptidyl-peptidases (DPP). The best characterised of these is dipeptidyl-peptidase III and represents the prototype for the M49 family of metallopeptidases. It consists of two domains that form a wide cleft containing the catalytic metal ion (DPPIII; EC:3.4.14.4; MEROPS identifier M49.001). The exopeptidases in M49 are metal-dependent, and bind a single zinc ion via the histidines in an HEXXXH motif, in which the distance between the histidines in one residue longer than in the HEXXH zinc-binding motif found in endopeptidases of clan MA. The importance of the histidines and the glutamic acid was identified by site-directed mutagenesis. Some members of family M49, notably from bacteria such as Colwelia and plants possess the more usual HEXXH motif. A third zinc ligand occurs within a motif that has been described as EECRAE. DPPIII releases N-terminal dipeptides sequentially from peptides such as angiotensins II and III, Leu-enkephalin, prolactin and alpha-melanocyte-stimulating hormone, but tripeptides are poor substrates and polypeptides of more than ten residues are not cleaved. DPPIII is a soluble, cytosolic enzyme with a housekeeping role, but is elevated in retroplacental serum may participate in the increased angiotensin hydrolysis seen during pregnancy. This family also includes Nudix hydrolase 3 (NUDT3) from plants, which is thought to hydrolyse nucleoside diphosphate derivatives because of the presence of a Nudix box. Isopentenyl diphosphate (IPP), a universal precursor for the biosynthesis of isoprenoid compounds, is hydrolysed; purine nucleotides such as 8-oxo-dATP are dephosphorylated; and the enzyme acts as a dipeptidyl-peptidase
