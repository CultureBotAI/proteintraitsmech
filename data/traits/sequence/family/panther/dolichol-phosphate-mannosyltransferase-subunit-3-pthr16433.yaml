identifier: PANTHER:PTHR16433
label: "DOLICHOL-PHOSPHATE MANNOSYLTRANSFERASE SUBUNIT 3"
definition: >-
  This family corresponds to subunit 3 of dolichol-phosphate mannosyltransferase, an enzyme which generates mannosyl donors for glycosylphosphatidylinositols, N-glycan and protein O- and C-mannosylation. DPM3 is an integral membrane protein and plays a role in stabilising the dolichol-phosphate mannosyl transferase complex.
