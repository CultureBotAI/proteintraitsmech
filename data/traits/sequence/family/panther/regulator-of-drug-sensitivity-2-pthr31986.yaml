  - kind: GENERAL
    text: >-
      This family of proteins includes zinc cluster transcription factors that are involved in the regulation of various metabolic processes. Members of this family are known to govern gene expression related to iron acquisition, both through reductive and siderophore-mediated pathways, which are crucial for organismal virulence. Additionally, these proteins regulate carbon metabolism by influencing genes associated with gluconeogenesis, the tricarboxylic acid (TCA) cycle, and glucose metabolism. Some family members also play a role in cellular processes such as cell wall remodeling and the development of drug resistance.
