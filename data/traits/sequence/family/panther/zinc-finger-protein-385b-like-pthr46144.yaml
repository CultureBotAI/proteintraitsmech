  - kind: GENERAL
    text: >-
      The Zinc finger protein 346 family is characterized by the presence of zinc-finger domains essential for binding to double-stranded RNA (dsRNA) and for nuclear localization. Members of this family show a preference for binding to dsRNA, although they can also interact with RNA-DNA hybrids. Some members have been reported to bind with low affinity to double-stranded DNA (dsDNA) and single-stranded RNA (ssRNA), and with high affinity to dsRNA without detectable sequence specificity. Additionally, certain members may have the ability to bind to specific microRNA (miRNA) hairpins. The functions of the Zinc finger matrin-type protein 4 within this family are not described in the provided information.
