  - kind: GENERAL
    text: >-
      This family of proteins is involved in diverse biological processes including cyanogenesis, which is the release of hydrogen cyanide (HCN) from injured tissues. Members of this family catalyze the stereospecific addition of HCN to various aldehydes. Some proteins within this family are major seed constituents and may serve as a storage form for reduced nitrogen. Others are implicated in the production of pigments or in the regulation of developmental processes such as post-genital organ fusion in flowers. Despite the varied functions, all members share a common feature of belonging to the GMC oxidoreductase family, suggesting a general role in redox reactions involving substrates like aldehydes.
    source: "InterPro:IPR051871 abstract (LLM-generated, not curator-reviewed)"
