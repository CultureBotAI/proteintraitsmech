      MYELIN-ASSOCIATED OLIGODENDROCYTIC BASIC PROTEIN MOBP -RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14555. PANTHER protein class: myelin protein, structural protein. Members are annotated with the molecular function actin binding, myosin binding. Members localise to cortical actin cytoskeleton, cell cortex.
