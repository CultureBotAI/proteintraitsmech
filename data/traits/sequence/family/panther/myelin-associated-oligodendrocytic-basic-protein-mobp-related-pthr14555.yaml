  - kind: GENERAL
    text: >-
      MYELIN-ASSOCIATED OLIGODENDROCYTIC BASIC PROTEIN MOBP -RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14555. PANTHER protein class: myelin protein, structural protein. Members are annotated with the molecular function cytoskeletal protein binding, protein binding, myosin binding. Members localise to intracellular non-membrane-bounded organelle, cortical actin cytoskeleton, cell cortex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes effectors involved in intracellular transport processes, particularly in the trafficking and stabilization of cellular components. Members of this family function as linkers that connect vesicles or organelles to motor proteins, facilitating their movement along cytoskeletal elements. Some proteins in this family are known to interact with Rab GTPases, which are critical regulators of vesicle trafficking. They may also participate in the anchoring of protein kinase A, serving as scaffolding proteins that bring together enzymes and substrates for efficient signal transduction. Additionally, certain members are implicated in the compaction and stabilization of the myelin sheath in oligodendrocytes by interacting with phospholipids in the cytoplasmic membrane.
    source: "InterPro:IPR051745 abstract (LLM-generated, not curator-reviewed)"
