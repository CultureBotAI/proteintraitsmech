identifier: PANTHER:PTHR46459
label: "E1A-BINDING PROTEIN P400-RELATED"
definition: >-
  E1A-binding protein p400 is a component of the NuA4 histone acetyltransferase complex and a SWR1-like complex that removes histone H2A.Z/H2AFZ from the nucleosome. This component is known as chromatin modification-related protein Eaf1 in budding yeasts and Vid21 in fission yeasts. The NuA4 histone acetyltransferase complex (also known as the TRRAP/TIP60-containing histone acetyltransferase complex) acetylates nucleosomal histones H4 and H2A thereby activating selected genes for transcription and is a a key regulator of transcription, cellular response to DNA damage and cell cycle control. In yeast, where the complex was first identified, NuA4 consists of at least ACT1, ARP4, YAF9, VID21, SWC4, EAF3, EAF5, EAF6, EAF7, EPL1, ESA1, TRA1 and YNG2. In humans, the complex is composed of the histone acetyltransferase KAT5 (also known as TIP60) plus the subunits EP400, TRRAP/PAF400, BRD8/SMAP, EPC1, MAP1/DNMAP1, RUVBL1/TIP49, RUVBL2, ING3, actin, ACTL6A/BAF53A, MORF4L1/MRG15, MORF4L2/MRGX, MRGBP, YEATS4/GAS41, VPS72/YL1 and MEAF6.
