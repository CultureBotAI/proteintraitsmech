identifier: PANTHER:PTHR36358
label: "SUCCINATE DEHYDROGENASE SUBUNIT 4, MITOCHONDRIAL"
definition: >-
  Complex II [succinate dehydrogenase (succinate-ubiquinone oxidoreductase); SDH] is the only enzyme shared by both the electron transport chain and the tricarboxylic acid (TCA) cycle in mitochondria. SDH is a heterotetrameric protein complex, anchored to the inner mitochondrial membrane by two integral membrane proteins, SDH3 and SDH4. The SDH3/SDH4 dimer binds to subunit SDH2, which contains three iron-sulfur (Fe-S) clusters and is assembled with the catalytic subunit SDH1. These membrane proteins (SDH1-4) are structurally and evolutionarily related, and include three membrane-spanning helices each, forming a conserved six-helix bundle that binds a heme group. This entry represents succinate dehydrogenase 4 (SDH4) from plants.
definition_source: "InterPro:IPR044963 abstract (PANTHER PTHR36358 is a member signature)"
