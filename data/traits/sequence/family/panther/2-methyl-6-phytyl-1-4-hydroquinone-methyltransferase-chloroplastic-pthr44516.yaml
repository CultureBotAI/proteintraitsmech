identifier: PANTHER:PTHR44516
label: "2-METHYL-6-PHYTYL-1,4-HYDROQUINONE METHYLTRANSFERASE, CHLOROPLASTIC"
definition: >-
  This entry represents a subgroup of the SAM-binding methyltransferase family, including VTE3 (At3g63410) from Arabidopsis. VTE3 catalyses the conversion of 2-methyl-6-phytyl-1,4-hydroquinone (MPBQ) to 2,3-dimethyl-6-phytyl-1,4-hydroquinone (DMPQ, a substrate for tocopherol cyclase), and 2-methyl-6-solanyl-1,4-benzoquinone (MSBQ) to plastoquinone. This entry also includes uncharacterised proteins from bacteria and archaea. Methyl transfer from the ubiquitous S-adenosyl-L-methionine (SAM) to either nitrogen, oxygen or carbon atoms is frequently employed in diverse organisms ranging from bacteria to plants and mammals. The reaction is catalysed by methyltransferases (Mtases) and modifies DNA, RNA, proteins and small molecules, such as catechol for regulatory purposes. The various aspects of the role of DNA methylation in prokaryotic restriction-modification systems and in a number of cellular processes in eukaryotes including gene regulation and differentiation is well documented.
definition_source: "InterPro:IPR044649 abstract (PANTHER PTHR44516 is a member signature)"
