identifier: PANTHER:PTHR24264
label: TRYPSIN-RELATED
definition: >-
  The peptidase S1 family, also known as the serine protease family, encompasses a diverse group of enzymes that share a common mechanism of proteolysis involving a serine residue in their active site. Members of this family are involved in a wide range of biological processes, including digestion, blood coagulation, fibrinolysis, immune response regulation, and cell migration. Notably, a subfamily within this group includes snake venom serine proteases, which often act in the hemostasis system of their prey, affecting blood coagulation and fibrinolysis. These enzymes typically cleave peptide bonds following arginine or lysine residues and are regulated by various inhibitors. Some members are also involved in the activation of other proteins, such as zymogens or factors in the coagulation cascade, and may have roles in tumor suppression, cell proliferation, and development.
