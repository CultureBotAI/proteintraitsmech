identifier: PANTHER:PTHR31348
label: "EID1-LIKE F-BOX PROTEIN 2-RELATED"
definition: >-
  This entry includes a group of plant F-box proteins, including EID1 and EDL1/2/3 from Arabidopsis. EID1 is part of the SCF (ASK-cullin-F-box) E3 ubiquitin ligase complex. It functions as a negative regulator in far-red light signaling downstream of the phyA in Arabidopsis. The allelic variation of the tomato homologue of the Arabidopsis EID1 has been linked to slower circadian rhythms. EID1-like protein 3 (EDL3) is involved in the regulation of abscisic acid signalling.
definition_source: "InterPro:IPR040267 abstract (PANTHER PTHR31348 is a member signature)"
