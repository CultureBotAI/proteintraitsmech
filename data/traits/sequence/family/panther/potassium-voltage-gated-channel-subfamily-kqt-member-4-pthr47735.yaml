identifier: PANTHER:PTHR47735
label: "POTASSIUM VOLTAGE-GATED CHANNEL SUBFAMILY KQT MEMBER 4"
definition: >-
  KCNQ channels (also known as KQT-like channels) differ from other voltage-gated 6 TM helix channels, chiefly in that they possess no tetramerisation domain. Consequently, they rely on interaction with accessory subunits, or form heterotetramers with other members of the family. Currently, 5 members of the KCNQ family are known. These have been found to be widely distributed within the body, having been shown to be expressed in the heart, brain, pancreas, lung, placenta and ear. They were initially cloned as a result of a search for proteins involved in cardiac arhythmia. Subsequently, mutations in other KCNQ family members have been shown to be responsible for some forms of hereditary deafness and benign familial neonatal epilepsy.
definition_source: "InterPro:IPR003937 abstract (PANTHER PTHR47735 is a member signature)"
