  - kind: GENERAL
    text: >-
      This family of proteins includes DNA-binding transposases and methyltransferases. Members of this family are involved in various DNA-related processes such as DNA double-strand break repair, stalled replication fork restart, and DNA integration. They exhibit a sequence-specific DNA-binding activity, recognizing specific DNA sequences to mediate DNA nicking and end joining. Additionally, they possess histone methyltransferase activity, targeting specific lysine residues on histone H3, which plays a role in the regulation of DNA repair and replication. Some members have evolved from transposases and have retained nuclease activity, although they have lost the ability to catalyze transposition due to active site mutations.
    source: "InterPro:IPR052709 abstract (LLM-generated, not curator-reviewed)"
