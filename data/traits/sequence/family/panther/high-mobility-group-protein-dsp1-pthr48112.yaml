  - kind: GENERAL
    text: >-
      The HMGB family proteins are multifunctional and redox-sensitive, with roles in various cellular compartments. In the nucleus, they act as DNA chaperones involved in replication, transcription, chromatin remodeling, V(D)J recombination, DNA repair, and genome stability. They preferentially bind to non-canonical DNA structures and can bend DNA to enhance flexibility and promote gene promoter activities. In the cytoplasm, they function as sensors or chaperones for immunogenic nucleic acids, mediating autophagy and activating TLR9-mediated immune responses. As danger-associated molecular pattern (DAMP) molecules, they amplify immune responses during tissue injury. Extracellularly, they bind to DNA, nucleosomes, and other molecules, activating cells through multiple surface receptors. Depending on their redox state, they can act as chemokines, cytokines, or induce immunological tolerance. They are also implicated in angiogenesis, platelet activation, neuronal outgrowth, and may influence the accumulation of polyglutamine proteins.
