  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of phomopsins, which are hexapeptide mycotoxins known to cause lupinosis in livestock. These proteins operate within a gene cluster, orchestrating a series of post-translational modifications (PTMs) to produce and modify the core hexapeptide derived from a precursor. The modifications include cyclization, chlorination, hydroxylation, and the introduction of dehydroamino acids, contributing to the unique structure of phomopsin A. Additionally, some members are implicated in the construction of a macrocyclic structure and in the methylation steps that convert precursors to the mature mycotoxin forms. The precise roles of individual proteins within this family in the biosynthetic pathway are yet to be fully elucidated, as is the order of PTM events.
    source: "InterPro:IPR053008 abstract (LLM-generated, not curator-reviewed)"
