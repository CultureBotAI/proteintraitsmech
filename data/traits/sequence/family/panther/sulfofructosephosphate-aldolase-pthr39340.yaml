identifier: PANTHER:PTHR39340
label: "SULFOFRUCTOSEPHOSPHATE ALDOLASE"
definition: >-
  The LacD aldolase family consists of enzymes that catalyze the cleavage and formation of specific sugar phosphates. Members of this family are known to function as tagatose 1,6-diphosphate aldolases, which are involved in carbohydrate metabolism, particularly in the Leloir pathway for galactose catabolism. Some members, identified as sulfofructosephosphate aldolases, specifically cleave 6-deoxy-6-sulfo-D-fructose 1-phosphate (SFP) to produce dihydroxyacetone phosphate (DHAP) and 3-sulfolactaldehyde (SLA). These enzymes can also catalyze the reverse reaction, demonstrating their role in both the breakdown and synthesis of sugar phosphates. The LacD aldolase family is characterized by its ability to perform these reactions, which are essential for the utilization and conversion of various sugars within bacterial metabolic pathways.
