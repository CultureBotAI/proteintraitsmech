identifier: PANTHER:PTHR33312
label: "MEMBRANE-ASSOCIATED KINASE REGULATOR 4-RELATED"
definition: >-
  This entry represents a group of plant proteins, including BKI1 and MAKR1/3/4 from Arabidopsis. BKI1 interacts with BRI1, a leucine-rich repeat receptor serine/threonine kinase, and prevents the activation of BRI1. MAKRs belong to the MEMBRANE-ASSOCIATED KINASE REGULATOR (MAKR) family, whose members contain putative kinase interacting motifs and membrane localization signals.
