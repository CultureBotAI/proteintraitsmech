identifier: PANTHER:PTHR19861
label: "WD40 REPEAT PROTEIN SWD2"
definition: >-
  This entry includes Swd2 from yeasts and WDR82 from animals. They are part of the Set1/COMPASS complex. Besides being part of the Set1/COMPASS complex, Swd2 is also a component of the cleavage and polyadenylation factor (CPF) complex and its subcomplex APT. The COMPASS (Complex Proteins Associated with Set1 or Set1C) is the yeast homologue of the human MLL complex, which is required for mono-, di-, and trimethylation of lysine 4 of histone H3. It is required in telomeric transcriptional silencing. The complex consists of Set1, Bre2, Spp1, Sdc1, Shg1, Swd1, Swd2, and Swd3.
