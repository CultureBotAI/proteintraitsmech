definition: >-
  MEDIUM-CHAIN SPECIFIC ACYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48083. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on the CH-CH group of donors, oxidoreductase activity, catalytic activity. Members participate in lipid oxidation, lipid catabolic process, monocarboxylic acid metabolic process. Members localise to cytoplasm.
