identifier: PANTHER:PTHR46874
label: "TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 6"
definition: >-
  TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 6 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46874. PANTHER protein class: transmembrane signal receptor. Members are annotated with the molecular function death receptor activity. Members participate in positive regulation of endopeptidase activity, negative regulation of apoptotic process, regulation of MAPK cascade. Members localise to membrane raft, external side of plasma membrane, plasma membrane protein complex.
