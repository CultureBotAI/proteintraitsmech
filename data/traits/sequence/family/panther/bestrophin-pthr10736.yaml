identifier: PANTHER:PTHR10736
label: BESTROPHIN
definition: >-
  This entry represents the Bestrophin family that includes four paralogous genes in mammals (BEST1, BEST2, BEST3, BEST4) encoding integral membrane calcium (Ca2+)-activated chloride (Cl-) channels. In humans, they are widely distributed in various organs including the airways, colon, kidney, pancreas and central nervous system, but best known for their physiological roles in the eye. In particular, BEST1 that is genetically linked to a spectrum of retinal degenerative disorders collectively known as bestrophinopathies Bestrophin is a 68kDa basolateral plasma membrane protein expressed in retinal pigment epithelial cells (RPE). It is encoded by the VMD2 gene, which is mutated in Best macular dystrophy, a disease characterised by a depressed light peak in the electrooculogram. VMD2 encodes a 585-amino acid protein with an approximate mass of 68kDa which has been designated bestrophin. Bestrophin shares homology with the Caenorhabditis elegans RFP gene family, named for the presence of a conserved arginine (R), phenylalanine (F), proline (P), amino acid sequence motif. Bestrophin is a plasma membrane protein, localised to the basolateral surface of RPE cells consistent with a role for bestrophin in the generation or regulation of the EOG light peak. Bestrophin and other RFP family members represent a new class of calcium-activated chloride channels (CaCC), indicating a direct role for bestrophin in generating the light peak. Bestrophins are also permeable to other monovalent anions including bicarbonate, bromine, iodine, thiocyanate an nitrate. Structural analysis revealed that N-terminal region of the proteins is highly conserved and sufficient for its CaCC activity. The C-terminal region has low sequence identity. The VMD2 gene underlying Best disease was shown to represe
