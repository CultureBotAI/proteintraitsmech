    text: >-
      POTASSIUM TRANSPORT PROTEIN DDB_G0292412-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31064. Members are annotated with the molecular function transporter activity, monoatomic cation transmembrane transporter activity, monoatomic ion transmembrane transporter activity. Members localise to cell periphery, membrane, plasma membrane.
