      POTASSIUM TRANSPORT PROTEIN DDB_G0292412-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31064. Members are annotated with the molecular function monoatomic cation transmembrane transporter activity. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The TrkH potassium transport family is involved in the regulation of potassium-sodium homeostasis and the maintenance of the proper sodium/potassium ratio in cells. Members of this family function primarily as potassium transporters, with some also mediating sodium transport. They are characterized by having pore-forming regions that resemble potassium channel selectivity filter motifs. These transporters play critical roles in various physiological processes, including high-affinity potassium uptake, low-affinity potassium transport, sodium exclusion under salt stress, and candidacidal activities. Some members are also implicated in the efflux of chloride ions and other anions, contributing to cellular ion balance and adaptation to environmental stresses.
    source: "InterPro:IPR051143 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
