identifier: PANTHER:PTHR43366
label: "PYRUVATE SYNTHASE SUBUNIT PORC"
definition: >-
  This family of proteins includes subunits of pyruvate and ketoisovalerate oxidoreductases, which are key enzymes in the central metabolism of various microorganisms. These enzymes catalyze the oxidative decarboxylation of pyruvate and ketoisovalerate to acetyl-CoA and isobutyryl-CoA, respectively, which are important intermediates in the energy metabolism and biosynthesis of cellular components. The common subunit gamma is likely involved in the electron transfer process within the enzyme complex. One member of this family is also known to function in the anaerobic metabolism of phenylalanine and phenylacetate, catalyzing the oxidative decarboxylation of phenylglyoxylate to benzoyl-CoA, and can utilize various electron acceptors, indicating a potential for diverse metabolic roles.
