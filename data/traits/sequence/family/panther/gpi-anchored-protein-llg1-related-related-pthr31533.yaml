identifier: PANTHER:PTHR31533
label: "GPI-ANCHORED PROTEIN LLG1-RELATED-RELATED"
definition: >-
  This entry represents a group of plant proteins, including LORELEI (LRE) and LORELEI-like proteins (LLG1, LLG2 and LLG3) from Arabidopsis. LORELEI is a female gametophyte-specific component of the signalling pathway required for fertilization. LLG1/LRE act as a chaperone and co-receptor for receptor kinase FERONIA, which is a multifunctional regulator for plant growth and reproduction.
