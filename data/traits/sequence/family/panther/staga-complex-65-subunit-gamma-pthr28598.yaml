identifier: PANTHER:PTHR28598
label: "STAGA COMPLEX 65 SUBUNIT GAMMA"
definition: >-
  This protein family includes mammal STAGA complex 65 subunit gamma (SUPT7L) and fly SAGA complex subunit Spt7. These proteins different SAGA complexes from different animal organisms. SUPT7L is a component of the structural core of the STAGA transcription coactivator-histone acetyltransferase (HAT) complex (mammal SAGA), which is composed of at least SUPT3H, SUPT7L, GCN5L2, TAF5L, TAF6L, TADA3L, TAD1L, TAF10, TAF12 and TAF9. This complex, the TAF8-TAF10 histone fold (HF)-containing protein complex and the SMAT complex are important regulators of the composition of different TFIID and/or STAGA/TFTC complexes in the nucleus and consequently may play a role in gene regulation. Spt7 is a component of the transcription regulatory complex dSAGA (Drosophila SAGA), which predominantly acetylates histone H3.
definition_source: "InterPro:IPR039460 abstract (PANTHER PTHR28598 is a member signature)"
