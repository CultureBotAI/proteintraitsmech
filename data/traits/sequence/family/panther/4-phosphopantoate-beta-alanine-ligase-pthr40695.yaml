identifier: PANTHER:PTHR40695
label: "4-PHOSPHOPANTOATE--BETA-ALANINE LIGASE"
definition: >-
  Proteins in this family include pantothenate synthetase (EC:6.3.2.n5) from Methanosarcina mazei and 4-phosphopantoate--beta-alanine ligase, also known as phosphopantothenate synthetase, (EC:6.3.2.36) from Pyrococcus kodakaraensis. Pantothenate synthetase catalyses the condensation of pantoate with beta-alanine in an ATP-dependent and ADP-producing reaction. 4-phosphopantoate--beta-alanine ligase catalyses the conversion of (R)-4-phosphopantoate and beta-alanine to 4'-phosphopantothenate in the CoA biosynthesis pathway. It cannot use (R)-pantoate as substrate and thus does not display pantothenate synthetase (PS) activity.
definition_source: "InterPro:IPR002855 abstract (PANTHER PTHR40695 is a member signature)"
