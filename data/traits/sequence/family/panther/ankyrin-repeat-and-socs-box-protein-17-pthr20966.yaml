identifier: PANTHER:PTHR20966
label: "ANKYRIN REPEAT AND SOCS BOX PROTEIN 17"
definition: >-
  ASB17 (ankyrin repeat and SOCS box protein 17) is expressed in testis and may play essential roles in testis development and spermatogenesis. Homologues contain an ankyrin repeat and a SOCS box domain, and are found only in metazoa.
