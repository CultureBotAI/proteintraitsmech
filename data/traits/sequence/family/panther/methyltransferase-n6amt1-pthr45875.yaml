identifier: PANTHER:PTHR45875
label: "METHYLTRANSFERASE N6AMT1"
definition: >-
  The PrmC-related methyltransferase family is composed of enzymes that primarily function as methyltransferases using S-adenosyl-L-methionine as the methyl donor. Members of the family are known to methylate proteins, including the methylation of 'Lys-12' of histone H4 and 'Gln' residues within specific motifs of target proteins. The methylation of histone H4 is linked to the regulation of cell cycle genes. Some family members form heterodimers with TRMT112 to carry out their function. Additionally, there is evidence suggesting a role in the detoxification of arsenic, although this is a secondary function compared to other arsenic-metabolizing enzymes. The family is characterized by its presence in both eukaryotic and archaeal organisms, indicating a conserved mechanism across diverse life forms.
