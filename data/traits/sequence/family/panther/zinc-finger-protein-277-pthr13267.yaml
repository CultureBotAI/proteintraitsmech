identifier: PANTHER:PTHR13267
label: "ZINC FINGER PROTEIN 277"
definition: >-
  This entry includes the uncharacterised zinc finger proteins, including ZNF277 from human and C19B12.07c from the fission yeast Schizosaccharomyces pombe. ZNF277 contains a C2H2-type 1 and a C2H2-type 2 zinc finger whereas C19B12.07c contains a single C2H2-type zinc finger.
