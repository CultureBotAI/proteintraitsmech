identifier: PANTHER:PTHR21419
label: "Protein FAM234"
definition: >-
  This entry includes FAM234A/B from animals and Protein DEFECTIVE IN EXINE FORMATION 1 (DEX1) from Arabidopsis. The function of FAM234A/B is not clear. DEX1 is required for exine pattern formation during pollen development. Rice DEX1 is a Ca2+ binding protein involved in regulating rice tapetal cell degradation and pollen formation.
