identifier: PANTHER:PTHR13259
label: "BLADDER CANCER 10 KD PROTEIN HOMOLOG"
definition: >-
  This family consists of a series of short proteins of around 90 residues in length which includes Apoptosis inducing factor BLCAP from human ( UniProtKB:O60629 ), also known as BC10. BCALP acts as a tumor suppressor; it induces growth arrest at G1/S checkpoint and apoptosis via RB1-dependent and p53/TP53- and NF-kappa-B-independent mechanisms. It has been implicated in bladder cancer where the transcription of the gene coding for this protein is nearly completely abolished in highly invasive transitional cell carcinomas (TCCs). The protein is a small globular protein containing two transmembrane helices, and it is a multiply edited transcript. All the editing sites are found in either the 5'-UTR or the N-terminal section of the protein, which is predicted to be outside the membrane. The three coding edits are all non-synonymous and predicted to encode exposed residues.
