  - kind: GENERAL
    text: >-
      This family of proteins includes sensor histidine kinases that are part of two-component regulatory systems, which are involved in various cellular responses to environmental stimuli. These proteins typically function as membrane-associated protein kinases that undergo autophosphorylation and subsequently transfer the phosphate to a response regulator, modulating its activity. They play key roles in processes such as osmoregulation, virulence, alginate biosynthesis, glucose metabolism, cell envelope stability, oxygen sensing, and nitrogen level control. The proteins contain several domains, including a cytoplasmic domain, transmembrane helices, a periplasmic domain, a HAMP domain, and a histidine kinase domain. The activity of these kinases is often regulated by environmental signals, interaction with other proteins, or small molecules, and they may also function as phosphatases to dephosphorylate their response regulators.
    source: "InterPro:IPR050980 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
