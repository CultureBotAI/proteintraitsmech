identifier: PANTHER:PTHR13256
label: "N-ACETYLTRANSFERASE 9"
definition: >-
  This entry includes acetyltransferases such as N-acetyltransferase 9 (NAT9). The NAT9 gene is an important reproduction related gene and is associated with psoriatic arthritis and possibly with Crohn's disease. NAT9 contains a GNAT domain and mediates the acetylation of the N-terminal residues of alpha- and beta-tubulin. It is required for microtubule stability and regulation of JNK signalling to promote cell survival during developmental stages.
