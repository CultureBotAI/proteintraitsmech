  - kind: GENERAL
    text: >-
      This family of proteins includes various C-type lectin domain-containing proteins, which are primarily involved in immune system processes. Members of this family function as cell surface receptors that can bind to specific carbohydrate structures. They are involved in a range of biological processes including lymphocyte proliferation, signal transduction, modulation of T-cell expansion, immune recognition, and inhibition of osteoclast formation. Some members have a role in antigen capture and presentation, potentially influencing dendritic cell function and interferon expression. Additionally, this family includes matrix proteins from sea urchin embryos that direct and inhibit crystal growth during spicule formation. There are also viral proteins that down-regulate MHC-I expression, participate in viral hemadsorption, and inhibit apoptosis. Collectively, these proteins contribute to immune defense, bone homeostasis, and developmental processes.
