identifier: PANTHER:PTHR47432
label: "CELL WALL ASSEMBLY REGULATOR SMI1"
definition: >-
  This family of proteins is involved in the regulation of cell wall assembly, particularly in the synthesis of 1,3-beta-glucan, which is a key component of the cell wall in various fungi. Members of this family may play a role in the transcriptional regulation of enzymes responsible for glucan and chitin synthesis, which are crucial for maintaining cell wall integrity and structure. Some proteins in this family are also implicated in the cellular response to nitrogen starvation and may influence the transition between different phases of the cell cycle, particularly the transition from quiescence to the G1 phase.
