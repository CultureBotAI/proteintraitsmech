identifier: PANTHER:PTHR31650
label: "O-ACYLTRANSFERASE (WSD1-LIKE) FAMILY PROTEIN"
definition: >-
  This entry represents tgs1-4 from Mycobacterium tuberculosis, which function as triacylglycerol synthases with very weak or no wax synthase activity. This entry also includes O-acyltransferases mainly from plants and bacteria, including WSD1 from Arabidopsis thaliana, a bifunctional wax ester synthase/diacylglycerol acyltransferase, which is involved in cuticular wax biosynthesis and is required to reduce leaf water loss, especially during drought.
