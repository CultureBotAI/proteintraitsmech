identifier: PANTHER:PTHR12436
label: "80 KDA MCM3-ASSOCIATED PROTEIN"
definition: >-
  This family includes the yeast nuclear export factor Sac3, and mammalian GANP/MCM3-associated protein, which facilitates the nuclear localisation of MCM3, a protein that associates with chromatin in the G1 phase of the cell-cycle. It also includes yeast Thp3 (THO-related protein 3), which may have a role in transcription elongation.
