identifier: PANTHER:PTHR43341
label: "AMINO ACID PERMEASE"
definition: >-
  The amino acid-polyamine-organocation (APC) superfamily, specifically the YAT family, consists of membrane-bound permeases with broad substrate specificity. These permeases are involved in the transport of a wide range of amino acids, including but not limited to asparagine, glutamine, alanine, cysteine, glycine, isoleucine, leucine, methionine, phenylalanine, serine, threonine, tyrosine, valine, arginine, lysine, and histidine. Some members also transport related compounds such as S-adenosylmethionine, proline, and polyamines. The family plays a crucial role in the utilization of amino acids as nitrogen sources, sensing extracellular amino acid levels, and regulating the expression of amino acid-metabolizing enzymes and permeases. The permeases can function as high-affinity transporters for specific amino acids or as general permeases with broader specificity, contributing to cellular nutrition and signalling.
definition_source: "InterPro:IPR050524 abstract (PANTHER PTHR43341 is a member signature)"
