identifier: PANTHER:PTHR35125
label: "NEURON NAVIGATOR 1-LIKE-RELATED"
definition: >-
  PATRONUS (PANS1) is an Arabidopsis protein required for protection of meiotic centromeric cohesion. It is also essential for growth adaptation to stress and required for mitotic onset control. PANS2, a paralogue of PANS1, is not required for centromeric cohesion, but may have a redundant role with PANS1 in gametophytic and somatic development, possibly at mitosis. At least one PANS homologue is present in all dicot species.
