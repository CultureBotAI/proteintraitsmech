identifier: PANTHER:PTHR46500
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 221"
definition: >-
  Cilia- and flagella-associated protein 221 (Cfap221, also known as PCDP1) plays an important role in ciliary and flagellar biogenesis and motility. It is expressed in spermatogenic cells and motile ciliated epithelial cells. Mutations in PCDP1 gene cause primary ciliary dyskinesia (PCD), which is characterised by sinusitis, male infertility, hydrocephalus, and situs inversus.
