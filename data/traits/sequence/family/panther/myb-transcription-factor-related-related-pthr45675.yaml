identifier: PANTHER:PTHR45675
label: "MYB TRANSCRIPTION FACTOR-RELATED-RELATED"
definition: >-
  This entry represents a group of plant MYB-like transcription factors, including EOBI and EOBII from Petunia hybrida. EOBII controls the production of volatile organic compounds (VOCs), including floral volatile benzenoids and phenylpropanoids (FVBP), in flowers of fragrant cultivars (e.g. cv. Mitchell and cv. V26) by regulating the expression of ODO1 and EOBI, key regulators of the shikimate pathway, and of several biosynthetic floral scent-related genes including IGS, PAL2 and CFAT. EOBII binds to and activates the ODO1 and EOBI promoters via MYB binding sites (MBS) 5'-AAACCTAAT-3' and 5'-CTAACT-3'. Other MYB-like transcription factors included in this entry include MYB21/MYB24/MYB108 from Arabidopsis and MYB2/JAMYB from rice. They are involved in different processes, such as abiotic stress responses, defense responses, plant development and photomorphogenesis.
