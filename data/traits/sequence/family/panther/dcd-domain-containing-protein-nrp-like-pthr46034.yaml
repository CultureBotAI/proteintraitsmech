identifier: PANTHER:PTHR46034
label: "DCD domain-containing protein NRP-like"
definition: >-
  This family represents a group of plant asparagine-rich proteins containing a Development and Cell Death (DCD) domain which is present in proteins with different architectures, some of them contain additional recognisable motifs, like the KELCH repeats or the ParB domain. They are involved in stress signalling pathway that mediate cell death in response to endoplasmic reticulum (ER) stress and osmotic stress. Including in this entry are soybean DCD domain-containing proteins NRP-A/B, NRP from Arabidopsis and B2 protein from carrot. NRP was first found in soybean as a component of the early pathogen response and was induced under ER stress. In Arabidopsis, NRP contributes to the initial phase of responses to abiotic and biotic stress signals. It binds the phytochrome-associated protein phosphatase FYPP3 and facilitates FYPP3 degradation to promote abscisic acid (ABA) response, a regulatory circuit which links intracellular trafficking with ABA signaling.
definition_source: "InterPro:IPR044832 abstract (PANTHER PTHR46034 is a member signature)"
