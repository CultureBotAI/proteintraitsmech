  - kind: GENERAL
    text: >-
      This family of proteins includes GTPase-activating proteins (GAPs) that are involved in the modulation of the actin cytoskeleton. They are activated by binding to specific phosphoinositides, including phosphatidylinositol 3,4,5-trisphosphate and, to a lesser extent, phosphatidylinositol 3,4-bisphosphate. These proteins regulate the activity of ARF and RHO family members, which are small GTPases playing critical roles in actin dynamics, membrane trafficking, and cell signaling. Some family members exhibit specificity towards certain ARF isoforms. Additionally, they may participate in cellular processes such as the internalization of anthrax toxin by influencing the cytoskeletal architecture.
