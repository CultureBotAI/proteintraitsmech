identifier: PANTHER:PTHR42721
label: "SUGAR HYDROLASE-RELATED"
definition: >-
  This entry represents a group of beta-D-xylosidases mainly from bacteria, fungi, animals and plants. They belong to a subgroup of the glycoside hydrolase family 3. Xylan, a prominent component of cellulosic biomass, has a high potential for degradation into reducing sugars, and subsequent conversion into bioethanol. This process requires a range of xylanolytic enzymes, including beta-xylosidases. This entry includes fungal exo-1,4-beta-xylosidase xlnD and bxlB. In bacteria, Prevotella ruminicola Xyl3A has been shown to have beta-xylosidase activity via its capacity to hydrolyze glycosidic linkages of beta-1,4-xylo-oligosaccharides of various lengths (X2 to X6), releasing xylose monomers. In Arabidopsis, there are seven members AtBXL1-7 in this entry. AtBXL1 is a bifunctional beta-d-xylosidase/alpha-l-arabinofuranosidase required for pectic arabinan modification and is involved in secondary cell wall metabolism and plant development.
