  - kind: GENERAL
    text: >-
      The protein family includes members that are involved in polyamine binding and protein trafficking. Some members, like the prostatic spermine-binding proteins from mouse and rat, are glycoproteins that bind various polyamines and are regulated by androgens in the prostate. These proteins are functionally equivalent across species and are implicated in the binding of polyamines. Other members, such as the pancreatic adenocarcinoma up-regulated factor in humans, play a crucial role in tumor progression and metastasis in pancreatic cancer, influencing cell migration and invasion via specific signaling pathways. Additionally, the zymogen granule membrane protein 16 from humans, rats, and mice, which belongs to the jacalin lectin family, is suggested to have a role in the formation of zymogen granules by acting as a linker molecule in the trans-Golgi network. This family's diverse functions reflect its involvement in both intracellular trafficking and extracellular interactions.
    source: "InterPro:IPR052321 abstract (LLM-generated, not curator-reviewed)"
