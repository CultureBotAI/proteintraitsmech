    text: >-
      SNRNA-ACTIVATING PROTEIN COMPLEX SUBUNIT 4 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46621. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding. Members participate in snRNA transcription by RNA polymerase II, transcription by RNA polymerase III. Members localise to transcription regulator complex.
