identifier: PANTHER:PTHR23163
label: "RING FINGER PROTEIN-RELATED"
definition: >-
  Bre1 is an E3 ubiquitin ligase that mediates monoubiquitination of histone H2B to form H2BK123ub1 in association with the E2 enzyme Rad6/Ubc2. This entry also includes Bre1 homologues from fission yeasts, Brl1 and Brl2. They are E3 ubiquitin-protein ligase components of the multisubunit protein complex (termed HULC) which mediates monoubiquitination of histone H2B to form H2BK123ub1.
