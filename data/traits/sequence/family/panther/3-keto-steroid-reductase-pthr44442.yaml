definitions:
  - kind: GENERAL
    text: >-
      3-KETO-STEROID REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44442. PANTHER protein class: reductase, metabolite interconversion enzyme. Members are annotated with the molecular function oxidoreductase activity, acting on CH-OH group of donors, oxidoreductase activity, oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Members participate in sterol metabolic process, organic hydroxy compound metabolic process, steroid metabolic process. Members localise to nuclear outer membrane-endoplasmic reticulum membrane network, organelle membrane, endoplasmic reticulum subcompartment.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in steroid-hormone metabolism and cholesterol biosynthesis. Members of this family function as bifunctional enzymes that catalyze the NADP(H)-dependent reduction of estrogens and androgens, thereby regulating the biological potency of these steroids. They are responsible for converting estrone to a more potent estrogen, 17beta-estradiol, and for converting dihydrotestosterone to less active forms. Some family members also convert progesterone to its inactive form. Additionally, these enzymes participate in the post-squalene phase of cholesterol biosynthesis as 3-ketosteroid reductases. The activities of these enzymes can be selectively inhibited by certain 4-methyl-4-aza-5alpha-androstane derivatives.
    source: "InterPro:IPR052834 abstract (LLM-generated, not curator-reviewed)"
