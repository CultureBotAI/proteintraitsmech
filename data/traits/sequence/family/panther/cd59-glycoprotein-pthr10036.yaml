identifier: PANTHER:PTHR10036
label: "CD59 GLYCOPROTEIN"
definition: >-
  CD59 GLYCOPROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10036. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function signaling receptor regulator activity, acetylcholine receptor regulator activity, molecular function regulator activity.
