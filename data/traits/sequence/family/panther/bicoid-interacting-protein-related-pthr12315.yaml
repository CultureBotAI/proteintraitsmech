identifier: PANTHER:PTHR12315
label: "BICOID-INTERACTING PROTEIN RELATED"
definition: >-
  Proteins in this entry contain a Bin3-type S-adenosyl-L-methionine binding domain, proteins include: Drosophila melanogaster 7SK snRNA methylphosphate capping enzyme bin3, interacting with bicoid/bcd, probable RNA methyltransferase CG1239 and CG11342 7SK snRNA methylphosphate capping enzyme (MePCE) or Bicoid-interacting protein 3 homologue (Bin3 homolog), a S-adenosyl-L-methionine-dependent methyltransferase that adds a methylphosphate cap at the 5'-end of 7SK snRNA, leading to stabilise it RNA 5'-monophosphate methyltransferase BCDIN3D Arabidopsis thaliana probable RNA methyltransferase At5g51130 Schizosaccharomyces pombe probable RNA methyltransferase C2A9.10 Caenorhabditis elegans probable methyltransferase Y17G7B.18
