    text: >-
      RABCONNECTIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13950. and participate in regulation of pH, vacuolar acidification, regulation of biological quality. and localise to cytoplasm, protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
