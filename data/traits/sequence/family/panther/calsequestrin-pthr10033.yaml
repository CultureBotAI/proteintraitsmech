identifier: PANTHER:PTHR10033
label: CALSEQUESTRIN
definition: >-
  CALSEQUESTRIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10033. PANTHER protein class: calcium-binding protein. Members are annotated with the molecular function cation binding, metal ion binding, calcium ion binding. Members participate in regulation of localization, regulation of monoatomic cation transmembrane transport, regulation of cellular process. Members localise to intracellular organelle lumen, membrane-enclosed lumen, sarcoplasmic reticulum.
