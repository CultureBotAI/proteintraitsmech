label: CALSEQUESTRIN
definition: >-
  CALSEQUESTRIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10033. PANTHER protein class: calcium-binding protein. Members are annotated with the molecular function calcium ion binding. Members participate in regulation of release of sequestered calcium ion into cytosol. Members localise to sarcoplasmic reticulum, endoplasmic reticulum lumen.
