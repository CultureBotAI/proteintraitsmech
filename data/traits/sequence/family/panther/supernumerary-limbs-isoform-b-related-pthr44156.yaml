label: "SUPERNUMERARY LIMBS, ISOFORM B-RELATED"
definition: >-
  SUPERNUMERARY LIMBS, ISOFORM B-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44156. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 7 of its annotated subfamilies. Subfamilies are annotated with the molecular function ubiquitin ligase-substrate adaptor activity. Subfamilies participate in protein polyubiquitination. Subfamilies localise to SCF ubiquitin ligase complex.
