  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural organization of chromatin. Members of this family are components of the ASTRA complex, which plays a role in chromatin remodeling. Chromatin remodeling is a dynamic process that allows the regulation of gene expression by altering the chromatin structure, thereby making certain regions of DNA more or less accessible to transcription machinery. Proteins in this family contain WD repeats, which are typically associated with protein-protein interactions and are involved in a variety of cellular processes including signal transduction, RNA processing, gene regulation, and cell cycle control.
