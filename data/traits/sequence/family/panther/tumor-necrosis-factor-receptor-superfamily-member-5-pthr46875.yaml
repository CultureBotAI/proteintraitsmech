identifier: PANTHER:PTHR46875
label: "TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 5"
definition: >-
  The Tumor Necrosis Factor Receptor Superfamily Member 5 family comprises receptors that bind to TNFSF5/CD40LG. These receptors are pivotal in immune system regulation, particularly in macrophages and B cells. Upon ligand binding, they initiate signaling cascades involving TRAF6 and MAP3K8, which subsequently lead to the activation of ERK. This activation is crucial for the induction of immunoglobulin secretion, a key process in the adaptive immune response. The family plays a significant role in the communication between T cells and B cells, and is essential for the proper functioning of the immune system.
