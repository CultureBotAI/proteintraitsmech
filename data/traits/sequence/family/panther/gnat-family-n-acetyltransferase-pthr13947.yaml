identifier: PANTHER:PTHR13947
label: "GNAT FAMILY N-ACETYLTRANSFERASE"
definition: >-
  This entry includes proteins from animals, fungi and bacteria with probable acetyltransferase activity, with many members belonging to the Camello family, including human N-acetylaspartate synthetase (NAT8L), which catalyses the synthesis of N-acetylaspartate (NAA) from L-aspartate and acetyl-CoA, and N-acetyltransferase 8 (NAT8), responsible for the acetylation of the free alpha-amino group of cysteine S-conjugates to form mercapturic acids, a detoxification pathway. The family also includes uncharacterised N-acetyltransferases and putative DNA-binding acetyltransferases. In addition, some members may act as transcription factors.
