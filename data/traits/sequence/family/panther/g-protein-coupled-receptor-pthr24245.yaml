  - kind: GENERAL
    text: >-
      This family of proteins includes G-protein coupled receptors (GPCRs) that are predominantly categorized as orphan receptors, which means their endogenous ligands are unknown. Members of this family are characterized by a significant level of constitutive activity, which is the ability to activate intracellular signaling pathways in the absence of a ligand. The signaling is primarily mediated through the G(s)-alpha protein, stimulating adenylate cyclase to increase intracellular cAMP levels. One member is identified as a high-affinity receptor for lysophosphatidic acid (LPA), indicating a role in mediating cellular responses to this lipid mediator. The family members are implicated in various functions, including potential roles in brain function and cellular signaling.
    source: "InterPro:IPR051880 abstract (LLM-generated, not curator-reviewed)"
