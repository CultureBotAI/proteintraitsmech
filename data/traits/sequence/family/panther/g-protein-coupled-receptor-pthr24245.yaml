    text: >-
      G-PROTEIN COUPLED RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24245. PANTHER protein class: G-protein coupled receptor. Members are annotated with the molecular function signaling receptor activity, G protein-coupled receptor activity. Members participate in G protein-coupled receptor signaling pathway, cellular response to stimulus, signaling.
