  - kind: GENERAL
    text: >-
      This family of proteins includes toxic components of type II toxin-antitoxin (TA) systems. They exhibit ribonuclease activity and are involved in the regulation of cellular processes through their interaction with cognate antitoxins. These proteins are typically encoded by operons that also encode their respective antitoxins, forming a stable complex that neutralizes the toxin's activity. Disruption of this complex can lead to the toxin's activation, which may result in growth arrest or cell death. The antitoxin components also regulate the expression of the toxin gene, ensuring the toxin is only active under certain conditions.
