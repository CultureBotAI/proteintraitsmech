  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the transport of amino acids across cellular membranes. Specifically, they are associated with the export of threonine and serine from the cell to the extracellular environment. The transport mechanism is believed to be dependent on the proton motive force. These proteins are essential for certain cellular processes, including growth and survival in specific environments, such as within macrophages for some bacteria. The family is part of a larger group of transporters that facilitate the movement of a variety of substrates across biological membranes, playing a crucial role in cellular homeostasis and intercellular communication.
