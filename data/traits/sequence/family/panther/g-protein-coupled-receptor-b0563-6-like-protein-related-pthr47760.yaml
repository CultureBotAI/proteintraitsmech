identifier: PANTHER:PTHR47760
label: "G-PROTEIN COUPLED RECEPTOR B0563.6-LIKE PROTEIN-RELATED"
definition: >-
  This family of proteins includes members that are putative G-protein coupled receptors (GPCRs). GPCRs constitute a large and diverse group of membrane proteins that play a critical role in signal transduction by responding to a variety of extracellular stimuli and activating intracellular signaling pathways. Although the specific functions of the proteins in this family are not known, they are believed to act as receptors based on sequence similarity to other GPCRs. As receptors, they may be involved in various physiological processes by interacting with ligands such as hormones, neurotransmitters, or sensory stimuli.
