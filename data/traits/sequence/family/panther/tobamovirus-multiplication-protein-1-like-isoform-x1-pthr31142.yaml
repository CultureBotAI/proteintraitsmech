identifier: PANTHER:PTHR31142
label: "TOBAMOVIRUS MULTIPLICATION PROTEIN 1-LIKE ISOFORM X1"
definition: >-
  This entry represents a group of plant proteins, including THH1/TOM1/TOM3 from Arabidopsis. TOM1 and TOM3 are transmembrane proteins necessary for the efficient multiplication of tobamoviruses. THH1 supports tobamovirus multiplication, but to a lesser extent than TOM1 and TOM3. Proteins in this family belong to the GPCR superfamily and are also involved in stress tolerance.
