identifier: PANTHER:PTHR21231
label: "XPA-BINDING PROTEIN 1-RELATED"
definition: >-
  Proteins in this entry belong to the GPN-loop GTPase family, including Npa3 (also known as Gpn1) and Gpn2/3 from budding yeasts. In humans, Npa3 homologue is known as XAB1; Gpn2 is known as GPN2/ATPBD1B; Gpn3 is known as Parcs.
