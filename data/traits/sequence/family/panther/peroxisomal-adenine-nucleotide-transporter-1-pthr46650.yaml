identifier: PANTHER:PTHR46650
label: "PEROXISOMAL ADENINE NUCLEOTIDE TRANSPORTER 1"
definition: >-
  This entry represents a group of peroxisomal adenine nucleotide transporters, including the Peroxisomal adenine nucleotide carrier 1/2 from Arabidopsis thaliana (AtPNC1/2) and the Peroxisomal adenine nucleotide transporter 1 from Saccharomyces cerevisiae (ANT1). Members of this family are found in plants and some fungal species. AtPNC1/2 catalyses the counter exchange of ATP with ADP or AMP. It is required for the beta-oxidation reactions involved in auxin biosynthesis and for the conversion of seed-reserved triacylglycerols into sucrose that is necessary for growth before the onset of photosynthesis.
