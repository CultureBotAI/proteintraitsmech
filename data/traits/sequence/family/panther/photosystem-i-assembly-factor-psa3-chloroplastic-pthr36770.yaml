identifier: PANTHER:PTHR36770
label: "PHOTOSYSTEM I ASSEMBLY FACTOR PSA3, CHLOROPLASTIC"
definition: >-
  PSI is a large protein-pigment complex located in the thylakoid membrane in plants and algae. PSA3 resides on the stromal face of the thylakoid membrane and cooperates with PYG7 (a PSI biogenesis factor) to promote the stable assembly of PSI.
