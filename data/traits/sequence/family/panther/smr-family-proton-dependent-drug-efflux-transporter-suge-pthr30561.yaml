identifier: PANTHER:PTHR30561
label: "SMR FAMILY PROTON-DEPENDENT DRUG EFFLUX TRANSPORTER SUGE"
definition: >-
  Members of this family which have been characterised, belong to the small multidrug/metabolite transporter family and are integral membrane proteins. They confer resistance to a wide range of toxic compounds by removing them for the cells. The efflux is coupled to an influx of protons. It includes 4-amino-4-deoxy-L-arabinose-phosphoundecaprenol flippase subunit ArnE and ArnF, which are components of the undecaprenyl-phosphate-alpha-L-Ara4N flippase that translocates 4-amino-4-deoxy-L-arabinose-phosphoundecaprenol from the cytoplasmic to the periplasmic side of the inner membrane during lipopolysaccharide biosynthesis and is involved in polymyxin resistance. Another example is Escherichia coli EmrE UniProtKB:P23895 which confers resistance to a wide range of toxic compounds, including ethidium, methyl viologen, benzalkonium, propidium, dequalinium and different aromatic cation antibiotics and it is also involved in ethidium bromide efflux. It simultaneously binds and cotransports proton and drug.
definition_source: "InterPro:IPR000390 abstract (PANTHER PTHR30561 is a member signature)"
