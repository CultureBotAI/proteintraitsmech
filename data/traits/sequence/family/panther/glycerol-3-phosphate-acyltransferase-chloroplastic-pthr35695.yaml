identifier: PANTHER:PTHR35695
label: "GLYCEROL-3-PHOSPHATE ACYLTRANSFERASE, CHLOROPLASTIC"
definition: >-
  Glycerol-3-phosphate (1)-acyltransferase(G3PAT) catalyzes the incorporation of an acyl group from either acyl-acyl carrier proteins (acylACPs) or acyl-CoAs into the sn-1 position of glycerol 3-phosphate to yield 1-acylglycerol-3-phosphate. Glycerol-3-phosphate (G3P) plays an important role in carbohydrate and lipid metabolic processes.
