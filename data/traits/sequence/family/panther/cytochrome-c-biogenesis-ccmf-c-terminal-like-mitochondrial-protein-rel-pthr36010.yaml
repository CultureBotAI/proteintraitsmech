identifier: PANTHER:PTHR36010
label: "CYTOCHROME C BIOGENESIS CCMF C-TERMINAL-LIKE MITOCHONDRIAL PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant proteins, including CCMFC from plants. CCMFC forms a complex with CCMFN1, CCMFN2 and CCMH that performs the assembly of heme with c-type apocytochromes in mitochondria. This entry also includes Uncharacterized mitochondrial protein ymf2 and ymf3.
