identifier: PANTHER:PTHR11073
label: "CALRETICULIN AND CALNEXIN"
definition: >-
  CALRETICULIN AND CALNEXIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11073. PANTHER protein class: chaperone. Members are annotated with the molecular function calcium ion binding. Members participate in ERAD pathway, biosynthetic process, protein folding. Members localise to endoplasmic reticulum, endoplasmic reticulum membrane, nuclear outer membrane-endoplasmic reticulum membrane network.
