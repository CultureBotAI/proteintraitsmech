identifier: PANTHER:PTHR36690
label: "PROTEIN FAM237A"
definition: >-
  In humans there are two paralogues, FAM237A and FAM237B. FAM237A is expressed in the pituitary, testis, heart and brain. The active form of these peptides requires C-terminal amidation and disulphide bond formation. FAM237A and FAM237B were identified as candidate ligands for the orphan G protein-coupled receptor GPR83.
