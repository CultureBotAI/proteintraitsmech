identifier: PANTHER:PTHR11177
label: CHITINASE
definition: >-
  The glycosyl hydrolase 18 family encompasses a diverse group of proteins with a range of functions, including chitin degradation, tissue remodeling, and modulation of cell proliferation and motility. Members of this family are involved in various biological processes such as immune responses, fertilization, and symbiotic signaling. Some proteins possess chitinase activity, playing roles in host defense against pathogens and in the molting process of arthropods. Others, lacking chitinase activity, such as Chitinase-3-like protein 1 from human act as carbohydrate-binding lectins or participate in signaling pathways. The family includes proteins that contribute to inflammatory responses, facilitate bacterial invasion, and regulate apoptosis in different tissues. Additionally, some members are involved in the regulation of insulin-like peptide signaling, affecting cell proliferation and differentiation.
