identifier: PANTHER:PTHR47334
label: "SPLICING FACTOR PWI DOMAIN-CONTAINING PROTEIN / RNA RECOGNITION MOTIF (RRM)-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes RNA-binding regulators involved in the modulation of alternative pre-mRNA splicing. Members of this family are characterized by the presence of a PWI domain, which is known to bind nucleic acids and is instrumental in the protein's role in splicing regulation. The PWI domain's affinity for nucleic acids is not specific to the form of the RNA, as it can bind both single- and double-stranded species. Additionally, these proteins play a role as negative regulators in plant responses to the hormone abscisic acid, impacting processes including early developmental stages.
