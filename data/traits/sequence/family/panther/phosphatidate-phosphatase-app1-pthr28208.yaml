      PHOSPHATIDATE PHOSPHATASE APP1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28208. PANTHER protein class: hydrolase, phosphatase. Members are annotated with the molecular function phosphatase activity. Members participate in lipid metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes Mg(2+)-dependent phosphatidate phosphatases that play a role in lipid metabolism by catalyzing the dephosphorylation of phosphatidate (PA) to produce diacylglycerol (DAG). This reaction is central to the synthesis of triglycerides and phospholipids. Members of the family may also be involved in vesicular trafficking, particularly at cortical actin patches, through their phosphatidate phosphatase activity. The family's enzymes can also act on diacylglycerol pyrophosphate and lyso-PA, albeit with lower specificity compared to PA. The catalytic activity of these enzymes is characterized by the presence of a DXDXT motif and is subject to inhibition by N-ethylmaleimide.
    source: "InterPro:IPR052935 abstract (LLM-generated, not curator-reviewed)"
