identifier: PANTHER:PTHR46025
label: "XYLOSYLTRANSFERASE OXT"
definition: >-
  Proteoglycans (PGs) are macromolecules located in the extracellular matrix (ECM) and cell surface of animal cells, and are comprised of a core protein to which one or more glycosaminoglycan (GAG) chain is covalently attached. GAG assembly starts with the attachment of xylose from the uridine diphosphate (UDP)-xylose donor onto a specific serine residue of the core protein by xylosyltransferase. In mammals there are two xylosyltransferases, xylosyltransferase 1 and xylosyltransferase 2 (XT1 and XT2). This entry includes both xylosyltransferase 1 and xylosyltransferase 2.
