identifier: PANTHER:PTHR46005
label: "RHO GTPASE-ACTIVATING PROTEIN 190"
definition: >-
  This family of proteins includes Rho GTPase-activating proteins (GAPs) that regulate the Rho family of GTPases. Members of this family are involved in various cellular processes such as cell differentiation, adhesion, migration, and morphogenesis of tissues like the retina and cerebral hemispheres. They play roles in axon outgrowth, guidance, and fasciculation, as well as in the regulation of F-actin polymerization and assembly. These proteins are also implicated in polarized cell migration, ciliogenesis, and mammary gland development. Some family members have a pseudoGTPase domain that does not bind GTP, while others have a functional N-terminal GTPase domain essential for proper cellular localization. The activity of these proteins can be modulated by binding to acidic phospholipids and phosphorylation by specific kinases. Additionally, certain members may repress transcription of specific genes, although this function requires further validation.
