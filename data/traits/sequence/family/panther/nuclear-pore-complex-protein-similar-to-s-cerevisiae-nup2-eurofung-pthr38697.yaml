  - kind: GENERAL
    text: >-
      This family of proteins includes components of the nuclear pore complex (NPC), which is essential for the transport of molecules between the nucleus and the cytoplasm. Members of this family, known as nucleoporins (NUPs), serve dual functions as structural elements of the NPC and as interaction partners for nuclear transport factors. They facilitate active directional transport across the NPC by establishing an affinity gradient through Phe-Gly (FG) repeats that interact with transport proteins. These FG repeats are flexible, lack a defined secondary structure, and vary in sequence, spacing, and length. The gradient is maintained by a differential distribution of transport cofactors, which are predominantly associated with GTP in the nucleus and GDP in the cytoplasm. Some family members may also be involved in mitotic spindle assembly and function.
    source: "InterPro:IPR053074 abstract (LLM-generated, not curator-reviewed)"
