identifier: PANTHER:PTHR10547
label: "SEMENOGELIN/SEMINAL VESICLE SECRETORY PROTEIN"
definition: >-
  SEMENOGELIN/SEMINAL VESICLE SECRETORY PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10547. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies participate in spermatid development, sperm capacitation, spermatid differentiation. Subfamilies localise to vesicle, extracellular region.
