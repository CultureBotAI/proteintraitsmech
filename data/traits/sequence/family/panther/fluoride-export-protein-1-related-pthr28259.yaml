identifier: PANTHER:PTHR28259
label: "FLUORIDE EXPORT PROTEIN 1-RELATED"
definition: >-
  FluC, also known as CrcB, is an integral membrane protein that acts as an efflux transporter which confers resistance to fluoride ion, thus reducing its toxicity. It is highly specific for fluoride ions and cannot transport chloride ions. Over expression in E. coli leads to camphor resistance.
