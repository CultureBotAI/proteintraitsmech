identifier: PANTHER:PTHR33941
label: "PROPANEDIOL UTILIZATION PROTEIN PDUA"
definition: >-
  This family of proteins is involved in the formation and function of bacterial microcompartments (BMCs), which are proteinaceous organelles that encapsulate enzymes and metabolic pathways. Members of this family form hexameric units that assemble into the shell of these compartments, controlling the selective diffusion of metabolites. They are essential for the structural integrity of BMCs and play a role in enhancing metabolic fluxes while protecting the cell from toxic intermediates. Some members are involved in the degradation of specific substrates, such as 1,2-propanediol or ethanolamine, by concentrating the required enzymes within the BMC. Others are associated with the carboxysome, a type of BMC that sequesters RuBisCO for carbon fixation in cyanobacteria and some chemoautotrophs.
