identifier: PANTHER:PTHR36170
label: "CENTROSOMAL PROTEIN OF 89 KDA"
definition: >-
  CEP89 is a component of the distal appendages of centrioles, and is required for ciliogenesis. CEP89 has also been shown to be required for mitochondrial metabolism and neuronal and cognitive function.
