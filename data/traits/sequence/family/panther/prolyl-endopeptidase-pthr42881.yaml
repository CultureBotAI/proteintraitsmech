identifier: PANTHER:PTHR42881
label: "PROLYL ENDOPEPTIDASE"
definition: >-
  The Prolyl oligopeptidase family, part of the peptidase S9A and S9B subfamilies, encompasses enzymes with diverse functions including conventional prolyl endopeptidases that cleave peptide bonds on the C-terminal side of prolyl residues within short peptides, and specialized macrocyclase-peptidases involved in the biosynthesis of cyclic peptides with biological activities such as nematodicidal and toxicity properties. These enzymes typically act on peptides up to approximately 30 amino acids long and often have a strict requirement for an X-Pro bond in the trans configuration immediately before the scissible bond. Some members perform a two-step cleavage and macrocyclization of core peptides, playing a crucial role in the production of bioactive cyclic compounds.
