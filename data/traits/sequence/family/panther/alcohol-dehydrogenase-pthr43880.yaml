identifier: PANTHER:PTHR43880
label: "ALCOHOL DEHYDROGENASE"
definition: >-
  ALCOHOL DEHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43880. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function zinc ion binding, oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Members participate in cellular response to oxygen-containing compound, small molecule catabolic process, response to toxic substance. Members localise to cytoplasm, cytosol.
