identifier: PANTHER:PTHR11751
label: "ALANINE AMINOTRANSFERASE"
definition: >-
  This entry represents a group of aminotransferases, including ALAT1/2 from humans. ALAT1/2 catalyzes the reversible transamination between alanine and 2-oxoglutarate to form pyruvate and glutamate. This entry also includes ALAT1/2 found in Arabidopsis mitochondria and GGAT1/2 found in Arabidopsis peroxisomes. GGAT1/2 catalyzes the Glu:glyoxylate aminotransferase (GGT), Ala:glyoxylate aminotransferase (AGT), Ala:2-oxoglutarate aminotransferase (AKT) and Glu:pyruvate aminotransferase (GPT) reactions in peroxisomes.
