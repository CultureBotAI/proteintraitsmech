identifier: PANTHER:PTHR31314
label: "MYB FAMILY TRANSCRIPTION FACTOR PHL7-LIKE"
definition: >-
  This family of plant proteins includes Myb family transcription factor protein PHOSPHATE STARVATION RESPONSE 1 from Arabidopsis thaliana (PHR1) and similar proteins from plants, including PHLs from A.thaliana and MPH1/MOF1 from rice. They belong to a family of MYB-CC transcription factors and are regarded as the key components of the central regulatory system controlling plant transcriptional responses to phosphate (Pi) starvation. PHR1 is a transcription factor and a master regulator of phosphate starvation responses (PSRs). PHL1 (PHR1-LIKE 1), PHL2, and perhaps also PHL3, act redundantly with PHR1 to regulate plant Pi starvation responses. However, PHL4 has only a minor role in the regulation of plant responses to Pi starvation. PHL10 (also known as MYR1) acts redundantly with PHL9 (also known as MYR2) as a repressor of flowering and organ elongation under decreased light intensity. MPH1 is likely a transcription factor involved in the regulation of plant height by elongating internode cell length. It is involved in the positive regulation of grain yield. MPH may play a role in the regulation of genes related to cell elongation and cell wall synthesis, which are associated with plant height and yield phenotypes. It also plays a role in tolerance to cadmium stress. MOF1 is a transcriptional repressor that plays a role in the regulation of organ identity and spikelet meristem determinacy. It interacts with the TPR corepressors to possibly repress the expression of downstream target genes.
