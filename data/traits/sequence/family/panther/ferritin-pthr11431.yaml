identifier: PANTHER:PTHR11431
label: FERRITIN
definition: >-
  Ferritin is one of the major non-haem iron storage proteins in animals, plants, and microorganisms. It consists of a mineral core of hydrated ferric oxide, and a multi-subunit protein shell which encloses the former and assures its solubility in an aqueous environment. In animals the protein is mainly cytoplasmic and there are generally two or more genes that encode closely related subunits (in mammals there are two subunits which are known as H(eavy) and L(ight)). In plants ferritin is found in the chloroplast.
