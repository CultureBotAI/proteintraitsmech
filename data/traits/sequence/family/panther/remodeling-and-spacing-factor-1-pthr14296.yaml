identifier: PANTHER:PTHR14296
label: "REMODELING AND SPACING FACTOR 1"
definition: >-
  Remodelling and spacing factor 1 (Rsf-1, also known as HBXAP) and SNF2h ATPase form the RSF chromatin remodelling complex. Rsf-1 can induce chromosomal instability and is overexpressed in many types of cancer cells. Its overexpression induces DNA damage response through ATM-Chk2-p53-p21 pathway. It also interacts and collaborates with cyclin E1 in tumour development. Rsf-1 is identical to the largest isoform of HBXAP (HBXAPalpha/Rsf-1), which interacts with hepatitis B virus X protein (HBx). HBXAP may function as a negative regulator for TNF-alpha-induced, NF-kappaB-mediated gene activation.
