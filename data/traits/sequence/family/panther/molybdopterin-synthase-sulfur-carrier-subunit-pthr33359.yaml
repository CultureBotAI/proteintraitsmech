identifier: PANTHER:PTHR33359
label: "MOLYBDOPTERIN SYNTHASE SULFUR CARRIER SUBUNIT"
definition: >-
  MOCS2A is a the small subunit of the molybdopterin synthase complex that catalyses the conversion of precursor Z into molybdopterin by mediating the incorporation of 2 sulfur atoms into precursor Z to generate a dithiolene group. In the complex, MOCS2A serves as sulfur donor by being thiocarboxylated at its C terminus by UBA4. After interaction with MOCS2B, the sulfur is then transferred to precursor Z to form molybdopterin. This entry includes the Molybdopterin synthase sulfur carrier subunit MOCS2A from eukaryotes and MoaD from bacteria and archaea. This entry also includes Small archaeal modifier protein 1, which functions as a protein modifier covalently attached to lysine residues of substrate proteins, as well as a sulfur carrier in molybdenum cofactor (MoCo) biosynthesis.
definition_source: "InterPro:IPR044672 abstract (PANTHER PTHR33359 is a member signature)"
