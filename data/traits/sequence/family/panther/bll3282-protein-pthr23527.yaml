  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of the major facilitator superfamily (MFS), which is one of the largest groups of secondary transporters. Proteins in this family are involved in the transport of a diverse range of substrates across cellular membranes, including sugars, amino acids, ions, and drugs. They function by facilitating the movement of these molecules against their concentration gradient, using the energy derived from the electrochemical potential difference of ions, typically protons or sodium ions, across the membrane. The transport mechanism typically involves conformational changes in the protein structure, alternating between inward-facing and outward-facing states to shuttle the substrate across the lipid bilayer.
    source: "InterPro:IPR052952 abstract (LLM-generated, not curator-reviewed)"
