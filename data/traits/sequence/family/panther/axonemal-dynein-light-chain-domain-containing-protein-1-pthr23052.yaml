identifier: PANTHER:PTHR23052
label: "AXONEMAL DYNEIN LIGHT CHAIN DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This family of proteins is implicated in the process of spermiogenesis and is considered crucial for male fertility. Members of this family are believed to play a role in the dynamics of the manchette, a structure involved in shaping the spermatid head, as well as in the assembly of the sperm flagellum, which is essential for sperm motility.
