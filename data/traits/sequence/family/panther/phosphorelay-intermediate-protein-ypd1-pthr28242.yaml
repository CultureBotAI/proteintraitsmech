identifier: PANTHER:PTHR28242
label: "PHOSPHORELAY INTERMEDIATE PROTEIN YPD1"
definition: >-
  This protein family includes the Histidine-containing phosphotransfer proteins 1-5 (AHP1-5) from Arabidopsis thaliana and the phosphorelay intermediate protein YPD1 from Saccharomyces cerevisiae and Candida albicans. Members of this entry are predominantly found in plants and fungi. The phospho-relay system is a variant of the two-component signal transduction system. Here a hybrid sensor histidine kinase (HK) auto-phosphorylates and then transfers the phosphoryl group to an internal receiver domain, rather than to a separate response regulator (RR) protein. The phosphoryl group is then shuttled to histidine phosphotransferase (HPT) and subsequently to a terminal RR, which can evoke the desired response. AHP1-5 functions as two-component phosphorelay mediators between cytokinin sensor histidine kinases and response regulators. These proteins play an important role in propagating cytokinin signal transduction through the multistep phosphorelay, thus in the development of female gametophytes. They are localized in the cytoplasm and the nucleus. The phosphorelay intermediate protein YPD1 is part of the two-component regulatory system which controls gene expression in response to changes in the osmolarity of the extracellular environment. It catalyses the phosphoryl group transfer from the membrane-bound osmosensing histidine kinase SLN1 to two distinct response regulator proteins, SSK1 in the cytoplasm, and transcription factor SKN7 in the nucleus. In C. albicans, this system is studied as a potential target for antifungal drugs.
