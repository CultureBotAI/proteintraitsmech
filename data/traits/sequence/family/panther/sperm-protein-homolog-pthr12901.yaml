identifier: PANTHER:PTHR12901
label: "SPERM PROTEIN HOMOLOG"
definition: >-
  COQ10 is a hydrophobic protein located in the inner membrane of mitochondria that binds coenzyme Q (CoQ), also called ubiquinone, which is an essential electron carrier of the respiratory chain. Deletion of the gene encoding COQ10p (COQ10 or YOL008W) in Saccharomyces cerevisiae results in respiratory defect because of the inability to oxidize NADH and succinate. COQ10 may function in the delivery of CoQ (Q6 in budding yeast) to its proper location for electron transport. The human homologue, called Q-binding protein COQ10 homologue A (COQ10A), is able to fully complement for the absence of COQ10 in fission yeast. Human COQ10A also has a splice variant COQ10B.
definition_source: "InterPro:IPR044996 abstract (PANTHER PTHR12901 is a member signature)"
