identifier: PANTHER:PTHR43285
label: "ANTHRANILATE PHOSPHORIBOSYLTRANSFERASE"
definition: >-
  In many widely different species, including Escherichia coli, Thermotoga maritima, and Archaeoglobus fulgidus, this enzyme is a C-terminal part of a multifunctional protein together with glutamine amidotransferase; the fusion protein is designated anthranilate synthase component II ( ).
