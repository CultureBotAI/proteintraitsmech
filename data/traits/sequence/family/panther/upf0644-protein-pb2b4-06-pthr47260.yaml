  - kind: GENERAL
    text: >-
      This family of proteins includes components involved in various cellular processes, including post-transcriptional gene expression and biosynthesis of bioactive compounds. Some members are part of large complexes that coordinate ribosomal functions with gene expression steps. Others are implicated in the production of secondary metabolites with antimicrobial properties, such as the biosynthesis of cyclic lipopeptides that can inhibit the growth of pathogenic fungi. The specific roles of some members within these processes remain to be elucidated, while others are characterized by their similarity to known protein families.
