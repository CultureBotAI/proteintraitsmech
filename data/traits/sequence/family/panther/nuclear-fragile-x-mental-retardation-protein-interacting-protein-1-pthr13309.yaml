identifier: PANTHER:PTHR13309
label: "NUCLEAR FRAGILE X MENTAL RETARDATION PROTEIN INTERACTING PROTEIN 1"
definition: >-
  FMR1-interacting protein 1 (Nufip1) has been implicated in the assembly of the large subunit of the ribosome and in telomere maintenance. It is known to bind RNA and is phosphorylated upon DNA damage.
