identifier: PANTHER:PTHR23356
label: DPY30-RELATED
definition: >-
  This entry includes Sdc1 from fission yeast, and its homologues, Dpy-30, from animals. Protein dpy-30 homologue (DPY30) is a component of the MLL1/MLL complex which trimethylates histone H3 at 'Lys-4' as a specific tag for epigenetic transcriptional activation. DPY30 is also a component in MLL2/3 and MLL4/WBP7 methyltransferase-containing complexes and the SET1 complex. DPY30 is found in the nucleus and the trans-Golgi network where it interacts with ARFGEF1 implying a role in endosomal trafficking. This entry also includes C. elegans dpy-30, which is an essential component of the C. elegans dosage compensation machinery that reduces X chromosome transcript levels in hermaphrodites (XX). The SET1 complex is a methyltransferase that that produces trimethylated histone H3 at Lys(4). It is composed of at least the catalytic subunit (SETD1A or SETD1B), WDR5, WDR82, RBBP5, ASH2L/ASH2, CXXC1/CFP1, HCFC1 and DPY30. In yeast there is only one SET1 complex, but in mammals there are additional H3K4 methylases.
