identifier: PANTHER:PTHR13906
label: PORCUPINE
definition: >-
  This entry represents a group of eukaryotic proteins, including human Lysophospholipid acyltransferase 7 (LPLAT 7) and Protein-serine O-palmitoleoyltransferase porcupine (PORCN). LPLAT 7 catalyses the transfer of an acyl group from an acyl-CoA to a lysophosphatidylinositol (1-acylglycerophosphatidylinositol or LPI) leading to the production of a phosphatidylinositol (1,2-diacyl-sn-glycero-3-phosphoinositol or PI) and participates in the reacylation step of the phospholipid remodelling pathway also known as the Lands cycle. Alterations on its expression are associated to brain developmental disorders, fatty liver disease and hepatocellular and renal cancers. Its structure is mainly α-helical, with 11 transmembrane (TM) helical segments linked by short intervening helices (IH) and loops. PORCN acts as a key regulator of the Wnt signalling pathway by mediating the attachment of palmitoleate, a 16-carbon monounsaturated fatty acid (C16:1(9Z)), to Wnt proteins. This protein shows a similar structural configuration to LPLAT7, with 11 TMs, 6 (IH) and 2 β-strands.
