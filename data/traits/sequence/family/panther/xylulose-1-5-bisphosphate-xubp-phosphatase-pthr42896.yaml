identifier: PANTHER:PTHR42896
label: "XYLULOSE-1,5-BISPHOSPHATE (XUBP) PHOSPHATASE"
definition: >-
  This entry represents CbbY-like proteins mostly from bacteria, fungi and plants. In Rhodobacter sphaeroides and Arabidopsis thaliana, CbbY is a xylulose-1,5-bisphosphate phosphatase, which convert xylulose-1,5-bisphosphate (a potent inhibitor of Ribulose-1,5-bisphosphate carboxylase/oxygenase, Rubisco), to the non-inhibitory compound xylulose-5-phosphate.
