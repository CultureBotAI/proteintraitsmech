identifier: PANTHER:PTHR24226
label: "G-PROTEIN COUPLED RECEPTOR 182 AND ESTROGEN RECEPTOR 1"
definition: >-
  This family represents a group of proteins from vertebrates that belong to the G-protein coupled receptor 1 family, including G-protein coupled estrogen receptor 1 (GPER1, also known as G-protein coupled receptor 30), the atypical chemokine receptor 3 and orphan receptors such as GP182 and GP146. GPER1 has been described as an atypical GPCR whose physiological and/or pathological roles remain to be determined. It was first described that it binds 17-beta-estradiol (E2) with high affinity, leading to rapid and transient activation of numerous intracellular signalling pathways, however, evidence confirming this is still lacking. In vitro studies suggest that E2 could bind GPER1 to trigger various intracellular signalling pathways, and in vivo studies do not exclude GPER1 as an ER in mediating estrogenic responses, but further investigation is needed to confirm this.
definition_source: "InterPro:IPR047143 abstract (PANTHER PTHR24226 is a member signature)"
