identifier: PANTHER:PTHR44573
label: "NADPH-DEPENDENT ALKENAL/ONE OXIDOREDUCTASE, CHLOROPLASTIC"
definition: >-
  This entry represents a group of plant NADPH-dependent oxidoreductases, including FaQR from Fragaria ananassa and AOR from Arabidopsis thaliana. FaQR is an enone oxidoreductase involved in the biosynthesis of 4-hydroxy-2,5-dimethyl-3(2H)-furanone (HDMF or furaneol), the key flavour compound in strawberries. AOR is a NADPH-dependent reductase involved in the detoxification of reactive carbonyls.
