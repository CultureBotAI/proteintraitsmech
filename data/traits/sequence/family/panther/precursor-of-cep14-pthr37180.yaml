identifier: PANTHER:PTHR37180
label: "PRECURSOR OF CEP14"
definition: >-
  This entry includes the precursors of CEP13 and CEP14. These are found only in plants and although uncharacterised are thought to be extracellular signalling peptides that regulate primary root growth rate and nitrogen-demand signalling from comparison with CEP1 (UniProtKB:Q8L8Y3). The cep13 gene is induced by gibberelic acid and repressed by nitrogen and CEP13 accumulates in the roots in response to osmotic stress and depletion of nitrogen and ammonium chloride. CEP13 is repressed in shoots by nitrogen starvation. CEP14 is only slightly repressed in roots by carbon dioxide and induced in shoots by osmotic stress.
