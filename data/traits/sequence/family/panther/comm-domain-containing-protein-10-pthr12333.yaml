identifier: PANTHER:PTHR12333
label: "COMM DOMAIN CONTAINING PROTEIN 10"
definition: >-
  COMM10 is a member of the COMMD family defined by the presence of a conserved and unique motif termed the COMM (copper metabolism gene MURR1) domain, which functions as an interface for protein-protein interactions. In Drosophila, COMM10 may have an accessory function in the survival motor neuron (SMN) complex. In human, it may modulate activity of cullin-RING E3 ubiquitin ligase (CRL) complexes. It may also down-regulate activation of NF-kappa-B.
definition_source: "InterPro:IPR037361 abstract (PANTHER PTHR12333 is a member signature)"
