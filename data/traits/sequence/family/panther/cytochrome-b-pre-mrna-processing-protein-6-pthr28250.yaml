identifier: PANTHER:PTHR28250
label: "CYTOCHROME B PRE-MRNA-PROCESSING PROTEIN 6"
definition: >-
  In Saccharomyces cerevisiae, Cbp6 is a mitochondrial protein and a cytochrome b translation regulator. It forms a complex with Cbp3; this complex is required for efficient synthesis of cytochrome b and for protection of the newly synthesized protein from proteolysis. This entry also includes the Cbp6 homologue from Schizosaccharomyces pombe. In contrast to budding yeast, fission yeast Cbp6 is not required for the translation of mitochondrial mRNAs, but functions at a post-translational step of respiratory complex biogenesis.
