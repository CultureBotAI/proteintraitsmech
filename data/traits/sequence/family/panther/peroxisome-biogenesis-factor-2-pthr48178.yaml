identifier: PANTHER:PTHR48178
label: "PEROXISOME BIOGENESIS FACTOR 2"
definition: >-
  Peroxisome biogenesis factor 2 and 10, also known as peroxin-2/10 are involved in the formation of peroxisomes and matrix protein import. Tey form a retrotranslocation channel together with PEX12, which mediates the export of the PEX5 receptor from peroxisomes to the cytosol, thereby promoting PEX5 recycling. Each subunit contributes transmembrane segments that coassemble into an open channel. PEX2 is also involved in the response to reactive oxygen species (ROS) by mediating 'Lys-48'-linked polyubiquitination and subsequent degradation of PNPLA2/ATGL, thereby regulating lipolysis.
