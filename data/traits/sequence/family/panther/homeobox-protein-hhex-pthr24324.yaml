definitions:
  - kind: GENERAL
    text: >-
      HOMEOBOX PROTEIN HHEX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24324. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding. Members participate in regulation of transcription by RNA polymerase II, cell differentiation.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Homeobox protein family is characterized by the presence of a homeobox domain, which enables these proteins to bind DNA and regulate gene expression. Members of this family function as transcription factors involved in a variety of developmental and cellular processes. They recognize specific DNA sequences to either activate or repress transcription, playing crucial roles in cell differentiation, organ development, and the establishment of body axes. Some members are involved in cell cycle regulation, acting as transcriptional repressors during specific phases. Others have roles in mating type determination in yeast, pharyngeal development, and the biosynthesis of compounds in pathogenicity. The family includes proteins that regulate hematopoietic differentiation, vascular endothelial cell proliferation, and anterior identity in embryogenesis. They may also interact with signaling pathways such as WNT and NODAL, and some have additional functions like mRNA nuclear export inhibition.
    source: "InterPro:IPR051000 abstract (LLM-generated, not curator-reviewed)"
