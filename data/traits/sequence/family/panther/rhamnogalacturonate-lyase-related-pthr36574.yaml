identifier: PANTHER:PTHR36574
label: "RHAMNOGALACTURONATE LYASE-RELATED"
definition: >-
  This entry represents rhamnogalacturonase B, a pectinolytic enzyme (endolyase; ) that hydrolyses the alpha-L-rhamnopyranosyl-(1,4)-alpha-D-galacturonopyranosyl glycosidic linkage by beta-elimination, thereby generating oligosaccharides terminating at the non-reducing end with a hex-4-enopyranosyluronic acid residue. This protein belongs to the polysaccharide lyase 4 family.
