identifier: PANTHER:PTHR46472
label: NUCLEOREDOXIN
definition: >-
  NUCLEOREDOXIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46472. PANTHER protein class: oxidoreductase. Members are annotated with the molecular function protein-disulfide reductase activity, antioxidant activity, catalytic activity, acting on a protein. Members participate in negative regulation of protein modification process, negative regulation of signal transduction, regulation of protein modification process. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
