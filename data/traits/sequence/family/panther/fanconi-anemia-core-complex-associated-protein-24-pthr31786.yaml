identifier: PANTHER:PTHR31786
label: "FANCONI ANEMIA CORE COMPLEX-ASSOCIATED PROTEIN 24"
definition: >-
  Fanconi anemia-associated protein of 24kDa (FAAP24) plays a role in DNA repair through recruitment of the FA core complex to damaged DNA. It regulates FANCD2 monoubiquitination upon DNA damage. When repressed, it induces chromosomal instability as well as hypersensitivity to DNA cross-linking agents. It targets FANCM/FAAP24 complex to the DNA, preferentially to single strand DNA. Fanconi anemia (FA) is a human disorder characterised by cancer susceptibility and cellular sensitivity to DNA crosslinks and other damages. The FA complex repairs the interstrand cross-linking (ICL) lesions and coordinates activities of the downstream DNA repair pathway including nucleotide excision repair, translesion synthesis, and homologous recombination. It is required for the monoubiquitylation of FANCD2 and FANCI heterodimer. The FA core complex consists of FANCA, FANCB, FANCC, FANCE, FANCF, FANCG, FANCL, FANCM, FANCT (UBET2), FAAP100 and FAAP24.
