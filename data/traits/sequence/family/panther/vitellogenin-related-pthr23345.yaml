  - kind: GENERAL
    text: >-
      The Vitellogenin/Apolipophorin family includes proteins that serve as precursors for egg-yolk proteins, providing essential nutrients during the embryonic development of oviparous organisms. Vitellogenins are involved in sequestering calcium, iron, and other cations, and may influence life-span through autophagy and lysosomal lipolysis. Apolipophorins are major components of lipophorin, mediating lipid transport in hemolymph and forming lipoprotein particles. They may facilitate the movement of morphogens and be involved in yolk granule formation. Some members are implicated in the differentiation of honeybee larvae into queens and may bind toxins like tetrodotoxin.
