identifier: PANTHER:PTHR11199
label: "STROMAL ANTIGEN"
definition: >-
  Proteins in this family are subunits of the cohesin complex - a protein complex required for sister chromatid cohesion in eukaryotes, including subunits SA-1, SA-2, SA-3 from chordates, Scc3 from S. cerevisiae and Psc3 from S. pombe. They contain a STAG domain and a stromalin conservative domain (SCD). The SCD domain is also found in human STAG3-like proteins and meiotic recombination protein Rec11 from S. pombe. The structure of Scc3 has been revealed.
definition_source: "InterPro:IPR039662 abstract (PANTHER PTHR11199 is a member signature)"
