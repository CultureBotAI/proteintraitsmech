identifier: PANTHER:PTHR46070
label: "PINSTRIPE, ISOFORM A"
definition: >-
  This entry includes DENN domain-containing proteins 5A/B (DEN5A/B) from humans and similar animal proteins that belong to the RAB6 interacting protein 1 (Rab6IP1) family. DEN5A/B are guanine nucleotide exchange factors (GEFs) which may activate RAB6A and RAB39A and/or RAB39B. They promote the exchange of GDP to GTP, converting inactive GDP-bound Rab proteins into their active GTP-bound form. DEN5A is involved in the negative regulation of neurite outgrowth.
