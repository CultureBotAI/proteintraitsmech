identifier: PANTHER:PTHR38563
label: "FL(2)D-ASSOCIATED COMPLEX COMPONENT"
definition: >-
  Flacc, also known as Zc3h13 (zinc finger CCCH domain-containing protein 13) or Xiong, is a component of the N6-methyladenosine (m6A) methyltransferase complex. Like other components of this complex, Flacc controls m6A levels and is involved in sex determination in Drosophila.
