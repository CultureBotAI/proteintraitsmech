identifier: PANTHER:PTHR31626
label: "SUSHI DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family includes FAM171A1, FAM171A2 and FAM171B. FAM171A1 is a type 1 transmembrane glycoprotein also known as astroprincin (APCN) due to its abundant expression in astrocytes. APCN is also expressed in placental trophoblasts, skeletal and heart muscle, kidney and pancreas. APCN is involved in the regulation of the cytoskeletal dynamics, playing a role in actin stress fibre formation. The APCN gene is located on chromosome 10p13, a region that is deleted in DiGeorge type 2 and velocardiofacial syndromes.
definition_source: "InterPro:IPR018890 abstract (PANTHER PTHR31626 is a member signature)"
