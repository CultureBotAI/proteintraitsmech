definitions:
  - kind: GENERAL
    text: >-
      PHOSPHATIDYLGLYCEROL PHOSPHOLIPASE C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42758. PANTHER protein class: phospholipase. Members are annotated with the molecular function phosphoric diester hydrolase activity. Members participate in glycerophospholipid catabolic process, phosphate-containing compound metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the hydrolysis of lysoglycerophospholipids to generate lysophosphatidic acid (LPA) and corresponding amines. Members of this family exhibit lysophospholipase D activity, with a preference for substrates such as 1-O-alkyl-sn-glycero-3-phosphocholine, lysophosphatidylcholine, and N-acylethanolamine lysophospholipids. They play a role in the biosynthesis of bioactive N-acylethanolamines. These enzymes are regulated by divalent cations; magnesium and manganese can stimulate activity, while calcium can have an inhibitory effect, depending on the concentration. The presence of EDTA, a chelating agent, results in the loss of lysophospholipase D activity. These proteins do not possess glycerophosphodiester phosphodiesterase activity, as they are unable to hydrolyze glycerophosphoinositol or glycerophosphocholine.
    source: "InterPro:IPR052271 abstract (LLM-generated, not curator-reviewed)"
