identifier: PANTHER:PTHR47200
label: "THYLAKOID LUMENAL 15 KDA PROTEIN 1, CHLOROPLASTIC"
definition: >-
  This entry represents a group of pentapeptide repeat containing proteins (PRPs) from plants and cyanobacteria, including At2g44920 (also known as p15) from Arabidopsis. PRP structures are dominated by four-sided right-handed β-helices typically consisting of mixtures of type II and type IV β-turns. At2g44920 is a thylakoid lumenal protein that consists of 25 pentapeptide repeats capped by N- and C-terminal α-helices. Unlike other PRPs, At2g44920 consists exclusively of type II β-turns.
definition_source: "InterPro:IPR044213 abstract (PANTHER PTHR47200 is a member signature)"
