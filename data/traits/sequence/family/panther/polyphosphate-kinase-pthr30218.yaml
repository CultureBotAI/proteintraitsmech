identifier: PANTHER:PTHR30218
label: "POLYPHOSPHATE KINASE"
definition: >-
  Polyphosphate kinase (Ppk) ( ) catalyzes the formation of polyphosphate from ATP, with chain lengths of up to a thousand or more orthophosphate molecules. It is a membrane protein and goes through an intermediate stage during the reaction where it is autophosphorylated with a phosphate group covalently linked to a basic amino acid residue through an N-P bond.
