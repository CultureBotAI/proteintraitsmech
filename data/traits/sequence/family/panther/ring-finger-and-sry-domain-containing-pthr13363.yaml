identifier: PANTHER:PTHR13363
label: "RING FINGER AND SRY DOMAIN-CONTAINING"
definition: >-
  This entry represents a group of RING finger-containing proteins, including RNF123/RSPRY1 from humans and RKP from Arabidopsis. The role of RSPRY1, while not fully understood, may involve bone development, as mutations in this protein are associated with skeletal dysplasia. RNF123 is the catalytic subunit of the KPC complex and functions as an E3 ubiquitin-protein ligase that promotes the ubiquitination and proteasome-mediated degradation of CDKN1B, a cyclin-dependent kinase inhibitor involved in the G0-G1 transition of the cell cycle. In addition to its E3 ligase activity, RNF123 also acts as an inhibitor of innate antiviral signalling mediated by DDX58 and IFIH1, functioning independently of its ligase activity. RKP is an E3 ubiquitin-protein ligase that promotes the ubiquitination and proteasomal degradation of KRP1 and KRP2.
definition_source: "InterPro:IPR045129 abstract (PANTHER PTHR13363 is a member signature)"
