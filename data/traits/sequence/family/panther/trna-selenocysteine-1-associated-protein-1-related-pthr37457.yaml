identifier: PANTHER:PTHR37457
label: "TRNA SELENOCYSTEINE 1-ASSOCIATED PROTEIN 1-RELATED"
definition: >-
  Selenocysteine tRNA 1 associated proteins (also known as TRNAU1AP) is involved in the early steps of selenocysteine biosynthesis and tRNA(Sec) charging to the later steps resulting in the cotranslational incorporation of selenocysteine into selenoproteins. Selenium deficiency results in a variety of diseases, including cardiac disease. TRNAU1AP contains RNA recognition motifs (RRM) and a Tyr-rich region found in the C-terminal. The Tyr-rich region (amino acids 185-225) is conserved among several mammals, including human, chimp, dog, cattle, mouse and rat. Furthermore, constitutive deletion of exons corresponding to the Tyr-rich region in mouse resulted in embryonic lethality. This entry also includes uncharacterised protein C6orf52 from humans.
definition_source: "InterPro:IPR040434 abstract (PANTHER PTHR37457 is a member signature)"
