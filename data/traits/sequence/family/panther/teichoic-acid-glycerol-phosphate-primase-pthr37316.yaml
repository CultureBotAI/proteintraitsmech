identifier: PANTHER:PTHR37316
label: "TEICHOIC ACID GLYCEROL-PHOSPHATE PRIMASE"
definition: >-
  This family of proteins is involved in the biosynthesis of teichoic acids, which are components of the cell wall in certain bacteria. Members of this family function as enzymes that catalyze the transfer of glycerol phosphate or ribitol phosphate units from cytidine diphosphate-activated donors to a growing polymer chain attached to a disaccharide linkage unit. These enzymes are responsible for the polymerization of the main chain of major teichoic acids, synthesizing polymers of glycerol phosphate or ribitol phosphate of varying lengths. Some members act as primases, initiating the polymerization process by adding the first phosphate unit, while others extend the polymer by adding multiple units.
