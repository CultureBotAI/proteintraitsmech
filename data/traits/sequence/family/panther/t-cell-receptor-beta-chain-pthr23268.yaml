    method: GENERATED
  - kind: GENERAL
    text: >-
      The T cell receptor beta variable family is composed of proteins that form part of the antigen-specific receptors on the surface of T lymphocytes. These receptors are crucial for the immune response, recognizing peptide-major histocompatibility complexes presented by antigen presenting cells. This interaction is essential for T cell adaptive immunity against pathogens. The family includes both functional and non-functional members, with the latter resulting from altered recombination or mutations. Upon antigen recognition, these receptors initiate a cascade of intracellular signaling pathways, leading to T cell activation, growth, and differentiation. The repertoire of these receptors is generated in the thymus and shaped by selection events to create a pool of self-restricted, non-autoaggressive T cells.
    source: "InterPro:IPR050413 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
