      T-CELL RECEPTOR BETA CHAIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23268. PANTHER protein class: immunoglobulin receptor superfamily. Members participate in cellular response to stimulus, regulation of cellular process, cell surface receptor signaling pathway. Members localise to cell periphery, membrane, plasma membrane.
