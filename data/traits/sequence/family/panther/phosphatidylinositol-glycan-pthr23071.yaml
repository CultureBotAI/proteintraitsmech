identifier: PANTHER:PTHR23071
label: "PHOSPHATIDYLINOSITOL GLYCAN"
definition: >-
  PIG-F and PIG-O are required for transferring phosphoethanolamine to the third mannose in glycosylphosphatidylinositol (GPI) synthesis. PIG-O and PIG-F associate with each other, and the stability of PIG-O is dependent upon PIG-F.
