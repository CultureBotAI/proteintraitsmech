  - kind: GENERAL
    text: >-
      This family of proteins includes major outer membrane components associated with peptidoglycans in various bacterial species. Members are believed to function as porins, which are proteins that form channels to allow the passive diffusion of small molecules across the outer membrane. Some proteins in this family have a C-terminal deletion, which may influence their structure and function compared to other members. The family is characterized by a conserved domain that suggests a shared evolutionary origin and functional similarity across different species.
