identifier: PANTHER:PTHR31711
label: "ARGININE AND GLUTAMATE-RICH PROTEIN 1"
definition: >-
  The arginine and glutamate-rich 1 (ARGLU1) family of proteins is found in metazoa and plants. In mammals, ARGLU1 cooperates with MED1 to regulate estrogen receptor-mediated gene transcription.
