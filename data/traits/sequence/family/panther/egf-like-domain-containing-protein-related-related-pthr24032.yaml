  - kind: GENERAL
    text: >-
      The EGF-like domain-containing protein comC family is involved in the regulation of cellular aggregation in the social amoeba Dictyostelium discoideum. Members of the family play a crucial role in the signaling pathway that governs aggregation, interacting with other key proteins such as lagC and tgrD1/lagD. Specifically, the family functions to inhibit the expression of lagC and to activate the expression of lagD, thereby modulating the aggregation process that is essential for the development and survival of these organisms.
