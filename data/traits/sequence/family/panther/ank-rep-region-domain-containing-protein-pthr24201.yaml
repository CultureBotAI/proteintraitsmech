  - kind: GENERAL
    text: >-
      The protein family includes ankyrin repeat domain-containing proteins and cyclin-dependent kinase inhibitors. Ankyrin repeat proteins may play roles in cell division and other regulatory functions, while cyclin-dependent kinase inhibitors are involved in cell cycle regulation by interacting with CDK4 and CDK6, inhibiting cell growth and proliferation. Some family members are involved in endosomal mRNA transport, chitinase secretion, and phosphoprotein substrate recognition. Others may act as substrate-recognition components of E3 ubiquitin-protein ligase complexes, mediating ubiquitination and proteasomal degradation of target proteins.
