identifier: PANTHER:PTHR48476
label: "SHORT-CHAIN DEHYDROGENASE TIC 32, CHLOROPLASTIC-LIKE"
definition: >-
  This entry represents Short-chain dehydrogenase TIC 32, chloroplastic from Pisum sativum (TIC32) and similar plant proteins. TIC32 is involved in protein precursor import into chloroplasts. It is part of the redox regulon that consists of TIC32, TIC 55 and TIC62.
