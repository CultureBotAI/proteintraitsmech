    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are primarily involved in redox reactions, specifically the reduction of quinones and other related compounds. Members of this family are characterized by the presence of a zinc-binding motif, which is typical of zinc-containing alcohol dehydrogenase enzymes. These proteins are known to catalyze reactions such as the NADPH-dependent reduction of acrylyl-CoA to propanoyl-CoA and the reduction of prostaglandins. Some members are implicated in the biosynthesis of bioactive compounds, such as terrequinone A, an antitumor agent. The family also includes proteins that may play a role in metabolic processes and have been linked to the regulation of transcriptional activity and adipocyte differentiation.
    source: "InterPro:IPR051397 abstract (LLM-generated, not curator-reviewed)"
