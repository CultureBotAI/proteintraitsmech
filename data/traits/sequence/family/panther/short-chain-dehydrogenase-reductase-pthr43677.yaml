      SHORT-CHAIN DEHYDROGENASE/REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43677. PANTHER protein class: metabolite interconversion enzyme, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, catalytic activity.
