  - kind: GENERAL
    text: >-
      The protein family is involved in the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS), which is a key carbohydrate transport and phosphorylation mechanism in bacteria. Members of the family function as integral membrane proteins that form the translocation channel for specific sugars, facilitating their uptake into the cell. The PTS system operates by phosphorylating the sugar substrates during their transport across the membrane. Different proteins within the family are specific for various sugars, including lactose, cellobiose, galactose, lichenan, N,N'-diacetylchitobiose, oligo-beta-mannosides, and potentially other related carbohydrates. The EIIC domain is common among these proteins, forming the translocation channel and binding site for the sugars. Some members also contain the EIIB domain, which is involved in the phosphorylation transfer to the sugar substrate. The family plays a crucial role in the cellular uptake and metabolism of carbohydrates, affecting bacterial growth and adaptation to available sugar sources.
    source: "InterPro:IPR051088 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
