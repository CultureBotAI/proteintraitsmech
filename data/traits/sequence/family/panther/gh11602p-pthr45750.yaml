identifier: PANTHER:PTHR45750
label: GH11602P
definition: >-
  This entry includes histone acetyltransferases GCN5, GCNE, KAT2A and KAT2B (all of which are included in EC:2.3.1.48). GCN5 acetylates histones H2B, H3 and H4, providing a specific tag for epigenetic transcription activation. GCN5 is a component of the transcription regulatory histone acetylation (HAT) complexes SAGA, SLIK, SALSA and ADA. GNCE acts as an acetyltransferase that acetylates histones H2B, H3 and H4, and contributes to H2A.Z acetylation. Also acts as a benzoyltransferase and benzoylates adhB at 'Lys-393' which activates adhB to affect the development, secondary metabolism, pathogenicity, and stress response. Mammals have two paralogues: KAT2A (also known as GCN5) and KAT2B. KAT2A acetylates core histones to provide a specific tag for epigenetic transcription activation but not nucleosome core particles. It also acetylates proteins such as CEBPB. KAT2A is a component of the ATAC complex, which has acetyltransferase activity on histones H3 and H4. KAT2B (also known as P300/calcium-binding protein (CBP)-associated factor or PCAF) can acetylate the core histones H3 and H4 as well as nucleosome core particles and non-histone proteins such as ACLY. The transcription regulatory histone acetylation complex Spt-Ada-Gcn5 acetyltransferase (SAGA) is involved in RNA polymerase II-dependent transcriptional regulation of approximately 10% of yeast genes. SAGA preferentially acetylates histones H3 and H2B and deubiquitinates histone H2B. SAGA is known as PCAF in vertebrates and PCAF acetylates nucleosomal histone H3. The SAGA complex consists of at least TRA1, CHD1, SPT7, TAF5, ADA3, SGF73, SPT20/ADA5, SPT8, TAF12, TAF6, HFI1/ADA1, UBP8, GCN5, ADA2, SPT3, SGF29, TAF10, TAF9, SGF11 and SUS1, and some of these components are present as two copies. The complex is built up fro
