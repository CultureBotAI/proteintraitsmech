identifier: PANTHER:PTHR32319
label: "BACTERIAL HEMOLYSIN-LIKE PROTEIN"
definition: >-
  This family represents the TlyA family of proteins which includes 16S/23S rRNA (cytidine-2'-O)-methyltransferase TlyA, Hemolysin A and related proteins. Haemolysins are exotoxins that attack blood cell membranes and cause cell rupture. The mechanism of action is not well defined. Hemolysin A is induced by sodium ribonucleate, and is produced by pathogenic bacterial strains. Hemolysin A from Treponema hyodysenteriae causes swine dysentery. 16S/23S rRNA (cytidine-2'-O)-methyltransferase TlyA catalyses the 2'-O-methylation at nucleotides C1409 in 16S rRNA and C1920 in 23S rRNA. It is involved in virulence by promoting adherence and invasion to host cells. In M. tuberculosis, it acts as a host evasion factor, that significantly contributes to the pathogenesis of M.tuberculosis by modulating adaptive immune responses by inhibiting host-protective Th1 and Th17 cytokine responses as well as autophagy. In Campylobacter jejuni, has been shown to be involved in susceptibility to antibiotic capreomycin. Additionally, TlyA may be involved in ribosomal biogenesis and assembly. TlyA also exhibits haemolytic activity in vitro, by binding with and forming oligomers into host cell membranes.
