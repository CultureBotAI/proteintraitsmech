identifier: PANTHER:PTHR43730
label: BETA-MANNOSIDASE
definition: >-
  The Beta-mannosidase family consists of exoglycosidases that cleave the single beta-linked mannose residue from the non-reducing end of beta-mannosidic oligosaccharides. Members of this family are involved in the degradation of various glycoconjugates, including polymeric mannan and galactomannan. They exhibit specificity for different substrates, with some preferring mannobiose and others having activity against mannotriose or galactosylated mannooligosaccharides. The family is part of the glycosyl hydrolase 2 superfamily, with subfamilies A and B showing distinct substrate preferences and activities. Beta-mannosidase A tends to be involved in broader oligosaccharide degradation, while Beta-mannosidase B has a more restricted activity, being inhibited by galactosyl substitutions and showing no activity against polymeric mannan.
