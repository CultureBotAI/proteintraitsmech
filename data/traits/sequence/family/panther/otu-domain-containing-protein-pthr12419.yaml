identifier: PANTHER:PTHR12419
label: "OTU DOMAIN CONTAINING PROTEIN"
definition: >-
  This entry represents human Deubiquitinase OTUD6B, OTU domain-containing protein 5 (OTUD5) and other C85 peptidases that contain the OTU domain ( InterPro:IPR003323 ). OTUD6B may play a role in the ubiquitin-dependent regulation of protein synthesis, downstream of mTORC1. functions as a negative regulator of the innate immune system. This family also includes some viral sequences such as Putative ubiquitin thioesterase 232R from Invertebrate iridescent virus 3.
