identifier: PANTHER:PTHR12895
label: DYMECLIN
definition: >-
  Dymeclin (Dyggve-Melchior-Clausen syndrome protein) contains a large number of leucine and isoleucine residues and a total of 17 repeated dileucine motifs. It is characteristically about 700 residues long and present in plants and animals. Human dymeclin is necessary for correct organisation of Golgi apparatus and is involved in bone development. Mutations in the dymeclin gene cause Dyggve-Melchior-Clausen syndrome (DMC, MIM 223800), an autosomal-recessive disorder characterised by the association of spondylo-epi-metaphyseal dysplasia and mental retardation.
