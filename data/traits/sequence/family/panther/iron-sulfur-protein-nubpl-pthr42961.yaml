identifier: PANTHER:PTHR42961
label: "IRON-SULFUR PROTEIN NUBPL"
definition: >-
  This family represents a group of proteins that bind and transfer iron-sulfur (Fe-S) clusters to target proteins and are required for Fe-S cluster assembly. They belong to the conserved family of P-loop ATPases. Iron-sulfur protein NUBPL, an IND1 homologue, is required for the assembly of the mitochondrial membrane respiratory chain NADH dehydrogenase (Complex I). Also included in this family is Fe-S cluster assembly factor HCF101 from Arabidopsis, which specifically assembles 4Fe-4S clusters and transfers them to the chloroplast PSI and ferredoxin-thioredoxin (FTR) complexes. Iron-sulfur cluster carrier proteins APBC from Bacteria and Archaea are also included in this family.
definition_source: "InterPro:IPR044304 abstract (PANTHER PTHR42961 is a member signature)"
