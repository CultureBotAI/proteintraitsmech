identifier: PANTHER:PTHR11831
label: "30S 40S RIBOSOMAL PROTEIN"
definition: >-
  This family includes the small ribosomal subunit protein uS4, also known as S9. U3 small nucleolar ribonucleoprotein protein IMP3, a component of the 60-80S U3 small nucleolar ribonucleoprotein (U3 snoRNP), is also included in this entry. It is required for the early cleavages during pre-18S ribosomal RNA processing. Ribosomal protein uS4 is one of the proteins from the small ribosomal subunit. In Escherichia coli, uS4 is known to bind directly to 16S ribosomal RNA. Mutations in uS4 have been shown to increase translational error frequencies. uS4 is a protein of 171 to 205 amino-acid residues (except for NAM9, which is much larger). The crystal structure of a bacterial uS4 protein revealed a two domain molecule. The first domain is composed of four helices in the known structure. The second domain is in the middle of the first one and displays some structural homology with the ETS DNA binding domain. Ribosomes are the particles that catalyse mRNA-directed protein synthesis in all organisms. The codons of the mRNA are exposed on the ribosome to allow tRNA binding. This leads to the incorporation of amino acids into the growing polypeptide chain in accordance with the genetic information. Incoming amino acid monomers enter the ribosomal A site in the form of aminoacyl-tRNAs complexed with elongation factor Tu (EF-Tu) and GTP. The growing polypeptide chain, situated in the P site as peptidyl-tRNA, is then transferred to aminoacyl-tRNA, and the new peptidyl-tRNA, extended by one residue, is translocated to the P site with the aid of the elongation factor G (EF-G) and GTP as the deacylated tRNA is released from the ribosome through one or more exit sites. About 2/3 of the mass of the ribosome consists of RNA and 1/3 consists of protein. The proteins are named in accordance w
