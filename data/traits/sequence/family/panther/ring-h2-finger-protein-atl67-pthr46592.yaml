identifier: PANTHER:PTHR46592
label: "RING-H2 FINGER PROTEIN ATL67"
definition: >-
  This entry represents a group of plant RING zinc-finger domain proteins, including ATL67/ATL68/ATL69/ATL70 from Arabidopsis. They belong to the ATL family of ubiquitin ligases. Arabidopsis ATL consists of 91 members that contain the RING-H2 variation and a hydrophobic domain located at the N-terminal end.
