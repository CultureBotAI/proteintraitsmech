definitions:
  - kind: GENERAL
    text: >-
      ATP-DEPENDENT CLP PROTEASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11638. PANTHER protein class: protease. Members are annotated with the molecular function hydrolase activity, acting on acid anhydrides, ATP hydrolysis activity, ribonucleoside triphosphate phosphatase activity. and participate in cellular response to stimulus, response to abiotic stimulus, cellular response to stress. and localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The ClpA/ClpB family proteins are molecular chaperones and ATP-dependent proteases that play crucial roles in stress responses, particularly in the recovery of cells from heat-induced damage. They are involved in the disaggregation, solubilization, and refolding of denatured protein aggregates, acting in cooperation with other chaperones such as DnaK, DnaJ, and GrpE. The ClpB chaperones have ATPase activity, which is stimulated by protein binding; the subsequent ATP hydrolysis unfolds the denatured protein aggregates. This unfolding exposes new hydrophobic binding sites on the surface of ClpB-bound aggregates, aiding in their solubilization and refolding by DnaK. The ClpA/ClpB family proteins contain nucleotide-binding domains responsible for ATP hydrolysis and oligomerization, and a coiled-coil domain essential for the rescue of proteins from an aggregated state. Some family members are also involved in the degradation of proteins by proteases like ClpP, regulation of genetic competence, and mitochondrial-mediated antiviral innate immunity.
    source: "InterPro:IPR050130 abstract (LLM-generated, not curator-reviewed)"
