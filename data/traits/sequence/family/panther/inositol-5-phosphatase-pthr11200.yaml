identifier: PANTHER:PTHR11200
label: "INOSITOL 5-PHOSPHATASE"
definition: >-
  This entry represents a family of inositol 5-phosphatases and similar proteins predominantly found in eukaryotes, including Synaptojanin-1 (SYNJ1), phosphatidylinositol 4,5-bisphosphate 5-phosphatase A (PI5PA) and inositol polyphosphate 5-phosphatase OCRL from humans. These enzymes act on various phosphoinositides, including phosphatidylinositol 4-phosphate, phosphatidylinositol (4,5)-bisphosphate and phosphatidylinositol (3,4,5)-trisphosphate. OCRL regulates traffic in the endosomal pathway by regulating the specific pool of phosphatidylinositol 4,5-bisphosphate that is associated with endosomes and is involved in primary cilia assembly. This protein is associated with the oculocerebrorenal syndrome of Lowe and Dent disease 2.
definition_source: "InterPro:IPR046985 abstract (PANTHER PTHR11200 is a member signature)"
