identifier: PANTHER:PTHR10605
label: "HEPARAN SULFATE SULFOTRANSFERASE"
definition: >-
  Seven 3-O-sulfotransferase isoforms in the human genome are involved in the biosynthesis of 3-O-sulfated heparan sulfate. These enzymes catalyze the transfer of a sulfo group from the sulfo donor, 3'-phosphoadenosine-5'-phosphosulfate (PAPS), to the 3-OH position of a glucosamine unit of heparin sulfate (HS). 3-O-sulfation is critically important for anticoagulant activity. The key control of anticoagulant HS synthesis is regulation of the expression of 3-O-sulfotransferase isoforms 1 and 5 (3-OST-1 and 3-OST-5). 3-O-sulfation is also involved in the regulation of neural development. 3-OST proteins exhibit similarity with the heparan biosynthetic enzyme NST (bifunctional HS N-deacetylase/N-sulfotransferase). It appears that a common sulfotransferase structure is shared by these two types of heparan biosynthetic enzyme. The bifunctional enzyme catalyzes both the N-deacetylation and the N-sulfation of glucosamine (GlcNAc) of the glycosaminoglycan in HS.
definition_source: "InterPro:IPR037359 abstract (PANTHER PTHR10605 is a member signature)"
