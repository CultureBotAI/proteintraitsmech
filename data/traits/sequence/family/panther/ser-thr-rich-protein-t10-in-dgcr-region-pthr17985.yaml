identifier: PANTHER:PTHR17985
label: "SER/THR-RICH PROTEIN T10 IN DGCR REGION"
definition: >-
  In eukaryotes this family is predicted to play a role in protein secretion and Golgi organisation. In plants this family includes UniProtKB:A9X6Y0, which is involved in water permeability in the cuticles of fruit. UniProtKB:P54797 has been found to be expressed during early embryogenesis in mice. This protein contains a conserved NRDE motif. This gene has been characterised in Drosophila melanogaster and named as transport and Golgi organisation 2, hence the name Tango2.
