identifier: PANTHER:PTHR46581
label: "ARABINOSYLTRANSFERASE RRA3"
definition: >-
  This entry represents a group of plant arabinosyltransferases, including RRA1/2/3 from Arabidopsis. They have been implicated in extensin (a plant cell wall component) glycosylation. The arabinosylation of extensin is important for root hair cell development.
