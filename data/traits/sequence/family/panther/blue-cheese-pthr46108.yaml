  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes including autophagy, protein sorting, cell morphogenesis, and membrane fusion. Members of this family play critical roles in the regulation of antigen presentation in dendritic cells, B-cell survival, cytokinesis, phagocytosis, osmoregulation, and brain development. They are implicated in the formation of axonal tracts and the response of neural cells to guidance cues. Some proteins in this family function as adapter proteins linking ubiquitinated proteins to the autophagic machinery for selective degradation. They are also involved in Wnt signaling regulation and may influence osteoclastogenesis. Domains present in these proteins, such as the FYVE domain, are important for binding to specific phospholipids, and the LC3-interacting region (LIR) motif mediates interactions with components of the autophagy pathway.
    source: "InterPro:IPR051944 abstract (LLM-generated, not curator-reviewed)"
