identifier: PANTHER:PTHR47370
label: "ACYL-COA N-ACYLTRANSFERASES (NAT) SUPERFAMILY PROTEIN"
definition: >-
  This family of proteins includes N-acetyltransferases that play a role in plant development and growth. Members are involved in processes such as cell elongation, apical hook formation in seedlings, and auxin homeostasis, which may influence organogenesis and plant biomass. Some family members exhibit histone acetyltransferase activity, impacting gene expression by modifying histones and thereby regulating traits like grain weight and yield. The family is characterized by a conserved acetyltransferase domain, suggesting a shared enzymatic function across different plant species.
