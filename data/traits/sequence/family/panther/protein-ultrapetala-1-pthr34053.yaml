identifier: PANTHER:PTHR34053
label: "PROTEIN ULTRAPETALA 1"
definition: >-
  This entry represents a developmental regulator that acts as a key negative regulator of cell accumulation in shoot and floral meristems. Negatively regulates the size of the WUSCHEL (WUS)-expressing organising centre in inflorescence meristems. May act by down-regulating expression of WUS and can compensate for mutant ULT1 protein when over expressed.
