  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that are involved in the ubiquitination process. Members of this family catalyze the attachment of ubiquitin to substrate proteins, typically through 'Lys-48'-linked polyubiquitination, which targets the substrates for proteasomal degradation. This process is crucial for various cellular functions, including protein turnover, signal transduction, and the regulation of other cellular processes. Some members are known to interact with specific proteins to maintain cellular homeostasis, such as ensuring appropriate levels of proteins involved in apoptotic cell clearance. The family also includes proteins with RING finger domains, which are characteristic of many E3 ubiquitin ligases and are important for their ligase activity.
    source: "InterPro:IPR052667 abstract (LLM-generated, not curator-reviewed)"
