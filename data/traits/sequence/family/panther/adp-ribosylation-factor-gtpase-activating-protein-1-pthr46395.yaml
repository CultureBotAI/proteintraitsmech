identifier: PANTHER:PTHR46395
label: "ADP-RIBOSYLATION FACTOR GTPASE-ACTIVATING PROTEIN 1"
definition: >-
  ADP-RIBOSYLATION FACTOR GTPASE-ACTIVATING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46395. PANTHER protein class: GTPase-activating protein. Members are annotated with the molecular function nucleoside-triphosphatase regulator activity, enzyme activator activity, molecular function activator activity. Members participate in regulation of cell communication, regulation of endocytosis, regulation of signal transduction. Members localise to cytoplasm, bounding membrane of organelle, organelle membrane.
