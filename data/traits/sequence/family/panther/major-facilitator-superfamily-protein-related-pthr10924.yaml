identifier: PANTHER:PTHR10924
label: "MAJOR FACILITATOR SUPERFAMILY PROTEIN-RELATED"
definition: >-
  This protein family includes human Solute carrier family 49 members A1 (SLC49A1 or FLVCR1), A2 (SLC49A2 or FLVCR2), A3 (SLC49A3 or MFSD7) and 4 (SLC49A4 or DIRC2) from mammals and similar sequences widespread among all cellular organisms. FLVCR1/2 are uniporters that mediate the transport of extracellular choline and ethanolamine into cells, the precursors of phosphatidylcholine and phosphatidylethanolamine, respectively, the two most abundant phospholipids, thereby playing a key role in phospholipid biosynthesis. This transport is not coupled with proton transport and is exclusively driven by the choline (or ethanolamine) gradient across the plasma membrane. They are also haem b transporters that mediates haem efflux from the cytoplasm to the extracellular compartment. Haem export depends on the presence of HPX and is required to maintain intracellular free haem balance, protecting cells from haem toxicity. Mutations in the genes coding for these proteins are related with serious human disorders. DIRC2 mediates H -dependent pyridoxine transport. Members of this family belong to the Major Facilitator Superfamily (MFS) of transporters.
