  - kind: GENERAL
    text: >-
      The PxpC family proteins are enzymes that play a crucial role in the metabolic pathway of glutathione degradation. They catalyze the cleavage of 5-oxoproline (pyroglutamic acid) to form L-glutamate. This reaction is coupled with the hydrolysis of ATP to ADP and inorganic phosphate, which provides the necessary energy for the reaction to occur. In Bacillus subtilis, the PxpC family protein also interacts with PxpB (KipI), a sporulation inhibitor, by binding to it and preventing its inhibitory action on kinase A, thus having a regulatory role in the process of sporulation.
