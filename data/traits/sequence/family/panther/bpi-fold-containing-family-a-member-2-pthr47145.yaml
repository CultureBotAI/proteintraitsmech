definitions:
  - kind: GENERAL
    text: >-
      BPI FOLD-CONTAINING FAMILY A MEMBER 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47145. Members are annotated with the molecular function carbohydrate derivative binding, lipid binding, lipopolysaccharide binding. and localise to cytoplasmic vesicle, extracellular space, endomembrane system.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins exhibits antibacterial activity, particularly against Pseudomonas aeruginosa. Members of this family are part of the BPI/LBP/Plunc superfamily and are characterized by the presence of a BPI fold. The BPI fold is known to play a role in binding to and neutralizing lipopolysaccharides, which are components of the outer membrane of Gram-negative bacteria. The proteins in this family are likely involved in innate immune responses by providing a first line of defense against bacterial infections.
    source: "InterPro:IPR052507 abstract (LLM-generated, not curator-reviewed)"
