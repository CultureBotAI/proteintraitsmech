identifier: PANTHER:PTHR15955
label: "RWD DOMAIN CONTAINING PROTEIN 2"
definition: >-
  This entry represents a family of animal and fungal proteins, including Phomoidride biosynthesis cluster protein F (PhiF), part of the gene cluster that mediates the biosynthesis of the antihypercholesterolemic agents phomoidrides which are dimeric anhydrides. Many members of this group have a N-terminal RWD domain ( InterPro:IPR006575 ).
