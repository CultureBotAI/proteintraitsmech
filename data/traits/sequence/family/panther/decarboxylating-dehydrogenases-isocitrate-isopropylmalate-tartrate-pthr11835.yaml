  DECARBOXYLATING DEHYDROGENASES-ISOCITRATE, ISOPROPYLMALATE, TARTRATE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11835. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Members participate in carboxylic acid metabolic process, secondary alcohol metabolic process, tricarboxylic acid cycle.
