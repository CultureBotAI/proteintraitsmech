  - kind: GENERAL
    text: >-
      This family of proteins includes cytochrome P450 monooxygenases involved in the biosynthesis of various secondary metabolites. These enzymes catalyze oxidation reactions that modify substrates by introducing oxygen atoms, often as part of larger biosynthetic pathways for complex organic compounds. They play crucial roles in the formation of lipopeptides, indole diterpenes, and other bioactive molecules with applications ranging from agriculture to medicine. The family members are characterized by their ability to perform epoxidation, hydroxylation, and other oxidative modifications, which are essential for the structural diversification and bioactivity of the metabolites they help produce.
