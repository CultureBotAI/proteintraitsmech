identifier: PANTHER:PTHR21024
label: "GROWTH HORMONE-INDUCIBLE SOLUBLE PROTEIN-RELATED"
definition: >-
  The Electron transfer flavoprotein regulatory factor 1 family comprises proteins that function as regulators of the electron transfer flavoprotein (ETF) system. Members of this family are involved in promoting the removal of flavin from the ETF holoenzyme, which consists of the ETFA and ETFB subunits. This regulatory activity is crucial for the proper function of ETF, which plays a significant role in the mitochondrial electron transport chain and is essential for cellular respiration and energy production. The family belongs to the complex I LYR family, indicating that its members contain the LYR motif, which is associated with complex I assembly and function within the mitochondria.
definition_source: "InterPro:IPR052000 abstract (PANTHER PTHR21024 is a member signature)"
