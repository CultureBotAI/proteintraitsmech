identifier: PANTHER:PTHR13763
label: "BREAST CANCER TYPE 1 SUSCEPTIBILITY PROTEIN BRCA1"
definition: >-
  This entry includes animal BRCA1 (BREAST CANCER SUSCEPTIBILITY 1) proteins and their homologues from plants. The animal BRCA1 protein is a E3 ubiquitin-protein ligase that specifically mediates the formation of 'Lys-6'-linked polyubiquitin chains and plays a central role in DNA repair by facilitating cellular responses to DNA damage. It contains an N-terminal zinc-finger domain. It also contains a BRCT C-terminal domain, an approximately 100 amino acid tandem repeat, which appears to act as a phospho-protein binding domain.
definition_source: "InterPro:IPR031099 abstract (PANTHER PTHR13763 is a member signature)"
