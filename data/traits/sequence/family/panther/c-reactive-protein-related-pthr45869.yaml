definition: >-
  C-REACTIVE PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45869. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function complement binding, protein-containing complex binding. Subfamilies participate in innate immune response. Subfamilies localise to extracellular region.
