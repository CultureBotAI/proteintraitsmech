  - kind: GENERAL
    text: >-
      This family of proteins is involved in host defense mechanisms. Members of this family are known to participate in various immune responses, including promoting agglutination, bacterial capsular swelling, phagocytosis, and complement fixation. They achieve these functions through calcium-dependent binding to phosphorylcholine. Some members can also interact with DNA and histones, potentially scavenging nuclear material from damaged circulating cells. Additionally, certain proteins within this family may function as calcium-dependent lectins with specificity for beta-galactose.
