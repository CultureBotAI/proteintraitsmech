identifier: PANTHER:PTHR37363
label: "EKC/KEOPS COMPLEX SUBUNIT GON7"
definition: >-
  The KEOPS/EKC complex is a tRNA modification complex involved in the biosynthesis of N6-threonylcarbamoyladenosine (t6A). In eukaryotes, KEOPS is composed of OSGEP/Kae1, PRPK/Bud32, TPRKB/Cgi121, LAGE3/Pcc1 and GON7. This family consists of subunit GON7 from Metazoa.
