identifier: PANTHER:PTHR40266
label: "TOXIN HIGB-1"
definition: >-
  Bacterial toxin-antitoxin loci consist of two genes in an operon encoding a 'toxin' and an 'antitoxin' respectively. Ectopic expression of the toxins severely reduces cell growth and prevents colony formation. This entry includes HigB-1, one of the toxins found in Vibrio cholerae. It inhibits translation by sequence-specific cleavage of mRNA. It prefers either in-frame or out-of-frame 5'-AAA-3' codons (lysine).
definition_source: "InterPro:IPR007711 abstract (PANTHER PTHR40266 is a member signature)"
