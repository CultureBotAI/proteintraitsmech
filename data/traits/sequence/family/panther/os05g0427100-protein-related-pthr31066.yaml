identifier: PANTHER:PTHR31066
label: "OS05G0427100 PROTEIN-RELATED"
definition: >-
  This family of proteins is involved in the regulation of cell growth anisotropy during the development of the gynoecium, which is the female reproductive part of a flower. Members of this family work in conjunction with other proteins to coordinate cell-cell communication with cellular growth processes. Through this collaborative function, they play a crucial role in the proper formation and differentiation of the gynoecium, ensuring reproductive success in plants.
