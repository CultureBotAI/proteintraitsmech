identifier: PANTHER:PTHR21577
label: SHUGOSHIN
definition: >-
  Shugoshin (which is Japanese for guardian spirit) was first identified in Drosophila melanogaster (originally named Mei-S322) as a protein that is required for sister chromatid cohesion. Later, a few shugoshin orthologs from yeast to human were identified through similarities in their sequence architectures. Flies and budding yeast have only one known shugoshin (Mei-S322 and Sgo1, respectively), fission yeast, Xenopus laevis and mammals have two shugoshin-like proteins (Sgo1 and Sgo2 in yeast and SGOL1 and SGOL2 in vertebrates).The functions of Sgo1 from different species can vary. For instance, in S. cevervisiae and D. melanogaster, Sgo1 protects cohesion at meiosis but not mitosis. In humans and X. laevis, SGOL1 protect centromeric cohesion during mitosis. This family includes Shugoshin 1/2 from human and related sequences.
