  - kind: GENERAL
    text: >-
      This family of proteins is involved in the hydrolysis of glycosidic bonds, specifically those in mucopolysaccharides and oligosaccharides. Members of this family exhibit enzymatic activity that cleaves specific linkages in substrates such as mucin, a component of the human intestinal tract, and human milk oligosaccharides (HMOs), which are crucial for the growth of certain gut bacteria in breast-fed infants. The enzymes function by breaking down complex carbohydrates into simpler sugars, playing a significant role in the digestive process and the utilization of nutrients. They display varying substrate specificities and are subject to regulation by different metal ions, with some members being inhibited by ions such as Mn(2+) and Ca(2+), while others are unaffected by Na(+), K(+), and Mg(2+) ions.
    source: "InterPro:IPR052764 abstract (LLM-generated, not curator-reviewed)"
