  - kind: GENERAL
    text: >-
      WD REPEAT-CONTAINING PROTEIN 48 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19862. Members are annotated with the molecular function protein binding, ubiquitin-like protein binding, ubiquitin binding. and participate in cellular aromatic compound metabolic process, cellular response to stimulus, double-strand break repair.
