identifier: PANTHER:PTHR15853
label: THIOREDOXIN-RELATED
definition: >-
  TMX2 contain the TRX domain, an N-terminal signal peptide, a potential transmembrane domain, an Myb DNA-binding domain repeat signature, an endoplasmic reticulum (ER) membrane retention signal (KKXX-like motif), and a dileucine motif in the tail. In TMX2, the TRX domain redox active CXXC motif is replaced with SXXC. Homologues are found only in metazoa. It is an ER and mitochondria-associated protein that may function as a regulator of cellular redox state and thereby regulates protein post-translational modification, protein folding and mitochondrial activity. It indirectly regulates neuronal proliferation, migration, and organization in the developing brain.
