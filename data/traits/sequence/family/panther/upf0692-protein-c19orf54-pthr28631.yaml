identifier: PANTHER:PTHR28631
label: "UPF0692 PROTEIN C19ORF54"
definition: >-
  This entry represents a group of animal proteins that includes the human protein ACTMAP (actin maturation protease, also known as C19orf54), its homologues from vertebrates, and the orthologue protein CG33108 from Drosophila melanogaster. ACTMAP is responsible for the non canonical excision of the acetylated methionine of actin molecules after translation. It seems to have a crucial effect in all cell types.
