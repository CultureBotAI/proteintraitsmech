  - kind: GENERAL
    text: >-
      The Peptidase M1 family is characterized by a broad specificity for aminopeptidase activity, playing a role in the digestion of peptides from hydrolyzed proteins by gastric and pancreatic proteases. Members are involved in processing various peptides, including peptide hormones, neuropeptides, and chemokines. They participate in antigen presentation, angiogenesis, cholesterol crystallization, and may regulate amino acid transport. Some act as receptors for coronaviruses, influencing microbial infection. The family includes enzymes that degrade oligopeptides, inactivate peptide hormones, and are implicated in blood pressure regulation, embryonic development, and immune responses.
