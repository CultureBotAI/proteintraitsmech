identifier: PANTHER:PTHR30433
label: "CHEMOTAXIS PROTEIN MOTA"
definition: >-
  This family represents a group of bacterial proteins that are required for the rotation of the flagellar motor, which probably forms a transmembrane proton channel used to energize the flagellar rotary motor. This entry includes MotA and related proteins, such as PomA and LafT. These are integral membrane proteins that contains four transmembrane domains.
