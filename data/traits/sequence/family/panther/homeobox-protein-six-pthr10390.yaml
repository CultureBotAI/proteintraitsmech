identifier: PANTHER:PTHR10390
label: "HOMEOBOX PROTEIN SIX"
definition: >-
  HOMEOBOX PROTEIN SIX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10390. PANTHER protein class: DNA-binding transcription factor, homeodomain transcription factor, helix-turn-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, transcription regulator activity, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of DNA-templated transcription. Members localise to membrane-bounded organelle, cellular anatomical entity, protein-containing complex.
