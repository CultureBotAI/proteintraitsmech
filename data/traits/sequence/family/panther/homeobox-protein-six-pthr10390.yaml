identifier: PANTHER:PTHR10390
label: "HOMEOBOX PROTEIN SIX"
definition: >-
  HOMEOBOX PROTEIN SIX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10390. PANTHER protein class: DNA-binding transcription factor, homeodomain transcription factor, helix-turn-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure, transcription regulator complex.
