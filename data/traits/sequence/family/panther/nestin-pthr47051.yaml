identifier: PANTHER:PTHR47051
label: NESTIN
definition: >-
  Nestin is an intermediate filament protein. However, nestin cannot form homodimers to form intermediate filaments due to its short N-terminal; it can only form heterodimers and heterotetramers by binding with other intermediate filament proteins, particularly the class 3 proteins vimentin and alpha-internexin. It is believed to be a neural stem cell marker during central nervous system (CNS) development, although it is also expressed in other tissues. Nestin has been found to be involved in tumour angiogenesis.
