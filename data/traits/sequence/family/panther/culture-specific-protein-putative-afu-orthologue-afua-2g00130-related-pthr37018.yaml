identifier: PANTHER:PTHR37018
label: "CULTURE SPECIFIC PROTEIN, PUTATIVE (AFU_ORTHOLOGUE AFUA_2G00130)-RELATED"
definition: >-
  This entry includes L-amino acid ligases that catalyse the ATP-dependent formation of dipeptides, specifically L-aspartyl-L-methionine. They exhibit substrate specificity, showing higher activity with L-aspartate and L-methionine, and reduced activity with other amino acid combinations. These enzymes do not function with L-methionine analogs or when key functional groups on the substrates are modified. They are also nucleotide-specific, requiring ATP and not other nucleoside triphosphates. These proteins play a role in sulfur amino acid metabolism.
