identifier: PANTHER:PTHR15458
label: "PHOSPHATIDYLETHANOLAMINE N-METHYLTRANSFERASE"
definition: >-
  This family includes yeast phosphatidyl-N-methylethanolamine N-methyltransferase CHO1/OPI3 and vertebrates phosphatidylethanolamine N-methyltransferases. In yeast, this enzyme catalyzes the second two steps of the methylation pathway of phosphatidylcholine (PC) biosynthesis, the SAM-dependent methylation of phosphatidylmonomethylethanolamine (PMME) to phosphatidyldimethylethanolamine (PDME) and of PDME to PC. In vertebrates, it catalyzes the three sequential steps of the methylation pathway of phosphatidylcholine biosynthesis, the SAM-dependent methylation of phosphatidylethanolamine (PE) to phosphatidylmonomethylethanolamine (PMME), PMME to phosphatidyldimethylethanolamine (PDME), and PDME to PC.
definition_source: "InterPro:IPR024960 abstract (PANTHER PTHR15458 is a member signature)"
