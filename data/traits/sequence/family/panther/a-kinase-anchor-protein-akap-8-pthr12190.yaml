identifier: PANTHER:PTHR12190
label: "A-KINASE ANCHOR PROTEIN  AKAP  8"
definition: >-
  A-kinase (or PKA)-anchoring protein AKAP95 is implicated in mitotic chromosome condensation by acting as a targeting molecule for the condensin complex. The protein contains two zinc fingers which are thought to mediate the binding of AKAP95 to DNA.
