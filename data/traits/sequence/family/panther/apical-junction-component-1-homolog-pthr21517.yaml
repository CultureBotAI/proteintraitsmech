identifier: PANTHER:PTHR21517
label: "APICAL JUNCTION COMPONENT 1 HOMOLOG"
definition: >-
  This entry represents a family of proteins known variously as apical junction molecule, or apical junction component. In Caenorhabditis elegans, the coiled-coil protein Ajm-1 (apical junction molecule) controls epithelial junction integrity. Its localization to apical junctions is regulated by proteins LET-413 and DLG-1.
