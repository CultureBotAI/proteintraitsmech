identifier: PANTHER:PTHR13511
label: "KXDL MOTIF-CONTAINING PROTEIN 1"
definition: >-
  KXD1 is part of the BORC complex that may regulate lysosome positioning. This entry also includes CG10681 from fruit flies and KxDL motif-containing protein LO9-177 from rice. LO9-177 contributes to the promotion of leaf inclination and grain size by modulating cell elongation.
