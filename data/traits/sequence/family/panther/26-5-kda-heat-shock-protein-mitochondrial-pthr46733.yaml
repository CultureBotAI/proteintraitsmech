identifier: PANTHER:PTHR46733
label: "26.5 KDA HEAT SHOCK PROTEIN, MITOCHONDRIAL"
definition: >-
  This entry represents a group of heat shock proteins, including HSP21 from Arabidopsis. HSP21 interacts with plastid nucleoid protein pTAC5 and is essential for chloroplast development under heat stress by maintaining PEP (plastid-encoded RNA polymerase) function. This family also includes small heat shock proteins from bacteria.
