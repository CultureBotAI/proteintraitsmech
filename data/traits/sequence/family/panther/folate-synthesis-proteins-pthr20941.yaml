identifier: PANTHER:PTHR20941
label: "FOLATE SYNTHESIS PROTEINS"
definition: >-
  Dihydropteroate synthase ( EC:2.5.1.15 ) (DHPS), a functional homodimer, catalyses the condensation of 6-hydroxymethyl-7,8-dihydropteridine pyrophosphate to para-aminobenzoic acid to form 7,8-dihydropteroate. This is the second step in the three-step pathway leading from 6-hydroxymethyl-7,8-dihydropterin to 7,8-dihydrofolate. DHPS is the target of sulfonamides, which are substrate analogues that compete with para-aminobenzoic acid. Bacterial DHPS (gene sul or folP) is a protein of about 275 to 315 amino acid residues that is either chromosomally encoded or found on various antibiotic resistance plasmids. In the lower eukaryote Pneumocystis carinii, DHPS is the C-terminal domain of a multifunctional folate synthesis enzyme (gene fas). Prokaryotes (and some lower eukaryotes) must synthesize folate de novo, while higher eukaryotes are able to utilize dietary folate and therefore lack DHPS. This entry also includes the uncharacterised protein MJ0107 from Methanocaldococcus jannaschii ( UniProtKB:Q57571 ), which does not possess DHPS activity.
definition_source: "InterPro:IPR045031 abstract (PANTHER PTHR20941 is a member signature)"
