identifier: PANTHER:PTHR46640
label: "TRIACYLGLYCEROL LIPASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_6G06510)-RELATED"
definition: >-
  This entry represents a group of fungal proteins with an α/β hydrolase fold. Members of this family are involved in the hydrolysis of various ester bonds, playing roles in plant virulence, degradation of plant cell walls, and lipid metabolism. Members of the family exhibit lipase activity, targeting mono-, di-, and triacylglycerols, as well as esterase activity, hydrolysing ester bonds in arabinoxylans and pectin. Some proteins prefer specific substrates, such as p-nitrophenyl esters or acetylated compounds, and may be involved in pathogenicity by affecting plant defence mechanisms. Activity regulation is observed with inhibitors like ebelactone B or metal ions, and substrate specificity can be influenced by residues near the active site.
definition_source: "InterPro:IPR051299 abstract (PANTHER PTHR46640 is a member signature)"
