identifier: PANTHER:PTHR12444
label: "PROTEIN EFR3 HOMOLOG CMP44E"
definition: >-
  This family of proteins is involved in the regulation of phosphatidylinositol 4-phosphate (PtdIns(4)P) synthesis. Members of this family are components of a complex that is required for the localization of phosphatidylinositol 4-kinase (PI4K) to the plasma membrane. Within this complex, these proteins likely serve as the membrane-anchoring components. Additionally, they may play a role in cellular responsiveness to G-protein-coupled receptors, although the specifics of this function are not fully understood and may be indirect. Some members are essential for embryogenesis and cell viability.
