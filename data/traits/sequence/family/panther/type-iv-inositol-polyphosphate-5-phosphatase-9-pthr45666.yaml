identifier: PANTHER:PTHR45666
label: "TYPE IV INOSITOL POLYPHOSPHATE 5-PHOSPHATASE 9"
definition: >-
  This entry represents a group of plant inositol polyphosphate 5-phosphatases (IP5Ps), including IP5P1-10 from Arabidopsis. IP5P1 has phosphatase activity toward Ins(1,4,5)P3 and Ins(1,3,4,5)P4, but not toward Ins(1,4)P2, Ins1P. It can also hydrolyze PtdIns(4,5)P2 and PtdIns(3,4,5)P3.
