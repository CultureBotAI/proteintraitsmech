identifier: PANTHER:PTHR13034
label: "DYNACTIN P62 SUBUNIT"
definition: >-
  DCTN4 (also known as dynactin subunit p62) is a subunit of the dynactin that may have a dual role in dynein targeting and in ACTR1A/Arp1 subunit of dynactin pointed-end capping. It could be involved in ACTR1A pointed-end binding and in additional roles in linking dynein and dynactin to the cortical cytoskeleton. It also interacts with the N terminus of P-type ATPase ATP7B.
