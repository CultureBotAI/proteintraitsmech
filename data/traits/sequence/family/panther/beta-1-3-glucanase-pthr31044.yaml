identifier: PANTHER:PTHR31044
label: "BETA-1,3 GLUCANASE"
definition: >-
  This entry represents a group of plant proteins, including Ole e 10 from Olea europaea (Common olive), and PLASMODESMATA CALLOSE-BINDING PROTEIN 1-8 (PDCB1-8)/CBX8D from Arabidopsis. They contain the carbohydrate-binding module, which is the most common non-catalytic module associated with enzymes active in plant cell-wall hydrolysis. Ole e 10 has been shown to bind preferentially 1,3-beta-glucans. It is a major pollen allergen that may be involved in pollen tube wall re-formation during germination. In Arabidopsis, PDCBs may be involved in cell-to-cell trafficking regulation.
definition_source: "InterPro:IPR044788 abstract (PANTHER PTHR31044 is a member signature)"
