  - kind: GENERAL
    text: >-
      The protein family encompasses diverse functions, including the promotion of linker cell survival and its non-apoptotic death in nematodes, acting as a coactivator in the transcription of RNA polymerase II-dependent genes in slime molds, and involvement in chloroplast RNA splicing in green algae. In nematodes, the family is implicated in nuclear envelope dynamics during specific cell death processes. In slime molds, it is essential for the starvation-induced gene expression pathway. In green algae, it is crucial for the trans-splicing of chloroplast-encoded mRNA, suggesting a role in chloroplast RNA stability and processing.
