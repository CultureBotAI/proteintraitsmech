  - kind: GENERAL
    text: >-
      The Sorting Nexin/PX Domain-Containing Protein Kinase-Like family is involved in various stages of intracellular trafficking, including protein transport from early to late endosomes and to the lysosome, potentially influencing the degradation of EGFR after EGF signaling. Members of the family may also play a role in the intracellular transport of viral nucleocapsids and modulate brain Na,K-ATPase subunits, impacting electrical excitability and synaptic transmission. Additionally, some members are associated with the regulation of calcium-activated channels, altering voltage sensitivity. The family includes proteins with a PX domain that interacts with phosphatidylinositol 3-phosphate enriched membranes, and some members are predicted to have an inactive protein kinase domain.
    source: "InterPro:IPR051837 abstract (LLM-generated, not curator-reviewed)"
