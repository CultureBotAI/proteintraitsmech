  - kind: GENERAL
    text: >-
      The Zinc finger protein 385 family is involved in various cellular processes, including apoptosis, mRNA localization and translation, cell cycle arrest, and differentiation. Members of this family may influence p53/TP53-mediated apoptosis and have roles in RNA-binding that affect mRNA translation and localization, such as with CEBPA and ITPR1 mRNAs. They are implicated in adipogenesis, neuron-specific functions, and may interact with ELAVL1 to control nuclear export of p53/TP53 mRNAs. Some family members can bind directly to p53/TP53, enhancing its role in cell-cycle arrest over apoptosis, and may also affect the ubiquitination and stability of CDKN1A. Additionally, they contribute to megakaryocyte differentiation.
    source: "InterPro:IPR051845 abstract (LLM-generated, not curator-reviewed)"
