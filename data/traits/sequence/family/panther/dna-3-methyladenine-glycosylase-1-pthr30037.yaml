identifier: PANTHER:PTHR30037
label: "DNA-3-METHYLADENINE GLYCOSYLASE 1"
definition: >-
  This family of proteins is involved in the repair of damaged DNA. Members of this family are enzymes that recognize and excise 3-methyladenine, a non-bulky alkylated base, from the DNA helix. This is achieved through the hydrolysis of the deoxyribose N-glycosidic bond. The excision of this lesion is crucial for maintaining the integrity of the genetic material and preventing mutations that could lead to cell death or oncogenesis. The enzymatic activity of these proteins is subject to regulation, with product inhibition being a reported mechanism to control their function.
