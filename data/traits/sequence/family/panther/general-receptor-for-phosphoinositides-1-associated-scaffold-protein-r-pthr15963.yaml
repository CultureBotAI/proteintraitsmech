  - kind: GENERAL
    text: >-
      This family of proteins is involved in intracellular trafficking and the organization of membrane receptors. Members are known to interact with cytohesins, influencing ARF protein activation and potentially sequestering cytohesins in the cytoplasm to regulate their function. Some family members are implicated in synaptic processes, specifically in the organization of metabotropic glutamate receptors, which are critical for synaptic signaling. Others play a role in meiotic events, such as chromosome pairing and DNA repair during prophase I, and may also limit chromosome movement in a dynein-dependent manner. The diverse functions suggest a broad role in cellular organization and signaling.
    source: "InterPro:IPR052122 abstract (LLM-generated, not curator-reviewed)"
