identifier: PANTHER:PTHR15600
label: SACSIN
definition: >-
  The Sacsin protein family includes co-chaperones that regulate the Hsp70 chaperone machinery. Members of this family are involved in the processing of proteins linked to ataxia, a neurological disorder affecting coordination. Sacsin proteins contain a functional J domain that stimulates ATPase activity of bacterial dnaK, a homolog of Hsp70, indicating a direct role in chaperone-mediated protein folding. Additionally, they possess a ubiquitin-like domain that mediates interactions with the proteasome, suggesting a role in protein degradation or quality control. The dual functionality of these domains implies a complex role in maintaining cellular proteostasis, particularly in the nervous system where misfolded proteins can lead to disease.
