identifier: PANTHER:PTHR31448
label: "MYOSIN-BINDING PROTEIN 2"
definition: >-
  This entry represents a group of plant myosin-binding protein (MYOB), including MYOB1-6. They are membrane-anchored myosin receptors that define a distinct, plant-specific transport vesicle compartment.
