identifier: PANTHER:PTHR22602
label: "TRANSFERASE CAF17, MITOCHONDRIAL-RELATED"
definition: >-
  This entry includes glycine cleavage system T proteins (GcvT) and the bacterial tRNA-modifying protein YgfZ. This entry also includes Iron-sulfur cluster assembly factor IBA57 homolog, mitochondrial (CAF17) proteins from eukaryotes. YgfZ is a folate-binding protein involved in regulating the level of ATP-dnaA and in the modification of some tRNAs. It is probably a key factor in regulatory networks that act via tRNA modification, such as initiation of chromosomal replication.
