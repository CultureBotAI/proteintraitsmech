identifier: PANTHER:PTHR46189
label: LD41958P
definition: >-
  This entry represents a group of WD repeat and FYVE domain-containing proteins, including WDFY1 and WDFY2. WDFY1 mediates TLR3/4 signalling by recruiting TRIF. WDFY2, also known as Prof (propeller-FYVE protein), is involved in endocytosis.
