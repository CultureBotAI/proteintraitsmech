identifier: PANTHER:PTHR36700
label: "CRISPR SYSTEM CMR SUBUNIT CMR4"
definition: >-
  This entry represents the CRISPR system Cmr endoribonuclease Cmr4 which is part of the broad RAMP superfamily collection of CRISPR-associated proteins. The Cmr complex is an RNA-guided endonuclease that cleaves foreign RNA targets as part of the CRISPR prokaryotic defense system. Cmr4 is required for target-cleavage activity, identified as the conserved endoribonuclease of the Cmr complex. The CRISPR-Cas system is a prokaryotic defence mechanism against foreign genetic elements. The key elements of this defence system are the Cas proteins and the CRISPR RNA.
