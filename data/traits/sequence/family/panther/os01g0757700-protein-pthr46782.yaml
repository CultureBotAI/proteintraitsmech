identifier: PANTHER:PTHR46782
label: "OS01G0757700 PROTEIN"
definition: >-
  This entry represents a group of plant pentatricopeptide repeat-containing proteins, including EMB1417 (At4g21190) and At4g18975 from Arabidopsis. The EMB1417 gene has been identified as the EMBRYO-DEFECTIVE (EMB) gene.
