identifier: PANTHER:PTHR12451
label: "TRANSCRIPTION FACTOR CASTOR  PROTEIN MING -RELATED"
definition: >-
  CASZ1 is an evolutionarily conserved zinc-finger transcription factor. It acts as a transcriptional activator involved in vascular assembly and morphogenesis through regulating EGFL7. CASZ1 interacts with the polycomb repressor complex in a splice variant-specific manner and controls rod genome organisation. It also regulates the Th17/Th1/regulatory cell differentiation program.
