identifier: PANTHER:PTHR43269
label: "SODIUM/PROTON ANTIPORTER 1-RELATED"
definition: >-
  This entry includes Na(+)/H(+) antiporter NhaD from bacteria and its homologue, NHD1/2 from Arabidopsis. In Vibrio cholerae, NhaD is a Na(+)/H(+) antiporter with a sharp maximum of activity at pH approximately 8.0. NhaD homologues have been found in plants. Physcomitrella patens PpNHAD1 has been shown to serve as a chloroplast transporter. Expression of Mesembryanthemum crystalllinum NHAD has been shown to complement the Escherichia coli NhaA NhaB mutant, which lacks endogenous Na(+)/H(+) antiporters. Arabidopsis NHD1 functions as a chloroplast sodium exporter and protects chloroplasts from deleterious Na+ concentrations after salt exposure.
