  - kind: GENERAL
    text: >-
      This family of proteins is involved in the processing of pre-messenger RNA (pre-mRNA) within the nucleus of eukaryotic cells. Members of this family form complexes with heterogeneous nuclear RNA and other ribonucleoproteins, contributing to the formation of ribonucleosomes. These complexes are essential for the packaging of pre-mRNA into particles known as heterogeneous nuclear ribonucleoprotein (hnRNP) particles. Additionally, these proteins play a role in the transport of polyadenylated mRNA from the nucleus to the cytoplasm and are implicated in the regulation of alternative splicing by potentially influencing splice site selection.
