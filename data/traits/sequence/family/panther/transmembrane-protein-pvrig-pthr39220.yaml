identifier: PANTHER:PTHR39220
label: "TRANSMEMBRANE PROTEIN PVRIG"
definition: >-
  The human transmembrane protein (PVRIG) is a cell surface receptor for NECTIN2. It may act as a coinhibitory receptor that suppresses T-cell receptor-mediated signals. It competes with CD226 to bind to CD112
