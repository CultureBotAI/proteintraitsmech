definitions:
  - kind: GENERAL
    text: >-
      PREPHENATE DEHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21363. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function nucleoside phosphate binding, nucleotide binding, heterocyclic compound binding. and participate in organic acid biosynthetic process, cellular aromatic compound metabolic process, aromatic amino acid family biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The prephenate/arogenate dehydrogenase family consists of enzymes involved in the biosynthesis of aromatic amino acids, primarily tyrosine. Members of this family catalyze the NAD(+)-dependent oxidative decarboxylation of prephenate to form 4-hydroxyphenylpyruvate, a key step in the pathway. Some enzymes within this family can also catalyze the conversion of arogenate to tyrosine. These enzymes play a regulatory role in controlling the levels of tyrosine within the cell. Additionally, certain members are involved in the biosynthesis of secondary metabolites, such as antibiotics like novobiocin and chloramphenicol, by catalyzing the formation of specific intermediates. The family is characterized by a lack of chorismate mutase activity in some bacterial members, distinguishing them from bifunctional enzymes that possess both prephenate dehydrogenase and chorismate mutase activities.
    source: "InterPro:IPR050812 abstract (LLM-generated, not curator-reviewed)"
