identifier: PANTHER:PTHR31351
label: "EXPRESSED PROTEIN"
definition: >-
  This entry represents a group of plant proteins, including VAN3-binding protein (VAB, also known as FORKED1 or AT3G63300) from Arabidopsis. FORKED1 is a PH domain protein required for PIN1 localization in developing leaf veins. It interacts with SCARFACE/VAN3 (SFC), an ADP ribosylation factor GTPase-activating protein (ARF-GAP) important for vein patterning.
