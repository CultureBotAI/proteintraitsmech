identifier: PANTHER:PTHR10598
label: "SET1/ASH2 HISTONE METHYLTRANSFERASE COMPLEX SUBUNIT ASH2"
definition: >-
  The trithorax-group (trxG) protein Ash2 from C. elegans (or ASH2L in mammals) is a component of the Set1/Ash2 histone methyltransferase (HMT) complex that methylates 'Lys-4' of histone H3, a mark associated with epigenetic transcriptional activation. Mammals posses several SET1 family proteins (MLL1-4, SET1A, and SET1B). ASH2L is a core component of all the resulting mammalian histone H3K4 methyltransferase complexes, including mixed lineage leukemia (MLL) complexes. S. cerevisiae Bre2 and Aspergillus fumigatus CclA are homologous to Ash2. TRAUCO (TRO) is the homologue from Arabidopsis, which is required for early embryogenesis.
definition_source: "InterPro:IPR037353 abstract (PANTHER PTHR10598 is a member signature)"
