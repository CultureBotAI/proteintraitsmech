identifier: PANTHER:PTHR16082
label: "AP-5 COMPLEX SUBUNIT MU-1"
definition: >-
  AP5M1, also known as MUDENG, is part of AP-5, a probable fifth adaptor protein complex that may be involved in endosomal transport. AP5M1 is involved in cell death signaling.
