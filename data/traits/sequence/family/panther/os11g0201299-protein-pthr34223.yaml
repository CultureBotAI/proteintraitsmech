  - kind: GENERAL
    text: >-
      This family of proteins includes members that are likely part of the SCF (SKP1-CULLIN-F-box) E3 ubiquitin-protein ligase complex, suggesting a role in the ubiquitin-mediated protein degradation or signaling pathways. They are implicated in male meiotic prophase I progression, including telomere bouquet formation, homologous chromosome pairing, and synaptonemal complex formation, which is crucial for stabilizing chromosomal associations and promoting crossover events. Additionally, these proteins are involved in meiotic DNA double-strand break repair, playing a role in the recruitment of repair proteins to the sites of DNA damage.
