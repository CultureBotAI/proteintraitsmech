identifier: PANTHER:PTHR12639
label: "VITAMIN K-DEPENDENT GAMMA-CARBOXYLASE"
definition: >-
  Using reduced vitamin K, oxygen, and carbon dioxide, gamma-glutamyl carboxylase post-translationally modifies certain glutamates by adding carbon dioxide to the γ position of those amino acids. In vertebrates, the modification of glutamate residues of target proteins is facilitated by an interaction between a propeptide present on target proteins and the gamma-glutamyl carboxylase.
