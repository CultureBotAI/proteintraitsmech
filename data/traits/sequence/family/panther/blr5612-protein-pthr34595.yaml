identifier: PANTHER:PTHR34595
label: "BLR5612 PROTEIN"
definition: >-
  This family of proteins includes ATP-dependent carboxylate-amine ligases with a weak activity as glutamate--cysteine ligases. Members of this family are involved in the catalysis of the ligation of glutamate and cysteine, a key step in the biosynthesis of glutathione, although the activity appears to be weak. The family is part of the YbdK subfamily, which suggests a conserved function or structural domain within this group.
