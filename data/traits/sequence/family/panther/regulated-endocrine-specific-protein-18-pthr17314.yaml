identifier: PANTHER:PTHR17314
label: "REGULATED ENDOCRINE SPECIFIC PROTEIN 18"
definition: >-
  Regulated endocrine-specific protein 18 (RESP18) is a major glucocorticoid-responsive protein that is mainly distributed in the peripheral endocrine and neuroendocrine tissues. The protein shares sequence homology with the luminal region of IA-2, a dense core vesicle (DCV) transmembrane protein involved in insulin secretion. The function of RESP18 is unknown, but it may may play an important regulatory role in corticotrophs and peptidergic neurons.
definition_source: "InterPro:IPR024833 abstract (PANTHER PTHR17314 is a member signature)"
