identifier: PANTHER:PTHR14716
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 69"
definition: >-
  Cilia- and flagella-associated protein 69 (CFA69) is required for sperm flagellum assembly/stability. Truncating mutations of this protein induce autosomal-recessive MMAF (multiple morphological abnormalities of the flagella) and primary male infertility. In mice, it regulates the speed of activation and termination of the odour response and, thus, contributes to the robustness of olfactory transduction pathways.
