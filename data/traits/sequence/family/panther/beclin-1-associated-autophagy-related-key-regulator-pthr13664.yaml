identifier: PANTHER:PTHR13664
label: "BECLIN 1-ASSOCIATED AUTOPHAGY-RELATED KEY REGULATOR"
definition: >-
  BECLIN 1-ASSOCIATED AUTOPHAGY-RELATED KEY REGULATOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13664. Members are annotated with the molecular function kinase regulator activity, protein-membrane adaptor activity. Members participate in autophagosome assembly, cellular response to starvation, mitophagy. Members localise to autophagosome, phosphatidylinositol 3-kinase complex, class III, bounding membrane of organelle.
