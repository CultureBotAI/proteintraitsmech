identifier: PANTHER:PTHR19868
label: "RECEPTOR FOR ACTIVATED PROTEIN KINASE C  RACK1"
definition: >-
  This entry includes the small ribosomal subunit protein RACK1 from eukaryotes, previously known as guanine nucleotide-binding protein subunit beta-like (also known as Asc1 in yeast). They are core 40S ribosomal proteins that repress gene expression and involved in induction of the ribosome quality control (RQC) pathway, a pathway that degrades nascent peptide chains during problematic translation. The seven-bladed β-propeller structure of RACK1 is located near the mRNA exit tunnel where it makes contacts with the ribosomal RNA through lysine and arginine residues and neighbouring ribosomal proteins. Asc1/RACK1 are key factors in phosphosignaling and functions as a control point at the head of the ribosomal 40S subunit itself regulated through posttranslational modification. RACK1 also serves as a scaffold protein that can recruit other proteins to the ribosome and also for a wide range of kinases and membrane bound receptors. It has been shown to regulates axonal growth and is essential for development in mice, Drosophila melanogaster and Arabidopsis thaliana. This entry also includes MIP11, a RACK1 orthologue.
definition_source: "InterPro:IPR045223 abstract (PANTHER PTHR19868 is a member signature)"
