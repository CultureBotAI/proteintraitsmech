identifier: PANTHER:PTHR31415
label: "OS05G0367900 PROTEIN"
definition: >-
  This entry represents a group of plant NDR1-like proteins. In Arabidopsis, NDR1 is involved in disease resistance. It interacts with RIN4 and mediates the differential activation of multiple disease resistance pathways in Arabidopsis.
