  - kind: GENERAL
    text: >-
      This family of proteins is involved in the cellular response to oxidative DNA damage. Members of this family function as DNA repair enzymes that recognize and excise oxidized DNA bases, specifically 7,8-dihydro-8-oxoguanine (8-oxoG) and 2,6-diamino-4-hydroxy-5-N-methylformamidopyrimidine (FAPY). They exhibit a beta-lyase activity that cleaves the DNA backbone 3' to the damaged site, facilitating the removal of the lesion and subsequent DNA repair processes. The ability to repair oxidative DNA damage is crucial for maintaining genomic stability and preventing mutagenesis.
    source: "InterPro:IPR052054 abstract (LLM-generated, not curator-reviewed)"
