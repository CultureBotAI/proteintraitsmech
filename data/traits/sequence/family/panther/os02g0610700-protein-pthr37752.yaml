    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the photoprotection and assembly of photosystem II (PSII) as well as in the biogenesis and repair processes of PSII. They can form trimeric complexes with other proteins that are essential for the early assembly of PSII and its repair, and are also involved in the recruitment of ribosomes to specific mRNAs during these processes. Additionally, some members are thought to function in the delivery of pigments to PSII subunits and may bind chlorophylls and carotenoids. Others are putative zeaxanthin binding proteins that may form photoprotective complexes within the light-harvesting antennae.
    source: "InterPro:IPR053091 abstract (LLM-generated, not curator-reviewed)"
