identifier: PANTHER:PTHR13769
label: "APOLIPOPROTEIN B"
definition: >-
  The Apolipoprotein B family comprises proteins that are key constituents of lipoprotein particles such as chylomicrons, LDL, and VLDL. Members of this family, including Apolipoprotein B-100, play a crucial role in lipid transport and metabolism. They are recognized by the apoB/E receptor, which facilitates the cellular uptake of LDL particles. This process is essential for maintaining lipid homeostasis and is implicated in the pathogenesis of atherosclerosis due to the accumulation of LDL in blood vessels.
