identifier: PANTHER:PTHR13287
label: "ADIPOSE-SECRETED SIGNALING PROTEIN"
definition: >-
  This family represents the adipocyte-secreted protein (adipokine) formerly known as UPF0687, that acts as a key regulator for white adipose tissue (WAT) thermogenesis and glucose homeostasis at least in part through activation of protein kinase A (PKA). This protein is adipose-specific, highly expressed in brown adipose tissue.
definition_source: "InterPro:IPR026794 abstract (PANTHER PTHR13287 is a member signature)"
