identifier: PANTHER:PTHR46914
label: "BACULOVIRAL IAP REPEAT-CONTAINING PROTEIN 1"
definition: >-
  Baculoviral IAP repeat-containing protein 1 or neuronal apoptosis inhibitory protein (NAIP) is an anti-apoptotic protein which acts by inhibiting the activities of CASP3, CASP7 and CASP9. NAIP contains three baculoviral IAP repeat (BIR) domains at the amino-terminal region and a ATP/GTP binding site. NAIP has been shown to inhibit apoptosis in neurons and in several mammalian cell lines.
