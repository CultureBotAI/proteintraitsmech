identifier: PANTHER:PTHR14063
label: "PROTEIN LIN-7 HOMOLOG"
definition: >-
  This family of proteins is involved in the establishment and maintenance of the asymmetric distribution of channels and receptors at the plasma membrane of polarized cells. They form membrane-associated multiprotein complexes that may regulate the delivery and recycling of proteins to their correct membrane domains. These proteins are known to interact with components such as CASK and APBA1, and are involved in the transport of vesicles containing specific receptor subunits along microtubules. They play a crucial role in synaptic vesicle exocytosis and cell adhesion in the brain, ensuring the proper localization of various receptors to neuronal postsynaptic densities. Additionally, they are required for the localization of certain channels and transporters to the basolateral membrane of epithelial cells, which may affect the amplitude of specific ion channel currents by stabilizing these channels at the cell surface.
