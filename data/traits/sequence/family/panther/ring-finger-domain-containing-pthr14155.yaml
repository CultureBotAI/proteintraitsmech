  - kind: GENERAL
    text: >-
      This family of proteins includes members that contain a RING-type zinc finger domain, which is characteristic of a group of E3 ubiquitin ligases. These proteins are involved in the ubiquitination pathway, where they play a role in the transfer of ubiquitin from an E2 ubiquitin-conjugating enzyme to specific substrate proteins. This post-translational modification can lead to various outcomes, including the targeted degradation of proteins via the 26S proteasome, alteration of cellular location, or modulation of activity and interactions of the substrate proteins. The RING-type zinc finger domain is crucial for the interaction with the E2 enzyme and is a defining feature of this protein family.
    source: "InterPro:IPR053238 abstract (LLM-generated, not curator-reviewed)"
