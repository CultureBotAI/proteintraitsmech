identifier: PANTHER:PTHR45858
label: "FERM DOMAIN CONTAINING PROTEIN"
definition: >-
  This family of proteins includes guanine nucleotide exchange factors (GEFs) that specifically activate the GTPase RAC1, influencing various cellular processes. Members are involved in semaphorin signaling, which is critical for axonal guidance and neuronal development. They play significant roles in the assembly and disassembly of dendritic filopodia, spine formation, dendrite length regulation, and synapse formation. Some family members are implicated in the remodeling of the actin cytoskeleton, integrin signaling, cell adhesion, and osteoclast differentiation. Additionally, certain proteins within this family contribute to neurite development and the control of eye movement and gaze stability. A common feature is the presence of an intramolecular interaction between the DH domain and the PH domains, which can stabilize these proteins in an autoinhibited conformation, regulating their activity.
