identifier: PANTHER:PTHR45942
label: "PROTEIN PHOSPATASE 3 REGULATORY SUBUNIT B ALPHA ISOFORM TYPE 1"
definition: >-
  PROTEIN PHOSPATASE 3 REGULATORY SUBUNIT B ALPHA ISOFORM TYPE 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45942. Members are annotated with the molecular function phosphatase binding, protein binding, protein phosphatase regulator activity. Members participate in calcium-mediated signaling, macromolecule metabolic process, regulation of cellular process. Members localise to protein serine/threonine phosphatase complex, intracellular protein-containing complex.
