identifier: PANTHER:PTHR46803
label: "E3 UBIQUITIN-PROTEIN LIGASE CHIP"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE CHIP — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46803. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity, protein-folding chaperone binding. Members participate in positive regulation of proteolysis, proteasome-mediated ubiquitin-dependent protein catabolic process, protein polyubiquitination. Members localise to cytoplasm.
