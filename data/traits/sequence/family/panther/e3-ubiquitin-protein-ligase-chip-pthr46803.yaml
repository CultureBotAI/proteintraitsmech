identifier: PANTHER:PTHR46803
label: "E3 UBIQUITIN-PROTEIN LIGASE CHIP"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE CHIP — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46803. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function acyltransferase activity, ubiquitin-protein transferase activity, protein-folding chaperone binding. and participate in positive regulation of nitrogen compound metabolic process, cellular response to chemical stimulus, protein quality control for misfolded or incompletely synthesized proteins. and localise to cytoplasm.
