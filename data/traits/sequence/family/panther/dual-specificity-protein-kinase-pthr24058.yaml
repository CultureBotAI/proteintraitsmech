  - kind: GENERAL
    text: >-
      DUAL SPECIFICITY PROTEIN KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24058. PANTHER protein class: protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity. Members participate in peptidyl-serine phosphorylation, peptidyl-threonine phosphorylation.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes serine/threonine and dual-specificity kinases that play roles in various cellular processes, including cell cycle regulation, DNA damage repair, transcription regulation, apoptosis, and cytoskeletal organization. Some members are involved in pre-mRNA splicing and stress responses, while others function in developmental processes such as neuronal growth, eye size regulation, and erythroid differentiation. These kinases can phosphorylate a range of substrates, including transcription factors, histones, and other kinases, influencing their activity, stability, and localization. They are also implicated in signaling pathways related to stress granule dynamics, mTORC1 signaling, and proteasomal degradation of key regulatory proteins.
    source: "InterPro:IPR050494 abstract (LLM-generated, not curator-reviewed)"
