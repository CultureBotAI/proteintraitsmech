identifier: PANTHER:PTHR42692
label: "NUCLEOTIDE PYROPHOSPHOHYDROLASE"
definition: >-
  This family represents a group of distantly related to MazG-type NTP pyrophosphohydrolase (NTP-PPase) which contain the conserved residues of the MazG domain (at least three of the Glu residues, Asp, Lys and Arg), including those shown to be functionally important. This entry includes the putative pyrophosphatases YpjD and YvdC from Bacillus subtilis. Although its biological role has not been described in detail, YpjD shows significant sequence similarity to the dimeric 2-deoxyuridine 5'-triphosphate nucleotidohydrolase (dUTP pyrophosphatase or dUTPase) and NTP-PPase MazG proteins. However, unlike typical tandem-domain MazG proteins, BsYpjD contains a single MazG-like domain.
definition_source: "InterPro:IPR047046 abstract (PANTHER PTHR42692 is a member signature)"
