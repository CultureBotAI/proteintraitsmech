identifier: PANTHER:PTHR43004
label: "TRK SYSTEM POTASSIUM UPTAKE PROTEIN"
definition: >-
  This entry represents a family of monooxygenases and aromatic-ring hydroxylases from eukaryotes and bacteria, including Rifampicin monooxygenase from Streptomyces venezuelae (RIFMO), which can modify rifampicin, thereby inactivating its antibiotic activity. The rifampicin monooxygenases are characterised by its ability to modify and inactivate antibiotic compounds through monooxygenase activity. These enzymes are involved in the biosynthesis of various antibiotics, including polyketide antibiotics, and play a role in antibiotic resistance by modifying drugs such as rifampicin, thereby neutralizing their antimicrobial activity. This entry includes enzymes that catalyse hydroxylation reactions, often using FAD as a cofactor and NAD(P)H as an electron donor. These reactions are crucial in the biosynthetic pathways of anthracyclines, tetracyclines, and other aromatic polyketide antibiotics, contributing to their structural diversity and biological activity. Some family members are also involved in the degradation of environmental pollutants, such as pentachlorophenol, indicating a broader role in xenobiotic metabolism.
definition_source: "InterPro:IPR050641 abstract (PANTHER PTHR43004 is a member signature)"
