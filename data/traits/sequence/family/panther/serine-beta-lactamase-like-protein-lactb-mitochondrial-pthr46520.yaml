identifier: PANTHER:PTHR46520
label: "SERINE BETA-LACTAMASE-LIKE PROTEIN LACTB, MITOCHONDRIAL"
definition: >-
  The LACTB family comprises mitochondrial serine proteases that regulate mitochondrial lipid metabolism. These enzymes are involved in modulating the levels of PISD, a key enzyme in the conversion of phosphatidylserine to phosphatidylethanolamine, impacting the lipid composition within mitochondria. The precise mechanism, whether through direct proteolysis of PISD or another lipid metabolism protein, remains unclear. Additionally, members of the LACTB family have been identified as tumor suppressors, capable of inhibiting the proliferation of cancer cells, likely through their role in mitochondrial lipid metabolism regulation.
