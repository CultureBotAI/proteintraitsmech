  - kind: GENERAL
    text: >-
      This family of proteins includes mucin-22, which is a type of glycoprotein typically found in the mucus secreted by epithelial tissues. Mucins are characterized by their high carbohydrate content and are responsible for the gel-like properties of mucus, which serves as a protective barrier against pathogens and helps to keep tissues moist. Mucin-22 may play a role in the immune response by trapping pathogens and preventing their entry into the body. It may also be involved in cell signaling and establishing the viscosity and elasticity of mucus. The exact functions of mucin-22 can vary depending on its specific glycosylation patterns and the tissues in which it is expressed.
    source: "InterPro:IPR053330 abstract (LLM-generated, not curator-reviewed)"
