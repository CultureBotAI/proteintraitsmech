identifier: PANTHER:PTHR39323
label: "BLR1149 PROTEIN"
definition: >-
  This group of conserved proteins from bacteria and archaea contain one copy of the calcineurin-like phosphoesterase domain ( InterPro:IPR004843 ) and possess motifs characteristic of a variety of enzymatically active phosphoesterases, including acid and alkaline phosphatases, phosphoprotein phosphatases, 5'-nucleotidase, bis(5'-nucleosyl)-tetraphosphatase (symmetrical), sphingomyelin phosphodiesterase, 2',3'-cyclic-nucleotide 2'-phosphodiesterase, and 3',5'-nucleotide phosphodiesterase CpdA.
