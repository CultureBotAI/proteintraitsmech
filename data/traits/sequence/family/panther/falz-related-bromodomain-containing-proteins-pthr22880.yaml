definitions:
  - kind: GENERAL
    text: >-
      FALZ-RELATED BROMODOMAIN-CONTAINING PROTEINS — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22880. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function histone binding, modification-dependent protein binding. Members participate in regulation of DNA-templated transcription, chromatin remodeling. Members localise to nucleus, chromosome, chromatin.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The bromodomain-containing protein family is characterized by the presence of bromodomains that specifically bind acetylated lysine residues on histones, facilitating the reading of epigenetic marks and the regulation of gene expression. Members of this family play key roles in chromatin remodeling, transcription regulation, and the maintenance of epigenetic memory across cell divisions. They are involved in various cellular processes including spermatogenesis, folliculogenesis, DNA-damage repair, and transcriptional activation of signal-inducible genes. Some family members also participate in the assembly of nucleosomes and the organization of higher-order chromatin structure. The family includes proteins that act as chromatin readers, recognizing acetylated histones throughout the cell cycle, and contributing to the transmission of epigenetic information and the regulation of transcription in response to external signals.
    source: "InterPro:IPR050935 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
