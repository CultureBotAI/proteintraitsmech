identifier: PANTHER:PTHR21257
label: "DELTA(14)-STEROL REDUCTASE"
definition: >-
  DELTA(14)-STEROL REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21257. PANTHER protein class: reductase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on the CH-CH group of donors, NAD or NADP as acceptor. and participate in sterol metabolic process, organic hydroxy compound metabolic process, biosynthetic process. and localise to nuclear outer membrane-endoplasmic reticulum membrane network, organelle membrane, endoplasmic reticulum subcompartment.
