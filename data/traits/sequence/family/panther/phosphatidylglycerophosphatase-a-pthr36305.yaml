identifier: PANTHER:PTHR36305
label: "PHOSPHATIDYLGLYCEROPHOSPHATASE A"
definition: >-
  This family represents a family of bacterial phosphatidylglycerophosphatases ( EC:3.1.3.27 ), known as PgpA. It appears that bacteria possess several phosphatidylglycerophosphatases, and thus, PgpA is not essential in Escherichia coli.
