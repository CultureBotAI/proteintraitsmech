identifier: PANTHER:PTHR47477
label: "TNF RECEPTOR-ASSOCIATED FACTOR HOMOLOG 1A"
definition: >-
  This family represents TNF receptor-associated factor homolog 1a/b from Arabidopsis thaliana, which function redundantly and are involved in the regulation of plant immune responses and autophagy. Members of this family contribute to the turnover of specific nucleotide-binding domain and leucine-rich repeat-containing (NB-LRR) immune receptors, which are crucial for recognising pathogen-associated molecular patterns and initiating immune responses. They are thought to interact with E3 ubiquitin-protein ligase complexes to modulate the ubiquitination and degradation of these immune receptors, thereby maintaining their homeostasis. Additionally, these proteins function as molecular adapters in autophagy, influencing the stability of ATG6, an essential component of the autophagy machinery. Their role in autophagy also involves cooperation with SINAT1 and SINAT2 for the ubiquitination and destabilisation of ATG6, which is necessary for the proper formation of autophagosomes.
definition_source: "InterPro:IPR055327 abstract (PANTHER PTHR47477 is a member signature)"
