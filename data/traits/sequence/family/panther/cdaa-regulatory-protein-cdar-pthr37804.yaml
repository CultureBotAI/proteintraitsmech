identifier: PANTHER:PTHR37804
label: "CDAA REGULATORY PROTEIN CDAR"
definition: >-
  This family of proteins enhances the enzymatic activity of diadenylate cyclases upon coexpression. Specifically, they can stimulate the production of cyclic di-AMP, a molecule that serves as a second messenger in various cellular processes including growth, DNA repair, and cell wall maintenance. However, an overabundance of cyclic di-AMP can be detrimental to the cell.
