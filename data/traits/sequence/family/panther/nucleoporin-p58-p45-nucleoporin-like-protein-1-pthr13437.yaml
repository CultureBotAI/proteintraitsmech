identifier: PANTHER:PTHR13437
label: "NUCLEOPORIN P58/P45  NUCLEOPORIN-LIKE PROTEIN 1"
definition: >-
  Nucleoporin proteins p58 and p45 are components of the p62 complex, an assembly of four O-linked glycoproteins localised near the central gated channel of the nuclear pore complex, a complex required for the trafficking across the nuclear membrane. The p45 and p58 isoforms are generated by mRNA alternative splicing. This entry also includes Nup58 protein from Drosophila melanogaster, Nup45 from Schizosaccharomyces pombe and NUP49, the fungal counterpart of Nup58.
