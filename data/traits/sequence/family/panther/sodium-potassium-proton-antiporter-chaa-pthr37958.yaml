  - kind: GENERAL
    text: >-
      SODIUM-POTASSIUM/PROTON ANTIPORTER CHAA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR37958. Members are annotated with the molecular function secondary active transmembrane transporter activity, antiporter activity, potassium ion transmembrane transporter activity. Members localise to cell periphery, membrane, plasma membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes cation antiporters that primarily function in the exchange of sodium, potassium, and calcium ions across cellular membranes. Members of this family operate mainly at alkaline pH, where they can export sodium ions and facilitate the exchange of potassium and calcium ions for protons. While the sodium export activity is prominent, these proteins also help cells adapt to potassium salinity stress and maintain potassium homeostasis. The antiporter activity is sensitive to pH levels and is regulated by the presence of magnesium ions, which can inhibit both sodium/proton and calcium/proton exchange. Additionally, the calcium/proton antiporter activity can be inhibited by specific proton ionophores. These proteins are essential for ionic balance and play a role in cellular responses to environmental changes.
    source: "InterPro:IPR052946 abstract (LLM-generated, not curator-reviewed)"
