  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in nucleic acid modification and interaction. One member functions in the CRISPR adaptive immune system, utilizing guide RNAs to identify and cleave foreign DNA sequences in a sequence-specific manner, which is essential for the defense against invading genetic elements like viruses and plasmids. It contains two distinct endonuclease domains that cleave opposite strands of the target DNA. Another member is a restriction enzyme that specifically targets and cleaves DNA containing methylated or hydroxymethylated cytosines within a particular recognition sequence. These activities are crucial for processes such as bacterial immune defense and restriction-modification systems.
