identifier: PANTHER:PTHR12260
label: "DAMAGE-CONTROL PHOSPHATASE ARMT1"
definition: >-
  This family represents Damage-control phosphatases ARMT1, including YMR027W from S. cerevisiae (PDB:3PT1) and human ARMT1 (C6orf211, previously known as Protein-glutamate O-methyltransferase). Despite a first characterization of human ARMT1 as a carboxyl methyltransferase, a second study suggests that these proteins are metal-dependent phosphatases implicated in metabolite damage-control, whose function is to limit potentially harmful buildups of phosphometabolites, in processes termed "damage pre-emption" or "housecleaning".
definition_source: "InterPro:IPR039763 abstract (PANTHER PTHR12260 is a member signature)"
