identifier: PANTHER:PTHR11258
label: "2-5 OLIGOADENYLATE SYNTHETASE"
definition: >-
  2-5 OLIGOADENYLATE SYNTHETASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11258. PANTHER protein class: nucleotidyltransferase. Members are annotated with the molecular function adenylyltransferase activity, RNA binding, transferase activity. Members participate in regulation of hydrolase activity, regulation of macromolecule metabolic process, regulation of RNA metabolic process. Members localise to membrane-enclosed lumen, cytoplasm, cytosol.
