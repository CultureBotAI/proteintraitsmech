identifier: PANTHER:PTHR43452
label: "PYRUVATE DECARBOXYLASE"
definition: >-
  This entry represents part of a family of closely related, thiamine pyrophosphate-dependent enzymes includes indolepyruvate decarboxylase (IPDC, EC:4.1.1.74), pyruvate decarboxylase (PDC, EC:4.1.1.1), branched-chain alpha-ketoacid decarboxylase, etc. PDC catalyses the conversion of pyruvate to acetaldehyde and CO2 in alcoholic fermentation. IPDC plays a role in the indole-3-pyruvic acid (IPA) pathway in plants and various plant-associated bacteria, it catalyses the decarboxylation of IPA to IAA. Also belonging to this entry is Mycobacterium tuberculosis alpha-keto acid decarboxylase (MtKDC) which participates in amino acid degradation via the Ehrlich pathway, and Lactococcus lactis branched-chain keto acid decarboxylase (KdcA) an enzyme identified as being involved in cheese ripening, which exhibits a very broad substrate range in the decarboxylation and carboligation reactions.
definition_source: "InterPro:IPR012110 abstract (PANTHER PTHR43452 is a member signature)"
