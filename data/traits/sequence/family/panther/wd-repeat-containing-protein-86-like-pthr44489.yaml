identifier: PANTHER:PTHR44489
label: "WD repeat-containing protein 86-like"
definition: >-
  This entry represents a group of WD repeat-containing protein, including WDR86 from humans, C3H17 from Oryza sativa and C3H48/59/62/63 from Arabidopsis. C3H48/62/63 contain an extra zinc finger CCCH domain N-terminal to their WD repeat.
