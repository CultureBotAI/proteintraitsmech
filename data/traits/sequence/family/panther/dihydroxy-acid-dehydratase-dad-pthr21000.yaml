identifier: PANTHER:PTHR21000
label: "DIHYDROXY-ACID DEHYDRATASE  DAD"
definition: >-
  The IlvD/Edd family proteins are involved in the biosynthesis of branched-chain amino acids, specifically catalyzing the dehydration of dihydroxy-acid precursors into their corresponding 2-oxo-acids, which are the penultimate precursors to L-isoleucine and L-valine. These enzymes function by converting (2R,3R)-2,3-dihydroxy-3-methylpentanoate into 2-oxo-3-methylpentanoate and (2R)-2,3-dihydroxy-3-methylbutanoate into 2-oxo-3-methylbutanoate. The specificity of these enzymes for the (R) isomer of the substrate is noted, with no activity against the (S) isomer. The family's role is essential in the common pathway leading to the synthesis of branched-chain amino acids, which are vital for protein structure and metabolism. Due to the importance of this pathway, the IlvD/Edd family proteins are potential targets for the development of antifungal agents and herbicides.
