identifier: PANTHER:PTHR33917
label: "PROTEIN EXECUTER 1, CHLOROPLASTIC"
definition: >-
  Proteins EXECUTER 1/2 (EX1/2) are located in chloroplasts and essential for singlet oxygen signalling, which is a stress signal that triggers the programmed cell death (PCD). This singlet oxygen-induced stress-related signalling that triggers a PCD pathway is unique to photosynthetic eukaryotes and operates under mild stress conditions, invokes photoinhibition of photosystem II (PSII) without causing photooxidative damage of the plant.
definition_source: "InterPro:IPR044680 abstract (PANTHER PTHR33917 is a member signature)"
