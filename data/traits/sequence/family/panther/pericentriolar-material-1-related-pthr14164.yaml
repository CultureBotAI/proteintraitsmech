identifier: PANTHER:PTHR14164
label: "PERICENTRIOLAR MATERIAL 1-RELATED"
definition: >-
  Pericentriolar material 1 protein is required for centrosome assembly and function. It is essential for the correct localisation of several centrosomal proteins and required to anchor microtubules to the centrosome. It is probably involved in the biogenesis of cilia.
