identifier: PANTHER:PTHR45882
label: "PITUITARY HOMEOBOX HOMOLOG PTX1"
definition: >-
  PITUITARY HOMEOBOX HOMOLOG PTX1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45882. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II, anatomical structure morphogenesis. Members localise to nucleus, intracellular anatomical structure.
