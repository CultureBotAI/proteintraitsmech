identifier: PANTHER:PTHR30388
label: "ALDEHYDE OXIDOREDUCTASE MOLYBDENUM COFACTOR ASSEMBLY PROTEIN"
definition: >-
  The protein family in question is involved in the utilization and processing of the molybdenum cofactor, a critical component for the activity of various enzymes. Members of the family have functions that include oxidizing purines such as hypoxanthine and xanthine to uric acid, and acting as chaperones for the insertion of the molybdenum cofactor into other subunits of enzyme complexes. The family appears to be involved in stabilizing certain enzyme subunits and may play a role in recruiting the molybdenum cofactor. Additionally, one member is known to bind the molybdopterin cytosine dinucleotide form of the molybdenum cofactor, indicating a direct interaction with this essential cofactor.
