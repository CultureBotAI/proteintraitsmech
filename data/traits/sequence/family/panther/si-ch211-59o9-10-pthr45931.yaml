  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that are involved in the ubiquitination and subsequent proteasomal degradation of various target proteins. They play roles in regulating transcription factors, particularly those with LIM domains, by mediating the degradation of their cofactors. This action allows the transcription factors to interact with other proteins and modulate gene expression. Some family members are involved in the regulation of telomere length and the random inactivation of the X chromosome during embryonic development. They also contribute to the establishment of proper protein complexes by regulating the stoichiometry of specific protein interactions. Additionally, they have roles in cellular processes such as axonal outgrowth and transcriptional regulation of hormone receptors.
    source: "InterPro:IPR051834 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
