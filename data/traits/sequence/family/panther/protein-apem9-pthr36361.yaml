identifier: PANTHER:PTHR36361
label: "PROTEIN APEM9"
definition: >-
  Several peroxisome biogenesis factors, termed peroxins (PEXs), are involved in the transport of peroxisomal proteins from the cytosol to peroxisomes. ABERRANT PEROXISOME MORPHOLOGY9 (APEM9) is involved in peroxisomal protein transport through its recruitment of the AAA ATPase complex PEX1-PEX6 to peroxisomal membranes via protein-protein interactions with PEX6. APEM9 has a similar function in plants to mammalian Pex26 and yeast Pex15p, although the amino acid conservation among them is very low. APEM9 plays critical roles in peroxisome biogenesis and function, which is essential for jasmonic acid production and pollen maturation and germination.
definition_source: "InterPro:IPR034571 abstract (PANTHER PTHR36361 is a member signature)"
