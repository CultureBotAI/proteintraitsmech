identifier: PANTHER:PTHR24050
label: "PA14 DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins is involved in the regulation of kidney development and organ morphogenesis. Members of this family are known to interact with integrin alpha-8/beta-1, serving as functional ligands that regulate the expression of growth factors essential for these developmental processes. They also play roles in cell adhesion, spreading, and survival by binding to various integrins. Additionally, these proteins contribute to matrix assembly and may influence hair follicle morphogenesis. The presence of a MAM domain in some family members is critical for their localization at the cell surface, indicating a role in cell-matrix interactions.
