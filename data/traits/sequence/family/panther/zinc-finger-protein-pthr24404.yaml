identifier: PANTHER:PTHR24404
label: "ZINC FINGER PROTEIN"
definition: >-
  The Ikaros C2H2-type zinc-finger protein family is characterized by its involvement in transcriptional regulation, particularly in the differentiation and maturation of lymphocytes. Members of this family, such as Ikaros, Aiolos, and Helios, play crucial roles in hematopoietic cell differentiation, B- and T-cell development, and apoptosis regulation. They bind to specific DNA consensus sequences, often containing a GGGA core, to modulate gene expression. The family includes transcriptional repressors and activators, with some members also involved in megakaryocyte differentiation. The N-terminal zinc-finger domains are typically responsible for DNA binding and targeting to specific genomic regions, while the C-terminal zinc-fingers mediate dimerization, essential for their function. The family's function is further modulated by isoform-specific interactions and the formation of complexes with other chromatin-remodeling proteins.
