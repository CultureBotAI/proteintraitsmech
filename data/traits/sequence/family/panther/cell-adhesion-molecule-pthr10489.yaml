identifier: PANTHER:PTHR10489
label: "CELL ADHESION MOLECULE"
definition: >-
  This entry includes a group of G-protein coupled receptors characterized by its involvement in a wide range of physiological processes, including chemotaxis, immune response, inflammation, cell adhesion, and signal transduction. Among its members are C-C chemokine receptors type 1-9 receptors for various chemokines (including CCL3/MIP-1-alpha, CCL4/MIP-1-beta, RANTES, CXCL12/SDF-1), peptides, and other ligands, triggering intracellular signalling cascades that regulate cellular responses such as calcium ion flux, cell migration, proliferation, survival, and angiogenic activity. They play crucial roles in the cardiovascular system, central nervous system development, hematopoiesis, and in the regulation of blood pressure and sodium retention. Some receptors also function as coreceptors for viral entry, including HIV, and may be implicated in the development of AIDS dementia. This family includes both typical signaling receptors and atypical chemokine receptors that modulate immune responses by sequestering, degrading, or transcytosing chemokines.
