identifier: PANTHER:PTHR43511
label: "UTP--glucose-1-phosphate uridylyltransferase"
definition: >-
  UDP-glucose is the universal activated form of glucose, employed in all organisms for glucosyl transfer reactions and as precursor for various activated carbohydrates. It is formed by the enzyme UDP-glucose pyrophosphorylase (UGPase, UDPGP), also known as UTP--glucose-1-phosphate uridylyltransferase, ( EC:2.7.7.9 ), which catalyses the reaction UTP + alpha-D-glucose 1-phosphate = diphosphate + UDP-glucose. The enzymatically active form of the protein is a homooctamer in Saccharomyces cerevisiae.
definition_source: "InterPro:IPR016267 abstract (PANTHER PTHR43511 is a member signature)"
