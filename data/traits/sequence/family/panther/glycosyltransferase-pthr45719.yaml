identifier: PANTHER:PTHR45719
label: GLYCOSYLTRANSFERASE
definition: >-
  This entry includes beta-glucuronosyltransferase GlcAT14A/B/C from Arabidopsis. They belong to the glycosyltransferase family 14 (GT14). GlcAT14A is involved in the biosynthesis of type II arabinogalactan (AG) and has a role in cell elongation during seedling growth. This entry also includes uncharacterised bacterial proteins.
