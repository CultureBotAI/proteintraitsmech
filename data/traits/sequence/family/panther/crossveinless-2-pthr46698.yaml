identifier: PANTHER:PTHR46698
label: "CROSSVEINLESS 2"
definition: >-
  The Kielin/chordin-like and BMP-binding endothelial regulator protein family is involved in the regulation of bone morphogenetic protein (BMP) signaling pathways. Members of the family enhance BMP signaling in a paracrine manner and are known to inhibit activin-A and TGFB1-mediated signaling pathways. Additionally, they may play a role in the dorsalization of mesoderm during embryonic development and regulate BMP responsiveness in osteoblasts and chondrocytes. This family's regulatory functions are crucial for proper bone and cartilage development and may be involved in embryonic patterning processes.
