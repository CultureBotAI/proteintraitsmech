identifier: PANTHER:PTHR37461
label: "ANTI-SIGMA-K FACTOR RSKA"
definition: >-
  This entry represents anti-sigma factors RskA, RslA, and RsiW, which regulate extracytoplasmic function (ECF) sigma factors SigK, SigL, and SigW respectively. These proteins function by binding to and maintaining their cognate sigma factors in an inactive state. Upon receipt of extracytoplasmic signals, the anti-sigma factors undergo regulated intramembrane proteolysis (RIP), a sequential proteolytic cascade involving site-1 protease cleavage at the cell surface, site-2 protease cleavage within the membrane, and subsequent degradation by cytoplasmic proteases. This coordinated proteolysis liberates the sigma factors, allowing them to initiate transcription of stress response genes. RsiW belongs to the zinc-associated anti-sigma factor (ZAS) superfamily and represents a related class of anti-sigma regulators controlling sigma factor activity in response to environmental signals.
definition_source: "InterPro:IPR051474 abstract (PANTHER PTHR37461 is a member signature)"
