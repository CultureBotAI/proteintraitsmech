identifier: PANTHER:PTHR47494
label: "NKG2-D TYPE II INTEGRAL MEMBRANE PROTEIN"
definition: >-
  NKG2D is an activating receptor for triggering the NK cell cytotoxic activity. It binds to a variety of cell surface glycoproteins distantly related to MHC class I molecules, termed NKG2D ligands (NKG2DL). The expression of a certain ligand or a particular allelic variant is essential to drive a proper immune response. The NKG2D/NKG2DL axis has been shown to be the potential therapeutic candidate for anticancer immunotherapy.
