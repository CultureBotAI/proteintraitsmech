identifier: PANTHER:PTHR15696
label: "SMG-7  SUPPRESSOR WITH MORPHOLOGICAL EFFECT ON GENITALIA PROTEIN 7"
definition: >-
  This entry includes Est1/Esl1/Ebs1 from budding yeasts and Est1A/SMG6/SMG7 from humans. Est1 is a TLC1 RNA-associated factor involved in telomere length regulation. Ebs1, an Est1 paralogue and human Smg7 orthologue, is involved in translation inhibition and nonsense-mediated decay. Esl1 is not involved in nonsense-mediated mRNA decay or telomere maintenance pathways, instead, it regulates adaptive gene expression responses of environmental sensing pathways.
