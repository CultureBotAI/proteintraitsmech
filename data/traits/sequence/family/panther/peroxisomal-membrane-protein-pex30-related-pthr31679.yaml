identifier: PANTHER:PTHR31679
label: "PEROXISOMAL MEMBRANE PROTEIN PEX30-RELATED"
definition: >-
  This family of proteins is involved in the biogenesis and maintenance of peroxisomes, which are key organelles in eukaryotic cells responsible for various metabolic processes including the beta-oxidation of fatty acids and the detoxification of hydrogen peroxide. Members of this family play a role in the regulation of peroxisome size, number, and distribution within the cell. They are integral to the peroxisomal membrane and may be involved in the formation of peroxisomal membrane contact sites, influencing the assembly of peroxisomal matrix proteins and the import of peroxisomal membrane proteins.
