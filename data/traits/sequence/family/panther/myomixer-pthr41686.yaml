identifier: PANTHER:PTHR41686
label: MYOMIXER
definition: >-
  Protein myomixer, also known as minion or myomerger, is a myoblast-specific protein that mediates myoblast fusion and is required for muscle development. It associates with Myomaker, a fusogenic membrane protein, and together they can also induce fibroblast-fibroblast fusion and fibroblast-myoblast fusion.
