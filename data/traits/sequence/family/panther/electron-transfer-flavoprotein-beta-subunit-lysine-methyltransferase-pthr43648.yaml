    text: >-
      ELECTRON TRANSFER FLAVOPROTEIN BETA SUBUNIT LYSINE METHYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43648. PANTHER protein class: methyltransferase. Members are annotated with the molecular function methyltransferase activity, catalytic activity, acting on a protein, protein methyltransferase activity.
