  - kind: GENERAL
    text: >-
      The PrmA family of proteins functions as methyltransferases, specifically targeting the ribosomal protein L11. Members of this family are responsible for the post-translational methylation of L11, which is a critical modification for the proper function of the ribosome. The methylation process is believed to play a role in the accuracy of protein synthesis by the ribosome. The PrmA family is part of the larger methyltransferase superfamily, sharing common structural features that are characteristic of enzymes capable of transferring methyl groups to their substrates. One member, THET8 from Thermus thermophilus, is known to preferentially recognize and methylate free L11 before its incorporation into the 50S ribosomal subunit, a function that is dispensable for growth and thermostability.
    source: "InterPro:IPR050078 abstract (LLM-generated, not curator-reviewed)"
