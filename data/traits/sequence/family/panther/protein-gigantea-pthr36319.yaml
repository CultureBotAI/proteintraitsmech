identifier: PANTHER:PTHR36319
label: "PROTEIN GIGANTEA"
definition: >-
  The full-length GIGANTEA protein is involved in regulation of circadian rhythm and photoperiodic flowering. GIGANTEA belongs to a distinct protein family and is localised to both the nucleus and cytoplasm. The protein stabilises photoreceptors ADO1/ZTL and ADO3, and interacts with multiple transcription factors and regulatory proteins via its N-terminal region. GIGANTEA shows circadian expression patterns with peak levels occurring 8-10 hours into the light period. A crystal structure is available for a large portion of the Arabidopsis protein ( PDB:7WA4 ) showing predominantly helical architecture. While the full-length protein has well-characterised roles in circadian clock regulation and flowering control, the specific function of this domain remains to be determined. Photoperiodic control of flowering is a vital developmental process in plants because it directly relates to successful reproduction. In Arabidopsis, a long-day (LD) plant, flowering is promoted by long days and is delayed by short days. Mutations in the GIGANTEA (GI) gene delay flowering under long days but the effects are minimal under short days. It is believed that GI plays an important role in regulating the expression of flowering-time genes during the promotion of flowering by photo-period, and that it participates in a feedback loop of the plant circadian system. In rice, a short day (SD) plant, GI acts as suppressor of flowering under short-day and long-day conditions. The GI gene encodes a putative membrane protein containing 6 putative transmembrane (TM) domains. The protein interacts with SPINDLY, a negative regulator of gibberellin signalling in Arabidopsis, via the latter's N-terminal array of 10 tetratricopeptide repeats.
