identifier: PANTHER:PTHR16058
label: "DOUBLE ZINC RIBBON AND ANKYRIN REPEAT-CONTAINING PROTEIN 1"
definition: >-
  This family of proteins is involved in the intracellular transport of organelles and vesicles, particularly within photoreceptor cells. Members of this family play a crucial role in the formation, maintenance, and function of the photoreceptor's outer segments, which are essential for the conversion of light into electrical signals in the visual pathway.
