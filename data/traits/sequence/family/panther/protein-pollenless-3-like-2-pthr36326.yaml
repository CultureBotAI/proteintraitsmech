identifier: PANTHER:PTHR36326
label: "PROTEIN POLLENLESS 3-LIKE 2"
definition: >-
  This entry represents a group of plant tetratricopeptide repeat proteins, including POLLENLESS 3 (also known as MS5) and SULFUR DEFICIENCY-INDUCED 1 (SDI1). MS5 is involved in the regulation of cell division after male meiosis I and II to facilitate exit from meiosis and transition to G1. MS5 mutants are male sterile, pollen tetrads undergo an extra round of division after meiosis II without chromosome replication, resulting in chromosome abnormalities [,. SDI1 is involved in the utilization of stored sulphate pools under sulphur-limiting conditions.
