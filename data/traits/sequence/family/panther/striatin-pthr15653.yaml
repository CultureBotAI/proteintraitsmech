identifier: PANTHER:PTHR15653
label: STRIATIN
definition: >-
  This family of proteins is characterized by the ability to bind calmodulin in a calcium-dependent manner, suggesting a role in calcium signaling pathways. Members are implicated in various cellular processes, including scaffolding or signaling, and may influence dendritic Ca(2+) signaling. Some proteins within this family are involved in the regulation of the cell cycle in response to external signals, such as pheromones in yeast. Additionally, certain members are required for developmental processes, such as the formation of mature fruiting bodies during early sexual development in fungi.
