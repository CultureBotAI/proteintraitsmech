identifier: PANTHER:PTHR36066
label: "TRANSCRIPTION FACTOR BHLH145"
definition: >-
  This is a family of transcription factors from plants. They play a central role in thermospermine responses in Arabidopsis. This entry includes transcription factors SAC51, bHLH144, bHLH145 and bHLH143. bHLH144 belongs to the large family of bHLH transcription factors in Arabidopsis and forms homodimers as well as interacts with the LHW protein. The protein is localised to the nucleus and functions in DNA-binding transcriptional regulation.
