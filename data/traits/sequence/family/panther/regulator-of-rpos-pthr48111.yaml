identifier: PANTHER:PTHR48111
label: "REGULATOR OF RPOS"
definition: >-
  This family contains proteins that have a signal transduction response regulator receiver domain at the N-terminal and a OmpR/PhoB-type DNA-binding domain at the C-terminal. Homologues are predominantly from bacteria but also eukaryotes and archaea. Members of the family are frequently part of a two-component regulatory system, including: Transcriptional regulatory protein WalR, a member of the two-component regulatory system with WalK involved in the regulation of the ftsAZ operon and others. It plays a role in the regulation of fatty acid biosynthesis Heme response regulator HssR, a member of the two-component regulatory system with HssS involved in intracellular heme homeostasis and tempering of staphylococcal virulence. Response regulator protein GraR, a member of the two-component regulatory system with GraS involved in resistance against cationic antimicrobial peptides Response regulator MprA, a member of the two-component regulatory system with MprB, contributes to maintaining a persistent infection in the host Response regulator ArlR, a member of the two-component regulatory system with ArlS involved in the regulation of adhesion, autolysis, multidrug resistance and virulence Response regulator SaeR, a member of the two-component regulatory system with SaeS involved in the regulation of staphylococcal virulence factors Transcriptional regulatory protein CpxR, a member of the two-component regulatory system CpxA/CpxR, responds to envelope stress response by activating or, in some cases, repressing expression of downstream genes.
definition_source: "InterPro:IPR039420 abstract (PANTHER PTHR48111 is a member signature)"
