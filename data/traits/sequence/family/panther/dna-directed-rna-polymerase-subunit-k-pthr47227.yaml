identifier: PANTHER:PTHR47227
label: "DNA-DIRECTED RNA POLYMERASE SUBUNIT K"
definition: >-
  DNA-DIRECTED RNA POLYMERASE SUBUNIT K — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47227. PANTHER protein class: RNA metabolism protein, DNA-directed RNA polymerase. Members are annotated with the molecular function RNA polymerase III activity, 5'-3' RNA polymerase activity, DNA-directed 5'-3' RNA polymerase activity. Members participate in tRNA metabolic process, transcription by RNA polymerase III, transcription by RNA polymerase I.
