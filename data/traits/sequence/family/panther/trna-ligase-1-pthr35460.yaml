identifier: PANTHER:PTHR35460
label: "TRNA LIGASE 1"
definition: >-
  tRNA ligase 1 (RNL) is involved in the pre-tRNA splicing process in plants. Pre-tRNA splicing requires intron removal by an endonuclease, and a ligase for joining the resulting tRNA halves. In Arabidopsis, the endonuclease is encoded by two genes, SEN1 and SEN2, and tRNA ligase is encoded by one gene, AtRNL. Like fungal tRNA ligases, a plant tRNA ligase is a multifunctional enzyme consisting of three domains each with a different activity in the order: ligase, kinase and cyclic phosphodiesterase (CPDase). The polynucleotide kinase domain heals the broken ends to generate the 3'-OH, 2'-PO4, and 5'-PO4 required for sealing by the ligase domain.
definition_source: "InterPro:IPR038837 abstract (PANTHER PTHR35460 is a member signature)"
