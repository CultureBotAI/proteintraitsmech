identifier: PANTHER:PTHR34737
label: "EF-HAND DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents Temptin from Aplysia californica and similar proteins from eukaryotes and bacteria. Temptin is a component of the complex of water-borne protein pheromones that stimulates attraction and mating behaviour. It modulates pheromone signalling by direct binding to attractin.
