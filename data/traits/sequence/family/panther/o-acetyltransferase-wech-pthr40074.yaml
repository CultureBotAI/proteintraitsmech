identifier: PANTHER:PTHR40074
label: "O-ACETYLTRANSFERASE WECH"
definition: >-
  O-ACETYLTRANSFERASE WECH — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR40074. Members are annotated with the molecular function acyltransferase activity, transferring groups other than amino-acyl groups, acetyltransferase activity, O-acyltransferase activity. Members participate in carbohydrate derivative biosynthetic process, carbohydrate biosynthetic process, polysaccharide biosynthetic process. Members localise to cell periphery, membrane, plasma membrane.
