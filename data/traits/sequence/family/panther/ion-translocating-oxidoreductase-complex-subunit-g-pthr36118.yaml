identifier: PANTHER:PTHR36118
label: "ION-TRANSLOCATING OXIDOREDUCTASE COMPLEX SUBUNIT G"
definition: >-
  The six-subunit complex RnfABCDGE in Rhodobacter capsulatus (Rhodopseudomonas capsulata) encodes an apparent NADH oxidoreductase responsible for electron transport to nitrogenase, necessary for nitrogen fixation. A closely related complex in Escherichia coli, RsxABCDGE (Reducer of SoxR), reduces the 2Fe-2S-containing superoxide sensor SoxR, active as a transcription factor when oxidized. Although this family of putative NADH oxidoreductase complexes exists in many of the same species as the related NQR family, a Na(+)-translocating NADH-quinone reductase ( InterPro:IPR003667 ), RnfABCDGE is distinct.
