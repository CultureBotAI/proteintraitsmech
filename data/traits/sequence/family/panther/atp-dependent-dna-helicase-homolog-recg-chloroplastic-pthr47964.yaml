identifier: PANTHER:PTHR47964
label: "ATP-DEPENDENT DNA HELICASE HOMOLOG RECG, CHLOROPLASTIC"
definition: >-
  This entry represents a family of proteins from plants and bacteria that belong to the helicase superfamily 2 (SF2), including ATP-dependent DNA helicase RecG and Transcription-repair-coupling factor (Mfd). RecG plays a critical role in recombination and DNA repair both in plants and bacteria. It helps to process Holliday junction intermediates to mature products by catalysing branch migration. It has a DNA unwinding activity characteristic of a DNA helicase with a 3'- to 5'- polarity. RecG unwind branched duplex DNA (Y-DNA) and has a role in constitutive stable DNA replication (CsdR) and R-loop formation. It is genetically synergistic to RadA and RuvABC. The structure of the Thermatoga maritima RecG protein shows three distinct domains with an α-β configuration, the largest N-terminal Domain 1 which interacts with DNA junctions, and Domains 2 and 3 at the C-terminal which contain the characteristic motifs that identify RecG as an SF2 helicase.
definition_source: "InterPro:IPR047112 abstract (PANTHER PTHR47964 is a member signature)"
