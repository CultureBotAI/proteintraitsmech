  - kind: GENERAL
    text: >-
      This family of proteins is involved in neural development and function, including neuronal growth, axon targeting, and cell adhesion. Members of this family are thought to mediate selective growth of neuronal connections and contribute to the guidance of developing axons as well as the remodeling of mature circuits, particularly within the limbic system. Some proteins in this family are implicated in inhibiting neurite outgrowth, while others may function as neural cell adhesion molecules or be involved in opioid binding in the presence of acidic lipids. Additionally, certain members may play roles in cortical neuron migration, learning, memory performance, and cell-cell interactions.
