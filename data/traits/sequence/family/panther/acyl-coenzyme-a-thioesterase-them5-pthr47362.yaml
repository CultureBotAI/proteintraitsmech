identifier: PANTHER:PTHR47362
label: "ACYL-COENZYME A THIOESTERASE THEM5"
definition: >-
  ACYL-COENZYME A THIOESTERASE THEM5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47362. PANTHER protein class: esterase. Members are annotated with the molecular function fatty acyl-CoA hydrolase activity. Members participate in ribonucleotide metabolic process, purine nucleotide metabolic process, acyl-CoA metabolic process. Members localise to mitochondrial matrix, membrane-bounded organelle, cytoplasm.
