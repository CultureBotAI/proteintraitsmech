identifier: PANTHER:PTHR43830
label: "PROTEIN PSP1"
definition: >-
  The yeast polymerase suppressor 1 (PSP1) protein partially suppresses mutations in DNA polymerases alpha and delta. The C-terminal half of PSP1 contains a domain, which is also found in several hypothetical proteins from both eukaryotic (fungal) and prokaryotic sources, such as Bacillus subtilis YaaT protein (also known as RicT), which was first thought to play a significant role in phosphorelay during initiation of sporulation. However, YaaT/RicT belongs to a iron-sulfur containing regulatory complex that is conserved also in many non-sporulating species, together with homologs of YmcA (RicA) and YlbF (RicF). It is possible that the yaaT protein is also related to DNA replication.
