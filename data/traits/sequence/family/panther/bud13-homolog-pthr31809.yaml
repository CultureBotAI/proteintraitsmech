identifier: PANTHER:PTHR31809
label: "BUD13 HOMOLOG"
definition: >-
  The CWC26 family comprises proteins involved in the pre-mRNA splicing process. Members of the CWC26 family are components of the spliceosome, a complex molecular machine that removes introns from a transcribed pre-mRNA segment. Specifically, some family members are implicated in the splicing of U12-type introns as part of the minor spliceosome. This function is essential for the accurate maturation of pre-mRNAs into mRNAs, which is a critical step in gene expression. In yeast, CWC26 family proteins are also associated with pre-mRNA nuclear retention and may play a role in bud site selection.
