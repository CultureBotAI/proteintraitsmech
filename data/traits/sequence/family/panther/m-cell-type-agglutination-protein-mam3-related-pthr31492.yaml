  - kind: GENERAL
    text: >-
      The Mam3/Map4 family proteins are primarily involved in cell agglutination during the process of conjugation in Schizosaccharomyces pombe. These proteins are implicated in colony formation and may play a role in flocculation, a process where cells adhere together to form clumps or flocs. The family includes specific proteins such as Mam3 and Map4, which are specific to M and P cell types, respectively, and are essential for mating interactions. Other putative members of the family are believed to share similar functions in agglutination and flocculation, suggesting a conserved role within the family for these processes.
