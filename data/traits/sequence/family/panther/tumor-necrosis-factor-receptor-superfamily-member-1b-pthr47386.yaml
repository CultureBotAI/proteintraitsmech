definitions:
  - kind: GENERAL
    text: >-
      TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 1B — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47386. PANTHER protein class: transmembrane signal receptor. Members are annotated with the molecular function death receptor activity, tumor necrosis factor binding. Members participate in positive regulation of neurogenesis, positive regulation of protein catabolic process, intrinsic apoptotic signaling pathway in response to DNA damage.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that interact with tumor necrosis factor (TNF) and chemokines. They are involved in modulating the immune response by binding to these signaling molecules in the extracellular space, which inhibits the host's immune defense mechanisms. Some members mimic host TNF receptors and can bind TNF with high affinity, potentially preventing TNF from reaching its cellular targets and dampening its antiviral effects. The family also includes viral proteins that can bind host chemokines, thereby interfering with chemokine-mediated immune responses.
    source: "InterPro:IPR051670 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
