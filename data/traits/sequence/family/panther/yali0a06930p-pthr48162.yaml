identifier: PANTHER:PTHR48162
label: YALI0A06930P
definition: >-
  This family of proteins includes members that are involved in distinct cellular processes. One protein is implicated in the structure and function of ribosomes, specifically within the ribosomal L1 domain, suggesting a role in the translation machinery. Another member functions as a transcription factor, acting as a negative regulator of transcription elongation. Despite the divergent functions, these proteins share structural or sequence similarities that group them into a single family.
