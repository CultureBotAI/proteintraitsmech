  - kind: GENERAL
    text: >-
      This family of proteins is implicated in the development of the mesendoderm, a germ layer formed during the embryogenesis of some animals. Members of this family are believed to be involved in the regulatory processes that govern the differentiation and development of this layer, which gives rise to both mesodermal and endodermal tissues. The exact molecular function and mechanisms by which these proteins contribute to mesendoderm development remain to be fully elucidated.
