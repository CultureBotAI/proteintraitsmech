definitions:
  - kind: GENERAL
    text: >-
      SERINE/THREONINE/TYROSINE-INTERACTING-LIKE PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46659. Members are annotated with the molecular function phosphatase inhibitor activity, enzyme inhibitor activity, protein phosphatase binding. Members participate in positive regulation of apoptotic process, regulation of cellular component biogenesis, regulation of cellular process. Members localise to cytoplasm, membrane-bounded organelle, mitochondrion.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes catalytically inactive phosphatases that interact with specific binding partners to modulate cellular processes. Members of this family are known to bind to G3BP1, a process that results in the inhibition of stress granule formation. These proteins do not prevent the dephosphorylation of G3BP1 at a specific serine residue. Additionally, they are capable of inhibiting the activity of PTPMT1 phosphatase, which in turn positively regulates intrinsic apoptosis. This regulatory function suggests a role in cell death pathways. Furthermore, these proteins may contribute to neuronal development by influencing the formation of neurites.
    source: "InterPro:IPR053272 abstract (LLM-generated, not curator-reviewed)"
