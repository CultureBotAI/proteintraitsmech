identifier: PANTHER:PTHR46086
label: "ALPHA/BETA-HYDROLASES SUPERFAMILY PROTEIN"
definition: >-
  This family includes triacylglycerol lipase OBL1 from Arabidopsis thaliana and Nicotiana tabacum, which are homologues of the acid lipase from castor bean (RcOBL1). OBL1 is an acid GXSXG-lipase localized to lipid droplets that can hydrolyse a range of triacylglycerols without a clear preference for acyl-chains. It can also cleave 1,2-diacylglycerol, 1,3-diacylglycerol and 1-monoacylglycerol, but not phosphatidylcholine, phosphatidylethanolamine, or sterol esters. It is required for pollen tube growth. Triacylglycerol hydrolysis by OBL1 may provide acyl groups for the synthesis of membrane lipids in growing pollen tubes.
definition_source: "InterPro:IPR044819 abstract (PANTHER PTHR46086 is a member signature)"
