identifier: PANTHER:PTHR35994
label: "EXPRESSED PROTEIN"
definition: >-
  PLASTID TRANSCRIPTIONALLY ACTIVE protein 6 (PTAC6) plays an important part in plastid gene expression. It is an essential subunit of the PEP (plastid-encoded RNA polymerase) complex. MTERF5 interacts with PTAC6, and thereby recruits the PEP complex to the transcriptionally paused region of psbEFLJ (a gene that encodes four key subunits of photosystem II). PTAC6 also promotes leaf greening.
