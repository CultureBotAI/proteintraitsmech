identifier: PANTHER:PTHR31713
label: "OS02G0177800 PROTEIN"
definition: >-
  CALMODULIN-BINDING PROTEIN60 (CBP60) family from plants have been known to be involved in both biotic and abiotic stress responses. Some members (for example, UniProtKB:Q8H6T7), are known to be involved in the induction of plant defence responses. In Arabidopsis, CBP60s have eight members, including CBP60g and SARD1, which encode positive regulators of plant immunity that promote production of salicylic acid (SA) and affect expression of SA-dependent and SA-independent defense genes.
