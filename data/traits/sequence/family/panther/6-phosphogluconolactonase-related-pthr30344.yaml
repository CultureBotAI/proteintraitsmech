  - kind: GENERAL
    text: >-
      The Cycloisomerase 2 family proteins are primarily involved in the hydrolysis of 6-phosphogluconolactone to 6-phosphogluconate, a key step in the pentose phosphate pathway which is crucial for cellular processes such as nucleotide synthesis and the generation of NADPH. Additionally, some members of the family have been implicated in a syn cycloisomerization process, and one member is suggested to have a role in ulvan degradation, indicating a potential for diverse substrate specificity and enzymatic functions within the family.
