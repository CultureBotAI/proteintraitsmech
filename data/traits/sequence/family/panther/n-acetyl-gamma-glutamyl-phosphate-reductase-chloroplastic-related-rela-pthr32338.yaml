identifier: PANTHER:PTHR32338
label: "N-ACETYL-GAMMA-GLUTAMYL-PHOSPHATE REDUCTASE, CHLOROPLASTIC-RELATED-RELATED"
definition: >-
  The (AGPR dehydrogenase family (also known as NAGSA) is involved in the biosynthesis of amino acids, specifically arginine and lysine. Many members of this family are enzymes that catalyse the NADPH-dependent reduction of N-acetyl-5-glutamyl phosphate to yield N-acetyl-L-glutamate 5-semialdehyde. This reaction is a key step in the metabolic pathway that leads to the production of essential amino acids. The enzymes are characterised by their requirement for NADPH as a cofactor and are found across various organisms, indicating a conserved role in nitrogen metabolism. Some members of the family are also involved in the modification of the amino acid carrier protein LysW, participating in the conversion of [LysW]-aminoadipate 6-phosphate to [LysW]-aminoadipate 6-semialdehyde.
