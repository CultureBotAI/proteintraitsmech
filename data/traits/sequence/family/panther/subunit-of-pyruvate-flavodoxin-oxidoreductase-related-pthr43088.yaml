identifier: PANTHER:PTHR43088
label: "SUBUNIT OF PYRUVATE:FLAVODOXIN OXIDOREDUCTASE-RELATED"
definition: >-
  This family of proteins includes subunits of enzymes involved in the oxidative decarboxylation of 2-oxo acids to form corresponding acyl-CoA derivatives, a key step in various metabolic pathways. The enzymes are multisubunit complexes, and the family members act as catalytic subunits that bind substrates and cofactors, facilitating the redox reaction. These proteins are found in prokaryotes and are involved in processes such as the citric acid cycle and branched-chain amino acid metabolism.
