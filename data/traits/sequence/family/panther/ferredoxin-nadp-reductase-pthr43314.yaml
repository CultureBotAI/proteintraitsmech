identifier: PANTHER:PTHR43314
label: "Ferredoxin--NADP reductase"
definition: >-
  Ferredoxin--NADP reductase — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43314. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies participate in generation of precursor metabolites and energy, metabolic process, cellular process. Subfamilies localise to intracellular anatomical structure, cytoplasm, chloroplast.
