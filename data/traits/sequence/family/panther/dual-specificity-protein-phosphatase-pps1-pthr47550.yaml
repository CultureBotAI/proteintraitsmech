  - kind: GENERAL
    text: >-
      This family of proteins includes dual specificity phosphatases that are involved in the regulation of the cell cycle, particularly during the DNA synthesis phase. Members of this family are characterized by their ability to dephosphorylate serine, threonine, and tyrosine residues, which is a key process in cell signaling and regulation. The enzymatic activity of these phosphatases is crucial for controlling the phosphorylation state of various substrates, thereby influencing cellular processes such as cell growth, division, and differentiation. The family is part of the larger protein-tyrosine phosphatase superfamily, and specifically belongs to the non-receptor class dual specificity subfamily, indicating that these enzymes act within the cell rather than at the cell surface.
    source: "InterPro:IPR053239 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
