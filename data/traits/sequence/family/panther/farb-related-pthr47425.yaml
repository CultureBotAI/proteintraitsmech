  - kind: GENERAL
    text: >-
      FARB-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47425.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes transcription factors involved in the regulation of gene clusters responsible for the detoxification and degradation of specific compounds, as well as the biosynthesis of fungal toxins. One member regulates the Fusarium detoxification of benzoxazolinone cluster, contributing to the tolerance against benzoxazolinones like MBOA and BOA, which are degradation products of plant-derived benzoxazinones such as DIMBOA and DIBOA. Another member is implicated in the biosynthesis of cyclopiazonic acid, a potent inhibitor of Ca(2+)-ATPase with a pentacyclic indole tetramic acid structure. These transcription factors are key to the adaptation and survival of fungi in various ecological niches, by enabling them to counteract plant defenses and produce secondary metabolites.
    source: "InterPro:IPR052761 abstract (LLM-generated, not curator-reviewed)"
