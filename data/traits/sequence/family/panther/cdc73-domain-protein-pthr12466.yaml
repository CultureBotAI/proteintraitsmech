identifier: PANTHER:PTHR12466
label: "CDC73 DOMAIN PROTEIN"
definition: >-
  This entry includes Cdc73 from budding yeasts and its animal homologue, parafibromin. They are part of the Paf1 complex involved in histone modifications, transcription elongation and other gene expression processes that include transcript site selection. In budding yeasts, Paf1 is an RNA polymerase II-associated protein complex containing Paf1, Cdc73, Ctr9, Rtf1 and Leo1. It is required for full expression of a subset of yeast genes, particularly those responsive to signals from the Pkc1/MAP kinase cascade. The complex appears to play an essential role in RNA elongation. Human parafibromin is a tumour suppressor that may facilitate association of 3' mRNA processing factors with actively-transcribed chromatin. It is a component of the human Paf1 complex (Paf1C), which consists of Paf1, Cdc73, Ctr9, Rtf1, Leo1 and Wdr61 (Ski8). As in yeast, the human Paf1C has a central role in co-transcriptional histone modifications.
