  - kind: GENERAL
    text: >-
      This family of proteins includes thiol S-methyltransferases that catalyze the transfer of a methyl group from S-adenosyl-L-methionine to various thiol-containing substrates. These enzymes are involved in the methylation of small molecules such as hydrogen sulfide and dithiothreitol. Some family members are known to methylate the N6 position of adenosine in long non-coding RNAs, which may influence the transfer of these RNAs into exosomes and affect cell differentiation and survival. Additionally, certain members may play a role in viral life cycles, specifically in the assembly and release of hepatitis C virus. The activity of these proteins can be inhibited by specific chemical compounds.
    source: "InterPro:IPR052356 abstract (LLM-generated, not curator-reviewed)"
