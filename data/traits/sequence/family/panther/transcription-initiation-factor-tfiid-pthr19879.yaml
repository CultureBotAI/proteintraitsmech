identifier: PANTHER:PTHR19879
label: "TRANSCRIPTION INITIATION FACTOR TFIID"
definition: >-
  TRANSCRIPTION INITIATION FACTOR TFIID — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19879. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 6 of its annotated subfamilies. Subfamilies participate in transcription by RNA polymerase II, transcription initiation at RNA polymerase II promoter, gene expression. Subfamilies localise to RNA polymerase II, holoenzyme, nucleus, transcription factor TFIID complex.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
