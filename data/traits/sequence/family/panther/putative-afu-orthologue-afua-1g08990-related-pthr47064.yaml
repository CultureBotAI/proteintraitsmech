  - kind: GENERAL
    text: >-
      This family of proteins includes lactonohydrolases involved in the biosynthesis of oryzines, which are natural products with a unique maleidride backbone. These enzymes participate in a multi-step pathway that begins with the formation of octenoic acid by a fungal fatty acid synthase. The acid is then activated and condensed with oxaloacetate, followed by a series of reactions including decarboxylation, dehydration, tautomerization, and reduction to produce intermediates such as piliformic acid. Key steps in the pathway to oryzine A and B involve hydroxylation of a diene intermediate and subsequent lactonisation by these lactonohydrolases, with further reduction transforming oryzine B into oryzine A. The enzymes are characterized by their similarity to the SMP-30/CGR1 family.
    source: "InterPro:IPR052988 abstract (LLM-generated, not curator-reviewed)"
