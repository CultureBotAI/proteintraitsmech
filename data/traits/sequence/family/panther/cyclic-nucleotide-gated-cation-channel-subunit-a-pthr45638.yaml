identifier: PANTHER:PTHR45638
label: "CYCLIC NUCLEOTIDE-GATED CATION CHANNEL SUBUNIT A"
definition: >-
  The Cyclic Nucleotide-Gated Cation Channel family is involved in various signal transduction pathways, primarily in sensory neurons. Members of the family are activated by cyclic nucleotides (cAMP or cGMP), leading to the opening of nonselective cation channels. In visual systems, they play a crucial role in phototransduction by mediating the depolarization of photoreceptors in response to changes in cGMP levels due to light exposure. In olfactory systems, they are essential for odorant signal transduction, where cAMP serves as a second messenger. The channels are also involved in adaptation processes, allowing rapid response to stimuli and extending the range of detection. Some family members are implicated in other cellular functions, such as sperm chemotaxis and maintaining normal axon morphology.
definition_source: "InterPro:IPR050866 abstract (PANTHER PTHR45638 is a member signature)"
