identifier: PANTHER:PTHR34128
label: "CYTOCHROME C-TYPE BIOGENESIS PROTEIN CCME HOMOLOG, MITOCHONDRIAL"
definition: >-
  CcmE is the product of a cluster of Ccm genes that are necessary for cytochrome c biosynthesis in many prokaryotes and plant mitochondria. In E. coli, expression of these proteins is induced when the organisms are grown under anaerobic conditions with nitrate or nitrite as the final electron acceptor.
