identifier: PANTHER:PTHR11804
label: "PROTEASE M3 THIMET OLIGOPEPTIDASE-RELATED"
definition: >-
  This group of metallopeptidases belong to MEROPS peptidase family M3 (clan MA(E)), subfamilies M3A and M3B. The protein fold of the peptidase domain for members of this family resembles that of thermolysin, the type example for clan MA. The Thimet oligopeptidase family, is a large family of archaeal, bacterial and eukaryotic oligopeptidases that cleave medium sized peptides. The group contains: Mitochondrial intermediate peptidase (EC:3.4.24.59) Neurolysin, mitochondrial precursor, (EC:3.4.24.16) Thimet oligopeptidase (EC:3.4.24.15) Dipeptidyl carboxypeptidase (EC:3.4.15.5) Oligopeptidase A (EC:3.4.24.70) Oligoendopeptidase F
