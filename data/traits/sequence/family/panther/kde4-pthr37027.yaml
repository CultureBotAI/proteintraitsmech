identifier: PANTHER:PTHR37027
label: KDE4
definition: >-
  This entry includes giardin subunit beta and related proteins. Giardins are involved in parasite attachment to the intestinal mucosa and in the cytoskeletal disassembly and reassembly that marks the transition from infectious trophozoite to transmissible cyst. They may interact with other cytoskeletal proteins such as microtubules in the microribbons or crossbridges, to maintain the integrity of the ventral disk.
