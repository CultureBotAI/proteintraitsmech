identifier: PANTHER:PTHR13073
label: "BLOC-1 COMPLEX SUBUNIT 1"
definition: >-
  GCN5L1 (general control of amino acid synthesis 5-like 1), also known as BLOC1S1 (biogenesis of lysosome-related organelles complex 1 subunit 1). It is a component of the BLOC-1 complex, a complex required for normal biogenesis of lysosome-related organelles. GCN5L1 has been identified as a critical component of the mitochondrial protein acetylation programme. It acts as a nutrient-sensing regulator that controls mitochondrial content through coordinated regulation of mitochondrial biogenesis and autophagy.
