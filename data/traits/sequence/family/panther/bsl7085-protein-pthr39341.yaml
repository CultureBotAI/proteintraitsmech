identifier: PANTHER:PTHR39341
label: "BSL7085 PROTEIN"
definition: >-
  Members of this protein family all contain an apparent redox-active disulphide. In at least one family member, a cysteine in the CXXC motif is substituted by a selenocysteine. The family is sometimes found adjacent to (and, on occasion, fused with) members of the hybrid-cluster (prismane) family or the nitrite/sulphite reductase family.
