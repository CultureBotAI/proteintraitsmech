identifier: PANTHER:PTHR15260
label: SARCOSPAN
definition: >-
  Sarcospan is a transmembrane component of dystrophin-glycoprotein complex (DGC), a complex that spans the muscle plasma membrane and forms a link between the F-actin cytoskeleton and the extracellular matrix. The DGC is composed of distinct subcomplexes; sarcospan preferentially associates with the sarcoglycan subcomplex. Loss of the sarcoglycan complex and sarcospan alone is sufficient to cause muscular dystrophy. The role of the sarcoglycan complex and sarcospan is thought to be to strengthen the dystrophin axis connecting the basement membrane with the cytoskeleton.
