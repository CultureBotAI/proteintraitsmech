  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin ligases that are involved in the post-translational modification of proteins by attaching ubiquitin molecules. These modifications often target proteins for degradation via the ubiquitin-26S proteasome pathway. Members of this family play roles in various cellular processes, including the regulation of brassinosteroid signaling, prevention of premature senescence, and abscisic acid biosynthesis through the targeted degradation of specific proteins involved in these pathways.
