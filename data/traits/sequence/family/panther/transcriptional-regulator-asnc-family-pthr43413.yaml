identifier: PANTHER:PTHR43413
label: "TRANSCRIPTIONAL REGULATOR, ASNC FAMILY"
definition: >-
  The protein family includes both transcriptional regulators from Lrp/AsnC family and siroheme decarboxylase enzymes involved in heme biosynthesis, according to overall structure similarity. The transcriptional regulators are characterised by helix-turn-helix (HTH) motifs and are involved in various regulatory functions, including activation or repression of transcription and modulation of RNA polymerase recruitment. These regulators often control the expression of genes related to amino acid biosynthesis or their own transcription. The enzymes in the family, identified as part of the Ahb/Nir family, are involved in the decarboxylation of siroheme to didecarboxysiroheme, a key step in heme d1 and heme b biosynthesis. The activity of these enzymes can be modulated by the redox state of bound heme b and is stimulated by reducing agents like sodium dithionite.
definition_source: "InterPro:IPR050684 abstract (PANTHER PTHR43413 is a member signature)"
