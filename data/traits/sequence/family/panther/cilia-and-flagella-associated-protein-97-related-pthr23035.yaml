identifier: PANTHER:PTHR23035
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 97-RELATED"
definition: >-
  Drosophila Hemingway (Hmw) is required for motile cilia function and sperm flagella assembly. The human orthologue, known as cilia- and flagella-associated protein 97 (CFAP97) or KIAA1430, localizes to the primary cilium.
