  - kind: GENERAL
    text: >-
      This family of proteins is involved in the mitochondrial electron transport chain, specifically in the initial stage of transferring electrons from NADH to ubiquinone. Members of this family serve as subunits in the NADH-ubiquinone oxidoreductase complex, also known as Complex I, which is the first enzyme in the respiratory chain. They play a crucial role in the process of oxidative phosphorylation, where the energy from electron transfer is used to generate a proton gradient across the mitochondrial membrane, ultimately leading to the production of ATP, the cell's energy currency.
    source: "InterPro:IPR053229 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
