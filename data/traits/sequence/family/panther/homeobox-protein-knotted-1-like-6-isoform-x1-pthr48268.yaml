identifier: PANTHER:PTHR48268
label: "HOMEOBOX PROTEIN KNOTTED-1-LIKE 6 ISOFORM X1"
definition: >-
  This family of proteins includes transcriptional regulators that play a role in the patterning of leaf proximal and distal regions. Members of this family are capable of interacting with BELL transcription factors, which may be mediated through a specific domain within these proteins. Additionally, they possess a domain that is essential for interactions with KNOX proteins, suggesting a role in complex formation with other regulatory proteins to modulate gene expression during plant development.
