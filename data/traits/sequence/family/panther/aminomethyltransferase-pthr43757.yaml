identifier: PANTHER:PTHR43757
label: AMINOMETHYLTRANSFERASE
definition: >-
  This entry represents aminomethyltransferases proteins including GcvT, YgfZ and DmdA. Dimethlysulfonioproprionate (DMS) is catabolised in marine bacterioplankton through a pathway in which the initial step involves demethylation to methylmercaptopropionate (MMPA), which is then further catabolised to methane thiol and acetate. The enzyme responsible for the first step is dimethylsulfonioproprionate demethylase DmdA. The overall fold of DmdA is not similar to other enzymes that typically utilise the cofactor tetrahydrofolate (THF). Instead DmdA has a triple domain structure similar to that observed in GcvT. The glycine cleavage multienzyme complex (GCV) catalyses the catabolism of glycine in eukaryotes. GCVT (aminomethyltransferase, EC:2.1.2.10 ) is a folate-dependent enzyme that catalyses the release of ammonia and the transfer of the methylene carbon unit (C1 unit) to tetrahydrofolate (H4folate) from the aminomethyl intermediate attached to the lipoate cofactor of H-protein. GCV is found in bacteria and the mitochondria of eukaryotes. Mutations in the human GCVT gene are known to cause nonketotic hyperglycinemia. YgfZ is a conserved bacterial protein that plays a crucial role in iron-sulphur cluster metabolism by facilitating the repair of damaged [Fe-S] clusters through folate-dependent mechanisms. While structurally homologous to glycine cleavage T-proteins (GcvT), YgfZ has evolved distinct functionality despite maintaining the characteristic folate-binding domain. Both proteins bind tetrahydrofolate derivatives, but where GcvT participates in glycine catabolism by transferring methylene groups to tetrahydrofolate, YgfZ instead uses its folate-binding capabilities to support cellular processes protecting iron-sulphur clusters from oxidative damage.
