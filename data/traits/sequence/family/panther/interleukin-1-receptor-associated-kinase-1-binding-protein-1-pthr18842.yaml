identifier: PANTHER:PTHR18842
label: "INTERLEUKIN-1 RECEPTOR-ASSOCIATED KINASE 1-BINDING PROTEIN 1"
definition: >-
  Interleukin-1 receptor-associated kinase 1-binding protein 1 (IRAK1BP1, also known as SIMPL) was originally identified in a yeast two-hybrid screen system. In mice, IRAK1BP1 inhibits inflammation by promoting nuclear translocation of NF-kappaB p50. In Haliotis diversicolor, IRAK1BP1 plays an important role in the adult abalone immune system and might be essential in embryo and larval development in abalone.
