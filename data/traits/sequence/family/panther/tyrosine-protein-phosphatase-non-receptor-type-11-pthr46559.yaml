label: "TYROSINE-PROTEIN PHOSPHATASE NON-RECEPTOR TYPE 11"
definition: >-
  TYROSINE-PROTEIN PHOSPHATASE NON-RECEPTOR TYPE 11 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46559. PANTHER protein class: protein phosphatase, protein modifying enzyme. Members are annotated with the molecular function protein tyrosine phosphatase activity, receptor tyrosine kinase binding, cell adhesion molecule binding. Members participate in positive regulation of ERK1 and ERK2 cascade, protein dephosphorylation. Members localise to cytoplasm.
