definitions:
  - kind: GENERAL
    text: >-
      UVRC/OXIDOREDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30562. PANTHER protein class: endodeoxyribonuclease. Members participate in DNA damage response. Members localise to endonuclease complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The UvrC family proteins are involved in the nucleotide excision repair (NER) system, which identifies and processes DNA lesions. Members of this family, known as UvrABC system proteins, play a critical role in incising damaged DNA at both the 5' and 3' sides of the lesion. The N-terminal half of these proteins is responsible for the 3' incision, while the C-terminal half carries out the 5' incision. This dual incision mechanism is essential for the removal of the damaged DNA segment, allowing for subsequent repair synthesis. The UvrC family proteins, therefore, maintain genomic integrity by correcting DNA damage caused by various factors, including UV radiation and chemical mutagens. Their action is crucial for preventing mutations that could lead to cell malfunction or disease.
    source: "InterPro:IPR050066 abstract (LLM-generated, not curator-reviewed)"
