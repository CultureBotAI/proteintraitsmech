identifier: PANTHER:PTHR20937
label: IP14615P
definition: >-
  This class C basic helix-loop-helix (bHLH) family of transcription factors consists of mesogenin and orthologues MesP1 (mesoderm posterior protein 1) and MesP2. Mesogenin is involved in specifying the paraxial mesoderm, which gives rise to all future trunk and limb skeletal muscles in vertebrates. MesP1 is expressed in the posterior part of the embryonic mesoderm and is expressed in cardiac progenitors during embryogenesis and required for cardiovascular development. Mesp2 plays a critical role in establishing the rostro-caudal patterning of each somite, as well as somite boundary formation.
