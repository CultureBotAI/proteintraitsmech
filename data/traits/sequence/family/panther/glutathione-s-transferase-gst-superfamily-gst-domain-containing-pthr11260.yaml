identifier: PANTHER:PTHR11260
label: "GLUTATHIONE S-TRANSFERASE, GST, SUPERFAMILY, GST DOMAIN CONTAINING"
definition: >-
  This entry represents a group of cytosolic GSTs, including Omega and Tau family members. Proteins in this family are known to catalyse the following reaction types: conjugate addition, dehydroascorbate reductase, disulfide bond reductase, nucleophilic addition, nucleophilic aromatic substitution, nucleophilic substitution (SN2), peroxidase, and thiolysis reactions. For example, protein sepia (UniProtKB:Q9VSL3) has experimentally-confirmed pyrimidodiazepine synthase activity with 6-pyruvoyltetrahydropterin, which is a reaction involved in eye pigment synthesis in Drosophila. Additionally, it has experimentally-confirmed dehydroascorbate reductase activity and disulfide bond reductase activity with beta-hydroxyethylene disulfide.
definition_source: "InterPro:IPR045073 abstract (PANTHER PTHR11260 is a member signature)"
