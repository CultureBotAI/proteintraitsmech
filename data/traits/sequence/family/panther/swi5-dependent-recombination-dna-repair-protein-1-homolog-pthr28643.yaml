identifier: PANTHER:PTHR28643
label: "SWI5-DEPENDENT RECOMBINATION DNA REPAIR PROTEIN 1 HOMOLOG"
definition: >-
  SFR is a component of the SWI5-SFR1 complex, a complex required for double-strand break repair via homologous recombination. It interacts with estrogen receptor alpha and may be a transcriptional modulator for estrogen receptor alpha.
