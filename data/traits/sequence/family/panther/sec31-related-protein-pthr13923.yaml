identifier: PANTHER:PTHR13923
label: "SEC31-RELATED PROTEIN"
definition: >-
  This entry contains proteins with WD40 repeats and includes protein transport protein SEC31, which is a component of the coat protein complex II (COPII). COPII promotes the formation of transport vesicles from the endoplasmic reticulum by deformating the endoplasmic reticulum membrane into vesicles and selectiing cargo molecules. In humans and other mammals, there are two SEC31 proteins known as SEC31A and SEC31B.
