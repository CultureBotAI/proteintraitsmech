identifier: PANTHER:PTHR23334
label: "CCAAT/ENHANCER BINDING PROTEIN"
definition: >-
  This entry includes a group of basic-leucine zipper domain containing proteins, including CCAAT/enhancer-binding protein (C/EBP) from animals and BZIP23 (AT2G16770, ) and BZIP19 (At4g35040, ) from Arabidopsis. They are zipper transcription factors that bind to sequence-specific DNA. Drosophila C/EBP may be required for the expression of gene products mediating border cell migration. Arabidopsis BZIP19 and BZIP23 regulate the adaptation to zinc deficiency. Mammalian C/EBP consists of CEBPalpha/beta/delta/epsilon/gamma. C/EBP-alpha coordinates proliferation arrest and the differentiation of myeloid progenitors, adipocytes, hepatocytes, keratinocytes, and cells of the lung and placenta. C/EBP-beta is important in the differentiation and maturation of adipocytes and is increased during ER stress and proinflammatory conditions.
definition_source: "InterPro:IPR031106 abstract (PANTHER PTHR23334 is a member signature)"
