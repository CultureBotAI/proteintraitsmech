identifier: PANTHER:PTHR21497
label: "UBIQUITIN LIGASE E3 ALPHA-RELATED"
definition: >-
  This entry represents a group of E3 ubiquitin-protein ligases, including UBR1, UBR2 and UBR3. They are part of the N-end rule pathway. They recognize and bind to proteins bearing specific N-terminal residues, leading to their ubiquitination and subsequent degradation. The UBR1 protein was shown to bind specifically to proteins bearing N-terminal residues that are destabilising according to the N-end rule, but not to otherwise identical proteins bearing stabilising N-terminal residues. UBR1 contains an N-terminal conserved region (the UBR-type zinc finger) which is also found in various proteins implicated in N-degron recognition.
definition_source: "InterPro:IPR039164 abstract (PANTHER PTHR21497 is a member signature)"
