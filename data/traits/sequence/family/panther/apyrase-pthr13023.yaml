identifier: PANTHER:PTHR13023
label: APYRASE
definition: >-
  This family consists of several eukaryotic apyrase (or adenosine diphosphatase) proteins (EC:3.6.1.5), and related nucleoside diphosphatases (EC:3.6.1.6). The salivary apyrases of blood-feeding arthropods are nucleotide hydrolysing enzymes implicated in the inhibition of host platelet aggregation through the hydrolysis of extracellular adenosine diphosphate. Soluble calcium-activated nucleotidase 1 (CANT1) is the human homologue.
