identifier: PANTHER:PTHR11985
label: "GLYCEROL-3-PHOSPHATE DEHYDROGENASE"
definition: >-
  FAD-dependent glycerol-3-phosphate dehydrogenase (G3PDH; EC:1.1.5.3) catalyses the conversion of glycerol-3-phosphate into dihydroxyacetone phosphate: sn-glycerol-3-phosphate + a quinone = glycerone phosphate + a quinol Insulin exposure often stimulates G3PDH activity, and thus is key to reducing the effects of the disease diabetes. In obese people, where insulin resistance has been demonstrated, the amount of G3PDH has been shown to be correspondingly lower than that in normal weight people. In bacteria it is associated with the utilisation of glycerol coupled to respiration. In Escherichia coli and Haemophilus influenzae, two isozymes are known: one expressed under anaerobic conditions (gene glpA) and one in aerobic conditions (gene glpD). In eukaryotes, a mitochondrial form of GPD participates in the glycerol phosphate shuttle in conjunction with an NAD-dependent cytoplasmic GPD (EC:1.1.1.8). This mechanism is responsible for the preservation of a redox balance. In this environment, the enzyme has been recorded to increase activity in the presence of calcium. These enzymes are proteins of about 60 to 70 Kd which contain a probable FAD-binding domain in their N-terminal extremity. The mammalian enzyme differs from the bacterial or yeast proteins by having an EF-hand calcium-binding region (see PROSITE:PDOC00018) in its C-terminal extremity.
