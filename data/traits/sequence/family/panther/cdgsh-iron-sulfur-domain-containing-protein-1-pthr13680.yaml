identifier: PANTHER:PTHR13680
label: "CDGSH IRON-SULFUR DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  Proteins in this family contain the CDGSH-type zinc finger. Interestingly, they do not contain any zinc ions, but rather iron contained in a 2Fe-2S (iron-sulfur) cluster. The conserved sequence C-X-C-X(2)-(S/T)-X(3)-P-X-C-D-G-(S/A/T)-H is a defining feature of this unique family of proteins and is likely involved in iron binding. They play an important part in the proliferation of breast cancer cells and tumour formation. CISD1 (also known as mitoNEET) is a mitochondrial protein that plays an important part in mitochondrial bioenergetics. It also plays a part in insulin regulation, inflammation and autophagy. CISD2 (also known as NAF-1) can be found in endoplasmic reticulum (ER) and mitochondrial outer membrane. It regulates autophagy. Mutations of the CISD2 gene cause Wolfram syndrome 2 (WFS2), a rare disorder characterised by juvenile-onset insulin-dependent diabetes mellitus with optic atrophy.
definition_source: "InterPro:IPR045131 abstract (PANTHER PTHR13680 is a member signature)"
