label: "MITOCHONDRIAL IMPORT INNER MEMBRANE TRANSLOCASE SUBUNIT TIM-17"
definition: >-
  MITOCHONDRIAL IMPORT INNER MEMBRANE TRANSLOCASE SUBUNIT TIM-17 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10485. PANTHER protein class: transporter. Members are annotated with the molecular function protein transmembrane transporter activity. Members participate in protein import into mitochondrial matrix, protein targeting, protein targeting to mitochondrion. Members localise to TIM23 mitochondrial import inner membrane translocase complex, membrane.
