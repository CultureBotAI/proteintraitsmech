  - kind: GENERAL
    text: >-
      This family of proteins includes components of the Mediator complex, which are coactivators involved in the transcription regulation of RNA polymerase II-dependent genes. They function as a bridge between gene-specific regulatory proteins and the basal transcription machinery, facilitating the assembly of a preinitiation complex. Members of this family are also involved in various developmental processes, including neuronal differentiation, eye development, and limb morphogenesis. Some proteins within this family may regulate the expression of neural basic helix-loop-helix genes, influencing patterns of neuronal differentiation and development in specific regions of the nervous system.
