identifier: PANTHER:PTHR43536
label: "MANNOSYLGLYCOPROTEIN ENDO-BETA-MANNOSIDASE"
definition: >-
  Exo-beta-D-glucosaminidase (EC:3.2.1.165) is an enzyme found in fungi and bacteria that hydrolyses chitosan and chitooligosaccharides with retention of anomeric configuration. It has no beta-mannosidase activity. Mannosylglycoprotein endo-beta-mannosidase (EC:3.2.1.152) is a glycosidase that specifically hydrolyses the Man-beta-1,4-GlcNAc linkage in the trimannosyl core structure of N-glycans. This enzyme is found in plants and bacteria. This entry includes exo-beta-D-glucosaminidase and endo-beta-mannosidase (also known as mannosylglycoprotein endo-beta-mannosidase). They contain an immunoglobulin-like fold.
