identifier: PANTHER:PTHR28246
label: "G1-SPECIFIC TRANSCRIPTIONAL REPRESSOR WHI5-RELATED"
definition: >-
  This entry includes Whi5 and its paralogue, Srl3 (also known as Whi7). Each contains a GTB (G1/S transcription factor binding) motif. Whi5 is a transcriptional repressor that negatively regulates G1-specific, SBF- and MBF-dependent transcription. Whi7 is a cell cycle regulated protein that acts as a depressor of the Start transcriptional program.
