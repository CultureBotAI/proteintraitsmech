identifier: PANTHER:PTHR46196
label: "TRANSCRIPTION FACTOR BHLH155-LIKE ISOFORM X1-RELATED"
definition: >-
  Transcription factor LHW is a transcription activator that regulates root development. It shows weak sequence similarity to basic helix-loop-helix (bHLH)-domain proteins. LHW coordinately controls the number of all vascular cell types by regulating the size of the pool of cells from which they arise. This entry represents a group of transcription factors from plants, including LHW and LHWL1/2/3 from Arabidopsis.
