definitions:
  - kind: GENERAL
    text: >-
      POLY(U)-BINDING-SPLICING FACTOR PUF60-B-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47330. PANTHER protein class: RNA splicing factor, RNA processing factor. Members are annotated with the molecular function RNA binding. Members participate in regulation of alternative mRNA splicing, via spliceosome, alternative mRNA splicing, via spliceosome, mRNA splice site recognition. Members localise to catalytic step 2 spliceosome, precatalytic spliceosome.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in nuclear processes such as pre-mRNA splicing, transcription regulation, and apoptosis. They act as DNA- and RNA-binding proteins, regulating MYC transcription in association with FUBP1 through the core-TFIIH basal transcription factor. They can function as transcriptional repressors and modulate alternative splicing of mRNAs. These proteins are known to bind to relaxed DNA of active promoter regions, the pyrimidine tract, and 3'-splice site regions of pre-mRNA, with enhanced binding in the presence of U2AF2. They also interact with Y5 RNA in association with RO60 and bind to poly(U) RNA. Additionally, they may be involved in homodimerization and protein-protein interactions through their atypical third RNA recognition motif, known as the PUMP domain.
    source: "InterPro:IPR051974 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
