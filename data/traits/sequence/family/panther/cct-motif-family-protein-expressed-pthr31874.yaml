identifier: PANTHER:PTHR31874
label: "CCT MOTIF FAMILY PROTEIN, EXPRESSED"
definition: >-
  CCT MOTIF FAMILY PROTEIN, EXPRESSED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31874. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 16 of its annotated subfamilies. Subfamilies participate in regulation of DNA-templated transcription, regulation of cellular metabolic process, regulation of cellular biosynthetic process. Subfamilies localise to nucleus, intracellular anatomical structure.
