  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the maintenance of cellular energy homeostasis and adenine nucleotide metabolism. Members of this family are capable of catalyzing the reversible transfer of a phosphate group between ATP and AMP. This reaction is a fundamental process in the energy exchange within cells, helping to regulate the balance of adenine nucleotides. These enzymes are typically located in the chloroplast and play a pivotal role in the energy metabolism of plant cells.
