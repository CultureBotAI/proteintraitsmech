identifier: PANTHER:PTHR12156
label: "PLECKSTRIN HOMOLOGY-LIKE DOMAIN, FAMILY B, MEMBER 3"
definition: >-
  PLECKSTRIN HOMOLOGY-LIKE DOMAIN, FAMILY B, MEMBER 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12156. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies participate in regulation of microtubule cytoskeleton organization. Subfamilies localise to cell cortex, cytoplasmic region, intracellular anatomical structure.
