identifier: PANTHER:PTHR21346
label: "FUN14 DOMAIN CONTAINING"
definition: >-
  This is a family of short proteins found in eukaryotes, bacteria and archaea. In humans, FUN14 domain-containing protein 1 (FUND1) acts as an activator of hypoxia-induced mitophagy, an important mechanism for mitochondrial quality control.
