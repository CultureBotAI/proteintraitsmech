identifier: PANTHER:PTHR31451
label: "Mannan endo-1,4-beta-mannosidase-like"
definition: >-
  This family includes mannan endo-1,4-beta-mannosidases from plants and fungi (EC:3.2.1.78). They catalyse the random hydrolysis of (1->4)-beta-D-mannosidic linkages in mannans, galactomannans and glucomannans and are crucial for depolymerization of seed galactomannans and wood galactoglucomannans. The deconstruction of the plant cell wall has had increasing importance as a key biological process in the development of a sustainable biofuel industry. In plants, they are related to the process of weakening the tissues surrounding the embryo during seed germination. This entry also includes cellulase domain-containing proteins from bacteria.
definition_source: "InterPro:IPR045053 abstract (PANTHER PTHR31451 is a member signature)"
