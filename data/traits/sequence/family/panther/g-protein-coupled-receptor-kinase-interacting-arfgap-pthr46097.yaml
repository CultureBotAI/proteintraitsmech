identifier: PANTHER:PTHR46097
label: "G PROTEIN-COUPLED RECEPTOR KINASE INTERACTING ARFGAP"
definition: >-
  This entry represents ARF GTPase-activating protein Git from Drosophila melanogaster, ARF GTPase-activating protein GIT1/2 from humans, and similar proteins from animals. Git is a GTPase-activating protein for ADP ribosylation factor family members, including ARF1. It promotes proper muscle morphogenesis and proper guidance and targeting of subsets of myotubes. Git may be important for brain development. GIT1 plays an important role in dendritic spine morphogenesis and synapse formation. It plays a crucial role in regulating GABA(A) receptor synaptic stability, leading to F-actin stabilization. It may also may regulate activation of the canonical NF-kappa-B signal in bone mesenchymal stem cells, eventually leading to enhanced production of VEGFA and other angiogenic factors.
definition_source: "InterPro:IPR047161 abstract (PANTHER PTHR46097 is a member signature)"
