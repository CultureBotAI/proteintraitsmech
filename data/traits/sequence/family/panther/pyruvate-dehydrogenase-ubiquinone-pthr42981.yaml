identifier: PANTHER:PTHR42981
label: "PYRUVATE DEHYDROGENASE [UBIQUINONE]"
definition: >-
  This family includes a group of proteins from bacteria and archaea, which belong to the thiamine pyrophosphate (TPP family), such as pyruvate oxidase (POXB) from Lactobacillus plantarum which decarboxylates pyruvate, producing hydrogen peroxide and the energy-storage metabolite acetylphosphate. This entry also includes a closely homologous member, pyruvate dehydrogenase [ubiquinone] PoxB from Escherichia coli, a peripheral membrane protein that catalyses the oxidative decarboxylation of the central metabolite pyruvate to CO(2) and acetate. It has pyruvate oxidase as an alternate name.
definition_source: "InterPro:IPR047211 abstract (PANTHER PTHR42981 is a member signature)"
