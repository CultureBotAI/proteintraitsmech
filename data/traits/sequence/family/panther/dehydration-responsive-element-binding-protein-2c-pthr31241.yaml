identifier: PANTHER:PTHR31241
label: "DEHYDRATION-RESPONSIVE ELEMENT-BINDING PROTEIN 2C"
definition: >-
  DEHYDRATION-RESPONSIVE ELEMENT-BINDING PROTEIN 2C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31241. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 29 of its annotated subfamilies. Subfamilies are annotated with the molecular function transcription cis-regulatory region binding, DNA-binding transcription factor activity. Subfamilies participate in positive regulation of DNA-templated transcription, response to stress. Subfamilies localise to nucleus, intracellular anatomical structure.
