  - kind: GENERAL
    text: >-
      The eukaryotic ribosomal protein eL43 family is comprised of proteins that are components of the large ribosomal subunit (LSU) and are involved in protein synthesis within the cell. Members of the family bind to the 23S rRNA, which is a critical component of the peptidyl transferase center (PTC) in the LSU. This center catalyzes the formation of peptide bonds, polymerizing amino acids into polypeptide chains. The nascent polypeptides exit the ribosome through a tunnel in the LSU, where they interact with various protein factors for processing, targeting, and membrane insertion. Some members of the family are also suggested to have a putative zinc-binding function, although this is not universally noted across all family members.
    source: "InterPro:IPR050522 abstract (LLM-generated, not curator-reviewed)"
