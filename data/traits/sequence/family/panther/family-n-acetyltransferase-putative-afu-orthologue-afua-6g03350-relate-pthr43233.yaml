  - kind: GENERAL
    text: >-
      This family of proteins includes putative acetyltransferases that are implicated in the biosynthesis of secondary metabolites such as butenolide, a compound with antibiotic properties. These proteins are predicted to contribute to the formation of a 4-acetamido-2-butenoic acid intermediate from glutamic acid. The exact biochemical activities of these enzymes in the butenolide biosynthetic pathway have not been experimentally confirmed, but their roles are consistent with the production of this mycotoxin, which is involved in plant-pathogen interactions but is not a major factor in the spread of head blight in wheat.
    source: "InterPro:IPR053144 abstract (LLM-generated, not curator-reviewed)"
