  - kind: GENERAL
    text: >-
      The GAMETE CELL DEFECTIVE 1 family proteins are mitochondrial-associated factors essential for plant fertility, playing a critical role in both male and female gametophyte functions and development. They ensure the integrity of female gametic mitochondria and are involved in various developmental processes such as embryo apical-basal and dorsal-ventral patterning, endosperm development, and central vacuole dynamics. These proteins modulate the expression of genes related to these processes and are implicated in triggering programmed cell death for endosperm cellularization and maturation. Additionally, they are crucial for microspore development, pollen production, germination, and mitochondrial-driven cell-to-cell communication in embryo sacs, facilitating reciprocal signaling between central and egg cells.
    source: "InterPro:IPR052851 abstract (LLM-generated, not curator-reviewed)"
