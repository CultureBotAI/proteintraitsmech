  - kind: GENERAL
    text: >-
      This family of proteins includes nuclear GTPases that are predominantly expressed in germinal center B-cells. Members of this family are implicated in the regulation of somatic hypermutation, a process critical for the diversification of the B-cell receptor repertoire. They exert their function by potentially inhibiting the activity of activation-induced cytidine deaminase (AICDA), an enzyme that introduces mutations into the immunoglobulin genes during somatic hypermutation and class switch recombination. Through this inhibition, these proteins may contribute to maintaining genome stability in B-cells by reducing the frequency of somatic mutations.
