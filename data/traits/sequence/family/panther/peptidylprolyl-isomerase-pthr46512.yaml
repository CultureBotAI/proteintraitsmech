identifier: PANTHER:PTHR46512
label: "PEPTIDYLPROLYL ISOMERASE"
definition: >-
  This family of proteins includes immunophilins with peptidyl-prolyl cis-trans isomerase (PPIase) and co-chaperone activities such as Peptidyl-prolyl cis-trans isomerase FKBP4/5. FKBP4/5 are also involved in the intracellular trafficking of steroid hormone receptors and play a role in maintaining these receptors in the cytoplasm when unliganded. FKBP4/5 regulate Akt/AKT1 activity by promoting interaction with PHLPP1, enhancing Akt/AKT1 dephosphorylation and activation. They also interact with components of the NF-kappaB signaling pathway, influencing kinase activity and IFN production. FKBP4 plays a role in microtubule dynamics, neuronal growth cone regulation, and may protect against oxidative stress in mitochondria. Others are involved in protein folding, cell division, adhesion, elongation, and hormonal control of plant development, such as Peptidyl-prolyl cis-trans isomerase PASTICCINO1 from Arabidopsis. The family is characterised by the presence of TPR repeats and FKBP-type domains.
definition_source: "InterPro:IPR050754 abstract (PANTHER PTHR46512 is a member signature)"
