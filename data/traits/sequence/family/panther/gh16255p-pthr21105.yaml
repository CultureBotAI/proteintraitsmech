identifier: PANTHER:PTHR21105
label: GH16255P
definition: >-
  GH16255P — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21105. Members are annotated with the molecular function signaling receptor activator activity, protein kinase activator activity, kinase regulator activity. Members participate in positive regulation of intracellular signal transduction, regulation of MAPK cascade, regulation of cellular process. Members localise to cell junction, terminal bouton, axon terminus.
