  This group includes nucleotide sugar dehydrogenases UDP-N-acetyl-D-mannosamine dehydrogenase, UDP-N-acetyl-D-galactosaminuronic acid dehydrogenase and UDP-N-acetyl-D-glucosamine 6-dehydrogenase. These enzymes participate in acetamido sugar biosynthesis.
