identifier: PANTHER:PTHR44314
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 70"
definition: >-
  This family of proteins is involved in the structural and functional organization of cilia and flagella. Members of this family are axoneme-binding proteins that contribute to the regulation of ciliary and flagellar motility, as well as the determination of cilium length. While the conserved TPR domains within these proteins are not essential for ciliary targeting, the N-terminal region is crucial for proper localization to cilia and/or interaction with the axoneme structure. These proteins are implicated in the regulation of the outer dynein arm, which is a critical component for the movement of cilia and flagella.
