identifier: PANTHER:PTHR44215
label: "WD REPEAT-CONTAINING PROTEIN 75"
definition: >-
  This entry includes WD repeat-containing protein 75 (WDR75) from animals and its orthologues, Nan1/Utp17 (NET1-associated nuclear protein 1) from yeast. These proteins are involved in ribosome biogenesis, specifically as factors within the small subunit (SSU) processome, which is the initial precursor to the small eukaryotic ribosomal subunit. These proteins are essential for various stages of pre-rRNA processing, including RNA folding, modification, rearrangement, and cleavage. They also contribute to the targeted degradation of pre-ribosomal RNA by the RNA exosome. Additionally, they play a crucial role in the nucleolar processing of pre-18S ribosomal RNA and are necessary for the optimal transcription of pre-ribosomal RNA by RNA polymerase I.
definition_source: "InterPro:IPR053826 abstract (PANTHER PTHR44215 is a member signature)"
