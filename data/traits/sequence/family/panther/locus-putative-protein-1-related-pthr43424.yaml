identifier: PANTHER:PTHR43424
label: "LOCUS PUTATIVE PROTEIN 1-RELATED"
definition: >-
  This family of proteins includes members that are potentially involved in the biosynthesis and transport of polysaccharides. Some proteins in this family may play a role in the translocation of nascent O-polysaccharide molecules and/or their ligation to lipid A core units, which is a critical step in the assembly of bacterial cell wall components. The proteins are characterized by similarities to known polysaccharide synthases, suggesting a function in the synthesis of complex sugar chains that are essential for bacterial cell wall integrity and virulence.
