identifier: PANTHER:PTHR10797
label: "CCR4-NOT TRANSCRIPTION COMPLEX SUBUNIT"
definition: >-
  This entry includes subunits CNOT7 and CNOT8 of the CCR4-NOT complex required for RNA degradation. Both CNO7 and CNOT8 are 3'-5' poly(A) exoribonucleases removing the poly-A tail and have somewhat redundant activities. This entry also includes CNOT7/8 yeast homologue, Pop2, which is a nuclease subunit of the yeast Ccr4-Not complex.
