identifier: PANTHER:PTHR46287
label: "BTB/POZ AND TAZ DOMAIN-CONTAINING PROTEIN 3-RELATED"
definition: >-
  This entry represents a group of plant BTB/POZ and TAZ domain-containing proteins, including BT1-5 from Arabidopsis. They are scaffold proteins that play roles in both male and female gametophyte development. BT2 can activate telomerase expression in mature Arabidopsis leaves. It mediates multiple responses to nutrients, stresses, and hormones in Arabidopsis.
