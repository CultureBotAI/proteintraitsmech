identifier: PANTHER:PTHR24035
label: "MULTIPLE EPIDERMAL GROWTH FACTOR-LIKE DOMAINS PROTEIN"
definition: >-
  The MEGF/SIB family is involved in various cellular functions, including cellular adhesion, phagocytosis, and neuron spacing in the retina. Members of the family act as membrane receptors for the engulfment of apoptotic cells, interacting with signals like C1q and phosphatidylserine. They are implicated in the formation of vacuoles and may uptake amyloid-beta peptides. Essential in myogenesis, they regulate the balance between proliferation and differentiation of muscle satellite cells via the notch signaling pathway. Additionally, they contribute to the even distribution of neuron subtypes across the retina, ensuring uniform visual field processing.
