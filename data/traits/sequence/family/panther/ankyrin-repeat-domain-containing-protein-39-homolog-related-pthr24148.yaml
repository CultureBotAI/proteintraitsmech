  - kind: GENERAL
    text: >-
      This family of proteins is involved in diverse cellular processes including non-self-recognition and growth regulation in fungi. Members of this family play a role in restricting heterokaryon formation by recognizing genetic differences at specific loci, which is crucial for maintaining organismal integrity during asexual growth. Additionally, some proteins in this family may influence gene expression indirectly through protein-protein interactions rather than direct DNA binding or possessing typical transcriptional activation motifs. These interactions can modulate the suppression of mutations in promoters induced by transposable elements.
