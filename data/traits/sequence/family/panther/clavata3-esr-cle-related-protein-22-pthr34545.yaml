identifier: PANTHER:PTHR34545
label: "CLAVATA3/ESR (CLE)-RELATED PROTEIN 22"
definition: >-
  This entry represents a group of the CLAVATA3/ESR (CLE)-related proteins, including CLE 16/17/21/22 from Arabidopsis. They are extracellular signal peptides that regulate cell fate. They may act as suppressors of plant stem cell differentiation.
