identifier: PANTHER:PTHR28108
label: "SWR1-COMPLEX PROTEIN 3"
definition: >-
  Swc3 is a component of the SWR1 complex which mediates the ATP-dependent exchange of histone H2A for the H2A variant HZT1 leading to transcriptional regulation of selected genes by chromatin remodeling. SWC3 has been used to refer to both SWC3/YAL011W, whose gene product is involved in chromatin remodeling and ER biogenesis, and ALR1/YOL130W, a plasma membrane transporter. Proteins in this entry are mainly found in ascomycetes.
definition_source: "InterPro:IPR037651 abstract (PANTHER PTHR28108 is a member signature)"
