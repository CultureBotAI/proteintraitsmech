identifier: PANTHER:PTHR12881
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 1"
definition: >-
  This family of proteins functions as components of the Mediator complex, which is a coactivator essential for the regulated transcription of RNA polymerase II-dependent genes. These proteins act as a bridge, conveying information from gene-specific regulatory proteins to the basal RNA polymerase II transcription machinery. They are recruited to promoters through direct interactions with regulatory proteins and serve as a scaffold for the assembly of a functional preinitiation complex with RNA polymerase II and the general transcription factors. Some members of this family have specific roles in processes such as erythroid differentiation, embryogenesis, and development of various organs and systems.
