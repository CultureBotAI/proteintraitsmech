identifier: PANTHER:PTHR11098
label: "NICOTINATE PHOSPHORIBOSYLTRANSFERASE"
definition: >-
  Nicotinate phosphoribosyltransferase (EC:6.3.4.21) is the rate-limiting enzyme that catalyses the first reaction in the NAD salvage synthesis. Members in this family can be split into two further subfamilies represented in InterPro:IPR006405 and InterPro:IPR006406. Members in InterPro:IPR006405 have a different (longer) spacing of several key motifs and have an additional C-terminal domain of up to 100 residues. However, one argument suggesting that this family represents the same enzyme is that no species has a member of both subfamilies. Another is that the gene encoding this protein is located near other NAD salvage biosynthesis genes in Nostoc and in at least four different Gram-positive bacteria.
