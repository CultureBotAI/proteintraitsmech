identifier: PANTHER:PTHR15107
label: "RETINOBLASTOMA BINDING PROTEIN 8"
definition: >-
  This entry includes DNA endonuclease RBBP8 from animals and protein gamma response 1 from plants. This entry also includes human RBBP8 N-terminal-like protein (RBBP8NL), whose function is not clear, and some uncharacterised fungal sequences. RBBP8 is an endonuclease that cooperates with the MRE11-RAD50-NBN (MRN) complex in processing meiotic and mitotic double-strand breaks (DSBs) by ensuring both resection and intrachromosomal association of the broken ends.
