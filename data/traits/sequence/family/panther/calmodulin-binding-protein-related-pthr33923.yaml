identifier: PANTHER:PTHR33923
label: "CALMODULIN-BINDING PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant calmodulin binding proteins, including PICBP from Arabidopsis which binds calmodulin in a calcium-dependent manner and may play a role in general plant defense.
