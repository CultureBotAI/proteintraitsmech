identifier: PANTHER:PTHR37564
label: "KINETOPLAST DNA-ASSOCIATED PROTEIN"
definition: >-
  This family of proteins includes histone H1-like DNA-binding proteins that are involved in the organization and segregation of kinetoplast DNA (kDNA), a unique mitochondrial DNA structure found in kinetoplastid protozoa. These proteins bind to specific fragments of minicircle DNA and play a crucial role in maintaining the highly organized compact disk structure of the kDNA network. Through DNA charge neutralization and condensation, they are able to compact the kDNA networks, which consist of thousands of minicircles and dozens of maxicircles catenated together.
