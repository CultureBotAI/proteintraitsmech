identifier: PANTHER:PTHR46213
label: "TRANSCRIPTIONAL ACTIVATOR DEMETER"
definition: >-
  DNA glycosylases are required to regulate the DNA methylation pathway at discrete regions across the plant genome, and probably protect the genome from excess methylation. Arabidopsis encodes four active demethylases with 5-methylcytosine DNA glycosylase/lyase activities, namely DEMETER (DME), DME-Like 1 (DML1)/ROS1 (Repressor of Silencing 1), DML2 and DML3. Both ROS1 and DME actively remove DNA methylation in all methylated cytosine contexts through a base excision repair (BER) mechanism. DML2/3 and ROS1 play important roles in the regulation of nucleotide-binding leucine-rich repeat (NLR) genes, a class of important plant disease resistance genes. DEMETER functions mainly in the central cells of female gametophytes involved in gene imprinting, which allows the expression of the maternal copy of the imprinted MEA gene before fertilization, possibly by antagonizing or suppressing DNA methylation on target promoter and acts in a sequence nonspecific manner. The other three demethylases, ROS1, DML2, and DML3, were shown to be largely active in somatic cells. ROS1 is constitutively expressed and regulates gene expression by preventing the spread of DNA methylation and transcriptional silencing from transposons and is involved in UV-B induced- and oxidative DNA damage repair. It also regulates defence genes by demethylation of RMG1 (disease resistance gene) and RLP43 (an orphan immune receptor gene) promoters.
