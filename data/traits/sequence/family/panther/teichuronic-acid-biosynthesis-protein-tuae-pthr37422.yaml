identifier: PANTHER:PTHR37422
label: "TEICHURONIC ACID BIOSYNTHESIS PROTEIN TUAE"
definition: >-
  This entry represents O-antigen ligase from Escherichia coli (WaaL,) and similar enzymes involved in the biosynthesis and modification of polysaccharides, such as O-antigens, which are components of lipopolysaccharides (LPS) on the outer membrane of Gram-negative bacteria.
