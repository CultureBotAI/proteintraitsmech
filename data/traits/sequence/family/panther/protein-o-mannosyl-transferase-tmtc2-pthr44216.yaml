  - kind: GENERAL
    text: >-
      This family of proteins includes O-mannosyl-transferases that are primarily involved in the post-translational modification of proteins by transferring mannosyl residues to the hydroxyl groups of serine or threonine residues. Members of this family have distinct roles, particularly in the modification of the cadherin superfamily, by adding O-linked mannose glycans at specific regions. Some members are also known to modify other proteins, such as PDIA3, indicating a broader substrate specificity within this family.
