identifier: PANTHER:PTHR45970
label: AGAP004664-PA
definition: >-
  This entry includes a group of homeobox proteins mainly found in vertebrates, including HXA9/HXB9/HXC9/HCD9 from humans. They are sequence-specific transcription factors which are involved in regulating developmental gene expression in cell lineage differentiation.
