identifier: PANTHER:PTHR35190
label: "PROTEIN DCD1B"
definition: >-
  This entry represents a group of poorly characterised proteins found in bacteria, some archaea and microscopic eukaryotes, such as proteins dcd1A/B from Dictyostelium discoideum. They may contain a cysteine protease-like domain.
