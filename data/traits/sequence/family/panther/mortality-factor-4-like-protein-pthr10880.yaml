identifier: PANTHER:PTHR10880
label: "MORTALITY FACTOR 4-LIKE PROTEIN"
definition: >-
  This entry represents MRG protein family, whose members include MORF4L1/2 (MRG15/MRGX) and MSL3L1/2 from humans, ESA1-associated factor 3 (Eaf3) from yeasts and male-specific lethal 3 (MSL3) from flies. They contain an N-terminal chromodomain that binds H3K36me3, a histone mark associated with transcription elongation. Saccharomyces cerevisiae Eaf3 is a component of both NuA4 histone acetyltransferase and Rpd3S histone deacetylase complexes. It was found that Eaf3 mediates preferential deacetylation of coding regions through an interaction between the Eaf3 chromodomain and methylated H3-K36 that presumably results in preferential association of the Rpd3 complex. The Drosophila MSL proteins (MSL1, MSL2, MSL3, MLE, and MOF) are essential for elevating transcription of the single X chromosome in the male (X chromosome dosage compensation). Together with two partly redundant non-coding RNAs, roX1 and roX2, they form the MSL complex, also known as dosage compensation complex or DCC. MSL complex upregulates transcription by spreading the histone H4 Lys16 (H4K16) acetyl mark and allows compensation for the loss of one X-chromosomal allele by increasing the transcription from the retained allele. The MSL3 chromodomain has been shown to bind DNA and methylated H4K20 in vitro. Human MORF4L1, also known as MRG15, is a component of the NuA4 histone acetyltransferase complex that transcriptional activates genes by acetylation of nucleosomal histones H4 and H2A. This modification may both alter nucleosome - DNA interactions and promote interaction of the modified histones with other proteins which positively regulate transcription. NuA4 complex may also play a direct role in DNA repair when directly recruited to sites of DNA damage. MRG15 is also a component of the mSin3A/Pf1/HDAC co
