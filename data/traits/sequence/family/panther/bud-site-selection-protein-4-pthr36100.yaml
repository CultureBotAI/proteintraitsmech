identifier: PANTHER:PTHR36100
label: "BUD SITE SELECTION PROTEIN 4"
definition: >-
  This family of proteins is involved in the regulation of cell polarity and morphogenesis, particularly in the process of bud site selection and septin organization at the bud neck during mitosis. Members of this family cooperate with other proteins to recognize spatial landmarks, which then serve as references for the establishment of polarity factors that coordinate budding, cytokinesis, and septation. In some species, these proteins also contribute to morphogenesis, adherence, colonization, and infection processes. They play a crucial role in the formation of septin ring structures and may influence the localization of hydrolytic enzymes necessary for cell separation.
