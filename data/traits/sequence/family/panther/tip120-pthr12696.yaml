identifier: PANTHER:PTHR12696
label: TIP120
definition: >-
  This entry includes cullin-associated NEDD8-dissociated proteins 1 (CAND1 also known as TIP120A) and 2 (CAND2); these proteins have a C-terminal TATA-binding protein interacting (TIP20) domain. CAND1 is required for the assembly of the SCF E3 ubiquitin ligase complex. The SCF ubiquitin E3 ligase consists of SKP1, CUL1 and F-box protein, and it regulates ubiquitin-dependent proteolysis. CAND1 binds to CUL1, preventing it from associating with the other components that form the ligase. Neddylation of CUL1 (or the presence of SKP1 and ATP) dissociates it from CAND1, allowing the ligase complex to form. CAND1 also interacts with CUL3, a component of the Cul3-dependent E3 ubiquitin ligase complex. CAND1 has been proposed to be an F-box protein exchange factor, and as substrates of the ligase complex are degraded by the proteasome and depleted, the ligase complex enters an intermediate, deneddylated state when CAND1 can bind, promoting dissociation of the substrate-recognition subunit and recruitment of a new substrate-recognition subunit. CAND2 is uncharacterised but is assumed to have similar roles to CAND1.
definition_source: "InterPro:IPR039852 abstract (PANTHER PTHR12696 is a member signature)"
