identifier: PANTHER:PTHR13493
label: "ZINC FINGER CCHC DOMAIN-CONTAINING"
definition: >-
  ZCCHC4 is an rRNA N6-methyltransferase that specifically methylates the adenine in position 4220 of 28S rRNA. N6-methylation of adenine(4220) in 28S rRNA is required for translation.
