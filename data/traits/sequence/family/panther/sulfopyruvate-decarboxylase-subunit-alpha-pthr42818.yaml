  - kind: GENERAL
    text: >-
      The TPP enzyme family is involved in the biosynthesis of small molecule compounds through the decarboxylation of specific substrates. Members of this family catalyze the decarboxylation of sulfopyruvate to sulfoacetaldehyde, which is a step in the biosynthesis of coenzyme M (2-mercaptoethanesulfonic acid). Additionally, some members are responsible for the decarboxylation of phosphonopyruvate (PnPy) to phosphonoacetaldehyde (PnAA), a precursor in the biosynthesis of phosphinothricin tripeptide (PTT), a natural-product antibiotic and herbicide known as bialaphos (BA). The activity of some enzymes in the family is regulated by oxygen and can be inhibited at high temperatures, although reactivation is possible with reducing agents such as dithionite.
    source: "InterPro:IPR051818 abstract (LLM-generated, not curator-reviewed)"
