  - kind: GENERAL
    text: >-
      The protein family includes bifunctional enzymes with oligoribonuclease and pAp-phosphatase activities, degrading RNA and DNA oligonucleotides up to 33 nucleotides in length, with a preference for shorter substrates. They convert 3'(2')-phosphoadenosine 5'-phosphate (PAP) to AMP, playing a role in RNA metabolism and regulation. Some family members also exhibit cyclic-di-AMP phosphodiesterase activity, impacting cellular processes like growth, DNA repair, and cell wall homeostasis. They may also respond to cellular heme or nitric oxide levels. The family includes uncharacterized proteins, suggesting potential undiscovered functions.
    source: "InterPro:IPR051319 abstract (LLM-generated, not curator-reviewed)"
