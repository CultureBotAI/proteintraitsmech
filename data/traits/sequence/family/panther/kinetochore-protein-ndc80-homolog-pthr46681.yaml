identifier: PANTHER:PTHR46681
label: "KINETOCHORE PROTEIN NDC80 HOMOLOG"
definition: >-
  This family includes plant homologues of Kinetochore protein NDC80, mainly found in clade Streptophyta. NDC80 is essential for accurate chromosome segregation during cell division. Members of this family are involved in the formation of the kinetochore, a critical structure that attaches chromosomes to the spindle microtubules. They play a key role in the spindle checkpoint, ensuring that chromosomes are properly aligned and segregated to prevent aneuploidy and maintain genomic stability.
