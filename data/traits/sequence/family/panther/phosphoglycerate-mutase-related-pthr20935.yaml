  - kind: GENERAL
    text: >-
      This family of proteins exhibits serine/threonine phosphatase activity, with members involved in the dephosphorylation and activation of specific kinases such as Pk92B and MAP3K5. Despite being classified within the phosphoglycerate mutase family, these proteins do not display phosphoglycerate mutase activity. They are implicated in the regulation of mitochondrial dynamics and may act as central mediators for programmed necrosis. Some family members are substrates for KEAP1-dependent ubiquitin ligase complexes and contribute to the repression of NFE2L2-dependent gene expression. They are targeted to the cytosolic side of the outer mitochondrial membrane by a non-cleaved mitochondrial targeting sequence located at the N-terminus, which includes a potential transmembrane alpha-helix.
    source: "InterPro:IPR051021 abstract (LLM-generated, not curator-reviewed)"
