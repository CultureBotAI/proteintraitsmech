identifier: PANTHER:PTHR31843
label: "ALLENE OXIDE CYCLASE 4, CHLOROPLASTIC"
definition: >-
  This family consists of several plant specific allene oxide cyclase proteins (EC:5.3.99.6). The allene oxide cyclase (AOC)-catalysed step in jasmonate (JA) biosynthesis is important in the wound response of tomato.
