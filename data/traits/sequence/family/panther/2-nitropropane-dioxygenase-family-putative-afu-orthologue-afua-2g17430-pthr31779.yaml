  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors and probable transcriptional repressors. Members are involved in the regulation of gene clusters responsible for the biosynthesis of specific secondary metabolites, such as kojic acid, which is a by-product of the fermentation process and acts as a chelation agent. Some proteins within this family are known to bind specific nucleotide sequences to control the expression of genes, including those related to multidrug resistance. The regulatory activities of these proteins are crucial for various cellular processes, including the response to different carbon sources and the control of multidrug resistance gene expression.
    source: "InterPro:IPR052478 abstract (LLM-generated, not curator-reviewed)"
