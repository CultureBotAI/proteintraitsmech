  - kind: GENERAL
    text: >-
      This family of proteins includes various members with roles in cellular structure and signaling. Some proteins in this family are involved in the organization of microtubules and are essential for the assembly of centriole subdistal appendages, indicating a role in cell division and cytoskeletal organization. Other members function as adapter proteins that are crucial for both innate and adaptive immune responses. They mediate T-cell receptor-stimulated activation, regulate thymocyte development, and contribute to regulatory T-cell stability and function. These proteins also modulate signaling pathways by facilitating the recruitment of specific kinases to the Golgi apparatus and lysosomes, and by regulating the translocation of receptors to lipid rafts in response to external stimuli such as viral infection or inflammation. Additionally, some proteins may play a role in myoblast fusion during muscle development and in acrosome formation in spermatogenesis.
    source: "InterPro:IPR051176 abstract (LLM-generated, not curator-reviewed)"
