identifier: PANTHER:PTHR34457
label: "EMBRYO DEFECTIVE 2410"
definition: >-
  This family of proteins is involved in the translocation of protein precursors across the chloroplast envelope. Members of this family are essential components of the inner chloroplast membrane translocon complex (TIC), which works in conjunction with the outer chloroplast membrane translocon complex (TOC) to form a supercomplex. This supercomplex facilitates the import of proteins into the chloroplast stroma. In addition to their role in protein import, these proteins are also implicated in the regulation of starch granule size within amyloplasts, indicating a broader functional scope within the chloroplast.
