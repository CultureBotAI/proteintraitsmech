  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of cell growth through the modulation of specific isoforms of nuclear enzymes and transcription factors. Members of this family can reduce the levels of the nuclear PKM isoform M2, leading to the repression of cyclin CCND1 transcription. This action is associated with a decrease in cell proliferation. Additionally, these proteins may play a role in cellular responses to hyperosmotic stress, particularly in kidney cells, by providing a protective function under such conditions. The family is characterized by a shared domain, indicating a common structural feature and evolutionary origin.
    source: "InterPro:IPR053049 abstract (LLM-generated, not curator-reviewed)"
