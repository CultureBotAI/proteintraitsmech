identifier: PANTHER:PTHR14907
label: FI14130P
definition: >-
  This entry consists of the suppressor APC domain-containing protein 1 and 2 (SAPC1 and SAPC2). In humans, SAPC2 plays a role in planar mitotic spindle orientation. It is also involved in positive regulation of cell proliferation and tumour cell growth. The EF-hand fold is a helix-loop-helix motif that binds calcium. SAPC2 is expressed in many primary gastric carcinoma. It is expressed preferentially in M and G1 phases, compared to S and G2 phases.
