  - kind: GENERAL
    text: >-
      This family of proteins includes members that contain an F-box domain and often kelch repeats. The F-box domain is crucial for the interaction with SKP1-like (ASK) proteins, which are part of the SCF (SKP1-cullin-F-box) E3 ubiquitin ligase complex. These complexes play a significant role in the ubiquitination pathway, where they are responsible for the recognition and targeting of specific substrate proteins for ubiquitination, followed by proteasomal degradation. The ubiquitination process is a key regulatory mechanism for controlling protein levels and function in eukaryotic cells, affecting various cellular processes such as cell cycle progression, signal transduction, and transcriptional regulation.
    source: "InterPro:IPR052439 abstract (LLM-generated, not curator-reviewed)"
