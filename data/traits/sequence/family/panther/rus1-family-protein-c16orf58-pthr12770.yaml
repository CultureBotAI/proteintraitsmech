identifier: PANTHER:PTHR12770
label: "RUS1 FAMILY PROTEIN C16ORF58"
definition: >-
  This family is composed of root UVB sensitive proteins and their homologues. In Arabidopsis thaliana, proteins in this family are involved in UVB-sensing and in early seedling morphogenesis and development. In plants, these proteins play a role in auxin-transport, plant growth and development and appears to be expressed by all cells in the plant as well as in plastids. The family has been shown to play a role in vitamin B6 photo-protection and homoeostasis in plants. In line with various literature findings describing this family in plants, it was proposed that these proteins may be directly involved in the transport of one or more forms of the vitamin B6.
definition_source: "InterPro:IPR006968 abstract (PANTHER PTHR12770 is a member signature)"
