identifier: PANTHER:PTHR14418
label: "CONDENSIN COMPLEX SUBUNIT 3-RELATED"
definition: >-
  Condensin complex subunit 3 (also known as NCAPG or YCG1) is a regulatory subunit of the condensin complex, a complex required for conversion of interphase chromatin into mitotic-like condense chromosomes. The condensin complex probably introduces positive supercoils into relaxed DNA in the presence of type I topoisomerases and converts nicked DNA into positive knotted forms in the presence of type II topoisomerase.
