  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of verrucosidin, a neurotoxic compound that disrupts oxidative phosphorylation in mitochondria, leading to neurological diseases. The proteins in this family are part of a gene cluster responsible for the production of verrucosidin's carbon backbone, which is initially synthesized by a highly reducing polyketide synthase and subsequently modified by associated enzymes. Members of this family likely contribute to the modification and assembly of verrucosidin, although their exact biochemical functions may vary.
