identifier: PANTHER:PTHR37482
label: "OUTER MEMBRANE PROTEIN ASSEMBLY FACTOR BAME"
definition: >-
  BamE is part of the outer membrane protein (OMP) assembly Bam complex (composed of the outer membrane protein BamA, and four lipoproteins BamB, BamC, BamD and BamE), which is involved in assembly and insertion of β-barrel proteins into the outer membrane. E. coli BamE is a nonessential member of the complex that stabilizes the interaction between the essential proteins BamA and BamD. It may modulate the conformation of BamA, likely through interactions with BamD.
definition_source: "InterPro:IPR026592 abstract (PANTHER PTHR37482 is a member signature)"
