identifier: PANTHER:PTHR24211
label: "LIM DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents a family of proteins with a LIM-type zinc finger that are found in animals and some fungal species, including Protein prickle (Pk) and Protein espinas (Esn) from Drosophila melanogaster and human Testin (Tes). Pk has been implicated in regulation of cell movement in the planar cell polarity (PCP) pathway, which requires the conserved Frizzled/Dishevelled (Dsh). Prickle interacts with Dishevelled, thereby modulating the activity of Frizzled/Dishevelled and the PCP signalling. Two forms of prickle have been identified, namely prickle 1 and prickle 2. These are differentially expressed; prickle 1 is found in fetal heart and haematological malignancies, while prickle 2 is expressed in fetal brain, adult cartilage, pancreatic islet, and some types of tumorous cells. Esn binds to the seven-pass transmembrane cadherin Flamingo. The interplay elicits repulsion between dendritic branches of sensory neurons. Tes is a cytoskeleton associated focal adhesion protein that localizes along actin stress fibres, at cell-cell contact areas, and at focal adhesion plaques. It plays a role in the regulation of cell proliferation; it may act as a tumour suppressor.
