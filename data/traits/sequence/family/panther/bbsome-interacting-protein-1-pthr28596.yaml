identifier: PANTHER:PTHR28596
label: "BBSOME-INTERACTING PROTEIN 1"
definition: >-
  The BBSome (so-named after the association with Bardet-Biedl syndrome) is a complex of 8 subunits that lies at the base of the flagellar microtubule structure. The precise function of the all the individual components in cilia formation is unclear; however, they function to promote loading of cargo to the ciliary axoneme.
