identifier: PANTHER:PTHR38035
label: "UPF0070 PROTEIN YFGM"
definition: >-
  YfgM is a subunit of the ancillary SecYEG translocon that may mediate protein transfer from the SecYEG translocon to the periplasmic chaperone network via its periplasmic C-terminal region. It may coordinate stress responses across the inner membrane via a dynamic protein-protein interaction network inside and outside of the membrane.
