identifier: PANTHER:PTHR39648
label: "6-HYDROXYMETHYL-7,8-DIHYDROPTERIN PYROPHOSPHOKINASE"
definition: >-
  This archaeal family of 6-hydroxymethylpterin diphosphokinase (HMDPK), known as MptE, catalyse the formation of 6-hydroxymethyl-7,8-dihydropterin diphosphate (6-HMDP) from 6-HMD and ATP. 6-HMDP is the precursor of the pterin containing moiety of the essential C1-carriers tetrahydrofolate and tetrahydromethanopterin.
