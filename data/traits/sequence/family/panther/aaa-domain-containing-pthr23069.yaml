identifier: PANTHER:PTHR23069
label: "AAA DOMAIN-CONTAINING"
definition: >-
  This entry represents a group of AAA domain-containing protein, including ATAD2/ATD2B from humans, Tat-binding homolog 7 from Caenorhabditis elegans (Lex-1) and Saccharomyces cerevisiae (Yta7), and ATPase with bromodomain protein abo1/2 from S. pombe. ATPase family AAA domain-containing protein 2, also known as ANCCA, is a transcriptional coactivator for estrogen-bound estrogen receptor (ER) alpha and androgen receptor. It is required for coregulator occupancy and chromatin modification. ANCCA is also required for recruiting specific E2Fs to their targets and for the assembly of the HCF-MLL hKMT complex, a complex that regulates cell cycle progression. Overexpression of ANCCA has been linked to various cancers. In Caenorhabditis elegans, Lex-1 affects chromatin structure and promotes expression from repetitive sequences. In Saccharomyces cerevisiae, Yta7 binds to histones and regulates transcription of histones and other gene.
definition_source: "InterPro:IPR045199 abstract (PANTHER PTHR23069 is a member signature)"
