identifier: PANTHER:PTHR30473
label: "PROTEIN PHOH"
definition: >-
  This entry represents PhoH2 from Mycobacterium tuberculosis, the toxic component of a type II toxin-antitoxin (TA) system, and similar sequences from bacteria and some viral species. Members of this family are believed to play a role in the cellular response to phosphate starvation. They may be implicated in the regulation of phosphate uptake systems and could have ATPase activity associated with various cellular processes. The exact functions can vary among different organisms.
