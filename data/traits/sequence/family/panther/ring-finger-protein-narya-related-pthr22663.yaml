identifier: PANTHER:PTHR22663
label: "RING FINGER PROTEIN NARYA-RELATED"
definition: >-
  This entry represents budding yeast Zip3 (also known as Cst9) and its homologues including Vilya/Nenya/narya from Drosophila melanogaster, RNF212/RNF212B from animals and Zip homologous proteins 1, 2, 3 and 4 from Caenorhabditis elegans. In budding yeasts, Zip3 is a SUMO E3 ligase and a component of the synapsis initiation complex (SIC) required for synaptonemal complex formation. Zip3 possesses a C3H2C3 RING finger motif, which is required for its E3 SUMO ligase activity in vitro. The synaptonemal complex (SC) is a proteinaceous complex that apparently mediates synapsis between homologous chromosomes during meiotic prophase. A number of chromosomal crossover factors and DNA damage repair components have been found to associate with both synaptonemal complexes and multiple synaptonemal complexes (polycomplexes). These include Zip3 (Cst9) from budding yeast, which localizes throughout the body of polycomplexes.
