  - kind: GENERAL
    text: >-
      This family of proteins is involved in the Wnt signaling pathway, a critical mechanism for regulating gene expression and cell behavior. Members of this family play a role in transmitting signals received from Wnt proteins to the intracellular environment, influencing various developmental processes and cell fate decisions. The proteins in this family are characterized by their participation in the transduction of Wnt signals, which is essential for proper embryonic development, cell proliferation, and differentiation. Dysregulation of the Wnt pathway can lead to a variety of diseases, including cancer.
