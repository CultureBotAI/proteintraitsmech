identifier: PANTHER:PTHR39420
label: "Zinicin-like metallopeptidase type 2"
definition: >-
  This family of proteins has a conserved HEXXH motif, suggesting they are putative peptidases of zincin fold. The structure of this family has similarity to Peptidase_M1 (PDB:3CMN).
