  - kind: GENERAL
    text: >-
      The protein family includes antitoxin components associated with non-functional type II toxin-antitoxin systems. Specifically, the family member Orphan antitoxin ParD2 is known to be an antitoxin component that does not counteract the effects of any known RelE or ParE toxins. The function of the other family member, an uncharacterized protein y4kO, has not been described. Given the lack of comprehensive functional information for the entire family, the precise biological role of the family remains unclear.
