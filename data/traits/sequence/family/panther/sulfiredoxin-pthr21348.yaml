identifier: PANTHER:PTHR21348
label: Sulfiredoxin
definition: >-
  Sulfiredoxins belong to the oxidoreductase family, which are involved in cellular responses to oxidative stress. They catalyse the reaction peroxiredoxin-(S-hydroxy-S-oxocysteine) + ATP + 2 R-SH = peroxiredoxin-(S-hydroxycysteine) + ADP + phosphate + R-S-S-R It is a member of a conserved family of eukaryotic antioxidants and contains a conserved C-terminal cysteine which is essential for its antioxidant function. Sulfiredoxin (Srx) plays a role in signalling through the catalytic reduction of oxidative modifications. It is responsible for the regulation of peroxiredoxin (Prx) by catalysing reduction of the conserved cysteine from sulfinic to sulfenic acid. This reduction prevents further reduction to sulfonic acid, which ultimately results in degradation. Srx also has a role in glutathionylation.
definition_source: "InterPro:IPR016692 abstract (PANTHER PTHR21348 is a member signature)"
