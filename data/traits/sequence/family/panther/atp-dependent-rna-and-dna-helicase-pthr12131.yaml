identifier: PANTHER:PTHR12131
label: "ATP-DEPENDENT RNA AND DNA HELICASE"
definition: >-
  This entry represents ATP-dependent RNA helicase SUPV3L1, mitochondrial and related ATP-dependent RNA helicases found in bacteria and eukaryotes including Probable helicase HelY from bacteria. SUPV3L1 is a major helicase involved in mitochondrial RNA metabolism. It is a component of the mitochondrial degradosome (mtEXO) complex, which degrades 3' overhang double-stranded RNA with 3'-to-5' directionality in an ATP-dependent manner. SUPV3L1 functions as an ATPase and ATP-dependent multisubstrate helicase, capable of unwinding double-stranded DNA, double-stranded RNA, and RNA/DNA heteroduplexes in the 5'-to-3' direction. The protein plays a central role in the mitochondrial RNA surveillance system, regulating the stability of mature mRNAs, removing aberrantly formed mRNAs, and rapidly degrading non-coding processing intermediates, including non-coding mitochondrial transcripts (MT-ncRNA) and tRNA-like molecules. SUPV3L1 is also implicated in recombination and chromatin maintenance pathways, associates with mitochondrial DNA, and may protect cells from apoptosis.
definition_source: "InterPro:IPR050699 abstract (PANTHER PTHR12131 is a member signature)"
