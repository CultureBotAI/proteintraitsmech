identifier: PANTHER:PTHR32002
label: "PROTEIN NLP8"
definition: >-
  This family represents NIN-like proteins (NLPs), key transcription factors involved in a process of establishment of symbiosis between legumes and nitrogen fixing bacteria (Rhizobium) and nitrate signalling in other plants. NLPs bind the nitrate-responsive cis-element and activate nitrate-responsive cis-element-dependent and nitrate-responsive transcription, thus being master regulators of the nitrate response.
