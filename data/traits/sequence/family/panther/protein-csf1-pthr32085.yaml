identifier: PANTHER:PTHR32085
label: "PROTEIN CSF1"
definition: >-
  Cold sensitive for fermentation protein 1 (Csf1, also known as Bridge-like lipid transfer protein family member 1) is a fungal membrane protein required for fermentation at low temperature. It has been identified as a tube-forming lipid transport protein which provides phosphatidylethanolamine for glycosylphosphatidylinositol (GPI) anchor synthesis in the endoplasmic reticulum.
