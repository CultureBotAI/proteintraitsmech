identifier: PANTHER:PTHR36890
label: "PROTEIN CYCLOPS"
definition: >-
  CYCLOPS (also known as IPD3) is required for root symbiosis with mycorrhizal fungi in plants. It forms a signal transduction complex with CCaMK that is specifically required for symbiotic infection. CYCLOPS binds to a motif within the ERN1 promoter and in combination with CCaMK positively regulates transcription of ERN1, a gene that encodes an AP2/ERF transcription factor.
