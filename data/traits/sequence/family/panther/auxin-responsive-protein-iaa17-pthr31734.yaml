identifier: PANTHER:PTHR31734
label: "AUXIN-RESPONSIVE PROTEIN IAA17"
definition: >-
  The Aux/IAA proteins are key regulators of auxin-modulated gene expression. The plant hormone auxin (indole-3-acetic acid, IAA) regulates diverse cellular and developmental responses in plants, including cell division, expansion, differentiation and patterning of embryo responses. Auxin can regulate the gene expression of several families, including GH3 and SAUR, as well as Aux/IAA itself. The Aux/IAA proteins act as repressors of auxin-induced gene expression, possibly through modulating the activity of DNA-binding auxin response factors (ARFs). Aux/IAA and ARF are thought to interact through C-terminal protein-protein interaction domains found in both Aux/IAA and ARF. Recent evidence suggests that Aux/IAA proteins can also mediate light responses. Some members of the Aux/IAA family are longer and contain an N-terminal DNA binding domain and may have an early function in the establishment of vascular and body patterns in embryonic and post-embryonic development in some plants.
definition_source: "InterPro:IPR003311 abstract (PANTHER PTHR31734 is a member signature)"
