identifier: PANTHER:PTHR15836
label: "PERIPHILIN 1"
definition: >-
  This entry represents Periphilin-1 (Pphln1) in vertebrates. Periphilin-1 is a component of the HUSH complex, a multiprotein complex that mediates epigenetic repression. The HUSH complex is recruited to genomic loci rich in H3K9me3 and is probably required to maintain transcriptional silencing. This protein acts as a transcriptional corepressor and regulates the cell cycle, probably via the HUSH complex. It is involved in epithelial differentiation and contributes to epidermal integrity and barrier formation. It is associated with gastric cancer.
