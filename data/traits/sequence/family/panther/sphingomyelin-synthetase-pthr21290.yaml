identifier: PANTHER:PTHR21290
label: "SPHINGOMYELIN SYNTHETASE"
definition: >-
  Sphingomyelin synthase (also known as phosphatidylcholine:ceramide cholinephosphotransferase) is a bidirectional lipid cholinephosphotransferase capable of converting phosphatidylcholine (PC) and ceramide to sphingomyelin (SM) and diacylglycerol (DAG) and vice versa. This entry also includes sphingomyelin synthase-related proteins, including SAMD8 from humans, SMSr from Drosophila melanogaster and Protein PHLOEM UNLOADING MODULATOR from Arabidopsis.
