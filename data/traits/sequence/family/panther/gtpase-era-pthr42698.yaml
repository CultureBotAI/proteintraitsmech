identifier: PANTHER:PTHR42698
label: "GTPASE ERA"
definition: >-
  Era is an essential G-protein in Escherichia coli identified originally as a homologue protein to Ras (E. coli Ras-like protein), which contains a N-terminal GTPase domain followed by an RNA-binding KH domain, that plays a role in ribosome biogenesis. It binds to GTP/GDP and has GTPase activity. It specifically bind to 16S rRNA and serves as a chaperone for processing and maturation of 16S rRNA. GTP binding is required for RNA recognition, which in turn, stimulates the GTP-hydrolyzing activity. ERA is also a checkpoint for assembly of the 30S ribosomal subunit. ERAL1, the homologue in humans, is a mitochondrial RNA chaperone involved in the assembly of the 28S small mitochondrial ribosomal subunit. It binds the 12S mitochondrial rRNA to a 33 nucleotide section delineating the 3' terminal stem-loop region. Mutations in this protein leads to Perrault syndrome, a rare recessive disorder characterised by ovarian dysgenesis and sensorineural deafness. This entry also includes Origin-associated GTP-binding protein OapA, also known as ArvA, encoded by oapA gene which is part of the three-gene cluster oapABC (origin-associated proteins), involved in generation of extracellular vesicles (arv, archaeal vesiculating GTAse). OapA/ArvA has been described as an archaeal vesiculating GTPase that regulates vesicle production.
