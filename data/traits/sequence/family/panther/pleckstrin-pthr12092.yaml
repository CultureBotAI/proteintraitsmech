identifier: PANTHER:PTHR12092
label: PLECKSTRIN
definition: >-
  Pleckstrin-like proteins contain a central DEP domain, flanked by 2 PH (pleckstrin homology) domains. This entry includes pleckstrin (also known as pleckstrin-1) and pleckstrin-2. Pleckstrin 1 plays a role in cell spreading and reorganization of actin cytoskeleton in platelets and leukocytes. Its activity is highly regulated by phosphorylation, mainly by protein kinase C.
