identifier: PANTHER:PTHR32429
label: "Ribulose bisphosphate carboxylase/oxygenase activase-like"
definition: >-
  This family represents ribulose bisphosphate carboxylase/oxygenase activase (Rubisco activase), which is a metabolic repair enzyme that acts as a molecular chaperone to remodel inhibited active sites of Rubisco, releasing tightly bound sugar phosphates. This family also includes Protein POST-ILLUMINATION CHLOROPHYLL FLUORESCENCE INCREASE (PIFI, At3g15840), which is involved in NAD(P)H dehydrogenase complex-mediated chlororespiratory electron transport that mediates electron flow from stromal reductants to the plastoquinone (PQ) pool during chlorophyll fluorescence increase after turning off actinic light. Its C-terminal redox-modulated domain is similar to that of the 46-kD isoform of Rubisco activase.
definition_source: "InterPro:IPR044960 abstract (PANTHER PTHR32429 is a member signature)"
trait_axis: SEQUENCE
trait_category: SEQ_FAMILY
term_kind: CLASS
