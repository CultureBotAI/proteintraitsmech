identifier: PANTHER:PTHR28136
label: "NUCLEUS EXPORT PROTEIN BRR6"
definition: >-
  This entry represents a group of integral membrane proteins of the nuclear envelope (NE), including Brl1 and Brr6 from budding yeasts. Brl1 and Brr6 form a complex with Apq12. This complex plays an important role in membrane homeostasis regulation and nuclear pore complex biogenesis.
