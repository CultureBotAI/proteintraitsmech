  - kind: GENERAL
    text: >-
      The GbpA family includes proteins with diverse functions related to chitin interaction and degradation, as well as viral protection and cellular attachment. Members of the family are involved in binding to GlcNAc residues and promoting attachment to epithelial cell surfaces, chitin, and zooplankton, enhancing bacterial colonization in various environments. Some proteins in the family are key components of virus occlusion bodies, protecting the virus in harsh conditions. Others are involved in the oxidative cleavage of glycosidic bonds in chitin or cellulose via a copper-dependent mechanism, contributing to the degradation of lignocellulosic biomass or chitin as a carbon source. The family also includes proteins that bind chitin without hydrolyzing it, suggesting a role in non-catalytic chitin interaction.
    source: "InterPro:IPR051024 abstract (LLM-generated, not curator-reviewed)"
