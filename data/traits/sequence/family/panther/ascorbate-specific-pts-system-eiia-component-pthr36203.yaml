  - kind: GENERAL
    text: >-
      The ascorbate-specific PTS system EIIA component family is involved in the phosphoenolpyruvate-dependent sugar phosphotransferase system (sugar PTS), which is a key carbohydrate active transport system. Members of this family catalyze the phosphorylation of incoming sugar substrates while simultaneously translocating them across the cell membrane. Specifically, the ascorbate-specific PTS system EIIA components are part of the UlaABC PTS system, which is responsible for the transport of ascorbate. These proteins contain a PTS EIIA type-2 domain that is phosphorylated by phospho-HPr on a histidine residue, and subsequently, they transfer the phosphoryl group to the PTS EIIB type-2 domain, facilitating the transport process.
    source: "InterPro:IPR051351 abstract (LLM-generated, not curator-reviewed)"
