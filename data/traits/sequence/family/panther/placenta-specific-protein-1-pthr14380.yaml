identifier: PANTHER:PTHR14380
label: "PLACENTA-SPECIFIC PROTEIN 1"
definition: >-
  This family consists of placenta-specific protein 1 (PLAC1), oocyte-secreted protein 1/2/3/4 (Oosp1/2/3/4). PLAC1 may play a role in placental development, while Oosp1 may regulate oogenesis and certain liver functions.
