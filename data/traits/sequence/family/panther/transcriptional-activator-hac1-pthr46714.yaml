identifier: PANTHER:PTHR46714
label: "TRANSCRIPTIONAL ACTIVATOR HAC1"
definition: >-
  This entry represents a group of basic leucine zipper (bZIP) transcription factors, including Hac1 from yeasts and HY5/HY5-like from Arabidopsis. Hac1 regulates the unfolded protein response (UPR) induced by abnormal accumulation of unfolded/misfolded proteins in the endoplasmic reticulum (ER) in Saccharomyces cerevisiae. HY5 promotes photomorphogenesis in light. HY5-like protein, also known as HYH, is involved in blue-light regulation of development and gene expression. HYH and HY5 can, respectively, act as heterodimers and homodimers, thus mediating light-regulated expression of overlapping as well as distinct target genes. It recruits the histone deacetylase HDA15 to the promoters of a subset of cell wall organization and auxin signaling-related genes.
