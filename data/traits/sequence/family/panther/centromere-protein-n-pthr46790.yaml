identifier: PANTHER:PTHR46790
label: "CENTROMERE PROTEIN N"
definition: >-
  This family of proteins is involved in the structural and functional organization of centromeres. Members of this family are key components of the CENPA-NAC complex, which is crucial for kinetochore protein assembly, mitotic progression, and chromosome segregation. They are responsible for the recruitment of the CENPA-CAD complex and play a role in the incorporation of newly synthesized CENPA into centromeres. These proteins are necessary for the initial specific binding to CENPA nucleosomes, a critical step for centromere assembly. They are also required for proper chromosome alignment on the metaphase plate during cell division.
