identifier: PANTHER:PTHR20917
label: PNAS-RELATED
definition: >-
  This entry includes TMCO1, a member of the Oxa1 superfamily which includes a group of proteins that function in different contexts as transmembrane domains (TMD) insertases and/or as intramembrane chaperones to facilitate membrane protein folding and assembly. TMCO1 has been recently described as a component of the multi-pass translocon (MPT) complex that mediates insertion of multi-pass membrane proteins into the lipid bilayer of membranes. Previously, it has been reported that TMCO1 is a ER calcium load-activated calcium channel. TMCO1 is required for the normal development of corpus callosum as it plays a role in Ca2 homeostasis. Archaeal members may function as insertases of the archaeal plasma membrane.
