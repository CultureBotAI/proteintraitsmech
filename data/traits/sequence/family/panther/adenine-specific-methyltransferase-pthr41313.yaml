identifier: PANTHER:PTHR41313
label: "ADENINE-SPECIFIC METHYLTRANSFERASE"
definition: >-
  This family of proteins includes members that are involved in the protection of DNA from host restriction-modification systems. They appear to function by preventing the degradation of DNA, particularly viral DNA, by host enzymes that recognize and cleave foreign DNA. Some family members are similar to type I restriction system adenine methylases, suggesting a role in DNA modification, potentially to evade host defense mechanisms. Others are related to helicases, indicating a possible involvement in DNA processing or repair mechanisms. The exact functions may vary among family members, but they collectively contribute to the survival of genetic material in the face of host defense strategies.
