identifier: PANTHER:PTHR12547
label: "CCCH ZINC FINGER/TIS11-RELATED"
definition: >-
  This entry represents a group of CCCH-type zinc finger proteins, including ZFP36/ZFP36L1/ZFP36L2 from animals, Zfs1 from fission yeasts and CTH1/2 from budding yeasts. ZFP36/ZFP36L1/ZFP36L2, Zfs1 and CTH1/2 are mRNA decay activator proteins that bind to specific AU-rich elements (ARE) in the 3'-untranslated region of target mRNAs and promotes their degradation. This entry includes RNA-binding protein pos-1 that coordinates cell fate specification and differentiation during early embryogenesis in C.elegans.
