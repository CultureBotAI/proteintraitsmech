identifier: PANTHER:PTHR24043
label: "SCAVENGER RECEPTOR CLASS F"
definition: >-
  This family includes a group of transmembrane receptors containing multiple EGF-like domains, involved in phagocytosis. It includes Multiple epidermal growth factor-like domains protein 10 (MEGF10) and its homologues, namely CED1 from C. elegans and draper from Drosophila melanogaster. MEGF10 is expressed in skeletal muscles, the retina and in CNS glial cells involved in phagocytosis by macrophages and astrocytes of apoptotic cells and it also promotes the formation of large intracellular vacuoles and may be responsible for the uptake of amyloid-beta peptides. Early-onset myopathy, areflexia, respiratory distress, and dysphagia (EMARDD) is a rare disorder caused by biallelic mutations in MEGF10. This entry also includes Scavenger receptor class F members 1 and 2. SCARF1/SREC-I is an endocytic receptor for acetylated low density lipoprotein, HSP70, HSP90, calreticulin, gp96, and GP2. Dendritic cells (DCs), macrophages and endothelial cells use SCARF1 to recognize and engulf apoptotic cells via the complement component C1q; this mediates apoptotic cells clearance, antigen clearance and prevents autoimmunity. SREC-II in contrast to SREC-I, SREC-II had little activity to internalize modified low density lipoproteins (LDL). SREC-II and SREC-I display strong heterophilic trans-interaction through the extracellular domains. They are expressed in a specific temporal and spatial pattern during epidermal development. Mutations in the SCARF2 gene cause Van den Ende-Gupta syndrome (VDEGS), a syndrome characterised by craniofacial and skeletal abnormalities.
