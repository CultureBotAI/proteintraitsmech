identifier: PANTHER:PTHR34610
label: "SSL7007 PROTEIN"
definition: >-
  This entry represents Uncharacterized protein MJ1680 and other proteins which are part of the PIN domain superfamily InterPro:IPR029060. It is restricted to bacteria and archaea. A comprehensive in silico study of toxin-antitoxin systems finds evidence that this family represents the toxin-like component of one class of type 2 toxin-antitoxin systems.
