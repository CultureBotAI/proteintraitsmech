identifier: PANTHER:PTHR15561
label: "CALCITONIN GENE-RELATED PEPTIDE-RECEPTOR COMPONENT PROTEIN"
definition: >-
  RPC9, also known as Rpc17 in budding yeasts, is a subunit of DNA-directed RNA polymerase III that catalyzes the transcription of DNA into RNA using the four ribonucleoside triphosphates as substrates. It may be involved in the recruitment of pol III by the preinitiation complex.
