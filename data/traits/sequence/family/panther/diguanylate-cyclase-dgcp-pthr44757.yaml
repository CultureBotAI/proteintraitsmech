identifier: PANTHER:PTHR44757
label: "DIGUANYLATE CYCLASE DGCP"
definition: >-
  This family of proteins is involved in the regulation of bacterial biofilm formation and maintenance. Members of this family function in signaling cascades that control the transition between cellular states, such as motility and adhesion. Key activities include the synthesis and degradation of cyclic-di-GMP (c-di-GMP), a secondary messenger that modulates the expression of biofilm-related genes. Some proteins in this family act as diguanylate cyclases, catalyzing the formation of c-di-GMP, while others function as phosphodiesterases, breaking down c-di-GMP. This regulatory mechanism influences the biosynthesis of curli and the architecture of biofilms, impacting the three-dimensional structure and biomass accumulation within the biofilm matrix.
definition_source: "InterPro:IPR052155 abstract (PANTHER PTHR44757 is a member signature)"
