identifier: PANTHER:PTHR44598
label: "JUNCTIONAL ADHESION MOLECULE C"
definition: >-
  JAM-C (also known as JAM3) is an adhesion molecule expressed by endothelial cells (ECs) that plays a role in tight junction formation, leukocyte adhesion, and transendothelial migration. Platelet JAM-C has been find to bind neutrophil integrin alphaMbeta2 (Mac-1/CD11b/CD18) to help neutrophils to transmigrate through endothelium. Mutations in the JAM-C gene cause haemorrhagic destruction of the brain, subependymal calcification, and congenital cataracts. Junctional Adhesion Molecules (JAMs), including JAM-A/B/C, are a subset of the immunoglobulin superfamily, which have two extracellular immunoglobulin-like domains, a cytoplasmic tail and a PDZ-domain-binding motif. They can form homodimers at the surface of one cell and between two neighbouring cells and heterodimers can also occur between JAM-B and JAM-C. They can also interact with human leukocyte integrins.
