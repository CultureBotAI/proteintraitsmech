identifier: PANTHER:PTHR21089
label: "SHIKIMATE DEHYDROGENASE"
definition: >-
  This entry represents shikimate dehydrogenase ( EC:1.1.1.25 ) and quinate/shikimate dehydrogenase ( EC:1.1.1.282 ). The latter is the second shikimate dehydrogenase enzyme found in Escherichia coli and differs from EC:1.1.1.25 ( InterPro:IPR011342 ), in that it can use both quinate and shikimate as substrate and either NAD(+) or NADP(+) as acceptor.
