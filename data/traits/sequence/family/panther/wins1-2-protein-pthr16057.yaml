identifier: PANTHER:PTHR16057
label: "WINS1, 2 PROTEIN"
definition: >-
  In Drosophila, Lines is a segment polarity protein and a modulator of the Abd-B HOX protein. Lines is needed for Abd-B to activate its downstream targets cut, spalt and ems, which are involved in posterior spiracle morphogenesis.
