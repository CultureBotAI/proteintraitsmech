identifier: PANTHER:PTHR10887
label: "DNA2/NAM7 HELICASE FAMILY"
definition: >-
  This entry represents a group of helicases, including DNA2 and Nam7. Proteins in this family contain a conserved domain with is a P-loop motif that is characteristic of the AAA superfamily. They are DEAD-like helicases belonging to superfamily (SF)1, a diverse family of proteins involved in ATP-dependent RNA or DNA unwinding. Similar to SF2 helicases, SF1 helicases do not form toroidal structures like SF3-6 helicases. Their helicase core consists of two similar protein domains that resemble the fold of the recombination protein RecA. DNA2 is a DNA replication factor with single-stranded DNA-dependent ATPase, ATP-dependent nuclease, (5'-flap endonuclease) and helicase activities. Nam7 (also known as Upf1) is an ATP-dependent RNA helicase involved in the nonsense-mediated mRNA decay (NMD) pathway.
