  - kind: GENERAL
    text: >-
      This family of proteins includes members that are thought to function as quercetin 2,3-dioxygenases. These enzymes are involved in the degradation of flavonoids, a class of plant secondary metabolites with various biological activities. Quercetin 2,3-dioxygenase catalyzes the cleavage of quercetin, a specific flavonoid, to produce carbon monoxide and 2-protocatechuoylphloroglucinol carboxylic acid. The family is related to the pirin proteins, which are characterized by a conserved pirin domain. Pirin proteins have been implicated in various cellular processes, including as transcriptional regulators and in response to stress conditions. The exact biological role of the putative quercetin 2,3-dioxygenases within this family may vary among different organisms and requires further investigation to confirm their enzymatic activity and physiological functions.
    source: "InterPro:IPR053186 abstract (LLM-generated, not curator-reviewed)"
