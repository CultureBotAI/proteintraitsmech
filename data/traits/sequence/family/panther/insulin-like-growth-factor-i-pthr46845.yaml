identifier: PANTHER:PTHR46845
label: "INSULIN-LIKE GROWTH FACTOR I"
definition: >-
  INSULIN-LIKE GROWTH FACTOR I — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46845. PANTHER protein class: growth factor. Members are annotated with the molecular function hormone activity. Members participate in positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction, regulation of protein phosphorylation, negative regulation of apoptotic process. Members localise to extracellular region.
