identifier: PANTHER:PTHR36102
label: "CHROMOSOME 10, WHOLE GENOME SHOTGUN SEQUENCE"
definition: >-
  This family represents Subtelomeric hrmA-associated cluster protein AFUB_079030 from Aspergillus fumigatus and similar fungal proteins. AFUB_079030 is part of the subtelomeric hrmA-associated cluster (HAC) containing genes that alter the hyphal surface (such as reduced total chitin or increased beta-glucan exposure) and perturb inter-hyphal interactions within the developing biofilms, resulting in a loss of vertically aligned polarised growing filaments. This group also includes yeast protein YDR124W. Null mutant showed severe fragmentation of mitochondria and its expression is strongly induced by alpha factor. Some members of this family may have role in maintenance of mitochondrial morphology.
definition_source: "InterPro:IPR021264 abstract (PANTHER PTHR36102 is a member signature)"
