identifier: PANTHER:PTHR47327
label: FI18240P1-RELATED
definition: >-
  This family of proteins is involved in various developmental and morphogenetic processes in Caenorhabditis elegans. Members of this family play crucial roles in epithelial tube development, including the morphogenesis and function of unicellular tubes within the excretory system such as the canal cell, duct cell, and pore cell. They are also implicated in cuticle development, alae formation, and vulval lumen shaping, which are essential for larval development. Additionally, these proteins are associated with neuronal functions, including neurite growth and maintenance, as well as sensory neuron permeability and behavior responses such as chemotaxis, osmotic avoidance, and mating. Some family members contain a ZP domain, which is important for protein localization and secretion.
