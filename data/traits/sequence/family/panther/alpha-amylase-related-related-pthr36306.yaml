identifier: PANTHER:PTHR36306
label: ALPHA-AMYLASE-RELATED-RELATED
definition: >-
  This family of proteins belongs to glycoside hydrolase family 57 which comprises enzymes with two known activities; alpha-amylase ( ) and 4-alpha-glucanotransferase ( ). Among them is amylopullulanase, a thermophilic endoamylase capable of hydrolyzing both alpha-1,4 and alpha-1,6-glycosidic bonds, which are interesting for one-step starch saccharification in industrial applications. Members of this family exhibit a range of substrate specificities, including the ability to act on maltooligosaccharides and simpler carbohydrates such as maltotriose. They are capable of catalysing transglycosylation reactions, which result in the production of maltooligosaccharides of varying lengths and glucose. Some family members also display hydrolytic activity, breaking down carbohydrates into smaller sugars. The enzymatic activity of these proteins can be regulated by various inhibitors, including specific chemical reagents and metal ions.
