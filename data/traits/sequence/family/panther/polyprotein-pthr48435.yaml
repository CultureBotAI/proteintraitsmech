identifier: PANTHER:PTHR48435
label: POLYPROTEIN
definition: >-
  The Petuviruses genome polyprotein is involved in the life cycle of Petuviruses, a group of plant viruses. The polyproteins encoded by these viruses are processed to produce at least four distinct polypeptides, each with a specific role in the viral infection and replication process: Movement protein (MP), capsid protein (CP), Protease (PR), and reverse transcriptase (RT). The MP is likely involved in the cell-to-cell movement of the virus within the host plant. The CP is responsible for encapsulating the viral RNA genome, protecting it from degradation and recognition by the host's defense mechanisms. The PR is involved in the cleavage of the polyprotein into its functional components. Lastly, the RT is critical for the replication of the viral RNA genome. Together, these proteins enable the virus to infect host cells, replicate, and spread to new cells, thereby facilitating the viral life cycle.
