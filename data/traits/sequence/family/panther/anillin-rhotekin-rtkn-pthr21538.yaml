  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes, including cytokinesis, the final step of cell division where the cell splits into two. Members of this family are essential for the structural integrity of the cleavage furrow, which is the indentation that begins the process of division, and for the completion of this furrow's ingression. They are also involved in organizing cortical structures such as septins and myosin II, which are important for membrane dynamics and cell shape. Some family members are implicated in signaling pathways, such as the Rho signaling pathway, which can activate transcription factors like NF-kappa-B and may influence apoptosis resistance in certain cancers. Additionally, these proteins play roles in the organization of the cell's cytoskeleton, including microtubules and actin filaments, which are crucial for maintaining cell shape, stability, and movement. They are also involved in developmental processes, such as the formation of germline cells in embryos and the maintenance of gonadal structures.
    source: "InterPro:IPR051364 abstract (LLM-generated, not curator-reviewed)"
