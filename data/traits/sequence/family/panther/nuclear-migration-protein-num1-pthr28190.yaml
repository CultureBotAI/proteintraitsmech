definitions:
  - kind: GENERAL
    text: >-
      NUCLEAR MIGRATION PROTEIN NUM1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28190. Members are annotated with the molecular function tubulin binding. Members participate in microtubule cytoskeleton organization. Members localise to mitochondrion, cell cortex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of nuclear positioning and cytoskeletal interactions during cell division. Members of this family play a crucial role in the completion of asexual development by ensuring proper nuclear placement within the cell. They are also responsible for the formation of cortical microtubule capture sites, which are essential for dynein-dependent microtubule sliding and subsequent nuclear migration. These proteins function in anchoring the dynein motor complex to the cell cortex, particularly during late anaphase, facilitating the interaction between the cytoskeleton and the nucleus in budding yeast cells.
    source: "InterPro:IPR053005 abstract (LLM-generated, not curator-reviewed)"
