  - kind: GENERAL
    text: >-
      This family of proteins includes components of the outer dynein arm-docking complex (ODA-DC), which are crucial for the binding of outer dynein arms (ODA) onto doublet microtubules. Members are involved in the assembly of ODAs and their axonemal docking complex, facilitating the proper function of ciliary microtubules. Additionally, some family members play a role in spermiogenesis, contributing to the elongation of flagella and the formation of sperm heads, indicating a broader involvement in the development and function of motile cilia and flagella.
