identifier: PANTHER:PTHR48195
label: "FRIEND VIRUS SUSCEPTIBILITY PROTEIN 1"
definition: >-
  The Friend virus susceptibility protein 1 family comprises retroviral restriction factors that protect against infection by gammaretroviruses. Members of the family function by binding to the viral capsid protein post-entry into the host cell. This binding is believed to disrupt the viral capsid, leading to inactivation of the viral genome and preventing its integration into the host genome and subsequent replication.
