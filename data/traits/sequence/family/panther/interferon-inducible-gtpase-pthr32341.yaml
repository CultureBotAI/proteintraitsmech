identifier: PANTHER:PTHR32341
label: "INTERFERON-INDUCIBLE GTPASE"
definition: >-
  The IRG protein family is involved in innate immunity and inflammatory response, acting as dynamin-like GTPases that bind to intracellular membranes to promote their remodeling and trafficking. They play crucial roles in the clearance of acute protozoan and bacterial infections by interacting with autophagy and lysosomal proteins, facilitating the fusion of phagosomes with lysosomes for efficient degradation of pathogens. Additionally, they regulate selective autophagy, including xenophagy and mitophagy, and act as negative regulators of inflammatory and interferon responses by mediating autophagy-dependent degradation of inflammatory effectors and preventing the assembly of inflammasomes. They also participate in antiviral defense, mitochondrial quality control, and the preservation of hematopoietic stem cell function.
