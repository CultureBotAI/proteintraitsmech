definitions:
  - kind: GENERAL
    text: >-
      PERFORIN-1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46096. Members are annotated with the molecular function wide pore channel activity, passive transmembrane transporter activity, channel activity. and participate in leukocyte mediated cytotoxicity, adaptive immune response, lymphocyte activation. and localise to membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Perforin-1 family includes pore-forming proteins that are essential for granzyme-mediated programmed cell death and immune defense against virus-infected or neoplastic cells. Members of the family can insert into target cell membranes when bound to calcium, oligomerize, and form large pores. This action facilitates the passage and uptake of cytotoxic granzymes into target cells, promoting cytolysis and apoptosis. The family is characterized by a MACPF domain responsible for pore formation, an EGF-like domain connecting MACPF and C2 domains, and a C2 domain for calcium-dependent lipid membrane binding. The C2 domain's calcium binding induces structural rearrangements, leading to oligomerization and the insertion of transmembrane beta-strands into the membrane as amphipathic beta-hairpins. These proteins are also involved in delivering cationic cargo proteins and releasing mature caspase-7 into the extracellular space.
    source: "InterPro:IPR052784 abstract (LLM-generated, not curator-reviewed)"
