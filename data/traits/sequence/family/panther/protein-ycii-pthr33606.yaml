  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of various secondary metabolites, including mycotoxins, linear lipopeptides, antibiotics, and meroterpenoids. They are implicated in the activation and processing of amino acid precursors, the formation of polyketides, and the assembly of nonribosomal peptide synthetase (NRPS) products. These proteins may participate in the formation of enzyme complexes, catalyze the epimerization of amino acids, and contribute to the generation of structural diversity in natural compounds through the incorporation of unusual amino acids and fatty acids. The family includes proteins that may function in the oxidative processing of intermediates, the reduction of thioester-linked products, and the cyclization and rearrangement of molecular scaffolds to yield bioactive molecules with potential pharmacological properties.
    source: "InterPro:IPR051807 abstract (LLM-generated, not curator-reviewed)"
