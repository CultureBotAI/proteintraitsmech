identifier: PANTHER:PTHR47170
label: "MALONYL-COA ACP TRANSACYLASE, ACP-BINDING"
definition: >-
  This family of proteins catalyzes the transfer of malonyl groups from malonyl-CoA to the phosphopantetheine arm of acyl carrier proteins within mitochondria, indicating a role in mitochondrial fatty acid biosynthesis. Members of this family share a common function in the elongation step of fatty acid synthesis, which is essential for producing the fatty acid components of lipids in eukaryotic cells.
