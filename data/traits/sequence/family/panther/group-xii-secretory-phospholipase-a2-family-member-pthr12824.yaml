identifier: PANTHER:PTHR12824
label: "GROUP XII SECRETORY PHOSPHOLIPASE A2 FAMILY MEMBER"
definition: >-
  This family consists of several group XII secretory phospholipase A2 precursor (PLA2G12) (EC:3.1.1.4) proteins. Group XII and group V PLA(2)s are thought to participate in helper T cell immune response through release of immediate second signals and generation of downstream eicosanoids.
