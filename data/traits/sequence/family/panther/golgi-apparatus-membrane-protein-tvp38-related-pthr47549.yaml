label: "GOLGI APPARATUS MEMBRANE PROTEIN TVP38-RELATED"
definition: >-
  GOLGI APPARATUS MEMBRANE PROTEIN TVP38-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47549. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies participate in mitotic sister chromatid segregation, microtubule cytoskeleton organization, mitotic cell cycle. Subfamilies localise to Golgi membrane, intracellular anatomical structure, cytoplasm.
