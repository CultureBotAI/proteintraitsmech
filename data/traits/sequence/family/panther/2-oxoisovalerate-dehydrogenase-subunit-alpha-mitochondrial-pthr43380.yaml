definitions:
  - kind: GENERAL
    text: >-
      2-OXOISOVALERATE DEHYDROGENASE SUBUNIT ALPHA, MITOCHONDRIAL — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43380. PANTHER protein class: dehydrogenase, oxidoreductase. Members participate in branched-chain amino acid metabolic process, carboxylic acid catabolic process, amino acid catabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes enzymes that are part of multi-component complexes responsible for the oxidative decarboxylation of alpha-keto acids. These enzymes play a crucial role in energy production by converting alpha-keto acids derived from branched-chain amino acids like valine, leucine, and isoleucine into acyl-CoA and CO2. The family encompasses the E1 subunit of the mitochondrial branched-chain alpha-ketoacid dehydrogenase (BCKD) complex, as well as the pyruvate dehydrogenase complex, which converts pyruvate to acetyl-CoA and CO2. The E1 subunit specifically catalyzes the decarboxylation of the alpha-ketoacid and forms an enzyme-product intermediate, which is then processed by the E2 subunit. Some members also exhibit branched-chain 2-oxoacid dehydrogenase activity.
    source: "InterPro:IPR050771 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
