identifier: PANTHER:PTHR31605
label: "GLYCEROL-3-PHOSPHATE O-ACYLTRANSFERASE 1"
definition: >-
  This family of proteins includes enzymes with acyltransferase activity, specifically functioning as glycerol-3-phosphate O-acyltransferases. They catalyze the initial step in the biosynthesis of glycerophospholipids and triacylglycerols, transferring a fatty acid from fatty acyl-CoA to the sn-1 position of glycerol-3-phosphate, resulting in the formation of lysophosphatidic acid. Members of this family exhibit substrate specificity, with some preferring glycerol-3-phosphate over dihydroxyacetone phosphate and showing selectivity for certain fatty acyl chain lengths. These enzymes play a crucial role in lipid metabolism and are involved in the regulation of fatty acid desaturation and the balance of saturated and unsaturated fatty acids within the cell. They also contribute to the synthesis of diacylglycerols and phosphatidylcholine, which are key components in cell signaling and membrane structure.
