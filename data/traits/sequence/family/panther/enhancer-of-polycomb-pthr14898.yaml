identifier: PANTHER:PTHR14898
label: "ENHANCER OF POLYCOMB"
definition: >-
  The enhancer of polycomb gene of Drosophila encodes a chromatin protein conserved in yeast and mammals. The homologous yeast protein, known as enhancer of polycomb-like protein 1 (Epl1), is a subunit of the NuA4 histone acetyltransferase (HAT) complex, which is involved in transcriptional activation of selected genes principally by acetylation of nucleosomal histone H4 and H2A. Epl1 also found in a novel highly active smaller complex named Piccolo NuA4 (picNuA4), which strongly prefers chromatin over free histones as substrate. The NuA4 HAT complex is highly conserved in eukaryotes, and it plays primary roles in transcription, cellular response to DNA damage, and cell cycle control. This entry represents all eukaryotic enhancer of polycomb proteins, including enhancer of polycomb-like proteins.
