identifier: PANTHER:PTHR15921
label: "PRE-MRNA CLEAVAGE COMPLEX II"
definition: >-
  This entry includes Pcf11 and related proteins from animals, fungi and plants. Pcf11 is a subunit and essential component of cleavage and polyadenylation factor IA (CF IA), involved in pre-mRNA 3' end processing and in transcription termination. It has been reported that Pcf11-mediated termination is essential for vertebrate development and its own levels are maintained by an auto-regulatory mechanism involving premature termination of its transcript. Human Pcf11, also referred to as pre-mRNA cleavage complex 2 protein Pcf11, has been shown to enhance degradation of RNAP II-associated nascent RNA and transcriptional termination. Pcf11 binds to Clp1, another subunit of CFIA whose interaction is responsible for maintaining a tight coupling between the Clp1 nucleotide binding subunit and the other components of the polyadenylation machinery.
definition_source: "InterPro:IPR045154 abstract (PANTHER PTHR15921 is a member signature)"
