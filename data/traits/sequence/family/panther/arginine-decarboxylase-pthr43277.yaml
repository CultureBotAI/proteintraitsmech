identifier: PANTHER:PTHR43277
label: "ARGININE DECARBOXYLASE"
definition: >-
  The Orn/Lys/Arg decarboxylase class-I family is characterized by its members' enzymatic function in catalyzing the conversion of arginine to agmatine. This reaction is a key step in the biosynthesis of polyamines, which are critical for cell growth and differentiation. The family includes arginine decarboxylases that are widely distributed across different bacterial species. These enzymes play a crucial role in the polyamine biosynthetic pathway by providing the precursor agmatine for subsequent steps leading to the production of spermidine and spermine, which are essential for various cellular functions including DNA stabilization, protein synthesis, and cell signaling.
