identifier: PANTHER:PTHR43170
label: "GMP REDUCTASE"
definition: >-
  The GMP reductase family is involved in the purine-salvage pathway and plays a crucial role in nucleotide metabolism. Members of this family catalyze the irreversible NADPH-dependent deamination of GMP to IMP, thereby converting nucleotide derivatives of guanine to those of adenine. This enzymatic activity is essential for maintaining the intracellular balance of adenine and guanine nucleotides. The family includes proteins that may also contribute to the regulation of the purine nucleotide pool by recycling GMP to IMP. Some members are allosterically regulated by the ATP/GTP ratio and are inhibited by IMP and XMP, indicating a role in cellular nucleotide homeostasis. The family is also implicated in modulating cellular differentiation in higher organisms.
