identifier: PANTHER:PTHR30003
label: "L-LACTATE PERMEASE"
definition: >-
  This entry represents a family of L-lactate permeases. This family also includes GlcA, a permease for glycolate which is structurally and functionally similar to L-lactate permease and can also transport L-lactate and D-lactate.
