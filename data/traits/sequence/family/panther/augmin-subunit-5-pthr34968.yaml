identifier: PANTHER:PTHR34968
label: "AUGMIN SUBUNIT 5"
definition: >-
  The augmin complex regulates gamma-tubulin localization in mitotic spindles, but not at the centrosome. Plant and animal augmin complexes have similar functions in microtubule nucleation and organisation in mitotic microtubule arrays. The Arabidopsis augmin complex contains both conserved and unique subunits compared with its animal counterparts.
