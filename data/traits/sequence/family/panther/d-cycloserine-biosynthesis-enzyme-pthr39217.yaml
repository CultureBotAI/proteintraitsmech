  - kind: GENERAL
    text: >-
      This family of proteins is involved in the production of the antibiotic D-cycloserine, which is a structural analog of D-alanine and is used to treat tuberculosis. Members of this family are responsible for catalyzing the conversion of O-ureido-D-serine to D-cycloserine. They also interact with other substrates such as D-homocysteine and beta-aminooxy-D-alanine during the biosynthesis process.
