identifier: PANTHER:PTHR31859
label: "TETRATRICOPEPTIDE REPEAT PROTEIN 39 FAMILY MEMBER"
definition: >-
  This entry represents a family of proteins conserved from fungi to humans, including fungal Iml2 protein, animal tetratricopeptide repeat protein 39A/B/C (TT39A/B/C) and some related proteins. Members of this family carry a tetratricopeptide repeat (InterPro:IPR013105) at their C-terminal. IML2 is an inclusion body (IB) resident protein that interacts strongly with lipid droplet (LD) proteins. Involved in LD-mediated IB clearing after protein folding stress, probably by enabling access to the IBs of an LD-stored soluble sterol derivative that acts as a chaperone in inclusion clearing.
definition_source: "InterPro:IPR019412 abstract (PANTHER PTHR31859 is a member signature)"
