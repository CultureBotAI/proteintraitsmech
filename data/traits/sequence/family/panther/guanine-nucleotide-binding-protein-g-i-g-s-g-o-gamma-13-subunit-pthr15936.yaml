identifier: PANTHER:PTHR15936
label: "GUANINE NUCLEOTIDE-BINDING PROTEIN G I /G S /G O  GAMMA-13 SUBUNIT"
definition: >-
  A guanine nucleotide-binding protein (G protein) is involved in transmembrane signaling systems and is a complex of alpha, beta and gamma subunits. The beta and gamma subunits are required for GTPase activity. The entry includes the G protein gamma subunit GNG13. GNG13 associates with the alpha subunit of gustducin, a transducin-like G protein selectively expressed in taste receptor cells. The equivalent subunit in Drosophila melanogaster is known as guanine nucleotide-binding protein subunit gamma-e (Ggamma30A).
