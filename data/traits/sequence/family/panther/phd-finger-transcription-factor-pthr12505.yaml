  - kind: GENERAL
    text: >-
      This family of proteins includes members with a BAH domain, which is implicated in chromosomal localization and gene regulation. One characterized function within this family is the determination of tissue-specific identity, particularly in the context of developmental processes. For example, a member of this family in Drosophila is involved in the development of eye morphology and can induce ectopic wing formation when overexpressed. This suggests that the family may play a role in the regulation of morphogenetic pathways and the expression of genes responsible for tissue identity and development.
