identifier: PANTHER:PTHR12784
label: STEERIN
definition: >-
  This entry include Nav1/2/3 from mammals, unc-53 from C. elegans. They contain a calponin homology (CH) domain in the N terminus, several coiled-coil regions, polyproline rich SH3 binding motifs, and an ATPases associated with diverse cellular activities domain (AAA domain). They are required for the migration of cells and neuronal processes. Nav2 has been shown to rescue the mechanosensory neuron outgrowth defects of unc-53 mutants. Unc-53 has been found to bind to ABI-1, a regulator of Arp2/3 mediated actin filament nucleation. The Drosophila Nav2 homologue Sickie, also included in this family, regulates F-actin-mediated axonal growth.
definition_source: "InterPro:IPR039041 abstract (PANTHER PTHR12784 is a member signature)"
