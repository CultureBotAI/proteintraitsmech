identifier: PANTHER:PTHR35671
label: "PROTEIN TOPAZ1"
definition: >-
  TOPAZ1 is a germ cell specific protein highly conserved in vertebrates. It is essential for male meiotic progression. TOPAZ1 is an abbreviation for testis and ovary-specific PAZ domain-containing protein 1, although TOPAZ1 does not contain a PAZ domain.
