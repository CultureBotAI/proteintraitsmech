identifier: PANTHER:PTHR13314
label: "CALCIUM CHANNEL FLOWER HOMOLOG"
definition: >-
  This is a family of small (less than 200 residue long) proteins that are conserved from fungi to humans. Family members include the TVP18 Golgi membrane proteins that are involved in vesicular trafficking and the calcium channel flower proteins, which form calcium channels that regulate synaptic endocytosis.
