identifier: PANTHER:PTHR12064
label: "METAL TRANSPORTER CNNM"
definition: >-
  Proteins containing the ancient conserved domain protein/cyclin M (CNNM) are integral membrane proteins that are conserved from bacteria to humans. CNNM family members influence metal ion homeostasis through mechanisms that may not involve direct membrane transport of the ions. Structurally, CNNMs contain large cytosolic regions composed of a CBS-pair and a cyclic nucleotide-binding homology (CNBH) domain. In mammals, the CNNM family consists of 4 integral membrane proteins (CNNM1-4). NNM-associated Mg2+ transport has been shown shown to be regulated by the binding of phosphatases of regenerating liver (PRLs). PRLs are potent oncogenes with strong association with metastatic cancers. In Caenorhabditis elegans, there are five CNNM family members that may work together to regulate Mg2+ homeostasis.
