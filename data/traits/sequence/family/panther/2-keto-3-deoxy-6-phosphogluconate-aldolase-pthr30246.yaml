identifier: PANTHER:PTHR30246
label: "2-KETO-3-DEOXY-6-PHOSPHOGLUCONATE ALDOLASE"
definition: >-
  4-Hydroxy-2-oxoglutarate aldolase (EC:4.1.3.16) (KHG-aldolase) catalyzes the interconversion of 4-hydroxy-2-oxoglutarate into pyruvate and glyoxylate. Phospho-2-dehydro-3-deoxygluconate aldolase (EC:4.1.2.14) (KDPG-aldolase) catalyzes the interconversion of 6-phospho-2-dehydro-3-deoxy-D-gluconate into pyruvate and glyceraldehyde 3-phosphate. E. coli Eda is a KDPG-aldolase that has also been found to have a role in the degradation of 2-keto-4-hydroxyglutarate (KHG) to pyruvate and glyoxylate. In fact, KHG-aldolase and Eda are the same enzyme. This family consists of KHG/KDPG aldolases, and also includes 2-keto-3-deoxy-6-phosphogalactonate (KDPGal) aldolase. KDPGal-aldolase catalyzes an identical reaction to KDPG, differing in substrate specificity in only the configuration of a single stereocentre.
definition_source: "InterPro:IPR000887 abstract (PANTHER PTHR30246 is a member signature)"
