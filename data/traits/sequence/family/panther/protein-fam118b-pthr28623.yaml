identifier: PANTHER:PTHR28623
label: "PROTEIN FAM118B"
definition: >-
  This entry represents FAM118, including FAM118A and FAM118B. FAM118A has been identified as a gene expressed in glioblastoma stem cells, but not expressed in neural stem cells. Its function is unkown. Cajal bodies are specialized compartments in the nucleus that are involved in the biogenesis of small nuclear ribonucleoproteins (snRNPs). FAM118B is a component of Cajal bodies that plays an important role in Cajal body formation, snRNP biogenesis and cell viability.
