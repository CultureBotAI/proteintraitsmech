identifier: PANTHER:PTHR11668
label: "SERINE/THREONINE PROTEIN PHOSPHATASE"
definition: >-
  This entry represents Serine/threonine-protein phosphatase PP1 and related serine/threonine-protein phosphatases that are involved in a wide range of cellular processes. They associate with regulatory proteins to form holoenzymes that dephosphorylate numerous biological targets. These enzymes are essential for cell division and participate in the regulation of glycogen metabolism, muscle contractility, and protein synthesis. They are involved in the control of chromatin structure, cell cycle progression, ionic conductances, and long-term synaptic plasticity. Some family members play roles in the regulation of circadian rhythms, chromosome cohesion during meiosis, and mitosis, as well as in stress responses, such as osmotic stress and endoplasmic reticulum stress. Protein phosphorylation plays a central role in the regulation of cell functions, causing the activation or inhibition of many enzymes involved in various biochemical pathways. Kinases and phosphatases are the enzymes responsible for this, and may themselves be subject to control through the action of hormones and growth factors. Serine/threonine (S/T) phosphatases ( EC:3.1.3.16 ) catalyse the dephosphorylation of phosphoserine and phosphothreonine residues. In mammalian tissues four different types of PP have been identified and are known as PP1, PP2A, PP2B and PP2C. Except for PP2C, these enzymes are evolutionary related. The catalytic regions of the proteins are well conserved and have a slow mutation rate, suggesting that major changes in these regions are highly detrimental. Protein phosphatase-1 (PP1) and protein phosphatase-2A (PP2A) have a broad specificity and there are two closely related isoforms of each, alpha and beta. PP2A is a trimeric enzyme that consists of a core composed of a catalytic subuni
