identifier: PANTHER:PTHR11685
label: "RBR FAMILY  RING FINGER AND IBR DOMAIN-CONTAINING"
definition: >-
  This family of E3 ligases has a distinctive organisation of RING fingers called 'RING-betweenRING-RING' (RBR), characterised by two RING fingers with a cysteine-rich region called the 'in-between-RING' domain that separates them. The domains in the RBR E3 ligases have been further named as RING1-BRcat-Rcat according to their structure and function: the C-terminal Rcat (required-for-catalysis) domain is essential for catalytic activity, whereas the central BRcat (benign-catalytic) domain adopts the same fold as the Rcat, but lacks a catalytic cysteine residue and ubiquitination activity. These ligases have a unique mechanism of elongating ubiquitin chains that distinguishes them from other E3 ligases. On the basis of sequence conservation within the RBR segment, RBR proteins are assigned to 15 subfamilies (A-I, P, S, T, U, X, Z). There are two RBR proteins in the yeast Saccharomyces cerevisiae, six in Drosophila melanogaster, 10 in Caenorhabditis elegans, about 40 in Arabidopsis thaliana, around 23 in the zebrafish (Danio rerio), and about 15 in humans.
definition_source: "InterPro:IPR031127 abstract (PANTHER PTHR11685 is a member signature)"
