identifier: PANTHER:PTHR21704
label: "NIPPED-B-LIKE PROTEIN  DELANGIN  SCC2-RELATED"
definition: >-
  This entry represents the Nipped-B protein and its homologues, including Mis4 from fission yeast, Scc2 from budding yeast and Nipbl from zebrafish and Nipped-B from Drosophila. Budding yeast Scc2 is known to be part of the loader for the cohesion to be loaded onto the chromosome. It has also been shown to regulate gene expression independent of cohesin. Drosophila melanogaster Nipped-B protein is a chromatin binding protein that is involved in sister chromatid cohesion. Nipped-B and its Mau-2 partner are required for cohesin to associate with chromosomes. The Drosophila Nipped-B has also been shown to regulate gene expression. The zebrafish Nipbl has also been shown to regulate transcription. Nipbl has the ability to interact with other molecules such as histone deacetylases, HP-1gamma, and chromatin remodelling factors. It has been suggested that Nipbl is a cohesin-asociated scaffold protein that have functions other than loading cohesin.
definition_source: "InterPro:IPR033031 abstract (PANTHER PTHR21704 is a member signature)"
