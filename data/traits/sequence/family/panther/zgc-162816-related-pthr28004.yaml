  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the metabolism of various D-amino acids, primarily D-serine, D-threonine, and D-hydroxyaspartate. Members of this family catalyze reactions such as the deamination of D-serine to produce pyruvate and ammonia, which may play a role in detoxification. Some enzymes also exhibit dehydratase activity towards other D-amino acids, contributing to amino acid catabolism. Additionally, certain family members can catalyze aldolase reactions, participating in the assimilation of glyoxylate through specific metabolic cycles. The enzymes are subject to regulation by various inhibitors, including hydroxylamine, EDTA, and heavy metal ions, reflecting the importance of their precise control within cellular metabolism.
    source: "InterPro:IPR051466 abstract (LLM-generated, not curator-reviewed)"
