identifier: PANTHER:PTHR34933
label: "FLAGELLAR L-RING PROTEIN"
definition: >-
  The flgH, flgI and fliF genes of Salmonella typhimurium encode the major proteins for the L, P and M rings of the flagellar basal body. In fact, the basal body consists of four rings (L,P,S and M) surrounding the flagellar rod, which is believed to transmit motor rotation to the filament. The M ring is integral to the inner membrane of the cell, and may be connected to the rod via the S (supramembrane) ring, which lies just distal to it. The L and P rings reside in the outer membrane and periplasmic space, respectively. FlgH and FlgI, which are exported across the cell membrane to their destinations in the outer membrane and periplasmic space, have typical N-terminal cleaved signal-peptide sequences. FlgH is predicted to have an extensive β-sheet structure, in keeping with other outer membrane proteins.
definition_source: "InterPro:IPR000527 abstract (PANTHER PTHR34933 is a member signature)"
