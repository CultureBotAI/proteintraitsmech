identifier: PANTHER:PTHR23180
label: CENTAURIN/ARF
definition: >-
  ADP-ribosylation factors (ARFs) function in diverse physiological and molecular activities. This entry represents a group of GTPase-activating proteins (GAPs) for the ADP ribosylation factors (ARFs). This entry includes ACAP1-3 from animals, Age1 from budding yeasts and AGD1-4 from plants. ACAP1 and ACAP2 are Arf6 GTPase-activating proteins that function coordinately in the cell periphery. AGD1 is necessary for straight root hair growth in Arabidopsis.
