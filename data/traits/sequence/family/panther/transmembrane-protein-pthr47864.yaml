identifier: PANTHER:PTHR47864
label: "TRANSMEMBRANE PROTEIN"
definition: >-
  This entry represents the uncharacterised protein At2g29880 from Arabidopsis thaliana and related plant proteins, found mainly in clade Magnoliopsida. Members of this family contain a Myb/SANT-like domain at the N terminus [ InterPro:IPR024752 ]. Their function is unknown.
