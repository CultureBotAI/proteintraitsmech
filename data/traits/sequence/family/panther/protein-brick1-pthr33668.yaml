identifier: PANTHER:PTHR33668
label: "PROTEIN BRICK1"
definition: >-
  Protein BRICK1 (Brk1) is part of the WAVE/SCAR complex, which links upstream Rho-GTPase signalling to the activation of the Arp2/3-complex and mediates actin nucleation. Brk1 is the only subunit for which a major pool is not associated with the WAVE/SCAR complex. This free pool of Brk1 is composed of an homotrimer and is a critical precursor for the assembly of the WAVE/SCAR complex. Brk1 is required for embryonic development and cell transformation.
