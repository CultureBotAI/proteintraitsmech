identifier: PANTHER:PTHR43542
label: METHYLTRANSFERASE
definition: >-
  This entry contains ribosomal RNA small subunit methyltransferase D as well as the putative rRNA methyltransferase YlbH. They methylate the guanosine in position 966 of 16S rRNA in the assembled 30S particle. RsmD-like protein Rv2966 from Mycobacterium tuberculosis, also can methylate and modulate host cellular DNA within an infected mammalian cell, altering the host epigenetic machinery. It binds to specific host DNA sequences and methylates cytosines predominantly in a non-CpG context.
