  - kind: GENERAL
    text: >-
      This family of proteins includes zinc metalloproteases that are known to play a role in virulence, particularly in the context of bacterial pathogenicity. Members of this family are capable of inducing inflammation in the lower respiratory tract, which is evidenced by the increase of tumor necrosis factor alpha (TNF-alpha) in the lungs. The proteolytic activity of these enzymes is implicated in various processes important for the pathogenesis of diseases such as pneumonia and septicemia. The metalloprotease function suggests a broad spectrum of substrate specificity, which may include components of the host immune system or other proteins critical for maintaining host defenses.
