  - kind: GENERAL
    text: >-
      This family of proteins includes non-catalytic components of the methylosome complex, which is involved in the post-translational modification of specific arginines to dimethylarginines in spliceosomal Sm proteins and histones. These modifications are crucial for targeting Sm proteins to the survival of motor neurons (SMN) complex, facilitating their assembly into small nuclear ribonucleoprotein core particles. Additionally, these proteins are implicated in the methylation of Piwi proteins, a process necessary for their interaction with Tudor domain-containing proteins and subsequent localization to the meiotic nuage. Some members also function in the ubiquitination and degradation of immune regulatory GTPases in intestinal cells and may play roles in transcription regulation and the localization of cytoplasmic proteins during cellular processes such as oogenesis.
    source: "InterPro:IPR052139 abstract (LLM-generated, not curator-reviewed)"
