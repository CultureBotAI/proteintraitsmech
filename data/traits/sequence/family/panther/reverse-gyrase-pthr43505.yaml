identifier: PANTHER:PTHR43505
label: "REVERSE GYRASE"
definition: >-
  This entry represents reverse gyrases found in both bacteria and archaea. Reverse gyrase, a fusion of a type I topoisomerase domain and a helicase domain, introduces positive supercoiling to increase the melting temperature of DNA double strands. Generally, these gyrases are encoded as a single polypeptide. An exception was found in Methanopyrus kandleri, where enzyme is split within the topoisomerase domain, yielding a heterodimer of gene products designated RgyB and RgyA. DNA topoisomerases are divided into two classes: type I enzymes (EC:5.99.1.2; topoisomerases I, III and V) break single-strand DNA, and type II enzymes (EC:5.99.1.3; topoisomerases II, IV and VI) break double-strand DNA. Type I topoisomerases can be subdivided according to their structure and reaction mechanisms: type IA (bacterial and archaeal topoisomerase I, topoisomerase III and reverse gyrase) and type IB (eukaryotic topoisomerase I and topoisomerase V). Most of the Type I topoisomerases are ATP-independent and are responsible for relaxing positively and/or negatively supercoiled DNA. Reverse gyrase is a unique type IA topoisomerase in that it requires ATP and can introduce positive supercoils into DNA.
definition_source: "InterPro:IPR005736 abstract (PANTHER PTHR43505 is a member signature)"
