identifier: PANTHER:PTHR46977
label: "PROTEIN FREE1"
definition: >-
  FYVE domain protein required for endosomal sorting 1 (FREE1), also known as FYVE domain-containing protein 1 (FYVE1) is a component of the endosomal sorting complex required for transport (ESCRT), involved in multivesicular body (MVB) protein sorting and plant growth. It negatively regulates salt stress tolerance via a negative feedback loop involving abscisic acid (ABA) signaling pathway.
