identifier: PANTHER:PTHR31852
label: "LATE EMBRYOGENESIS ABUNDANT (LEA) HYDROXYPROLINE-RICH GLYCOPROTEIN FAMILY"
definition: >-
  This family includes Lea14-like proteins from plants. Unlike members of, most proteins in this family lack the Water Stress and Hypersensitive response (WHy) domain. Their function is not clear. LEA (late embryogenesis abundant) proteins were first identified in land plants. Plant LEA proteins have been found to accumulate to high levels during the last stage of seed formation (when a natural desiccation of the seed tissues takes place) and during periods of water deficit in vegetative organs. Later, LEA homologues have also been found in various species. They have been classified into several subgroups in Pfam and according to Bray and Dure.
