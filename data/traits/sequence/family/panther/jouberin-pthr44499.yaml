identifier: PANTHER:PTHR44499
label: JOUBERIN
definition: >-
  This family of proteins is involved in various cellular processes related to ciliogenesis and vesicle trafficking. They are essential for the formation of primary non-motile cilia and play a role in the recruitment of specific proteins to the basal body of the cilium. These proteins are also components of a complex that acts as a barrier at the transition zone of primary cilia, preventing the diffusion of transmembrane proteins between the cilia and plasma membranes. Additionally, they are implicated in neuronal differentiation and act as positive modulators of classical Wnt signaling, which is crucial for ciliary signaling during the embryonic development of the cerebellum.
