identifier: PANTHER:PTHR31288
label: "O-FUCOSYLTRANSFERASE FAMILY PROTEIN"
definition: >-
  This entry represents a group of plant-specific O-fucosyltransferases and their homologues. O-fucosyltransferase-like proteins are GDP-fucose dependent enzymes with similarities to the family 1 glycosyltransferases (GT1). They are soluble ER proteins that may be proteolytically cleaved from a membrane-associated preprotein, and are involved in the O-fucosylation of protein substrates, the core fucosylation of growth factor receptors, and other processes.
