identifier: PANTHER:PTHR45769
label: "ADENOSINE KINASE"
definition: >-
  Adenosine kinase (ADK) phosphorylates adenosine and other related nucleosides. It is exclusive to eukaryotes and is a key enzyme in the purine salvage pathway. ADK catalyses the reaction: Adenosine + ATP = ADP + AMP This reaction prevents toxic levels of adenosine building up within the cell. Experiments have been carried out on Gallus gallus (chicken) embryonic neurons to document the toxicity of adenosine, and the associated requirement for ADK. Adenosine and ATP have been connected with pain, and the control of pain. Associated with this, adenosine has also been shown to have a number of anti-inflammatory activities. Human ADK bears little sequence similarity to other mammalian nucleoside kinases, but does share high similarity with some microbrial ribokinases and fructokinases, suggesting possible evolutionary connections.
definition_source: "InterPro:IPR001805 abstract (PANTHER PTHR45769 is a member signature)"
