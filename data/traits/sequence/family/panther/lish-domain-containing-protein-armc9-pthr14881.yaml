identifier: PANTHER:PTHR14881
label: "LISH DOMAIN-CONTAINING PROTEIN ARMC9"
definition: >-
  Proteins in this family are mostly from animals. The only characterised protein is LisH domain-containing protein ARMC9, which is localised to the basal body of a cilium and is upregulated during ciliogenesis. Mutations in the ARMC9 gene cause Joubert Syndrome, a recessive neurodevelopmental disorder characterised by hypotonia, ataxia, abnormal eye movements, and variable cognitive impairment.
