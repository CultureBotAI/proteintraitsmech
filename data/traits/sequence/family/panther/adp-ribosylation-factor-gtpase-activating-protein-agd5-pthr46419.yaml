identifier: PANTHER:PTHR46419
label: "ADP-RIBOSYLATION FACTOR GTPASE-ACTIVATING PROTEIN AGD5"
definition: >-
  This entry represents a group of plant ADP-ribosylation factor GTPase-activating proteins (ArfGAPs), such as AGD5/15 from Arabidopsis. ArfGAPs are a family of proteins containing an ArfGAP catalytic domain that induces the hydrolysis of GTP bound to the small guanine nucleotide-binding protein Arf, a member of the Ras superfamily of GTPases. AGD5 (also known as EVERSHED) is localised to the trans-Golgi network (TGN), where it co-localises with ARF1, a crucial GTPase that is involved in membrane trafficking. It facilitates the intracellular movement of molecules required for organ abscission and fruit growth.
