identifier: PANTHER:PTHR42733
label: "DJ-1 PROTEIN"
definition: >-
  PfpI from Pyrococcus furiosus functions as a protein deglycase that repairs methylglyoxal- and glyoxal-glycated proteins. Pfpi-like proteins have been found in bacteria, archaea, in some plants and in amoebae. The structure of P. horikoshii PfpI shows an α/β sandwich fold, which consists of a central β sheet flanked by two helices and two strands on one side, and by six helices and two strands on the other side. The fold resembles that of glutamine amidotransferases (GATase) of class I, which are characterised by a conserved Cys-His-Glu active site. The catalytically essential cysteine is located at a nucleophile elbow. PfpI forms a hexameric structure and the active sites are formed at the interfaces between three pairs of monomers. Cys and His form a triad with a glutamate residue from an adjacent monomer. Other proteins in this group: Bacillus subtilis general stress protein 18 (GSP18/yfkM). E. coli protein yhbO. It is involved in protection against environmental stresses. It has deglycase activity, and can repair glyoxal- and methylglyoxal-glycated proteins and nucleic acids. This group of proteins form part of the MEROPS peptidase family C56 (Pfp1 endopeptidase, clan PC(C)).
definition_source: "InterPro:IPR006286 abstract (PANTHER PTHR42733 is a member signature)"
