identifier: PANTHER:PTHR16453
label: "WD40 DOMAIN-CONTAINING PROTEIN MIO FAMILY MEMBER"
definition: >-
  This entry includes the GATOR complex protein MIOS, a component of the GATOR subcomplex GATOR2. The GATOR2 complex consists of MIOS, SEC13, SEH1L, WDR24 and WDR59, and it activates mTORC1 and the TORC1 signalling pathway through the inhibition of the GATOR1 subcomplex. This entry also includes Sea4 from budding yeasts. Sea4 is a subunit of SEACAT, a subcomplex of the SEA complex. It inhibits the TORC1 inhibitory role of the Iml1p/SEACIT (Iml1-Npr2-Npr3) subcomplex.
definition_source: "InterPro:IPR037593 abstract (PANTHER PTHR16453 is a member signature)"
