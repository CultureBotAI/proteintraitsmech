identifier: PANTHER:PTHR33171
label: "LAR_N DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents lactate racemase LarA and similar proteins mainly found in prokaryotes. LarA catalyses the interconversion between the D- and L-isomers of lactate. It may act as a rescue enzyme to ensure D-lactate production in physiological conditions where its production by the D-lactate dehydrogenase LdhD is not sufficient. LarA is a nickel-dependent lactate racemase from the larA-E operon of Lactobacillus plantarum, whereas LarB, LarC and LarE are accessory proteins required for the incorporation of Ni in the lactate racemase apoprotein. LarA contains 18 β-strands and 16 α-helices arranged in a novel fold composed of two domains of similar size.
definition_source: "InterPro:IPR048068 abstract (PANTHER PTHR33171 is a member signature)"
