identifier: PANTHER:PTHR23040
label: "Outer dynein arm-docking complex subunit 4"
definition: >-
  ODAD4 (also known as TTC25) is a subunit of the outer dynein arm (ODA) docking complex (DC). Mutations of the TTC25 gene cause an ODA-DC defect involving severely reduced ciliary motility and classical symptoms of PCD (primary ciliary dyskinesia), as well as randomization of left-right body asymmetry in humans and mice.
