identifier: PANTHER:PTHR24171
label: "ANKYRIN REPEAT DOMAIN-CONTAINING PROTEIN 39-RELATED"
definition: >-
  ANKYRIN REPEAT DOMAIN-CONTAINING PROTEIN 39-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24171. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function ubiquitin-protein transferase activity. Subfamilies participate in protein polyubiquitination. Subfamilies localise to nuclear ubiquitin ligase complex, nucleus, BRCA1-A complex.
