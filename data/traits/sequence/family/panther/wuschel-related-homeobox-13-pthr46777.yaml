identifier: PANTHER:PTHR46777
label: "WUSCHEL-RELATED HOMEOBOX 13"
definition: >-
  This entry includes WUSCHEL-related homeobox (WOX8/10/13/14) from Arabidopsis. The expression of AtWOX14 isrestricted to the early stages of lateral root formation and specific to developing anthers, while AtWOX13 is expressed during primary and lateral root initiation and development, in gynoecium and during embryo development.
