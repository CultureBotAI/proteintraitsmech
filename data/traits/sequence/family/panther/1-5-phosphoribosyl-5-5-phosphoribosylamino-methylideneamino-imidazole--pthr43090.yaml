identifier: PANTHER:PTHR43090
label: "1-(5-PHOSPHORIBOSYL)-5-[(5-PHOSPHORIBOSYLAMINO)METHYLIDENEAMINO] IMIDAZOLE-4-CARBOXAMIDE ISOMERASE"
definition: >-
  This protein family consists of HisA and its homologues from archaea, bacteria, fungi and plants. HisA is a phosphoribosylformimino-5-aminoimidazole carboxamide ribotide isomerase (also known as 1-(5-phosphoribosyl)-5-(5-phosphoribosylamino methylideneamino) imidazole-4-carboxamide isomerase EC:5.3.1.16 ) that catalyses the fourth step in histidine biosynthesis. It is closely related to the enzyme HisF for the sixth step. Examples of this enzyme in Actinobacteria have been found to be bifunctional, also possessing phosphoribosylanthranilate isomerase activity. This entry also includes chloroplastic HisA homologue from Arabidopsis and His6 from budding yeasts.
definition_source: "InterPro:IPR044524 abstract (PANTHER PTHR43090 is a member signature)"
