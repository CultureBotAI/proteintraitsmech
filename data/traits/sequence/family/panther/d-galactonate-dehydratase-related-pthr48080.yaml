identifier: PANTHER:PTHR48080
label: "D-GALACTONATE DEHYDRATASE-RELATED"
definition: >-
  This entry includes a subgroup of mandelate racemases, including D-galactonate dehydratase (DgoD) and related proteins. The mandelate racemase group consists of the subset of enolase superfamily enzymes with a conserved histidine, presumably acting as an active site base, at the position of H297 in Pseudomonas putida mandelate racemase (UniProtKB:P11444). An additional conserved aspartic acid controls the p K a of this histidine (D270 in Pseudomonas putida mandelate racemase). Families contained within this group include mandelate racemase, D-galactonate dehydratase (dgoD), gluconate dehydratase, L-fuconate dehydratase, D-tartrate dehydratase, and L-talarate/galactarate dehydratase.
definition_source: "InterPro:IPR034593 abstract (PANTHER PTHR48080 is a member signature)"
