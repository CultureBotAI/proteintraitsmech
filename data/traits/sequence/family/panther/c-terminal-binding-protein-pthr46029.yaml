  - kind: GENERAL
    text: >-
      This family of proteins functions as corepressors that interact with various transcription regulators, influencing gene expression. Members exhibit dehydrogenase activity and are involved in the regulation of the Golgi complex's structure. They play a significant role in the differentiation of brown adipose tissue (BAT). Some isoforms act as scaffolds at specialized synapses. Additionally, certain family members are implicated in lifespan regulation and lipid metabolism through gene repression.
    source: "InterPro:IPR051638 abstract (LLM-generated, not curator-reviewed)"
