definitions:
  - kind: GENERAL
    text: >-
      C-TERMINAL-BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46029. PANTHER protein class: transcription cofactor. Members are annotated with the molecular function transcription coactivator activity, transcription regulator activity, transcription corepressor activity. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
