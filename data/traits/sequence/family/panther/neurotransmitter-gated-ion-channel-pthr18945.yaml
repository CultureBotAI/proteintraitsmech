identifier: PANTHER:PTHR18945
label: "NEUROTRANSMITTER GATED ION CHANNEL"
definition: >-
  The receptors are composed of varying numbers and types of subunit. Each subunit contains a large extracellular N-terminal ligand-binding region; 3 hydrophobic transmembrane domains; a large intracellular region; and a fourth hydrophobic domain. The GABA, acetylcholine, serotonin 5HT3 and glycine receptors share a degree of sequence similarity, but differ from the glutamate receptors - sequences of this family possess 2 Cys residues in the N-terminal domain, which, in nicotinic receptors, form a disulphide bond essential for correct folding of the structure. This entry includes the subunits of the GABA-A, nicotinic, glycine, glutamate and 5HT3 receptors. Neurotransmitter ligand-gated ion channels are transmembrane receptor-ion channel complexes that open transiently upon binding of specific ligands, allowing rapid transmission of signals at chemical synapses. Five of these ion channel receptor families have been shown to form a sequence-related superfamily: Nicotinic acetylcholine receptor (AchR), an excitatory cation channel in vertebrates and invertebrates; in vertebrate motor endplates it is composed of alpha, beta, gamma and delta/epsilon subunits; in neurons it is composed of alpha and non-alpha (or beta) subunits. Glycine receptor, an inhibitory chloride ion channel composed of alpha and beta subunits. Gamma-aminobutyric acid (GABA) receptor, an inhibitory chloride ion channel; at least four types of subunits (alpha, beta, gamma and delta) are known. Serotonin 5HT3 receptor, of which there are seven major types (5HT3-5HT7). Glutamate receptor, an excitatory cation channel of which at least three types have been described (kainate, N-methyl-D-aspartate (NMDA) and quisqualate). These receptors possess a pentameric structure (made up of varying subunits), surrounding
definition_source: "InterPro:IPR006201 abstract (PANTHER PTHR18945 is a member signature)"
