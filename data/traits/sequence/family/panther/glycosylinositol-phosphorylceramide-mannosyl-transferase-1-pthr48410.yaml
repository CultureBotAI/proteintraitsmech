identifier: PANTHER:PTHR48410
label: "GLYCOSYLINOSITOL PHOSPHORYLCERAMIDE MANNOSYL TRANSFERASE 1"
definition: >-
  Glycosyltransferase 64 (GT64) is involved in the biosynthesis of glycosylinositol phosphorylceramides (GIPCs) and is thought to be essential for cell-cell adhesion, organ integrity, and metabolite movement in plants. Members of the family, such as Glycosylinositol phosphorylceramide mannosyl transferase 1, function as mannosyl transferases (ManT) and are implicated in the prevention of abscisic acid-mediated developmental effects, including aspects like cell size, flowering time, and senescence. GT64 is also likely involved in the biosynthesis of beta-(1,4)-galactan, contributing to cell-wall synthesis and thus playing a critical role in plant development and structural stability.
definition_source: "InterPro:IPR053318 abstract (PANTHER PTHR48410 is a member signature)"
