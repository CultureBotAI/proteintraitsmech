identifier: PANTHER:PTHR37360
label: "FRAGILE X MENTAL RETARDATION 1 NEIGHBOR PROTEIN"
definition: >-
  This entry represents human FMR1 neighbor protein (FMR1NB) and similar sequences mainly found in mammals. Members of this family are located in the vicinity of the FMR1 gene, which is associated with Fragile X syndrome, a condition related to intellectual disability and developmental delays. FMR1NB, also named NY-SAR-35, is aberrantly expressed in various cancer tissues and is involved in cell proliferation and invasion.
definition_source: "InterPro:IPR055331 abstract (PANTHER PTHR37360 is a member signature)"
