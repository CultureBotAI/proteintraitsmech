identifier: PANTHER:PTHR42958
label: "HYDROGENASE-2 LARGE CHAIN"
definition: >-
  The [NiFe]/[NiFeSe] hydrogenase large subunit family includes enzymes that play a crucial role in energy metabolism by catalyzing the reversible oxidoreduction of molecular hydrogen. Members of this family are involved in various physiological processes, such as hydrogen uptake, hydrogen cycling during fermentative growth, and the recycling of hydrogen produced by nitrogenase. This recycling is significant for ATP production and for protecting nitrogenase from oxygen damage under certain conditions. Additionally, some members are part of complexes that reduce methanophenazine to dihydromethanophenazine. The HupK family proteins are associated with hydrogenase expression and formation, suggesting a regulatory role in hydrogenase enzyme systems.
