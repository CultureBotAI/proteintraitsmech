definitions:
  - kind: GENERAL
    text: >-
      SERINE/THREONINE/TYROSINE-INTERACTING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46588. Members are annotated with the molecular function protein binding. Members participate in negative regulation of proteasomal protein catabolic process, negative regulation of proteasomal ubiquitin-dependent protein catabolic process, regulation of cell communication. Members localise to cytoplasm, membrane-enclosed lumen, nucleoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes catalytically inactive phosphatases that interact with serine, threonine, and tyrosine residues. Members of this family function as nuclear anchors for MAPK1/MAPK3, also known as ERK1/ERK2, thereby modulating cell-fate decisions and cell migration through the spatiotemporal regulation of these kinases. Additionally, they are involved in inhibiting the degradation of substrates by preventing the assembly of the SCF E3 ubiquitin-protein ligase complex through binding to the F-box of FBXW7. These proteins also play a role in spermatogenesis, highlighting their importance in developmental processes.
    source: "InterPro:IPR052449 abstract (LLM-generated, not curator-reviewed)"
