identifier: PANTHER:PTHR43853
label: "3-KETOACYL-COA THIOLASE, PEROXISOMAL"
definition: >-
  This family includes 3-ketoacyl-CoA thiolases which are involved in key metabolic processes, primarily catalysing the thiolytic cleavage of 3-ketoacyl-CoA to form acetyl-CoA and a CoA ester that is two carbons shorter, a crucial step in the beta-oxidation pathway of fatty acid metabolism. This reaction is fundamental for the breakdown of fatty acids, enabling their conversion into acetyl-CoA, which enters the citric acid cycle for energy production. Some family members also catalyze the cleavage of beta-ketoadipyl-CoA to succinyl-CoA and acetyl-CoA, and are implicated in the metabolism of aromatic compounds. Additionally, certain thiolases are involved in the biosynthesis of jasmonic acid, a plant hormone associated with stress responses, and in the production of floral scent compounds. The family includes both peroxisomal and non-peroxisomal enzymes, with some members possessing a peroxisomal targeting signal for localisation.
definition_source: "InterPro:IPR050215 abstract (PANTHER PTHR43853 is a member signature)"
