identifier: PANTHER:PTHR35864
label: "ZINC METALLOPROTEASE MJ0611-RELATED"
definition: >-
  This family represents a group of uncharacterised homologues of Site-2 protease (S2P), zinc metalloproteases from the MEROPS family M50, which cleave transmembrane domains of substrate proteins, regulating intramembrane proteolysis (RIP) of diverse signal transduction mechanisms. Members of the S2P/M50 family of RIP proteases transfer information across membranes through its proteolytic activity, connecting gene expression with physiologic stresses occurring in another cellular compartment. In eukaryotic cells they regulate different processes including sterol and lipid metabolism and endoplasmic reticulum stress responses. In prokaryotes they regulate sporulation, cell division, stress response, and cell differentiation. This group includes S2P/M50s homologues with a minimal core protein and no PDZ domains, including the putative zinc metalloprotease Rip2 from Mycobacterium tuberculosis.
