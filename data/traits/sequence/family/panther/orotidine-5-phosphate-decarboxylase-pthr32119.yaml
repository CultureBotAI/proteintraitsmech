identifier: PANTHER:PTHR32119
label: "OROTIDINE 5'-PHOSPHATE DECARBOXYLASE"
definition: >-
  Orotidine 5'-phosphate decarboxylase (OMPdecase) (EC:4.1.1.23) catalyses the last step in the de novo biosynthesis of pyrimidines, the decarboxylation of OMP into UMP. In higher eukaryotes OMPdecase is part, with orotate phosphoribosyltransferase, of a bifunctional enzyme, while the prokaryotic and fungal OMPdecases are monofunctional proteins. Some parts of the sequence of OMPdecase are well conserved across species. The best conserved region is located in the N-terminal half of OMPdecases and is centred around a lysine residue which is essential for the catalytic function of the enzyme. OMPdecases adopt classical TIM-barrel fold with an active site located at one side of the barrel.
definition_source: "InterPro:IPR014732 abstract (PANTHER PTHR32119 is a member signature)"
