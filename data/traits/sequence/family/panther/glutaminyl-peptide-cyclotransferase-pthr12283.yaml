identifier: PANTHER:PTHR12283
label: "GLUTAMINYL-PEPTIDE CYCLOTRANSFERASE"
definition: >-
  This entry represents glutaminyl cyclases (QC), which are a subfamily of the peptidase M28 family. Glutaminyl cyclase (QC, QPCT, glutaminyl-peptide cyclotransferase) and iso-glutaminyl cyclase (QPCTL, isoQC) catalyze the formation of an N-terminal pyroglutamate (pGlu) residue from a glutaminyl or glutamyl residue. QC and isoQC are closely related single-zinc metalloenzymes that exhibit nearly identical substrate specificity in vitro. The major difference refers to subcellular localization: QC is secreted from expressing cells; isoQC is a resident enzyme of the Golgi complex. In humans, QCs are involved in several pathological conditions, such as Alzheimer disease. Human pituitary glutaminyl cyclase shares a common fold and active site residues with and bacterial zinc aminopeptidase. In contrast to the aminopeptidase, however, QC does not appear to require zinc for enzymatic activity. This entry also includes peptidase_M28 domain-containing proteins from bacteria.
