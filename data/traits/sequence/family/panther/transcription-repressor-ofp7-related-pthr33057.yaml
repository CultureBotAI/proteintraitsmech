identifier: PANTHER:PTHR33057
label: "TRANSCRIPTION REPRESSOR OFP7-RELATED"
definition: >-
  This entry includes a group of plant transcriptional repressors, known as Ovate proteins. In Arabidopsis, there are 18 Ovate family members. They function as transcriptional repressors that regulate growth and development in plants.
