identifier: PANTHER:PTHR43265
label: "ESTERASE ESTD"
definition: >-
  This family of proteins exhibits esterase activity, preferentially hydrolyzing short acyl chain esters ranging from C4 to C8. The precise physiological role of these proteins remains unclear. They do not display protease or peptidase activity when tested with common substrates. Members of this family are characterized by their inhibition by specific chemicals, including serine protease inhibitors and histidine modifiers, while being unaffected by chelating agents or reducing agents.
