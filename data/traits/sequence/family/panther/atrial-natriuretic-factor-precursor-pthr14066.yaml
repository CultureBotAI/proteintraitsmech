identifier: PANTHER:PTHR14066
label: "ATRIAL NATRIURETIC FACTOR PRECURSOR"
definition: >-
  The natriuretic peptide family consists of hormones that play crucial roles in cardiovascular and renal homeostasis. Members of this family are involved in the regulation of extracellular fluid volume and electrolyte balance through processes such as natriuresis, diuresis, vasorelaxation, and the inhibition of renin and aldosterone secretion. They act by binding to specific receptors, such as NPR1, to stimulate the production of cGMP, which then activates downstream effector proteins. Some peptides in this family also have antifibrotic effects in the heart, serve as paracrine factors, and are implicated in vascular remodeling, energy metabolism regulation, and blood pressure control. They may also play roles in pregnancy by promoting trophoblast invasion and spiral artery remodeling, as well as in lipid metabolism and energy homeostasis in adipose tissue.
definition_source: "InterPro:IPR050787 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, not curator-reviewed)"
