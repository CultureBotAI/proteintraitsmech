identifier: PANTHER:PTHR35458
label: "SLR0755 PROTEIN"
definition: >-
  This family represents a group of bacterial and archaeal proteins, which are poorly characterised. They contain a NYN domain InterPro:IPR021139. This entry includes low amplitude and bright protein LabA from Synechococcus elongatus PCC 7942 ( UniProtKB:Q31LZ8 ) which participates in cyanobacterial circadian timing. It is required for negative feedback regulation of the autokinase/autophosphatase KaiC, a central component of the circadian clock system, and appears to be necessary for KaiC-dependent repression of gene expression.
definition_source: "InterPro:IPR047140 abstract (PANTHER PTHR35458 is a member signature)"
