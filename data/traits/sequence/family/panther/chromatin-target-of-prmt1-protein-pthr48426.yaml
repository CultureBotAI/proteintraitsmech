identifier: PANTHER:PTHR48426
label: "CHROMATIN TARGET OF PRMT1 PROTEIN"
definition: >-
  The Chromatin Target of PRMT1 (CTOP) protein family is involved in various cellular processes, including mRNA nuclear export, estrogen receptor target gene activation, and gene transcription regulation. Members of this family are components of the TREX complex, which is crucial for mRNA transcription, processing, and nuclear export, particularly associating with spliced mRNA. They also play a role in the export of intronless mRNAs and virus production. CTOP proteins interact with the methylosome complex, which includes PRMT1, PRMT5, MEP50, and ERH, to methylate H4R3 and activate transcription of genes, especially those implicated in glioblastomagenesis. Additionally, they are involved in the desumoylation and transactivation of ZNF148 target genes and are associated with 5-hydroxymethylcytosine on the chromosome.
