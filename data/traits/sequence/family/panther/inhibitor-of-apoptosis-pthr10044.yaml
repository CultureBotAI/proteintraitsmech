identifier: PANTHER:PTHR10044
label: "INHIBITOR OF APOPTOSIS"
definition: >-
  The IAP family of proteins are multifunctional regulators of apoptosis, inflammation, immunity, cell proliferation, and cell cycle control. They exhibit E3 ubiquitin-protein ligase activity, modulating NF-kappa-B signalling and various cell signalling pathways. IAP proteins inhibit caspases and apoptosis, either directly by binding to caspases or indirectly through ubiquitination of pro-apoptotic proteins, promoting cell survival. They also play roles in innate immune signalling by regulating pattern recognition receptors and can suppress the formation of ripoptosomes, complexes capable of inducing cell death. Additionally, some IAP members are involved in Wnt signalling, copper homeostasis, and the regulation of cell motility. Their BIR domains are crucial for inhibiting caspases and interacting with other proteins, while RING domains are essential for their E3 ligase activity.
definition_source: "InterPro:IPR050784 abstract (PANTHER PTHR10044 is a member signature)"
