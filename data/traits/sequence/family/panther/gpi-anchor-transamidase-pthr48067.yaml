identifier: PANTHER:PTHR48067
label: "GPI-ANCHOR TRANSAMIDASE"
definition: >-
  Many glycoproteins of lower and higher eukaryotes are attached to the plasma membrane by means of a glycosylphosphatidylinositol (GPI) anchor, which is added onto newly synthesized proteins in the endoplasmic reticulum (ER). Precursors of GPI anchored proteins have a GPI anchoring signal at their C terminus; GPI-anchor transamidase (MEROPS identifier C13.005) removes the C-terminal peptide and replaces it with the preformed GPI.
definition_source: "InterPro:IPR028361 abstract (PANTHER PTHR48067 is a member signature)"
