identifier: PANTHER:PTHR33169
label: "PADR-FAMILY TRANSCRIPTIONAL REGULATOR"
definition: >-
  This entry represents Putative DNA-binding protein YizB, Transcriptional regulator Rv3488, Uncharacterized protein X. These proteins are DNA-binding proteins that are potentially involved in transcription regulation and may play a role in metal detoxification. Members of this family are known to bind to promoter regions, suggesting a regulatory function in gene expression. Some proteins within this family have been shown to bind various metal ions, including cadmium, zinc, manganese, and nickel, which may contribute to intracellular survival and metal tolerance in certain bacteria. The family features a winged-helix-turn-helix (wHTH) DNA-binding domain, typically located at the N-terminal, and a C-terminal α-helix that is implicated in protein dimerisation. Metal binding is associated with conformational changes that affect both metal-binding and DNA-binding residues.
