    text: >-
      CHYMOTRYPSIN-LIKE ELASTASE FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24257. PANTHER protein class: serine protease, protein modifying enzyme. Members are annotated with the molecular function serine-type endopeptidase activity. Members participate in proteolysis. Members localise to extracellular region.
