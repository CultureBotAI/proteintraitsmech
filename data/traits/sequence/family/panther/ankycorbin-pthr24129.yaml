identifier: PANTHER:PTHR24129
label: ANKYCORBIN
definition: >-
  This family includes a group of membrane-shaping proteins that can promote local membrane curvatures, termed N-Ank proteins, which use their ankyrin repeat array and an N-terminal amphipathic helix to bind and shape membranes. The N-Ank superfamily can be divided in two subfamilies, the smaller one contains ankycorbin (also known as RAI14), UACA, Ankyrin repeat domain-containing protein 24 and 35 (Ankrd24/35); the larger second subfamily includes the uncharacterised proteins of the Ankrd18, Ankrd30 and Ankrd20 subfamilies, which all are specific to primates, or even to humans, as well as Ankrd7, Ankrd26, Ankrd36 and Ankrd62. This entry represents the smaller N-Ank subfamily. Ankycorbin is an actin binding protein that regulates F-actin dynamics. It plays an important role in early morphogenesis of neurons which depends on ankyrin repeat and N-terminal amphipathic helix. UACA (also known as Nucling) mediates apoptosis, regulates NF-κB and STAT3, sequesters par-4 and acts as an autoantigen in patients with panuveitis. Ankrd24 is a componement of the stereocilia rootlet in hair cells of inner ear. It bridges the apical plasma membrane with the lower rootlet and maintains normal distribution of TRIOBP, thereby reinforcing stereocilia insertion points and organising rootlets for hearing with long-term resilience. ANKRD35 is associated with chronic myeloid leukaemia. ANKRD35 interacts with E3 ligase RBCK1 and is part of the RBCK1-ANKRD35-MITD1-ANXA1 axis in clear cell renal cell carcinoma (ccRCC) that regulates the phosphorylation of AKT and ERK and contributes to the dysregulation of sunitinib in ccRCC cells which constitutes a novel mechanism by which RBCK1 regulates sunitinib sensitivity in ccRCC.
