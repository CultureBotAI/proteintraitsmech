identifier: PANTHER:PTHR45861
label: "DNA POLYMERASE ALPHA CATALYTIC SUBUNIT"
definition: >-
  DNA POLYMERASE ALPHA CATALYTIC SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45861. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, DNA replication origin binding, DNA-directed DNA polymerase activity. Members participate in nuclear DNA replication, cellular metabolic process, mitotic cell cycle. Members localise to DNA polymerase complex, non-membrane-bounded organelle, organelle lumen.
