identifier: PANTHER:PTHR45861
label: "DNA POLYMERASE ALPHA CATALYTIC SUBUNIT"
definition: >-
  DNA POLYMERASE ALPHA CATALYTIC SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45861. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function DNA-directed DNA polymerase activity, DNA replication origin binding, single-stranded DNA binding. Members participate in mitotic DNA replication initiation, nuclear DNA replication, DNA strand elongation involved in DNA replication. Members localise to nuclear DNA-directed RNA polymerase complex, DNA polymerase complex, nuclear lumen.
