identifier: PANTHER:PTHR34399
label: AVIDIN-RELATED
definition: >-
  This family of proteins is characterized by their ability to form strong non-covalent specific complexes with biotin, with one molecule of biotin binding per subunit. The exact biological function of these proteins is not fully understood, but their high affinity for biotin is a defining feature. The family includes both avidin and streptavidin types, which are known for their use in various biochemical applications due to this biotin-binding property.
