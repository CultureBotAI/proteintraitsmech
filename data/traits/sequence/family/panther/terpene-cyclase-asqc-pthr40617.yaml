  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in diverse biosynthetic and protective pathways in fungi. Members of this family function as dehydratases and hydratases, catalyzing the addition or removal of water from specific substrates. One member is involved in the biosynthesis of aspoquinolone mycotoxins, participating in a multi-step pathway that includes dehydration of an epoxide intermediate. Another member acts defensively by converting a fungitoxic compound into a less toxic form, aiding in the survival of the pathogenic fungus against plant defenses. These activities highlight the family's role in both fungal secondary metabolism and pathogen-host interactions.
