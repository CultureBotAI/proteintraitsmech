identifier: PANTHER:PTHR39962
label: "BLL4848 PROTEIN"
definition: >-
  This family of proteins includes UDP-2,3-diacylglucosamine pyrophosphatase LpxI which is involved in the biosynthesis of lipid A, a critical component of the lipopolysaccharide that forms the outer membrane of certain bacterial cells. Members of this family act as enzymes that specifically hydrolyse the pyrophosphate bond of UDP-2,3-diacylglucosamine, yielding 2,3-diacylglucosamine 1-phosphate and UMP. This reaction is a key step in the formation of lipid A. The enzymes possess two domains: an N-terminal domain that binds lipid X and a C-terminal catalytic domain. The binding of the substrate induces a conformational change that facilitates the enzymatic reaction. The activity of these proteins is regulated by metal ions and can be inhibited by agents such as EDTA.
