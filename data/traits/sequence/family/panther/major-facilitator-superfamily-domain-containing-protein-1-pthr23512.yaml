identifier: PANTHER:PTHR23512
label: "MAJOR FACILITATOR SUPERFAMILY DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This family of proteins includes lysosomal transporters that are crucial for maintaining liver homeostasis. Human MFSD1 is a lysosomal dipeptide uniporter that selectively exports lysine, arginine or histidine-containing dipeptides with a net positive charge from the lysosome lumen into the cytosol. Members of this family are responsible for the stability and lysosomal localization of the protein GLMP. They feature a characteristic dileucine internalization motif that is essential for their localization to the lysosome. These proteins are part of the major facilitator superfamily, which is known for facilitating the transport of various substrates across cellular membranes.
definition_source: "InterPro:IPR052187 abstract (PANTHER PTHR23512 is a member signature)"
