identifier: PANTHER:PTHR19923
label: "WD40 REPEAT PROTEINPRL1/PRL2-RELATED"
definition: >-
  This entry represents a group of WD40 repeat containing proteins, including Prp46 from budding yeasts, Prp5 from fission yeasts, PLRG1 from animals and PRL1/2 from plants. Prp46 and Prp5 are involved in pre-mRNA splicing and may be required for both cell cycle progression at G2/M. PLRG1 is a component of the PRP19-CDC5L complex that forms an integral part of the spliceosome and is required for activating pre-mRNA splicing. In Arabidopsis PRL1/2 are pleiotropic regulator of glucose, stress and hormone responses. PRL1 is part of the MAC, a multiprotein complex with a role in plant defense signaling.
definition_source: "InterPro:IPR045241 abstract (PANTHER PTHR19923 is a member signature)"
