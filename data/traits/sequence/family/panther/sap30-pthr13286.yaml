identifier: PANTHER:PTHR13286
label: SAP30
definition: >-
  Histone acetylation plays a key role in the regulation of gene expression. The chromatin structure and accessibility of genes to transcription factors is regulated by enzymes that acetylate and deacetylate histones. The Sin3A-histone deacetylase (HDAC) co-repressor complex consists of multiple proteins and regulates gene expression by deacetylating histones. This entry includes both Sin3-associated protein 30 (SAP30) and SAP30L, a close homologue of SAP30. Both are able to target Sin3A to the nucleolus.
