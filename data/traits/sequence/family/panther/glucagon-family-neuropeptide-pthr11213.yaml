identifier: PANTHER:PTHR11213
label: "GLUCAGON-FAMILY NEUROPEPTIDE"
definition: >-
  A number of peptidic hormones, expressed in the intestine, the pancreas or hypothalamus, belong to a group of structurally related peptides of the glucagon family. This family includes vasoactive intestinal peptide (VIP), growth hormone releasing factor (GHRH) and Pituitary adenylate cyclase-activating polypeptide (PACA).
