identifier: PANTHER:PTHR21838
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 137"
definition: >-
  This entry represents the CCDC137 family of coiled-coil domain-containing proteins. CCDC137 is localised to chromosomes and is a component of the mitotic chromosome proteome. The protein contains multiple coiled-coil regions and extensive disordered regions. CCDC137 is phosphorylated at multiple serine residues during mitosis and interacts with TERF2. The protein is found in the nucleolus and nucleoplasm during interphase and associates with chromosomes during mitosis. The specific function remains to be determined.
definition_source: "InterPro:IPR026680 abstract (PANTHER PTHR21838 is a member signature)"
