  - kind: GENERAL
    text: >-
      This family of proteins includes serine proteases with diverse biological functions. Some members, known as thrombins, play a crucial role in the coagulation cascade by converting fibrinogen to fibrin, which is essential for blood clot formation. They also activate several coagulation factors and protein C, contributing to blood homeostasis, inflammation response, and wound healing. These proteins are regulated by inhibitors such as SERPINA5. Other members of this family, although classified as serine proteases, are inactive and may be involved in the regeneration of skeletal muscle. The family is characterized by a similarity to the peptidase S1 family, indicating a shared structural domain that typically confers protease activity.
