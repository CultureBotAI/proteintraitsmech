identifier: PANTHER:PTHR34941
label: "DEHYDRIN HIRD11"
definition: >-
  Dehydrins (group 2 late embryogenesis abundant proteins) are plant proteins that are responsive to abiotic stresses such as drought, extreme temperature, and high salinity. This entry includes KS-type dehydrin HIRD11 from Arabidopsis. AtHIRD11 inhibits the reactive oxygen species (ROS) generation from copper.
