      RRNA-PROCESSING PROTEIN EFG1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33911. Members participate in maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA), ribonucleoprotein complex biogenesis, biosynthetic process. Members localise to nucleolus, nuclear lumen, preribosome, small subunit precursor.
