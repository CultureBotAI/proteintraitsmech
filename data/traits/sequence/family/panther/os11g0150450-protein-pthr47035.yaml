  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that are capable of catalyzing the polyubiquitination process. They interact with various ubiquitin-conjugating enzymes (E2s) such as UBC8, UBC10, UBC11, and UBC34 in vitro. The presence of a RING-type zinc finger domain is characteristic of these proteins, which is essential for their interaction with E2 enzymes. Members of this family play a role in the ubiquitin-proteasome pathway, which is a critical mechanism for protein degradation and regulation in eukaryotic cells. The ubiquitination process mediated by these ligases typically tags proteins for degradation, thus controlling protein levels and influencing various cellular processes.
    source: "InterPro:IPR053070 abstract (LLM-generated, not curator-reviewed)"
