identifier: PANTHER:PTHR10915
label: SYNDECAN
definition: >-
  The syndecans are multifunctional transmembrane heparan sulphate bearing cell surface receptors. There are four syndecans in mammals (syndecan1-4), but only one syndecan in C. elegans or D. melanogaster. These homologues have similar protein structure that consists of four separate domains: A signal sequence; An extracellular domain (ectodomain) of variable length whose sequence is not evolutionary conserved in the various forms of syndecans. The ectodomain contains the sites of attachment of the heparan sulphate glycosaminoglycan side chains; A transmembrane region; A highly conserved cytoplasmic domain of about 30 to 35 residues, which could interact with cytoskeletal proteins. Invertebrate syndecan is implicated in the regulation of neural migration and axon guidance. It may play an important role during early development.
