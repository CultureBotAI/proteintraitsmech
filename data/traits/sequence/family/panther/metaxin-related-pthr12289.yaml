identifier: PANTHER:PTHR12289
label: "METAXIN RELATED"
definition: >-
  This family of proteins is primarily involved in the transport of proteins into the mitochondrion, a critical process for mitochondrial function and biogenesis. Members of this family are essential for embryonic development, indicating a vital role in early stages of life. Some proteins within this family may also have a role in axonal development, suggesting a broader functional spectrum beyond mitochondrial import.
