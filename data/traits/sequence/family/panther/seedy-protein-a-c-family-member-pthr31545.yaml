identifier: PANTHER:PTHR31545
label: "SEEDY PROTEIN A/C FAMILY MEMBER"
definition: >-
  This family of proteins is involved in the regulation of cell cycle progression, particularly the G1/S phase transition and meiotic G2/M progression. Members of this family bind and activate cyclin-dependent kinases (CDK1 and CDK2), facilitating cell cycle transitions without promoting CDK2 phosphorylation. They induce conformational changes in the T-loop of CDK2, which allows for kinase activation. Additionally, they can interfere with CDKN1B-mediated inhibition of CDK2 and are implicated in cell survival during DNA damage. In oocytes, they stimulate maturation by activating the MAPK cascade and cdc2-cyclin B complex, and are necessary for polyadenylation. They also play roles in the spindle-assembly checkpoint by recruiting components to kinetochores and are involved in the correct localization of Aurora B during prometaphase.
