identifier: PANTHER:PTHR23127
label: "CENTROMERE/MICROTUBULE BINDING PROTEIN CBF5"
definition: >-
  This family, found in archaea and eukaryotes, includes the only archaeal proteins markedly similar to bacterial TruB, the tRNA pseudouridine 55 synthase. However, among two related yeast proteins, the archaeal set matches yeast YLR175w far better than YNL292w. The first, termed centromere/microtubule binding protein 5 (CBF5), is an apparent rRNA pseudouridine synthase, while the second is the exclusive tRNA pseudouridine 55 synthase for both cytosolic and mitochondrial compartments. It is unclear whether archaeal proteins found by this entry modify tRNA, rRNA, or both. Yeast CBF5 plays a central role in ribosomal RNA processing. It is a probable catalytic subunit of H/ACA small nucleolar ribonucleoprotein (H/ACA snoRNP) complex, which catalyzes pseudouridylation of rRNA. This involves the isomerization of uridine such that the ribose is subsequently attached to C5, instead of the normal N1. Its pseudouridine ('psi') residues may serve to stabilise the conformation of rRNAs. It may function as a pseudouridine synthase. It is also a centromeric DNA-CBF3-binding factor which is involved in mitotic chromosome segregation.
definition_source: "InterPro:IPR004802 abstract (PANTHER PTHR23127 is a member signature)"
