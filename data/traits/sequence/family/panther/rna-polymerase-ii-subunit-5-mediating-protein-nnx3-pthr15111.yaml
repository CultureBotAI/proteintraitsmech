definitions:
  - kind: GENERAL
    text: >-
      RNA POLYMERASE II SUBUNIT 5-MEDIATING PROTEIN NNX3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15111. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function transcription regulator activity, phosphatase inhibitor activity, enzyme inhibitor activity. and participate in negative regulation of hydrolase activity, negative regulation of cellular metabolic process, negative regulation of RNA metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of gene transcription and cellular growth signaling pathways. Members act as transcriptional repressors, working with corepressors to regulate transcription factors such as androgen receptors. Some family members are implicated in tumor suppression by inhibiting gene transcription that promotes anchorage-independent growth in cancer cells. They are also essential for cell survival in certain cancer types. These proteins play a role in maintaining signaling pathways that are critical for cell survival under normal conditions, by mediating negative feedback mechanisms that prevent excessive signaling. They can inhibit the activity of specific phosphatases in mitochondria, and are involved in the coordination of nutrient-sensitive gene expression in a manner dependent on the mTOR pathway. Additionally, they have a scaffolding function, capable of assembling a complex with prefoldin and other proteins involved in transcription and ubiquitination processes.
    source: "InterPro:IPR052255 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
