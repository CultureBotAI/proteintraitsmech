identifier: PANTHER:PTHR47173
label: "PROTEIN DR1 HOMOLOG"
definition: >-
  This entry includes Dr1 homologues from plants. They are putative transcription factors. Human Dr1 has been shown to interact with TATA-binding protein (TBP) and block its ability to activate transcription. Arabidopsis Dr1 may affect the regulatory pathway for sexual development.
