identifier: PANTHER:PTHR15633
label: "NUCLEOLAR PROTEIN 11"
definition: >-
  NOL11 is a nucleolar protein and a component of the human ribosomal small subunit (SSU) processome. It is required for the early stages of ribosome biogenesis in humans. It interacts with the C-terminal region of the known t-UTP/UTPA subcomplex member, hUTP4/Cirhin, the protein mutated in North American Indian childhood cirrhosis (NAIC). In Xenopus, it is required for optimal rDNA transcription and craniofacial development.
definition_source: "InterPro:IPR042859 abstract (PANTHER PTHR15633 is a member signature)"
