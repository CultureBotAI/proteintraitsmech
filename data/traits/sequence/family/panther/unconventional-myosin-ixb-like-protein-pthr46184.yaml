identifier: PANTHER:PTHR46184
label: "UNCONVENTIONAL MYOSIN-IXB-LIKE PROTEIN"
definition: >-
  Myosin IX (Myo9) is a processive single-headed motor, which might play a role in signalling. Class IX myosins contain a GTPase-activating protein (GAP) domain in their tail region, which allows them to negatively regulate small Rho GTPases. This entry includes unconventional myosin-IXb and unconventional myosin-IXa. Myosin-IXb plays a role in the regulation of cell migration via its role as RHOA GTPase activator. This is regulated by its interaction with the SLIT2 receptor ROBO1; interaction with ROBO1 impairs interaction with RHOA and subsequent activation of RHOA GTPase activity, and thereby leads to increased levels of active, GTP-bound RHOA. Myosin-IXa is highly expressed in the brain and binds the alpha-amino-3-hydroxy-5-methyl-4-isoxazole propionic acid receptor (AMPAR) GluA2 subunit, and plays a key role in controlling the molecular structure and function of hippocampal synapses. Moreover, Myosin-IXa functions in epithelial cell morphology and differentiation such that its knockout mice develop hydrocephalus and kidney dysfunction. Myosin-IXa regulates collective epithelial cell migration by targeting RhoGAP activity to cell-cell junctions. Myosin-IXa negatively regulates Rho GTPase signalling, and functions as a regulator of kidney tubule function.
