identifier: PANTHER:PTHR30588
label: "BRANCHED-CHAIN AMINO ACID TRANSPORT SYSTEM 2 CARRIER PROTEIN"
definition: >-
  Characterised members of the branched chain Amino Acid:Cation Symporter (LIVCS) family transport all three of the branched chain aliphatic amino acids (leucine (L), isoleucine (I) and valine (V)). They function by a Na+ or H+ symport mechanism and display 12 putative transmembrane helical spanners.
