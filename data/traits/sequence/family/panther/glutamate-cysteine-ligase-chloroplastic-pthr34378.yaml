identifier: PANTHER:PTHR34378
label: "GLUTAMATE--CYSTEINE LIGASE, CHLOROPLASTIC"
definition: >-
  This entry represents glutamate--cysteine ligase (GCL) from bacteria and plants, including EgtA from Actinobacteria and chloroplastic GCL from Arabidopsis. EgtA resembles the glutamate--cysteine ligase of the two-step pathway for glutathione (GSH) biosynthesis, but instead are involved in the biosynthesis of the histidine-derived thiol, ergothioneine (EGT). Successful in vitro reconstitution of EGT biosynthesis using EgtBCDE and gamma-L-glutamyl-L-cysteine suggests that this enzyme is a bone fide glutamate--cysteine ligase.
