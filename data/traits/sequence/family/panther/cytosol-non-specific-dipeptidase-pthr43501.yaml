identifier: PANTHER:PTHR43501
label: "CYTOSOL NON-SPECIFIC DIPEPTIDASE"
definition: >-
  This majority of this group of proteins are aminoacyl-histidine dipeptidases (Xaa-His dipeptidases, cytosol non-specific dipeptidases, peptidase D), which are zinc-containing metallopeptidases that belong to MEROPS peptidase family M20 (clan MH), subfamily M20C. Proteins of this clan have two catalytic zinc ions at the active site, bound by His/Asp, Asp, Glu, Asp/Glu and His. The catalysed reaction involves the release of an N-terminal amino acid, usually neutral or hydrophobic, from a polypeptide.
