identifier: PANTHER:PTHR21465
label: "ZINC FINGER PROTEIN 469"
definition: >-
  Zinc finger protein 469 (ZNF469) is found in chordates and is uncharacterised. Mutations in the ZNF469 gene are associated with brittle cornea syndrome, an autosomal-recessive disorder characterised by a thin cornea that tends to perforate, causing progressive visual loss and blindness. The protein contains several C2H2-type zinc fingers.
