identifier: PANTHER:PTHR45870
label: "TUBULIN MONOGLYCYLASE TTLL3"
definition: >-
  This family of proteins is involved in the post-translational modification of tubulin, specifically through the addition of glycine side chains to the gamma-carboxyl groups of glutamate residues within the C-terminal tail of tubulin. Members of this family act as monoglycylases, initiating the addition of single glycine residues, a process known as glycylation. This modification is crucial for the stability and maintenance of microtubules, particularly in the cilia and flagella, where it plays a role in motility and cell signaling. Some family members can also modify non-tubulin proteins, adding versatility to their functional repertoire. The glycylation activity competes with polyglutamylases, suggesting a regulatory mechanism between glycylation and glutamylation that impacts microtubule dynamics.
