identifier: PANTHER:PTHR12582
label: "NETRIN RECEPTOR UNC5"
definition: >-
  This entry represents uncoordinated-5 (UNC-5) family, whose members include Unc5A, B, C and D from vertebrates and Unc5 from invertebrates. UNC-5 proteins are transmembrane netrin receptors that play a crucial role in axon guidance and neuronal development. Upon binding to secreted netrins (netrin-1, -3, and -4), these receptors mediate axonal repulsion of neuronal growth cones, contributing to proper nervous system patterning. In addition to axonal guidance, UNC-5 receptors are involved in neuronal migration, blood vessel patterning, cell-cell adhesion, cell migration, and apoptosis. Structurally, they possess an extracellular region comprising two immunoglobulin-like repeats and two thrombospondin type-I modules, along with an intracellular region containing ZU-5, UPA, and death domains (DD), which facilitate downstream signalling.
definition_source: "InterPro:IPR037936 abstract (PANTHER PTHR12582 is a member signature)"
