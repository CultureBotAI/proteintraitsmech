  - kind: GENERAL
    text: >-
      The Acyl-CoA dehydrogenase family is involved in the beta-oxidation of cholesterol catabolism, contributing to the virulence of Mycobacterium tuberculosis by increasing the efficiency of this metabolic pathway. Members of this family catalyze the dehydrogenation of various CoA esters, including those with steroid side chains, playing roles in different cycles of side chain dehydrogenation. Specific functions include the conversion of 3-oxo-4-pregnene-20-carboxyl-CoA to 3-oxo-4,17-pregnadiene-20-carboxyl-CoA, the dehydrogenation of 5OH-HIP-CoA to 5OH-HIPE-CoA, and the transformation of (25S)-3-oxo-cholest-4-en-26-oyl-CoA to (24E)-3-oxo-cholest-4,24-dien-26-oyl-CoA. Some members also show activity with other steroyl-CoA substrates, indicating a broader substrate specificity within the family.
    source: "InterPro:IPR052161 abstract (LLM-generated, not curator-reviewed)"
