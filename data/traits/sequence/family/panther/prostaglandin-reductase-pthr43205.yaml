identifier: PANTHER:PTHR43205
label: "PROSTAGLANDIN REDUCTASE"
definition: >-
  This entry represents the MDR (medium-chain dehydrogenase/reductase) family. The MDR/zinc-dependent alcohol dehydrogenase-like family, which contains the zinc-dependent alcohol dehydrogenase (ADH-Zn) and related proteins, is a diverse group of proteins related to the first identified member, class I mammalian ADH. MDRs display a broad range of activities and are distinguished from the smaller short chain dehydrogenases (~ 250 amino acids vs. the ~ 350 amino acids of the MDR). The MDR proteins have 2 domains: a C-terminal NAD(P) binding-Rossmann fold domain of a β-α form and an N-terminal catalytic domain with distant homology to GroES.
definition_source: "InterPro:IPR045010 abstract (PANTHER PTHR43205 is a member signature)"
