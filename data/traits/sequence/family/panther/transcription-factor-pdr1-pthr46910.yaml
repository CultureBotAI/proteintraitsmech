identifier: PANTHER:PTHR46910
label: "TRANSCRIPTION FACTOR PDR1"
definition: >-
  This entry represents a family of fungal transcription factors, including ABC-transporter-regulating transcription factor from Aspergillus oryzae (AtrR), which regulates expression of the genes related to resistance to azole compounds. Members of this family are involved in the activation of gluconeogenic enzymes, regulation of drug-responsive genes, and control of biosynthetic gene clusters for secondary metabolites such as ergot pigments, fusaridione A, oryzines, AAL-toxins, and fumonisins. Some family members are uncharacterised.
