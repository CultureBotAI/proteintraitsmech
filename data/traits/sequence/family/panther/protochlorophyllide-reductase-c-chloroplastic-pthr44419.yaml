identifier: PANTHER:PTHR44419
label: "PROTOCHLOROPHYLLIDE REDUCTASE C, CHLOROPLASTIC"
definition: >-
  Protochlorophyllide (Pchlide) reductases act in chlorophyll biosynthesis. There are distinct enzymes that catalyze Pchlide reduction in light or dark conditions. This family contains the light-dependent, NADPH-dependent form of protochlorophyllide reductase (EC:1.3.1.33) which catalyses the reaction chlorophyllide A + NADP+ = protochlorophyllide + NADPH. The enzyme belongs to the short chain alcohol dehydrogenase family (SDR).
