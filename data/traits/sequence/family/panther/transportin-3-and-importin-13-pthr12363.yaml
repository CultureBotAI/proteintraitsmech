  - kind: GENERAL
    text: >-
      The importin beta family is involved in the nuclear-cytoplasmic transport of proteins. Members of this family function as nuclear transport receptors, mediating the import of proteins into the nucleus by recognizing nuclear localization signals (NLS) in cargo substrates. They are also involved in the nuclear export of certain proteins. The transport process is typically energy-dependent, requiring the GTPase Ran, which helps dissociate the cargo-importin complex within the nucleus. The family plays a crucial role in various cellular processes, including mRNA transport, protein import for transcription, splicing, and ribonucleotide reductase function. Some members are also implicated in plant immunity and viral infection processes, such as HIV-1 integration.
    source: "InterPro:IPR051345 abstract (LLM-generated, not curator-reviewed)"
