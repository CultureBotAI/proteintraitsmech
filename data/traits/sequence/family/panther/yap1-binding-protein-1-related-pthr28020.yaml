identifier: PANTHER:PTHR28020
label: "YAP1-BINDING PROTEIN 1-RELATED"
definition: >-
  This entry represents YAP1-binding protein 1/2 (YBP1/2) from fungi. They are involved in cellular response to oxidative stress. In Candida albicans, Ybp1 and Gpx3 mediate Cap1-dependent oxidative stress responses.
