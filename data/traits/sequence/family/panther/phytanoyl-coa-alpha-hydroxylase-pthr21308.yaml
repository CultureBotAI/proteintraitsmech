identifier: PANTHER:PTHR21308
label: "PHYTANOYL-COA ALPHA-HYDROXYLASE"
definition: >-
  This entry represents Phytanoyl-CoA dioxygenase from human (PhyH) and similar proteins found in animals, bacteria and some fungal species. PhyH catalyses the 2-hydroxylation of not only racemic phytanoyl-CoA and the isomers of 3-methylhexadecanoyl-CoA, but also a variety of other mono-branched 3-methylacyl-CoA esters (with a chain length of at least seven carbon atoms) and straight-chain acyl-CoA esters (with a chain length longer than four carbon atoms). PhyH deficiency causes Refsum's disease (RD) which is an inherited neurological syndrome biochemically characterised by the accumulation of phytanic acid in plasma and tissues.
definition_source: "InterPro:IPR047128 abstract (PANTHER PTHR21308 is a member signature)"
