identifier: PANTHER:PTHR13094
label: "NADH-UBIQUINONE OXIDOREDUCTASE PDSW SUBUNIT"
definition: >-
  This entry includes NADH dehydrogenase [ubiquinone] 1 beta subcomplex subunit 10 (NDUFB10) and mitochondrial NADH-ubiquinone oxidoreductase 12kDa subunit (also known as NDUS6). NADH-ubiquinone oxidoreductase subunit 10 of (NDUFB10) is a member of a family of conserved proteins of up to 180 residues. It is one of the 41 protein subunits within the hydrophobic fraction of the NADH:ubiquinone oxidoreductase (complex I), a multiprotein complex located in the inner mitochondrial membrane whose main function is the transport of electrons from NADH to ubiquinone, which is accompanied by translocation of protons from the mitochondrial matrix to the intermembrane space. NDUFB10 is encoded in the nucleus. NADH dehydrogenase [ubiquinone] iron-sulphur protein 6 subunit is an accessory subunit of the mitochondrial membrane respiratory chain NADH dehydrogenase (Complex I), that is believed to be not involved in catalysis. Complex I functions in the transfer of electrons from NADH to the respiratory chain and is composed of about 45 subunits. The immediate electron acceptor for the enzyme is believed to be ubiquinone.
