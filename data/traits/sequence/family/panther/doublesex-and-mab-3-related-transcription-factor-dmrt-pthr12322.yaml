identifier: PANTHER:PTHR12322
label: "DOUBLESEX AND MAB-3 RELATED TRANSCRIPTION FACTOR  DMRT"
definition: >-
  The DMRT family contains putative transcription factors related to the sexual regulators doublesex (Drosophila melanogaster) and mab-3 (Caenorhabditis elegans). Its members are involved in sex determination/differentiation. Mab-3 promotes male-specific development of two tissues. In the peripheral nervous system, it directs differentiation of sensory ray neuroblasts into peripheral sense organs. In the intestine, It causes repression of vitellogenin gene transcription. It binds the DNA motif 5'-[CGA][TCA][TA]ACAATGT[AT][TGA]C-3', probably as a monomer.
definition_source: "InterPro:IPR026607 abstract (PANTHER PTHR12322 is a member signature)"
