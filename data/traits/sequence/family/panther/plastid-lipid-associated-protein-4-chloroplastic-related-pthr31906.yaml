identifier: PANTHER:PTHR31906
label: "PLASTID-LIPID-ASSOCIATED PROTEIN 4, CHLOROPLASTIC-RELATED"
definition: >-
  This entry includes a group of plastid-lipid-associated protein (PAP) from plants and Cyanobacteria (blue-green algae). The plant proteins in this entry are also known as plant fibrillins. Aarabidopsis PAP1 is involved in chloroplast stress-related jasmonate biosynthesis. PAP6, also known as FIBRILLIN4, is required for plastoglobule development and stress resistance in apple and Arabidopsis. FIBRILLIN5 has been shown to be involved in the plastoquinone-9 biosynthetic pathway in Arabidopsis and rice.
definition_source: "InterPro:IPR039633 abstract (PANTHER PTHR31906 is a member signature)"
