identifier: PANTHER:PTHR12783
label: "RALA BINDING PROTEIN 1  RALBP1"
definition: >-
  RALBP1, also known as RLIP76, is a Ral-binding GTPase activating protein implicated in a number of cell processes, including receptor-mediated endocytosis, cell migration, mitochondrial division and metabolite transport. It transports glutathione-conjugates of electrophilic compounds and may contribute to the multidrug resistance. It has been shown to mediate ATP-dependent transport of glutathione-conjugates and doxorubicin in human erythrocytes.
