identifier: PANTHER:PTHR45873
label: "DNA POLYMERASE ETA"
definition: >-
  The DNA polymerase eta family consists of specialized DNA polymerases involved in translesion synthesis (TLS), a DNA repair mechanism that allows DNA replication to proceed past lesions or distortions within the DNA helix. Members of the family are characterized by their ability to insert nucleotides opposite lesions, such as UV-induced pyrimidine dimers, with relaxed geometric constraints, leading to higher rates of misincorporation and low processivity. They often cooperate with other polymerase complexes, like POLZ, for complete bypass of DNA lesions. The family plays a crucial role in maintaining genomic stability by facilitating error-free or error-prone bypass of DNA damage, which is essential for cell survival following genotoxic stress. They also contribute to hypermutation at immunoglobulin genes and are involved in homologous recombination repair. The catalytic core of these enzymes features smaller fingers and thumb subdomains compared to high-fidelity polymerases, and their activity is regulated by the binding of a third divalent metal cation.
