identifier: PANTHER:PTHR38492
label: ADROPIN
definition: >-
  Adropin is a peptide hormone that plays an important role in the regulation of lipid and glucose homeostasis. It is involved in carbohydrate-lipid metabolism, metabolic diseases, central nervous system function, endothelial function and cardiovascular disease. Some potential therapeutic benefits derived from adropin include enhancing glucose tolerance, ameliorating insulin resistance and lipid metabolism, and protecting against endothelial barrier dysfunction.
