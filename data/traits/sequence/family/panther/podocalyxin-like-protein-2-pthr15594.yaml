identifier: PANTHER:PTHR15594
label: "PODOCALYXIN-LIKE PROTEIN 2"
definition: >-
  Podocalyxin-like protein 2 (PODXL2), also known as Endoglycan, is a ligand for the vascular selectins. It belongs to the CD34 family, whose members contain an N-terminal acidic region appended to the sialomucin domain.
