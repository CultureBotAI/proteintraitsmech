identifier: PANTHER:PTHR43640
label: "OS07G0260300 PROTEIN"
definition: >-
  This family represents a group uncharacterised proteins that show sequence similarity to Peroxiredoxins (PRXs). Members of this group contain a conserved cysteine that aligns to the first cysteine in the CXXC motif of TRX. This does not correspond to the peroxidatic cysteine found in PRXs, which aligns to the second cysteine in the CXXC motif of TRX. In addition, these proteins do not contain the other two conserved residues of the catalytic triad of PRX. PRXs confer a protective antioxidant role in cells through their peroxidase activity in which hydrogen peroxide, peroxynitrate, and organic hydroperoxides are reduced and detoxified using reducing equivalents derived from either thioredoxin, glutathione, trypanothione and AhpF.
definition_source: "InterPro:IPR047262 abstract (PANTHER PTHR43640 is a member signature)"
