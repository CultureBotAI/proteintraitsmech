identifier: PANTHER:PTHR39214
label: "MICROBODY (PEROXISOME) BIOGENESIS PROTEIN PEROXIN 8 (EUROFUNG)"
definition: >-
  This entry represents Peroxisomal biogenesis factor 8 from Komagataella pastoris (PEX8) and similar fungal proteins. PEX8 is an essential component of the machinery required for the import of both PTS1 and PTS2 (and perhaps all) peroxisomal matrix proteins. This family also includes the ortologue PEX17 from Yarrowia lipolytica.
