identifier: PANTHER:PTHR42146
label: "3',5'-CYCLIC-NUCLEOTIDE PHOSPHODIESTERASE"
definition: >-
  This family of prokaryotic proteins includes enzymes involved in nucleotide metabolism. Some members of this family are capable of degrading RNA oligonucleotides, particularly those with a length of five nucleotides, by cleaving them from the 3' to 5' direction. They exhibit a preference for adenine-rich RNA sequences and show reduced activity on shorter oligonucleotides or those with a length of 24 nucleotides. Additionally, some family members possess the ability to hydrolyse cyclic nucleotides such as cAMP and cGMP into their corresponding 5'-monophosphates, without exhibiting phosphohydrolase activity towards phospholipids or phosphorylated sugars. The enzymatic activities of these proteins are crucial for the regulation of intracellular nucleotide levels and the maintenance of RNA turnover.
definition_source: "InterPro:IPR052968 abstract (PANTHER PTHR42146 is a member signature)"
