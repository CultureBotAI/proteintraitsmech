  - kind: GENERAL
    text: >-
      The glycosyl hydrolase 97 family encompasses enzymes with diverse substrate specificities, including alpha-galactosidases and glucan 1,4-alpha-glucosidases. Alpha-galactosidases in this family are capable of hydrolyzing alpha-1,6 disaccharides like melibiose and synthetic substrates such as p-nitrophenyl alpha-galactoside, retaining the anomeric configuration. They do not act on substrates like DNP-Glc or pNP-Glc. Another member, glucan 1,4-alpha-glucosidase, targets alpha-1,4-glucosidic linkages and can also cleave alpha-1,6-, alpha-1,3-, and alpha-1,2-glucosidic linkages in starch degradation. The activity of these enzymes is known to be inhibited by EDTA. Collectively, the glycosyl hydrolase 97 family plays a crucial role in carbohydrate metabolism by breaking down complex sugars into simpler forms, facilitating their utilization or further processing within various biological systems.
    source: "InterPro:IPR052720 abstract (LLM-generated, not curator-reviewed)"
