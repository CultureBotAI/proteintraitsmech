identifier: PANTHER:PTHR34935
label: "PROTEIN TIC110, CHLOROPLASTIC"
definition: >-
  Chloroplastic protein TIC110 is a component of the Tic complex. It has been proposed to be central to protein translocation across the inner envelope membrane, though this is still controversial.
