identifier: PANTHER:PTHR11736
label: "MELANOMA-ASSOCIATED ANTIGEN  MAGE ANTIGEN"
definition: >-
  The melanoma antigen (MAGE) protein family contains more than 25 members that share a conserved MAGE homology domain (MHD). Proteins known to contain a MAGE domain are listed below: Human MAGE-A, -B and -C proteins. MAGE-A, -B and -C genes are silent in all normal tissues with the exception of testis. Human MAGE-D to -L proteins. MAGE-D to -L genes are expressed in normal adult tissues. Mouse Mage-a and -b proteins. Mouse Mage-d, -e, -g, -h, -k and -l. Mammalian Necdin. The human Necdin gene is a candidate for the Prader-Willi syndrome. Human Trophinin mediates apical cell adhesion between trophoblastic cells and luminal epithelial cells of the endometrium and is implicated in the initial attachment during the process of human embryo implantation.
definition_source: "InterPro:IPR037445 abstract (PANTHER PTHR11736 is a member signature)"
