identifier: PANTHER:PTHR31040
label: NURIM
definition: >-
  Nurim is an inner nuclear membrane protein which may play an important role in the suppression of apoptosis. There are related enzymes in bacteria, including methanethiol S-methyltransferase ( EC:2.1.1.334 ), which catalyses the methylation of methanethiol to yield dimethylsulphide (a volatile compound important in climate regulation), suggesting a potential ancient origin.
