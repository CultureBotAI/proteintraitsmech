  - kind: GENERAL
    text: >-
      This family of proteins includes transporters that are involved in various cellular transport processes. Some members are responsible for the extrusion of multiple antimicrobial compounds, contributing to multidrug resistance. These proteins typically function as antiporters, exchanging ions like H+ or Na+ for organic cations across the cell membrane. Other members are involved in the biosynthesis of peptidoglycan, an essential component of bacterial cell walls, by transporting lipid-linked peptidoglycan precursors across the cytoplasmic membrane. Additionally, the family may include transporters for specific molecules such as flavin adenine dinucleotide (FAD) and possibly indole-3-acetic acid (IAA) or its derivatives, indicating a diverse range of substrate specificities and biological roles.
