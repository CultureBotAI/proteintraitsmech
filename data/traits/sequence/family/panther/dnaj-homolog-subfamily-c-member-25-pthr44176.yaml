identifier: PANTHER:PTHR44176
label: "DNAJ HOMOLOG SUBFAMILY C MEMBER 25"
definition: >-
  This entry includes DNAJC25 from humans and its homologues from other animals, yeast and plants. Its homologues in plants such as At1g61770 from Arabidopsis and OsERdj7 from rice, and ERJ5 from yeast may play a role in protein folding in the endoplasmic reticulum.
