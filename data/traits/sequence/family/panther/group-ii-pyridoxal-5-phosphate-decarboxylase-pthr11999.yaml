identifier: PANTHER:PTHR11999
label: "GROUP II PYRIDOXAL-5-PHOSPHATE DECARBOXYLASE"
definition: >-
  A number of pyridoxal-dependent decarboxylases share regions of sequence similarity, particularly in the vicinity of a conserved lysine residue, which provides the attachment site for the pyridoxal-phosphate (PLP) group. Among these enzymes are aromatic-L-amino-acid decarboxylase (L-dopa decarboxylase or tryptophan decarboxylase), which catalyses the decarboxylation of tryptophan to tryptamine; tyrosine decarboxylase, which converts tyrosine into tyramine; and histidine decarboxylase, which catalyses the decarboxylation of histidine to histamine. These enzymes belong to the group II decarboxylases.
