  - kind: GENERAL
    text: >-
      SERINE/THREONINE-PROTEIN KINASE TAO1-LIKE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47167. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity. Members participate in protein phosphorylation. Members localise to cytoplasm.
