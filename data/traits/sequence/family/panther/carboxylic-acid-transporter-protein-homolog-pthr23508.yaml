definition: >-
  CARBOXYLIC ACID TRANSPORTER PROTEIN HOMOLOG — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23508. PANTHER protein class: transporter. Members are annotated with the molecular function carboxylic acid transmembrane transporter activity, organic anion transmembrane transporter activity, organic acid transmembrane transporter activity. and participate in carboxylic acid transport, organic substance transport. and localise to cell periphery, membrane, plasma membrane.
