identifier: PANTHER:PTHR46267
label: "SINGLE MYB HISTONE 4"
definition: >-
  This entry includes single myb histone 1-6 (SMH1-6) from maize and telomere repeat-binding factor 1-5 (TRB1-5) from Arabidopsis. They are a group of proteins that bind telomere DNA repeats. This entry also includes uncharacterised proteins from fungi.
