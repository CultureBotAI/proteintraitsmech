identifier: PANTHER:PTHR21641
label: "TRANSLATION INITIATION FACTOR-RELATED"
definition: >-
  EIF1AD (also known as haponin) is a probable RNA-binding protein that plays a role in the cellular response to oxidative stress and interacts with glyceraldehyde 3-phosphate dehydrogenase (GAPDH). EIF1AD contains an S1-like domain, and nuclear localization signals.
