identifier: PANTHER:PTHR28159
label: "TRAFFICKING PROTEIN PARTICLE COMPLEX II-SPECIFIC SUBUNIT 65"
definition: >-
  Trs65 is a specific subunit of the TRAPP II complex, a highly conserved vesicle tethering complex that functions in the late Golgi as a guanine nucleotide exchanger (GEF) for the Golgi YPT1 GTPase. TRAPP subunits are found in three forms-core TRAPP/TRAPPI, TRAPPII, and TRAPPIII and they function in various vesicle trafficking pathways. TRAPPI mediates transport from endoplasmic reticulum to cis-Golgi by tethering COPII (coat protein complex II)-coated vesicles; TRAPPII interacts with COPI-coated vesicles in mammalian cells and aids in endosome-to-Golgi transport and TRAPPIII plays a unique role in autophagy. A distinct feature of the TRAPP complexes is they act as GEFs and play an essential role in catalysing nucleotide exchange for Ypt/Rab GTPase. The three complexes share a core of six different proteins (Bet3, Bet5, Trs20, Trs23, Trs31, and Trs33) that make up core TRAPPI. TRAPPII contains four additional proteins (Trs120, Trs130, Trs65, and Tca17), and TRAPPIII has one additional Trs85 in yeast.
definition_source: "InterPro:IPR024662 abstract (PANTHER PTHR28159 is a member signature)"
