identifier: PANTHER:PTHR12320
label: "PROTEIN PHOSPHATASE 2C"
definition: >-
  This entry includes Protein phosphatase PTC7 homologue fig from Drosophila, Protein phosphatase PTC7 homologue from human and related proteins. Human PTC7 is a protein phosphatase which positively regulates biosynthesis of the ubiquinone, coenzyme Q. It dephosphorylates the ubiquinone biosynthesis protein COQ7 which is likely to lead to its activation. The homologue from the fission yeast Schizosaccharomyces pombe is known as 5-azacytidine resistance protein azr1, because it suppresses sensitivity to the C5 DNA methyltransferase inhibitor 5-azacytidine.
