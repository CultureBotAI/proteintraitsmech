  - kind: GENERAL
    text: >-
      This family of proteins includes components of SCF (SKP1-cullin-F-box) E3 ubiquitin ligase complexes, which are involved in the ubiquitination and subsequent proteasomal degradation of target proteins. These proteins play a crucial role in various plant developmental processes, including the regulation of meristem identity, floral organ identity, and determinacy. They are also implicated in the control of cell proliferation in meristems, the regulation of the plastochron, and the enhancement of culm development and strength. Some family members are involved in the formation of vascular bundle systems, which facilitate carbohydrate translocation to panicles, and may be involved in the response to environmental stress such as ozone exposure.
    source: "InterPro:IPR050796 abstract (LLM-generated, not curator-reviewed)"
