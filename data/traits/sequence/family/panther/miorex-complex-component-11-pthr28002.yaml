identifier: PANTHER:PTHR28002
label: "MIOREX COMPLEX COMPONENT 11"
definition: >-
  MIOREX complex component 11 (MRX11) associates with mitochondrial ribosome. Its function is not clear. MIOREX complex is a large expressome-like assembly of ribosomes with factors involved in all the steps of post-transcriptional gene expression.
