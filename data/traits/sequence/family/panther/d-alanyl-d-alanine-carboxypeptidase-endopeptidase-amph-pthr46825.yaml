identifier: PANTHER:PTHR46825
label: "D-ALANYL-D-ALANINE-CARBOXYPEPTIDASE/ENDOPEPTIDASE AMPH"
definition: >-
  The protein family includes Beta-lactamase AmpC from Escherichia coli, D-aminopeptidase from Brucella abortus (Dap), Protein flp from Staphylococcus aureus and similar enzymes with diverse functions related to bacterial cell wall synthesis and modification, as well as antibiotic resistance. Members of the family are involved in the hydrolysis of D-amino acid-containing peptides, cleavage of Gly-Gly bonds in polyglycine linkers, and the liberation of D-alanyl moieties from teichoic acids. Some proteins within the family act as serine beta-lactamases, conferring resistance to cephalosporins by deactivating beta-lactam antibiotics. The family also includes proteins implicated in the biosynthesis of cyclic heptapeptides known as unguisins. These enzymes exhibit a range of regulatory mechanisms, including inhibition by beta-lactam compounds and other agents. Members of this family are found in bacteria and some fungal species.
definition_source: "InterPro:IPR050491 abstract (PANTHER PTHR46825 is a member signature)"
