identifier: PANTHER:PTHR22932
label: "TELOMERASE-BINDING PROTEIN P23  HSP90 CO-CHAPERONE"
definition: >-
  This entry represent s a group of co-chaperone proteins, including p23 (also known as Sba1) from budding yeasts, Wos2 from fission yeasts, prostaglandin E synthase 3 from humans and Atp23-1/2 from Arabidopsis. p23 contains a folded domain and a long unstructured C-terminal tail. p23 and its homologues are co-chaperones of Hsp90 and may be part of the core chaperone cycle required for efficient client activation. It may also has Hsp90-independent functions such as the regulation of gene expression by modulating chromatin remodeling and ribosomal biogenesis.
