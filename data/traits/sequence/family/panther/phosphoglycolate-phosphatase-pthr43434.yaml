      PHOSPHOGLYCOLATE PHOSPHATASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43434. PANTHER protein class: phosphatase, hydrolase. Members are annotated with the molecular function phosphatase activity. Members participate in DNA repair, dephosphorylation.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
