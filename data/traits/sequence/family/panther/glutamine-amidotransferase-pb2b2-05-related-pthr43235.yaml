identifier: PANTHER:PTHR43235
label: "GLUTAMINE AMIDOTRANSFERASE PB2B2.05-RELATED"
definition: >-
  This entry includes gamma-glutamyl-gamma-aminobutyrate hydrolases and related proteins mostly from bacteria, archaea and plants, including PuuD from E. coli and Cj1417c from Campylobacter jejuni. They belong to the peptidase C26 family. PuuD is involved in the breakdown of putrescine via hydrolysis of the gamma-glutamyl linkage of gamma-glutamyl-gamma-aminobutyrate. Cj1417c catalyses the hydrolysis of CDP-L-glutamine to L-glutamate and cytidine diphosphoramidate and is involved in the biosynthesis of the O-methyl phosphoramidate (MeOPN) group found on the capsular polysaccharide (CPS) of C.jejuni.
definition_source: "InterPro:IPR044668 abstract (PANTHER PTHR43235 is a member signature)"
