identifier: PANTHER:PTHR11375
label: "ACIDIC LEUCINE-RICH NUCLEAR PHOSPHOPROTEIN 32"
definition: >-
  The ANP32 family members of phosphoproteins are composed of a N-terminal evolutionarily conserved leucine-rich repeat (LRR) domain and a C-terminal variable anionic region. They are multifunctional proteins involved in the regulation of many processes including tumor suppression, apoptosis, cell cycle progression or transcription. ANP32A is one of the components of the INHAT (INHibitor of AcetylTransferases) complex, which contains the histone chaperone TAF-I (template-activating factor-I), directly binds the core histones, and inhibits the acetylation of the core histones H3 and H4. ANP32B has been shown to interact with the core histones H3-H4 through its acidic concave domain. ANP32E is an H2A.Z chaperone able specifically to remove H2A.Z from the nucleosome. It has been shown that ANP32A is an essential host partner coopted to support influenza virus vRNP polymerase activity and contributes to the influenza virus host range. Moreover, ANP32A and ANP32B have been shown to cooperate with CRM1 to support HIV-1 RNA nuclear export.
definition_source: "InterPro:IPR045081 abstract (PANTHER PTHR11375 is a member signature)"
