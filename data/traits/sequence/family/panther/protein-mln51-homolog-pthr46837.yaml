identifier: PANTHER:PTHR46837
label: "PROTEIN MLN51 HOMOLOG"
definition: >-
  The exon-junction complex (EJC) is involved in post-transcriptional regulation of mRNA. The core of EJC consists of Y14, Magoh, MLN51 and eIF4AIII, a DEAD-box RNA helicase. EJC marks the position of the exon-exon junction in the mature mRNA for the gene expression machinery, and its core components remain bound to spliced mRNAs throughout all stages of mRNA metabolism. Human MLN51 has been shown to stimulate the ATPase activity of eIF4AIII. This entry represents the plant MLN51 homologues. Similar to animal MLN51, Arabidopsis MLN51 is also a core component of the plant EJC.
definition_source: "InterPro:IPR044796 abstract (PANTHER PTHR46837 is a member signature)"
