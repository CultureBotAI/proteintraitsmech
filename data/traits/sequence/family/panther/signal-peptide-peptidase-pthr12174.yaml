identifier: PANTHER:PTHR12174
label: "SIGNAL PEPTIDE PEPTIDASE"
definition: >-
  This group of sequences contain aspartic endopeptidases that belong to MEROPS peptidase family A22 (presenilin family), subfamily A22B. These are intramembrane cleaving proteases (I-CLiPs). They are also known as signal peptide peptidases (SPPs). SPP cleaves remnant signal peptides left behind in the membrane by the action of signal peptidase and also plays key roles in immune surveillance and the maturation of certain viral proteins. The tertiary structure of a homologue from the archaean Methanoculleus marisnigri has been solved and shows a unique fold which includes nine transmembrane segments that form a horseshoe shape. SPPs do not require cofactors as demonstrated by expression in bacteria and purification of a proteolytically active form. The C-terminal region defines the functional domain, which is in itself sufficient for proteolytic activity. Aspartic peptidases, also known as aspartyl proteases ([ec:3.4.23.-]), are widely distributed proteolytic enzymes known to exist in vertebrates, fungi, plants, protozoa, bacteria, archaea, retroviruses and some plant viruses. All known aspartic peptidases are endopeptidases. A water molecule, activated by two aspartic acid residues, acts as the nucleophile in catalysis. Aspartic peptidases can be grouped into five clans, each of which shows a unique structural fold. Peptidases in clan AA are either bilobed (family A1 or the pepsin family) or are a homodimer (all other families in the clan, including retropepsin from HIV-1/AIDS). Each lobe consists of a single domain with a closed β-barrel and each lobe contributes one Asp to form the active site. Most peptidases in the clan are inhibited by the naturally occurring small-molecule inhibitor pepstatin. Clan AC contains the single family A8: the signal peptidase 2 family. Mem
