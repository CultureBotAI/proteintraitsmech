identifier: PANTHER:PTHR14237
label: "MOLYBDOPTERIN COFACTOR SULFURASE  MOSC"
definition: >-
  MOLYBDOPTERIN COFACTOR SULFURASE MOSC — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14237. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function transition metal ion binding, oxidoreductase activity. Subfamilies participate in oxoacid metabolic process. Subfamilies localise to mitochondrion, mitochondrial inner membrane, mitochondrial envelope.
