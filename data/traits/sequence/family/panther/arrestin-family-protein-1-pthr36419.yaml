    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in cytokinesis, the process of cell division that results in the separation of a cell into two daughter cells. Members of this family play roles in signaling pathways that regulate cell wall synthesis and actin assembly during this critical phase of the cell cycle. Some proteins in this family function as cofactors that ensure the proper localization of guanine nucleotide exchange factors (GEFs) for key regulatory GTPases, such as RHO1, to specific cellular sites. These GTPases, in turn, activate various effectors necessary for the maintenance of cell wall integrity and successful cytokinesis.
    source: "InterPro:IPR053060 abstract (LLM-generated, not curator-reviewed)"
