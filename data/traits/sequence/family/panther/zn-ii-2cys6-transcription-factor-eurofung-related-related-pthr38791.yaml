identifier: PANTHER:PTHR38791
label: "ZN(II)2CYS6 TRANSCRIPTION FACTOR (EUROFUNG)-RELATED-RELATED"
definition: >-
  This family of proteins includes transcription factors that are involved in the regulation of gene clusters responsible for the biosynthesis of certain antibiotics. Members of this family are known to specifically enhance the expression of genes related to the production of the antibiotic 2,4-dihydroxy-3-methyl-6-(2-oxopropyl)benzaldehyde (DHMBA) and its derivatives. One of the key genes positively regulated by these transcription factors encodes a FAD-dependent oxidoreductase enzyme, which plays a crucial role in the biosynthetic pathway of DHMBA.
