identifier: PANTHER:PTHR23414
label: "ADRENOMEDULLIN, ADM"
definition: >-
  This family of proteins includes regulatory peptides with a role in cardiovascular and gastrointestinal bioactivity modulation. Members of this family are known to be potent hypotensive and vasodilatory agents, with some acting as hormones in circulation control. They are involved in the physiological control of fluid and electrolyte homeostasis, with functions including diuretic and natriuretic effects, inhibition of aldosterone secretion, and suppression of basal ACTH secretion. Their actions are mediated through receptor complexes, particularly involving CALCRL and RAMPs, and they activate the cAMP-dependent pathway. Some family members may have non-functional remnants or exhibit both peripheral vasodepressor and central vasopressor effects.
