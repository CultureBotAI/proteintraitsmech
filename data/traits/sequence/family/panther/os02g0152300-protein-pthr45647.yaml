identifier: PANTHER:PTHR45647
label: "OS02G0152300 PROTEIN"
definition: >-
  The U-box domain-containing protein family is characterized by its members' role as E3 ubiquitin ligases. These proteins are involved in the ubiquitination process, which tags substrates for degradation by the proteasome, thus regulating protein turnover. Some family members are known to participate in signaling pathways related to stress responses, such as the abscisic acid signaling pathway, which is important for drought stress tolerance in plants. Although many members are predicted to belong to the protein kinase superfamily and the Ser/Thr protein kinase family, several have a protein kinase domain that is predicted to be catalytically inactive, suggesting a divergent evolution where the ubiquitin ligase function has been conserved while kinase activity has been lost. This indicates a specialized function in ubiquitin-mediated proteolysis rather than phosphorylation.
