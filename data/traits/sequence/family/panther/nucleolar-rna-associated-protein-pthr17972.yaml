identifier: PANTHER:PTHR17972
label: "NUCLEOLAR RNA-ASSOCIATED PROTEIN"
definition: >-
  This entry includes NOL6 (or Nrap) from animals and Upt22 from yeasts. Upt22 is a component of the small-subunit processome. It plays a role in channelling aminoacyl-tRNA to the nuclear tRNA export receptor exportin-t.
