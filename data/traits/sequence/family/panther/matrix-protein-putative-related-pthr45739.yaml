      MATRIX PROTEIN, PUTATIVE-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45739. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 10 of its annotated subfamilies. Subfamilies participate in anatomical structure morphogenesis, anatomical structure development. Subfamilies localise to extracellular matrix, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The FRAS1 family proteins are extracellular matrix proteins that play crucial roles in tissue integrity, cell adhesion, and embryonic development. They are involved in the maintenance of the skin and renal epithelia, epidermal differentiation, and adhesion. These proteins are essential for the proper development of eyelids, anterior segment of the eyeballs, and brain organization. They also contribute to the regulation of epidermal-basement membrane adhesion, which is vital for organogenesis. The Calx-beta domains within these proteins bind calcium with high affinity, which induces a significant conformational change, suggesting a role in calcium-mediated signaling or structural stability. Some family members are implicated in cell proliferation, migration, and microvascular morphogenesis, potentially affecting processes like neurite outgrowth, collagen degradation, and plasminogen activation.
    source: "InterPro:IPR051561 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
