identifier: PANTHER:PTHR22780
label: "ADAPTIN, ALPHA/GAMMA/EPSILON"
definition: >-
  The adaptor complexes large subunit family is involved in the selection and concentration of membrane proteins for transport via vesicles in various membrane traffic pathways. These proteins are components of adaptor protein complexes that link clathrin to receptors in coated vesicles, playing a crucial role in clathrin-dependent endocytosis and protein sorting at the trans-Golgi network and early endosomes. They mediate the recruitment of clathrin to membranes and recognize sorting signals within the cytosolic tails of transmembrane cargo molecules. Some family members are also involved in maintaining post-endocytic trafficking through non-clathrin pathways and may participate in the maturation of certain viruses. They bind to polyphosphoinositide-containing lipids, which positions the complexes on the membrane, and they may recognize various endocytosis signal motifs and sorting signals for proper cargo selection.
