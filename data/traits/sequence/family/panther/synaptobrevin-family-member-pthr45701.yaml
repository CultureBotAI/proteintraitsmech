identifier: PANTHER:PTHR45701
label: "SYNAPTOBREVIN FAMILY MEMBER"
definition: >-
  This entry includes vesicle-associated membrane proteins VAMP1/synaptobrevin-1, VAMP2/synaptobrevin-2, VAMP3/synaptobrevin-3 and VAMP8/endobrevin. VAMPs are a group of small, integral membrane proteins of synaptic vesicles that is mostly involved in vesicle fusion. The heterotrimeric SNARE complex is formed by syntaxin 1, synaptosomal-associated protein 25kDa (SNAP25), and vesicle-associated membrane protein (VAMP)/synaptobrevin. VAMP1 plays an essential, non-redundant role in Ca2+-triggered vesicle exocytosis at the mouse neuromuscular junction. VAMP2 is extensively expressed in the central nervous system. Neurotransmitter release involves the assembly of a heterotrimeric SNARE complex composed of SNAP25, VAMP2 and syntaxin 1. VAMP8 may be involved in regulated exocytosis of the exocrine system.
