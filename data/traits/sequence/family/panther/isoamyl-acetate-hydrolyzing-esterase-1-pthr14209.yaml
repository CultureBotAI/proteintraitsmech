identifier: PANTHER:PTHR14209
label: "ISOAMYL ACETATE-HYDROLYZING ESTERASE 1"
definition: >-
  This entry includes isoamyl acetate-hydrolyzing esterase Iah1 and related proteins. Iah1 hydrolyses short chain esters from acetate (C2) to hexanoate (C6), showing more specificity for shorter chain esters. There is no activity for decanoate (C10) esters.
