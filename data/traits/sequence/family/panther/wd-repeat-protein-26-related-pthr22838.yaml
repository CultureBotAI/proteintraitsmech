  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes including signal transduction, proteasomal degradation, cell growth and migration, and response to stress. Members act as scaffolding proteins, coordinating the activity of multiple signaling pathways such as MAPK, Wnt, and PI3K/AKT. They are implicated in the regulation of ubiquitination, playing roles in both the promotion and inhibition of this process. Some family members are involved in the cellular response to glucose availability, oxidative stress, and hypoxia, with functions ranging from the degradation of gluconeogenic enzymes to the protection against apoptosis and the promotion of autophagy and mitophagy.
