identifier: PANTHER:PTHR43359
label: "FORMATE HYDROGENLYASE SUBUNIT 4"
definition: >-
  The Complex I Subunit 1 family is involved in the electron transport chain, a crucial step in cellular respiration. Members of this family are typically part of larger enzyme complexes such as NADH-ubiquinone oxidoreductase (Complex I) and formate hydrogenlyase, which are responsible for the transfer of electrons from donors like NADH to acceptors like ubiquinone. This process is fundamental for the generation of a proton gradient across the membrane, ultimately leading to ATP synthesis. Some members may also play a role in hydrogenase complexes, contributing to energy conservation in microorganisms through the oxidation of hydrogen gas.
