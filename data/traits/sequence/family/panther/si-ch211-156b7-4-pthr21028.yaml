identifier: PANTHER:PTHR21028
label: "SI:CH211-156B7.4"
definition: >-
  These sequences are functionally identified as members of the adenylate cyclase family EC:4.6.1.1, which catalyses the conversion of ATP to 3',5'-cyclic AMP and pyrophosphate. The protein CyaB from Aeromonas hydrophila is a second adenylyl cyclase from that species, as demonstrated by complementation in Escherichia coli and by assay of the enzymatic properties of purified recombinant protein. It has no detectable homology to any other protein of known function, and has several unusual properties, including an optimal temperature of 65 degrees and an optimal pH of 9.5. A cluster of uncharacterised archaeal homologues may be orthologous and serve (under certain circumstances) to produce the regulatory metabolite cyclic AMP (cAMP).
