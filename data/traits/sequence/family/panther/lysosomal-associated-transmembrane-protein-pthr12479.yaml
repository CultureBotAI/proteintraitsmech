  - kind: GENERAL
    text: >-
      LYSOSOMAL-ASSOCIATED TRANSMEMBRANE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12479. PANTHER protein class: transporter. and localise to cytoplasm, bounding membrane of organelle, lytic vacuole membrane.
