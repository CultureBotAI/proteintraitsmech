  - kind: GENERAL
    text: >-
      LYSOSOMAL-ASSOCIATED TRANSMEMBRANE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12479. PANTHER protein class: transporter. Members localise to lysosomal membrane, intracellular organelle, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in intracellular transport processes, particularly associated with lysosomal and endosomal membrane compartments. Members of this family may function in the translocation of nucleosides, nucleoside derivatives, and other essential amino acids across intracellular membranes. Some proteins within this family are implicated in the regulation of lysosomal function, including the sorting and degradation of epidermal growth factor receptor (EGFR), and the activation of mTORC1 signaling via the recruitment of specific solute carriers to the lysosome. Additionally, certain members bind to ceramide, facilitating its movement out of the late endosome, which may influence cell death pathways. Others may have roles in embryogenesis and hematopoietic cells, or act as negative regulators of transforming growth factor beta 1 (TGFB1) in regulatory T cells.
    source: "InterPro:IPR051115 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
