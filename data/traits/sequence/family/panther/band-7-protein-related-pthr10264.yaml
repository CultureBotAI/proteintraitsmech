identifier: PANTHER:PTHR10264
label: "BAND 7 PROTEIN-RELATED"
definition: >-
  This entry represents the stomatins and stomatin-like proteins, including podicin, from a wide range of eukaryotes, bacteria, archaea and viruses. It excludes the HflK and HflC proteins, prohibitins and flotillins. Stomatin, also known as human erythrocyte membrane protein band 7.2b, was first identified in the band 7 region of human erythrocyte membrane proteins. It is an oligomeric, monotopic membrane protein associated with cholesterol-rich membranes/lipid rafts. Human stomatin is ubiquitously expressed in all tissues; highly in hematopoietic cells, relatively low in brain. It is associated with the plasma membrane and cytoplasmic vesicles of fibroblasts, epithelial and endothelial cells. Stomatin is believed to be involved in regulating monovalent cation transport through lipid membranes. Absence of the protein in hereditary stomatocytosis is believed to be the reason for the leakage of Na + and K + ions into and from erythrocytes. Stomatin is also expressed in mechanosensory neurons, where it may interact directly with transduction components, including cation channels. Stomatin proteins have been identified in various organisms, including Caenorhabditis elegans. There are nine stomatin-like proteins in C. elegans, MEC-2 being the one best characterised. In mammals, other stomatin family members are stomatin-like proteins SLP1, SLP2 and SLP3, and NPHS2 (podocin), which display selective expression patterns. Stomatin family members are oligomeric, they mostly localise to membrane domains, and in many cases have been shown to modulate ion channel activity. The stomatins and prohibitins, and to a lesser extent flotillins, are highly conserved protein families and are found in a variety of organisms ranging from prokaryotes to higher eukaryotes, whereas HflK and HflC h
