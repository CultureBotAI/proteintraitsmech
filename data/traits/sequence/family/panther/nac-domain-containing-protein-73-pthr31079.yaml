identifier: PANTHER:PTHR31079
label: "NAC DOMAIN-CONTAINING PROTEIN 73"
definition: >-
  This entry represents a group of plant NAC domain-containing proteins, including SOG1 (At1g25580) and NAC10/73/75 from Arabidopsis. They are a group of transcription activators that function in genomic stress response and plant development. SOG1 regulates the transcriptional activation response to gamma irradiation. NAC10 and NAC73 plays a regulatory role in the development of secondary cell wall fibres, while NAC75 is involved in xylem formation.
