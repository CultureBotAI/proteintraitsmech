  - kind: GENERAL
    text: >-
      The glycosyl hydrolase 32 family is involved in the hydrolysis and synthesis of fructans, which are fructose-based polymers found in plants. Members of this family function as enzymes that break down various types of fructans, including inulin-type beta-(2,1)-fructans and levan-type beta-(2,6)-linked fructans, into fructose units. Some enzymes within this family also exhibit transferase activity, contributing to fructan biosynthesis by catalyzing the production of fructan oligosaccharides from sucrose. These activities are essential for plant processes such as sucrose partitioning during seed development, stress response, and the mobilization of sucrose to sink organs. The family includes fructan exohydrolases, beta-fructofuranosidases, and fructosyltransferases, which are regulated by various factors, including sucrose inhibition.
    source: "InterPro:IPR050551 abstract (LLM-generated, not curator-reviewed)"
