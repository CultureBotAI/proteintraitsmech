identifier: PANTHER:PTHR11329
label: "LEUKOCYTE CELL-DERIVED CHEMOTAXIN 2"
definition: >-
  This family consists of several leukocyte cell-derived chemotaxin 2 (LECT2) proteins. LECT2 is a liver-specific protein which is thought to be linked to hepatocyte growth although the exact function of this protein is unknown. It contains an M23 metalloendopeptidase fold, but was found to be catalytically inactive as a metalloendopeptidase.
