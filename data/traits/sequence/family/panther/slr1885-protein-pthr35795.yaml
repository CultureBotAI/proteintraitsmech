  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with diverse catalytic activities. Members are involved in the initiation of mRNA decay, hydrolysis of diadenosine polyphosphates, and reversible adenylation of nicotinate mononucleotide. The endoribonucleases in this family initiate mRNA decay by cleaving mRNA molecules. Other members hydrolyze diadenosine polyphosphates, such as Ap4A, to yield ADP, with a preference for Ap4A. Some proteins also catalyze the adenylation of nicotinate mononucleotide to form nicotinic acid adenine dinucleotide. The family encompasses proteins with a preference for specific substrates and those with broader substrate specificity.
    source: "InterPro:IPR051094 abstract (LLM-generated, not curator-reviewed)"
