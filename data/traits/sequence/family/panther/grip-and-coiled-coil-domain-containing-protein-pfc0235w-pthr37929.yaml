  - kind: GENERAL
    text: >-
      This family of proteins includes components of ATP-dependent chromatin remodeling complexes, which are pivotal in both the activation and repression of gene expression. Members of this family are involved in modifying chromatin structure by altering DNA-histone contacts within nucleosomes. These changes can lead to shifts in nucleosome positioning, thereby modulating the accessibility of transcription factors to DNA and ultimately influencing gene expression. The family is characterized by the presence of GRIP and coiled-coil domains, which may suggest a role in protein-protein interactions and complex assembly.
