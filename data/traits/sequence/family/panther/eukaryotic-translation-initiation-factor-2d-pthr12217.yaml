identifier: PANTHER:PTHR12217
label: "EUKARYOTIC TRANSLATION INITIATION FACTOR 2D"
definition: >-
  Proteins in this entry contain at least an N-terminal PUA (PseudoUridine synthase and Archaeosine transglycosylase) domain and a C-terminal SUI1 domain. Proteins with this architecture include: Eukaryotic translation initiation factor 2D (EIF2D; formerly and erroneously known as ligatin): a factor that initiates translation by delivering tRNA to the P-site, where the initiating AUG codon binds, of the eukaryotic ribosome in a GTP-independent manner. EIF2D recruits aminoacylated initiator tRNA (Met-tRNA(Met)(i)) to 40S/mRNA complexes and promotes release of deacylated tRNA and mRNA from recycled 40S subunits after ABCE1-mediated dissociation of post-termination ribosomes. Translation machinery-associated protein 64 (Tma64) from the yeast Saccharomyces cerevisiae, which is uncharacterised but also interacts with the 40S ribosomal subunit.
definition_source: "InterPro:IPR039757 abstract (PANTHER PTHR12217 is a member signature)"
