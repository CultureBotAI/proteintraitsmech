identifier: PANTHER:PTHR43372
label: "FATTY-ACID AMIDE HYDROLASE"
definition: >-
  This family of proteins is involved in the metabolic regulation of endogenous fatty acid amides. Members of this family function as enzymes that catalyze the hydrolysis of fatty amides, including sleep-inducing and signaling lipids such as oleamide and anandamide, into their respective fatty acids. This hydrolytic activity modulates the signaling functions of these molecules, which play roles in various physiological processes. The enzymes show substrate specificity, with a preference for monounsaturated substrates over polyunsaturated ones. They are subject to inhibition by certain chemical compounds, which can affect their regulatory role in lipid signaling pathways.
