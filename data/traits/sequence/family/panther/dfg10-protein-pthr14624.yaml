identifier: PANTHER:PTHR14624
label: "DFG10 PROTEIN"
definition: >-
  This entry represents a group of polyprenal reductases, including SRD5A3 from humans, PPRD1 from Arabidopsis and Dfg10 from budding yeasts. SRD5A3 was initially characterised as a polyprenol reductase, mediating the conversion of polyprenol into dolichol. However, it was later shown to catalyse an intermediate step in this pathway and reduce polyprenal. Mutations in the SRD5A3 gene cause congenital disorder of glycosylation 1Q, a genetic disease with an extremely broad spectrum of clinical presentations due to defective glycosylation of glycoproteins and glycolipids. PPRD2 deficiency results in aberrant development of the male gametophyte and sporophyte. Homologues are known from animals, plants and fungi.
definition_source: "InterPro:IPR039698 abstract (PANTHER PTHR14624 is a member signature)"
