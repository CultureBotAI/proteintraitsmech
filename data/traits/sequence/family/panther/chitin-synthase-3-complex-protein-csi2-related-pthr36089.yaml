identifier: PANTHER:PTHR36089
label: "CHITIN SYNTHASE 3 COMPLEX PROTEIN CSI2-RELATED"
definition: >-
  This family of proteins is involved in cellular processes related to membrane function and regulation. Members of this family are typically associated with vacuolar membranes and may play roles in the regulation of pheromone responses, including Pheromone-regulated membrane protein 5 (PRM5) and related proteins. Members of this entry are characterised by similarities in their sequence that suggest a shared structural framework and possibly similar functional roles within the cell. The exact molecular functions and biological processes these proteins participate in could vary among family members and may include interactions with other proteins or complexes, involvement in signlling pathways, or contributing to the structural integrity of the vacuolar membrane.
