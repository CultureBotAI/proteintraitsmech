  - kind: GENERAL
    text: >-
      This family of proteins includes members that are putative oxidoreductases, suggesting a role in catalyzing redox reactions. These proteins are characterized by their membership in the short-chain dehydrogenases/reductases (SDR) family, which is known for its involvement in the metabolism of a wide variety of compounds, including steroids, prostaglandins, and xenobiotics. The SDR enzymes typically utilize NAD(P)(H) as cofactors and are involved in the reduction or oxidation of alcohols, ketones, and aldehydes. Given the broad substrate specificity and wide distribution of SDR family members, proteins in this family may be implicated in diverse biological processes and pathways.
