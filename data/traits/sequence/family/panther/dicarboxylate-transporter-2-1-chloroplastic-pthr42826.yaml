identifier: PANTHER:PTHR42826
label: "DICARBOXYLATE TRANSPORTER 2.1, CHLOROPLASTIC"
definition: >-
  CitT catalyses a homologous exchange of citrate or a heterologous exchange against succinate, fumarate, or tartrate. Since succinate is the end product of citrate fermentation in E. coli, it is likely that CitT functions in vivo as a citrate/succinate antiporter. CitT is related to other transporters that could constitute a novel family of eubacterial transporters involved in the transport of di- and tricarboxylic acids. Included in this group would be the L-tartrate/succinate antiporter TtdT (YgjE) from E. coli.
