  - kind: GENERAL
    text: >-
      The Peflin/Sorcin family comprises calcium-binding proteins that function as adapters, bridging unrelated proteins or stabilizing weak protein-protein complexes in response to calcium. Members of the family are involved in various cellular processes, including ER-Golgi vesicular transport, endosomal biogenesis, membrane repair, and apoptosis. They play roles in cellular signaling pathways, such as inhibiting angiogenesis by affecting the Akt signaling pathway. The family proteins contain EF-hand domains, with some members having high-affinity calcium-binding sites and others binding magnesium. The proteins interact with a variety of partners through hydrophobic pockets, which are exposed upon calcium binding, facilitating translocation to membranes and involvement in processes like collagen export and vesicle formation.
    source: "InterPro:IPR051426 abstract (LLM-generated, not curator-reviewed)"
