identifier: PANTHER:PTHR45862
label: "PROTEIN SGT1 HOMOLOG"
definition: >-
  This entry includes protein Sgt1 (Suppressor of G2 allele of SKP1) and its homologues. In budding yeasts, Sgt1 is required for both SCF (Skp1p/Cdc53p-Cullin-F-box)-mediated ubiquitination, cyclic AMP pathway activity and kinetochore function. Its Schizosaccharomyces pombe homologue, Git7, is required for glucose and cyclic AMP signaling, cell wall integrity, and septation. Its two homologues in Arabidopsis, SGT1a and SGT1b, can complement two yeast temperature-sensitive sgt1 mutant alleles, suggesting that fundamental cellular function(s) of yeast SGT1in SCF-mediated protein ubiquitylation. Moreover, SGT1a and SGT1b can act as cochaperones with HSP90 and HSC70 and function in regulating multiple resistance (R) genes and environmental responses.
definition_source: "InterPro:IPR044563 abstract (PANTHER PTHR45862 is a member signature)"
