identifier: PANTHER:PTHR14047
label: "P ANTIGEN FAMILY MEMBER 5-RELATED"
definition: >-
  This family consists of several GAGE, PAGE and XAGE proteins. These antigens have been implicated in human cancers. PAGE4 from humans is an intrinsically disordered protein. It has been shown to protect prostate cancer cells from DNA damage and apoptosis under oxidative stress by modulating MAPK signalling pathway.
