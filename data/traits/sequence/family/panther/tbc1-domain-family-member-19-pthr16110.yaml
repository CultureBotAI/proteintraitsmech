label: "TBC1 DOMAIN FAMILY MEMBER 19"
definition: >-
  TBC1 domain family member 19 (TBC1D19) contains the Tre-2/Bub2/Cdc16 (TBC) domain, a conserved protein motif that consists of approximately 200 amino acids and is thought to function as a specific Rab-GAP domain.
