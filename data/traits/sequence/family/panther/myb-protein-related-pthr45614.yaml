identifier: PANTHER:PTHR45614
label: "MYB PROTEIN-RELATED"
definition: >-
  The Myb family of transcription factors is characterised by their ability to bind specific DNA sequences and regulate gene expression across a variety of biological processes. Members of the Myb family are involved in the control of cell proliferation, differentiation, and development in both plants and animals. In plants, they play crucial roles in secondary cell wall biosynthesis, cell cycle regulation, auxin response, abiotic stress response, and reproductive development. In animals, they are key regulators of hematopoietic progenitor cell proliferation and differentiation, male meiosis, and germline integrity. Some members act as transcriptional activators, while others function as repressors. The family is also implicated in the regulation of metabolic pathways and response to environmental stimuli.
