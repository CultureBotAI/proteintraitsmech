identifier: PANTHER:PTHR43378
label: "UDP-3-O-ACYLGLUCOSAMINE N-ACYLTRANSFERASE"
definition: >-
  This entry represents LpxD, an enzyme for the biosynthesis of lipid A, a component oflipopolysaccharide (LPS) in the outer membrane outer leaflet of most Gram-negative bacteria. Some differences are found between lipid A of different species. This protein represents the third step from UDP-N-acetyl-D-glucosamine. The group added at this step generally is 14:0(3-OH) (myristate) but may vary; in Aquifex it appears to be 16:0(3-OH) (palmitate). Lipid A-like molecules in plants may serve as structural components of the outer membranes of mitochondria and/or chloroplasts, or may be involved in signal transduction or plant defense responses.
definition_source: "InterPro:IPR007691 abstract (PANTHER PTHR43378 is a member signature)"
