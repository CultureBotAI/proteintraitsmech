identifier: PANTHER:PTHR23058
label: "PEROXISOMAL MEMBRANE PROTEIN PEX14"
definition: >-
  Peroxisomal membrane protein PEX14, or peroxin-14, is a core component of the peroxisomal translocation machinery or importomer. PEX14 is involved in the docking of PEX5-bound protein onto the peroxisomal membrane, and it may be involved in the translocation step into the peroxisome matrix. In addition to its role in protein docking, a role in transcriptional regulation has also been suggested for PEX14. This entry also includes Peroxisomal membrane protein PEX33 (also known as Pex14/17), a component of the PEX13-PEX14 docking complex. The PEX13-PEX14 docking complex forms a large import pore which can be opened to a diameter of about 9 nm. Mechanistically, PEX5 receptor along with cargo proteins associates with the PEX14 subunit of the PEX13-PEX14 docking complex in the cytosol, leading to the insertion of the receptor into the organelle membrane with the concomitant translocation of the cargo into the peroxisome matrix.
definition_source: "InterPro:IPR025655 abstract (PANTHER PTHR23058 is a member signature)"
