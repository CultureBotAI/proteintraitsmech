identifier: PANTHER:PTHR48017
label: "OS05G0424000 PROTEIN-RELATED"
definition: >-
  OS05G0424000 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48017. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 170 of its annotated subfamilies. Subfamilies are annotated with the molecular function amino acid transmembrane transporter activity, carboxylic acid transmembrane transporter activity. Subfamilies participate in carboxylic acid transmembrane transport, amino acid transmembrane transport, nitrogen compound transport. Subfamilies localise to membrane.
