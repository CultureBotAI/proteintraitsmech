identifier: PANTHER:PTHR48017
label: "OS05G0424000 PROTEIN-RELATED"
definition: >-
  OS05G0424000 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48017. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 170 of its annotated subfamilies. Subfamilies are annotated with the molecular function transporter activity, organic acid transmembrane transporter activity, organic anion transmembrane transporter activity. Subfamilies participate in amino acid transmembrane transport, transport, amino acid transport. Subfamilies localise to membrane, cellular anatomical entity.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
