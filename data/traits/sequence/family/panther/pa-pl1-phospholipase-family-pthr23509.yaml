identifier: PANTHER:PTHR23509
label: "PA-PL1 PHOSPHOLIPASE FAMILY"
definition: >-
  This entry includes PA-PLA1 proteins, including SEC23-interacting protein (Sec23ip), Triacylglycerol hydrolase DDHD2 (DDHD2) and Phospholipase DDHD1, which are PA-PLA1 proteins in mammals. This entry also includes the homologue in Saccharomyces cerevisiae and putative homologues in Schizosaccharomyces pombe, Caenorhabditis elegans and Arabidopsis thaliana. Phospholipase SGR2 from Arabidopsis thaliana has been identified as a member of the PA-PLA1 family, but their functions are not limited to phospholipase activity. It is involved in vacuolar formation or function (e.g. formation of vacuolar membrane 'bulbs'). It is also required for amyloplast sedimentation in the endodermis during shoot gravitropism, which are thus acting as statoliths. It is particularly important for the negative gravitropism leading to leaf movement observed in darkness. Sec23ip plays a role in the organisation of endoplasmic reticulum exit sites. Specifically binds to phosphatidylinositol 3-phosphate (PI3P), phosphatidylinositol 4-phosphate (PI4P) and phosphatidylinositol 5-phosphate (PI5P). However, current evidence indicates that it does not exhibit actual phospholipase activity. DDHD2 functions as a diacylglycerol (DAG) and triacylglycerol (TAG) lipase, playing a critical role in maintaining lipid homeostasis in the central nervous system. It acts in concert with PNPLA2/ATGL in neuronal TAG catabolism by hydrolysing sn-1,3 DAG downstream of PNPLA2/ATGL. In vitro studies show that DDH2 also exhibits phospholipase activity, preferentially hydrolysing phosphatidic acids such as 1,2-dioleoyl-sn-phosphatidic acid, as well as phosphatidylcholine and phosphatidylethanolamine. Additionally, it specifically binds to phosphoinositides, including phosphatidylinositol 3-phosphate (PI3P), PI4P, PI5P, and po
