identifier: PANTHER:PTHR11274
label: "RAD25/XP-B DNA REPAIR HELICASE"
definition: >-
  This family of proteins includes ATP-dependent DNA helicases that are involved in various cellular processes such as transcription, nucleotide excision repair (NER), and postreplicative transcription termination. Members of this family are capable of unwinding DNA in a 3'-5' direction and are essential for DNA repair by opening DNA around lesions. They also play a crucial role in transcription initiation by RNA polymerase II, facilitating promoter opening and escape. Some proteins within this family form stable complexes with single-stranded DNA and, to a lesser extent, RNA, and are implicated in the ATP-dependent release of nascent RNA transcripts.
