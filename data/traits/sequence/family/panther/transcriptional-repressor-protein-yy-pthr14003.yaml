identifier: PANTHER:PTHR14003
label: "TRANSCRIPTIONAL REPRESSOR PROTEIN YY"
definition: >-
  TRANSCRIPTIONAL REPRESSOR PROTEIN YY — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14003. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to non-membrane-bounded organelle, PcG protein complex, protein-containing complex.
