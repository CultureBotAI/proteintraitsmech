identifier: PANTHER:PTHR12270
label: GLYCOSYLTRANSFERASE-RELATED
definition: >-
  The protein family is characterized by bifunctional glycosyltransferase activities, specifically alpha-1,3-xylosyltransferase and beta-1,3-glucuronyltransferase. These enzymes are involved in the post-translational modification of alpha-dystroglycan (DAG1), a process crucial for its ability to bind laminin G-like domain-containing extracellular proteins with high affinity. The glycosylation is dependent on the phosphorylation of a core O-mannosyl trisaccharide. The family plays a significant role in the maturation of DAG1, enhancing its function in skeletal muscle and potentially in cell adhesion. Members of the family can also modify proteoglycans with glycosaminoglycan-like polysaccharides, composed of xylose and glucuronic acid, which is important for laminin binding and may impact cell adhesion and development.
