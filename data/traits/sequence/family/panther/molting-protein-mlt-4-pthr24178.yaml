identifier: PANTHER:PTHR24178
label: "MOLTING PROTEIN MLT-4"
definition: >-
  MOLTING PROTEIN MLT-4 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24178. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies participate in protein localization to cilium, cellular localization, cellular macromolecule localization. Subfamilies localise to cilium.
