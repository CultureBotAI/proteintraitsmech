identifier: PANTHER:PTHR36687
label: "GLUTAMATE RECEPTOR IONOTROPIC, DELTA-2-RELATED"
definition: >-
  Glutamate delta-1 (GluD1) and delta-2 (GluD2) constitute the delta subfamily of ionotropic glutamate receptors. They have a crucial role in synapse formation by interacting with presynaptic proteins such as Neurexin-1. GluD1 is expressed diffusively throughout the forebrain and cerebellum during early development and adulthood, with high levels in the hippocampus, whereas GluD2 is predominantly expressed in the Purkinje cells of the cerebellum. It has been shown that delta receptors (GluD1, GluD2) might play a role in the underlying pathophysiology of autism and schizophrenia. This entry represents the ionotropic glutamate receptors delta 1 and delta 2.
