identifier: PANTHER:PTHR46892
label: "VISUAL SYSTEM HOMEOBOX 2"
definition: >-
  The Visual system homeobox family comprises transcriptional regulators involved in the development and differentiation of various neuronal cell types and eye structures. Family members mediate the differentiation of V2a interneurons and play roles in eye development, including the specification and morphogenesis of the sensory retina, and the organization of the neuroretina. They regulate gene expression by binding to DNA consensus sequences, competitively inhibiting motor neuron gene transcription, and modulating the expression of genes involved in retinal development. These proteins are also implicated in the maintenance of neural retina identity and the regulation of canonical Wnt signaling. They participate in the development of retinal ganglion cells, promoting Hedgehog signaling and proliferation of retinal progenitor cells, and influence the differentiation of bipolar cells and rod cells within the inner nuclear layer.
