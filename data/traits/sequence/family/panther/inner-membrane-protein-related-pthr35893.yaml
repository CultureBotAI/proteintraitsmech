identifier: PANTHER:PTHR35893
label: "INNER MEMBRANE PROTEIN-RELATED"
definition: >-
  This family consists of several bacterial proteins and includes the Escherichia coli genes for ElaB, YgaM and YqjD. YqjD is an inner membrane and ribosome binding protein expressed during the stationary growth phase. It is possible that YqjD inactivates ribosomes by localizing a part of the ribosome to the membrane during the stationary phase. Its expression is regulated by stress response sigma factor RpoS. The two paralogues of YqjD, ElaB and YgaM, are expressed and bind to ribosomes in a similar manner to YqjD. These proteins may have important cellular roles during the stress response. ElaB has been shown to protect cells against oxidative and heat shock stress.
