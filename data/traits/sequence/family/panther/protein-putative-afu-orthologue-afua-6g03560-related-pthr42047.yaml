identifier: PANTHER:PTHR42047
label: "PROTEIN, PUTATIVE (AFU_ORTHOLOGUE AFUA_6G03560)-RELATED"
definition: >-
  This family of proteins is involved in the development of asexual reproductive structures in fungi, specifically in the formation of phialides and conidia, which are essential for spore production. Members of this family also serve as a general stress protectant for the fungus, particularly in competitive interactions with antagonistic bacteria.
