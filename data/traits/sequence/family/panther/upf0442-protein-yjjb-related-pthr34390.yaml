identifier: PANTHER:PTHR34390
label: "UPF0442 PROTEIN YJJB-RELATED"
definition: >-
  The ThrE exporter family is involved in the transport of various substrates across the cell membrane. Members of this family function as transporters for dicarboxylates such as succinate, fumarate, and malate, as well as for amino acids like threonine and serine. These transporters are essential for the export of these metabolites, which plays a significant role in metabolic processes under both aerobic and anaerobic conditions. The activity of some family members is known to be dependent on the proton motive force and can be inhibited by specific ionophores. The coordinated action of certain subunits, such as YjjP and YjjB, is required for the efficient export of succinate, suggesting a complex interaction within the family to fulfill their function.
