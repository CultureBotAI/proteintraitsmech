identifier: PANTHER:PTHR16099
label: "8-OXO-DGTP DIPHOSPHATES NUDT15"
definition: >-
  8-OXO-DGTP DIPHOSPHATES NUDT15 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16099. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, pyrophosphatase activity, hydrolase activity. Subfamilies participate in nucleobase-containing compound metabolic process, purine nucleotide metabolic process, purine nucleotide catabolic process. Subfamilies localise to intracellular anatomical structure, cytoplasm, cytosol.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
