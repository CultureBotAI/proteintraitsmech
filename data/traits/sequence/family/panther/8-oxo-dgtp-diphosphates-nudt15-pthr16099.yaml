identifier: PANTHER:PTHR16099
label: "8-OXO-DGTP DIPHOSPHATES NUDT15"
definition: >-
  8-OXO-DGTP DIPHOSPHATES NUDT15 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16099. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function pyrophosphatase activity. Subfamilies participate in purine nucleotide catabolic process, nucleoside triphosphate catabolic process, purine nucleoside triphosphate metabolic process. Subfamilies localise to intracellular anatomical structure, cytoplasm, cytosol.
