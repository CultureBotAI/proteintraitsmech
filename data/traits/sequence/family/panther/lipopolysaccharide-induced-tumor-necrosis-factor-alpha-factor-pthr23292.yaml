identifier: PANTHER:PTHR23292
label: "LIPOPOLYSACCHARIDE-INDUCED TUMOR NECROSIS FACTOR-ALPHA FACTOR"
definition: >-
  LITAF (LPS-induced TNF-activating factor) (also known as SIMPLE; small integral membrane protein of the late endosome) is an endosome-associated integral membrane protein important for multivesicular body (MVB) sorting. It is a monotypic membrane protein with both termini exposed to the cytoplasm and is anchored to membranes via an in-plane helical membrane anchor, present within the highly conserved C-terminal region known as the 'LITAF domain' or 'SIMPLE-like domain'. The LITAF domain consists of conserved cysteines separated by a 22 residue hydrophobic region. LITAF domains are found throughout the eukaryotes, suggesting ancient conserved functions, with multiple instances of expansion, especially in the metazoa. Proteins containing the LITAF domain include: Vertebrate lipopolysaccharide-induced tumor necrosis factor-alpha factor (LITAF). In human, several mutations in LITAF cause the autosomal dominant inherited peripheral neuropathy, Charcot-Marie-Tooth disease type 1 (CMT1). These mutations map to the LITAF domain. Eukaryotic cell death-inducing p53-target protein 1 (CDIP1). Arabidopsis thaliana GSH-induced LITAF domain protein (GILP), acts as a membrane anchor, bringing other regulators of programmed cell death (PCD) to the plasma membrane.
definition_source: "InterPro:IPR037519 abstract (PANTHER PTHR23292 is a member signature)"
