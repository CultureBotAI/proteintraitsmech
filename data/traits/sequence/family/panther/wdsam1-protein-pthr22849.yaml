identifier: PANTHER:PTHR22849
label: "WDSAM1 PROTEIN"
definition: >-
  This entry represents a group of plant U-box domain-containing proteins, including PUB22/23/24 from Arabidopsis. PUB22/23/24 are E3 ubiquitin ligases that act as negative regulators of PAMP-triggered immunity (PTI). PUB22/PUB23 also coordinately control a drought signaling pathway by ubiquitinating cytosolic RPN12a.
