identifier: PANTHER:PTHR10670
label: "DNA POLYMERASE EPSILON CATALYTIC SUBUNIT A"
definition: >-
  DNA polymerase epsilon catalytic subunit (also known as POL2) is a catalytic subunit of DNA polymerase epsilon, which is a a high-fidelity polymerase participating in chromosomal DNA replication. It contains both polymerase and 3'-5'-exonuclease domains. Its 3'-5'-exonuclease domain ensures a particularly low error rate. POL2 also plays a role in DNA repair and is linked to cancer. Its structure has been solved.
