identifier: PANTHER:PTHR46555
label: "UBIQUITIN-LIKE PROTEIN 4A"
definition: >-
  This entry represents Ubiquitin-like protein 4A from humans (UBL4A) and similar proteins found in animals and fungi. UBL4A is part of a ubiquitin ligase-associated multiprotein complex that chaperones retrotranslocated polypeptides on its way to the proteasome to improve the efficiency of the endoplasmic reticulum-associated degradation (ERAD). The complex also functions as a sorting platform for proteins of the secretory pathway that are mislocalised to the cytosol either delivering them to the proteasome for degradation or to the endoplasmic reticulum. The homologue in Saccharomyces cerevisiae, Ubiquitin-like protein MDY2, is required for efficient mating.
definition_source: "InterPro:IPR047154 abstract (PANTHER PTHR46555 is a member signature)"
