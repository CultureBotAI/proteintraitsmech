  - kind: GENERAL
    text: >-
      PHOSPHOPANTETHEINE TRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12215. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function transferase activity, transferring phosphorus-containing groups, transferase activity, catalytic activity. and participate in organonitrogen compound biosynthetic process, organic acid biosynthetic process, aspartate family amino acid metabolic process. and localise to cytoplasm, cytosol.
