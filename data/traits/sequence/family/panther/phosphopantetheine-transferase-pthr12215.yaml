definitions:
  - kind: GENERAL
    text: >-
      PHOSPHOPANTETHEINE TRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12215. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function transferase activity, transferring phosphorus-containing groups. Members participate in lysine biosynthetic process. Members localise to cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The P-Pant transferase superfamily, specifically the AcpS and Gsp/Sfp/HetI/AcpT families, consists of enzymes that play a crucial role in the activation of carrier proteins involved in various biosynthetic pathways. These enzymes transfer the 4'-phosphopantetheine moiety from coenzyme A to a serine residue on acyl-carrier-proteins (ACPs) or peptidyl-carrier proteins (PCPs). This post-translational modification is essential for converting inactive apo-carrier proteins into their active holo-forms, enabling them to carry acyl groups for fatty acid synthesis, as well as for the production of polyketides, nonribosomal peptides, and other secondary metabolites. The modification is also necessary for the function of proteins involved in the synthesis of lysine and other metabolites, playing a significant role in growth, development, and the production of antibiotics and pigments. The family's enzymes are also implicated in virulence and are inhibited by various antifungal compounds.
    source: "InterPro:IPR050559 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
