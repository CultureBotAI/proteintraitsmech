  - kind: GENERAL
    text: >-
      The CPA2 transporter family includes proteins that function as cation/H(+) antiporters, exchanging monovalent cations such as Na(+) or K(+) against protons across cellular membranes. These antiporters play crucial roles in maintaining ion homeostasis, pH regulation, and osmoregulation in various organisms. Some family members are specifically involved in processes such as pollen tube guidance, stomatal opening, and chloroplast development. The antiporters exhibit substrate specificity, with certain members preferring potassium over sodium ions, and are essential for proper cellular function and response to environmental stresses.
