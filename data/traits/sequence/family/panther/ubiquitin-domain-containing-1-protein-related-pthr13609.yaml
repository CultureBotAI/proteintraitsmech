identifier: PANTHER:PTHR13609
label: "UBIQUITIN DOMAIN CONTAINING 1 PROTEIN-RELATED"
definition: >-
  This entry represents a group of ubiquitin domain-containing proteins, including UBTD1 and UBTD2. UBTD1 regulates cellular senescence through a positive feedback loop with TP53. UBTD1 and UBE2D (E2 ubiquitin conjugating enzyme) have been shown to form a stable, stoichiometric complex. UBTD2, also known as DC-UbP, interacts with deubiquitinating enzyme USP5 and the Ub-activating enzyme UbE1.
