identifier: PANTHER:PTHR47640
label: "TRNA SELENOCYSTEINE 1-ASSOCIATED PROTEIN 1-RELATED-RELATED"
definition: >-
  This entry represents a group of eukaryotic proteins involved in various aspects of RNA metabolism, including pre-mRNA processing, mRNA stabilization, and transport, including sequences belonging to the RNA binding protein 44 (RBM42) family and polyadenylate-binding RBP45/RBP47 families. Members of the RBM42 family, characterised by the RNA recognition motif (RRM), are known to bind to the 3'-UTR of specific mRNAs, such as CDKN1A, influencing their stability and regulation. The polyadenylate-binding RBP45 and RBP47 families are heterogeneous nuclear ribonucleoproteins (hnRNPs) that bind to the poly(A) tail of mRNA, suggesting a role in mRNA maturation and possibly in the regulation of mRNA stability and translation. These proteins are essential for proper gene expression regulation and are involved in cellular processes such as cell cycle control and response to stress.
definition_source: "InterPro:IPR050825 abstract (PANTHER PTHR47640 is a member signature)"
