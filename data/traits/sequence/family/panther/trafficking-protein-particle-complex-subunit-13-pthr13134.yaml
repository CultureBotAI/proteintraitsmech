identifier: PANTHER:PTHR13134
label: "TRAFFICKING PROTEIN PARTICLE COMPLEX SUBUNIT 13"
definition: >-
  Three transport protein particle (TRAPP) complexes exist in yeast (TRAPPI-TRAPPIII), which share a common core in addition to unique subunits. TRAPPI-TRAPPIII regulate endoplasmic reticulum (ER)-to-Golgi transport, intra-Golgi transport and autophagy, respectively. TRAPPC composition seems to be more complex in higher eukaryotes than in yeast, and its roles are less clear. Mammalian TRAPPC13 is involved in regulating autophagy and survival in response to small molecule compound-induced Golgi stress. The overall architecture of TRAPPC is not disrupted upon TRAPPC13 depletion. This is also the case for yeast TRAPP II Trs65 subunit, which was previously reported to be specific to yeast. However, Trs65 has been shown to have homology to TRAPPC13 and they are now thought to be orthologues. This entry consists of high eukaryotes TRAPPC13 and some related yeast proteins, but it does not include S. cerevisiae Trs65 (see InterPro:IPR024662).
definition_source: "InterPro:IPR010378 abstract (PANTHER PTHR13134 is a member signature)"
