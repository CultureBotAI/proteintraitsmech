  - kind: GENERAL
    text: >-
      This family of proteins includes RNA methyltransferases that are characterized by their similarity to the class I-like SAM-binding methyltransferase superfamily. Members of this family are involved in the methylation of the 5th carbon of uridine residues in RNA molecules, a modification that can affect the stability, structure, and function of various RNA species, including tRNA, rRNA, and mRNA. The enzymatic activity of these proteins typically involves the use of S-adenosylmethionine (SAM) as a methyl group donor to catalyze the transfer of a methyl group to the target uridine residue, thereby generating S-adenosylhomocysteine (SAH) as a byproduct.
    source: "InterPro:IPR053304 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
