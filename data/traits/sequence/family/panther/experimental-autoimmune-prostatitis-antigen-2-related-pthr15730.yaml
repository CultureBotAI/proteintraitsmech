  - kind: GENERAL
    text: >-
      EXPERIMENTAL AUTOIMMUNE PROSTATITIS ANTIGEN 2-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15730. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies are annotated with the molecular function transmembrane transporter binding. Subfamilies participate in regulation of transmembrane transporter activity, regulation of monoatomic ion transmembrane transport, positive regulation of establishment of protein localization. Subfamilies localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The TCAF family is involved in the regulation of the TRPM8 cation channel, with members either positively or negatively affecting the channel's activity. Positive regulators enhance TRPM8 activity, facilitate its recruitment to the cell surface, and inhibit prostate cancer cell migration in a TRPM8-dependent manner. Negative regulators, conversely, decrease TRPM8 activity and promote prostate cancer cell migration stimulation, also in a TRPM8-dependent fashion. The C-terminal region of these proteins is crucial for their role in channel activity stimulation. Additionally, some members of the family may play a role in the type II secretion system for the export of folded proteins across the outer membrane.
    source: "InterPro:IPR051244 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
