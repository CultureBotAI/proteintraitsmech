identifier: PANTHER:PTHR15730
label: "EXPERIMENTAL AUTOIMMUNE PROSTATITIS ANTIGEN 2-RELATED"
definition: >-
  EXPERIMENTAL AUTOIMMUNE PROSTATITIS ANTIGEN 2-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15730. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies are annotated with the molecular function transmembrane transporter binding. Subfamilies participate in regulation of transmembrane transporter activity, regulation of monoatomic ion transmembrane transport, positive regulation of establishment of protein localization. Subfamilies localise to plasma membrane, cell periphery.
