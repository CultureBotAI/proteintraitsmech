  - kind: GENERAL
    text: >-
      This family of proteins includes receptor-like kinases that are implicated in various cellular processes. Members of this family are characterized by the presence of leucine-rich repeat (LRR) domains, which suggest a role in protein-protein interactions, and kinase domains that indicate a function in phosphorylation signaling pathways. The kinases in this family are predominantly serine/threonine-specific, although one member is a tyrosine-specific kinase. These proteins are likely involved in the regulation of cell proliferation, growth, and development, particularly in vascular tissues. The diversity of the kinase domain specificity within this family points to a broad range of potential substrates and functions.
