  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with phospholipase and nuclease activities, which vary according to physiological conditions. They play a key role in mitochondrial dynamics, influencing both fusion and fission processes. The phospholipase activity involves the hydrolysis of cardiolipin to generate phosphatidic acid, a lipid signaling molecule that facilitates mitochondrial fusion. Conversely, its cleavage into diacylglycerol promotes mitochondrial fission. These proteins are also critical for the biogenesis of PIWI-interacting RNAs (piRNAs), which are essential for genome stability by silencing transposable elements, especially during spermatogenesis. The nuclease activity of these proteins produces intermediates for piRNA processing. Some members are implicated in virulence, and others are involved in cellular processes like growth, proliferation, and differentiation.
    source: "InterPro:IPR051406 abstract (LLM-generated, not curator-reviewed)"
