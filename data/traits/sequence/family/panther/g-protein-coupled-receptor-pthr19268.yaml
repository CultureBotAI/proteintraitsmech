  - kind: GENERAL
    text: >-
      G PROTEIN-COUPLED RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19268. PANTHER protein class: G-protein coupled receptor. Members are annotated with the molecular function signaling receptor activity, G protein-coupled receptor activity. and localise to cell periphery, cellular anatomical entity, membrane.
