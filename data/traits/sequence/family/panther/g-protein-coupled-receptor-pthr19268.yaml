    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes G-protein coupled receptors (GPCRs) with diverse functions. Some members are orphan receptors, which are GPCRs with unknown endogenous ligands, and are potential candidates for amine-like GPCR activity. Other members are known to function as receptors for the SMIM20-derived peptides Phoenixin-14 and Phoenixin-20. These peptides are involved in the modulation of gonadotropin-releasing hormone (GNRH) signaling in the hypothalamus and pituitary gland, which is crucial for reproductive function. Additionally, in the ovary, certain family members mediate the proliferative effects of Phoenixin-14 and Phoenixin-20 on granulosa cells during follicular growth, indicating a role in ovarian function and fertility.
    source: "InterPro:IPR051509 abstract (LLM-generated, not curator-reviewed)"
