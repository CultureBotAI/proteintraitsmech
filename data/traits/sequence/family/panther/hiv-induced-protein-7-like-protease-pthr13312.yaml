identifier: PANTHER:PTHR13312
label: "HIV-INDUCED PROTEIN-7-LIKE PROTEASE"
definition: >-
  HIV-INDUCED PROTEIN-7-LIKE PROTEASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13312. PANTHER protein class: cysteine protease, protein modifying enzyme. Members are annotated with the molecular function cysteine-type deubiquitinase activity. Members participate in ERAD pathway, endoplasmic reticulum unfolded protein response, protein deubiquitination. Members localise to nucleus, cytoplasm, cytosol.
