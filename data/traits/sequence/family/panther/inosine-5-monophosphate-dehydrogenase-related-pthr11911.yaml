identifier: PANTHER:PTHR11911
label: "INOSINE-5-MONOPHOSPHATE DEHYDROGENASE RELATED"
definition: >-
  This entry includes inosine-5'-monophosphate dehydrogenases and guanosine 5'-monophosphate (GMP) reductase. Inosine-5'-monophosphate dehydrogenase catalyses the conversion of inosine 5'-phosphate (IMP) to xanthosine 5'-phosphate (XMP), the first committed and rate-limiting step in the de novo synthesis of guanine nucleotides, and therefore plays an important role in the regulation of cell growth. GMP catalyses the irreversible NADPH-dependent deamination of GMP to IMP.
