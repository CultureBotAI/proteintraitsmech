label: "CYCLIC NUCLEOTIDE PHOSPHODIESTERASE"
definition: >-
  CYCLIC NUCLEOTIDE PHOSPHODIESTERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11347. PANTHER protein class: phosphodiesterase. Members are annotated with the molecular function cyclic-nucleotide phosphodiesterase activity, phosphoric diester hydrolase activity, catalytic activity. and participate in cellular response to stimulus, intracellular signaling cassette, cAMP-mediated signaling.
