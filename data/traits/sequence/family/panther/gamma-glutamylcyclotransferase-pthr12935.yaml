identifier: PANTHER:PTHR12935
label: GAMMA-GLUTAMYLCYCLOTRANSFERASE
definition: >-
  This entry contains the human protein C7orf24 (UniProtKB:O75223) which has been used as a cancer marker with a potential role in cell proliferation. It has been characterised as gamma-glutamyl cyclotransferase (GGCT), a homodimer of two 21kDa subunits, that catalyses the formation of 5-oxoproline (2-pyrrolidone-5-carboxylic acid, pyroglutamic acid) from gamma-glutamyl dipeptides (EC:2.3.2.4). L-gamma-glutamyl-L-amino acid -> 5-oxoproline + L-amino acid The structure of GGCT has been solved. Its topology is unrelated to other enzymes associated with cyclotransferase-like activity and its structure has been termed the GGCT-fold, which appears to be related to the BtrG-like superfamily. A potential active site pocket contains a highly conserved glutamic acid (Glu(98)), which when converted to either Ala or Gln completely inactivates the enzyme without altering the overall fold. This entry also includes GGCT gliK, GGCT aclK and GGCT verK from fungi. GGCT gliK is part of the gene cluster that mediates the biosynthesis of gliotoxin, a member of the epipolythiodioxopiperazine (ETP) class of toxins characterised by a disulfide bridged cyclic dipeptide. GGCT aclK mediates the biosynthesis of aspirochlorine. GGCT verK mediates the biosynthesis of 11'-deoxyverticillin A, one of the dimeric epipolythiodioxopiperazines (ETPs) from the verticillin family that act as mycotoxins.
