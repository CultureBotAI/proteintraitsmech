identifier: PANTHER:PTHR24126
label: "ANKYRIN REPEAT, PH AND SEC7 DOMAIN CONTAINING PROTEIN SECG-RELATED"
definition: >-
  ANKYRIN REPEAT, PH AND SEC7 DOMAIN CONTAINING PROTEIN SECG-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24126. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 10 of its annotated subfamilies. Subfamilies are annotated with the molecular function binding, protein binding, transcription factor binding. Subfamilies participate in regulation of DNA-templated transcription, regulation of transcription by RNA polymerase II, regulation of biosynthetic process. Subfamilies localise to intracellular anatomical structure, nucleus, organelle.
