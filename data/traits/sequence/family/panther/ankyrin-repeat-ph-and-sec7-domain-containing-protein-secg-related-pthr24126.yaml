identifier: PANTHER:PTHR24126
label: "ANKYRIN REPEAT, PH AND SEC7 DOMAIN CONTAINING PROTEIN SECG-RELATED"
definition: >-
  ANKYRIN REPEAT, PH AND SEC7 DOMAIN CONTAINING PROTEIN SECG-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24126. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 10 of its annotated subfamilies. Subfamilies are annotated with the molecular function RNA polymerase II-specific DNA-binding transcription factor binding. Subfamilies participate in regulation of transcription by RNA polymerase II. Subfamilies localise to nucleus, intracellular anatomical structure.
