identifier: PANTHER:PTHR10657
label: "PEPTIDYL-PROLYL CIS-TRANS ISOMERASE"
definition: >-
  The Pin1 family of peptidyl-prolyl cis-trans isomerases (PPIases) is involved in the isomerization of specific phosphorylated Ser/Thr-Pro motifs, acting as molecular switches in various cellular processes [,. Members of this family display a preference for acidic residues N-terminal to the proline bond to be isomerized. They play roles in mitosis regulation, transcriptional control, protein folding, and cell transformation. Some family members are involved in the dephosphorylation and recycling of proteins post-mitogen activation, degradation of specific substrates in a phosphorylation-dependent manner, and regulation of DNA repair pathways. The WW domain present in many family members mediates protein-protein interactions. The activity of these enzymes can be regulated by inhibitors like juglone, buparvaquone, and others.
