identifier: PANTHER:PTHR12406
label: "CALCIUM-INDEPENDENT PHOSPHOLIPASE A2  IPLA2 -RELATED"
definition: >-
  This entry includes patatin-like phospholipase domain-containing proteins 1-5 (PNPLA1-5) from humans and Atgl-1 from Caenorhabditis elegans. They are a group of lipid hydrolases. Atgl-1 may play a role in the response of the organism to starvation, enhancing hydrolysis of triglycerides and providing free fatty acids to other tissues to be oxidized in situations of energy depletion. In humans PNPLA1 has a role in the formation of the epidermal lipid barrier; mutations in this gene are associated with the skin disorder known as ichthyosis. PNPLA1 acts as an omega-hydroxyceramide transacylase involved in the synthesis of omega-O-acylceramides (esterified omega-hydroxyacyl-sphingosine; EOS), which are extremely hydrophobic lipids involved in skin barrier formation. It catalyzes the last step of the synthesis of omega-O-acylceramides by transferring linoleic acid from triglycerides to an omega-hydroxyceramid. Human PNPLA2 catalyses the initial step in triglyceride hydrolysis in adipocyte and non-adipocyte lipid droplets. PNPLA3 has both triacylglycerol lipase and acylglycerol O-acyltransferase activities. PNPLA4 additionally possesses acylglycerol transacylase and phospholipase A2 activities.
definition_source: "InterPro:IPR033562 abstract (PANTHER PTHR12406 is a member signature)"
