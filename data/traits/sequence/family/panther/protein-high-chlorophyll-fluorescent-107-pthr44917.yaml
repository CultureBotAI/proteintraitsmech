identifier: PANTHER:PTHR44917
label: "PROTEIN HIGH CHLOROPHYLL FLUORESCENT 107"
definition: >-
  This entry represents a group of tetratricopeptide-like repeat chloroplast proteins, including MBB1/NAC2 from Chlamydomonas reinhardtii and HCF107 from Arabidopsis. MBB1 is required for expression of the chloroplast psbB/psbT/psbH gene cluster. NAC2 is involved in psbD mRNA stability. HCF107 is a sequence-specific RNA binding protein involved in RNA stabilizing, RNA processing, and translational activation in chloroplast. It is required for processing, stabilization and translation of plastid-encoded psbH mRNA.
