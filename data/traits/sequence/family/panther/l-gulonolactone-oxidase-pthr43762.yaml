identifier: PANTHER:PTHR43762
label: "L-GULONOLACTONE OXIDASE"
definition: >-
  This entry identifies a family of at least two different sugar 1,4 lactone oxidases, both involved in synthesising ascorbic acid or a derivative. These include L-gulono-1,4-lactone dehydrogenase from bacteria ([ec:1.1.2.-]), L-gulonolactone oxidase (EC:1.1.3.8) from mammals and D-arabinono-1,4-lactone oxidase Alo1 (EC:1.1.3.37) from yeasts. Members are proposed to have the cofactor FAD covalently bound at a site specified by InterPro:IPR006093.
definition_source: "InterPro:IPR010031 abstract (PANTHER PTHR43762 is a member signature)"
