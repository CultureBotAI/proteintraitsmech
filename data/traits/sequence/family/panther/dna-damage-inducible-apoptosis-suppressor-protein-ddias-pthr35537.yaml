identifier: PANTHER:PTHR35537
label: "DNA DAMAGE-INDUCIBLE APOPTOSIS SUPPRESSOR PROTEIN DDIAS"
definition: >-
  This entry includes the DNA damage-induced apoptosis suppressor protein (DDIAS), also known as Noxin (Nitric oxide inducible), which is an anti-apoptotic protein involved in DNA repair and cell survival. This protein is induced by a wide range of stressors but it has been shown that it acts when there is DNA damage, suppressing cell death in order to prevent from DNA lesions. This protein is highly expressed in cancer tissues and cells, being a potential therapeutic target in cancer. Recently, it has been demonstrated that DDIAS knockdown caused growth inhibition of lung cancer cells. As it is constitutively activated in malignant cancers, this confirms its utility as therapeutic target.
