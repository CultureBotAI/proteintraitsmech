identifier: PANTHER:PTHR34439
label: CENTROBIN
definition: >-
  Centrobin is a centrosomal protein required for centriole duplication. It is also required for nucleation and stabilization of microtubules. In Drosophila, centrobin is a negative regulator of ciliogenesis in specialized sensory neurons, whereas in vertebrates it acts as a positive regulator of ciliogenesis.
