  - kind: GENERAL
    text: >-
      ARF3-INTERACTING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28245. Members participate in cellular localization. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of cellular polarity and actin cytoskeleton organization. Members of this family play a crucial role in the spatial orientation of cell growth and division. They are essential for the proper localization of specific proteins to the plasma membrane, which is a key factor in maintaining polarized cell growth. Additionally, these proteins are involved in the formation and stabilization of actin structures, such as actin cables and patches, which are important for cell shape and motility. The family's functions are critical in various organisms for processes like budding in yeast and hyphal tip growth in filamentous fungi.
    source: "InterPro:IPR052809 abstract (LLM-generated, not curator-reviewed)"
