identifier: PANTHER:PTHR21029
label: "R-SEVEN BINDING PROTEIN (R7BP) HOMOLOG"
definition: >-
  This family consists of regulator of G-protein signalling 7-binding protein (RGS7BP) and regulator of G-protein signalling 9-binding protein (RGS9BP). They interact with regulation of G-protein signalling (RGS) proteins and Gbeta5 to form complexes that act to regulate G-proteins. RGS7BP is expressed neuronally and interacts with R7 family of RGS proteins (RGS6, RGS7, RGS9 and RGS11). RGS9BP interacts with RGS9 and is involved in the regulation of G-protein signalling in the phototransduction, participating in the recovery phase of visual transduction.
