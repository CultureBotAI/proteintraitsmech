identifier: PANTHER:PTHR30327
label: "UNCHARACTERIZED PROTEIN YQGE"
definition: >-
  This entry represents a group of bacterial proteins, including AlgH from Pseudomonas aeruginosa, VC_0467 from Vibrio cholerae and YqgE from Escherichia coli. AlgH is involved in the transcriptional regulation of alginate biosynthesis. VC_0467 has been described as a putative translation repressor ( PDB:2haf ). This family was previously known as UPF0301.
