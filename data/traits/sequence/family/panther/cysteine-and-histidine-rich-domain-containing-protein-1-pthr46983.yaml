identifier: PANTHER:PTHR46983
label: "CYSTEINE AND HISTIDINE-RICH DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This entry includes Cysteine and histidine-rich domain-containing protein 1 (CHRD1) and its orthologue from Drosophila, morgana, which contain a CHORD (cysteine- and histidine-rich) domain. CHRD1/Morgana regulate centrosome duplication and mitotic spindle dynamics and it also involved in controlling the size of dendritic arbors. Morgana may act as co-chaperone for Hsp83, while CHRD1 may act as co-chaperone for HSP90. CHRD1 plays a role in ensuring the localisation of the tyrosine kinase receptor EGFR to the plasma membrane, and thus ensures the subsequent regulation of EGFR activity and EGF-induced actin cytoskeleton remodeling. This entry also includes Integrin beta-1-binding protein 2, also known as Melusin and CHORDC3, which may play a role during maturation and/or organisation of muscles cells. CHORDs are 60-amino acid modules that bind two zinc ions. They are usually arranged in tandem and are found in all tested eukaryotes, with the exception of yeast, where they are involved in processes ranging from pressure sensing in the heart to maintenance of diploidy in fungi, and exhibit distinct protein-protein interaction specificity. Six cysteine and two histidine residues are invariant within the CHORD domain. Three other residues are also invariant and some positions are confined to positive, negative, or aromatic amino acids.
definition_source: "InterPro:IPR039790 abstract (PANTHER PTHR46983 is a member signature)"
