  - kind: GENERAL
    text: >-
      This family of proteins includes components of the mitochondrial ribosome, also known as mitoribosomes. These proteins are involved in the synthesis of mitochondrial genome-encoded proteins. They play a crucial role in the mitochondrial respiratory chain by contributing to the production of essential transmembrane subunits. Mitoribosomes are attached to the mitochondrial inner membrane, allowing for the cotranslational integration of translation products into the membrane.
