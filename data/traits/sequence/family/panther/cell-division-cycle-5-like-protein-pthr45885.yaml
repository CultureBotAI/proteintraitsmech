identifier: PANTHER:PTHR45885
label: "CELL DIVISION CYCLE 5-LIKE PROTEIN"
definition: >-
  This entry includes cell division cycle 5-like protein (CDC5L) from human and its orthologues from yeast, Cef1, DNA-binding proteins involved in cell cycle control. They function in pre-mRNA splicing as components of the PRP19-CDC5L complex (Prp19p-Cef1 in yeast), which constitutes an integral part of the spliceosome and is required for activating pre-mRNA splicing. CDC5L is a DNA-binding protein The PRP19-CDC5L complex may also play a role in the response to DNA damage (DDR).
