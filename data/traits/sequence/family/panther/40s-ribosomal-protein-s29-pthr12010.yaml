identifier: PANTHER:PTHR12010
label: "40S RIBOSOMAL PROTEIN S29"
definition: >-
  This entry includes the small ribosomal subunit protein uS14 from eukaryotes (also known as 40S ribosomal protein S29, the cytosolic form) and archaea (also known as 30S ribosomal protein S14 type Z). They belong to the zinc-binding subfamily of ribosomal protein uS14. They bind 1 zinc ion per subunit and bind to the 16S rRNA. uS14 is required for the assembly of 30S particles and may also be responsible for determining the conformation of the 16S rRNA at the A site.
