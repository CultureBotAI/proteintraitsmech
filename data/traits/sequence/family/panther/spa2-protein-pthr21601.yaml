identifier: PANTHER:PTHR21601
label: "SPA2 PROTEIN"
definition: >-
  This entry includes Spa2 and Sph1 from fungi. They function in cell polarity and cell morphogenesis. Sph1- and Spa2-deleted cells possess defects in mating projection morphology and pseudohyphal growth. Spa2 has been shown to interact with actomyosin ring components during cytokinesis.
