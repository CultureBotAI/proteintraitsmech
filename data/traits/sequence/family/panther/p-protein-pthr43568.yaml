    text: >-
      P PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43568. PANTHER protein class: primary active transporter, transporter.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transporters involved in diverse biological processes such as biomineralization, melanogenesis, and possibly ion transport and pH regulation in various cellular compartments. Some members are implicated in the formation of magnetosomes, which are intracellular organelles in magnetotactic bacteria, playing a role in pH regulation within these structures. Other members contribute to melanosome function in mammals, specifically influencing melanosomal pH to optimize the activity of enzymes involved in melanin synthesis. This activity is crucial for the maturation of melanosomes and affects pigmentation, including skin color variation and eye color determination. The family appears to be functionally diverse, with some members uncharacterized, suggesting a broad range of physiological roles.
    source: "InterPro:IPR051475 abstract (LLM-generated, not curator-reviewed)"
