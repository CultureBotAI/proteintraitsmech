identifier: PANTHER:PTHR32179
label: "NICOTINATE-NUCLEOTIDE PYROPHOSPHORYLASE [CARBOXYLATING]"
definition: >-
  Proteins in this family includes nicotinate-nucleotide pyrophosphorylase (EC:2.4.2.19), also known as quinolinate phosphoribosyl transferases) and putative pyrophosphorylase ModD. Nicotinate-nucleotide pyrophosphorylase is a type II phosphoribosyltransferase which provides the de novo source of nicotinate mononucleotide (NAMN) for NAD biosynthesis in both prokaryotes and eukaryotes. Human quinolinate phosphoribosyltransferase (also known as hQPRTase) is involved in the catabolism of quinolinic acid (QA). Elevation of QA levels in the brain has been linked to the pathogenesis of a range of neurodegenerative disorders. ModD is found with molybdenum transport genes modABC in Rhodobacter capsulatus. However, disruption of modD causes only a 4-fold (rather than 500-fold for modA, modB, modC) change in the external molybdenum concentration required to suppress an alternative nitrogenase. ModD proteins are highly similar to nicotinate-nucleotide pyrophosphorylase (also called quinolinate phosphoribosyltransferase). Their function is unknown.
