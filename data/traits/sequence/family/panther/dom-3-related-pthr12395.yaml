identifier: PANTHER:PTHR12395
label: "DOM-3 RELATED"
definition: >-
  Yeast RAI1 is homologous to Caenorhabditis elegans DOM-3 and human DOM3Z (DXO). They have both decapping and 5'-3' exoribonuclease activity and are a component of the mRNA 5'-end capping quality control mechanism. RAI1 is a single-copy gene in most organisms; however S. cerevisiae contains a second homologue, DXO1, which also possesses decapping and 5'-3' exoribonuclease activity, whereas RAI1 has decapping and pyrophosphohydrolase activities. This domain is also found in DXO1 homologue from Arabidopsis. This entry also includes protein Cutoff (Cuff) from Drosophila. Differently from Rai1, Cuff does not display a Dom3Z domain, which is critical for Rai1 activity. Rai1 has been shown to regulate piRNA cluster expression and piRNA production in the Drosophila germline.
definition_source: "InterPro:IPR039039 abstract (PANTHER PTHR12395 is a member signature)"
