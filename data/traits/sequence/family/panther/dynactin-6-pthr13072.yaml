identifier: PANTHER:PTHR13072
label: "DYNACTIN 6"
definition: >-
  Dynactin is a complex that binds to cytoplasmic dynein and is a required activator for cytoplasmic dynein-mediated vesicular transport. Dynactin localises to the cleavage furrow and to the midbodies of dividing cells, suggesting that it may function in cytokinesis. This entry represents the subunit6 (DCTN6) of the Dynactin complex. DCTN6 is critical for dynein-mediated early endosome movement but not for dynein-mediated nuclear distribution.
