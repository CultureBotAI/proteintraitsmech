  - kind: GENERAL
    text: >-
      The Major Facilitator Superfamily Sugar Transporter family encompasses a range of proteins involved in the transport of sugars across cellular membranes. Members of this family function as facilitative glucose transporters, which are essential for the uptake of glucose and its distribution to various tissues, and do not require insulin for their activity. Some members are specifically required for the development of the cardiovascular system. Others operate as symporters, coupling the transport of sugars like D-xylose, galactose, and L-arabinose with protons, thereby utilizing the proton motive force to drive the uptake of these sugars into the cell. The family also includes transporters for myo-inositol and putative metabolite transport proteins, suggesting a broader role in the transport of various metabolites. Regulation of activity is observed in some members by uncoupling agents and glucose transport inhibitors.
    source: "InterPro:IPR050820 abstract (LLM-generated, not curator-reviewed)"
