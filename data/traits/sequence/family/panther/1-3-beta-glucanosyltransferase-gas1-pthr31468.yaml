identifier: PANTHER:PTHR31468
label: "1,3-BETA-GLUCANOSYLTRANSFERASE GAS1"
definition: >-
  This is a family of yeast glycosylphosphatidylinositol-anchored beta(1-3)glucanosyltransferases. It includes Candida albicans pH-regulated protein PHR1, which is required for apical growth and plays a role in morphogenesis and Saccharomyces cerevisiae glycolipid anchored surface protein Gas1-5. Gas1 is a beta-1,3-glucanosyltransferase that was initially characterised at the cell wall where it remodels chains of beta-1,3-glucan. Later, it was found to be involved in transcriptional silencing and DNA damage response.
definition_source: "InterPro:IPR004886 abstract (PANTHER PTHR31468 is a member signature)"
