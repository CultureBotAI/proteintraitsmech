identifier: PANTHER:PTHR45863
label: "SERINE/THREONINE-PROTEIN KINASE BSK5"
definition: >-
  This entry represents a group of plant serine/threonine-protein kinases, including BSK1-12 from Arabidopsis. They are the substrates of BRI1 kinase that activate downstream BR (brassinosteroid) signal transduction. BSK1 has been shown to interact with the PAMP (pathogen-associated molecular pattern) receptor FLAGELLIN SENSING2 and regulate plant innate immunity.
