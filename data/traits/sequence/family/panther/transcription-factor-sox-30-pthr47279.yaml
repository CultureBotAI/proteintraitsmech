  - kind: GENERAL
    text: >-
      The SOX30 family of transcription factors is characterized by its dual role in gene regulation, functioning as both an activator and a repressor. Members of the SOX30 family recognize and bind to a specific DNA sequence motif, predominantly favoring guanine-rich regions adjacent to the core 5'-ACAAT-3' sequence. The family is involved in the regulation of its own transcription and is essential for the activation of genes required for spermiogenesis. Additionally, the SOX30 family plays a role in modulating Wnt signaling pathways by repressing the transcription of CTNNB1 and by directly binding to the CTNNB1 protein, which hinders its interaction with TCF7L2/TCF4, thereby inhibiting the signaling cascade.
    source: "InterPro:IPR052856 abstract (LLM-generated, not curator-reviewed)"
