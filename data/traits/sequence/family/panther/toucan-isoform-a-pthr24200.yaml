identifier: PANTHER:PTHR24200
label: "TOUCAN, ISOFORM A"
definition: >-
  CCDC69 acts as a scaffold to regulate the recruitment and assembly of spindle midzone components. CCDC69 is required for the localisation of AURKB and PLK1 to the spindle midzone. During cell division, CCDC69 localises along overlapping interpolar microtubules in early anaphase, concentrates at the spindle midzone centre during late anaphase, and accumulates at the midbody during telophase. CCDC69 contains an N-terminal myristoylation site for membrane association. MTUS1 functions as a tumour suppressor that may inhibit cell proliferation and forms homodimers. MTUS1 localises to multiple cellular compartments, including mitochondria, Golgi apparatus, cell membrane and nucleus.
definition_source: "InterPro:IPR051293 abstract (PANTHER PTHR24200 is a member signature)"
