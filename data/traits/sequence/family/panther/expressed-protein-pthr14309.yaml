identifier: PANTHER:PTHR14309
label: "EXPRESSED PROTEIN"
definition: >-
  This entry includes pleckstrin homology domain-containing family B (PLEKHB) members 1 and 2 (also known as evectins 1 and 2). They are vesicular proteins. Evectin1 (evt-1) has been found to localize to rhodopsin-bearing membranes of the post-Golgi in photoreceptors. Evectin2 is a recycling endosomal protein that can specifically bind phosphatidylserine through its PH domain.
