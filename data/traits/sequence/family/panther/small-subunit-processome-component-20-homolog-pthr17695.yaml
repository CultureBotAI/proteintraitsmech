    text: >-
      SMALL SUBUNIT PROCESSOME COMPONENT 20 HOMOLOG — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR17695. and localise to intracellular non-membrane-bounded organelle, small-subunit processome, protein-containing complex.
