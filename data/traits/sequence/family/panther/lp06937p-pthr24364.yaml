  - kind: GENERAL
    text: >-
      This family of proteins may act as inhibitors of the Wnt/beta-catenin signaling pathway. They are thought to achieve this by indirectly interacting with the receptor LRP6, thereby blocking the internalization of Wnt3a-dependent LRP6. This interaction is crucial for the regulation of cell growth, proliferation, and differentiation processes that are governed by Wnt signaling. The proteins in this family are characterized by the presence of a leucine-rich repeat N-terminal (LRRNT) cap and at least one leucine-rich repeat (LRR) domain at the C-terminus, which are essential for their function in inhibiting the Wnt pathway.
    source: "InterPro:IPR052286 abstract (LLM-generated, not curator-reviewed)"
