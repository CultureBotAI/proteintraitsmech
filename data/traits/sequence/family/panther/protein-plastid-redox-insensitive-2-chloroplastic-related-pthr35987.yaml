identifier: PANTHER:PTHR35987
label: "PROTEIN PLASTID REDOX INSENSITIVE 2, CHLOROPLASTIC-RELATED"
definition: >-
  This entry represents a group of plant proteins, including PRIN2 (Protein PLASTID REDOX INSENSITIVE 2) from Arabidopsis. PRIN2 is a chloroplastic protein essential for proper plant embryo development. It is localized to the plastid nucleoids and is required for full expression of genes transcribed by PEP (plastid encoded RNA polymerase), an enzyme that predominantly mediates the transcription of photosynthesis-related genes.
