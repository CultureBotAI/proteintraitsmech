definitions:
  - kind: GENERAL
    text: >-
      ATF6, ISOFORM C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46164. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in endoplasmic reticulum unfolded protein response, response to endoplasmic reticulum stress, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The ATF bZIP family is involved in the unfolded protein response (UPR), a cellular stress response related to the endoplasmic reticulum (ER). Family members act as transcription factors that bind to ER stress response elements (ERSE) to activate UPR target genes during ER stress. They are synthesized as precursors embedded in the ER membrane and are processed upon ER stress, releasing their transcription factor form to translocate into the nucleus. The basic leucine-zipper domain is crucial for DNA binding and nuclear localization. Members of the family may also play roles in development, cone function in the retina, lifespan modulation, ER calcium homeostasis, and protection against proteotoxicity.
    source: "InterPro:IPR051882 abstract (LLM-generated, not curator-reviewed)"
