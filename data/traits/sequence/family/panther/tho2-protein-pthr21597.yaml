identifier: PANTHER:PTHR21597
label: "THO2 PROTEIN"
definition: >-
  THO/TREX, a nuclear protein complex conserved from yeast to humans, plays an important role in mRNP biogenesis connecting transcription elongation, mRNA export and preventing genetic instability. THO could be relevant to different mRNA processing steps, including the 3'-end formation, transcript release and export. This entry represents the Tho2 subunit of the THO/TREX complex.
