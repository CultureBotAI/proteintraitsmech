identifier: PANTHER:PTHR37975
label: "FLYWCH ZINC FINGER TRANSCRIPTION FACTOR HOMOLOG"
definition: >-
  This family of proteins includes transcription factors characterized by their ability to bind DNA and repress the expression of target genes, which notably include micro-RNA genes. Members of this family are known to act redundantly with at least one other family member in their biological context. They recognize specific DNA sequence motifs in the promoters of their target genes to exert their regulatory function. The redundancy within this family suggests a potential for compensatory interactions or a division of labor among the different members in regulating gene expression.
