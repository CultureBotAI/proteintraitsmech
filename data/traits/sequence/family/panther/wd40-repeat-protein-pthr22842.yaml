  - kind: GENERAL
    text: >-
      WD40 REPEAT PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22842. and participate in cellular aromatic compound metabolic process, biosynthetic process, organic substance metabolic process. and localise to catalytic step 2 spliceosome, protein-containing complex, spliceosomal complex.
