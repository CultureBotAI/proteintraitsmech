    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins functions as molecular scaffolds for various multimeric protein complexes. They play a role in the assembly of scaffolds for the ERK signaling pathway, modulating ERK activation in response to specific stimuli. These proteins can either enhance or inhibit ERK activation depending on their concentration. Additionally, they are involved in cellular response to hypoxia, often acting as negative regulators of the HIF1A transcription factor, potentially promoting its degradation. Some family members are implicated in the recruitment of signaling complexes to upstream activators and may participate in pre-mRNA splicing processes.
    source: "InterPro:IPR051980 abstract (LLM-generated, not curator-reviewed)"
