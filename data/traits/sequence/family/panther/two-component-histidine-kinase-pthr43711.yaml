  - kind: GENERAL
    text: >-
      TWO-COMPONENT HISTIDINE KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43711. PANTHER protein class: histidine kinase receptor of two-component system, transmembrane signal receptor.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
