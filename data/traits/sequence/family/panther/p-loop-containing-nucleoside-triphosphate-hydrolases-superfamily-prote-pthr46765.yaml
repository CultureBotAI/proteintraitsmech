identifier: PANTHER:PTHR46765
label: "P-LOOP CONTAINING NUCLEOSIDE TRIPHOSPHATE HYDROLASES SUPERFAMILY PROTEIN"
definition: >-
  This family of proteins includes components of the CTF18-RFC complex, which is involved in sister chromatid cohesion and the fidelity of chromosome transmission. These proteins function as chromosome cohesion factors and play a role in the cell nuclear antigen loader complexes. They are involved in the ATP-dependent loading of PCNA onto primed and gapped DNA, and exhibit weak ATPase activity that is stimulated by primed DNA, RPA, and PCNA. The CTF18-RFC complex is essential for maintaining genome stability during cell division.
