identifier: PANTHER:PTHR15154
label: HAMARTIN
definition: >-
  This entry includes the hamartin protein, also known as Tuberous sclerosis 1 protein (TSC1), the non-catalytic component of the TSC-TBC complex, a multiprotein complex that acts as a negative regulator of the canonical mTORC1 complex. This complex acts as a GTPase-activating protein (GAP) for the small GTPase RHEB, a direct activator of the protein kinase activity of m TORC1. It also acts as a tumour suppressor. The hamartin protein interacts with the tuberin protein (TSC2) InterPro:IPR003913. Tuberous sclerosis complex (TSC) is an autosomal dominant disorder and is characterised by the presence of hamartomas in many organs, such as brain, skin, heart, lung, and kidney. It is caused by mutation in either TSC1 or TSC2 tumour suppressor genes. TSC1 encodes a protein, hamartin, containing two coiled-coil regions, which have been shown to mediate binding to tuberin. The TSC2 gene codes for tuberin InterPro:IPR003913. TSC1 contains an N-terminal HEAT repeats domain followed by coiled-coil regions.
definition_source: "InterPro:IPR007483 abstract (PANTHER PTHR15154 is a member signature)"
