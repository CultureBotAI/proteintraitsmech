identifier: PANTHER:PTHR28141
label: "2',3'-CYCLIC-NUCLEOTIDE 3'-PHOSPHODIESTERASE"
definition: >-
  2',3' Cyclic nucleotide phosphodiesterases (CPDases) are enzymes that catalyse at least two distinct steps in the splicing of tRNA introns in eukaryotes. The active site is characterised by two conserved histidine residues. The enzyme has six cysteine residues, four of which are involved in forming two intra-molecular disulphide bridges. One of these bridges is involved in the catalytic activity of the enzyme as it opens when CPDase is semi-reduced. Proteins in this entryand belong to EC:3.1.4.37 and catalyse the reaction Nucleoside 2',3'-cyclic phosphate + H2O = nucleoside 2'-phosphate.
definition_source: "InterPro:IPR012386 abstract (PANTHER PTHR28141 is a member signature)"
