identifier: PANTHER:PTHR43763
label: "XAA-PRO AMINOPEPTIDASE 1"
definition: >-
  The Xaa-Pro aminopeptidase P family comprises metalloaminopeptidases that catalyze the removal of penultimate prolyl residues from the N-termini of peptides. Members of this family are involved in the metabolism of various peptides, including the vasodilator bradykinin. They contribute to peptide degradation and may play roles in regulating physiological processes such as blood pressure. The family includes both soluble and membrane-bound enzymes, with some members being regulated by metal ions and inhibitors like apstatin and EDTA. The activity of these enzymes is essential in various organisms, from humans to plants and fungi, highlighting their fundamental role in peptide processing.
