identifier: PANTHER:PTHR45978
label: "SPX DOMAIN-CONTAINING PROTEIN 3"
definition: >-
  This entry represents a group of plant SPX domain-containing proteins, including AtSPX1-6 from Arabidopsis. AtSPX1 ( UniProtKB:Q8LBH4 ) and AtSPX2 ( UniProtKB:O48781 ) have a cellular Pi-dependent inhibitory effect on Phosphate Starvation Response 1 (PHR1). Their rice homologue, OsSPX1 ( UniProtKB:Q69XJ0 ), may play an important role in linking cold stress and Pi starvation signal transduction pathways.
