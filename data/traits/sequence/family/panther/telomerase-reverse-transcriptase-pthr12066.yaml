identifier: PANTHER:PTHR12066
label: "TELOMERASE REVERSE TRANSCRIPTASE"
definition: >-
  TELOMERASE REVERSE TRANSCRIPTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12066. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, telomeric DNA binding, catalytic activity, acting on DNA. and participate in telomere maintenance via telomere lengthening, cellular aromatic compound metabolic process, DNA biosynthetic process. and localise to ribonucleoprotein complex, nuclear protein-containing complex, transferase complex, transferring phosphorus-containing groups.
