identifier: PANTHER:PTHR12066
label: "TELOMERASE REVERSE TRANSCRIPTASE"
definition: >-
  TELOMERASE REVERSE TRANSCRIPTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12066. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function DNA polymerase activity, telomeric DNA binding, RNA binding. Members participate in telomere maintenance via telomerase. Members localise to transferase complex, transferring phosphorus-containing groups, nuclear protein-containing complex, ribonucleoprotein complex.
