  - kind: GENERAL
    text: >-
      This family of proteins functions as acyl-protein thioesterases, hydrolyzing fatty acids from acylated protein residues. They play a role in regulating mitochondrial antioxidant capacity by modulating the S-depalmitoylation of peroxiredoxin-5, a key antioxidant enzyme. Additionally, they are involved in the metabolic processing of mycophenolic acid acyl-glucuronide, an immunosuppressant drug metabolite, through deglucuronidation. These proteins are subject to inhibition by the compound palmostatin-B.
    source: "InterPro:IPR052382 abstract (LLM-generated, not curator-reviewed)"
