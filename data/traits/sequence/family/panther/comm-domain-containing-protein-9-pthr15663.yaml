identifier: PANTHER:PTHR15663
label: "COMM DOMAIN-CONTAINING PROTEIN 9"
definition: >-
  COMM9 is a member of the COMMD family defined by the presence of a conserved and unique motif termed the COMM (copper metabolism gene MURR1) domain, which functions as an interface for protein-protein interactions. COMM9 modulates Na+ transport in epithelial cells by regulation of apical cell surface expression of amiloride-sensitive sodium channel (ENaC) subunits.
