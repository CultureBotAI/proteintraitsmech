identifier: PANTHER:PTHR10070
label: "IMMUNOGLOBULIN J CHAIN"
definition: >-
  Immunoglobulin J serves to link two monomer units of either IgM or IgA. In the case of IgM, the J chain-joined dimer is a nucleating unit for the IgM pentamer, and in the case of IgA it induces larger polymers. It also help to bind these immunoglobulins to the secretory component.
