  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the metabolism of vitamin A. They catalyze the saturation of all-trans-retinol, converting it to all-trans-13,14-dihydroretinol, a step in the vitamin A metabolic pathway. These enzymes do not show activity towards all-trans-retinoic acid or various cis-isomers of retinol. Beyond their enzymatic role, they may also influence liver metabolism and adipocyte differentiation, with potential regulatory functions upstream of MLXIPL/ChREBP. One member is noted to be inactive, while others have additional functions such as regulating adipocyte differentiation and possibly affecting liver metabolism.
    source: "InterPro:IPR052206 abstract (LLM-generated, not curator-reviewed)"
