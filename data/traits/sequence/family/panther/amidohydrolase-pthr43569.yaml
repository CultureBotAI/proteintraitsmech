  - kind: GENERAL
    text: >-
      The Metallo-dependent Lactonases family comprises enzymes that catalyze the hydrolysis of various lactones to the corresponding carboxylate forms, playing a role in carbohydrate degradation pathways. Members of this family exhibit high substrate specificity for lactones derived from sugars such as L-rhamnono-1,4-lactone and L-fucono-1,5-lactone, among others. The enzymatic activity is dependent on metal ions and is inhibited by metal cations like Zn(2+), Fe(2+), and Cu(2+), but not by chelating agents such as EDTA. The family belongs to the metallo-dependent hydrolases superfamily, indicating a reliance on metal ions for catalytic activity. These enzymes are involved in alternative metabolic routes that bypass phosphorylated intermediates, contributing to the versatility of bacterial carbohydrate metabolism.
    source: "InterPro:IPR052350 abstract (LLM-generated, not curator-reviewed)"
