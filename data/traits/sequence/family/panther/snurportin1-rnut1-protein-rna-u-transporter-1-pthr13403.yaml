identifier: PANTHER:PTHR13403
label: "SNURPORTIN1  RNUT1 PROTEIN   RNA, U TRANSPORTER 1"
definition: >-
  Snurportin-1 is a nuclear import receptor that contains an N-terminal importin beta binding domain which is essential for its function as an snRNP-specific nuclear import receptor. Snurportin-1 interacts with m3G-cap where it enhances the m3G-cap dependent nuclear import of U snRNPs in Xenopus laevis oocytes and digitonin-permeabilized HeLa cells.
