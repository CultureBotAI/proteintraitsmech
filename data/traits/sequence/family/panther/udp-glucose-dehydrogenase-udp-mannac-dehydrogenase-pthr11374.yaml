identifier: PANTHER:PTHR11374
label: "UDP-GLUCOSE DEHYDROGENASE/UDP-MANNAC DEHYDROGENASE"
definition: >-
  UDP-glucose 6-dehydrogenase is involved in the biosynthesis of UDP-glucuronic acid (UDP-GlcA), a critical precursor for glycan synthesis. In vertebrates it is involved in the biosynthesis of matrix glycosaminoglycans (hyaluronan, chondroitin sulfate, and heparan sulfan) which play significant roles in signaling, inflammation, morphogenesis, cancer growth and matrix organisation. In plants, it provides nucleotide sugars for cell-wall polymers. Proteins in this entry include human UDP-glucose 6-dehydrogenase. This entry represents the UDP-glucose 6-dehydrogenase mainly from eukaryotes. However, subsets of bacterial proteins can be found in this entry. Most of the bacterial type of the UDP-glucose 6-dehydrogenase can be found in InterPro:IPR028357.
