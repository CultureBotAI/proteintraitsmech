  - kind: GENERAL
    text: >-
      The Extended Synaptotagmin family is involved in tethering the endoplasmic reticulum to the cell membrane and promoting the formation of appositions between these two cellular structures. Members of the family bind glycerophospholipids within a barrel-like domain, which may play a significant role in cellular lipid transport. The family's C2 domains are responsible for mediating lipid and calcium binding, with the N-terminal C2 domain being crucial for calcium-dependent lipid binding and membrane interaction. These proteins are capable of binding multiple calcium ions with varying affinities and are essential for translocating to the cell membrane in response to increased cytosolic calcium levels. Additionally, some members are implicated in FGF signaling, particularly in the rapid internalization of FGFR1 upon FGF1 binding, which is likely facilitated by the AP-2 complex. This function is crucial for normal embryonic development and downstream signaling cascades.
    source: "InterPro:IPR051634 abstract (LLM-generated, not curator-reviewed)"
