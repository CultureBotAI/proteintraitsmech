identifier: PANTHER:PTHR10237
label: "DEFORMED EPIDERMAL AUTOREGULATORY FACTOR 1 HOMOLOG  SUPPRESSIN"
definition: >-
  Deformed epidermal autoregulatory factor-1 (DEAF-1) was first isolated in Drosophila melanogaster as a novel DNA-binding protein. Since then, several orthologues in mammals have been identified. In Drosophila, DEAF-1 plays an important role in embryonic development, particularly in the segmentation stage following cuticle secretion. In mammals it regulates different processes, including epithelial cell proliferation and side-branching in the mammary gland and it is required for neural tube closure and skeletal patterning. Mutations in DEAF-1 cause intellectual disability and behavioural problems, most likely as a result of impaired transcriptional regulation by DEAF1.
