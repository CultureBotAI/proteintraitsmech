identifier: PANTHER:PTHR44813
label: "MITOGEN-ACTIVATED PROTEIN KINASE-BINDING PROTEIN 1"
definition: >-
  This entry represents the Mitogen-activated protein kinase-binding protein 1 (MAPKBP1, also known as JNKBP1) and related proteins. Members of this family contain two WD40 domains at the N-terminal that mediate interaction with NOD2, leading to the down-regulation of NOD2-induced signalling pathways. These proteins inhibit the activation of NF-kappa-B, a key transcription factor in inflammatory responses, and reduce the secretion of IL8, a pro-inflammatory cytokine. These proteins are also involved in the JNK signaling pathway, which is associated with various cellular processes including stress responses, apoptosis, and immune responses.
