identifier: PANTHER:PTHR23050
label: "CALCIUM BINDING PROTEIN"
definition: >-
  The centrin family consists of calcium-binding proteins that play crucial roles in various cellular processes. Centrin is a protein involved in microtubule-organizing center structure and function, including centriole duplication and cell division. This entry also includes caltractin, obelin and some Calcium-binding proteins from Arabidopsis such as CML37 and 38. Members of this entry are characterised by the presence of EF-hand domains, which are helix-loop-helix structural domains capable of binding calcium ions, and are involved in calcium signalling and regulation of various cellular activities.
