identifier: PANTHER:PTHR48164
label: "DOLICHYL-DIPHOSPHOOLIGOSACCHARIDE--PROTEIN GLYCOSYLTRANSFERASE SUBUNIT 4"
definition: >-
  The OST4 family consists of subunits within the oligosaccharyl transferase (OST) complex, which is pivotal for protein N-glycosylation. These subunits facilitate the transfer of a specific glycan, Glc(3)Man(9)GlcNAc(2), from dolichol-pyrophosphate to an asparagine residue in nascent polypeptide chains. This transfer occurs within an Asn-X-Ser/Thr motif and is a cotranslational process. The OST complex operates in conjunction with the Sec61 complex at the translocon in the endoplasmic reticulum, enabling protein translocation. All subunits are essential for the complex's full enzymatic activity. Members of the OST4 family are also involved in maintaining the stability of STT3A-containing OST complexes.
