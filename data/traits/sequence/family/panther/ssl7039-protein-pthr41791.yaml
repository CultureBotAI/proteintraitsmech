identifier: PANTHER:PTHR41791
label: "SSL7039 PROTEIN"
definition: >-
  Members of this protein family are small, generally only 100 amino acids in length. The gene is almost invariably the upstream member of a gene pair, where the downstream member is a predicted DNA-binding protein. These gene pairs, when found on the bacterial chromosome, are often located within prophage regions, but are also found in integrated plasmid regions and near housekeeping genes. Analysis suggests that the gene pair may serve as an addiction module. Member of this family from cyanobacterium Synechocystis 6803 is predicted to be a component of a putative Type II TA system.
definition_source: "InterPro:IPR014056 abstract (PANTHER PTHR41791 is a member signature)"
