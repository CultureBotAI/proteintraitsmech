identifier: PANTHER:PTHR45759
label: "NUCLEOLAR GTP-BINDING PROTEIN 1"
definition: >-
  NUCLEOLAR GTP-BINDING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45759. Members are annotated with the molecular function GTPase activity, hydrolase activity, acting on acid anhydrides, RNA binding. and participate in cellular component biogenesis, ribosome biogenesis, ribosomal large subunit biogenesis.
