definitions:
  - kind: GENERAL
    text: >-
      AHD DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47827. Members are annotated with the molecular function histone binding, modification-dependent protein binding, chromatin binding. Members participate in positive regulation of DNA-templated transcription. Members localise to transcription elongation factor complex, nucleoplasm, membrane-enclosed lumen.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The YEATS domain-containing protein family is characterized by its ability to recognize and bind acylated histones, particularly those that are crotonylated. Members of this family function as chromatin reader components of the super elongation complex (SEC), which is essential for enhancing the catalytic rate of RNA polymerase II transcription. This is achieved by alleviating transient pausing of the polymerase along the DNA. The YEATS domain facilitates the specific recognition of acetylated and crotonylated histones, with a higher binding affinity for crotonylated histones, especially at certain lysine residues. This interaction is crucial for the regulation of gene transcription, including oncogenic gene expression in the context of acute myeloid leukemia. Additionally, the family plays a significant role in hematopoietic stem cell maintenance by binding to active gene promoters and enhancers, thereby influencing histone methylation states and preserving stem cell identity.
    source: "InterPro:IPR052790 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
