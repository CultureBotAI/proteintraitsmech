identifier: PANTHER:PTHR35861
label: "Tail sheath structural protein"
definition: >-
  This family of proteins includes Tail sheath protein from Bacteriophage T4, the putative prophage major tail sheath protein from Pseudomonas aeruginosa and similar sequences from tailed bacteriophages and prokaryotic prophages that are involved in the assembly and structural integrity of bacteriophage tails. Members polymerise to form an extended helical structure around the baseplate-tail tube complex of the virus. These proteins are essential for the contraction mechanism during the infection process, where they shift from an extended to a contracted form. This conformational change is critical for driving the inner tail tube through the host cell envelope, creating a channel that allows for the ejection of viral DNA into the host cell, thus facilitating the infection cycle of the bacteriophage.
definition_source: "InterPro:IPR052042 abstract (PANTHER PTHR35861 is a member signature)"
