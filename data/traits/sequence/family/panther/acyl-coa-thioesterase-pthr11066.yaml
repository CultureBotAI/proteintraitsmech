identifier: PANTHER:PTHR11066
label: "ACYL-COA THIOESTERASE"
definition: >-
  Acyl-CoA thioesterases are a group of enzymes that catalyse the hydrolysis of acyl-CoAs to the free fatty acid and coenzyme A (CoASH). They consequently have the potential to regulate intracellular levels of acyl-CoAs, free fatty acids and CoASH. They may also be involved in the metabolic regulation of peroxisome proliferation. This family includes Acyl-CoA thioesterase 2 from gammaproteobacteria, Acyl-coenzyme A thioesterase 8 from mammals, Peroxisomal acyl-coenzyme A thioester hydrolase 1 from Saccharomyces cerevisiae and Acyl-CoA hydrolase 1/2 from Arabidopsis thaliana.
