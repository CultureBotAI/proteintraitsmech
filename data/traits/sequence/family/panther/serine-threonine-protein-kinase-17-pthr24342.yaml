identifier: PANTHER:PTHR24342
label: "SERINE/THREONINE-PROTEIN KINASE 17"
definition: >-
  SERINE/THREONINE-PROTEIN KINASE 17 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24342. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein. and participate in positive regulation of apoptotic process, response to stimulus, signal transduction. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
