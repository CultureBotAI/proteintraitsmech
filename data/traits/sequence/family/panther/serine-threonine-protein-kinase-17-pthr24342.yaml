label: "SERINE/THREONINE-PROTEIN KINASE 17"
definition: >-
  SERINE/THREONINE-PROTEIN KINASE 17 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24342. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity. Members participate in positive regulation of apoptotic process, intracellular signal transduction, response to stimulus. Members localise to nucleus, intracellular anatomical structure.
