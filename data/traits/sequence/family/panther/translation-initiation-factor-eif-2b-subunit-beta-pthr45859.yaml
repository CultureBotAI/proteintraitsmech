definitions:
  - kind: GENERAL
    text: >-
      TRANSLATION INITIATION FACTOR EIF-2B SUBUNIT BETA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45859. PANTHER protein class: translation initiation factor, translation factor, translational protein. Members are annotated with the molecular function translation regulator activity, nucleic acid binding, translation initiation factor activity, guanyl-nucleotide exchange factor activity. Members participate in organonitrogen compound biosynthetic process, cellular metabolic process, translational initiation. Members localise to cytoplasm, protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins functions as components of the translation initiation factor 2B (eIF2B) complex, which is responsible for the exchange of GDP for GTP on the eIF2 gamma subunit. This activity is crucial for the initiation of protein synthesis as it allows the formation of the eIF2-GTP-methionyl-initiator methionine tRNA complex necessary for the start of translation. The activity of these proteins is regulated by the phosphorylation status of the eIF2 alpha subunit; when eIF2 is phosphorylated, the exchange factor activity of the eIF2B complex is repressed, leading to a reduction in global protein synthesis. This serves as a regulatory mechanism during cellular stress responses. Some members of this family are also known to be activated by specific chemicals that can stimulate their activity regardless of the phosphorylation state of eIF2, thus influencing the integrated stress response.
    source: "InterPro:IPR051855 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
