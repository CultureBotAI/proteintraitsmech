identifier: PANTHER:PTHR46720
label: "HYDROXYLASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_3G01460)-RELATED"
definition: >-
  This family of proteins includes FAD-dependent monooxygenases involved in various biosynthetic pathways, primarily in fungi. These enzymes catalyze key oxidative steps in the production of secondary metabolites with diverse biological activities, including antitumor agents, antifungal compounds, and pigments. They are responsible for hydroxylation reactions, oxidative rearrangements, and ring expansions that contribute to the structural complexity of the metabolites. The family members share a common feature of utilizing flavin adenine dinucleotide (FAD) as a cofactor for their enzymatic activity.
