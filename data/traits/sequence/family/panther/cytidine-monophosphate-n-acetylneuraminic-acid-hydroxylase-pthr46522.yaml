identifier: PANTHER:PTHR46522
label: "CYTIDINE MONOPHOSPHATE-N-ACETYLNEURAMINIC ACID HYDROXYLASE"
definition: >-
  This entry includes a group of cytidine monophosphate-N-acetylneuraminic acid (CMP-NeuAc) hydroxylase catalyses the conversion of CMP-N-acetylneuraminic acid (CMP-Neu5Ac) into its hydroxylated derivative CMP-N-glycolylneuraminic acid (CMP-Neu5Gc), a sialic acid abundantly expressed at the surface of many cells, except in brain. However, the human homologue of CMP-NeuAc hydroxylase in this entry is inactive because it lacks an N-terminal domain essential for enzyme activity. Instead, it may play a role in Wnt signalling.
definition_source: "InterPro:IPR027033 abstract (PANTHER PTHR46522 is a member signature)"
