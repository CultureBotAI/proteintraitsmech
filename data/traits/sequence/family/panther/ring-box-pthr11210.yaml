identifier: PANTHER:PTHR11210
label: "RING BOX"
definition: >-
  The RING-box family is involved in the regulation of protein degradation via the ubiquitin-proteasome system. Members of this family are components of E3 ubiquitin ligase complexes, such as SCF (SKP1-CUL1-F-box protein) and APC/C (Anaphase-promoting complex/cyclosome), which mediate the ubiquitination of target proteins, marking them for proteasomal degradation. This process is crucial for various cellular functions including cell cycle progression, signal transduction, transcription, and DNA repair. The RING-type zinc finger domain within these proteins is essential for their ubiquitin ligase activity, coordinating an additional zinc ion and recruiting E2 ubiquitination enzymes to facilitate the transfer of ubiquitin to substrates. The family's activity is also involved in neddylation of cullins and may play a role in protecting cells from apoptosis.
