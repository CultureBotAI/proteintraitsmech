  - kind: GENERAL
    text: >-
      This family of proteins includes RNases that are typically components of type VII toxin-antitoxin (TA) systems. These RNases are usually toxic when expressed alone, inhibiting cell growth by cleaving RNA molecules such as tRNA or mRNA, depending on the member. The toxicity is counteracted by cognate antitoxins, which neutralize the RNase activity through various modifications such as AMPylation. These systems are thought to play a role in maintaining plasmid stability and may be involved in bacterial stress responses or competition.
    source: "InterPro:IPR052379 abstract (LLM-generated, not curator-reviewed)"
