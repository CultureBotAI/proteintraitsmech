identifier: PANTHER:PTHR13486
label: "TELOMERE LENGTH AND SILENCING PROTEIN 1 TLS1 FAMILY MEMBER"
definition: >-
  Tls1 in fission yeast is required for telomeric heterochromatin assembly as well as telomere length control. The human homologue, the splicing factor C9orf78 (also known as hepatocellular carcinoma-associated antigen 59), plays a role in pre-mRNA splicing by promoting usage of the upstream 3'-splice site at alternative NAGNAG splice sites. It may also modulate exon inclusion events and plays a role in spliceosomal remodeling by displacing WBP4 from SNRNP200 and may act to inhibit SNRNP200 helicase activity. C9orf78 is required for proper chromosome segregation.
definition_source: "InterPro:IPR010756 abstract (PANTHER PTHR13486 is a member signature)"
