identifier: PANTHER:PTHR30295
label: BACTERIOFERRITIN
definition: >-
  BACTERIOFERRITIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30295. PANTHER protein class: storage protein. Members are annotated with the molecular function iron ion binding, oxidoreductase activity, acting on metal ions, heme binding. Members participate in intracellular iron ion homeostasis, maintenance of location in cell. Members localise to cytoplasm, cytosol.
