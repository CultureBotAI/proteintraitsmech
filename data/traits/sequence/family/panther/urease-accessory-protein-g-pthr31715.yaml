identifier: PANTHER:PTHR31715
label: "UREASE ACCESSORY PROTEIN G"
definition: >-
  Urease is a nickel-binding enzyme that catalyses the hydrolysis of urea to form ammonia and carbamate. The activation of urease requires GTP hydrolysis and the formation of a preactivation complex consisting of apo-urease and urease accessory proteins UreF, UreH, and UreG. UreG is a SIMIBI class GTPase that can be recruited by UreF-UreH complex. Member of this family is also Ure7 from Cryptococcus neoformans which appears to combine the functions of bacterial UreE and UreG in activating the Ure1 apoenzyme and thus making this pathogen more similar to that seen in the plant system.
