  - kind: GENERAL
    text: >-
      The protein family includes members that function as substrate-recognition components of a Cul2-RING E3 ubiquitin-protein ligase complex within the DesCEND pathway. They are responsible for recognizing and binding to C-degrons located at the extreme C terminus of target proteins. This recognition leads to the ubiquitination and subsequent degradation of these proteins. The C-degron is typically a motif of less than ten residues and may be present in proteins whether they are full-length, truncated, or proteolytically cleaved forms. The family is characterized by the presence of ankyrin repeats, which are known to mediate protein-protein interactions.
    source: "InterPro:IPR051616 abstract (LLM-generated, not curator-reviewed)"
