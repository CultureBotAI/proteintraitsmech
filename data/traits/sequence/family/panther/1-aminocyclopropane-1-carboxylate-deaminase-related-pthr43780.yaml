identifier: PANTHER:PTHR43780
label: "1-AMINOCYCLOPROPANE-1-CARBOXYLATE DEAMINASE-RELATED"
definition: >-
  This entry represents the 1-aminocyclopropane-1-carboxylate deaminase/D-cysteine desulfhydrase family. Proteins in this family include deaminase, D-cysteine desulfhydrase, phenylserine dehydratase and L-cysteate sulfo-lyase. 1-aminocyclopropane-1-carboxylate deaminase ( EC:3.5.99.7 ) catalyses a cyclopropane ring-opening reaction, the irreversible conversion of 1-aminocyclopropane-1-carboxylate (ACC) to ammonia and alpha-ketobutyrate. Some plant growth-promoting rhizobacteria can produce 1-aminocyclopropane-1-carboxylate deaminase to enhance plant growth. D-cysteine desulfhydrase (d-CDes) ( EC:4.4.1.15 ) catalyses the alpha, beta-elimination reaction of D-cysteine and of several D-cysteine derivatives. The Escherichia coli d-CDes catalyses D-cysteine into pyruvate, H2S, and NH3. The physiological function of bacterial d-CDes is not clear.
definition_source: "InterPro:IPR027278 abstract (PANTHER PTHR43780 is a member signature)"
