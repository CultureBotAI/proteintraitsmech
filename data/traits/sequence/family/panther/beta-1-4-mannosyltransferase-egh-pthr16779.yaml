identifier: PANTHER:PTHR16779
label: "BETA-1,4-MANNOSYLTRANSFERASE EGH"
definition: >-
  Beta-1,4-mannosyltransferase Bre-3 is the Caenorhabditis elegans the homologue of Drosophila egghead (Egh). They are glycosyltransferases with a proposed role in glycosphingolipid biosynthesis in a four component glycosylation pathway that is functionally conserved between nematodes and insects and that it is involved in resistance to bacterial toxins. Bre-3 is involved in susceptibility to pore-forming crystal toxins in conjunction with bre-1, bre-2, bre-4 and bre-5 and it is also involved in resistance to the nematotoxic C. cinerea galectin Cgl2. This protein plays a role in determining brood size.
