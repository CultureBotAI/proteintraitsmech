  - kind: GENERAL
    text: >-
      The H2.0 homeobox family comprises transcription factors that are pivotal in the maturation and maintenance of Th1 cells through TBX21/T-bet dependency. Members of this family are also involved in key developmental processes including embryogenesis and hematopoiesis. In Drosophila, they may contribute to pattern formation during embryonic and imaginal development, although they are not essential for visceral muscle morphogenesis.
