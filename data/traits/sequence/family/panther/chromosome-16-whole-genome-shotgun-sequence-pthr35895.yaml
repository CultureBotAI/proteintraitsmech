identifier: PANTHER:PTHR35895
label: "CHROMOSOME 16, WHOLE GENOME SHOTGUN SEQUENCE"
definition: >-
  This fungal family includes Tag1 (also known as YLR173W), a vacuolar membrane protein involved in termination of autophagy. It regulates autophagy termination during persistent nitrogen starvation through Atg1p-mediated re-phosphorylation of Atg13p and PAS disassembly. This is a type II membrane protein containing a hydrophobic transmembrane region, with the N-terminal region oriented toward the cytosol and the C-terminal inside the lumen, which is glycosylated. Tag1, together with Vac7 from yeast and TMEM106B from humans, has homology with LEA-2 domain. It has three tandemly repeated LEA-2 domains.
definition_source: "InterPro:IPR046368 abstract (PANTHER PTHR35895 is a member signature)"
