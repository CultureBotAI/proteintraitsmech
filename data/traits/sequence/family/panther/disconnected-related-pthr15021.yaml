identifier: PANTHER:PTHR15021
label: DISCONNECTED-RELATED
definition: >-
  Proteins in this family contain C2H2-type zinc fingers. Proteins include: Protein disconnected (disco) from the fruit fly (Drosophila melanogaster), which is required for the formation of stable connections between larval optic nerve cells (also known as Bolwig's nerves) and cells in the brain. Zinc finger protein basonuclin-1 (BNC1), which has three pairs of zinc fingers and a nuclear localization signal and expression of the gene is confined to keratinocytes of stratified squamous epithelia and hair follicles. It is probably a transcriptional activator, preventing terminal differentiation of keratinocytes. It is involved in the positive regulation of oocyte maturation through the regulation of AKT signalling cascade. Zinc finger protein basonuclin-2 (BNC2), which also has three pairs of zinc fingers and a nuclear localization signal, with the gene expressed in the ovary, testis, kidney and skin. It is also located in the nucleus and probably a transcriptional activator, involved in the differentiation of spermatozoa and oocytes. It may also play an important role in early urinary-tract development.
