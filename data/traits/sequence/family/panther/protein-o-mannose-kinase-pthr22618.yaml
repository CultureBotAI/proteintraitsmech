identifier: PANTHER:PTHR22618
label: "PROTEIN O-MANNOSE KINASE"
definition: >-
  Protein O-mannose kinase (POMK; EC:2.7.1.183) is a type II membrane protein with a large lumenal domain. It phosphorylates the 6-position of O-mannose using ATP, a crucial step in the biosynthetic pathway of O-mannose glycan. Mutations in the POMK gene cause a severe congenital muscular dystrophy, Walker-Warburg syndrome.
