identifier: PANTHER:PTHR14015
label: "OPIOID GROWTH FACTOR RECEPTOR  OGFR   ZETA-TYPE OPIOID RECEPTOR"
definition: >-
  Opioid peptides act as growth factors in neural and non-neural cells and tissues, in addition to serving in neurotransmission/neuromodulation in the nervous system. The opioid growth factor receptor is an integral membrane protein associated with the nucleus.
