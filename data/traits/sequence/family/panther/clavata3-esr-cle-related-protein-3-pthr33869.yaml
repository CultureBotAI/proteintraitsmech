identifier: PANTHER:PTHR33869
label: "CLAVATA3/ESR (CLE)-RELATED PROTEIN 3"
definition: >-
  This entry includes CLAVATA3/ESR (CLE)-related proteins 1-4 (CLE1-4) from Arabidopsis and 33 from Medicago truncatula. They mimic host plant CLE extracellular signal peptides that regulate cell fat. CLE1 may play a role in the differentiation or division of feeding cells (syncytia) induced in plant roots during infection. CLE33 is a signaling peptide involved in the regulation of root colonization by arbuscular mycorrhizal (AM) fungi. It moves from root to shoot to function with the receptor kinase SUNN, in a signalling pathway that repress strigolactone biosynthetic genes and strigolactone content in the roots, and consequently reduces the promotion of further colonization by AM fungi. CLE proteins share a C-terminal CLE domain with CLV3, a small secreted polypeptide active as a ligand with a function in shoot apical meristem maintenance. CLE proteins are synthesised as precursors with an N-terminal signal peptide and are C-terminally processed to generate short bioactive peptides of approximately 12-14 amino acids. The mature peptides are secreted to the extracellular space where they function as signalling molecules in a variety of developmental and physiological processes. CLE peptides contain conserved hydroxyproline residues that undergo O-glycosylation with arabinose, which enhances receptor binding affinity. CLV3 and other A-type CLE peptides are involved in the suppression of stem cell development in root and shoot development, in contrast to the B-type CLE peptides CLE41 and CLE44 in Arabidopsis, which are not. In legumes, specific CLE peptides regulate nodulation through the SUNN receptor kinase pathway, controlling the autoregulation of nodulation to limit nodule numbers based on nitrogen availability, and some CLE peptides also regulate arbuscular mycorrhiz
