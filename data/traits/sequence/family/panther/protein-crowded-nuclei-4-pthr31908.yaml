identifier: PANTHER:PTHR31908
label: "PROTEIN CROWDED NUCLEI 4"
definition: >-
  CROWDED NUCLEI (CRWN) proteins, also known as LITTLE NUCLEI, are important architectural components of plant nuclei and are thought to play diverse roles in heterochromatin organization and the control of nuclear morphology. CRWN proteins regulate ABA-controlled seed germination by modulating the degradation of protein ABI5. CRWN3 has been shown to colocalize with ABI5 in nuclear bodies, where it might participate in its degradation. Proteins in this entry also include NMCP1A/B from rice. NMCP1B, also known as OsNMCP1, regulates drought resistance and root growth through chromatin accessibility.
