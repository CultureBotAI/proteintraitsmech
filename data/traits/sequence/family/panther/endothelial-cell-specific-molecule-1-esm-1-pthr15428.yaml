identifier: PANTHER:PTHR15428
label: "ENDOTHELIAL CELL-SPECIFIC MOLECULE 1  ESM-1"
definition: >-
  ESM1 (also known as endocan) is a proteoglycan expressed by the vascular endothelium. It may play an important role in regulating cell adhesion and raised plasma levels may reflect endothelial dysfunction.
