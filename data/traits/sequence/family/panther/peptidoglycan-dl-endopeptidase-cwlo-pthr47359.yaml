  - kind: GENERAL
    text: >-
      This family of proteins includes endopeptidases that play a role in bacterial cell wall metabolism. Members of this family are involved in the cleavage of peptidoglycan, specifically breaking the bond between D-glutamate and meso-diaminopimelate. This enzymatic activity is crucial for the proper separation of daughter cells following cell division, maintaining cell wall integrity, and is also implicated in host cell invasion. Some family members have been shown to bind high-molecular weight peptidoglycan without degrading it. Regulatory mechanisms for these proteins include modulation by other proteins, which can either enhance or inhibit their peptidoglycan degradation activity.
    source: "InterPro:IPR051794 abstract (LLM-generated, not curator-reviewed)"
