  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases and GTPase regulators, which are involved in a variety of cellular processes. The E3 ubiquitin-protein ligases in this family are responsible for the transfer of ubiquitin from E2 ubiquitin-conjugating enzymes to specific substrate proteins, which can lead to their degradation, alter their cellular location, affect their activity, or promote protein-protein interactions. This ubiquitination is crucial for many cellular processes, including protein trafficking and sperm maturation. The GTPase regulators are involved in ciliogenesis, the formation and maintenance of cilia, which are essential for cell motility and signaling. They may also play roles in microtubule organization, transport within primary cilia, photoreceptor integrity, and spermatogenesis. Additionally, some members of this family are implicated in innate antiviral responses and regulation of responses to pathogens.
    source: "InterPro:IPR051709 abstract (LLM-generated, not curator-reviewed)"
