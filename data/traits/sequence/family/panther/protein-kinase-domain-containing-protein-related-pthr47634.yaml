identifier: PANTHER:PTHR47634
label: "PROTEIN KINASE DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  PROTEIN KINASE DOMAIN-CONTAINING PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47634. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein. and participate in regulation of primary metabolic process, protein-RNA complex assembly, cellular component biogenesis.
