identifier: PANTHER:PTHR46079
label: "FERM DOMAIN-CONTAINING PROTEIN 4"
definition: >-
  This entry includes FRMD4A/B from humans and mice, and similar animal proteins. FERM domain-containing protein 4A (FRMD4A) is part of the Par-3/FRMD4A/cytohesin-1 complex that activates Arf6, a central player in actin cytoskeleton dynamics and membrane trafficking, during junctional remodelling and epithelial polarization. The Par-3/Par-6/aPKC/Cdc42 complex regulates the conversion of primordial adherens junctions (AJs) into belt-like AJs and the formation of linear actin cables. When primordial AJs are formed, Par-3 recruits scaffolding protein FRMD4A which connects Par-3 and the Arf6 guanine-nucleotide exchange factor (GEF), cytohesin-1. FERM domain-containing protein 4B (FRMD4B, also called GRP1-binding protein, GRSP1) is a novel member of GRP1 signalling complexes that are recruited to plasma membrane ruffles in response to insulin receptor signalling. The GRSP1/FRMD4B protein contains a FERM protein domain as well as two coiled coil domains and may function as a scaffolding protein. GRP1 and GRSP1 interact through the coiled coil domains in the two proteins.
