identifier: PANTHER:PTHR35801
label: "PHOSPHOSERINE PHOSPHATASE RSBX"
definition: >-
  Phosphatase RsbX from Bacillus subtilis is a negative regulator of sigma-B activity, a transcription factor that controls the general stress response. The activity of SigB is directly regulated under stress conditions by a signalling cascade composed of seven Rsb proteins (regulators of sigma B). RsbX halts the stress response by dephosphorylation of RsbS and/or RsbR.
