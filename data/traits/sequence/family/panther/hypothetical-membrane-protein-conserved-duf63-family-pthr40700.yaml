identifier: PANTHER:PTHR40700
label: "HYPOTHETICAL MEMBRANE PROTEIN, CONSERVED, DUF63 FAMILY"
definition: >-
  This entry represents AliA (HVO_2859, UniProtKB:D4GXF7) and AliB (HVO_2611, UniProtKB:D4GUE1) from Haloferax volcanii and similar uncharacterised transmembrane proteins from archaea, including Uncharacterized 12.3 kDa protein in fus 3'region and Uncharacterized protein MJ0440. AliA and AliB (Ali stands for archaeal lipoprotein biogenesis components) are important for lipoprotein lipidation as well as for for the organism's cell shape, growth and motility.
