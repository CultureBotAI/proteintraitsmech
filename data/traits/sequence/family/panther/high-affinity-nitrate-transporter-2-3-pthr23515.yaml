identifier: PANTHER:PTHR23515
label: "HIGH-AFFINITY NITRATE TRANSPORTER 2.3"
definition: >-
  This entry represents a group of nitrate transporters that belong to the Major Facilitator Superfamily (MFS) of membrane transport proteins. Proteins in this entry include high-affinity nitrate transporters NRT2 from plants, and nitrate/nitrite transporters NarK2/NarT/NasA/NarU from bacteria. NRT2 family proteins are involved in the uptake of nitrate by plant roots from the soil through the high-affinity transport system (HATS). There are seven Arabidopsis thaliana NRT2 proteins, called AtNRT2:1 to AtNRT2:7. This entry also includes fungal nitrate transporters such as CRNA from Emericella nidulans.
definition_source: "InterPro:IPR044772 abstract (PANTHER PTHR23515 is a member signature)"
