identifier: PANTHER:PTHR43732
label: "RIBOSE 5-PHOSPHATE ISOMERASE-RELATED"
definition: >-
  This family of proteins includes enzymes that are involved in the isomerization of sugar phosphates, which is a critical step in various metabolic pathways. Members of this family catalyze the conversion of D-erythrulose 4-phosphate to D-erythrose 4-phosphate, a reaction that is part of the catabolism of D-apiose and other sugar alcohols like erythritol, L-threitol, and D-threitol. This allows certain bacteria to utilize these compounds as their sole carbon source. Some family members also catalyze the interconversion of ribulose-5-phosphate and ribose-5-phosphate, which is an important reaction in the pentose phosphate pathway. The activity of these enzymes can be regulated by various metabolites, indicating their role in the fine-tuning of cellular metabolic fluxes.
