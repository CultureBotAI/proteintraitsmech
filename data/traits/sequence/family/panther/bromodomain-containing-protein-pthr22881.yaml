  - kind: GENERAL
    text: >-
      The Bromodomain-containing protein family is involved in chromatin remodeling and regulation of transcription. Members act as coactivators and corepressors, influencing the expression of target genes. They bind to promoters, modulating histone acetylation, particularly at 'Lys-9' (H3K9ac), and recruit various proteins like BRCA1 and POU2F1. Some family members activate the Wnt signaling pathway by interacting with DVL1 and negatively regulating GSK3B, leading to dephosphorylation at 'Tyr-216'. They also play roles in cell cycle control, particularly in TP53-mediated cell-cycle arrest and transcriptional activation of TP53 target genes, promoting TP53 acetylation for efficient DNA binding. Additionally, certain members are involved in homologous recombination by orchestrating RAD51-RAD54 complex formation.
    source: "InterPro:IPR051831 abstract (LLM-generated, not curator-reviewed)"
