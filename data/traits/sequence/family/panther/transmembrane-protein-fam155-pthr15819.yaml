identifier: PANTHER:PTHR15819
label: "TRANSMEMBRANE PROTEIN FAM155"
definition: >-
  This family of proteins includes auxiliary components of the NALCN sodium channel complex, NALF1/2. These proteins are involved in regulating the resting membrane potential and controlling neuronal excitability. They are likely to interact with the NALCN channel to modulate its function and play a crucial role in maintaining the electrical stability of neurons.
