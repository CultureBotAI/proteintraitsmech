identifier: PANTHER:PTHR39517
label: "SLL0192 PROTEIN"
definition: >-
  This entry represents a family of proteins mainly found in cyanobacterial species, in one or two copies. These proteins show some sequence similarity, especially toward the C terminus, to lipid-A-disaccharide synthase ( InterPro:IPR003835 or InterPro:IPR003835 ). The function is unknown.
