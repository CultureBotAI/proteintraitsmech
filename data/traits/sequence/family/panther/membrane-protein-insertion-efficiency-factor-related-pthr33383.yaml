identifier: PANTHER:PTHR33383
label: "MEMBRANE PROTEIN INSERTION EFFICIENCY FACTOR-RELATED"
definition: >-
  This family consists of membrane insertion efficiency factor proteins, such as YidD which may be involved in insertion of integral membrane proteins into the membrane. They contain three conserved cysteine residues.
