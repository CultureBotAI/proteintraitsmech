  - kind: GENERAL
    text: >-
      The protein family is involved in various signaling pathways critical for embryonic development and cellular functions. Members of the family serve as ligands, coreceptors, or inhibitors in processes such as mesoderm segmentation, Nodal signaling, and establishment of the left-right axis during gastrulation. Some proteins bind to WNT proteins, inhibiting their activities, while others are involved in Notch signaling, contributing to cell fate determination and organogenesis. Additionally, family members regulate vascular tubulogenesis and angiogenesis, influencing cell migration and adhesion to the extracellular matrix. The family also includes proteins that stabilize morphogen interactions, playing roles in patterning and growth control.
