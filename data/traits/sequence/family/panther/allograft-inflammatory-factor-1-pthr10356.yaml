identifier: PANTHER:PTHR10356
label: "ALLOGRAFT INFLAMMATORY FACTOR-1"
definition: >-
  This entry includes AIF1 (also know as Iba1, ionized calcium-binding adapter molecule 1) and AIF1L (Iba2) from humans. They are actin-binding proteins. AIF1 has been shown to promote vascular smooth muscle cell migration. AIF1L is involved in the stabilization of podocyte morphology by titrating actomyosin contractility and membrane dynamics. This entry also includes calcium-binding protein B from Dictyostelium discoideum.
