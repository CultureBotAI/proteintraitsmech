  - kind: GENERAL
    text: >-
      This family of proteins is involved in the binding and transport of folic acid, a vital nutrient. Members are implicated in the uptake and accumulation of folic acid within cells, particularly in response to salicylic acid-induced signals. They may play a role in the distribution of folates, facilitating their movement from production sites, such as leaves, to areas of storage and use, including fruits, seeds, and roots. The function suggests a significant role in the plant's folate homeostasis and overall nutritional status.
