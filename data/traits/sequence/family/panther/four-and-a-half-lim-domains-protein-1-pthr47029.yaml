identifier: PANTHER:PTHR47029
label: "FOUR AND A HALF LIM DOMAINS PROTEIN 1"
definition: >-
  Four and a half LIM domains protein 1 (FHL1) play an essential role in skeletal muscle growth and differentiation, acts as a scaffolding protein in sarcomere assembly and is a regulator of skeletal muscle mass and energy metabolism. It has been shown to bind to Myosin-binding protein C, regulating myosin filament formation and sarcomere assembly. Mutations of the FHL1 gene cause skeletal and heart muscle myopathy. It contains an N-terminal zinc finger/half LIM domain, followed by 4 complete LIM domains.
