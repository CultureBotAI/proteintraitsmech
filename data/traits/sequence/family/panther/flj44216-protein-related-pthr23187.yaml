      FLJ44216 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23187.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes scaffold proteins that bridge the PRC2/EZH2 complex with the elongin BC complex, regulating transcriptional status of PcG target genes in ESCs. They maintain low expression levels at PcG targets by recruiting elongin BC, limiting PRC2/EZH2 activity. They also interact with USP7, leading to H2B deubiquitination at promoters, and play a role in neuronal differentiation. Other members inhibit CAPN3 protease activity and are involved in SMC5-SMC6 complex recruitment for viral restriction and PML nuclear body localization. Additionally, they form a complex with SLF2 for SMC5-SMC6 recruitment to viral replication sites. The family also includes proteins belonging to the DACH/dachshund family, suggesting a diversity of functions.
    source: "InterPro:IPR052119 abstract (LLM-generated, not curator-reviewed)"
