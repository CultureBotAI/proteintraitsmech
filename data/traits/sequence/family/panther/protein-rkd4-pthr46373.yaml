identifier: PANTHER:PTHR46373
label: "PROTEIN RKD4"
definition: >-
  This entry represents a group of transcription factors, including RWP-RK domain-containing RKD1-5 from Arabidopsis. RKD1-5 are involved in the control of cell differentiation and are required for normal gametophytic development in Arabidopsis.
