identifier: PANTHER:PTHR23167
label: "CALPONIN HOMOLOGY DOMAIN-CONTAINING PROTEIN DDB_G0272472-RELATED"
definition: >-
  The Mical family proteins are multifunctional monooxygenases that mediate the depolymerization of F-actin by oxidizing specific methionine residues on actin, leading to actin filament disassembly and preventing repolymerization. They play a crucial role in various cellular processes, including cytoskeletal regulation, cell adhesion, migration, cytokinesis, and vesicle trafficking. Mical proteins are also involved in the regulation of the SRF signaling pathway, affecting gene transcription. Additionally, they function as Rab effector proteins, influencing vesicle transport and endocytic recycling. The family includes proteins that interact with components of the actin cytoskeleton and cell junctions, contributing to cell morphology, neurite outgrowth, and the assembly of junctional complexes.
