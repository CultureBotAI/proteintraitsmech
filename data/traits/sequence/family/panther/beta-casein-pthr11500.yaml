identifier: PANTHER:PTHR11500
label: "BETA CASEIN"
definition: >-
  This group represents the milk protein beta-casein. The protein binds to calcium at its phosphorylated regions. The calcium then binds the caseins together and forms micelles. Beta-casein has as important role in the determination of the surface properties of the micelles.
