identifier: PANTHER:PTHR27005
label: "WALL-ASSOCIATED RECEPTOR KINASE-LIKE 21"
definition: >-
  This entry represents a group of plant receptor-like kinases, including Wall-associated receptor kinases (WAKs) and ZRKs. ZRKs may be pseudokinases. ZRK3 is required for RPP13L4/ZAR1 recognition of the Pseudomonas syringae type III effector (T3E) HopF2a. ZED1 works with RPP13L4/ZAR1 and is involved in the ambient temperature-sensitive aerial organ development and in the plant immune system. The WAKs are wall-associated kinases that bind to pectin and regulate cell expansion or stress responses. Some WAKs may mediate resistance to diseases caused by biotrophic/hemibiotrophic pathogens in several plant species.
definition_source: "InterPro:IPR045274 abstract (PANTHER PTHR27005 is a member signature)"
