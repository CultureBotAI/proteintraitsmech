identifier: PANTHER:PTHR12236
label: "STRUCTURAL CONTITUENT OF CUTICLE"
definition: >-
  The Cuticle Protein family comprises structural proteins that are integral components of the protective cuticle layer in various insect species. These proteins play a crucial role in determining the physical properties of the cuticle, such as stiffness, elasticity, and resilience, which are essential for insect survival and functions like locomotion and flight. The family is characterized by the presence of tetrapeptide (A-A-P-[AV]) repeats, which are a common feature in the envelope proteins of different species, suggesting a conserved role in cuticle formation and maintenance. The family includes proteins from the cuticle of migratory locusts, African malaria mosquitoes, and the larvae and pupae of other insects, each contributing to the structural integrity of their respective cuticle layers.
