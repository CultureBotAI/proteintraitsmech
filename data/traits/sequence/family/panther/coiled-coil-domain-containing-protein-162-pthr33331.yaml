identifier: PANTHER:PTHR33331
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 162"
definition: >-
  CCDC162 is a protein characterised by the presence of multiple coiled-coil regions, including predicted coiled-coil domains at the N-terminal region and in the middle portion of the protein. The protein undergoes extensive alternative splicing, producing at least four named isoforms with significant structural variation. Some isoforms show major deletions affecting large portions of the protein sequence. The protein has been identified by mass spectrometry and shows broad tissue expression patterns.
definition_source: "InterPro:IPR040401 abstract (PANTHER PTHR33331 is a member signature)"
