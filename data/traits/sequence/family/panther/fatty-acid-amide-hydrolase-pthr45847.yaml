identifier: PANTHER:PTHR45847
label: "FATTY ACID AMIDE HYDROLASE"
definition: >-
  This family of proteins includes enzymes that hydrolyze endogenous amidated lipids, such as the endocannabinoid anandamide and other fatty amides, to their corresponding fatty acids. This hydrolytic activity regulates the signaling functions of these molecules, which are involved in various physiological processes including sleep induction, pain modulation, and inflammation. Some family members also hydrolyze monoacylglycerides like 2-arachidonoylglycerol, influencing the degradation of endocannabinoid-related monoacylglycerides. Additionally, these enzymes cooperate with PM20D1 in the hydrolysis of amino acid-conjugated fatty acids, acting as physiological regulators of specific subsets of intracellular N-fatty acyl amino acids. They play roles in longevity, resistance to oxidative stress, and axon regeneration after injury. The family is characterized by its membership in the amidase enzyme family and is subject to inhibition by various compounds.
