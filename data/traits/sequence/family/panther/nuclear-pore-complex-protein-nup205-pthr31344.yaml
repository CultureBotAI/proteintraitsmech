identifier: PANTHER:PTHR31344
label: "NUCLEAR PORE COMPLEX PROTEIN NUP205"
definition: >-
  Proteins in this family are components of the nuclear pore complex (NPC). These protein are called nucleoporins (NUPs), which can play the role of both NPC structural components and of docking or interaction partners for transiently associated nuclear transport factors. This entry includes Nup186/Nup192/Nup205. In budding yeasts, Nup192 is located to the NPC core at the nuclear membrane and is essential for de novo assembly of NPCs. In humans, Nup205 forms a complex with NUP53, NUP93, NUP155 and lamin B.
