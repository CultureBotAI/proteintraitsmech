identifier: PANTHER:PTHR46530
label: "PROTEIN MONO-ADP-RIBOSYLTRANSFERASE PARP4"
definition: >-
  PARP4, also known as vPARP, is the largest member of the poly-ADP-ribose polymerase (PARP) family and exhibits both poly- and mono-ADP-ribosylation activity. It catalyzes the transfer of ADP-ribose units to target proteins, influencing various cellular processes. PARP4 can PARylate major vault protein (MVP) and, to a lesser extent, itself. It is a core component of the vault ribonucleoprotein particle, one of the largest ribonucleoprotein complexes in eukaryotic cells, alongside MVP, vault RNAs (vRNAs), and TEP1. Its interaction with TEP1 suggests potential roles in cellular transport or signaling pathways. Poly(ADP-ribosyl)ation (PARylation) is a post-translational modification of proteins. PARP family members are PAR polymerases that initiate the reaction by converting the substrate nicotinamide adenine dinucleotide (NAD+) to ADP-ribose, and then catalyse ADP-ribose polymerisation on nuclear acceptor proteins.
definition_source: "InterPro:IPR031273 abstract (PANTHER PTHR46530 is a member signature)"
