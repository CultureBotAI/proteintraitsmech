  - kind: GENERAL
    text: >-
      This family of proteins includes toxins that exhibit a range of biological activities, primarily associated with cytolytic functions. They are capable of forming pores in cell membranes, leading to hemolytic activity. These proteins are known to interact with erythrocytes, inducing potent hemolysis and displaying cardiovascular effects, such as vasorelaxation potentially via the L-arginine-nitric oxide synthase pathway. They also have edema-inducing properties, increase vascular permeability, show myotoxicity, and interfere with neuromuscular function. Some family members are known to induce platelet aggregation in certain mammals and increase neurotransmitter release at neuromuscular junctions. Their structure typically includes domains homologous to MACPF/CDC, FAT, thioredoxin, and B30.2/SPRY, which contribute to their interaction with cell membranes and structural integrity.
    source: "InterPro:IPR052090 abstract (LLM-generated, not curator-reviewed)"
