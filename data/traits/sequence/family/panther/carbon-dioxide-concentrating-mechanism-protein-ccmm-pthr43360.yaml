  - kind: GENERAL
    text: >-
      The gamma-class carbonic anhydrase family is involved in the reversible hydration of carbon dioxide, which is essential for photosynthetic carbon dioxide fixation in organisms that grow on acetate. Members of the family function as scaffold proteins for the assembly of beta-carboxysomes, structures that concentrate carbon dioxide for efficient fixation by RuBisCO. The family includes proteins that may support H(+)/CH(3)COO(-) symport mechanisms or convert CO(2) to HCO(3)(-), thus managing excess CO(2). Some members possess a carbonic anhydrase-like domain at the N-terminus and RuBisCO small subunit-like (SSUL) domains at the C-terminus, which bind and coalesce RuBisCO. The activity of these carbonic anhydrases is regulated by redox conditions and can be inhibited by certain agents. The family plays a crucial role in the formation and function of carboxysomes, impacting the photosynthetic efficiency and growth of the organisms.
    source: "InterPro:IPR052265 abstract (LLM-generated, not curator-reviewed)"
