      CYTOCHROME BO(3) UBIQUINOL OXIDASE SUBUNIT 4 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36835. PANTHER protein class: oxidase, oxidoreductase. Members are annotated with the molecular function proton transmembrane transporter activity, primary active transmembrane transporter activity, oxidoreductase activity. Members participate in proton transmembrane transport, aerobic electron transport chain, oxidative phosphorylation. Members localise to transmembrane transporter complex, plasma membrane, cytochrome complex.
