  - kind: GENERAL
    text: >-
      CYTOCHROME BO(3) UBIQUINOL OXIDASE SUBUNIT 4 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36835. PANTHER protein class: oxidase, oxidoreductase. Members are annotated with the molecular function primary active transmembrane transporter activity, electron transfer activity, catalytic activity. and participate in monoatomic cation transport, proton transmembrane transport, respiratory electron transport chain. and localise to membrane protein complex, cytochrome complex, catalytic complex.
