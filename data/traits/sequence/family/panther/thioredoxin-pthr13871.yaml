    text: >-
      This family of proteins includes probable thiol-disulfide oxidoreductases that are likely involved in various redox reactions. Members of this family may function in processes such as pollen tube growth and pollen function in plants, although some members do not require this activity for in vitro pollen tube growth. They may also be involved in the generation of lipid signaling molecules.
