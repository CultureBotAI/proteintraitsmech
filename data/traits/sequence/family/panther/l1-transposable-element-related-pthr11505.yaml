identifier: PANTHER:PTHR11505
label: "L1 TRANSPOSABLE ELEMENT-RELATED"
definition: >-
  Many human L1 elements are capable of retrotransposition. Some of these have been shown to exhibit reverse transcriptase (RT) activity. This entry includes L1RE1 and L1TD1 from human. L1RE1 is essential for retrotransposition of LINE-1 elements in the genome. It functions as a nucleic acid chaperone binding its own transcript and therefore preferentially mobilizing the transcript from which they are encoded. L1TD1 plays an important role in the regulation of stemness, being required for human embryonic stem cells (hESC) self-renewal and cancer cell proliferation..
