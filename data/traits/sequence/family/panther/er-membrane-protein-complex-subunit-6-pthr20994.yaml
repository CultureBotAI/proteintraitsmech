identifier: PANTHER:PTHR20994
label: "ER MEMBRANE PROTEIN COMPLEX SUBUNIT 6"
definition: >-
  This entry represents ER membrane protein complex subunit 6 (Emc6). Emc6 is a component of the ER membrane protein complex (EMC), which is composed of Emc1, Emc2, Emc3, Emc4, Emc5 and Emc6 in budding yeast. The EMC complex is required for efficient folding of proteins in the ER and enables the energy-independent insertion into endoplasmic reticulum membranes of newly synthesized membrane proteins.
