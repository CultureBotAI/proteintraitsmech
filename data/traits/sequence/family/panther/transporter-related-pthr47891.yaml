identifier: PANTHER:PTHR47891
label: TRANSPORTER-RELATED
definition: >-
  This entry represents a group of uncharacterised bacterial sequences related to the Escherichia coli CorA-Salmonella typhimurium ZntB (EcCorA-ZntB_like) family of the MIT superfamily of essential membrane proteins involved in transporting divalent cations (uptake or efflux) across membranes. The functional diversity of MIT transporters may also be due to minor structural differences regulating gating, substrate selection, and transport.
