identifier: PANTHER:PTHR15576
label: "RIBITOL-5-PHOSPHATE XYLOSYLTRANSFERASE 1"
definition: >-
  This entry represents human Ribitol-5-phosphate xylosyltransferase 1 (RXYLT1) and similar proteins predominantly found in animals. RXYLT1 acts as a UDP-D-xylose:ribitol-5-phosphate beta1,4-xylosyltransferase, which catalyses the transfer of UDP-D-xylose to ribitol 5-phosphate (Rbo5P) to form the Xylbeta1-4Rbo5P linkage on O-mannosyl glycan.
definition_source: "InterPro:IPR055286 abstract (PANTHER PTHR15576 is a member signature)"
