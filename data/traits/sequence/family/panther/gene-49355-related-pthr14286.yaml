identifier: PANTHER:PTHR14286
label: "GENE, 49355-RELATED"
definition: >-
  This entry represents Centrosomal protein 15 (CEP15) and similar proteins from animals. In humans, CEP15 (also known as C3orf14) has been found to interact with CEP89 protein at the centrosome-cilium interface. This family was formerly known as DUF4570.
