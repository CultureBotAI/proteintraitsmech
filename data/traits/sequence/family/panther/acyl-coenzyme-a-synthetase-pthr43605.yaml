definitions:
  - kind: GENERAL
    text: >-
      ACYL-COENZYME A SYNTHETASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43605. PANTHER protein class: ligase, metabolite interconversion enzyme. Members are annotated with the molecular function acyltransferase activity, acyltransferase activity, transferring groups other than amino-acyl groups, ATP-dependent activity. and participate in organic acid biosynthetic process, sulfur compound metabolic process, ribose phosphate metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The ACSM family catalyzes the activation of fatty acids by CoA to form acyl-CoA, a crucial step in fatty acid metabolism. Members of this family are capable of activating medium-chain fatty acids, with some showing specificity for C6-12 fatty acids or a preference for isobutyrate among C2-6 fatty acids. Additionally, certain members can activate carboxylate-containing xenobiotics, such as benzoate, and lipoate to lipoyl-nucleoside monophosphate. Lipoate activation is more efficient with GTP, particularly for the (R)-enantiomer. The family is characterized by its membership in the ATP-dependent AMP-binding enzyme family and is regulated by monovalent cations like potassium and rubidium.
    source: "InterPro:IPR051087 abstract (LLM-generated, not curator-reviewed)"
