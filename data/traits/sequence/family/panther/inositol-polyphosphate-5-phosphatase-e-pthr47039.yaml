  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of phosphoinositide composition within cellular membranes. Members of this family act as enzymes that modify phosphatidylinositol phosphates by removing a phosphate group. Specifically, they convert phosphatidylinositol 3,4,5-trisphosphate to a bisphosphate form and phosphatidylinositol 4,5-bisphosphate to a monophosphate form. Through these enzymatic activities, they play a crucial role in the modulation of cilia membrane composition in auditory receptor neurons, which is essential for the proper localization of specific proteins and the function of ion channels within the cilia.
    source: "InterPro:IPR053321 abstract (LLM-generated, not curator-reviewed)"
