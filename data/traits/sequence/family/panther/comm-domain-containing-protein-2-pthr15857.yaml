identifier: PANTHER:PTHR15857
label: "COMM DOMAIN CONTAINING PROTEIN 2"
definition: >-
  COMMD2 is a member of the COMMD family defined by the presence of a conserved and unique motif termed the COMM (copper metabolism gene MURR1) domain, which functions as an interface for protein-protein interactions. Several family members have been shown to bind and inhibit NF-kappaB.
