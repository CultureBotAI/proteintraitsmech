identifier: PANTHER:PTHR45826
label: "POLYAMINE TRANSPORTER PUT1"
definition: >-
  This entry represents a group of amino acid and polyamine transporters from bacteria and plants, including RMV1 from Arabidopsis and PUT1 from rice. RMV1 and PUT1 are polyamine transporters involved in the polyamine uptake in cells.
