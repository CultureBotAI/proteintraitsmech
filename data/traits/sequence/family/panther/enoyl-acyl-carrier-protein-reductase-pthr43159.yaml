identifier: PANTHER:PTHR43159
label: "ENOYL-[ACYL-CARRIER-PROTEIN] REDUCTASE"
definition: >-
  This entry contains enoyl-[acyl-carrier-protein] reductases (EC:1.3.1.9). They are components of the type II (dissociable) fatty acid synthase system and catalyse the terminal reaction in the fatty acid elongation cycle. They belong to the short-chain dehydrogenases/reductases (SDR) domain superfamily. Crystal structures of these proteins have been extensively studied.
