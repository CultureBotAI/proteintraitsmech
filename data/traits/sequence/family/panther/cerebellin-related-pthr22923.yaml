identifier: PANTHER:PTHR22923
label: CEREBELLIN-RELATED
definition: >-
  The cerebellin family proteins are involved in the organization and modulation of synapses in the central nervous system (CNS). They play crucial roles in synapse integrity, synaptic plasticity, and the maintenance of excitatory synapses, but are not essential for their establishment. Cerebellins act as synaptic organizers, influencing both pre- and post-synaptic components. They are involved in the formation and maintenance of specific types of synapses, such as parallel fiber-Purkinje cell synapses in the cerebellum and inhibitory GABAergic synapses. Some family members also exhibit neuromodulatory functions, such as stimulating norepinephrine release and enhancing adrenocortical secretion. Additionally, certain cerebellins may regulate the number of excitatory synapses on hippocampus neurons and play roles in glucose homeostasis and energy balance regulation.
