identifier: PANTHER:PTHR43174
label: "UDP-N-ACETYLGLUCOSAMINE 2-EPIMERASE"
definition: >-
  This entry includes UDP-N-acetylglucosamine 2-epimerase WecB from Enterobacteriaceae and UDP-2,3-diacetamido-2,3-dideoxy-D-glucuronate 2-epimerase WbpI from Pseudomonas aeruginosa. WecB is involved in the enterobacterial common antigen biosynthesis, which is part of bacterial outer membrane biogenesis. It catalyses the reversible epimerization at C-2 of UDP-N-acetylglucosamine (UDP-GlcNAc) and thereby provides bacteria with UDP-N-acetylmannosamine (UDP-ManNAc), the activated donor of ManNAc residues. WbpI is involved in the LPS O-antigen biosynthesis, which is part of bacterial outer membrane biogenesis. It catalyses the epimerization of UDP-2,3-diacetamido-2,3-dideoxy-alpha-D-glucuronic acid (UDP-alpha-D-GlcNAc3NAcA) to UDP-2,3-diacetamido-2,3-dideoxy-alpha-D-mannuronic acid (UDP-alpha-D-ManNAc3NAcA). This entry also includes UDP-N-acetylglucosamine 2-epimerase homolog from Methanococcus maripaludis at locus MMP0357 which despite its similarity with the UDP-N-acetylglucosamine 2-epimerase enzymes, does not possess detectable UDP-GlcNAc 2-epimerase activity
definition_source: "InterPro:IPR029767 abstract (PANTHER PTHR43174 is a member signature)"
