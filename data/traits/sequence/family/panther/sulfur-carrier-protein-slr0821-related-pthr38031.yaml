  - kind: GENERAL
    text: >-
      This family of proteins includes sulfur carrier components that are involved in cysteine biosynthesis and protein modification processes. In certain members, the thiocarboxylated form acts as a sulfur donor in a pathway dependent on CysM for cysteine production, which is crucial for survival in specific bacterial phases. Other members function as protein modifiers, attaching covalently to lysine residues of substrate proteins through a process known as sampylation, which may involve the formation of isopeptide bonds. Some are also implicated in the regulation of molybdenum cofactor biosynthesis and may influence proteolytic signaling for protein degradation.
