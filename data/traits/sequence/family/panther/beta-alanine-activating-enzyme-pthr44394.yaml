  - kind: GENERAL
    text: >-
      The Beta-alanine-activating enzyme family is involved in the ATP-dependent activation of beta-alanine, a process that forms a thioester bond with the enzyme's phosphopantetheine group. The activated beta-alanine is then transferred to an unknown acceptor, which may be part of a post-translational protein modification or post-transcriptional RNA modification pathway. Additionally, a member of the family catalyzes the condensation of beta-alanine with tryptamine, producing a pheromone essential for stimulating female sexual development during pairing. Another family member is implicated in providing resistance to desiccation and radiation, potentially by protecting genomic integrity under extreme conditions. Overall, the family encompasses enzymes with diverse functions, including activation of beta-alanine, synthesis of nonribosomal peptides, and stress response mechanisms.
    source: "InterPro:IPR052091 abstract (LLM-generated, not curator-reviewed)"
