identifier: PANTHER:PTHR39569
label: "INORGANIC TRIPHOSPHATASE"
definition: >-
  YgiF from E. coli is a specific inorganic triphosphatase (PPPase). Inorganic pyrophosphatase (PPase) is the main enzyme responsible for hydrolysis of PPPi, whereas YgiF contributes only marginally to the total PPPase activity in this organism. PPPi could be cytotoxic because of its high affinity for calcium ion, thereby interfering with calcium signaling.
