identifier: PANTHER:PTHR12949
label: "RNA POLYMERASE III  DNA DIRECTED -RELATED"
definition: >-
  This entry represents RPC3, a subunit of the DNA-directed RNA polymerase III. In yeast this subunit is also known as Rpc82, and in animals as Rpc62. Human Rpc62 has been shown to bind ssDNA (single-stranded DNA).
