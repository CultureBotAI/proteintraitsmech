identifier: PANTHER:PTHR30013
label: "NIFE / NIFESE HYDROGENASE SMALL SUBUNIT FAMILY MEMBER"
definition: >-
  Hydrogenases catalyse the reversible oxidation of molecular hydrogen and play a vital role in anaerobic metabolism. Metal-containing hydrogenases are subdivided into three classes: Fe ('iron only') hydrogenases; Ni-Fe hydrogenases; and Ni-Fe-Se hydrogenases. Hydrogen oxidation is coupled to the reduction of electron acceptors (such as oxygen, nitrate, sulphate, carbon dioxide and fumarate), whereas proton reduction (hydrogen evolution) is essential in pyruvate fermentation or in the disposal of excess electrons. The Ni-Fe hydrogenases, when isolated, are found to catalyse both hydrogen evolution and uptake, with low-potential multihaem cytochromes, such as cytochrome c3, acting as either electron donors or acceptors, depending on their oxidation state. Both periplasmic (soluble) and membrane-bound hydrogenases are known. The Ni-Fe hydrogenases are heterodimeric proteins consisting of small (S) and large (L) subunits. The small subunit contains three iron-sulphur clusters (two [4Fe-4S] and one [3Fe-4S]); the large subunit contains a nickel ion. Small subunits of membrane-bound Ni-Fe hydrogenases contain a C-terminal domain of about 40 residues that is absent in periplasmic forms. The 3D structure of the Ni-Fe hydrogenase from Desulfovibrio gigas has been determined at 2.85A resolution. The small subunit consists of two domains, I(S) and II(S). The α/β twisted open sheet structure of the N-terminal I(S) domain is similar to that of flavodoxin; the C-terminal II(S) domain contains two α-helices and has no β-structure. The Fe-S clusters are distributed almost along a straight line, with the [3Fe-4S] cluster located half-way between the two [4Fe-4S] clusters. The two [4Fe-4S] clusters have been termed proximal (prox) and distal (dist), based on their distance to the Ni atom.
