identifier: PANTHER:PTHR45829
label: "MITOCHONDRIAL CARRIER PROTEIN RIM2"
definition: >-
  This family includes a group of mitochondrial carrier proteins from the solute carrier family 25, including the mammalian members SLC25A33/36, its homologues from yeast and Drosphila Rim2 protein. SLC25A33/36 import/export pyrimidine nucleotides into and from mitochondria. They selectively transport uridine, thymidine, guanosine, cytosine and inosine (deoxy)nucleoside di- and triphosphates by an antiport mechanism. They may also participate in mitochondrial genome maintenance, regulation of mitochondrial membrane potential and mitochondrial respiration.
