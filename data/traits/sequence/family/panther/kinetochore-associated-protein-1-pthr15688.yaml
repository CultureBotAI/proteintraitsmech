identifier: PANTHER:PTHR15688
label: "KINETOCHORE-ASSOCIATED PROTEIN 1"
definition: >-
  This entry includes KNTC1 (also known as ROD) proteins, a crucial component of the mitotic checkpoint, ensuring cells do not exit mitosis prematurely. KNTC1 is required for the assembly of essential complexes onto kinetochores, including dynein-dynactin and MAD1-MAD2 in mammals, and dynein-dynactin and mdf-1-mdf-2 in C. elegans. KNTC1 is the major subunit of the RZZ (ROD-Zwilch-ZW10) complex, which plays a significant role in spindle assembly, kinetochore-microtubule attachment, and spindle pole separation. The RZZ complex also recruits proteins like spdl-1 to kinetochores, regulates the attachment of the NDC80 complex to microtubules, and is implicated in nuclear envelope breakdown. These proteins are vital for chromosome segregation, embryonic development, and maintaining genomic stability during cell division.
definition_source: "InterPro:IPR052802 abstract (PANTHER PTHR15688 is a member signature)"
