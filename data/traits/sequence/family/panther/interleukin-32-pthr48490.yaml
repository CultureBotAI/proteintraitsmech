identifier: PANTHER:PTHR48490
label: INTERLEUKIN-32
definition: >-
  This entry represents interleukin-32, it is a proinflammatory cytokine with a folding structure that does not resemble that of any classical cytokine. It may have a role in a range of diseases, including infections, chronic inflammation, and cancer.
