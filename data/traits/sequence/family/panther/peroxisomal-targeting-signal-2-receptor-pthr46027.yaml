identifier: PANTHER:PTHR46027
label: "PEROXISOMAL TARGETING SIGNAL 2 RECEPTOR"
definition: >-
  This entry represents PEX7 from eukaryotes. In plants it plays important roles in embryonic development, seedling establishment, and vegetative growth. Budding yeast PEX7 homologue, Pas7, is necessary for the import of thiolase (a PTS2-containing protein). In humans PEX7 has been linked to several diseases, such as Rhizomelic chondrodysplasia punctata 1 (RCDP1) and Peroxisome biogenesis disorder 9B (PBD9B). Peroxisomal proteins catalyse metabolic reactions. The import of proteins from the cytosol into the peroxisomes matrix depends on more than a dozen peroxin (PEX) proteins, among which PEX5 and PEX7 serve as receptors that shuttle proteins bearing one of two peroxisome-targeting signals (PTSs) into the organelle. PEX5 is the PTS1 receptor, while PEX7 is the PTS2 receptor. In plants, PEX7 depends on PEX5 binding to deliver PTS2 cargo into the peroxisome, and PEX7 also facilitates PEX5 accumulation and import of PTS1 cargo into peroxisomes. In parasites PEX7 is also known as Glycosomal targeting signal 2 receptor. It is required for the glycosomal import of proteins containing an N-terminal PTS2-type targeting signal, such as fructose-1,6-bisphosphate aldolase.
definition_source: "InterPro:IPR044536 abstract (PANTHER PTHR46027 is a member signature)"
