identifier: PANTHER:PTHR41260
label: "PROTEIN ECSC"
definition: >-
  Proteins in this family are related to EcsC from Bacillus subtilis. This protein is found in an operon with EcsA and EcsB which are components of an ABC transport system. The function of this protein is unknown.
