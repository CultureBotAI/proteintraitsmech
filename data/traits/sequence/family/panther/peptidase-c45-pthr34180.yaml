identifier: PANTHER:PTHR34180
label: "PEPTIDASE C45"
definition: >-
  This entry represents hydrolases and N-acyltransferases that belong to the Ntn (N-terminal nucleophile) hydrolase family, described by MEROPs as a cysteine protease, family C45, because of its autoproteolytic activity. Members have an invariant Cys residue required both for autoproteolytic processing into alpha and beta chains and for activity. Characterised members include TAN from Drosophila, which removes beta-alanine from both carcinine and N-beta-alanyl dopamine, and isopenicillin-N N-acyltransferase from various fungi. The latter has been heavily studied because of its role in penicillin biosynthesis.
definition_source: "InterPro:IPR047801 abstract (PANTHER PTHR34180 is a member signature)"
