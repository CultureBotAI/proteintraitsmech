identifier: PANTHER:PTHR31568
label: "RCG49325, ISOFORM CRA_A"
definition: >-
  This entry represents a group of cysteine-rich and transmembrane domain-containing proteins, including WIH1 (also known as CYSTEINE-RICH TRANSMEMBRANE MODULE 13), At3g57160 and CYSTEINE-RICH TRANSMEMBRANE MODULE (CYSTM) 1, 3-6 and 8 from Arabidopsis. WIH1 is required for the promotion of megasporogenesis, or promotion of germ cell formation from somatic precursor cells. It functions in a genetic pathway downstream of SPL/NZZ and WUS and together with TORNADO2 (TRN2) in promoting megasporogenesis. WIH1 is also involved in resistance to abiotic stress. CYSTMs, are ubiquitous non-secreted cysteine-rich proteins, which play an important role in resistance to abiotic stress. CYSTM3 negatively regulates salt stress responses and Na+ homeostasis.
definition_source: "InterPro:IPR044850 abstract (PANTHER PTHR31568 is a member signature)"
