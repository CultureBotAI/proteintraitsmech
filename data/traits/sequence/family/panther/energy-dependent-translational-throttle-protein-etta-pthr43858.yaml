identifier: PANTHER:PTHR43858
label: "ENERGY-DEPENDENT TRANSLATIONAL THROTTLE PROTEIN ETTA"
definition: >-
  ABC-F proteins compose one of the most widely distributed branches of the ATP-binding cassette (ABC) superfamily. EttA/YjjK is the most prevalent eubacterial ABC-F protein. Its role consists in gating ribosome entry into the translation elongation cycle through a nucleotide-dependent interaction sensitive to ATP/ADP ratio. The ATP-bound form of EttA binds to the ribosomal tRNA-exit site, and forms a bridge between the ribosomal L1 stalk and the tRNA bound in the peptidyl-tRNA-binding site. EttA may regulate protein synthesis in energy-depleted cells, which have a low ATP/ADP ratio.
