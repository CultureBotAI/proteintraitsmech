  - kind: GENERAL
    text: >-
      This family of proteins includes subunits of enzyme complexes involved in energy metabolism, such as hydrogenases and NADH-ubiquinone oxidoreductase (complex I). They play roles in redox reactions, coupling these to proton translocation across membranes, which is essential for energy conservation in the form of proton gradients. Some members are involved in the oxidation of carbon monoxide, which is coupled to the reduction of protons by a hydrogenase. The family is characterized by the presence of iron-sulfur (Fe-S) clusters that are crucial for their catalytic activity. These proteins are also involved in the regulation of hydrogen production from protons.
