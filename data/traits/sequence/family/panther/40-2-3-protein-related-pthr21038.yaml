identifier: PANTHER:PTHR21038
label: "40-2-3 PROTEIN-RELATED"
definition: >-
  UAP56-interacting factor, also known as UIF, is a mRNA export adaptor that works together with adaptor REF/ALY. It is required for mRNA export from the nucleus to the cytoplasm.
