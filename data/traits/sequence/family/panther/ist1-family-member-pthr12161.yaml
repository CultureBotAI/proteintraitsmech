identifier: PANTHER:PTHR12161
label: "IST1 FAMILY MEMBER"
definition: >-
  Budding yeast Ist1 is involved in a late step in sorting of cargo proteins of the multivesicular body (MVB) for incorporation into intralumenal vesicles. This entry also includes Ist1 homologues from animals and plants. Human Ist1 functions in the ESCRT (endosomal sorting complexes required for transport) pathway and is required for efficient abscission during HeLa cell cytokinesis. Human Ist1 binds the transport (MIT) domain of VPS4, LIP5, and Spartin via its C-terminal MIT-interacting motif (MIM).
definition_source: "InterPro:IPR005061 abstract (PANTHER PTHR12161 is a member signature)"
