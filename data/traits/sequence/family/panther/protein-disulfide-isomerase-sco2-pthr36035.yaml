identifier: PANTHER:PTHR36035
label: "PROTEIN DISULFIDE-ISOMERASE SCO2"
definition: >-
  SCO2 (SNOWY COTYLEDON 2) is a chloroplast protein disulphide isomerase, which is thought to be involved in protein folding. It interacts with LHCB1 (light-harvesting chlorophyll binding 1) and affects chloroplast biogenesis in cotyledons. It has been shown to have a role in leaf variegation in both Lotus japonicus and Arabidopsis thaliana.
