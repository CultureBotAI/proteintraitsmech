identifier: PANTHER:PTHR17408
label: "HISTONE RNA HAIRPIN-BINDING PROTEIN"
definition: >-
  This family consists of the histone stem-loop-binding protein (SLBP1) and the Xenopus Oocyte-specific histone RNA stem-loop-binding protein 2 (SLBP2). They both bind to the 3' end of histone mRNA in frog oocytes. However, their functions are different. SLBP1 participates in histone pre-mRNA processing in the nucleus, while oocyte specific SLBP2 doesn't support the histone pre-mRNA processing and locates in the cytoplasm. SLBP1 binds the 5' side of the stem-loop structure of replication-dependent histone pre-mRNAs and contributes to efficient 3'-end processing by stabilising the complex between histone pre-mRNA and U7 small nuclear ribonucleoprotein (snRNP), via the histone downstream element (HDE). It plays an important role in targeting mature histone mRNA from the nucleus to the cytoplasm and to the translation machinery. It stabilises mature histone mRNA and could be involved in cell-cycle regulation of histone gene expression.
definition_source: "InterPro:IPR026502 abstract (PANTHER PTHR17408 is a member signature)"
