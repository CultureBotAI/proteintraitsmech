identifier: PANTHER:PTHR15191
label: "PROTEIN CBG20567"
definition: >-
  The PTTG1IP protein family is involved in the regulation of nuclear translocation of the pituitary tumor-transforming gene 1 (PTTG1) protein. Members of this family are thought to play a role in facilitating the movement of PTTG1 into the nucleus, where it can perform its functions related to cell cycle regulation and tumor transformation. The precise mechanisms by which the PTTG1IP family members assist in the nuclear translocation of PTTG1 and their potential additional roles in cellular processes remain to be fully elucidated.
