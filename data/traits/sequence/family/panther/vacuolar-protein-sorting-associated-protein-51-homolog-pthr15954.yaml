identifier: PANTHER:PTHR15954
label: "VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 51 HOMOLOG"
definition: >-
  The VFT tethering complex (also known as GARP complex, Golgi associated retrograde protein complex, Vps53 tethering complex) is a conserved eukaryotic docking complex which is involved in recycling of proteins from endosomes to the late Golgi. Vps51 (also known as Ang2 or Vps67) is a subunit of VFT and interacts with the SNARE Tlg1. It is also part of the endosome-associated recycling protein (EARP) complex which is structurally related to GARP complex.
