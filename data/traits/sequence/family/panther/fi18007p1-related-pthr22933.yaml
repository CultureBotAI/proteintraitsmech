  - kind: GENERAL
    text: >-
      This family of proteins includes neurotoxins known as scoloptoxins. These toxins are typically found in the venom of scorpions and are characterized by their ability to interfere with ion channel function, particularly sodium channels. By binding to these channels, scoloptoxins can disrupt normal neuronal signaling, leading to paralysis and other neurotoxic effects. The proteins in this family share structural similarities that underlie their ability to target and modulate the activity of ion channels, contributing to the venom's overall potency and specificity.
