identifier: PANTHER:PTHR23082
label: "TRANSCRIPTION INITIATION FACTOR IIIC  TFIIIC , POLYPEPTIDE 3-RELATED"
definition: >-
  TFIIIC-102, also known as general transcription factor 3C polypeptide 3 (GTF3C3), is required for RNA polymerase III-mediated transcription and is a component of the DNA-binding TFIIIC2 subcomplex that directly binds tRNA and virus-associated RNA promoters. GTF3C3 contains several tetratricopeptide repeats. In Saccharomyces cerevisiae, this protein is known as transcription factor tau 131kDa subunit (Tfc4). It is the TFIIIB-assembling subunit of RNA polymerase III transcription initiation factor complex (TFIIIC). In Schizosaccharomyces pombe, this subunit is known as Sfc4.
