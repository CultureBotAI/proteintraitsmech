  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional activators that are involved in the regulation of siderophore-mediated iron acquisition systems. Members of this family function as positive regulators, enhancing the expression of genes related to the synthesis and transport of pyochelin, a siderophore that chelates iron, and its associated receptors. These proteins play a crucial role in the microbial iron uptake process, which is essential for survival and pathogenicity in iron-limited environments.
