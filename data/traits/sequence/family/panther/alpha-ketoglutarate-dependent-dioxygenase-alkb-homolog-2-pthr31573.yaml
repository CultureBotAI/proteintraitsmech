identifier: PANTHER:PTHR31573
label: "ALPHA-KETOGLUTARATE-DEPENDENT DIOXYGENASE ALKB HOMOLOG 2"
definition: >-
  AlkB is a dioxygenase that repairs alkylation damage to DNA and RNA. AlkB homologues (ABHs) are found in all multicellular organisms, as well as in many bacteria and fungi, and some viruses. Nine mammalian AlkB homologues exist (ALKBH1-8, FTO), but only a subset functions as DNA/RNA repair enzymes. This entry represents AlkB homologue 2 (ALKBH2, ABH2), which has a strong preference for double-stranded DNA. Together with alkyl-N-adenine-DNA glycosylase, comprises the cellular defence against 1,N(6)-ethenoadenine lesions. ABH2 also has an important role in maintaining ribosomal DNA gene integrity and transcription. This entry also includes uncharacterised bacterial homologues.
