  - kind: GENERAL
    text: >-
      This family of proteins includes putative E3 ubiquitin-protein ligases that are implicated in the rhizobial infection process. Members of this family are believed to play a crucial role in the formation of infection threads, as well as in the growth, differentiation, and maintenance of nodules during the symbiotic interaction between rhizobia and leguminous plants. The involvement of these proteins in the early steps of infection thread formation suggests a significant function in the establishment of symbiosis, which is essential for the biological nitrogen fixation process in legumes.
