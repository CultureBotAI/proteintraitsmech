identifier: PANTHER:PTHR42956
label: "NITROGENASE IRON-MOLYBDENUM COFACTOR BIOSYNTHESIS PROTEIN NIFE"
definition: >-
  This entry represents Nitrogenase iron-molybdenum cofactor biosynthesis protein NifE from Azotobacter vinelandii and similar prokaryotic proteins. NifE may play a role in the biosynthesis of the prosthetic group of nitrogenase (FeMo cofactor). This entry also includes components of the nitrogenase-like enzyme system Isethionate reductase catalytic subunits alpha and beta (IsrD/K) and Methylthio-alkane reductase catalytic subunit alpha (MarD). IsrD/K are involved in the degradation of a sulfonate, isethionate, releasing sulfite, which is used as a sulfur source under anaerobic conditions while MarD is required for the anaerobic assimilation of sulfur from common environmental volatile organic sulfur compounds (VOSCs) to support growth and methionine metabolism. It catalyses the conversion of dimethyl sulfide (DMS) to methane, ethyl methyl sulfide (EMS) to ethane, and (2-methylthio)ethanol (MT-EtOH) to ethylene. The enzyme responsible for nitrogen fixation, the nitrogenase, shows a high degree of conservation of structure, function, and amino acid sequence across wide phylogenetic ranges. All known Mo-nitrogenases consist of two components, component I (also called dinitrogenase, or Fe-Mo protein), an alpha2beta2 tetramer encoded by the nifD and nifK genes, and component II (dinitrogenase reductase, or Fe protein) a homodimer encoded by the nifH gene which has an Fe4S4 cluster bound between the subunits and two ATP-binding domains. The Fe protein supplies energy by ATP hydrolysis, and transfers electrons from reduced ferredoxin or flavodoxin to component 1 for the reduction of molecular nitrogen to ammonia. Nitrogenase contains two unusual rare metal clusters; one of them is the iron molybdenum cofactor (FeMo-co), which is considered to be the site of dinitrogen reduction
