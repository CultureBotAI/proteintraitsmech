identifier: PANTHER:PTHR21695
label: "ZINC FINGER PROTEIN 414"
definition: >-
  The function of zinc finger protein 414 (ZN414) is not known. ZN414 contains a C2H2-type zinc ribbon. Homologues are known only from vertebrates.
