identifier: PANTHER:PTHR45982
label: "REGULATOR OF CHROMOSOME CONDENSATION"
definition: >-
  The protein family is involved in critical cellular processes such as chromosome condensation, mitotic spindle assembly, and nucleocytoplasmic transport. Members act as guanine-nucleotide releasing factors, facilitating the exchange of GDP for GTP on the Ran GTPase, which is pivotal for maintaining high levels of GTP-bound Ran in the nucleus. This activity is essential for various nuclear events, including mitotic checkpoint control, chromosome decondensation, mRNA processing and transport, and the assembly of the nuclear pore complex. Some family members also bind to chromatin or DNA, influencing transcriptional control and chromosomal dynamics. Additionally, certain proteins within the family serve as components of the SCF E3 ubiquitin-protein ligase complex, targeting specific proteins for ubiquitination and proteasomal degradation.
