identifier: PANTHER:PTHR40202
label: "Hydroxymethylphosphonate dioxygenase-like"
definition: >-
  This entry represents [1-hydroxy-2-(trimethylamino)ethyl]phosphonate dioxygenase (glycine-betaine-forming) (PhnZ1), 2-amino-1-hydroxyethylphosphonate dioxygenase (glycine-forming) (PhnZ), and hydroxymethylphosphonate dioxygenase (PhnZ1), three organophosphonate dioxygenases involved in the degradation and utilisation of naturally occurring organophosphonates as phosphate sources. PhnZ1 catalyses the O2-dependent cleavage of (R)-1-hydroxy-2-(trimethylammonio)ethylphosphonate to yield glycine betaine and phosphate, with high specificity for N-trimethylated substrates involved in the degradation of 2-(trimethylammonio)ethylphosphonate. PhnZ catalyses cleavage of the carbon-phosphorus bond of (2-amino-1-hydroxyethyl)phosphonic acid to yield glycine and phosphate through an oxidative mechanism, reacting stereospecifically with the R-enantiomer and also utilising (R,R)-2-amino-1-hydroxypropylphosphonate as a substrate involved in the degradation of 2-aminoethylphosphonic acid. Hydroxymethylphosphonate dioxygenase catalyses oxidation of hydroxymethylphosphonic acid to produce formate and phosphate as part of an oxidative pathway for methylphosphonic acid utilisation and can also use (1R)-(2-amino-1-hydroxyethyl)phosphonic acid and (R)-1-hydroxyethylphosphonic acid with similar catalytic efficiency.
