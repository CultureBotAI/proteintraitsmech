identifier: PANTHER:PTHR40438
label: "PYRUVOYL-DEPENDENT ARGININE DECARBOXYLASE"
definition: >-
  Arginine decarboxylase ( EC:4.1.1.19 ) catalyses the interconversion of arginine and agmatine plus carbon dioxide. It requires a pyruvoyl group for its activity. Archaeoglobus fulgidus contains three copies of this 80-residue domain, all of which are very closely related.
