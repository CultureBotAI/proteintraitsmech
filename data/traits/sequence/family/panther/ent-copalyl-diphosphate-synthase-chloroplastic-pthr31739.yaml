identifier: PANTHER:PTHR31739
label: "ENT-COPALYL DIPHOSPHATE SYNTHASE, CHLOROPLASTIC"
definition: >-
  This entry represents a group of terpene synthases from plants, fungi and bacteria. The terpene synthase family is involved in the biosynthesis of a wide variety of terpenoid compounds, which play diverse roles in physiology and ecology, such as plant defence against herbivores and pathogens, and have applications in medicine due to their antitumour, anti-inflammatory, and antibacterial properties. Members of this family are responsible for the conversion of prenyl diphosphate substrates into various terpenes, including monoterpenes, sesquiterpenes, and diterpenes. These enzymes are characterised by conserved motifs that are important for their catalytic activity, typically binding to Mg(2+) ions. The family includes enzymes involved in the production of phytohormones like gibberellins, as well as phytoalexins, volatile emissions, and oleoresin secretions. Some terpenes also serve as precursors for fragrances and flavourings, and have potential therapeutic applications.
