  - kind: GENERAL
    text: >-
      This family of proteins includes subunits that are likely involved in redox reactions related to hydrogen metabolism. Members are thought to function in the coupling of redox reactions, involving ferredoxin and iron-sulfur (Fe-S) clusters, to proton translocation across membranes. This process is essential for conserving redox energy in the form of a proton gradient, which can be utilized for hydrogen production and various cellular energy-dependent processes. Some family members may act as components of hydrogenase complexes, which are enzymes that catalyze the reversible activation of hydrogen and can be involved in the formation of formate from hydrogen and CO2. The activity of these proteins can be modulated by metal ions such as copper.
    source: "InterPro:IPR052375 abstract (LLM-generated, not curator-reviewed)"
