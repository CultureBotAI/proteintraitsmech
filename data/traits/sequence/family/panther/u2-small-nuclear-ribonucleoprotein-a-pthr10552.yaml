identifier: PANTHER:PTHR10552
label: "U2 SMALL NUCLEAR RIBONUCLEOPROTEIN A"
definition: >-
  This entry represents the U2 small nuclear ribonucleoprotein A' (U2A') from animals, fungi and plants. Human U2 snRNP contains two specific proteins, U2A' and U2B", that interact with U2 snRNA stem-loop IV. The budding yeast homologue of U2A' is known as Lea1. The yeast U2A'/U2B complex is required for pre-spliceosome formation. It has been linked to nonobstructive azoospermia (NOA), a common cause of male infertility.
definition_source: "InterPro:IPR044640 abstract (PANTHER PTHR10552 is a member signature)"
