label: "VOLTAGE-DEPENDENT CALCIUM CHANNEL BETA SUBUNIT"
definition: >-
  VOLTAGE-DEPENDENT CALCIUM CHANNEL BETA SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11824. PANTHER protein class: ion channel, transporter, voltage-gated ion channel. Members are annotated with the molecular function voltage-gated calcium channel activity. Members participate in chemical synaptic transmission, regulation of monoatomic cation transmembrane transport, regulation of transmembrane transporter activity. Members localise to voltage-gated calcium channel complex, membrane, cell periphery.
