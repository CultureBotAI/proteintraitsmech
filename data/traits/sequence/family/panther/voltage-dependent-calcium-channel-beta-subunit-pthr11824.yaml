identifier: PANTHER:PTHR11824
label: "VOLTAGE-DEPENDENT CALCIUM CHANNEL BETA SUBUNIT"
definition: >-
  VOLTAGE-DEPENDENT CALCIUM CHANNEL BETA SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11824. PANTHER protein class: ion channel, transporter, voltage-gated ion channel. Members are annotated with the molecular function inorganic molecular entity transmembrane transporter activity, passive transmembrane transporter activity, monoatomic ion channel activity. and participate in chemical synaptic transmission, anterograde trans-synaptic signaling, regulation of cellular process. and localise to voltage-gated calcium channel complex, membrane protein complex, cell periphery.
