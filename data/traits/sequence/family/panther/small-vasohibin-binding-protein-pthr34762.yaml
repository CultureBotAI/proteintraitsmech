identifier: PANTHER:PTHR34762
label: "SMALL VASOHIBIN-BINDING PROTEIN"
definition: >-
  Small vasohibin-binding protein (SVBP) acts as a secretory chaperone for VASH1 and contributes to its anti-angiogenic activity. SVBP also interacts with VASH2 and affects its angiogenesis activity.
