identifier: PANTHER:PTHR19863
label: "NEMITIN (NEURONAL ENRICHED MAP INTERACTING PROTEIN) HOMOLOG"
definition: >-
  WD40-repeat 47, also known as Nemitin, is a microtubule-associated protein that is essential for brain development. It is involved in microtubule dynamics and regulation of autophagic flux for axonal outgrowth and guidance.
