  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the transfer of acetyl groups from acetyl coenzyme A to various acceptor substrates, resulting in the release of CoA and the formation of an acetylated product. Members of this family exhibit substrate specificity, with preferences for amino acids such as L-threonine, L-serine, and L-methionine, among others. They are also capable of acetylating other compounds like thiamine pyrophosphate. The enzymatic activity of these proteins is crucial for various cellular processes, including the modification of proteins and metabolites, which can affect their function, stability, or localization.
