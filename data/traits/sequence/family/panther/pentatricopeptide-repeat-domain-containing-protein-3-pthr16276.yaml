identifier: PANTHER:PTHR16276
label: "PENTATRICOPEPTIDE REPEAT DOMAIN-CONTAINING PROTEIN 3"
definition: >-
  Pentatricopeptide repeat (PPR) domain proteins are involved in mitochondrial gene expression. PPR domain protein 3 (PTCD3, also known as Small ribosomal subunit protein mS39) is a RNA-binding protein that associates with the mitochondrial small ribosomal subunit and regulates translation of mitochondrial encoded proteins.
