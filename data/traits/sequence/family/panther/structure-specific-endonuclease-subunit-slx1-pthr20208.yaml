  - kind: GENERAL
    text: >-
      The SLX1 family consists of catalytic subunits of structure-specific endonucleases that play a crucial role in the resolution of DNA secondary structures, which arise during DNA repair and recombination processes. Members of this family exhibit endonuclease activity towards branched DNA substrates, introducing single-strand cuts in duplex DNA near junctions with single-stranded DNA. They are involved in maintaining the integrity of ribosomal DNA loci by re-starting stalled replication forks and have been shown to have Holliday junction resolvase activity in vitro. Some family members display a preference for specific DNA structures such as 5'-flap structures, simple Y, and replication fork-like structures, and are capable of generating ligatable, nicked products from these substrates.
    source: "InterPro:IPR050381 abstract (LLM-generated, not curator-reviewed)"
