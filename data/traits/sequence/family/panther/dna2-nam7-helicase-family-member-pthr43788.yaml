identifier: PANTHER:PTHR43788
label: "DNA2/NAM7 HELICASE FAMILY MEMBER"
definition: >-
  This entry represents Replicase polyprotein 1ab, RecBCD and related proteins. 1ab is a multifunctional replicase polyprotein that contains enzymatic activities necessary for viral life cycle processes, such as RNA-directed RNA polymerase, helicase, and various proteinases. These enzymes participate in the formation of viral RNA cap structures, cleavage of the polyprotein into functional units, unwinding of RNA and DNA duplexes, and evasion of host immune responses. The family plays a critical role in the assembly of viral replication complexes, modulation of host cell survival pathways, inhibition of host translation, and manipulation of host membrane structures to facilitate viral replication. Exodeoxyribonuclease V or RecBCD is an heterotrimeric enzyme comprised of the proteins RecB, RecC and RecD. RecBCD is a helicase/nuclease that prepares dsDNA breaks (DSB) for recombinational DNA repair. Subunit RecD is a DNA helicase with 5' --> 3' polarity, whereas the RecB subunit possesses a 3' --> 5' DNA helicase activity. This points to a bipolar translocation model for RecBCD in which the two DNA helicases are travelling with opposite polarities, but in the same direction, on each strand of the antiparallel DNA duplex.
definition_source: "InterPro:IPR050534 abstract (PANTHER PTHR43788 is a member signature)"
