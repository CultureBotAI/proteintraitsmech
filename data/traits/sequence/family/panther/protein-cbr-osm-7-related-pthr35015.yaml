  - kind: GENERAL
    text: >-
      PROTEIN CBR-OSM-7-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35015. Members are annotated with the molecular function signaling receptor binding. Members participate in positive regulation of signal transduction, regulation of Notch signaling pathway. Members localise to extracellular space.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes secreted factors that are likely involved in Notch signaling pathways. Members of this family are implicated in determining cell fate decisions, particularly in vulval precursor cells, by acting redundantly with other ligands. They are also associated with neuronal functions, contributing to avoidance responses and the regulation of sleep-like quiescence during larval to adult transition. These proteins function through activation of Notch receptors and may operate in conjunction with EGF signaling.
    source: "InterPro:IPR053124 abstract (LLM-generated, not curator-reviewed)"
