identifier: PANTHER:PTHR44411
label: "THO COMPLEX SUBUNIT 6 HOMOLOG"
definition: >-
  In humans, THOC6 is a component of the THO subcomplex of the TREX complex. The THO complex is a conserved RNA binding complex that has been implicated in mRNA export of subsets of mRNAs.It plays an essential role in dopamine synaptogenesis. Mutations in the THOC6 genes have been linked to intellectual disability. In flies, THO complex is required for cell proliferation and for proper export of heat-shock mRNAs under heat stress.
