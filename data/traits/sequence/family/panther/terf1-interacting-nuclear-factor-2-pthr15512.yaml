identifier: PANTHER:PTHR15512
label: "TERF1-INTERACTING NUCLEAR FACTOR 2"
definition: >-
  TERF1-interacting nuclear factor 2, also known as TIN2, is a component of the shelterin complex (telosome), which is involved in the protection and maintenance of telomeres. TINF2 plays a role in shelterin complex assembly. In humans, one of its isoforms may have an additional role in tethering telomeres to the nuclear matrix.
definition_source: "InterPro:IPR039098 abstract (PANTHER PTHR15512 is a member signature)"
