identifier: PANTHER:PTHR31388
label: "PEROXIDASE 72-RELATED"
definition: >-
  Peroxidases are haem-containing enzymes that use hydrogen peroxide as the electron acceptor to catalyse a number of oxidative reactions. Most haem peroxidases follow the reaction scheme: Fe 3+ + H 2 O 2 -->[Fe 4+ =O]R' (Compound I) + H 2 O [Fe 4+ =O]R' + substrate -->[Fe 4+ =O]R (Compound II) + oxidised substrate [Fe 4+ =O]R + substrate -->Fe 3+ + H 2 O + oxidised substrate In this mechanism, the enzyme reacts with one equivalent of H 2 O 2 to give [Fe 4+ =O]R' (compound I). This is a two-electron oxidation/reduction reaction where H 2 O 2 is reduced to water and the enzyme is oxidised. One oxidising equivalent resides on iron, giving the oxyferryl intermediate, while in many peroxidases the porphyrin (R) is oxidised to the porphyrin pi-cation radical (R'). Compound I then oxidises an organic substrate to give a substrate radical. Peroxidases are found in bacteria, fungi, plants and animals and can be viewed as members of a superfamily consisting of 3 major classes. Class III comprises the secretory plant peroxidases, which have multiple tissue-specific functions e.g., removal of hydrogen peroxide from chloroplasts and cytosol; oxidation of toxic compounds; biosynthesis of the cell wall; defence responses towards wounding; indole-3-acetic acid (IAA) catabolism; ethylene biosynthesis; and so on. The wide spectrum of peroxidase activity, coupled with the participation in various physiological processes, is in keeping with its relative lack of specificity for substrates and the occurrence of a variety of isozymes. Plant peroxidases are monomeric glycoproteins containing 4 conserved disulphide bridges and 2 calcium ions. The 3D structure of peanut peroxidase has been shown to possess the same helical fold as class I and II peroxidases.
