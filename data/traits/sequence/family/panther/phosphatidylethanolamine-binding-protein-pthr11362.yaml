identifier: PANTHER:PTHR11362
label: "PHOSPHATIDYLETHANOLAMINE-BINDING PROTEIN"
definition: >-
  Phosphatidylethanolamine-binding proteins (PEBPs) are present in all three major phylogenetic divisions (eukaryotes, bacteria, archaea). The members in this subgroup are present in eukaryotes. Members here include those in plants such as Arabidopsis thaliana FLOWERING LOCUS (FT) (UniProtKB:Q9SXZ2) and TERMINAL FLOWER1 (TFL1) (UniProtKB:P93003), which function as a promoter and a repressor of the floral transitions respectively, as well as the mammalian Raf kinase inhibitory protein (RKIP), also known as phosphatidylethanolamine-binding protein 1 (PEBP-1) (UniProtKB:P30086), which inhibits MAP kinase (Raf-MEK-ERK), G protein-coupled receptor (GPCR) kinase and NFkappaB signalling cascades. Also, a member of this family is the large ribosomal subunit protein mL38 (MRPL38, known as MRPL35 in yeast) (UniProtKB:Q96DV4), which is located in the central protuberance of the mitochondrial large ribosomal subunit. Although their overall structures are similar, the members of the PEBP family have very different substrates and oligomerisation states (monomer/dimer/tetramer).
definition_source: "InterPro:IPR035810 abstract (PANTHER PTHR11362 is a member signature)"
