identifier: PANTHER:PTHR42899
label: "SPERMATOGENESIS-ASSOCIATED PROTEIN 20"
definition: >-
  This entry represents spermatogenesis-associated protein 20 (also known as sperm-specific protein 411 (Ssp411)), which is a testis-specific protein that contains a thioredoxin-like domain, and may play a role in fertility regulation. Other family members include a number of uncharacterised proteins with thioredoxin domains.
