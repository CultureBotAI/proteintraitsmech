identifier: PANTHER:PTHR15137
label: "TRANSCRIPTION INITIATION FACTOR TFIID"
definition: >-
  Transcription initiation factor TFIID subunit 2 (TAF2) is a component of the general purpose transcription factor complex TFIID. This entry includes TAF2 from animals, plants and fungi. In yeast, TAF2 functions as a component of the DNA-binding general transcription factor complex TFIID. Its binding to a promoter, whether or not it contains a TATA element, represents the initial step in pre-initiation complex (PIC) formation. TAF2 plays a crucial role in regulating gene expression by RNA polymerase II through various mechanisms, including interaction with transcription activators, recognition and selectivity of core promoters, interactions with TFIIA and TFIIB, chromatin modification via histone acetylation by TAF1, facilitation of DNA unwinding, and initiation of transcription. In mammals, the TAF2 basal transcription factor complex plays a major role in the initiation of RNA polymerase II (Pol II)-dependent transcription. It recognises and binds to promoters with or without a TATA box via its TBP subunit (TATA-box-binding protein), promoting the assembly of the PIC. The complex comprises TBP and TBP-associated factors (TAFs), including TAF1, TAF2, TAF3, TAF4, TAF5, TAF6, TAF7, TAF8, TAF9, TAF10, TAF11, TAF12, and TAF13. TAF2, in particular, forms a promoter DNA-binding subcomplex with TAF7 and TAF1. The DNA-binding general transcription factor complex TFIID is central to the initiation of DNA-dependent RNA polymerase II transcription. TFIID is the only general transcription initiation factor that bind to the TATA box. The binding of TFIID to the TATA-box is the first step in the formation of a complex able to initiate transcription. TFIID consists of the TATA binding protein (TBP) and 14 TBP-associated factors (TAFs). One copy of each TAF1, TAF2, TAF3, TAF7, TAF8, TAF
