  - kind: GENERAL
    text: >-
      The FAM161 family is associated with cellular structures known as cilia, which are hair-like projections on the cell surface. Members of the FAM161 family are involved in the process of ciliogenesis, which is the formation and maintenance of cilia. Cilia play crucial roles in motility, sensory perception, and signaling pathways. Defects in ciliogenesis can lead to a variety of human diseases, collectively known as ciliopathies.
