  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in developmental processes, such as eye and limb formation, and osteoblast differentiation. Some family members are known to interact with signaling pathways, for instance, by binding and stabilizing Wnt signaling proteins to facilitate gradient formation during development. Others exhibit inhibitory activity against cysteine and aspartic proteinases, which suggests a role in protease regulation. Additionally, certain proteins in this family can promote endothelial cell proliferation, migration, and angiogenesis, as well as contribute to matrix assembly and cell adhesiveness.
