identifier: PANTHER:PTHR31391
label: "B3 DOMAIN-CONTAINING PROTEIN OS11G0197600-RELATED"
definition: >-
  This entry represents a group of plant B3 domain-containing proteins, including REM16, At3g19184, At5g58280 and At5g42700 from Arabidopsis. They are part of the REM (Reproductive Meristem) gene family that may play a role during early stages of flower development.
