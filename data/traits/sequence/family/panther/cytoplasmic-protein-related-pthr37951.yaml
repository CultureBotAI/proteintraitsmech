identifier: PANTHER:PTHR37951
label: "CYTOPLASMIC PROTEIN-RELATED"
definition: >-
  This entry represents one of two related families in type VI secretion systems (T6SS) that contain an ImpA-related N-terminal domain (InterPro:IPR010657). This group includes Rhizobium leguminosarum ImpA, thought to be an T6SS homologue. This entry also includes TssA, which is a T6SS component forming dodecameric ring structures positioned at one end of the TssB/TssC sheath.. The type VI secretion system (T6SS), also known as CIS contractile injection system, is a supra-molecular bacterial complex that resembles phage tails. It is a toxin delivery systems which fires toxins into target cells upon contraction of its TssBC sheath. Thirteen essential core proteins are conserved in all T6SSs: the membrane associated complex TssJ-TssL-TssM, the baseplate proteins TssE, TssF, TssG, and TssK, the bacteriophage-related puncturing complex composed of the tube (Hcp), the tip/puncturing device VgrG, and the contractile sheath structure (TssB and TssC). Finally, the starfish-shaped dodecameric protein, TssA, limits contractile sheath polymerization at its distal part when TagA captures TssA.
definition_source: "InterPro:IPR017740 abstract (PANTHER PTHR37951 is a member signature)"
