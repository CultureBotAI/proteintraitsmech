identifier: PANTHER:PTHR24414
label: "F-BOX/KELCH-REPEAT PROTEIN SKIP4"
definition: >-
  The F-box/kelch-repeat proteins are involved in various cellular processes through the formation of SCF (SKP1-cullin-F-box) E3 ubiquitin ligase complexes. These complexes play a crucial role in the ubiquitination and subsequent proteasomal degradation of target proteins, thereby regulating protein turnover. Some proteins are also known to be involved in seed germination. The F-box domain is essential for the interaction with SKP1 (ASK in Arabidopsis), while the kelch repeats may be involved in substrate recognition.
definition_source: "InterPro:IPR050354 abstract (PANTHER PTHR24414 is a member signature)"
