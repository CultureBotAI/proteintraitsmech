identifier: PANTHER:PTHR21514
label: "AP-4 COMPLEX ACCESSORY SUBUNIT TEPSIN"
definition: >-
  Tepsin associates with the adapter-like complex (AP-4) complex, which forms a non-clathrin coat around cytoplasmic vesicles in plants and animals. Mutagenesis studies have identified two phylogenetically conserved peptide motifs within the C-terminal of tepsin that interact with the C-terminal ear (or appendage) domains of the beta4 and epsilon subunits of AP-4. The homologue from Arabidopsis thaliana is known as MTV1 (At3g16270), which mediates clathrin-dependent trafficking of vacuolar cargo from the trans-Golgi network.
definition_source: "InterPro:IPR039273 abstract (PANTHER PTHR21514 is a member signature)"
