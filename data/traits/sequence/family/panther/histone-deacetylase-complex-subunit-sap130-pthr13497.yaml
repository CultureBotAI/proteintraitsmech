identifier: PANTHER:PTHR13497
label: "HISTONE DEACETYLASE COMPLEX SUBUNIT SAP130"
definition: >-
  Histone acetylation plays a key role in the regulation of gene expression. The chromatin structure and accessibility of genes to transcription factors is regulated by enzymes that acetylate and deacetylate histones. The Sin3A-histone deacetylase (HDAC) co-repressor complex consists of multiple proteins and regulates gene expression by deacetylating histones. SAP130 (Sin3-associated protein 130) is a component of the histone deacetylase-dependent co-repressor complex mSin3A that acts as a transcriptional repressor. It may function in the assembly and/or enzymatic activity of mSin3A or in mediating interactions between the complex and other regulatory complexes.
