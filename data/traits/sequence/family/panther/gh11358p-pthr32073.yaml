definition: >-
  DIPK2A, also known as DIA1 (deleted in autism protein 1), may play a role in cardiomyocyte proliferation through paracrine signaling and activation of the PPI3K-AKT-CDK7 signaling cascade. This entry also includes DIPK2B, whose function is not clear.
