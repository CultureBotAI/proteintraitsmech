  - kind: GENERAL
    text: >-
      The protein family includes kininogens, which serve as precursors to the vasodilator peptide bradykinin, affecting smooth muscle contraction, hypotension, and vascular permeability. They are involved in blood coagulation, positioning prekallikrein and factor XI for optimal interaction with factor XII. Kininogens also inhibit thiol proteases and thrombocyte aggregation. The family encompasses fetuins, which are involved in various biological processes including endocytosis, bone mineralization, and inhibition of proteases. Histidine-rich glycoproteins within the family bind ligands like heme and heparin, playing roles in immune clearance, cell adhesion, angiogenesis, and coagulation. They possess antiangiogenic and antimicrobial properties and can bind divalent metal ions. Members of the family are involved in reproductive processes, such as preventing premature zona pellucida hardening during fertilization. Overall, the family plays multifaceted roles in physiological regulation, including coagulation, inflammation, cell signaling, and tissue remodeling.
    source: "InterPro:IPR050735 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
