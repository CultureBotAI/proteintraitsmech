identifier: PANTHER:PTHR46353
label: "ZINC FINGER PROTEIN 5"
definition: >-
  This entry represents a group of plant putative transcription factors, including GIS3/ZFP5/ZFP6 from Arabidopsis. GIS3/ZFP5/ZFP6 have been shown to regulates trichome initiation. ZFP5 also regulates root hair initiation and morphogenesis, while ZFP6 also acts as negative regulator of abscisic acid (ABA) signaling during germination and early seedling development.
