identifier: PANTHER:PTHR13296
label: "BCAS2 PROTEIN"
definition: >-
  Proteins in this family are involved in mRNA splicing. This family includes pre-mRNA-splicing factor SPF27, SNT309 and Cwf7. In humans, SPF27 is a component of the PRP19-CDC5L complex that forms an integral part of the spliceosome and is required for activating pre-mRNA splicing. It may have a scaffolding role in the spliceosome assembly as it contacts all other components of the core complex.
