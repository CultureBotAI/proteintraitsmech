  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in carbohydrate metabolism. Members of this family are known to participate in the catabolism of sugars such as L-fucose, and are capable of catalyzing the anomeric conversion of specific sugar isomers. The enzymes may exhibit activity towards various pyranosides, including L-galactopyranoside and D-arabinopyranoside, although activity towards D-fucopyranoside has not been detected. The family encompasses proteins with mutarotase activity, which is crucial for the proper utilization and breakdown of sugars, thereby playing a significant role in cellular energy processes.
