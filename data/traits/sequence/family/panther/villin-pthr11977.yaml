identifier: PANTHER:PTHR11977
label: VILLIN
definition: >-
  Gelsolin is an actin-modulating protein that severs F-actin, caps the barbed ends of actin filaments preventing monomer exchange, and promotes the nucleation step of actin polymerisation. It can be regulated by Ca2+ and phosphoinositides. The interaction between gelsolin and tropomyosin modulates actin dynamics. Gelsolin also plays a role in ciliogenesis. The structure of gelsolin has been solved.
