identifier: PANTHER:PTHR10706
label: "F-BOX FAMILY PROTEIN"
definition: >-
  This entry represents a group of F-box only proteins, including FBXO31/39 from humans and HAWAIIAN SKIRT (At3g61590) from Arabidopsis. HAWAIIAN SKIRT (HWS; At3G61590) is a F-box dependent factor involved in miRNA function. Loss of function of HWS exhibits pleiotropic phenotypes including sepal fusion. F-box only protein 31 is a component of the SCF (SKP1-cullin-F-box) protein ligase complex that plays a central role in G1 arrest following DNA damage. It specifically recognises phosphorylated cyclin-D1 (CCND1), promoting its ubiquitination and degradation by the proteasome, resulting in G1 arrest.
