identifier: PANTHER:PTHR48416
label: "CYTOCHROME C OXIDASE SUBUNIT 6C"
definition: >-
  Cytochrome c oxidase (CcO; EC:1.9.3.1), a 13 subunit complex, is the terminal oxidase in the mitochondrial electron transport chain. Cytochrome c oxidase is the component of the respiratory chain that catalyses the reduction of oxygen to water. This entry contains of cytochrome c oxidase subunit VIc (also known as Cytochrome c oxidase subunit 6C), which is found only in eukaryotes and its specific function remains unclear. It has been reported that the relative concentrations of some nuclear encoded CcO subunits, including subunit VIc, compared to those of the mitochondrial encoded subunits, are altered significantly during the progression of prostate cancer.
definition_source: "InterPro:IPR051389 abstract (PANTHER PTHR48416 is a member signature)"
