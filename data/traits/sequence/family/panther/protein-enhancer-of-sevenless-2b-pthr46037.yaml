identifier: PANTHER:PTHR46037
label: "PROTEIN ENHANCER OF SEVENLESS 2B"
definition: >-
  Growth factor receptor-bound protein 2 (Grb2) is an SH2 and SH3 domain-containing adaptor protein that links receptor tyrosine kinases to Ras signalling. Grb2 interacts with the cytoplasmic tyrosine kinase ACK1 (activated Cdc42-associated kinase 1) and mediates its interaction with other receptor tyrosine kinases. ACK1 is implicated in metastatic behaviour, cell spreading and migration, and epidermal growth factor receptor (EGFR) signalling. Human GRAP and its Drosophila homologue, downstream of receptor kinase (drk), have been shown to have a function in hearing. Src-like adapter proteins (SLAP and SLAP2) are involved in the regulation of immune cell surface expression and signaling. They negatively regulate T cell receptor signaling and act as critical inhibitors of platelet (hem)ITAM signaling in the setting of arterial thrombosis and ischemic stroke. They contain adjacent Src homology 3 (SH3) and Src homology 2 (SH2) domains. SLAP has been shown to regulate receptor tyrosine kinase (RTK) signaling. It also binds to the receptor tyrosine kinase Flt3 and plays a role in signal transduction downstream of Flt3. SLAP2 acts as a negative regulator of FLT3 signaling. This entry includes a group of adapter proteins including Grb2, GRAP, GRAPL and SLAP/SLAP2 from humans. This entry also includes Sem-5 from Caenorhabditis elegans. Sem-5 is an adapter protein which modulates signaling mediated by several receptor tyrosine kinases such as egl-15 and let-23 probably acting upstream of let-60/ras.
definition_source: "InterPro:IPR043539 abstract (PANTHER PTHR46037 is a member signature)"
