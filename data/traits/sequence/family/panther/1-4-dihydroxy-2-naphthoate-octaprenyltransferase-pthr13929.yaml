identifier: PANTHER:PTHR13929
label: "1,4-DIHYDROXY-2-NAPHTHOATE OCTAPRENYLTRANSFERASE"
definition: >-
  UbiA prenyltransferase domain-containing protein 1 is a prenyltransferase that mediates the formation of menaquinone-4 (MK-4), a vitamin K2 isoform present at high concentrations in the brain, kidney and pancreas. Also included in this family are 1,4-dihydroxy-2-naphthoate octaprenyltransferase MenA and 2-carboxy-1,4-naphthoquinone phytyltransferase from bacteria.
