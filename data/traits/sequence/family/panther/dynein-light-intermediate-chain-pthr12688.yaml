identifier: PANTHER:PTHR12688
label: "DYNEIN LIGHT INTERMEDIATE CHAIN"
definition: >-
  Cytoplasmic dynein is a large multisubunit complex involved in retrograde transport and the positioning of various organelles. The light intermediate chains (LICs) of cytoplasmic dynein consist of multiple isoforms, which undergo post-translational modification to produce a large number of species. Proteins in this entry include Dil1 from fission yeasts and DC1L1/2 from mammals. DC1L1 is required for progress through the spindle assembly checkpoint.
