identifier: PANTHER:PTHR13620
label: "3-5 EXONUCLEASE"
definition: >-
  This family of proteins includes exonucleases with 3'-5' activity, acting on single-stranded and duplex DNA or RNA substrates. They play crucial roles in DNA replication, repair, and stability, as well as in mitochondrial metabolism and translation. Some members are involved in the RNA-induced silencing complex (RISC), influencing miRNA accumulation and plant development. The family is characterized by its ability to process overhang-containing duplexes, but not blunt-ended DNA. They are also implicated in the response to DNA damage and replicative stress, participating in double-strand break resection and homologous recombination, as well as in the stabilization and restart of stalled replication forks.
