identifier: PANTHER:PTHR16466
label: "TELOMERE REPEAT-BINDING FACTOR 2-INTERACTING PROTEIN 1"
definition: >-
  This entry includes fission yeast Rap1 and its homologue, TERF2IP (telomeric repeat-binding factor 2-interacting protein 1) from animals. TERF2IP is a telomere-interacting protein that plays a role in protecting telomeres from initiating homology directed repair (HDR). It is recruited to telomeric double-stranded 5'-TTAGGG-3' repeats via its interaction with TERF2. It can also be recruited to extratelomeric 5'-TTAGGG-3' sites and regulates gene expression. In Schizosaccharomyces pombe, Rap1 is involved in the regulation of telomere length and telomere position effect (TPE). It is also involved in chromosomal bouquet formation.
definition_source: "InterPro:IPR039595 abstract (PANTHER PTHR16466 is a member signature)"
