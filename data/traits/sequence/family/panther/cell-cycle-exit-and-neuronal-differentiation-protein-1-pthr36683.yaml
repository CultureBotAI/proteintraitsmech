identifier: PANTHER:PTHR36683
label: "CELL CYCLE EXIT AND NEURONAL DIFFERENTIATION PROTEIN 1"
definition: >-
  Cell cycle exit and neuronal differentiation protein 1 (Cend1 or BM88) is a homodimer of 140 amino acids. It has a putative transmembrane domain at the C terminus. The mRNA of this protein is expressed only in neural tissues, where it is restricted to neurons. It is involved in neuroblastoma cell differentiation, neuronal differentiation, and development of the cerebellum.
