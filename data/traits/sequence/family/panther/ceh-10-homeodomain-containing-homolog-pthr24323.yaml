definitions:
  - kind: GENERAL
    text: >-
      CEH-10 HOMEODOMAIN-CONTAINING HOMOLOG — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24323. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function transcription cis-regulatory region binding, double-stranded DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
