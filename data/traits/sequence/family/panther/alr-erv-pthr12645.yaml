identifier: PANTHER:PTHR12645
label: ALR/ERV
definition: >-
  This entry contains FAD-dependent sulfhydryl oxidases, including ALR from animals and Erv from plants and fungi. ALR generates the disulfide bonds in CHCHD4/MIA40, which in turn is a chaperone required for disulfide bond formation and protein folding in the mitochondrial intermembrane space. ERV1 from Arabidopsis is required for the import and folding of small cysteine-containing proteins in the mitochondrial intermembrane space. Erv2 from Saccharomyces cerevisiae catalyzes disulfide bond formation in the endoplasmic reticulum lumen.
