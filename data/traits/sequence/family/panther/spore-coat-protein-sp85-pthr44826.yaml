identifier: PANTHER:PTHR44826
label: "SPORE COAT PROTEIN SP85"
definition: >-
  This family of proteins is involved in the life cycle of the malaria parasite, Plasmodium. Members of this family play a crucial role in the parasite's ability to infect both mosquito vectors and vertebrate hosts. In the mosquito, these proteins are necessary for the development of sporozoites within the oocyst, their migration through the hemolymph, and their entry into the salivary glands. In the vertebrate host, they are essential for the sporozoites' migration through the dermis and subsequent invasion of hepatocytes. This is facilitated by the binding to highly sulfated heparan sulfate proteoglycans on the surface of host hepatocytes. The proteins exhibit two conformational states that are critical for their function: an adhesive state that allows for host cell invasion and a nonadhesive state that facilitates migration. Additionally, they possess a GPI-anchor for cell membrane localization and a domain that protects sporozoites from host antibodies.
