identifier: PANTHER:PTHR40040
label: "SMALL HYDROPHOBIC PROTEIN-RELATED"
definition: >-
  This entry represents a group of uncharacterised proteins, including YqfX from Bacillus subtilis ( UniProtKB:P54481 ). The function of these proteins is unknown but the presence of predicted transmembrane helices suggests that they are likely associated with membrane.
