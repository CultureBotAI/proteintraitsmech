identifier: PANTHER:PTHR11130
label: "GLUTATHIONE SYNTHETASE"
definition: >-
  This entry represents glutathione synthetase (EC:6.3.2.3) (GSH-S), a homodimeric enzyme that catalyses the conversion of gamma-L-glutamyl-L-cysteine and glycine to phosphate and glutathione in the presence of ATP. This is the second step in glutathione biosynthesis, the first step being catalysed by gamma-glutamylcysteine synthetase. In humans, defects in GSS are inherited in an autosomal recessive way and are the cause of severe metabolic acidosis, 5-oxoprolinuria, and increased rate of haemolysis and defective function of the central nervous system.
