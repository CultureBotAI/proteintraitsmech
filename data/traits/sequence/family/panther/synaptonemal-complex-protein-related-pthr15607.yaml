identifier: PANTHER:PTHR15607
label: "SYNAPTONEMAL COMPLEX PROTEIN-RELATED"
definition: >-
  This entry includes synaptonemal complex protein 2 (SYCP2) and synaptonemal complex protein 2-like (SYCP2L). SYCP2 is one of the major components of the transverse filaments of the synaptonemal complex. Synaptonemal complexes are structures that are formed between homologous chromosomes during meiotic prophase. SYCP2L has partial sequence homology to a SYCP2 and is the major component of nucleolar cortical skeleton in Xenopus oocytes. In humans, SYCP2L promotes primordial oocytes survival, thus being associated with age at natural menopause (ANM).
