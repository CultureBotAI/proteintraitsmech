  - kind: GENERAL
    text: >-
      This family of proteins includes electron transporters that play a crucial role in various metabolic processes. Members of this family are primarily involved in transferring electrons through iron-sulfur clusters, acting as redox partners for different cytochrome P450 systems. They are essential components in the biosynthesis of diverse compounds, including antibiotics and sterols, by facilitating electron transfer to cytochrome enzymes involved in these pathways. The versatility of these proteins is evident in their ability to support a wide range of metabolic reactions across different organisms.
