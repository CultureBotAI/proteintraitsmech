identifier: PANTHER:PTHR15494
label: "CALCIUM-BINDING TYROSINE PHOSPHORYLATION-REGULATED PROTEIN"
definition: >-
  CABYR was originally isolated from spermatoza and was thought to be testis specific, but has been observed in lung and brain tumours. It is a polymorphic calcium binding protein that is phosphorylated during capacitation.
