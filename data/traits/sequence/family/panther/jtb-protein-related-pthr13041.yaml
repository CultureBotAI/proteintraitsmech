identifier: PANTHER:PTHR13041
label: "JTB PROTEIN-RELATED"
definition: >-
  This family contains several jumping translocation breakpoint proteins or JTBs. Jumping translocation (JT) is an unbalanced translocation that comprises amplified chromosomal segments jumping to various telomeres. JTB, located at 1q21, has been found to fuse with the telomeric repeats of acceptor telomeres in a case of JT. hJTB (Homo sapiens JTB) encodes a transmembrane protein that is highly conserved among divergent eukaryotic species. JT results in a hJTB truncation, which potentially produces an hJTB product devoid of the transmembrane domain. hJTB is located in a gene-rich region at 1q21, called EDC (Epidermal Differentiation Complex). JTB has also been implicated in prostatic carcinomas.
definition_source: "InterPro:IPR008657 abstract (PANTHER PTHR13041 is a member signature)"
