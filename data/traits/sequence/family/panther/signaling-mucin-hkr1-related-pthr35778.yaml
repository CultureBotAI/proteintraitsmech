identifier: PANTHER:PTHR35778
label: "SIGNALING MUCIN HKR1-RELATED"
definition: >-
  Yeast cells respond to hyperosmotic stress by activating the high-osmolarity glycerol (HOG) pathway, which consists of two branches, Hkr1/Msb2-Sho1 and Sln1. The Sho1 branch involves two osmosensors, the transmembrane mucin-like glycoproteins Hkr1 and Msb2. Activation of Hog MAPK cascade by Msb2, but not by Hkr1, requires the scaffold protein Bem1 and the actin cytoskeleton, suggesting that Msb2 functions as an osmosensor to integrate the signals from external osmotic conditions with those from internal cytoskeletal conditions.
definition_source: "InterPro:IPR039295 abstract (PANTHER PTHR35778 is a member signature)"
