identifier: PANTHER:PTHR22844
label: "F-BOX AND WD40 DOMAIN PROTEIN"
definition: >-
  JINGUBANG (JGB) is a WD40 repeats containing protein highly conserved in flowering plants. It interacts with TCP4, a JA biosynthesis-related transcription factor, and negatively regulates pollen germination.
