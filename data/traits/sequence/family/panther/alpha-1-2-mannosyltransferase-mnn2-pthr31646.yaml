identifier: PANTHER:PTHR31646
label: "ALPHA-1,2-MANNOSYLTRANSFERASE MNN2"
definition: >-
  ALPHA-1,2-MANNOSYLTRANSFERASE MNN2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31646. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function mannosyltransferase activity, transferase activity, catalytic activity. and participate in carbohydrate derivative biosynthetic process, organonitrogen compound biosynthetic process, macromolecule glycosylation. and localise to Golgi apparatus, cytoplasm, membrane-bounded organelle.
