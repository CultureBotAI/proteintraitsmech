identifier: PANTHER:PTHR12857
label: "CXXC MOTIF CONTAINING ZINC BINDING PROTEIN"
definition: >-
  This family consists of a number of eukaryotic proteins including CXXC motif containing zinc binding protein (previously known as UPF0587 protein C1orf123). The crystal structure reveals that the protein binds a Zn2+ ion in a tetrahedral coordination with four Cys residues from two CxxC motifs.
