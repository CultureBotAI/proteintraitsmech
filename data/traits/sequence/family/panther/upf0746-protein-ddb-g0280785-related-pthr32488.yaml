  - kind: GENERAL
    text: >-
      The UPF0746 family includes proteins that are implicated in the organization of the actin cytoskeleton and cytokinesis. One characterized member, Defective in tip formation protein A, is essential for the proper sorting of prestalk cells, tip formation during the mound stage, and fruiting body development in Dictyostelium discoideum. It may also play a role in cell adhesion. Other members of the family are uncharacterized, but based on similarity, they may share related functions in cellular structure and dynamics.
    source: "InterPro:IPR051904 abstract (LLM-generated, not curator-reviewed)"
