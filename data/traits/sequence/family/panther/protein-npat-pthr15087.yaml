identifier: PANTHER:PTHR15087
label: "PROTEIN NPAT"
definition: >-
  This family of proteins is involved in cell cycle regulation, specifically required for the progression through the G1 and S phases and for S phase entry. Members of this family are known to activate transcription of histone genes, including those for histone H2A, H2B, H3, and H4, which are essential for DNA packaging during cell division. Some members also interact with other proteins such as MIZF to regulate additional promoters like ATM and PRKDC. The activation of gene transcription is partly achieved through the recruitment of the NuA4 histone acetyltransferase complex to promoters. A characteristic feature of this family is the presence of a LisH domain, which is crucial for their role in activating histone gene transcription.
