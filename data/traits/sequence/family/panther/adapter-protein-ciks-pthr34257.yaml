identifier: PANTHER:PTHR34257
label: "ADAPTER PROTEIN CIKS"
definition: >-
  This family of proteins includes E3 ubiquitin ligases that are involved in 'Lys-63'-linked polyubiquitination, a post-translational modification that enhances protein-protein interactions and cell signaling. Members of this family function as adapter molecules in IL17A-mediated signaling pathways. They are capable of interacting with IL17 receptor chains and catalyzing the polyubiquitination of TRAF6, which is a key step in the activation of NF-kappa-B and MAPkinase pathways. These proteins transfer ubiquitin from E2 ubiquitin-conjugating enzyme complexes to specific substrate proteins, thereby modulating various signaling cascades.
