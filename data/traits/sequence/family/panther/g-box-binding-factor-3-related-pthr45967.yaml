identifier: PANTHER:PTHR45967
label: "G-BOX-BINDING FACTOR 3-RELATED"
definition: >-
  This family represents a group of plant regulatory factors that bind to G-box or G-box-like motifs (5'-CCACGTGG-3') in gene promoters. They are involved in responses to fungal pathogen infection and abiotic stresses. G-box and G-box-like motifs are cis-acting elements defined in promoters of certain plant genes which are regulated by such diverse stimuli as light-induction or hormone control. In Arabidopsis thaliana, the G-group includes G-box-binding factors 1-3 and bZIP transcription factors 16/68 which have a conserved protein structure containing a highly homological basic region and a proline-rich domain in the N-terminal region. Transcription factor HBP-1a and bZIP transcription factors 1-A/B/D from wheat are also included in this entry (Zhang Y. et al. Physiol. Mol. Plant Pathol. 73:88-94(2009)).
