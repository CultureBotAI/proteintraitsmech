identifier: PANTHER:PTHR46935
label: "OS01G0674700 PROTEIN"
definition: >-
  This entry represents a group of chloroplastic pentatricopeptide repeat-containing proteins, including DG1 (At5g67570) and EMB2279 (At1g30610) from Arabidopsis. DG1 is involved in the regulation of early chloroplast development and chloroplast gene expression. DG1 mutants have pale young leave and reduced accumulation of plastid encoded transcripts. DG1 has been shown to interact with SIG6, a chloroplast sigma factor responsible for the transcription of plastid-encoded RNA polymerase (PEP) dependent chloroplast genes in cotyledons. DG1 plays an important role in maintaining chloroplast mRNA editing. EMB2279 is required for intron splicing of plastid rpl2 and trnK. Mutations in the EMB2279 gene result in embryo lethality due to defects in chloroplast development.
definition_source: "InterPro:IPR044645 abstract (PANTHER PTHR46935 is a member signature)"
