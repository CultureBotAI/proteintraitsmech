identifier: PANTHER:PTHR43052
label: "tRNA-specific 2-thiouridylase MnmA"
definition: >-
  This family of proteins is involved in the post-transcriptional modification of tRNA molecules. Specifically, they catalyze the 2-thiolation of uridine at the wobble position of tRNA, which is the 34th nucleotide from the 5' end of the tRNA sequence. The enzymatic activity results in the formation of 2-thiouridine (s(2)U34), which plays a crucial role in the proper decoding of the genetic code during protein synthesis. This modification is essential for the structural stability of tRNA and for accurate and efficient translation by the ribosome. Members of this family are found across various bacterial species and are essential for cellular function and viability.
