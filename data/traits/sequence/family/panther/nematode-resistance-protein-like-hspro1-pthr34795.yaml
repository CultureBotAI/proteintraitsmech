identifier: PANTHER:PTHR34795
label: "NEMATODE RESISTANCE PROTEIN-LIKE HSPRO1"
definition: >-
  This entry includes a group of resistance proteins from plants, including HSPRO1 and HSPRO2. HSPRO1 is believed to confer resistance to nematodes. HSPRO2 is involved in basal resistance to the bacterial pathogen Pseudomonas syringae.
