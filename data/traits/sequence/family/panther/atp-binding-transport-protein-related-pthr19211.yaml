identifier: PANTHER:PTHR19211
label: "ATP-BINDING TRANSPORT PROTEIN-RELATED"
definition: >-
  This entry represents ABCF family proteins from eukaryotes and bacteria, which belong to the ABC transporter superfamily. In humans, ABCF protein members have ATP-binding domains, but no transmembrane domains, making transporter function unlikely. Yeast members are ribosome-dependent ATPase enzymes that function in cytoplasmic translation elongation. These proteins are required for the ATP-dependent release of deacylated tRNA from the ribosomal E-site during protein biosynthesis and stimulate the binding of aminoacyl-tRNA to the ribosomal A-site. Some members in Escherichia coli have been reported to play a role in peptide bond synthesis, while in Mycobacteroides abscessus and Streptococcus pneumoniae members contribute to macrolide resistance by ribosome protection, Besides, some members display antiviral effects against flaviviruses in the presence of OAS1B, while others may be involved in ribosome assembly or function, mRNA export, and regulation of GCN2 kinase activity in response to amino acid availability. Additionally, certain proteins within this family are implicated in ribosome biogenesis and the ribosome-associated quality control pathway.
definition_source: "InterPro:IPR050611 abstract (PANTHER PTHR19211 is a member signature)"
