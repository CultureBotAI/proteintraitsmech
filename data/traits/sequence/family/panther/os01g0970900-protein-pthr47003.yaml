identifier: PANTHER:PTHR47003
label: "OS01G0970900 PROTEIN"
definition: >-
  This entry represents a group of pentatricopeptide repeat-containing proteins from plants, including BIR6 (also known as At3g48250) from Arabidopsis. BIR6 is a mitochondrial protein implicated in splicing of intron 1 of mitochondrial nad7 transcripts. Small ribosomal subunit protein mS81 (rPPR8, previously known as At5g15980), is also included in this entry.
