identifier: PANTHER:PTHR16277
label: "CELL DIVISION CYCLE ASSOCIATED PROTEIN 4/SERTA DOMAIN-CONTAINING PROTEIN 2"
definition: >-
  This family of proteins includes coregulators that interact with E2F-responsive promoters, integrating signals from PHD- and bromodomain-containing transcription factors. They modulate the transcriptional activity of E2F1/TFDP1 complexes, influencing cell cycle progression and cellular proliferation. Members of this family can act as both coactivators and corepressors, affecting the expression of E2F-target genes. Additionally, some members are involved in the molecular regulation of hematopoietic stem cells and progenitor cell lineage commitment and differentiation. Certain proteins within this family also play a role in the regulation of fat storage by altering the expression of genes related to adipocyte lipolysis, thermogenesis, and oxidative metabolism.
