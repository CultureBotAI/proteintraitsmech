identifier: PANTHER:PTHR35859
label: "NONSELECTIVE CATION CHANNEL PROTEIN"
definition: >-
  This family of proteins includes calcium channels that are essential for the regulated release of calcium ions from intracellular stores in response to various stimuli. Members of this family are involved in cellular processes such as response to hyperosmotic shock and stress conditions. They play a crucial role in maintaining cellular homeostasis by contributing to the stability of organelles like mitochondria and vacuoles. These proteins are also implicated in the transcriptional regulation of oxidative stress response genes and are essential for the polarized growth and re-orientation of hyphal tips in certain species, which is a key factor in pathogenicity.
