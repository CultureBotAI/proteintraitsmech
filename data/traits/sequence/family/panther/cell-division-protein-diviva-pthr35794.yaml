identifier: PANTHER:PTHR35794
label: "CELL DIVISION PROTEIN DIVIVA"
definition: >-
  The Bacillus subtilis divIVA1 mutation causes misplacement of the septum during cell division, resulting in the formation of small, circular, anucleate minicells. Inactivation of divIVA produces a minicell phenotype, whereas overproduction of DivIVA results in a filamentation phenotype. These proteins appear to contain coiled-coils. This entry represents DivIVA and related proteins, including cell cycle protein GpsB.
