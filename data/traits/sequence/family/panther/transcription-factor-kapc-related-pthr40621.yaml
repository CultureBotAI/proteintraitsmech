identifier: PANTHER:PTHR40621
label: "TRANSCRIPTION FACTOR KAPC-RELATED"
definition: >-
  This entry represents a family of fungal bZIP transcription factors, including AP-1-like transcription factor yap1 from Aspergillus flavus. Members are involved in the regulation of oxidative stress response, redox homeostasis, and various stress responses, including resistance to toxic compounds like arsenic and antifungal drugs. These proteins activate the transcription of genes encoding antioxidant enzymes, components of the cellular thiol-reducing pathways, and multidrug transporters. They are characterised by their ability to bind to specific DNA core binding sites, and their activity is modulated by the oxidation state of cysteine-rich domains, which affects their subcellular localization. Some members also play roles in iron regulation, metabolism control, and cell cycle regulation.
