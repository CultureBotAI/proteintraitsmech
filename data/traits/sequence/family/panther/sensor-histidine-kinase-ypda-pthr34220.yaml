  - kind: GENERAL
    text: >-
      The LytS/LytT and HptS/HptR two-component regulatory systems, along with the nutrient-sensing BtsS/BtsR and YpdA/YpdB systems, form a network of sensor histidine kinases and response regulators that control various bacterial processes. These systems respond to environmental stimuli such as extracellular pyruvate, phosphate sources, and host defense peptides, regulating genes involved in cell wall metabolism, autolysis, programmed cell death, biofilm formation, hexose phosphate transport, and antibiotic susceptibility. The sensor kinases typically autophosphorylate a histidine residue and transfer the phosphate to a conserved aspartic acid in their corresponding response regulator, modulating its activity. Some also exhibit phosphatase activity, providing a mechanism for deactivation.
    source: "InterPro:IPR050640 abstract (LLM-generated, not curator-reviewed)"
