identifier: PANTHER:PTHR31543
label: "DYNEIN REGULATORY COMPLEX SUBUNIT 4"
definition: >-
  Growth arrest-specific protein 8 (Gas8; also known as dynein regulatory complex subunit 4, DRC4) is a microtubule-binding protein localised to regions of dynein regulation in mammalian cells. In mouse, Gas8 is predominantly a testicular protein, whose expression is developmentally regulated during puberty and spermatogenesis. In humans, it is absent in infertile males who lack the ability to generate gametes. The localisation of Gas8 in the motility apparatus of post-meiotic gametocytes and mature spermatozoa, together with the detection of Gas8 also in cilia at the apical surfaces of epithelial cells lining the pulmonary bronchi and Fallopian tubes suggests that the Gas8 protein may have a role in the functioning of motile cellular appendages. Homologues are also found in apicomplexans and invertebrates. In Chlamydomonas reinhardtii, Gas8 is a component of the nexin-dynein regulatory complex, which is a regulator of ciliary/flagellar motility.
definition_source: "InterPro:IPR039308 abstract (PANTHER PTHR31543 is a member signature)"
