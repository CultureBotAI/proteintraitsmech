identifier: PANTHER:PTHR31191
label: "CENTROSOMAL PROTEIN CEP126"
definition: >-
  Centrosomal protein of ~126kDa (CEP126), previously known as KIAA1377, localises to the centrosome, pericentriolar satellites and the base of the primary cilium. It is an important regulator of centrosomal function. Cep126 is necessary for microtubule (MT) organisation, association of the MT array with the centrosome, and is also required for the formation of the primary cilium.
