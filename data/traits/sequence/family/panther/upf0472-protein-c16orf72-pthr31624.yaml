identifier: PANTHER:PTHR31624
label: "UPF0472 PROTEIN C16ORF72"
definition: >-
  This entry represents the HUWE1-associated protein modifying stress responses (HAPR1, also known as TAPR1, telomere attrition and p53 response 1 protein) from animals, including HAPSTR1 (also known as C16orf72/TAPR1) from human, which functions as a negative regulator of TP53/P53 in the cellular response to telomere erosion and probably also DNA damage. It may attenuate p53/TP53 activation through the E3 ubiquitin ligase HUWE1. HAPSTR2 plays a central regulatory role in the cellular response to molecular stressors, such as DNA damage, nutrient scarcity, and protein misfolding together with HAPSTR1 by stabilizing HAPSTR1, but also independently of HAPSTR1.
definition_source: "InterPro:IPR040308 abstract (PANTHER PTHR31624 is a member signature)"
