identifier: PANTHER:PTHR35742
label: "THYLAKOID LUMENAL 16.5 KDA PROTEIN, CHLOROPLASTIC"
definition: >-
  MPH2 (encoded by At4g02530) is a chloroplast thylakoid lumenal protein required for growth acclimation of plants under fluctuating light environments. A role in disassembling monomeric complexes for regeneration of dimeric functional PSII supercomplexes has been suggested for MPH2.
