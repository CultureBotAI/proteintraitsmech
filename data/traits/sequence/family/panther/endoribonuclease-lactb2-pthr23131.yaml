  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with diverse functions, primarily involved in the biosynthesis of various secondary metabolites, such as polyketides, neuropeptide antagonists, and anthraquinones. Members of this family typically exhibit thioesterase activity, catalyzing the hydrolysis of thioester bonds in non-ribosomal peptide synthetase (NRPS) or polyketide synthase (PKS) systems to release products like atrochrysone carboxylic acid. They also participate in cyclization and decarboxylation reactions essential for the formation of complex natural products with potential pharmacological activities. Some proteins in this family also display endoribonuclease activity, playing a role in mitochondrial function and cell viability by cleaving single-stranded RNA.
    source: "InterPro:IPR050662 abstract (LLM-generated, not curator-reviewed)"
