identifier: PANTHER:PTHR22855
label: "ACETYL, PROPIONYL, PYRUVATE, AND GLUTACONYL CARBOXYLASE-RELATED"
definition: >-
  This entry represents a subgroup of acetyl-coenzyme A carboxyltransferase, including mitochondrial MCCB and bacterial AccD1. MCCB is a carboxyltransferase subunit of the 3-methylcrotonyl-CoA carboxylase, an enzyme that catalyses the conversion of 3-methylcrotonyl-CoA to 3-methylglutaconyl-CoA, a critical step for leucine and isovaleric acid catabolism. AccD1 transfers the CO2 from carboxybiotin to the CoA ester substrate in the biotin-dependent acyl-CoA carboxylase complex. This entry also includes GCDA from Acidaminococcus fermentans. It is the decarboxylase subunit of the primary sodium pump glutaconyl-CoA decarboxylase (GCD). Acetyl-coenzyme A carboxylase ( ) (ACC), a member of the biotin-dependent enzyme family, catalyses the formation of malonyl-coenzyme A (CoA) and regulates fatty acid biosynthesis and oxidation. Biotin-dependent carboxylase enzymes perform a two step reaction: enzyme-bound biotin is first carboxylated by bicarbonate and ATP and the carboxyl group temporarily bound to biotin is subsequently transferred to an acceptor substrate such as acetyl-CoA. The carboxyltransferase domain performs the second part of the reaction.
definition_source: "InterPro:IPR045190 abstract (PANTHER PTHR22855 is a member signature)"
