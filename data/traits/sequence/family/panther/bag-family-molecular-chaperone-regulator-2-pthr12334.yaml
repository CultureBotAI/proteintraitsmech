identifier: PANTHER:PTHR12334
label: "BAG FAMILY MOLECULAR CHAPERONE REGULATOR 2"
definition: >-
  This entry represents the BAG2 protein, which belongs to the BAG family. BAG2 acts as a nucleotide-exchange factor (NEF) promoting the release of ADP from the HSP70 and HSC70 proteins thereby triggering client/substrate protein release. BAG-family proteins contain a single BAG domain, except for human BAG-5 which has four BAG repeats. The BAG domain is a conserved region located at the C terminus of the BAG-family proteins that binds the ATPase domain of Hsc70/Hsp70. BAG family proteins regulate chaperone protein activities through their interaction with Hsc70/Hsp70.
