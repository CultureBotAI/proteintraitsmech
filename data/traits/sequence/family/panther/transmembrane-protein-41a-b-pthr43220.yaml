identifier: PANTHER:PTHR43220
label: "Transmembrane protein 41A/B"
definition: >-
  This entry includes human transmembrane protein 41A/B (TMEM41A/B) and related proteins. TMEM41B is involved in early stages of autophagosome biogenesis at the ER membrane probably via mobilization of neutral lipids from lipid droplets. TMEM41B and its homologues from fish are involved in motor neuron development. It is also a critical host factor required for infection by human coronaviruses SARS-CoV-2, HCoV-OC43, HCoV-NL63, and HCoV-229E, as well as all flaviviruses tested such as Zika virus and Yellow fever virus. The function of TMEM41A is not clear.
definition_source: "InterPro:IPR045014 abstract (PANTHER PTHR43220 is a member signature)"
