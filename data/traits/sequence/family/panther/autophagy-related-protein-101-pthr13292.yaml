identifier: PANTHER:PTHR13292
label: "AUTOPHAGY-RELATED PROTEIN 101"
definition: >-
  Atg101 is a critical autophagy factor that functions together with ULK, Atg13 and FIP200. In fission yeasts, it has a role in meiosis and sporulation.
