identifier: PANTHER:PTHR10791
label: "RAG1-ACTIVATING PROTEIN 1"
definition: >-
  The SWEET (Sugars Will Eventually be Exported Transporter) is a superfamily of sugar transporters found in both eukaryotes and prokaryotes. Eukaryotic SWEETs usually have seven transmembrane helices (TMHs), but most prokaryotic SWEETs (SemiSWEETs, InterPro:IPR047662) have only three TMHs. This entry represents eukaryotic SWEETs, which are specific sugar efflux transporters essential for the maintenance of animal blood glucose levels, plant nectar production, and plant seed and pollen development. They can carry mono- and disaccharides across a membrane following the concentration gradient. In many organisms it mediates glucose transport; in Arabidopsis it is necessary for pollen viability; and two of the rice homologues are specifically exploited by bacterial pathogens for virulence by means of direct binding of a bacterial effector to the SWEET promoter.
definition_source: "InterPro:IPR047664 abstract (PANTHER PTHR10791 is a member signature)"
