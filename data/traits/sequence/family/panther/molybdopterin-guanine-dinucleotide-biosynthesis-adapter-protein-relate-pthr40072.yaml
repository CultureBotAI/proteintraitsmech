identifier: PANTHER:PTHR40072
label: "MOLYBDOPTERIN-GUANINE DINUCLEOTIDE BIOSYNTHESIS ADAPTER PROTEIN-RELATED"
definition: >-
  This family of proteins includes GTP-binding proteins that are involved in the biosynthesis and utilization of the molybdenum cofactor, specifically the Mo-molybdopterin guanine dinucleotide (Mo-MGD) form. Although they are not essential for the formation of Mo-MGD or for the activation of molybdoenzymes that utilize this cofactor, they may serve as adapter proteins that enhance the efficiency of these processes. Members of this family exhibit a weak intrinsic GTPase activity and can also bind other nucleotides such as ATP, TTP, and GDP, albeit with lower affinity compared to GTP.
