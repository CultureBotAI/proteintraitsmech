identifier: PANTHER:PTHR45625
label: "PEPTIDYL-PROLYL CIS-TRANS ISOMERASE-RELATED"
definition: >-
  Cyclophilins exhibit peptidyl-prolyl cis-trans isomerase (PPIase) activity (EC:5.2.1.8), accelerating protein folding by catalysing the cis-trans isomerisation of proline imidic peptide bonds in oligopeptides. They also have protein chaperone-like functions and are the major high-affinity binding proteins for the immunosuppressive drug cyclosporin A (CSA) in vertebrates. Cyclophilins are found in all prokaryotes and eukaryotes, and have been structurally conserved throughout evolution, implying their importance in cellular function. They share a common 109 amino acid cyclophilin-like domain (CLD) and additional domains unique to each member of the family. The CLD domain contains the PPIase activity, while the unique domains are important for selection of protein substrates and subcellular compartmentalisation. This entry includes eukaryotic, bacterial and archeal proteins which exhibit a peptidylprolyl cis- trans isomerases activity (PPIase, Rotamase) and in addition bind the immunosuppressive drug cyclosporin (CsA). Immunosuppression in vertebrates is believed to be the result of the cyclophilin A-cyclosporin protein drug complex binding to and inhibiting the protein-phosphatase calcineurin. This entry also includes proteins that do not have the peptidyl-prolyl cis-trans isomerase activity, such as CWC27 from humans.
