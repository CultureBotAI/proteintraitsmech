identifier: PANTHER:PTHR19354
label: "ZIPPER PUTATIVE TUMOR SUPPRESSOR 2 HOMOLOG-LIKE PROTEIN-RELATED"
definition: >-
  The leucine zipper tumor suppressor (LZTS) family members are thought to play roles in cell growth modulation, mitosis and cancer cell growth suppression. This entry includes the protein families LZTS 1-3 from animals. LZTS1 (also known as FEZ1) plays a role in mitosis. It is associated with assembled microtubules and is involved in the stabilisation of active p34CDC2 (Cdk1). LZTS2 (LAPSER1) interacts with p80 katanin and regulates katanin-mediated microtubule severing. It alters cell proliferation by regulating cytokinesis. It is localised to the centrosome and the midbody in mitotic cells and modulates beta-catenin signalling and localisation. LZTS3 (ProSAP-interacting protein 1, ProSAPiP1) interacts with the PDZ domain of ProSAP2/Shank3, a scaffolding protein for components of the postsynaptic density (PSD) of excitatory brain synapses. It also interacts with the postsynaptic protein Sipa1l3/SPAR3.
definition_source: "InterPro:IPR045329 abstract (PANTHER PTHR19354 is a member signature)"
