identifier: PANTHER:PTHR14275
label: PROMETHIN
definition: >-
  LDAF1, also known as Promethin, is expressed in a variety of mammalian tissues including the adipose tissue, heart, kidney, and at lower levels in lung, liver, skeletal muscle and testis. It is up-regulated in liver with hepatic adiposis caused by PPARgamma (peroxisome proliferator-activated receptor-gamma) overexpression. LDAF1 has been shown to form a lipid droplet assembly complex with seipin.
definition_source: "InterPro:IPR029709 abstract (PANTHER PTHR14275 is a member signature)"
