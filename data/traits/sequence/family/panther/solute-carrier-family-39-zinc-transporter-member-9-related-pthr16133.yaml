identifier: PANTHER:PTHR16133
label: "SOLUTE CARRIER FAMILY 39  ZINC TRANSPORTER , MEMBER 9-RELATED"
definition: >-
  This entry represents the zinc transporter ZIP9 from eukaryotes. It also includes metal homeostasis factor ATX2 from yeast, which is involved in homeostasis of manganese ions. Some bacterial and archaeal zinc transporters are also included in this entry. In humans, ZIP9 is one of the 14 members of the ZIP (ZRT-and Irt-like Protein, SLC39A) family that regulates zinc homeostasis by transporting zinc across cell and organelle membranes into the cytoplasm. ZIP9 plays an important role in the activation of Akt and Erk in response to B cell-receptor activation. It has been shown to mediate rapid testosterone-dependent signaling, zinc influx, and apoptosis in breast and prostate cancer cell lines.
definition_source: "InterPro:IPR045891 abstract (PANTHER PTHR16133 is a member signature)"
