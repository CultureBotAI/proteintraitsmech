identifier: PANTHER:PTHR10231
label: "NUCLEOTIDE-SUGAR TRANSMEMBRANE TRANSPORTER"
definition: >-
  This family of membrane proteins transport nucleotide sugars from the cytoplasm into golgi vesicles. SLC35A1 (UniProtKB:P78382) transports CMP-sialic acid, SLC35A2 (UniProtKB:P78381) transports UDP-galactose and SLC35A3 (UniProtKB:Q9Y2D2) transports UDP-GlcNAc.
