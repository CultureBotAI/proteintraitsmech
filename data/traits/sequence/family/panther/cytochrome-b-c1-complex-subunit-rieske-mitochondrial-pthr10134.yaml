identifier: PANTHER:PTHR10134
label: "CYTOCHROME B-C1 COMPLEX SUBUNIT RIESKE, MITOCHONDRIAL"
definition: >-
  The Rieske subunit can be found in the Ubiquinol-cytochrome c reductase (bc1 complex or complex III) or the cytochrome b6f complex. The Rieske subunit acts by binding either a ubiquinol or plastoquinol anion, transferring an electron to the 2Fe-2S cluster, then releasing the electron to the cytochrome c or cytochrome f haem iron. The 2Fe-2S cluster is bound in the highly conserved C-terminal region of the Rieske subunit. Ubiquinol-cytochrome c reductase (bc1 complex or complex III) is an enzyme complex of bacterial and mitochondrial oxidative phosphorylation systems. It catalyses the oxidoreduction of the mobile redox components ubiquinol and cytochrome c, generating an electrochemical potential which is linked to ATP synthesis.The complex consists of three subunits in most bacteria, and nine in mitochondria: both bacterial and mitochondrial complexes contain cytochrome b and cytochrome c1 subunits, and an iron-sulphur `Rieske' subunit, which contains a high potential 2Fe-2S cluster. The mitochondrial form also includes six other subunits that do not possess redox centres. The plant cytochrome b6f is located in the thylakoid membrane and functions in both linear and cyclic electron transport, providing ATP and NADPH for photosynthetic carbon fixation. The cytochrome b6f complex has eight different subunits, six being encoded in the chloroplast genome (PetA [cyt f], PetB [cyt b6], PetD, PetG, PetL, and PetN) and two in the nucleus (PetC [Rieske FeS] and PetM. The complex functions as a dimer. In cyanobacteria, the cytochrome b6f complex contains four large subunits, including cytochrome f, cytochrome b6, the Rieske iron-sulfur protein (ISP), and subunit IV; as well as four small hydrophobic subunits, PetG, PetL, PetM, and PetN. Proteins in this entry also include arsenit
