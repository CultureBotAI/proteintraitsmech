  - kind: GENERAL
    text: >-
      E3 UBIQUITIN-PROTEIN LIGASE TRAIP — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46569. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function aminoacyltransferase activity, catalytic activity, acting on a protein, ubiquitin protein ligase activity. Members participate in replication fork processing, protein ubiquitination, DNA replication. Members localise to membrane-bounded organelle, non-membrane-bounded organelle, nucleus.
