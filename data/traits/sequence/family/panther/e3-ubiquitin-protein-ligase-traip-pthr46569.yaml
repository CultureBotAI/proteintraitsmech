  - kind: GENERAL
    text: >-
      The TRAIP family proteins are E3 ubiquitin ligases that play a crucial role in maintaining genome stability under replication stress. They regulate interstrand cross-link repair by ubiquitinating the MCM7 subunit of the CMG helicase complex, which influences the choice between repair pathways. The ubiquitination of MCM7 facilitates the recruitment of DNA glycosylase NEIL3 or, if cleavage fails, promotes CMG helicase unloading by the VCP/p97 ATPase for Fanconi anemia pathway engagement. TRAIP family members also participate in the repair of DNA-protein cross-links during DNA synthesis by targeting them for proteasomal degradation. Additionally, they have roles in mitotic spindle assembly checkpoint regulation and innate immune signaling, where they can negatively regulate NF-kappa-B activation and antiviral responses by ubiquitinating and degrading TNK1.
    source: "InterPro:IPR052639 abstract (LLM-generated, not curator-reviewed)"
