identifier: PANTHER:PTHR47283
label: "ENT-KAURENE OXIDASE, CHLOROPLASTIC"
definition: >-
  This entry represents a group of ent-kaurene oxidases from plants, including AtKO1 (also known as CYP701A3) from Arabidopsis. KO (kaurene oxidase) is a multifunctional cytochrome P450 catalysing three sequential oxidations in gibberellin phytohormone biosynthesis. These serve to transform the C4alpha methyl of the ent-kaurene olefin intermediate into the carboxylic acid moiety of ent-kauren-19-oic acid.
