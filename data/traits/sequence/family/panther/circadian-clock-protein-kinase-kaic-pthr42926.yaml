identifier: PANTHER:PTHR42926
label: "Circadian clock protein kinase KaiC"
definition: >-
  This entry represents circadian clock protein kinase KaiC from bacteria and some uncharacterised KaiC-like proteins from archaea. The circadian clock protein KaiC, is encoded in the kaiABC operon that forms the KaiABC oscillator complex which controls circadian rhythms and may be universal in Cyanobacteria. Each member contains two copies of the KaiC domain, which is also found in other proteins. KaiC performs autophosphorylation and acts as its own transcriptional repressor. The complex composition changes during the circadian cycle to control KaiC phosphorylation. KaiA stimulates KaiC autophosphorylation, while KaiB sequesters KaiA, leading to KaiC autodephosphorylation. Clock output pathways impact the RpaA transcriptional regulator. KaiC enhances the autophosphorylation activity of SasA, which then transfers its phosphate group to RpaA to activate it. KaiB and KaiC together enhance the phospho-RpaA dephosphatase activity of CikA.Kai proteins (KaiA and KaiC) appear to positively and negatively regulate kaiBC transcription which is consistent with a transcription/translation oscillatory (TTO) feedback model, believed to be at the core of all self-sustained circadian timers. However, the cyanobacterial circadian clock is able to function without de novo synthesis of clock gene mRNAs and the clock proteins, and the period is accurately determined without TTO feedback and the system is also temperature-compensated. It has been demonstrated that these three purified proteins form a temperature-compensated molecular oscillator in vitro that exhibits rhythmic phosphorylation and dephosphorylation of KaiC. A negative-stain electron microscopy study of Synechococcus elongatus (Thermosynechococcus elongatus) and Thermosynechococcus elongatus BP-1 KaiA-KaiC complexes in combina
definition_source: "InterPro:IPR030665 abstract (PANTHER PTHR42926 is a member signature)"
