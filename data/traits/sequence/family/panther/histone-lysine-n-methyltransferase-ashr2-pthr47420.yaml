identifier: PANTHER:PTHR47420
label: "HISTONE-LYSINE N-METHYLTRANSFERASE ASHR2"
definition: >-
  This entry includes ASHR2 from Arabidopsis. ASHR2 (also known as SDG39) contains the a disrupted SET domain in which the N-terminal one-third of the SET domain is separated from the C-terminal two-thirds of the domain by 50 to 120 amino acids.
