identifier: PANTHER:PTHR14942
label: "U11/U12 SMALL NUCLEAR RIBONUCLEOPROTEIN 25 KDA PROTEIN"
definition: >-
  U11 and U12 small nuclear ribonucleoprotein (snRNPs) bind U12-type pre-mRNAs as a preformed di-snRNP complex, simultaneously recognizing the 5' splice site and branchpoint sequence. SNRNP25 is a component of the U11/U12 snRNP complex. Homologues are known from animals, plants and fungi.
