    text: >-
      MOTILE SPERM DOMAIN-CONTAINING PROTEIN 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46384. and localise to organelle membrane contact site, organelle, endomembrane system.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the establishment of contact sites between the endoplasmic reticulum (ER) and various organelles such as endosomes, mitochondria, and the Golgi apparatus. They interact with proteins that contain conventional and phosphorylated FFAT motifs, which are bound to these organelles, facilitating the formation of these contact sites. Members of this family also play a role in lipid droplet (LD) homeostasis by forming contacts between the ER and LDs. This interaction is mediated through a direct protein-membrane interaction, specifically via an amphipathic helix that targets lipid packing defects on the LD surface. Additionally, these proteins are implicated in the regulation of immune cell migration, promoting the movement of monocytes and neutrophils in response to chemokines.
    source: "InterPro:IPR053012 abstract (LLM-generated, not curator-reviewed)"
