  - kind: GENERAL
    text: >-
      This family of proteins is involved in the transfer of phosphatidylinositol between different membrane compartments, which is crucial for the regulation of the phospholipid composition of plasma- and endomembranes. By modulating the lipid composition, these proteins may play a role in mechanisms of multidrug resistance. They are also implicated in the activation of phospholipase D1 and the inhibition of phospholipase B1, contributing to the turnover of phospholipids. Some family members form complexes with enzymes such as phosphatidylserine decarboxylase, which is essential for maintaining specific phospholipid levels in organelles like vacuoles. Additionally, they are involved in sterol biosynthesis regulation and may regulate the release of fatty acids from lipid droplets, indicating a broader role in lipid metabolism.
    source: "InterPro:IPR052578 abstract (LLM-generated, not curator-reviewed)"
