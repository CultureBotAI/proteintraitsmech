identifier: PANTHER:PTHR40137
label: "PROTEIN GVPK 1"
definition: >-
  Gas vesicles are intracellular, protein-coated, and hollow organelles found in cyanobacteria and halophilic archaea. They are permeable to ambient gases by diffusion and provide buoyancy, enabling cells to move upwards in liquid to access oxygen and/or light. This family represents Gas vesicle protein K from Streptomyces sp. (GvpK) and similar prokaryotic proteins involved in the formation of gas vesicles.
