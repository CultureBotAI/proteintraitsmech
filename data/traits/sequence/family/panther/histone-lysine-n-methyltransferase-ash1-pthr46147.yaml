identifier: PANTHER:PTHR46147
label: "HISTONE-LYSINE N-METHYLTRANSFERASE ASH1"
definition: >-
  HISTONE-LYSINE N-METHYLTRANSFERASE ASH1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46147. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein, histone modifying enzyme. Members are annotated with the molecular function histone H3K4 methyltransferase activity, protein-lysine N-methyltransferase activity, catalytic activity, acting on a protein. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-enclosed lumen, nucleoplasm.
