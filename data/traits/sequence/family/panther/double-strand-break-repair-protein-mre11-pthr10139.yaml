identifier: PANTHER:PTHR10139
label: "DOUBLE-STRAND BREAK REPAIR PROTEIN MRE11"
definition: >-
  DOUBLE-STRAND BREAK REPAIR PROTEIN MRE11 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10139. Members are annotated with the molecular function DNA endonuclease activity. Members participate in mitotic G2 DNA damage checkpoint signaling, double-strand break repair via homologous recombination, double-strand break repair via nonhomologous end joining. Members localise to site of double-strand break, non-membrane-bounded organelle, nuclear protein-containing complex.
