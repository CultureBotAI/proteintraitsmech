identifier: PANTHER:PTHR10139
label: "DOUBLE-STRAND BREAK REPAIR PROTEIN MRE11"
definition: >-
  DOUBLE-STRAND BREAK REPAIR PROTEIN MRE11 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10139. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, DNA endonuclease activity. and participate in meiotic DNA double-strand break formation, double-strand break repair via nonhomologous end joining, telomere organization. and localise to non-membrane-bounded organelle, protein-containing complex, site of double-strand break.
