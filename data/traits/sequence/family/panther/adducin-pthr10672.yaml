  - kind: GENERAL
    text: >-
      ADDUCIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10672. PANTHER protein class: non-motor actin binding protein. Members are annotated with the molecular function actin filament binding. Members localise to non-membrane-bounded organelle, cytoskeleton, intracellular anatomical structure.
