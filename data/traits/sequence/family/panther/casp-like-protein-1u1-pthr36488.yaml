identifier: PANTHER:PTHR36488
label: "CASP-LIKE PROTEIN 1U1"
definition: >-
  Casparian Strip Membrane Domain Proteins (CASPs) are four-membrane-span proteins that recruit the lignin polymerisation machinery necessary for the deposition of Casparian strips in the endodermis. CASP-like proteins (CASPLs) are found in all major divisions of land plants as well as in green algae. In Arabidopsis, CASPLs show specific expression in a variety of cell types. This entry represents a group of CASP domain-containing proteins, including casparian strip membrane protein 1-7, CASP-like protein 1E1, 1D1 and CASP-like proteins 1U1/2/3 from rice.
