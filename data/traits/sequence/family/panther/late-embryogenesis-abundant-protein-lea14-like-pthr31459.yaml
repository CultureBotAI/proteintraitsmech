identifier: PANTHER:PTHR31459
label: "Late embryogenesis abundant protein Lea14-like"
definition: >-
  This family includes Lea14-like proteins which contain a Water Stress and Hypersensitive response (WHy) domain, a region of unknown function found in several plant proteins involved in either the response to water stress or the response to bacterial infection. This entry also includes WHy domain-containing proteins from bacteria. Their function is not clear. LEA (late embryogenesis abundant) proteins were first identified in land plants. Plant LEA proteins have been found to accumulate to high levels during the last stage of seed formation (when a natural desiccation of the seed tissues takes place) and during periods of water deficit in vegetative organs. Later, LEA homologues have also been found in various species. They have been classified into several subgroups in Pfam and according to Bray and Dure.
definition_source: "InterPro:IPR045043 abstract (PANTHER PTHR31459 is a member signature)"
