definitions:
  - kind: GENERAL
    text: >-
      TRNA-DIHYDROURIDINE(20) SYNTHASE [NAD(P)+]-LIKE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45936. PANTHER protein class: RNA metabolism protein, RNA processing factor. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, catalytic activity, acting on RNA, oxidoreductase activity, acting on the CH-CH group of donors, NAD or NADP as acceptor. Members participate in cellular aromatic compound metabolic process, biosynthetic process, RNA modification. Members localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the NAD(P)H-dependent synthesis of dihydrouridine, a modified base commonly found in the D-loop of tRNAs. Members of this family specifically modify uridine at position 20 in cytoplasmic tRNAs, contributing to the structural and functional diversity of tRNA molecules. Some family members are also capable of modifying certain mRNAs, which can influence their translation. Additionally, certain members of this family are involved in cellular regulatory mechanisms, such as the negative regulation of EIF2AK2/PKR activation, which is a protein kinase involved in the response to viral infection and other cellular stresses.
    source: "InterPro:IPR052582 abstract (LLM-generated, not curator-reviewed)"
