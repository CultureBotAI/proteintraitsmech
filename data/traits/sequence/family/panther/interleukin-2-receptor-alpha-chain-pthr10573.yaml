identifier: PANTHER:PTHR10573
label: "INTERLEUKIN-2 RECEPTOR ALPHA CHAIN"
definition: >-
  The interleukin-2 receptor is a heterotrimer composed of one alpha chain, one beta chain, and one gamma chain, all of which are in contact with the ligand when the receptor is occupied. IL-2 itself has been shown to regulate IL-2R alpha expression in vitro.
