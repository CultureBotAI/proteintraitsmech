identifier: PANTHER:PTHR31330
label: "NEMATODE SPECIFIC PEPTIDE FAMILY, GROUP C"
definition: >-
  This entry represents a group of uncharacterised worm proteins. They contain highly conserved cysteine residues that are predicted to form disulfide bonds. It is likely that these proteins are secreted.
