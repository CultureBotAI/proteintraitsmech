label: "PEROXISOMAL BIOGENESIS FACTOR 11"
definition: >-
  PEROXISOMAL BIOGENESIS FACTOR 11 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12652. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 15 of its annotated subfamilies. Subfamilies participate in peroxisome organization, organelle fission. Subfamilies localise to peroxisome, peroxisomal membrane, intracellular anatomical structure.
