identifier: PANTHER:PTHR14879
label: "CASPASE REGULATOR, RING FINGER DOMAIN-CONTAINING"
definition: >-
  This family of proteins functions as E3 ubiquitin-protein ligases, which play a crucial role in the ubiquitin-proteasome system. They are responsible for the transfer of ubiquitin from E2 enzymes to specific substrate proteins, marking them for proteasomal degradation. This process is essential for regulating a variety of biological processes including cell death, cell migration, and various signaling pathways. Members of this family are characterized by the presence of RING-type and FYVE-type zinc finger domains, which are essential for their ubiquitination activity and localization within the cell, respectively. The RING-type zinc finger domain is crucial for the recognition and ubiquitination of target proteins, while the FYVE-type domain is involved in membrane localization, often to endosomal compartments. Through the ubiquitination of various targets, including caspases and the tumor suppressor p53, these ligases are involved in the negative regulation of apoptosis, cell signaling, and immune responses.
