definitions:
  - kind: GENERAL
    text: >-
      ZINC-FINGER PROTEIN NOLZ1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12522. and participate in negative regulation of cellular metabolic process, negative regulation of DNA-templated transcription, negative regulation of RNA metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
