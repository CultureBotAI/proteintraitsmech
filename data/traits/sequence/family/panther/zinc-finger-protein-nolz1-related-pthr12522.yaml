identifier: PANTHER:PTHR12522
label: "ZINC-FINGER PROTEIN NOLZ1-RELATED"
definition: >-
  The Elbow/Noc family comprises zinc finger proteins that function predominantly as transcriptional corepressors, which do not directly bind DNA but may regulate transcription through recruitment of histone deacetylases to gene promoters. Members of the family are involved in various developmental processes, including the regulation of cell fate, cell adhesion, migration, proliferation, and differentiation. Specific roles have been identified in the development of sensory organs, neural plate border specification, hindbrain segmentation, and appendage formation. Some members may also function as transcriptional repressors and play roles in Notch signaling pathways, affecting cell proliferation and development of the supraesophageal ganglion, ocelli, and tracheal systems.
