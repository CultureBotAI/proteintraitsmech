identifier: PANTHER:PTHR33415
label: "PROTEIN EMBRYO DEFECTIVE 514"
definition: >-
  Defective chloroplasts and leaves protein (DCL), first identified in tomato, is a small protein that plays a role in the early stage of chloroplast development and palisade cell morphogenesis,]. It is required for correct plastid ribosome assembly and for processing and maturation of 4.5S rRNA. This entry includes DCL from Solanum lycopersicum (Tomato) and its orthologue from Arabidopsis. Also included in this entry is the Protein EMBRYO DEFECTIVE 514 (also known as DOMINO1) from Arabidopsis thaliana, which is involved in ribosome biogenesis and in a process essential for nuclear and nucleolar functions. It shares high sequence similarities with DCL proteins.
definition_source: "InterPro:IPR044673 abstract (PANTHER PTHR33415 is a member signature)"
