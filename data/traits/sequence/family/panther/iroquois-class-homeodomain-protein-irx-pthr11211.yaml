label: "IROQUOIS-CLASS HOMEODOMAIN PROTEIN IRX"
definition: >-
  IROQUOIS-CLASS HOMEODOMAIN PROTEIN IRX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11211. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II, cell development. Members localise to nucleus, intracellular anatomical structure.
