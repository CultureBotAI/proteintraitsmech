identifier: PANTHER:PTHR42999
label: "ANTIBIOTIC RESISTANCE PROTEIN MCBG"
definition: >-
  This family of proteins includes members that are involved in providing immunity to certain peptide antibiotics, such as microcin B17, which targets DNA replication in Enterobacteriaceae. The proteins in this family can function in conjunction with others to induce the SOS repair system as a protective mechanism. Some members may also offer protection independently.
