identifier: PANTHER:PTHR42342
label: "STATIONARY PHASE PROTEIN 5"
definition: >-
  SPG5 (stationary phase protein 5) was identified as a protein required for survival at high temperature during stationary phase in Saccharomyces cerevisiae. SPG5 is a positive regulator of the proteasome that is strongly induced in the stationary phase. It is critical for survival of cells that have ceased to proliferate due to nutrient limitation.
