identifier: PANTHER:PTHR47368
label: NUMB
definition: >-
  This group represents Protein numb and similar proteins from animals. This protein plays key roles in cell fate determination. Members of this protein family contain a PID domain, a type of PTB domain. NUMB from Drosophila is required in determination of cell fate during sensory organ formation in embryos. It recruits alpha-Adaptin, and this physical interaction plays a role in downregulating Notch, presumably by stimulating endocytosis of Notch. Numb-related protein 1 (NUMB1) from Caenorhabditis elegans is involved in the tethering and targeting of pkc-3 to modulate the intracellular distribution of the kinase.
