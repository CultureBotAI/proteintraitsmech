identifier: PANTHER:PTHR39576
label: "ATTACHING AND EFFACING PROTEIN HOMOLOG-RELATED-RELATED"
definition: >-
  This family of proteins includes members that are involved in bacterial adhesion and invasion processes. They are known to mediate the attachment of enteric bacteria to mammalian cells, which is a critical step in the pathogenesis of certain infections. These proteins interact with host cell receptors, such as beta-1 chain integrins, to facilitate entry into the cells. Additionally, they are implicated in the formation of attaching and effacing lesions on tissue culture cells, which is a hallmark of enteropathogenic and enterohemorrhagic bacterial infections. The family is characterized by a conserved domain structure that allows for the adherence to and invasion of host tissues, playing a key role in bacterial virulence and host-pathogen interactions.
