identifier: PANTHER:PTHR23079
label: "RNA-DEPENDENT RNA POLYMERASE"
definition: >-
  This entry also includes QDE-1 from the filamentous fungus Neurospora. QDE-1 is both an RdRP and a DNA-dependent RNA polymerase (DdRP). It is able to synthesize RNA from both ssRNA and single-stranded DNA (ssDNA). RNA dependent RNA polymerases (RDRP) enzymes (RDRP; EC:2.7.7.48 ) are involved in the amplification of regulatory microRNAs during post-transcriptional gene silencing; they are also required for transcriptional gene silencing. Double-stranded RNA has been shown to induce gene silencing in diverse eukaryotes by a variety of pathways. These enzymes also play a role in the RNA interference (RNAi) pathway, which is important for heterochromatin formation, accurate chromosome segregation, centromere cohesion, and telomere function during mitosis and meiosis. RDRP enzymes are highly conserved in most eukaryotes but are missing in archaea and bacteria. The core catalytic domain of RDRP enzymes is structurally similar to the beta' subunit of DNA-dependent RNA polymerases (DDRP); however, the other domains of DDRP show no similarity to those of RDRP.
definition_source: "InterPro:IPR007855 abstract (PANTHER PTHR23079 is a member signature)"
