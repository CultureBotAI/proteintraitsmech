identifier: PANTHER:PTHR46315
label: "SPERMINE SYNTHASE"
definition: >-
  The polyamines putrescine, spermidine and spermine represent a group of naturally occurring compounds exerting a bewildering number of biological effects. Their biosynthesis is accomplished by a concerted action of four different enzymes: ornithine decarboxylase, adenosylmethionine decarboxylase, spermidine synthase and spermine synthase. The development and introduction of specific inhibitors to the biosynthetic enzymes of the polyamines have revealed that an undisturbed synthesis of the polyamines is a prerequisite for animal cell proliferation to occur.
