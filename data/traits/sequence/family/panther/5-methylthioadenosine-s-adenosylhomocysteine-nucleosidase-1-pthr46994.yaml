identifier: PANTHER:PTHR46994
label: "5'-METHYLTHIOADENOSINE/S-ADENOSYLHOMOCYSTEINE NUCLEOSIDASE 1"
definition: >-
  This entry represents 5'-Methylthioadenosine/S-adenosylhomocysteine (MTA/SAH) nucleosidase (MTAN), which plays a key role in the methionine-recycling pathway of bacteria and plants. Bacterial and plant MTANs show significant conservation in the overall structure, and the adenine- and ribose-binding sites. Two similar nucleosidases for hydrolysing MTA in Arabidopsis thaliana (AtMTAN1 and AtMTAN2) exist, but only AtMTAN2 shows markedly broad substrate specificity for hydrolysis of SAH.
definition_source: "InterPro:IPR044580 abstract (PANTHER PTHR46994 is a member signature)"
