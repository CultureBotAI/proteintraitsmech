    text: >-
      ZINC FINGER, RING/FYVE/PHD-TYPE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46016. Members are annotated with the molecular function ubiquitin protein ligase activity. Members participate in protein polyubiquitination, ubiquitin-dependent protein catabolic process.
