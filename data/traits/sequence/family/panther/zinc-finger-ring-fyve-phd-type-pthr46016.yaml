  - kind: GENERAL
    text: >-
      ZINC FINGER, RING/FYVE/PHD-TYPE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46016. Members are annotated with the molecular function ubiquitin protein ligase activity. Members participate in protein polyubiquitination, ubiquitin-dependent protein catabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The RNF E3 ubiquitin-protein ligase family mediates ubiquitination and proteasomal degradation of various target proteins, regulating multiple biological processes such as cell cycle, apoptosis, osteoclastogenesis, innate and adaptive immunity, and interferon production. Family members act as negative regulators of NF-kappa-B-dependent transcription, promoting ubiquitination and stabilization of NF-kappa-B inhibitors. They also ubiquitinate CDK inhibitors, stimulating cell cycle transition and suppressing senescence. Some members negatively regulate type I interferon production and T-cell activation, while others facilitate xenophagic targeting of bacteria and inhibit viral replication. The family's domain structure, including the C2HC RNF-type zinc finger and RING-type zinc finger, is crucial for binding to ubiquitin-conjugating enzymes.
    source: "InterPro:IPR051438 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
