identifier: PANTHER:PTHR11059
label: "DNA REPAIR PROTEIN RECN"
definition: >-
  DNA repair protein RecN is thought to be DNA damage inducible and involved in recombinational processes. RecN is part of the AAA+ superfamily of ATPases. The N-terminal region of most of the bacterial RecN proteins sequenced to date contains an ATP/GTP binding domain within an SMC-like motif. SMC-like domains are involved in chromosomal scaffolding and segregation. It is possible that the function of RecN in homologous recombination is either structural or enzymatic or both. RecN may be involved in the proper positioning of the recombining segments of DNA, ensuring normal recombination. The observation that inactivation of this gene leads to a decreased transformation efficiency, as well as increased sensitivity to DNA-damaging agents, may be due to some defect in chromosomal partitioning or positioning during these recombination-dependent processes. The protein may function presynaptically to process double-stranded breaks to produce 3 single-stranded DNA intermediates during recombination. The AAA+ superfamily of ATPases is found in all kingdoms of living organisms where they participate in diverse cellular processes including membrane fusion, proteolysis and DNA replication. Although the terms AAA+ and AAA are often used loosely and interchangeably, the classical AAA family members are distinguished by their possession of the SRH region in the AAA module. Many AAA+ proteins are involved in similar processes to those of AAA proteins (facilitation of protein folding and unfolding, assembly or disassembly of proteins complexes, protein transport and degradation), but others function in replication, recombination, repair and transcription. For a review see.
