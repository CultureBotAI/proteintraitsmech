identifier: PANTHER:PTHR45084
label: "ERAD-ASSOCIATED E3 UBIQUITIN-PROTEIN LIGASE COMPONENT HRD3A-RELATED"
definition: >-
  This entry includes HRD3 and related proteins from plants. In Arabidopsis there are two homologues, HRD3A and HRD3B. HRD3 is part of the HRD1/HRD3 complex involved in the ERAD (endoplasmic reticulum and subsequently degraded by ER-associated degradation) pathway. HRD3A is involved in salt acclimation memory.
