identifier: PANTHER:PTHR45755
label: "Zinc transporter Msc2-like"
definition: >-
  This entry represents a group of metal transporters, including Msc2 from budding yeasts, Cis4 from fission yeasts, SLC30A5/7 (also known as ZNT7/5) from humans and MTPC2/MTP12 from Arabidopsis. They are zinc transporters involved in zinc ion homeostasis. ZNT5/7 in the early secretory pathway, regulate the activation and folding of enzymes like alkaline phosphatases and enzymes involved in phosphatidylinositol glycan anchor biosynthesis.
definition_source: "InterPro:IPR045316 abstract (PANTHER PTHR45755 is a member signature)"
