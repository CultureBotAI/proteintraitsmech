identifier: PANTHER:PTHR23325
label: "SERUM RESPONSE FACTOR-BINDING"
definition: >-
  Budding yeast Bud22 is required for rRNA maturation and ribosomal subunit biogenesis. Serum response factor-binding protein 1 (SRFB1) is Bud22 homologue in animals. SRFB1 may be involved in regulating transcriptional activation of cardiac genes during the aging process and may play a role in biosynthesis and/or processing of SLC2A4 in adipose cells.
