  - kind: GENERAL
    text: >-
      The NmrA-like family is composed of redox sensor proteins that undergo structural and subcellular changes in response to intracellular NADPH/NADP(+) levels. These proteins can exist as monomers or dimers, with their oligomeric state influenced by NADPH concentrations. As monomers, they interact with argininosuccinate synthase, inhibiting nitric oxide synthesis and preventing apoptosis. As dimers, they bind NADPH, which is necessary for dimer stability. The family also includes proteins involved in the regulation of nitrogen metabolite repression and the biosynthesis of various secondary metabolites, such as mycotoxins, indole diterpenes, fungal indole alkaloids, and piperazines. These biosynthetic processes involve complex enzymatic reactions including prenylation, cyclization, hydroxylation, methylation, and redox reactions, contributing to the production of bioactive compounds with potential pharmaceutical relevance.
    source: "InterPro:IPR051164 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
