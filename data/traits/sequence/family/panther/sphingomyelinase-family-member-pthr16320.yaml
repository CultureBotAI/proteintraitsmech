identifier: PANTHER:PTHR16320
label: "SPHINGOMYELINASE FAMILY MEMBER"
definition: >-
  This entry includes SMPD2/3 from animals, Isc1/Css1 from yeasts and sphingomyelinase C (also known as sph) from bacteria. Neutral sphingomyelinase (nSMase) sphingomyelin phosphodiesterase SMPD2 hydrolyzes sphingomyelin to phosphocholine and ceramide. SMPD2, differently to nSMase SMPD3, which is prominent in brain, is ubiquitously expressed. Both are involved in vesicle budding from the plasma membrane. Budding yeast Isc1 is inositol phosphosphingolipid phospholipase C that localizes to mitochondria in the post-diauxic phase of yeast growth. Fission yeast Isc1 homologue, Css1, localizes to the entire plasma membrane and secretory pathway.
definition_source: "InterPro:IPR038772 abstract (PANTHER PTHR16320 is a member signature)"
