identifier: PANTHER:PTHR45812
label: "DNA POLYMERASE ZETA CATALYTIC SUBUNIT"
definition: >-
  DNA polymerase zeta (Pol zeta) belongs to the B-family of polymerases. It is a nonessential DNA polymerase responsible for the majority of damage-induced mutagenesis in eukaryotes. It is involved in double-strand breaks DNA repair and has a major role in translesion DNA synthesis (TLS), an alternative DNA damage tolerance mechanism that allows the DNA replication machinery to replicate past DNA lesions. Pol zeta lacks proofreading activity and its discrimination against insertion of incorrect bases is lower than that of other B-family polymerases. Discrimination against ribonucleotide incorporation is only slightly lower than in the case of the replicative DNA polymerases. Originally discovered in budding yeast, genes encoding this enzyme have been found in all fully sequenced eukaryotic genomes. Its role in translesion replication is probably the most widespread.
definition_source: "InterPro:IPR030559 abstract (PANTHER PTHR45812 is a member signature)"
