identifier: PANTHER:PTHR23319
label: "GRAM DOMAIN CONTAINING 1B, ISOFORM E"
definition: >-
  This family of proteins is involved in the non-vesicular transport of cholesterol between cellular membranes, particularly from the plasma membrane to the endoplasmic reticulum. Members contain unique domains that bind cholesterol and phosphatidylserine, enabling them to serve as molecular bridges facilitating cholesterol transfer. These proteins play a significant role in maintaining cholesterol homeostasis within cells. Some family members are also implicated in autophagy regulation, tumor progression, and the formation of endoplasmic reticulum-plasma membrane contact sites in response to cholesterol levels.
