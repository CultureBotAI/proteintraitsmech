identifier: PANTHER:PTHR38658
label: "OXPP CYCLE PROTEIN OPCA-RELATED"
definition: >-
  OpcA protein may play a role in the functional assembly of glucose-6-phosphate dehydrogenase. The opcA gene is found immediately downstream of zwf, the glucose-6-phosphate dehydrogenase (G6PDH) gene, in a number of species, including Mycobacterium tuberculosis, Streptomyces coelicolor, Nostoc punctiforme (strain ATCC 29133/PCC 73102), and Synechococcus sp. (strain PCC 7942). In the latter, disruption of opcA was shown to block assembly of G6PDH into active oligomeric forms.
definition_source: "InterPro:IPR004555 abstract (PANTHER PTHR38658 is a member signature)"
