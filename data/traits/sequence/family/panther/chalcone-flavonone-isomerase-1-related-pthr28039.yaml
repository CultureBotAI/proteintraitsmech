identifier: PANTHER:PTHR28039
label: "CHALCONE--FLAVONONE ISOMERASE 1-RELATED"
definition: >-
  This entry represents a group of plant chalcone--flavonone isomerases (CHIs), including CHI1/2 from Arabidopsis and CHIA/B from Petunia hybrida. CHI catalyses the conversion of chalcones to chiral (S)-flavanones, which is a committed step in the production of plant flavonoids, compounds that contribute to attraction, defence and development.
