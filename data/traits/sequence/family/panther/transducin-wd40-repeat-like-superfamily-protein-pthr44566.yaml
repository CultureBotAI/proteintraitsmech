  - kind: GENERAL
    text: >-
      This family of proteins contains WD repeat domains, which are minimally conserved regions of approximately 40 amino acids typically bracketed by gly-his (GH) and tryptophan-aspartic acid (WD) dipeptides. Proteins with WD repeats are involved in a variety of cellular processes, including signal transduction, RNA processing, gene regulation, vesicular trafficking, cytoskeletal assembly, and may also serve as platforms for protein-protein interactions. The specific functions of WD repeat-containing protein 25 in mice and humans are not detailed in the provided information, but by virtue of the WD repeat domain, these proteins are likely to participate in some of the aforementioned processes.
