identifier: PANTHER:PTHR31121
label: "ALPHA-1,2 MANNOSYLTRANSFERASE KTR1"
definition: >-
  This entry represents a family of fungi mannosyl-transferases involved in N-linked and O-linked glycosylation of proteins. They belong to the glycosyltransferase family 15 (CAZy:GT15). Some of the enzymes in this family have been shown to be involved in O- and N-linked glycan modifications in the Golgi. The biosynthesis of disaccharides, oligosaccharides and polysaccharides involves the action of hundreds of different glycosyltransferases. These enzymes catalyse the transfer of sugar moieties from activated donor molecules to specific acceptor molecules, forming glycosidic bonds. A classification of glycosyltransferases using nucleotide diphospho-sugar, nucleotide monophospho-sugar and sugar phosphates ([ec:2.4.1.-]) and related proteins into distinct sequence-based families has been described. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. The same three-dimensional fold is expected to occur within each of the families. Because 3-D structures are better conserved than sequences, several of the families defined on the basis of sequence similarities may have similar 3-D structures and therefore form 'clans'.
definition_source: "InterPro:IPR002685 abstract (PANTHER PTHR31121 is a member signature)"
