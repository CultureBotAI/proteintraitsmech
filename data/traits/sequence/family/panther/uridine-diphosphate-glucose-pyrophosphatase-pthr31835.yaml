identifier: PANTHER:PTHR31835
label: "URIDINE DIPHOSPHATE GLUCOSE PYROPHOSPHATASE"
definition: >-
  This entry represents a family of eukaryotic proteins, including animal Uridine diphosphate glucose pyrophosphatase NUDT22 and plant Nudix hydrolase 9 (NUDT9). NUDT22 hydrolyses UDP-glucose to glucose 1-phosphate and UMP and UDP-galactose to galactose 1-phosphate and UMP. Preferred substrate is UDP-glucose.
