identifier: PANTHER:PTHR43432
label: "SLR0285 PROTEIN"
definition: >-
  Proteins in this entry possess the radical SAM domain. Included in this entry are the uncharacterised proteins MJ0683 (from Methanocaldococcus jannaschii), MT2655 and Rv2578c (from Mycobacterium tuberculosis), Mb2609c (from Mycobacterium bovis) and ORF301 (from Acidianus two-tailed virus). Also included in this entry is the radical SAM Nalpha-GlyT isomerase from Pseudomonas phage M6 which isomerizes 5-N-alpha-glycinylthymidine (Nalpha-GlyT) into 5-Calpha-glycinylthymidine (Calpha-GlyT) as a step in the pathway leading to thymidine hypermodifications in the viral genome; these modifications may prevent degradation of viral genome by the host restriction-modification antiviral defense system.
definition_source: "InterPro:IPR040086 abstract (PANTHER PTHR43432 is a member signature)"
