identifier: PANTHER:PTHR42739
label: "MALATE SYNTHASE G"
definition: >-
  Malate synthase G (MSG, 723 residues) is an enzyme of the glyoxylate pathway, that catalyses the Claisen condensation and subsequent hydrolysis of acetyl-coenzyme A (acetyl-CoA) and glyoxylate to form malate and CoA. This biochemical bypass is used by microorganisms (bacteria, yeast, and fungi) for biosynthesis under anaerobic conditions. Enzymes of the glyoxylate bypass have been implicated as virulence factors in several pathogens, including Mycobacterium tuberculosis. The X-ray structure of the ternary abortive complex of MSG with pyruvate (glyoxylate mimic) and acetyl-CoA has been determined and shown to have the same structure as in the complex with glyoxylate. MSG is composed of four domains: an N-terminal α-helical clasp, a central TIM barrel α/β core, an α/β domain which may have a regulatory function, and a C-terminal five α-helical bundle. The cleft between the TIM β/α-barrel fold and the C-terminal helical domain forms the active site of malate synthases.
definition_source: "InterPro:IPR006253 abstract (PANTHER PTHR42739 is a member signature)"
