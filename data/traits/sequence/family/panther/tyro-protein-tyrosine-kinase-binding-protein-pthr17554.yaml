identifier: PANTHER:PTHR17554
label: "TYRO PROTEIN TYROSINE KINASE-BINDING PROTEIN"
definition: >-
  TYRO protein tyrosine kinase-binding protein (Tyrobp), also called DNAX-activation protein 12 (DAP12), is expressed by NK cells and myeloid cells and mediates signalling for numerous cell-surface receptors expressed by these cells. It has been shown to both potentiate and attenuate the activation of these cells. More than 20 receptor chains have been shown to associate with DAP12. It is involved for instance in neutrophil activation mediated by integrin.
definition_source: "InterPro:IPR026200 abstract (PANTHER PTHR17554 is a member signature)"
