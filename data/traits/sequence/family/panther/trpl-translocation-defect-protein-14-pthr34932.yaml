  - kind: GENERAL
    text: >-
      This family of proteins includes GTP-binding proteins involved in the trafficking of ion channels in photoreceptor cells. They play a crucial role in the light-dependent internalization and recycling of specific ion channels, such as the TRPL channel, between the rhabdomere and the cell body. Members of this family are capable of binding to specific phospholipids, including 3-phosphoinositide and phosphatidic acid, which suggests interactions with cellular membranes, particularly early endosomes. Their activity is essential for maintaining photoreceptor cell integrity and preventing degeneration.
    source: "InterPro:IPR053227 abstract (LLM-generated, not curator-reviewed)"
