  - kind: GENERAL
    text: >-
      The PX domain-containing GAP family is characterized by its involvement in the regulation of small GTPases such as RHOA, CDC42, and RAC1. Members of this family function as GTPase-activating proteins (GAPs), promoting GTP hydrolysis and thus regulating the activity of their target GTPases. These proteins play critical roles in various cellular processes, including intracellular trafficking, glucose transport regulation, neuronal cell differentiation, dendritic spine actin reorganization, and cell migration. The N-terminal PX domain of these proteins specifically interacts with phosphatidylinositides, which is essential for their localization and function within the cell. The family's involvement in cross-talk between Ras- and Rho-regulated signaling pathways highlights its importance in cell growth regulation.
    source: "InterPro:IPR051576 abstract (LLM-generated, not curator-reviewed)"
