  - kind: GENERAL
    text: >-
      CDC42 GTPASE-ACTIVATING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15729. PANTHER protein class: GTPase-activating protein. Members are annotated with the molecular function nucleoside-triphosphatase regulator activity, enzyme activator activity, molecular function activator activity. and participate in intracellular signaling cassette, small GTPase-mediated signal transduction, regulation of cellular process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
