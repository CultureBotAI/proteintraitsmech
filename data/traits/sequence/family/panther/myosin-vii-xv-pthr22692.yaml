identifier: PANTHER:PTHR22692
label: "MYOSIN VII, XV"
definition: >-
  The Unconventional Myosin family comprises motor proteins with ATPase activity that interact with actin filaments for intracellular movements. Members of the family have highly divergent tails, which are thought to bind to membranous compartments, facilitating their movement relative to the actin cytoskeleton. These myosins play critical roles in various cellular processes, including the differentiation and organization of epithelial brush borders, the renewal of photoreceptor disks, the distribution of pigment epithelial melanosomes, and the arrangement of stereocilia in hair cells. They are also involved in mechanotransduction in cochlear hair cells, necessary for normal hearing, and in the transport of opsin in retinal photoreceptors. Some family members are involved in the formation of cellular projections and are essential for embryonic and larval viability, as well as for auditory transduction by organizing Johnston's organ.
