identifier: PANTHER:PTHR31431
label: "NUCLEOPORIN NUP188 HOMOLOG"
definition: >-
  Nup188 is one of the many peptides that make up the nucleoporin complex (NPC), and is found across eukaryotes. The Nup188 subcomplex (Nic96p-Nup188p-Nup192p-Pom152p) is one of at least six that make up the NPC, and as such is symmetrically localised on both faces of the NPC at the nuclear end, being integrally bound to the C terminus of Pom34p.
