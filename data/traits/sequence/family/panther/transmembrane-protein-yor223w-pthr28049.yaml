identifier: PANTHER:PTHR28049
label: "TRANSMEMBRANE PROTEIN YOR223W"
definition: >-
  This entry represents DSC E3 ubiquitin ligase complex subunit 3 (Dsc3), a component of the DSC E3 ubiquitin ligase complex (a Golgi-specific protein ubquitination system) that functions in protein homeostasis under non-stress conditions, playing a role in protein quality control through endosome and Golgi-associated degradation pathway (EGAD) which targets membrane proteins at Golgi and endosomes for degradation by cytosolic proteasomes. Dsc3 is also involved in endocytic protein trafficking. Dsc3 has an ubiquitin-like domain and two C-terminal transmembrane regions. Yeast DSC E3 ubiquitin ligase complex is the homologue of Hrd1 E3 ligase complex from mammals, in which Dsc1, Dsc2 and Dsc3 corresponds to Hrd1, Der1, and Usa1, respectively. Dsc3 is a Herp-like protein that acts as a bridge between Dsc1 and Dsc2 for their interaction.
definition_source: "InterPro:IPR045226 abstract (PANTHER PTHR28049 is a member signature)"
