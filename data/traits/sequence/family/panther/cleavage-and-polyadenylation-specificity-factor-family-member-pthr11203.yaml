identifier: PANTHER:PTHR11203
label: "CLEAVAGE AND POLYADENYLATION SPECIFICITY FACTOR FAMILY MEMBER"
definition: >-
  This entry represents Metallo-Beta-Lactamase Domain (MLB) family. MLB proteins are involved RNA processing, particularly in the cleavage and polyadenylation of pre-mRNA, which is a critical step in mRNA maturation and stability. Members of this family are characterised by the presence of a MLB domain which is indicative of their role in RNA metabolism. Members of this family include endoribonuclease YSH1 found in bacteria, transcription termination factor FttA found in archaea and members of the cleavage factor I (CPSF3) and integrator complex suunit 11 (INT11) found in eukaryotes. They are involved in ranscription and processing of small nuclear RNAs (snRNAs), histone pre-mRNA processing, as well as in the biogenesis of microRNAs (miRNAs). They are essential for proper gene expression regulation and are linked to various cellular processes, including cell cycle progression.
definition_source: "InterPro:IPR050698 abstract (PANTHER PTHR11203 is a member signature)"
