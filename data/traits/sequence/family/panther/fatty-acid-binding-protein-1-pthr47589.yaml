identifier: PANTHER:PTHR47589
label: "FATTY-ACID-BINDING PROTEIN 1"
definition: >-
  This entry represents a group of plant fatty-acid-binding proteins, including AtFAP1 from Arabidopsis. The function of AtFAP1 is not clear. Despite its similarity with chalcone isomerase (CHI), AtFAP1 has substitutions at nearly all of the critical catalytic positions of AtCHI, and is devoid of catalytic activity. This entry also includes CHIL1 from Humulus lupulus (European hop). CHIL1 is involved in DMX (demethylxanthohumol) biosynthesis.
