  - kind: GENERAL
    text: >-
      The SorC transcriptional regulatory family is comprised of proteins that function as transcriptional regulators with diverse roles in bacterial gene expression. Members of this family typically act as repressors or activators of operons in response to specific inducers or environmental conditions. For instance, LsrR proteins regulate the transcription of the lsr operon and their own transcription in the presence or absence of autoinducer 2 (AI-2), with AI-2 inactivation leading to operon transcription. Other family members, such as DeoR and EryD, control operons related to nucleoside and erythritol catabolism, respectively. The central glycolytic genes regulator (CggR) modulates the expression of glycolytic enzymes and is regulated by glucose availability. This family is characterized by a common DNA-binding domain and, in some cases, effector-binding domains that respond to specific ligands, indicating a versatile mechanism for controlling metabolic pathways and cellular responses to environmental changes.
    source: "InterPro:IPR051054 abstract (LLM-generated, not curator-reviewed)"
