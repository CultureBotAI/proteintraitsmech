identifier: PANTHER:PTHR15284
label: "NUCLEAR FACTOR INTERLEUKIN-3-REGULATED PROTEIN"
definition: >-
  This entry represents a group of proteins from animals that belong to the bZIP family of transcription factors, including NFIL3. This protein family also includes the orthologue of human NFIL3 in Caenorhabditis elegans transcription factor atf-2. Nuclear factor interleukin-3-regulated protein (NFIL3, also known as E4BP4) was first identified as a transcriptional repressor capable of binding an activating transcription factor (ATF) DNA consensus sequence site in the adenovirus E4 promoter. Later, it was independently identified as a transactivator of the IL3 promoter in human T cells. E4BP4 is involved in a several biological processes, including transcriptional control of the circadian clock, neuron growth and survival, osteoblast function, and regulation of ovulation. It is essential for the development of NK cells and CD8alpha(+) conventional dendritic cells, and is also involved in macrophage activation, polarisation of CD4(+) T cell responses and B cell class switching to IgE.
definition_source: "InterPro:IPR047229 abstract (PANTHER PTHR15284 is a member signature)"
