identifier: PANTHER:PTHR31465
label: "PROTEIN RTA1-RELATED"
definition: >-
  This family is comprised of fungal proteins with multiple transmembrane regions. RTA1 (UniProtKB:P53047) is involved in resistance to 7-aminocholesterol, while RTM1 (UniProtKB:P40113) confers resistance to an unknown toxic chemical in molasses. RSB1 is also a member of this family; it is sphingoid long-chain base transporter.
