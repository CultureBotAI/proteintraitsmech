identifier: PANTHER:PTHR24381
label: "ZINC FINGER PROTEIN"
definition: >-
  ZINC FINGER PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24381. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II transcription regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
