identifier: PANTHER:PTHR48427
label: "PROLINE-RICH PROTEIN 9"
definition: >-
  This family of proteins describes proline-rich protein 9 found in mammalian organisms. Small proline-rich proteins (SPRRs) are a family of proteins primarily involved in maintaining epithelial barrier integrity and antimicrobial defence. They are critical components of the cornified cell envelope, where they function as crosslinking proteins to enhance structural stability. SPRRs are categorized into four main types: SPRR1: Found in squamous epithelia and associated with tissues requiring flexibility. SPRR2: Includes subtypes like SPRR2A and SPRR2B, which are involved in epithelial differentiation and antimicrobial defense. SPRR3: Plays a role in epithelial cell differentiation. SPRR4: Less studied but contributes to similar structural functions.
