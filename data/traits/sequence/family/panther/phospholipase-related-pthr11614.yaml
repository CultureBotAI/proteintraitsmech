  - kind: GENERAL
    text: >-
      PHOSPHOLIPASE-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11614. PANTHER protein class: phospholipase, hydrolase. Members are annotated with the molecular function hydrolase activity, acting on ester bonds, lipase activity, catalytic activity. and localise to cellular anatomical entity, membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the hydrolysis of various lipid substrates, including monoacylglycerides and diacylglycerides, to free fatty acids and glycerol. Members of the family contribute to diverse biological processes such as endocannabinoid signaling, nociperception, pain perception, cancer cell migration, invasion, tumor growth, and the detoxification of xenobiotics. Some proteins within the family are implicated in the biosynthesis of antibiotics and lignin, as well as the regulation of inflammatory responses and apoptosis in host cells. The family includes enzymes with esterase and lipase activities, showing preferences for substrates with specific chain lengths and types of fatty acids. Inhibition profiles vary among family members, with some being inhibited by serine esterase inhibitors and others not affected by certain detergents.
    source: "InterPro:IPR051044 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
