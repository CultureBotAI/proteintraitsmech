  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of SCF (SKP1-cullin-F-box) E3 ubiquitin ligase complexes, which are involved in the ubiquitination and subsequent proteasomal degradation of target proteins. These proteins typically contain an F-box domain that is essential for interaction with SKP1 and other proteins within the complex. The family plays a role in various cellular processes by targeting specific proteins for degradation, which can regulate pathways such as defense signaling in plants. Some members may also contain additional domains, such as kelch repeats, which may contribute to substrate recognition.
