identifier: PANTHER:PTHR46135
label: "NME/NM23 FAMILY MEMBER 8"
definition: >-
  This family of proteins includes members that are suggested to play roles in the regulation of microtubule physiology and redox state regulation within cellular components such as dynein. Some proteins within this family are implicated in sperm tail maturation, potentially acting by modulating disulfide bonds during the final stages of development in the testis or epididymis. Despite containing domains related to the NDK family, certain members lack key residues for NDP kinase activity, indicating a divergence from the canonical enzymatic functions of NDK proteins.
