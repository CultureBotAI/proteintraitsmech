identifier: PANTHER:PTHR47504
label: "RIGHT ORIGIN-BINDING PROTEIN"
definition: >-
  This protein family represents Multiple antibiotic resistance protein MarA from Salmonella typhimurium, Transcriptional regulator RamA from Klebsiella pneumoniae and similar bacterial transcriptional activators and regulatory proteins that are involved in various cellular responses such as antibiotic resistance, superoxide response, and DNA replication initiation. Some proteins within the family are known to bind specific DNA sequences, facilitating the binding of RNA polymerase to promoters, while others may influence the formation of nucleoprotein structures required for the function of replication origins. The family also encompasses proteins with probable regulatory functions that have not been fully characterised.
