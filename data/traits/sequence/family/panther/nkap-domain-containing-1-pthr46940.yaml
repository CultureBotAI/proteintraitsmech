identifier: PANTHER:PTHR46940
label: "NKAP DOMAIN-CONTAINING 1"
definition: >-
  NF-kappa-B-activating protein (Nkap) is a highly conserved protein which functions as a transcriptional repressor on Notch target genes. It is required for T cell development and acquisition of functional competency. It also plays a role in RNA splicing and processing involved in transcriptional repression, maintenance and survival of adult haematopoietic stem cells. Nkap is divided into three domains, an N-terminal domain containing RS repeats, a highly basic middle domain and the C-terminal domain (Pfam:PF15692). This entry represents uncharacterised proteins that contain Nkap domain 1.
