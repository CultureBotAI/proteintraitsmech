identifier: PANTHER:PTHR31140
label: "B3 DOMAIN-CONTAINING TRANSCRIPTION FACTOR ABI3"
definition: >-
  This entry represents a group of plant B3 domain-containing transcription factors, including LEC2, NGA1/2/3/4, RAV1/2 and related proteins from Arabidopsis. LEC2 plays a central role in embryo development. RAV1 binds specifically to bipartite recognition sequences composed of two unrelated motifs, 5'-CAACA-3' and 5'-CACCTG-3'. RAV2 has been shown to affect FT expression. NGA1/2/3/4 regulate lateral organ growth.
