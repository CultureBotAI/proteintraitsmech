  - kind: GENERAL
    text: >-
      This family of proteins includes methyltransferase (MTase) subunits of type I restriction enzymes. These enzymes are multifunctional, with the ability to both modify and cleave DNA. The MTase activity involves methylation of adenosines within specific recognition sequences, which serves to protect the DNA from cleavage by the associated restriction enzyme. The methylation typically occurs at A-3 on the top strand and A-2 on the bottom strand, or at adenosines in a different specified sequence. The MTase works in conjunction with the specificity (S) subunit to form a complex that can methylate both strands of the target sequence, acting as a maintenance MTase to preserve the methylation state during DNA replication. In the presence of the restriction (R) subunit, the complex can also function as an endonuclease, binding to the same target sequence but cutting the DNA at a distance from the recognition site. The endonuclease activity is dependent on the methylation state of the DNA, with unmodified DNA being cut and hemimethylated DNA being further methylated. Additionally, these enzymes can translocate DNA in an ATP-dependent manner until a collision event triggers cleavage.
    source: "InterPro:IPR052916 abstract (LLM-generated, not curator-reviewed)"
