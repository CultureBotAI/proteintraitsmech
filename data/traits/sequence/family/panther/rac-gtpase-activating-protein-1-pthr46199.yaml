identifier: PANTHER:PTHR46199
label: "RAC GTPASE-ACTIVATING PROTEIN 1"
definition: >-
  RAC GTPASE-ACTIVATING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46199. PANTHER protein class: G-protein modulator, GTPase-activating protein. Members are annotated with the molecular function GTPase activator activity. Members participate in mitotic spindle assembly, sister chromatid segregation, Rho protein signal transduction. Members localise to mitotic spindle, nucleus, plasma membrane region.
