identifier: PANTHER:PTHR11576
label: "ZONA PELLUCIDA SPERM-BINDING PROTEIN 3"
definition: >-
  ZONA PELLUCIDA SPERM-BINDING PROTEIN 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11576. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 7 of its annotated subfamilies. Subfamilies are annotated with the molecular function enzyme binding. Subfamilies participate in oogenesis, binding of sperm to zona pellucida, cell differentiation. Subfamilies localise to extracellular matrix, cell periphery.
