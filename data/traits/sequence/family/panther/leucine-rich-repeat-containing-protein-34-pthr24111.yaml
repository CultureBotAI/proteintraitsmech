  - kind: GENERAL
    text: >-
      This family of proteins includes members that are highly expressed in stem cells and may play a role in the regulation of pluripotency. They are implicated in maintaining the normal expression of key pluripotency regulators such as POU5F1/OCT4 and KLF4. Additionally, these proteins are important for the expression of marker genes indicative of ectodermal and endodermal lineage commitment, such as NES and GATA4, respectively. They may also promote stem cell proliferation in vitro, suggesting a role in stem cell maintenance and possibly differentiation.
