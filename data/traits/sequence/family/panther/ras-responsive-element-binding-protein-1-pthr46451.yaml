definitions:
  - kind: GENERAL
    text: >-
      RAS-RESPONSIVE ELEMENT-BINDING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46451. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, DNA-binding transcription activator activity, RNA polymerase II-specific. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
