identifier: PANTHER:PTHR35130
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 16"
definition: >-
  MED16 is a component of the Mediator complex, a coactivator involved in regulated transcription of RNA polymerase II-dependent genes. In Arabidopsis thaliana, MED16 is involved in regulation of the circadian clock, control of flowering time, freezing and osmotic stress tolerance, and both salicylic acid and jasmonate-mediated defence gene expression.
