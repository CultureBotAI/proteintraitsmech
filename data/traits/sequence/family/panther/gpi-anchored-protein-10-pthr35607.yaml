  - kind: GENERAL
    text: >-
      GPI-ANCHORED PROTEIN 10 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35607. Members are annotated with the molecular function organic cyclic compound binding, heme binding. Members participate in intracellular iron ion homeostasis. Members localise to extracellular region.
