  - kind: GENERAL
    text: >-
      The RBT5 family comprises heme-binding proteins with a role in heme-iron utilization, a critical process for the virulence of pathogenic fungi. Members of the RBT5 family are characterized by the presence of a CFEM domain, which is distinguished by its novel helical-basket fold, composed of six alpha-helices and eight cysteines forming four disulfide bonds. This domain is essential for heme-binding and is found in various fungal pathogens. The proteins within this family are involved in biofilm formation and may participate in a heme-acquisition system through a cross-cell wall heme-transfer cascade, which includes cooperation among different CFEM proteins. This system is crucial for extracting iron from host tissues, a significant virulence factor for pathogenic microorganisms.
    source: "InterPro:IPR052505 abstract (LLM-generated, not curator-reviewed)"
