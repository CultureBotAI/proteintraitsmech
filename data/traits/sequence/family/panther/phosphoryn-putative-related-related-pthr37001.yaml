    text: >-
      This family of proteins is involved in bacterial virulence and adherence to human respiratory epithelial cells. Members possess a signal peptide that directs the protein to the periplasmic space and a C-terminal translocator domain that forms a pore in the outer membrane, allowing the passenger domain to reach the bacterial cell surface. A conserved extended signal peptide region may regulate translocation across the inner membrane.
