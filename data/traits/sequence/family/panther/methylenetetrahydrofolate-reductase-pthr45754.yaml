identifier: PANTHER:PTHR45754
label: "METHYLENETETRAHYDROFOLATE REDUCTASE"
definition: >-
  METHYLENETETRAHYDROFOLATE REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45754. PANTHER protein class: reductase, oxidoreductase. Members are annotated with the molecular function nucleoside phosphate binding, flavin adenine dinucleotide binding, catalytic activity. Members participate in organic acid biosynthetic process, cellular aromatic compound metabolic process, heterocycle metabolic process. Members localise to cytoplasm, cytosol.
