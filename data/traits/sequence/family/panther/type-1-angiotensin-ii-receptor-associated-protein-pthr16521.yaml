identifier: PANTHER:PTHR16521
label: "TYPE-1 ANGIOTENSIN II RECEPTOR-ASSOCIATED PROTEIN"
definition: >-
  AGTRAP (type-1 angiotensin II receptor-associated protein) appears to be a negative regulator of type-1 angiotensin II receptor-mediated signalling by regulating receptor internalisation as well as mechanism of receptor desensitization such as phosphorylation. It plays an important role in cardiac hypertrophy.
