identifier: PANTHER:PTHR28082
label: "ZINC FINGER PROTEIN"
definition: >-
  This family of proteins is involved in mitochondrial protein import and assembly processes. Specifically, they assist in the assembly or recycling of small Tim proteins within the mitochondrial intermembrane space. These proteins play a crucial role in the correct import and insertion of multi-pass transmembrane proteins into the mitochondrial inner membrane, likely by aiding in the formation of disulfide bonds in small Tim proteins.
