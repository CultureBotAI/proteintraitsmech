identifier: PANTHER:PTHR15871
label: "PH DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry includes PKHO1and PKHO2. They both contain a single PH domain. Pleckstrin homology domain-containing family O member 1 (PKHO1), also known as CKIP-1, plays a role in the regulation of the actin cytoskeleton through its interactions with actin capping protein (CP). CKIP-1 can interact with Akt, down-regulates the PI3K/Akt signaling and suppresses tumour growth. CKIP-1 can also interacts and recruits protein kinase CK2 to the plasma membrane. Moreover, it may play a role in phosphatidylinositol 3-kinase (PI3-K)-regulated muscle differentiation. The function of PKHO2 is not clear.
