  - kind: GENERAL
    text: >-
      HEME OXYGENASE HI_0854-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35176. PANTHER protein class: oxygenase, metabolite interconversion enzyme. Members are annotated with the molecular function carbohydrate derivative binding, oxidoreductase activity, acting on the CH-CH group of donors, organic cyclic compound binding. and localise to cytoplasm, cytosol.
