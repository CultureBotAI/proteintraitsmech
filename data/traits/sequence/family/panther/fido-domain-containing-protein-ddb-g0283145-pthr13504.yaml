identifier: PANTHER:PTHR13504
label: "FIDO DOMAIN-CONTAINING PROTEIN DDB_G0283145"
definition: >-
  Proteins in this entry contain a fido domain. The domain is named after the Fic and Doc proteins where it is found. Included in this entry are adenosine monophosphate-protein transferase Fic and FICD. Both Fic and FICD add adenosine 5'-monophosphate (AMP) to specific residues of target proteins (AMPylation), or remove the same modification from target proteins (de-AMPylation), depending on whether cells are in a resting state or stressed. Both bind divalent cations, preferring Mn 2+ over Mg 2+. The adenosine monophosphate-protein transferase SoFic from Shewanella oneidensis is known only to add AMP to target proteins, either at Tyr or Thr residues.
