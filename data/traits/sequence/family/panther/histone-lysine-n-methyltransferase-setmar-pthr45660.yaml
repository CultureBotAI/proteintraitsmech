  - kind: GENERAL
    text: >-
      This family of proteins includes histone-lysine N-methyltransferases, which are primarily involved in the methylation of 'Lys-9' of histone H3, a post-translational modification that is recognized as a marker for epigenetic transcriptional repression. These proteins contain SET domains that are responsible for their enzymatic activity, and they typically require both pre-SET and post-SET domains for full methyltransferase function. The pre-SET domain often binds zinc ions, which are crucial for the structural integrity of the protein. Some members of this family may lack methyltransferase activity or have altered enzymatic function due to the absence of certain domains or conserved residues. The family plays a significant role in the regulation of gene expression through epigenetic mechanisms, and is involved in the silencing of transposable elements and the maintenance of chromatin structure.
    source: "InterPro:IPR051357 abstract (LLM-generated, not curator-reviewed)"
