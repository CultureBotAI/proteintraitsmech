    text: >-
      HISTONE-LYSINE N-METHYLTRANSFERASE SETMAR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45660. PANTHER protein class: histone modifying enzyme. Members are annotated with the molecular function histone methyltransferase activity, double-stranded DNA binding.
