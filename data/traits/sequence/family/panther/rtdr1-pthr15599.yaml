identifier: PANTHER:PTHR15599
label: RTDR1
definition: >-
  Radial spoke protein 14 (RSP14) functions as part of axonemal radial spoke complexes that play an important part in the motility of sperm and cilia. In humans, it has been related to multiple diseases, such as duodenal adenocarcinoma and meningiomas. In non-small cell lung cancer cells it has been shown to regulate the proliferation, cell cycle progression, and apoptosis.
