identifier: PANTHER:PTHR10465
label: "TRANSMEMBRANE GTPASE FZO1"
definition: >-
  The mitofusin family consists of the yeast transmembrane GTPase Fzo and mammalian homologues mitofusin-1 and mitofusin-2. Fzo/mitofusins mediate mitochondrial fusion. This entry also includes bacterial dynamin-like protein, including DynA from Bacillus subtilis, and dynamin-like protein from Nostoc punctiforme. DynA mediates lipid fusion in the absence and presence of GTP and affects several steps in cell division.
