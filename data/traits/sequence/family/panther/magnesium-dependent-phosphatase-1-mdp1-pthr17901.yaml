identifier: PANTHER:PTHR17901
label: "MAGNESIUM-DEPENDENT PHOSPHATASE 1 MDP1"
definition: >-
  This entry represents two closely related clades of sequences from eukaryotes and archaea, however, some uncharacterised bacterial sequences are also included in this family. The mouse enzyme has been characterised as a phosphatase and has been positively identified as a member of the haloacid dehalogenase (HAD) superfamily by site-directed mutagenesis of the active site residues. Its structure is similar to other HAD members but MDP-1 appears to be equally able to dephosphorylate phosphotyrosine and closed-ring phosphosugars.
