identifier: PANTHER:PTHR28672
label: "ANAPHASE-PROMOTING COMPLEX SUBUNIT 13"
definition: >-
  The anaphase-promoting complex (APC) is a conserved multi-subunit ubiquitin ligase required for the degradation of key cell cycle regulators. Members of this family are components of the anaphase-promoting complex homologous to Apc13.
