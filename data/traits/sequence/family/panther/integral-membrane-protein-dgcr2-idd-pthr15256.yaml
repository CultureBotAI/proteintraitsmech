identifier: PANTHER:PTHR15256
label: "INTEGRAL MEMBRANE PROTEIN DGCR2/IDD"
definition: >-
  DGCR2 is an activity-dependent adhesion protein that has been associated with schizophrenia. It has been shown to regulate critical steps of early corticogenesis possibly through a Reelin-dependent mechanism.
