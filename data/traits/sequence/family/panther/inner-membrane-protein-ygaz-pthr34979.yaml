identifier: PANTHER:PTHR34979
label: "INNER MEMBRANE PROTEIN YGAZ"
definition: >-
  This entry includes some uncharacterised bacterial proteins and the branched-chain amino acid transport protein AzlC encoded by azlC gene, which is part of the azl operon, involved in branched-chain amino acid transport. AzlCD is a bipartite histidine exporter consisting of AzlC and AzlD subunits. Overexpression of this gene results in resistance to a leucine analogue, 4-azaleucine.
