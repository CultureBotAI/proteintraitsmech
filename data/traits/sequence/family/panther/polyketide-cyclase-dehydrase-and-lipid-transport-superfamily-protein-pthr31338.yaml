identifier: PANTHER:PTHR31338
label: "POLYKETIDE CYCLASE/DEHYDRASE AND LIPID TRANSPORT SUPERFAMILY PROTEIN"
definition: >-
  This family of proteins includes members with a yet undefined role, which are known to be abundant in latex, constituting a significant portion of its soluble protein content. Some members of this family have been characterized to catalyze the formation of thebaine from its precursors, indicating a role in alkaloid biosynthesis. These enzymes function by facilitating the conversion of (7S)-salutaridinol 7-O-acetate into thebaine while minimizing the production of hydroxylated by-products through spontaneous allylic elimination. The activity of these enzymes can be slightly inhibited by certain substrates, suggesting a regulatory mechanism in the biosynthetic pathway. The diverse functions within this family reflect a range of biological roles, from enzymatic activity in secondary metabolism to yet-to-be-determined functions in plant physiology.
