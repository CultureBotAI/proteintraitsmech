identifier: PANTHER:PTHR45983
label: "TYROSINE PHOSPHATSE N18, PUTATIVE-RELATED"
definition: >-
  This family represents a group of tyrosine-protein phosphatases, including human tyrosine-protein phosphatase non-receptor type 12/18/22. PTN22 acts as negative regulator of T-cell receptor (TCR) signalling by direct dephosphorylation of the Src family kinases LCK and FYN, ITAMs of the TCRz/CD3 complex, as well as ZAP70, VAV, VCP and other key signalling molecules. PTN12 dephosphorylates a range of proteins, and thereby regulates cellular signaling cascades, such as ERBB2 and PTK2B/PYK2, and thereby regulates signalling via ERBB2 and PTK2B/PYK2. PTN18 may be involved in growth and differentiation of hematopoietic cells.
