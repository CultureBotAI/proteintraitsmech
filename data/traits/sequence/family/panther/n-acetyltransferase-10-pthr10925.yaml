identifier: PANTHER:PTHR10925
label: "N-ACETYLTRANSFERASE 10"
definition: >-
  This entry includes bacterial tRNA(Met) cytidine acetyltransferase TmcA and eukaryotic N-acetyltransferase 10 (NAT10). They consist of an RNA helicase domain and a GCN5-related N-acetyltransferase (GNAT) domain. The bacterial tRNA(Met) cytidine acetyltransferase (TmcA) catalyses the formation of N(4)-acetylcytidine (ac4C) at the wobble position of tRNA(Met), by using acetyl-CoA as an acetyl donor and either ATP or GTP. This modification is thought to ensure precise recognition of the AUG codon by strengthening C-G base-pair interaction and also prevent misrecognition of the near cognate AUA codon. RNA cytidine acetyltransferas (NAT10) are RNA cytosine acetyltransferases with specificity toward both 18S rRNA and tRNAs and contain additional putative nuclear and nucleolar localisation signals (NLS and NoLS respectively).
definition_source: "InterPro:IPR032672 abstract (PANTHER PTHR10925 is a member signature)"
