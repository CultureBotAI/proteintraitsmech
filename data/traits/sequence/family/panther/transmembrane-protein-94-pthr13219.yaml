identifier: PANTHER:PTHR13219
label: "TRANSMEMBRANE PROTEIN 94"
definition: >-
  This entry includes Transmembrane protein 94 (TMEM94), also known as endoplasmic reticulum magnesium-transporting P-type ATPase ERMA., a protein that could function in the uptake of Mg2 from the cytosol into the endoplasmic reticulum and regulate intracellular Mg2 homeostasis. TMEM94 deletion in mice is embryonically lethal, and TMEM94 mutations in humans are associated with multi-organ functional defects revealing its essential function. TMEM94 has been proposed as a major molecular component of ERMg2+ uptake machinery in eukaryotes and its absence could lead to perturbation of signal transduction and detrimental physiological outcomes.
definition_source: "InterPro:IPR039720 abstract (PANTHER PTHR13219 is a member signature)"
