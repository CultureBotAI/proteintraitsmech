identifier: PANTHER:PTHR41302
label: "PRESPORE-SPECIFIC TRANSCRIPTIONAL REGULATOR RSFA-RELATED"
definition: >-
  This entry represents a set of transcription factors found in some endospore-forming bacteria within the Firmicutes (low-GC Gram-positive bacteria), including Prespore-specific transcriptional regulator RsfA and Sporulation-specific transcriptional regulator GerR from Bacillus subtilis. In some species these proteins are encoded multiple times. The expression of RsfA, previously known as YwfN, is controlled by sigma factor F, and it seems to improve the efficiency of sporulation by fine-tuning the expression of genes in the sigma F regulon, particularly the timing of their expression. It also negatively regulates spoIIR and its own synthesis. GerR, its paralog, previously known as YlbO, controls genes of both sigma-E and sigma-K regulons, acting alone on some genes and in conjunction with SpoIIID or GerE on others and regulates, directly or indirectly, the expression of genes encoding coat proteins. A highly variable linker region separates two very strongly conserved sequence regions within the protein.
definition_source: "InterPro:IPR014243 abstract (PANTHER PTHR41302 is a member signature)"
