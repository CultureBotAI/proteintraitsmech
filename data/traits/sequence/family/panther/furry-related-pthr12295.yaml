identifier: PANTHER:PTHR12295
label: FURRY-RELATED
definition: >-
  This entry includes protein furry (fry) from animals, Tao3 (also known as Pag1) from budding yeasts and Mor2 from fission yeasts. Protein furry is involved in the Trc/fry signaling pathway and plays a key role in maintaining the integrity of polarized cell extensions (arista) during morphogenesis. Tao3 is part of the the RAM signaling network involved in regulation of cellular morphogenesis. Mor2 is also involved in the cell morphogenesis.
