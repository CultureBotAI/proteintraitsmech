identifier: PANTHER:PTHR13430
label: "Autophagy-related protein 13"
definition: >-
  This entry represents autophagy-related protein 13 (Atg13) from yeasts, animals and plants, which functions in autophagy. Fission yeast autophagy initiation is controlled by the Atg1 kinase complex, which is composed of the Ser/Thr kinase Atg1, the adaptor protein Atg13, and the ternary complex of Atg17-Atg31-Atg29. Atg13 recruits Atg1 to the site of autophagosome formation and enhancing Atg1 kinase activity. Atg13 may have additional functions that are independent of a direct interaction or permanent colocalization with Atg1.
