identifier: PANTHER:PTHR14744
label: "N-ALPHA-ACETYLTRANSFERASE 60"
definition: >-
  This entry includes NAA60 from animals and MCC1 from Arabidopsis. NAA60 (also known as NatF) is an N-alpha-acetyltransferase that specifically mediates the acetylation of N-terminal residues of the transmembrane proteins, with a strong preference for N termini facing the cytosol. It is localized in the Golgi apparatus. In Drosophila, NAA60 knockdown cells shows chromosomal segregation defects. MCC1 may be a histone acetyltransferase involved in plant meiosis.
