identifier: PANTHER:PTHR43337
label: "XANTHINE/URACIL PERMEASE C887.17-RELATED"
definition: >-
  Azaguanine transporters (AzgA) are found in bacteria, fungi and plants. In plants, NCS2 has broad and mixed solute transport and binding profiles including combinations of xanthine, uric acid, uracil, adenine, guanine, cytosine and hypoxanthine. Bacterial NCS2 has more restricted solute transport and binding profiles. Fungal nucleobase transporters have been well studied in Aspergillus nidulans including two NCS2, UapA and UapC, that transport uric acid and xanthine and the purine transporter AzgA that moves adenine, hypoxanthine and guanine. In plants, AZG2 is a purine transporter found in Arabidopsis. It transports natural purines (adenine and guanine) as well as purine analogues. This entry also includes AdeP/AdeQ from E. coli, PbuG/PbuO from Bacillus subtilis and PlAzg1 from Paenibacillus larvae subsp. larvae. AdeP/AdeQ are adenine permeases, PbuG/PbuO are guanine/hypoxanthine permeases, while PlAzg1 is a nucleobase transporter that transports adenine, hypoxanthine, xanthine and uracil.
