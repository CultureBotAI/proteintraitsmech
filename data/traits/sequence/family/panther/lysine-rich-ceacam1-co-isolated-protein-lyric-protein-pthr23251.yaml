definitions:
  - kind: GENERAL
    text: >-
      LYSINE-RICH CEACAM1 CO-ISOLATED PROTEIN LYRIC PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23251. Members are annotated with the molecular function transcription coregulator activity, protein-macromolecule adaptor activity. Members participate in regulation of gene expression, regulation of DNA-templated transcription, regulation of cellular process. Members localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in various cellular processes including transcriptional regulation and tumor cell expansion. Members act as transcriptional coactivators, enhancing the activity of MEF2C and MYOD1, which are crucial for skeletal muscle differentiation. Additionally, they play a role in down-regulating specific promoter activities and activating NF-kappa-B, a key transcription factor. The family is implicated in promoting anchorage-independent growth, metastasis to lung, bone, and brain, and inducing chemoresistance. These functions suggest a significant role in both normal cellular differentiation and pathological conditions such as cancer.
    source: "InterPro:IPR052305 abstract (LLM-generated, not curator-reviewed)"
