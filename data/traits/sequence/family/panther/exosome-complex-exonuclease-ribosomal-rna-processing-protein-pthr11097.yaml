definitions:
  - kind: GENERAL
    text: >-
      EXOSOME COMPLEX EXONUCLEASE RIBOSOMAL RNA PROCESSING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11097. PANTHER protein class: RNA metabolism protein, exoribonuclease. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding, mRNA 3'-UTR binding. Members participate in organic cyclic compound catabolic process, cellular metabolic process, RNA catabolic process. Members localise to cytoplasm, protein-containing complex, exosome (RNase complex).
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Rrp42 subfamily of the RNase PH family is comprised of non-catalytic components of the RNA exosome complex, which is essential for 3'->5' exoribonuclease activity. The family plays a significant role in RNA processing and degradation, contributing to the maturation of stable RNA species such as rRNA, snRNA, and snoRNA, as well as the elimination of RNA processing by-products and non-coding transcripts. In the nucleus, it helps limit the export of defective mRNAs to the cytoplasm. In the cytoplasm, it is involved in mRNA turnover, degrading unstable mRNAs with AU-rich elements and participating in RNA surveillance pathways to prevent translation of aberrant mRNAs. Members of the Rrp42 subfamily are also implicated in structuring the active site of other exosome components, such as Rrp41, and may be involved in Ig class switch recombination and somatic hypermutation.
    source: "InterPro:IPR050590 abstract (LLM-generated, not curator-reviewed)"
