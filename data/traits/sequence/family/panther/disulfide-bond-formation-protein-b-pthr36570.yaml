      DISULFIDE BOND FORMATION PROTEIN B — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36570. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function protein-disulfide reductase activity. Subfamilies participate in gene expression, protein maturation, protein folding.
