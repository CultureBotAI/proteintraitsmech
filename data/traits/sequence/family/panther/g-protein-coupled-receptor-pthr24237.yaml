identifier: PANTHER:PTHR24237
label: "G-PROTEIN COUPLED RECEPTOR"
definition: >-
  This family includes eukaryotic G-protein coupled receptor 183 (GP183, also known as EBV-induced G-protein coupled receptor 2) and similar proteins such as the orphan receptor GP141 and G-protein coupled receptor homologue FPV206 from Fowlpox virus. GP183 is a receptor for oxysterol 7-alpha,25-dihydroxycholesterol (7-alpha,25-OHC) and other related oxysterols. It regulates migration of astrocytes and is involved in the communication between astrocytes and macrophages. It may also act as a chemotactic receptor for some T-cells upon binding to 7-alpha,25-OHC ligand. Together with CXCR5, it mediates B-cell migration.
definition_source: "InterPro:IPR047160 abstract (PANTHER PTHR24237 is a member signature)"
