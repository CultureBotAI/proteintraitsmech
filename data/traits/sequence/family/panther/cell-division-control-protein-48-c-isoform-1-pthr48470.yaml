identifier: PANTHER:PTHR48470
label: "CELL DIVISION CONTROL PROTEIN 48 C ISOFORM 1"
definition: >-
  This entry represents Cell division control protein 48 homolog C from Arabidopsis thaliana (CDC48c) and similar proteins predominantly found in plants. CDC48c is thought to function in cell division and growth processes. Members of this group contain an ATPase domain ( InterPro:IPR003959 ).
