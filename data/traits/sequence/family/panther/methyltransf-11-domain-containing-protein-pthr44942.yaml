identifier: PANTHER:PTHR44942
label: "METHYLTRANSF_11 DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes enzymes with methyltransferase activity, which transfer methyl groups from S-adenosylmethionine to various substrates. Members of this family are involved in diverse biological processes, including the biosynthesis of secondary metabolites such as pigments, mycotoxins, and antibiotics, which have roles in microbial pigmentation, defense, and pathogenicity. Some proteins within this family are also implicated in modifying small molecules like trans-aconitate, potentially involved in metabolic regulation and response to nutrient availability. The proteins share a common structural framework typical of the methyltransferase superfamily, indicating a conserved mechanism of action across different biological contexts.
