identifier: PANTHER:PTHR12837
label: "POLY ADP-RIBOSE  GLYCOHYDROLASE"
definition: >-
  Poly(ADP-ribose) glycohydrolase (PARG) (EC:3.2.1.143) is a ubiquitously expressed exo- and endoglycohydrolase which catalyses the hydrolysis of the O-glycosidic linkages of ADP-ribose polymers, reversing the effects of poly(ADP-ribose). It generates mono-ADP-ribosylated proteins in cells, due to its ability of degrading poly(ADP-ribose) without cleaving the terminal protein-ribose bond. PARG is also involved in the synthesis of nuclear ATP, which is required for extensive chromatin remodeling events. This protein mediates oxidative and excitotoxic neuronal death. Arabidopsis thaliana PARG1 is involved in abiotic stress responses and DNA repair.
