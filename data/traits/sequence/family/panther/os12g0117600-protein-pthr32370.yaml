identifier: PANTHER:PTHR32370
label: "OS12G0117600 PROTEIN"
definition: >-
  The NRL (for NPH3/RPT2-Like) family is formed by signaling molecules specific to higher plants. Several regions of sequence and predicted structural conservation define members of the NRL family, with three domains being most notable: an N-terminal BTB domain, a centrally located NPH3 domain, and a C-terminal coiled coil domain. The function of the NPH3 domain is not yet known. Root phototropism protein 3 (RPT3), also known as nonphototropic hypocotyl 3 (NPH3), and root phototropism 2 (RPT2) represent the founding members of a novel plant-specific family. Three domains define the members of this family: an N-terminal BTB (broad complex, tramtrack, bric a brac) domain ( InterPro:IPR000210 ), a centrally located NPH3 domain ( InterPro:IPR027356 ), and a C-terminal coiled-coil domain. NPH3 assembles with CUL3 to form a E3 complex that ubiquitinates phototropin 1 (phot1) and modulates phototropic responsiveness. NPH3 is necessary for root and hypocotyl phototropisms, but not for the regulation of stomata opening or chloroplast relocation. Coleoptile phototropism protein 1 (CPT1) is a rice orthologue of Arabidopsis NPH3 also required for phototropism. This entry also includes DOT3 (AT5G10250) that is involved in shoot and primary root growth; DOT3 mutants produce an aberrant parallel venation pattern in juvenile leaves. Also included is SR1IP1 that acts as a positive regulator of plant defense by removing the defense suppressor CAMTA3/SR1 by acting as a substrate adapter that recruits CAMTA3/SR1 for ubiquitination and degradation during pathogen infection.
