identifier: PANTHER:PTHR36881
label: DERMOKINE
definition: >-
  Expression of the human dermokine gene (DMKN) leads to the production of four dermokine isoforms. Expression of the secreted alpha, beta and gamma isoforms is restricted to the epidermis. DMKN beta and gamma are specifically expressed by the granular keratinocytes and have a role in cornification. Dermokine levels are increased in inflammatory skin disorders, but decreased in skin cancers.
