identifier: PANTHER:PTHR12820
label: "VACUOLAR SORTING PROTEIN 53"
definition: >-
  This entry represents Vps53 from eukaryotes. Vps53 is part of the of the GARP (Golgi-associated retrograde protein) complex involved in retrograde transport from early and late endosomes to late Golgi. Mutations in the human Vps53 gene cause pontocerebellar hypoplasia 2E (PCH2E), a neurodegenerative disorder characterised by progressive cerebello-cerebral atrophy, profound mental retardation, progressive microcephaly, spasticity, and early-onset epilepsy.
