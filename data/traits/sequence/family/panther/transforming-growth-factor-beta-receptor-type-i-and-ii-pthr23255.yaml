identifier: PANTHER:PTHR23255
label: "TRANSFORMING GROWTH FACTOR-BETA RECEPTOR TYPE I AND II"
definition: >-
  Transforming growth factor-beta (TGF-beta) forms a family with other growth factors. The receptors for most of the members of this growth factor family are related. These proteins are receptor-type kinases of Ser/Thr type, which have a single transmembrane domain and a specific hydrophilic Cys-rich ligand-binding domain. The C-terminal part of the extracellular domain is conserved. Some of the receptors of this family contain subclass-specific N-terminal extensions of this homology domain. The type I receptors also possess 7 extracellular residues preceding the cysteine box.
