identifier: PANTHER:PTHR35252
label: "RETINITIS PIGMENTOSA 9 PROTEIN"
definition: >-
  PAP-1 (for Pim-1-associated protein) is thought to be a target for Pim-1 kinase. It has been implicated as the defective gene in RP9, one type of autosomal dominant retinitis pigmentosa. PAP-1 has a role in pre-mRNA splicing and this activity is dependent on its phosphorylation state. PAP-1 interacts with Prp3p; both were found to be components of the U4/U6.U5-tri-snRNP complex, one form of the spliceosome.
