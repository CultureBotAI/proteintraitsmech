identifier: PANTHER:PTHR47659
label: "ZN(II)2CYS6 TRANSCRIPTION FACTOR (EUROFUNG)-RELATED"
definition: >-
  The ERT1/acuK family comprises transcription factors that play a crucial role in the regulation of nonfermentable carbon utilisation. Members of this family are primarily involved in the activation of gluconeogenetic genes, which are essential for metabolic pathways that generate glucose from non-carbohydrate sources. Some proteins within this family have been identified to specifically bind to DNA sequences in the promoter regions of target genes, indicating a direct mechanism of transcriptional regulation. The activity of these transcription factors is particularly important under conditions where fermentable carbon sources are scarce, necessitating the mobilisation of stored or alternative carbon reserves to maintain cellular energy balance.
definition_source: "InterPro:IPR050335 abstract (PANTHER PTHR47659 is a member signature)"
