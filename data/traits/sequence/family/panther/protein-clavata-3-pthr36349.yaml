identifier: PANTHER:PTHR36349
label: "PROTEIN CLAVATA 3"
definition: >-
  This entry represents a group of CLAVATA3/ESR (CLE)-related proteins, including FON2 (FLORAL ORGAN NUMBER2) from rice, CLAVATA 3 from Arabidopsis and CLE-4D from Globodera rostochiensis. In plants, they have diverse roles in plant growth and development. FON2 is a pobable extracellular signal that regulates meristem maintenance. May function as a putative ligand for a receptor complex including FON1. Regulates the size of the floral meristem and the number of floral organs. CLAVATA3 may act as a ligand for the CLV1 receptor kinase in the regulation of stem cell specification at shoot and flower meristems. It is a secreted protein, with an N-terminal signal sequence and a conserved C-terminal domain of 15 amino acids, termed the CLE (CLV3/ESR-related) domain. In potato cyst nematode, Globodera rostochiensis, CLE-4D mimics host plant CLE extracellular signal peptides and facilitates parasitism.
definition_source: "InterPro:IPR044962 abstract (PANTHER PTHR36349 is a member signature)"
