identifier: PANTHER:PTHR46119
label: "OS08G0405700 PROTEIN"
definition: >-
  This entry represents a group of heavy metal-associated plant proteins, including Protein SODIUM POTASSIUM ROOT DEFECTIVE 1/2/3 (NAKR1/2/3) from Arabidopsis. NAKR1, also known as NPCC6, is necessary for phloem function and root meristem maintenance. It also promotes flowering through mediating FT (FLOWERING LOCUS T) translocation from leaves to shoot apices. It also plays an important role in the regulation of FT expression under long-day conditions. NaKR3 is involved in the salt stress response.
