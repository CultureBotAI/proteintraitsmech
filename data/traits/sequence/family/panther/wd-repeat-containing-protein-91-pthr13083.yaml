identifier: PANTHER:PTHR13083
label: "WD REPEAT-CONTAINING PROTEIN 91"
definition: >-
  This entry represents WDR91 and its homologues. WDR91 is part of the WDR81-WDR91 complex that functions as a negative regulator of the PI3 kinase/PI3K activity associated with endosomal membranes via BECN1, a core subunit of the PI3K complex. WDR91 has been shown to be recruited to endosomes by interacting with active guanosine triphosophate-Rab7 and inhibits Rab7-associated phosphatidylinositol 3-kinase activity. This entry also includes Sorf-1, a WDR91 homologue from C. elegans. Sorf-1 and Sorf-2 form a complex with Beclin1 and inhibit the activity of the PI3K complex.
definition_source: "InterPro:IPR039724 abstract (PANTHER PTHR13083 is a member signature)"
