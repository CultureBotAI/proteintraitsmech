identifier: PANTHER:PTHR46468
label: "SENTRIN-SPECIFIC PROTEASE 8"
definition: >-
  This entry represents a group of proteases from bacteria, animals, fungi and plants, including Nep1/2 from Schizosaccharomyces pombe which are orthologues of human SENP8. In Nep1/2 are deneddylating enzymes that process full-length nedd8 to its mature form and deconjugate nedd8 from targeted proteins.
