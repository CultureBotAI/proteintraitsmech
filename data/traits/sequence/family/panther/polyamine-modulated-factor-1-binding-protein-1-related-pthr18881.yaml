identifier: PANTHER:PTHR18881
label: "POLYAMINE-MODULATED FACTOR 1-BINDING PROTEIN 1-RELATED"
definition: >-
  PMF-1 binding protein, also known as Stap (for sperm-tail-associated protein), is located mainly at the tail of elongated spermatids in the testis of adult fertile mice. It may affect fertility.
