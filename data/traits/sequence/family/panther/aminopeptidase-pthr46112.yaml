identifier: PANTHER:PTHR46112
label: AMINOPEPTIDASE
definition: >-
  Members of the peptidase M24B family are involved in the hydrolysis of specific peptide bonds. Members of this family exhibit a range of functions, including the hydrolysis of N-terminal amino acid residues from polypeptides, with preferences for substrates containing alanine or for dipeptides with a prolyl in the C-terminal position. Some members are involved in the degradation of specific compounds such as ectoine, contributing to the utilisation of these compounds as carbon and nitrogen sources. Others are implicated in the cleavage of dimethylsulfonioproprionate (DMSP), releasing dimethyl sulfide (DMS), although the native substrate for some of these enzymes remains unclear. The family also includes enzymes like creatinase, which hydrolyse creatine, and aminopeptidases that preferentially remove methionine when followed by specific amino acids. Collectively, the peptidase M24B family plays diverse roles in nitrogen metabolism, peptide degradation, and in some cases, environmental sulfur cycling.
