identifier: PANTHER:PTHR10150
label: "DNA REPAIR ENDONUCLEASE XPF"
definition: >-
  DNA REPAIR ENDONUCLEASE XPF — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10150. PANTHER protein class: endodeoxyribonuclease. Members are annotated with the molecular function DNA endonuclease activity, damaged DNA binding, single-stranded DNA binding. Members participate in double-strand break repair via homologous recombination, nucleotide-excision repair, reciprocal meiotic recombination. Members localise to nucleotide-excision repair complex.
