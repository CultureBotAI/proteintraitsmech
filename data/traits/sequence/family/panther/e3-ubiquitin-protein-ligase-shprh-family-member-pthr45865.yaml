identifier: PANTHER:PTHR45865
label: "E3 UBIQUITIN-PROTEIN LIGASE SHPRH FAMILY MEMBER"
definition: >-
  This entry represents E3 ubiquitin-protein ligase SHPRH and related proteins. Members are involved in pathways that maintain genomic integrity and are implicated in DNA repair processes. The ATP-dependent helicases likely unwind DNA or remodel chromatin, which is crucial during DNA replication, repair, and transcription. The E3 ubiquitin-protein ligases in this family specifically modify PCNA with non-canonical poly-ubiquitin chains linked through 'Lys-63', a post-translational modification that is important for DNA damage tolerance pathways. Additionally, these ligases accept ubiquitin from certain E2 complexes, highlighting their role in the ubiquitin-proteasome system.
definition_source: "InterPro:IPR052583 abstract (PANTHER PTHR45865 is a member signature)"
