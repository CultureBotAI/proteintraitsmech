identifier: PANTHER:PTHR32198
label: "MITOCHONDRIAL ESCAPE PROTEIN 2"
definition: >-
  Mitochondrial escape protein 2 (also known as RNA12) plays a role in maintaining the mitochondrial genome and in controlling mtDNA escape. It is also involved in the regulation of mtDNA nucleotide structure and number. Additionally, this protein have a dispensable role in the early maturation of pre-rRNA.
