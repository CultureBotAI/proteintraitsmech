identifier: PANTHER:PTHR10344
label: "THYMIDYLATE KINASE"
definition: >-
  THYMIDYLATE KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10344. PANTHER protein class: nucleotide kinase. Members are annotated with the molecular function kinase activity, phosphotransferase activity, phosphate group as acceptor. Members participate in nucleoside triphosphate biosynthetic process, nucleotide biosynthetic process, pyrimidine nucleotide metabolic process. Members localise to cytoplasm.
