identifier: PANTHER:PTHR10344
label: "THYMIDYLATE KINASE"
definition: >-
  THYMIDYLATE KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10344. PANTHER protein class: nucleotide kinase. Members are annotated with the molecular function phosphotransferase activity, phosphate group as acceptor, kinase activity. and participate in organonitrogen compound biosynthetic process, carbohydrate derivative biosynthetic process, nucleoside diphosphate metabolic process. and localise to cytoplasm.
