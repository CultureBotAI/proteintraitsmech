identifier: PANTHER:PTHR12048
label: "CCAAT-BINDING FACTOR-RELATED"
definition: >-
  This represents CAATT-binding proteins and their homologues, including Mak21 from budding yeasts, protein SLOW WALKER2 (SWA2) from Arabidopsis and CEBPZ from human and its orthologue from Drosophila Nucleolar complex protein 1 (Noc1). Mak21, also known as Noc1, is required for 60 S ribosomal subunit biogenesis. Together with Rrp5 and Noc2, Mak21 forms a protein module which is part of early large ribosomal subunit precursors. SWA2 may play a role in ribosome biogenesis and is essential for coordinated cell cycle progression during female gametophyte development in Arabidopsis. CEBPZ, the human homologue, regulates Hsp70 expression. Noc1 from Drosophila is involved in rRNA processing and ribosome maturation.
definition_source: "InterPro:IPR040155 abstract (PANTHER PTHR12048 is a member signature)"
