identifier: PANTHER:PTHR18829
label: "PROTEIN YAE1 HOMOLOG"
definition: >-
  This entry includes yeast Yae-1, human YAE1D1 (Yae1 domain-containing protein 1) and related proteins from eukaryotes. Yae1 depletion results in defective Fe-S maturation of the ribosome-associated ABC protein Rli1.
