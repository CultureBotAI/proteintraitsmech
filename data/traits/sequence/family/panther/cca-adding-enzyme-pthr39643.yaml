identifier: PANTHER:PTHR39643
label: "CCA-ADDING ENZYME"
definition: >-
  All mature tRNAs contain a terminal CCA sequence essential for function. CCA-adding enzyme ensures that each tRNA contains a terminal CCA, either by de novo addition or by repair of a damaged end. CCA-adding enzyme of this group is a class I nucleotidyltransferase unrelated, except at the active site, to class II CCA-adding enzymes (InterPro:IPR012006)). Interestingly, despite the fact that class I CCA-adding enzyme combines tRNA cytidylyltransferase (EC:2.7.7.25) and tRNA adenylyltransferase (EC:2.7.7.21) activities, it possesses only one active site per monomer. However, stoichiometric analysis shows formation of a tetramer upon binding of only two tRNA molecules, raising the possibility that two active sites, each responsible for a different nucleotide, form adjacent to each substrate molecule.
definition_source: "InterPro:IPR008229 abstract (PANTHER PTHR39643 is a member signature)"
