  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are primarily involved in the degradation of asparagine-linked glycoproteins. Members of this family exhibit glycosyl hydrolase activity, specifically targeting the hydrolysis of N-acetyl-beta-D-glucosamine (1-4)N-acetylglucosamine chitobiose core. This enzymatic action typically occurs at the reducing end of the bond and is contingent upon prior cleavage by another enzyme, glycosylasparaginase. Additionally, some members are implicated in the degradation of peptidoglycans during bacterial spore germination, recognizing specific muramic acid delta-lactam residues. The family is characterized by the presence of glycosyl hydrolase 18 domains, and some members also contain LysM domains, which are associated with peptidoglycan binding and substrate recognition.
    source: "InterPro:IPR051887 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
