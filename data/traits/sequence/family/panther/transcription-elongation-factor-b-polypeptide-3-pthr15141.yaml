identifier: PANTHER:PTHR15141
label: "TRANSCRIPTION ELONGATION FACTOR B POLYPEPTIDE 3"
definition: >-
  This family of proteins functions as general transcription elongation factors known as elongin or SIII. They enhance the RNA polymerase II transcription elongation past sites that would otherwise arrest transcription. Members of this family are transcriptionally active, with some showing increased activity upon binding to the elongin BC complex. Additionally, certain members are involved in the ubiquitination process as part of a multisubunit complex, which includes the elongin BC complex and other proteins such as RBX1 and CUL5. This ubiquitination activity targets the monoubiquitinated RNA polymerase II subunit for proteolysis, playing a role in global genomic repair.
