identifier: PANTHER:PTHR33737
label: "OS05G0121800 PROTEIN"
definition: >-
  This entry represents a group of plant proteins, including GROWING PLUS-END TRACKING 1 (GPT1, At2g37070) and GROWING PLUS-END TRACKING 2 (GPT2, At3g53320) from Arabidopsis. GPT1/2 are microtubule-associated proteins that contain the basic MT-binding regions at their central and C-terminal regions, and bind directly to MTs in vitro. They track the plus ends of growing MTs independently of EB1 and SPR1.
