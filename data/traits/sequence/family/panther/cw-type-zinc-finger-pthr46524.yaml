identifier: PANTHER:PTHR46524
label: "CW-TYPE ZINC FINGER"
definition: >-
  This family of proteins includes Cysteine-tryptophan domain-containing zinc finger protein 3/5/7 and related plant sequences. Members of this entry contain a CW-type zinc finger domain ( InterPro:IPR011124 ), which is implicated in the recognition of methylated histones, particularly histone H3 lysine 4 (H3K4me). These proteins are involved in chromatin modification and gene expression regulation. They can bind to specific methylated forms of histone H3, facilitating the recruitment of various effectors to mediate gene expression. Some members act as transcriptional activators, directly binding to DNA sequences to regulate target gene transcription, thereby influencing cellular processes such as the regulation of grain size in plants. They are also capable of promoting active chromatin states by increasing levels of specific histone modifications at target loci.
