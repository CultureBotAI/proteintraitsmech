identifier: PANTHER:PTHR35827
label: "ZINC FINGER BED DOMAIN-CONTAINING PROTEIN 3"
definition: >-
  This entry includes ZBED2 and ZBED3. The function of ZBED2 is not clear. Zinc-finger BED domain-containing protein 3 (Zbed3) is a zinc finger protein that binds to axin and activates the Wnt/beta-catenin signalling. Interaction with axin is important for Zbed3 to inhibit beta-catenin phosphorylation, hence inhibiting beta-catenin degradation. Zbed3 has been associated with insulin resistance and type 2 diabetes mellitus in humans.
