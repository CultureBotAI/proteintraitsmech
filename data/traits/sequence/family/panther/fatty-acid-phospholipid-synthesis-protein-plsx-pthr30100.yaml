identifier: PANTHER:PTHR30100
label: "FATTY ACID/PHOSPHOLIPID SYNTHESIS PROTEIN PLSX"
definition: >-
  The proteins in this group are phospholipid biosynthesis proteins of unknown function. Escherichia coli PlsX protein has been shown to be required for phospholipid biosynthesis, but its exact function is not yet known. It has been suggested to be an enzyme.
