definitions:
  - kind: GENERAL
    text: >-
      MITOCHONDRIAL RIBOSOME PROTEIN L39/PROLYL-TRNA LIGASE FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42753. PANTHER protein class: aminoacyl-tRNA synthetase, translational protein. Members are annotated with the molecular function catalytic activity, acting on RNA, ligase activity. Members participate in tRNA metabolic process, translation, amino acid metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes enzymes that catalyze the attachment of proline to tRNA(Pro) through a two-step reaction involving the activation of proline by ATP to form Pro-AMP, followed by its transfer to tRNA(Pro). Members of the family possess an editing function to ensure fidelity, hydrolyzing activated Ala-AMP and deacylating mischarged Ala-tRNA(Pro) to prevent errors. Some members can process cysteine but lack the ability to edit misacylated Cys-tRNA(Pro), which may be corrected by YbaK in trans. The family is characterized by a three-domain structure: a catalytic domain, an editing domain, and an anticodon-binding domain. These enzymes are essential for protein synthesis and are found in both cytoplasmic and mitochondrial locations, reflecting their importance in cellular function.
    source: "InterPro:IPR050062 abstract (LLM-generated, not curator-reviewed)"
