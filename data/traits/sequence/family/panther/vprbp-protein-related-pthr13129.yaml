identifier: PANTHER:PTHR13129
label: "VPRBP PROTEIN-RELATED"
definition: >-
  This entry represents the VPRBP/DCAF1 family, whose members include protein VPRBP from mammals, protein mahjong form fruit flies and DCAF1 from worms and plants. They are the substrate recognition component of the E3 ubiquitin-protein ligase complex.
