identifier: PANTHER:PTHR14069
label: FILENSIN
definition: >-
  Filensin (also known as BFSP1) is a lens-specific cytoskeletal protein that interacts with aquaporin-0 (AQP0). It plays an important role during lens development. Mutations of the Filensin gene cause Cataract 33, multiple types (CTRCT33), an opacification of the crystalline lens of the eye that frequently results in visual impairment or blindness.
