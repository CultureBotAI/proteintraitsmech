  - kind: GENERAL
    text: >-
      The helicase family, specifically the SKI2 subfamily, is characterized by proteins that exhibit nucleic acid unwinding activity, which is essential for various aspects of RNA and DNA metabolism. Members of this family are involved in processes such as RNA surveillance, splicing, and ribosome biogenesis. One member, DDX60, is known to play a role in the innate immune response by regulating type I interferon and interferon-inducible gene expression upon viral infection. It can bind to single-stranded RNA, double-stranded RNA, and double-stranded DNA, and enhances the interaction of RIGI with double-stranded RNA, exhibiting antiviral activity against specific viruses.
    source: "InterPro:IPR052431 abstract (LLM-generated, not curator-reviewed)"
