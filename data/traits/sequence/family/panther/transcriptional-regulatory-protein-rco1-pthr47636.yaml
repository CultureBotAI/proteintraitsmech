definitions:
  - kind: GENERAL
    text: >-
      TRANSCRIPTIONAL REGULATORY PROTEIN RCO1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47636. PANTHER protein class: DNA-binding transcription factor. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to non-membrane-bounded organelle, histone deacetylase complex, protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes components involved in the regulation of gene expression through the modification of chromatin structure. Specifically, one member is known to function as a catalytic component of a histone deacetylase complex, which is responsible for the removal of acetyl groups from lysine residues on the N-terminal part of core histones. This deacetylation process is crucial for epigenetic repression and has significant roles in various cellular processes including transcriptional regulation, cell cycle progression, response to DNA damage, adaptation to osmotic stress, and developmental events. While some members of this family are uncharacterized, the characterized components suggest a broader involvement in chromatin remodeling and regulation of gene expression.
    source: "InterPro:IPR052819 abstract (LLM-generated, not curator-reviewed)"
