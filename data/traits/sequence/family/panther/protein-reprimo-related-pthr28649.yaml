identifier: PANTHER:PTHR28649
label: "PROTEIN REPRIMO-RELATED"
definition: >-
  This entry includes Reprimo and Reprimo-like proteins. Reprimo (RPRM) has been identified as a downstream effector of p53-induced cell cycle arrest at G2/M. Overexpression of RPRM induces G2 arrest by inhibiting both Cdc2 activity and nuclear translocation of the Cdc2-cyclin B1 complex. RPRM promoter methylation has been reported in several tumours. The function of reprimo-like protein is not known. It is a paralogue of Reprimo, a downstream effector of p53-induced cell cycle arrest at G2/M.
definition_source: "InterPro:IPR043383 abstract (PANTHER PTHR28649 is a member signature)"
