identifier: PANTHER:PTHR47038
label: "BAG-ASSOCIATED GRAM PROTEIN 1"
definition: >-
  This entry represents a group of plant PH-like domain-containing proteins, including BAGP1 from Arabidopsis. BAGP1 is involved in proteolytic processing of BAG6, which is required for basal resistance against this pathogen.
