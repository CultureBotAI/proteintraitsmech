identifier: PANTHER:PTHR31684
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 43"
definition: >-
  CCDC43 is associated with cancer progression, particularly in gastric cancer and hepatocellular carcinoma. Overexpression of CCDC43 in gastric cancer enhances cell proliferation, invasion, and metastasis, correlating with poor prognosis.
