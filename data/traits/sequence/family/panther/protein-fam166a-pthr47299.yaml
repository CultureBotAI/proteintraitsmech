  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural integrity and function of cilia. Members are thought to be microtubule inner proteins that are part of the dynein-decorated doublet microtubules within the flagellum axoneme. These proteins likely play a role in the stability and movement of cilia by interacting with the microtubules, which are essential components of the ciliary structure.
