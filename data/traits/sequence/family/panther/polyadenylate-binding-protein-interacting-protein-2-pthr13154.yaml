identifier: PANTHER:PTHR13154
label: "POLYADENYLATE-BINDING PROTEIN-INTERACTING PROTEIN 2"
definition: >-
  This entry includes Paip2 (also known as Paip2A) and related proteins, such as Paip2B. Paip2 is a transcription repressor that inhibits translation by interdicting PABP (poly(A) binding protein) function. Paip2B acts in a manner similar to Paip2. However, they are expressed in different tissues and cell lines. Also, Paip2 is more highly ubiquitinated than is Paip2B and is degraded more rapidly by the proteasome.
