identifier: PANTHER:PTHR47183
label: "GLUCOSE-1-PHOSPHATE CYTIDYLYLTRANSFERASE-RELATED"
definition: >-
  Alpha-D-Glucose-1-phosphate cytidylyltransferase, also known as CDP-glucose pyrophosphorylase, is the product of the rfbF gene and produces CDP-D-glucose from alpha-D-Glucose-1-phosphate and MgCTP as substrate. CDP-D-Glucose is the precursor for synthesising four of the five naturally occurring 3,6-dideoxy sugars-abequose (3,6-dideoxy-D-Xylo-hexose), ascarylose (3,6-dideoxy-L-arabino-hexose), paratose (3,6-dideoxy-D-ribohexose), and tyvelose (3,6-dideoxy-D-arabino-hexose. Deoxysugars are ubiquitous in nature where they function in a variety of biological processes, including cell adhesion, immune response, determination of ABO blood groups, fertilisation, antibiotic function, and microbial pathogenicity. This entry also includes the probable glucose-1-phosphate cytidylyltransferase from Bacillus subtilis.
definition_source: "InterPro:IPR013446 abstract (PANTHER PTHR47183 is a member signature)"
