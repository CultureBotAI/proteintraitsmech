  - kind: GENERAL
    text: >-
      The Cytochrome P450 71D family comprises enzymes with monooxygenase activity, involved in the biosynthesis of various phytoalexins, which are antimicrobial and often antioxidative substances produced by plants in response to pathogen attack. Members of the family catalyze hydroxylation reactions, adding hydroxyl groups to specific substrates such as 5-epiaristolochene and premnaspirodiene, leading to the production of compounds like capsidiol and solavetivone. These reactions are crucial for the plant's defense mechanism. The enzymes show variability in their substrate specificity and efficiency of hydroxylation steps. Some members are inhibited by compounds like ancymidol and ketoconazole, indicating a potential for regulation of their activity.
    source: "InterPro:IPR052306 abstract (LLM-generated, not curator-reviewed)"
