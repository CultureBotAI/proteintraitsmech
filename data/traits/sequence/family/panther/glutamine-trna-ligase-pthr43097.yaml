definitions:
  - kind: GENERAL
    text: >-
      GLUTAMINE-TRNA LIGASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43097. PANTHER protein class: aminoacyl-tRNA synthetase, translational protein. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, catalytic activity, acting on RNA, ligase activity. Members participate in cellular aromatic compound metabolic process, heterocycle metabolic process, tRNA metabolic process. Members localise to cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Glutamine--tRNA and Glutamate--tRNA ligase family includes enzymes that play a crucial role in protein synthesis by catalyzing the attachment of amino acids to their corresponding tRNAs. Glutamine--tRNA ligases activate glutamine by ATP to form Glu-AMP and then transfer it to the acceptor end of tRNA(Gln), a process essential for translating the genetic code into proteins. Similarly, Glutamate--tRNA ligases perform the same function for glutamate and tRNA(Glu). These enzymes belong to the class-I aminoacyl-tRNA synthetase family and are vital for proper brain development in higher organisms. Some members of the family also participate in the biosynthesis of natural products in fungi.
    source: "InterPro:IPR050132 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
