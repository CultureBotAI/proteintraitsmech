identifier: PANTHER:PTHR12146
label: "40S RIBOSOMAL PROTEIN S10"
definition: >-
  Eukaryotic ribosomes consist of a small 40S subunit and a large 60S subunit. This entry represents the ribosomal subunit protein eS10 (also known as Rps10), a component of the 40S ribosomal subunit. It plays an important role in mammalian ribosome-associated QC pathways.
