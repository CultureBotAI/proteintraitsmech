  - kind: GENERAL
    text: >-
      The THEM6/lcsJ thioesterase family is involved in the biosynthesis of various bioactive compounds, including oxaleimides, lipopeptide antibiotics, and linear lipopeptides. Members of this family function as thioesterases, playing a crucial role in the processing and maturation of secondary metabolites. They participate in complex biosynthetic pathways, often involving polyketide synthases (PKS) and non-ribosomal peptide synthetases (NRPS), to produce molecules with diverse biological activities such as cytotoxic, antimalarial, antiviral, antibacterial, antifungal, antitumor, and phytotoxic properties. The family's thioesterases are responsible for hydrolyzing thioester bonds, facilitating the release of synthesized compounds from the synthetase enzymes, and potentially aiding in the modification and maturation of the bioactive products.
