identifier: PANTHER:PTHR48493
label: "UBIQUITIN-LIKE DOMAIN-CONTAINING CTD PHOSPHATASE 1"
definition: >-
  Ubiquitin-like domain-containing CTD phosphatase 1 (UBLCP1) is characterised by an ubiquitin-like domain that mediates interactions with proteasomes. Members of this family are involved in the regulation of proteasome activity by dephosphorylating 26S nuclear proteasomes, which results in a decrease in their proteolytic activity. These proteins are recruited to the 19S regulatory particle of the 26S proteasome, where they target components such as PSMC2/RPT1, impairing ATPase activity and disrupting proteasome assembly. Some reports also suggest that members UBLCP1 can stimulate the proteolytic activity of the 26S proteasome, indicating a complex role in proteasome regulation.
definition_source: "InterPro:IPR051658 abstract (PANTHER PTHR48493 is a member signature)"
