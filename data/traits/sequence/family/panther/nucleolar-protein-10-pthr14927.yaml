identifier: PANTHER:PTHR14927
label: "NUCLEOLAR PROTEIN 10"
definition: >-
  Proteins in this entry contain WD40 repeats. Nucleolar protein 10 (NOL10) is found in the nucleolus of vertebrates and contains seven WD40 repeats but is otherwise uncharacterised. Ribosome biogenesis protein Enp2 (Enp2) from Saccharomyces cerevisiae contains five WD40 repeats and is a component of 90S pre-ribosomes. Homologues are also known from plants.
