identifier: PANTHER:PTHR43593
label: "Gfo/Idh/MocA family inositol dehydrogenases"
definition: >-
  The Gfo/Idh/MocA family proteins are involved in the oxidation of myo-inositol (MI) to 2-keto-myo-inositol (2KMI or 2-inosose). Some members also catalyze the oxidation of D-chiro-inositol (DCI) to 1-keto-D-chiro-inositol (1KDCI). Additionally, certain enzymes within this family have been shown to act on other substrates such as D-glucose, D-xylose, and, to a lesser extent, D-ribose and D-fructose. The primary function of these enzymes is to participate in the inositol catabolic pathway, which is important for the metabolism of inositols, compounds that play a critical role in cellular signaling and membrane phospholipid synthesis.
