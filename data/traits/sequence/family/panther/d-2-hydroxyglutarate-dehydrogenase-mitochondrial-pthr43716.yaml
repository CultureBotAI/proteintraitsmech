  - kind: GENERAL
    text: >-
      The FAD-binding oxidoreductase/transferase type 4 family is involved in the oxidation of various D-2-hydroxyacids, primarily catalyzing the conversion of D-2-hydroxyglutarate (D-2-HG) to alpha-ketoglutarate. Members of the family also oxidize other substrates such as D-malate and D-lactate, albeit with varying degrees of activity. The family plays a crucial role in cellular metabolism and energy production, as the reactions they catalyze are tied to the electron transport chain and are essential for the utilization of specific carbon sources. Some members are also implicated in the catabolism of amino acids like lysine, contributing to metabolic flexibility. The family includes enzymes that are activated by metal ions such as zinc and cobalt, and some are regulated by the concentration of these ions. The family is characterized by the presence of a flavin adenine dinucleotide (FAD)-binding domain and exhibits a broad taxonomic distribution, including members from bacteria to humans.
    source: "InterPro:IPR051264 abstract (LLM-generated, not curator-reviewed)"
