identifier: PANTHER:PTHR37184
label: "CLAVATA3/ESR (CLE)-RELATED PROTEIN 27"
definition: >-
  The CLAVATA3/ESR-related (CLE) gene family has 31 CLE members in the Arabidopsis genome. CLE sequences share a short conserved region of 14 amino acids and are thought to function in plant morphogenesis as intercellular signaling molecules. This entry includes CLE27 and CLE43. CLE27 may have redundant roles with CLE16 and CLE17 in the Arabidopsis shoot apical meristem.
