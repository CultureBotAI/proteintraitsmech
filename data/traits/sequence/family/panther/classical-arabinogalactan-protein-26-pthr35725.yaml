identifier: PANTHER:PTHR35725
label: "CLASSICAL ARABINOGALACTAN PROTEIN 26"
definition: >-
  Arabinogalactan-proteins (AGPs) are cell wall proteoglycans and are widely distributed in the plant kingdom. They have a predicted glycosylphosphatidylinositol lipid anchor and are suggested to be involved in cell-cell signaling. This entry includes AGP25 and AGP26 from Arabidopsis.
