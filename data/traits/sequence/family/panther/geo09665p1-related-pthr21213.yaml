identifier: PANTHER:PTHR21213
label: GEO09665P1-RELATED
definition: >-
  This entry represents a group of zinc finger proteins, including MBS1/2 from Arabidopsis, ZNF706 from animals and transcriptional regulator Simba from insects. MBS1/2 are required for induction of singlet oxygen-dependent gene expression and are involved in ROS signalling. ZNF706 may act as a transcription repressor involved in the exit of embryonic stem cells (ESCs) from self-renewal. MBS1 is involved in the singlet oxygen signalling downstream of beta-cyclocitral.
