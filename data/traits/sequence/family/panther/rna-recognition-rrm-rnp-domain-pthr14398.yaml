identifier: PANTHER:PTHR14398
label: "RNA RECOGNITION RRM/RNP DOMAIN"
definition: >-
  This entry includes a group of RNA recognition motif domain containing proteins, including RBM27 and RBM26. The function of RBM27 is not clear. RBM26, also known as cutaneous T-cell lymphoma (CTCL) tumor antigen se70-2, was identified as a cutaneous lymphoma (CL)-associated antigen. It contains two RNA recognition motifs (RRMs). The RRMs may play some functional roles in RNA-binding or protein-protein interactions.
