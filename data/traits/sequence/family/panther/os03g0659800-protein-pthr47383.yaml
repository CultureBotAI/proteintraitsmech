definition: >-
  This entry represents Uncharacterized protein At4g15545 from Arabidopsis thaliana and similar proteins mainly found in plants. Members of this family contain InterPro:IPR058935. At4g15545 (named NAIP1) a specialised ER body component and is though to play a role in plant responses to environmental conditions.
