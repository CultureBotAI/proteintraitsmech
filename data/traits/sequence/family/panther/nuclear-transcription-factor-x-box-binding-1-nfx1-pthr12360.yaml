identifier: PANTHER:PTHR12360
label: "NUCLEAR TRANSCRIPTION FACTOR, X-BOX BINDING 1  NFX1"
definition: >-
  This family of transcription factors is conserved from yeast to human. It is named after human NF-X1, a transcription factor that regulates the expression of class II major histocompatibility complex (MHC) genes. The Drosophila homologue shuttle craft (STC) has been shown to be a DNA- or RNA-binding protein required for proper axon guidance in the central nervous system and the yeast homologue FAP1 encodes a dosage suppressor of rapamycin toxicity.
definition_source: "InterPro:IPR034078 abstract (PANTHER PTHR12360 is a member signature)"
