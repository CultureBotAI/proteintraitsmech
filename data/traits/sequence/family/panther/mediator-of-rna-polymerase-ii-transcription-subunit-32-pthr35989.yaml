identifier: PANTHER:PTHR35989
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 32"
definition: >-
  MED32 is a component of the Mediator complex in plants. The Mediator complex is a coactivator involved in the regulated transcription of nearly all RNA polymerase II-dependent genes. MED32 is required for recruitment of the Mediator complex and RNA polymerase II to CBF-controlled cold-responsive genes. Med32 mutants are affected in root development and leaf senescence, phenotypes possibly associated to redox changes.
