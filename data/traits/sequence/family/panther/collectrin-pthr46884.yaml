identifier: PANTHER:PTHR46884
label: COLLECTRIN
definition: >-
  Collectrin is a putative glycoprotein that shares homology with the C-terminal of angiotensin-converting enzyme-related carboxypeptidase (ACE2), but lacks the dipeptidyl carboxypeptidase catalytic domains. It is a target of HNF-1 in pancreatic beta cells and can increase exocytosis by interaction with snapin and facilitated SNARE complex formation.
