identifier: PANTHER:PTHR21663
label: "HYPOTHETICAL HEAT DOMAIN-CONTAINING"
definition: >-
  This entry includes Laa1 from budding yeasts, Sip1 from fission yeasts, HEATR5A/B from animals. Laa1 is an AP-1 accessory protein that play an important role for AP-1 localization. Sip1 interacts with F-box protein 6 and is essential for endocytosis and cytokinesis in fission yeast. The function of HTR5A/B is not clear.
