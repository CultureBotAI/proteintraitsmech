identifier: PANTHER:PTHR46751
label: EPPIN
definition: >-
  This family of proteins includes serine protease inhibitors with diverse biological functions. Members are involved in male reproduction and fertility, modulating sperm motility, and providing antimicrobial protection for spermatozoa. Some family members are toxins from venomous species, inhibiting serine proteases and voltage-gated potassium channels, or interacting with vasopressin receptors to modulate diuresis. Others are involved in immune responses, such as preventing accidental activation of prophenoloxidase, which is crucial for the insect immune system. The family exhibits a range of inhibitory activities against enzymes like trypsin, kallikrein, chymotrypsin, and elastase, and some have been characterized by their interaction with specific receptors or channels, contributing to their selectivity and potency in various biological processes.
