identifier: PANTHER:PTHR18867
label: RAD50
definition: >-
  RAD50 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR18867. Members are annotated with the molecular function telomeric DNA binding, double-stranded DNA binding, single-stranded telomeric DNA binding. Members participate in telomere maintenance via telomere lengthening, cellular response to stimulus, double-strand break repair. Members localise to non-membrane-bounded organelle, protein-containing complex, organelle lumen.
