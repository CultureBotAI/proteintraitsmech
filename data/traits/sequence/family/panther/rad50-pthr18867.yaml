identifier: PANTHER:PTHR18867
label: RAD50
definition: >-
  RAD50 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR18867. Members are annotated with the molecular function single-stranded telomeric DNA binding, double-stranded DNA binding. Members participate in telomere maintenance via telomerase, double-strand break repair, mitotic recombination. Members localise to condensed nuclear chromosome, nuclear lumen, nuclear protein-containing complex.
