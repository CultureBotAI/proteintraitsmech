  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the formation of acyl-CoA esters from various substrates, utilizing ATP and releasing ADP and phosphate. Members of this family are involved in central metabolic processes, such as the degradation of branched-chain amino acids and the conversion of acetyl-CoA to acetate. Some proteins within this family also exhibit acetyltransferase activity, modifying other proteins by acetylation, which can regulate their function. These enzymes play a role in responding to environmental changes by acetylating central metabolic enzymes. They are characterized by the presence of distinct domains that are evolutionarily related to the alpha and beta subunits of acetate CoA ligase, indicating a shared catalytic mechanism and structural features.
