identifier: PANTHER:PTHR38435
label: 6-phospho-N-acetylmuramidase
definition: >-
  This family consists of 6-phospho-N-acetylmuramidase, involved in the recycling pathway of the cell wall turnover product MurNAc-GlcNAc in S.aureus. It catalyses the hydrolysis of MurNAc 6-phosphate-GlcNAc, the disaccharide product of MurP-uptake and phosphorylation, yielding MurNAc 6-phosphate and GlcNAc.
