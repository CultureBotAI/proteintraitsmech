identifier: PANTHER:PTHR15031
label: "CARTILAGE INTERMEDIATE LAYER PROTEIN  CLIP"
definition: >-
  This entry includes cartilage intermediate layer proteins 1 (CILP1) and 2 (CILP2). CILP1 acts as a modulator of lumbar disc disease susceptibility. CILP1 interferes with pro-fibrotic TGFbeta signalling and is a mediator of cardiac extracellular matrix remodeling. CILP2 is present in human articular cartilage and may be associated with collagen VI containing suprastructures.
