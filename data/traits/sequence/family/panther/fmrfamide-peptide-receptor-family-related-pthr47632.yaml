  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that are typically part of the G-protein coupled receptor (GPCR) superfamily. GPCRs are characterized by their seven transmembrane domains and are involved in transmitting signals from the extracellular environment to the interior of the cell. They play a pivotal role in various physiological processes, including sensory perception, immune response, and neurotransmission. Upon ligand binding, these receptors activate heterotrimeric G-proteins, which in turn modulate various downstream signaling pathways. The specific functions of individual family members may vary, but they generally contribute to cellular communication and response to external stimuli.
