identifier: PANTHER:PTHR10192
label: "MOLYBDOPTERIN BIOSYNTHESIS PROTEIN"
definition: >-
  Eukaryotic and prokaryotic molybdoenzymes require a molybdopterin cofactor (MoCF or Moco) for their activity. The biosynthesis of this cofactor involves a complex multistep enzymatic pathway. In bacteria, The final step in MoCF synthesis is the attachment of mononuclear Mo to MPT, a process that requires MoeA and which is enhanced by MogA in an Mg2 ATP-dependent manner. In eukaryotes, MogA and MoeA are fused into a single polypeptide chain, such as in Drosophila protein cinnamon. The corresponding mammalian protein gephyrin has also been implicated in the anchoring of glycinergic receptors to the cytoskeleton at inhibitory synapses.
definition_source: "InterPro:IPR038987 abstract (PANTHER PTHR10192 is a member signature)"
