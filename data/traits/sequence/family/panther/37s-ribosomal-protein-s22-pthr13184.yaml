    text: >-
      37S RIBOSOMAL PROTEIN S22 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13184. PANTHER protein class: ribosomal protein, translational protein. Members are annotated with the molecular function structural constituent of ribosome. Members localise to ribosome, small ribosomal subunit.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes mitochondrial S-adenosyl-L-methionine-dependent RNA methyltransferases, which are likely involved in the methylation of mitochondrial rRNA. This modification is essential for the stabilization of the mitochondrial small ribosomal subunit (mt-SSU), a critical component for the assembly and functionality of the mitochondrial ribosome. Consequently, these proteins play a significant role in ensuring proper protein translation within the mitochondria. Despite the absence of protein methyltransferase activity, their function in RNA methylation underscores their importance in maintaining mitochondrial gene expression.
    source: "InterPro:IPR052571 abstract (LLM-generated, not curator-reviewed)"
