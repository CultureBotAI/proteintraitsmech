identifier: PANTHER:PTHR21736
label: "VERNALIZATION-INSENSITIVE PROTEIN 3"
definition: >-
  This entry represents a plant specific protein family, OBERON (OBE), also known as ptyvirus VPg-interacting protein (PVIP). In Arabidopsis, there are four OBEs, OBE1-4. OBE1 together with OBE2 are required for the maintenance and/or establishment of both the shoot and root meristems, probably by controlling the expression of the meristem genes such as WUS, PLT1 and PLT2 and of genes required for auxin responses. All four OBE proteins are able to interact with OBE1 and 2. However, OBE3 and 4 do not self-interact or interact with each other. OBE1 and OBE2 also bind to virus genome-linked proteins (VPgs) of a diverse range of potyviruses and functions as an ancillary factor to support potyvirus movement in plants.
definition_source: "InterPro:IPR004082 abstract (PANTHER PTHR21736 is a member signature)"
