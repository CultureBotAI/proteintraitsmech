  - kind: GENERAL
    text: >-
      This family of proteins includes members that are classified as orphan nuclear receptors. Orphan receptors are a type of nuclear hormone receptor for which endogenous ligands have not yet been identified. They are capable of DNA binding and may be involved in the regulation of gene expression, development, metabolism, and homeostasis by acting as transcription factors. Despite the lack of identified ligands, these receptors share structural similarities with other nuclear hormone receptors, suggesting potential roles in ligand-dependent transcriptional activation or repression. The specific functions of these proteins may vary, but they are generally involved in the intricate network of nuclear signaling pathways.
