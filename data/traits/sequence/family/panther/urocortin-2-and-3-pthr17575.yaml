identifier: PANTHER:PTHR17575
label: "UROCORTIN-2 AND 3"
definition: >-
  This entry represents urocortin II and III, which are members of the corticotropin-releasing factor (CRF) family of neuropeptides. Urocortin II and III are secreted peptides and bind with high affinity to CRF receptors 2-alpha and 2-beta. They are involved in the suppression of food intake, the delay of gastric emptying, and may represent endogenous ligands for maintaining homeostasis after stress. Their backbone is mainly α-helical, but contains a helix-loop-helix motif.
