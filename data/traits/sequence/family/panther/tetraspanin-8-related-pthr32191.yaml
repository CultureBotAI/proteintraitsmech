identifier: PANTHER:PTHR32191
label: TETRASPANIN-8-RELATED
definition: >-
  This entry represents tetraspanin (TET) from plants, including TET1-17 from Arabidopsis. TET1, also known as TORNADO 2, is involved in the basipetal transport of auxin (IAA) that modulates growth and organs organization, as well as cell differentiation. It plays an role in cellular decisions in the peripheral zone of the shoot apical meristem. Together with WIH1 and WIH2, TET1 promotes megasporogenesis. Tetraspanins are a distinct family of proteins, containing four transmembrane domains: a small outer loop (EC1), a larger outer loop (EC2), a small inner loop (IL) and short cytoplasmic tails. They contain characteristic structural features, including 4-6 conserved extracellular cysteine residues, and polar residues within transmembrane domains. A fundamental role of tetraspanins appears to be organizing other proteins into a network of multimolecular membrane microdomains, sometimes called the 'tetraspanin web'.
definition_source: "InterPro:IPR044991 abstract (PANTHER PTHR32191 is a member signature)"
