identifier: PANTHER:PTHR24348
label: "SERINE/THREONINE-PROTEIN KINASE UNC-51-RELATED"
definition: >-
  This entry represents a group of Serine/threonine-protein kinases, including Atg1 from yeasts, Unc-51 from C. elegans, Ulk1-3 from humans and ATG1a/b/c/t from Arabidopsis. Atg1 is required for vesicle formation in autophagy and the cytoplasm-to-vacuole targeting (Cvt) pathway. Ulk1-3 are involved in autophagy in response to starvation. Ulk1 and Ulk2 regulate filopodia extension and branching of sensory axons. They are important for axon growth, playing an essential role in neurite extension of cerebellar granule cells. Unc-51 is important for axonal elongation and axonal guidance. It is required for either the maintenance of axons (membrane turnover) or for an unknown neuronal function. C elegans worms lacking Unc-51 exhibit various abnormalities in axonal elongation and axonal structures. Unc-51 could also help control cell size along with Bec-1, as mutations in their corresponding genes results in a reduction in small body size without affecting cell number. Unc-51 is also a component of the Unc-51/Atg-13 complex that is probably recruited by lgg-1 to preautophagosomes and is required for autophagosome formation. In plants, the ATG1/13 complex is both a regulator and a target of autophagy. This family also includes the serine/threonine protein kinase Negative regulator of sexual conjugation and meiosis from Schizosaccharomyces pombe (Ran1 or Pat1), a negative regulator of both sexual conjugation and meiosis
definition_source: "InterPro:IPR045269 abstract (PANTHER PTHR24348 is a member signature)"
