    text: >-
      TYROSINE-PROTEIN KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32309. PANTHER protein class: non-receptor tyrosine protein kinase.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
