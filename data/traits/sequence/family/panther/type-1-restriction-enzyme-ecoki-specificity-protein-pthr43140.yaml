identifier: PANTHER:PTHR43140
label: "TYPE-1 RESTRICTION ENZYME ECOKI SPECIFICITY PROTEIN"
definition: >-
  Type I restriction enzyme specificity subunits (S subunits) are part of a multi-subunit enzyme complex involved in the recognition and modification of DNA. These subunits determine the DNA sequence specificity for the enzyme complex. Together with the modification (M) and restriction (R) subunits, they form a system that can act as a methyltransferase, modifying adenine residues within a specific DNA sequence to protect the host genome from invasion by foreign DNA. If the DNA is unmodified, the complex functions as an endonuclease, cleaving the DNA at a distance from the recognition site. The S subunits contain two DNA recognition domains, each recognizing specific components of the target sequence. The activity of the complex is also dependent on the methylation state of the DNA, with hemimethylated sites being modified rather than cleaved. This system also exhibits ATP-dependent DNA translocation activity, which can lead to DNA cleavage upon collision events.
