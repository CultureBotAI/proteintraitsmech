  - kind: GENERAL
    text: >-
      This family of proteins includes lysine acetyltransferases, which are enzymes that catalyze the transfer of an acetyl group from acetyl-CoA to the epsilon-amino group of a lysine residue on a substrate protein. This modification can affect the protein's function, interactions, stability, or localization. The acetylation reaction is a key post-translational modification and plays a significant role in regulating various biological processes, including gene expression, cell signaling, and metabolism. Members of this family are involved in the lysine degradation pathway, initiating the process by acetylating lysine. The activity of these enzymes can be modulated by specific metabolites, which may serve as inhibitors, reflecting a tight regulation of their function in response to cellular metabolic states.
