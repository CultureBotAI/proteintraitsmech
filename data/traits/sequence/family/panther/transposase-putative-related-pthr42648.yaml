identifier: PANTHER:PTHR42648
label: "TRANSPOSASE, PUTATIVE-RELATED"
definition: >-
  This entry represents the Ty1/copia-like retrotransposons mostly from eukaryotes, including Copia from Drosophila melanogaster, Tnt1 from Nicotiana tabacum and Ty1 from Saccharomyces cerevisiae. Copia-like elements share the same general structure including a long terminal repeat (LTR), and encode a polyprotein that includes major domains with highly conserved amino acid sequences such as gag and pol, and the integrase domain located at the 5' end of the reverse transcriptase domain.
