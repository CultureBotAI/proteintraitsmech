  - kind: GENERAL
    text: >-
      This family of proteins is involved in non-classical protein export pathways, which facilitate the transport of proteins that lack a cleavable signal sequence. Members of this family play a role in membrane organization and may function as sensors of sphingolipids, influencing plasma membrane function. They are implicated in the formation of membrane compartments, such as MCCs, and the invagination of the plasma membrane at these sites. Additionally, they participate in eisosome organization and may serve as accessory subunits to core components of the export machinery. This pathway also serves as an alternative mechanism for the clearance or detoxification of damaged cellular material when traditional repair pathways are insufficient.
    source: "InterPro:IPR052649 abstract (LLM-generated, not curator-reviewed)"
