identifier: PANTHER:PTHR35192
label: "PROTEIN, PUTATIVE-RELATED"
definition: >-
  This family represents a group of fungal proteins, including PriA from Lentinula edodes and CPL1 from Cryptococcus neoformans. PriA was identified as a gene that may play a role during the beginning of fruiting. CPL1 is a virulence factor which promotes fungal virulence by enhancing type 2 inflammation in the mouse host[[cite35896747]].
