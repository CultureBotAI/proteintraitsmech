identifier: PANTHER:PTHR44200
label: "DNAJ HOMOLOG SUBFAMILY C MEMBER 7"
definition: >-
  This family of proteins functions as co-chaperones that regulate the activity of the molecular chaperones HSP70 and HSP90. They are involved in the folding process of steroid receptors, including glucocorticoid and progesterone receptors. These proteins are suggested to have a role in recycling chaperone substrates back to the initial stages of the folding pathway if additional folding is necessary. They have the ability to induce the dissociation of HSP90 from chaperone-substrate complexes in an ATP-independent manner, while not affecting HSP70-bound complexes. Additionally, they are involved in the cytoplasmic recruitment of nuclear receptors such as NR1I3.
