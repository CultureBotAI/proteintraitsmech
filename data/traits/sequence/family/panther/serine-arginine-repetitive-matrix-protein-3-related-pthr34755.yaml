identifier: PANTHER:PTHR34755
label: "SERINE/ARGININE REPETITIVE MATRIX PROTEIN 3-RELATED"
definition: >-
  This family of proteins includes splicing factors that are involved in pre-mRNA processing and neural cell differentiation. Members of this family are known to regulate alternative splicing events, which are critical for the expression of neural-specific isoforms and the proper functioning of the nervous system. Some proteins within this family may also play a role in cancer progression by modulating cell invasiveness. The family is characterized by the presence of serine/arginine repetitive matrix domains, which are indicative of their involvement in RNA binding and splicing regulation.
