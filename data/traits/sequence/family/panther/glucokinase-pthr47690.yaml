  - kind: GENERAL
    text: >-
      GLUCOKINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47690. PANTHER protein class: transferase, kinase, metabolite interconversion enzyme. Members are annotated with the molecular function carbohydrate kinase activity, hexokinase activity, phosphotransferase activity, alcohol group as acceptor. and localise to cytoplasm, cytosol, cellular anatomical entity.
