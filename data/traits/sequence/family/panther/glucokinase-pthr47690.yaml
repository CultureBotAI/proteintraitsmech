    method: GENERATED
  - kind: GENERAL
    text: >-
      The bacterial glucokinase family consists of ATP-dependent enzymes that catalyze the phosphorylation of glucose to produce glucose-6-phosphate. This reaction is a key step in the glycolytic pathway, allowing cells to utilize glucose for energy production. In some bacteria, such as E. coli, the role of glucokinase is not critical for glucose metabolism as glucose is often imported as glucose-6-phosphate via the phosphotransferase system (PTS). However, in conditions where PTS is not the primary glucose transport mechanism, glucokinase activity becomes more important. The family members are not active on other sugars like fructose, galactose, or mannose, indicating a specific role in glucose metabolism.
    source: "InterPro:IPR050201 abstract (LLM-generated, not curator-reviewed)"
