identifier: PANTHER:PTHR16219
label: "AUGMIN SUBUNIT 4 FAMILY MEMBER"
definition: >-
  HAUS4 is part of the HAUS augmin-like complex, which contributes to mitotic spindle assembly, maintenance of chromosome integrity and completion of cytokinesis. Human augmin complex is composed of 8 subunits and interacts with the gamma-tubulin ring complex (gamma-TuRC) in centrosomes. This interaction affects MT generation during mitosis and is critical for chromosome segregation and cytokinesis in human cells.
