  - kind: GENERAL
    text: >-
      The Kazal-type serine protease inhibitor family is characterized by its ability to inhibit serine proteases. Members of this family play roles in various biological processes including anti-inflammatory and antimicrobial protection of mucous epithelia, skin integrity, and desquamation. They regulate the activity of defense-activating and desquamation-involved proteases such as kallikreins, trypsin, and elastase. The inhibitors are selective, with some members not inhibiting certain kallikreins. The family includes avian ovomucoids, which consist of three homologous, tandem Kazal family inhibitory domains and are known to inhibit trypsin. Human representatives of this family have been implicated in skin desquamation by inhibiting specific kallikreins.
