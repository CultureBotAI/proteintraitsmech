identifier: PANTHER:PTHR46375
label: "KELCH REPEAT AND BTB DOMAIN-CONTAINING PROTEIN 13-RELATED"
definition: >-
  This family of proteins serves as substrate-specific adapters for BCR (BTB-CUL3-RBX1) E3 ubiquitin ligase complexes, which are involved in the ubiquitination and degradation of target proteins. Members of this family are characterized by the presence of kelch repeats and a BTB domain, which is responsible for mediating interactions with CUL3, a core component of the ligase complex. These proteins play a crucial role in various cellular processes, including mitotic progression and cytokinesis, by regulating the stability of specific proteins through ubiquitination. The kelch repeats may also be involved in protein-protein interactions, contributing to the specificity of substrate recognition.
