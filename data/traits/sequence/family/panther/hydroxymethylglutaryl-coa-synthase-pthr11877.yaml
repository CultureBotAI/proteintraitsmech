identifier: PANTHER:PTHR11877
label: "HYDROXYMETHYLGLUTARYL-COA SYNTHASE"
definition: >-
  Type III polyketide synthases include plant naringenin-chalcone synthases (CHSs) and stilbene synthases (STSs) (resveratrol synthases). This group also includes CHS-related enzymes such as bibenzyl synthase (BBS) and acridone synthase (ACS) that share a common chemical mechanism but differ from CHS in their substrate specificity and/or in the stereochemistry of the polyketide cyclisation reaction. It also includes prokaryotic type III polyketide synthases (PKSs). This entry includes non-canonical type III polyketide synthase such as 3-oxoglutaric acid synthase I from Coca plant involved in the biosynthesis of tropane (e.g. cocaine) alkaloids natural products, acting as toxic repellents against herbivorous predators and exhibiting antispasmodic, stimulant, anticholinergic and psychoactive effects in medical use. Type III polyketide synthases catalyse the formation of structurally diverse polyketides. They are homodimeric iterative PKSs and contain two independent active sites, each of which catalyses single or multiple condensation reactions to generate polyketides of different lengths. CHS and STS are plant-specific polyketide synthases. With a starter CoA-ester, they perform three sequential condensation steps with acetate units from malonyl-CoA to form a tetraketide intermediate that is folded to the ring systems specific to the different products. Each monomer subunit is capable of performing all three condensation steps, and malonyl-CoA is the direct donor of the acetate units. The structure of the Medicago sativa (Alfalfa) CHS2 has the active site architecture that defines the sequence and chemistry of multiple decarboxylation and condensation reactions. CHSs ( ) are key enzymes in flavonoid assembly. They synthesize naringenin chalcone, the precursor for a large n
