identifier: PANTHER:PTHR46006
label: "RHO GUANINE NUCLEOTIDE EXCHANGE FACTOR AT 64C, ISOFORM A"
definition: >-
  The protein family acts as adapter proteins linking endocytic membrane traffic to the actin assembly machinery and as guanine nucleotide exchange factors (GEFs) for various Rho GTPases, including CDC42, RhoA, and RhoB. They are involved in the formation and maturation of clathrin-coated vesicles and endocytosis of receptors such as EGFR and ITGB1. Some family members regulate synaptic vesicle endocytosis and dendrite formation. They may also participate in signaling pathways like the SAPK/JNK pathway and contribute to the ubiquitination and degradation of EGFR, modulating signaling pathways. Additionally, they interact with multiple proteins through domains like SH3 and DH, influencing cellular processes such as actin nucleation and vesicle trafficking.
