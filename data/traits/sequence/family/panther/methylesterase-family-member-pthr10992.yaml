identifier: PANTHER:PTHR10992
label: "METHYLESTERASE FAMILY MEMBER"
definition: >-
  This entry represents a group of α/β-hydrolase fold-containing proteins mostly from plants and bacteria, including methylesterase (MES) and hydroxynitrile lyase (HNL) from Arabidopsis. There are at least 20 Arabidopsis MES members (AtMES1-AtMES20). The catalytic triad Ser-His-Asp is conserved in 15 of these proteins. However, AtMES19 and AtMES20 lack part of the N-terminal or C-terminal region, respectively, and are therefore likely to be inactive enzymes. Some members have been shown to hydrolyse MeIAA. AtHNL catalyses the cleavage of cyanohydrins to yield hydrocyanic acid (HCN) and the respective carbonyl compound and are key enzymes in the process of cyanogenesis in plants. Interestingly, HNL homologue from Hevea brasiliensis, known as HbHNL, has opposite enantioselectivities and different reaction mechanisms compared to AtHNL. Proteins in this entry also include pyrethroid hydrolase PytH from Sphingobium wenxiniae, which catalyses the hydrolysis of pyrethroids pesticides, and Norfluorocurarine synthase 1/2 from Strychnos nux-vomica, hydrolases involved in the biosynthesis of curare monoterpene indole alkaloids (MIAs), natural products such as strychnine, a neurotoxic compound used as a pesticide to control rodents, and its pharmacologically active derivatives, including brucine, used to regulate blood pressure.
