definitions:
  - kind: GENERAL
    text: >-
      SOX100B — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45803. PANTHER protein class: DNA-binding transcription factor, HMG box transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
