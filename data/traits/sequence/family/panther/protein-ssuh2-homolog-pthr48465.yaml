identifier: PANTHER:PTHR48465
label: "PROTEIN SSUH2 HOMOLOG"
definition: >-
  SSUH2 protein is implicated in the biological process of odontogenesis, which is the complex development of teeth. Members of this family are homologous proteins that share a conserved function across different species, including zebrafish, mice, and humans. The role of the SSUH2 in odontogenesis suggests their involvement in the tooth development.
