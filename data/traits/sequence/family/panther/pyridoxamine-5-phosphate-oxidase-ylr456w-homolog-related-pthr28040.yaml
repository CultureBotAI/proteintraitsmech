  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the biosynthesis of vitamin B6, which is an essential cofactor for a wide range of enzymatic reactions. Members of this family catalyze the oxidation of pyridoxamine 5'-phosphate (PMP) to pyridoxal 5'-phosphate (PLP), the active form of vitamin B6. The reaction is crucial for maintaining the levels of PLP within the cell, which in turn supports various metabolic processes including amino acid, glucose, and lipid metabolism. These enzymes are typically flavin-dependent and utilize molecular oxygen to oxidize PMP to PLP, releasing hydrogen peroxide as a byproduct.
    source: "InterPro:IPR052841 abstract (LLM-generated, not curator-reviewed)"
