identifier: PANTHER:PTHR12127
label: MUCOLIPIN
definition: >-
  Mucolipin (TRPML) family members, including Mucolipin 1/2/3 (TRPML1/2/3), are ion channel proteins that belong to the transient receptor potential (TRP) superfamily of cation channels. They are non-selective cation channels with six predicted transmembrane domains and intracellular N and C terminus regions. They have a channel pore located between TM5 and TM6 that is permeable to sodium (Na+) and calcium ions (Ca2+). The TRPMLs exist as homomeric or heteromeric channels. They may play a role in endosome-lysosome fusion, scission of endo-lysosomal hybrid organelle, autophagy, vacuolar pH regulation, exocytosis, and metal homeostasis.
