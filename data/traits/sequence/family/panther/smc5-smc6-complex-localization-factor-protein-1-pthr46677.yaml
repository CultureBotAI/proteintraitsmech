identifier: PANTHER:PTHR46677
label: "SMC5-SMC6 COMPLEX LOCALIZATION FACTOR PROTEIN 1"
definition: >-
  The SMC5-SMC6 complex localization factor protein 1 plays a role in the DNA damage response (DDR) pathway by regulating postreplication repair of UV-damaged DNA and genomic stability maintenance. The RAD18-SLF1-SLF2 complex suppresses the genome instability by recruiting the SMC5/6 cohesion complex to DNA lesions.
