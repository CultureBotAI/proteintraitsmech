identifier: PANTHER:PTHR12318
label: "TESTOSTERONE-REGULATED PROTEIN RP2"
definition: >-
  Nucleoside diphosphate-linked moiety X motif 19 (NUDT19 or RP2p) is a coenzyme A diphosphatase. It hydrolases CoA esters, including choloyl-CoA and branched-chain fatty-acyl-CoA esters. Medium and long-chain fatty-acyl-CoA esters are the primary substrates. The protein contains a nudix hydrolase domain, a CoA-binding domain and a peroxisomal targeting signal at the C terminus, and activity in the mouse kidney is restricted to peroxisomes. The enzyme is active at pH 9 or above and requires Mn 2+ or Mg 2+ ions. There are numerous uncharacterised bacterial and archaeal homologues.
