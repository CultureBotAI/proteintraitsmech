identifier: PANTHER:PTHR18962
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 39"
definition: >-
  CCDC39 is an axonemal protein with coiled-coil domains required for assembly of inner dynein arms and the dynein regulatory complex, a key regulator of motor activity in cilia. Mutations in CCDC39 are a cause of primary ciliary dyskinesia, a disorder caused by cilia and sperm dysmotility.
