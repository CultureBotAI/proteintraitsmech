identifier: PANTHER:PTHR35563
label: "BARREL METAL-DEPENDENT HYDROLASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_1G16240)-RELATED"
definition: >-
  This family of proteins includes enzymes involved in the degradation of various aromatic compounds and sulfonated benzenes. Members of this family catalyze hydrolysis and isomerization reactions that are key steps in specific catabolic pathways. These reactions include the hydrolytical desulfonation of 4-sulfomuconolactone, the hydrolysis of 2-pyrone-4,6-dicarboxylate, and the isomerization of D-galactaro-1,5-lactone. The enzymes are characterized by their metallo-dependent hydrolase activity, with some members being inhibited by metal ions such as Zn(2+), Cu(2+), Mn(2+), and Co(2+). The family plays a crucial role in the utilization of various substrates as carbon sources by different microorganisms.
