identifier: PANTHER:PTHR28206
label: "NUCLEOPORIN POM152"
definition: >-
  This entry includes nucleoporin Pom152, which is a component of the nuclear pore complex (NPC). Pom152 is a glycoprotein subunit of transmembrane ring of NPC and is important for the assembly of the NPC.
