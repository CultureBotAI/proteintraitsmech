identifier: PANTHER:PTHR12393
label: "SPHINGOMYELIN PHOSPHODIESTERASE RELATED"
definition: >-
  SPHINGOMYELIN PHOSPHODIESTERASE RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12393. PANTHER protein class: phosphodiesterase, hydrolase. Members are annotated with the molecular function phospholipase activity. Members participate in ceramide biosynthetic process, sphingolipid catabolic process, membrane lipid metabolic process. Members localise to endoplasmic reticulum, membrane, cell periphery.
