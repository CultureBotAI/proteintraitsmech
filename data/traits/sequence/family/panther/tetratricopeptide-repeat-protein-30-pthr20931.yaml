identifier: PANTHER:PTHR20931
label: "TETRATRICOPEPTIDE REPEAT PROTEIN 30"
definition: >-
  This entry includes TT30A, TT30B (also known as intraflagellar transport protein 70A/B) and related proteins. They contain tetratricopeptide repeats. These proteins may be required for polyglutamylation of axonemal tubulin in sensory cilia and they may play a role in anterograde intraflagellar transport (IFT), the process by which cilia precursors are transported from the base of the cilium to the site of their incorporation at the tip.
definition_source: "InterPro:IPR039941 abstract (PANTHER PTHR20931 is a member signature)"
