identifier: PANTHER:PTHR16777
label: "PROTEIN ECT2"
definition: >-
  Epithelial Cell Transforming Sequence 2 (Ect2) is a guanine nucleotide exchange factor (GEF) that catalyses the exchange of GDP for GTP. Like other GEFs, Ect2 serves as molecular switches in diverse signaling pathways, including cell polarity, mitotic spindle assembly, cytokinesis, etc. Ect2 interacts with several members of the Rho GTPase family including, RhoA, RhoB, RhoC, RhoG, Rac1 and Cdc42. Ect2 regulates the formation of the actomyosin contractile ring at mitotic exit through activation of RhoA and functions in metaphase for the process of spindle assembly through activation of Cdc42. Ect2 is regulated through a number of mechanisms including phosphorylation, intracellular localization and intra- and inter-molecular interactions.
definition_source: "InterPro:IPR026817 abstract (PANTHER PTHR16777 is a member signature)"
