identifier: PANTHER:PTHR33044
label: "BIFUNCTIONAL INHIBITOR/LIPID-TRANSFER PROTEIN/SEED STORAGE 2S ALBUMIN SUPERFAMILY PROTEIN-RELATED"
definition: >-
  This entry represents a protein family unique to higher plants that includes cereal-type alpha-amylase inhibitors, lipid transfer proteins, seed storage proteins, and similar proteins. Proteins in this family are known to play important roles, in defending plants from insects and pathogens, lipid transport between intracellular membranes, and nutrient storage. Many proteins of this family have been identified as allergens in humans. These proteins contain a common pattern of eight cysteines that form four disulfide bridges.
definition_source: "InterPro:IPR043325 abstract (PANTHER PTHR33044 is a member signature)"
