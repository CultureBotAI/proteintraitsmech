label: "EUKARYOTE SPECIFIC DSRNA BINDING PROTEIN"
definition: >-
  EUKARYOTE SPECIFIC DSRNA BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10910. PANTHER protein class: RNA metabolism protein. Members are annotated with the molecular function tRNA-specific adenosine deaminase activity, double-stranded RNA binding, organic cyclic compound binding. Members participate in adenosine to inosine editing, macromolecule biosynthetic process, RNA processing. Members localise to nucleolus, nuclear lumen, membrane-bounded organelle.
