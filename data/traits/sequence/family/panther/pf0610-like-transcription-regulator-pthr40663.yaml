identifier: PANTHER:PTHR40663
label: "PF0610-like transcription regulator"
definition: >-
  This entry represents PF0610 protein from Pyrococcus furiosus ( UniProtKB:Q8U362 ) and related putative transcription regulators in prokaryotes. This protein has a Zn-ribbon embedded in a winged HTH fold. The N-terminal wHTH fold is represented by InterPro:IPR049159. The Zn-ribbon embedded fold is represented by InterPro:IPR057022. This family also represents arsenical resistance operon repressor (ArsR) InterPro:IPR011991 and similar metal-regulated homodimeric repressors, which also accquires a winged helix topology in the N-terminal. The function of PF0610 has not been fully chracterized. wHTH domains containing proteins are believed to serve as DNA- or RNA-binding domains InterPro:IPR036390. A large number of wHTH proteins are transcriptional regulators, while others are involved in chromosome packing. Because of its apparent sequence-independent interaction with DNA, PF0610 could be a part of the chromatin system of P. furiosus. The numerous basic residues in PF0610 ensure strong DNA interactions. The Zn ribbon motif could help improve the structural stability of the protein at a high temperature. Another possibility is that PF0610 is a metal-dependent transcription factor. This is based on DNA microarray data. However, further research is needed to conclude if PF0610 is an iron-containing protein
definition_source: "InterPro:IPR038767 abstract (PANTHER PTHR40663 is a member signature)"
