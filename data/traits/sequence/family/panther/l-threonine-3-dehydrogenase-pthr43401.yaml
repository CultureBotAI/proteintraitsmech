  - kind: GENERAL
    text: >-
      The zinc-containing alcohol dehydrogenase family is characterized by its ability to catalyze the NAD(+)-dependent oxidation of various substrates. Members of this family are involved in diverse metabolic pathways, including the catabolism of sugars and amino acids. Key enzymes in this family include L-threonine 3-dehydrogenases, which oxidize L-threonine to 2-amino-3-ketobutyrate, and glucose 1-dehydrogenases, which oxidize D-glucose to D-gluconate. Other members have specific roles in the metabolism of compounds like D-arabitol, L-sorbose, and D-altritol. The family also contains enzymes like 2-deoxy-scyllo-inosamine dehydrogenase, involved in antibiotic biosynthesis. The broad substrate specificity and involvement in various metabolic processes make this family essential for cellular metabolism and adaptation to different nutritional environments.
