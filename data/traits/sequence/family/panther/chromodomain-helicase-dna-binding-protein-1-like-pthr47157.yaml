identifier: PANTHER:PTHR47157
label: "CHROMODOMAIN-HELICASE-DNA-BINDING PROTEIN 1-LIKE"
definition: >-
  Chromodomain-helicase-DNA-binding protein 1-like (also known as amplified in liver cancer 1, ALC1) is a SNF2 family ATPase and a chromatin-remodeling enzyme that interacts with poly(ADP-ribose) and catalyses PARP1-stimulated nucleosome sliding. ALC1 is involved in DNA repair and in controlling the expression of several genes implicated in tumorigenesis and metastasis in mammals. This entry also includes the probable helicase CHR10 from Arabidopsis.
