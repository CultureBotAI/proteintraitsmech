identifier: PANTHER:PTHR33873
label: "TRANSCRIPTION FACTOR VOZ1"
definition: >-
  This entry represents a group of plant transcription factors, including VOZ1 and VOZ2 from Arabidopsis. They are phytochrome B interacting factors that regulate flowering. They interact with CONSTANS and promote photoperiodic flowering transition. They also regulate the abiotic and biotic stress-responsive pathways.
