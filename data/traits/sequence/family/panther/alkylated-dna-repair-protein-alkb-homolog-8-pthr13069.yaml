  - kind: GENERAL
    text: >-
      The AlkB family proteins are involved in the post-transcriptional modification of tRNA, specifically at the wobble position of the anticodon loop. They catalyze the methylation of 5-carboxymethyl uridine to 5-methylcarboxymethyl uridine, with a preference for tRNA(Arg) and tRNA(Glu), and are also capable of hydroxylating 5-methylcarboxymethyl uridine to form 5-(S)-methoxycarbonylhydroxymethyluridine, with a preference for tRNA(Gly). These modifications are crucial for the proper decoding of mRNA during protein synthesis. Additionally, some members of the family may play roles in stress response, DNA damage survival, apoptosis inhibition, cell survival, and angiogenesis. The family includes proteins with tumor suppressor activity, promoting the expression of genes involved in cell cycle regulation.
    source: "InterPro:IPR051422 abstract (LLM-generated, not curator-reviewed)"
