identifier: PANTHER:PTHR31392
label: "ALPHA-1,3-MANNOSYLTRANSFERASE MNN1-RELATED"
definition: >-
  ALPHA-1,3-MANNOSYLTRANSFERASE MNN1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31392. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function mannosyltransferase activity, transferase activity, catalytic activity. and participate in carbohydrate derivative biosynthetic process, macromolecule glycosylation, macromolecule biosynthetic process. and localise to Golgi apparatus, cytoplasm, membrane-bounded organelle.
