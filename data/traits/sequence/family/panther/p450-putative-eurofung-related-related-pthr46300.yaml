identifier: PANTHER:PTHR46300
label: "P450, PUTATIVE (EUROFUNG)-RELATED-RELATED"
definition: >-
  The cytochrome P450 family is involved in the biosynthesis of a wide range of secondary metabolites in fungi, including mycotoxins, antibiotics, and other bioactive compounds. Members of this family are typically monooxygenases that catalyse the oxidation of organic substrates using a heme iron to insert one oxygen atom into the substrate while reducing the other oxygen atom to water. These enzymes play key roles in various biosynthetic pathways, often acting on specific intermediates to introduce hydroxyl groups, epoxidize double bonds, or catalyse other oxidative transformations. Their activities contribute to the structural diversification of natural products, which can result in compounds with antimicrobial, antitumor, anti-inflammatory, and psychotropic properties, as well as compounds involved in fungal development and pigmentation.
definition_source: "InterPro:IPR050364 abstract (PANTHER PTHR46300 is a member signature)"
