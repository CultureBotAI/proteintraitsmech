identifier: PANTHER:PTHR36934
label: "BLR0278 PROTEIN"
definition: >-
  This family of fluoroacetyl-CoA thioesterases includes FlK from the fluoroacetate-producing Streptomyces cattleya. FlK selectively hydrolyses fluoroacetyl-CoA over acetyl-CoA. It has been suggested that FlK protects its host from fluoroacetate toxicity.
