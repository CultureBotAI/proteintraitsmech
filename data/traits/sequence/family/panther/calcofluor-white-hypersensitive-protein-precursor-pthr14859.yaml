identifier: PANTHER:PTHR14859
label: "CALCOFLUOR WHITE HYPERSENSITIVE PROTEIN PRECURSOR"
definition: >-
  This family of proteins is involved in the process of lipid remodeling, which is a crucial step during the maturation of glycosylphosphatidylinositol (GPI) anchors. Members of this family are required for the replacement of the diacylglycerol moiety with ceramides in GPI-anchor maturation, a modification that is essential for the maintenance of cell wall integrity in fungi and potentially in other organisms. The proteins are characterized by having distinct domains that interact with each other, suggesting a complex mechanism of action in the lipid remodeling process.
