identifier: PANTHER:PTHR43217
label: "SUCCINATE SEMIALDEHYDE DEHYDROGENASE [NAD(P)+] SAD"
definition: >-
  This family represents a group of succinate semialdehyde dehydrogenases mainly found in bacteria, including SSADH1 from Mycobacterium tuberculosis and Sad from Escherichia coli. Succinate-semialdehyde dehydrogenase 1 (SSADH1 or GabD1) catalyses the NADP-dependent oxidation of succinate semialdehyde (SSA) to succinate. SSADH activity in Mycobacterium tuberculosis (Mtb) is encoded by both gabD1 (Rv0234c) and gabD2 (Rv1731). The Mtb GabD1 SSADH1 reportedly is an enzyme of the gamma-aminobutyrate shunt, which forms a functional link between two TCA half-cycles by converting alpha-ketoglutarate to succinate. Sad catalyses the NAD-dependent oxidation of succinate semialdehyde to succinate. It acts preferentially with NAD as cosubstrate but can also use NADP. This family also includes Aldh from Paenarthrobacter nicotinovorans which has sequence similarity to Sad. It does not display succinate semialdehyde dehydrogenase activity. Instead, it acts as an aldehyde dehydrogenase involved in the oxidative D-xylose degradation pathway. It is able to use both NAD and NADP; however, it shows a preference for NADP.
definition_source: "InterPro:IPR047110 abstract (PANTHER PTHR43217 is a member signature)"
