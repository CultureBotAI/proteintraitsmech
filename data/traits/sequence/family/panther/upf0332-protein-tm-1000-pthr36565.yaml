identifier: PANTHER:PTHR36565
label: "UPF0332 PROTEIN TM_1000"
definition: >-
  The UPF0332 family includes proteins that are putative toxin components of type VII toxin-antitoxin (TA) systems. These systems typically consist of a stable toxin and a labile antitoxin that can neutralise the toxin's effect. The antitoxins degrade under stress conditions, freeing the toxins to inhibit cell growth or kill the cell. This regulatory mechanism helps the bacteria to survive under adverse conditions. The exact functions of UPF0332 family members are not well characterised, and their roles may vary among different organisms. Members in this family contain a HEPN domain InterPro:IPR007842.
