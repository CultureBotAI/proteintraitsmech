identifier: PANTHER:PTHR47449
label: "GLYCEROPHOSPHODIESTER PHOSPHODIESTERASE GDPD4"
definition: >-
  This entry represents a group plant glycerophosphodiester phosphodiesterases (GDPDs), including AtGDPD4 from Arabidopsis. AtGDPD4 contains a membrane-spanning region at the N-terminal before the GDPD domain and is predicted to target mitochondria. GDPD hydrolyses glycerophosphodiesters into sn-glycerol-3-phosphate (G-3-P) and the corresponding alcohols, plays an important role in various physiological processes in both prokaryotes and eukaryotes.
definition_source: "InterPro:IPR044236 abstract (PANTHER PTHR47449 is a member signature)"
