identifier: PANTHER:PTHR37006
label: "RETROVIRAL-LIKE ASPARTIC PROTEASE 1"
definition: >-
  Retroviral-like aspartic protease 1, also known as aspartic proteinase-like protein (Taps) or Skin ASpartic Protease (SASPase), has been shown to be involved in differentiation and homeostasis of multilayered epithelia and prevention of fine wrinkle formation.
