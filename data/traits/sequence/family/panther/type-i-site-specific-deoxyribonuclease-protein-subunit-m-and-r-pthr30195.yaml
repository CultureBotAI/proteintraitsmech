  - kind: GENERAL
    text: >-
      This family of proteins includes the restriction (R) subunits of type I restriction enzymes. These enzymes are complex molecular machines that recognize specific DNA sequences, which are often asymmetric and contain non-methylated sites. Upon DNA binding, they translocate along the DNA in an ATP-dependent manner until a steric collision triggers cleavage at a distant, random site from the recognition sequence. The R subunit is essential for both the endonuclease and ATPase activities of the enzyme but is not involved in the modification of DNA. These proteins play a crucial role in bacterial defense mechanisms by cleaving foreign DNA, such as that from invading phages. The family members are characterized by their ability to induce conformational changes within the enzyme complex, regulating the balance between DNA methylation, cleavage, and translocation.
    source: "InterPro:IPR051268 abstract (LLM-generated, not curator-reviewed)"
