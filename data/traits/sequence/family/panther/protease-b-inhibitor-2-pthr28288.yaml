  - kind: GENERAL
    text: >-
      This family of proteins includes cytosolic inhibitors of vacuolar proteinase B, which are likely involved in regulating protease B activity during limited proteolysis. Members of this family are also components of the LMA1 complex, which plays a role in facilitating vesicle fusion processes, including homotypic vacuole fusion and the fusion of ER-derived COPII vesicles with the Golgi apparatus.
