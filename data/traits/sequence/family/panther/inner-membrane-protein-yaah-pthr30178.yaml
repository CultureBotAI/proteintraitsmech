identifier: PANTHER:PTHR30178
label: "INNER MEMBRANE PROTEIN YAAH"
definition: >-
  This family includes succinate-acetate/proton symporter SatP from E. coli (also known as YaaH). It mediates the uptake of acetate and succinate and this transport is energetically dependent on the proton motive force. Structural studies of SatP revealed that it forms an hexameric channel structure. It has six transmembrane helices (TM) surrounding the central channel pore in each protomer and three conserved hydrophobic residues, FLY, located in the middle of the TM for pore constriction. There are three conserved polar residues in the TM1 that faces to the periplasmic side, and are closely associated with acetate translocation activity. This entry also includes MM_0903 from Methanosarcina mazei ( ), which is involved in aceticlastic methanogenesis and other uncharacterised proteins from archaea and eukaryotes.
