identifier: PANTHER:PTHR15302
label: "E3 UBIQUITIN-PROTEIN LIGASE RNF103"
definition: >-
  RNF103, also known as Kf-1, is an ER ubiquitin ligase involved in the ERAD pathway. Mice lacking the kf-1 gene have been shown to exhibit increased anxiety.
