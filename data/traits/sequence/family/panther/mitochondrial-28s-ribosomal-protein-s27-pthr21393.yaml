identifier: PANTHER:PTHR21393
label: "MITOCHONDRIAL 28S RIBOSOMAL PROTEIN S27"
definition: >-
  This entry represents the small ribosomal subunit protein mS27 from animals, previously known as MRPS27. This protein binds to the mitochondrial 12S rRNA (12S mt-rRNA) and tRNA(Glu). mS27 is involved also in positive regulation of cell proliferation and tumour cell growth.It is a pentatricopeptide repeat domain (PPR) protein required for mitochondrial protein synthesis.
