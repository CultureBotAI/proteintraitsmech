identifier: PANTHER:PTHR30408
label: "TYPE-1 RESTRICTION ENZYME ECOKI SPECIFICITY PROTEIN"
definition: >-
  This family of proteins includes specificity subunits of type I restriction-modification systems. They are responsible for recognizing specific DNA sequences and directing the restriction-modification complex to these sites. The proteins contain DNA recognition domains that determine the sequence specificity for methylation or cleavage. In conjunction with the modification (M) and restriction (R) subunits, they form complexes that can act as methyltransferases, modifying specific adenine residues within their recognition sequences to protect the host genome from cleavage. These complexes can also function as endonucleases, cleaving DNA at sites distant from the recognition sequence in an ATP-dependent manner, particularly when the recognition site is unmodified. The methylation state of the target sequence dictates whether the DNA is cut or modified, with hemimethylated sites being a signal for maintenance methylation.
