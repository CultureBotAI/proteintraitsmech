identifier: PANTHER:PTHR41795
label: "EXOPOLYSACCHARIDE SYNTHESIS PROTEIN"
definition: >-
  Among the bacterial genes required for nodule invasion are the exo genes. These genes are involved in the production of an extracellular polysaccharide. Mutations in the exoD result in altered exopolysaccharide production and defects in nodule invasion.
