identifier: PANTHER:PTHR23538
label: "44.5 KD BACTERIOCHLOROPHYLL SYNTHASE SUBUNIT"
definition: >-
  The PucC protein, also known as bacteriochlorophyll delivery (BCD), is required for high-level transcription of the PUC operon, essential for formation of the light harvesting complex B800-850 (LH2) of Rhodobacter capsulatus as well as deliver bacteriochlorophyll a to nascent LH2 complexes.
