definitions:
  - kind: GENERAL
    text: >-
      BASIC HELIX-LOOP-HELIX PROTEIN NEUROGENIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19290. PANTHER protein class: DNA-binding transcription factor, basic helix-loop-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, organic cyclic compound binding. Members participate in positive regulation of transcription by RNA polymerase II, axon development, neuron development. Members localise to nucleus, intracellular anatomical structure.
