identifier: PANTHER:PTHR46897
label: "VESICLE-ASSOCIATED MEMBRANE PROTEIN 4"
definition: >-
  Vesicle-associated membrane protein 4 (VAMP4) is required to maintain the ribbon structure of the Golgi apparatus. It is essential for activity-dependent bulk endocytosis (ADBE).
