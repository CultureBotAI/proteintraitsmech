identifier: PANTHER:PTHR21506
label: "COMPONENT OF OLIGOMERIC GOLGI COMPLEX 6"
definition: >-
  COG6 is a component of the peripheral membrane COG (conserved oligomeric Golgi) complex that is involved in intra-Golgi protein trafficking. COG is located at the cis-Golgi, regulates tethering of retrograde intra-Golgi vesicles and is required for normal Golgi morphology and localisation. COG subunits belong to the CATCHR (complexes associated with tethering containing helical rods) family which includes subunits of the GARP/EARP, exocyst, and Dsl1 complexes, all evolutionary related and have a conserved structural fold consisting of α-helical bundles in tandem at the C-terminal and a coiled-coil region at the N-terminal.
definition_source: "InterPro:IPR010490 abstract (PANTHER PTHR21506 is a member signature)"
