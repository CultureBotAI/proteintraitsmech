identifier: PANTHER:PTHR36506
label: "PREFLAGELLIN PEPTIDASE"
definition: >-
  This family of proteins includes enzymes known as preflagellin peptidases, which are responsible for the cleavage of the N-terminal leader peptide from preflagellins. This processing step is crucial for the proper assembly of flagellins into the flagellum structure, a whip-like appendage that enables motility in archaeal cells. Members of this family are characterized by their belonging to the peptidase A24 family, specifically the archaeal preflagellin peptidase subfamily, indicating a conserved mechanism of action across different archaeal species.
