identifier: PANTHER:PTHR13407
label: "RNF121 PROTEIN"
definition: >-
  The family includes RNF121, RNF175 and similar proteins. RNF121 is an E3-ubiquitin ligase present in the endoplasmic reticulum (ER) and cis-Golgi compartments. It is a novel regulator of apoptosis. It also facilitates the degradation and membrane localisation of voltage-gated sodium (NaV) channels, and thus plays a role in the quality control of NaV channels during their synthesis and subsequent transport to the membrane. Moreover, RNF121 acts as a broad regulator of nuclear factor kappaB (NF-kappaB) signalling since its silencing also dampens NF-kappaB activation following stimulation of toll-like receptors (TLRs), nod-like receptors (NLRs), RIG-I-like Receptors (RLRs) or after DNA damages. RNF121 contains five conserved transmembrane (TM) domains and a C3H2C2-type RING-H2 finger. RNF175 is an uncharacterised RING finger protein that shows high sequence similarity with RNF121.
