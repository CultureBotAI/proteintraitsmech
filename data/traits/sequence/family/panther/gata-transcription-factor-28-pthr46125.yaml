identifier: PANTHER:PTHR46125
label: "GATA TRANSCRIPTION FACTOR 28"
definition: >-
  This entry represents a group of plant GATA transcription factors, including GATA24/25/28 from Arabidopsis. They contain the GATA-type zinc-finger domain with a longer spacer between its two sets of conserved cysteine residues (C-X2-C-X20-C-X2-C). This family is known as the ZIM or the TIFY family. Proteins in this family are plant-specific transcription factors that play crucial roles in cross talk between Jasmonic Acid and other phytohormones like gibberellins, salicylic acid, abscisic acid, auxin, and ethylene signaling pathways.
