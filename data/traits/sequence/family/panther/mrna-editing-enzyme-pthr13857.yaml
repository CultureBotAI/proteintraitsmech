  - kind: GENERAL
    text: >-
      The APOBEC family of cytidine deaminases plays a crucial role in the immune response against viruses and in genome maintenance. Members of this family can induce the conversion of cytosine to uracil in single-stranded DNA, leading to hypermutations that can inhibit retrovirus replication and retrotransposon mobility. Some family members are also involved in RNA editing, such as the conversion of cytidine to uridine in mRNA, and may participate in DNA demethylation, contributing to the epigenetic regulation of gene expression. The family includes enzymes with antiviral activity against HIV, SIV, HBV, HTLV-1, and other viruses. They are regulated by factors such as the HIV-1 virion infectivity factor (Vif), which can neutralize their activity. The family is characterized by the presence of one or two CMP/dCMP deaminase domains that confer substrate specificity and mediate various functions, including RNA binding, oligomerization, and virion incorporation.
    source: "InterPro:IPR050610 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
