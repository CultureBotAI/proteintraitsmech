  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with diverse catalytic activities, primarily involved in the metabolism of phospholipids. Members of this family are capable of catalyzing the hydrolysis of phospholipids, releasing phosphatidic acid and an alcohol. Additionally, they can perform a transphosphatidylation reaction in the presence of primary alcohols and high concentrations. Some members also exhibit phosphatase activity towards specific phosphate esters. The proteins are regulated by various mechanisms, including calcium binding and proteolytic cleavage, which can modulate their enzymatic activity. The family is characterized by a catalytic domain typically located in the N-terminal region, while the C-terminal region is associated with regulatory functions.
