identifier: PANTHER:PTHR28180
label: "CONSERVED MITOCHONDRIAL PROTEIN-RELATED"
definition: >-
  This family of proteins is likely involved in the biogenesis and maintenance of peroxisomes, cellular organelles that play a crucial role in the metabolism of specific fatty acids and the detoxification of reactive oxygen species. Members of this family may also participate in amino acid metabolism. They are characterized by the presence of a peroxisomal targeting signal 1 (PTS1) at the C-terminus, which is essential for the transport of matrix proteins into the peroxisome. The PTS1 motif typically consists of a tripeptide sequence, although variations exist, suggesting a broader consensus sequence for this targeting signal.
