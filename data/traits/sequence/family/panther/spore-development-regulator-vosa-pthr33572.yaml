identifier: PANTHER:PTHR33572
label: "SPORE DEVELOPMENT REGULATOR VOSA"
definition: >-
  The velvet factor is conserved in many fungal species and is found to have gained different roles depending on the organism's need, expanding the conserved role in developmental programmes. The velvet factor orthologues can be adapted to the fungal-specific life cycle and may be involved in diverse functions such as sclerotia formation and toxin production, as in Aspergillus parasiticus, nutrition-dependent sporulation, as in A. fumigatus, or the microconidia-to-macroconidia ratio and cell wall formation, as in the heterothallic fungus Gibberella moniliformis (Fusarium verticillioides). VEL1, VEL2 and VEL3 control the formation of microsclerotia in senescent plants, VEL2 acting as an additional positive factor and VEL3 as negative factor in the presence of light. VEL1 and VEL2 specifically control secondary metabolite formation including the DHN-melanin precursor scytalone or saccharonol A, a probable precursor of 6-methoxymellein.
