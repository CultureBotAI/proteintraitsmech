identifier: PANTHER:PTHR46757
label: "SORTING NEXIN-RELATED"
definition: >-
  This entry represents a group of plant sorting nexins and related proteins, including AtSNX2A/B from Arabidopsis. The AtSNX2B PX domain has been shown to bind to phosphatidylinositol 3-phosphate. AtSNX2B may be involved in vesicular trafficking from endosomes to the vacuole.
