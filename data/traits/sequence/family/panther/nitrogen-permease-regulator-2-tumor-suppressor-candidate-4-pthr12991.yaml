identifier: PANTHER:PTHR12991
label: "NITROGEN PERMEASE REGULATOR 2/TUMOR SUPPRESSOR CANDIDATE 4"
definition: >-
  This family of regulators are involved in post-translational control of nitrogen permease. In mammals, members may act as a tumour suppressor that suppresses cell growth and enhances sensitivity to various anticancer drugs.
