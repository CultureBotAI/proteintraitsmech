identifier: PANTHER:PTHR16243
label: "BTG3-ASSOCIATED NUCLEAR PROTEIN BANP"
definition: >-
  BANP, also known as SMAR1, is a scaffold/matrix attachment region-binding protein that regulates gene expression by binding to various promoter elements. It has been shown to recruit a repressor complex to the cyclin D1 promoter that results in deacetylation of chromatin at that locus. It has also been shown to regulate alternative splicing via HDAC6-mediated deacetylation of Sam68.
