identifier: PANTHER:PTHR45923
label: "PROTEIN SEY1"
definition: >-
  This family consists of plant root hair defective 3 (RHD3) protein and its homologues from other eukaryotes. RHD3 is a conserved protein with GTP-binding motifs that is implicated in the control of vesicle trafficking between the endoplasmic reticulum and the Golgi compartments and is also involved in homotypic ER membrane fusion, being classified as a dynamin-like GTPase together with its homologues Sey1 and atlastin. It is required for appropriate root and root hair cells enlargement. It may play a role in cell wall biosynthesis and actin organisation. Its homologue from Saccharomyces cerevisiae, Sey1, mediates homotypic ER fusion.
