identifier: PANTHER:PTHR34174
label: "HYDROLETHALUS SYNDROME PROTEIN 1"
definition: >-
  This family of proteins is involved in the process of ciliogenesis, which is the formation of cilia on the surface of cells. Cilia are small, hair-like structures that protrude from the cell body and are involved in movement and sensory functions. Members of this family are essential for the proper anchoring of centrioles, which are structures that serve as the main organizing centers for microtubules and are crucial for the formation of cilia. The proteins in this family play a significant role in ensuring that centrioles are correctly positioned at the cell's apical surface, thereby facilitating the formation of functional cilia.
