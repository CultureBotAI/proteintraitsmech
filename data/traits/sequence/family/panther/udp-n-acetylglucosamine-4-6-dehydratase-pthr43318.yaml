  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis and modification of polysaccharides and related molecules. Members of this family exhibit a range of enzymatic activities, including the epimerization of UDP-galactose to UDP-glucose, which is a key step in the production of various polysaccharides. Some proteins within this family are also involved in the biosynthesis of pseudaminic acid, a sialic-acid-like sugar, by possessing both C6 dehydratase and C5 epimerase activities. This process is crucial for the modification of flagellin. Additionally, certain members are implicated in the formation of biofilms and the biosynthesis of capsular polysaccharides, which are important for bacterial virulence and surface structure. The family also includes proteins with uncharacterized functions that may be related to polysaccharide synthesis or modification.
    source: "InterPro:IPR051203 abstract (LLM-generated, not curator-reviewed)"
