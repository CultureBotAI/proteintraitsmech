definitions:
  - kind: GENERAL
    text: >-
      TYROSINE-PROTEIN PHOSPHATASE NON-RECEPTOR TYPE 61F — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46047. PANTHER protein class: protein phosphatase, protein modifying enzyme. Members are annotated with the molecular function phosphatase activity, protein tyrosine phosphatase activity, protein kinase binding. and participate in peptidyl-tyrosine dephosphorylation, negative regulation of MAPK cascade, macromolecule metabolic process. and localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes non-receptor type tyrosine-specific phosphatases involved in a variety of cellular processes. They dephosphorylate receptor and non-receptor protein tyrosine kinases, regulating signaling pathways related to hematopoiesis, inflammation, cell proliferation and differentiation, glucose homeostasis, and immune system development. They play roles in T-cell receptor signaling, cytokine-mediated signaling, and growth factor receptor signaling, including negative regulation of insulin, EGF, and PDGF receptors. Some members are involved in the endoplasmic reticulum unfolded protein response and cell reorganization.
    source: "InterPro:IPR051985 abstract (LLM-generated, not curator-reviewed)"
