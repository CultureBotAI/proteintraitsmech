identifier: PANTHER:PTHR13958
label: "CENTROSOME-ASSOCIATED PROTEIN 350"
definition: >-
  Centrosome-associated protein 350 (CEP350 or CAP350) plays an essential role in centriole growth by stabilising a procentriolar seed composed of, at least, SASS6 and CENPJ. It is required for anchoring microtubules to the centrosomes and for the integrity of the microtubule network. It also stabilises Golgi-associated microtubules and maintains a continuous pericentrosomal Golgi ribbon. CEP350 possesses a CAP-Gly domain which is targeted to the centrosome or the Golgi-like network and binds microtubules through an N-terminal basic region. This family also includes the coiled-coil domain-containing protein 187 (CC187), a centrosomal protein whose function is still unknown.
definition_source: "InterPro:IPR028750 abstract (PANTHER PTHR13958 is a member signature)"
