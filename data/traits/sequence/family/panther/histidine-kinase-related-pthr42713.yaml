      HISTIDINE KINASE-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42713.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family comprises transcriptional regulatory proteins that are part of two-component regulatory systems. These systems play a crucial role in the regulation of genes associated with hexose phosphate transport in response to extracellular phosphate levels. Family members such as HptR activate the expression of uhpT, enabling glucose-6-phosphate utilization by binding to its promoter. Additionally, they can counteract the transcription of certain genes regulated by CcpA, affecting antibiotic susceptibility. Some members are uncharacterized but are presumed to be part of similar two-component systems based on their genetic context.
    source: "InterPro:IPR051552 abstract (LLM-generated, not curator-reviewed)"
