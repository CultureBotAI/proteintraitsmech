identifier: PANTHER:PTHR31899
label: "BETA-CAROTENE 3-HYDROXYLASE 1, CHLOROPLASTIC"
definition: >-
  This family includes beta-carotene hydroxylases ( ) and related proteins from bacteria and plants. Beta-carotene hydroxylases are nonheme diiron monooxygenases involved in the biosynthesis of xanthophylls that specifically hydroxylates the β-ring of beta-carotene, using ferredoxin as an electron donor. Plant members have also a low activity toward the β- and ε-rings of alpha-carotene and no activity towards acyclic carotenoids such as lycopene and neurosporene.
