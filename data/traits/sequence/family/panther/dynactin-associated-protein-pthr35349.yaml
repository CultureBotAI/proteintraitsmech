identifier: PANTHER:PTHR35349
label: "DYNACTIN-ASSOCIATED PROTEIN"
definition: >-
  This family of proteins is involved in the regulation of cellular proliferation. Members of this family are known to enhance the activation of the AKT1 signaling pathway, which is crucial for various cellular processes including metabolism, growth, and survival. They are also implicated in facilitating the phosphorylation of AKT1 at a specific serine residue, which is a key post-translational modification that activates AKT1.
