identifier: PANTHER:PTHR11723
label: "DNA-BINDING PROTEIN INHIBITOR"
definition: >-
  Transcription factors containing basic-helix-loop-helix (bHLH) domains interact to regulate differentiation in a number of cellular systems, including myogenesis, neurogenesis and haematopoiesis. The DNA-binding activity of these proteins is mediated via the basic region of the bHLH domain, and is dependent upon formation of homo- and/or heterodimers by these transcription factors. The Id family of proteins (whose members include Id1, Id2, Id3 and the Drosophila homologue emc) contain a HLH-dimerisation domain but lack the DNA-binding basic region. Formation of heterodimers between these proteins and bHLH domain-containing transcription factors abolishes the DNA-binding ability of the latter, thus inhibiting their activity. Id proteins can inhibit the differentiation of progenitors of different cell types, promoting cell-cycle progression, delaying cellular senescence, and facilitating cell migration. These properties enable them to play important roles in stem cell maintenance, vasculogenesis, tumorigenesis and metastasis, the development of the immune system, and energy metabolism.
