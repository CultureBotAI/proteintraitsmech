identifier: PANTHER:PTHR21771
label: "MITOCHONDRIA-EATING PROTEIN-RELATED"
definition: >-
  Mitochondria-eating protein (MIEAP, also known as spermatogenesis-associated protein 18), a p53-inducible protein, is a key regulator of mitochondrial quality that mediates the repair or degradation of unhealthy mitochondria in response to mitochondrial damage. It induces intra-mitochondrial lysosome-like organella that eliminate oxidised mitochondrial proteins without destroying the mitochondrial structure, leading to improvement in mitochondrial function. It is also involved in degradation of damaged mitochondria by promoting the formation of vacuole-like structures (named MIV), which engulf and degrade the mitochondria by accumulating lysosomes.
definition_source: "InterPro:IPR026169 abstract (PANTHER PTHR21771 is a member signature)"
