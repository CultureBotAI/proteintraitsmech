identifier: PANTHER:PTHR11243
label: "GROWTH FACTOR RECEPTOR-BOUND PROTEIN"
definition: >-
  Proteins in this entry consist of a Ras-associated (RA) domain, a PH domain, a family-specific BPS region, and a C-terminal SH2 domain. Grb7, Grb10 and Grb14 are paralogues that are also present in this entry. These adapter proteins bind a variety of receptor tyrosine kinases, including the insulin and insulin-like growth factor-1 (IGF1) receptors. Grb10 and Grb14 are important tissue-specific negative regulators of insulin and IGF1 signaling based and may contribute to type 2 (non-insulin-dependent) diabetes in humans. RA-PH function as a single structural unit and is dimerized via a helical extension of the PH domain. The PH domain here are proposed to bind phosphoinositides non-cannonically and are unlikely to bind an activated GTPase.
definition_source: "InterPro:IPR039664 abstract (PANTHER PTHR11243 is a member signature)"
