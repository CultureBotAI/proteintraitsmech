identifier: PANTHER:PTHR42828
label: "DHBP SYNTHASE RIBB-LIKE ALPHA/BETA DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents Threonylcarbamoyl-AMP synthase YciO and related proteins. It catalyes the conversion of L-threonine, HCO3-/CO2 and ATP to give threonylcarbamoyl-AMP (TC-AMP) as the acyladenylate intermediate, with the release of diphosphate. YciO shows ATP hydrolysis activity in vitro, producing AMP.
