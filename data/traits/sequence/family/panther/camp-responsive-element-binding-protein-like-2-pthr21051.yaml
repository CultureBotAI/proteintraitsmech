identifier: PANTHER:PTHR21051
label: "CAMP-RESPONSIVE ELEMENT-BINDING PROTEIN-LIKE 2"
definition: >-
  The cAMP-responsive element-binding protein-like 2 (CREBL2) is an uncharacterised protein containing a basic-leucine zipper (bZip) domain. Because of the location of the gene in a region frequently deleted in cancers, it has been suggested that CREBL2 is a tumour repressor. This entry also includes REPTOR-BP from fruit flies. It is a transcriptional regulator that acts in the TORC1 signaling pathway to regulate energy homeostasis and promote survival during nutrient deprivation.
