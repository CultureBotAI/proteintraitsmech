identifier: PANTHER:PTHR31954
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 157"
definition: >-
  Cilia- and flagella-associated protein 157 (CFAP157) has been characterised as a component on the flagellum from the green alga Chlamydomonas reinhardtii by mass spectroscopy. Related proteins are found in animals. In mouse, CFAP157 is required for sperm motility and flagellum morphogenesis.
