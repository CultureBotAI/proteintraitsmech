  - kind: GENERAL
    text: >-
      This family of proteins includes multifunctional nucleolar components involved in the regulation of ribosomal gene transcription. They play a key role in both the activation and silencing of rDNA transcription. These proteins are responsible for terminating ribosomal gene transcription and mediating replication fork arrest. Additionally, they regulate RNA polymerase I transcription on chromatin. A notable feature is their dual role in rDNA regulation, which involves interactions with other proteins to modulate their DNA-binding activity and ensure proper transcriptional control within the nucleolus.
