identifier: PANTHER:PTHR13722
label: "ATP SYNTHASE PROTEIN 8"
definition: >-
  ATP synthase (F1F0 ATPase), also called complex V, is an enzyme that uses a stream of protons passing through the inner membrane of the mitochondria to synthesize ATP. It consists of a part located on the mitochondrial membrane (F0) and containing a proton channel, and a catalytic component (F1) connected to F0 and locating on the side of the mitochondrial matrix. The F0 component contains 3-9 protein subunits (9 in humans) including subunits 6 and 8, encoded by the mtDNA genes ATP6 and ATP8, respectively. This entry represents ATP8 from mammals.
