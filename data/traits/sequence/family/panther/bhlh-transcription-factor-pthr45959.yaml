  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors characterized by the basic helix-loop-helix (bHLH) domain, which is involved in DNA binding and dimerization. Members of this family are known to regulate the expression of various genes and are involved in multiple biological processes. One member is specifically noted to act as a transcription activator, regulating the expression of genes related to the formation of endoplasmic reticulum bodies and symbiotic interactions with endophytic fungi. These proteins play a role in plant development and response to environmental stimuli.
