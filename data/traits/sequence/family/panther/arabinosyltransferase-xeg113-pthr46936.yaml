definitions:
  - kind: GENERAL
    text: >-
      ARABINOSYLTRANSFERASE XEG113 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46936. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function transferase activity, catalytic activity, pentosyltransferase activity. and participate in carbohydrate derivative biosynthetic process, macromolecule glycosylation, carbohydrate biosynthetic process. and localise to Golgi apparatus, cytoplasm, membrane-bounded organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the modification of cell wall components through the process of arabinosylation. Members of this family are responsible for adding arabinose, a sugar molecule, to extensin proteins, which are structural glycoproteins present in plant cell walls. The arabinosylation of extensins is crucial for various plant developmental processes, including cell elongation, root hair cell development, lateral root development, and the growth of root hair tips. The activity of these enzymes is characterized by a conserved DXD motif, which is essential for their catalytic function.
    source: "InterPro:IPR053250 abstract (LLM-generated, not curator-reviewed)"
