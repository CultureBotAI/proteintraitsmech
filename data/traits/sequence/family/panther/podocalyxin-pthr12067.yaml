identifier: PANTHER:PTHR12067
label: PODOCALYXIN
definition: >-
  Podocalyxin is involved in the regulation of both adhesion and cell morphology and cancer progression. It functions as an anti-adhesive molecule that maintains an open filtration pathway between neighbouring foot processes in the podocyte by charge repulsion.
