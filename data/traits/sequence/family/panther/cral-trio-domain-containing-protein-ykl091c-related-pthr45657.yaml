identifier: PANTHER:PTHR45657
label: "CRAL-TRIO DOMAIN-CONTAINING PROTEIN YKL091C-RELATED"
definition: >-
  This family of proteins is involved in the intracellular transport of secretory proteins, particularly from the Golgi complex. Members of this family have the ability to catalyze the transfer of phosphatidylinositol and phosphatidylcholine between different membranes in vitro. Some proteins within this family also play a role in the synthesis and organization of phosphatidylinositol 4,5-bisphosphate in cellular membranes, which is crucial for processes such as root hair tip elongation and polarized membrane trafficking in plants. Additionally, certain members are essential for viability and secretion, and are involved in the regulation of specific trans-Golgi export pathways, including the trafficking and localization of lipid raft proteins to the plasma membrane.
