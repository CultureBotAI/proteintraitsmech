identifier: PANTHER:PTHR14678
label: "PROLINE-RICH PROTEIN 35-RELATED"
definition: >-
  ZNF750 is a transcription factor that controls epithelial homeostasis by inhibiting progenitor genes while inducing differentiation genes. ZNF750 and related proteins contain a zinc finger domain. Human proline-rich protein 35 is related, but its function is not clear.
