identifier: PANTHER:PTHR38050
label: "Feruloyl esterase B/C/D"
definition: >-
  Feruloyl esterases (Fae) catalyse the hydrolysis of the 4-hydroxy-3-methoxycinnamoyl (feruloyl) group from an esterified sugar, which is usually arabinose in 'natural' substrates. This entry includes FaeB, FaeC and FaeD. FaeC from Aspergillus oryzae and Emericella nidulans have been shown to display hydrolytic activity towards arabinoxylan and methyl ferulate, among other substrates. FaeD from Neurospora crassa also exhibits feruloyl esterase activity.
definition_source: "InterPro:IPR043595 abstract (PANTHER PTHR38050 is a member signature)"
