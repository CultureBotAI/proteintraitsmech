identifier: PANTHER:PTHR17384
label: "P-SELECTIN GLYCOPROTEIN LIGAND-1"
definition: >-
  P-selectin glycoprotein ligand 1 (PSGL-1) is a SLe(x)-type glycan, which through high affinity, calcium-dependent interactions with E-, P- and L-selectins, mediates rapid rolling of leukocytes over vascular surfaces during the initial steps in inflammation. PSGL-1 is critical for the initial leukocyte capture.
