identifier: PANTHER:PTHR30182
label: "L-SERINE DEHYDRATASE"
definition: >-
  The iron-sulfur dependent L-serine dehydratase family is characterised by enzymes that catalyse the deamination of L-serine to pyruvate and ammonia, a reaction that plays a crucial role in the metabolism of serine and in the overall carbon and nitrogen balance within the cell. Some members of the family are also known to deaminate threonine, like L-serine dehydratase 1/2 from Escherichia coli, especially under conditions of high substrate concentration. Proteins in this group are mainly found in bacteria.
