identifier: PANTHER:PTHR33304
label: "PHD finger-containing protein 1-3/5-6"
definition: >-
  This family includes PHD-containing proteins 1-3/5/6 from plants (PHD1-3/5-6), such as ASI1-immunoprecipitated protein 2 (AIPP2, also known as PHD3), protein PARALOG OF AIPP2 (PAIPP2, also known as PHD2). Members of this entry together with AIPP3/BDT1, cooperate to form a BAH-PHD bivalent histone reader complex able to read histone H3 lysine 27 trimethylation (H3K27me3) and low-methylated H3K4 histone marks in order to regulate transcription, especially to prevent early flowering. It promotes AIPP3/BDT1 binding to H3K27me3. Plants missing all PHD finger-containing proteins (e.g. PHD1, PAIPP2/PHD2, AIPP2/PHD3, PHD4, PHD5 and PHD6) exhibit an increased expression of flowering genes leading to an early flowering phenotype under long-day conditions as well as growth retardation.
definition_source: "InterPro:IPR049914 abstract (PANTHER PTHR33304 is a member signature)"
