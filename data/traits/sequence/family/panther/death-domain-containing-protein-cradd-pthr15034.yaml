identifier: PANTHER:PTHR15034
label: "DEATH DOMAIN-CONTAINING PROTEIN CRADD"
definition: >-
  CRADD (Caspase and RIP adaptor, also known as RAIDD) is an adaptor protein that together with the p53-inducible protein PIDD and caspase-2, forms the PIDDosome complex, which is required for caspase-2 activation and plays a role in mediating stress-induced apoptosis. It contains an N-terminal CARD, which interacts with the caspase-2 CARD, and a C-terminal Death domain (DD), which interacts with the DD of PIDD.
