identifier: PANTHER:PTHR38785
label: "HOMOLOG OF VIRK"
definition: >-
  Family member Shigella flexneri VirK ( UniProtKB:Q99QA5 ) is a virulence protein required for the expression, or correct membrane localisation of IcsA (VirG) on the bacterial cell surface. This family also includes Pasteurella haemolytica lapB ( UniProtKB:P32181 ), which is thought to be membrane-associated.
