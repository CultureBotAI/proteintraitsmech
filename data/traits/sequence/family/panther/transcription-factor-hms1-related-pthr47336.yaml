  - kind: GENERAL
    text: >-
      The protein family encompasses transcription factors that regulate various biological processes, including carbohydrate metabolism, sterol synthesis, filamentous growth, and virulence in response to environmental cues such as oxygen levels and nutrient availability. Members of the family are involved in the activation of gene clusters for biosynthesis of compounds like gramillins and glycolytic enzymes, and in the regulation of processes like biofilm formation, hyphal growth, and cellular differentiation. They bind to specific DNA motifs to modulate gene expression, contributing to the organism's adaptability and pathogenicity.
