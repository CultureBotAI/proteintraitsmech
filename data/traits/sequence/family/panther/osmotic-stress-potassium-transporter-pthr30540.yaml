identifier: PANTHER:PTHR30540
label: "OSMOTIC STRESS POTASSIUM TRANSPORTER"
definition: >-
  This is a family of K+ potassium transporters that are conserved across phyla, having both bacterial (KUP), yeast (HAK), and plant (AtKT/POT) sequences as members. POT1 from Arabidopsis thaliana plays an essential role in telomere maintenance.
