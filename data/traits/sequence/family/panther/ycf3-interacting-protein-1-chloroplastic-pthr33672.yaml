identifier: PANTHER:PTHR33672
label: "YCF3-INTERACTING PROTEIN 1, CHLOROPLASTIC"
definition: >-
  Chloroplast protein CEST, also known as Ycf3-interacting protein 1 (Y3IP1), cooperates with Ycf3 in the assembly of stable photosystem I units in the thylakoid membrane. It also seems to induce tolerance to multiple environmental stresses and reduce photooxidative damage.
