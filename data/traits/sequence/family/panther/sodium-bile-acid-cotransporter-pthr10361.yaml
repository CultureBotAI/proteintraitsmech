identifier: PANTHER:PTHR10361
label: "SODIUM-BILE ACID COTRANSPORTER"
definition: >-
  Functionally characterised members of the bile Acid:Na+ Symporter (BASS) family catalyse Na+:bile acid symport. These systems have been identified in intestinal, liver and kidney tissues of animals. These symporters exhibit broad specificity, taking up a variety of non bile organic compounds as well as taurocholate and other bile salts. Functionally uncharacterised homologues are found in plants and bacteria.
