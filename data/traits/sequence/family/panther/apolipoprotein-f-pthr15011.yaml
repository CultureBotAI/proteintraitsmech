identifier: PANTHER:PTHR15011
label: "APOLIPOPROTEIN F"
definition: >-
  Human apolipoprotein F (APOF) is a minor apolipoprotein that associates with LDL. It inhibits cholesteryl ester transfer protein (CETP) activity and appears to be an important regulator of cholesterol transport. It also associates to a lesser degree with VLDL, Apo-AI and Apo-AII.
