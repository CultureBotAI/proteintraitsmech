identifier: PANTHER:PTHR22854
label: "TRYPTOPHAN BIOSYNTHESIS PROTEIN"
definition: >-
  Indole-3-glycerol phosphate synthase (EC:4.1.1.48) (IGPS) catalyses the fourth step in the biosynthesis of tryptophan, the ring closure of 1-(2-carboxy-phenylamino)-1-deoxyribulose into indol-3-glycerol-phosphate. In some bacteria, IGPS is a single chain enzyme. In others, such as Escherichia coli, it is the N-terminal domain of a bifunctional enzyme that also catalyses N-(5'-phosphoribosyl)anthranilate isomerase (EC:5.3.1.24) (PRAI) activity), the third step of tryptophan biosynthesis.
