identifier: PANTHER:PTHR34117
label: "STYLE CELL-CYCLE INHIBITOR 1"
definition: >-
  This family includes the style cell-cycle inhibitor 1 (SCI-1) from Arabidopsis thaliana and related proteins from other plants and fungi. SCI1 proteins are small nuclear regulators involved in cell cycle control and auxin signalling pathways. In plants, these proteins regulate cell proliferation and differentiation during flower development, particularly in stigmas and styles. SCI1 proteins are tissue-specific inhibitors of cyclin-dependent kinases and represent the first members of the tissue-specific inhibitors of CDK (TIC) class.
definition_source: "InterPro:IPR044688 abstract (PANTHER PTHR34117 is a member signature)"
