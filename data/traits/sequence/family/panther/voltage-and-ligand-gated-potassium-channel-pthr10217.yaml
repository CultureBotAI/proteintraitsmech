identifier: PANTHER:PTHR10217
label: "VOLTAGE AND LIGAND GATED POTASSIUM CHANNEL"
definition: >-
  The KCNH potassium channel family consists of voltage-gated potassium channels that play a critical role in regulating the electrical excitability of cells. Members of this entry are mainly found in animals. These channels are characterized by their pore-forming alpha subunits, which mediate various potassium currents. The S4 segment, often serving as the voltage-sensor, contains positively charged amino acids crucial for function. Members of the family are involved in modulating channel properties through mechanisms such as cAMP and subunit assembly. Some are involved in specific physiological processes like heart rate regulation (IKr current) and cell proliferation and differentiation. The activity of these channels can be influenced by factors such as calmodulin binding and intracellular phosphatidylinositol phosphates.
