identifier: PANTHER:PTHR13257
label: "NUCLEOPORIN NUP84-RELATED"
definition: >-
  This entry include a nucleoporin known as NUP88 in animals and NUP82 in fission and budding yeasts. NUP88 is a component of the nuclear pore complex (NPC), which is the only means by which macromolecules enter and exit the nucleus. NUP82 is also a component of the NPC subcomplex (with NUP159 and NSP1) which tethers nucleoporins to the nuclear membrane.
