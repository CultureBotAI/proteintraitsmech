identifier: PANTHER:PTHR30559
label: "FRUCTOSE-BISPHOSPHATE ALDOLASE CLASS 2"
definition: >-
  Members of this family are class II examples of the glycolytic enzyme fructose-bisphosphate aldolase (FBA). They represent one of two deeply split, architecturally distinct clades of the family that includes class II fructose-bisphosphate aldolases, tagatose-bisphosphate aldolases, and related uncharacterised proteins. The type A and type B Class II FBPA's differ in the presence and absence of distinct indels in the sequence that result in differing loop lengths in the structures. This family is well-conserved and includes characterised FBA from Saccharomyces cerevisiae (Baker's yeast), Escherichia coli, and Corynebacterium glutamicum.
