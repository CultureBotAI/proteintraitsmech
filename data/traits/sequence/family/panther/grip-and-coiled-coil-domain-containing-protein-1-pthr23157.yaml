  - kind: GENERAL
    text: >-
      This family of proteins is involved in various aspects of intracellular vesicular transport, particularly associated with the Golgi apparatus and autophagy processes. Members of this family play roles in maintaining the structure of the Golgi, mediating vesicle formation and trafficking between endosomes and the Golgi, and facilitating the autophagy pathway. Some proteins in this family are characterized by the presence of coiled-coil domains and GRIP domains, which may be involved in Golgi targeting and interaction with other Golgi-associated proteins.
