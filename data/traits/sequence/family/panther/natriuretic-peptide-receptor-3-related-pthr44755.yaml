  - kind: GENERAL
    text: >-
      This family of proteins serves as receptors for natriuretic peptide hormones, including atrial natriuretic peptide (ANP), brain natriuretic peptide (BNP), and C-type natriuretic peptide (CNP). They bind these peptides with similar affinities and are implicated in the clearance of these hormones, thereby regulating their local concentrations and physiological effects. These receptors are involved in the modulation of diuresis, blood pressure, and skeletal development. Notably, they lack guanylate cyclase activity, differentiating them from other natriuretic peptide receptors that possess this enzymatic function.
    source: "InterPro:IPR052612 abstract (LLM-generated, not curator-reviewed)"
