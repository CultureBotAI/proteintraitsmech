identifier: PANTHER:PTHR47093
label: "PROTEIN JSN1-RELATED"
definition: >-
  This family of proteins includes RNA-binding proteins that are involved in the post-transcriptional regulation of gene expression. They are known to interact with the 3'-UTR regions of specific mRNAs, influencing their stability and turnover. Members of this family predominantly target mRNAs encoding membrane-associated proteins, playing roles in processes such as transmembrane transport and vesicular trafficking. They are implicated in the negative regulation of gene expression by promoting the deadenylation and decay of target mRNAs.
