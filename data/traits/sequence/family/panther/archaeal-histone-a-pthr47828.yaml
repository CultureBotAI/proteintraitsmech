identifier: PANTHER:PTHR47828
label: "ARCHAEAL HISTONE A"
definition: >-
  This entry includes DNA histones, which are involved in the compaction and organisation of archaeal genomes, including DNA-binding protein HMf-2 from Methanothermus fervidus (HmfB). HmfB binds and compacts DNA (95 to 150 base pairs) to form nucleosome-like structures that contain positive DNA supercoils. Proteins of this family are homologues of human histone H4.
