identifier: PANTHER:PTHR23408
label: "METHYLMALONYL-COA MUTASE"
definition: >-
  This family includes ArgK (also known as YgfD) from E. coli, Methylmalonic aciduria type A protein (MMA) from human and similar proteins, which belong to the G3E family of P-loop GTPases, a family defined by the glutamate residue in the Walker B motif and an intact NKxD, members of which include: UreG, HypB, CobW, and MeaB. These may function as G-protein chaperones that assist AdoCbl cofactor delivery to the methylmalonyl-CoA mutase and reactivation of the enzyme during catalysis ArgK is involved in the transport of positively charged amino acids (lysine, arginine, and ornithine) and has arginine kinase activity. It is found in a small, but phylogenetically diverse array of bacteria and archaea, and in Caenorhabditis and Leishmania among the eukaryotes. Although ArgK was characterised as an ATPase originally, it has been shown to bind and cleave GTP. Therefore, its actual substrate in vivo is GTP rather than ATP. MMA is involved in intracellular vitamin B12 metabolism where it mediates the transport of cobalamin (Cbl) into mitochondria for the final steps of adenosylcobalamin (AdoCbl) synthesis.
definition_source: "InterPro:IPR005129 abstract (PANTHER PTHR23408 is a member signature)"
