  - kind: GENERAL
    text: >-
      The nuclear hormone receptor family in Caenorhabditis elegans consists of proteins that are classified as orphan nuclear receptors. These proteins share a common structural similarity indicative of their membership in the nuclear hormone receptor superfamily. However, their specific biological functions remain largely unknown as they do not have identified endogenous ligands, hence the term 'orphan'. One member, nhr-127, is suggested to play a probable role in lifespan modulation and immunity. The family's characteristic feature is the ability to act as transcription factors, regulating gene expression in response to hormonal signals, although the exact pathways and target genes for these C. elegans receptors are yet to be elucidated.
