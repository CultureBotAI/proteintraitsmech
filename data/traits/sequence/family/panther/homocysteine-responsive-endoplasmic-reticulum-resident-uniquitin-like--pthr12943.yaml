identifier: PANTHER:PTHR12943
label: "HOMOCYSTEINE-RESPONSIVE ENDOPLASMIC RETICULUM-RESIDENT UNIQUITIN-LIKE DOMAIN HERPUD PROTEIN FAMILY MEMBER"
definition: >-
  HERPUD1, also known as HERP, is a key component of the ERAD multiprotein complex which helps to stabilize the complex and facilitate the efficient degradation of unfolded proteins. This entry also includes HERPUD2, whose function is not clear, but has been associated with hyperuricemia.
