definitions:
  - kind: GENERAL
    text: >-
      TRANSCRIPTION FACTOR LBX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24336. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function sequence-specific double-stranded DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The LBX family of transcription factors is involved in various developmental processes. Members of the family are essential for the development of GABAergic interneurons in the spinal cord, migration and development of hypaxial muscle precursor cells for limb muscles, diaphragm, and hypoglossal cord. They regulate hypaxial muscle development by modulating the proliferation and differentiation of myoblasts. LBX factors are also implicated in embryonic axis formation, convergent extension movements, myofibril formation, and neuromast deposition during development. They achieve these roles by interacting with canonical and non-canonical Wnt signaling pathways, and by transcriptional regulation of genes specific to muscle development and cell migration.
    source: "InterPro:IPR051892 abstract (LLM-generated, not curator-reviewed)"
