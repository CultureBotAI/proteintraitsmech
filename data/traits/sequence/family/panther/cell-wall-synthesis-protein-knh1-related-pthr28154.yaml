identifier: PANTHER:PTHR28154
label: "CELL WALL SYNTHESIS PROTEIN KNH1-RELATED"
definition: >-
  This entry includes a group of cell wall synthesis proteins, such as Knh1 and Kre9 from budding yeasts, involved in cell wall beta 1,6-glucan synthesis. Kre9 is involved involved in cell wall beta-glucan assembly. In Saccharomyces cerevisiae, a kre9 null mutation has been shown to lead to severe growth defects, aberrant multi-budded morphology, and mating defects. Over-expression of Knh1 suppresses growth defects of a kre9 null mutant. Moreover, Knh1 is required for propionic acid resistance.
