identifier: PANTHER:PTHR36490
label: "STRESS ENHANCED PROTEIN 2, CHLOROPLASTIC"
definition: >-
  This entry represents a family of plant proteins, including Stress enhanced protein 2 (Sep2), which is related to the chlorophyll a/b-binding gene family members. Its transcript was present under low light conditions, but their level increased 4- to 10-fold during illumination of plants with high-intensity light. It may be involved in non-photochemical quenching, a process that maintains the balance between dissipation and utilization of light energy to minimise generation of oxidising molecules, thereby protecting the plant against photo-oxidative damage.
definition_source: "InterPro:IPR044971 abstract (PANTHER PTHR36490 is a member signature)"
