identifier: PANTHER:PTHR14650
label: "PROLYL HYDROXYLASE-RELATED"
definition: >-
  2-Oxoglutarate and iron-dependent oxygenase domain-containing protein 3 (OGFOD3) is an uncharacterised protein predominantly found in animals and SAR supergroup organisms. It is a type II transmembrane protein with a short N-terminal cytoplasmic section and the bulk of the protein in the lumen. It contains a Fe(2+) and 2-oxoglutarate (2OG)-dependent dioxygenase domain and is assumed to be an enzyme that catalyses the oxidation of an organic substrate using a dioxygen molecule.
