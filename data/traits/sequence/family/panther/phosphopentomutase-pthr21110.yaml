identifier: PANTHER:PTHR21110
label: PHOSPHOPENTOMUTASE
definition: >-
  This entry describes bacterial phosphopentomutase. This protein is involved in the purine and pyrimidine salvage pathway of nucleotide synthesis. It catalyses a phosphotransfer on ribose and deoxyribose, converting D-ribose 1-phosphate to D-ribose 5-phosphate, and 2-deoxy-D-ribose 1-phosphate to 2-deoxy-D-ribose 5-phosphate.
