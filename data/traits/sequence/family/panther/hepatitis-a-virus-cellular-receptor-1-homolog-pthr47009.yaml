  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that play crucial roles in immune regulation and homeostasis. Members are involved in the recognition and binding of phosphatidylserine, facilitating the trafficking of activated T-cells during inflammatory responses and influencing the accumulation of these cells in the central nervous system, potentially affecting the induction of autoimmune diseases. They also contribute to the regulation of B-cell functions, including their generation, expansion, and suppressor activities. Additionally, these proteins are implicated in the regulation of anti-inflammatory cytokine expression and T-cell proliferation. Some family members serve as viral receptors, mediating the entry of various viruses into host cells. They are characterized by an immunoglobulin V-like domain, a mucin domain, and a cytoplasmic tail with a tyrosine phosphorylation motif, indicating a role in signal transduction.
    source: "InterPro:IPR052331 abstract (LLM-generated, not curator-reviewed)"
