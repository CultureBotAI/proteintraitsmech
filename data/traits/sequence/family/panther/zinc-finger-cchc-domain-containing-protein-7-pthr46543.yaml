identifier: PANTHER:PTHR46543
label: "ZINC FINGER CCHC DOMAIN-CONTAINING PROTEIN 7"
definition: >-
  This family of proteins includes components of the TRAMP and TRAMP5 complexes, which exhibit poly(A) RNA polymerase activity. They are implicated in a post-transcriptional quality control mechanism that restricts the expression of genetic information that is deemed inappropriate. These proteins are involved in the polyadenylation and subsequent degradation of various nuclear RNA substrates, including cryptic transcripts and hypomethylated pre-tRNAi-Met, by the exosome. Some family members also play a role in inhibiting the methylation of specific proteins, such as NPL3, by interacting with methyltransferases. Additionally, there are members with potential DNA-binding properties, particularly to AT-rich regions, suggesting a possible function in transcription regulation.
