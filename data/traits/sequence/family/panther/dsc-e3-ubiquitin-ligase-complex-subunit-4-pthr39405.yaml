identifier: PANTHER:PTHR39405
label: "DSC E3 UBIQUITIN LIGASE COMPLEX SUBUNIT 4"
definition: >-
  This entry represents a group of fungal proteins, including Dsc4 from fission yeasts. Dsc4 is a component of the DSC E3 ubiquitin ligase complex, which is required for the sre1 transcriptional activator proteolytic cleavage to release the soluble transcription factor from the membrane in low oxygen or sterol conditions. The complex also plays an important role in the multivesicular body (MVB) pathway and functions in a post-endoplasmic reticulum pathway for protein degradation.
