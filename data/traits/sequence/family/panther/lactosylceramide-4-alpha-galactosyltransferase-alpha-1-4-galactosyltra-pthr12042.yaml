identifier: PANTHER:PTHR12042
label: "LACTOSYLCERAMIDE 4-ALPHA-GALACTOSYLTRANSFERASE  ALPHA- 1,4-GALACTOSYLTRANSFERASE"
definition: >-
  This entry represents Alpha-1,4-N-acetylglucosaminyltransferase and related proteins. Members of this family catalyse the transfer of sugar moieties from nucleotide sugars to acceptor molecules, forming various glycosidic linkages. Specifically, lactosylceramide 4-alpha-galactosyltransferases from this family add galactose to lactosylceramide to produce globotriaosylceramide (Gb3Cer), a key glycosphingolipid in the globo series. Gb3Cer serves as the Pk antigen in blood histogroup P and is a receptor for bacterial verotoxins. Another enzyme, alpha-1,4-N-acetylglucosaminyltransferase, transfers N-acetylglucosamine to O-glycans, contributing to the synthesis of type III mucin in the gastrointestinal tract, which may offer protection against gastric adenocarcinoma. The conserved DXD motif within these enzymes is crucial for their catalytic activity.
definition_source: "InterPro:IPR051981 abstract (PANTHER PTHR12042 is a member signature)"
