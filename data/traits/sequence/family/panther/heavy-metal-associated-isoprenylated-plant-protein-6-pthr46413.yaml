identifier: PANTHER:PTHR46413
label: "HEAVY METAL-ASSOCIATED ISOPRENYLATED PLANT PROTEIN 6"
definition: >-
  This entry represents a group of heavy metal-associated isoprenylated plant proteins, including HIPP01/3/5/6 from Arabidopsis. HIPP03 acts as an upstream regulator of the salicylate-dependent plant immunity pathway and of flowering time. HIPP06, also known as CdI19, plays an important role in the maintenance of heavy metal homeostasis and/or in detoxification by endowing plasma membranes with the capacity to serve as an initial barrier against inflow of free heavy metal ions into cells.
definition_source: "InterPro:IPR044594 abstract (PANTHER PTHR46413 is a member signature)"
