  - kind: GENERAL
    text: >-
      This family of proteins is involved in the metabolic process of fatty acid chain elongation within peroxisomes. Members of this family are enzymes that specifically catalyze the reduction of trans-2-enoyl-CoA substrates with chain lengths ranging from C6 to C16, with the highest activity observed for the C10 substrate. These proteins do not exhibit 2,4-dienoyl-CoA reductase activity, indicating a specialized function in fatty acid metabolism. The enzymatic activity contributes to the biosynthesis of fatty acids by reducing the double bond of enoyl-CoA intermediates in a stereo-specific manner.
    source: "InterPro:IPR052388 abstract (LLM-generated, not curator-reviewed)"
