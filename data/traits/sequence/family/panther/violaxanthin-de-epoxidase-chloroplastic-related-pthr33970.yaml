identifier: PANTHER:PTHR33970
label: "VIOLAXANTHIN DE-EPOXIDASE, CHLOROPLASTIC-RELATED"
definition: >-
  Violaxanthin de-epoxidase (VDE) is localised in the thylakoid lumen and catalyses the two-step mono de-epoxidation of violaxanthin to form antheraxanthin and zeaxanthin, to control the concentration of zeaxanthin in chloroplasts. It is part of a conserved system that dissipates excess energy as heat in the light-harvesting complexes of photosystem II (PSII) and protects them from photodamage. The thylakoid lumen pH decreases under excessive light that allows VDE to attach to the thylakoid membrane where violaxanthin is located. This acidic condition causes the opening of the lipocalin barrel.
definition_source: "InterPro:IPR044682 abstract (PANTHER PTHR33970 is a member signature)"
