identifier: PANTHER:PTHR12414
label: "GLIAL CELLS MISSING RELATED/GLIDE"
definition: >-
  GCM transcription factors are a family of proteins which contain a GCM motif. They bind specific sequences on gene promoters and activate their transcription. Human GCM1 is involved in the control of expression of placental growth factor (PGF) and other placenta-specific genes. Fruit fly GCM determines the choice between glial and neuronal fates.
