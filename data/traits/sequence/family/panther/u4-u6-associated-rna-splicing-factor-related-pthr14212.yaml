identifier: PANTHER:PTHR14212
label: "U4/U6-ASSOCIATED RNA SPLICING FACTOR-RELATED"
definition: >-
  Prp3 (also known as PRP3) participates in pre-mRNA splicing. It may play a role in the assembly of the U4/U5/U6 tri-snRNP complex. Defects in PRPF3 are the cause of retinitis pigmentosa type 18 (RP18). RP leads to degeneration of retinal photoreceptor cells. In Arabidposis thaliana, protein RDM16 acts as a pre-mRNA splicing factor and functions in RNA-directed DNA methylation by influencing Pol V transcript levels.
