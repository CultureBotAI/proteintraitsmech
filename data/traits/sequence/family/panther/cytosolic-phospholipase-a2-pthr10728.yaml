identifier: PANTHER:PTHR10728
label: "CYTOSOLIC PHOSPHOLIPASE A2"
definition: >-
  CYTOSOLIC PHOSPHOLIPASE A2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10728. PANTHER protein class: phospholipase. Members are annotated with the molecular function carboxylic ester hydrolase activity, phospholipase A2 activity. Members participate in glycerophospholipid metabolic process, glycerolipid catabolic process, glycerophospholipid catabolic process. Members localise to cytoplasm, cytosol.
