label: "CYTOSOLIC PHOSPHOLIPASE A2"
definition: >-
  CYTOSOLIC PHOSPHOLIPASE A2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10728. PANTHER protein class: phospholipase. Members are annotated with the molecular function phospholipase A2 activity. Members participate in glycerophospholipid catabolic process, phosphate-containing compound metabolic process. Members localise to cytoplasm, cytosol.
