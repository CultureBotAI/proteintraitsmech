identifier: PANTHER:PTHR13386
label: "HISTONE PARYLATION FACTOR 1"
definition: >-
  Histone PARylation factor 1 (HPF1, previously known as C4orf27) is a key regulator of ADP-ribosylation signaling in response to DNA damage. It has been demonstrated that HPF1 forms a complex with PARP-1 (poly(ADP-ribose) polymerase 1) and is recruited to DNA lesions in a PARP-1-dependent manner, but independently of PARP-1 catalytic ADP-ribosylation activity. HPF1 has also been shown limit DNA damage-induced hyper-automodification of PARP-1 by promoting PARP-1-dependent in trans ADP-ribosylation of histones. This protein is essential for Ser-ADPr (ADPr on serine residues), which represents the major fraction of ADPr synthesised after DNA damage. HPF1, which shows an α-β structure with two tightly-associated domains connected via an elaborate linker, forms a composite active site with PARP-1.
definition_source: "InterPro:IPR019361 abstract (PANTHER PTHR13386 is a member signature)"
