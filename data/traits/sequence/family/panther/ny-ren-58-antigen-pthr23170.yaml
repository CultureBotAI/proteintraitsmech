  - kind: GENERAL
    text: >-
      This family of proteins is involved in centrosome and cilium assembly and function. Members of this family are known to be components of the centrosome, specifically associated with centrioles. They play a crucial role in centrosome cohesion by forming a fiber-like linker between centrioles. Additionally, some family members are involved in the initiation of primary cilium assembly as part of the distal appendage region of the centriole. They may also cooperate with other proteins, such as IFT20, to facilitate the trafficking of ciliary membrane proteins from the Golgi complex to the cilium, which is essential for ciliary assembly and function.
    source: "InterPro:IPR052116 abstract (LLM-generated, not curator-reviewed)"
