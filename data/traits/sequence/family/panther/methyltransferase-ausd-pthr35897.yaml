  - kind: GENERAL
    text: >-
      This family of proteins includes methyltransferases involved in the biosynthesis of various fungal meroterpenoids. These enzymes typically catalyze the transfer of methyl groups from S-adenosyl-L-methionine (SAM) to specific substrates, which are often intermediates in the production of secondary metabolites with diverse biological activities. The reactions they facilitate are essential steps in the formation of complex chemical structures, such as those found in antitumor agents, mycotoxins, and other bioactive compounds. The proteins in this family share a similarity in that they belong to the class I-like SAM-binding methyltransferase superfamily, indicating a common mechanism of action and structural fold.
