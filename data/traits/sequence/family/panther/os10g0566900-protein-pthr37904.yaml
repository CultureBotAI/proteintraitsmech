identifier: PANTHER:PTHR37904
label: "OS10G0566900 PROTEIN"
definition: >-
  This entry represents a group of plant proteins, including At5g43822 from Arabidopsis. Their function is not clear. In Arabidopsis At5g43822 has been characterised as an essential protein renamed OPENER (OPNR), whose gene is expressed in rapidly dividing cells and may function in cell cycle progression. It is expressed in mitochondria and the nuclear envelope. Loss of function results in embryo lethality and reduced transmission through the female.
