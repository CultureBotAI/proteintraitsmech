  - kind: GENERAL
    text: >-
      This family of proteins includes structural components that stabilize and organize microtubule spindles during cell division, such as mitosis in embryonic somatic cells and meiosis in spermatocytes. Their function is influenced by the Ran pathway. Additionally, members of this family serve as specific endothelial cell receptors that form complexes with thrombin, playing a crucial role in the coagulation cascade by converting protein C to its activated form, which in turn regulates the activity of coagulation factors Va and VIIIa, ultimately reducing thrombin generation.
