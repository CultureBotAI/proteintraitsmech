identifier: PANTHER:PTHR34834
label: "SPERMATID MATURATION PROTEIN 1"
definition: >-
  SPERMATID MATURATION PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR34834. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies participate in spermatid development, flagellated sperm motility, spermatid differentiation. Subfamilies localise to intracellular anatomical structure, cytoplasm.
