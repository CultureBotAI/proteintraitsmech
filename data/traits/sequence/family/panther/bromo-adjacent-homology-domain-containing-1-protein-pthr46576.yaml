identifier: PANTHER:PTHR46576
label: "BROMO ADJACENT HOMOLOGY DOMAIN-CONTAINING 1 PROTEIN"
definition: >-
  This family of proteins functions as transcription repressors involved in the formation and maintenance of heterochromatin. Members of this family have the ability to recruit various heterochromatin proteins, including CBX5 (HP1 alpha), HDAC5, and MBD1, to specific genomic regions. They are known to repress the expression of certain genes, such as IGF2, by binding to CpG-rich promoters and facilitating the assembly of heterochromatin. Additionally, these proteins can interact with histone modifications, as their localization is dependent on the presence of H3K27me3, a marker of repressive chromatin.
