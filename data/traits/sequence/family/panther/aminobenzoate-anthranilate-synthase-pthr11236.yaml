identifier: PANTHER:PTHR11236
label: "AMINOBENZOATE/ANTHRANILATE SYNTHASE"
definition: >-
  This entry represents the anthranilate synthase component 1 protein EC:4.1.3.27 and its homologues, including aminodeoxychorismate synthase component 1 EC:2.6.1.85, 2-amino-4-deoxychorismate synthase EC:2.6.1.86 and isochorismate synthase/isochorismate-pyruvate lyase MbtI EC:5.4.4.2. Anthranilate synthase component 1 is a tetramer comprising two copies of component I and two copies of component II. Component I catalyses the formation of anthranilate using ammonia rather than glutamine, while component II provides glutamine amidotransferase activity.
definition_source: "InterPro:IPR019999 abstract (PANTHER PTHR11236 is a member signature)"
