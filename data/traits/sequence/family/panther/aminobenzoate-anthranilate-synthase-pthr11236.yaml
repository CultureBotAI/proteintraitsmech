identifier: PANTHER:PTHR11236
label: "AMINOBENZOATE/ANTHRANILATE SYNTHASE"
definition: >-
  This entry represents the anthranilate synthase component 1 protein and its homologues, including aminodeoxychorismate synthase component 1, 2-amino-4-deoxychorismate synthase and isochorismate synthase/isochorismate-pyruvate lyase MbtI. Anthranilate synthase component 1 is a tetramer comprising two copies of component I and two copies of component II. Component I catalyses the formation of anthranilate using ammonia rather than glutamine, while component II provides glutamine amidotransferase activity.
