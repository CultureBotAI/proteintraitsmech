identifier: PANTHER:PTHR38329
label: CECROPIN-A1-RELATED
definition: >-
  This entry represents antimicrobial peptides such as Cecropins, Sarcotoxins and Aedesins from insects. Cecropins are potent antibacterial proteins that constitute a main part of the cell-free immunity of insects. Cecropins are small proteins of about 35 amino acid residues active against both Gram-positive and Gram-negative bacteria. They seem to exert a lytic action on bacterial membranes. Cecropins have been given various names, including bactericidin, lepidopteran and sarcotoxin. All of these peptides are structurally related.
