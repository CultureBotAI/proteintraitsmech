identifier: PANTHER:PTHR47470
label: "CHOLESTEROL OXIDASE"
definition: >-
  The Cholesterol Oxidase family comprises enzymes that play a crucial role in the cholesterol degradation pathway. Members of this family are responsible for the oxidation and isomerization of cholesterol to cholestenone, which is a key initial step in breaking down cholesterol. These enzymes are characterized by their ability to catalyze the transformation of the 3-beta-hydroxy group of cholesterol and the subsequent isomerization of the double bond in the product, leading to the formation of cholest-4-en-3-one. This biochemical activity allows bacteria to utilize cholesterol as a sole carbon and energy source, and is also implicated in bacterial virulence. The family belongs to the broader GMC oxidoreductase family, although some members are noted to be highly divergent within this group.
