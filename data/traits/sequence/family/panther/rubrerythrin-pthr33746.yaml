identifier: PANTHER:PTHR33746
label: RUBRERYTHRIN
definition: >-
  This protein family is involved in peroxidase activity, specifically utilizing NADH as an electron donor to reduce hydrogen peroxide (H2O2). Members of the family, such as Nigerythrin and Rubrerythrin-2, function in oxidative stress response by catalysing the conversion of H2O2 into water, thereby protecting the cell from oxidative damage. Rubrerythrin-2 acts as the terminal component of an NADH peroxidase system, with NADH:rubredoxin oxidoreductase (NROR) serving as an electron transport intermediary. Rubredoxin enhances the efficiency of this electron transfer process. Although the exact biological role of the uncharacterised protein in the family remains unclear, the known functions of other members suggest a general role in cellular redox homeostasis. Also included in this family is symerythrin (UniProtKB:P48329), a rubrerythrin variant from the oxygenic phototroph Cyanophora paradoxa. A particularity of this protein is its high internal symmetry, which supports the notion that its core four-helix bundle was formed by the gene duplication and fusion of a two-helix peptide.
