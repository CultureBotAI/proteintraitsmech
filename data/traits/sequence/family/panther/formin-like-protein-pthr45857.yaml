identifier: PANTHER:PTHR45857
label: "FORMIN-LIKE PROTEIN"
definition: >-
  This entry represents a group of formin-like proteins mostly from animals, including FMNL1/2/3 from humans. They contain the FH2 domain and belong to the formin homology family. They play a role in the regulation of cell morphology and cytoskeletal organisation. They are required in the cortical actin filament dynamics and cell shape.
