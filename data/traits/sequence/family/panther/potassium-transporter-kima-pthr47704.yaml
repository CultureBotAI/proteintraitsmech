identifier: PANTHER:PTHR47704
label: "POTASSIUM TRANSPORTER KIMA"
definition: >-
  This family of proteins includes high-affinity potassium transporters that function as K(+)/H(+) symporters. They facilitate the uptake of potassium ions into cells, a process which is enhanced at lower external pH levels. The activity of these transporters is sensitive to changes in proton motive force, as demonstrated by the inhibition of potassium uptake in the presence of proton ionophores. Additionally, these proteins can bind cyclic di-AMP, a nucleotide second messenger, which negatively regulates their potassium transport activity. Members of this family are part of the amino acid-polyamine-organocation (APC) superfamily, indicating a broad role in the transport of a variety of substrates across cellular membranes.
