  - kind: GENERAL
    text: >-
      The Histidine Acid Phosphatase family comprises enzymes with diverse functions including hydrolysis of phosphomonoesters, dephosphorylation of proteins, and regulation of glycosaminoglycan chain maturation. Members are involved in normal growth, development, and differentiation processes such as gut differentiation and odontogenesis. Some are implicated in the hydrolysis of lysophosphatidic acid, contributing to lipid metabolism, while others participate in the dephosphorylation of xylose in proteoglycan linkage regions, influencing glycosaminoglycan synthesis. Certain family members have roles in pain suppression, tumor suppression in prostate cancer, and even in the enhancement of viral infection. The family's enzymes are characterized by their activity under acidic conditions and are regulated by various factors including tartrate and cAMP.
    source: "InterPro:IPR050645 abstract (LLM-generated, not curator-reviewed)"
