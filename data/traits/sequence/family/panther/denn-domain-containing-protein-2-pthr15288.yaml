  - kind: GENERAL
    text: >-
      This family of proteins functions as guanine nucleotide exchange factors (GEFs) primarily activating RAB9A and RAB9B. They facilitate the conversion of these Rab proteins from an inactive GDP-bound state to an active GTP-bound form. Members of this family are involved in various cellular processes, including endosomal transport, particularly from late endosomes to the trans-Golgi network, and EGFR trafficking from recycling endosomes to the cell membrane. Some proteins in this family may also participate in cytoskeletal organization, influence cell morphology and growth, and may be implicated in tumorigenicity. Additionally, they might play a role in signaling pathways that lead to the activation of MAPK1/ERK2, although certain members could potentially inhibit ERK2 activation.
    source: "InterPro:IPR051942 abstract (LLM-generated, not curator-reviewed)"
