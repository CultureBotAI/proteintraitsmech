identifier: PANTHER:PTHR36507
label: "BLL1555 PROTEIN"
definition: >-
  This family of proteins serves as electron transfer intermediates in bacterial respiratory chains. Members of this family accept electrons from methylamine dehydrogenase and subsequently transfer them to other electron carriers such as soluble cytochrome c or pseudoazurin. These proteins play a crucial role in the energy metabolism of certain bacteria by facilitating the transfer of electrons in the process of oxidative phosphorylation.
