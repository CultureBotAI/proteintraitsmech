identifier: PANTHER:PTHR45086
label: "WD REPEAT-CONTAINING PROTEIN PCN"
definition: >-
  This entry represents a group of plant WD repeat-containing proteins, including POPCORN (PCN) from Arabidopsis. PCN is required for embryo development and meristem organization. It functions in the auxin pathway, integrating auxin signaling in the organization and maintenance of the shoot and root apical meristems.
definition_source: "InterPro:IPR044622 abstract (PANTHER PTHR45086 is a member signature)"
