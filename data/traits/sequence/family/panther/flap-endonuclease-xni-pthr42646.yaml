identifier: PANTHER:PTHR42646
label: "FLAP ENDONUCLEASE XNI"
definition: >-
  This entry represents a family of proteins that includes flap endonucleases from bacteria and viruses. Flap endonucleases (FENs) catalyse the exonucleolytic hydrolysis of blunt-ended duplex DNA substrates and the endonucleolytic cleavage of 5'-bifurcated nucleic acids at the junction formed between single and double-stranded DNA. Escherichia phage T5 encodes the flap endonuclease D15, which catalyzes both the 5'-exonucleolytic and structure-specific endonucleolytic hydrolysis of DNA branched nucleic acid molecules. In bacteriophage T4, disruption of the rnh gene (which encodes a FEN, known historically as T4 RNase H) results in slower, less accurate DNA replication. Bacteriophage T4 has both 5' nuclease and flap endonuclease activities.
