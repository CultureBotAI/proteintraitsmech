    text: >-
      REPLICATION FACTOR C / DNA POLYMERASE III GAMMA-TAU SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11669. PANTHER protein class: DNA-directed DNA polymerase. Members participate in DNA-templated DNA replication.
