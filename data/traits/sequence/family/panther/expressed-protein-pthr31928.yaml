identifier: PANTHER:PTHR31928
label: "EXPRESSED PROTEIN"
definition: >-
  This entry (ex DUF936) represents Protein CORTICAL MICROTUBULE DISORDERING (CORD) proteins found in plants. CORD proteins are microtubule-associated proteins that are required, redundantly with CORD2, for the formation of the pitted secondary cell wall of metaxylem vessels. CORD1 from Arabidopsis thaliana controls the disorganisation of the parallel cortical microtubule network by modulating microtubule attachment to the plasma membrane in metaxylem vessel cells; this mechanism probably relies on disruption of interactions between ARAC10/ROP11 and cortical microtubules.
definition_source: "InterPro:IPR010341 abstract (PANTHER PTHR31928 is a member signature)"
