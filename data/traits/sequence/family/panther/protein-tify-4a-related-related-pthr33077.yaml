identifier: PANTHER:PTHR33077
label: "PROTEIN TIFY 4A-RELATED-RELATED"
definition: >-
  JASMONATE ZIM-domain (JAZ) proteins act as repressors of jasmonate (JA) signaling. The ZIM domain recruits the co-repressors NINJA and TOPLESS to JAZ-bound transcription factors, and contains a highly conserved TIF[F/Y]XG motif that defines the larger family of TIFY proteins to which JAZs belong. This family consists of TIFY/JAZ proteins, and also includes JAZ13 (At3g22275), a non-TIFY JAZ protein that is a repressor of JA signaling. Some of the members of the TIFY/JAZ family, such as TIFY8, are not involved in JA signaling. TIFY8 is found in protein complexes involved in regulation of dephosphorylation, deubiquitination and O-linked N-acetylglucosamine modification, suggesting an important role in nuclear signal transduction.
