identifier: PANTHER:PTHR46491
label: "CDGSH IRON SULFUR DOMAIN PROTEIN HOMOLOG"
definition: >-
  This family of proteins is involved in the transfer of iron-sulfur clusters to apoferrodoxins, specifically FDX1 and FDX2, playing a critical role in mitochondrial iron homeostasis. Members of this family are essential for maintaining appropriate levels of free iron and reactive oxygen species within the mitochondria, which is crucial for normal mitochondrial function and overall cellular health.
