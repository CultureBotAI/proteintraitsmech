identifier: PANTHER:PTHR35709
label: "PROTEIN PROTON GRADIENT REGULATION 5, CHLOROPLASTIC"
definition: >-
  PGR5 is involved in the regulation of the cyclic electron flow around Photosystem I. Two types of electron transfer contribute to the proton concentration gradient across the thylakoid membrane: linear electron flow (LEF) and cyclic electron flow (CEF), which is divided into NDH- and PGR5-dependent pathways. The PGR5-PGRL1 complex mediates the second CET circuit, accepting electrons from ferrodoxin and reducing the plastoquinone pool. PGR5 is important to regulate and facilitate CET, and is essential for photoprotection in Arabidopsis.
definition_source: "InterPro:IPR037497 abstract (PANTHER PTHR35709 is a member signature)"
