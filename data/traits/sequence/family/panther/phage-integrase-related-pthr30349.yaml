identifier: PANTHER:PTHR30349
label: "PHAGE INTEGRASE-RELATED"
definition: >-
  This entry represents a site-specific tyrosine recombinase, which acts by catalyzing the cutting and rejoining of the recombining DNA molecules. XerD binds cooperatively to specific DNA consensus sequences that are separated from XerC binding sites by a short central region, forming the heterotetrameric XerC-XerD complex that recombines DNA substrates. The complex is essential to convert dimers of the bacterial chromosome into monomers to permit their segregation at cell division. It also contributes to the segregational stability of plasmids. XerD forms a cyclic heterotetrameric complex composed of two molecules of XerC and two molecules of XerD, in which XerC interacts with XerD via its C-terminal region, XerD interacts with XerC via its C-terminal region and so on. This entry also includes related tyrosine recombinases and related proteins from other bacterial groups, archaea, viruses and eukaryotes. Some members of this family are involved in the integration and excision of bacteriophage DNA into and out of the host genome, as well as the regulation of gene expression through inversion of DNA segments.
definition_source: "InterPro:IPR050090 abstract (PANTHER PTHR30349 is a member signature)"
