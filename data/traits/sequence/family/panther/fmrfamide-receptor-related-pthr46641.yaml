  - kind: GENERAL
    text: >-
      This family of proteins includes G-protein coupled receptors (GPCRs) that interact with specific ligands to regulate various biological processes. Members of this family are involved in the recognition and response to peptide or pheromone signals, which can influence neuronal excitability, behavior, and developmental pathways. For instance, one receptor in this family responds to FMRFamide peptides, playing a role in the maintenance of neuronal excitability and flight duration in certain species. Another receptor interacts with ascaroside pheromones to control dauer formation and longevity, and is implicated in specific neuronal signaling pathways that affect larval development and reproductive behaviors. These receptors typically function through intracellular signaling cascades, such as calcium signaling or downstream pathways involving other signaling molecules.
