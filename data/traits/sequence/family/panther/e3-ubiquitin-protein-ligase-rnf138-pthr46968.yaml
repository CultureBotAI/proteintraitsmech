  - kind: GENERAL
    text: >-
      E3 UBIQUITIN-PROTEIN LIGASE RNF138 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46968. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity, single-stranded DNA binding. Members participate in double-strand break repair via homologous recombination, DNA double-strand break processing. Members localise to nucleus, chromosome, site of double-strand break.
