  - kind: GENERAL
    text: >-
      The RNF138 ubiquitin-protein ligase family is involved in the cellular response to DNA damage, particularly in promoting DNA resection and homologous recombination for the repair of double-strand breaks. Members of this family are recruited to damaged DNA sites and facilitate repair through homologous recombination, potentially by mediating the ubiquitination of key repair proteins such as XRCC5/Ku80 and RBBP8/CtIP. This ubiquitination process may remove inhibitory complexes or promote the assembly of repair machinery. Additionally, the family is implicated in the ubiquitination and degradation of TCF/LEF transcription factors, influencing the Wnt/beta-catenin signaling pathway. The family's auto-ubiquitination activity, particularly in conjunction with UBE2K, suggests a role in self-regulation. The zinc finger domains of these proteins exhibit a strong binding preference for DNA with single-stranded overhangs, which is crucial for their recruitment to double-strand break sites and subsequent repair facilitation.
    source: "InterPro:IPR052498 abstract (LLM-generated, not curator-reviewed)"
