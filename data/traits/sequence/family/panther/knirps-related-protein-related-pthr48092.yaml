  - kind: GENERAL
    text: >-
      The nuclear hormone receptor family NR3 subfamily proteins are ligand-activated transcription factors that regulate gene expression affecting cellular proliferation and differentiation in target tissues. They bind to specific DNA sequences and modulate the transcription of target genes involved in a wide range of physiological processes including metabolism, development, and homeostasis. Members of this family respond to steroid hormones such as estrogens, glucocorticoids, mineralocorticoids, androgens, and progesterone, and can function as transcriptional activators or repressors. They are composed of a modulating N-terminal domain, a DNA-binding domain, and a C-terminal ligand-binding domain. Some members are known to interact with coactivator and corepressor proteins, influencing their transcriptional activity. They are also involved in various signaling pathways and may play roles in apoptosis, chromatin remodeling, and maintaining insulin sensitivity.
    source: "InterPro:IPR050200 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
