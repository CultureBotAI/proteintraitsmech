definitions:
  - kind: GENERAL
    text: >-
      KNIRPS-RELATED PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48092. PANTHER protein class: C4 zinc finger nuclear receptor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
