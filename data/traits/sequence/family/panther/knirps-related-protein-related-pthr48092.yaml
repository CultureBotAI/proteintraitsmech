definitions:
  - kind: GENERAL
    text: >-
      KNIRPS-RELATED PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48092. PANTHER protein class: C4 zinc finger nuclear receptor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, organic cyclic compound binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of DNA-templated transcription. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
