identifier: PANTHER:PTHR48494
label: INTERLEUKIN-6
definition: >-
  This entry represents interleukin-6 (IL6), also refered to as B-cell stimulatory factor-2 (BSF-2) and interferon beta-2, it is a cytokine involved in a wide variety of biological functions. It plays an essential role in the final differentiation of B-cells into IG-secreting cells, as well as inducing myeloma/plasmacytoma growth, nerve cell differentiation and, in hepatocytes, acute phase reactants. This entry also includes the interleukin-6 homologue from human herpesvirus 8 type P which binds to interleukin-6 receptor subunit beta IL6ST and initiates a signal transduction. It is able to induce blood to lymphatic endothelial cell differentiation and, in infected primary effusion lymphoma cells, it promotes cell proliferation, protects them from apoptosis, and promotes immune evasion of interferon activity.
definition_source: "InterPro:IPR003574 abstract (PANTHER PTHR48494 is a member signature)"
