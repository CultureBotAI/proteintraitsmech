identifier: PANTHER:PTHR31180
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 107-RELATED"
definition: >-
  This entry includes Cilia- and flagella-associated proteins 107 (CFAP107 or C1orf158) and 68 (CFAP68, also known as UPF0686 protein C11orf1), that are microtubule inner proteins (MIP) part of the dynein-decorated doublet microtubules (DMTs) in cilia axoneme, which is required for motile cilia beating.
