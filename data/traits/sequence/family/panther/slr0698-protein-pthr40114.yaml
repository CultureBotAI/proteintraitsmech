identifier: PANTHER:PTHR40114
label: "SLR0698 PROTEIN"
definition: >-
  This entry includes bacterial CYTH-domain containing proteins such as NeuTTM (UniProtKB:Q82UI9) from Nitrosomonas europaea and CthTTM (UniProtKB:A3DIJ8) from Clostridium thermocellum They both have a high PPPase activity (though CthTM was less specific) but neither had any significant adenylyl cyclase activity. CYTH domain proteins act on triphosphorylated substrates and require at least one divalent metal cation for catalysis.
