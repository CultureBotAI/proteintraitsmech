identifier: PANTHER:PTHR42853
label: "ACETYL-COENZYME A CARBOXYLASE CARBOXYL TRANSFERASE SUBUNIT ALPHA"
definition: >-
  This entry contains the alpha subunit (Acetyl-coenzyme A carboxylase carboxyl transferase ACCA EC:2.1.3.15) of the acetyl coenzyme A carboxylase complex (EC:6.4.1.2). ACCA catalyses the transfer of a carboxyl group carried on a biotinylated biotin carboxyl carrier protein (BCCP) to acetyl-CoA, forming malonyl-CoA, the first step in the synthesis of long-chain fatty acids. The acetyl-CoA carboxylase complex is a heterohexamer of biotin carboxyl carrier protein, biotin carboxylase and two non-identical carboxyl transferase subunits (alpha and beta) in a 2:2 association. The reaction involves two steps: Biotin carrier protein + ATP + HCO 3 - ->Carboxybiotin carrier protein + ADP + P i Carboxybiotin carrier protein + Acetyl-CoA ->Malonyl-CoA + Biotin carrier protein
definition_source: "InterPro:IPR001095 abstract (PANTHER PTHR42853 is a member signature)"
