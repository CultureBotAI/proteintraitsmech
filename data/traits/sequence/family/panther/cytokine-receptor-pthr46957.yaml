  - kind: GENERAL
    text: >-
      The protein family includes receptor-type tyrosine-protein phosphatases and ushers, which are involved in a variety of biological processes including cell adhesion, migration, proliferation, differentiation, and angiogenesis. Members of the family play crucial roles in the maintenance and remodeling of blood vessels, as well as in the regulation of cell signaling pathways through their enzymatic activity of dephosphorylation. They are essential for normal brain development, auditory function, and vision, acting in complexes such as the USH2 complex for the maintenance of periciliary membrane complexes and hair bundle ankle formation. Additionally, they contribute to contact inhibition of cell growth, apoptotic cell death, and the suppression of immune responses. The family's phosphatases are involved in the regulation of energy metabolism and may also influence the differentiation of cells in bone and testis.
    source: "InterPro:IPR050713 abstract (LLM-generated, not curator-reviewed)"
