  - kind: GENERAL
    text: >-
      This family of proteins is involved in the organization of microtubules within centrosomes, playing a crucial role in cell delamination processes. They are essential for the delamination and retention of neural stem cells during neurogenesis and are implicated in the epithelial-to-mesenchymal transition in epithelial cells. These proteins function by enhancing centrosomal microtubule nucleation, recruiting nucleation factors, and stabilizing microtubule minus-ends, leading to the destabilization of microtubules at adherens junctions and facilitating the constriction of apical endfeet. Members of this family may also have a role as transcription factors, potentially regulating the expression of critical cell surface molecules involved in antigen-dependent B-cell development. However, the dual role as both microtubule organizers and transcription factors is not fully understood, and further evidence is needed to clarify these functions.
    source: "InterPro:IPR052655 abstract (LLM-generated, not curator-reviewed)"
