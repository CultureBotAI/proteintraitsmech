identifier: PANTHER:PTHR16223
label: "TRANSCRIPTION FACTOR BHLH83-RELATED"
definition: >-
  This entry represents a group of bHLH transcription factors from plants, including IND, HEC1/2/3 and RHD6 from Arabidopsis. IND is required for seed dispersal, while HEC1/2/3 are required for the female reproductive tract development and fertility. IND interacts with another bHLH transcription factor SPATULA (SPT), and together they regulate genes involved in modulating auxin transport. RDH6 is a transcription factor that is specifically required for the development of root hairs. It integrates a jasmonate (JA) signaling pathway that stimulates root hair growth. This entry also includes LF (LATE FLOWERING) and LAX PANICLE 1 from rice. LF regulates flowering time, while LAX1 is a transcription factor that may regulate organogenesis in postembryonic development. It is involved in the regulation of shoot branching by controlling axillary meristem initiation.
definition_source: "InterPro:IPR045843 abstract (PANTHER PTHR16223 is a member signature)"
