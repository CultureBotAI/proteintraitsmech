identifier: PANTHER:PTHR13572
label: "ENDO-ALPHA-1,2-MANNOSIDASE"
definition: >-
  This family contains endomannosidases and endomannosidase-like proteins. Glycoprotein endo-alpha-1,2-mannosidase hydrolyses the terminal alpha-D-glucosyl-(1,3)-D-mannosyl unit from the GlcMan9(GlcNAc)2 oligosaccharide component of the glycoprotein produced in the Golgi membrane.
