identifier: PANTHER:PTHR15065
label: "INSULINOMA-ASSOCIATED 1"
definition: >-
  Insulinoma-associated protein 1 (INSM1) is a zinc-finger transcription factor exclusively expressed in the foetal pancreas and nervous system, and in tumours of neuroendocrine origin. It can recruits cyclin D1 and HDACs, which confer transcriptional repressor activity. It is involved in endocrine and neuronal cell differentiation. In pancreas, it is activated by the islet-specific endocrine factor neurogenin 3, and subsequently regulates downstream target genes NeuroD1 and insulin during beta-cell maturation. Transcription factor egl-46 is the C. elegans orthologue from human INSM2, which is involved in neuron differentiation.
definition_source: "InterPro:IPR042972 abstract (PANTHER PTHR15065 is a member signature)"
