identifier: PANTHER:PTHR11414
label: "CYSTATIN FAMILY MEMBER"
definition: >-
  The cystatins are a superfamily of similar proteins present in mammals, birds, fish, insects, plants and protozoa. In general they are potent peptidase inhibitors belonging to MEROPS inhibitor family I25, clan IH. The stefin family (MEROPS inhibitor family I25 clan IH, subfamily I25A) includes proteins that lack disulphide bonds and carbohydrates. The most abundant source of stefin A is poly-morphonuclear leucocytes from the liver, but it is also found in extracts of squamous epithelia from the mouth and oesophagus, and has been localised to the cytoplasm of the strata corneum and granulosum of the epidermis. The selective distribution of the inhibitor correlates with tissues that constitute a 'first line of defence' against pathogenic organisms. Stefin A may thus provide a protective function as an inhibitor of cysteine proteases utilised as invasive tools by many infectious agents. The structure of stefin A contains a 5-stranded anti-parallel β-sheet, wrapped around a central helix. The loops formed between the strands are involved in inhibitor binding, one of these containing a QVVAG sequence, which is highly conserved in most members of the cystatin superfamily.
