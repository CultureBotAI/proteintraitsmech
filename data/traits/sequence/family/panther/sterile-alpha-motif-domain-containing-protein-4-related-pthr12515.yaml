definitions:
  - kind: GENERAL
    text: >-
      STERILE ALPHA MOTIF DOMAIN CONTAINING PROTEIN 4-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12515. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding. and participate in positive regulation of nitrogen compound metabolic process, regulation of primary metabolic process, negative regulation of macromolecule biosynthetic process. and localise to supramolecular complex, cytoplasm, non-membrane-bounded organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The SMAUG/VTS1 family includes RNA-binding proteins that play a role in post-transcriptional regulation, including translational repression and transcript degradation. Members of the SMAUG subfamily, such as Smaug homologs, act as translational repressors by binding to SRE-containing messengers, thereby inhibiting their translation. They are known to regulate the translation of specific mRNAs by interacting with their 3'-UTRs, often through a SAM domain. The VTS1 subfamily members are involved in transcript degradation, contributing to the regulation of gene expression at the RNA level. Some members have been shown to bind to SMG-recognition elements (SREs) in mRNAs. Collectively, the SMAUG/VTS1 family is involved in the intricate control of gene expression, ensuring proper cellular function and response to various regulatory signals.
    source: "InterPro:IPR050897 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
