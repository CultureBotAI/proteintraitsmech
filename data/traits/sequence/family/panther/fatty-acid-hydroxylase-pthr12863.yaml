identifier: PANTHER:PTHR12863
label: "FATTY ACID HYDROXYLASE"
definition: >-
  This entry represents a family of fatty acid hydroxylases, including Scs7 from budding yeasts and FA2H from animals and plants. They contain an N-terminal Cytochrome b5-like heme/steroid binding domain. Scs7 is a sphingolipid alpha-hydroxylase involved in the alpha-hydroxylation of sphingolipid-associated very long chain fatty acids.
