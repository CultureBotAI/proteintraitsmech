identifier: PANTHER:PTHR38454
label: "INTEGRAL MEMBRANE PROTEIN-RELATED"
definition: >-
  The yfhO gene is transcribed in Difco sporulation medium and the transcription is affected by the YvrGHb two-component system. Some members of this family have been annotated as putative ABC transporter permease proteins.
