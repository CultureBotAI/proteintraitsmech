identifier: PANTHER:PTHR13389
label: "PUMILIO HOMOLOG 3"
definition: >-
  PUMILIO HOMOLOG 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13389. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding. and participate in regulation of primary metabolic process, regulation of protein metabolic process, regulation of amide metabolic process. and localise to intracellular organelle lumen, membrane-enclosed lumen, intracellular non-membrane-bounded organelle.
