  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of dimeric xanthones, specifically the cryptosporioptides. Members of this family participate in various steps of the metabolic pathway, including the synthesis of atrochrysone thioester, release of atrochrysone carboxylic acid, decarboxylation, oxidation, reduction, dehydration, and Baeyer-Villiger oxidation. They also contribute to the formation of key intermediates such as emodin, chrysophanol, and dihydroxanthone, and are involved in the introduction of epoxides, carboxylation of butyrate, esterification, and the final dimerization process that leads to the production of cryptosporioptides A, B, and C.
    source: "InterPro:IPR053206 abstract (LLM-generated, not curator-reviewed)"
