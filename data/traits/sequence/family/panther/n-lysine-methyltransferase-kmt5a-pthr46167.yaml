identifier: PANTHER:PTHR46167
label: "N-LYSINE METHYLTRANSFERASE KMT5A"
definition: >-
  This family of proteins includes N-lysine methyltransferases that specifically target 'Lys-20' of histone H4, marking it with a monomethyl group (H4K20me1). This modification is associated with epigenetic transcriptional repression and is particularly enriched during mitosis. These proteins are crucial for cell proliferation, as they contribute to the maintenance of DNA's higher-order structure and are involved in chromosome condensation and cytokinesis. Some family members also methylate non-histone proteins, such as p53, which influences gene expression regulation. Their activity is dependent on the SET domain, which is the site of enzymatic activity and requires flanking sequences for full functionality. They belong to a superfamily characterized by SAM-binding and are part of a histone-lysine methyltransferase subfamily.
