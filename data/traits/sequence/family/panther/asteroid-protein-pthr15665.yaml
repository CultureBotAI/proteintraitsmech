identifier: PANTHER:PTHR15665
label: "ASTEROID PROTEIN"
definition: >-
  This entry represents the protein Asteroid and its homologues, including Single-strand DNA endonuclease ASTE1 (also known as Protein asteroid homolog 1). D. melanogaster protein Asteroid plays a possible role in EGF receptor signalling. Human ASTE1 was shown to promote shieldin-complex-mediated DNA repair by attenuating end resection. ASTE1 localises to DNA damage sites in a shieldin-dependent manner and acts as a structure-specific DNA endonuclease that specifically cleaves single-stranded DNA and 3' overhang DNA.
