identifier: PANTHER:PTHR22901
label: "SIALATE O-ACETYLESTERASE"
definition: >-
  Sialate O-acetylesterase (SIAE, EC:3.1.1.53) is a lysosomal enzyme that removes the O-acetyl ester groups from position 9 of the parent sialic acid, N-acetylneuraminic acid. In humans, it is highly expressed in the testis, prostate, and colon. It negatively regulates B lymphocyte antigen receptor signalling and is required for the maintenance of immunological tolerance. Mutations in the gene result in autoimmune disease 6. This entry also includes many uncharacterised bacterial proteins.
