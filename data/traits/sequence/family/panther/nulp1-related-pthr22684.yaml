identifier: PANTHER:PTHR22684
label: NULP1-RELATED
definition: >-
  This entry includes ribosome quality control complex subunits TCF25 from animals and Rqc1 from budding yeasts. Rqc1 is a component of the ribosome quality control complex (RQC), a ribosome-associated complex that mediates ubiquitination and extraction of incompletely synthesized nascent chains for proteasomal degradation. TCF25 may act by increasing histone deacetylase activity at promoter regions.
