identifier: PANTHER:PTHR46350
label: "RAS LIKE FAMILY 10 MEMBER B-RELATED"
definition: >-
  This family of proteins includes members that are involved in the regulation of cellular processes such as proliferation and arterial pressure. Some members may play a role in facilitating the release of atrial natriuretic peptide from cardiomyocytes, which is important for blood pressure regulation. Others are described as potent inhibitors of cellular proliferation, indicating a role in cell growth control. All members belong to the small GTPase superfamily and share similarity with the Ras protein family, suggesting a function related to molecular signaling and cellular dynamics.
