identifier: PANTHER:PTHR47174
label: "BRIDGING INTEGRATOR 3"
definition: >-
  This family includes a group of BAR-domain containing proteins, including BIN3 from human, its homologues RVS161 and hob3 from S. cerevisiae and S. pombe, respectively, and related proteins, which contain the N-BAR domain, related to the amphiphysin family of proteins. BIN3 is widely expressed in many tissues except in the brain. It plays roles in regulating filamentous actin localization and in cell division. This entry also includes reduced viability upon starvation protein 167 (RVS167) from S. cerevisiae and its homologue in S. pombe, hob1. RVS161/167 are components of a cytoskeletal structure that is required for the formation of endocytic vesicles at the plasma membrane level and form a complex that regulates actin, endocytosis, and viability following starvation or osmotic stress. Hob1 is structurally similar to RVS167, while hob3 is more similar to human BIN3 and RVS161, however, neither hob1 nor hob3 is required for endocytosis,. Hob1 is dispensable for endocytosis, actin organization, or osmotic sensitivity but it participates in DNA damage signalling as a part of stress response processes.
definition_source: "InterPro:IPR046982 abstract (PANTHER PTHR47174 is a member signature)"
