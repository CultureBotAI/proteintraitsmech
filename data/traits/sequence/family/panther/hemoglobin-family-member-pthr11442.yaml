definitions:
  - kind: GENERAL
    text: >-
      HEMOGLOBIN FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11442. PANTHER protein class: globin. Members are annotated with the molecular function oxidoreductase activity, acting on peroxide as acceptor, heme binding, organic acid binding. Members participate in catabolic process. Members localise to extracellular region, cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the transport of oxygen from respiratory organs to the rest of the body. They contain heme groups that reversibly bind oxygen molecules, facilitating their delivery to tissues that require oxygen for metabolism. Some members of this family also have roles in embryonic development, acting as embryonic hemoglobins. Additionally, certain variants within this family can bind to receptors such as the cannabinoid receptor CNR1, acting as antagonists and influencing signaling pathways related to pain and inflammation.
    source: "InterPro:IPR050056 abstract (LLM-generated, not curator-reviewed)"
