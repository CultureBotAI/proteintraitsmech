  - kind: GENERAL
    text: >-
      This family of proteins includes components of E3 ubiquitin-protein ligase complexes and neurotoxins. Members involved in ubiquitination act as substrate recognition subunits in cullin-RING E3 ligase complexes, targeting specific proteins for proteasomal degradation, which is crucial for various cellular processes including cell cycle regulation and signal transduction. Other members are neurotoxins that modulate neurotransmitter release by binding to specific receptors and forming pores in the plasma membrane, affecting synaptic transmission. These toxins exhibit specificity for either vertebrate or insect cells and can induce neurotransmitter exocytosis through both pore formation and receptor-mediated signaling pathways.
