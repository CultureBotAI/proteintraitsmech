identifier: PANTHER:PTHR45229
label: "CONSTITUTIVE ORNITHINE DECARBOXYLASE"
definition: >-
  This family is composed of ornithine decarboxylases (ODC), arginine decarboxylases (ADC) and lysine decarboxylases (LDC), and belongs to the pyridoxal phosphate (PLP)-dependent aspartate aminotransferase domain superfamily (fold I). These enzymes catalyse the decarboxylation of ornithine, arginine, or lysine, respectively using PLP as a co-factor. ODC is active as a dimer and catalyses the decarboxylation of tryptophan. ADC catalyses the decarboxylation of arginine and LDC catalyses the decarboxylation of lysine. The PLP combines with the alpha-amino acid to form a Schiff base, which acts as the substrate in the decarboxylation (COOH group removal) reaction. Pyridoxal phosphate (PLP) dependent enzymes were previously classified into alpha, beta and gamma classes, based on the chemical characteristics (carbon atom involved) of the reaction they catalysed. The availability of several structures allowed a comprehensive analysis of the evolutionary classification of PLP dependent enzymes, and it was found that the functional classification did not always agree with the evolutionary history of these enzymes. Structure and sequence analysis has revealed that the PLP dependent enzymes can be classified into four major groups of different evolutionary origin: aspartate aminotransferase superfamily (fold type I), tryptophan synthase beta superfamily (fold type II), alanine racemase superfamily (fold type III), D-amino acid superfamily (fold type IV) and glycogen phophorylase family (fold type V). For additional information please see.
definition_source: "InterPro:IPR011193 abstract (PANTHER PTHR45229 is a member signature)"
