  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the regulation of gene transcription related to motility and chemotaxis. One characterized member functions to modulate the transcription levels of flagellin and chemotaxis-related genes in a temporal manner, suggesting a role in the coordination of locomotion and sensory behaviors. Another member of this family contains WD repeats, which are typically associated with protein-protein interactions, but its specific function remains uncharacterized.
