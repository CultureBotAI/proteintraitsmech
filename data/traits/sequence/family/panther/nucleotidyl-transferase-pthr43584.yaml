identifier: PANTHER:PTHR43584
label: "NUCLEOTIDYL TRANSFERASE"
definition: >-
  This entry represents a family of prokaryotic proteins involved in the biosynthesis and recycling of bacterial cell wall components, such as Bifunctional protein GlmU, responsible for the formation of UDP-N-acetylglucosamine and N-acetylmuramate alpha-1-phosphate uridylyltransferase (MutU), which catalyses the formation of UDP-N-acetylmuramate, which are key precursors in peptidoglycan synthesis. Some family members play roles in peptidoglycan recycling, bypassing de novo synthesis pathways, contribute to intrinsic resistance to antibiotics like fosfomycin, and are involved in the synthesis of organic solutes in thermophilic microorganisms and the assembly of complex polysaccharides in bacterial surface structures.
definition_source: "InterPro:IPR050065 abstract (PANTHER PTHR43584 is a member signature)"
