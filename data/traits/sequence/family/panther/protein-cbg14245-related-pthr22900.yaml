identifier: PANTHER:PTHR22900
label: "PROTEIN CBG14245-RELATED"
definition: >-
  A chondroitin sulfate (CS) sulfotransferase has been identified in the nematode Caenorhabditis elegans, and has been named as chst-1 (CarboHydrate SulfoTransferase). This chondroitin 4-O-sulfotransferase plays an important role in protecting nematodes from oxidative stress.
