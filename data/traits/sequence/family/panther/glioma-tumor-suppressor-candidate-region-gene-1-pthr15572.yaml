definitions:
  - kind: GENERAL
    text: >-
      GLIOMA TUMOR SUPPRESSOR CANDIDATE REGION GENE 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15572. Members participate in positive regulation of DNA-templated transcription. Members localise to SWI/SNF complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes components of the SWI/SNF chromatin remodeling subcomplex GBAF, which is involved in modifying chromatin structure by altering DNA-histone contacts within a nucleosome in an ATP-dependent manner. These proteins may also be associated with BRD4-mediated gene transcription regulation. Additionally, a related protein is a part of the Mediator complex, acting as a coactivator in the transcription of RNA polymerase II-dependent genes by serving as a bridge between gene-specific regulatory proteins and the basal transcription machinery.
    source: "InterPro:IPR052438 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
