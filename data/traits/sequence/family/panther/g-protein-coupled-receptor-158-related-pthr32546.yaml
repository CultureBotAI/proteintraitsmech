identifier: PANTHER:PTHR32546
label: "G-PROTEIN COUPLED RECEPTOR 158-RELATED"
definition: >-
  This group includes orphan receptors GPR158, GPR158-like (also called GPR179) and similar proteins. These orphan receptors are closely related to the type B receptor for gamma-aminobutyric acid (GABA-B), which is activated by its endogenous ligand GABA, the principal inhibitory neurotransmitter. Both GPR179 and GPR158 were shown to recruit regulator of G protein signaling (RGS) complexes and thus regulate activity of other GPCRs. GPR158 has been suggested to act as a homeostatic regulator of intraocular pressure and could be a pharmacological target for managing ocular hypertension. It has been linked to prostate cancer growth and progression. It functions in cognition, stress-induced mood control, and synaptic development and it also serves as a novel regulator operating in the prefrontal cortex (PFC) that links chronic stress to depression. GPR158 has been recently described as metabotropic glycine receptor (mGlyR) through which glycine signals to inhibit production of the second messenger adenosine 3',5'-monophosphate. Glycine acts through this receptor and regulates neuronal excitability in cortical neurons. Structure determination of GPR158 revealed that it consists or an N-terminal extracellular domain that has a fold similar to Cache domains and a transmembrane domain, connected by a linker.
definition_source: "InterPro:IPR043458 abstract (PANTHER PTHR32546 is a member signature)"
