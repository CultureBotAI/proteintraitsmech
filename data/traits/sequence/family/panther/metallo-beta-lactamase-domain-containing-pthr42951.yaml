identifier: PANTHER:PTHR42951
label: "METALLO-BETA-LACTAMASE DOMAIN-CONTAINING"
definition: >-
  This entry includes Metallo-beta-lactamase type 2 from Klebsiella pneumoniae (NDM-1) and similar enzymes that share a common fold and metal-binding motif but can have different functions. NDM-1 confers resistance to the different beta-lactams antibiotics (penicillin, cephalosporin and carbapenem) via the hydrolysis of the beta-lactam ring, thereby conferring resistance. Some family members exhibit acyl-CoA thioesterase activity, catalysing the hydrolysis of acyl-CoAs to free fatty acids and CoASH, which may regulate intracellular levels of these molecules. Others are involved in the degradation of specific compounds, such as 2,4-dinitroanisole, or play roles in the biosynthesis of signalling molecules important for biofilm formation and virulence. The family also includes uncharacterised proteins that may have metallo-hydrolase activity.
definition_source: "InterPro:IPR050855 abstract (PANTHER PTHR42951 is a member signature)"
