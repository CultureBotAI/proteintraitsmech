identifier: PANTHER:PTHR30071
label: "HEME EXPORTER PROTEIN C"
definition: >-
  This family represents proteins involved in cytochrome c assembly in mitochondria, chloroplast and bacteria; including CcmC from Escherichia coli and CcsA from Chlamydomonas. CcsA is called ResC in Bacillus (where there is additional N-terminal sequence), while chloroplast proteins are consistently named CcsA. CcmC interacts directly with heme, and it is the only protein of the ccm operon that is strictly required for heme transfer. CcsA is required during biogenesis of c-type cytochromes at the step of heme attachment.
