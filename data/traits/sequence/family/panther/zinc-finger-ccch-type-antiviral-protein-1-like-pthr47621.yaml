identifier: PANTHER:PTHR47621
label: "ZINC FINGER CCCH-TYPE ANTIVIRAL PROTEIN 1-LIKE"
definition: >-
  Proteins in this family contain C3H1-type zinc fingers. However, despite their name, they do not contain a canonical C3H1-type zinc-finger. Their function is not clear.
