definitions:
  - kind: GENERAL
    text: >-
      ARF-GAP WITH DUAL PH DOMAIN-CONTAINING PROTEIN 1-LIKE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46021. Members are annotated with the molecular function GTPase activator activity, phosphatidylinositol binding, phosphatidylinositol phosphate binding. Members participate in regulation of GTPase activity. Members localise to intracellular membrane-bounded organelle, plasma membrane, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes GTPase-activating proteins (GAPs) for the ADP ribosylation factor family. Members are involved in modulating the activity of ADP ribosylation factors by accelerating the hydrolysis of GTP to GDP, thereby inactivating the GTPase function of these factors. These proteins are characterized by the presence of dual pleckstrin homology (PH) domains and exhibit lipid-binding properties. They interact with a variety of phosphoinositides, including phosphatidylinositol 3,4,5-trisphosphate (PtdInsP3) and inositol 1,3,4,5-tetrakisphosphate (InsP4), with some members also binding other phosphoinositides at lower affinities. The binding to InsP4 typically occurs with a stoichiometry of two binding sites per protein, both having identical affinity.
    source: "InterPro:IPR052589 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
