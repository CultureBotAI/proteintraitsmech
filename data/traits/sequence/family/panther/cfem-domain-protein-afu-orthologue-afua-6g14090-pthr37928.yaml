identifier: PANTHER:PTHR37928
label: "CFEM DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_6G14090)"
definition: >-
  This family of proteins includes GPI-anchored cell wall proteins and effectors with a CFEM domain, which is characterized by a unique helical-basket fold stabilized by disulfide bonds. The family members are involved in various functions related to fungal pathogenicity, including cell wall stabilization, heme-binding, and interactions with host proteins during infection. Some proteins in this family are known to suppress the host immune response or programmed cell death, aiding in the pathogen's evasion of host defenses. The CFEM domain's role in mediating these interactions highlights its significance in the virulence and survival of pathogenic fungi.
