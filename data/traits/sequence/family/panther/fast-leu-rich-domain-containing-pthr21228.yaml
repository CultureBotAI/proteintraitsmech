definitions:
  - kind: GENERAL
    text: >-
      FAST LEU-RICH DOMAIN-CONTAINING — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21228. PANTHER protein class: RNA processing factor. Members are annotated with the molecular function RNA binding, organic cyclic compound binding. Members participate in regulation of mRNA stability, mitochondrial RNA processing, regulation of cellular catabolic process. Members localise to ribonucleoprotein granule, mitochondrial matrix, membrane-bounded organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The FAST kinase family is involved in various aspects of mitochondrial RNA processing and stability, as well as mitochondrial respiration and translation. Members of this family play crucial roles in the biogenesis of mitochondrial-encoded mRNAs, regulating their abundance and half-lives. They are essential for the assembly and activity of mitochondrial respiratory complexes, such as complex I and IV, by stabilizing specific mRNAs like MT-ND3 and MT-CO1. Some members are also implicated in cell cycle progression and may influence mitochondrial apoptosis. Additionally, the RAP domain within these proteins is vital for RNA-binding and is necessary for their function in mRNA stability and translation. The family also includes proteins that regulate chloroplast RNA homeostasis and are involved in chloroplast development and defense responses.
    source: "InterPro:IPR050870 abstract (LLM-generated, not curator-reviewed)"
