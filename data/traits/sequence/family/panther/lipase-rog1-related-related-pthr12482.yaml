identifier: PANTHER:PTHR12482
label: "LIPASE ROG1-RELATED-RELATED"
definition: >-
  This entry represents a group of lipases, including Lipid droplet phospholipase 1 (Lpl1) and Rog1 from budding yeasts. This entry also includes some putative lipases, such as YDL109C/YDR444W from budding yeasts, C4A8.10 from fission yeasts and FAM135A/B from animals.
