identifier: PANTHER:PTHR44699
label: "IMMUNOGLOBULIN SUPERFAMILY MEMBER 11"
definition: >-
  Immunoglobulin superfamily member 11 (IGSF11), also known as Bt-IGSF, is a cell adhesion molecule that belongs to the immunoglobulin family. Its expression is highly restricted to brain and testis. In mice, it has been shown to regulate the development of the cerebellum and play a major role in male fertility.
