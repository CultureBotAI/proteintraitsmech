identifier: PANTHER:PTHR43979
label: "PRE-MRNA-PROCESSING FACTOR 17"
definition: >-
  Pre-mRNA splicing takes place by two consecutive trans-esterification reactions. In the first step, the border between the 5' exon and the intron is cleaved, whereas in the second step the 3' splice site is cleaved and the two exons are joined, creating a mature RNA. Pre-mRNA-processing factor 17 (Prp17) functions in the second step of pre-mRNA splicing. Prp17 may be part of the core NTC (NineTeen Complex), a spliceosomal subcomplex essential for spliceosome activation. Saccharomyces cerevisiae Prp17 is also known as cell division cycle CDC40, as it was first identified through a mutation that affects the mitotic and meiotic cell cycles. The Caenorhabditis elegans orthologue functions in meiotic entry and sex determination, indicating a role for pre-mRNA splicing in the regulation of these aspects.
definition_source: "InterPro:IPR032847 abstract (PANTHER PTHR43979 is a member signature)"
