identifier: PANTHER:PTHR35085
label: "KERATINOCYTE DIFFERENTIATION FACTOR 1"
definition: >-
  KDF1 plays a role in the regulation of the epidermis formation during early development. It is required both as an inhibitor of basal cell proliferation and a promoter of differentiation of basal progenitor cell progeny.
