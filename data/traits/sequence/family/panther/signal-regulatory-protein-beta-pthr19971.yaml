  - kind: GENERAL
    text: >-
      This family of proteins includes immunoglobulin-like cell surface receptors that are involved in various cellular processes such as negative regulation of receptor tyrosine kinase-coupled signaling, cell adhesion, neurite outgrowth, and immune responses. Members act as docking proteins, mediating translocation of phosphatases to the plasma membrane and participating in the formation of signaling complexes. They play roles in synaptogenesis, synaptic function, and the negative regulation of phagocytosis, mast cell activation, and dendritic cell activation. Some family members are involved in antiviral immunity by limiting virus internalization. They also interact with thrombospondins, which can stimulate phosphorylation and ROS production in response to external stimuli.
    source: "InterPro:IPR051755 abstract (LLM-generated, not curator-reviewed)"
