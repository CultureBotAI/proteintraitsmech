  - kind: GENERAL
    text: >-
      The nuclear hormone receptor family in Caenorhabditis elegans includes orphan nuclear receptors that are implicated in various metabolic and physiological processes. While the specific functions of some members are not well characterized, at least one member, nhr-62, is known to play a role in the metabolic and physiological adaptations to dietary restriction, which contributes to longevity. This receptor is involved in modulating triglyceride and lipid metabolism as well as autophagy through the regulation of gene transcription. Other members of the family are similarly expected to function as transcriptional regulators, although their target genes and the pathways they influence remain to be fully elucidated.
