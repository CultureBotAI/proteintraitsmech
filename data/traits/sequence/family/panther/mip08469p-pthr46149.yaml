  - kind: GENERAL
    text: >-
      The RasD family proteins are small GTPases involved in various signaling pathways. Members of this family, such as the dexamethasone-induced Ras-related protein 1 and GTP-binding protein Rhes, play roles in the regulation of transcription and signal transduction. They are known to interact with components like the APBB1/FE65-APP complex, negatively regulating its transcriptional activity. Additionally, they are involved in G-protein-coupled receptor signaling and interact with heterotrimeric proteins, influencing functions such as locomotor activity and motor coordination, particularly within the striatum.
