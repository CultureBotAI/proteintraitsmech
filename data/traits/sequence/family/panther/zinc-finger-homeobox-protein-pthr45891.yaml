definitions:
  - kind: GENERAL
    text: >-
      ZINC FINGER HOMEOBOX PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45891. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
