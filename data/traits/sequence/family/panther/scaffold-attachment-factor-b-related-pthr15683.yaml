definitions:
  - kind: GENERAL
    text: >-
      SCAFFOLD ATTACHMENT FACTOR B-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15683. Members are annotated with the molecular function sequence-specific DNA binding, organic cyclic compound binding, DNA binding. and participate in regulation of macromolecule metabolic process, regulation of nucleobase-containing compound metabolic process, regulation of DNA-templated transcription. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
