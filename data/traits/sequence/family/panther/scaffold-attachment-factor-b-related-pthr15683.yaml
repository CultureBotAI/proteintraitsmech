  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of gene expression and cellular proliferation. Members bind to scaffold/matrix attachment region (S/MAR) DNA, which is crucial for the formation of a complex that couples transcription and RNA processing. Some act as corepressors for estrogen receptors and can negatively regulate cell proliferation by binding to certain promoters and modulating their transcription. Additionally, these proteins may play a role in apoptosis when overexpressed. One member is implicated in muscle development and lifespan determination in a nematode model.
    source: "InterPro:IPR051738 abstract (LLM-generated, not curator-reviewed)"
