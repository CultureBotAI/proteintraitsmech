identifier: PANTHER:PTHR22669
label: "DELTA/SERRATE/LAG-2 DOMAIN PROTEIN"
definition: >-
  Lag2 from Caenorhabditis elegans is a putative intercellular signal for lin-12 and GLP-1 receptors. It is involved in the mediation of Notch signaling. This entry also includes Dsl-1 that works redundantly with Lag-2, Apx-1 and Osm-11. Homologues are mainly found in nematodes from the order Rhabditida.
