      DISULFIDE OXIDOREDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22912. PANTHER protein class: oxidoreductase. Members are annotated with the molecular function flavin adenine dinucleotide binding, oxidoreductase activity, acting on a sulfur group of donors. Members participate in monocarboxylic acid metabolic process, dicarboxylic acid metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
