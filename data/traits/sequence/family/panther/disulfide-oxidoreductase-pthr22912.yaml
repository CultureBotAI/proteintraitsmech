      DISULFIDE OXIDOREDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22912. PANTHER protein class: oxidoreductase. Members are annotated with the molecular function nucleoside phosphate binding, flavin adenine dinucleotide binding, oxidoreductase activity, acting on a sulfur group of donors. and participate in dicarboxylic acid metabolic process, monocarboxylic acid metabolic process.
