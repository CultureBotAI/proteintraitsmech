identifier: PANTHER:PTHR47569
label: "NO-ASSOCIATED PROTEIN 1, CHLOROPLASTIC/MITOCHONDRIAL"
definition: >-
  This entry represents a group of plant cGTPases, including AtNOA1 from Arabidopsis and OsNOA1 (Os02g01440) from rice. They share homology with bacterial protein YqeH, a circularly permuted GTPase (cGTPase). AtNOA1 (also known as RIF1) has GTPase activity and targets chloroplasts. It is essential for proper chloroplast ribosome assembly and/or translation in plants.
definition_source: "InterPro:IPR044229 abstract (PANTHER PTHR47569 is a member signature)"
