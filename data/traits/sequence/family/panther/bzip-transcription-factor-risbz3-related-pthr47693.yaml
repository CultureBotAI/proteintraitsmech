identifier: PANTHER:PTHR47693
label: "BZIP TRANSCRIPTION FACTOR RISBZ3-RELATED"
definition: >-
  This entry includes a group of plant bZIP transcription factors, including RISBZ3/4/5 from rice. RISBZ1 has been shown to interact with the GCN4 motif and affect the expression of storage protein genes.
