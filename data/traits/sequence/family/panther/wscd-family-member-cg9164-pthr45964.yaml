identifier: PANTHER:PTHR45964
label: "WSCD FAMILY MEMBER CG9164"
definition: >-
  This family of proteins includes enzymes that function as sialate:O-sulfotransferases. These enzymes are responsible for catalyzing the 8-O-sulfation of Sia-glycans using 3'-phosphoadenosine 5'-phosphosulfate (PAPS) as a sulfate donor. The resulting 8-O-sulfated Sia (Sia8S)-glycans have implications in various biological processes, including cell-cell communication and pathogen interaction. Members of this family share a common enzymatic activity despite being found across different species, indicating a conserved function in glycan modification.
