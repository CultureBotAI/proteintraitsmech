identifier: PANTHER:PTHR20916
label: "CYSTEINE AND GLYCINE-RICH PROTEIN 2 BINDING PROTEIN"
definition: >-
  CYSTEINE AND GLYCINE-RICH PROTEIN 2 BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR20916. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 6 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, histone acetyltransferase activity, N-acetyltransferase activity.
