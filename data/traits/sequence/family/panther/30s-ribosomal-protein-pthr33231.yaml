definitions:
  - kind: GENERAL
    text: >-
      30S RIBOSOMAL PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33231. PANTHER protein class: ribosomal protein, translational protein. Members are annotated with the molecular function ribosome binding, protein-containing complex binding, binding. and participate in negative regulation of translation, regulation of macromolecule metabolic process, regulation of cellular process. and localise to cytoplasm, cytosolic ribosome, small ribosomal subunit.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The HPF/YfiA ribosome-associated protein family is involved in the regulation of ribosome activity, particularly during stationary phase and under stress conditions. Members of the family promote the dimerization of active 70S ribosomes into inactive 100S ribosomes, which conserves energy when cell growth is not favored. Some members prevent 70S dimer formation, stabilizing ribosomes against dissociation, inhibiting translation initiation, and increasing translation accuracy. This regulation of ribosome activity is crucial for bacterial adaptation to environmental changes, ensuring efficient use of resources and survival during periods of stress or nutrient limitation. Additionally, certain members of the family have been implicated in the modulation of transcription and translation, as well as in immune responses by stimulating cytokine secretion through the TLR2 signaling pathway.
    source: "InterPro:IPR050574 abstract (LLM-generated, not curator-reviewed)"
