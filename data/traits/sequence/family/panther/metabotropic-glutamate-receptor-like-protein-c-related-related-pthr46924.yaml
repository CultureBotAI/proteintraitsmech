    text: >-
      This family of proteins includes metabotropic glutamate receptor-like proteins that are characterized by a dual domain architecture. The N-terminal section is similar to the BMP lipoprotein family, which may suggest a role in signaling or cellular communication. The C-terminal section is akin to the G-protein coupled receptor 3 family, specifically the GABA-B receptor subfamily, indicating a potential involvement in G-protein coupled receptor signaling pathways. These proteins may have functions related to development and differentiation, as suggested by annotations indicating a role in terminal differentiation and as a negative regulator during development.
