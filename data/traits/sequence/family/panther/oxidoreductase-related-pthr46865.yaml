  - kind: GENERAL
    text: >-
      This family of proteins includes flavin-dependent monooxygenases involved in various biological processes, including antibiotic resistance and biosynthesis of complex natural products. Members of this family catalyze the hydroxylation of aromatic rings, a reaction that typically requires FAD and NADPH as cofactors. These enzymes play roles in the inactivation of tetracycline antibiotics, contributing to antibiotic resistance, and are also involved in the biosynthesis of meroterpenoids with potential pharmacological activities, such as antitumor agents and inhibitors of the human GABAA receptor. The proteins contain a conserved N-terminal FAD-binding domain with a Rossman fold and a substrate-binding domain, which are essential for their monooxygenase activity.
    source: "InterPro:IPR051704 abstract (LLM-generated, not curator-reviewed)"
