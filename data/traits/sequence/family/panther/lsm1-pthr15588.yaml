identifier: PANTHER:PTHR15588
label: LSM1
definition: >-
  This entry represents Sm-like protein Lsm1 and Lsm8. Lsm8 is found in the nuclear Lsm2-8 complex, which associates with multiple snRNP complexes containing the U6 snRNA (U4/U6 snRNP, U4/U6.U5 snRNP, and free U6 snRNP). The Lsm2-8 complex binds and stabilizes the 3'-terminal poly(U) tract of U6 snRNA and facilitates the assembly of U4-U6 di-snRNP and U4-U6-U5 tri-snRNP. Lsm1 can be found in the cytoplasmic Lsm1-7 complex, which associates with deadenylated mRNA and promotes decapping in the 5'-3' mRNA decay pathway. The Sm and the Lsm proteins, characterised by the Sm-domain, have RNA-related functions. The Sm heptamer ring associates with four (U1, U2, U4, U5) snRNPs, while Lsm2-8 heptamer is part of the U6 snRNP. Another Lsm heptameric complex, Lsm1-7, which differs from Lsm2-8 by one Lsm protein, functions in mRNA decapping, a crucial step in the mRNA degradation pathway.
