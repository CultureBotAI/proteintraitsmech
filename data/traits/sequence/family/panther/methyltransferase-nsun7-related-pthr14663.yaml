identifier: PANTHER:PTHR14663
label: "METHYLTRANSFERASE NSUN7-RELATED"
definition: >-
  SUN7 plays a role in sperm motility. In contrast to other NSUN family members, NSUN7 lacks RNA cytosine C5-methyltransferase activity due to sequence variations in S-adenosyl-L-methionine (SAM)-binding residues. Substitution of the conserved SAM-binding Asp-378 with Leu-378 abolishes SAM binding and likely renders the enzyme catalytically inactive.
