  - kind: GENERAL
    text: >-
      The RNA methyltransferase family is characterized by its members' ability to catalyze the methylation of ribose in various ribosomal RNA (rRNA) molecules, utilizing S-adenosyl-L-methionine (SAM) as the methyl donor. These enzymes are responsible for the post-transcriptional modification of rRNA, which is a conserved process essential for the proper function of the ribosome. The modifications typically occur at specific positions within the rRNA, contributing to the fine-tuning of ribosome structure and function, and in some cases, conferring resistance to certain antibiotics. Members of the family are part of the class IV-like SAM-binding methyltransferase superfamily and include both mitochondrial rRNA methyltransferases, which modify mitochondrial large subunit rRNA, and bacterial 23S rRNA methyltransferases, which target the bacterial large subunit rRNA and are associated with antibiotic resistance.
    source: "InterPro:IPR051259 abstract (LLM-generated, not curator-reviewed)"
