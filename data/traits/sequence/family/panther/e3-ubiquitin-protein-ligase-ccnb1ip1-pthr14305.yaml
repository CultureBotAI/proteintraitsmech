identifier: PANTHER:PTHR14305
label: "E3 UBIQUITIN-PROTEIN LIGASE CCNB1IP1"
definition: >-
  CCNB1IP1, also knwon as HEI10, is a RING finger protein and a E3 ubiquitin ligase that functions in mitotic progression through regulation of cyclin B levels. It is found to both interact with an ubiquitin conjugating enzyme, and to induce its own auto-ubiquitination in vitro. HEI10 interacts with Merlin tumor suppressor protein and regulates cancerous cell migration and invasion.
