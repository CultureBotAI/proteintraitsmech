identifier: PANTHER:PTHR46687
label: "PROTEIN DISPATCHED HOMOLOG 3"
definition: >-
  The protein dispatched homolog 3 (DISP3) is a sterol-sensing domain-containing protein that promotes cell proliferation and alters expression of genes that are involved in tumorigenesis. It has also been shown to influence neural stem cell fate decisions.
