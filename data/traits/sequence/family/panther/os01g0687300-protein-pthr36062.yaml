identifier: PANTHER:PTHR36062
label: "OS01G0687300 PROTEIN"
definition: >-
  This entry represents Protein PHOTOPERIODIC CONTROL OF HYPOCOTYL 1 (also known as PCH1At2g16365) and its homologues including Protein PHOTOPERIODIC CONTROL OF HYPOCOTYL 1-LIKE (PCHL). Both PCH1 and its homologue, PCHL suppress phyB dark reversion, resulting in plants with dramatically enhanced light sensitivity. In plants, a photoreceptor called phytochrome B (phyB) responds to red light and regulates the ability of plants to grow. PCH1 regulates photoperiod-responsive growth by integrating the plant clock with light perception pathways. PCH1 stabilizes the structure of phyB so that it remains active, even in the dark. This prolonged activity acts as a molecular memory of prior exposure to light and helps to prevent plants from growing too much in the winter, when there are fewer hours of daylight. PCH1 is also found in other species of plants.
definition_source: "InterPro:IPR037476 abstract (PANTHER PTHR36062 is a member signature)"
