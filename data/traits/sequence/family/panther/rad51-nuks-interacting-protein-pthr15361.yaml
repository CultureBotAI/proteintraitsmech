definitions:
  - kind: GENERAL
    text: >-
      RAD51/NUKS-INTERACTING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15361. Members are annotated with the molecular function double-stranded DNA binding, single-stranded DNA binding. and participate in cellular aromatic compound metabolic process, double-strand break repair, interstrand cross-link repair.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in DNA repair mechanisms, specifically through the promotion of homologous recombination. Members of this family exhibit structure-specific DNA-binding properties and are known to enhance the formation of DNA joint molecules, such as D-loops, which are critical intermediates in DNA repair and recombination processes. They interact with RAD51 and DMC1 recombinases to facilitate the search for homology and strand pairing during repair. Some members also have roles in the alternative lengthening of telomeres (ALT) pathway, which is significant in certain cancers. Additionally, they may cooperate with other proteins like WDR48/UAF1 to modulate the activity of enzymes involved in DNA repair, such as USP1-mediated deubiquitination of FANCD2. While some members show a strong preference for branched DNA structures, others bind with less affinity, indicating a range of DNA-binding properties within the family.
    source: "InterPro:IPR052003 abstract (LLM-generated, not curator-reviewed)"
