identifier: PANTHER:PTHR45995
label: "Peptidyl-prolyl cis-trans isomerase PIN4"
definition: >-
  PIN4, also known as Par14, is a member of the parvulin family of peptidyl-prolyl cis-trans isomerases. It is involved in rRNA processing, microtubule formation and the glucose metabolism. It also binds DNA and associates with chromatin.
