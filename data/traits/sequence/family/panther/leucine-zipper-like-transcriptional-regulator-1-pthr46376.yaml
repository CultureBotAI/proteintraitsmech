identifier: PANTHER:PTHR46376
label: "LEUCINE-ZIPPER-LIKE TRANSCRIPTIONAL REGULATOR 1"
definition: >-
  The LZTR1/Attractin family includes proteins that are involved in various cellular processes. LZTR1 proteins act as substrate-specific adapters for BCR E3 ubiquitin-protein ligase complexes, targeting Ras proteins for ubiquitination and thereby negatively regulating RAS-MAPK signalling. This function is crucial for controlling Ras levels and membrane association, impacting cell growth and differentiation. Attractin and its homologues, on the other hand, are implicated in immune response, chemotactic activity of chemokines, melanocortin signalling pathways, energy homeostasis, hair color, and myelination in the central nervous system. They may also serve as low-affinity receptors for agouti.
