    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in the degradation of complex polysaccharides. Members of this family are characterized by their ability to hydrolyze specific glycosidic bonds within their respective substrates. Some act on unsaturated rhamnogalacturonan disaccharides, releasing unsaturated D-galacturonic acid and L-rhamnose, while others are involved in the breakdown of ulvan, a major component of green seaweed cell walls. These enzymes preferentially cleave unsaturated 4-deoxy-L-threo-hex-4-enopyranosiduronic acid in various oligosaccharide configurations, aiding in the complete degradation of the ulvan polymer. The family also includes proteins that may regulate bacterial surface properties in response to plant cell presence.
    source: "InterPro:IPR052043 abstract (LLM-generated, not curator-reviewed)"
