identifier: PANTHER:PTHR44054
label: "SYNAPTIC VESICLE MEMBRANE PROTEIN VAT-1 HOMOLOG-LIKE"
definition: >-
  This entry includes NADPH-dependent quinone oxidoreductase VAT1 and related proteins. Members of this family exhibit ATPase activity and are involved in cellular processes such as calcium-regulated keratinocyte activation during epidermal repair mechanisms. They do not influence cell proliferation but are implicated in the negative regulation of mitochondrial fusion, often in cooperation with mitofusin proteins. Additionally, these proteins may play a central role in the functions mediated by specific classes of synaptic vesicles.
