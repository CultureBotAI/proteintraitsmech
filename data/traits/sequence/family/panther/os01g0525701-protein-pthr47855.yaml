  - kind: GENERAL
    text: >-
      The DVL/RTFL small polypeptides family consists of regulatory molecules that play a crucial role in coordinating cellular responses essential for plant differentiation, growth, and development. Members of this family are involved in modulating processes such as polar cell proliferation in lateral organs and the recruitment and differentiation of socket cells at trichome sites. They are implicated in determining leaf shape, pedicule elongation, inflorescence organization, and fruit maturation, ensuring proper plant form and reproductive success.
