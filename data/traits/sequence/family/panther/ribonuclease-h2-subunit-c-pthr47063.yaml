identifier: PANTHER:PTHR47063
label: "RIBONUCLEASE H2 SUBUNIT C"
definition: >-
  The RNase H2 subunit C family comprises non-catalytic subunits of the RNase H2 complex, an endonuclease that degrades RNA in RNA:DNA hybrids. The family plays a crucial role in DNA replication by potentially facilitating the removal of RNA primers from Okazaki fragments on the lagging strand. Additionally, it is involved in the repair process by excising single ribonucleotides embedded in DNA:RNA duplexes, maintaining genomic stability.
