identifier: PANTHER:PTHR24350
label: "SERINE/THREONINE-PROTEIN KINASE IAL-RELATED"
definition: >-
  Aurora kinase was discovered by Glover and colleagues in a screen for genes required to maintain the centrosome cycle in Drosophila. Its yeast homologue Ipl1 (also known as spindle assembly checkpoint kinase) was found to regulate chromosome segregation. Subsequently, three mammal Aurora kinases, Aurora A, B and C, have been identified. They are highly conserved serine/threonine kinases that regulate chromosomal alignment and segregation during mitosis and meiosis. They all contain a protein kinase domain and a destruction box (D-box) recognised by the multi-subunit E3-ubiquitin ligase anaphase promoting complex/cyclosome (APC/C), which mediates their proteasomal degradation. However, their N-terminal domains share little sequence identity and confer unique protein-protein interaction abilities among the Aurora kinases.
definition_source: "InterPro:IPR030616 abstract (PANTHER PTHR24350 is a member signature)"
