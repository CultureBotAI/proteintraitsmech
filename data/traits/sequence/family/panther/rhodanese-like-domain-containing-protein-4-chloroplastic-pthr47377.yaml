identifier: PANTHER:PTHR47377
label: "RHODANESE-LIKE DOMAIN-CONTAINING PROTEIN 4, CHLOROPLASTIC"
definition: >-
  This entry represents a group of rhodanese-like domain-containing proteins from plants and bacteria, including AtStr4 from Arabidopsis. AtStr4 (also known as TROL, thylakoid rhodanese-like protein) is a nuclear-encoded component of thylakoid membranes that is required for tethering of FNR (ferredoxin-NADP(+) oxidoreductase) and sustaining efficient linear electron flow (LEF) in vascular plants.
