identifier: PANTHER:PTHR33932
label: "NA(+)/H(+) ANTIPORTER SUBUNIT B"
definition: >-
  The CPA3 antiporter subunit B family comprises proteins that function as Na(+)/H(+) antiporters involved in the excretion of sodium ions. These antiporters are part of larger complexes, such as the Mnh complex in various Staphylococcus species and the Mrp complex in Bacillus subtilis, which play significant roles in Na(+) resistance and pH homeostasis. The antiport activity is electrogenic, consuming a transmembrane electrical potential to transport Na(+) in exchange for H(+), and is inhibited by CCCP. While primarily transporting Na(+), some family members also transport Li(+) but not K(+), Ca(2+), or Mg(2+). The antiporters are essential for maintaining intracellular pH and sodium ion concentration, especially under alkaline conditions or high external Na(+) concentrations.
