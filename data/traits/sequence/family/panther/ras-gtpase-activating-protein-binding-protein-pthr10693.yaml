identifier: PANTHER:PTHR10693
label: "RAS GTPASE-ACTIVATING PROTEIN-BINDING PROTEIN"
definition: >-
  This entry represents proteins with an N-terminal NTF2 (nuclear transport factor 2) domain and a C-terminal RRM (RNA recognition motif) domain. It includes mammalian ATP- and magnesium-dependent helicase Ras GTPase-activating protein-binding proteins 1 and 2 and UBP3-associated protein Bre5 from yeast, which is a co-factor required for de-ubiquitination. This entry also includes AtMBD6 from Arabidopsis. AtMBD6 maintains gene silencing in Arabidopsis by interacting with RNA binding proteins.
