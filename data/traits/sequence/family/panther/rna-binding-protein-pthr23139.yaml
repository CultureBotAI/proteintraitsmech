identifier: PANTHER:PTHR23139
label: "RNA-BINDING PROTEIN"
definition: >-
  RNA-BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23139. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 14 of its annotated subfamilies. Subfamilies are annotated with the molecular function single-stranded RNA binding, pre-mRNA binding. Subfamilies participate in mRNA splicing, via spliceosome, spliceosomal complex assembly, gene expression. Subfamilies localise to nuclear speck, U2-type prespliceosome, nucleus.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
