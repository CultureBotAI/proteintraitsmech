identifier: PANTHER:PTHR43793
label: "FAD SYNTHASE"
definition: >-
  The archaeal FAD synthase family comprises enzymes that catalyze the transfer of the AMP portion of ATP to flavin mononucleotide (FMN) to produce the essential coenzyme flavin adenine dinucleotide (FAD). This reaction is crucial for various biological processes as FAD is a key molecule in redox reactions, playing a pivotal role in metabolism and energy production. Members of this family are characterized by their ability to utilize ATP as a substrate, although some can also use other nucleotides such as CTP and GTP, resulting in the formation of modified coenzymes. The family is inhibited by the product PPi and does not catalyze the reverse reaction. These enzymes are essential for the proper functioning of archaeal organisms, contributing to their adaptability and survival in diverse environments.
