identifier: PANTHER:PTHR15402
label: "TRANSCRIPTION FACTOR-LIKE 5 PROTEIN"
definition: >-
  This family includes a group of mammalian proteins involved in germline differentiation, including TCFL5, Spermatogenesis- and oogenesis-specific basic helix-loop-helix-containing protein 1/2 (SOLH1/2). TCFL5 is a transcription factor that interacts with the Calmegin gene promoter in mouse spermatogenesis. SOLH1/2 are transcription regulators of both male and female germline differentiation. They suppress genes involved in spermatogonial stem cells maintenance, and induces genes important for spermatogonial differentiation. They also coordinates oocyte differentiation without affecting meiosis I.
