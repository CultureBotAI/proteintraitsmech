label: "HOMEOBOX PROTEIN HOX-A11-RELATED"
definition: >-
  HOMEOBOX PROTEIN HOX-A11-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46092. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II, anatomical structure development. Members localise to nucleus, intracellular anatomical structure.
