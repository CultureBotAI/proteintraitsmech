identifier: PANTHER:PTHR37937
label: "CONJUGATIVE TRANSFER: DNA TRANSPORT"
definition: >-
  This family of proteins is involved in the conjugative transfer of plasmid DNA between bacterial cells, a process central to the propagation of antibiotic resistance and virulence factors. Members of this family are known to interact with relaxase enzymes and may form a pore-like structure to facilitate the transfer of single-stranded DNA through a type IV secretion system. Some proteins within this family are also implicated in the subversion of human endothelial cell function, leading to various cellular responses such as cytoskeletal rearrangements, pro-inflammatory activation, and inhibition of apoptosis.
