identifier: PANTHER:PTHR15944
label: "FARNESYLCYSTEINE LYASE"
definition: >-
  This entry represents prenylcysteine oxidases (also known as prenylcysteine lyases) and homologues that are predicted to have the same function. The human enzyme is part of the lysosome and functions in the degradation of prenylated proteins, cleaving the thioether bond of prenyl-L-cysteines, such as farnesylcysteine and geranylgeranylcysteine. More recently, prenylcysteine oxidase 1 (PCYOX1) has been found in apoB100-containing lipoproteins, having pro-oxidant activity. It may contribute to development of atherosclerosis, as it is able to generate reactive oxygen species (ROS) and, therefore, contribute lipoproteins oxidation.
definition_source: "InterPro:IPR017046 abstract (PANTHER PTHR15944 is a member signature)"
