  - kind: GENERAL
    text: >-
      The Formin Homology protein family is involved in the regulation of the actin cytoskeleton, playing a crucial role in actin nucleation and the formation of linear actin filaments. Members of this family interact with Rho GTPases and are important for processes such as cell migration, filopodia formation, and the establishment of cell polarity. They participate in signaling pathways like the Wnt pathway, influencing developmental processes including dorsal patterning, left/right symmetry, and myocardial maturation. Some members act as scaffolding proteins, linking signaling molecules to the actin cytoskeleton, and are involved in the formation and maintenance of cilia and the organization of the subapical actin network in multiciliated cells. The family's domains, such as the FH2 and DAD domains, are key to their function, with the DAD domain regulating activation through autoinhibitory interactions that are relieved upon binding of activated GTPases, allowing actin filament elongation.
    source: "InterPro:IPR051425 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
