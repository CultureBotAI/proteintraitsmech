identifier: PANTHER:PTHR45819
label: CENTAURIN-GAMMA-1A
definition: >-
  This family of proteins includes GTPase-activating proteins (GAPs) for the ADP ribosylation factor family, which are involved in various cellular processes such as the regulation of the adapter protein-dependent trafficking in the endosomal-lysosomal system and the prevention of neuronal apoptosis. Some members may enhance PI3 kinase activity, mediate anti-apoptotic effects, or be involved in neurogenesis by controlling endocytosis. The GAP activity of these proteins is often regulated by phosphoinositides and can be stimulated by oxidative stress or other factors.
