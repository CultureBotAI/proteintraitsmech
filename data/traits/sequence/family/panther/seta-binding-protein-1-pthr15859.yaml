identifier: PANTHER:PTHR15859
label: "SETA BINDING PROTEIN 1"
definition: >-
  This entry includes two closely related human proteins SHKBP1 (also known as SETA-binding protein 1) and Potassium Channel Tetramerization Domain Containing protein 3 (KCTD3), which correspond to group D of KCTD family. The complete biological role of SHKBP1 has not yet been characterised, however, it has been associated with tumorigenesis. It interacts with cathepsin B and participates in tumor necrosis factor (TNF)-induced apoptosis in ovarian cancer cells. It binds to SH3 domains of the SETA adapter protein, whose overexpression is related to brain tumours. KCTD3 has been associated with neurogenetic and neurodevelopmental disorders. It is an accessory subunit of potassium/sodium hyperpolarization-activated cyclic nucleotide-gated channel 3 (HCN3) as it interacts and increases its stability and cell surface expression.
