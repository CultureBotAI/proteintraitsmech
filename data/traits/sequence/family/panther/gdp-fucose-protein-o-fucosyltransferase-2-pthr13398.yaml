identifier: PANTHER:PTHR13398
label: "GDP-FUCOSE PROTEIN O-FUCOSYLTRANSFERASE 2"
definition: >-
  Protein O-fucosylation is a post-translational modification found on serine/threonine residues of thrombospondin type 1 repeats (TSR). The fucose transfer is catalysed by the protein O-fucosyltransferase 2 (POFUT2). POFUT2 is required for the proper secretion of ADAMTS (a disintegrin and metalloproteinase with thrombospondin type 1 repeats) family members such as ADAMSL1 and ADAMST13.
