label: "INTEGRIN ALPHA"
definition: >-
  INTEGRIN ALPHA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23220. PANTHER protein class: cell adhesion molecule, integrin. Members are annotated with the molecular function integrin binding. Members participate in integrin-mediated signaling pathway, cell-matrix adhesion, cell adhesion mediated by integrin. Members localise to plasma membrane signaling receptor complex, external side of plasma membrane, membrane.
