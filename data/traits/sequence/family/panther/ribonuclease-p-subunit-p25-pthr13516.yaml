  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in nucleic acid binding and processing. Some members have been characterized to bind DNA and RNA with relaxed sequence specificity, and are associated with subtelomeric repeats. Others are known to be components of ribonucleoprotein complexes such as ribonuclease P and MRP ribonuclease complex, which are involved in the generation of mature tRNA molecules by cleaving their 5'-ends and in the cleavage of pre-rRNA sequences, respectively. The functions of these proteins suggest a role in the regulation of gene expression at both transcriptional and post-transcriptional levels.
