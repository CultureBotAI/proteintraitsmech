  - kind: GENERAL
    text: >-
      The EMX homeobox family comprises transcription factors involved in the development of the central nervous system, particularly in specifying cell fates and regional identities within the brain. Members of the family, such as EMX1 and EMX2, cooperate to delineate boundaries in the developing brain, like the division between the roof and archipallium. VAX1 and VAX2 proteins contribute to dorsoventral specification of the forebrain, optic nerve differentiation, and eye development. NOTO proteins play a role in notochord formation, cilia formation in the posterior notochord, and left-right patterning. The family is characterized by the presence of a homeobox domain, indicative of their role in gene regulation during embryonic development. They are also involved in major tract formation in the forebrain, regulation of Wnt signaling, and axial polarization in the retina.
    source: "InterPro:IPR050877 abstract (LLM-generated, not curator-reviewed)"
