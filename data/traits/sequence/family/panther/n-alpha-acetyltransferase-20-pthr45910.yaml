identifier: PANTHER:PTHR45910
label: "N-ALPHA-ACETYLTRANSFERASE 20"
definition: >-
  This family of proteins functions as the catalytic subunit of the NatB N-terminal acetyltransferase complex. Members are responsible for the acetylation of N-terminal methionine residues in nascent polypeptides that start with certain amino acids, including aspartate, glutamate, asparagine, and glutamine. This modification can influence the stability, localization, and function of the proteins. In some species, these proteins are involved in the regulation of actomyosin fibers, cellular migration, and cell cycle. Additionally, in plants, they play a role in immunity through the regulation of specific protein stability.
