identifier: PANTHER:PTHR23006
label: "GLUTAMATE-RICH PROTEIN 5"
definition: >-
  This entry represents a group of uncharacterised proteins, including glutamate-rich protein 5. Glutamate-rich protein 5, also known as ERICH5, is a protein in humans encoded by the ERICH5 gene, which is located on chromosome 8 at position 8q22.2.
