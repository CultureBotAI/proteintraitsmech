identifier: PANTHER:PTHR45721
label: "LAMIN DM0-RELATED"
definition: >-
  LAMIN DM0-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45721. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 14 of its annotated subfamilies. Subfamilies are annotated with the molecular function structural constituent of cytoskeleton. Subfamilies participate in heterochromatin formation, nuclear migration, nucleus organization. Subfamilies localise to nucleus, nuclear lumen, nuclear envelope.
