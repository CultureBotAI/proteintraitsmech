  - kind: GENERAL
    text: >-
      This family of proteins includes cytokines that are members of the tumor necrosis factor (TNF) superfamily. These proteins are known to interact with the TNFRSF8/CD30 receptor, which is expressed on the surface of certain T-cells. The primary function of these proteins is to induce the proliferation of T-cells, which plays a critical role in the immune response. The interaction with their receptor is important for the regulation of apoptosis and immune response modulation.
