  - kind: GENERAL
    text: >-
      The YjjX NTPase family consists of enzymes that play a crucial role in maintaining the fidelity of nucleotide pools by hydrolyzing non-canonical purine nucleotides such as XTP and ITP to their respective diphosphate derivatives. By doing so, the family members prevent the incorporation of these non-canonical purines into DNA and RNA, thereby avoiding potential chromosomal lesions that could arise from their presence. Some members of the family also exhibit bifunctional activity, including the reversible adenylyl transfer from ATP to 4'-phosphopantetheine, contributing to CoA biosynthesis. The family's enzymatic action is essential for genomic stability and proper cellular metabolism.
    source: "InterPro:IPR050299 abstract (LLM-generated, not curator-reviewed)"
