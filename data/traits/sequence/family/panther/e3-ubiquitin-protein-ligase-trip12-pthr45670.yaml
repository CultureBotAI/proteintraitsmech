identifier: PANTHER:PTHR45670
label: "E3 UBIQUITIN-PROTEIN LIGASE TRIP12"
definition: >-
  This entry includes a group of E3 ubiquitin-protein ligases, including HECTD1/TRIP12 from humans, Ufd4 from budding yeasts and UPL3/4 from Arabidopsis. HECTD1 regulates intracellular localisation and secretion of Hsp90 and is essential for the correct development of the cranial neural folds and neural tube closure. TRIP12 is involved in the ubiquitin fusion degradation pathway and regulation of DNA repair, ]. This protein plays an important role in nervous system development and function. UPL3 is involved in ubiquitination and subsequent proteasomal degradation of target proteins and in the repression of the endoreduplication process and the cell morphogenesis in the trichomes.
