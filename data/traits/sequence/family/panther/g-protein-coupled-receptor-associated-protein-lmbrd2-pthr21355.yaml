    text: >-
      This family of proteins is associated with G-protein coupled receptors (GPCRs) and is implicated in the regulation of downstream signaling pathways. Members of this family are known to interact with specific GPCRs, such as the beta-2 adrenergic receptor and the type-1 angiotensin II receptor, and can negatively regulate signaling pathways initiated by these receptors. The regulatory function of these proteins suggests a role in modulating receptor-mediated cellular responses.
