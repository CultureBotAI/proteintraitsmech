identifier: PANTHER:PTHR42210
label: "DNA POLYMERASE II LARGE SUBUNIT"
definition: >-
  This family represents the large subunit, DP2, of a two subunit novel archaebacterial replicative DNA polymerase first characterised for Pyrococcus furiosus. The orthologue from Methanococcus jannaschii has also been characterised.
