identifier: PANTHER:PTHR14964
label: "NUCLEAR RECEPTOR BINDING FACTOR 2"
definition: >-
  Nuclear receptor-binding factor 2 (NRBF2) plays an essential role in autophagy, the cellular pathway that degrades long-lived proteins and other cytoplasmic contents through lysosomes. NRBF2 binds Atg14L - a Beclin-binding protein - directly via the MIT domain and enhances Atg14L-linked Vps34 kinase (a class III phosphatidylinositol-3 kinase) activity and autophagy induction.
