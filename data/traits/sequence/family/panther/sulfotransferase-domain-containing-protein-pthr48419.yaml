identifier: PANTHER:PTHR48419
label: "SULFOTRANSFERASE DOMAIN-CONTAINING PROTEIN"
definition: >-
  Pyrrolopyrazine biosynthesis cluster protein F, also known as Sulfotransferase ppzF, is involved in the biosynthesis of pyrrolopyrazines, which are secondary metabolites with insecticidal properties. The protein includes a multifunctional non-ribosomal peptide synthetase (NRPS) that synthesises peramine, a simple pyrrolopyrazine. The NRPS contains condensation, methylation, and reduction domains, which facilitate the formation of peptide bonds, N-methylation of arginine, and cyclization to release the product. Oxidation processes are also involved in converting proline into an oxidized derivative for NRPS substrate use.
definition_source: "InterPro:IPR053226 abstract (PANTHER PTHR48419 is a member signature)"
