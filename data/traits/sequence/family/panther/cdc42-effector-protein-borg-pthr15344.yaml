definitions:
  - kind: GENERAL
    text: >-
      CDC42 EFFECTOR PROTEIN BORG — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15344. PANTHER protein class: scaffold/adaptor protein. Members are annotated with the molecular function protein binding, small GTPase binding. and participate in regulation of cell shape, regulation of plasma membrane bounded cell projection assembly, positive regulation of organelle organization. and localise to cytoplasm, membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The BORG/CEP family is involved in the organization of the actin cytoskeleton and may function downstream of CDC42, a small GTPase of the Rho-subfamily, which regulates signaling pathways that control diverse cellular functions including cell morphology, migration, endocytosis, and cell cycle progression. Members of the BORG/CEP family are known to induce actin filament assembly, leading to cell shape changes and the formation of pseudopodia in fibroblasts. Some members also control septin organization, which is negatively regulated by CDC42, and can inhibit MAPK8 independently of CDC42 binding. The presence of a CRIB domain in several family members mediates their interaction with CDC42, suggesting a role in signaling pathways that orchestrate cytoskeletal dynamics and cellular morphogenesis.
    source: "InterPro:IPR051296 abstract (LLM-generated, not curator-reviewed)"
