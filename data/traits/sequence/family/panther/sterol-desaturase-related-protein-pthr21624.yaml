identifier: PANTHER:PTHR21624
label: "STEROL DESATURASE-RELATED PROTEIN"
definition: >-
  This family of proteins includes enzymes involved in lipid metabolism. Members of this family include Alkylglycerol monooxygenase (AGMO, also known as TMEM195) from animals, a glyceryl-ether monooxygenase that plays a role in cleaving the O-alkyl bond of ether lipids. These ether lipids are crucial components of brain membranes, indicating a significant role in the central nervous system. The family also encompasses enzymes such as C-5 sterol desaturases, which are implicated in sterol biosynthesis by introducing double bonds into sterols. Collectively, these proteins share structural similarities and are part of the broader sterol desaturase family.
