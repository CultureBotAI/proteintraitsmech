identifier: PANTHER:PTHR31342
label: "PROTEIN CHUP1, CHLOROPLASTIC"
definition: >-
  This entry represents a group of plant proteins, including CHUP1 and At4g04980 from Arabidopsis. CHUP1 (CHLOROPLAST UNUSUAL POSITIONING1) interacts with actin and profilin. It mediates actin-based light-induced chloroplast avoidance movement. The function of At4g04980 is not clear. This entry also includes Protein INCREASED PETAL GROWTH ANISOTROPY 1, a microtubule-associated protein involved in the regulation of anisotropic petal and cotyledons growth and shape by affecting cortical microtubule organization. It cooperatively functions with ANGUSTIFOLIA (AN), and negatively regulates cortical microtubules (CMTs) organization in response to mechanical stress and modulates pavement cells morphogenesis leading to puzzle shape, probably in an AAA1/KTN1-dependent manner.
definition_source: "InterPro:IPR040265 abstract (PANTHER PTHR31342 is a member signature)"
