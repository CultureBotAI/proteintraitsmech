identifier: PANTHER:PTHR47663
label: "XYLANOLYTIC TRANSCRIPTIONAL ACTIVATOR XLNR-RELATED"
definition: >-
  The xlnR/xlr1 family consists of transcriptional activators involved in the regulation of genes associated with the pentose catabolic pathway (PCP). Members of this family are primarily responsible for the induction of extracellular cellulolytic and xylanolytic enzymes, as well as the intracellular activities of D-xylose catabolic genes, in response to the presence of D-xylose. Certain members also regulate arabinanolytic genes in response to L-arabinose. These proteins typically bind to specific DNA sequences to exert their regulatory functions, contributing to the efficient utilization of pentose sugars by the cell.
definition_source: "InterPro:IPR051439 abstract (PANTHER PTHR47663 is a member signature)"
