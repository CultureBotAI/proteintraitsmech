identifier: PANTHER:PTHR11276
label: "DNA POLYMERASE TYPE-X FAMILY MEMBER"
definition: >-
  Family X DNA polymerases (PolX) are involved in DNA repair, being evolutionarily conserved in prokaryotes, eukaryotes and archaea. All DNA polymerases from this family are single-subunit enzymes, lacking the 3'-5' exonuclease activity and displaying very low processivity during primer extension reactions. Proteins in this family include in the well-characterised mammalian Pol beta; more recently discovered eukaryotic polymerases lambda, and mu; and a template-independent polymerase, terminal transferase (TdT). DNA carries the biological information that instructs cells how to exist in an ordered fashion: accurate replication is thus one of the most important events in the cell life cycle. This function is mediated by DNA-directed DNA-polymerases, which add nucleotide triphosphate (dNTP) residues to the 3'-end of the growing DNA chain, using a complementary DNA as template. Small RNA molecules are generally used as primers for chain elongation, although terminal proteins may also be used. Three motifs, A, B and C, are seen to be conserved across all DNA-polymerases, with motifs A and C also seen in RNA- polymerases. They are centred on invariant residues, and their structural significance was implied from the Klenow (Escherichia coli) structure: motif A contains a strictly-conserved aspartate at the junction of a β-strand and an α-helix; motif B contains an α-helix with positive charges; and motif C has a doublet of negative charges, located in a β-turn-β secondary structure. DNA polymerases ( EC:2.7.7.7 ) can be classified, on the basis of sequence similarity, into at least four different groups: A, B, C and X. Members of family X are small (about 40kDa) compared with other polymerases and encompass two distinct polymerase enzymes that have similar functionality: verteb
