identifier: PANTHER:PTHR46316
label: "SNF1-RELATED PROTEIN KINASE REGULATORY SUBUNIT BETA-1"
definition: >-
  This family represents the regulatory beta subunits of the plant SNF1-related protein kinase (SnRK) complex, probably a trimeric complex consisting of an alpha catalytic subunit, and a beta and a gamma non-catalytic regulatory subunits. In Arabidopsis, there are two isoforms of the catalytic subunit (AKIN10 and AKIN11), three beta subunits (AKINbeta1, AKINbeta2, and AKINbeta3) and one gamma subunit (AKINg). The SnRK complex in higher plants plays a role in signal transduction cascades regulating gene expression, carbohydrate and nitrogen metabolism. Some known SnRK1 substrates are key metabolic enzymes such as sucrose phosphate synthase, nitrate reductase, and HMG-CoA reductase, while others are transcription factors. Its physical interaction with nitrate reductase specifically occurs via the AKINbeta1 subunit. Beta subunits show conserved domains in different organisms. These domains include the Association with the SNF1 Complex (ASC) domain, which is important for interaction with the alpha and gamma subunits, and a specialised carbohydrate-binding module named the Glycogen Binding Domain (GBD). In Arabidopsis, only AKINbeta1 and AKINbeta2 exhibit both the GBD and the ASC domains. AKINbeta3 could be a plant specific subunit.
