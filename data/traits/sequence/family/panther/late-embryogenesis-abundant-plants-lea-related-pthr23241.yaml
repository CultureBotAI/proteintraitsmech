  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of isocyanide compounds, specifically the compound xanthocillin and its derivatives. The biosynthetic process begins with the conversion of tyrosine into a vinyl-isonitrile intermediate, which is then oxidatively dimerized to form xanthocillin. Members of this family may be responsible for further modifications of xanthocillin, including the introduction of N-formyl and methyl groups, leading to the production of various derivatives. These derivatives can undergo further transformations to produce compounds with potential biological activity. The family includes proteins with functions such as isocyanide synthase activity, cytochrome P450 monooxygenase activity, isonitrile hydratase-like activity, and methyltransferase activity. Some proteins within this family may also be involved in the oxidative and reductive cyclization processes that yield additional bioactive molecules.
    source: "InterPro:IPR053009 abstract (LLM-generated, not curator-reviewed)"
