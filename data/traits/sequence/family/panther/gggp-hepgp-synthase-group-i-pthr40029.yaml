identifier: PANTHER:PTHR40029
label: "GGGP/HepGP synthase group I"
definition: >-
  The geranylgeranylglyceryl phosphate synthase (GGGPS) family of enzymes catalyse the formation of an ether bond between glycerol-1-phosphate and polyprenyl diphosphates. They are essential for the biosynthesis of archaeal membrane lipids, and also occur in bacterial species. Two phylogenetic groups (I and II) of GGGPS family exist. Bacterial group I enzymes are heptaprenylglyceryl phosphate synthases.
