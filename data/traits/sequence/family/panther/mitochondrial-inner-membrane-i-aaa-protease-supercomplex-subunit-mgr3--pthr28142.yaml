identifier: PANTHER:PTHR28142
label: "MITOCHONDRIAL INNER MEMBRANE I-AAA PROTEASE SUPERCOMPLEX SUBUNIT MGR3-RELATED"
definition: >-
  This entry includes Mrg3 and Mrg3-like proteins mostly from fungi. Mrg3 is part of the mitochondrial inner membrane i-AAA protease supercomplex, which degrades misfolded mitochondrial proteins.
