identifier: PANTHER:PTHR11069
label: GLUCOSYLCERAMIDASE
definition: >-
  O-Glycosyl hydrolases ( EC:3.2.1. ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 30 CAZy:GH30 comprises enzymes with only one known activity; glucosylceramidase ( EC:3.2.1.45 ). Family 30 encompasses the mammalian glucosylceramidases. Human acid beta-glucosidase (D-glucosyl-N-acylsphingosine glucohydrolase), cleaves the glucosidic bonds of glucosylceramide and synthetic beta-glucosides. Any one of over 50 different mutations in the gene of glucocerebrosidase have been found to affect activity of this hydrolase, producing variants of Gaucher disease, the most prevalent lysosomal storage disease.
definition_source: "InterPro:IPR001139 abstract (PANTHER PTHR11069 is a member signature)"
