identifier: PANTHER:PTHR14700
label: "PENTATRICOPEPTIDE REPEAT-CONTAINING PROTEIN 2, MITOCHONDRIAL"
definition: >-
  Pentatricopeptide repeat (PPR) proteins constitute a large family of RNA-binding proteins that contain a canonical 35 residue repeat motif. Seven examples have been identified in human mitochondria, and are known to affect mitochondrial translation. One of these is PTCD2, a pentatricopeptide domain (PTCD)-containing protein that affects mitochondrial translation. PTCD2 appears to have a role in processing RNA transcripts involving cytochrome b encoded by mitochondrial DNA. Disruption in PTCD2 resulted in elevated levels of the unprocessed precursor encoding cytochrome b. PTCD2 has been identified as a target for autoantibodies in neurodegenerative disease and is used as a biomarker for Alzheimer disease.
definition_source: "InterPro:IPR034629 abstract (PANTHER PTHR14700 is a member signature)"
