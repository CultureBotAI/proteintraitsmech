identifier: PANTHER:PTHR46527
label: "NUCLEOPORIN-LIKE PROTEIN 2"
definition: >-
  NUP42 is a component of the nuclear pore complex required for the export of mRNAs containing poly(A) tails from the nucleus into the cytoplasm. The protein localises to the nuclear pore complex at the nuclear membrane. NUP42 contains an N-terminal C3H1-type zinc finger domain and multiple FG repeats that serve as interaction sites for karyopherins. This entry also includes homologue proteins from plants and fungi.
