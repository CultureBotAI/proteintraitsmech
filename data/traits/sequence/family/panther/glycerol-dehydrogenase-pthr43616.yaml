identifier: PANTHER:PTHR43616
label: "GLYCEROL DEHYDROGENASE"
definition: >-
  This entry represents two distinct enzymes: bacterial NAD-linked glycerol dehydrogenase and archaeal glycerol-1-phosphate dehydrogenase. NAD-linked glycerol dehydrogenase converts glycerol to glycerone and s NADH during glycerol metabolism. Glycerol-1-phosphate dehydrogenase is responsible for the formation of the archaeal-specific glycerophosphate backbone of phospholipids, G-1-P, from glycerone phosphate. This is the key step in the in biosynthesis of archaeal enantiomeric phospholipids,. There is similarity in the structure of these enzymes despite the differences in substrate specificity and biological role.
definition_source: "InterPro:IPR016205 abstract (PANTHER PTHR43616 is a member signature)"
