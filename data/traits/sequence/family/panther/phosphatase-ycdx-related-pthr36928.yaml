  - kind: GENERAL
    text: >-
      PHOSPHATASE YCDX-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36928. PANTHER protein class: phosphatase, hydrolase. Members are annotated with the molecular function hydrolase activity, ion binding, zinc ion binding. Members localise to cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The PHP family proteins are characterized by their probable phosphatase activity, which suggests a role in hydrolyzing phosphate groups from various substrates. A specific member, YcdX from E. coli, has been noted to hydrolyze p-nitrophenyl phosphate (pNPP) in vitro and is implicated in swarming motility, with its activity being stimulated by YcdY. The broader function of the PHP family may involve diverse roles in cellular processes that require phosphatase activity, although the specific substrates and biological functions may vary among different family members.
    source: "InterPro:IPR050243 abstract (LLM-generated, not curator-reviewed)"
