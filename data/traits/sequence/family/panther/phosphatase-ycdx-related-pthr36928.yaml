      PHOSPHATASE YCDX-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36928. PANTHER protein class: phosphatase, hydrolase. Members are annotated with the molecular function zinc ion binding, phosphoric ester hydrolase activity. Members localise to cytoplasm, cytosol.
