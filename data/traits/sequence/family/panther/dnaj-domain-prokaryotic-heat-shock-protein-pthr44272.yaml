  - kind: GENERAL
    text: >-
      This family of proteins is involved in plant development, particularly in the structural organization of cellular compartments. Members of this family play a role in gravitropic signal transduction, influencing pH changes and auxin distribution, which are critical for plant orientation and growth responses to gravity. Some members are associated with the localization and activity of auxin efflux carrier components, affecting lateral auxin transport.
