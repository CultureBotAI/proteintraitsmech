identifier: PANTHER:PTHR47781
label: "50S RIBOSOMAL PROTEIN L36 2"
definition: >-
  This entry represents the typical 50S ribosomal protein L36 mainly from proteobacteria, bacteroidetes and actinobacteria. This entry also includes a few proteins from algae. Ribosomal protein bL36 (also known as L36) is the smallest protein from the large subunit of the prokaryotic ribosome. It belongs to a family of ribosomal proteins which, on the basis of sequence similarities can be grouped into: bacterial L36; algal and plant chloroplast L36; Cyanelle L36; fungal and animal L36. L36 is a small basic and cysteine-rich protein of around 40 amino-acid residues probably involved in late assembly of the 50S particle, in vitro translation and cell growth. This protein shows a zinc-binding CxxC motif. Its paralogue encoded by ykgO (as named in Escherichia coli), lacks the zinc-binding site and replaces RpmJ when zinc availability is low.
