identifier: PANTHER:PTHR36562
label: "SERINE/ARGININE REPETITIVE MATRIX 2"
definition: >-
  This family of proteins is involved in the process of pre-mRNA splicing. Members of this family are thought to act at or before the first catalytic step in the spliceosome, potentially by stabilizing the catalytic center or the RNA substrate's position. Some members may also interact with RNA polymerase II, influencing its chromatin distribution and phosphorylation state, and may play a role in regulating pathways such as germline sex determination.
