identifier: PANTHER:PTHR35269
label: "SMALL VCP/P97-INTERACTING PROTEIN"
definition: >-
  This entry includes mammalian SVIP (small VCP/p97-interacting protein) SVIP and its homologues from animals. It was identified by yeast two-hybrid screening to be an interactive partner of VCP/p97. Mammalian VCP/p97 and its yeast counterpart Cdc48 participate in the formation of organelles, including the endoplasmic reticulum (ER), Golgi apparatus, and nuclear envelope. SVIP has been identified as an endogenous inhibitor of endoplasmic reticulum-associated degradation. Over-expression of SVIP caused the formation of large vacuoles that seemed to be derived from the ER. Proteins in this family have two putative coiled-coil regions and are approximately 80 amino acids in length.
definition_source: "InterPro:IPR055366 abstract (PANTHER PTHR35269 is a member signature)"
