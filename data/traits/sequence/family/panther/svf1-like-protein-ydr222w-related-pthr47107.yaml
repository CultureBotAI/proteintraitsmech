identifier: PANTHER:PTHR47107
label: "SVF1-LIKE PROTEIN YDR222W-RELATED"
definition: >-
  This entry represents a family of stress survival proteins, such as survival factor 1 (Svf1). The protein Svf1 is required for yeast survival under conditions of oxidative stress, including cold stress. Cells deficient in Svf1 have increased levels of reactive oxygen species (ROS) under certain conditions. Svf1 affects cellular survival in part via modulation of the sphingolipid metabolic pathway. Two Svf1 family proteins have been identified in the genome of Schizosaccharomyces pombe (Svf1 and Svf2). Members of this family are are lipid transfer proteins.
