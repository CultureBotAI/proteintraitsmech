identifier: PANTHER:PTHR24300
label: "CYTOCHROME P450 508A4-RELATED"
definition: >-
  The Cytochrome P450 2 family comprises enzymes involved in the metabolism of fatty acids, steroids, retinoids, and xenobiotics including Cytochrome P450 2E1 and Cytochrome P450 2D6. They function as monooxygenases, catalysing the insertion of one oxygen atom from molecular oxygen into substrates, while reducing the second oxygen atom to water, using electrons from NADPH via cytochrome P450 reductase. Members of this family exhibit diverse substrate specificities, including hydroxylation of carbon-hydrogen bonds, epoxidation of double bonds, and metabolism of arachidonic acid and its conjugates. They are implicated in the synthesis of bile acids and steroid hormones, activation of vitamin D precursors, and the oxidative metabolism of various endogenous compounds and drugs. Some members also possess peroxidase and isomerase activities, modulating eicosanoid signalling and contributing to the breakdown of prostaglandins. The family plays a role in the regulation of physiological processes and the detoxification of potentially harmful substances.
