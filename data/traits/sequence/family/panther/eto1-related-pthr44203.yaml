identifier: PANTHER:PTHR44203
label: ETO1-RELATED
definition: >-
  Ethylene biosynthesis is directed by a family of 1-aminocyclopropane-1-carboxylic acid (ACC) synthases (ACS) that convert S-adenosyl-l-methionine to the immediate precursor ACC. This entry represents a group of plant BTB domain containing proteins involved in the the ethylene pathway, including ETO1, EOL1 and EOL2 from Arabidopsis. They contain six tetratricopeptide repeats (TPR), and a coiled-coil motif at their C-terminal. They act together to negatively regulate ethylene synthesis by directing the degradation of type-2 ACS proteins.
definition_source: "InterPro:IPR044631 abstract (PANTHER PTHR44203 is a member signature)"
