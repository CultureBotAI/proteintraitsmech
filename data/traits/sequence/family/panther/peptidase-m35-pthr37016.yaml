  - kind: GENERAL
    text: >-
      The peptidase M35 family comprises secreted metalloproteinases that are involved in the assimilation of proteinaceous substrates. They exhibit high activity on basic nuclear substrates, such as histones and protamines, which suggests a role in processing nuclear proteins. Members of the family are implicated in virulence, indicating a potential contribution to the pathogenicity of the organisms that produce them. The proteolytic activity of these enzymes is typically regulated by metal ions and can be inhibited by chelating agents, highlighting their dependence on metal cofactors for function. This group of metallopeptidases belong to MEROPS peptidase family M35 (deuterolysin family, clan MA(M)). The protein fold of the peptidase domain for members of this family resembles that of thermolysin, the type example for clan MA. Deuterolysin is a microbial zinc-containing metalloprotease that shows some similarity to thermolysin. The protein is expressed with a possible 19-residue signal sequence, a 155-residue propeptide, and an active peptide of 177 residues. The latter contains an HEXXH motif towards the C terminus, but the other zinc ligands are as yet undetermined.
    source: "InterPro:IPR050414 abstract (LLM-generated, not curator-reviewed)"
