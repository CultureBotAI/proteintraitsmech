  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that are likely involved in the regulation of gene clusters responsible for the biosynthesis of notoamides. Notoamides are fungal indole alkaloids known for their unique bicyclo[2.2.2]diazaoctane core structure. Members of this family play a key role in the production of these secondary metabolites, which have potential pharmacological applications due to their complex molecular architecture and biological activities.
