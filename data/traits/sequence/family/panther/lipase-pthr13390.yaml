identifier: PANTHER:PTHR13390
label: LIPASE
definition: >-
  This entry includes a group of lipid droplet-associated hydrolases (LDAHs) from eukaryotes. Human LDAH plays a role in cholesterol homeostasis. This entry also includes budding yeast Lipid droplet-associated triacylglycerol lipase YPR147C, which shows both triacylglycerol (TAG) lipase and ester hydrolase activities.
