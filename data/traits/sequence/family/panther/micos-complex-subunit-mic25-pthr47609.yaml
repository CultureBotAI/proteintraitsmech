identifier: PANTHER:PTHR47609
label: "MICOS COMPLEX SUBUNIT MIC25"
definition: >-
  MIC25, also known as CHCHD6, is a component of the MICOS complex, a large protein complex of the mitochondrial inner membrane crucial for the formation and maintenance of cristae structure. The deletion of CHCHD6 does not affect cristae morphology or stability of other components.
