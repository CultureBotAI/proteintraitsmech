identifier: PANTHER:PTHR15821
label: "PROTEIN MN1"
definition: >-
  MN1 is a transcription factor that regulates mammalian palate development and is required for appropriate osteoblast proliferation, motility, differentiation, and function. Its overexpression has been linked to acute myeloid leukemia (AML) poor prognosis.
definition_source: "InterPro:IPR037644 abstract (PANTHER PTHR15821 is a member signature)"
