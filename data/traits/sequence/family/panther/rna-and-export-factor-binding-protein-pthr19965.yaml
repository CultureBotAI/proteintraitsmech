identifier: PANTHER:PTHR19965
label: "RNA AND EXPORT FACTOR BINDING PROTEIN"
definition: >-
  The ALYREF family proteins function as export adapters involved in the nuclear export of both spliced and unspliced mRNA, playing a crucial role in mRNA processing and cytoplasmic trafficking. They are components of the TREX complex, which links transcription, splicing, and mRNA export. ALYREF family members bind to mRNA, facilitating its transfer to the NXF1-NXT1 heterodimer for export via the TAP/NFX1 pathway. They are involved in transcriptional activation by acting as chaperones that promote the dimerization of transcription factors with bZIP domains. Additionally, they contribute to genome stability and transcription elongation. Some family members are implicated in the export of m5C-containing mRNAs and in defense responses in plants. The TREX complex, including ALYREF proteins, is essential for the export of certain viral mRNAs and may be recruited to mRNA independently of transcription.
