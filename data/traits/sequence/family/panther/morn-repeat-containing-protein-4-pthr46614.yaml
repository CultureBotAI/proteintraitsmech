  - kind: GENERAL
    text: >-
      The MORN repeat-containing protein 4 family is characterized by its role in neuronal response to injury. Members of this family are implicated in the promotion of axonal degeneration following neuronal damage due to toxic insult or trauma. In addition to this conserved function, the Drosophila homolog has a specialized role in the visual system, where it organizes rhabdomeric components to enhance the fidelity of phototransduction in dark-adapted photoreceptors and contributes to the stability of specific phototransduction proteins, ensuring proper termination of the light response.
