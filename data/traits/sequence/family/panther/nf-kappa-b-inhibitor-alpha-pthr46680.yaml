identifier: PANTHER:PTHR46680
label: "NF-KAPPA-B INHIBITOR ALPHA"
definition: >-
  The NF-kappa-B inhibitor family consists of proteins that regulate the NF-kappa-B signaling pathway, which is crucial for immune and inflammatory responses. Family members inhibit NF-kappa-B activity by sequestering NF-kappa-B dimers in the cytoplasm, thus masking their nuclear localization signals. Upon cellular stimulation, these inhibitors are phosphorylated, leading to their ubiquitination and degradation, which allows NF-kappa-B to translocate to the nucleus and activate gene transcription. Some viral members of the family, derived from Polydnaviridae, have evolved to suppress the host immune response by binding NF-kappa-B without the regulatory regions necessary for dissociation and degradation, thereby preventing NF-kappa-B activation.
