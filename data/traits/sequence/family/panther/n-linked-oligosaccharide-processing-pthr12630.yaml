identifier: PANTHER:PTHR12630
label: "N-LINKED OLIGOSACCHARIDE PROCESSING"
definition: >-
  This entry includes glucosidase II beta subunit from eukaryotes and N-acetylglucosamine-1-phosphotransferase subunit gamma from animals. They share a conserved N-terminal domain. Glucosidase II catalyses the sequential removal of two alpha-1,3-linked glucose residues in the second step of N-linked oligosaccharide processing. It is a heterodimer whose alpha subunit bears the glycosyl hydrolase active site, while its beta subunit role is controversial. The beta subunit has been reported to be involved in the solubility and stability of the heterodimeric enzyme, and in retaining the enzyme within the endoplasmic reticulum. Other studies suggest that the beta subunit modulates N-Glycan trimming in both fission yeast and mammals. N-acetylglucosamine-1-phosphotransferase subunit gamma (GNPTG) is a non-catalytic component of the N-acetylglucosamine-1-phosphotransferase complex. The complex is lysoosomal and a heterohexamer consisting of two alpha, two beta and two gamma subunits, and is required for the first step in the synthesis of the mannose 6-phosphate recognition marker on lysosomal acid hydrolases. The gamma subunit facilitates the addition of a second GlcNAc-P to the high mannose oligosaccharides of the substrates. Mutations in the gene for the gamma subunit are associated with mucolipidosis type III complementation group C (MLIIIC), an autosomal recessive disease of lysosomal hydrolase trafficking.
