identifier: PANTHER:PTHR11590
label: "PROTEIN-GLUTAMINE GAMMA-GLUTAMYLTRANSFERASE"
definition: >-
  The Transglutaminase family comprises enzymes that catalyze the formation of isopeptide bonds between glutamine and lysine residues, cross-linking proteins and stabilizing structures such as the cornified envelope in keratinocytes and fibrin clots. They also conjugate polyamines to proteins, contributing to various biological processes including cell proliferation, skin and hair formation, and wound healing. Some family members are involved in apoptosis by cross-linking cytoskeletal and extracellular matrix proteins, while others participate in post-translational modifications like protein serotonylation and dopaminylation, impacting chromatin organization and neurotransmission. Their activity is regulated by GTP and Ca(2+), with GTP inhibiting and Ca(2+) promoting the active conformation. They also play roles in cellular signaling independent of their enzymatic activity.
