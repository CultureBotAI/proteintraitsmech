identifier: PANTHER:PTHR16151
label: "HAUS AUGMIN-LIKE COMPLEX SUBUNIT 6"
definition: >-
  This entry represents subunit 6 of the HAUS augmin-like complex, involved in mitotic spindle assembly, maintenance of centrosome integrity and completion of cytokinesis. Subunit 6 interacts with the NEDD1-gamma-tubulin complex and recruits this complex to the spindle, which in turn promotes microtubule polymerisation. Although plant cells assemble the mitotic spindle in the absence of the centrosome structure, they also possess an augmin complex with similar functions in microtubule nucleation and organisation. The Arabidopsis augmin complex contains both conserved and unique subunits compared with its animal counterparts. This entry includes plant AUGMIN subunit 6 (AUG6).
