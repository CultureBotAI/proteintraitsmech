  - kind: GENERAL
    text: >-
      The zinc-containing alcohol dehydrogenase family, specifically the quinone oxidoreductase and crotonyl-CoA carboxylase/reductase subfamilies, includes enzymes that play roles in various metabolic processes. Quinone oxidoreductase members do not exhibit alcohol dehydrogenase activity but bind NADP and transfer electrons to orthoquinones, aiding in xenobiotic detoxification. They also interact with AU-rich elements in the 3'-UTR of mRNAs to enhance stability, with NADPH binding modulating this interaction. Crotonyl-CoA carboxylase/reductase members catalyze the reductive carboxylation of crotonyl-CoA to ethylmalonyl-CoA, a key reaction in acetyl-CoA assimilation pathways. They also convert crotonyl-CoA to butyryl-CoA, contributing to straight-chain fatty acid biosynthesis. These enzymes exhibit substrate specificity and are regulated by various inhibitors, including NADPH and thiol group inhibitors.
    source: "InterPro:IPR051603 abstract (LLM-generated, not curator-reviewed)"
