  - kind: GENERAL
    text: >-
      This family of proteins includes both catalytic and non-catalytic members with diverse roles in cellular processes. Catalytic members are involved in apoptosis, immune response, and inflammatory signaling pathways, often through the activation of NF-kappa-B and MAP kinase p38 pathways, and may also have ubiquitin ligase activity. Non-catalytic members act as inhibitors of apoptosis, protecting cells during development or affecting fertility. Some members are involved in epidermal differentiation and cornification, processing key proteins for skin maturation and barrier function. The family displays proteolytic activity with preferences for specific substrates and may also participate in DNA degradation in certain cell types.
