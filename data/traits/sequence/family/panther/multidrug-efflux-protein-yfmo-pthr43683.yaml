identifier: PANTHER:PTHR43683
label: "MULTIDRUG EFFLUX PROTEIN YFMO"
definition: >-
  This protein family includes Multidrug efflux protein YfmO from Bacillus subtilis and similar proteins mainly found in bacilli and actinomycetes. YfmO functions to efflux copper or a copper complex. It is possible that YfmO could contribute to copper resistance. Members of this entry are part of the major facilitator superfamily, which is characterised by facilitating the transport of a wide variety of substrates across cellular membranes.
