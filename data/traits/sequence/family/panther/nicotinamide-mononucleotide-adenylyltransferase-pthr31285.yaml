identifier: PANTHER:PTHR31285
label: "NICOTINAMIDE MONONUCLEOTIDE ADENYLYLTRANSFERASE"
definition: >-
  NICOTINAMIDE MONONUCLEOTIDE ADENYLYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31285. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function adenylyltransferase activity, hydrolase activity, acting on acid anhydrides, transferase activity. Members participate in purine nucleotide biosynthetic process, purine-containing compound metabolic process, organonitrogen compound biosynthetic process. Members localise to cytoplasm.
