identifier: PANTHER:PTHR38674
label: "ALKANE 1-MONOOXYGENASE 1"
definition: >-
  Alkane hydroxylase AlkB catalyzes the terminal hydroxylation of alkanes and the omega-hydroxylation of fatty acids in the presence of a NADH-rubredoxin reductase and rubredoxin. It is an integral membrane di-iron enzyme that shares a requirement for iron and oxygen for activity in a manner similar to that of the non-heme integral membrane desaturases. Alcanivorax borkumensis has two alkane hydroxylases, AlkB1 and AlkB2, with AlkB1 being responsible for the degradation of short-chain n-alkanes. Also included in this family is xylene/toluene monooxygenase, a related enzyme with broad specificity that oxidizes toluene and xylenes to (methyl)benzyl alcohols.
definition_source: "InterPro:IPR033885 abstract (PANTHER PTHR38674 is a member signature)"
