  - kind: GENERAL
    text: >-
      THADA/DEATH RECEPTOR INTERACTING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14387. PANTHER protein class: scaffold/adaptor protein. and participate in cellular aromatic compound metabolic process, methylation, biosynthetic process. and localise to cytoplasm, cytosol.
