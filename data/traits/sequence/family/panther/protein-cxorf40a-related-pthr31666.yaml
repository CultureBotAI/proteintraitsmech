identifier: PANTHER:PTHR31666
label: "PROTEIN CXORF40A-RELATED"
definition: >-
  This family consists of EOLA1/EOLA2 from human, and their homologues from vertebrates. Endothelial-overexpressed LPS-associated factor 1 (EOLA1, also known as CXorf40A), seems to play a role as a signal transduction factor. EOLA1 interacts with metallothionein 2A (MT2A) and functions as a negative regulator for LPS (lipopolysaccharide) response by regulation of MT2A.
