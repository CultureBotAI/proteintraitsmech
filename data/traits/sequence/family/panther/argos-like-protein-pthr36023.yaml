identifier: PANTHER:PTHR36023
label: "ARGOS-LIKE PROTEIN"
definition: >-
  Overexpression of ARGOS in Arabidopsis increases lateral organ size through prolonged expression of transcription factor ANT, which affects cell proliferation during organ growth. ARGOS-LIKE (ARL) is an ARGOS homologue that appears to regulate organ growth mainly by influencing cell expansion rather than cell proliferation. There is only one orthologue of ARGOS in rice (OsARGOS); its overexpression affects organ growth by promoting both cell proliferation and expansion. ARGOS and OsARGOS are induced by the phytohormones auxin and cytokinin, whereas ARL is induced by brassinosteroid (BR). Organ size related 1 (OSR1) from Arabidopsis is involved in regulation of organ growth and overall organ size. It appears to act redundantly with the proteins ARGOS and ARGOS-like during organ growth.
definition_source: "InterPro:IPR037468 abstract (PANTHER PTHR36023 is a member signature)"
