identifier: PANTHER:PTHR46461
label: "KELCH DOMAIN-CONTAINING PROTEIN 3"
definition: >-
  This entry represents human Kelch domain-containing protein 3 (KLHDC3) and similar proteins mainly found in animals. KLHDC3, also known as Testis intracellular mediator protein or PEAS, is the substrate-recognition component of a Cul2-RING (CRL2) E3 ubiquitin-protein ligase complex of the DesCEND (destruction via C-end degrons) pathway, which recognises a C-degron located at the extreme C terminus of target proteins, leading to their ubiquitination and degradation. This C-degron ris usually a motif of less than ten residues and can be present in full-length proteins, truncated proteins or proteolytically cleaved forms. The degradation process is particularly relevant for truncated selenoproteins that result from unsuccessful decoding events. Additionally, these proteins may play a role in the meiotic recombination process. Members of this family contain a Kelch-type β-propeller domain.
definition_source: "InterPro:IPR052637 abstract (PANTHER PTHR46461 is a member signature)"
