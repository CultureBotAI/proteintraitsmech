identifier: PANTHER:PTHR47384
label: "E3 UBIQUITIN-PROTEIN LIGASE CCNB1IP1 HOMOLOG"
definition: >-
  This family of proteins includes plant E3 ubiquitin-protein ligase CCNB1IP1 homologues (also known as RING-type E3 ubiquitin transferase HEI10) that play a crucial role in meiosis, specifically in the formation of class I crossovers. These crossovers are essential for the exchange of genetic material between homologous chromosomes, which is a key step in the genetic diversity produced through sexual reproduction.
definition_source: "InterPro:IPR055328 abstract (PANTHER PTHR47384 is a member signature)"
