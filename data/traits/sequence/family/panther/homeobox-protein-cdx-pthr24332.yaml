identifier: PANTHER:PTHR24332
label: "HOMEOBOX PROTEIN CDX"
definition: >-
  This entry represents the caudal homeobox family, which includes homeotic protein caudal from Drosophila melanogaster (Cad), homeobox protein CDX-1 from human and similar proteins found in animals and some fungal species. Cad is a transcription factor involved in processes such as anterior/posterior patterning formation, organ morphogenesis and innate immune homeostasis. Postembryonically its function is mostly restricted to the intestine where it regulates antimicrobial peptide (AMP) levels preserving the normal gut flora. CDX-1, is also involved in transcriptional regulation. It may play a role in the terminal differentiation of the intestine. It binds preferentially to methylated DNA. This entry also includes homeobox protein pal-1 from Caenorhabditis elegans, a transcriptional activator required for posterior V6 neuroectoblast cell fate specification during postembryonic neurogenesis (patterning) which generates the characteristic ray lineage during male tail development.
definition_source: "InterPro:IPR047152 abstract (PANTHER PTHR24332 is a member signature)"
