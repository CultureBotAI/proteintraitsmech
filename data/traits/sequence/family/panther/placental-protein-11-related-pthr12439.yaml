identifier: PANTHER:PTHR12439
label: "PLACENTAL PROTEIN 11-RELATED"
definition: >-
  This entry represents endoribonucleases, mainly uridylate and poly(U)-specific, found predominantly in eukaryotes. The founding member of this family, XendoU, is a uridylate-specific, divalent cation-dependent enzyme that produces molecules with 2',3'-cyclic phosphate ends. The human Endou, known as PP11, has endoribonuclease activity with placental tissue specificity. This entry also includes Endoribonuclease Arlr which has a broad specificity and preferentially cleaves single stranded RNA at sites with AU, UC and less efficiently poly-U sites.
