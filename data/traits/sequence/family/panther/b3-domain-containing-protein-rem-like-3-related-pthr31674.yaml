identifier: PANTHER:PTHR31674
label: "B3 DOMAIN-CONTAINING PROTEIN REM-LIKE 3-RELATED"
definition: >-
  This entry represents a group of plant proteins, known as REM. They are B3 domain-containing proteins. AtREM1 contains several repeats of a B3-related domain and may be involved in the organisation of reproductive meristem.
