identifier: PANTHER:PTHR46396
label: "PROTEIN O-LINKED-MANNOSE BETA-1,2-N-ACETYLGLUCOSAMINYLTRANSFERASE 1"
definition: >-
  This family of proteins participates in the post-translational modification process known as O-mannosyl glycosylation. Members of this family are responsible for catalyzing the transfer of N-acetylglucosamine to O-linked mannose residues on target glycoproteins. This enzymatic activity results in the synthesis of a specific glycan moiety, GlcNAc(beta1-2)Man(alpha1-)O-Ser/Thr, which is essential for the maturation of alpha-dystroglycan and other O-mannosylated proteins. The addition of this glycan structure provides a foundation for further carbohydrate modifications. These proteins contain a GG-type lectin domain, also referred to as the stem domain, which facilitates the specific recognition and interaction with beta-linked N-acetylglucosamine on substrates. The family is characterized by its membership in the glycosyltransferase 13 family, indicating a shared enzymatic function in glycan biosynthesis.
