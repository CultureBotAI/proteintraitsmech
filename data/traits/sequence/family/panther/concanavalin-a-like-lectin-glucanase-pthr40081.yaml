identifier: PANTHER:PTHR40081
label: "CONCANAVALIN A-LIKE LECTIN/GLUCANASE"
definition: >-
  This entry includes Exo-rhamnogalacturonan lyase from Penicillium chrysogenum 31B (PcRGLX) and YetA from B. subtilis. YetA is functionally uncharacterised. This family of proteins is found in Actinobacteria, Firmicutes, Proteobacteria and fungi. Members of this family share a 3 domain architecture.
