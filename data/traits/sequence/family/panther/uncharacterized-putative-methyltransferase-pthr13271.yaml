identifier: PANTHER:PTHR13271
label: "UNCHARACTERIZED PUTATIVE METHYLTRANSFERASE"
definition: >-
  The SETD3/SETD6 protein family encompasses a group of S-adenosyl-L-methionine (SAM)-dependent methyltransferases that share a common function in post-translational modification of proteins through methylation. Members of the family exhibit specificity for different substrates, including actin, histones, and various ribosomal proteins. The SETD3 subfamily members are protein-histidine N-methyltransferases, specifically targeting actin at histidine residues, which is crucial for muscle contraction during labor. The SETD6 subfamily members are protein-lysine N-methyltransferases, with functions ranging from transcriptional regulation, as seen with the methylation of the RELA subunit of NF-kappa-B, to the maintenance of embryonic stem cell self-renewal. Other family members methylate lysine residues on cytochrome c, elongation factors, and ribosomal proteins, indicating a broad role in cellular processes such as proliferation, differentiation, and response to inflammation.
