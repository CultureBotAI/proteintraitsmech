identifier: PANTHER:PTHR30008
label: "EXODEOXYRIBONUCLEASE 7 LARGE SUBUNIT"
definition: >-
  Exonuclease VII (EC:3.1.11.6) is composed of two nonidentical subunits; one large subunit and 4 small ones. Exonuclease VII catalyses exonucleolytic cleavage in either 5'-3' or 3'-5' direction to yield 5'-phosphomononucleotides. The large subunit also contains the OB-fold domains that bind to nucleic acids at the N terminus.
