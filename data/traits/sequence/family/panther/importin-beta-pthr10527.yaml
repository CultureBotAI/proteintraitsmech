identifier: PANTHER:PTHR10527
label: "IMPORTIN BETA"
definition: >-
  This family consists of the karyopherins importin-beta and transportin. Importin subunit beta-1 forms a complex with an importin alpha subunit. The importin complex is required for nuclear protein import. Importins bind to NLSs in their protein cargos to transport them through the nuclear pore into the nucleus. Transportin-1 and -2 also function in nuclear import. Transportin-1 was first identified as the import factor for the heterogeneous ribonucleoprotein A1 (hnRNP A1). The subfamily of proteins known as RanBP6 (Ran-binding protein 6) are part of this family.
definition_source: "InterPro:IPR040122 abstract (PANTHER PTHR10527 is a member signature)"
