identifier: PANTHER:PTHR11995
label: "NADH DEHYDROGENASE"
definition: >-
  NADH DEHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11995. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function NADH dehydrogenase activity, primary active transmembrane transporter activity, electron transfer activity. and participate in aerobic respiration, cellular respiration, establishment of localization. and localise to respiratory chain complex I, membrane.
