identifier: PANTHER:PTHR11995
label: "NADH DEHYDROGENASE"
definition: >-
  NADH DEHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11995. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function NADH dehydrogenase activity, primary active transmembrane transporter activity, electron transfer activity. Members participate in proton transmembrane transport, aerobic respiration. Members localise to respiratory chain complex I, membrane.
