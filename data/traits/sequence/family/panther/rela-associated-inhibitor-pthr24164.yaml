identifier: PANTHER:PTHR24164
label: "RELA-ASSOCIATED INHIBITOR"
definition: >-
  This entry represents RelA-associated inhibitor (also known as iASPP), which is a regulator that plays a central role in regulation of apoptosis and transcription via its interaction with NF-kappa-B and p53/TP53 proteins. iASPP is an ankyrin-repeat-, SH3-domain- and proline-rich-region-containing proteins that is homologous with ASPP1 and ASPP2 ( ).
