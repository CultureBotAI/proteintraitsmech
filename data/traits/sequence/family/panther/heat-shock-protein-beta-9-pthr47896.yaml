identifier: PANTHER:PTHR47896
label: "HEAT SHOCK PROTEIN BETA-9"
definition: >-
  Heat shock protein beta-9 (HspB9) is specifically expressed in testis, notably in the spermatogenic cells from late pachytene spermatocyte stage till elongate spermatid stage. Its function is not clear.
