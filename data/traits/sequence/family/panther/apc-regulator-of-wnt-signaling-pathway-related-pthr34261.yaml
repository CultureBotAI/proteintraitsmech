identifier: PANTHER:PTHR34261
label: "APC REGULATOR OF WNT-SIGNALING PATHWAY-RELATED"
definition: >-
  This entry represents differentiation-associated protein 2 (DIA2), a protein with an essential role in the initiation of differentiation in Dictyostelium discoideum. DIA2 is also required for cAMP signalling. The protein is localised to the endoplasmic reticulum and vacuole, changing location from endoplasmic reticulum to pre-spore-specific vacuoles during late development. DIA2 accumulates in differentiating cells starved just before the PS point, with no detectable expression in vegetatively growing cells. Members of this family are also involved in the transduction of cAMP signalling pathways.
definition_source: "InterPro:IPR053358 abstract (PANTHER PTHR34261 is a member signature)"
