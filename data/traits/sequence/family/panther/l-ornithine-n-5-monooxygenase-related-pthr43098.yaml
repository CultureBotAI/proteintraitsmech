  - kind: GENERAL
    text: >-
      The FAD-binding monooxygenase family is involved in various biosynthetic pathways, catalyzing a range of oxidation reactions. Members of this family play key roles in the synthesis of diverse secondary metabolites, including fungal meroterpenoids, loline alkaloids, antibiotics, and mycotoxins. These enzymes typically perform Baeyer-Villiger oxidations, converting ketones to esters or lactones, and are also involved in epoxidation, hydroxylation, and other oxidative modifications. Their activities contribute to the structural complexity and biological activities of natural products, such as antimicrobial, insecticidal, and kinase inhibitory properties. The family includes dual-functional enzymes with additional methyltransferase domains, highlighting the versatility and multifunctional nature of these monooxygenases in natural product biosynthesis.
    source: "InterPro:IPR050775 abstract (LLM-generated, not curator-reviewed)"
