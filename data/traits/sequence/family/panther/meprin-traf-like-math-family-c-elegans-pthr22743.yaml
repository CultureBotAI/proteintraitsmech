  - kind: GENERAL
    text: >-
      This family of proteins includes members that contain both BTB (Broad-Complex, Tramtrack and Bric a brac) and MATH (Meprin and TRAF Homology) domains. These domains suggest a role in protein-protein interactions, where the BTB domain is involved in the assembly of multimeric protein complexes, and the MATH domain is implicated in substrate recognition. One characterized member of this family is suggested to function as a substrate-specific adapter for an E3 ubiquitin-protein ligase complex, which is responsible for the ubiquitination and subsequent proteasomal degradation of target proteins. This indicates that the family may be involved in the ubiquitin-proteasome system, a critical pathway for protein degradation and regulation in eukaryotic cells.
    source: "InterPro:IPR052664 abstract (LLM-generated, not curator-reviewed)"
