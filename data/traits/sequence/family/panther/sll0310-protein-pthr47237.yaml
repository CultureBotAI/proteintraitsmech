  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with acyltransferase and acetyltransferase activities. Members of this family are involved in the biosynthesis of various compounds, such as antibiotics, by catalyzing the transfer of acyl or acetyl groups from CoA-linked donors to acceptor molecules. Some proteins in this family have a broad substrate specificity, accepting linear CoA substrates of different lengths and converting them into acylated products. These enzymes play a role in the formation of bioactive molecules, including thiomarinol analogs, by transferring acyl groups to specific substrates like holothin.
