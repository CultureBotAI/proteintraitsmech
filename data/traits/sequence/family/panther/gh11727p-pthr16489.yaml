identifier: PANTHER:PTHR16489
label: GH11727P
definition: >-
  The PPP1R15 family proteins are involved in the regulation of protein synthesis and stress responses in cells. They recruit the serine/threonine-protein phosphatase PPP1CA to dephosphorylate EIF2S1/eIF-2A, reversing protein synthesis shutdown by stress kinases and aiding cell recovery from stress. They modulate the TGF-beta signaling pathway, potentially induce TP53 phosphorylation to promote apoptosis, and play a crucial role in autophagy by adjusting translation during starvation for lysosomal biogenesis and autophagic flux. Some family members act as viral restriction factors, attenuating replication of various viruses. Additionally, certain proteins in the family function as neurovirulence factors in viruses, mediating nuclear egress and inhibiting host immune responses, including the interferon response and the DNA sensing pathway.
