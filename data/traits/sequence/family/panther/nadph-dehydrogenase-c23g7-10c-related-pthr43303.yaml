identifier: PANTHER:PTHR43303
label: "NADPH DEHYDROGENASE C23G7.10C-RELATED"
definition: >-
  This entry represents a group of NADPH dehydrogenases, including NamA (also known as YqjM) from Bacillus subtilis. YqjM is a member of the Old Yellow Enzyme (OYE) family of flavin oxidoreductases. Similar to other OYE members, YqjM binds the FMN cofactor non-covalently and reduces the flavin in the reductive half-reaction at the expense of NADPH. It transfers electrons from the reduced flavin to the double bond of a variety of alpha, beta-unsaturated carbonyl compounds and accepts also electrophilic xenobiotics such as nitroglycerin, N-ethylmaleimide, and trinitrotoluene as substrates for the oxidative half-reaction. This entry also includes AfvA from Aspergillus flavus. AfvA is part of the gene cluster that mediates the biosynthesis of aflavarin, a bicoumarin that exhibits anti-insectan activity against the fungivorous beetle C.hemipterus.
definition_source: "InterPro:IPR044152 abstract (PANTHER PTHR43303 is a member signature)"
