identifier: PANTHER:PTHR33416
label: "NUCLEAR PORE COMPLEX PROTEIN NUP1"
definition: >-
  NUCLEAR PORE COMPLEX PROTEIN NUP1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33416. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 10 of its annotated subfamilies. Subfamilies participate in organelle organization, nucleus organization, nuclear envelope organization. Subfamilies localise to intracellular anatomical structure, nucleus, nuclear envelope.
