  - kind: GENERAL
    text: >-
      The SR-related and CTD-associated factor family includes proteins involved in the regulation of mRNA processing and stability. Members of the family function as anti-terminator proteins, preventing early mRNA termination during transcription. They achieve this by suppressing the use of early, alternative poly(A) sites, which prevents the generation of non-functional truncated proteins. These proteins associate with the phosphorylated C-terminal heptapeptide repeat domain (CTD) of RNA polymerase II's largest subunit, POLR2A, and bind nascent RNA to inhibit premature transcript cleavage and polyadenylation. Some family members also act as positive regulators of transcript elongation or are involved in alternative splicing regulation, contributing to the complexity of gene expression.
    source: "InterPro:IPR051485 abstract (LLM-generated, not curator-reviewed)"
