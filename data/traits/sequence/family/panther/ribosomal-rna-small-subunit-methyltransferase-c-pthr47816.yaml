identifier: PANTHER:PTHR47816
label: "RIBOSOMAL RNA SMALL SUBUNIT METHYLTRANSFERASE C"
definition: >-
  This family includes rRNA (guanine-N(2)-)-methyltransferases RsmC and RlmG whose structures are closely related and consist of two homologous domains; the N-terminal domain is involved in the recognition and binding of the substrate, and the C-terminal domain (CTD) mediates AdoMet-binding and the catalytic process. This entry also includes the uncharacterised proteins MJ0882 and YbxB, which are probable methyltransferases. RlmG is a specific AdoMet-dependent methyltransferase responsible for N2-methylation of G1835 in 23S rRNA, while RsmC specifically methylates the guanine in position 1207 of 16S rRNA in the 30S particle.
definition_source: "InterPro:IPR046977 abstract (PANTHER PTHR47816 is a member signature)"
