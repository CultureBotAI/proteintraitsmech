identifier: PANTHER:PTHR47397
label: "TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 19L"
definition: >-
  The tumour necrosis factor (TNF) receptor (TNFR) superfamily comprises more than 20 type-I transmembrane proteins. Family members are defined based on similarity in their extracellular domain -a region that contains many cysteine residues arranged in a specific repetitive pattern. The cysteines allow formation of an extended rod-like structure, responsible for ligand binding. Upon receptor activation, different intracellular signalling complexes are assembled for different members of the TNFR superfamily, depending on their intracellular domains and sequences. Activation of TNFRs can therefore induce a range of disparate effects, including cell proliferation, differentiation, survival, or apoptotic cell death, depending upon the receptor involved.
definition_source: "InterPro:IPR022333 abstract (PANTHER PTHR47397 is a member signature)"
