  - kind: GENERAL
    text: >-
      The protein family includes serine/threonine-protein kinases with diverse functions in plants and animals. In plants, members are involved in hormone perception, such as brassinosteroids and phytosulfokines, regulating development and defense responses. Some act as receptors for peptide hormones, maintaining root stem cell niches or mediating systemic nitrogen-demand signaling. In animals, one member is a multifunctional kinase implicated in neuronal plasticity, innate immunity, autophagy, and vesicle trafficking. It regulates RAB GTPases, affecting processes like synaptic vesicle trafficking, ciliogenesis, and Golgi apparatus function. It also plays roles in apoptosis and innate immunity, independent of its kinase activity. Some members have predicted inactive kinase domains, suggesting possible regulatory or scaffolding roles rather than catalytic functions.
    source: "InterPro:IPR051420 abstract (LLM-generated, not curator-reviewed)"
