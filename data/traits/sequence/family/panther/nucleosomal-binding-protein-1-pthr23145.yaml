identifier: PANTHER:PTHR23145
label: "NUCLEOSOMAL BINDING PROTEIN 1"
definition: >-
  HMGN5, also known as NBP-45, binds to nucleosomes via its nucleosomal binding domain (NBD), unfolds chromatin, and affects transcription. It binds preferentially to euchromatin and modulates the fidelity of the cellular transcription by counteracting linker histone-mediated chromatin compaction.
