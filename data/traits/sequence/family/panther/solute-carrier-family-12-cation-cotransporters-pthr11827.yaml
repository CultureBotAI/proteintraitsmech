identifier: PANTHER:PTHR11827
label: "SOLUTE CARRIER FAMILY 12, CATION COTRANSPORTERS"
definition: >-
  This is a family of K-Cl cotransporters. It includes bumetanide-sensitive sodium-(potassium)-chloride cotransporter, an electrically silent transporter system which is a mediator of sodium and chloride reabsorption. It plays a vital role in the regulation of ionic balance and cell volume. Bumetanide-sensitive sodium-(potassium)-chloride cotransporter belongs to the SLC12A family of transporters.
