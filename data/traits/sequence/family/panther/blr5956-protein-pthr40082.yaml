identifier: PANTHER:PTHR40082
label: "BLR5956 PROTEIN"
definition: >-
  Uroporphyrinogen-III synthase (U3S) catalyses the cyclisation of the linear hydroxymethylbilane (HMB) to uroporphyrinogen III (uro'gen III), the cyclic tetrapyrrole and physiologic precursor of haem, chlorophyl, and corrin. Uncharacterised homologues are also known from bacteria including Uncharacterized protein YjjA and Nitrate/nitrite assimilation regulator NnaR.
