identifier: PANTHER:PTHR13759
label: TWINFILIN
definition: >-
  This entry represents the twinfilin family. Its members include twinfilin from Drosophila and twinfilin-1/2 from mammals. They are actin-binding proteins involved in motile and morphological processes. They inhibit actin polymerisation, likely by sequestering G-actin.
