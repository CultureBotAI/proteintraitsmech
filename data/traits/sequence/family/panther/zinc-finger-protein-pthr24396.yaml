definitions:
  - kind: GENERAL
    text: >-
      ZINC FINGER PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24396. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
