identifier: PANTHER:PTHR21083
label: TWISTER
definition: >-
  Dynein axonemal assembly factor 6 is part of a complementary conserved R2TP-like HSP90 co-chaperone complex. The complex is required for cytoplasmic preassembly of flagellum axonemal dynein in spermatogenic cells, and therefore is required for sperm motility.
