identifier: PANTHER:PTHR48206
label: "CHLOROPLAST SENSOR KINASE, CHLOROPLASTIC"
definition: >-
  This family of proteins is involved in the regulation of photosynthesis in chloroplasts. Members act as sensor kinases that detect changes in the redox state of plastoquinone, which is a key component in the photosynthetic electron transport chain. These proteins play a crucial role in the long-term adaptation of photosystems I and II by modulating the transcription of reaction center genes, as well as in short-term adaptation through the reversible phosphorylation of the light-harvesting complex II. They are capable of autophosphorylation, which is influenced by the redox state of plastoquinone, and are also involved in the repression of certain chloroplast-encoded genes.
