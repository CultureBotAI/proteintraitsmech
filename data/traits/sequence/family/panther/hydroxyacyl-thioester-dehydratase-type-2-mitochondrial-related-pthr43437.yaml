      HYDROXYACYL-THIOESTER DEHYDRATASE TYPE 2, MITOCHONDRIAL-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43437. PANTHER protein class: dehydratase, lyase. Members are annotated with the molecular function hydro-lyase activity. Members participate in fatty acid biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
