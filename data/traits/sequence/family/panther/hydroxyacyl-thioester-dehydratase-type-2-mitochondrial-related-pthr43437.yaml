  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various metabolic processes, such as fatty acid synthesis and the hydration of enoyl-CoA substrates. Some proteins within this family function as 3-hydroxyacyl-[acyl-carrier-protein] dehydratases, which are essential for mitochondrial fatty acid synthesis and plant development. They may influence mitochondrial membrane lipid composition and contribute to energy supply and reactive oxygen species homeostasis. Other members are involved in the hydration of trans-2-enoyl-CoAs, playing a role in the production of polyhydroxyalkanoates, which are biopolyesters. The functions of some proteins in this family are not well characterized and are annotated based on sequence similarity.
    source: "InterPro:IPR050965 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
