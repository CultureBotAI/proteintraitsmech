identifier: PANTHER:PTHR12930
label: "ZINC FINGER PROTEIN 183"
definition: >-
  This entry contains proteins with a CCCH-type zinc finger, which bind zinc via cysteine and histidine residues in the motif C-x8-C-x5-C-x3-H, and a C3HC4 type RING finger. Proteins with this structure include: Pre-mRNA-splicing factor CWC24, a component of the CWC complex, which is involved in pre-mRNA splicing. RING finger protein 113A, an E3 ubiquitin-protein ligase that catalyses polyubiquitination of SNRNP200/BRR2 with non-canonical 'Lys-63'-linked polyubiquitin chains and CXCR4, leading to its degradation and thereby termination of CXCR4 signalling. RING finger protein 113B, which is uncharacterised.
