identifier: PANTHER:PTHR46276
label: "E3 UBIQUITIN-PROTEIN LIGASE UBR5"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE UBR5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46276. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function aminoacyltransferase activity, catalytic activity, acting on a protein, ubiquitin protein ligase activity. Members participate in positive regulation of canonical Wnt signaling pathway, regulation of cell communication, protein polyubiquitination. Members localise to cytoplasm, membrane-bounded organelle, nucleus.
