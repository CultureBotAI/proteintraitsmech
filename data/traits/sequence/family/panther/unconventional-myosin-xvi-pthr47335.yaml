  - kind: GENERAL
    text: >-
      This family of proteins includes unconventional myosins with ATPase activity, which are involved in intracellular movements. Members of this family interact with actin filaments and are thought to transport membranous compartments within cells. They play a role in brain development by targeting the catalytic subunit of protein phosphatase 1. Additionally, these proteins are involved in the activation of PI3K and the recruitment of the WAVE1 complex, which is important for regulating neuronal morphogenesis.
