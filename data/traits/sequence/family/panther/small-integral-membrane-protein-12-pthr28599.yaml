identifier: PANTHER:PTHR28599
label: "SMALL INTEGRAL MEMBRANE PROTEIN 12"
definition: >-
  This family of uncharacterised proteins is found in eukaryotes. Proteins in this family are described as small integral membrane protein 12. There are two conserved sequence motifs: IGYN and SPSL.
