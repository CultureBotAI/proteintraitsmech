identifier: PANTHER:PTHR33689
label: "FAS-BINDING FACTOR 1"
definition: >-
  Intraflagellar transport (IFT) machinery is required for the assembly and maintenance of cilia. Fas-binding factor 1 (FBF1) is a transition fibre protein required for the ciliary import of assembled IFT particles at the ciliary base. FBF1, also known as albatross, has also being shown to be involved in regulating polarization in epithelial cells.
