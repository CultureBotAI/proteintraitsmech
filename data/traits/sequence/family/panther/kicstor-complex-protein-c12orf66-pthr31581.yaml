identifier: PANTHER:PTHR31581
label: "KICSTOR COMPLEX PROTEIN C12ORF66"
definition: >-
  This entry includes KICSTOR subunit 2 (KICS2, also known as C12orf66-like) proteins. Human KICS2 is part of the KICSTOR complex that functions in the amino acid-sensing branch of the TORC1 signalling pathway.
