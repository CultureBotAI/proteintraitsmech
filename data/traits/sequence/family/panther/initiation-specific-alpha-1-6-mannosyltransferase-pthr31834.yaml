identifier: PANTHER:PTHR31834
label: "INITIATION-SPECIFIC ALPHA-1,6-MANNOSYLTRANSFERASE"
definition: >-
  This entry includes Och1 and its homologue, Hoc1. Och1 is a alpha-1,6-mannosyltransferase involved in the N-linked oligosaccharide modification in the Golgi apparatus with the addition of mannose to the Man 8 GlcNAc 2 or Man 9 GlcNAc 2 endoplasmic reticulum intermediates. Hoc1 is a subunit of the M-Pol II complex and possesses alpha-1,6-mannosyltransferase activity.
