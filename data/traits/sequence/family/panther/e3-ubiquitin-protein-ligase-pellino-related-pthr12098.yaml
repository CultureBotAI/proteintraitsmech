identifier: PANTHER:PTHR12098
label: "E3 UBIQUITIN-PROTEIN LIGASE PELLINO-RELATED"
definition: >-
  Pellino proteins are E3 ubiquitin ligases that play an important role in immunity. Pellinos contain a CHC2CHC2 RING E3 ubiquitin ligase domain. Mammalian Pellinos have been shown to mediate polyubiquitination of interleukin-1 receptor-associated kinase (IRAK).
