identifier: PANTHER:PTHR47025
label: "AUTOIMMUNE REGULATOR"
definition: >-
  AUTOIMMUNE REGULATOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47025. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 13 of its annotated subfamilies. Subfamilies are annotated with the molecular function RNA polymerase II transcription regulatory region sequence-specific DNA binding, histone binding, chromatin binding. Subfamilies participate in positive regulation of transcription by RNA polymerase II. Subfamilies localise to nucleus, intracellular anatomical structure.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
