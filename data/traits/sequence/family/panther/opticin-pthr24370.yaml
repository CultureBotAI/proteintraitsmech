  - kind: GENERAL
    text: >-
      The LRWD1 family proteins are essential for the G1/S transition of the cell cycle. They recruit and stabilize the origin recognition complex (ORC) onto chromatin during G1 to establish the pre-replication complex (preRC) and to heterochromatic sites in post-replicated cells. Members of the LRWD1 family bind a combination of DNA and histone methylation repressive marks on heterochromatin, including histone H3 and H4 trimethylation marks H3K9me3, H3K27me3, and H4K20me3. This cooperative binding with DNA methylation is crucial for the silencing of major satellite repeats. The entire WD repeat region of LRWD1 proteins is necessary for these interactions, as well as for chromatin association. The family plays a significant role in maintaining the stability of ORC components ORC2, ORC3, and ORC4, which are vital for DNA replication initiation and chromatin organization.
    source: "InterPro:IPR052489 abstract (LLM-generated, not curator-reviewed)"
