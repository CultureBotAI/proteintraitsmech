identifier: PANTHER:PTHR10240
label: ALPHA-S1-CASEIN
definition: >-
  Alpha-S1-casein plays an important role in the capacity of milk to transport calcium phosphate. It is also required for efficient export of the other caseins from the endoplasmic reticulum and plays a key role in early steps of casein micelle biogenesis and casein transport in the secretory pathway. Caseins are the major protein constituent of milk. In milk, caseins interact with calcium phosphate, forming large stable colloidal particles termed micelles. These micelles make it possible to maintain a supersaturated calcium phosphate concentration in milk, providing the newborn with sufficient calcium phosphate for the mineralisation of calcified tissues. Caseins can be classified into two families; the first consists of the kappa-caseins, and the second groups the alpha-s1, alpha-s2, and beta-caseins. The alpha/beta caseins are a rapidly diverging family of proteins. However two regions are conserved: a cluster of phosphorylated serine residues and the signal sequence.
