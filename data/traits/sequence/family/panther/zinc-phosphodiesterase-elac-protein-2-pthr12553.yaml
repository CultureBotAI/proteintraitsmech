identifier: PANTHER:PTHR12553
label: "ZINC PHOSPHODIESTERASE ELAC PROTEIN 2"
definition: >-
  This family represents a group of zinc phosphodiesterases including zinc phosphodiesterase ELAC protein 2 (RNZ2/ELAC2, also known as ElaC homologue protein 2 and tRNase Z 2) from human and its homologues. RNZ2 has mitochondrial tRNA 3'-processing endonuclease activity. It is involved in tRNA maturation, by removing a 3'-trailer from precursor tRNA, playing an essential role in the production of mature tRNAs. The homologue from Drosophila has some tRNA 3'-processing endonuclease activity of nuclear and mitochondrial pre-tRNA. It may participate in tRNA processing in the developing embryo. Mutations in this protein have been associated with severe form of infantile cardiomyopathy and and prostate cancer. The homologue from C. elegans HOE-1 has been shown to compromise fertility.
definition_source: "InterPro:IPR047151 abstract (PANTHER PTHR12553 is a member signature)"
