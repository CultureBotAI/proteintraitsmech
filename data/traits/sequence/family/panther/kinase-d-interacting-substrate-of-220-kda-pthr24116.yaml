  - kind: GENERAL
    text: >-
      This family of proteins is involved in signal transduction pathways related to neuronal development, regeneration, and synaptic signaling. Members of this family promote sustained MAP-kinase signaling through a Rap1-dependent mechanism, which is activated by neurotrophins. They serve as docking sites for complexes like CRKL-C3G, facilitating sustained ERK activation. These proteins are implicated in the localization and activation of receptor tyrosine kinases, such as EPHA4, and enhance JAK/STAT signaling in cooperation with SNTA1. They are also involved in the recruitment of RAPGEF2 to late endosomes, contributing to neurite outgrowth. Additionally, they may modulate stress-induced apoptosis in melanoma cells via the MEK/ERK pathway.
    source: "InterPro:IPR052771 abstract (LLM-generated, not curator-reviewed)"
