identifier: PANTHER:PTHR46535
label: "NEDD4-BINDING PROTEIN 2"
definition: >-
  This family of proteins includes enzymes with endonuclease activity that are involved in mRNA surveillance and DNA repair or recombination processes. Members of this family are capable of recognizing and binding specific polyubiquitinated proteins, which facilitates their recruitment to sites of action such as stalled ribosomes or DNA damage. Within the context of mRNA surveillance, these proteins play a role in the No-Go Decay (NGD) pathway, where they mediate the cleavage of mRNAs in response to ribosome collisions, thereby contributing to the maintenance of cellular homeostasis. In addition to their role in mRNA cleavage, some family members also possess 5'-polynucleotide kinase activity, which may be important in DNA repair mechanisms. The domains present in these proteins, such as the Smr domain, are responsible for their enzymatic activities and specific interactions with other proteins or nucleic acids.
