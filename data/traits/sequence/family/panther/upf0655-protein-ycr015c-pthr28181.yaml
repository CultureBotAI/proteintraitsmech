  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with phosphatase activity, specifically involved in the dephosphorylation of various substrates. Members of this family play roles in metabolic processes such as the regulation of phosphate uptake and the prevention of toxic accumulation of polyol phosphates, which can interfere with glycolysis. Some proteins within this family are also implicated in the acetylation of histone proteins, which is critical for DNA damage checkpoint activation. The enzymes generally belong to the HAD-like hydrolase superfamily, indicating a shared structural fold and mechanistic features in their catalytic activity.
