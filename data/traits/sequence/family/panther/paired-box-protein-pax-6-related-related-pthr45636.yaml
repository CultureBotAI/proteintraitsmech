identifier: PANTHER:PTHR45636
label: "PAIRED BOX PROTEIN PAX-6-RELATED-RELATED"
definition: >-
  PAX family members are transcription factors characterised by a ~128-amino-acid DNA-binding paired domain that makes sequence specific contacts with DNA. In mammals, there are nine Pax proteins (PAX1-9). They regulate the morphogenesis of a wide range of organs and are key factors for the development of mammalian sensory organs such as the eye (Pax6, Pax2), nose (Pax6) and ears (Pax2, Pax8).
