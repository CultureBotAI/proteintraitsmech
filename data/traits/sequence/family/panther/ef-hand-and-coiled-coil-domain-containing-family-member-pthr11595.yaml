identifier: PANTHER:PTHR11595
label: "EF-HAND AND COILED-COIL DOMAIN-CONTAINING FAMILY MEMBER"
definition: >-
  This family represents Elongation factor 1-beta/delta, which stimulate the exchange of GDP bound to EF-1-alpha to GTP, regenerating EF-1-alpha for another round of transfer of aminoacyl-tRNAs to the ribosome. Elongation factor EF1B (also known as EF-Ts or EF-1beta/gamma/delta) is a nucleotide exchange factor that is required to regenerate EF1A from its inactive form (EF1A-GDP) to its active form (EF1A-GTP). EF1A is then ready to interact with a new aminoacyl-tRNA to begin the cycle again. EF1B is more complex in eukaryotes than in bacteria, and can consist of three subunits: EF1B-alpha (or EF-1beta), EF1B-gamma (or EF-1gamma) and EF1B-beta (or EF-1delta).
definition_source: "InterPro:IPR049720 abstract (PANTHER PTHR11595 is a member signature)"
