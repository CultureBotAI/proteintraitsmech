      APOPTOSIS-INDUCING FACTOR 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43557. PANTHER protein class: oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on NAD(P)H. Members localise to cytoplasm.
