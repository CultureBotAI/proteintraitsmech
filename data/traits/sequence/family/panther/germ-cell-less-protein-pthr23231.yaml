identifier: PANTHER:PTHR23231
label: "GERM CELL-LESS PROTEIN"
definition: >-
  This entry includes protein germ cell-less (Gcl) from Drosophila melanogaster and related proteins, such as GMCL1 and GMCL2 from mammals. Gcl is required for germline formation. It promotes PGC (Primordial Germ Cells) fate by mediating degradation of Torso, a receptor tyrosine kinase (RTK) and major determinant of somatic cell fate.
