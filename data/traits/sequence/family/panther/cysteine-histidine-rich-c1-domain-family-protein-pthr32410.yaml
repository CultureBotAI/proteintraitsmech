identifier: PANTHER:PTHR32410
label: "CYSTEINE/HISTIDINE-RICH C1 DOMAIN FAMILY PROTEIN"
definition: >-
  This family of proteins is crucial for plant reproductive development. Members are involved in the formation of large vacuoles, which are essential during the early stages of gametophyte development. They may play a role in the regulation of vesicular fusion, facilitating vacuole formation in both female and male gametophytes. The proper function of these proteins ensures successful megagametogenesis and microgametogenesis, which are critical processes for sexual reproduction in plants.
