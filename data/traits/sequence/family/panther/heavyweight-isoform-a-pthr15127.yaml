  - kind: GENERAL
    text: >-
      This family of proteins includes SH2 domain-containing adapter proteins involved in various signal transduction pathways. They function as intermediaries that connect activated receptors to downstream signaling molecules. These proteins play crucial roles in processes such as angiogenesis, T-cell antigen receptor signaling, interleukin-2 signaling, apoptosis, and differentiation of neuronal cells. They are also implicated in the regulation of insulin signaling through IRS1 and IRS2. The SH2 domain within these proteins is known to bind phosphopeptides with a specific consensus sequence, facilitating interactions with a range of receptors and signaling proteins. Additionally, some family members may influence apoptosis in response to platelet-derived growth factor (PDGF). One member from Caenorhabditis elegans is involved in neuroblast migration during larval development.
    source: "InterPro:IPR051846 abstract (LLM-generated, not curator-reviewed)"
