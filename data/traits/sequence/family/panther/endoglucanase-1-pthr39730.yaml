identifier: PANTHER:PTHR39730
label: "ENDOGLUCANASE 1"
definition: >-
  This family of proteins includes enzymes that catalyze the endohydrolysis of 1,4-beta-glucosidic linkages in various substrates such as cellulose, lichenin, and cereal beta-D-glucans. Members of this family are characterized by their ability to break down complex carbohydrates into simpler sugars, with a preference for barley beta-glucan and carboxymethylcellulose. The enzymatic activity results in the production of oligosaccharides of varying lengths, including cellobiose, cellotriose, and cellotetraose. These enzymes do not act on crystalline cellulose or shorter oligosaccharides like cellobiose or cellotriose. The activity of these enzymes is generally not affected by metal ions, with the exception of Mn(2+), which can reduce the activity. This family is part of the glycosyl hydrolase 45 group, which is implicated in the degradation of cell wall components in plants and microorganisms.
