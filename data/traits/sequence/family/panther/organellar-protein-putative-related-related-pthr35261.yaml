identifier: PANTHER:PTHR35261
label: "ORGANELLAR PROTEIN, PUTATIVE-RELATED-RELATED"
definition: >-
  This family of proteins is involved in the regulation of metabolic processes, specifically in the negative regulation of gluconeogenesis. Members of this family are implicated in the transport of certain enzymes into vesicles for degradation, playing a role in the maintenance of cellular metabolic balance. The characterized member from yeast suggests an indirect mechanism of action through the import of enzymes into vacuolar import and degradation vesicles, which may be a conserved function within the family.
