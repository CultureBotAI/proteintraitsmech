identifier: PANTHER:PTHR24652
label: "LOW-DENSITY LIPOPROTEIN RECEPTOR CLASS A DOMAIN-CONTAINING PROTEIN 2"
definition: >-
  The his entry includes Low-density lipoprotein receptor class A domain-containing protein 2 from human (LDLRAD2), whose function is unknown and Mig-13 (also known as abnormal cell migration protein 13) from C. elegans. Mig-13 is probably a receptor that acts as an upstream signalling protein to promote the guidance, migration and positioning of the right Q neuroblast (QR) and its descendants along the anteroposterior body axis, and also the anterior migration of BDU interneurons during larval development. It is involved in cytoskeleton dynamics regulating the organisation of the actin cytoskeleton at the leading edge of migrating cells to ensure correct Q cell polarity and promote migration.
definition_source: "InterPro:IPR042333 abstract (PANTHER PTHR24652 is a member signature)"
