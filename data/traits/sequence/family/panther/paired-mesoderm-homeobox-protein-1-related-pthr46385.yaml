identifier: PANTHER:PTHR46385
label: "PAIRED MESODERM HOMEOBOX PROTEIN 1-RELATED"
definition: >-
  This entry includes the paired-class homeobox proteins Prx1 and Prx2. They play essential roles in limb, heart and craniofacial development. They are required for correct mouse skeletogenesis in many structures. They may be involved in the early stage of rat pituitary differentiation and play a role in morphogenesis of the chick mandibular processes.
