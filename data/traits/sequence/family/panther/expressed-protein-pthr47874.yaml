identifier: PANTHER:PTHR47874
label: "EXPRESSED PROTEIN"
definition: >-
  This entry represents a group of plant pentatricopeptide repeat-containing proteins, including PPR5 from maize and rice and At2g30780/At4g39620/At2g48000/At3g06430 from Arabidopsis. PPR5 is a chloroplastic protein that binds to single-stranded RNA and influences both RNA stability and splicing. It has been shown to stabilise the chloroplast trnG pre-RNA by directly binding to a group II intron, where it protects an endonuclease-sensitive site and stimulates splicing. At4g39620 is involved in embryo morphogenesis. At3g06430, also known as PPR2 and EMBRYO DEFECTIVE 2750 (EMB2750), binds to plastid 23S rRNA and plays an important role in the first mitotic division during gametogenesis and in cell proliferation during embryogenesis.
definition_source: "InterPro:IPR044179 abstract (PANTHER PTHR47874 is a member signature)"
