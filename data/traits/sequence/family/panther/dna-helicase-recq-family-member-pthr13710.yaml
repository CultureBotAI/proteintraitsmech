identifier: PANTHER:PTHR13710
label: "DNA HELICASE RECQ FAMILY MEMBER"
definition: >-
  DNA HELICASE RECQ FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13710. PANTHER protein class: DNA helicase, DNA metabolism protein. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, 3'-5' DNA helicase activity. and participate in DNA repair, DNA damage response, cellular response to stimulus. and localise to cytoplasm, non-membrane-bounded organelle, chromosome.
