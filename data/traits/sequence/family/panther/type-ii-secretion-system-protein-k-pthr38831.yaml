identifier: PANTHER:PTHR38831
label: "TYPE II SECRETION SYSTEM PROTEIN K"
definition: >-
  Members of this family are involved in the general secretion pathway required for the energy-dependent secretion of extracellular factors such as proteases and toxins from the periplasm, such as GspK. GspK plays a role in pseudo pilus assembly and seems to control its length. It interacts with the pseudopilus tip complex that is critical for the recognition and binding of secretion substrates. The family includes proteins such as ExeK, PulK, OutK and XcpX.
