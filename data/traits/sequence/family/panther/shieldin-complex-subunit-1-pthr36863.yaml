identifier: PANTHER:PTHR36863
label: "SHIELDIN COMPLEX SUBUNIT 1"
definition: >-
  SHLD1, also known as RINN3, is a component of the shieldin complex, a vertebrate-specific protein complex which functions as a downstream effector in the 53BP1 pathway, regulates NHEJ (non-homologous end joining).
