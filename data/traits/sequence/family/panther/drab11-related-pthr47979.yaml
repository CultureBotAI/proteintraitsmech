identifier: PANTHER:PTHR47979
label: DRAB11-RELATED
definition: >-
  The Rab family of small GTPases are key regulators of intracellular membrane trafficking, which encompasses the movement of vesicles between different cellular organelles and the plasma membrane. Members of this family cycle between an active GTP-bound state and an inactive GDP-bound state, enabling them to recruit various effectors responsible for vesicle formation, movement, tethering, and fusion. These proteins are involved in processes such as vesicular traffic, protein transport, endocytic recycling, cytokinesis, cell polarisation, and ciliogenesis initiation. They also play roles in the regulation of cell survival, invasive migration, epithelial morphogenesis, and the maintenance of organelle identity and morphology. Additionally, they are implicated in the maturation and acidification of phagosomes, autophagy, and the oxidative stress response.
