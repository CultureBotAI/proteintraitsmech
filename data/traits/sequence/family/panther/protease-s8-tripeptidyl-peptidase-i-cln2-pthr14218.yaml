  - kind: GENERAL
    text: >-
      PROTEASE S8 TRIPEPTIDYL PEPTIDASE I CLN2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14218. PANTHER protein class: serine protease, protease. Members are annotated with the molecular function exopeptidase activity, catalytic activity, acting on a protein, endopeptidase activity. and participate in nitrogen compound metabolic process, organic substance metabolic process, primary metabolic process.
