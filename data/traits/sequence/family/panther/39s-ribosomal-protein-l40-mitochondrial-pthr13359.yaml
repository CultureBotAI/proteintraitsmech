identifier: PANTHER:PTHR13359
label: "39S RIBOSOMAL PROTEIN L40, MITOCHONDRIAL"
definition: >-
  This entry represents the large ribosomal subunit protein mL40 from animals and plants, previously known as L40. mL40 is a component of the mitochondrial large ribosomal subunit (39S), it binds to the major groove of the anticodon stem of mt-tRNA(Val) in the central protuberance.
