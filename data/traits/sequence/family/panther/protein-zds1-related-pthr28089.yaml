identifier: PANTHER:PTHR28089
label: "PROTEIN ZDS1-RELATED"
definition: >-
  In budding yeasts, Zds1 and Zds2 interact with Cdc55 and are required for the completion of mitotic exit and cytokinesis. They are involved in activation of the Cdc14 phosphatase at anaphase onset. Fisson yeast Zds1 has been shown to control sexual differentiation, cell wall integrity and cell morphology.
