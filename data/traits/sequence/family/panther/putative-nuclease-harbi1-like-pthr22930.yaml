identifier: PANTHER:PTHR22930
label: "Putative nuclease HARBI1-like"
definition: >-
  This entry represents a group of Harbinger transposase-derived proteins, including HARBI1 from animals and ALP1/ALP1L from Arabidopsis. Proteins in this family may have nuclease activity, but do not appear to have transposase activity. ALP1 is a domesticated Harbinger-related nuclease that interacts genetically with several PcG and trxG components and antagonizes PcG silencing.
definition_source: "InterPro:IPR045249 abstract (PANTHER PTHR22930 is a member signature)"
