definitions:
  - kind: GENERAL
    text: >-
      EF-HAND DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR37009. Members are annotated with the molecular function actin filament binding. and participate in actin filament organization, cellular component biogenesis, cellular component organization. and localise to intracellular non-membrane-bounded organelle, cell cortex, cortical cytoskeleton.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of actin dynamics. Members of this family are thought to play a role in the formation and remodeling of actin structures such as filopodia and pseudopodia, which are cellular protrusions that facilitate movement and cell shape changes. The actin-bundling activity of these proteins is regulated by calcium levels, suggesting a mechanism by which intracellular calcium signals can influence the cytoskeletal architecture and, consequently, cellular motility and morphology.
    source: "InterPro:IPR053356 abstract (LLM-generated, not curator-reviewed)"
