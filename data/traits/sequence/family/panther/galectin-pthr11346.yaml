identifier: PANTHER:PTHR11346
label: GALECTIN
definition: >-
  This entry represents members of a family of galactoside-binding lectins (galectins) with related amino acid sequences, sometimes referred to as S-type or S-Lac lectins. Members of this family are found in tissues of many animals, ranging from lower invertebrates such as sponges and nematodes to mammals, including humans. This family also includes Galectin-related protein and Grifin, galectin relatives which lack of beta-galactosides binding activity. Animal lectins are proteins that bind to sugars and are involved in most non-structural roles of sugars, including trafficking of glycoconjugates and cell-cell recognition. Although they may be structurally very complex, they typically bind through the activity of a specific compact protein domain known as a carbohydrate-binding domain or CRD. Animal lectins display a wide variety of architectures, and are classified according to the carbohydrate-recognition domain (CRD) of which there are two main types, S-type and C-type. Galectins (previously S-lectins) bind exclusively beta-galactosides like lactose. They do not require metal ions for activity. Galectins are found predominantly, but not exclusively in mammals. Their function is unclear. They are developmentally regulated and may be involved in differentiation, cellular regulation and tissue construction. Mammalian galectins typically bind beta-galactosides. Their CRD shows a structural similarity to L-type lectin CRDs, but no strong sequence similarity, suggesting convergent evolution. They are classified into three subgroups: proto type, which contain one CRD (Gal-1, -2, -5, -7, -10, -11, -13, -14 and -15); tandem repeat type, which contain two CRDs in tandem (Gal-4, -6, -8, -9 and -12); and chimera type, which contain one CRD and an additional non-lectin domain (Gal-
