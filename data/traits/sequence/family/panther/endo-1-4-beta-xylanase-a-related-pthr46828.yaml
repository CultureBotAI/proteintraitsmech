identifier: PANTHER:PTHR46828
label: "ENDO-1,4-BETA-XYLANASE A-RELATED"
definition: >-
  Glycoside hydrolase family 11 comprises enzymes with only one known activity, xylanase ( ), involved in the hydrolysis of xylan. These enzymes were formerly known as cellulase family G. O-Glycosyl hydrolases ( ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
