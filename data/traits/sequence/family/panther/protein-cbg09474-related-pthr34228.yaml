  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that hydrolyze glycerophospholipids to produce fatty acids and lysophospholipids. Members of this family typically act at the sn-2 position of phospholipids and release arachidonic acid, a precursor of eicosanoids which are potent mediators of cellular signaling involved in inflammation and immune response. These enzymes play a role in various biological processes including membrane remodeling, signal transduction, and cell proliferation. They may also participate in the pathogenesis of diseases related to inflammation and immune function.
