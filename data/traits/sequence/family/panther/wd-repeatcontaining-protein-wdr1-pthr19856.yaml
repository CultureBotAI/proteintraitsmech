label: "WD-REPEATCONTAINING PROTEIN  WDR1"
definition: >-
  WD-REPEATCONTAINING PROTEIN WDR1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19856. PANTHER protein class: cytoskeletal protein, non-motor actin binding protein. Members are annotated with the molecular function actin filament binding. Members participate in actin filament organization, actin polymerization or depolymerization, cellular component organization. Members localise to cortical actin cytoskeleton, cell cortex, cortical cytoskeleton.
