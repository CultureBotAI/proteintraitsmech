identifier: PANTHER:PTHR12086
label: "EF-HAND DOMAIN  C-TERMINAL  CONTAINING PROTEIN"
definition: >-
  This entry represents a group of EF-hand domain-containing proteins, including EFHC1, EFHC2 and EFHB. EFHC1 has been shown to interact with microtubules to regulate cell division and cortical development. Mutations in the EFHC1 gene has been linked to juvenile myoclonic epilepsy. The function of EFHC2 and EFHB is not clear.
