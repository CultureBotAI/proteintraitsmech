identifier: PANTHER:PTHR21564
label: "BRAKELESS PROTEIN"
definition: >-
  ZNF608 represses the expression of ZNF609, which in turn represses recombination-activating gene 1 (Rag1) and Rag2 expression in thymocytes. Interestingly, ZNF609 generates circular RNA (Cir-ZNF609), a novel kind of noncoding RNA that form loop structures without 5'-3' polarities and polyadenylated tails. Cir-ZNF609 has been found to regulate myoblast proliferation and AKT3 expression. Cir-ZNF609 has also been linked to vascular endothelial dysfunction.
