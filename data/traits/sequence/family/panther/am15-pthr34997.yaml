identifier: PANTHER:PTHR34997
label: AM15
definition: >-
  This entry represents Secreted LysM effector LysM1 from Trichophyton rubrum and similar sequences mainly found in fungi. LysM1 binds two substrates, chitin and N-linked oligosaccharides associated with human skin glycoproteins. Chitin oligosaccharides are degradation products of fungal cell walls. Members of this family may play a role in modulating the host's immune response during fungal invasion by sequestering these oligosaccharides. The presence of LysM domains suggests a specific binding affinity to chitin and possibly related carbohydrates, which could be a mechanism for attenuating the host defence system.
