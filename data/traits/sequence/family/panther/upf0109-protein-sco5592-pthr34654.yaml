identifier: PANTHER:PTHR34654
label: "UPF0109 PROTEIN SCO5592"
definition: >-
  This family represents the RNA-binding protein KhpA, a probable RNA chaperone. It forms a complex with KhpB (also known as Jag or EloR) which binds to cellular RNA and controls its expression. KhpA plays a role in peptidoglycan (PG) homeostasis and cell length regulation. The KhpA-KhpB complex stimulates or controls elongasome-mediated lateral cell wall biosynthesis. It is not clear what is the function of the KhpA homooligomer in vivo. KhpA forms homodimers, additionally, it interacts with the KH-II domain of EloR, a key regulator of cell elongation in S. pneumoniae, forming an EloR/KhpA heterodimer.
definition_source: "InterPro:IPR020627 abstract (PANTHER PTHR34654 is a member signature)"
