  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of the androgen receptor through a negative feedback mechanism that includes the recruitment of a histone deacetylase complex. Members of this family are also implicated in the structural integrity of cilia, specifically as microtubule inner proteins within the axoneme of motile cilia. They are essential for the proper beating of cilia, as they are part of the dynein-decorated doublet microtubules. Additionally, there is an interaction with protein DJ-1, which can counteract the inhibitory effect on the androgen receptor by disrupting the associated complex.
