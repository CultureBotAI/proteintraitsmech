identifier: PANTHER:PTHR16120
label: "AP-5 COMPLEX SUBUNIT SIGMA-1"
definition: >-
  This family of proteins are subunits of the adaptor protein complex AP-5, which is involved in endosomal sorting and has links with hereditary spastic paraplegia. It is required for efficient homologous recombination DNA double-strand break repair.
