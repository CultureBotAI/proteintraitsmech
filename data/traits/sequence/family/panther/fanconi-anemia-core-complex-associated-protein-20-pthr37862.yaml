identifier: PANTHER:PTHR37862
label: "FANCONI ANEMIA CORE COMPLEX-ASSOCIATED PROTEIN 20"
definition: >-
  This family of proteins is involved in the cellular response to DNA damage, specifically in the repair of DNA interstrand cross-links (ICLs). Members of this family possess a UBZ2-type zinc finger domain that preferentially binds 'Lys-63'-linked polyubiquitin, a post-translational modification often associated with DNA repair pathways. These proteins are essential components of the Fanconi anemia (FA) complex, a multiprotein assembly that plays a pivotal role in the recognition and repair of ICLs. Upon DNA damage, they bind ubiquitin chains generated at the site of damage, facilitating the recruitment of the FA complex to enable repair. Additionally, they interact with translesion synthesis machinery, such as the REV1 protein, to promote DNA synthesis across damaged templates, thereby contributing to genomic stability.
