identifier: PANTHER:PTHR24232
label: "G-PROTEIN COUPLED RECEPTOR"
definition: >-
  G-PROTEIN COUPLED RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24232. PANTHER protein class: G-protein coupled receptor. Members are annotated with the molecular function G protein-coupled receptor activity. Members participate in positive regulation of intracellular signal transduction, regulation of Rho protein signal transduction, phospholipase C-activating G protein-coupled receptor signaling pathway. Members localise to plasma membrane, cell periphery.
