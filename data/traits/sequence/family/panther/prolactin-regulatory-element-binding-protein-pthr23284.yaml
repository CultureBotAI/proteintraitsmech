identifier: PANTHER:PTHR23284
label: "PROLACTIN REGULATORY ELEMENT BINDING PROTEIN"
definition: >-
  This entry represents a group of guanine nucleotide-exchange factors, including Sec12 and its paralogue, Sed4, from budding yeasts. Sec12 is an ER type II membrane protein and a guanine nucleotide-exchange factor for Sar1 (a small GTPase). It is required for the initiation of COPII vesicle formation in ER to Golgi transport. Sed4 has been shown to bind to cargo-free Sar1, stimulates Sar1 GTP hydrolysis and promotes limited coat disassembly.
definition_source: "InterPro:IPR045260 abstract (PANTHER PTHR23284 is a member signature)"
