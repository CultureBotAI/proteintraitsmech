identifier: PANTHER:PTHR46010
label: "PROTEIN IWS1 HOMOLOG"
definition: >-
  The IWS1 family comprises transcription factors that play crucial roles in RNA polymerase II (RNAPII) transcription regulation. Members of the IWS1 family are involved in various stages of the transcription process, including post-recruitment and recruitment of SPT15/TBP. They are key in defining the composition of the RNAPII elongation complex and modulating the production of mature mRNA transcripts. The IWS1 family proteins act as assembly factors, recruiting multiple components to the RNAPII elongation complex. They bind to the transcription elongation factor SUPT6H associated with the C-terminal domain (CTD) of POLR2A, facilitating the recruitment of mRNA export factors and histone modifying enzymes. This ensures proper mRNA splicing, efficient mRNA export, and elongation-coupled H3K36 methylation, a hallmark of active transcription.
