identifier: PANTHER:PTHR45809
label: "VIRAL IAP-ASSOCIATED FACTOR HOMOLOG"
definition: >-
  This family of proteins is involved in various cellular processes, including acting as chaperones for specific receptors, such as the angiogenic VEGF receptor KDR/VEGFR2, by increasing their stability through the inhibition of ubiquitination and degradation. Members of this family are known to interact with the chaperonin-containing T-complex (CCT), modulating its activity and consequently affecting the folding of cytoskeletal actin. Additionally, these proteins play a role in the cellular response to heat shock by working alongside other chaperone complexes. They are also implicated in the regulation of apoptosis through the modulation of caspase activation.
