identifier: PANTHER:PTHR21530
label: "PHEROMONE SHUTDOWN PROTEIN"
definition: >-
  This entry includes TraB/PrgY proteins which have been identified in gut bacterium Enterococcus faecalis, and are induced by pheromones. This induction rends the host bacterium insensitive to self-induction by its own pheromones, and prevents the transfer of the pheromone-inducible conjugative plasmids to bacteria that already contain it. TraB proteins belong to the Tiki-like superfamily, and based on its homology to Tiki, it has been proposed that TraB acts as a protease in the inactivation of mating pheromone, cleaving at the amino-terminus. This family includes TraB domain-containing proteins from mammals, whose function is not clear, and TraB-like proteins from bacteria.
definition_source: "InterPro:IPR046345 abstract (PANTHER PTHR21530 is a member signature)"
