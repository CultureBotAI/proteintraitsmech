  - kind: GENERAL
    text: >-
      This family of proteins includes transposases and integrases, which are enzymes that catalyze the movement of DNA segments within genomes. Transposases are responsible for the cut-and-paste mechanism of transposable elements, allowing for the insertion of DNA at new genomic locations. Integrases typically facilitate the integration of viral DNA into the host genome, which is a critical step in the viral replication cycle. Members of this family share structural similarities and are involved in processes that contribute to genetic diversity and evolution.
    source: "InterPro:IPR051917 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
