identifier: PANTHER:PTHR11410
label: "ATP SYNTHASE SUBUNIT A"
definition: >-
  Transmembrane ATPases are membrane-bound enzyme complexes/ion transporters that use ATP hydrolysis to drive the transport of protons across a membrane. Some transmembrane ATPases also work in reverse, harnessing the energy from a proton gradient, using the flux of ions across the membrane via the ATPase proton channel to drive the synthesis of ATP. This entry represents the F0 subunit mostly found in bacteria and mitochondria.
