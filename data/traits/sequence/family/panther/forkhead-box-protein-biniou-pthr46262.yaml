definitions:
  - kind: GENERAL
    text: >-
      FORKHEAD BOX PROTEIN BINIOU — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46262. PANTHER protein class: DNA-binding transcription factor, helix-turn-helix transcription factor, winged helix/forkhead transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in anatomical structure morphogenesis, regulation of macromolecule metabolic process, regulation of nucleobase-containing compound metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors characterized by a conserved forkhead domain. Members of this family are involved in the regulation of gene expression, particularly in the development and differentiation of various tissues. They act as transcription activators for lung-specific genes and play roles in smooth muscle differentiation during gut development. These proteins are also implicated in the proliferation of lateral plate mesoderm and are part of regulatory networks controlling visceral mesoderm development and midgut morphogenesis. They bind to specific DNA sequences to regulate the expression of target genes, which may include those involved in cell fate determination and tissue-specific functions.
    source: "InterPro:IPR051770 abstract (LLM-generated, not curator-reviewed)"
