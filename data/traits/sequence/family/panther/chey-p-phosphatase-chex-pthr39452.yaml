identifier: PANTHER:PTHR39452
label: "CHEY-P PHOSPHATASE CHEX"
definition: >-
  CheX is responsible for modulating the bacterial swimming behaviour in the presence of external chemicals (nutrients and repellents). CheX is very closely related to the CheC chemotaxis phosphatase, but it dimerises in a different way, via a continuous β sheet between the subunits. CheC and CheX both dephosphorylate CheY, which controls the sense of flagella rotation and thereby determines swimming behaviour. The structures of CheX and CheC have been solved.
definition_source: "InterPro:IPR038756 abstract (PANTHER PTHR39452 is a member signature)"
