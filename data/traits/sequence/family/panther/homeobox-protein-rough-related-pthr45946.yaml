identifier: PANTHER:PTHR45946
label: "HOMEOBOX PROTEIN ROUGH-RELATED"
definition: >-
  This entry represents a group of homeobox proteins, including HOX-A1/B1/D1 (HXA1/B1/D1) and related proteins from animals. The homeobox domain is a DNA binding domain. Human HOX genes are critical for development of the central nervous system. They have been also implicated in vascular development and angiogenesis, particularly with regulation of genes involved in cell-cell or cell-extracellular matrix (ECM) interactions. HXA1 has been linked to the Bosley-Salih-Alorainy syndrome (BSAS) or the Athabascan brainstem dysgenesis syndrome (ABDS). HXB1 is a transcription factor that play important roles in early vertebrate development and its expression is associated with tumours. HOXD1 plays a significant role in endothelial cell functions by regulating the expression of ITGB1. Homeobox protein rough from Drosophila melanogaster is a member of this group of proteins. It is required to establish the unique cell identity of photoreceptors R2 and R5 and consequently for ommatidial assembly in the developing eye imaginal disk in the organism.
definition_source: "InterPro:IPR046327 abstract (PANTHER PTHR45946 is a member signature)"
