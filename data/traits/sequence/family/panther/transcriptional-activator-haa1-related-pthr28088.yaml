definition: >-
  TRANSCRIPTIONAL ACTIVATOR HAA1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28088. PANTHER protein class: DNA-binding transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, copper ion binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in positive regulation of transcription by RNA polymerase II, intracellular iron ion homeostasis. Members localise to nucleus, intracellular anatomical structure.
