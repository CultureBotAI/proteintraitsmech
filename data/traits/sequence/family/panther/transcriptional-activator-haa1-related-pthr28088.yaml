identifier: PANTHER:PTHR28088
label: "TRANSCRIPTIONAL ACTIVATOR HAA1-RELATED"
definition: >-
  TRANSCRIPTIONAL ACTIVATOR HAA1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28088. PANTHER protein class: DNA-binding transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, copper ion binding, transcription regulator activity. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, inorganic ion homeostasis. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
