  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with glycosidase activity, which are involved in the hydrolysis of glycosidic bonds in glycoconjugates, oligosaccharides, and polysaccharides. Members of this family are capable of processing a variety of substrates, including alpha-D-galactosides, xyloglucan oligosaccharides, and isoprimeverose, releasing monosaccharides like xylose and galactose. Some proteins within this family are implicated in specific biological processes such as myogenesis, while others contribute to the metabolism of dietary sugars or the modification of blood group antigens. The family encompasses enzymes that are inhibited by their reaction products or other sugars, and some members exhibit bifunctional activities, such as kinase activity in addition to glycosidase activity.
    source: "InterPro:IPR050985 abstract (LLM-generated, not curator-reviewed)"
