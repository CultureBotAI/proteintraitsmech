identifier: PANTHER:PTHR22527
label: "PLACENTA-EXPRESSED TRANSCRIPT 1 PROTEIN"
definition: >-
  Placenta-expressed transcript 1 (PLET1) may participate in the wound response during the healing process, and promote wound repair. In the postgastrulation embryo, PLET1 expression is highly restricted to the developing pharyngeal endoderm and mesonephros. In adult tissues, PLET1 expression is in a number of sites, including mammary and prostate epithelia and in the pancreas.
