identifier: PANTHER:PTHR16036
label: "ANKYRIN REPEAT AND ZINC FINGER DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This entry represents a group of proteins predominantly found in eukaryotes, including Ankyrin repeat and zinc finger domain-containing protein 1 from human (ANKZF1) and VMS1 from Saccharomyces cerevisiae which belong to the VLRF1 (Vms1-Like Release Factor-1) clade. They have been identified as peptidyl-tRNA hydrolases that release nascent chains from stalled ribosomes. ANKZF1, VMS1 orthologue in human, plays a role in the cellular response to hydrogen peroxide and in the maintenance of mitochondrial integrity under conditions of cellular stress. VMS1 is a component of an evolutionarily conserved system for ubiquitin-mediated mitochondria-associated protein degradation (MAD), which is necessary to maintain mitochondrial, cellular, and organismal viability. It is involved in the endoplasmic reticulum (ER)-associated degradation (ERAD) pathway.
definition_source: "InterPro:IPR047139 abstract (PANTHER PTHR16036 is a member signature)"
