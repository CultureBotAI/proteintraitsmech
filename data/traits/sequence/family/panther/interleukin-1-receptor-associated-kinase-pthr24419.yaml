label: "INTERLEUKIN-1 RECEPTOR-ASSOCIATED KINASE"
definition: >-
  INTERLEUKIN-1 RECEPTOR-ASSOCIATED KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24419. PANTHER protein class: non-receptor serine/threonine protein kinase. Members are annotated with the molecular function protein serine/threonine kinase activity, histone modifying activity. Members participate in intracellular signal transduction, mitotic cell cycle, cellular response to stimulus. Members localise to nucleus, cytoplasm.
