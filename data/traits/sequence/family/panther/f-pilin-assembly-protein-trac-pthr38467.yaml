    text: >-
      This family of proteins is involved in the formation of bacterial appendages known as F pili. Members of this family play a crucial role in the assembly process by facilitating the incorporation of mature F-pilin subunits into the structure of the pilus. These pili are filamentous projections on the bacterial surface that are essential for processes such as bacterial conjugation, which is a mechanism of horizontal gene transfer between bacteria.
