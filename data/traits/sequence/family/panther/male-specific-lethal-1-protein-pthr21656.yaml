identifier: PANTHER:PTHR21656
label: "MALE-SPECIFIC LETHAL-1 PROTEIN"
definition: >-
  Protein male-specific lethal-1 (Msl-1) is a component of a multisubunit histone acetyltransferase complex (MSL). The MSL complex has histone acetyltransferase (HAT) activity with specificity towards histone H4 lysine 16. In fruit fly, the MSL proteins are essential for elevating transcription of the single X chromosome in the male (X chromosome dosage compensation). It has been shown that Msl-1 is associated with hundreds of discrete sites along the length of the X chromosome in males and not in females, and is also associated with 10-20 autosomal sites in males in fruit fly. In humans the MSL complex has the same specificity for acetylating lysine 16 on histone H4, but in contrast to the Drosophila complex, the hMSL complex targets all chromosomes in vivo. In mammals the Msl-1 homologue is also known as hampin.
definition_source: "InterPro:IPR026711 abstract (PANTHER PTHR21656 is a member signature)"
