identifier: PANTHER:PTHR47244
label: "PROTEIN-TYROSINE-PHOSPHATASE IBR5"
definition: >-
  This entry includes a group of plant protein-tyrosine-phosphatases, such as IBR5 from Arabidopsis. IBR5 is a dual-specificity MAPK phosphatase that modulates phytohormone signal transduction and support a link between auxin and abscisic acid signaling pathways.
