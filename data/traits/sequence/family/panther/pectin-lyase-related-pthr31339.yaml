  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are part of the glycosyl hydrolase 28 family. They are involved in the degradation of pectin, a plant cell wall polysaccharide, by catalyzing the hydrolysis of polygalacturonic acid. Members of this family contribute to various biological processes, including plant tissue maceration and soft-rotting, which is a mechanism in certain plant diseases. Some proteins in this family are implicated in the production of wilt disease in tomato plants by degrading the plant cell wall, facilitating bacterial invasion and colonization. Others are involved in bacterial utilization of polygalacturonate and may influence bacterial surface properties in the presence of plant cells or extracts.
