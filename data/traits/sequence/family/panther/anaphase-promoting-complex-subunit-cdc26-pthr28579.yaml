identifier: PANTHER:PTHR28579
label: "ANAPHASE-PROMOTING COMPLEX SUBUNIT CDC26"
definition: >-
  This entry represents subunit CDC26, whose exact function is not known. The anaphase-promoting complex (APC) or cyclosome is a multi-subunit E3 protein ubiquitin ligase that regulates important events in mitosis, such as the initiation of anaphase and exit from telophase. The APC, in conjunction with other enzymes, assembles multi-ubiquitin chains on a variety of regulatory proteins, thereby targeting them for proteolysis by the 26S proteasome.
