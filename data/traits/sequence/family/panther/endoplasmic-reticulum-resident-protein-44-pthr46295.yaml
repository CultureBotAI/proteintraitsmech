identifier: PANTHER:PTHR46295
label: "ENDOPLASMIC RETICULUM RESIDENT PROTEIN 44"
definition: >-
  This family of proteins is involved in the regulation of the early secretory pathway by mediating thiol-dependent retention. They interact with substrate proteins through a conserved CRFS motif to form mixed disulfides. Additionally, these proteins can inhibit the calcium channel activity of ITPR1 and are implicated in the control of oxidative protein folding within the endoplasmic reticulum. They are essential for retaining certain oxidoreductases like ERO1A and ERO1B in the endoplasmic reticulum, suggesting a role in the maintenance of the redox environment.
