definitions:
  - kind: GENERAL
    text: >-
      POLY [ADP-RIBOSE] POLYMERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45740. Members are annotated with the molecular function transferase activity, catalytic activity, acting on a protein, pentosyltransferase activity. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with mono-ADP-ribosyltransferase activity, which modify target proteins by adding ADP-ribose, a process involved in various cellular functions including DNA repair, signal transduction, and stress responses. Some members act as negative regulators of transcription factors, such as the aryl hydrocarbon receptor (AHR), by mono-ADP-ribosylating these proteins, thereby inhibiting their transcriptional activity. Others are involved in nuclear envelope stability and nuclear remodeling during spermiogenesis. Additionally, certain members contain zinc finger domains and are implicated in antiviral responses by binding to viral RNAs and promoting their degradation, although these proteins possess a divergent PARP domain that is inactive due to the lack of structural requirements for NAD[+] binding.
    source: "InterPro:IPR051712 abstract (LLM-generated, not curator-reviewed)"
