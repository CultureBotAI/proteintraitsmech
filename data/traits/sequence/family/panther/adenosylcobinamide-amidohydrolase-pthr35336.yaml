  - kind: GENERAL
    text: >-
      The CbiZ family is involved in the de novo biosynthesis of coenzyme B12. Members of the CbiZ family, such as adenosylcobinamide amidohydrolases, catalyze the conversion of adenosylcobinamide to adenosylcobyric acid, an essential intermediate in this biosynthetic pathway. The function of some members within the family remains uncharacterized, but characterized members play a crucial role in the production of coenzyme B12, which is vital for various cellular processes including DNA synthesis, fatty acid metabolism, and energy production.
