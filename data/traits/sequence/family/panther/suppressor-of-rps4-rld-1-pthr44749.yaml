identifier: PANTHER:PTHR44749
label: "SUPPRESSOR OF RPS4-RLD 1"
definition: >-
  This entry represents a group of tetratricopeptide repeat proteins from plants and bacteria, including suppressor of RPS4-RLD 1 (SRFR1) from Arabidopsis. SRFR1 is an effector-triggered immunity suppressor associated with the EDS1 resistance pathway. The srfr1 mutants have enhanced resistance to the bacterial effector AvrRps4. The tetratricopeptide repeat proteins from bacteria in this entry are not characterised.
