identifier: PANTHER:PTHR43982
label: "UBIQUITIN CARBOXYL-TERMINAL HYDROLASE"
definition: >-
  This entry represents ubiquitin carboxyl-terminal hydrolase 14 (UBP14) and its homologues, such as Ubp2/6 from fungi and Ubp6/7 from Arabidopsis. They are ubiquitin-specific proteases responsible for disassembling ubiquitin chains at the proteasome, cleaving ubiquitin precursors, and editing ubiquitin side chains. It has been shown that an N-terminal ubiquitin-like (UBL) domain of USP14 associates with the base of the 26S proteasome and the interaction of USP14 with the proteasome activates the catalytic activity of USP14. It has also be shown that Ubp6 has both deubiquitinating activity and proteasome-inhibitory activity. This entry also includes deubiquitinating enzyme ubiquitin-specific protease 28 (USP28).
definition_source: "InterPro:IPR044635 abstract (PANTHER PTHR43982 is a member signature)"
