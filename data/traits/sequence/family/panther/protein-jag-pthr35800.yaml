identifier: PANTHER:PTHR35800
label: "PROTEIN JAG"
definition: >-
  This entry represents the RNA-binding protein KhpB, also known as RNA-binding protein Jag/EloR, a RNA chaperone that forms a complex with KhpA and binds to cellular RNA, controlling its expression. It plays a role in peptidoglycan (PG) homeostasis and cell length regulation, cell division and maintenance of cell shape. Bacillus subtilis KhpB/Jag is associated with SpoIIIJ, a gene necessary for the third stage of sporulation. These proteins consist of an N-terminal Jag-domain of unknown function and two RNA-binding domains, a type II KH domain (KH-II) and R3H, at the C-terminal end.
definition_source: "InterPro:IPR039247 abstract (PANTHER PTHR35800 is a member signature)"
