identifier: PANTHER:PTHR22677
label: "ANKYRIN REPEAT DOMAIN-CONTAINING PROTEIN 60"
definition: >-
  This entry includes ankyrin repeat domain-containing proteins 45, 46 and 60 (ANKRD45, ANKRD46, ANKRD60). ANKRD45 was recently described to play a role during cell proliferation in both zebrafish embryos and mammalian cells and is required for cell division both in early and late mitotic stages.
