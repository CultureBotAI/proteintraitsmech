identifier: PANTHER:PTHR10554
label: SYNTROPHIN
definition: >-
  The syntrophin family are intracellular membrane-associated proteins that interact with both ion channels and signalling proteins. As such, syntrophins appear to be important for linking ion channels to intracellular signalling pathways. Syntrophins are concentrated at postsynaptic sites at the neuromuscular junction and may be involved in clustering acetylcholine receptors. In muscle and non-muscle tissues, syntrophin is associated with dystrophin, utrophin, and two homologues of the dystrophin carboxy-terminal region. The five known syntrophin isoforms share a common domain organisation which includes two tandem pleckstrin homology (PH) domains at the N terminus, a PDZ domain and a C-terminal domain of ~70 amino acids that is unique to syntrophins (syntrophin unique, SU).
definition_source: "InterPro:IPR015482 abstract (PANTHER PTHR10554 is a member signature)"
