  - kind: GENERAL
    text: >-
      The STAM family proteins are involved in intracellular signaling and trafficking processes. They are key components of the ESCRT-0 complex, which recognizes and sorts ubiquitinated cargo proteins at the multivesicular body (MVB) for lysosomal degradation. This sorting is crucial for the down-regulation of receptor tyrosine kinases and mediates signaling pathways in response to cytokines and growth factors. Some family members are implicated in T-cell development, DNA synthesis, and MYC induction. The family also includes proteins that function as osmosensors, activate MAPK signaling in response to osmotic stress, and play roles in meiosis, sporulation, and cytoskeletal organization. The STAM family proteins typically contain domains such as VHS, UIM, SH3, and PxVxL motifs, which mediate interactions with ubiquitinated proteins, chromoshadow domains, and other signaling molecules.
    source: "InterPro:IPR050670 abstract (LLM-generated, not curator-reviewed)"
