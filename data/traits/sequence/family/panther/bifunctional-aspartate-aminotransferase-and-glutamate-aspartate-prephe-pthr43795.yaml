identifier: PANTHER:PTHR43795
label: "BIFUNCTIONAL ASPARTATE AMINOTRANSFERASE AND GLUTAMATE/ASPARTATE-PREPHENATE AMINOTRANSFERASE-RELATED"
definition: >-
  This family of proteins includes enzymes that are primarily involved in the biosynthesis of ethylene, a plant hormone that regulates various aspects of growth, development, and stress responses. 1-aminocyclopropane-1-carboxylate synthases (ACSs) lack theconserved tripeptide Ser/Thr-Asn-Pro necesary for ACS activity. Members of this family catalyse the conversion of S-adenosyl-L-methionine (SAM) into 1-aminocyclopropane-1-carboxylate (ACC), which is a direct precursor of ethylene. Some proteins within this family also have aminotransferase activity, participating in the biosynthesis of other compounds such as auxins, which are essential for plant growth and development. Additionally, certain members are involved in the production of sulfur-containing compounds that contribute to the characteristic aroma and potential health benefits of plants like garlic. The family also includes proteins with a domain that may serve as a binding site for other proteins or act as a docking site for receptors, although the exact function of this domain is not fully understood.
definition_source: "InterPro:IPR050478 abstract (PANTHER PTHR43795 is a member signature)"
