identifier: PANTHER:PTHR31742
label: "RPA-INTERACTING PROTEIN RPAIN"
definition: >-
  This entry represents the replication protein A (RPA) interacting protein. RPA is a single stranded DNA-binding protein involved in DNA replication, repair, and recombination. After synthesis in the cytoplasm, RPA is transported into the nucleus mediated by RPA interacting protein. In humans, RPA interacting protein has several splice isoforms, including hRIPalpha, hRIPbeta, hRIPgamma, hRIPdelta1, hRIPdelta2, and hRIPdelta3. hRIPbeta transports RPA into the PML nuclear body and releases RPA upon UV irradiation. It seems that the number of splice isoforms of RIPalpha is species-specific and has a tendency to increase in higher eukaryotes.
definition_source: "InterPro:IPR028156 abstract (PANTHER PTHR31742 is a member signature)"
