identifier: PANTHER:PTHR18939
label: "RIBOSOME BINDING PROTEIN-1"
definition: >-
  Ribosome-binding protein 1 (RRBP1), also called ES/130 or p180, is an endoplasmic reticulum membrane protein that is critical for ribosome binding and for the the transportation and secretion of nascent proteins. RRBP1 plays a critical role in terminal differentiation of secretory cells and tissues. RRBP1 is highly expressed in several cancers.
