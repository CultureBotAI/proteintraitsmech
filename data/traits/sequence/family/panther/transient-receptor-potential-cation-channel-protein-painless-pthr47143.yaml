  - kind: GENERAL
    text: >-
      TRANSIENT RECEPTOR POTENTIAL CATION CHANNEL PROTEIN PAINLESS — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47143. PANTHER protein class: ion channel, transporter. Members are annotated with the molecular function transmembrane transporter activity. Members participate in monoatomic ion transmembrane transport. Members localise to transmembrane transporter complex, membrane.
