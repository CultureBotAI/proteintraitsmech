  - kind: GENERAL
    text: >-
      This family of proteins includes receptor-activated non-selective cation channels that play a central role in the detection of pain, temperature, and other sensations. They are involved in various physiological processes such as pain response to inflammatory mediators, cold perception, oxygen concentration perception, cough, itch, and inner ear function. These proteins show a preference for divalent cations over monovalent ones and can be activated by a wide range of chemical compounds, including electrophilic and non-electrophilic ligands. Some family members are also implicated in cannabinoid signaling and mechanosensitive transduction in hair cells, contributing to sound perception. They are regulated by various factors, including inositol polyphosphates and cytosolic factors, and can be inhibited by specific blockers.
    source: "InterPro:IPR052076 abstract (LLM-generated, not curator-reviewed)"
