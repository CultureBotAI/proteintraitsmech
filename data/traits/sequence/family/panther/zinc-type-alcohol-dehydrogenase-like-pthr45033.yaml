  - kind: GENERAL
    text: >-
      This family of proteins includes zinc-type alcohol dehydrogenase-like enzymes that are part of the zinc-containing alcohol dehydrogenase family, specifically within the quinone oxidoreductase subfamily. Members of this family are involved in various metabolic processes, including the biosynthesis of complex organic molecules. For example, one member is implicated in the biosynthesis of phomenoic acid, a compound with antifungal properties, suggesting a role in microbial competition within environmental niches. Although the precise functions of some members remain to be fully characterized, the family generally participates in redox reactions where they may act on alcohols and other substrates, utilizing zinc as a cofactor for catalytic activity.
