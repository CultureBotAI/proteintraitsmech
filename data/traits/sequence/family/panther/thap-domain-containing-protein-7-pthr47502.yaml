identifier: PANTHER:PTHR47502
label: "THAP DOMAIN-CONTAINING PROTEIN 7"
definition: >-
  The THAP domain is a C2CH module with zinc-dependent sequence-specific DNA-binding activity. Several THAP domain-containing proteins have been described. THAP7 is a chromatin-associated, histone tail-binding protein that represses transcription via recruitment of histone deacetylase 3 (HDAC3) and nuclear hormone receptor corepressors (NCoR).
