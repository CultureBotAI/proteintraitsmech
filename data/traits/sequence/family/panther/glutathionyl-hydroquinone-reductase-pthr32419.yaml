identifier: PANTHER:PTHR32419
label: "GLUTATHIONYL-HYDROQUINONE REDUCTASE"
definition: >-
  This entry represents the predicted glutathione S-transferase omega-like protein and the glutathionyl-hydroquinone reductase YqjG. Glutathione S-transferase omega-like proteins active as '1-Cys' thiol transferase against beta-hydroxyethyl disulfide (HED), as dehydroascorbate reductase and as dimethylarsinic acid reductase, while not active against the standard GST substrate 1-chloro-2,4-dinitrobenzene (CDNB). YqjG catalyses glutathione (GSH)-dependent reduction of glutathionyl-hydroquinones (GS-HQs) to the corresponding hydroquinones.
