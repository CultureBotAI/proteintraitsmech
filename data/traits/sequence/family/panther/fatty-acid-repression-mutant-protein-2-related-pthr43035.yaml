identifier: PANTHER:PTHR43035
label: "FATTY ACID REPRESSION MUTANT PROTEIN 2-RELATED"
definition: >-
  Nitroreductases comprise a group of FMN- or FAD-dependent enzymes that reduce nitrosubstituted compounds by using NAD(P)H, and are found in bacterial species and yeast. In Saccharomyces cerevisiae, two nitroreductase proteins have been described, Frm2 and Hbn1, that are involved in the oxidative stress defense system. Frm2 primarily utilizes NADH to reduce 4-nitroquinoline-N-oxide (4-NQO).
