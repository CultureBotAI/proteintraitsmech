identifier: PANTHER:PTHR48068
label: "TAF9 RNA POLYMERASE II, TATA BOX-BINDING PROTEIN (TBP)-ASSOCIATED FACTOR"
definition: >-
  The TAF9 family is involved in the initiation of RNA polymerase II-dependent transcription. Members of the family function as components of the TFIID complex, which is essential for promoter recognition and pre-initiation complex formation, regardless of the presence of a TATA box. The TAF9 family includes subunits that are also part of the TBP-free TAFII complex, PCAF histone acetylase complex, and STAGA transcription coactivator-HAT complex. These proteins play roles in transcriptional activation and repression, gene regulation associated with apoptosis, and are essential for cell viability. They interact with transcription activators, contribute to chromatin modification through histone acetylation, and facilitate DNA opening for transcription initiation. The family is also implicated in the regulation of a subset of genes through the SAGA and SLIK HAT complexes, influencing RNA polymerase II activity and promoter selectivity.
