identifier: PANTHER:PTHR31506
label: "BES1/BZR1 HOMOLOG PROTEIN 3-RELATED"
definition: >-
  Brassinosteroids (BRs) are essential steroid hormones that regulate plant growth and development. This entry represents the BZR (BRASSINAZOLE-RESISTANT) family, whose members include BZR1 and BZR2 (BES1) from Arabidopsis. BZR1 is a transcriptional repressor and a positive regulator of the brassinosteroid (BR) signalling pathway that mediates both downstream BR responses and negative feedback regulation of BR biosynthesis. It interacts with REPRESSOR OF ga1-3 (RGA), a member of the DELLA family of transcriptional regulators that inhibits the GA signaling pathway in Arabidopsis thaliana. BZR2/BES1 cooperates with MYB30 to regulate brassinosteroid-induced gene expression. It also interacts with other transcription factors such as BIM1 and AtMYB30, as well as putative histone demethylases ELF6 and REF6.
