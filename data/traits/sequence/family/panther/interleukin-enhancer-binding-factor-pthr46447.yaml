definitions:
  - kind: GENERAL
    text: >-
      INTERLEUKIN ENHANCER-BINDING FACTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46447. PANTHER protein class: transcription cofactor. Members are annotated with the molecular function RNA binding, double-stranded RNA binding, organic cyclic compound binding. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, positive regulation of RNA biosynthetic process. and localise to catalytic step 2 spliceosome, protein-containing complex, spliceosomal complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins interacts with chromatin and forms stable heterodimers with interleukin enhancer-binding factor 3 (ILF3). They are involved in various biological processes, including transcription, innate immunity, and cell growth. These proteins are crucial for the nuclear reshuttling of ILF3 isoforms and form an RNA-binding complex essential for mitotic progression and cytokinesis by regulating mitotic gene expression. They also compete with STAU1/STAU2-mediated mRNA decay and play a role in inhibiting the replication of certain viruses, such as Japanese encephalitis virus and enterovirus 71. In humans, they have been implicated in stabilizing HIV-1 RNA, thus promoting HIV-1 virus production.
    source: "InterPro:IPR052134 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
