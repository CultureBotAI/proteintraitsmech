  - kind: GENERAL
    text: >-
      The Diencephalon/mesencephalon homeobox protein family is characterized by its role in transcriptional repression and developmental processes in vertebrates. Members of the family are known to function as transcriptional repressors, with some forming heterodimers with OTX2 to repress OTX2-mediated transactivation on specific DNA sequences. The family is essential for brain development, with additional roles in neonatal survival, postnatal growth, and nursing ability in mammals. In zebrafish, family members are also implicated in eye and tectum development. The family belongs to the larger paired homeobox family, which is distinguished by the presence of the homeobox DNA-binding domain, a hallmark of genes that regulate developmental processes.
    source: "InterPro:IPR052488 abstract (LLM-generated, not curator-reviewed)"
