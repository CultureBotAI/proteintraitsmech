  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with beta-glucuronidase activity, which are involved in the hydrolysis of beta-glucuronosyl and 4-O-methyl-beta-glucuronosyl residues of arabinogalactan-protein. These enzymes exhibit very weak hydrolysis of heparan sulfate and no activity on birchwood xylan. They are also capable of catalyzing transglycosylation reactions, transferring glucuronic acid residues to various monosaccharide acceptors, including glucose, galactose, and xylose.
