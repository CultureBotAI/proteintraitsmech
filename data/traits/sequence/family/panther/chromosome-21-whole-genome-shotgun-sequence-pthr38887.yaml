  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of burnettramic acids, which are bolaamphiphilic pyrrolizidinediones with antibacterial, antifungal, and cytotoxic properties. Members of this family participate in various steps of the biosynthetic pathway, including the hydroxylation of proline, construction of a highly reduced polyketide chain, amide bond formation, and Dieckmann condensation to form a bicyclic pyrrolidinedione moiety. Additionally, they may be involved in multiple hydroxylations on the polyketide chain and glycosylation of the aglycone to form the final burnettramic acid compounds. The exact role of some proteins within this family in the biosynthetic pathway remains to be elucidated.
    source: "InterPro:IPR053221 abstract (LLM-generated, not curator-reviewed)"
