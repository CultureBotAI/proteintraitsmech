  The interleukin-17 receptors, including IL-17RA to IL-17RE, are cytokine receptors that mediates chronic inflammatory and autoimmune disorders. The orthologs in Caenorhabditis elegans are interleukin cytokine receptor-related protein 1 and 2 (ILCR1-2).
