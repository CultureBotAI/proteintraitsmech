    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes a variety of functions, such as modulating neurotransmitter release, regulating gene transcription, and influencing cytoskeletal dynamics. Some members act as neurotoxins that interact with receptors and form pores in membranes, leading to neurotransmitter release. Others are involved in the Wnt signaling pathway, telomere length regulation, and vesicle trafficking through poly-ADP-ribosylation of target proteins. Certain members regulate the growth of actin filaments and inhibit actin-capping protein complexes. Additionally, some proteins in this family may function as regulatory subunits of protein phosphatases or as components of E3 ubiquitin-protein ligase complexes, mediating the ubiquitination and degradation of target proteins.
    source: "InterPro:IPR050745 abstract (LLM-generated, not curator-reviewed)"
