identifier: PANTHER:PTHR37940
label: "LYSINE--TRNA LIGASE"
definition: >-
  Lysine-tRNA ligase (also known as Lysyl-tRNA synthetase) (EC:6.1.1.6) is an alpha 2 homodimer that belong to both class I and class II. In eubacteria and eukaryota lysine-tRNA ligases belong to class II in the same family as aspartyl tRNA ligase. The class Ic lysine-tRNA ligase family is present in archaea and in a number of bacterial groups that include the alphaproteobacteria and spirochaetes. A refined crystal structures shows that the active site of LysU is shaped to position the substrates for the nucleophilic attack of the lysine carboxylate on the ATP alpha-phosphate. No residues are directly involved in catalysis, but a number of highly conserved amino acids and three metal ions coordinate the substrates and stabilise the pentavalent transition state. A loop close to the catalytic pocket, disordered in the lysine-bound structure, becomes ordered upon adenine binding. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 2'-hydroxyl of the tRNA, whereas class II synthetases preferentially use
