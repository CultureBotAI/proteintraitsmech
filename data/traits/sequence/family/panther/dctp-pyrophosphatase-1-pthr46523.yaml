  - kind: GENERAL
    text: >-
      This family of proteins is involved in the hydrolysis of deoxynucleoside triphosphates (dNTPs) into their corresponding nucleoside monophosphates, with a particular specificity for dCTP and its analogs, including modified forms such as 5-iodo-dCTP and 5-methyl-dCTP. The enzymatic activity serves a protective role, preventing the incorporation of these potentially harmful nucleotide analogs into DNA or RNA, thereby safeguarding the integrity of genetic material. The activity of these proteins is subject to inhibition by various agents, including divalent metal ions, the reaction end product pyrophosphate (PPi), dCDP, and certain pharmacological compounds like triptolide.
    source: "InterPro:IPR052555 abstract (LLM-generated, not curator-reviewed)"
