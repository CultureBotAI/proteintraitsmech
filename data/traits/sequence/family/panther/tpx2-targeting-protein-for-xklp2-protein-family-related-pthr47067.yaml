identifier: PANTHER:PTHR47067
label: "TPX2 (TARGETING PROTEIN FOR XKLP2) PROTEIN FAMILY-RELATED"
definition: >-
  This entry includes WDL7 from Arabidopsis and related proteins. WDL7 is a TPX2 C-terminal domain containing protein. Similar to WVD2 and other WVD2-like proteins, it contains the KLEEK-motif, which is typical for microtubule-binding proteins. The function of WDL7 is not clear.
