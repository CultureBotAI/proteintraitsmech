identifier: PANTHER:PTHR11127
label: "60S RIBOSOMAL PROTEIN L14"
definition: >-
  This entry represents eL14, an eukaryote-specific ribosomal protein from the 60S ribosomal subunit, which is conserved in some but not all archaea. In yeast, eL14 assembles in the nucleolus at an early stage into pre-60S particles. Auto-antibodies to RPL14 in humans have been associated with systemic lupus erythematosus.
