identifier: PANTHER:PTHR33827
label: "PROTEIN SAWADEE HOMEODOMAIN HOMOLOG 2"
definition: >-
  This entry includes SAWADEE HOMEODOMAIN HOMOLOGS 1 and 2 (SHH1 and SHH2) from plants. In Arabidopsis, SHH1 is a homeodomain protein required for DNA methylation and for the accumulation of siRNAs at specific loci. It interacts with Pol-IV and acts upstream in the RdDM (RNA-directed DNA methylation) pathway. Its SAWADEE domain is a chromatin-binding module that functions as a dual lysine reader, probing for both unmethylated K4 and methylated K9 modifications on the histone 3 (H3) tail. The function of SHH2 is not clear.
