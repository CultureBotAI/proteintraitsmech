  - kind: GENERAL
    text: >-
      HISACTOPHILIN-1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33351. Members are annotated with the molecular function actin filament binding. and participate in actin filament organization, actin filament polymerization, actin polymerization or depolymerization. and localise to intracellular non-membrane-bounded organelle, actin cytoskeleton, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins may function as intracellular pH sensors that are potentially involved in linking chemotactic signals to the cytoskeletal system. They are implicated in the regulation of actin dynamics, either by initiating the polymerization of actin or by maintaining the stability of actin filaments. These activities suggest a role in cellular responses to environmental cues, possibly by modulating the structure of the microfilament system in response to changes in pH.
    source: "InterPro:IPR052883 abstract (LLM-generated, not curator-reviewed)"
