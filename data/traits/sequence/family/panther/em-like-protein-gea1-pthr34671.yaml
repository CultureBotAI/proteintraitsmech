identifier: PANTHER:PTHR34671
label: "EM-LIKE PROTEIN GEA1"
definition: >-
  This entry contains the plant LEA (late embryogenesis abundant) proteins, which are small hydrophilic plant seed proteins that are structurally related. These proteins contains from 83 to 153 amino acid residues and may play a role in equipping the seed for survival, maintaining a minimal level of hydration in the dry organism and preventing the denaturation of cytoplasmic components. They may also play a role during imbibition by controlling water uptake.
