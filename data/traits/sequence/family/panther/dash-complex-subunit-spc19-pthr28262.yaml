identifier: PANTHER:PTHR28262
label: "DASH COMPLEX SUBUNIT SPC19"
definition: >-
  Spc19 is a component of the DASH complex, which is a microtubule-binding subcomplex of the outer kinetochore that is essential for proper chromosome segregation. The DASH complex mediates the formation and maintenance of bipolar kinetochore-microtubule attachments by forming closed rings around spindle microtubules and establishing interactions with proteins from the central kinetochore.
