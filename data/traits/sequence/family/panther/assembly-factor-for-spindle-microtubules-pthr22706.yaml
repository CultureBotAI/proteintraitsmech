identifier: PANTHER:PTHR22706
label: "ASSEMBLY FACTOR FOR SPINDLE MICROTUBULES"
definition: >-
  The Abnormal Spindle-like Microcephaly-associated (ASPM) protein family is involved in the regulation and coordination of mitotic spindle dynamics during cell division. Members of this family play a crucial role in maintaining the structure of the centrosomal microtubule organizing center (MTOC) and are essential for proper neurogenesis, germ cell mitosis, and oocyte differentiation. They interact with the katanin complex, enhancing microtubule severing activity and influencing microtubule dynamics at spindle poles, including spindle orientation, astral microtubule density, and poleward microtubule flux. The family's ability to block microtubule minus-end growth is also modulated by its association with the katanin complex.
