identifier: PANTHER:PTHR24131
label: "APOPTOSIS-STIMULATING OF P53 PROTEIN"
definition: >-
  Apoptosis-stimulating of p53 protein 1 (ASPP1/2) which are specific activators of p53. These proteins play a central role in regulation of apoptosis via its interaction with p53/TP53. Regulates TP53 by enhancing the DNA binding and transactivation function of TP53 on the promoters of proapoptotic genes in vivo. ASPP2 inhibits the ability of APP-BP1 (also known as NEDD8 activating enzyme E1 subunit 1, NAE1) to conjugate NEDD8 to CUL1, and thereby decreases APP-BP1 ability to induce apoptosis. Its apoptosis-stimulating activity is inhibited by its interaction with DDX42. ASPP1 homologue from C. elegans, apoptotic enhancer 1 protein (aep-1), negatively regulates apoptosis via its interaction with cep-1.
