identifier: PANTHER:PTHR33178
label: "Stress-response A/B barrel domain-containing protein HS1/DABB1-like"
definition: >-
  This entry represents a group of stress-response A/B barrel domain-containing proteins, including HS1 (also known as Protein HEAT STABLE 1 or Pop3 family protein At3g17210) and DABB1 from Arabidopsis thaliana. Proteins in this family have two stress responsive dimeric A/B barrel domains (Dabb) whose function is not yet clear. In general, stress-response A/B barrel domain-containing proteins in plants are involved in defense against fungal pathogens. This entry also includes Cannabis sativa olivetolic acid cyclase (OAC), which is an A/B barrel domain-containing protein structurally similar to HS1 and contains amino acid residues that are conserved in plant stress-responsive DABB proteins. OAC functions in concert with OLS/TKS to form olivetolic acid, an alkylresorcinolic acid that forms the polyketide nucleus of the cannabinoids. This entry also includes related proteins from bacteria and fungi.
definition_source: "InterPro:IPR044662 abstract (PANTHER PTHR33178 is a member signature)"
