  - kind: GENERAL
    text: >-
      The protein family is characterized by its members' involvement in GTPase-activating processes, particularly for the ADP ribosylation factor family. Members of this family are implicated in various cellular transport mechanisms, including clathrin-dependent retrograde transport from early endosomes to the trans-Golgi network and clathrin-dependent endocytosis. Some family members are also associated with roles in erythropoiesis and the modulation of cell size and timing of budding, independent of the DNA replication cycle. Additionally, one member is noted to be a transcription factor involved in heat resistance and flocculation. The diverse functions of the family members suggest a broad involvement in cellular regulatory mechanisms and transport processes.
    source: "InterPro:IPR051718 abstract (LLM-generated, not curator-reviewed)"
