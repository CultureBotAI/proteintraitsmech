identifier: PANTHER:PTHR13401
label: "RAGULATOR COMPLEX PROTEIN LAMTOR1"
definition: >-
  RAGULATOR COMPLEX PROTEIN LAMTOR1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13401. Members are annotated with the molecular function guanyl-nucleotide exchange factor activity. Members participate in positive regulation of MAPK cascade, cellular response to oxygen-containing compound, regulation of macromolecule metabolic process. Members localise to vacuole, vacuolar membrane, guanyl-nucleotide exchange factor complex.
