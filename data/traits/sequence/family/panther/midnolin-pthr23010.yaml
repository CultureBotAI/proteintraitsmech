identifier: PANTHER:PTHR23010
label: MIDNOLIN
definition: >-
  Polycomb proteins such as Pc function to ensure correct deployment of developmental programs by epigenetically repressing target gene expression. Pc itself is regulated by midnolin. Midnolin interacts with the proteasome and recruits Pc to the complex enabling ubiquitin-independent proteasomal degradation of Pc. In Drosophila, midnolin is known as stuxnet. In mouse embryos, midnolin is strongly expressed in the midbrain mesencephalon on day 12.5. Midnolin is located in the nucleus and nucleolus and contains a ubiquitin domain. In rat pancreatic beta cells, midnolin is also found in the cytoplasm where it interacts with and inhibits glucokinase, and the midnolin gene is upregulated when glucose levels are low.
definition_source: "InterPro:IPR039336 abstract (PANTHER PTHR23010 is a member signature)"
