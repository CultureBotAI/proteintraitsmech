identifier: PANTHER:PTHR31092
label: SORORIN
definition: >-
  Sororin is an essential, cell cycle-dependent mediator of sister chromatid cohesion. The protein is nuclear in interphase cells, dispersed from the chromatin in mitosis, and interacts with the cohesin complex. This protein protects cohesin from WAPL, which otherwise releases cohesin from DNA. Also included in this entry is dalmatian, a sororin-related protein from Drosophila melanogaster that combines protein functions of Sororin and Shugoshin to promote and protect cohesion.
