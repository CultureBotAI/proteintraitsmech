identifier: PANTHER:PTHR31218
label: "WAT1-RELATED PROTEIN"
definition: >-
  The plant drug/metabolite exporter (DME) family consists of a group of plant WAT1 (walls are thin1)-related proteins. They contain the EamA domains that can be found in some drug/metabolite exporters in bacteria. Arabidopsis WAT1 is required for secondary cell-wall deposition, and conferred broad-spectrum resistance to vascular pathogens. Auxin-induced protein 5NG4, another member of the family, is a putative transmembrane protein that is differentially expressed in mature and juvenile-phase shoots.
