identifier: PANTHER:PTHR43397
label: "ERGOTHIONEINE BIOSYNTHESIS PROTEIN 1"
definition: >-
  The EgtD family of methyltransferases is involved in the biosynthesis of various bioactive compounds, including ergothioneine, ergot alkaloids, and other peptide-derived alkaloids. Members of this family catalyze the S-adenosyl-L-methionine (SAM)-dependent methylation of specific amino acids, such as the triple methylation of the alpha-amino group of histidine to form hercynine, which is a precursor in the ergothioneine biosynthesis pathway. Additionally, they participate in the methylation of 4-dimethylallyl-L-tryptophan during the biosynthesis of ergot alkaloids, which are important for plant host fitness and have pharmaceutical applications. The family also includes enzymes involved in the biosynthesis of benzomalvin A and D, as well as imizoquins and other isoquinoline alkaloids that contribute to fungal defense and development.
definition_source: "InterPro:IPR051128 abstract (PANTHER PTHR43397 is a member signature)"
