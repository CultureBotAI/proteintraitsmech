identifier: PANTHER:PTHR37167
label: "1,4-DIHYDROXY-6-NAPHTOATE SYNTHASE"
definition: >-
  1,4-dihydroxy-6-naphtoate synthase, also known as menaquinone biosynthetic enzyme MqnD, catalyses the conversion of cyclic dehypoxanthine futalosine (cyclic DHFL) into 1,4-dihydroxy-6-naphthoate, a step in the biosynthesis of menaquinone (MK, vitamin K2) through an alternative pathway operating in some bacteria, such as Streptomyces and the pathogenic species Helicobacter pylori and Campylobacter jejuni. In prokaryotes, menaquinone is an obligatory component of the electron-transfer pathway.
definition_source: "InterPro:IPR030869 abstract (PANTHER PTHR37167 is a member signature)"
