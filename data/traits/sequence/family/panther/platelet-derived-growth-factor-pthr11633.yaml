identifier: PANTHER:PTHR11633
label: "PLATELET-DERIVED GROWTH FACTOR"
definition: >-
  PLATELET-DERIVED GROWTH FACTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11633. PANTHER protein class: intercellular signal molecule, growth factor. Members are annotated with the molecular function growth factor receptor binding. Members participate in positive regulation of protein phosphorylation, positive regulation of phosphorus metabolic process, positive regulation of cell population proliferation. Members localise to extracellular region.
