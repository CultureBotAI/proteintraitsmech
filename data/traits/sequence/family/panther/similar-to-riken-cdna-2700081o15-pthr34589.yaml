identifier: PANTHER:PTHR34589
label: "SIMILAR TO RIKEN CDNA 2700081O15"
definition: >-
  The Zinc finger translocation-associated and Spindlin interactor and repressor of chromatin-binding protein family is involved in the regulation of gene expression and response to DNA damage. Members of the family negatively regulate the transcriptional activator activity of SPIN proteins by inhibiting their ability to bind methylated histones, thereby repressing the expression of SPIN-regulated genes and the activation of the Wnt signaling pathway. They can inhibit the histone methyl-binding abilities of multiple SPIN proteins. Additionally, they positively regulate poly-ADP-ribosylation following DNA damage by enhancing PARP1 ADP-ribosyltransferase activity.
