identifier: PANTHER:PTHR10628
label: SIALIDASE
definition: >-
  This entry includes sialidase and sialidase 1/2/3/4/A, which are members of the glycoside hydrolase family 33 that also includes trans-sialidase and 2-keto-3-deoxynononic acid sialidase. Sialidases catalyse hydrolysis of alpha-(2->3)-, alpha-(2->6)-, alpha-(2->8)- glycosidic linkages of terminal sialic acid residues in oligosaccharides, glycoproteins, glycolipids, colominic acid and synthetic substrates. In some bacteria, sialidase have been suggested to be pathogenic factors in microbial infections. This entry includes Sialidase 85-1.1, which is also known as Major 85kDa surface antigen.
