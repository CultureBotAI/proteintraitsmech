  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are primarily involved in the metabolism of sulfur-containing amino acids. Members of this family catalyze the transformation of cystathionine to homocysteine, a key step in the methionine biosynthesis pathway. Some proteins within this family also exhibit beta-cystathionase activity, breaking down cystathionine into pyruvate, ammonia, and thiocysteine. Additionally, certain members can act on cysteine-S-conjugates, cleaving the cysteine-S bond to release various compounds, including those contributing to human body odor. These enzymes are dependent on pyridoxal phosphate as a cofactor for their activity. Regulatory mechanisms for these proteins may include enhancement of activity by specific binding proteins, as indicated for at least one family member.
    source: "InterPro:IPR051798 abstract (LLM-generated, not curator-reviewed)"
