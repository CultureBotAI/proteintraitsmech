identifier: PANTHER:PTHR38036
label: "UPF0250 PROTEIN YBED"
definition: >-
  This family includes UPF0250 protein YbeD from Escherichia coli and similar prokaryotic proteins. YbeD shows structural homology to the regulatory domain from 3-phosphoglycerate dehydrogenase, which suggests a role in the allosteric regulation of lipoic acid biosynthesis or the glycine cleavage system. The protein has been shown to play an important role in enduring high-temperature stress.
