identifier: PANTHER:PTHR13931
label: "UBIQUITINATION FACTOR E4"
definition: >-
  E4 is an ubiquitin chain-elongation enzyme specifically involved in polyubiquitin chain assembly. It is involved in N-terminal ubiquitin fusion degradation proteolytic pathway (UFD pathway). E4 binds to the ubiquitin moieties of preformed conjugates and catalyses ubiquitin chain assembly in conjunction with E1, E2, and E3. E4 appears to influence the formation and topology of the multi-Ub chain as it enhances ubiquitination at 'Lys-48' but not at 'Lys-29' of the N-terminal Ub moiety.
definition_source: "InterPro:IPR045132 abstract (PANTHER PTHR13931 is a member signature)"
