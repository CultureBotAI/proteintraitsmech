identifier: PANTHER:PTHR43941
label: "STRUCTURAL MAINTENANCE OF CHROMOSOMES PROTEIN 2"
definition: >-
  STRUCTURAL MAINTENANCE OF CHROMOSOMES PROTEIN 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43941. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies are annotated with the molecular function chromatin binding, protein-containing complex binding. Subfamilies participate in mitotic sister chromatid segregation, mitotic chromosome condensation, mitotic nuclear division. Subfamilies localise to condensed chromosome, chromatin, intracellular anatomical structure.
