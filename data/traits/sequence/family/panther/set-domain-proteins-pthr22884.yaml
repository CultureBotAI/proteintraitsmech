identifier: PANTHER:PTHR22884
label: "SET DOMAIN PROTEINS"
definition: >-
  The SET2 histone-lysine N-methyltransferase family is involved in the methylation of histone H3 at lysine 36 (H3K36), which is a key post-translational modification associated with transcriptional activation or repression. Members of this family play critical roles in various biological processes, including transcription elongation, transcription repression, and the regulation of gene expression during development, cell differentiation, and immune responses. Some family members also methylate histone H3 at lysine 4 or 27, marking epigenetic transcriptional activation or repression. The family is characterized by the presence of AWS and SET domains, which are necessary for their methyltransferase activity and transcriptional regulatory functions.
