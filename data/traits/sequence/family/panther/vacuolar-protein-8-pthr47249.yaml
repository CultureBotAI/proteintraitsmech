identifier: PANTHER:PTHR47249
label: "VACUOLAR PROTEIN 8"
definition: >-
  This family includes vacuolar protein 8 (Vac8), an armadillo repeat-containing protein that functions in both vacuole inheritance and protein targeting from the cytoplasm to vacuole. Its structure has a N-terminal flexible H1 helix followed by 12 armadillo repeats that form a right-handed superhelical structure. The cationic triad (Arg276, Arg317, and Arg359) motifs in this protein are critical for the interaction with the nuclear membrane protein Nvj1 to form a nucleus-vacuole junction (NVJ) and for the recognition of Atg13, a key component of the cytoplasm-to-vacuole targeting (CVT) pathway.
definition_source: "InterPro:IPR045156 abstract (PANTHER PTHR47249 is a member signature)"
