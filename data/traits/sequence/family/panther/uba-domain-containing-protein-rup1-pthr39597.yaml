identifier: PANTHER:PTHR39597
label: "UBA DOMAIN-CONTAINING PROTEIN RUP1"
definition: >-
  This entry represents the orthologues UBA domain-containing protein 6 from Schizosaccharomyces pombe (Ucp6), UBA domain-containing protein RUP1 from Saccharomyces cerevisiae and similar fungal proteins. Ucp6 modulates the activity of the RSP5 HECT ubiquitin-protein ligase through its mediation of the interaction between RSP5 and the deubiquitinase UBP2. It is involved in the regulation of cell wall homeostasis.
