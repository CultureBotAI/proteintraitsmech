identifier: PANTHER:PTHR31081
label: "UREIDE PERMEASE 1-RELATED-RELATED"
definition: >-
  This entry represents ureide permeases (UPSs) from plants, including Arabodopsis AtUPS1-5. They are transporters for allantoin and other oxo derivatives of nitrogen heterocyclic compounds. In Arabidopsis, the UPS family members have distinct and partially overlapping expression patterns with regard to developmental stages or tissue specific localisation. AtUPS1 may be involved in the uptake of allantoin and other purine degradation products when primary sources are limiting. AtUPS1 and AtUPS2 mediate high affinity transport of uracil and 5-fluorouracil. AtUPS5 has two isoforms, long and short. The short isoform of ATUPS5 lacks two transmembrane domains and may be defective in transporting cyclic purine degradation products and pyrimidines.
definition_source: "InterPro:IPR030189 abstract (PANTHER PTHR31081 is a member signature)"
