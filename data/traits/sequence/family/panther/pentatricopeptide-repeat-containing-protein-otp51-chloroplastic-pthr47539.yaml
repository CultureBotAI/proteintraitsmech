  - kind: GENERAL
    text: >-
      PENTATRICOPEPTIDE REPEAT-CONTAINING PROTEIN OTP51, CHLOROPLASTIC — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47539. Members participate in mRNA cis splicing, via spliceosome, protein-containing complex assembly, generation of precursor metabolites and energy.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes both chloroplastic pentatricopeptide repeat-containing proteins and mitochondrial intron-encoded endonucleases. The chloroplastic members are involved in the splicing of group II introns, which is essential for the assembly of photosystems I and II, and the proper functioning of the chloroplast. They are required for the splicing of various chloroplast transcripts, including those of ycf3, atpF, ndhA, petB, and rps16. The mitochondrial members are endonucleases that participate in intron homing, a process that facilitates the insertion of introns into intronless genes within the mitochondrial DNA. They recognize and cleave specific DNA sequences to mediate this process.
    source: "InterPro:IPR052500 abstract (LLM-generated, not curator-reviewed)"
