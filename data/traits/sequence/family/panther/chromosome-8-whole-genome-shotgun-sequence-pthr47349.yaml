identifier: PANTHER:PTHR47349
label: "CHROMOSOME 8, WHOLE GENOME SHOTGUN SEQUENCE"
definition: >-
  This entry represents a group of uncharacterised fungal proteins, including YMC020W from Saccharomyces cerevisiae. Members of this family contain, which is predicted to show an α/β hydrolase fold with a core structure composed of a central β-sheet consisting of 5-8 strands, connected by α-helices to form an α/β/α sandwich.
