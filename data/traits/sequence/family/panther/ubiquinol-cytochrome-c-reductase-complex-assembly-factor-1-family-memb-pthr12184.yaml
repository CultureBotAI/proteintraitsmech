identifier: PANTHER:PTHR12184
label: "UBIQUINOL-CYTOCHROME C REDUCTASE COMPLEX ASSEMBLY FACTOR 1 FAMILY MEMBER"
definition: >-
  Saccharomyces cerevisiae ubiquinol-cytochrome C chaperone (known as CBP3) is required for assembly of coenzyme QF-2-cytochrome C reductase. The crystal structure of this protein has been resolved in the homologue from the bacteria Brucella abortus, showing an all-helical fold. Homologues are found in a number of different organisms including Homo sapiens (Ubiquinol-cytochrome-c reductase complex assembly factor 1, UQCC1).
