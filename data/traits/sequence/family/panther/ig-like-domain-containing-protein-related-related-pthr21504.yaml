identifier: PANTHER:PTHR21504
label: "IG-LIKE DOMAIN-CONTAINING PROTEIN-RELATED-RELATED"
definition: >-
  This entry includes protein sepa-1 from roundworms. Sepa-1 is a receptor protein that connects P-granules in somatic cells with the autophagic machinery. It directly binds to the P granule component PGL-3 and also to the autophagy protein LGG-1/Atg8.
