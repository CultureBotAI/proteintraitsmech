  - kind: GENERAL
    text: >-
      The CD300 family of receptors is involved in various immune system processes. Members typically possess immunoglobulin-like domains and are expressed on the surface of immune cells such as myeloid cells, mast cells, and natural killer (NK) cells. They play roles in immune homeostasis, phagocytosis of apoptotic cells, and regulation of immune cell activation. Some act as activating receptors, enhancing cytokine production and immune cell activation, while others function as inhibitory receptors, down-regulating cell activation and signaling pathways. The family also includes receptors that mediate transcytosis of immunoglobulins across mucosal surfaces, contributing to pathogen neutralization. Additionally, some members regulate osteoclast formation, B cell development, and primary immune responses to infection. The CD300 family receptors interact with various ligands, including phospholipids, ceramide, and immunoglobulins, and are implicated in both innate and adaptive immunity.
    source: "InterPro:IPR050671 abstract (LLM-generated, not curator-reviewed)"
