  - kind: GENERAL
    text: >-
      The glycosyl hydrolase 84 family is characterized by its ability to cleave N-acetylglucosamine (GlcNAc) from O-glycosylated proteins. Members of this family can utilize substrates such as p-nitrophenyl-beta-GlcNAc and 4-methylumbelliferone-GlcNAc in vitro, but do not act on p-nitrophenyl-beta-GalNAc or p-nitrophenyl-alpha-GlcNAc. The family includes enzymes that are inhibited by various compounds, including PUGNAc and metal ions, depending on the specific protein. Some members are also reported to bind acetyl-CoA and may have acetyltransferase activity, while others do not bind acetyl-CoA and lack histone acetyltransferase activity. The family's function is essential for the regulation of protein post-translational modifications through the removal of O-GlcNAc, impacting numerous cellular processes.
    source: "InterPro:IPR051822 abstract (LLM-generated, not curator-reviewed)"
