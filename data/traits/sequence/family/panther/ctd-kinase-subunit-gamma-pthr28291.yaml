identifier: PANTHER:PTHR28291
label: "CTD KINASE SUBUNIT GAMMA"
definition: >-
  This entry represents Ctk3 from fungi. CTDK-I complex is a three-subunit complex comprised of Ctk1, Ctk2, and Ctk3, that plays a key role in regulation of transcription and translation and in coordinating these two processes. Both Ctk2 and Ctk3 are regulated at the level of protein turnover, and are unstable proteins processed through a ubiquitin-proteasome pathway. Their physical interaction is required to protect both subunits from degradation, and both Ctk2 and Ctk3 are required for Ctk1 CTD kinase activation.
