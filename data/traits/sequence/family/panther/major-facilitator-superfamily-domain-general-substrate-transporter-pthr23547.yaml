identifier: PANTHER:PTHR23547
label: "MAJOR FACILITATOR SUPERFAMILY DOMAIN, GENERAL SUBSTRATE TRANSPORTER"
definition: >-
  ArsJ regularly is encoded next to a glyceraldehyde-3-phosphate dehydrogenase that can synthesize 1-arseno-3-phosphoglycerate in the presence of arsenate, and appears to provide arsenate resistance by exporting that organoarsenical compound before it spontaneously dissociates into arsenate and 3-phosphoglycerate.
