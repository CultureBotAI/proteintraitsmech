identifier: PANTHER:PTHR12181
label: LIPIN
definition: >-
  Lipin family consists of lipin proteins, which are magnesium-dependent phosphatidate phosphatase enzymes that provide diacylglycerol for synthesis of triacylglycerol and phospholipids. Mammalian lipin proteins also exhibit transcriptional coactivator activity. Common polymorphisms in human LPIN1 and LPIN2 genes are associated with traits underlying common metabolic diseases, including increased adiposity, hypertension, insulin sensitivity, and response to commonly used antidiabetic drugs.
