  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of the small GTPase superfamily, specifically within the Ras subfamily. These proteins are involved in various cellular processes through their ability to bind and hydrolyze GTP. They act as molecular switches that cycle between active GTP-bound and inactive GDP-bound states. Some family members are known to regulate rDNA transcription in cooperation with UBF/UBTF, positively influencing RNA polymerase I transcription. Others are implicated in growth regulation, with certain proteins showing a higher affinity for GDP over GTP, and possessing intrinsic GTPase activity. The family's role in growth regulation is highlighted by the influence of some members on cell proliferation, colony formation, and tumorigenic potential when overexpressed.
    source: "InterPro:IPR051065 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
