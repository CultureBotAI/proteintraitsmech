identifier: PANTHER:PTHR12487
label: TEASHIRT-RELATED
definition: >-
  The teashirt family of transcription factors consists of Drosophila teashirt (tsh), the tsh paralogue tiptop (tio), which despite being dispensable for Drosophila development is functionally equivalent to tsh, and the three teashirt homologues (tshz) identified in vertebrates. All of them show similarity in their three first and widely spaced Zn-finger domains, with vertebrate members having additional Zn-fingers and a vertebrate-specific homeodomain. Teashirt is known to play a major role during the development of Drosophila, but the expression and function of other members of the family is only partially known.
