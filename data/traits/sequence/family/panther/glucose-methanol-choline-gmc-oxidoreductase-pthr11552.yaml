identifier: PANTHER:PTHR11552
label: "GLUCOSE-METHANOL-CHOLINE  GMC  OXIDOREDUCTASE"
definition: >-
  Proteins in this entry are members of the glucose-methanol-choline oxidoreductase family of flavoenzymes. These enzymes catalyse diverse reaction and include glucose dehydrogenase (EC:1.1.5.9), alcohol oxidase (EC:1.1.3.13), glucose oxidase (EC:1.1.3.4), choline dehydrogenase (EC:1.1.99.1), and cyclase atC from Aspergillus terreus which oxidizes terremutin to terreic acid, a quinone epoxide inhibitor of a tyrosine kinase. Structural studies indicate that these proteins are composed of an N-terminal FAD-binding domain, and a C-terminal substrate-binding domain. The FAD-binding domain forms the α-β fold typical of dinucleotide binding proteins, while the substrate-binding domain consists of a β-sheet surrounded by α-helices. The general topology of these proteins is conserved, though inserted structural elements occur in both choline dehydrogenase and alcohol dehydrogenase.
definition_source: "InterPro:IPR012132 abstract (PANTHER PTHR11552 is a member signature)"
