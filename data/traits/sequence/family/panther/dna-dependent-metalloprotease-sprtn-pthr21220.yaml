identifier: PANTHER:PTHR21220
label: "DNA-DEPENDENT METALLOPROTEASE SPRTN"
definition: >-
  Covalent DNA-protein crosslinks (DPCs) are toxic DNA lesions that interfere with essential chromatin transactions, such as replication and transcription. Spartan (SPRTN) is a DNA-dependent metalloprotease which cleaves DPCs and plays a key role in maintaining genomic integrity. SPRTN consists of an N-terminal SprT domain (responsible for the proteolytic cleavage of DPCs) followed by a basic region (BR, a DNA-binding element), both contributing to DNA binding. The C-terminal motifs and domains interact with proliferating cell nuclear antigen (PCNA) and ubiquitin, which collectively recruit SPRTN and the associated ATPase p97 or valosin-containing protein (p97 or VCP) to sites of DNA damage. The structure of the human SPRTN revealed a Zn2-binding sub-domain (ZBD) in SprT domain that shields its active site located in the metalloprotease sub-domain (MPD). The ZBD contains an ssDNA-binding site, with a DNA-base-binding pocket formed by aromatic residues and is thought to contribute to the ssDNA specificity of SPRTN, restricts the access of globular substrates, and positions DPCs, which may need to be partially unfolded, for optimal cleavage. The proteolytic activity of SPRTN is regulated by various mechanisms. To prevent the recruitment of SPRTN to chromatin, SPRTN undergoes monoubiquitylation, which can then be deubiquitylated by an unknown ubiquitin protease triggered by DPC induction. Once SPRTN is recruited to chromatin, DNA binding stimulates its protease activity. It has been shown that SPRTN is uniquely activated by single-stranded DNA (ssDNA). Moreover, SPRTN can degrade itself, which may switch off its proteolytic function when repair is complete. SPRTN is also an activator of CHK1 (checkpoint kinase 1) during normal DNA replication by mediating proteolytic cleavag
