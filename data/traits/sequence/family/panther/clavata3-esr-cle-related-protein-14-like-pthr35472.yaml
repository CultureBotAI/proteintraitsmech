identifier: PANTHER:PTHR35472
label: "CLAVATA3/ESR (CLE)-related protein 14-like"
definition: >-
  This entry represents CLAVATA3/ESR (CLE)-related protein 14 from Arabidopsis thaliana (CLE14) and similar proteins predominantly found in plants. CLE14 is an extracellular signal peptide that regulates cell fate. It represses root apical meristem maintenance and functions as an elicitor of the root meristem differentiation through the CLV2/CRN complex signalling pathway. This protein inhibits irreversibly root growth by reducing cell division rates in the root apical meristem.
definition_source: "InterPro:IPR055317 abstract (PANTHER PTHR35472 is a member signature)"
