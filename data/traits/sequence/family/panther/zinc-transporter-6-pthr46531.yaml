  - kind: GENERAL
    text: >-
      ZINC TRANSPORTER 6 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46531. PANTHER protein class: transporter. and participate in transition metal ion transport, metal ion transport. and localise to Golgi apparatus, cytoplasm, endomembrane system.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in zinc ion homeostasis within the early secretory pathway of cells. They are likely to form functional zinc ion:proton antiporter heterodimers with SLC30A5, although they probably have no intrinsic transporter activity on their own. These heterodimers facilitate the entry of zinc into the lumen of organelles along the secretory pathway. The proper regulation of zinc ion concentrations is crucial for the activation and folding of various enzymes, including alkaline phosphatases and those involved in the biosynthesis of phosphatidylinositol glycan anchors.
    source: "InterPro:IPR052005 abstract (LLM-generated, not curator-reviewed)"
