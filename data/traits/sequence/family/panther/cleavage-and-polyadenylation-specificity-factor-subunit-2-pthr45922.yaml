identifier: PANTHER:PTHR45922
label: "CLEAVAGE AND POLYADENYLATION SPECIFICITY FACTOR SUBUNIT 2"
definition: >-
  Cleavage and polyadenylation specificity factor (CPSF) plays a key role in pre-mRNA 3'-end formation, recognising the AAUAAA signal sequence and interacting with poly(A) polymerase and other factors to bring about cleavage and poly(A) addition.
