identifier: PANTHER:PTHR37973
label: "CHONDROITIN PROTEOGLYCAN 3"
definition: >-
  Each chondroitin proteoglycan (CPG) consists of a protein core and one or more covalently attached chondroitin chains. Nine chondroitin core proteins have been identified in C. elegans (CPG-1 to CPG-9). This family includes proteins known as chondroitin proteoglycan 3 (CPG-3) and is found in nematodes from the class Chromadorea.
