  - kind: GENERAL
    text: >-
      The Prokaryotic Molybdopterin-containing Oxidoreductase family comprises enzymes that catalyze various anaerobic redox reactions, often linked to energy conservation. Members of this family are involved in the reduction of compounds such as trimethylamine-N-oxide (TMAO), dimethyl sulfoxide (DMSO), tetrathionate, thiosulfate, selenate, chlorate, and arsenate, using them as terminal electron acceptors. These enzymes are characterized by the presence of a molybdopterin guanine dinucleotide cofactor in their active sites. They play crucial roles in the anaerobic metabolism of bacteria, allowing them to thrive in environments where oxygen is scarce or absent. The family includes enzymes like TMAO reductase, which converts TMAO to trimethylamine, and DMSO reductase, which reduces DMSO to dimethyl sulfide. Other members are involved in the detoxification of toxic compounds, such as arsenate reductase, which reduces arsenate to arsenite. The diversity of substrates reflects the versatility of this family in utilizing different electron acceptors for anaerobic respiration.
