identifier: PANTHER:PTHR22443
label: "NON-SPECIFIC LETHAL 1, ISOFORM M"
definition: >-
  The nonspecific lethal (NSL) complex associates with the histone acetyltransferase MOF (KAT8) in both Drosophila and mammals. KAT8 regulatory NSL complex subunit 1 (KANSL1 or NSL1) is part of the NSL complex that is involved in acetylation of nucleosomal histone H4 on several lysine residues and therefore may be involved in the regulation of transcription.
