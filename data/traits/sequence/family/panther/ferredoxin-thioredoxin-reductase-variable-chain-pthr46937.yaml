identifier: PANTHER:PTHR46937
label: "FERREDOXIN-THIOREDOXIN REDUCTASE, VARIABLE CHAIN"
definition: >-
  The ferredoxin-thioredoxin reductase (FTR) is the essential enzyme of the light dependent regulatory system controlling enzyme activities in oxygenic, photosynthetic cells. The ferredoxin-thioredoxin reductase (FTR) is composed of a catalytic containing a [4Fe-4S] cluster, and a variable subunit. This entry represents the variable subunit of the ferredoxin-thioredoxin reductase (FTR) from plants and cyanobacteria.
