  - kind: GENERAL
    text: >-
      The glycosyltransferase 2 family is involved in various glycosylation processes, which are critical for the synthesis of diverse polysaccharides and glycoconjugates. Members of this family catalyze the transfer of sugar moieties from activated donor molecules, such as UDP-sugars, to specific acceptor molecules, forming glycosidic bonds. Functions include the biosynthesis of antifungal agents, N-glycosylation of proteins, production of exopolysaccharides for biofilm formation and maintenance, maturation of bacterial spore coats, and elongation of chondroitin chains. Some members exhibit specificity for different sugar donors and acceptors, contributing to the structural diversity of carbohydrates in biological systems. The family is characterized by variations in conserved motifs, such as the DTG sequence, which may influence metal ion binding and enzyme activity.
    source: "InterPro:IPR050834 abstract (LLM-generated, not curator-reviewed)"
