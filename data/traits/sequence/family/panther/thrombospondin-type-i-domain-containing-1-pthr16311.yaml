identifier: PANTHER:PTHR16311
label: "THROMBOSPONDIN TYPE I DOMAIN-CONTAINING 1"
definition: >-
  This entry represents human Thrombospondin type-1 domain-containing protein 1 and similar animal proteins. THSD1 is involved in endothelial cell to extracellular matrix adhesion. THSD1 forms a multimeric protein complex with FAK/talin/vinculin, wherein THSD1 promotes talin binding to FAK but not to vinculin, a key step in nascent adhesion assembly.
