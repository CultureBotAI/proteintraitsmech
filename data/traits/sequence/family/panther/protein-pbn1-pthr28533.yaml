identifier: PANTHER:PTHR28533
label: "PROTEIN PBN1"
definition: >-
  This entry represents a group of fungal proteins, including Pbn1. It is a component of glycosylphosphatidylinositol-mannosyltransferase I that probably acts by stabilising the mannosyltransferase GPI14 (the catalytic component). Pbn1 is an essential endoplasmic reticulum membrane protein required for protein processing in the endoplasmic reticulum.
