identifier: PANTHER:PTHR35540
label: "IZUMO SPERM-EGG FUSION PROTEIN 1"
definition: >-
  Izumo sperm-egg fusion protein 1 (IZUMO1) is an essential sperm cell-surface protein required for fertilisation by acting as a ligand for IZUMO1R/JUNO receptor on eggs. It is a member of an immunoglobulin superfamily and possesses a well-conserved putative N-glycosylation site. However, glycosylation is not essential for the function of IZUMO, but has a role in protecting it from fragmentation in cauda epididymis.
definition_source: "InterPro:IPR032700 abstract (PANTHER PTHR35540 is a member signature)"
