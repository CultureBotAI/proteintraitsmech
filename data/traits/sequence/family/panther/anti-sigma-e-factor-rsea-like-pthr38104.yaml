  - kind: GENERAL
    text: >-
      This family of proteins functions as anti-sigma factors for extracytoplasmic function (ECF) sigma factors, specifically sigma-E (RpoE). Members of this family regulate the activity of sigma-E by maintaining it in an inactive state until an extracytoplasmic signal induces a proteolytic cascade known as regulated intramembrane proteolysis (RIP). This cascade involves sequential cleavage by periplasmic and membrane-bound proteases, followed by cytoplasmic proteases, which ultimately degrade the anti-sigma factor and release sigma-E to initiate transcriptional responses to environmental stresses such as heat shock or acid stress. Some family members also interact with other proteins, such as RseB and SspB, which modulate their stability and degradation.
    source: "InterPro:IPR052383 abstract (LLM-generated, not curator-reviewed)"
