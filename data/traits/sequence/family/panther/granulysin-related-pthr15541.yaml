identifier: PANTHER:PTHR15541
label: "GRANULYSIN RELATED"
definition: >-
  This entry represents a group of animal antimicrobial proteins, such as granulysin from humans and NK-lysin from horses. Granulysin is produced by human cytolytic T lymphocytes and natural killer cells that kills Mycobacterium tuberculosis.
