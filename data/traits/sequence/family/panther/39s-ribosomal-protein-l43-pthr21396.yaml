identifier: PANTHER:PTHR21396
label: "39S RIBOSOMAL PROTEIN L43"
definition: >-
  This entry includes the large ribosomal subunit protein mL43, also known as 39S ribosomal protein L43 (MRPL43) in animals and 54S ribosomal protein L51 (MRPL51) in fungi. They are components of the mitochondrial ribosome (mitoribosome), a dedicated translation machinery responsible for the synthesis of mitochondrial genome-encoded proteins.
