identifier: PANTHER:PTHR14865
label: "CST COMPLEX SUBUNIT CTC1"
definition: >-
  In animals and plants, CTC1 is a component of the CST complex (consists of Ten1, Stn1 and CTC1), a complex that binds to single-stranded DNA and is required to protect telomeres from DNA degradation.
