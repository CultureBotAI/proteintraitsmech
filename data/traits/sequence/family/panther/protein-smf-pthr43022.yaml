identifier: PANTHER:PTHR43022
label: "PROTEIN SMF"
definition: >-
  DprA is a new member of the recombination-mediator protein family, dedicated to natural bacterial transformation. In Helicobacter pylori, DprA is required for natural chromosomal and plasmid transformation. It has now been shown that DprA binds cooperatively to single-stranded DNA (ssDNA) and interacts with RecA. In the process, DprA-RecA-ssDNA filaments are produced and these filaments catalyse the homology-dependent formation of joint molecules. While the Escherichia coli SSB protein limits access of RecA to ssDNA, DprA alleviates this barrier. DprA has a role not only in ensuring production of transformants via interaction with RecA, it is also involved in competence shut-off via interaction with ComE.
definition_source: "InterPro:IPR003488 abstract (PANTHER PTHR43022 is a member signature)"
