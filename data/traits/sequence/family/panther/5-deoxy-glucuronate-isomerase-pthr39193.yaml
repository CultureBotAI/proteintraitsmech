identifier: PANTHER:PTHR39193
label: "5-DEOXY-GLUCURONATE ISOMERASE"
definition: >-
  Members of this family include several bacterial myo-inositol catabolism (IolB) proteins. The Bacillus subtilis inositol operon (iolABCDEFGHIJ) is involved in myo-inositol catabolism. Glucose repression of the iol operon induced by inositol is exerted through catabolite repression mediated by CcpA and the iol induction system mediated by IolR. IolB catalyses the isomerisation of 5-deoxy-D-glucuronic acid to produce 2-deoxy-5-keto-D-gluconic acid.
