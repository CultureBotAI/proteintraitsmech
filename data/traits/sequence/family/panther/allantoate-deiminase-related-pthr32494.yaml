identifier: PANTHER:PTHR32494
label: "ALLANTOATE DEIMINASE-RELATED"
definition: >-
  L-carbamoylases (N-carbamoyl-L-amino-acid amidohydrolases) hydrolyse the amide bond of the carbamoyl group in L-N-carbamoyl-amino acids. They are important industrial enzymes widely used for the production of optically pure amino acids due to their stereospecificity. Furthermore, their substrate promiscuity allows their use in different multienzymatic processes. Also included in this family is allantoate amidohydrolase (allantoate deiminase), which catalyzes the conversion of allantoate to (S)-ureidoglycolate, one of the crucial alternate steps in purine metabolism, and yeast N-carbamyl-beta-alanine amidohydrolase (betaAS, beta-alanine synthase). These enzymes are members of the broader family of amidases.
definition_source: "InterPro:IPR010158 abstract (PANTHER PTHR32494 is a member signature)"
