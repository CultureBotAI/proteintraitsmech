identifier: PANTHER:PTHR33478
label: "EXTRACELLULAR METALLOPROTEINASE MEP"
definition: >-
  The peptidase M36 family comprises secreted metalloproteinases that play a role in the assimilation of proteinaceous substrates. Many members are implicated as virulence factors, contributing to the pathogenicity of various organisms by degrading host proteins and facilitating invasion or evasion of the host immune response. These enzymes are characterized by their dependence on metal ions for activity and are inhibited by metalloprotease inhibitors. They are capable of hydrolyzing a variety of peptide bonds and may have substrate specificity, as some are known to cleave specific proteins like elastin or azocasein. The activity of these metalloproteinases is often regulated by metal ions and inhibitors, indicating a tight control of their proteolytic functions, which is crucial for the survival and virulence of the organisms that secrete them.
