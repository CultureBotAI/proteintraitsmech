  - kind: GENERAL
    text: >-
      The C-type lectin domain family 1 is characterized by its members containing C-type lectin-like domains. These proteins function as receptors with diverse roles, including cell-cell interaction and immune response. Members of the family, such as CLC1B in humans and mice, act as platelet receptors for PDPN and signal through a cascade involving SRC and SYK tyrosine kinases, leading to PLCG2 activation. They also play a role in microbial infections by acting as receptors for snake venom proteins like rhodocytin and facilitating the capture of pathogens such as HIV-1 by platelets. In invertebrates, such as in the case of LEC2_MEGRO, these lectins bind to specific carbohydrate structures, agglutinate cells, and may be involved in defense mechanisms.
    source: "InterPro:IPR052309 abstract (LLM-generated, not curator-reviewed)"
