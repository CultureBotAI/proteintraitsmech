identifier: PANTHER:PTHR11482
label: "ARGININE/DIAMINOPIMELATE/ORNITHINE DECARBOXYLASE"
definition: >-
  ARGININE/DIAMINOPIMELATE/ORNITHINE DECARBOXYLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11482. PANTHER protein class: decarboxylase. Members are annotated with the molecular function carboxy-lyase activity, carbon-carbon lyase activity, catalytic activity. Members participate in cellular nitrogen compound biosynthetic process, biogenic amine metabolic process, alpha-amino acid metabolic process. Members localise to cytoplasm.
