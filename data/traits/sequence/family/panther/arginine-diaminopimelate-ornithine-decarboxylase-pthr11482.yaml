definition: >-
  ARGININE/DIAMINOPIMELATE/ORNITHINE DECARBOXYLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11482. PANTHER protein class: decarboxylase. Members are annotated with the molecular function carboxy-lyase activity. Members participate in polyamine biosynthetic process, amino acid metabolic process, small molecule metabolic process. Members localise to cytoplasm.
