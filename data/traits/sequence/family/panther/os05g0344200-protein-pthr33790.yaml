identifier: PANTHER:PTHR33790
label: "OS05G0344200 PROTEIN"
definition: >-
  PAM2-containing protein CID1, also known as protein EARLY RESPONSIVE TO DEHYDRATION 15 (ERD15) or polyadenylate-binding protein-interacting protein 1, is a negative regulator of abscisic acid (ABA) responses. ABA plays an important role in plant germination and development, and accumulates in response to different stresses. ERD15 is involved in stress tolerance in plants, including resistance to drought. This family also includes related protein CID2, whose function is not known.
