identifier: PANTHER:PTHR14095
label: "PHOSPHATASE 2A REGULATORY SUBUNIT-RELATED"
definition: >-
  PHOSPHATASE 2A REGULATORY SUBUNIT-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14095. PANTHER protein class: protein phosphatase, protein modifying enzyme. Members are annotated with the molecular function protein phosphatase regulator activity. Members participate in protein dephosphorylation, nitrogen compound metabolic process. Members localise to protein serine/threonine phosphatase complex, protein-containing complex.
