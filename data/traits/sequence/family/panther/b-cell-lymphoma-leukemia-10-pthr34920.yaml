identifier: PANTHER:PTHR34920
label: "B-CELL LYMPHOMA/LEUKEMIA 10"
definition: >-
  This entry includes animal B-cell lymphoma/leukemia 10 (BCL10) and Equine herpesvirus protein E10. In lymphoid cells BCL10 plays a critical role in the activation of the transcription factor nuclear factor kappa B (NF-kB) downstream of a variety of immune receptors, including the TCR, B cell receptor, NK-cell receptors, C type family lectin receptors, Ig family receptors and G protein-coupled receptors. Activation of NF-kB through receptor-mediated pathways requires BCL10 to form a complex (known as CBM) with the paracaspase MALT1 and with CARD-containing adaptor protein CARMA. BCL10 is involved in the regulation of apoptosis; a BCL10 gene tanslocation is found in mucosa-associated lymphoid tissue (MALT) lymphomas. BCL10 is involved in the adaptive and innate immune response.
definition_source: "InterPro:IPR033238 abstract (PANTHER PTHR34920 is a member signature)"
