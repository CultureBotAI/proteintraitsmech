identifier: PANTHER:PTHR45374
label: "GLUTATHIONE S-TRANSFERASE TCHQD"
definition: >-
  This entry includes bacterial tetrachlorohydroquinone dehalogenase (TCHQD) pcpC and its homologues from plants. Sphingobium chlorophenolicum pcpC is a zeta-class glutathione S-transferase that catalyses the isomerization of maleylacetoacetate to fumarylacetoacetate, which is an essential step in the catabolism of tyrosine and phenylalanine. It also catalyses the dechlorination of dichloroacetate to glyoxylate and isomerizes maleylacetone (an analog of maleylacetoacetate) and consumes dichloroacetate.
