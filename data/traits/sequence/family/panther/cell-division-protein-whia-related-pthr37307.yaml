identifier: PANTHER:PTHR37307
label: "CELL DIVISION PROTEIN WHIA-RELATED"
definition: >-
  This entry describes a family of DNA-binding proteins widely conserved in Gram-positive bacteria, and occasionally occurring elsewhere, such as in Thermotoga. The family includes the sporulation regulator WhiA, which is required for expression of the ParB partioning protein during sporogenesis, as well as the uncharacterised protein MG103, found in mycoplasma.
