identifier: PANTHER:PTHR45689
label: "I[[H]] CHANNEL, ISOFORM E"
definition: >-
  The HCN channel family comprises hyperpolarization-activated ion channels that are weakly selective for potassium over sodium ions. These channels are integral for generating pacemaker currents in the heart and neurons, influencing the rhythm of the heartbeat and neuronal excitability. They are also implicated in sensory processes, such as responses to sour stimuli. HCN channels are regulated by cyclic nucleotides; cAMP and cGMP can activate the channels, leading to tetramer assembly and channel opening. The S4 segment likely serves as a voltage-sensor, with a pattern of positively charged amino acids. Activity can also be modulated by intracellular factors like chloride ions and pH levels. Some family members are sensitive to inhibition by compounds such as Cs(1+), ZD7288, and ivabradine.
