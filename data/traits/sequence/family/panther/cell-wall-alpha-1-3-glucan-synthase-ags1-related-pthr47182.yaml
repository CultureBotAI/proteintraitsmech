identifier: PANTHER:PTHR47182
label: "CELL WALL ALPHA-1,3-GLUCAN SYNTHASE AGS1-RELATED"
definition: >-
  This family of fungal cell wall alpha-1,3-glucan synthase enzymes includes Mok11, Mok12, Mok13, Mok14 and Ags1. Mok11, Mok12, Mok13 and Ags1 are involved in the biosynthesis of alpha-1,3-glucan, a key structural polysaccharide in fungal cell walls. They play critical roles in maintaining cell integrity, morphology, and virulence. Mok12 and Mok13 are involved in the synthesis of the greater part of α-glucan in the spores envelope, a polymer that is mainly digested with mutanase.
