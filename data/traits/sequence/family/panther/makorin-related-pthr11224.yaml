identifier: PANTHER:PTHR11224
label: MAKORIN-RELATED
definition: >-
  The MKRN protein family includes the ribonucleoproteins that are characterised by a variety of zinc-finger motifs, including typical arrays of one to four C3H1-type zinc fingers and a C3HC4-type RING-HC finger. Another motif rich in Cys and His residues (CH), with so far unknown function, is also generally present in MKRN proteins. MKRN proteins may have E3 ubiquitin ligase activity. At least four makorin genes exist in vertebrates. Makorin-3 is an E3 ubiquitin ligase that catalyses the covalent attachment of ubiquitin moieties onto substrate proteins. it acts as a key developmental timer that helps ensure puberty begins at the appropriate age, by inhibiting premature activation of the reproductive hormone cascade. Epigenetically regulates GNRH1 transcription by disrupting the binding of methyl-DNA binding protein 3/MBD3 to the promoter of GNRH1. Mechanistically, mediates the non-proteolytic ubiquitination of MBD3 at multiple sites with 'Lys27' ubiquitin linkages and thereby regulates the methylation status of the genome, including GNRH1 promoter. It modulates the stability and translation of GNRH1 mRNA by mediating the non-proteolytic ubiquitination of PABP family members PABPC1, PABPC3 and PABPC4 at multiple sites. It also participates also in the maintenance of genomic and epigenomic stability by regulating the abundance of APEX2 via 'Lys-48'-linked ubiquitination.
