identifier: PANTHER:PTHR12801
label: "RNA EXONUCLEASE REXO1 / RECO3 FAMILY MEMBER-RELATED"
definition: >-
  This entry represents a family of eukaryotic proteins that function as exonucleases, including RNA exonuclease 1 homologue from humans (REXO1), RNA exonuclease 3 from Candida albicans, RNA exonuclease 4 from Saccharomyces cerevisiae (REXO4), and Putative small RNA degrading nuclease 1-5 from Arabidopsis thaliana (SDN1-5), all of which appear to have exonuclease activity. Interferon-stimulated gene 20 kDa proteins from mammals (also known as apoptosis-enhancing nuclease AEN) also included in this family, which are exonucleases with activity against single- and double-stranded DNA and RNA and mediates p53-induced apoptosis. They act also as interferon-induced antiviral exoribonucleases.
