  - kind: GENERAL
    text: >-
      The BMP lipoprotein family comprises a group of membrane-associated proteins with diverse functions. Some members are involved in the uptake of nucleosides as part of ABC transporter complexes, with specificities ranging from purine nucleosides to all common nucleosides. These proteins may act as substrate-binding components of the transport system, displaying varying affinities for different substrates, including guanosine, inosine, adenosine, and riboflavin. Other members are described as immunogenic proteins, suggesting a role in immune response, although their specific functions remain unknown. Additionally, one member functions as a transcriptional activator, indicating a regulatory role in gene expression. The family is characterized by its similarity to the BMP lipoprotein family, suggesting a shared structural framework or evolutionary origin.
    source: "InterPro:IPR050957 abstract (LLM-generated, not curator-reviewed)"
