  - kind: GENERAL
    text: >-
      This family of proteins includes NADPH-dependent quinone oxidoreductases that are involved in various redox reactions. Members of this family are capable of reducing quinones and other related compounds through single-electron transfers. These enzymes play roles in processes such as haustorium initiation in parasitic plants and the reduction of reactive electrophile species derived from poly-unsaturated fatty acid peroxides. They exhibit substrate specificity, with some members unable to reduce certain types of quinones or short-chain alkenals and alkenones. The proteins are characterized by the presence of a zinc-containing alcohol dehydrogenase domain and are localized to chloroplasts, indicating a role in plant-specific metabolic pathways.
    source: "InterPro:IPR052733 abstract (LLM-generated, not curator-reviewed)"
