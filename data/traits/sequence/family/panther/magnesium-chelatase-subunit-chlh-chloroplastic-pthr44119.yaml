identifier: PANTHER:PTHR44119
label: "MAGNESIUM-CHELATASE SUBUNIT CHLH, CHLOROPLASTIC"
definition: >-
  This entry contains a domain common to the cobN protein and to magnesium protoporphyrin chelatase. CobN may play a role in cobalt insertion reactions and is implicated in the conversion of precorrin-2 to cobyrinic acid in cobalamin biosynthesis. Magnesium protoporphyrin chelatase is involved in chlorophyll biosynthesis as the third subunit of light-independent protochlorophyllide reductase in bacteria and plants. This domain is found either standalone or in combination with InterPro:IPR022571.
definition_source: "InterPro:IPR003672 abstract (PANTHER PTHR44119 is a member signature)"
