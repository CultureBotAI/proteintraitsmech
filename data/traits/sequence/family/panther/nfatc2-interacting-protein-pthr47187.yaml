definitions:
  - kind: GENERAL
    text: >-
      NFATC2-INTERACTING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47187. Members participate in positive regulation of transcription by RNA polymerase II, cytokine production.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The NFATC2-interacting protein family is involved in the regulation of NFAT-driven transcription of cytokine genes in T-helper 2 (Th2) cells. Members of the family enhance cytokine expression by recruiting PRMT1 to promoters, facilitating histone methylation and acetylation. They also play a role in DNA repair by stabilizing the association of double strand breaks with the nuclear periphery during homologous recombination. Additionally, they down-regulate the formation of poly-SUMO chains, indicating a multifaceted role in cellular regulation and response to damage.
    source: "InterPro:IPR052324 abstract (LLM-generated, not curator-reviewed)"
