identifier: PANTHER:PTHR14324
label: "CONDENSIN-2 COMPLEX SUBUNIT H2"
definition: >-
  Condensin complexes are involved in the restructuring and maintenance of chromatin. Eukaryotes possess two condensins: condensin I and condensin II. Each complex is composed of structural maintenance of chromosomes protein SMC2 and SMC4, with three additional non-SMC condensin-associated proteins (Ncaps) unique to each condensin (condensin I - Ncaph, Ncapd2, and Ncapg; condensin II - Ncaph2, Ncapd3, and Ncapg2). This entry includes condensin-2 subunit 2 (Ncaph2) and Kle-2 from C. elegans. Ncaph2 may play a role in lineage-specific role in T-cell development.
definition_source: "InterPro:IPR031739 abstract (PANTHER PTHR14324 is a member signature)"
