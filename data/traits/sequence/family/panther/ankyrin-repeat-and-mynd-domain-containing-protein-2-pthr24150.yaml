identifier: PANTHER:PTHR24150
label: "ANKYRIN REPEAT AND MYND DOMAIN-CONTAINING PROTEIN 2"
definition: >-
  The Ankyrin repeat and MYND domain-containing protein 2 family is implicated in the cellular process of trafficking signaling proteins to cilia. Members of this family play a crucial role in the proper localization of signaling molecules, which is essential for the function of cilia in sensory perception and signal transduction. In particular, the family is involved in the dendritic transport of receptor-type guanylate cyclases to cilia in sensory neurons, which is necessary for calcium signaling in response to stimuli such as nitric oxide. This function is critical for the behavioral avoidance response in organisms, highlighting the family's importance in sensory and physiological processes.
