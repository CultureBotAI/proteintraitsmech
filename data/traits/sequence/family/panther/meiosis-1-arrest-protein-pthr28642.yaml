identifier: PANTHER:PTHR28642
label: "MEIOSIS 1 ARREST PROTEIN"
definition: >-
  Meiosis 1 arrest protein (M1AP), also known as spermatogenesis-associated protein 37 (Spata37), is required for meiosis I progression during spermatogenesis. The full-length protein is expressed in male germ cells from spermatogonia to spermatids during testicular development. Mutations in M1AP cause spermatogenic failure 48 (SPGF48), an autosomal recessive disorder resulting in severe oligozoospermia and male infertility due to meiotic arrest.
definition_source: "InterPro:IPR033587 abstract (PANTHER PTHR28642 is a member signature)"
