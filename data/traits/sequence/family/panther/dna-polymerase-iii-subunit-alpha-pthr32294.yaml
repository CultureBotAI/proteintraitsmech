identifier: PANTHER:PTHR32294
label: "DNA POLYMERASE III SUBUNIT ALPHA"
definition: >-
  All proteins in this family for which functions are known are DNA polymerases. The group includes the error-prone DNA polymerase (DnaE2), involved in damage-induced mutagenesis and translesion synthesis (TLS), DNA polymerase III PolC-type, and the alpha subunit of DNA polymerase III (DnaE) ( ). DNA polymerase III is a complex, multichain enzyme responsible for most of the replicative synthesis in bacteria. This DNA polymerase also exhibits 3' to 5' exonuclease activity.
