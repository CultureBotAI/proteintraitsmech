  - kind: GENERAL
    text: >-
      The LRR receptor-like kinase family encompasses proteins with roles in plant growth regulation, immunity, and development. Members act as receptors for various ligands, including defense peptides, CLV3-like peptides, and phytosulfokines, triggering signaling cascades essential for plant cell differentiation, organogenesis, and immune responses. Some proteins within the family possess dual specificity kinase activity, phosphorylating serine/threonine- and tyrosine-containing substrates. Others are involved in the negative regulation of bone mass in mammals. The family includes both active kinases and proteins with predicted inactive kinase domains, suggesting diverse regulatory mechanisms within the family.
