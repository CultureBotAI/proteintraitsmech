identifier: PANTHER:PTHR35136
label: "CYCLOEUCALENOL CYCLOISOMERASE"
definition: >-
  This entry represents the enzyme cycloeucalenol cycloisomerase (EC:5.5.1.9) and is involved in the synthesis of plant sterols, by converting pentacyclic cyclopropyl sterols to tetracyclic sterols. In Arabidopsis thaliana (Mouse-ear cress), cycloeucalenol cycloisomerase functions during and just after division and supports gravitropism by establishing polar PIN2 (auxin transporter) localisation, it is also required for endocytosis of PIN2.
definition_source: "InterPro:IPR020532 abstract (PANTHER PTHR35136 is a member signature)"
