  - kind: GENERAL
    text: >-
      The acetyltransferase Eis family comprises proteins that function as effectors released into host cells, modulating host immune responses and contributing to bacterial survival. Members of the family possess acetyltransferase activity, acetylating lysine residues of host proteins and multiple amine groups of aminoglycoside antibiotics, leading to drug resistance. Some proteins within the family are known to acetylate and deactivate the cyclic peptide antibiotic capreomycin. They are involved in the negative modulation of inflammation, macrophage autophagy, and cell death through redox-dependent signaling. The acetylation of specific host proteins, such as dual-specificity protein phosphatase 16 (DUSP16)/MKP-7, inhibits JNK-dependent autophagy and ROS generation, enhancing intracellular survival of pathogens like M.tuberculosis. The family's role in immune response includes altering T-cell proliferation and cytokine production, skewing immunity away from a protective T(H)1 response.
    source: "InterPro:IPR051554 abstract (LLM-generated, not curator-reviewed)"
