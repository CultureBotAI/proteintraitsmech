identifier: PANTHER:PTHR47307
label: "GLUTATHIONE-REGULATED POTASSIUM-EFFLUX SYSTEM ANCILLARY PROTEIN KEFG"
definition: >-
  This family includes the glutathione-regulated potassium-efflux system ancillary proteins KefG and KefF which belong to the NAD(P)H dehydrogenase (quinone) family. The potassium efflux system (Kef) is used for many bacteria to protect themselves from the toxic effects of electrophilic compounds. This family also includes poorly characterised proteins, such as YrkL and YdeQ.
