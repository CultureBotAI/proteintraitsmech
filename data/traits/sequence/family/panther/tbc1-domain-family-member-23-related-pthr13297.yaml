identifier: PANTHER:PTHR13297
label: "TBC1 DOMAIN FAMILY MEMBER 23-RELATED"
definition: >-
  TBC1 domain family member 23 (TBC1D23) is a catalytically inactive member of a family of Rab GTPase-activating proteins (GAPs) which plays a role in endosome-to-Golgi trafficking and is important for normal brain development, especially in axonal and dendritic growth. It functions as a bridging factor between golgin-97/245 and the FAM21 subunit of the WASH (Wiskott-Aldrich syndrome protein and SCAR homologue) complex on endosomal vesicles. Mutations of the TBC1D23 gene cause pontocerebellar hypoplasia and alter cortical development.
definition_source: "InterPro:IPR039755 abstract (PANTHER PTHR13297 is a member signature)"
