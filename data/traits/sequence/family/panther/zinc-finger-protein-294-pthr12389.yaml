identifier: PANTHER:PTHR12389
label: "ZINC FINGER PROTEIN 294"
definition: >-
  This entry represents a group of E3 ubiquitin-protein ligases, including Rkr1 from budding yeasts and listerin (LTN1) from animals. LTN1/Rkr1 is a component of the ribosome quality control complex (RQC), a ribosome-associated complex that mediates ubiquitination and extraction of incompletely synthesized nascent chains for proteasomal degradation.
definition_source: "InterPro:IPR039795 abstract (PANTHER PTHR12389 is a member signature)"
