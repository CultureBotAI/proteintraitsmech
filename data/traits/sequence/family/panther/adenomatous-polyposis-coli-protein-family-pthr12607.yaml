identifier: PANTHER:PTHR12607
label: "ADENOMATOUS POLYPOSIS COLI PROTEIN FAMILY"
definition: >-
  Adenomatous polyposis coli (APC) is a tumor suppressor protein that induces the degradation of oncogenic beta-catenin and negatively regulates Wnt signalling. It has roles in regulating cell migration, DNA replication/repair, mitosis and apoptosis. APC regulates cell-cell adhesion and cell migration through activating the APC-stimulated guanine nucleotide-exchange factor (GEF; Asef). It acts as a mediator of ERBB2-dependent stabilisation of microtubules at the cell cortex. It is required for the localisation of MACF1/ACF7 to the cell membrane and this localisation of MACF1/ACF7 is critical for its function in microtubule stabilisation. APC mutations are particularly prevalent in colorectal cancer. The adenomatous polyposis coli protein family also includes APC2 and APC-related protein 1.
definition_source: "InterPro:IPR026818 abstract (PANTHER PTHR12607 is a member signature)"
