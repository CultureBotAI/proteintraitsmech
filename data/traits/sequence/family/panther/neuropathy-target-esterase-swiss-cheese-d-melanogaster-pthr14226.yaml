identifier: PANTHER:PTHR14226
label: "NEUROPATHY TARGET ESTERASE/SWISS CHEESE D.MELANOGASTER"
definition: >-
  The NTE family proteins are characterized by their phospholipase B activity, catalyzing the double deacylation of phosphatidylcholine to glycerophosphocholine, which is essential for membrane lipid homeostasis. They play a crucial role in the turnover of phosphatidylcholine in response to various stimuli such as inositol, elevated temperatures, or the presence of choline in the growth medium. Members of the NTE family are also involved in the signaling mechanisms between neurons and glia, regulating glia wrapping during brain development and are essential for cell survival. The family's activity is notably inhibited by organophosphorus esters, which can lead to distal axonopathy upon specific chemical modification of the proteins.
