identifier: PANTHER:PTHR38092
label: "REGULATOR CUDA, PUTATIVE-RELATED"
definition: >-
  This is a family of putative transcription factors found mainly in slime molds. CudA from Dictyostelium directly activates expL7 gene expression in prestalk cells in the anterior region of the migrating slug.
