  - kind: GENERAL
    text: >-
      This family of proteins is involved in plant defense mechanisms. Members of this family act as receptors that recognize specific pathogen-associated molecular patterns (PAMPs) or microbe-associated molecular patterns (MAMPs), triggering immune responses. These responses can include the release of reactive oxygen species (ROS), emission of stress-related phytohormones like ethylene, and hypersensitive cell death. Some family members are known to confer resistance to bacterial pathogens and parasitic plants by recognizing specific molecular patterns presented by the invading organism.
