identifier: PANTHER:PTHR15192
label: "PROTEIN CBG05349"
definition: >-
  This entry represents OSGIN 1, OSGIN 2 and related proteins found in animals such as F30B5.4 an uncharacterised protein from Caenorhabditis elegans. The oxidative stress-induced growth inhibitor 1 (OSGIN1) regulates the differentiation and proliferation of normal cells through the regulation of cell death. It has also been identified as a possible as a flavin-dependent monooxygenase. OSGIN2 may be involved in meiosis or the maturation of germ cells.
