identifier: PANTHER:PTHR36015
label: "HOLLIDAY JUNCTION RESOLVASE MOC1, CHLOROPLASTIC-RELATED"
definition: >-
  This entry represents a group of proteins mostly from proteobacteria and plants, including MOC1 from Arabidopsis. MOC1 is a chloroplastic protein and a structure-specific endonuclease that resolves Holliday junction (HJ) intermediates during genetic recombination. It is structurally similar to a bacterial Holliday junction resolvase, resistance to ultraviolet (Ruv) C. Its structure has been resolved.
