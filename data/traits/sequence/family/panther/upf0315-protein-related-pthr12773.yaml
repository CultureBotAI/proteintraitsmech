identifier: PANTHER:PTHR12773
label: "UPF0315 PROTEIN-RELATED"
definition: >-
  Trm112 is a component of several multifunctional methyltransferases. When associated with methyltransferase Mtq2, the enzyme methylates 'Gln-182' of eRF1. Mtq2 is the catalytic subunit, and Trm112 is required for its solubility and activity. When associated with methyltransferase Trm11, the enzyme forms 2-methylguanosine at position 10 (m2G10) in tRNA. When associated with methyltransferase Bud23, the enzyme forms 7-methylguanine at position 1575 (m7G1575) in 18S rRNA.
