identifier: PANTHER:PTHR13794
label: "ENOLASE SUPERFAMILY, MANDELATE RACEMASE"
definition: >-
  This entry includes a subgroup of mandelate racemases, including L-rhamnonate dehydratase, Pseudomonas putida mandelate racemase, L-fuconate dehydratase, L-talarate/galactarate dehydratase and mitochondrial enolase superfamily member 1 (ENOF1). Human ENOF1 (also known as rTS and L-fuconate dehydratase) catalyses the racemization of mandelate as well as dehydration of various acid sugars. The mandelate racemase group consists of the subset of enolase superfamily enzymes with a conserved histidine, presumably acting as an active site base, at the position of H297 in Pseudomonas putida mandelate racemase (UniProtKB:P11444). An additional conserved aspartic acid controls the p K a of this histidine (D270 in Pseudomonas putida mandelate racemase). Families contained within this group include mandelate racemase, D-galactonate dehydratase (dgoD), gluconate dehydratase, L-fuconate dehydratase, D-tartrate dehydratase, and L-talarate/galactarate dehydratase.
