  - kind: GENERAL
    text: >-
      This family of proteins includes histone-lysine N-methyltransferases that are known to modify histones by di- and trimethylation, particularly 'Lys-9' of histone H3. These modifications are crucial for regulating gene expression and are involved in various cellular processes, including modulation of aging and stress resistance. Some family members are implicated in repressing mitochondrial function-related genes and modulating the mitochondrial unfolded protein response. Additionally, they may influence the levels of neurotransmitters such as serotonin and dopamine, thereby affecting longevity and behavioral responses. Members of this family belong to the class V-like SAM-binding methyltransferase superfamily, indicating a shared mechanism of action involving S-adenosylmethionine as a methyl donor.
    source: "InterPro:IPR053105 abstract (LLM-generated, not curator-reviewed)"
