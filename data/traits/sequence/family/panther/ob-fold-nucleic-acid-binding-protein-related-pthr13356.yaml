  - kind: GENERAL
    text: >-
      The SOSS-B family is involved in the cellular DNA damage response, particularly in promoting DNA repair and the G2/M checkpoint. Members of the family function as components of the SOSS complex, which operates downstream of the MRN complex. They act as sensors of single-stranded DNA, with a preference for polypyrimidines, and are essential for homologous recombination-dependent repair of double-strand breaks and ATM-dependent signaling pathways. The SOSS complex's association with DNA lesions is crucial for cell-cycle checkpoint activation, recombinational repair, and maintaining genomic stability.
    source: "InterPro:IPR051231 abstract (LLM-generated, not curator-reviewed)"
