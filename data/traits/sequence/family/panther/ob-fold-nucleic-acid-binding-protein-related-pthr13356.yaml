  - kind: GENERAL
    text: >-
      OB FOLD NUCLEIC ACID BINDING PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13356. PANTHER protein class: damaged DNA-binding protein. Members are annotated with the molecular function organic cyclic compound binding, DNA binding. and participate in cellular response to stimulus, double-strand break repair, macromolecule metabolic process.
