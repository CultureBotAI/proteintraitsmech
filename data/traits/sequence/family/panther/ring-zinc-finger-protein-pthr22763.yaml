definitions:
  - kind: GENERAL
    text: >-
      RING ZINC FINGER PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22763. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function aminoacyltransferase activity, catalytic activity, acting on a protein, ubiquitin protein ligase activity. and participate in modification-dependent macromolecule catabolic process, modification-dependent protein catabolic process, proteasomal protein catabolic process. and localise to cellular anatomical entity, endomembrane system.
