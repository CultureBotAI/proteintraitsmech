identifier: PANTHER:PTHR22763
label: "RING ZINC FINGER PROTEIN"
definition: >-
  The HRD1 family of E3 ubiquitin-protein ligases is involved in the endoplasmic reticulum-associated degradation (ERAD) system, which mediates the ubiquitination and subsequent proteasomal degradation of misfolded or short-lived proteins in the endoplasmic reticulum (ER). Members of the HRD1 family accept ubiquitin from specific E2 ligases and transfer it to substrates, facilitating their removal from the ER and degradation. This process is crucial for maintaining protein homeostasis and ER quality control, and it protects cells from ER stress-induced apoptosis. Some family members also regulate various cellular processes, including cell cycle regulation, apoptosis, and cholesterol homeostasis, by targeting specific proteins such as p53, HMGCR, and components of the NADPH oxidase complex.
