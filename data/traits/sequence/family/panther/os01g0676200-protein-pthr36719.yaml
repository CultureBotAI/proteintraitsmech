identifier: PANTHER:PTHR36719
label: "OS01G0676200 PROTEIN"
definition: >-
  CRR41 is localised to the chloroplast stroma and is required for both formation and activity of the NDH complex. The full-length protein functions in assembly or stabilisation of the NDH complex, probably involved together with NdhO and NdhH in the formation of an NDH subcomplex A assembly intermediate.
