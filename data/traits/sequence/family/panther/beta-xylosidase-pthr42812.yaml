identifier: PANTHER:PTHR42812
label: BETA-XYLOSIDASE
definition: >-
  The glycosyl hydrolase 43 family encompasses enzymes with diverse functions primarily involved in the degradation of complex carbohydrates. Members of this family include alpha-L-arabinofuranosidases and beta-xylosidases, which act on non-reducing ends of their respective substrates. Alpha-L-arabinofuranosidases cleave terminal alpha-L-arabinofuranoside residues in xyloglucan branches, facilitating the conversion of 'S' units to 'X' units and thus participating in xyloglucan degradation. Beta-xylosidases contribute to xylan degradation by breaking down beta-xylooligosaccharides into D-xylose units. Some family members also exhibit activity towards ulvan, a polysaccharide found in green seaweed, aiding in the degradation of its xylose-containing disaccharide building blocks. The family's enzymes are subject to inhibition by various metal ions and compounds, indicating a regulatory aspect to their activity in vivo.
