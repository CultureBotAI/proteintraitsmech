identifier: PANTHER:PTHR13495
label: "NEFA-INTERACTING NUCLEAR PROTEIN NIP30"
definition: >-
  PIP30/FAM192A acts as a regulator of PA28-gamma, a nuclear activator of the 20S proteasome. PIP30 favours PA28-gamma interaction with the 20S proteasome while inhibiting its association with coilin, a central component of nuclear Cajal bodies.
