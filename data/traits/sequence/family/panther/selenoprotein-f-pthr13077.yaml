identifier: PANTHER:PTHR13077
label: "SELENOPROTEIN F"
definition: >-
  Selenoprotein F (Sep15) and selenoprotein M (SelM) are eukaryotic selenoproteins that have a thioredoxin-like domain and a surface accessible active site redox motif. This suggests that they function as thiol-disulphide isomerases involved in disulphide bond formation in the endoplasmic reticulum.
