identifier: PANTHER:PTHR15092
label: "POLY A -SPECIFIC RIBONUCLEASE/TARGET OF EGR1, MEMBER 1"
definition: >-
  The CAF1 family proteins are specialized 3'-exoribonucleases with a preference for degrading poly(A) tails of mRNAs, a key step in eukaryotic mRNA decay. They play roles in various biological processes including translational silencing of maternal mRNAs during oocyte maturation and early embryonic development, nonsense-mediated mRNA decay, and the degradation of unstable mRNAs with AU-rich elements. Some family members are also involved in the maturation and processing of snRNAs, piRNAs, and the regulation of microRNAs and small nucleolar RNAs. Their functions are critical for cell growth regulation, fertility, gene silencing, and stress response.
