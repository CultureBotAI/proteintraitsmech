  - kind: GENERAL
    text: >-
      This family of proteins is involved in the maintenance of the postembryonic root stem cell niche in plants. They play a crucial role in regulating the expression levels and spatial patterns of key transcription factors that are essential for root development. Members of this family are particularly important for the modulation of the transcription factor PLETHORA, which they influence mainly at the post-transcriptional level. Through this regulation, they contribute to promoting root elongation, ensuring proper root growth and development.
