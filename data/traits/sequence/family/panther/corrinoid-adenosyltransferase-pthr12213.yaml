identifier: PANTHER:PTHR12213
label: "CORRINOID ADENOSYLTRANSFERASE"
definition: >-
  ATP:cob(I)alamin (or ATP:corrinoid) adenosyltransferases (EC:2.5.1.17), catalyse the conversion of cobalamin (vitamin B12) into its coenzyme form, adenosylcobalamin (AdoCbl)or coenzyme B12. AdoCbl contains an adenosyl moiety liganded to the cobalt ion of cobalamin via a covalent Co-C bond. AdoCbl is required as a cofactor for the activity of certain enzymes. ATP:cob(I)alamin adenosyltransferases are classed into three groups: CobA-type, EutT-type and PduO-type. Each of the three enzyme types appears to be specialised for particular AdoCbl-dependent enzymes or for the de novo synthesis AdoCbl. PduO and EutT are distantly related, sharing short conserved motifs, while CobA is evolutionarily unrelated and is an example of convergent evolution. This entry represents the Corrinoid adenosyltransferase family corresponding to the N-terminal half of Salmonella PduO, a 1,2-propanediol utilization protein that probably is bifunctional. The PduO-type adenosyltransferase is the most widely distributed ATP:cobalamin adenosyltransferase. the mammalian ortholog (MmaB), also included in this family, is associated with mitochondrial B12 metabolism. Mutations in the human gene can result in the metabolic disorder known as methylmalonic aciduria (MMA).
