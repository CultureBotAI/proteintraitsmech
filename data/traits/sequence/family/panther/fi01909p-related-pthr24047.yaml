  - kind: GENERAL
    text: >-
      This family of proteins is involved in the innate immune response by recognizing and binding to lipopolysaccharides on the cell walls of Gram-negative bacteria. They act as pattern recognition receptors, promoting bacterial aggregation and enhancing bacterial clearance. These proteins specifically interact with the inner core oligosaccharides of rough-type LPS and exhibit antibacterial activity against Gram-negative bacteria such as E. coli. However, they do not show activity against Gram-positive bacteria like S. aureus or fungi such as C. albicans.
