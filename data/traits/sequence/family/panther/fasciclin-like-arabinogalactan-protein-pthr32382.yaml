identifier: PANTHER:PTHR32382
label: "FASCICLIN-LIKE ARABINOGALACTAN PROTEIN"
definition: >-
  This entry includes fasciclin-like arabinogalactan proteins (FLAs) from plants. FLAs are a subclass of arabinogalactan proteins involved in plant growth, development and response to abiotic stress. They not only contain one or two AGP-like glycosylated regions, but also include one or two fasciclin (FAS) domains, which is an ancient cell adhesion domain conserved from bacteria to animals. The FLAs can be classified in four groups (A-D) based on phylogenetic analysis. This entry represents a group that includes FLA1-8, FLA10 and FLA14.
