identifier: PANTHER:PTHR35402
label: "INTEGRAL MEMBRANE PROTEIN-RELATED"
definition: >-
  This family includes FlaJ from Methanocaldococcus jannaschii, ArlJ from Halobacterium salinarum (UniProtKB:Q9HQY4) and related prokaryotic proteins that are involved in the formation and function of flagella, which are whip-like structures that enable motility in various types of cells. They are accessory components that may interact with other flagellar proteins to facilitate the assembly or stability of the flagellar apparatus.
