identifier: PANTHER:PTHR43784
label: "GDSL-LIKE LIPASE/ACYLHYDROLASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_2G00820)-RELATED"
definition: >-
  This family of proteins includes enzymes with lipase activity, specifically GDSL lipases. They are characterized by their ability to catalyse the hydrolysis of ester bonds within lipid substrates. Members of this family preferentially act on medium-chain p-nitrophenyl esters, with optimal activity observed for esters with a decanoate chain. They exhibit a broad substrate specificity, also hydrolyzing esters with varying chain lengths, although with lower efficiency for shorter and longer chains. Among its members, this family includes Rv0518 from M.tuberculosis and uncharacterised sequences from bacteria and fungi. The activity of these enzymes is known to be inhibited by serine modifiers such as PMSF, indicating a serine residue's involvement in the catalytic mechanism.
definition_source: "InterPro:IPR053140 abstract (PANTHER PTHR43784 is a member signature)"
