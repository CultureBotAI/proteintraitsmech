  - kind: GENERAL
    text: >-
      This family of proteins includes extradiol ring-cleavage dioxygenases that are involved in the degradation of aromatic compounds with two hydroxyl groups at para positions. These enzymes catalyze the oxidative cleavage of aromatic rings, a critical step in the breakdown of various pollutants and toxins, such as gamma-hexachlorocyclohexane (gamma-HCH or lindane). The cleavage process consumes molecular oxygen and results in the formation of intermediate products that can be further metabolized for energy and carbon. Members of this family are characterized by their inability to process catechol, distinguishing them from meta-cleavage dioxygenases.
    source: "InterPro:IPR052537 abstract (LLM-generated, not curator-reviewed)"
