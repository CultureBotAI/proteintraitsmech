identifier: PANTHER:PTHR14130
label: "3BP-1 RELATED RHOGAP"
definition: >-
  This entry represents a group of GTPase-activating proteins (GAPs) that stimulate the GTPase activity of Rho-type GTPases, including Rho GTPase-activating protein 17 (RHG17, also known as RICH-1), RHG44 (also known as RICH-2), SH3 domain-binding protein 1 (SH3BP1) and bargin from human which are referred to as BAR-domain RhoGAP subfamily. Bargin is an alternative splice product consisting of a modified N-terminal BAR domain, an intermediary RhoGAP domain, and a C-terminal partial CIN module and this is the only BAR-RhoGAP subfamily member that lacks a C-terminal polyproline-rich repeat region, which is replaced by the partial CIN phosphatase module. These proteins convert GTP-bound Rho-type GTPases including RAC1 and CDC42 in their inactive GDP-bound form. SH3BP1 specifically inactivates RAC1 at the leading edge of migrating cells, it regulates the spatiotemporal organization of cell protrusions which is important for proper cell migration. It is involved in actin remodelling and the formation of epithelial cell junctions, through negative regulation of CDC42]. This protein plays a specific role in phagocytosis of large particles as it is specifically recruited by a PI3 kinase/PI3K-dependent mechanism to sites of large particles engagement, where it inactivates RAC1 and/or CDC42 allowing the reorganization of the actin cytoskeleton required for engulfment.
definition_source: "InterPro:IPR047165 abstract (PANTHER PTHR14130 is a member signature)"
