identifier: PANTHER:PTHR14222
label: CONDENSIN
definition: >-
  This entry includes condensin subunit 1 (CND1) and condensin-2 complex subunit D3 (NCAPD3). CND1 is a regulatory subunit of the condensin complex (contains the SMC2 and SMC4 heterodimer, and three non SMC subunits that probably regulate the complex: NCAPH/BRRN1, NCAPD2/CAPD2 and NCAPG), a complex required for conversion of interphase chromatin into mitotic-like condense chromosomes. The condensin complex probably introduces positive supercoils into relaxed DNA in the presence of type I topoisomerases and converts nicked DNA into positive knotted forms in the presence of type II topoisomerases.
definition_source: "InterPro:IPR026971 abstract (PANTHER PTHR14222 is a member signature)"
