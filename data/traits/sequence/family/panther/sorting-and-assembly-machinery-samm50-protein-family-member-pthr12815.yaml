identifier: PANTHER:PTHR12815
label: "SORTING AND ASSEMBLY MACHINERY SAMM50 PROTEIN FAMILY MEMBER"
definition: >-
  This entry includes proteins with a domain similar to that of bacterial surface antigen (D15) from Haemophilus influenzae. Proteins include: Outer membrane protein assembly factor BamA, which forms part of the outer membrane protein assembly complex involved in assembly and insertion of β-barrel proteins into the outer membrane in Gram-negative bacteria. Sorting and assembly machinery component 50, which is required for the maintenance of the structure of mitochondrial cristae and the proper assembly of the mitochondrial respiratory chain complexes. Translocation and assembly module subunit TamA, which is a component of the translocation and assembly module (TAM) autotransporter assembly complex which translocates autotransporters across the outer membrane. Outer envelope protein 80, chloroplastic, for which knockout is embryonic lethal. Outer envelope protein 39, chloroplastic. Protein TOC75, chloroplastic (translocon at the outer envelope membrane of chloroplasts, 75 kD), which functions as a preprotein translocation channel during chloroplast import.
