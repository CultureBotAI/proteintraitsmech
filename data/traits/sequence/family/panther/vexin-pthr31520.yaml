identifier: PANTHER:PTHR31520
label: VEXIN
definition: >-
  This family includes Xenopus laevis Vexin and its human homologue, C8orf46. Vexin is transiently expressed in differentiating progenitors in the developing central nervous system (CNS) and is required for neurogenesis in the neural plate and retina.
