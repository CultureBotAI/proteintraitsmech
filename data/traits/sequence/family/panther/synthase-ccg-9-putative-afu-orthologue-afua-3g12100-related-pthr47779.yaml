  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in the metabolism of trehalose, a disaccharide sugar. Members of this family are capable of synthesizing trehalose through a reversible reaction, predominantly from ADP-glucose and glucose, although some can also use UDP-glucose or GDP-glucose. The equilibrium of this reaction generally favors trehalose synthesis. Additionally, certain members can reversibly catalyze the synthesis and degradation of trehalose from glucose and alpha-D-glucose 1-phosphate. The activity of these enzymes can be modulated by various metal ions, with some enhancing or inhibiting the enzymatic function.
