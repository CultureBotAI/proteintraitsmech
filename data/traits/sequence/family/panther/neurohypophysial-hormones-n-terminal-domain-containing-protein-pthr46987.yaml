  - kind: GENERAL
    text: >-
      This family of proteins acts as activators of the canonical Wnt signaling pathway by serving as ligands for LGR4-6 receptors. They play a crucial role in various biological processes, including angiogenesis, embryonic development, and limb specification. By binding to their receptors, these proteins trigger the association of LGR4-6 with phosphorylated LRP6 and frizzled receptors, which are activated by extracellular Wnt receptors, leading to the activation of the Wnt signaling pathway and increased expression of target genes. Additionally, they regulate both the canonical Wnt/beta-catenin-dependent pathway and non-canonical Wnt signaling pathways. They can function independently of LGR4-6 receptors, potentially acting as antagonistic ligands to RNF43 and ZNRF3, which are important regulators of the Wnt signaling pathway. Furthermore, they may have roles in negatively regulating the TGF-beta pathway.
    source: "InterPro:IPR051514 abstract (LLM-generated, not curator-reviewed)"
