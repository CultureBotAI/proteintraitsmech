  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with multiple activities involved in NAD biosynthesis and regulation. They possess nicotinamide mononucleotide (NMN) adenylyltransferase activity, catalyzing the formation of NAD(+) from nicotinamide ribonucleotide and ATP. Additionally, they exhibit ribosylnicotinamide (RN) kinase activity, phosphorylating RN to produce nicotinamide ribonucleotide. Some members also have a DNA-binding domain that regulates the transcription of NAD biosynthetic genes in response to NAD and ATP levels. The enzymatic activities are subject to feedback regulation by NAD, with high levels inhibiting the RN kinase activity and repressing NAD synthetic genes, while low levels activate the enzymes and derepress biosynthetic genes.
    source: "InterPro:IPR052735 abstract (LLM-generated, not curator-reviewed)"
