definitions:
  - kind: GENERAL
    text: >-
      DIHYDROLIPOAMIDE ACETYLTRANSFERASE COMPONENT OF PYRUVATE DEHYDROGENASE COMPLEX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43178. PANTHER protein class: transferase, acetyltransferase, metabolite interconversion enzyme. Members are annotated with the molecular function fatty acid binding, acyltransferase activity, transferring groups other than amino-acyl groups, acyltransferase activity. and localise to cytoplasm.
