identifier: PANTHER:PTHR35346
label: "BEN DOMAIN-CONTAINING PROTEIN 6"
definition: >-
  The Notch signaling pathway regulates genes involved in cell fate decision throughout development. Its activity relies notably on the CSL transcription factors. BEND6 is a BEN-solo (bears a single BEN domain) factor that binds CSL via its BEN domain and acts as a CSL co-repressor. BEND6 associates with and represses Notch target genes, antagonizing Notch signaling in neural stem cells, thereby opposing their self-renewal and promoting neurogenesis. This entry also includes BEN-solo factors from Drosophila, namely protein insensitive, Elba 1 and Elba2, which share functional attributes with BEND6. They recognise CCAATTGG palindromes to mediate transcriptional repression.
definition_source: "InterPro:IPR037496 abstract (PANTHER PTHR35346 is a member signature)"
