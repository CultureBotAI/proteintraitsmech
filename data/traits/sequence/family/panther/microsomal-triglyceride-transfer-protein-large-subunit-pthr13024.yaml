identifier: PANTHER:PTHR13024
label: "MICROSOMAL TRIGLYCERIDE TRANSFER PROTEIN, LARGE SUBUNIT"
definition: >-
  Microsomal triglyceride transfer protein large subunit (MTTP) catalyses the transport of triglyceride, cholesteryl ester, and phospholipid between phospholipid surfaces, and is required for the secretion of plasma lipoproteins that contain apolipoprotein B. It is a heterodimer consisting of a large MTP alpha-subunit and a protein disulfide isomerase (PDI) beta-subunit. Mutations in microsomal triglyceride transfer protein (MTP) cause abetalipoproteinemia.
