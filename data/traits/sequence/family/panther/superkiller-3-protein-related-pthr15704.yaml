identifier: PANTHER:PTHR15704
label: "SUPERKILLER 3 PROTEIN-RELATED"
definition: >-
  This entry includes superkiller protein 3 (Ski3) from yeasts and plants and tetratricopeptide repeat protein 37 (TTC37/SKI3) from animals. They are a component of the Ski complex required for exosome-mediated RNA surveillance. In budding yeasts, the SKI complex (Ski2-Ski3-Ski8) is a helicase complex functioning with the RNA-degrading exosome to mediate the 3'-5' messenger RNA (mRNA) decay in turnover and quality-control pathways. Ski3 has also been shown to repress dsRNA virus propagation by specifically blocking translation of viral mRNAs.
definition_source: "InterPro:IPR039226 abstract (PANTHER PTHR15704 is a member signature)"
