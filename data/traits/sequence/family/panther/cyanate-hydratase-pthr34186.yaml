identifier: PANTHER:PTHR34186
label: "CYANATE HYDRATASE"
definition: >-
  Cyanate hydratase or cyanase lyase catalyses the reaction of cyanate with bicarbonate to produce ammonia and carbon dioxide, allowing the host organisms to overcome the toxicity of environmental cyanate. The enzyme is also known as cyanate lyase and cyanate hydrolase. The cyanate lyase monomer is composed of two domains: an N-terminal domain that shows structural similarity to the DNA-binding α-helix bundle motif, and a C-terminal domain that has an 'open fold' that shows no structural similarity to other proteins. The enzyme is active as a homodecamer of 17kDa subunits, and displays half-site binding of substrates or substrate analogues. The dimer structure reveals the C-terminal domains to be intertwined; the decamer is formed from a pentamer of these dimers. The active site of the enzyme is located between dimers and comprises residues from four adjacent subunits of the homodecamer.
definition_source: "InterPro:IPR008076 abstract (PANTHER PTHR34186 is a member signature)"
