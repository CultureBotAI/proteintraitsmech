identifier: PANTHER:PTHR33836
label: "LOW-TEMPERATURE-INDUCED 65 KDA PROTEIN-RELATED"
definition: >-
  This family of plant low-temperature-induced (LTI) proteins is involved in responses to abiotic stresses. The homologous genes RD29A (LTI78) and RD29B (LTI65) from Arabidopsis are induced by cold, drought, and salt, and by abscisic acid (ABA). Subsequent dehydration stresses change the rate of transcription of RD29B, but not RD29A, indicative of a form of transcriptional memory for RD29B.
