    text: >-
      This family of proteins includes cofactors of the cytoplasmic exosome, linking it to the SKI complex. Members of this family are involved in post-transcriptional gene silencing suppression, particularly by inhibiting the production of small interfering RNAs from specific loci related to cuticle membrane and wax production, as well as typhine and sporopollenin biosynthesis in pollen.
