identifier: PANTHER:PTHR12871
label: "BETA-1,2-N-ACETYLGLUCOSAMINYLTRANSFERASE II"
definition: >-
  N-acetylglucosaminyltransferase II (EC:2.4.1.143) is a Golgi resident enzyme that catalyzes an essential step in the biosynthetic pathway leading from high mannose to complex N-linked oligosaccharides. Mutations in the MGAT2 gene lead to a congenital disorder of glycosylation (CDG IIa). CDG IIa patients have an increased bleeding tendency, unrelated to coagulation factors.
definition_source: "InterPro:IPR007754 abstract (PANTHER PTHR12871 is a member signature)"
