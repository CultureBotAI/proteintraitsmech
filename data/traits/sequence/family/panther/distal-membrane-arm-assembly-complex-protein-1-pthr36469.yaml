identifier: PANTHER:PTHR36469
label: "DISTAL MEMBRANE-ARM ASSEMBLY COMPLEX PROTEIN 1"
definition: >-
  This family of proteins is involved in the mitochondrial respiratory chain, specifically in the assembly of complex I, also known as NADH:ubiquinone oxidoreductase. Members of this family play a crucial role in the formation of the distal membrane arm of complex I, which is essential for the proper function and structure of the enzyme. The activity of complex I is pivotal for the process of oxidative phosphorylation, where it initiates the electron transport chain by transferring electrons from NADH to ubiquinone. The assembly of complex I is a highly regulated process, and these proteins are key to ensuring its correct assembly and maintenance.
