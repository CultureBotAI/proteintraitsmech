identifier: PANTHER:PTHR12663
label: "ANDROGEN INDUCED INHIBITOR OF PROLIFERATION  AS3  / PDS5-RELATED"
definition: >-
  This entry includes sister chromatid cohesion protein Pds5 and its homologues. In budding yeasts, Pds5 is required for both sister chromatid cohesion and condensation. It forms the Pds5-Wapl complex that unloads cohesin from chromosomes.
