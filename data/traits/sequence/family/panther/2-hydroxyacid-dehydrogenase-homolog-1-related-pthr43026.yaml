identifier: PANTHER:PTHR43026
label: "2-HYDROXYACID DEHYDROGENASE HOMOLOG 1-RELATED"
definition: >-
  This protein family includes D-lactate dehydrogenase from Escherichia coli (D-LDH), D-specific alpha-keto acid dehydrogenase from Enterococcus faecium (VanH), Aromatic 2-oxoacid reductase from Clostridium sporogenes (FldH) and similar sequences from all cellular organisms. D-LDH is a fermentative lactate dehydrogenase. VanH catalyses the reduction of 2-keto acids to 2-D-hydroxy acids, exhibiting highest catalytic efficiency with pyruvate and 2-oxobutanoate/alpha-ketobutyrate as substrates, producing D-lactate and (2R)-hydroxybutanoate, respectively. It is required for high-level resistance to glycopeptide antibiotics such as vancomycin. FldH catalyses the conversion of phenylpyruvic acid to phenyllactic acid, 4-hydroxy-phenylpyruvic acid to 4-hydroxy-phenyllactic acid, and indolepyruvic acid to indolelactic acid.
definition_source: "InterPro:IPR058205 abstract (PANTHER PTHR43026 is a member signature)"
