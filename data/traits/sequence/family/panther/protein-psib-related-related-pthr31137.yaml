  - kind: GENERAL
    text: >-
      The prespore-cell-inducing factor family comprises proteins that play a role in the development and differentiation of the social amoeba Dictyostelium discoideum. Members of the family are involved in quorum sensing and the regulation of gene expression in response to cell density. Specifically, they can induce the expression of discoidin genes as cells reach high density, which is crucial for the transition from unicellular to multicellular development when food becomes scarce. Certain family members act as growth factors, triggering the differentiation of isolated amoebae into prespore cells, thus participating in the organism's developmental cycle and adaptation to environmental changes.
    source: "InterPro:IPR051154 abstract (LLM-generated, not curator-reviewed)"
