  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the hydrolysis of glutamine to glutamic acid, a reaction that is central to nitrogen metabolism. Members of this family are capable of processing both L-glutamine and D-glutamine. The enzymatic activity of these proteins is crucial for the production of glutamic acid, which is a key amino acid in various metabolic pathways. The activity of these enzymes can be modulated by environmental factors, as exemplified by the inhibition of activity in high-salinity conditions such as the presence of sodium chloride.
