identifier: PANTHER:PTHR12865
label: "PHOSPHATIDYLINOSITOL 4-KINASE TYPE-II"
definition: >-
  This entry represents a group of type II phosphatidylinositol 4-kinases, including Lsb6 from yeasts and PI4K2alpha/beta from animals. PI4K2alpha catalyzes the phosphorylation of phosphatidylinositol (PI) to phosphatidylinositol 4-phosphate (PI4P), a lipid that plays important roles in endocytosis, Golgi function, protein sorting and membrane trafficking and is required for prolonged survival of neurons. The structure of PI4K2alpha has been revealed.
