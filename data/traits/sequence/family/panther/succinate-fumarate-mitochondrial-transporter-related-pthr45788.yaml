identifier: PANTHER:PTHR45788
label: "SUCCINATE/FUMARATE MITOCHONDRIAL TRANSPORTER-RELATED"
definition: >-
  This family includes tricarboxylate transport proteins (TXTPs), which belong to the Solute carrier family 25 (SLC25), transport proteins at the inner mitochondrial membrane and functions as carriers for metabolites. Included in this entry is the human TXTP (SLC25A1) and its homologues; it is an electroneutral antiporter that exports citrate from the mitochondria into the cytosol in exchange for malate. It is also able to mediate the exchange of citrate for isocitrate, phosphoenolpyruvate, cis-aconitate and to a lesser extend cis-aconitate, maleate and succinate. This entry also includes dicarboxylate transport proteins from plants and fungi, such as Succinate/fumarate mitochondrial transporter SFC1, which transports citrate, isocitrate and aconitate, succinate and fumarate. It catalyses a fast counter-exchange transport as well as a low uniport of substrates, having a higher transport affinity for tricarboxylates than dicarboxylates.
definition_source: "InterPro:IPR049563 abstract (PANTHER PTHR45788 is a member signature)"
