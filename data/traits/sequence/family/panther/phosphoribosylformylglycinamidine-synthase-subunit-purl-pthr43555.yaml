identifier: PANTHER:PTHR43555
label: "PHOSPHORIBOSYLFORMYLGLYCINAMIDINE SYNTHASE SUBUNIT PURL"
definition: >-
  This entry represents the small PurL, also known as phosphoribosylformylglycinamidine synthase II, or FGAM synthase II. Formylglycinamide ribonucleotide amidotransferase (FGAR-AT), also known as phosphoribosylformylglycinamidine synthase, PurL and formylglycinamidine ribonucleotide (FGAM) synthase, catalyzes the ATP-dependent conversion of formylglycinamide ribonucleotide (FGAR) and glutamine to formylglycinamidine ribonucleotide (FGAM), ADP, Pi, and glutamate in the fourth step of the purine biosynthetic pathway. Two types of phosphoribosylformylglycinamidine synthases (PurLs) have been detected. The first consists of a single polypeptide chain of about 1300 amino acids and is found in eukaryotes and Gram-negative bacteria. This type is designated large PurL. The second type consists of about 800 amino acids and is found in Gram-positive bacteria and archaebacteria. This type is designated small PurL. In this case PurL is part of the the FGAM synthase complex that is composed of three subunits and requires two additional proteins, PurQ, a glutaminase, and PurS, of unknown function.
