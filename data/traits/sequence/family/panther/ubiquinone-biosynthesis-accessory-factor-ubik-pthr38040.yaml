identifier: PANTHER:PTHR38040
label: "UBIQUINONE BIOSYNTHESIS ACCESSORY FACTOR UBIK"
definition: >-
  UbiK is an accessory factor required for efficient ubiquinone (coenzyme Q) biosynthesis under aerobic conditions. It forms a complex with the UQ biogenesis factor UbiJ.
