  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the acetylation of alcohols using acetyl-CoA, producing various acetate esters. These esters can have roles in detoxification processes, interaction with insect vectors for dispersal, and resistance to inhibitors of sphingolipid biosynthesis. Some members are also capable of thioesterase activity with specificity towards medium-chain-length acyl-CoAs. The family appears to be functionally diverse, with some members implicated in the biosynthesis of cytokinins and other growth-promoting metabolites in plants. The proteins are characterized by the presence of amphipathic helices essential for membrane association and share sequence similarity indicative of a common evolutionary origin.
    source: "InterPro:IPR052058 abstract (LLM-generated, not curator-reviewed)"
