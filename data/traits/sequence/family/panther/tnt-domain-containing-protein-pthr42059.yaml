  - kind: GENERAL
    text: >-
      The fungal surface NADase family comprises enzymes that are localized on the conidial surface and are involved in the hydrolysis of nicotinamide adenine dinucleotides. Members of the family cleave NAD(+) and NADP(+) but do not affect their reduced forms, NADH and NADPH. These glycohydrolases lack ADP-ribosyl cyclase and base exchange activities, and thus do not participate in the synthesis of calcium messengers such as cADPR or NAADP. The family plays a role in fungal pathogenicity by depleting the host's NAD(+) pool. Additionally, these enzymes are implicated in the development of aerial hyphae and conidiogenesis in fungi. Regulatory mechanisms include calcium binding in some members, non-competitive inhibition by aliphatic amines, carboxylic acids, and dioxane, as well as auto-ADP-ribosylation leading to self-inactivation.
    source: "InterPro:IPR053024 abstract (LLM-generated, not curator-reviewed)"
