definitions:
  - kind: GENERAL
    text: >-
      GLYCOGEN SYNTHASE KINASE-3 ALPHA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24057. PANTHER protein class: non-receptor serine/threonine protein kinase. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein. and participate in cell differentiation, cellular developmental process, signal transduction. and localise to cytoplasm, membrane-bounded organelle, organelle.
