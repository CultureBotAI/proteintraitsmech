identifier: PANTHER:PTHR12311
label: "ACTIVATOR OF BASAL TRANSCRIPTION 1"
definition: >-
  This entry represents the nuclear protein ABT1 and its homologous counterpart, pre-rRNA-processing protein Esf2 (eighteen S factor 2), from yeast. ABT1 associates with the TATA-binding protein (TBP) and enhances basal transcription activity of class II promoters. Meanwhile, ABT1 could be a transcription cofactor that can bind to DNA in a sequence-independent manner.
