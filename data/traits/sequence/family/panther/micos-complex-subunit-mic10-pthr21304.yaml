identifier: PANTHER:PTHR21304
label: "MICOS COMPLEX SUBUNIT MIC10"
definition: >-
  Mic10 (also known as MINOS1) is a component of the MICOS complex, a large protein complex of the mitochondrial inner membrane that plays crucial roles in the maintenance of crista junctions, inner membrane architecture, and formation of contact sites to the outer membrane.
