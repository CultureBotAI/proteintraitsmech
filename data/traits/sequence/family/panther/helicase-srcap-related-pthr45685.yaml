identifier: PANTHER:PTHR45685
label: "HELICASE SRCAP-RELATED"
definition: >-
  The INO80/SWR1 helicase family is involved in chromatin remodeling and DNA repair. Members of this family function as ATPase components of various complexes, such as the INO80 and SWR1 complexes, which are responsible for shifting nucleosomes and exchanging histone variants. These activities lead to transcriptional regulation of selected genes and are essential for processes including DNA replication, DNA damage response, and mitotic chromosome segregation. Some family members are also implicated in developmental processes and the regulation of gene expression through histone modification exchange, contributing to cellular differentiation and response to environmental signals.
