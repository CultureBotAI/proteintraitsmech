  - kind: GENERAL
    text: >-
      This family of proteins functions as substrate-recognition components of a Cul2-RING E3 ubiquitin-protein ligase complex, which is involved in the DesCEND pathway. They recognize specific C-terminal degrons in target proteins, leading to ubiquitination and subsequent degradation. These proteins are known to specifically bind to C-terminal proline-glycine or alanine motifs. They play a role in the ribosome-associated quality control pathway by mediating the extraction of nascent chains from stalled ribosomes and targeting them for degradation. Additionally, they are implicated in oxidative stress-induced cell death by activating specific kinases and inhibiting phosphatase activity on these kinases. They also regulate necroptosis, a form of programmed cell death.
    source: "InterPro:IPR052125 abstract (LLM-generated, not curator-reviewed)"
