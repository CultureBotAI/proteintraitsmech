identifier: PANTHER:PTHR44163
label: "U3 SMALL NUCLEOLAR RNA-ASSOCIATED PROTEIN 4 HOMOLOG"
definition: >-
  This family includes U3 small nucleolar RNA-associated protein 4 (UTP4), a ribosome biogenesis factor that is involved in nucleolar processing of pre-18S ribosomal RNA. In yeast, it is required for optimal pre-ribosomal RNA transcription by RNA polymerase I, while in human is required for pre-rRNA processing.
