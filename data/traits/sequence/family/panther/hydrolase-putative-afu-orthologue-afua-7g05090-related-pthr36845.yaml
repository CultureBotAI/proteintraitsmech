  - kind: GENERAL
    text: >-
      HYDROLASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_7G05090)-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36845. PANTHER protein class: metabolite interconversion enzyme, hydrolase. Members are annotated with the molecular function hydrolase activity, hydrolyzing O-glycosyl compounds. and participate in carbohydrate catabolic process, polysaccharide metabolic process, macromolecule catabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the hydrolysis of unsaturated glycosaminoglycans, such as hyaluronate, chondroitin, and heparin disaccharides. They are involved in the degradation of extracellular matrix components, which is a crucial process in various biological contexts, including cell invasion and tissue remodeling. Members of this family preferentially act on sulfated glycosaminoglycans and release specific unsaturated monosaccharides as products. Some family members are also involved in the degradation of ulvan, a major polysaccharide in green seaweed, by cleaving specific unsaturated sugar residues. The activity of these enzymes is known to be partially inhibited by divalent metal ions.
    source: "InterPro:IPR052369 abstract (LLM-generated, not curator-reviewed)"
