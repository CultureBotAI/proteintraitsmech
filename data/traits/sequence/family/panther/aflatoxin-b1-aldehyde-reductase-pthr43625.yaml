  - kind: GENERAL
    text: >-
      The Aldo/Keto Reductase family encompasses enzymes with oxidoreductase activity, catalyzing the reduction and oxidation of various aldehydes and ketones. Members of this family are involved in diverse biological processes, including the salvage pathway of pyridoxal phosphate, the biosynthesis of monoterpenoid indole alkaloids, and the degradation of plant-produced benzoxazolinones. They exhibit broad substrate specificity, with some acting on pyridoxal, alkaloids, and benzoxazolinones. These enzymes typically utilize NADPH or NADP(+) as cofactors. Their functions are crucial for maintaining cellular homeostasis of key metabolites and for plant-microbe interactions, such as nodulation inhibition and detoxification of phytoanticipins.
    source: "InterPro:IPR050791 abstract (LLM-generated, not curator-reviewed)"
