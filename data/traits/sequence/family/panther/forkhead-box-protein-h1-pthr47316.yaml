    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins functions as transcriptional activators, primarily involved in early developmental processes such as gastrulation and mesoderm specification. They recognize and bind to specific DNA sequences, facilitating the transcription of genes responsive to TGF-beta or activin signaling pathways. Members of this family form transcriptionally active complexes with SMAD2 and SMAD4, which are essential for the regulation of target genes during embryonic development. These proteins play a crucial role in the nodal signaling pathway, contributing to the formation of dorsal axial structures and establishing left-right symmetry in developing embryos. They exhibit a preference for binding to phosphorylated SMAD2 within activated SMAD complexes, mediated by a specialized domain known as the FM region.
    source: "InterPro:IPR052327 abstract (LLM-generated, not curator-reviewed)"
