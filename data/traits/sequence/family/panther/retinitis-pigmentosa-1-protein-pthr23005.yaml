identifier: PANTHER:PTHR23005
label: "RETINITIS PIGMENTOSA 1 PROTEIN"
definition: >-
  RETINITIS PIGMENTOSA 1 PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23005. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies participate in cilium assembly, axoneme assembly, camera-type eye development. Subfamilies localise to cytoskeleton, cilium, plasma membrane bounded cell projection cytoplasm.
