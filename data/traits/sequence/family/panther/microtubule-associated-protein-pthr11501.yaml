identifier: PANTHER:PTHR11501
label: "MICROTUBULE-ASSOCIATED PROTEIN"
definition: >-
  Proteins in this family contains a microtubule binding domain that is found in MAP2, MAP4, Tau, and their homologues. All isoforms contain a conserved C-terminal domain containing tubulin-binding repeats (InterPro:IPR001084), and a N-terminal projection domain of varying size. This domain has a net negative charge and exerts a long-range repulsive force. This provides a mechanism that can regulate microtubule spacing which might facilitate efficient organelle transport. MAP2 may stabilise the microtubules against depolymerisation. MAP4 is a non-neuronal microtubule-associated protein that promotes microtubule assembly.
definition_source: "InterPro:IPR027324 abstract (PANTHER PTHR11501 is a member signature)"
