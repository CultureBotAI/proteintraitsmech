identifier: PANTHER:PTHR33137
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 15A-RELATED"
definition: >-
  MED15 is a component of the Mediator complex, a coactivator involved in transcriptional activation. MED15 is part of the tail module of this complex and is involved in diverse metabolism and developmental pathways. In Arabidopsis although five paralogs have been reported, only three of them (AtMed15a, b and c) have expression data. AtMed15a (At1g15780) is expressed in several tissues including root, leaf, flower and seeds. AtMed15a has a KIX domain at its N terminus, which interacts with different proteins such as transcription factors, single strand nucleic acid-binding proteins and splicing factors to mediate their transcriptional responses.
