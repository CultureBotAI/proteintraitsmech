identifier: PANTHER:PTHR31253
label: "BRI3-BINDING PROTEIN"
definition: >-
  BRI3-binding protein (BRI3BP) is a mitochondria protein and a binding partner for HCCR-1, which is overexpressed in various human tumours and appears to serve as a negative regulator of the p53 gene. BRI3BP may also be involved in the structural dynamics of the ER and affects mitochondrial viability. It possesses a pro-apoptotic property and can potentiate drug-induced apoptosis.
