identifier: PANTHER:PTHR17583
label: "PHOSPHOINOSITIDE 3-KINASE REGULATORY SUBUNIT 4"
definition: >-
  This entry represents the Vps15 family of proteins. In animals, proteins part of this family are known as Phosphoinositide 3-kinase regulatory subunit 4 (Pik3r4). Vps15 associates and regulates Vps34, also called Class III phosphoinositide 3-kinase (PI3K), which catalyses the phosphorylation of D-myo-phosphatidylinositol (PtdIns). Vps34 is the only PI3K present in yeast. It plays an important role in the regulation of protein and vesicular trafficking and sorting, autophagy, trimeric G-protein signalling, and phagocytosis.
