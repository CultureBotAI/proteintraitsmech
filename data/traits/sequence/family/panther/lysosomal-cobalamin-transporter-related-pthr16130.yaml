definitions:
  - kind: GENERAL
    text: >-
      LYSOSOMAL COBALAMIN TRANSPORTER-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16130. PANTHER protein class: transporter. and participate in cellular localization, protein localization to vacuole. and localise to vacuolar membrane, cytoplasm, bounding membrane of organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The LMBRD1 subfamily of the LIMR family is characterized by proteins that function as lysosomal cobalamin transporters. These proteins are essential for the export of cobalamin, also known as vitamin B12, from lysosomes to the cytosol. This export is a critical step in allowing the conversion of cobalamin into its active cofactor forms. Members of the LMBRD1 subfamily are also involved in targeting the ABCD4 transporter to the lysosome and forming a complex with ABCD4 and MMACHC to facilitate cobalamin transport across the lysosomal membrane. Additionally, some family members act as adapter proteins that mediate and regulate the internalization of the insulin receptor, and are involved in clathrin-mediated endocytosis. They play a role in early embryogenesis, particularly in the initiation of gastrulation and formation of mesoderm structures.
    source: "InterPro:IPR050854 abstract (LLM-generated, not curator-reviewed)"
