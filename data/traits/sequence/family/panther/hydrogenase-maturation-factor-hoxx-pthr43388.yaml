identifier: PANTHER:PTHR43388
label: "HYDROGENASE MATURATION FACTOR HOXX"
definition: >-
  This entry represents Hydrogenase maturation factor HoxX from Bradyrhizobium diazoefficiens and similar proteins predominantly found in bacteria and fungi. HoxX is involved in the post-translational processing of the hydrogenase large subunit.
