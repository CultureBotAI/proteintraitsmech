identifier: PANTHER:PTHR21677
label: "CRAMPED PROTEIN"
definition: >-
  This family of proteins includes cramped protein from Drosophila melanogaster and its orthologues from animals, cramped-like proteins. Cramped is involved in the regulation of gene expression patterns, particularly those governing developmental processes and segmental determination. They are associated with the Polycomb group (Pc-G) genes, which play a crucial role in maintaining the expression of homeotic selector genes. These genes are essential for proper segmental identity during development. Additionally, proteins in this family can influence chromatin structure, as they have been implicated in modifying position effect variegation (PEV), a phenomenon that affects gene silencing in certain genomic contexts. This entry also includes TSL-kinase interacting protein 1 from Arabidopsis, whose function is not yet clear.
definition_source: "InterPro:IPR055315 abstract (PANTHER PTHR21677 is a member signature)"
