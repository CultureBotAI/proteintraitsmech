identifier: PANTHER:PTHR16024
label: "XK-RELATED PROTEIN"
definition: >-
  This family of proteins is involved in the externalization of phosphatidylserine on the surface of apoptotic cells, which is a key signal for their recognition and engulfment by phagocytes. Members of this family are phospholipid scramblases, a type of protein that facilitates the bidirectional movement of phospholipids across the lipid bilayer. The exposure of phosphatidylserine on the cell surface is a hallmark of apoptosis, and these proteins are essential for the clearance of dying cells by the immune system. Some members are known to be activated by caspase cleavage during apoptosis, and they may also play roles in cell differentiation and survival. Additionally, certain members are implicated in microbial infections, where they are hijacked to promote viral particle uptake by host cells.
