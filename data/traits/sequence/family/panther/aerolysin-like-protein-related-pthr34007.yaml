  - kind: GENERAL
    text: >-
      This family of proteins includes pore-forming proteins that may have a role in host defense mechanisms. They are capable of forming dimers and can also oligomerize into octameric structures that span the cell membrane. The oligomerization process is likely initiated by the binding of a jacalin-type lectin domain to specific high-mannose proteoglycans on the cell surface and is facilitated by an acidic pH. These proteins have been observed to bind to yeast mannan and the HIV virus glycoprotein gp120 with high affinity, suggesting a potential role in immune response and pathogen recognition.
    source: "InterPro:IPR053280 abstract (LLM-generated, not curator-reviewed)"
