identifier: PANTHER:PTHR21690
label: "CUB DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  This entry represents a group of secreted proteins from nematodes. Members are glycosylated and secreted to the extracellular region and are expressed in embryos and other tissues. The specific function of this family remains to be determined.
