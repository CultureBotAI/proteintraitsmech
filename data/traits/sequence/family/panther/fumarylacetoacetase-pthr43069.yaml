identifier: PANTHER:PTHR43069
label: FUMARYLACETOACETASE
definition: >-
  Fumarylacetoacetase (EC:3.7.1.2; also known as fumarylacetoacetate hydrolase or FAH) catalyses the hydrolytic cleavage of a carbon-carbon bond in fumarylacetoacetate to yield fumarate and acetoacetate as the final step in phenylalanine and tyrosine degradation. This is an essential metabolic function in humans, the lack of FAH causing type I tyrosinemia, which is associated with liver and kidney abnormalities and neurological disorders. The enzyme mechanism involves a catalytic metal ion, a Glu/His catalytic dyad, and a charged oxyanion hole. FAH folds into two domains: an N-terminal domain SH3-like β-barrel, and a C-terminal with an unusual fold consisting of three layers of β-sheet structures. In Aspergillus fumigatus, this enzyme is part of the L-tyrosine degradation gene cluster that mediates the biosynthesis of the brownish pigment pyomelanin as an alternative melanin.
definition_source: "InterPro:IPR005959 abstract (PANTHER PTHR43069 is a member signature)"
