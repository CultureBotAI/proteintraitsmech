identifier: PANTHER:PTHR13455
label: "TRANSCRIPTIONAL REPRESSOR P66-RELATED"
definition: >-
  P66alpha and P66beta interact with MBDs (methyl-binding domain-containing proteins) via a coiled-coil region on each. P66 and MBD2 form a complex with the nucleosome remodeling and deacetylation (NuRD) complex. This MBD2-NuRD complex recognizes methylated DNA and silences expression of associated genes through histone deacetylase and nucleosome remodeling functions.
