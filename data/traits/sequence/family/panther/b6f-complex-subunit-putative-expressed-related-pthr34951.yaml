    text: >-
      The PetM family comprises proteins that are components of the cytochrome b6-f complex, which is crucial for photosynthesis in plants and cyanobacteria. Members of the PetM family play a role in mediating electron transfer between photosystem II and photosystem I, facilitating cyclic electron flow around photosystem I, and contributing to state transitions. These processes are essential for the establishment of the proton gradient across the thylakoid membrane, which drives ATP synthesis during photosynthesis.
