identifier: PANTHER:PTHR31563
label: "ION CHANNEL POLLUX-RELATED"
definition: >-
  This entry includes proteins that belong to the CASTOR/POLLUX/SYM8 family of ion channels, which are found in plants. They have been implicated in modulating the nuclear membrane envelope potential. It has been shown that Os-CASTOR and Os-POLLUX are indispensable for mycorrhizal symbiosis in rice. This entry also includes uncharacterised bacterial proteins.
