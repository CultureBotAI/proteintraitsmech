  - kind: GENERAL
    text: >-
      This family of proteins is involved in various biological processes including the response to environmental oxygen levels, lipid and xenobiotic compound transport, and embryonic development. Members of this family may inhibit gene transcription related to hypoxia-inducible factors and are implicated in processes such as locomotion, egg-laying, and body morphogenesis. They also play a role in the transport of lipids from the intestine to other tissues, which is crucial for yolk transport into oocytes and embryonic development.
