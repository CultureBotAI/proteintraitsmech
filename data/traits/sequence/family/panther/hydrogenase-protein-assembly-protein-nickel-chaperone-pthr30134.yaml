identifier: PANTHER:PTHR30134
label: "HYDROGENASE PROTEIN ASSEMBLY PROTEIN, NICKEL CHAPERONE"
definition: >-
  The hydrogenase accessory protein HypB is a GTP hydrolase required for assembly of the nickel metallocentre of hydrogenase. In Helicobacter pylori, HypB is also required for maturation of urease. The homologue guanidine hydrolase-activating protein B (GhaB) is involved in the maturation of the nickel-dependent guanidine hydrolase GdmH; it is required for nickel insertion into the metal centre of GdmH.
