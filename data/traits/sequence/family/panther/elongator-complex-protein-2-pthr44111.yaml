identifier: PANTHER:PTHR44111
label: "ELONGATOR COMPLEX PROTEIN 2"
definition: >-
  Elongator complex protein 2 (Elp2) is a component of the RNA polymerase II elongator complex, which is a major histone acetyltransferase component of the RNA polymerase II (RNAPII) holoenzyme. The eukaryotic elongator complex has been associated with many cellular activities, including transcriptional elongation, but its main function is tRNA modification. It is required for the formation of 5-methoxy-carbonylmethyl (mcm5) and 5-carbamoylmethyl (ncm5) groups on uridine nucleosides present at the wobble position of many tRNAs.
definition_source: "InterPro:IPR037289 abstract (PANTHER PTHR44111 is a member signature)"
