identifier: PANTHER:PTHR46493
label: "PEPTIDYL-PROLYL CIS-TRANS ISOMERASE FKBP3"
definition: >-
  FKBP3, also known as FKBP25, contains the N-terminal basic tilted helix bundle (BTHB) domain and the C-terminal PPIase domain. It is a nuclear prolyl isomerase that interacts directly with nucleic acids. It interacts with the histone deacetylases HDAC1 and HDAC2 as well as with their transcriptional regulator Yin Yang 1 (YY1). It is also a microtubule-associated protein that shuttles between nucleus and cytoplasm and stabilizes the microtubule network by direct binding of the C-terminal PPIase domain. It plays a role in the proliferation of non-small cell type lung cancer cells (NSCLC) by modulating Sp1/HDAC2/p27.
definition_source: "InterPro:IPR043368 abstract (PANTHER PTHR46493 is a member signature)"
