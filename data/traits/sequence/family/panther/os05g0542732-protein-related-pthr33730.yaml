identifier: PANTHER:PTHR33730
label: "OS05G0542732 PROTEIN-RELATED"
definition: >-
  This family of proteins is found in plants. Proteins in this family are typically between 103 and 140 amino acids in length. There are two conserved sequence motifs: LQRS and FRR. Proteins containing this domain includes Arabidopsis At1g15400 and At1g80180. At1g80180 is a MAPK kinase substrate that may play a role in the regulation of stomata patterning.
