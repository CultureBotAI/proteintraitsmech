identifier: PANTHER:PTHR34590
label: "OS03G0124300 PROTEIN-RELATED"
definition: >-
  This entry represents a group of receptor-like protein kinase mostly from plants, including ANXUR1/2 (ANX1/2), FERONIA (FERON), HERCULES1(HERK1) and THESEUS 1 (THE1) from Arabidopsis. ANX1 and ANX2 are male factors that control pollen tube behaviour by directing rupture at proper timing. FERONIA/SIRENE mediates the female control of male gamete delivery during fertilisation, FERON is a positive regulator of auxin-promoted growth that represses the abscisic acid (ABA) signalling via the activation of ABI2 phosphatase. It is required for RALF1-mediated extracellular alkalinisation in a signalling pathway preventing cell expansion. FERON, HERK1 and THE1 are required for cell elongation during vegetative growth, mostly in a brassinosteroid-(BR-) independent manner.
definition_source: "InterPro:IPR045272 abstract (PANTHER PTHR34590 is a member signature)"
