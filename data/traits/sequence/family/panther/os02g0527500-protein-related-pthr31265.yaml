    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the modulation of cell wall physiology, particularly through the regulation of pectin methylation status. Members of this family are implicated in various developmental processes, including seed germination, hypocotyl elongation, reproductive organ development, and embryo development. They act as regulators of pectin methylesterification, affecting cell separation and elongation. Some members are also involved in the plant's response to root-knot nematode infection and play a role in gravitropic responses by influencing auxin efflux. The family includes proteins that are essential for the proper development of roots, rosettes, and embryos, particularly in the context of cell wall modification and testa rupture during seed germination.
    source: "InterPro:IPR052437 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
