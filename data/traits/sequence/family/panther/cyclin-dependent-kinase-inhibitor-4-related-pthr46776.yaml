identifier: PANTHER:PTHR46776
label: "CYCLIN-DEPENDENT KINASE INHIBITOR 4-RELATED"
definition: >-
  This entry represents a group of plant cyclin-dependent kinase inhibitors (CKIs), including KRP1-7 (Kip-related proteins 1-7) from Arabidopsis. Plant CKIs fall into 2 distinct families, KIP-RELATED PROTEINS (KRPs) and SIAMESE-RELATED proteins (SMRs). KRPs share very little sequence similarity with mammalian KIP proteins outside the C-terminal conserved region. Compare to mammalian CKIs, plant KRP1-KRP7 bind to active cyclin D2 (CYCD2)/CDKA and CYCD2/CDKB complexes to a similar extent, however, they inhibit kinase activity to a different extent. KRPs function as a dose-dependent cell cycle inhibitors and have an important function in cell proliferation as well as in cell cycle exit and in turning from a mitotic to an endoreplicating cell cycle mode.
definition_source: "InterPro:IPR044275 abstract (PANTHER PTHR46776 is a member signature)"
