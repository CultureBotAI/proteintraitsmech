identifier: PANTHER:PTHR11365
label: "5-OXOPROLINASE RELATED"
definition: >-
  Oxoprolinase family consists of oxoprolinase, hydantoinase A (HyuA) and hydantoinase B (HyuB). Hydantoinase A (HyuA) and oxoprolinase ( ) catalyse reactions involving the hydrolysis of 5-membered rings via hydrolysis of their internal imide bonds. This entry also includes (4-{4-[2-(gamma-L-glutamylamino)ethyl]phenoxymethyl}furan-2-yl)methanamine synthase from Methanocaldococcus jannaschii, which is involved in methanofuran biosynthesis, catalysing the condensation between 5-(aminomethyl)-3-furanmethanol diphosphate and gamma-glutamyltyramine to produce 4-[N-(gamma-L-glutamyl)-p-(beta-aminoethyl)phenoxymethyl]-(aminomethyl)furan (APMF-Glu). D-5-(2-methylthioethyl)hydantoin amidohydrolase (HyuA) from Pseudomonas is a component of the hydantoinase process, an enzymatic cascade converting D-5-(2-methylthioethyl)hydantoin to N-carbamoyl-D-methionine. This entry also includes ccetone carboxylase beta subunit and acetophenone carboxylase alpha/delta/gamma subunits. Caprolactamase subunits alpha and beta are also included in this entry, which are components of a caprolactamase involved in the degradation of caprolactam, an industrial compound mainly used in the production of Nylon 6. They catalyse the ATP-dependent hydrolysis of the caprolactam ring to form 6-aminocaproic acid (6-ACA). The alpha subunit is responsible for ATP-dependent substrate phosphorylation, while the beta subunit is responsible for hydrolytic lactam ring opening.
