identifier: PANTHER:PTHR13715
label: "RYANODINE RECEPTOR AND IP3 RECEPTOR"
definition: >-
  The ryanodine and inositol 1,4,5-triphosphate (IP3) receptors are intracellular Ca2+ release channels characterised by their large size and 4-fold symmetry. In excitation-contraction coupling of skeletal and heart muscle, the ryanodine receptor serves as a Ca2+ release channel of sarcoplasmic reticulum (SR) and is morphologically identical to the foot structure spanning the gap between terminal cisternae of SR and sarcolemma/transverse tubules. The IP3 receptor acts as a Ca2+ release channel of non-mitochondrial intracellular Ca2+ stores in smooth muscle and in non-muscle tissues. The so-called excitation-contraction coupling phenomenon in muscle cells takes place in a highly specialised junctional region that arise from close proximity between plasma membrane (PM) and SR. More precisely, transverse tubular invaginations of the PM touch the terminal cisternae of SR to form a unique anatomical structure known as the triad junction. In skeletal muscle, dihydropyridine receptors (DHPRs) located in the transverse tubule membrane function mainly as the voltage sensor which sends an orthograde signal to control opening of the ryanodine receptor/Ca2+ release channel. There appears to a physical interaction between DHPRs and ryanodine receptors in the triad junction without requiring the movement of extracellular Ca2+ through DHPRs in the PM. IP3 receptors are large (~1200kDa) tetrameric proteins, each subunit of which projects an amino-terminal domain into the cytoplasm, their membrane-spanning carboxy-terminal regions forming an integral Ca2+ channel. IP3 binding by the amino-terminal domains causes a conformational change that promotes channel opening. Between the IP3 binding site and the transmembrane regions is a large stretch of amino acids where a significant proportion
