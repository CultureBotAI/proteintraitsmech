identifier: PANTHER:PTHR21596
label: "RIBONUCLEASE P SUBUNIT P38"
definition: >-
  RNA-directed DNA methylation (RdDM) is a biological process in which non-coding RNA molecules direct the addition of DNA methylation to specific DNA sequences. This entry represents a sub-group of SGS3-LIKE plant proteins that are components of RNA-directed DNA methylation pathway (RdDM), including FDM1-5 and IDN2 from Arabidopsis. RdDM has been implicated in a number of regulatory processes in plants, such as maintaining transposable element silencing and genome stability, affecting gamete formation and seed viability and protecting the plant from other biotic stresses.
