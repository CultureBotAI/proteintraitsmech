definitions:
  - kind: GENERAL
    text: >-
      BASIC HELIX-LOOP-HELIX TRANSCRIPTION FACTOR, HES-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10985. PANTHER protein class: DNA-binding transcription factor, basic helix-loop-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, transcription regulator activity, DNA-binding transcription factor activity, RNA polymerase II-specific. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of DNA-templated transcription. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
