  - kind: GENERAL
    text: >-
      The Nectin family proteins are involved in modulating T-cell signaling and can act as either costimulators or coinhibitors of T-cell function, depending on their receptor interactions. They play a crucial role in immune response by stimulating T-cell proliferation and cytokine production when binding to CD226, or inhibiting T-cell proliferation upon interaction with PVRIG. These proteins are also implicated in cell adhesion, formation of immunological synapses, and activation of NK cell cytotoxicity. Additionally, they serve as receptors for various viruses, facilitating microbial infection and influencing viral transport and immune evasion mechanisms. The family members contain an ITIM motif in their cytoplasmic region, which can bind SH2-containing phosphatases when phosphorylated.
    source: "InterPro:IPR052659 abstract (LLM-generated, not curator-reviewed)"
