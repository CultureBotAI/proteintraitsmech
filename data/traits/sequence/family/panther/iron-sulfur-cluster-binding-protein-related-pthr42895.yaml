  - kind: GENERAL
    text: >-
      This family of proteins is involved in the metabolic process of quaternary amine degradation, specifically L-proline betaine and L-carnitine. They function as part of a corrinoid-dependent methyltransferase system, which facilitates the transfer of a methyl group from these amines to tetrahydrofolate, producing methyl-THF. This reaction is a crucial step in the Wood-Ljungdahl pathway of acetogenesis. Members of this family are not directly responsible for the methyl transfer but enhance the reduction of the associated methyltransferase component in its cobalt-containing active site, as well as the overall rate of THF methylation.
    source: "InterPro:IPR052911 abstract (LLM-generated, not curator-reviewed)"
