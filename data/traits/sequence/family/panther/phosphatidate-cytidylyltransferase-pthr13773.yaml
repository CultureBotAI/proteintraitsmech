identifier: PANTHER:PTHR13773
label: "PHOSPHATIDATE CYTIDYLYLTRANSFERASE"
definition: >-
  Cytidinediphosphate diacylglycerol synthase (CDS) is a membrane-bound enzyme that catalyzes the transfer of a cytidyl group from cytidine triphosphate (CTP) to phosphatidic acid (PA), producing cytidine diphosphate diacylglycerol (CDP-DAG), the important branch point intermediate in the glycerolipid biosynthesis of prokaryotic and eukaryotic organisms. In eukaryotes, CDS is found in the inner mitochondrial membrane and the endoplasmic reticulum, while plants possess CDS activity in the inner envelope membrane of plastids as well. This entry represents CDS from eukaryotes.
