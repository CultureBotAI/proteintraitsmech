identifier: PANTHER:PTHR10689
label: "MICROSOMAL GLUTATHIONE S-TRANSFERASE 1"
definition: >-
  Microsomal glutathione S-transferase 1 (MGST1) acts both as a glutathione transferase activity as well as in the reduction of various hydroperoxides, being important in the protection against oxidative stress. MGST1 is essential for embryonic development and hematopoiesis in vertebrates. Prostaglandin E synthase, also known as MGST1-like 1, catalyzes the oxidoreduction of prostaglandin endoperoxide H2 (PGH2) to prostaglandin E2 (PGE2). This entry also includes putative glutathione S-transferase-like proteins from bacteria.
