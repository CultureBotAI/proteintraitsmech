  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are part of the aldo/keto reductase superfamily. These enzymes are involved in the reduction of aldehydes and ketones into their corresponding alcohols. They play a role in various metabolic processes, including the detoxification of aldehydes and the metabolism of sugars, steroids, and other alcohols. Members of this family are characterized by their ability to utilize NADPH or NADH as a cofactor for the reduction reaction. The specific functions of these enzymes can vary widely among different organisms and tissues, reflecting the diverse substrates they can act upon.
