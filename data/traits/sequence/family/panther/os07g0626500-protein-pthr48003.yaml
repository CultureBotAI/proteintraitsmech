identifier: PANTHER:PTHR48003
label: "OS07G0626500 PROTEIN"
definition: >-
  The protein family includes receptor-like serine/threonine-protein kinases that are involved in abscisic acid (ABA) signaling, particularly in the regulation of stomatal movement in response to various environmental stimuli such as darkness, high CO2, and light stress. Despite the predicted catalytic inactivity of their kinase domains, members of the family function as scaffolding components or may act through phosphorylation of other proteins like the anion channel SLAC1, contributing to stomatal closure. The family is also implicated in local and systemic responses to light stress, and its activity is subject to negative regulation by ABI2.
