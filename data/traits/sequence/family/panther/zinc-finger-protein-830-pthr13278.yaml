identifier: PANTHER:PTHR13278
label: "ZINC FINGER PROTEIN 830"
definition: >-
  Zinc finger protein 830 (ZNF830; also known as coiled-coil domain-containing protein 16 or CCDC16) contains a C2H2-type zinc finger InterPro:IPR013087 and a coiled-coil region InterPro:IPR059039. It is a component of the XAB2 complex, which binds RNA, and a component of a pentameric intron-binding complex that is pre-assembled and then incorporated into the spliceosome. This entry also includes protein ABA AND ROS SENSITIVE 1 (ARS1) from Arabidopsis. It is essential for seed germination and ROS homeostasis in response to ABA and oxidative stress.
