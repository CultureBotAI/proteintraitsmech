  - kind: GENERAL
    text: >-
      The CPPED1 family is part of the metallophosphoesterase superfamily and includes serine/threonine-protein phosphatases. Members of the CPPED1 family are involved in the dephosphorylation of AKT kinase family members, particularly at 'Ser-473'. This regulatory activity is crucial for controlling cell cycle progression and can promote cell apoptosis. Additionally, the CPPED1 family may have an inhibitory role in glucose uptake by adipocytes, suggesting a broader regulatory function in cellular metabolism and signaling pathways.
