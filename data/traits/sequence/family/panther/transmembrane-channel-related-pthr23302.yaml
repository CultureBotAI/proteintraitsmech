identifier: PANTHER:PTHR23302
label: "TRANSMEMBRANE CHANNEL-RELATED"
definition: >-
  This entry represents the transmembrane channel-like (TMC) protein family. TMC proteins are thought to have important cellular roles, and may be modifiers of ion channels or transporters. Mutations in these genes are implicated in a number of human conditions, such as deafness and epidermodysplasia verruciformis. TMC4 is involved in a high-concentration salt taste sensation.
