identifier: PANTHER:PTHR11539
label: "VDJ RECOMBINATION ACTIVATING PROTEIN 1 RAG1"
definition: >-
  The development of B and T cells depends on the rearrangement of variable (V), diversity (D), and joining (J) gene segments to produce mature Ig and T cell receptor coding regions. This rearrangement process, known as V(D)J recombination is initiated by a complex consisting of multi-domain proteins RAG1 and RAG2. The RAG proteins catalyse DNA cleavage in the first phase of the reaction using a recombination signal sequence (RSS) that flanks V, D and J segments. Recombination activating protein 1 (RAG1) is the catalytic component of the RAG complex. RAG1 contains a RING finger domain that can act as a ubiquitin ligase (E3), and can promote its own ubiquitylation and targets both karyopherin alpha 1 (KPNA1) and histone 3 (H3). Many of the proteins recognised by this entry are fragments.
