identifier: PANTHER:PTHR13465
label: "UPF0183 PROTEIN"
definition: >-
  This entry includes protein broad-minded, which interacts with cell cycle-related kinase (CCRK) and together these proteins regulate ciliary membrane and axonemal growth; and phagosome assembly factor 1 (PHAF1) and its homologues. PHAF1 and BCAS3 form a complex that affects the recruitment of several core autophagy proteins to the phagophore assembly site.
