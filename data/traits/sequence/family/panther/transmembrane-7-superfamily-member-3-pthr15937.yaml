identifier: PANTHER:PTHR15937
label: "TRANSMEMBRANE 7 SUPERFAMILY MEMBER 3"
definition: >-
  TM7SF3 is a seven transmembrane orphan receptor which inhibits cytokine-induced death of pancreatic beta cells. It also maintains protein homeostasis and promotes cell survival through attenuation of ER stress. Interestingly, p53 promotes the expression of TM7SF3 that acts to restrict p53 activity.
