  - kind: GENERAL
    text: >-
      This family of proteins is involved in nucleic acid metabolism, with some members functioning as ATP-dependent DNA helicases that promote Holliday junction branch migration and DNA unwinding. These proteins are implicated in DNA repair processes, particularly at low temperatures, and coordinate with other enzymes to facilitate the resolution of replication forks. Other members of this family possess RNase activity, suggesting a role in RNA metabolism. The presence of PIN and TRAM domains indicates a shared structural framework that may underlie their biochemical functions. The PIN domain is often associated with nuclease activity, while the function of the TRAM domain is less clear but may be involved in RNA binding or processing.
    source: "InterPro:IPR052041 abstract (LLM-generated, not curator-reviewed)"
