label: "DOWN REGULATED IN RENAL CARCINOMA 1/TU3A"
definition: >-
  This entry includes FAM107A/B. FAM107A (also known as DRR1) is an actin-associated protein that plays important roles in tumor cell growth, neuron survival and spine formation. The function of FAM107B is not clear.
