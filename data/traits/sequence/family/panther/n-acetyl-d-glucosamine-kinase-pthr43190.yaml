identifier: PANTHER:PTHR43190
label: "N-ACETYL-D-GLUCOSAMINE KINASE"
definition: >-
  This family of proteins includes enzymes that phosphorylate various substrates, including amino sugars and sugar derivatives, using ATP. Members of this family are involved in metabolic pathways that process carbohydrates and are characterized by their kinase activity. They can phosphorylate N-acetylglucosamine (GlcNAc), glucosamine, N-acetylmuramic acid (MurNAc), and 2-keto-3-deoxygluconate (KDG), each at the 6-hydroxyl group. These phosphorylation reactions are crucial for the metabolism of complex carbohydrates and cell wall components in various organisms. The enzymes in this family show specificity for their respective substrates and are involved in different biological processes, such as cell wall turnover and carbohydrate utilization pathways.
