  - kind: GENERAL
    text: >-
      The SRCIN1 family is involved in the regulation of the actin cytoskeleton and cell signaling pathways. Members of the family act as negative regulators of SRC kinase, activating CSK which in turn inhibits SRC activity. This inhibition impacts cell spreading and migration. In the nervous system, the family plays a role in dendritic spine morphology, calcium-dependent exocytosis, and possibly in neurotransmitter release or synapse maintenance. Additionally, some members are required for the normal development of intervertebral disks. The family also includes proteins that are involved in morphogenesis and may share similarity with yeast BUD6 in their role in actin cytoskeleton organization.
