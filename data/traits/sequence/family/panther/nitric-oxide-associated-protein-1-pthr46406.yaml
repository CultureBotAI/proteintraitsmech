identifier: PANTHER:PTHR46406
label: "NITRIC OXIDE-ASSOCIATED PROTEIN 1"
definition: >-
  This family of proteins is involved in the regulation of mitochondrial protein translation and respiration. Members of this family play a role in mitochondria-mediated cell death and may function as scaffolding proteins or stabilizers of respiratory chain supercomplexes. They have the ability to bind GTP, which suggests a regulatory role in mitochondrial function. These proteins are part of the TRAFAC class YlqF/YawG GTPase family, specifically the NOA1 subfamily, indicating a conserved mechanism of action across different species.
