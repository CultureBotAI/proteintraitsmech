identifier: PANTHER:PTHR13354
label: "ROUND SPERMATID BASIC PROTEIN 1"
definition: >-
  This entry represents RSNB1 proteins, Dpy-21 and Centrosome-associated protein CEP530. Dosage compensation protein dpy-21 from C. elegans. Dpy-21 is required for X chromosome dosage compensation by reducing X-linked gene transcription in hermaphrodites throughout development. Lysine-specific demethylase 9 (Round spermatid basic protein 1, RSBN1 or Rosbin) is a homeobox-like protein that is located in the nucleus and is expressed exclusively in haploid round spermatids. It modulates chromosome architecture by demethylating dimethylated 'Lys-20' of histone H4 (H4K20me2). CEP530 from Toxoplasma gondii is required for proper nuclei segregation during cell division. It plays a role in the coordination of karyokinesis and cytokinesis during the tachyzoite cell cycle.
definition_source: "InterPro:IPR026306 abstract (PANTHER PTHR13354 is a member signature)"
