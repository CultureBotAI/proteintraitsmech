identifier: PANTHER:PTHR30212
label: "PROTEIN YIIM"
definition: >-
  This family of proteins includes enzymes involved in the detoxification of plant-derived benzoxazolinones. These compounds are phytoanticipins produced by certain plants as a defense mechanism and can be toxic to other organisms. The proteins in this family participate in a multi-step degradation process that converts these toxic compounds into non-toxic derivatives. The initial step involves hydrolysis of the cyclic ester bond in benzoxazolinones, followed by N-malonylation of the resulting aminophenols, leading to the formation of malonamic acids. Additional steps in the detoxification pathway may involve hydrolyzing lactone moieties and amidase activity, although the specific roles of some enzymes in this family are not fully characterized. Collectively, these proteins contribute to the ability of certain organisms to survive in environments where benzoxazolinone-producing plants are present.
