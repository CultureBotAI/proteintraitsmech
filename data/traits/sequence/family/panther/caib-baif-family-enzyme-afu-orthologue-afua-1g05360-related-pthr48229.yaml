  - kind: GENERAL
    text: >-
      The CoA-transferase III family is involved in diverse biosynthetic and degradation pathways. One member, Acetyl-coenzyme A transferase nodX, is crucial in the biosynthesis of indole diterpenes nodulisporic acids, which have potent insecticidal properties without adverse effects on mammals. It participates in multiple steps, including oxidation and prenylation, leading to the formation of various nodulisporic acids. Another member, Acyl-CoA transferase FVEG_12629, plays a role in the detoxification of benzoxazolinones in fungi, converting toxic compounds produced by host plants into non-toxic substances. This involves hydrolysis, N-malonylation, and possibly lactone hydrolysis, aiding in the degradation of plant-derived antimicrobial compounds.
    source: "InterPro:IPR052985 abstract (LLM-generated, not curator-reviewed)"
