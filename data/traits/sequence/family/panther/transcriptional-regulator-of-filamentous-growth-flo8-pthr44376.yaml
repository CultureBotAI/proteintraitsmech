identifier: PANTHER:PTHR44376
label: "TRANSCRIPTIONAL REGULATOR OF FILAMENTOUS GROWTH FLO8"
definition: >-
  This entry includes the transcriptional corepressor LEUNIG homologue (LUH) from Arabidopsis. LEUNIG (LUG) and LUH are similar to the animal and fungal Gro/Tup1-type corepressors. LUH has been shown to activate MYC2-directed transcription of JAZ2 and LOX2 via the Mediator complex coactivator and the histone acetyltransferase HAC1. LUH contains the N-terminal LUFS domain, which is essential for the direct interaction with its cofactor SEUSS. LUH and LUG exhibit both redundant and divergent functions in embryonic development, floral homeotic gene regulation, and plant biotic and abiotic stress responses. This entry also includes uncharacterised sequences from fungi.
