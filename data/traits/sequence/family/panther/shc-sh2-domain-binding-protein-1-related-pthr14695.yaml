identifier: PANTHER:PTHR14695
label: "SHC SH2-DOMAIN BINDING PROTEIN 1-RELATED"
definition: >-
  This entry includes SHC SH2 domain-binding protein 1 (Shcbp1) and related proteins, including protein nessun dorma (also known as Nesd) from Drosophila melanogaster. Shcbp1 is expressed in proliferating cells and is an important component of FGF (fibroblast growth factor) signalling in neural progenitor cells. Nesd is part of the centralspindlin complex, a key regulator of cytokinesis.
