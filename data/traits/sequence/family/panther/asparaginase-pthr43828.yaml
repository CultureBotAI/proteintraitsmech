identifier: PANTHER:PTHR43828
label: ASPARAGINASE
definition: >-
  This entry represents Regulatory protein SWI6 from Saccharomyces cerevisiae and similar fungal proteins involved in the regulation of the cell cycle, particularly in the transition between different phases. Members of this family function as components of complexes that are essential for cell-cycle-dependent transcription. They are known to bind specific DNA sequences, such as the cell cycle box (CCB) and Mlu I cell cycle box (MCB), to regulate the expression of genes critical for cell cycle progression. These proteins play roles in the initiation of DNA synthesis, acting as transcriptional activators at certain cell cycle stages and as repressors at others. Some members are implicated in the regulation of mitotic and meiotic divisions, sexual differentiation, rRNA production, and stress response regulation.
