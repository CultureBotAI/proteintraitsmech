identifier: PANTHER:PTHR11534
label: "MYOGENIC FACTOR"
definition: >-
  Myogenic factors are involved in muscle differentiation, inducing fibroblasts to differentiate into myoblasts. Myogenic factor 5 (Myf5) is responsible for directing cells to the skeletal myocyte lineage during development. Myf5 and Myod (myoblast determination protein 1) are predominantly expressed in proliferating myoblasts while Myf4 and Myf6 are involved in differentiation of myotubes. Myogenin (MYOG) is a transcriptional activator that promotes transcription of muscle-specific target genes and plays a role in muscle differentiation, cell cycle exit and muscle atrophy.
