identifier: PANTHER:PTHR47750
label: "F-BOX PROTEIN SNE"
definition: >-
  This entry represents F-box proteins SNE and GID2. In Arabidopsis, SNE (SNEEZY or SLY2, At5g48170) and its closest homologue GID2 (also known as SLEEPY1, SLY1) are the F-box subunits of a Skp-Cullin-F-box (SCF) E3 ubiquitin ligase complex that positively regulates the gibberellin (GA) signaling pathway. SCF interacts with its substrates, the DELLA proteins, to promote their ubiquitination and degradation, and mediate GA responses. SNE over-expression can partially compensate sly1-10 mutant phenotype of dwarfism. It may function as a redundant positive regulator of GA signaling.
definition_source: "InterPro:IPR044184 abstract (PANTHER PTHR47750 is a member signature)"
