identifier: PANTHER:PTHR46275
label: "HEPATOCYTE GROWTH FACTOR-REGULATED TYROSINE KINASE SUBSTRATE"
definition: >-
  Members of this group are characterised by the presence of a VHS (Vps27p/Hrs/Stam) domain in the N-terminal portion followed by a FYVE domain and one or two ubiquitin-interacting motifs. VHS domains are found at the N termini of select proteins involved in intracellular membrane trafficking and are often localised to membranes. FYVE domains are membrane localisation domains that specifically bind phosphatidylinositol 3-phosphate, regulating membrane trafficking and signalling pathways. The ubiquitin-interacting motif is found in many proteins involved in the endocytic pathway and is capable of binding ubiquitin. The three dimensional structure of the VHS and FYVE tandem domain unit of Drosophila melanogaster (Fruit fly) Hrs reveals a pyramidal structure in which the much larger VHS domain forms a rectangular base and the FYVE domain occupies the apical end. The VHS domain is composed of an unusual superhelix of eight α helices, and the FYVE domain is mainly built of loops, two double-stranded antiparallel sheets, and a helix stabilised by two tetrahedrally coordinated zinc atoms. Dimerisation creates two identical pockets designed for binding ligands with multiple negative charges such as citrate or phosphatidylinositol 3-phosphate. The FYVE domain of the Hrs orthologue in yeast is consistent with this structure. Members of this group regulate endosome maturation and trafficking between endosomes and the degradative organelles (lysosome/vacuole). Monoubiquitination functions as a signal for sorting transmembrane proteins into intraluminal vesicles of multivesicular bodies (MVB) and subsequent delivery to the degradative organelles. The sorting of proteins into the inner vesicles of multivesicular bodies is required for many key cellular processes, ranging from the downr
