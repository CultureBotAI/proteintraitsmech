identifier: PANTHER:PTHR10488
label: "GLYCINE AMIDINOTRANSFERASE, MITOCHONDRIAL"
definition: >-
  This family contains glycine ( ) and inosamine ( ) amidinotransferases, which are involved in creatine and streptomycin biosynthesis, respectively. This entry also includes L-arginine:L-lysine amidinotransferase from Pseudomonas savastanoi pv. phaseolicola, involved in the biosynthesis of phaseolotoxin, a nonhost-specific toxin that plays a key role in the development of the halo blight disease of beans. This enzyme is closely related to glycine amidinotransferase. Valine and arginine amidinotransferases (AMDT) are also included in this entry, which are involved in the biosynthesis of ketomemicins. They catalyse the transfer of an amidino group from L-arginine to the amino moiety of L-valine, forming amidino-valine and ornithine and the transfer of an amidino group from L-arginine to the amino moiety of a second L-arginine, forming amidino-arginine and ornithine.
definition_source: "InterPro:IPR033195 abstract (PANTHER PTHR10488 is a member signature)"
