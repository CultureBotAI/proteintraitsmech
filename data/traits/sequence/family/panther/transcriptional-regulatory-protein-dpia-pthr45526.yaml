  - kind: GENERAL
    text: >-
      The protein family is composed of transcriptional regulatory proteins that are part of two-component regulatory systems, which are typically involved in sensing environmental stimuli and regulating gene expression in response. Members of the family function as response regulators that, upon phosphorylation, bind to DNA and modulate the transcription of target genes. These proteins are essential for the expression of genes related to various cellular processes, including citrate-specific fermentation, plasmid inheritance, sporulation, and the anaerobic fumarate respiratory system. They may also be involved in the regulation of transporters and metabolic pathways in response to the presence of specific substrates such as C4-dicarboxylates and malate. The family includes proteins that can act as activators or repressors, and they often recognize specific DNA sequences to exert their regulatory functions.
    source: "InterPro:IPR051271 abstract (LLM-generated, not curator-reviewed)"
