  - kind: GENERAL
    text: >-
      This family of proteins includes phosphatases that are part of the HAD-like hydrolase superfamily. Members of this family are involved in various metabolic processes, including glycerol biosynthesis, osmoadaptation, and the dephosphorylation of a range of sugar phosphates. Some proteins in this family contribute to cell wall integrity, virulence, and tolerance to certain stress conditions such as anaerobic environments or specific chemicals. The substrates for these enzymes include glycerol-1-phosphate, fructose-1-phosphate, mannitol 1-phosphate, sorbitol 6-phosphate, and other sugar phosphates, indicating a broad specificity within the family. The enzymes are characterized by their ability to catalyze the hydrolysis of phosphate ester bonds, which is a critical reaction in various biochemical pathways.
    source: "InterPro:IPR051806 abstract (LLM-generated, not curator-reviewed)"
