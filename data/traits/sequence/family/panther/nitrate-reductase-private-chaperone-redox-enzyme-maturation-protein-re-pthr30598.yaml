identifier: PANTHER:PTHR30598
label: "NITRATE REDUCTASE PRIVATE CHAPERONE, REDOX ENZYME MATURATION PROTEIN  REMP  FAMILY"
definition: >-
  The nitrate reductase enzyme (EC:1.7.99.4) is composed of three subunits; an alpha, a beta and two gamma. It is the second nitrate reductase enzyme which it can substitute for the NRA enzyme in Escherichia coli allowing it to use nitrate as an electron acceptor during anoerobic respiration. Nitrate reductase gamma subunit resembles cytochrome b and transfers electrons from quinones to the beta subunit.
