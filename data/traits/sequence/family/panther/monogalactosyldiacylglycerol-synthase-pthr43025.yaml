  - kind: GENERAL
    text: >-
      The glycosyltransferase 28 family, specifically the UgtP subfamily, consists of processive diacylglycerol beta-glucosyltransferases involved in the biosynthesis of membrane glucolipids. These enzymes catalyze the transfer of glucose residues from UDP-glucose to diacylglycerol (DAG), forming various glycolipids such as beta-monoglucosyl-DAG, beta-diglucosyl-DAG, and beta-triglucosyl-DAG. Beta-diglucosyl-DAG is a predominant glycolipid in Bacillales and serves as a membrane anchor for lipoteichoic acid (LTA), which is crucial for cell envelope maintenance. Some members of the family can transfer up to three glucose residues, while others are limited to two. The family also includes monogalactosyldiacylglycerol synthases from plants, which are involved in the synthesis of the major structural component of photosynthetic membranes. These enzymes exhibit substrate preference and are essential for thylakoid membrane biogenesis and photosynthetic electron transport.
    source: "InterPro:IPR050519 abstract (LLM-generated, not curator-reviewed)"
