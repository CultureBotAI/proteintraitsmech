identifier: PANTHER:PTHR46152
label: "NF-KAPPA-B INHIBITOR-INTERACTING RAS-LIKE PROTEIN"
definition: >-
  This entry represents a group of NF-kappa-B inhibitor-interacting Ras-like proteins, known as kappaB-Ras proteins, including KBRS1 and KBRS2 from humans. They are Ras-like proteins that inhibit NF-kappaB transcriptional activity. Despite their high sequence similarity to Ras GTPases, kappaB-Ras proteins contain two Ras oncogenic mutations that drastically reduce GTP hydrolysis. KBRAS1 has been shown to bind IkappaBbeta and regulates cytoplasmic retention of IkappaBbeta/NF-kappaB complexes.
definition_source: "InterPro:IPR042227 abstract (PANTHER PTHR46152 is a member signature)"
