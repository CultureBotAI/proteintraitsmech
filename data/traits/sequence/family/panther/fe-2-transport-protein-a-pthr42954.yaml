  - kind: GENERAL
    text: >-
      This family of proteins is involved in the cellular uptake of ferrous ions (Fe(2+)). Members of this family facilitate the transport of Fe(2+) across the cell membrane, which is a critical process for cellular function and metabolism. Iron is an essential element for many biological processes, including oxygen transport, DNA synthesis, and electron transport in respiration. These proteins, however, are not known to influence the GTPase activity of associated proteins such as FeoB.
