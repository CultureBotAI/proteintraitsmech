identifier: PANTHER:PTHR46365
label: "COPPER TRANSPORT PROTEIN ATOX1"
definition: >-
  This family of proteins is involved in the cellular transport of copper ions. Members of this family bind copper ions in the cytosol and deliver them to copper ATPase transport proteins, which are responsible for the distribution of copper to various cellular compartments and copper-dependent enzymes. The proteins contain a heavy-metal-associated domain that coordinates the copper ion through a conserved CXXC motif. The transfer of copper involves the formation of a heterodimer with the ATPase, where the copper ion is shared between the two proteins. This process is critical for maintaining copper homeostasis and protecting the cell against oxidative stress. Additionally, these proteins can interact with cisplatin, a chemotherapeutic drug, which can inhibit their copper-binding function.
