identifier: PANTHER:PTHR45991
label: "PACHYTENE CHECKPOINT PROTEIN 2"
definition: >-
  This entry represents a group of AAA ATPases, including Pch2 from eukaryotes. It is required for the meiotic checkpoint that prevents chromosome segregation when recombination and chromosome synapsis are defective. In humans it is linked to Mosaic variegated aneuploidy syndrome 3 (MVA3). This entry also includes a group of uncharacterised AAA domain-containing proteins from bacteria, including Cap6 (also known as TRIP13) from Pseudomonas aeruginosa. Cap6 is a homologue of Pch2. It is part of the CBASS (cyclic oligonucleotide-based antiphage signaling system) and functions as an AAA+ ATPase that prevents the CdnD:Cap7:Cap8 complex from synthesizing 2',3',3'-cyclic AMP-AMP-AMP (cAAA), which is a second messenger. Cap6 binds and disassembles the active CD-NTase:HORMA complex, and hence functions as a negative regulator of CBASS.
definition_source: "InterPro:IPR044539 abstract (PANTHER PTHR45991 is a member signature)"
