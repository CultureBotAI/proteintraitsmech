identifier: PANTHER:PTHR31618
label: "MECHANOSENSITIVE ION CHANNEL PROTEIN 5"
definition: >-
  This entry represents a group of MscS-like (mechanosensitive channels of small conductance-like) proteins found in fungi and plants. Ten MscS-Like (MSL) proteins have been found in the genome of Arabidopsis thaliana. In the fission yeast Schizosaccharomyces pombe the mechanosensitive ion channel proteins are known as Msy1 and Msy2. Mechanosensitive (MS) channels provide protection against hypo-osmotic shock, responding both to stretching of the cell membrane and to membrane depolarisation. They are present in the membranes of organisms from the three domains of life: bacteria, archaea, and eukarya. There are two families of MS channels: large-conductance MS channels (MscL) and small-conductance MS channels (MscS or YGGB). The pressure threshold for MscS opening is 50% that of MscL. The MscS family is much larger and more variable in size and sequence than the MscL family. Much of the diversity in MscS proteins occurs in the size of the transmembrane regions, which ranges from three to eleven transmembrane helices, although the three C-terminal helices are conserved. In the fission yeast Schizosaccharomyces pombe the mechanosensitive ion channel proteins are known as Msy1 and Msy2.
