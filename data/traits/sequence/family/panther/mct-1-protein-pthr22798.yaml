identifier: PANTHER:PTHR22798
label: "MCT-1 PROTEIN"
definition: >-
  This entry includes malignant T-cell-amplified sequence 1 (MCT-1) from animals and translation machinery-associated protein 20 (Tma20) from fungi. MCT-1 is an oncogene that plays a role in cell cycle regulation. The function of Tma20 is not clear. This entry also includes some uncharacterised proteins from archaea.
