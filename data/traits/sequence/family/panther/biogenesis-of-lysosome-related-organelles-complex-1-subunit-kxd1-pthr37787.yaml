identifier: PANTHER:PTHR37787
label: "BIOGENESIS OF LYSOSOME-RELATED ORGANELLES COMPLEX 1 SUBUNIT KXD1"
definition: >-
  The KXD1 family comprises proteins that are integral components of the biogenesis of lysosome-related organelles complex-1 (BLOC-1). Members of the KXD1 family are involved in the crucial process of endosomal cargo sorting, which is essential for the proper functioning and distribution of materials to lysosome-related organelles. These proteins play a significant role in the cellular trafficking pathway, ensuring that enzymes, membrane proteins, and other vital substances reach their target organelles within the cell.
