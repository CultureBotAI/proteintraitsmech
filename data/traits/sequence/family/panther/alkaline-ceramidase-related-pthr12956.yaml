identifier: PANTHER:PTHR12956
label: "ALKALINE CERAMIDASE-RELATED"
definition: >-
  The entry represents a group of proteins mainly found in plants, including MUCI70 and TOD1 from Arabidopsis. They share a Rossmann-like fold found in glycosyltransferases. MUCI70 is a predicted glycosyltransferase essential for the accumulation of seed mucilage, a gelatinous wall rich in unbranched rhamnogalacturonan I (RG I), and for shaping the surface morphology of seeds. Together with IRX14, itis required for xylan and pectin synthesis in seed coat epidermal (SCE) cells. TOD1 is an endoplasmic reticulum ceramidase that catalyses the hydrolysis of ceramides into sphingosine and free fatty acids at alkaline pH (e.g. pH 9.5). It is involved in the regulation of turgor pressure in guard cells and pollen tubes.
definition_source: "InterPro:IPR006852 abstract (PANTHER PTHR12956 is a member signature)"
