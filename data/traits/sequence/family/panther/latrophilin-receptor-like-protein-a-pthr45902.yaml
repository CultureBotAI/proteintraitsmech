  - kind: GENERAL
    text: >-
      This family of proteins includes G-protein coupled receptors (GPCRs) that are part of the LN-TM7 subfamily. GPCRs are a large family of cell surface receptors that respond to a variety of external signals and activate intracellular signal transduction pathways and cellular responses. Being part of the LN-TM7 subfamily, these receptors are characterized by a long N-terminal extracellular domain and seven transmembrane helices. They are involved in cell adhesion and signaling processes. The specific functions of latrophilin receptor-like proteins may include roles in cell-cell communication, neuronal function, and possibly the modulation of synaptic transmission, although the precise physiological roles can vary.
