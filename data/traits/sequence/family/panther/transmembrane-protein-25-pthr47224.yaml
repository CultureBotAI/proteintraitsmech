identifier: PANTHER:PTHR47224
label: "TRANSMEMBRANE PROTEIN 25"
definition: >-
  The function of Transmembrane protein 25 (TMEM25) is not clear. It contains a C-2 type immunoglobulin domain homologous to Hemicentin (Fibulin-6, FIBL6), Titin (TTN), Sialoadhesin (SN) and Nephrin (NEPHS1).
