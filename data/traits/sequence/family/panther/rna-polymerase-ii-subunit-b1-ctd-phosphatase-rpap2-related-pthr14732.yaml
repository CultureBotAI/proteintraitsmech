identifier: PANTHER:PTHR14732
label: "RNA POLYMERASE II SUBUNIT B1 CTD PHOSPHATASE RPAP2-RELATED"
definition: >-
  This entry includes Rtr1 from budding yeasts and its homologues, including RPAP2 from humans. Homologues are known from animals, plants and fungi. Rtr1 and Rtr2 are paralogues. Rtr1 is a RNA polymerase II (RNAPII)-binding protein. It is responsible for the transition of PolII into the elongation and termination phases of transcription by removing RNAPII CTD serine 5 phosphorylation (Ser5-P) at a selection of target genes. Human RPAP2 is a CTD phosphatase that interacts directly with the RNA polymerase II subunit Rpb6 and participates in pre-mRNA 3'-end formation.
