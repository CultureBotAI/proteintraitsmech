identifier: PANTHER:PTHR10694
label: "LYSINE-SPECIFIC DEMETHYLASE"
definition: >-
  LYSINE-SPECIFIC DEMETHYLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10694. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein, histone modifying enzyme. Members are annotated with the molecular function histone demethylase activity. Members participate in regulation of gene expression, chromatin remodeling. Members localise to nucleus, chromosome, chromatin.
