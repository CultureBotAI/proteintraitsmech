identifier: PANTHER:PTHR12187
label: AGAP000124-PA
definition: >-
  This entry includes INPP4A and INPP4B. NPP4A is a inositol lipid 4-phosphatases that hydrolyses PtdIns(3,4)P2, a phosphoinositide generated by PI3K signalling. It contains a C2 domain in the N-terminal ( InterPro:IPR000008 ) and a phosphatase domain at the C-terminal. INPP4A is a suppressor of glutamate excitotoxicity in the central nervous system, while INPP4B acts as a tumour suppressor.
