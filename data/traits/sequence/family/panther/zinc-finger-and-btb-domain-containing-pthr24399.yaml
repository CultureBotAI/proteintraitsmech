identifier: PANTHER:PTHR24399
label: "ZINC FINGER AND BTB DOMAIN-CONTAINING"
definition: >-
  ZINC FINGER AND BTB DOMAIN-CONTAINING — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24399. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription repressor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleoplasm.
