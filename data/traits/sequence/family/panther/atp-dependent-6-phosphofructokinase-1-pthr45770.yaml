  - kind: GENERAL
    text: >-
      ATP-DEPENDENT 6-PHOSPHOFRUCTOKINASE 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45770. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 26 of its annotated subfamilies. Subfamilies are annotated with the molecular function carbohydrate kinase activity, phosphotransferase activity, alcohol group as acceptor. Subfamilies localise to intracellular anatomical structure, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the phosphorylation of D-fructose 6-phosphate. Members of this family are involved in the first committing step of glycolysis, using either ATP or inorganic phosphate (PPi) as a phosphoryl donor. The ATP-dependent enzymes convert D-fructose 6-phosphate to fructose 1,6-bisphosphate, a key regulatory step in glycolysis. In contrast, the PPi-dependent enzymes can function in both glycolysis and gluconeogenesis due to the reversible nature of the reaction they catalyze. This reversible reaction allows these enzymes to replace both the forward ATP-dependent phosphofructokinases and the reverse fructose-bisphosphatase enzymes. Some family members are regulated allosterically, while others are non-allosteric, indicating a diversity in regulatory mechanisms within the family.
    source: "InterPro:IPR050929 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
