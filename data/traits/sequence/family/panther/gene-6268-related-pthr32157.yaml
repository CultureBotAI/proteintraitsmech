identifier: PANTHER:PTHR32157
label: "GENE 6268-RELATED"
definition: >-
  CT47 is a family of proteins found in mammals. Proteins in this family are typically between 262 and 291 amino acids in length. There is a conserved HIL sequence motif. In humans, CT47 is expressed in the testis and in certain types of cancer, but not in non-malignant somatic tissue. The function of this family is not known.
