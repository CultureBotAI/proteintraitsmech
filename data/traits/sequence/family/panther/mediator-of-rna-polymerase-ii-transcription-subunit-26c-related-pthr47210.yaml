identifier: PANTHER:PTHR47210
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 26C-RELATED"
definition: >-
  MEDIATOR is a conserved multi-subunit complex that links transcription factors and RNA polymerase II and that thereby facilitates transcriptional initiation. This entry includes a MEDIATOR subunit known as MED26C from Arabidopsis, also known as MED26_3. This subunit may play a role in transcription elongation.
