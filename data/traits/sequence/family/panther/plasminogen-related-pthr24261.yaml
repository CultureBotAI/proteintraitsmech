  - kind: GENERAL
    text: >-
      This family of proteins includes serine proteases and regulators with a variety of biological functions. Members are involved in processes such as tissue remodeling, tumor invasion, inflammation, and blood clot dissolution. They can activate other proteases, degrade extracellular matrix components, and are implicated in cell detachment and apoptosis. Some family members act as growth factors for a wide range of tissues, promoting cell proliferation and survival. Others are involved in lipid metabolism and may serve as ligands for specific receptors. Regulatory proteins in this family can negatively affect phosphatidylinositol 3-kinase activity in the liver. The family is characterized by the presence of kringle domains, which mediate interactions with other proteins, and many members belong to the plasminogen subfamily of peptidase S1.
