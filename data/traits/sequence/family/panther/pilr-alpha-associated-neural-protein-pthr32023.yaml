identifier: PANTHER:PTHR32023
label: "PILR ALPHA-ASSOCIATED NEURAL PROTEIN"
definition: >-
  PIANP modulates gamma-secretase-mediated cleavage of E-Cadherin and therefore can affect junctional integrity and function. It has been shown to interact in vitro with the immune inhibitory receptor PILR-alpha, and may be involved in immune regulation.
