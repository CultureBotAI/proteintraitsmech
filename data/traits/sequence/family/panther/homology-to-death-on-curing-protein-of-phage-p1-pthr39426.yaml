identifier: PANTHER:PTHR39426
label: "HOMOLOGY TO DEATH-ON-CURING PROTEIN OF PHAGE P1"
definition: >-
  This entry represents death-on-curing (Doc) proteins mostly from bacteria and archaea. Bacterial toxin-antitoxin (TA) system (or "addiction module") composed of closely linked genes encoding a stable toxin that can harm the host cell and its cognate labile antitoxin, which protects the host from the toxin's deleterious effect. TA system plays a role in the adaptation of prokaryotes to stress conditions, the persistence phenomenon, programmed cell death and addiction to phages and mobile elements.
