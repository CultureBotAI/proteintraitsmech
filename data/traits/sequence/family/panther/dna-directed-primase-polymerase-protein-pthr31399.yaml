identifier: PANTHER:PTHR31399
label: "DNA-DIRECTED PRIMASE / POLYMERASE PROTEIN"
definition: >-
  PRIMPOL has both DNA polymerase and DNA/RNA primase activities. It is involved in downstream repriming of stalled forks during both nuclear and mitochondrial DNA replication. It pays an important part in DNA damage tolerance. It is predicted to possess an archaeo-eukaryotic primase and a UL52-like zinc finger domain. The primase activity of PRIMPOL is essential for many functions in the nucleus. However, the role of PRIMPOL polymerase activity is still unclear, as PRIMPOL synthesizes DNA with limited processivity, rarely incorporating more than four nucleotides on an undamaged template.
definition_source: "InterPro:IPR044917 abstract (PANTHER PTHR31399 is a member signature)"
