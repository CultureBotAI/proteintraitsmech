identifier: PANTHER:PTHR35678
label: "PROTEIN STPG4"
definition: >-
  PROTEIN STPG4 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35678. Members are annotated with the molecular function histone binding, chromatin binding. Members participate in epigenetic regulation of gene expression, positive regulation of macromolecule metabolic process, regulation of DNA metabolic process. Members localise to nucleus, intracellular anatomical structure.
