  - kind: GENERAL
    text: >-
      This family of proteins is part of the immunoglobulin superfamily and is involved in cell adhesion processes. Members of this family are characterized by the presence of immunoglobulin-like domains, which are typically responsible for mediating interactions between cells or between cells and the extracellular matrix. These proteins may play roles in cellular signaling, immune response, or the maintenance of tissue integrity. Given the reference to carcinoembryonic antigen-related cell adhesion molecules, they may also be implicated in cancer biology, either in tumor progression or as markers for certain types of cancer.
