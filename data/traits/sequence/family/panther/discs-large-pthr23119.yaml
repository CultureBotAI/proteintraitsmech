      DISCS LARGE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23119. PANTHER protein class: scaffold/adaptor protein. Members are annotated with the molecular function protein kinase binding, binding. Members participate in localization within membrane, embryo development, establishment or maintenance of epithelial cell apical/basal polarity. Members localise to cell junction, plasma membrane region, membrane.
