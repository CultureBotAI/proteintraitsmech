identifier: PANTHER:PTHR15566
label: POM121-LIKE
definition: >-
  Nucleoporin Nup121 or pore membrane protein POM121 is a essential component of the nuclear pore complex (NPC). It has a repeat-containing domain that may be involved in anchoring components of the pore complex to the pore membrane. When overexpressed in cells, POM121 (Nup121) induces the formation of cytoplasmic annulate lamellae (AL). This entry includes POM121-like protein 1 and related proteins.
