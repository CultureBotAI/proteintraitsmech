identifier: PANTHER:PTHR36726
label: "CLAVATA3/ESR (CLE)-RELATED PROTEIN 45"
definition: >-
  This entry includes a group of plant proteins, including CLAVATA3/ESR (CLE)-related protein 45 (CLE45) from Arabidopsis. CLE45 may be a suppressor of plant stem cell differentiation. CLE45 is part of the CLE peptide family. The CLE peptide family members are small proteins that contain a signal peptide at their N-termini and conserved CLE domain(s) at their C-termini. The signal peptide is essential for secretion of the CLE peptide into the apoplastic space where it functions non-cell autonomously. They have a variety of functions, from embryo and endosperm development to meristem maintenance, from vascular development to autoregulation of nodulation (AON).
definition_source: "InterPro:IPR038821 abstract (PANTHER PTHR36726 is a member signature)"
