identifier: PANTHER:PTHR13030
label: "NUDIX HYDROLASE"
definition: >-
  Mitochondrial ADP-ribose pyrophosphatase (also known as nucleoside diphosphate-linked moiety X motif, nudix motif 9 or NUDT9) hydrolyses ADP-ribose to AMP and ribose 5'-phosphate. NUDT9 interacts with GLOD4. This entry also include putative nudix hydrolase 6 from Caenorhabditis elegans, which is thought to mediate the hydrolysis of some nucleoside diphosphate derivatives.
