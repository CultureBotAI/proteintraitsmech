identifier: PANTHER:PTHR45444
label: "XANTHINE DEHYDROGENASE"
definition: >-
  This entry includes aldehyde oxidases (AOXs) and xanthine dehydrogenases (XDHs). They are both molybdenum cofactor (Moco) containing enzymes. AOX catalyses the reaction: aldehyde + H(2)O + O(2) = a carboxylic acid + H2O2 It binds 2 2Fe-2S clusters uses FAD and molybdopterin as cofactors. XDH has the same cofactors and some of them can be converted from the dehydrogenase form (D) to the oxidase form (O). This can be done irreversibly by proteolysis or reversibly through the oxidation of sulfhydryl groups. This enzyme catalyses three reactions: Xanthine + H2O + NAD+= urate + NADH Hypoxanthine + H2O + NAD+= xanthine + NADH Xanthine + H2O + O2 = urate + H2O2 In Arabidopsis thaliana, the molybdenum cofactor sulfurase ABA3 is needed for post-translational activation of aldehyde oxidase and xanthine dehydrogenase. It does this by transferring a sulfur atom to the desulfo-molybdenum cofactor of these enzymes.
definition_source: "InterPro:IPR016208 abstract (PANTHER PTHR45444 is a member signature)"
