identifier: PANTHER:PTHR15885
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 174"
definition: >-
  This entry represents CCDC174 and related proteins from animals, fungi and plants. CCDC174 is a ubiquitous protein which is restricted to the cell nucleus and co-localises with EIF4A3. Mutations in this gene have been linked to a syndrome characterised by hypotonia (low muscle tone) and psychomotor developmental delay.
