identifier: PANTHER:PTHR13360
label: "ACTIVATING SIGNAL COINTEGRATOR 1 COMPLEX SUBUNIT 1"
definition: >-
  ASCC1, also called ASC-1 complex subunit p50, or Trip4 complex subunit p50, is essential for DNA damage repair as component of the ASCC complex which consists of ASCC1, ASCC2 and ASCC3 subunits (p50, p100 and p200, respectively). ASC-1 is also involved in ribosome assembly. The ASCC is required not only for dissociation of colliding 80S ribosomes but also for efficient translation initiation by scanning ribosomes at a subset of transcripts. In cells responding to gastrin-activated paracrine signals, it is involved in the induction of SERPINB2 expression by gastrin. ASCC1 may also play a role in the development of neuromuscular junction. This protein has an RNA-binding KH domain fused to a 2H RNA-phosphoesterase and modulates the ASCC3 helicase recruitment to the ASCC complex during alkylation damage. This entry also includes some uncharacterised proteins from fungi, such as the ASCC1 orthologue from S.pombe, C15D4.13c.
definition_source: "InterPro:IPR009210 abstract (PANTHER PTHR13360 is a member signature)"
