  - kind: GENERAL
    text: >-
      This family of proteins includes regulators of various cellular processes such as metabolism, cell growth, and RNA processing. Members of this family are involved in the regulation of glutamate metabolism and the inhibition of 2-oxoglutarate dehydrogenase, a key enzyme in the Krebs cycle, through phosphorylation-dependent mechanisms. Some proteins in this family function as inhibitors of protein phosphatase 1, thereby influencing cell proliferation and pre-mRNA splicing. Others are implicated in the biogenesis of microRNAs and the stability of specific mRNAs. Additionally, certain members are associated with the spliceosome and are required for the splicing of pre-mRNAs. The family also includes proteins that may act as transcriptional repressors and participate in signaling pathways.
    source: "InterPro:IPR050923 abstract (LLM-generated, not curator-reviewed)"
