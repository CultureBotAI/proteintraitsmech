      NUCLEAR INHIBITOR OF PROTEIN PHOSPHATASE-1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23308. PANTHER protein class: RNA splicing factor, RNA processing factor. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding.
