identifier: PANTHER:PTHR46488
label: "AP-5 COMPLEX SUBUNIT ZETA-1"
definition: >-
  AP-5 complex subunit zeta-1 is a component of the fifth Adaptor-Protein complex (AP-5). Adaptor protein (AP) complexes facilitate the trafficking of cargo from one membrane compartment of the cell to another by recruiting other proteins to particular types of vesicles. AP-5 is involved in trafficking proteins from endosomes towards other membranous compartments. There are genetic links between AP-5 and hereditary spastic paraplegia, a group of human genetic disorders characterised by progressive spasticity in the lower limbs.
definition_source: "InterPro:IPR028222 abstract (PANTHER PTHR46488 is a member signature)"
