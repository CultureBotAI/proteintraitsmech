identifier: PANTHER:PTHR43064
label: "PHOSPHORIBOSYLAMINOIMIDAZOLE CARBOXYLASE-RELATED"
definition: >-
  This entry represents Pyridinium-3,5-biscarboxylic acid mononucleotide synthase (LarB), Uncharacterized protein MJ0165 and related proteins found in prokaryotes and eukaryotes. The lactate racemase enzyme (LarA) of Lactobacillus plantarum harbours a (SCS)Ni(II) pincer complex. LarB, together with LarC and LarE, is involved in the synthesis of the nickel-pincer cofactor of LarA. LarB, LarC, and LarE are widely distributed in microorganisms. LarB carboxylates the pyridinium ring of nicotinic acid adenine dinucleotide (NaAD) and cleaves the phosphoanhydride bond to release AMP. Therefore, LarB converts NaAD into pyridinium-3,5-biscarboxylic acid mononucleotide (P2CMN). Subsequently, LarE incorporates two sulphur atoms to yield P2TMN, and LarC donates Ni so that the mature cofactor becomes covalently attached to LarA. In species where larA is absent, this pathway could be used to generate a pincer complex in other enzymes.
definition_source: "InterPro:IPR039476 abstract (PANTHER PTHR43064 is a member signature)"
