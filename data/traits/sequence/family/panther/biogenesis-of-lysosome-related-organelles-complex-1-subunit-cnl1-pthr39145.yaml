identifier: PANTHER:PTHR39145
label: "BIOGENESIS OF LYSOSOME-RELATED ORGANELLES COMPLEX 1 SUBUNIT CNL1"
definition: >-
  CNL1 (CNO-like protein 1) is a component of the yeast biogenesis of lysosome-related organelles complex-1 (BLOC-1), a complex that is involved in sorting cargo to lysosome-related organelles and endosomes. The yeast BLOC-1 consists of six subunits. BLOC-1 functions as an endosomal Rab-GAP (GTPase-activating protein) adapter complex in yeast. It controls the lifetime of active Rab5/Vps21 and thus is involved in endosomal maturation along the endocytic pathway.
