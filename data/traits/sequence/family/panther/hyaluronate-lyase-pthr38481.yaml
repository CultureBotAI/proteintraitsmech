identifier: PANTHER:PTHR38481
label: "HYALURONATE LYASE"
definition: >-
  This entry includes a group of lyase enzymes capable of acting on hyaluronan and chondroitin in the extracellular matrix of host tissues. This family also includes xanthan lyase from Bacillus.
