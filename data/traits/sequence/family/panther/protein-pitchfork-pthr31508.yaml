identifier: PANTHER:PTHR31508
label: "PROTEIN PITCHFORK"
definition: >-
  This entry represents homologues of Ciliary microtubule-associated protein 3 (CIMAP3, also known as Protein Pitchfork). CIMAP3 is an axonemal microtubule-associated (MAP). It belongs to the group of wedge-MAPs that occupy the inter-protofilament cleft between protofilaments A03/A04. It alternates with CIMAP2 along the DMT, resulting in an overall periodicity of 96 nm. The primary cilium (PC) is a microtubule (MT)-based organelle that emanates from the cell surface of most mammalian cell types during growth arrest. It is anchored by the mother centriole of the centrosome, known as basal body (BB). Pitchfork associates with ciliary targeting complexes and regulates primary cilia (PC) disassembly. It interacts and co-localizes with alpha, beta, gamma-Tubulin, MT-dependent motor proteins, small GTPases involved in vesicular trafficking and is dynamically transported along ciliary axonemal MTs. It has been shown to activate Aurora A, a protooncogenic kinase that induces cilia retraction. In vertebrates, the PC acts as the key-signalling hub for the Hedgehog pathway, which regulates diverse aspects of embryonic development and tissue homeostasis. Pitchfork is involved, together with Gprasp2, in targeting Smoothened to the primary cilium for the activation of the Hedgehog pathway.
definition_source: "InterPro:IPR033602 abstract (PANTHER PTHR31508 is a member signature)"
