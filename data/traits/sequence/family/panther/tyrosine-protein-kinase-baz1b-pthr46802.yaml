identifier: PANTHER:PTHR46802
label: "TYROSINE-PROTEIN KINASE BAZ1B"
definition: >-
  BAZ1B is an atypical tyrosine-protein kinase that plays a central role in chromatin remodelling and acts as a transcription regulator. It is involved in DNA damage response by phosphorylating 'Tyr-142' of histone H2AX. BAZ1B is one of the regulatory subunits of the ATP-dependent WICH-1 and WICH-5 ISWI chromatin remodelling complexes, which form ordered nucleosome arrays on chromatin and facilitate access to DNA during DNA-templated processes such as DNA replication, transcription, and repair. This protein mediates the recruitment of the WICH-5 ISWI chromatin remodelling complex to replication foci during DNA replication.
definition_source: "InterPro:IPR047174 abstract (PANTHER PTHR46802 is a member signature)"
