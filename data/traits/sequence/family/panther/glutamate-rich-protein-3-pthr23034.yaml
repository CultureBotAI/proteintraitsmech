identifier: PANTHER:PTHR23034
label: "GLUTAMATE-RICH PROTEIN 3"
definition: >-
  This entry includes human protein ERICH3 is a component of the mammalian primary cilium that regulates cilium length and the ciliary levels of Shh signaling molecules. It has been proposed that ERICH3 functions within retrograde intraflagellar transport-associated pathways to remove signaling proteins from cilia.
