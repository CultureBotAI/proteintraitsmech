identifier: PANTHER:PTHR10747
label: "TRANSCRIPTION FACTOR COE FAMILY MEMBER"
definition: >-
  The independent cloning of rodent EBF/Olf-1 and Drosophila melanogaster Collier has defined a family of transcription factors, the Collier or COE family. COE proteins have various functions in different organisms. In mouse, COE1 has a role in B-cell differentiation, and could also perform a role in neuronal differentiation. All three COE are expressed in immature olfactory neuronal precursors and mature olfactory neurons as well as in developping nervous system during embryogenesis. In Drosophila, Collier is involved in the formation of the embryonic somatic muscle DA3, in the patterning of the wing by mediating Hedgehog activity. It could also act as a second-level regulator in the patterning of embryonic head.
definition_source: "InterPro:IPR003523 abstract (PANTHER PTHR10747 is a member signature)"
