identifier: PANTHER:PTHR33159
label: "RPM1-INTERACTING PROTEIN 4 (RIN4) FAMILY PROTEIN"
definition: >-
  RIN4 is an essential regulator of plant defense pathways. It functions with the plasma membrane H(+)-ATPase to regulate stomatal apertures, inhibiting the entry of bacterial pathogens during infection. It is required for RPM1-mediated Pseudomonas syringae resistance in Arabidopsis. Phosphorylated RIN4 activates the receptor RPM1 to mediate the plant defense. Arabidopsis RIN4 contains two nitrate-induced (NOI) domains and is a member of the larger NOI family. This entry also includes NOI4 (At5g55850), whose function is not known.
