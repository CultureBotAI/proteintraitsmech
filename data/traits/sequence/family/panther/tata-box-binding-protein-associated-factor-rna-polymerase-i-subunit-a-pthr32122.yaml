identifier: PANTHER:PTHR32122
label: "TATA BOX-BINDING PROTEIN ASSOCIATED FACTOR RNA POLYMERASE I SUBUNIT A"
definition: >-
  This family of proteins includes components of the SL1/TIF-IB complex, which plays a crucial role in the initiation of RNA polymerase I-dependent transcription. These proteins are key in the formation of the pre-initiation complex (PIC) by associating with the rDNA promoter, a process that is essential for the transcription of ribosomal RNA genes. They also contribute to the stabilization of nucleolar transcription factor 1 (UBTF) on rDNA. Additionally, their presence in the SL1/TIF-IB complex prevents the binding of TATA box-binding protein (TBP) with TFIID subunits, thus influencing the overall transcription machinery.
