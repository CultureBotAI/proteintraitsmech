identifier: PANTHER:PTHR42869
label: "SLL0572 PROTEIN"
definition: >-
  This family of proteins includes enzymes that are responsible for the synthesis of cyclic 2,3-diphosphoglycerate (cDPG), a molecule with a role in adaptation to extreme environments. Members of this family catalyze the formation of cDPG through an ATP-dependent mechanism, creating an intramolecular phosphoanhydride bond. The activity of these enzymes is crucial for organisms that encounter conditions such as high salinity or temperature, as cDPG can act as a protective compound stabilizing proteins and other cellular structures. This entry also includes Arginine synthetase ArcE which catalyses the conversion of L-arginine to citrulline while conserving the energy of arginine deimination to generate ATP from ADP and free phosphate.
definition_source: "InterPro:IPR053199 abstract (PANTHER PTHR42869 is a member signature)"
