identifier: PANTHER:PTHR46057
label: "FCS-LIKE ZINC FINGER 1-RELATED"
definition: >-
  This entry represents a group of plant FCS-Like Zinc finger-containing proteins, including FLZ1-3 from Arabidopsis. They are DUF581 proteins that may act as an adapter to facilitate the interaction of SnRK1 complex with effector proteins, conferring tissue- and stimulus-type specific differences in the SnRK1 regulation pathway.
