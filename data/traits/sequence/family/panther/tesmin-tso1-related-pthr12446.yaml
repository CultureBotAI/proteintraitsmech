identifier: PANTHER:PTHR12446
label: TESMIN/TSO1-RELATED
definition: >-
  This entry represents the lin-54 family of proteins. Members include lin-54 and tesmin. Lin-54 is a component of the DREAM (MuvB/DRM) complex, which represses cell cycle-dependent genes in quiescent cells and plays a role in the cell cycle-dependent activation of G2/M genes. Tesmin may have a role in spermatogenesis.
