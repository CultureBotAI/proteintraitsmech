identifier: PANTHER:PTHR12960
label: GLE-1-RELATED
definition: >-
  This family includes human protein GLE1 (UniProtKB:O75458) and its homologues. This protein is localised at the nuclear pore complexes and functions in poly(A)+ RNA export to the cytoplasm. In Arabidopsis, it is required for seed viability.
