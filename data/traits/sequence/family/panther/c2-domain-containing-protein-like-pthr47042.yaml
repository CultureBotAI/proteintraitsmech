  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in cellular interactions and signaling processes. Some proteins in this family are thought to mimic human histidine-rich glycoproteins to facilitate the anchoring of binding complexes with endothelial cell receptors. These interactions are critical in the establishment of connections between cells and the extracellular matrix, playing a role in processes such as cell adhesion and possibly in immune evasion or pathogenesis in the case of parasitic proteins. The family also encompasses proteins that belong to the extended synaptotagmin family, suggesting a potential role in membrane trafficking or signaling due to the presence of the C2 domain, which is known to bind to phospholipids and participate in calcium-dependent cellular processes.
