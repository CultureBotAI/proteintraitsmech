identifier: PANTHER:PTHR24045
label: "Stealth family"
definition: >-
  This entry represents a group of mono/polysaccharide phosphotransferases from animal, fungi and bacteria, including N-acetylglucosamine-1-phosphotransferase subunits alpha/beta from humans (GNPTAB) and Capsular polysaccharide phosphotransferase WcwK from Streptococcus pneumoniae. Family members were first identified in microbes as proteins that help pathogens to elude the host innate immune system. Microbial stealth proteins are involved in the biosynthesis of exopolysaccharides. GNPTAB catalyses the formation of mannose 6-phosphate (M6P) markers on high mannose type oligosaccharides in the Golgi apparatus. MP6 residues mediate the vesicular transport of lysosomal enzymes to the endosomal/prelysosomal compartment. This entry also includes 3-O-alpha-D-mannopyranosyl-alpha-D-mannopyranose xylosylphosphotransferase from Cryptococcus neoformans, which functions in the O-glycosylation of proteins en route through the secretory pathway.
definition_source: "InterPro:IPR047141 abstract (PANTHER PTHR24045 is a member signature)"
