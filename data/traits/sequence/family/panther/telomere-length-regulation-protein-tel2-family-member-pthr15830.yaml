definitions:
  - kind: GENERAL
    text: >-
      TELOMERE LENGTH REGULATION PROTEIN TEL2 FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15830. Members are annotated with the molecular function telomeric DNA binding, heat shock protein binding, Hsp90 protein binding. and participate in nitrogen compound metabolic process, protein folding, 'de novo' protein folding. and localise to cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of the DNA damage response (DDR) and telomere length maintenance. Members of this family are components of the TTT complex, which is essential for stabilizing the levels of phosphatidylinositol 3-kinase-related protein kinase (PIKK) family proteins. They contribute to the assembly, stabilization, and maintenance of TORC complexes that are critical for cell growth and survival in response to various signals. These proteins also play roles in genome stability, cell cycle arrest, apoptosis, and gene silencing at subtelomeric regions. They may interact with HSP90 to assist in the proper folding of newly synthesized PIKKs and are implicated in cellular resistance to DNA damage stresses such as ionizing radiation, ultraviolet light, and certain chemicals.
    source: "InterPro:IPR051970 abstract (LLM-generated, not curator-reviewed)"
