  - kind: GENERAL
    text: >-
      The Pyruvate Dehydrogenase E1 Alpha Subunit family includes enzymes that play a crucial role in cellular energy metabolism by catalyzing the conversion of pyruvate to acetyl-CoA and CO2. This reaction is a key step linking the glycolytic pathway to the tricarboxylic acid cycle. The family consists of multiple copies of three core enzymatic components: pyruvate dehydrogenase (E1), dihydrolipoamide acetyltransferase (E2), and lipoamide dehydrogenase (E3). The E1 component is subject to regulation through phosphorylation, which inactivates the enzyme, and dephosphorylation, which reactivates it. This regulatory mechanism ensures precise control of the pyruvate dehydrogenase complex activity in response to cellular energy requirements.
    source: "InterPro:IPR050642 abstract (LLM-generated, not curator-reviewed)"
