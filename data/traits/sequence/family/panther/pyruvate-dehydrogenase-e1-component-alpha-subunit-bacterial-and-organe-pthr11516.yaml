definitions:
  - kind: GENERAL
    text: >-
      PYRUVATE DEHYDROGENASE E1 COMPONENT, ALPHA SUBUNIT BACTERIAL AND ORGANELLAR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11516. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity. Members participate in purine ribonucleotide biosynthetic process, acyl-CoA metabolic process, monocarboxylic acid metabolic process.
