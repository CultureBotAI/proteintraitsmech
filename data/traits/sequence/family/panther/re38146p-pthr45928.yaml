  - kind: GENERAL
    text: >-
      This family of proteins includes mitochondrial carriers that function as antiporters, exchanging dicarboxylates and sulfur oxoanions across the inner mitochondrial membrane. Some members are implicated in the transport of specific metabolites such as oxaloacetate and sulfate, and may play roles in metabolic pathways like leucine biosynthesis. The exact function of some carriers remains to be determined, although they do not mediate citrate export from mitochondria to cytoplasm.
