    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes dorsalizing factors that play a crucial role in early vertebrate embryogenesis. They are involved in the regulation of developmental processes by binding to and sequestering TGF-beta family bone morphogenetic proteins (BMPs), which are known as ventralizing factors. By forming latent complexes with BMPs, these proteins control the balance between dorsal and ventral cell fates during embryonic tissue development. Additionally, some members of this family have been implicated in the patterning of the dorsal-ventral axis and in the development of various structures, such as the neuroectoderm and the amnioserosa in invertebrates. They can exhibit both agonistic and antagonistic activities towards BMP signaling, which is essential for proper tissue and organ formation.
    source: "InterPro:IPR052278 abstract (LLM-generated, not curator-reviewed)"
