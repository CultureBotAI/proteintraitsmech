  - kind: GENERAL
    text: >-
      CHORDIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46526. Members are annotated with the molecular function protein binding, cytokine binding. and participate in dorsal/ventral pattern formation, negative regulation of BMP signaling pathway, regulation of cellular process. and localise to extracellular space.
