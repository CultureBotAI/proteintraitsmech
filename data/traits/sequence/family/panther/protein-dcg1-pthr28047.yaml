      PROTEIN DCG1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28047. Members participate in metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the racemization of 5-substituted hydantoins, facilitating the conversion of these compounds to L-amino acids. The racemization process occurs through the enolization of both D- and L-enantiomers of hydantoins, which may have various side chains, including arylalkyl and aliphatic groups. Members of this family show different substrate preferences and are subject to regulation by various metal ions, with some being inhibited by heavy metals such as mercury and copper, while others are stimulated by reducing agents or slightly by divalent cations like manganese or cobalt. The activity of these enzymes is crucial for the utilization of hydantoins as nitrogen sources and for the production of L-amino acids, which are important building blocks for protein synthesis.
    source: "InterPro:IPR052186 abstract (LLM-generated, not curator-reviewed)"
