identifier: PANTHER:PTHR47034
label: "ZINC FINGER TRANSCRIPTION FACTOR TRPS1"
definition: >-
  The TRPS1 gene encodes a multi zinc-finger nuclear regulator of chondrocyte proliferation and differentiation. Mutations in the gene cause trichorhinophalangeal syndrome (TRPS), an autosomal dominant skeletal dysplasia. The Trps1 protein also acts as regulator of histone deacetylation, interacting with two histone deacetylases, Hdac1 and Hdac4, thereby increasing their activity.
