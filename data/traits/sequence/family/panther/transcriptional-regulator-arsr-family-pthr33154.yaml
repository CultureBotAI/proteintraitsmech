    text: >-
      TRANSCRIPTIONAL REGULATOR, ARSR FAMILY — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33154. PANTHER protein class: helix-turn-helix transcription factor, winged helix/forkhead transcription factor. Members participate in regulation of DNA-templated transcription.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is comprised of helix-turn-helix (HTH) type transcriptional regulators involved in various cellular responses to environmental and intracellular signals. Members of the family function primarily as repressors or activators of gene expression. Several proteins within the family are responsive to metal ions, such as arsenic, antimony, bismuth, and zinc, regulating operons associated with metal resistance or homeostasis. For instance, some family members repress the ars operon and are derepressed by metalloids in their +III oxidation state. Others are involved in zinc homeostasis, repressing gene expression in the absence of zinc. Additionally, some regulators control genes related to lipid metabolism, hypoxic response, sporulation, and virulence. The family includes proteins that can bind to specific DNA sequences, with some showing metal ion-dependent binding regulation.
    source: "InterPro:IPR051081 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
