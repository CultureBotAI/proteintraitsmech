identifier: PANTHER:PTHR31315
label: "PROTEIN SIP5"
definition: >-
  This entry includes a group of fungal and plant proteins, including Sip5 from budding yeasts and DA2 from Arabidopsis. The function of Sip5 is not clear. It interacts with both the Reg1/Glc7 protein phosphatase and the Snf1 protein kinase. DA2 (At1g78420) is an E3 ubiquitin-protein ligase involved in the regulation of organ and seed size. This entry also includes DA2-like proteins such as At1g17145 and GW2.
