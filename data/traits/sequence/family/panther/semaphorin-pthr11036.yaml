identifier: PANTHER:PTHR11036
label: SEMAPHORIN
definition: >-
  Semaphorins are a family of cell surface and soluble proteins originally identified as axon guidance factors, but are now recognised to to be involved in a wide range of functions, including neural connectivity, angiogenesis, immunoregulation, and cancer. Some semaphorins have an important role in the immune response, some regulate immune cell activation or differentiation, while others regulate the trafficking of immune cells. Semaphorins signal through two major receptor families, plexins and neuropilins (Nrps). All semaphorins have a Sema domain, characterised by a seven-blade β propeller structure, which contains sites for semaphorin dimerisation and receptor binding. Semaphorins are grouped into eight classes based on their structural domains, with classes 3-7 comprising the vertebrate semaphorins.
