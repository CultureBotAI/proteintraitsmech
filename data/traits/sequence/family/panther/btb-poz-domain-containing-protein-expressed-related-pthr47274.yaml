identifier: PANTHER:PTHR47274
label: "BTB/POZ DOMAIN CONTAINING PROTEIN, EXPRESSED-RELATED"
definition: >-
  This is a group of plant BTB/POZ domain-containing proteins including At1g01640, At5g48510 and At3g56230 from Arabidopsis. They may act as a substrate-specific adapter of an E3 ubiquitin-protein ligase complex (CUL3-RBX1-BTB), which mediates the ubiquitination and subsequent proteasomal degradation of target proteins.
