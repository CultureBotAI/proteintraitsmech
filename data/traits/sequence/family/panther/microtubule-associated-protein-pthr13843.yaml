identifier: PANTHER:PTHR13843
label: "MICROTUBULE-ASSOCIATED PROTEIN"
definition: >-
  MAP1-family proteins are microtubule-associated proteins (MAPs) that bind along the microtubule lattice. Mammalian genomes usually contain three family members, MAP1A, MAP1B and MAP1S. Only one family member, Futsch, is found in Drosophila. Human MAP1A and MAP1B, are predominantly expressed in neurons, where they are thought to be important in the formation and development of axons and dendrites. Human MAP1A and MAP1B stabilise microtubules and interact with other cellular components, including filamentous actin and signaling proteins. The activity of MAP1A and MAP1B is controlled by upstream signaling mechanisms, including the MAP kinase and glycogen synthase kinase-3 beta pathways.
