identifier: PANTHER:PTHR28093
label: "MORPHOGENESIS-RELATED PROTEIN MSB1"
definition: >-
  The function of this family of yeast proteins is not known. Mug8 may have a role in meiosis and septation in Schizosaccharomyces pombe. The Saccharomyces cerevisiae homologue Msb1 may be involved in positive regulation of 1,3-beta-glucan synthesis and the Pkc1p-MAPK pathway.
