identifier: PANTHER:PTHR15496
label: "GENERAL TRANSCRIPTION FACTOR 3C POLYPEPTIDE 4 FAMILY"
definition: >-
  General transcription factor 3C polypeptide 4 (GTF3C4, also known as Transcription factor IIIC 90kDa subunit (TFIIIC90) and Sfc9 in yeast) is a subunit of transcription factor IIIC (TFIIIC), a multisubunit complex that recognises promoter elements and recruits TFIIIB and RNA polymerase III. This subunit is essential for RNA polymerase III-mediated transcription. It has histone acetyltransferase activity with unique specificity for free and nucleosomal H3.
definition_source: "InterPro:IPR044230 abstract (PANTHER PTHR15496 is a member signature)"
