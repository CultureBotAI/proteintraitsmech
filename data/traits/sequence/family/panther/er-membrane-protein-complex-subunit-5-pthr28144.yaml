identifier: PANTHER:PTHR28144
label: "ER MEMBRANE PROTEIN COMPLEX SUBUNIT 5"
definition: >-
  This family of proteins is involved in the biogenesis and insertion of membrane proteins into the endoplasmic reticulum (ER). Members facilitate the energy-independent integration of newly synthesized proteins into the ER membrane, particularly accommodating those with less hydrophobic or destabilizing transmembrane domains. The family plays a crucial role in the cotranslational insertion of multi-pass membrane proteins, ensuring correct topology by inserting N-terminal transmembrane domains with the N-terminus facing the ER lumen. Additionally, it is essential for the post-translational insertion of tail-anchored proteins into the ER membrane.
