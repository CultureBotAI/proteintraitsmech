identifier: PANTHER:PTHR39267
label: "SURVIVAL MOTOR NEURON-LIKE PROTEIN 1"
definition: >-
  This entry includes human Survival motor neuron protein (SMN), its orthologue from Schizosaccharomyces pombe and similar proteins from eukaryotes. It is part of the SMN complex, which catalyses the assembly of small nuclear ribonucleoproteins (snRNPs), the building blocks of the spliceosome, and thereby plays an important role in the splicing of cellular pre-mRNAs. Interestingly, Smn is not present in Saccharomyces cerevisiae. Orthologues of this gene in fungi seem to be present predominately in filamentous fungi.
