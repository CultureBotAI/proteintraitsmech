identifier: PANTHER:PTHR31367
label: "CYTOSOLIC 5'-NUCLEOTIDASE 1 FAMILY MEMBER"
definition: >-
  This family consists of both eukaryotic and prokaryotic 5'-nucleotidase sequences (EC:3.1.3.5), including cytosolic 5'-nucleotidase 1A and 1B (NT5C1A/NT5C1B) from mammals. NT5C1A/NT5C1B dephosphorylate the 5' and 2'(3')-phosphates of deoxyribonucleotides and help to regulate adenosine levels.
