identifier: PANTHER:PTHR14918
label: "KICSTOR COMPLEX PROTEIN SZT2"
definition: >-
  Szt2 (seizure threshold 2), also known as TIGR (transcript increased in glutamate resistance) is a peroxisomal protein implicated in resistance to oxidative stress. It is not a functional superoxide dismutase (SOD), but might be involved in SOD activity. In mammals, it may serve an important role in the central nervous system. Szt2 is part of the KICSTOR complex, which functions in the amino acid-sensing branch of the TORC1 signaling pathway.
