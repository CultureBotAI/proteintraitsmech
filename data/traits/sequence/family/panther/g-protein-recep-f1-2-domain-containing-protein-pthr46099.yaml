identifier: PANTHER:PTHR46099
label: "G_PROTEIN_RECEP_F1_2 DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes receptors that are part of the G-protein coupled receptor 1 superfamily. They specifically belong to the endothelin receptor subfamily, which is characterized by their ability to bind endothelin molecules. Members of this family are involved in various physiological processes by mediating the action of endothelins through G protein-associated signaling pathways that lead to the activation of a phosphatidylinositol-calcium second messenger system. These receptors have distinct binding affinities for different endothelin isoforms, with some showing a preference for endothelin-1 and others being non-specific, binding to endothelin 1, 2, and 3. They play crucial roles in cardiovascular function, development, and homeostasis.
