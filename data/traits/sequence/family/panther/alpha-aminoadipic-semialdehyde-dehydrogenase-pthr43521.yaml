identifier: PANTHER:PTHR43521
label: "ALPHA-AMINOADIPIC SEMIALDEHYDE DEHYDROGENASE"
definition: >-
  This entry includes ALDH7A1 and related proteins from all domains of life. Mammalian ALDH7A1 (an alpha-aminoadipic semialdehyde dehydrogenase) is homologous to the plant turgor-responsive ALDH protein, an enzyme that protects against various forms of stress, such as salinity, dehydration, and osmotic stress. Mutations in the ALDH7A1 gene cause pyridoxine-dependent epilepsy (PDE).
