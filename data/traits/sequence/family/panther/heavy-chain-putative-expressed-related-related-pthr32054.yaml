label: "HEAVY CHAIN, PUTATIVE, EXPRESSED-RELATED-RELATED"
definition: >-
  HEAVY CHAIN, PUTATIVE, EXPRESSED-RELATED-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32054. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 47 of its annotated subfamilies. Subfamilies participate in chloroplast organization, establishment of organelle localization, cellular localization. Subfamilies localise to intracellular anatomical structure, cytoplasm, cytosol.
