  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of NAD, a crucial coenzyme in redox reactions. Members of this family catalyze the conversion of nicotinate and 5-phospho-D-ribose 1-phosphate into beta-nicotinate D-ribonucleotide, utilizing ATP in the process. The proteins are characterized by a multi-domain structure, including an N-terminal domain, a central catalytic domain, and a distinctive C-terminal domain with a zinc knuckle-like motif. The central domain is responsible for the enzyme's primary function, while the C-terminal domain may play a role in regulation or additional, yet unidentified, functions. The family is a part of the NAPRTase superfamily, which is known for its role in NAD biosynthesis, but this particular group is noted for its significant divergence from other members.
    source: "InterPro:IPR053190 abstract (LLM-generated, not curator-reviewed)"
