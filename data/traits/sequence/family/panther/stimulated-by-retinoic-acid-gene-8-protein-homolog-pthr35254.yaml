identifier: PANTHER:PTHR35254
label: "STIMULATED BY RETINOIC ACID GENE 8 PROTEIN HOMOLOG"
definition: >-
  Stimulated by Retinoic Acid Gene 8 (Stra8) is required for the transition into meiosis in both female and male germ cells. In mammals, Stra8 is expressed in embryonic ovaries just before meiotic initiation, whereas its expression in testes is first detected after birth. Retinoic acid signalling is required for the expression of Stra8 and thereby meiotic initiation in embryonic ovaries.
