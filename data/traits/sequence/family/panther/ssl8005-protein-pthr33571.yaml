identifier: PANTHER:PTHR33571
label: "SSL8005 PROTEIN"
definition: >-
  This family of proteins functions as antitoxins within type VII toxin-antitoxin (TA) systems. They act by neutralizing their cognate toxins through a modification process known as di-AMPylation. This post-translational modification involves the transfer of adenylyl groups to specific targets, which in the context of TA systems, serves to inhibit the activity of the toxins and prevent cell damage or death. The antitoxins in this family are characterized by their ability to perform this enzymatic activity, which is crucial for the regulation of the TA system and the maintenance of cellular stability under stress conditions.
