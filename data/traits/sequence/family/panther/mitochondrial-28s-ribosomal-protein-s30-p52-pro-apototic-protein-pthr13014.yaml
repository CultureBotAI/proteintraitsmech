identifier: PANTHER:PTHR13014
label: "MITOCHONDRIAL 28S RIBOSOMAL PROTEIN S30/P52 PRO-APOTOTIC PROTEIN"
definition: >-
  The entry includes the mitochondrial 28S ribosomal protein mL65 (also known as mitochondrial ribosomal protein MRP-S30), a component of the mitochondrial ribosome small subunit (28S), and the mitochondrial 39S ribosomal protein mL65 (similarly known as mitochondrial ribosomal protein MRP-S30), a component of the mitochondrial large ribosomal subunit (mt-LSU). The mature mammalian 55S mitochondrial ribosome consists of a small (28S) and a large (39S) subunit.
