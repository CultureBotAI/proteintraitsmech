      N-ACETYLMURAMOYL-L-ALANINE AMIDASE AMID — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30417. PANTHER protein class: metabolite interconversion enzyme, hydrolase. Members are annotated with the molecular function hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides. Members participate in peptidoglycan metabolic process, macromolecule catabolic process, carbohydrate derivative catabolic process.
