identifier: PANTHER:PTHR48267
label: "CUPREDOXIN SUPERFAMILY PROTEIN"
definition: >-
  Copper is one of the most prevalent transition metals in living organisms and its biological function is intimately related to its redox properties. Since free copper is toxic, even at very low concentrations, its homeostasis in living organisms is tightly controlled by subtle molecular mechanisms. In eukaryotes, before being transported inside the cell via the high-affinity copper transporters of the CTR family, the copper (II) ion is reduced to copper (I). In blue copper proteins such as cupredoxin, the copper (I) ion form is stabilised by a constrained His2Cys coordination environment. Multicopper oxidases oxidise their substrate by accepting electrons at a mononuclear copper centre and transferring them to a trinuclear copper centre; dioxygen binds to the trinuclear centre and, following the transfer of four electrons, is reduced to two molecules of water. There are three spectroscopically different copper centres found in multicopper oxidases: type 1 (or blue), type 2 (or normal) and type 3 (or coupled binuclear). Multicopper oxidases consist of 2, 3 or 6 of these homologous domains, which also share homology to the cupredoxins azurin and plastocyanin. Structurally, these domains consist of a cupredoxin-like fold, a β-sandwich consisting of 7 strands in 2 β-sheets, arranged in a Greek-key β-barrel. Multicopper oxidases include: Laccase (EC:1.10.3.2) (urishiol oxidase), a 3-domain enzyme found in fungi and plants, which oxidises different phenols and diamines. CueO is a laccase found in Escherichia coli that is involved in copper-resistance. Ascorbate oxidase (EC:1.10.3.3), a 3-domain enzyme found in higher plants. Nitrite reductase (EC:1.7.2.1), a 2-domain enzyme containing type-1 and type-2 copper centres. Fission yeast fio1 (also known as SpAC1F7.08), a multicopp
