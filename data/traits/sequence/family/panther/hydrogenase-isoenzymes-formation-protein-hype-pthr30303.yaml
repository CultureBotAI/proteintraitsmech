identifier: PANTHER:PTHR30303
label: "HYDROGENASE ISOENZYMES FORMATION PROTEIN HYPE"
definition: >-
  This family includes carbamoyl dehydratase HypE (sometimes known as hydrogenase maturation protein HypE or HupE) which is involved in the maturation of [NiFe] hydrogenases. Along with HypF, it catalyzes the synthesis of the CN ligands of the active site iron of [NiFe]-hydrogenases. HypE dehydrates its own carbamoyl moiety in an ATP-dependent process to yield the enzyme thiocyanate. The N-terminal domain of HypE is related to the ATP-binding domains of the AIR synthases, selenophosphate synthetase (SelD), and FGAM synthase and is thought to bind ATP.
definition_source: "InterPro:IPR011854 abstract (PANTHER PTHR30303 is a member signature)"
