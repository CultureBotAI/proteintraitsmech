identifier: PANTHER:PTHR15114
label: "REPLICATION PROTEIN A3"
definition: >-
  REPLICATION PROTEIN A3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15114. Members are annotated with the molecular function damaged DNA binding, single-stranded DNA binding. Members participate in double-strand break repair via homologous recombination, base-excision repair, nucleotide-excision repair. Members localise to chromosome, nuclear lumen, replisome.
