identifier: PANTHER:PTHR42844
label: "DIHYDRONEOPTERIN ALDOLASE 1-RELATED"
definition: >-
  Dihydroneopterin aldolase catalyzes the conversion of 7,8-dihydroneopterin to 6-hydroxymethyl-7,8-dihydropterin in the biosynthetic pathway of tetrahydrofolate. The enzyme form a homo-octamers. Aldolase can use L-threo-dihydroneopterin and D-erythro-dihydroneopterin as substrates for the formation of 6-hydroxymethyldihydropterin, but it can also catalyze the epimerization of carbon 2' of dihydroneopterin and dihydromonapterin at appreciable velocity.
