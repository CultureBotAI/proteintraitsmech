identifier: PANTHER:PTHR34914
label: "LYMPHOCYTE EXPANSION MOLECULE"
definition: >-
  This entry represents the homologues of Ciliary microtubule-associated protein 2 (CIMAP2 formerly lymphocyte expansion molecule - LEM1). CIMAP2 is an axoneme microtubule associated protein (MAP). In the sperm EM structure, it occupies the inter-protofilament cleft between protofilaments A03/A04. It repeats alternately CIMAP3 with along the DMT, resulting in an overall periodicity of 96 nm. CIMAP2 belongs to axonemal wedge-MAPs that bind deeper into the inter-protofilament cleft and make extensive contacts with flanking protofilaments. Expression of these wedge-MAPs is not restricted to the testis suggesting that they may have general functions in cilia.
definition_source: "InterPro:IPR033557 abstract (PANTHER PTHR34914 is a member signature)"
