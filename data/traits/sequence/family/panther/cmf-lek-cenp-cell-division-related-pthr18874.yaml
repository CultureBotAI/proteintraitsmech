identifier: PANTHER:PTHR18874
label: "CMF/LEK/CENP CELL DIVISION-RELATED"
definition: >-
  Mitosin or centromere-associated protein-F (Cenp-F) is a coiled-coil protein that dimerizes and localizes to diverse subcellular locations, including microtubule plus-ends, mitochondria, nuclear pores, and kinetochores. It localizes to kinetochores during mitosis and is then rapidly degraded after mitosis. It is required for kinetochore-microtubule interactions and spindle checkpoint function. Cenp-F contains two microtubule-binding domains, and physically associates with dynein motor regulators. Cenp-F has also been shown to couple mitochondria to dynamic microtubule tips.
definition_source: "InterPro:IPR043513 abstract (PANTHER PTHR18874 is a member signature)"
