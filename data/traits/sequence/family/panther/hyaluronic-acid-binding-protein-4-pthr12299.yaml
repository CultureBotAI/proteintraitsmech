identifier: PANTHER:PTHR12299
label: "HYALURONIC ACID-BINDING PROTEIN 4"
definition: >-
  This entry includes proteins with a hyaluronan/mRNA-binding protein domain, including HABP4 hyaluronan-binding proteins, PAI-RBP1 (also known as SERBP1) and related sequences. HABP4 binds hyaluronan (a glucosaminoglycan), but according to its intracellular localisation, it may not be relevant in vivo. It has binds RNA and regulates transcription and pre-mRNA splicing. SERBP1 is a ribosome-binding protein that promotes ribosome hibernation, a process during which ribosomes are stabilised in an inactive state and preserved from proteasomal degradation. It acts via its association with EEF2/eEF2 factor, sequestering EEF2/eEF2 at the A-site of the ribosome and promoting ribosome stabilisation and storage in an inactive state and it may also play a role in the regulation of mRNA stability: binds to the 3'-most 134 nt of the SERPINE1/PAI1 mRNA, a region which confers cyclic nucleotide regulation of message decay. It seems to play a role in PML-nuclear bodies formation. The orthologue from S. pombe, oga-1, is a ribosome preservation factor that protects a small pool of nontranslating, vacant ribosomes in cells under nutrient starvation conditions. Under nutrient-limiting conditions, cells reduce ribosome biogenesis and degrade ribosomes via autophagy (ribophagy) or proteasomal degradation. It binds specifically G4 quadruplex (these are four-stranded right-handed helices, stabilised by guanine base quartets) and purine motif triplex (characterised by a third, antiparallel purine-rich DNA strand located within the major groove of a homopurine stretch of duplex DNA) nucleic acid structures. These structures may be present at telomeres or in rRNAs. Extends chronological lifespan when overexpressed.
