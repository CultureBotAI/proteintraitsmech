identifier: PANTHER:PTHR43809
label: "NITRITE REDUCTASE (NADH) LARGE SUBUNIT"
definition: >-
  This entry represents Nitrite reductase [NAD(P)H] from Bacillus subtilis and similar enzymes involved in nitrogen and sulfur metabolism from bacteria and fungi. Members of this family are responsible for the reduction of nitrite to ammonia, a step in nitrite assimilation, and the reduction of sulfite to sulfide, crucial for the biosynthesis of L-cysteine from sulfate. These processes are vital for the nitrogen and sulfur cycles in the environment and for the synthesis of essential amino acids in organisms. The family includes proteins with a 4Fe-4S domain, which is indicative of their involvement in electron transfer reactions during the catalysis of these reductions.
definition_source: "InterPro:IPR052034 abstract (PANTHER PTHR43809 is a member signature)"
