identifier: PANTHER:PTHR12651
label: "26S PROTEASOME NON-ATPASE REGULATORY SUBUNIT 9"
definition: >-
  This entry represents non-ATPase regulatory subunit 9 of the 26S proteasome (gene name PSMD9), also known as p27, which is not a component of the assembled 26S proteasome, but is a chaperone required for assembly forming part of the base assembly and of the modulator trimer complex of PSMD9 (p27), PSMC6 (Rpt4) and PSMC3 (Rpt5).
