identifier: PANTHER:PTHR31595
label: "LONG-CHAIN-ALCOHOL O-FATTY-ACYLTRANSFERASE 3-RELATED"
definition: >-
  This entry includes a group of membrane bound O-acyltransferases, including long-chain-alcohol O-fatty-acyltransferase (wax synthases) from plants and fungi and acyl-CoA sterol acyl transferase 1 from Arabidopsis. This entry also includes the fungal Acetyltransferase FUP5 that catalyses the final step of the pathway by adding an acetyl group at the C-24 position of terpestacin to yield fusaproliferin.
