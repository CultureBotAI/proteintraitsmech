definitions:
  - kind: GENERAL
    text: >-
      ATAXIN-7-LIKE PROTEIN 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46367. Members are annotated with the molecular function transcription coactivator activity, transcription regulator activity, transcription coregulator activity. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, positive regulation of RNA biosynthetic process. and localise to SAGA complex, DUBm complex, nuclear protein-containing complex.
