definitions:
  - kind: GENERAL
    text: >-
      ATAXIN-7-LIKE PROTEIN 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46367. Members are annotated with the molecular function transcription coactivator activity, protein-macromolecule adaptor activity. Members participate in positive regulation of DNA-templated transcription, regulation of transcription by RNA polymerase II. Members localise to SAGA complex, DUBm complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The SGF11 family proteins are components of the SAGA complex, a transcription regulatory histone acetylation (HAT) complex that activates transcription by remodeling chromatin and mediating histone acetylation and deubiquitination. Members of the SGF11 family participate in a subcomplex of SAGA that specifically deubiquitinates histone H2B, and are recruited to gene promoters by activators for transcription initiation. They are involved in nuclear receptor-mediated transactivation, mRNA binding and export from the nucleus, counteracting heterochromatin silencing, and are essential for the development of neuronal connectivity and the expression of ecdysone-induced genes.
    source: "InterPro:IPR051078 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
