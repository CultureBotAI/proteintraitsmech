identifier: PANTHER:PTHR33627
label: TRANSPOSASE
definition: >-
  This entry represents a group of transposase IS701-like proteins. They have a DDE domain containing three carboxylate residues that are believed to be responsible for coordinating metal ions needed for catalysis. The catalytic activity of this enzyme involves DNA cleavage at a specific site followed by a strand transfer reaction. IS701 is predicted to have a β-strand insertion domain.
