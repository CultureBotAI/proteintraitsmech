identifier: PANTHER:PTHR35474
label: "ATP PHOSPHORIBOSYLTRANSFERASE REGULATORY SUBUNIT"
definition: >-
  This entry represents a group of plant proteins, including protein SHORT HYPOCOTYL IN WHITE LIGHT 1 (SHW1) from Arabidopsis. SHW1 is a serine-arginine-aspartate rich protein that regulates the abscisic acid (ABA) and light signaling pathways. The shw1 mutants display shorter hypocotyl in the darkness. SHW1 acts as a negative regulator of photomorphogenesis. SHW1 is a transmembrane protein with a nuclear localization signal.
