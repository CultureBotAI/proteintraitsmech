identifier: PANTHER:PTHR47554
label: "SORTING NEXIN MVP1"
definition: >-
  Sorting nexin-8 (SNX8) belongs to the sorting nexin family, which contains a conserved PX (phox homology) domain that is responsible for binding to specific phosphoinositides. It may play a role in intracellular protein transport from early endosomes to the trans-Golgi network. SNX8 yeast counterpart, Mvp1, is required for sorting proteins to the vacuole.
