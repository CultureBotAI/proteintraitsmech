  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the salvage pathway of nucleotide synthesis. They are responsible for the phosphorylation of deoxyribonucleosides, which is a critical step in the generation of deoxyribonucleotide triphosphates (dNTPs) necessary for DNA replication and repair. Members of this family exhibit a range of substrate specificities, with some phosphorylating purine deoxyribonucleosides and others pyrimidine deoxyribonucleosides. Additionally, certain members are known to phosphorylate nucleoside analogs, which are compounds used as antiviral and chemotherapeutic agents.
