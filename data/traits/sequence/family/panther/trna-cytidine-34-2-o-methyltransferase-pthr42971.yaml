identifier: PANTHER:PTHR42971
label: "TRNA (CYTIDINE(34)-2'-O)-METHYLTRANSFERASE"
definition: >-
  This entry represents tRNA (cytidine/uridine-2'-O-)-methyltransferase that methylate the ribose at the nucleotide 34 wobble position in the two leucyl isoacceptors tRNA(Leu)(CmAA) and tRNA(Leu)(cmnm5UmAA). They catalyse the methyl transfer from S-adenosyl-L-methionine to the 2'-OH of the wobble nucleotide. Some uncharacterised plant sequences are also included in this entry.
definition_source: "InterPro:IPR016914 abstract (PANTHER PTHR42971 is a member signature)"
