identifier: PANTHER:PTHR15989
label: VEZATIN
definition: >-
  Vezatin is a peroxisome transmembrane receptor that is involved in membrane-membrane and cell-cell adhesions. In the movement of peroxisomes, it binds to class V and class VIIa myosins to guide the organelle through the microtubules and allow pathogens to internalise themselves into host cells. In mouse cells, vezatin is crucial for spermatozoan production. It interacts with the cadherin-catenin complex bridging it to the C-terminal FERM domain of myosin VIIA.
