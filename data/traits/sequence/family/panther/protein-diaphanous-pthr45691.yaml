identifier: PANTHER:PTHR45691
label: "PROTEIN DIAPHANOUS"
definition: >-
  The Formin Homology family, specifically the Diaphanous subfamily, encompasses proteins that play a crucial role in the regulation of the actin and microtubule cytoskeletons. Members of this family are involved in actin nucleation and elongation, contributing to the assembly of F-actin structures like actin cables and stress fibers. They are essential for processes such as cytokinesis, cell migration, and maintaining cell shape. Some family members also participate in signaling pathways that link Rho GTPases and tyrosine kinases to actin dynamics. Additionally, these proteins can influence microtubule stability and are involved in various cellular functions, including Golgi organization, cilia assembly, and endosome dynamics. The family is characterized by conserved domains such as the FH2 domain, which is critical for actin filament nucleation and elongation, and the DAD domain, which regulates protein activation through autoinhibitory interactions.
