identifier: PANTHER:PTHR45893
label: "POLYCOMB GROUP RING FINGER PROTEIN"
definition: >-
  This family of proteins includes transcriptional repressors that are components of Polycomb group (PcG) multiprotein PRC1-like complexes. These complexes are essential for maintaining the transcriptionally repressive state of numerous genes, such as Hox genes, during development. The proteins act through chromatin remodeling and histone modification, specifically by mediating the monoubiquitination of histone H2A at lysine 119, which leads to heritable changes in chromatin expressibility. Additionally, some family members have roles in regulating the activity of RNF2 ubiquitin ligase within the PRC1-like complex. Certain proteins in this family are also involved in the silencing of one copy of the X chromosome in female mammals and may influence histone demethylation levels.
