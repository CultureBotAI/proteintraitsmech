identifier: PANTHER:PTHR22118
label: "DYNEIN ASSEMBLY FACTOR 3, AXONEMAL"
definition: >-
  Dynein assembly factor 3 (DNAAF3) is required for the assembly of axonemal inner and outer dynein arms. DNAAF3 is involved in preassembly of dyneins into complexes before their transport into cilia.
