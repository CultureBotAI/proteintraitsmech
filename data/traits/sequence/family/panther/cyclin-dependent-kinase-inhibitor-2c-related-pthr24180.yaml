  - kind: GENERAL
    text: >-
      The Ankyrin repeat domain-containing protein 49 family is involved in various cellular processes. Members of this family play roles in spermatogenesis, promoting autophagy in response to serum starvation through the NF-kappaB pathway. They are also implicated in the regulation of planar cell polarity, particularly in the wing, by forming complexes that stabilize partners and promote the activity of key signaling molecules during polarity establishment. Additionally, some family members are involved in the regulation of gene expression, such as inducing HBG1 expression. The family includes proteins that function independently of their canonical roles, such as acting as chaperones in the assembly of the 26S proteasome and participating in signal transduction pathways like the EGF-induced AKT activation. They also have roles in tumorigenesis, apoptosis, and the regulation of tumor suppressors and transcription factors.
    source: "InterPro:IPR051637 abstract (LLM-generated, not curator-reviewed)"
