identifier: PANTHER:PTHR31310
label: "Inositol phosphorylceramide synthase-like"
definition: >-
  This family of proteins includes enzymes that are involved in the biosynthesis of sphingolipids, a class of lipids that play a crucial role in cell membrane structure and function. Members of this family are responsible for catalysing the addition of a phosphorylinositol group to ceramide or dihydroceramide, forming inositol phosphorylceramide or phosphoinositol dihydroceramide, respectively. These reactions are essential steps in the production of complex sphingolipids. The activity of these enzymes is known to be inhibited by specific compounds, indicating a level of regulatory control over sphingolipid synthesis.
definition_source: "InterPro:IPR052185 abstract (PANTHER PTHR31310 is a member signature)"
