  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of the G-protein coupled receptor 1 superfamily. These receptors are typically involved in signal transduction processes and are known for their seven transmembrane helix structure. The family members are characterized by their ability to bind various ligands, which can include hormones, neurotransmitters, and sensory stimuli such as odors. Upon ligand binding, they activate heterotrimeric G-proteins, which then initiate a cascade of intracellular events. Some members of this family are described as probable olfactory receptors, suggesting a role in the detection of odorant molecules, while others are referred to as orphan receptors, indicating that their endogenous ligands have not yet been identified.
    source: "InterPro:IPR052921 abstract (LLM-generated, not curator-reviewed)"
