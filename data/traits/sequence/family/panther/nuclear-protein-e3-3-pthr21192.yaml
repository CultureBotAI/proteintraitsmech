identifier: PANTHER:PTHR21192
label: "NUCLEAR PROTEIN E3-3"
definition: >-
  This entry includes NDUFAF3, an essential factor for the assembly of mitochondrial NADH:ubiquinone oxidoreductase complex (complex I), and the Mth938 domain-containing protein. The crystal structure of NDUFAF3 revealed a 3-layer β+α/β/α topology.
