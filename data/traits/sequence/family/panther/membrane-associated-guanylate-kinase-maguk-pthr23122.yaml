    text: >-
      MEMBRANE-ASSOCIATED GUANYLATE KINASE MAGUK — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23122. PANTHER protein class: scaffold/adaptor protein. and localise to cell junction, cell periphery, membrane.
