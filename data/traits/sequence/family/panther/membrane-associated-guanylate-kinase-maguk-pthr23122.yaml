    text: >-
      MEMBRANE-ASSOCIATED GUANYLATE KINASE MAGUK — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23122. PANTHER protein class: scaffold/adaptor protein. Members localise to cell-cell junction, plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The MAGUK family proteins are multifunctional scaffolding proteins that play pivotal roles in cell polarity, tight junction biogenesis, and synaptic transmembrane protein anchoring. They are involved in various cellular processes including the regulation of neutrophil polarity, epithelial cell polarity, vascular lumen formation, and neuronal progenitor cell survival. These proteins are essential for the correct localization and trafficking of various cellular components, such as adherens junction proteins, myelin proteins, and vesicular markers. They also participate in signal transduction pathways, potentially influencing mTOR signaling and NF-kappa-B activation. Additionally, they have a role in the maintenance and organization of cerebellar progenitor cells and retinal development. The MAGUK family members contain characteristic domains such as PDZ, L27, and PRBH, which mediate their interactions with other proteins and membranes.
    source: "InterPro:IPR050716 abstract (LLM-generated, not curator-reviewed)"
