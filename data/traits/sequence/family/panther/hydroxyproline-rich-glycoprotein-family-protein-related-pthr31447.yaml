identifier: PANTHER:PTHR31447
label: "HYDROXYPROLINE-RICH GLYCOPROTEIN FAMILY PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant dioxygenases, including ALKBH9B and ALKBH10B from Arabidopsis. ALKBH9B and ALKBH10B demethylate RNA by oxidative demethylation: specifically demethylates N6-methyladenosine (m6A) RNA, the most prevalent internal modification of messenger RNA (mRNA) in higher eukaryotes. ALKBH10B-mediated mRNA m6A demethylation stabilizes the mRNA of the key flowering time regulators FT, SPL3 and SPL9, which are involved in the control of floral transition.
definition_source: "InterPro:IPR044842 abstract (PANTHER PTHR31447 is a member signature)"
