  - kind: GENERAL
    text: >-
      The CdhD family is involved in the reversible cleavage of acetyl-CoA, which is a critical step in autotrophic growth from CO2 and growth on acetate as the sole source of carbon and energy. Members of the family are part of a larger acetyl-CoA decarbonylase/synthase (ACDS) complex, contributing to the complex's quaternary structure and function. Additionally, some family members act as methyl group carriers in the Wood-Ljungdahl pathway, which is an anaerobic process for carbon monoxide and carbon dioxide fixation. The family's role is pivotal in the metabolism of autotrophic organisms, facilitating the utilization of inorganic carbon sources and enabling energy production under anaerobic conditions.
