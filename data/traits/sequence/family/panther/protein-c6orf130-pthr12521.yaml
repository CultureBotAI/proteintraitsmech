    text: >-
      PROTEIN C6ORF130 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12521. Members participate in protein modification process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the metabolism of ADP-ribose derivatives. Members of this family exhibit phosphatase activity, specifically hydrolyzing ADP-ribose 1''-phosphate (Appr1p) which is a byproduct of tRNA splicing. Some proteins in this family also display glycohydrolase activity, reversing ADP-ribosylation modifications on DNA or proteins. This modification and its reversal are part of a toxin-antitoxin system, with implications for bacterial survival under stress conditions. Additionally, certain members are capable of removing mono-ADP-ribose from glutamate residues on proteins, but are inactive towards poly-ADP-ribose. The family also includes proteins that can deacetylate O-acetyl-ADP-ribose, a signaling molecule, thus participating in the regulation of post-translational modifications.
    source: "InterPro:IPR050892 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
