identifier: PANTHER:PTHR38438
label: "RIBOFLAVIN TRANSPORTER RIBU"
definition: >-
  This entry represents the riboflavin ECF transporter S component RibU which mediates riboflavin uptake and may also transport FMN and roseoflavin. The crystal structure of RibU from Staphylococcus aureus ( UniProtKB:E5QVT2 ) has been solved, revealing the protein to possess six transmembrane segments and to adopt a previously unreported transporter fold. RibU belongs to the prokaryotic riboflavin transporter family which is a member of the bile/arsenite/riboflavin transporter superfamily. For more information, please refer to the Transporter Classification Database (http://www.tcdb.org/search/result.php?tc=2.A.87). Energy-coupling factor (ECF) transporters consist of a substrate-specific component (known as the S component), and an energy-coupling module. The substrate-binding component is a small integral membrane protein which captures specific substrates and forms an active transporter in the presence of the energy-coupling AT module. The energy coupling module is composed of an ATPase typical of the ATP binding cassette (ABC) superfamily (A component) and a characteristic transmembrane protein (T component). Unlike the ABC transporters, an energy coupling module can be shared between multiple different substrate-binding components.
