identifier: PANTHER:PTHR14493
label: "UNKEMPT FAMILY MEMBER"
definition: >-
  This entry represents a group of RING finger proteins from animals and plants, including Unkempt and related proteins. Unkempt is an evolutionary conserved RNA-binding protein that regulates translation of its target genes and is required for the establishment of the early bipolar neuronal morphology. It carries six CCCH zinc fingers (Znfs) forming two compact clusters, Znf1-3 and Znf4-6, that recognise distinct trinucleotide RNA substrates. These clusters, recognise an unexpectedly short stretch of RNA sequence-only three consecutive ribonucleotides-with a varying degree of specificity. Znf1-3 binds to the UUA motif of RNA substrates. Proteins in this entry also include Zinc finger CCCH domain-containing proteins from Arabidopsis. They are involved in regulating stress responses, light-dependent seed germination and embryogenesis.
definition_source: "InterPro:IPR045234 abstract (PANTHER PTHR14493 is a member signature)"
