identifier: PANTHER:PTHR33142
label: "CYCLIN-DEPENDENT PROTEIN KINASE INHIBITOR SMR13"
definition: >-
  The SIAMESE-RELATED (SMR) family of cyclin-dependent kinase (CDK) inhibitors is a plant-specific family consisting of SIAMESE (SIM) and related proteins. These proteins function as CDK inhibitors and act as repressors of mitosis in the endoreduplication cell cycle. SIM controls endoreplication during trichome development, while SMR2 restricts cell proliferation during leaf growth in Arabidopsis. SIM, SMR1/LGO, and SMR2 play overlapping roles in controlling the transition from cell division to endoreplication and regulate DNA damage checkpoints in response to reactive oxygen species. SMR proteins are functionally conserved across land plants and play crucial roles in cell cycle control.
definition_source: "InterPro:IPR040389 abstract (PANTHER PTHR33142 is a member signature)"
