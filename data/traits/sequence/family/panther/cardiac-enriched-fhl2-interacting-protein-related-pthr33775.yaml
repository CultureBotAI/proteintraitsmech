identifier: PANTHER:PTHR33775
label: "CARDIAC-ENRICHED FHL2-INTERACTING PROTEIN-RELATED"
definition: >-
  This family of proteins is implicated in the regulation of cardiomyocyte hypertrophy. Members are known to interact with the FHL2 protein and play a significant role in the activation of the calcineurin/NFAT signaling pathway, which is crucial for cardiac muscle cell growth and function.
