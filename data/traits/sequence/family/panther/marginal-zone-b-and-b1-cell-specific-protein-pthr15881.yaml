identifier: PANTHER:PTHR15881
label: "MARGINAL ZONE B- AND B1-CELL-SPECIFIC PROTEIN"
definition: >-
  This family of proteins is involved in the immune response by associating with immunoglobulin M (IgM) heavy and light chains to promote IgM assembly and secretion. They may function as molecular chaperones or oxidoreductases, given their low level of oxidoreductase activity. These proteins play a role in diversifying peripheral B-cell functions through the regulation of calcium stores, antibody secretion, and integrin activation. Additionally, they are implicated as hormone-regulated adipokines/pro-inflammatory cytokines, contributing to chronic inflammation, cellular expansion, and the modulation of insulin response in adipocytes, which may be linked to the development of insulin resistance.
