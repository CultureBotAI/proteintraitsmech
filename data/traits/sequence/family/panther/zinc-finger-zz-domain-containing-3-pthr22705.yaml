identifier: PANTHER:PTHR22705
label: "ZINC FINGER, ZZ DOMAIN CONTAINING 3"
definition: >-
  ZZ-type zinc finger-containing protein 3 (ZZZ3) is a component of the ATAC complex. ZZZ3 contains an HTH myb-type domain (PDB:2YUM) and a ZZ-type zinc-finger (PDB:2FC7). The human ADA2A-containing complex (ATAC) is a histone acetyltransferase acting on histones H3 and H4 that is similar to but distinct from a similar complex initially identified in Drosophila melanogaster. The ATAC complex is composed of KAT14, KAT2A, TADA2L, TADA3L, ZZZ3, MBIP, WDR5, YEATS2, CCDC101 and DR1.
