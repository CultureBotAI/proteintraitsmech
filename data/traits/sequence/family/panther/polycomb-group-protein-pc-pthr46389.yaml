identifier: PANTHER:PTHR46389
label: "POLYCOMB GROUP PROTEIN PC"
definition: >-
  This family of proteins includes components of Polycomb group (PcG) multiprotein PRC1-like complexes, which are essential for maintaining the transcriptionally repressive state of various genes, such as Hox genes, during development. These proteins are involved in chromatin remodeling and histone modification, specifically contributing to the monoubiquitination of histone H2A at a conserved lysine residue, which results in a heritable change in chromatin expressibility. Some members may bind to specific chromatin regions, potentially influencing the target specificity of the PRC1 complex. Certain proteins within this family may also have functions independent of the PRC1 complex, such as roles in embryonic stem cells or binding to modified DNA to facilitate repression of specific genomic loci.
