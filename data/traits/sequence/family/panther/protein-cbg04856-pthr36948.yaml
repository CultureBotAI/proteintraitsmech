  - kind: GENERAL
    text: >-
      This family of proteins includes putative acyltransferases that are implicated in the morphogenesis of specific vulval toroid cells in certain organisms. These proteins are believed to be involved in the structural development of the connection between the vulva and the uterus, although they are not essential for determining the fate of vulval cells. The precise biochemical function of these proteins may involve the transfer of acyl groups to various substrates, contributing to cellular and developmental processes.
