identifier: PANTHER:PTHR36451
label: "PAPS-DEPENDENT SULFOTRANSFERASE STF3"
definition: >-
  The Stf3 family is involved in the biosynthesis of sulfomenaquinone (SMK), a compound that plays a role in the regulation of virulence in mycobacteria. Members of the Stf3 family are enzymes that catalyze the sulfonation of omega-hydroxy-beta-dihydromenaquinone-9 using 3'-phosphoadenosine-5'-phosphosulfate (PAPS) as the sulfonate donor. The reaction results in the formation of omega-sulfo-beta-dihydromenaquinone-9, also known as sulfomenaquinone. This sulfonated form of menaquinone is localized in the outer envelope of mycobacteria such as Mycobacterium tuberculosis and Mycobacterium bovis, where it contributes to the modulation of the pathogen's virulence, potentially affecting host-pathogen interactions and the bacterial ability to cause disease.
