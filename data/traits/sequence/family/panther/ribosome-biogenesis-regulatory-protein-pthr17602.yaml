identifier: PANTHER:PTHR17602
label: "RIBOSOME BIOGENESIS REGULATORY PROTEIN"
definition: >-
  RIBOSOME BIOGENESIS REGULATORY PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR17602. PANTHER protein class: ribosomal protein, translational protein. Members participate in endonucleolytic cleavage in ITS1 to separate SSU-rRNA from 5.8S rRNA and LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA), maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA), maturation of 5.8S rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA). Members localise to nucleolus, nuclear lumen, preribosome, large subunit precursor.
