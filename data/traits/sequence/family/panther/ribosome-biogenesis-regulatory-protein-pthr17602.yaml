identifier: PANTHER:PTHR17602
label: "RIBOSOME BIOGENESIS REGULATORY PROTEIN"
definition: >-
  RIBOSOME BIOGENESIS REGULATORY PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR17602. PANTHER protein class: ribosomal protein, translational protein. Members participate in endonucleolytic cleavage of tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA), cellular component biogenesis, ribosomal large subunit biogenesis. Members localise to membrane-enclosed lumen, intracellular non-membrane-bounded organelle, non-membrane-bounded organelle.
