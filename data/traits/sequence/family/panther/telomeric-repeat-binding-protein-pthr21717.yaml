identifier: PANTHER:PTHR21717
label: "TELOMERIC REPEAT BINDING PROTEIN"
definition: >-
  This entry represents a group of plant telomere repeat-binding proteins, including AtTRP1-6 from Arabidopsis and RTBP1 from Oryza sativa subsp. japonica. AtTRP1 binds specifically to the plant telomeric double-stranded DNA sequences 5'-GGTTTAG-3'. It interacts with the ethylene receptor ERS1 and modulates development in Arabidopsis. AtTRP4, also known as AtTBP1 (AT5G13820), is required for telomere length homeostasis and its Myb-extension domain stabilises plant telomeric DNA binding.
