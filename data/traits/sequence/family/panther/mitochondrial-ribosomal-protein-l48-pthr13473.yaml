identifier: PANTHER:PTHR13473
label: "MITOCHONDRIAL RIBOSOMAL PROTEIN L48"
definition: >-
  This entry represents the large ribosomal subunit protein mL48, also known as mitochondrial ribosomal protein L48. It interacts with Oxa1L, a mitochondrial inner membrane protein that facilitates the insertion of both mitochondrial- and nuclear-encoded proteins from the mitochondrial matrix into the inner membrane.
