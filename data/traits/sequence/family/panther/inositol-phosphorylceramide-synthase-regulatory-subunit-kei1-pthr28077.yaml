identifier: PANTHER:PTHR28077
label: "INOSITOL PHOSPHORYLCERAMIDE SYNTHASE REGULATORY SUBUNIT KEI1"
definition: >-
  Kei1 is a subunit of Saccharomyces cerevisiae inositol phosphorylceramide (IPC) synthase. It is localised to the Golgi and is cleaved by the late Golgi processing endopeptidase Kex2. Kei1 is essential for both the activity and the Golgi localization of IPC synthase.
