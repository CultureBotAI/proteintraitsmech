identifier: PANTHER:PTHR37312
label: "MEMBRANE-BOUND ACYLTRANSFERASE YKRP-RELATED"
definition: >-
  This family of proteins is thought to function as acetyltransferases, with a specific role in modifying the fucose component of nodulation factors. These modifications are important in the nodulation process, which is a key aspect of the symbiotic relationship between certain plants and nitrogen-fixing bacteria. The proteins in this family share a commonality in structure, suggesting a conserved mechanism of action in their enzymatic activity.
