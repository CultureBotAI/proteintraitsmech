label: "GENERAL TRANSCRIPTION FACTOR IIH SUBUNIT 2"
definition: >-
  GENERAL TRANSCRIPTION FACTOR IIH SUBUNIT 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12695. PANTHER protein class: general transcription factor. Members participate in nucleotide-excision repair, regulation of transcription by RNA polymerase II. Members localise to transcription factor TFIIH holo complex, nucleoplasm, intracellular protein-containing complex.
