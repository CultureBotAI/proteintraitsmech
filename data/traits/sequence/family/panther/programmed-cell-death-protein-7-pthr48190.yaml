  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of programmed cell death or apoptosis. Members of this family have been shown to promote apoptosis when they are overexpressed. Apoptosis is a critical process in development and homeostasis in multicellular organisms, allowing the body to remove unwanted or damaged cells. Proteins that can induce apoptosis play important roles in immune responses, tissue remodeling, and the suppression of tumorigenesis.
