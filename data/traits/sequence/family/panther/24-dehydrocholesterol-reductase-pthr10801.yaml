identifier: PANTHER:PTHR10801
label: "24-DEHYDROCHOLESTEROL REDUCTASE"
definition: >-
  Delta(24)-sterol reductase, also known as Diminuto/dwarf1 homologue, catalyses the reduction of the delta-24 double bond of sterol intermediates. It exerts an anti-apoptotic function as a reactive oxygen species (ROS) scavenger. This family also includes uncharacterised bacterial proteins.
