identifier: PANTHER:PTHR46706
label: "PROTEIN QUA-1-RELATED"
definition: >-
  This family of proteins includes members that are essential for various developmental patterning events. They function as intercellular signals that are crucial for proper morphological development. One member is specifically required for cuticle shedding and the formation of normal alae structures, which are vital for larval development. Additionally, several members of this family share a similarity with the hedgehog family of proteins, suggesting a conserved role in signaling and developmental processes.
