identifier: PANTHER:PTHR37387
label: "PROTEIN SAMBA"
definition: >-
  SAMBA is a plant-specific negative regulator of the APC/C complex that plays a key role in organ size control. It regulates cell proliferation during early development by targeting CYCLIN A2 for APC/C-mediated proteolysis.
