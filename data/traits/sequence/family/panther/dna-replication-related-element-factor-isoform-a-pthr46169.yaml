  - kind: GENERAL
    text: >-
      This family of proteins is involved in diverse cellular processes including vacuolar processing, morphology, transposase activity, and sumoylation. Members of this family are known to play roles in the regulation of transcription, cell proliferation, and may interact with viral elements during infection. Some proteins within this family have E3 SUMO-protein ligase activity, influencing chromatin remodeling and gene expression by modifying transcriptional repressors. Additionally, they may bind to specific DNA sequences in gene promoters, particularly those of ribosomal proteins, to modulate transcription.
