identifier: PANTHER:PTHR47128
label: "High chlorophyll fluorescence 244-like"
definition: >-
  This entry represents a group of plant and bacterial proteins, including ycf39 from bacteria and HCF244 from Arabidopsis. HCF244/OHP1/OHP2 complex is involved in the photosystem II reaction center assembly and repair. It is required for the recruitment of ribosomes to psbA mRNA, which encodes D1 (PSII reaction center protein).
definition_source: "InterPro:IPR044256 abstract (PANTHER PTHR47128 is a member signature)"
