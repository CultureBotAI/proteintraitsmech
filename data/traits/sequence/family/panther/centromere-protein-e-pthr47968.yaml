identifier: PANTHER:PTHR47968
label: "CENTROMERE PROTEIN E"
definition: >-
  This entry includes kinesin heavy chain and kinesin-like proteins, which are members of the kinesin superfamily (also known as KIFs). KIFs constitute 15 kinesin families. They are important molecular motors that directionally transport various cargos, including membranous organelles, protein complexes and mRNAs. Kinesin is a microtubule-associated force-producing protein that play a role in organelle transport. The kinesin motor activity is directed toward the microtubule's plus end. Kinesin is an oligomeric complex composed of two heavy chains and two light chains. The maintenance of the quaternary structure does not require interchain disulphide bonds.
