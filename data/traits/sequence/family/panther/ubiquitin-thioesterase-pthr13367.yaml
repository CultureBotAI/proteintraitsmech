identifier: PANTHER:PTHR13367
label: "UBIQUITIN THIOESTERASE"
definition: >-
  The protein family includes deubiquitinating enzymes that are involved in various cellular processes such as the regulation of the Wnt signaling pathway, autophagy, cell morphology, cytoskeletal organization, immune and inflammatory responses, and T cell homeostasis. Members of the family possess an OTU domain that mediates deubiquitinating activity, with some showing specificity for 'Lys-29'-, 'Lys-33'-, 'Lys-48'-, 'Lys-63'-, and 'Lys-11'-linked polyubiquitin chains. They are capable of hydrolyzing both linear and branched forms of polyubiquitin. Some members contain RanBP2-type zinc fingers or A20-type zinc fingers that contribute to ubiquitin chain linkage specificity. The family plays a role in terminating NF-kappa-B activity by editing ubiquitin chains on key signaling proteins, thus ensuring transient nature of inflammatory signaling pathways. They are also involved in the regulation of programmed cell death and are essential for the production of pro-inflammatory cytokines in response to pathogens.
