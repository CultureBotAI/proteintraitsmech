identifier: PANTHER:PTHR14740
label: "CASPASE ACTIVITY AND APOPTOSIS INHIBITOR 1"
definition: >-
  CAAP1, or caspase activity and apoptosis inhibitor 1, is a family of eukaryotic proteins involved in the regulation of apoptosis. It modulates a caspase-10 dependent mitochondrial caspase-3/9 feedback amplification loop.
