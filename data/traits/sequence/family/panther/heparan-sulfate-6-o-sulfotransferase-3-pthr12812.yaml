identifier: PANTHER:PTHR12812
label: "HEPARAN SULFATE 6-O-SULFOTRANSFERASE 3"
definition: >-
  This family consists of several heparan sulphate 6-sulphotransferase (HS6ST) proteins. Heparan sulphate 6-O-sulphotransferase (HS6ST) catalyses the transfer of sulphate from adenosine 3'-phosphate, 5'-phosphosulphate to the 6th position of the N-sulphoglucosamine residue in heparan sulphate. This entry also includes protein-tyrosine sulfotransferase, which catalyses the O-sulfation of tyrosine residues within acidic motifs of polypeptides.
