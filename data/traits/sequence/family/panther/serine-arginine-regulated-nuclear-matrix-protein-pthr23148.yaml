definitions:
  - kind: GENERAL
    text: >-
      SERINE/ARGININE REGULATED NUCLEAR MATRIX PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23148. PANTHER protein class: RNA metabolism protein, RNA processing factor. Members are annotated with the molecular function RNA binding, organic cyclic compound binding. and participate in regulation of mRNA splicing, via spliceosome, regulation of macromolecule metabolic process, regulation of nucleobase-containing compound metabolic process. and localise to protein-containing complex, spliceosomal complex, nuclear protein-containing complex.
