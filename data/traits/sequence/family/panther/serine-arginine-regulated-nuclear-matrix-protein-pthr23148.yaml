    method: GENERATED
  - kind: GENERAL
    text: >-
      The Serine/arginine repetitive matrix protein family is involved in various pre-mRNA splicing and processing events. Members of this family are integral components of both pre- and post-splicing multiprotein mRNP complexes and play a role in the splicing of U12-type introns as part of the minor spliceosome. They are known to promote splicing activation, both constitutive and ESE-dependent, by connecting sequence-specific splicing factors with basal snRNP components of the spliceosome. Additionally, they can stimulate mRNA 3'-end cleavage independently of exon junction complex formation and have the ability to bind RNA and DNA with low sequence specificity, showing no marked preference for double- or single-stranded substrates.
    source: "InterPro:IPR052225 abstract (LLM-generated, not curator-reviewed)"
