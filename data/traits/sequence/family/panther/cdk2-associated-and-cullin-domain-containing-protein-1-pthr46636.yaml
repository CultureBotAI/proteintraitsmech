identifier: PANTHER:PTHR46636
label: "CDK2-ASSOCIATED AND CULLIN DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  CDK2-associated and cullin domain-containing protein 1 (CACUL1) interacts with cyclin-dependent kinase 2 (CDK2), which regulates cell proliferation and allows progression from the G1 to S phase of the cell cycle. It has been linked to the proliferation of colorectal carcinoma, lung and gastric cancers.
