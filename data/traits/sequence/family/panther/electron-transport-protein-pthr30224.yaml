identifier: PANTHER:PTHR30224
label: "ELECTRON TRANSPORT PROTEIN"
definition: >-
  This family of proteins includes transcriptional activators that are involved in the regulation of nitrous-oxide reductase genes, such as NosZ. Members of this family are responsible for initiating the transcription of genes that encode for enzymes involved in the reduction of nitrous oxide, a significant step in the denitrification process. Some proteins within this family are also similar to electron transport proteins, suggesting a role in electron transfer processes which may be related to their regulatory functions.
