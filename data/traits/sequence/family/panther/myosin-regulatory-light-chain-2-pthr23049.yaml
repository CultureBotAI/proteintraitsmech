identifier: PANTHER:PTHR23049
label: "MYOSIN REGULATORY LIGHT CHAIN 2"
definition: >-
  The Myosin regulatory light chain family plays a crucial role in muscle contraction and cellular motility. Members of this family are involved in the regulation of actomyosin ATPase activity, which is essential for muscle contraction and cell movement. These proteins are known to undergo phosphorylation, which affects their interaction with actin and myosin, thereby modulating contractile activity. In striated muscle, including cardiac and skeletal muscle, they contribute to the regulation of heart development and function, as well as muscle integrity during early development. In non-muscle cells, they are implicated in processes such as cytokinesis, receptor capping, and cell locomotion. Some members are also involved in calcium-dependent binding, which is essential for the calcium sensitivity of muscle contraction. Overall, the myosin regulatory light chain family is integral to the fine-tuning of muscle cell contractile activity and plays a role in various cellular functions that require controlled movement.
definition_source: "InterPro:IPR050403 abstract (PANTHER PTHR23049 is a member signature)"
