identifier: PANTHER:PTHR44873
label: "DNAJ HOMOLOG SUBFAMILY C MEMBER 30, MITOCHONDRIAL"
definition: >-
  This family of proteins is involved in mitochondrial function, specifically in the regulation of mitochondrial respiration. Members of this family are associated with the ATP synthase complex, aiding in ATP synthesis. They may also have a chaperone-like role in the maintenance of mitochondrial complex I, particularly the N-module subunits. These proteins are implicated in the recognition and removal of damaged subunits caused by oxidative stress, thereby supporting the functional efficiency of complex I.
