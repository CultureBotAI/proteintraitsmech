identifier: PANTHER:PTHR10849
label: "NADH DEHYDROGENASE  UBIQUINONE  IRON-SULFUR PROTEIN 8, MITOCHONDRIAL"
definition: >-
  This entry represents the I subunit (one of 14 subunits, A to N) of the NADH-quinone oxidoreductase complex I ( ) which generally couples NADH and ubiquinone oxidation/reduction in bacteria and mammalian mitochondria, but may act on NADPH and/or plastoquinone in cyanobacteria and plant chloroplasts. This family does not contain 'I' subunits from the closely related F420H2 dehydrogenase and formate hydrogenlyase complexes.
