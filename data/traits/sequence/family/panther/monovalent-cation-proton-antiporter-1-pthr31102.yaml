  - kind: GENERAL
    text: >-
      This family of proteins functions as electroneutral Na(+)/H(+) antiporters that exchange sodium or lithium ions for protons across cellular membranes. They utilize the proton gradient and membrane potential to extrude sodium, contributing to intracellular pH and sodium homeostasis. Members of this family are involved in various physiological processes, including renal tubular function, blood pressure regulation, insulin secretion, clathrin-mediated endocytosis in beta-cells, sperm motility, and fertility. Some members are sperm-specific and play a role in the pH regulation of spermatozoa. The activity of these proteins is allosterically regulated by their N-terminal domain and can be inhibited by compounds such as phloretin. There is some controversy regarding their role in osteoclast differentiation.
