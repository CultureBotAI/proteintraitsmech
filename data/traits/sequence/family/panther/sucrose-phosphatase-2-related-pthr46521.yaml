identifier: PANTHER:PTHR46521
label: "SUCROSE-PHOSPHATASE 2-RELATED"
definition: >-
  The sucrose phosphatase family encompasses enzymes that catalyze the hydrolysis of sucrose-6-phosphate to produce sucrose and inorganic phosphate, representing the final step in the biosynthesis of sucrose. Members of this family are critical for sucrose metabolism in plants, playing a pivotal role in energy storage and transport. The activity of these enzymes is regulated by various factors, including metal ions such as zinc and chelating agents like EDTA. Some family members are specific for sucrose-6-phosphate and are inactive with other potential substrates such as fructose 6-phosphate.
