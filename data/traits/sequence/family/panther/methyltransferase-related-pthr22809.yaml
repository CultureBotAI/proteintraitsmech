identifier: PANTHER:PTHR22809
label: METHYLTRANSFERASE-RELATED
definition: >-
  This family includes tRNA N(3)-methylcytidine methyltransferases METTL2, 6 and 8, O-methyltransferase 3 and methyltransferase-like protein Metl from Drosophila. These proteins are S-adenosyl-L-methionine-dependent methyltransferases that mediate N3-methylcytidine modification of residue 32 of the tRNA anticodon loop of tRNA(Thr) and tRNA(Ser). tRNA N(3)-methylcytidine methyltransferase METTL2, 6 and 8 are part of a group of proteins known as TIPs (from tension-induced/inhibited protein) required for the recruitment of histone acetyltransferase p300 to specific promoters. TIP-6 is involved in the adipogenic cascade. O-methyltransferase 3 is up-regulated by phagocytic stimuli.
