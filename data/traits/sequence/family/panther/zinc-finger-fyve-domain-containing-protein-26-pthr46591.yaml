identifier: PANTHER:PTHR46591
label: "ZINC FINGER FYVE DOMAIN-CONTAINING PROTEIN 26"
definition: >-
  Zinc finger FYVE domain-containing protein 26 (ZFYVE26, also known as SPG15) is a phosphatidylinositol 3-phosphate-binding protein recruited to the midbody during cytokinesis and required for the abcission step in cytokinesis (cleaving of the midbody in two). It may also be required for efficient homologous recombination DNA double-strand break repair. Mutations in ZFYVE26 cause spastic paraplegia 15, autosomal recessive (SPG15), which is a form of spastic paraplegia, a neurodegenerative disorder characterised by a slow, gradual, progressive weakness and spasticity of the lower limbs.
definition_source: "InterPro:IPR028730 abstract (PANTHER PTHR46591 is a member signature)"
