  - kind: GENERAL
    text: >-
      The FAM83 family proteins are implicated in various signaling pathways, including the epidermal growth factor receptor (EGFR) signaling pathway. They are involved in activating downstream signaling cascades such as RAS/MAPK and PI3K/AKT/TOR, independent of EGFR activation. Some family members function as probable proto-oncogenes and are involved in cell proliferation, growth, migration, and epithelial to mesenchymal transition. They may also play roles in chromosome congression and alignment during mitosis, keratin cytoskeleton disassembly, and the structural organization and calcification of developing enamel. Additionally, they interact with other proteins like FBXW7 and KIF22, influencing the expression and signaling of MTOR, JUN, and MYC, and may regulate non-BMP target genes, suggesting roles in multiple signaling pathways.
    source: "InterPro:IPR050944 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
