identifier: PANTHER:PTHR22936
label: RHOMBOID-RELATED
definition: >-
  This group of proteins contain serine peptidases belonging to the MEROPS peptidase family S54 (Rhomboid, clan ST). They are integral membrane proteins related to the Drosophila melanogaster (Fruit fly) rhomboid protein. Members of this family are found in bacteria, archaea, and eukaryotes, mainly plant and fungi. Plant rhomboid-like proteins are rhomboid-type serine proteases that catalyse intramembrane proteolysis. This entry also includes some inactive homologues, such as Inactive RHOMBOID-like protein 8 from Arabidopsis (also known as KOM and KOMPEITO), which is essential for the meiosis stage-specific callose accumulation and pollen exine formation.
definition_source: "InterPro:IPR002610 abstract (PANTHER PTHR22936 is a member signature)"
