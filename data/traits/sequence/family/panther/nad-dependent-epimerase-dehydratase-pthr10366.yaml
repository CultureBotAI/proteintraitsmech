identifier: PANTHER:PTHR10366
label: "NAD DEPENDENT EPIMERASE/DEHYDRATASE"
definition: >-
  This family of proteins includes enzymes that are primarily involved in various biosynthetic pathways, including the production of flavonoids, lignin, meroterpenoids, and other polyketide-derived compounds. Members of this family function as oxidoreductases, often utilising NAD(P)H as a cofactor to catalyse the reduction of ketones and aldehydes to secondary alcohols. They play crucial roles in plant defense mechanisms, the formation of pigments, and the regulation of plant hormone levels. Some family members are also involved in the detoxification of harmful compounds and the biosynthesis of steroidal hormones in animals.
