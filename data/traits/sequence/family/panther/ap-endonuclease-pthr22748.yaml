identifier: PANTHER:PTHR22748
label: "AP ENDONUCLEASE"
definition: >-
  AP endonucleases can be classified into two families based on sequence similarity. This family contains members of AP endonuclease family 1. They are endonucleases that remove the damaged DNA at cytosines and guanines by cleaving on the 3'-side of the AP site by a beta-elimination reaction. The proteins contain glutamate which has been shown in the Escherichia coli enzyme to bind a divalent metal ion such as magnesium or manganese. DNA damaging agents such as the anti-tumour drugs bleomycin and neocarzinostatin or those that generate oxygen radicals produce a variety of lesions in DNA. Amongst these is base-loss which forms apurinic/apyrimidinic (AP) sites or strand breaks with atypical 3' termini. DNA repair at the AP sites is initiated by specific endonuclease cleavage of the phosphodiester backbone. Such endonucleases are also generally capable of removing blocking groups from the 3' terminus of DNA strand breaks.
definition_source: "InterPro:IPR004808 abstract (PANTHER PTHR22748 is a member signature)"
