  - kind: GENERAL
    text: >-
      This family of proteins is involved in lipid trafficking within plant cells, specifically facilitating the movement of lipids from the outer to the inner envelope of plastids. Members of this family play a critical role in the assembly of thylakoid lipids by acting as a bridge between the TGD4 protein and the TGD1,2,3 transport complex. They are essential for the eukaryotic pathway that transports lipids from the endoplasmic reticulum to the plastid, which is a key process in the biogenesis of thylakoid membranes in chloroplasts.
    source: "InterPro:IPR053288 abstract (LLM-generated, not curator-reviewed)"
