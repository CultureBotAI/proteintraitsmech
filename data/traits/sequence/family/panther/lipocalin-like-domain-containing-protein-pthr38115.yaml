identifier: PANTHER:PTHR38115
label: "LIPOCALIN-LIKE DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes enzymes that are involved in the biosynthesis of complex natural products with antibiotic properties. Members of this family function as pericyclases, which catalyze key steps in the formation of macrocyclic and polycyclic compounds. Specifically, they are implicated in a Diels-Alder cycloaddition reaction that forms a decahydrofluorene core structure. These enzymes are part of gene clusters that orchestrate the assembly of fungal secondary metabolites, such as hirsutellone-like compounds and pyrrocidines. The biosynthetic pathways begin with the synthesis of polyketide-tyrosyl acyl thioester precursors and involve multiple enzymatic transformations, including Knoevenagel condensation, oxidative cyclization, and non-enzymatic hydroxylation, leading to the production of bioactive molecules with potential therapeutic applications.
