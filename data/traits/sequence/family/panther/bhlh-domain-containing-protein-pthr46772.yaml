identifier: PANTHER:PTHR46772
label: "BHLH DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents a group of plant transcription factors, including AtbHLH95 (also known as ZHOUPI) from Arabidopsis. It is an endosperm-specific transcription factor necessary for endosperm degradation, embryo growth, embryo-endosperm separation, and normal embryo cuticle formation.
