identifier: PANTHER:PTHR45779
label: "PEPTIDYLPROLYL ISOMERASE"
definition: >-
  This entry includes FKBP2/11 and related proteins from bacteria, animals, fungi and plants. They are PPIases (peptidyl-prolyl cis-trans isomerases) that catalyse the cis-trans isomerization of proline imidic peptide bonds in oligopeptides and accelerate the folding of proteins.
