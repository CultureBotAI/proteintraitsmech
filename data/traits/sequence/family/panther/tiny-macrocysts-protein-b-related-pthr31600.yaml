  - kind: GENERAL
    text: >-
      This family of proteins includes regulators of the cAMP signaling pathway that are specific to sexual development in certain eukaryotic organisms. Members of this family are involved in controlling the levels of extracellular cAMP, which is a key second messenger in many biological processes. They achieve this by influencing the expression of enzymes responsible for cAMP degradation and their respective inhibitors, thereby modulating the signal transduction pathways that rely on cAMP as a signaling molecule.
