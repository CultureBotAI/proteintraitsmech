identifier: PANTHER:PTHR45348
label: "HYPOTHETICAL OXIDOREDUCTASE (EUROFUNG)"
definition: >-
  This family includes a group of trans-enoyl reductases predominantly found in fungi which are part of gene clusters that mediate the biosynthesis of secondary metabolites, including PoxP involved in the synthesis of the cytotoxic compound oxaleimide, TenC which mediates tenellin-type 2-pyridones synthesis, iron-chelating compounds involved in iron stress tolerance, competition with the natural competitor fungus Metarhizium robertsii and insect hosts infection. Lovastatin nonaketide synthase, enoyl reductase component lovC is also part of this family, which mediates the biosynthesis of lovastatin, a hypolipidemic inhibitor of HMG-CoA reductase. Members of this entry contain a GRoES-like fold at the N-terminal and a classical NAD- and NADP-binding domain with a Rossmann fold at the C-terminal.
definition_source: "InterPro:IPR047122 abstract (PANTHER PTHR45348 is a member signature)"
