identifier: PANTHER:PTHR46120
label: "BETAINE--HOMOCYSTEINE S-METHYLTRANSFERASE 1"
definition: >-
  This family of proteins is involved in the metabolic process of homocysteine regulation. Members of this family catalyse the transfer of a methyl group from betaine to homocysteine, resulting in the formation of dimethylglycine and methionine. This enzymatic activity is crucial for maintaining homocysteine levels within a narrow range, which is important for cardiovascular and neurological health. Additionally, the reaction mediated by these proteins is necessary for the irreversible oxidation of choline, a key step in the metabolism of this essential nutrient. Some family members utilise S-methylmethionine as a methyl donor instead of betaine, converting homocysteine directly to methionine. The activity of these enzymes can be modulated by various compounds, including dimethylglycine and methylthioacetate, which act as inhibitors. Proteins in this group are mainly found in vertebrates.
definition_source: "InterPro:IPR051524 abstract (PANTHER PTHR46120 is a member signature)"
