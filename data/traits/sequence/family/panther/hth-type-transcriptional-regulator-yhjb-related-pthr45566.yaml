identifier: PANTHER:PTHR45566
label: "HTH-TYPE TRANSCRIPTIONAL REGULATOR YHJB-RELATED"
definition: >-
  This family includes DNA-binding transcriptional activator EvgA and the putative HTH-type transcriptional regulator YhjB from Escherichia coli, Glycerol metabolism activator from Pseudomonas putida (AgmR) and similar bacterial proteins. EvgA is a member of the two-component regulatory system EvgS/EvgA, which is involved in regulating the expression of glutamate-dependent acid resistance genes, acting in concert with transcription factors YdeO and GadE. It may control expression of multi-drug transporter mdtEF and other multi-drug efflux systems. Its overexpression can confer resistance to antibiotics such as beta-lactams, probably as a result of up-regulation of multi-drug efflux systems. AgmR is a positive activator for glycerol metabolism and a general regulator of quinoprotein ethanol oxidation.
