label: "LOG FAMILY PROTEIN YJL055W"
definition: >-
  LOG FAMILY PROTEIN YJL055W — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31223. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 31 of its annotated subfamilies. Subfamilies are annotated with the molecular function hydrolase activity, acting on glycosyl bonds. Subfamilies participate in hormone biosynthetic process, amine metabolic process. Subfamilies localise to intracellular anatomical structure, cytoplasm, cytosol.
