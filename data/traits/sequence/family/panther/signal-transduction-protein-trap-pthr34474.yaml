    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the utilization of heme from host organisms by bacterial pathogens. Members of this family catalyze the oxidative degradation of the heme macrocyclic porphyrin ring to different products, including biliverdin and staphylobilin, depending on the species. This process also results in the release of free iron, which is a critical nutrient for the bacteria. The activity of these proteins supports bacterial survival and pathogenesis by providing access to iron, which is often limited within the host environment. Some members of this family are also implicated in the regulation of virulence factors and biofilm formation, contributing to the pathogenicity of the bacteria.
    source: "InterPro:IPR050404 abstract (LLM-generated, not curator-reviewed)"
