identifier: PANTHER:PTHR13538
label: "N-ACETYLTRANSFERASE 6"
definition: >-
  N-alpha-acetyltransferase 80 (NAA80, also known as Fus2) is a tumour suppressor. It has been shown to acetylate the N terminus of processed forms of beta- and gamma-actin. Actin N-terminal acetylation has been found to regulate cytoskeletal dynamics and motility.
