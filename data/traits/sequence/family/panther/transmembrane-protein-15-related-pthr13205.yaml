identifier: PANTHER:PTHR13205
label: "TRANSMEMBRANE PROTEIN 15-RELATED"
definition: >-
  Dolichol kinase catalyses the CTP-mediated phosphorylation of dolichol in eukaryotic cells, the terminal step in dolichyl monophosphate (Dol-P) biosynthesis de novo. Dol-P serves as a glycosyl carrier lipid in the assembly of N-linked glycoproteins, glycosylphosphatidylinositol anchors, and the C- and O-mannosylation of proteins in the endoplasmic reticulum (ER) of yeast and animal cells. Phytol kinase catalyses the CTP-dependent phosphorylation of phytol to phytylmonophosphate (PMP) and has a role in tocopherol biosynthesis in plants. Both of these enzymes belong to the polyprenol kinase family.
definition_source: "InterPro:IPR032974 abstract (PANTHER PTHR13205 is a member signature)"
