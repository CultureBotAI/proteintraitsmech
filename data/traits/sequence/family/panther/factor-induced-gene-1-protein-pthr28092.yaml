identifier: PANTHER:PTHR28092
label: "FACTOR-INDUCED GENE 1 PROTEIN"
definition: >-
  This entry includes cell fusion protein Dni1 from fission yeasts and Fig1 from budding yeasts. Dni1 is a cell membrane protein which plays a relevant role in coordinating membrane organization and cell wall remodeling during mating. Fig1 is a integral membrane protein that facilitates Ca2+ influx and cell fusion during mating of Saccharomyces cerevisiae.
