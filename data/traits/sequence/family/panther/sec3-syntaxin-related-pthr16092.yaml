identifier: PANTHER:PTHR16092
label: SEC3/SYNTAXIN-RELATED
definition: >-
  SEC3/SYNTAXIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16092. PANTHER protein class: SNARE protein. Members are annotated with the molecular function phosphatidylinositol bisphosphate binding, phosphatidylinositol-4,5-bisphosphate binding. and participate in localization within membrane, exocytosis, Golgi vesicle transport. and localise to exocyst, protein-containing complex, cell cortex.
