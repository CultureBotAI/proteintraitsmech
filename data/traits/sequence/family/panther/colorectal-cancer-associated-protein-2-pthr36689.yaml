identifier: PANTHER:PTHR36689
label: "COLORECTAL CANCER-ASSOCIATED PROTEIN 2"
definition: >-
  POU class 2 homeobox associating factor 3 (protein OCAT2, also known as colorectal cancer-associated protein 2 (COLCA2)) is expressed in cytoplasm of many cell types of epithelial (normal and tumoral), lymphoid, myeloid, mesenchymal and other origins and has orthologs in multiple mammals. It is a transcriptional coactivator that specifically associates with POU2F3 and forms a complex that drives the development of tuft cells, a rare a rare chemosensory cells that coordinate immune and neural functions within mucosal epithelial tissues. It has been suggested to have critical functions in suppressing tumor formation in epithelial cells. High levels of OCAT2 in immune and other cells of the micro-environment may also provide protection against cancer cell growth.
definition_source: "InterPro:IPR043265 abstract (PANTHER PTHR36689 is a member signature)"
