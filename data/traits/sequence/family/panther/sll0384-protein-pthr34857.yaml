  - kind: GENERAL
    text: >-
      This family of proteins includes transmembrane components of energy-coupling factor (ECF) transporter complexes, which are a type of ATP-binding cassette (ABC) transporter. Unlike classic ABC transporters, ECF transporters do not require external ATP hydrolysis for function, as they harness energy from the transmembrane electrochemical gradient. These proteins are involved in the import of various substrates, such as nickel, cobalt, 5-formyltetrahydrofolate, and thiamine. Some family members are specifically implicated in nickel transport as part of the ECF transporter complex, contributing to metal ion homeostasis.
    source: "InterPro:IPR051611 abstract (LLM-generated, not curator-reviewed)"
