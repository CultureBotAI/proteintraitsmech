identifier: PANTHER:PTHR22996
label: MAHOGUNIN
definition: >-
  This entry represents a group of confirmed and predicted E3 ubiquitin ligases, including MGRN1/RNF157 from humans and LOG2/LUL1-4 from Arabidopsis. MGRN1 is a cytosolic E3 ubiquitin-protein ligase that inhibits signalling through the G protein-coupled melanocortin receptors-1 (MC1R), -2 (MC2R) and -4 (MC4R) via ubiquitylation-dependent and -independent processes. It suppresses chaperone-associated misfolded protein aggregation and toxicity. MGRN1 interacts with cytosolic prion proteins (PrPs) that are linked with neurodegeneration. It also interacts with expanded polyglutamine proteins, and suppresses misfolded polyglutamine aggregation and cytotoxicity. Moreover, MGRN1 inhibits melanocortin receptor signalling by competition with Galphas, suggesting a novel pathway for melanocortin signalling from the cell surface to the nucleus. Furthermore, MGRN1 interacts with and ubiquitylates TSG101, a key component of the endosomal sorting complex required for transport (ESCRT)-I, and regulates endosomal trafficking. A null mutation in the gene encoding MGRN1 causes spongiform neurodegeneration, suggesting a link between dysregulation of endosomal trafficking and spongiform neurodegeneration. RNF157 is a cytoplasmic E3 ubiquitin ligase predominantly expressed in brain. In cultured neurons, it promotes neuronal survival in an E3 ligase-dependent manner. In contrast, it supports growth and maintenance of dendrites independent of its E3 ligase activity. RNF157 interacts with and ubiquitinates the adaptor protein APBB1 (amyloid beta precursor protein-binding, family B, member 1 or Fe65), which regulates neuronal survival, but not dendritic growth downstream of RNF157. The nuclear localisation of APBB1 together with its interaction partner RNA-binding protein SART3 (squamous cell carc
