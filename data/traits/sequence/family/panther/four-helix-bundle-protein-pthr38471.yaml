identifier: PANTHER:PTHR38471
label: "FOUR HELIX BUNDLE PROTEIN"
definition: >-
  This family consists of bacterial proteins encoded within an intervening sequence present within some 23S rRNA genes. It folds into an anti-parallel four-helix bundle and forms homopentamers.
