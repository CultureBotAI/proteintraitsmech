identifier: PANTHER:PTHR21727
label: "PHOSPHORYLATED CTD INTERACTING FACTOR 1"
definition: >-
  PCIF1 is a cap-specific adenosine methyltransferase that catalyzes formation of N6,2'-O-dimethyladenosine cap (m6A(m)) by methylating the adenosine at the second transcribed position of capped mRNAs. It contains a WW domain that interacts with phosphorylated RNA polymerase II carboxy-terminal domain (CTD). The WW domain of PCIF1 can directly and preferentially bind to the phosphorylated CTD compared to the unphosphorylated CTD.
definition_source: "InterPro:IPR039881 abstract (PANTHER PTHR21727 is a member signature)"
