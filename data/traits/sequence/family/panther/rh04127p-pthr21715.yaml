  - kind: GENERAL
    text: >-
      This family of proteins is implicated in the asexual blood stage of a parasitic lifecycle, where they play a role in the invasion of host erythrocytes. They achieve this by interacting with a specific host cell surface protein, which facilitates the entry of the parasite into the red blood cells without the need for sialic acid. The interaction is a critical step in the parasite's ability to proliferate within the host and is essential for its survival and continued infection.
