identifier: PANTHER:PTHR46301
label: "F-BOX/KELCH-REPEAT PROTEIN"
definition: >-
  F-BOX/KELCH-REPEAT PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46301. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 31 of its annotated subfamilies. Subfamilies are annotated with the molecular function ubiquitin-protein transferase activity. Subfamilies participate in SCF-dependent proteasomal ubiquitin-dependent protein catabolic process, proteolysis, nitrogen compound metabolic process.
