identifier: PANTHER:PTHR42943
label: "GLUTATHIONE S-TRANSFERASE KAPPA"
definition: >-
  The GST superfamily Kappa and NadH families are involved in various metabolic pathways. The Kappa family members, such as Glutathione S-transferase kappa 1 and kappa 2, primarily catalyze the conjugation of glutathione to a range of exogenous and endogenous compounds, facilitating their detoxification. This activity includes significant conjugating activity with substrates like 1-chloro-2,4-dinitrobenzene. Additionally, kappa 2 members are implicated in respiratory and lipid metabolism. The NadH family members, identified as 2-hydroxychromene-2-carboxylate isomerases, participate in the naphthalene catabolic pathway by catalyzing the reversible glutathione-dependent isomerization of specific substrates. They are also regulated by compounds such as salicylate, indicating a responsive adaptation to environmental or cellular conditions.
