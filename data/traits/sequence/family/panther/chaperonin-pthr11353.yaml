identifier: PANTHER:PTHR11353
label: CHAPERONIN
definition: >-
  Protein folding is generally thought to result solely from properties inherent in the polypeptide primary sequence. However, additional proteins known as molecular chaperones are sometimes required to mediate correct folding and subsequent oligomer assembly. These chaperones bind to specific protein surfaces, preventing incorrect folding and the formation of non-functional structures.T-complex protein 1 (TCP-1) is a highly conserved cytosolic molecular chaperone. TCP-1 has also been shown to associate with Golgi membranes and microtubules, the latter suggesting a role in mitotic spindle formation during cell division, particularly in sperm where it is highly abundant. Structurally, TCP-1 forms a double-ring complex comprising 6-8 subunits per ring, similar to the architecture of the 10 kDa and 60 kDa chaperonins. The amino acid sequence shows significant similarity to the 60 kDa chaperonin and to TF55, a chaperone from the archaeon Sulfolobus shibatae.
