identifier: PANTHER:PTHR39965
label: "CRISPR SYSTEM CMR SUBUNIT CMR6"
definition: >-
  The CRISPR-Cas system is a prokaryotic defence mechanism against foreign genetic elements. The key elements of this defence system are the Cas proteins and the CRISPR RNA. This family represents a family of Cas proteins that includes TM1791. This family is both closely related to and frequently encoded next to the TM1792 family of Cas proteins. The two proteins are fused in an example from Methanopyrus kandleri (UniProtKB:Q8TVU2), where it is describes as a predicted component of a thermophile-specific DNA repair system containing contains two domains of the RAMP family.
definition_source: "InterPro:IPR010172 abstract (PANTHER PTHR39965 is a member signature)"
