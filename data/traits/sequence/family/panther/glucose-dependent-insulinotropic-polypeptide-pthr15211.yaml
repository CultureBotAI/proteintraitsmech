identifier: PANTHER:PTHR15211
label: "GLUCOSE-DEPENDENT INSULINOTROPIC POLYPEPTIDE"
definition: >-
  Gastric inhibitory polypeptide or glucose-dependent insulinotropic polypeptide (GIP) is a hormone released from duodenal K cells in a glucose-dependent manner. It is considered an incretin hormone as it stimulates the secretion of insulin in the presence of elevated glucose; the other incretin being glucagon-like peptide-1 (GLP-1). It acts through the GIP receptor (GIPR) expressed in pancreatic beta-cells. GIP plays a role in glucose and lipid metabolism. It increases lipoprotein lipase (LPL) expression and activity, and promotes fatty acid incorporation and synthesis. It is associated with obesity and insulin resistance.
definition_source: "InterPro:IPR039078 abstract (PANTHER PTHR15211 is a member signature)"
