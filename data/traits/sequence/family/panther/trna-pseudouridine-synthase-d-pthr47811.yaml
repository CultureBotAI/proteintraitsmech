  - kind: GENERAL
    text: >-
      TRNA PSEUDOURIDINE SYNTHASE D — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47811. PANTHER protein class: RNA metabolism protein, RNA processing factor. Members are annotated with the molecular function isomerase activity, intramolecular transferase activity. and participate in cellular aromatic compound metabolic process, pseudouridine synthesis. and localise to cytoplasm, cytosol.
