identifier: PANTHER:PTHR42735
label: "Group II Amino Acid Decarboxylases"
definition: >-
  The Group II Decarboxylase family comprises enzymes that catalyse the decarboxylation of various amino acids, playing key roles in metabolic pathways. Members of the MfnA subfamily primarily decarboxylate L-tyrosine and L-aspartate, contributing to methanofuran biosynthesis and coenzyme A production, respectively. The Sphingosine-1-phosphate lyase subfamily members cleave phosphorylated sphingoid bases into fatty aldehydes and phosphoethanolamine, impacting lipid homeostasis, apoptosis, and stress responses. The Tyrosine decarboxylase subfamily is involved in tyramine production, which aids in acid resistance and gastrointestinal colonisation, and can metabolize levodopa, affecting Parkinson's disease treatment. Other family members, such as Tryptophan decarboxylase, are involved in neurotransmitter synthesis. The family's diverse functions reflect its importance in various biological processes, including neurotransmission, stress response, lipid metabolism, and drug metabolism.
definition_source: "InterPro:IPR050477 abstract (PANTHER PTHR42735 is a member signature)"
