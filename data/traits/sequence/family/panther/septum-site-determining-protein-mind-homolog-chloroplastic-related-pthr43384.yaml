definitions:
  - kind: GENERAL
    text: >-
      SEPTUM SITE-DETERMINING PROTEIN MIND HOMOLOG, CHLOROPLASTIC-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43384. Members are annotated with the molecular function nucleoside phosphate binding, hydrolase activity, acting on acid anhydrides, heterocyclic compound binding. and participate in regulation of cell division, negative regulation of cellular process, regulation of cellular process. and localise to cytoplasm, cytosol, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The ParA/MinD family proteins are ATPases involved in various cellular processes, including the correct placement of division sites and the assembly of cellular structures. Members of the family, such as the septum site-determining protein MinD, play a crucial role in inhibiting premature formation of Z ring septums, thereby ensuring proper cell division. Some proteins within the family are also involved in the subcellular localization of biosynthesis apparatus, as seen in cellulose biosynthesis protein BcsQ, which is essential for cellulose production. Other family members, like the antiactivator FleN, regulate flagellar gene expression and maintain flagellar number. The family also includes proteins that regulate the placement and assembly of flagella, and proteins that may be involved in the insertion of nickel into carbon monoxide dehydrogenase. Overall, the ParA/MinD family is characterized by ATP-binding and hydrolysis activities that are central to their regulatory functions in cell division, biosynthesis, and motility.
    source: "InterPro:IPR050625 abstract (LLM-generated, not curator-reviewed)"
