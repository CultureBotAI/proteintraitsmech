  - kind: GENERAL
    text: >-
      SEPTUM SITE-DETERMINING PROTEIN MIND HOMOLOG, CHLOROPLASTIC-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43384. Members are annotated with the molecular function ATP binding, ATP hydrolysis activity, ATP-dependent activity. Members participate in negative regulation of cellular process, regulation of cell division. Members localise to cytoplasmic side of plasma membrane, cytoplasm, cytosol.
