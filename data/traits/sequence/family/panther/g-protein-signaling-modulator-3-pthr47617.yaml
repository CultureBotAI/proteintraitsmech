identifier: PANTHER:PTHR47617
label: "G-PROTEIN SIGNALING MODULATOR 3"
definition: >-
  G-protein-signaling modulator 3 (GPSM3), also known as AGS4 or G18, contains three tandem GoLoco motifs and a LSL motif that interacts with monomeric Gbeta subunits. It interacts with Galpha and Gbeta subunits of heterotrimeric G proteins to regulate downstream intracellular signals initiated by G protein coupled receptors (GPCRs) and has been linked to immune-mediated diseases.
