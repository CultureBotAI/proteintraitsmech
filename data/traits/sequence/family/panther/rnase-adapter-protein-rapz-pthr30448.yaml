identifier: PANTHER:PTHR30448
label: "RNASE ADAPTER PROTEIN RAPZ"
definition: >-
  This entry represents RNase adapter protein RapZ from Escherichia coli and similar bacterial proteins. RapZ plays a central role in RNA-mediated regulation of amino-sugar metabolism. It is a RNA-binding protein that recruits the major endoribonuclease RNase E to sRNAs GlmZ. Bacterial small RNAs (sRNAs) regulate diverse cellular processes; GlmY and GlmZ are sRNAs that act hierarchically to activate mRNA glmS, which encodes glucosamine-6-phosphate (GlcN6P) synthase. RapZ is composed of two domains. The N-terminal domain is similar to P-loop nucleotide/nucleoside kinases whereas the C-terminal domain share similarity with a domain found at C terminus of phosphofructokinases. The C-terminal domain of RapZ is sufficient to bind RNA but on its own is incapable in mediating GlmZ processing.
definition_source: "InterPro:IPR005337 abstract (PANTHER PTHR30448 is a member signature)"
