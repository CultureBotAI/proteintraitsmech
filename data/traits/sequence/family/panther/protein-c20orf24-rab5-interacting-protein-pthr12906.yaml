identifier: PANTHER:PTHR12906
label: "PROTEIN C20ORF24  RAB5-INTERACTING PROTEIN"
definition: >-
  This family represents the Respirasome Complex Assembly Factor 1 (RCAF1, also known as GEL complex subunit OPTI,) a Rab5-interacting protein involved in the assembly of mitochondrial respiratory complexes. It is a component of the multi-pass translocon (MPT) complex that mediates insertion of multi-pass membrane proteins into the lipid bilayer of membranes.
