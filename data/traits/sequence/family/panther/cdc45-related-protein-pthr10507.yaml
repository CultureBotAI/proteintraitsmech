identifier: PANTHER:PTHR10507
label: "CDC45-RELATED PROTEIN"
definition: >-
  CDC45 is an essential gene required for initiation of DNA replication in Saccharomyces cerevisiae (cell division control protein 45), forming a complex with MCM5/CDC46. Homologs of CDC45 have been identified in human, mouse and the smut fungus, Melampsora spp., (tsd2 protein) among others.
