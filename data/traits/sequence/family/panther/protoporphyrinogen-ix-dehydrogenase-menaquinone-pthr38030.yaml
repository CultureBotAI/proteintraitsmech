definitions:
  - kind: GENERAL
    text: >-
      PROTOPORPHYRINOGEN IX DEHYDROGENASE [MENAQUINONE] — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR38030. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function nucleotide binding, carbohydrate derivative binding, oxidoreductase activity, acting on the CH-CH group of donors. Members participate in cellular aromatic compound metabolic process, pigment biosynthetic process, heme biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins catalyzes the 6-electron oxidation of protoporphyrinogen IX to protoporphyrin IX, a key step in the biosynthesis of heme. The reaction is mediated by different electron acceptors depending on the environmental oxygen availability. Under anaerobic conditions, members of this family typically use menaquinone as an electron acceptor, while under aerobic conditions, ubiquinone is used. The activity of these enzymes is crucial for cellular respiration as it is linked to electron transfer across the cell membrane, contributing to ATP synthesis. Some family members have shown the ability to transfer electrons to various reductases and oxidases, highlighting their role in the electron transport chain.
    source: "InterPro:IPR052200 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
