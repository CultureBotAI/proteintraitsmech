identifier: PANTHER:PTHR15860
label: "UNCHARACTERIZED RING FINGER-CONTAINING PROTEIN"
definition: >-
  This family represents E3 ubiquitin-protein ligase (also known as RING finger and transmembrane domain-containing protein) RNFT1 and RNTF2. RNFT1 is an E3 ubiquitin-protein ligase that acts in the endoplasmic reticulum (ER)-associated degradation (ERAD) pathway, a mechanism that protects cells from ER stress-induced apoptosis. Misfolded proteins that have been accumulated in the ER are targeted for ubiquitination and selectively transported to the cytosol for degradation by a ubiquitin-proteasome system. RNTF2 negatively regulates IL-3-dependent cellular responses through IL-3Ralpha ubiquitination and degradation in the proteasome. The RNFT2/IL-3Rα/IL-3 axis may have a role in regulating innate immune responses in the lung.
definition_source: "InterPro:IPR044235 abstract (PANTHER PTHR15860 is a member signature)"
