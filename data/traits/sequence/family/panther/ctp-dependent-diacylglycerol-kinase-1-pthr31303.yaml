identifier: PANTHER:PTHR31303
label: "CTP-DEPENDENT DIACYLGLYCEROL KINASE 1"
definition: >-
  Dgk1 is a diacylglycerol kinase that catalyzes the formation of phosphatidate from diacylglycerol. It uses CTP, instead of ATP, to generate phosphatidate. It counteracts the activity of phosphatidate phosphatase Pah1 at the nuclear envelope by controlling phosphatidate levels. Its activity can be regulated by casein kinase II phosphorylation. This entry also includes uncharacterised bacterial and archaeal proteins.
