identifier: PANTHER:PTHR23019
label: "NUCLEAR PORE MEMBRANE GLYCOPROTEIN GP210-RELATED"
definition: >-
  This entry includes Nuclear pore membrane glycoprotein 210 (NUP210) and related proteins from eukaryotes. They are nucleoporins essential for nuclear pore assembly and fusion, nuclear pore spacing, as well as structural integrity. This entry also includes some uncharacterised proteins from bacteria and viruses.
