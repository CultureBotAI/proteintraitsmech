identifier: PANTHER:PTHR15952
label: EXPORTIN-T/LOS1
definition: >-
  Exportin-T (Xpot) mediates the nuclear export of aminoacylated tRNAs. Its budding yeast homologue, known as Los1, is involved in nuclear export of pre-tRNA and in re-export of mature tRNAs. It binds to RanGTP and mature tRNAs cooperatively to form a nuclear export complex.
