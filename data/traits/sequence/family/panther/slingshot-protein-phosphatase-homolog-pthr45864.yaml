identifier: PANTHER:PTHR45864
label: "SLINGSHOT PROTEIN PHOSPHATASE HOMOLOG"
definition: >-
  Slingshot (SSH) is a cofilin-specific phosphatase. Dephosphorylation reactivates cofilin, which in turn depolymerizes actin and is thus required for actin filament reorganisation. Slingshot is a member of the dual-specificity protein phosphatase family. The N-terminal SSH region may be involved in P-cofilin binding (the model C terminus plus the DEK_C-like domain, which are characterised as the "B" domain in some of the literature), and may be required for the F-actin mediated activation of slingshot.
definition_source: "InterPro:IPR043587 abstract (PANTHER PTHR45864 is a member signature)"
