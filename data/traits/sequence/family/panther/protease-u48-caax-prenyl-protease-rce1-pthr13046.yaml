identifier: PANTHER:PTHR13046
label: "PROTEASE U48 CAAX PRENYL PROTEASE RCE1"
definition: >-
  Rce1 is an integral membrane, metal-dependent endoprotease localized to the endoplasmic reticulum that mediates the cleavage of the carboxyl-terminal three amino acids from CaaX proteins, such as Ras family of small GTPases, the gamma-subunit of heterotrimeric GTPases, nuclear lamins, and protein kinases and phosphatase. It is classified as type II CAAX prenyl protease and is included in peptidase family M79. Its structure has been solved.
