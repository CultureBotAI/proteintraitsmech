identifier: PANTHER:PTHR32080
label: "ANTIFUNGAL PROTEIN GINKBILOBIN-2-LIKE"
definition: >-
  This family of proteins is involved in modulating cell-to-cell trafficking and plays a role in plant innate immunity. Members of this family are implicated in systemic acquired resistance, a defense mechanism that utilizes signaling molecules such as azelaic acid, glycerol-3-phosphate, and salicylic acid. Some proteins within this family are also responsible for callose deposition during immune responses, which affects plasmodesmata permeability. Additionally, certain members exhibit antifungal activity by binding to specific carbohydrates on fungal cell walls, which can interfere with fungal growth and actin remodeling, leading to actin-dependent fungal cell death.
