definitions:
  - kind: GENERAL
    text: >-
      CITRATE/OXOGLUTARATE CARRIER PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46982. PANTHER protein class: secondary carrier transporter, transporter. Members are annotated with the molecular function secondary active transmembrane transporter activity, carboxylic acid transmembrane transporter activity. Members participate in mitochondrial transmembrane transport, carboxylic acid transmembrane transport, citrate transport. Members localise to mitochondrion, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes mitochondrial antiporters that facilitate the transport of various dicarboxylic acids across the mitochondrial membrane. Members of this family are involved in the exchange of citrate and oxoglutarate, and can also transport other substrates such as oxaloacetate, succinate, fumarate, isocitrate, cis-aconitate, and L-malate, albeit with varying efficiencies. These proteins do not exhibit uniporter activity. They play a role in maintaining cellular metabolic balance, particularly in the regulation of citrate levels and the NADPH/NADP(+) ratio, which is crucial under oxidative stress conditions. Some members may also have a role in mitochondrial DNA maintenance, as suggested by their ability to associate with the mitochondrial nucleoid and bind DNA in vitro.
    source: "InterPro:IPR053017 abstract (LLM-generated, not curator-reviewed)"
