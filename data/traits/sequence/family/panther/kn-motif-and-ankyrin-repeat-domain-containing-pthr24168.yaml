identifier: PANTHER:PTHR24168
label: "KN MOTIF AND ANKYRIN REPEAT DOMAIN-CONTAINING"
definition: >-
  This entry represents KN motif and ankyrin repeat domain-containing protein 1 (KANK1-4) from humans and similar animal proteins. KANK1 is involved in the control of cytoskeleton formation by regulating actin polymerization. It inhibits actin fibre formation, cell migration and fibronectin-mediated cell spreading. This protein is involved in the establishment and persistence of cell polarity during directed cell movement in wound healing.. Kank1 from mouse, during cell division, may regulate DAAM1-dependent RHOA activation that signals centrosome maturation and chromosomal segregation. It may also be involved in contractile ring formation during cytokinesis. KANK2 is involved in regulation of caspase-independent apoptosis, in the negative control of vitamin D receptor signalling pathway and in actin stress fibres formation. These proteins have been associated with nephrotic syndrome.
definition_source: "InterPro:IPR047184 abstract (PANTHER PTHR24168 is a member signature)"
