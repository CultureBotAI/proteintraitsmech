identifier: PANTHER:PTHR46562
label: "SERINE/THREONINE-KINASE ULK4-LIKE PROTEIN-RELATED"
definition: >-
  RUNKEL is a microtubule-associated kinase-like protein, also known as Serine/threonine-protein kinase RUNKEL, involved in both phragmoplast-based cytokinesis in somatic cells and syncytial cytokinesis in reproductive cells. RUNKEL may not have kinase activity.
