identifier: PANTHER:PTHR22446
label: "M-PHASE-SPECIFIC PLK1-INTERACTING PROTEIN"
definition: >-
  This entry represents M-phase-specific PLK1-interacting protein and related uncharacterised sequences from vertebrates. M-phase-specific PLK1-interacting protein (also known as TTD non-photosensitive 1 protein, TTDN1) may play a role in maintenance of cell cycle integrity by regulating mitosis or cytokinesis. Its The subcellular location is regulated during cell cycle. During interphase, it is located in the nucleus. During mitosis, it is located at the centrosome and dispersed in the cytoplasm. During telophase, it is located in the midbody. It colocalizes with PLK1 at the centrosome in M phase. It is phosphorylated during mitosis in the cell cycle probably by CDK1.
definition_source: "InterPro:IPR026618 abstract (PANTHER PTHR22446 is a member signature)"
