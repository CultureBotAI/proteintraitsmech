identifier: PANTHER:PTHR23031
label: RHOPHILIN
definition: >-
  This entry represents Rhophilin-1/2 (RHPN1/2) and similar proteins predominantly found in vertebrates. RHPN1/2 bind specifically to GTP-Rho and regulate the actin cytoskeleton through interactions with various downstream effector molecules. RHPN1 is a key regulator of the podocyte cytoskeleton and is essential for glomerular filtration. The isolated Bro1-like domain of Rhophilin-1 ( ) binds human immunodeficiency virus type 1 (HIV-1) nucleocapsid. RHPN2 limit stress fibre formation and/or increase the turnover of F-actin structures in the absence of high levels of RhoA activity.
