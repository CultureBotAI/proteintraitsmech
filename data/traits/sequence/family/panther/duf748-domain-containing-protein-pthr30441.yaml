  - kind: GENERAL
    text: >-
      DUF748 DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30441. and participate in regulation of cellular process, regulation of establishment of protein localization, regulation of protein localization to membrane. and localise to cell periphery, cellular anatomical entity, membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is implicated in the process of outer membrane protein assembly. One member is specifically involved in preventing the assembly of defective versions of the OmpF protein, suggesting a quality control role in the biogenesis of membrane components. The broader function of the family appears to be associated with the assembly or maintenance of outer membrane structures in bacteria.
    source: "InterPro:IPR052894 abstract (LLM-generated, not curator-reviewed)"
