identifier: PANTHER:PTHR12945
label: "TRANSLATION INITIATION FACTOR EIF3-RELATED"
definition: >-
  TRM6, also known as Gcd10 in budding yeasts, is a substrate-binding subunit of tRNA (adenine-N(1)-)-methyltransferase, which catalyses the formation of N(1)-methyladenine at position 58 (m1A58) in initiator methionyl-tRNA.
