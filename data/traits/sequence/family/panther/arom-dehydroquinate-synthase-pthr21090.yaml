identifier: PANTHER:PTHR21090
label: "AROM/DEHYDROQUINATE SYNTHASE"
definition: >-
  AROM/DEHYDROQUINATE SYNTHASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21090. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function transferase activity, transferring alkyl or aryl (other than methyl) groups. Members participate in carboxylic acid biosynthetic process, dicarboxylic acid metabolic process, organic acid biosynthetic process.
