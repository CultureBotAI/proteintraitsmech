  - kind: GENERAL
    text: >-
      The MHC class I and II protein families are integral to the adaptive immune system. MHC class I molecules, including beta-2-microglobulin, are expressed on nearly all nucleated cells and present endogenous peptide antigens to CD8+ T cells, playing a critical role in the immune response to intracellular pathogens and abnormal cells. MHC class II molecules are primarily expressed on professional antigen-presenting cells and present exogenous peptide antigens to CD4+ T cells, facilitating immune responses to extracellular pathogens. Both classes are involved in antigen processing and presentation, crucial for initiating specific immune responses. Immunoglobulin light chains, part of the immunoglobulin family, are essential for antibody diversity and specificity, contributing to the humoral immune response by recognizing and binding antigens.
    source: "InterPro:IPR050160 abstract (LLM-generated, not curator-reviewed)"
