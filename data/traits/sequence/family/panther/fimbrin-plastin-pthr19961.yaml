identifier: PANTHER:PTHR19961
label: FIMBRIN/PLASTIN
definition: >-
  This entry includes fimbrin and plastin from yeasts to humans. They are actin filament-binding proteins that cross-linking actin filaments into tight bundles. Mammlian fimbrin, also known as plastin, has three isoforms: T-plastin (Plastin-3) is expressed in cells from solid tissue, whereas L-plastin (Plastin-2) occurs predominantly in hematopoietic cells. The third isoform, I-plastin (Plastin-1), is specifically expressed in the small intestine, colon and kidney.
