  - kind: GENERAL
    text: >-
      This family of proteins is involved in the organization and stability of the cytoskeleton, specifically through association with microtubules. Members of this family play a crucial role in the formation of the mitotic spindle, which is essential for proper chromosome segregation during cell division. They are also important for the progression of the cell cycle, particularly in neural progenitor cells. A characteristic feature of these proteins is the presence of a KEN box domain, which is necessary for their interaction with the APC/C-Cdh1 complex, leading to their ubiquitination and subsequent degradation.
