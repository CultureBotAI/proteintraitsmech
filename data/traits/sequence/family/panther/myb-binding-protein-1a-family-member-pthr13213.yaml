identifier: PANTHER:PTHR13213
label: "MYB-BINDING PROTEIN 1A FAMILY MEMBER"
definition: >-
  Proteins of this family are predominantly nucleolar. Myb-binding protein 1A (MYBBP1A) is a transcription regulator that may play an important role in the cellular stress response. This family also includes the fifth essential DNA polymerase (Pol5p) of Schizosaccharomyces pombe (Fission yeast) and Saccharomyces cerevisiae (Baker's yeast) (EC:2.7.7.7). Pol5p is localized exclusively to the nucleolus and binds near or at the enhancer region of rRNA-encoding DNA repeating units. This protein was originally thought to be a DNA polymerase, however, later reseach indicated its involvement in ribosome assembly.
