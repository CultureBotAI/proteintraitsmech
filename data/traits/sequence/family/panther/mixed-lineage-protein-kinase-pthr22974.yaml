identifier: PANTHER:PTHR22974
label: "MIXED LINEAGE PROTEIN KINASE"
definition: >-
  MIXED LINEAGE PROTEIN KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22974. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein. and participate in cellular metabolic process, peptidyl-serine modification, signal transduction. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
