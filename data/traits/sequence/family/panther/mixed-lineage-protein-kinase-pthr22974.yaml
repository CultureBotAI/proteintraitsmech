definition: >-
  MIXED LINEAGE PROTEIN KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22974. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity. Members participate in peptidyl-serine phosphorylation, intracellular signal transduction, chromosome segregation. Members localise to nucleus, intracellular anatomical structure.
