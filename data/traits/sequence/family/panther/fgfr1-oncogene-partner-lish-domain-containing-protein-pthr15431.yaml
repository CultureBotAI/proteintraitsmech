label: "FGFR1 ONCOGENE PARTNER/LISH DOMAIN-CONTAINING PROTEIN"
definition: >-
  FGFR1 ONCOGENE PARTNER/LISH DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15431. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies participate in organelle organization, cellular process, cellular component organization. Subfamilies localise to intracellular anatomical structure, centrosome, microtubule organizing center.
