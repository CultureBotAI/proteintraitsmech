identifier: PANTHER:PTHR45956
label: "RUN AND FYVE DOMAIN-CONTAINING PROTEIN 2-LIKE PROTEIN"
definition: >-
  This entry represents a group of proteins from animals, including RUN and FYVE domain-containing protein 1-3 (RUNFY1-3) from mammals. RUFY1, also called Rab4-interacting protein (Rabip4), is an homologue of mouse Rabip4, an effector of Rab4 GTPase that regulates recycling of endocytosed cargo. RUFY1 is an endosomal protein that functions as a dual effector of Rab4 and Rab14 and is involved in efficient recycling of transferrin (Tfn). It is a downstream effector of Etk, a downstream tyrosine kinase of PI3-kinase that is involved in regulation of vesicle trafficking. RUFY1 contains an N-terminal RUN domain and a C-terminal FYVE domain with two coiled-coil domains in-between. RUFY2 is a novel embryonic factor that contains an N-terminal RUN domain and a C-terminal FYVE domain with two coiled-coil domains in-between. It is present in the nucleus at early stages of embryonic development. It may have both endosomal functions in the cytoplasm and nuclear functions. It is a paralogue of RUFY1. RUFY3, also called Single axon-regulated protein (Singar), is an N-terminal RUN domain and a C-terminal FYVE domain containing protein predominantly expressed in the brain. It suppresses formation of surplus axons for neuronal polarity. Unlike other RUFY proteins, RUFY3 can associate with the GTP-bound active form of Rab5. RUFY3 plays a role in the formation of F-actin-enriched protrusive structures at the cell periphery, in cytoskeletal organisation, and in the generation of neuronal polarity formation and axon growth. This protein promotes gastric cancer cell migration and invasion in a PAK1-dependent manner.
