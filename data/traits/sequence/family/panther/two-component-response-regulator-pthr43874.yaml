identifier: PANTHER:PTHR43874
label: "TWO-COMPONENT RESPONSE REGULATOR"
definition: >-
  Plant response regulators (RRs, called ARRs in Arabidopsis thaliana) are a class of MYB-type transcription factors that act as major players in the transcriptional activation of cytokinin-responsive genes. They directly regulate the expression of type-A ARR genes and other downstream target genes. Cytokinin is a plant hormone implicated in many growth and development processes including shoot organogenesis, leaf senescence, sink/source relationships, vascular development, lateral bud release, and photomorphogenic development. Cytokinin signaling involves a phosphorelay cascade by histidine kinase receptors (AHKs), histidine phosphotransfer proteins (AHPs) and downstream ARRs. ARRs are divided into two groups, type-A and -B, according to their sequence and domain structure. Type-A ARRs contain a central receiver domain along with short N- and C-terminal extensions and are transcriptionally induced by cytokinin. Type-B ARRs contain a receiver domain followed by a DNA binding domain and function as transcription factors.
definition_source: "InterPro:IPR045279 abstract (PANTHER PTHR43874 is a member signature)"
