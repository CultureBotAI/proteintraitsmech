identifier: PANTHER:PTHR11105
label: "CITRATE LYASE SUBUNIT BETA-RELATED"
definition: >-
  Mitochondrial citramalyl-CoA lyase converts citramalyl-CoA into acetyl-CoA and pyruvate in the C5-dicarboxylate catabolism pathway. It is indirectly involved in vitamin B12 metabolism.
