  - kind: GENERAL
    text: >-
      Alpha-tectorins are major non-collagenous components of the tectorial membrane, an extracellular matrix in the inner ear. The tectorial membrane overlays the neuroepithelium of the cochlea and makes contact with the stereocilia of sensory hair cells. Alpha-tectorins play a crucial role in hearing by facilitating the movement of hair cells in response to sound, which in turn deflects the stereocilia and converts sound waves into electrical signals within the hair cells. The presence of a zona pellucida domain suggests that alpha-tectorins may also be involved in filament formation, contributing to the structural integrity of the tectorial membrane.
    source: "InterPro:IPR052749 abstract (LLM-generated, not curator-reviewed)"
