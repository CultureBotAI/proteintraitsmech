identifier: PANTHER:PTHR12618
label: "PHD AND RING FINGER DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This entry represents a group of eukaryotic proteins, including PHD and RING finger domain-containing protein 1 from human and its orthologue from S. pombe. The function of these proteins is unknown. This entry also includes Autophagy-related protein 36 (also known as Atg35) from Komagataella phaffii, a micropexophagy-specific protein required for efficient micropexophagic apparatus (MIPA) formation but not for general autophagy.
