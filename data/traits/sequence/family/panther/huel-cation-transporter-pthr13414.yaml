identifier: PANTHER:PTHR13414
label: "HUEL-CATION TRANSPORTER"
definition: >-
  This entry includes proton-coupled zinc ion antiporters which mediate the export of zinc from the mitochondria, being involved in intracellular zinc homeostasis, zinc mobilisation as well as mitochondrial morphology and health. A mutation in the human gene leads to an autosomal recessive cerebro-renal syndrome associated with early-onset neurological deterioration, severe intellectual disability, profound ataxia, camptocormia and oculomotor apraxia. An uncharacterised homologue from Arabidopsis thaliana is known as metal tolerance protein C4 (MTPC4).
definition_source: "InterPro:IPR040177 abstract (PANTHER PTHR13414 is a member signature)"
