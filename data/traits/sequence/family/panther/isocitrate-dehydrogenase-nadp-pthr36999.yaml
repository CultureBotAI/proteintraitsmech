identifier: PANTHER:PTHR36999
label: "ISOCITRATE DEHYDROGENASE [NADP]"
definition: >-
  This family of enzymes catalyses the NADP(+)-dependent oxidative decarboxylation of isocitrate to form 2-oxoglutarate, CO2, and NADPH within the Krebs cycle (EC:1.1.1.42). Thus this enzyme supplies the cell with a key intermediate in energy metabolism, and precursors for biosynthetic pathways. The activity of this enzyme, which is controlled by phosphorylation, helps regulate carbon flux between the Krebs cycle and the glyoxylate bypass, which is an alternate route that accumulates carbon for biosynthesis when acetate is the sole carbon source for growth. The phosphorylation state of this enzyme is controlled by isocitrate dehydrogenase kinase/phosphatase. This family has been found in a number of bacterial species including Azotobacter vinelandii, Corynebacterium glutamicum, Rhodomicrobium vannielii, and Neisseria meningitidis. The structure of isocitrate dehydrogenase from Azotobacter vinelandii (UniProtKB:P16100) has been determined. This molecule consists of two distinct domains, a small domain and a large domain, with a folding topology similar to that of dimeric isocitrate dehydrogenase from Escherichia coli (UniProtKB:P08200). The structure of the large domain repeats a motif observed in the dimeric enzyme. Such a fusional structure by domain duplication enables a single polypeptide chain to form a structure at the catalytic site that is homologous to the dimeric enzyme, the catalytic site of which is located at the interface of two identical subunits.
