      EZH INHIBITORY PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22467.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes inhibitors of the PRC2 complex, which consists of EED, EZH1, and EZH2 components. Members of this family negatively regulate the methyltransferase activity of EZH1 and EZH2, leading to decreased levels of histone H3 trimethylation at lysine 27 (H3K27me3). This action is thought to occur through the modulation of PRC2 cofactors such as AEBP2 and JARID2, which normally stimulate the complex's activity. The inhibition of H3K27me3 deposition by these proteins plays a crucial role during the development of gametes, specifically in spermatogenesis and oogenesis.
    source: "InterPro:IPR052882 abstract (LLM-generated, not curator-reviewed)"
