identifier: PANTHER:PTHR40516
label: "ANTITOXIN CHPS-RELATED"
definition: >-
  This family includes antitoxin components of a type II toxin-antitoxin (TA) system belongig to the PemI family. The PemI/PemK plasmid addiction system consists of PemK, an endoribonuclease toxin, and its cognate antitoxin, PemI. Toxin PemK inhibits cell growth by acting as an endoribonuclease, and antitoxin PemI prevents PemK activity by direct binding. PemI and PemK, found in E. coli plasmid R100, are responsible for its stable inheritance during cell division. Other antitoxins in this family are MazE and ChpS. These are part of chromosomal addiction modules. The mechanism of antidote-toxin recognition is common to both chromosomal and plasmid-borne addiction modules.
definition_source: "InterPro:IPR039052 abstract (PANTHER PTHR40516 is a member signature)"
