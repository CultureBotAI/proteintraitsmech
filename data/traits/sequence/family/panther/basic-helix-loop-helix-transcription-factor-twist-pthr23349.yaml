definitions:
  - kind: GENERAL
    text: >-
      BASIC HELIX-LOOP-HELIX TRANSCRIPTION FACTOR, TWIST — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23349. PANTHER protein class: basic helix-loop-helix transcription factor. Members are annotated with the molecular function RNA polymerase II transcription regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family functions as transcriptional regulators with diverse roles in development, differentiation, and metabolism. Members of the family are characterized by their ability to bind E-box consensus sequences (5'-CANNTG-3') and modulate gene expression. They are involved in processes such as myogenesis inhibition, neurogenesis, cardiac morphogenesis, pancreas development, limb development, and epithelial-mesenchymal interactions. Some act as transcriptional repressors, while others form heterodimers with E proteins to activate or repress transcription. They play roles in cell fate determination, maintenance of stem cell pluripotency, and regulation of metabolic pathways. The family includes factors that are essential for the development of specific tissues and organs, and for the maintenance of homeostasis in adult tissues.
    source: "InterPro:IPR050283 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
