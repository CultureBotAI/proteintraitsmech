definitions:
  - kind: GENERAL
    text: >-
      CONTACTIN 5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45080. Members participate in cell-cell adhesion, homophilic cell adhesion via plasma membrane adhesion molecules. Members localise to cell periphery, membrane, plasma membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in various cellular processes including cell adhesion, migration, cytoskeletal organization, and neural development. Members function in actin dynamics, serving as scaffolding molecules that influence actin polymerization and the assembly of actin filaments. They play roles in establishing cell morphology, motility, and interactions with the extracellular matrix. Some members are integral components of basement membranes, contributing to barrier selectivity and vascularization. Others mediate cellular responses to guidance cues in neuronal development and are involved in the Wnt signaling pathway. The family includes proteins that regulate synapse formation and maintenance, as well as those that participate in the architecture of epithelial cell junctions and myocardial remodeling.
    source: "InterPro:IPR050958 abstract (LLM-generated, not curator-reviewed)"
