identifier: PANTHER:PTHR45630
label: "CATION-TRANSPORTING ATPASE-RELATED"
definition: >-
  This entry includes P-type ATPases from eukaryotes that form a different clade, designated subfamily V (P5-ATPases). P-type ATPases use ATP for intracellular cation homeostasis and are required for proper lysosomal and mitochondria maintenance, also playing a role in the maintenance of neuronal integrity. P5-type ATPases can be subdivided in two subtypes based on the conservation of residues in the transmembrane domain, the P5A-type, which localize to the ER membrane (ATP13A1 from human and SPF1 from yeast), and P5B-type ATPases which are vacuolar or lysosomal membrane-associated proteins. Humans express four isoforms, ATP13A2 to ATP13A5. SPF1 from yeast and ATP13A1 are ER translocases required to remove mitochondrial transmembrane proteins mistargeted to the endoplasmic reticulum. They were initially thought to mediate ion transport such as calcium or manganese but then it was reported that they specifically binds moderately hydrophobic transmembrane with short hydrophilic lumenal domains that misinsert into the endoplasmic reticulum. Human ATP13A2 (also known as PARK9), the most studied member of the P5B-type, is a neuroprotective ATPase enriched in the brain that selectively imports spermine ions from lysosomes into the cytosol. Mutations ATP13A2 cause a rare monogenic form of juvenile-onset Parkinson's disease named Kufor-Rakeb syndrome and other neurodegenerative diseases. This entry includes also other isoforms such as ATP13A3, ATP13A4, ATP13A5. P-ATPases (also known as E1-E2 ATPases) ( EC:7.2.2.6 ) are found in bacteria and in a number of eukaryotic plasma membranes and organelles. P-ATPases function to transport a variety of different compounds, including ions and phospholipids, across a membrane using ATP hydrolysis for energy. There are many different classes 
