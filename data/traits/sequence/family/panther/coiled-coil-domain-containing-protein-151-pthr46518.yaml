identifier: PANTHER:PTHR46518
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 151"
definition: >-
  ODAD3 (also known as CCDC151) is a component of the outer dynein arm-docking complex (ODA-DC) that mediates outer dynein arms (ODA) binding onto the doublet microtubule. It is involved in mediating assembly of both ODAs and their axonemal docking complex onto ciliary microtubules. It is required for motile cilia function in animals. It also has additional non-motile functions in vertebrates, such as regulation of primary cilium length, and being involved in proper orientation of cell divisions in the pronephros and correct establishment of left-right asymmetry. Mutations in the ODAD3 gene cause primary ciliary dyskinesia.
definition_source: "InterPro:IPR033192 abstract (PANTHER PTHR46518 is a member signature)"
