identifier: PANTHER:PTHR14983
label: "CILIOGENESIS AND PLANAR POLARITY EFFECTOR 2"
definition: >-
  Ciliogenesis and planar polarity effector 2, also known as RSG1, is a small GTPase that controls a final step in primary cilia initiation. It interacts with FUZZY (FUZ), which is part of the CPLANE (ciliogenesis and planar polarity effector) protein complex.
