identifier: PANTHER:PTHR23002
label: "ZINC FINGER CCHC DOMAIN CONTAINING PROTEIN"
definition: >-
  The CNBP family proteins are characterized by their ability to bind nucleic acids through CCHC-type zinc finger domains. They predominantly bind single-stranded DNA and RNA, often with sequence specificity, such as the sterol regulatory element (SRE) sequence. Members of this family are involved in various cellular processes, including transcriptional repression, translation support by resolving G-quadruplex structures in mRNAs, and acting as transactivators for certain promoters like Myc. Some members may also play a role in sexual differentiation pathways. The family's functions are critical for maintaining proper gene expression and ensuring the stability and translation of mRNA by preventing the formation of secondary structures that could impede these processes.
