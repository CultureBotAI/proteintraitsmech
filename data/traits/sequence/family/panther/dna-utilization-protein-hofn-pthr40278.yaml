  - kind: GENERAL
    text: >-
      This family of proteins includes components involved in the utilization of extracellular DNA as a nutrient and the assembly and function of secretion systems. Members are implicated in various cellular processes such as adhesion, colonization, biofilm maturation, and virulence. They play roles in the inner membrane, forming complexes essential for the assembly of functional pili or secretion machinery, and in some cases, mediate the energy-dependent secretion of extracellular factors like proteases and toxins.
