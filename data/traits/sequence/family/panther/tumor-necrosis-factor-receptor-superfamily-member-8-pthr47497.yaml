identifier: PANTHER:PTHR47497
label: "TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 8"
definition: >-
  This family of proteins includes receptors that interact with TNFSF8/CD30L. Members are involved in the regulation of cellular growth and the transformation of activated lymphoblasts. They also play a role in gene expression regulation through the activation of the NF-kappa-B pathway.
