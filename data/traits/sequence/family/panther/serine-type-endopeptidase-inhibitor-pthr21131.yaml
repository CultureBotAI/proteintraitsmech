identifier: PANTHER:PTHR21131
label: "SERINE-TYPE ENDOPEPTIDASE INHIBITOR"
definition: >-
  This family of proteins includes inhibitors of serine proteases such as human tryptase, trypsin, and chymotrypsin. These inhibitors are likely involved in modulating host defense mechanisms by blocking the activity of these proteases, which play a role in immune responses and other physiological processes.
