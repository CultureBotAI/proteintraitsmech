identifier: PANTHER:PTHR15502
label: "CALCINEURIN-BINDING PROTEIN CABIN 1-RELATED"
definition: >-
  This entry includes histone transcription regulator 3 (Hir3) from fungi and calcineurin-binding protein 1 (CABIN1) from animals. Hir3 is part of the HIR complex, a nucleosome assembly complex that regulates histone gene transcription. Human CABIN1 is a functional member of the HUCA (HIRA/UBN1/CABIN1/ASF1a) complex, which is a histone H3.3 chaperone complex involved in nucleosome assembly and chromatin heterochromatinisation in senescent human cells.
