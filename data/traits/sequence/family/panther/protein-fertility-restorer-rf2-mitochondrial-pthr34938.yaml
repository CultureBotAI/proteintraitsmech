identifier: PANTHER:PTHR34938
label: "PROTEIN FERTILITY RESTORER RF2, MITOCHONDRIAL"
definition: >-
  FERTILITY RESTORER RF2 (RF2) is involved in restoring male fertility in rice with cytoplasmic male sterility. YL1 (Yellow Leaf 1) plays a role in chloroplast development and photosynthetic protein complex assembly. These proteins are targeted to organelles (mitochondria or chloroplasts) and contain glycine-rich regions that may form coiled-coil structures.
