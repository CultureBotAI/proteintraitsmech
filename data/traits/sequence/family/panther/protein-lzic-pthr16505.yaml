identifier: PANTHER:PTHR16505
label: "PROTEIN LZIC"
definition: >-
  Protein LZIC is closely related to ICAT. It contains a leucine zipper domain and an ICAT domain, with particular conservation of residues that are used by ICAT for beta-catenin-binding. However, LZIC does not interact with beta-catenin in vitro or in vivo.
