identifier: PANTHER:PTHR30614
label: "MEMBRANE COMPONENT OF AMINO ACID ABC TRANSPORTER"
definition: >-
  This entry represents the membrane component of a group of amino acid transport systems, including arginine ABC transporter permease protein ArtM, glutamine transport system permease protein GlnP, glutamate/aspartate import permease protein GltJ/GltK, L-cystine transport system permease protein TcyL, and uncharacterised proteins such as YhdX and YhdY. ABC transporters are minimally constituted of two conserved regions: a highly conserved ATP binding cassette (ABC) and a less conserved transmembrane domain (TMD). These regions can be found on the same protein (mostly in eukaryotes and bacterial exporters) or on two different ones (mostly bacterial importers). In importers, the TMD displays a distinctive signature, the EAA motif, a 20 amino acid conserved sequence located about 100 residues from the C terminus. The motif is hydrophilic and has been found to reside in a cytoplasmic loop located between the penultimate and the antepenultimate transmembrane segment in all proteins with a known topology. It appears to play an important role in ensuring the correct assembly of the prokaryotic ABC transport complex and constituting an interaction site with the so-called helical domain of the ABC module.
definition_source: "InterPro:IPR043429 abstract (PANTHER PTHR30614 is a member signature)"
