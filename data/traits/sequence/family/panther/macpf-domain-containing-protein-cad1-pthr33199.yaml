identifier: PANTHER:PTHR33199
label: "MACPF DOMAIN-CONTAINING PROTEIN CAD1"
definition: >-
  This entry represents a group of plant MACPF domain-containing proteins, including CAD1 (also known as Protein CONSTITUTIVELY ACTIVATED CELL DEATH 1) and NSL1 (also known as Protein NECROTIC SPOTTED LESIONS 1) from Arabidopsis thaliana. They play a role in plant immunity acting as negative regulators of the salicylic acid (SA)-mediated pathway of programmed cell death.
