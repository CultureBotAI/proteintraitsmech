identifier: PANTHER:PTHR47060
label: "HOMEOBOX PROTEIN NOBOX"
definition: >-
  NOBOX is an oocyte-specific transcription factor essential for folliculogenesis and expression of many germ cell-specific genes in mice. It regulates the expression of Pad6, a peptidylarginine deiminase in the oocyte. It has also been shown to function in regulation of embryonic genome activation, pluripotency gene expression, and blastocyst cell allocation in cattle. Mutations of the NOBOX gene have been linked to primary ovarian insufficiency.
