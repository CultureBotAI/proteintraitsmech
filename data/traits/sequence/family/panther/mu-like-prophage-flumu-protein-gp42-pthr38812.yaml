identifier: PANTHER:PTHR38812
label: "MU-LIKE PROPHAGE FLUMU PROTEIN GP42"
definition: >-
  The Mulikevirus tape measure protein family is involved in the assembly and length determination of bacteriophage tails. Members of this family serve as a scaffold for the polymerization of tail tube proteins, ensuring the correct tail length is achieved. These proteins may also be involved in the ejection process of the phage DNA, potentially being expelled from the tail prior to DNA release during the infection of a host cell.
