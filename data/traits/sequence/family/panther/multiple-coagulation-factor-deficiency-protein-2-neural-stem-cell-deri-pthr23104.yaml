identifier: PANTHER:PTHR23104
label: "MULTIPLE COAGULATION FACTOR DEFICIENCY PROTEIN 2  NEURAL STEM CELL DERIVED NEURONAL SURVIVAL PROTEIN"
definition: >-
  The protein family is involved in various cellular processes, including the ER-to-Golgi transport of selected proteins and cell-cell adhesion. Members of the family, mainly from animals, form a specific cargo receptor complex, known as the MCFD2-LMAN1 complex, which is essential for the secretion of coagulation factors. Additionally, some family members mediate cell-cell adhesion in a calcium-dependent manner and can inhibit cell growth in several cell lines. The presence of EF-hand domains suggests that calcium ions are crucial for the structural folding and function of these proteins. This entry also includes Lymphotoxin beta receptor inhibitor, which Inhibits multimerisation of lymphotoxin-beta receptor (LTBR) and downstream NF-kappa-B signalling activation, and Longistatin, an anticoagulant and fibrinolytic protease that modulates blood feeding of ticks on vertebrate hosts.
definition_source: "InterPro:IPR052110 abstract (PANTHER PTHR23104 is a member signature)"
