  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of elsinochromes, a group of pigments with a core phenolic quinone structure and various side chains. These pigments exist as interconvertible tautomers and are significant in fungal pathogenesis. The family includes enzymes that participate in the iterative decarboxylation and polyketide chain elongation, cyclization to form aromatic rings, and subsequent modifications to produce the heptaketide backbone of elsinochrome. The symmetrical structure of elsinochrome is formed by the fusion of two identical heptaketides into a dihydrobenzo-perylene ring, which is further modified to yield different elsinochrome derivatives. The family also encompasses proteins that may stabilize biosynthetic enzymes and contribute to the chaperone function necessary for elsinochrome production. However, the complete set of genes for the biosynthesis pathway is not contained within the gene cluster, indicating additional components are involved. The family also includes transporters responsible for exporting elsinochrome out of the fungal cells to prevent toxicity.
    source: "InterPro:IPR053018 abstract (LLM-generated, not curator-reviewed)"
