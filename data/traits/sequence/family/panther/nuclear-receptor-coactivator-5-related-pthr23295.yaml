identifier: PANTHER:PTHR23295
label: "NUCLEAR RECEPTOR COACTIVATOR 5-RELATED"
definition: >-
  This family of proteins serves as nuclear receptor coregulators, possessing the ability to interact with nuclear receptors and modulate their activity. These proteins contain a conserved Leu-Xaa-Xaa-Leu-Leu (LxxLL) motif, which is crucial for their association with nuclear receptors. They are involved in the coactivation of nuclear steroid receptors, such as estrogen receptors, and can also function as corepressors for certain genes like MYC in response to hormonal signals. Additionally, they may play a role in maintaining adult pluripotent stem cell populations.
