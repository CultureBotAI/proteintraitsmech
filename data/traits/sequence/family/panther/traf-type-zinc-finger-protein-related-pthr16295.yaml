  - kind: GENERAL
    text: >-
      TRAF-TYPE ZINC FINGER PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16295. Members localise to cytoplasm, mitochondrion, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
