label: "TRANSMEMBRANE AND COILED-COIL DOMAIN-CONTAINING PROTEIN 4 TMCO4"
definition: >-
  This family consists of transmembrane and coiled-coil domain-containing proteins found in animal and plant organisms, uncharacterised membrane proteins in eukaryotes, and uncharacterised proteins in prokaryotes. Some of these proteins have an alpha/beta hydrolase domain InterPro:IPR029058.
