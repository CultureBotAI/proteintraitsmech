identifier: PANTHER:PTHR37516
label: "SCA1 COMPLEX SCAFFOLD PROTEIN SCAA"
definition: >-
  ScaA/Sca1 is a component of the Sca1 complex, a regulator of cell motility, chemotaxis and signal relay (cAMP production) in Dictyostelium. The Sca1/RasGEF/PP2A complex controls the RasC-TORC2-PKB/PKBR1 pathway at the leading edge of chemotaxing cells. The Sca1 complex is recruited to the plasma membrane upon chemoattractant stimulation. ScaA acts as a molecular scaffold, bringing together GEFA, GEFH and PHR with PP2A.
