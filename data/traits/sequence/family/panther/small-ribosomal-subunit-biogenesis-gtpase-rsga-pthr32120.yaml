identifier: PANTHER:PTHR32120
label: "SMALL RIBOSOMAL SUBUNIT BIOGENESIS GTPASE RSGA"
definition: >-
  This entry contains Escherichia coli (strain K12) RsgA, which plays a role in the late maturation steps of the functional core of the 30S ribosomal subunit. It removes RbfA from mature, but not immature, 30S ribosomes in a GTP-dependent manner, and binds the 30S subunit making contact with the head, platform and rRNA helix 44. RsgA (sometimes known as YjeQ or EngC) is an unusual circulary permuted GTPase that catalyzes rapid hydrolysis of GTP with a slow catalytic turnover. It is dispensible for viability, but important for overall fitness. The intrinsic GTPase activity is stimulated by the presence of 30S (160-fold increase in k cat) or 70S (96 fold increase in k cat) ribosomes. The GTPase is inhibited by aminoglycoside antibiotics such as neomycin and paromycin streptomycin and spectinomycin. This inhibition is not due to competition for binding sites on the 30S or 70S ribosome.
definition_source: "InterPro:IPR004881 abstract (PANTHER PTHR32120 is a member signature)"
