  - kind: GENERAL
    text: >-
      This family of proteins includes signaling adapter molecules that may function in lymphocyte signaling, negative regulation of B-cell activation, and modulation of cell proliferation. Members are involved in cytoskeletal reorganization, cell spreading, and polarization, and can influence histone deacetylase and kinase activity. Some proteins in this family act as scaffolds in NF-kappa-B signaling pathways, regulating ubiquitination of signaling components, cell mobility, and skin pigmentation by controlling melanocyte migration.
