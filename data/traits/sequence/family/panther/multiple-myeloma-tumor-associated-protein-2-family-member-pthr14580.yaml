identifier: PANTHER:PTHR14580
label: "MULTIPLE MYELOMA TUMOR-ASSOCIATED PROTEIN 2 FAMILY MEMBER"
definition: >-
  Multiple myeloma tumor-associated protein 2 (MMTAG2) is an uncharacterised protein initially identified in the human multiple myeloma cell line ARH-77. The protein contains phosphorylation sites, N-myristoylation sites and nuclear localisation signals. Proteins in this entry contain a kinase phosphorylation domain.
