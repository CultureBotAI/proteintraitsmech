identifier: PANTHER:PTHR15627
label: "NATURAL KILLER CELL-SPECIFIC ANTIGEN KLIP1"
definition: >-
  This family of proteins includes tRNA-uridine aminocarboxypropyltransferase 1 (DTWD1) and its paralogue, YIPF3, which are involved in two distinct cellular functions. DTWD1 is responsible for the post-transcriptional modification of tRNA molecules, specifically catalysing the formation of 3-(3-amino-3-carboxypropyl)uridine at a specific position in the D-loop of cytoplasmic tRNAs. This modification is crucial for the proper functioning of tRNA during protein synthesis. YIPF3 is implicated in the structural maintenance of the Golgi apparatus, which is essential for protein sorting and trafficking within the cell. Additionally, these proteins may have a role in the process of hematopoiesis, the formation of blood cellular components.
definition_source: "InterPro:IPR051521 abstract (PANTHER PTHR15627 is a member signature)"
