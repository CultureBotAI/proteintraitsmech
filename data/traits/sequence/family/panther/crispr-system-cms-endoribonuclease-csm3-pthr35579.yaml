  - kind: GENERAL
    text: >-
      This family of proteins is associated with the CRISPR adaptive immune system, which protects against mobile genetic elements such as viruses, transposable elements, and conjugative plasmids. Members of this family are involved in the CRISPR mechanism where they act as endoribonucleases targeting single-stranded RNA (ssRNA). They cleave target RNA at regular six nucleotide intervals and are part of the type III-A Csm effector complex. This complex binds CRISPR RNA (crRNA) and exhibits multiple enzymatic activities, including RNA-guided RNase, DNase, and cyclic oligoadenylate synthase functions. The binding of target RNA that is complementary to the crRNA is essential for these activities. Some members also exhibit non-specific single-stranded DNA (ssDNA) nuclease activity, which is regulated by the cleavage of target RNA, suggesting a mechanism to prevent uncontrolled DNA degradation.
    source: "InterPro:IPR052216 abstract (LLM-generated, not curator-reviewed)"
