identifier: PANTHER:PTHR20857
label: "THIAMINE-PHOSPHATE PYROPHOSPHORYLASE"
definition: >-
  THIAMINE-PHOSPHATE PYROPHOSPHORYLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR20857. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function transferase activity, transferring alkyl or aryl (other than methyl) groups, catalytic activity. and participate in organic hydroxy compound metabolic process, cellular aromatic compound metabolic process, heterocycle metabolic process. and localise to cytoplasm.
