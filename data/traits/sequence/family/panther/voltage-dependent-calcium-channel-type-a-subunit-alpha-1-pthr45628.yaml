identifier: PANTHER:PTHR45628
label: "VOLTAGE-DEPENDENT CALCIUM CHANNEL TYPE A SUBUNIT ALPHA-1"
definition: >-
  Voltage-dependent L-type calcium channel subunit alpha-1S and related proteins are essential for the mediation of calcium ion entry into excitable cells, triggering a variety of calcium-dependent processes such as muscle contraction, hormone or neurotransmitter release, gene expression, cell motility, division, and cell death. These proteins form high-voltage activated (HVA) channels, which are characterised by their long-lasting calcium currents and sensitivity to specific blockers like dihydropyridines, phenylalkylamines, and benzothiazepines. The family includes subunits that give rise to different types of calcium currents, such as L-type, P/Q-type, N-type, and R-type, each with distinct physiological roles and pharmacological profiles. The domain architecture of these proteins typically features four internal repeats, each containing six transmembrane segments, with the fourth segment acting as the voltage sensor. This family plays a crucial role in excitation-contraction coupling in muscle and is involved in various signaling pathways critical for cellular function and survival.
definition_source: "InterPro:IPR050599 abstract (PANTHER PTHR45628 is a member signature)"
