definitions:
  - kind: GENERAL
    text: >-
      60S ACIDIC RIBOSOMAL PROTEIN P0 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45699. PANTHER protein class: ribosomal protein, translational protein. Members are annotated with the molecular function structural constituent of ribosome, RNA binding, organic cyclic compound binding. and participate in protein-RNA complex assembly, cellular component biogenesis, peptide metabolic process. and localise to cytoplasm, non-membrane-bounded organelle, cytosolic ribosome.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The universal ribosomal protein uL10 family is involved in the structural and functional composition of the ribosome, specifically forming part of the ribosomal stalk. The ribosomal stalk is crucial for the interaction of the ribosome with GTP-bound translation factors during protein synthesis. Members of the uL10 family play a central role in recruiting these factors, which are essential for the translation process. The interaction with translation factors enhances the GTPase activity, which is necessary for the translocation step of protein elongation. The uL10 family proteins are functionally equivalent to the E.coli protein L10 and are a key component in the large ribosomal subunit, contributing to the peptidyl transferase center and the exit tunnel for nascent polypeptide chains.
    source: "InterPro:IPR050323 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
