  - kind: GENERAL
    text: >-
      ABC TRANSPORTER PERMEASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30450. PANTHER protein class: ATP-binding cassette (ABC) transporter, primary active transporter, transporter. Members participate in carboxylic acid transport, amino acid transport. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the transport of various amino acids across the cell membrane. Members of the family function as part of different ABC transporter complexes, facilitating the translocation of substrates such as histidine, lysine, arginine, ornithine, and D-methionine. Some proteins within the family are also implicated in the transport of toxic analogs like alpha-methyl-methionine and may participate in microbial infection processes by transporting toxin components. The family includes subfamilies that are responsible for signaling between the solute-binding proteins and the ATPase components of the transport system, indicating a role in the regulation of transport activity.
    source: "InterPro:IPR051322 abstract (LLM-generated, not curator-reviewed)"
