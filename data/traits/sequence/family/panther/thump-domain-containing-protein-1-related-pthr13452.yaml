identifier: PANTHER:PTHR13452
label: "THUMP DOMAIN CONTAINING PROTEIN 1-RELATED"
definition: >-
  This family contains THUMP domain-only proteins including THUMP domain-containing protein 1 and Saccharomyces cerevisiae Tan1. Tan1 is non essential and has been shown to be required for the formation of the modified nucleoside N(4)-acetylcytidine (ac(4)C) in tRNA. THUMPD1 is also an adapter required for NAT10-dependent tRNA acetylation. The THUMP domain is named after thiouridine synthases, methylases and PSUSs. The domain consists of about 110 amino acid residues. It is predicted to be an RNA-binding domain and probably functions by delivering a variety of RNA modification enzymes to their targets.
definition_source: "InterPro:IPR040183 abstract (PANTHER PTHR13452 is a member signature)"
