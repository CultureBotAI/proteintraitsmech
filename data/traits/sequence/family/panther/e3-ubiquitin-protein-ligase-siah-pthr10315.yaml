  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that are involved in the ubiquitination and subsequent proteasomal degradation of various target proteins. They contain a RING-type zinc finger domain crucial for their ligase activity and a substrate-binding domain (SBD) that mediates homodimerization and interaction with substrates, related to the TRAF family. These proteins play significant roles in plant physiological processes such as response to auxin signals, formation of lateral roots, autophagy, and stress responses including drought tolerance and abscisic acid-mediated stomatal closure.
    source: "InterPro:IPR052088 abstract (LLM-generated, not curator-reviewed)"
