identifier: PANTHER:PTHR43797
label: "HOMOCYSTEINE/CYSTEINE SYNTHASE"
definition: >-
  This family of sequences is a distinct clade of the Cys/Met metabolism pyridoxal phosphate-dependent enzyme superfamily. Members include examples of OAH/OAS sulfhydrylase, an enzyme with activity both as O-acetylhomoserine sulfhydrylase (OAH, ) and O-acetylserine sulfhydrylase (OAS, ). An alternate name for OAH sulfhydrylase is homocysteine synthase. This family also includes sulfhydrylase FUB7, which is part of the gene cluster that mediates the biosynthesis of fusaric acid, and Sulfhydrylase-like protein lolC1/2, associated with the biosynthesis of loline alkaloids, potent insecticidal agents composed of a pyrrolizidine ring system and an uncommon ether bridge linking carbons 2 and 7.
definition_source: "InterPro:IPR006235 abstract (PANTHER PTHR43797 is a member signature)"
