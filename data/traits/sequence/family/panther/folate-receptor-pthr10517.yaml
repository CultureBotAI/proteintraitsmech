identifier: PANTHER:PTHR10517
label: "FOLATE RECEPTOR"
definition: >-
  Folic acid and its reduced derivatives are transported via two widely expressed transporters, the reduced folate carrier (RFC) and the proton-coupled folate transporter (PCFT), and via a family of glycosyl-phosphatidylinositol (GPI)-anchored receptors with limited expression profiles known as folate receptors (FRs). Folate receptors (FR) are high affinity receptors that transport folate via endocytosis. Human FR exists in three isoforms, alpha and beta equipped with GPI anchors, and gamma not possessing a GPI anchor.
definition_source: "InterPro:IPR004269 abstract (PANTHER PTHR10517 is a member signature)"
