identifier: PANTHER:PTHR48039
label: "RNA-BINDING MOTIF PROTEIN 14B"
definition: >-
  The RRM MRD1 family is involved in various aspects of RNA processing and ribosome biogenesis. Members of the family play a role in embryo pre-implantation development and are implicated in pre-rRNA processing, which is essential for the production of mature ribosomal RNA and the subsequent assembly of ribosomal subunits. Some proteins within the family are nucleolar components of the spliceosomal ribonucleoprotein complexes, suggesting a role in RNA splicing. Others are required for the synthesis of the 60S ribosomal subunit, likely participating in the processing of 27S rRNA to produce mature 25S rRNA. The family's functions are critical for the proper functioning of the cell's protein synthesis machinery.
