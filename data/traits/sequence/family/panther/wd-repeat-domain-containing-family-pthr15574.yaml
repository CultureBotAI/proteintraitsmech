identifier: PANTHER:PTHR15574
label: "WD REPEAT DOMAIN-CONTAINING FAMILY"
definition: >-
  This entry represents a group of WD and tetratricopeptide repeats proteins, including DCAF5/6/8 and DCAF8L1/DCAF8L2/WDTC1 from humans. They may function as a substrate receptor for CUL4-DDB1 E3 ubiquitin-protein ligase complex. Proteins in this entry also include protein ALTERED SEED GERMINATION 2 (ASG2) from Arabidopsis. It is a negative regulator of ABA signalling.
