identifier: PANTHER:PTHR28572
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 103"
definition: >-
  Coiled-coil domain-containing protein 103 (CC103), also known as dynein axonemal assembly factor 19, functions as a dynein arm attachment factor. Mutations of CC103 cause primary ciliary dyskinesia.
