identifier: PANTHER:PTHR23225
label: "ZINC FINGER PROTEIN"
definition: >-
  The zinc finger protein Grauzone is a transcription factor essential for the completion of meiosis in oocytes in Drosophila. Grauzone binds to the cortex promoter and is necessary for high-level activation of cortex transcription. This entry also includes C2H2-type zinc finger transcription factor 1 (ZFP1) and related fungal proteins. ZFP1 is a transcription factor that is important for microsclerotia formation and is especially involved in melanin production during the formation of microsclerotia.
