  - kind: GENERAL
    text: >-
      This family of proteins functions as zinc-sensing receptors that detect changes in extracellular zinc ion concentrations. They are involved in transmitting zinc signals and play a role in various physiological processes, including the regulation of glucose homeostasis, gastrointestinal mobility, hormone secretion, and cell survival. Upon zinc activation, these proteins can increase intracellular calcium levels and activate key signaling pathways such as ERK/MAPK and PI3K/AKT, which contribute to epithelial repair and normal wound healing. They also influence adipose tissue metabolism by regulating lipolysis and the activity of specific lipases. Additionally, these receptors help protect cells from different types of stress by promoting the secretion of cytoprotective factors. They are capable of forming heteroreceptor complexes with other receptors, which can either enhance or inhibit signaling pathways, depending on the cellular context.
    source: "InterPro:IPR052676 abstract (LLM-generated, not curator-reviewed)"
