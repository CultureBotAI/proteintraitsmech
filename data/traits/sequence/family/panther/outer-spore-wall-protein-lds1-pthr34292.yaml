identifier: PANTHER:PTHR34292
label: "OUTER SPORE WALL PROTEIN LDS1"
definition: >-
  This family of proteins is involved in the assembly of the spore wall, a critical process in the formation of spores in yeast. Members of this family may also play a role in modulating ribosomal DNA transcription, suggesting a potential regulatory function in addition to their structural role in spore wall formation.
