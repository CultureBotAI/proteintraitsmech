identifier: PANTHER:PTHR33843
label: "ASCORBATE-SPECIFIC PTS SYSTEM EIIC COMPONENT"
definition: >-
  This family of proteins is involved in the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS), which is a major carbohydrate active transport system. These proteins catalyze the phosphorylation of incoming sugar substrates concomitantly with their translocation across the cell membrane. Specifically, they are part of the enzyme II UlaABC PTS system that is responsible for the transport of ascorbate. Unlike classical PTS systems, these proteins do not exhibit the topological features of any recognized enzyme IIC domains that typically form the translocation channel and contain the specific substrate-binding site.
