identifier: PANTHER:PTHR34441
label: "MOTILE SPERM DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  Motile sperm domain-containing protein 1/3 (MOSPD1/3) contain a motile sperm protein domain and two transmembrane domains. MOSPD1 is involved in mesenchymal versus epidermal cell differentiation. It is also involved in mesenchymal stem cell proliferation and differentiation.
