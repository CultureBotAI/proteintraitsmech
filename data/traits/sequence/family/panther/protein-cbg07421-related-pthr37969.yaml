identifier: PANTHER:PTHR37969
label: "PROTEIN CBG07421-RELATED"
definition: >-
  The protease inhibitor I33 family comprises proteins that function as aspartyl protease inhibitors. Members of this family are known to inhibit the activity of aspartic proteases such as pepsin. Aspartic proteases are a class of enzymes that play a crucial role in the digestive system by breaking down proteins into peptides. The inhibitors in the protease inhibitor I33 family bind to these enzymes and prevent them from degrading proteins, thereby regulating protease activity. This inhibition mechanism is important for controlling proteolytic processes and maintaining protein integrity in various organisms. Some family members are also recognized as immunodominant antigens, suggesting a role in immune response.
