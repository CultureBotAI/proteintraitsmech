identifier: PANTHER:PTHR24099
label: "E3 UBIQUITIN-PROTEIN LIGASE TRIM36-RELATED"
definition: >-
  This family of proteins includes E3 ubiquitin-protein ligases and proteins with fibronectin type III and SPRY domains. Members of this family are involved in various cellular processes, including ubiquitination and proteasomal degradation of target proteins, which can influence cell cycle regulation and chromosome segregation. Some proteins within this family mediate spermatid-Sertoli adhesion during spermatogenesis, potentially affecting fertility. Others may act as regulators of adipogenesis, microtubule organization, and stabilization, or serve as anchoring proteins for protein kinase A, influencing muscle function and regeneration. Additionally, certain family members are implicated in neuronal functions, such as synaptic vesicle exocytosis, axonal projections, and neuronal migration, by interacting with components like SNAP25 or through ubiquitin ligase activity.
