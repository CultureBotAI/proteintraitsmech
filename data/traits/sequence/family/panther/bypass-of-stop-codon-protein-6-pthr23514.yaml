    text: >-
      This family of proteins includes members of the major facilitator superfamily (MFS), which are integral membrane transport proteins. They are likely involved in the transport of various substrates across cellular membranes. Some members are probable transporters with specificity for sugars such as glucose and mannose, while others may transport molecules related to rhizopine biosynthesis or other uncharacterized substrates. The functions of some members within this family remain to be fully characterized.
