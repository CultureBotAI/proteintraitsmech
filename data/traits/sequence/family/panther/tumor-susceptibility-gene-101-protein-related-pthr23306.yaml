definitions:
  - kind: GENERAL
    text: >-
      TUMOR SUSCEPTIBILITY GENE 101 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23306. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function protein binding, ubiquitin-like protein binding, ubiquitin binding. and participate in vesicle-mediated transport, intracellular transport, endosome to lysosome transport. and localise to membrane protein complex, cytoplasmic vesicle, organelle membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the endosomal sorting complex required for transport (ESCRT) pathway, specifically as components of the ESCRT-I complex. They play a crucial role in the sorting of ubiquitinated cargo into multivesicular bodies (MVBs), which is essential for vesicular trafficking processes. Members of this family are also implicated in the regulation of cell growth and differentiation, acting as negative growth regulators. They have a role in cytokinesis and are involved in the budding of various viruses. Additionally, these proteins are associated with the exosomal release of certain molecules and may participate in the release of microvesicles distinct from exosomes.
    source: "InterPro:IPR052070 abstract (LLM-generated, not curator-reviewed)"
