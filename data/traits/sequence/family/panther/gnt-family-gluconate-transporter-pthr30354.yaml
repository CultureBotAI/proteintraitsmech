identifier: PANTHER:PTHR30354
label: "GNT FAMILY GLUCONATE TRANSPORTER"
definition: >-
  This is a family of integral membrane permeases that are involved in gluconate uptake. Escherichia coli contains several members of this family including GntU, a low affinity transporter and GntT, a high affinity transporter.
