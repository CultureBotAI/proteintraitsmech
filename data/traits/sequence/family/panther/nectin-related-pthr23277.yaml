    text: >-
      NECTIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23277. PANTHER protein class: cell adhesion molecule. Members participate in homophilic cell adhesion via plasma membrane adhesion molecules, heterophilic cell-cell adhesion via plasma membrane cell adhesion molecules. Members localise to adherens junction.
