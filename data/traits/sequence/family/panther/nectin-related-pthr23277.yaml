    method: GENERATED
  - kind: GENERAL
    text: >-
      The Nectin family is involved in various cell-cell adhesion processes. Members of this family mediate adhesion through homophilic and heterophilic interactions, which can include specific interactions between different nectins. These interactions are crucial for the formation of cell-cell junctions, including adherens junctions and synapses. Some family members act as receptors for viruses, facilitating entry into cells, while others are involved in neurite outgrowth by interacting with growth factor receptors. Additionally, the family plays roles in synaptic inhibition in the brain, regulating presynaptic differentiation through interactions with other synaptic proteins. The family's involvement in cell adhesion and signaling underpins its importance in tissue morphogenesis, immune response, and neural network formation.
    source: "InterPro:IPR051427 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
