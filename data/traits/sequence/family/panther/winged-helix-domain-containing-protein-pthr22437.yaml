identifier: PANTHER:PTHR22437
label: "WINGED HELIX DOMAIN-CONTAINING PROTEIN"
definition: >-
  Storkhead-box proteins are winged-helix transcription factors. STOX1 and STOX2 have been linked to pre-eclampsia. STOX has been shown to regulate nitroso-redox balance and mitochondrial homeostasis.
