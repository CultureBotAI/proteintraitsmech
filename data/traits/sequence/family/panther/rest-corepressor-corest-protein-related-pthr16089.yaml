definitions:
  - kind: GENERAL
    text: >-
      REST COREPRESSOR COREST PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16089. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function transcription corepressor activity. Members participate in negative regulation of DNA-templated transcription, regulation of transcription by RNA polymerase II, negative regulation of cellular metabolic process. Members localise to histone deacetylase complex, transcription regulator complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional regulators and corepressors that are involved in the modulation of gene expression through chromatin remodeling. Members of this family are known to bind DNA and activate or repress transcription of specific target genes. They are involved in various biological processes, such as steroid biosynthesis, neuron-specific gene repression in non-neuronal cells, and the progression of meiosis in spermatocytes. Some proteins in this family function by interacting with other proteins to form complexes that modify histones through deacetylation and demethylation, thereby influencing chromatin structure and gene expression. They play roles in developmental processes, fertility, and hematopoietic differentiation.
    source: "InterPro:IPR051066 abstract (LLM-generated, not curator-reviewed)"
