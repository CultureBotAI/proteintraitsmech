identifier: PANTHER:PTHR15692
label: MASTERMIND-LIKE
definition: >-
  This family includes the neurogenic mastermind-like proteins 1-3 (MAML1-3) from chordates, which act as critical transcriptional co-activators for Notch signalling. Notch receptors are cleaved upon ligand engagement and the intracellular domain of Notch shuttles to the nucleus. MAMLs form a functional DNA-binding complex with the cleaved Notch receptor and the transcription factor CSL, thereby regulating transcriptional events that are specific to the Notch pathway. MAML proteins may also play roles as key transcriptional co-activators in other signal transduction pathways as well, including: muscle differentiation and myopathies (MEF2C), tumour suppressor pathway (p53) and colon carcinoma survival (beta-catenin). MAML proteins could mediate cross-talk among the various signalling pathways and the diverse activities of the MAML proteins converge to impact normal biological processes and human diseases, including cancers. They consist of an N-terminal domain which adopt an elongated kinked helix that wraps around ANK and CSL forming one of the complexes in the build-up of the Notch transcriptional complex for recruiting general transcription factors. This N-terminal domain is responsible for its interaction with the ankyrin repeat region of the Notch proteins NOTCH1, NOTCH2, NOTCH3 and NOTCH4. It forms a DNA-binding complex with Notch proteins and RBPSUH/RBP-J kappa/CBF1, and also binds CREBBP/CBP and CDK8. The C-terminal region is required for transcriptional activation.
