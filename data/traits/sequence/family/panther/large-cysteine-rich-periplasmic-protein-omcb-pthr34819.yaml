  - kind: GENERAL
    text: >-
      The OmcB protein family consists of large cysteine-rich periplasmic proteins found in Chlamydia species. These proteins play a crucial role in the structural integrity of the outer envelope of elementary bodies (EBs), which are the infectious form of the bacteria. OmcB proteins achieve this by forming disulfide cross-links with small cysteine-rich proteins and major outer membrane porins or proteins. This cross-linking creates a Sarkosyl-insoluble complex known as the Chlamydia outer membrane complex (COMC), which acts as a functional equivalent to peptidoglycan, a component typically found in bacterial cell walls. In reticulate bodies (RBs), the non-infectious, replicative stage of Chlamydia, the disulfide bonds in OmcB proteins are reduced, indicating a different structural state.
    source: "InterPro:IPR051172 abstract (LLM-generated, not curator-reviewed)"
