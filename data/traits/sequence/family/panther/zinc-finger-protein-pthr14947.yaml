identifier: PANTHER:PTHR14947
label: "ZINC FINGER PROTEIN"
definition: >-
  This family includes a group of zinc finger-containing proteins from human, including ZNF826/781 which may be involved in transcriptional regulation and Sp4, which binds to GT and GC boxes promoters elements and it is probable a transcriptional activator. It is required for normal male reproductive behavior.
