  - kind: GENERAL
    text: >-
      The YjjG family proteins are nucleotidases with high phosphatase activity towards non-canonical pyrimidine nucleotides and canonical nucleoside 5'-monophosphates such as UMP, dUMP, and dTMP. They exhibit house-cleaning functions in vivo, protecting cells from incorporation of potentially mutagenic nucleotides like 5-fluoro-2'-deoxyuridine monophosphate and 5-bromo-2'-deoxyuridine into DNA. These enzymes are strictly specific to pyrimidine substrates with 5'-monophosphates and do not act on nucleoside di- or triphosphates. The YjjG family's activity is crucial for thymine utilization through the thymine salvage pathway, as it catalyzes the hydrolysis of dUMP to deoxyuridine.
    source: "InterPro:IPR052550 abstract (LLM-generated, not curator-reviewed)"
