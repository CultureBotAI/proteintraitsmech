label: "GLUTAREDOXIN DOMAIN-CONTAINING CYSTEINE-RICH PROTEIN 2"
definition: >-
  Glutaredoxin domain-containing cysteine-rich protein 2 (GRXCR2) may be involved in the development of stereocilia bundles, specialised structures on the apical surface of sensory cells in the cochlea that are critical for sound detection.
