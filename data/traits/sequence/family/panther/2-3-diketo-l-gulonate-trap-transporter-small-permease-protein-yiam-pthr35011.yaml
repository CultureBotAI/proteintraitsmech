identifier: PANTHER:PTHR35011
label: "2,3-DIKETO-L-GULONATE TRAP TRANSPORTER SMALL PERMEASE PROTEIN YIAM"
definition: >-
  The tripartite ATP-independent periplasmic (TRAP) transporters are substrate-binding protein (SBP)-dependent secondary transporters ubiquitous in prokaryotes, but absent from eukaryotes. They are comprised of an SBP of the DctP or TAXI families and two integral membrane proteins of unequal sizes that form the DctQ and DctM protein families (the small and large membrane components respectively). The TRAP transporter for sialic acid consists of the SBP siaP, and siaQM (termed siaT in some cases), encoding the fused integral membrane protein. This family consists of DctQ homologues found in TRAP transporters.
definition_source: "InterPro:IPR007387 abstract (PANTHER PTHR35011 is a member signature)"
