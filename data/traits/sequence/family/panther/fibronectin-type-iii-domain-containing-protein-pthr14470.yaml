identifier: PANTHER:PTHR14470
label: "FIBRONECTIN TYPE III DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes fibronectin type III domain-containing protein 4 and 5 (FNDC4/5). FDNC4 is involved in anti-inflammatory processes, particularly in the gastrointestinal tract. It interacts with macrophages to reduce the expression of pro-inflammatory genes and modulate macrophage functions such as phagocytosis, largely through STAT3 activation and signaling pathways. These proteins play a role in controlling the immune response during inflammatory conditions like colitis. FDNC5 is a type I membrane protein that is cleaved to produce irisin, a hormone-like molecule that is secreted from skeletal muscle into the extracellular milieu and circulation. Physical activity induces irisin production, and irisin mediates the beneficial effects of physical activity in adipose tissue, brain, and bone. In mouse, it is implicated in the physiological changes associated with muscular exercise, including the induction of browning in white adipose tissue through the upregulation of UCP1 expression, potentially involving the nuclear receptor PPARA. However, the role of these proteins in exercise-induced benefits and adipose tissue browning may vary between species, as in humans may not be involved in the beneficial effects of muscular exercise, nor in the induction of browning of human white adipose tissue.
