identifier: PANTHER:PTHR15726
label: "RAB11-FAMILY INTERACTING PROTEIN"
definition: >-
  This family of proteins acts as downstream effectors for Rab11 GTPase, playing a crucial role in endocytic trafficking and ciliogenesis. They are involved in membrane delivery and the movement of sorting endosomes along microtubules to generate the endocytic recycling compartment. These proteins facilitate dynein motor complex interactions and processivity, and are implicated in cytokinesis, particularly in abscission. They participate in the assembly of ciliary targeting complexes, contributing to ciliogenesis initiation and the transport of sensory receptors. Some members may influence actin cytoskeleton regulation, impacting cell motility, and may be involved in retinal development. The presence of an RBD-FIP domain is characteristic, mediating interactions with Rab11.
