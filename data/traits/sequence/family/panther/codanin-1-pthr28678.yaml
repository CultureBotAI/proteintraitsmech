identifier: PANTHER:PTHR28678
label: CODANIN-1
definition: >-
  Codanin-1 may act as a negative regulator of histone chaperone anti-silencing function 1 (ASF1) in chromatin assembly. This family also includes the cytoplasmic codanin-1-like protein from Drosophila disks lost (dlt, also known as protein vanaso). Dlt regulates cell proliferation and cell survival of differentiated cells independent of cell division. Mutations in the codanin-1 gene cause congenital dyserythropoietic anemia 1 (CDA1), which is an autosomal recessive blood disorder characterised by morphological abnormalities of erythroblasts, ineffective erythropoiesis, macrocytic anemia and secondary hemochromatosis.
