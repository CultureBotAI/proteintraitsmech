  - kind: GENERAL
    text: >-
      The WD repeat GAD-1 family is characterized by proteins that contain WD repeats, which are minimally conserved regions of approximately 40 amino acids typically bracketed by gly-his (GH) and tryptophan-aspartic acid (WD) dipeptides. Members of the family are involved in a variety of cellular processes through their role in the assembly of multi-protein complexes. The known function of one member is related to the initiation of gastrulation, a critical phase in embryonic development. However, the specific functions of other members within the family remain uncharacterized.
