  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that function as phosphatases, specifically targeting phosphotyrosine residues. Members of this family are characterized by their ability to dephosphorylate tyrosine-phosphorylated proteins, which is a critical step in reversing the phosphorylation events that occur in signal transduction pathways. By removing phosphate groups from tyrosine residues, these phosphatases play a role in regulating cellular processes such as cell growth, differentiation, and metabolism. Their activity is essential for maintaining the balance of phosphorylation-dephosphorylation and for the proper function of many cellular signaling networks.
