    text: >-
      MICROSOMAL GLUTATHIONE S-TRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10250. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function glutathione transferase activity, oxidoreductase activity, acting on peroxide as acceptor, antioxidant activity.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the metabolism of lipid signaling molecules through enzymatic activities that include the conjugation of reduced glutathione to various electrophilic compounds. Members of this family are key players in the biosynthesis of leukotrienes, which are inflammatory mediators, by catalyzing the conjugation of leukotriene A4 with glutathione to form leukotriene C4. Some members also display glutathione peroxidase activity, reducing lipid hydroperoxides to their corresponding alcohols, and are involved in the detoxification of xenobiotic electrophiles. Additionally, they may participate in the formation of bioactive lipid mediators with anti-inflammatory and proresolving actions, such as maresin conjugates.
    source: "InterPro:IPR050997 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
