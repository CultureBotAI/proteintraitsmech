identifier: PANTHER:PTHR15901
label: "TESTICULAR HAPLOID EXPRESSED GENE PROTEIN"
definition: >-
  This entry represents homologs of Sperm microtubule associated protein 2 (SPMAP2, formerly testicular haploid enriched gene or THEG) and Sperm microtubule associated protein 2-like (SPMAP2L, formerly Testicular haploid expressed gene-like THEGL). These proteins are axonemal wedge-MAPs (microtubule-associated proteins) that were identified in the sperm doublet microtubules (DMTs). These proteins have an unique tubulin binding mode stretching laterally across several protofilaments of the B tubule. SPMAP2 binds along the α/β tubulin interface and periodically dips into the inter-protofilament clefts.
definition_source: "InterPro:IPR042401 abstract (PANTHER PTHR15901 is a member signature)"
