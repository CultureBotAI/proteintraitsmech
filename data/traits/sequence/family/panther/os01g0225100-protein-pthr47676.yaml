identifier: PANTHER:PTHR47676
label: "OS01G0225100 PROTEIN"
definition: >-
  This family represents the SMR domain-containing protein At5g58720 from Arabidopsis thaliana and related plant proteins, mainly from clade Magnoliopsida. Members of this family contain SMR domain which is typically involved in DNA repair processes and is found in a variety of proteins that participate in mismatch repair and the maintenance of genomic stability.
