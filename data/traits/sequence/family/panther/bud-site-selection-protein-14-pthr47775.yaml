identifier: PANTHER:PTHR47775
label: "BUD SITE SELECTION PROTEIN 14"
definition: >-
  This family of proteins includes factors involved in the regulation of cell polarity and bud site selection in yeast. Members of this family are essential for the proper localization of cell-end markers and the establishment of cell polarity during the cell cycle. They operate in complex with other proteins to maintain polarity under normal and stress conditions. Additionally, they are implicated in the regulation of actin assembly at cell tips, particularly during the initiation of new growth phases. Some family members also play a role in the regulation of microtubule dynamics at the cortex, possibly by activating specific complexes such as dynein. They may also function as regulatory subunits of phosphatase complexes, influencing processes like bud site selection.
