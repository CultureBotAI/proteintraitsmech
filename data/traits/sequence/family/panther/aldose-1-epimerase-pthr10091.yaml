identifier: PANTHER:PTHR10091
label: ALDOSE-1-EPIMERASE
definition: >-
  ALDOSE-1-EPIMERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10091. PANTHER protein class: epimerase/racemase, metabolite interconversion enzyme. Members are annotated with the molecular function racemase and epimerase activity, acting on carbohydrates and derivatives. Members participate in glucose metabolic process, carbohydrate catabolic process, small molecule catabolic process.
