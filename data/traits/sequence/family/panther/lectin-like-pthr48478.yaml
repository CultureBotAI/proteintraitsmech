identifier: PANTHER:PTHR48478
label: LECTIN-LIKE
definition: >-
  Phloem protein 2 (PP2) is one of the most abundant and enigmatic proteins in the phloem sap. PP2 is translocated in the assimilate stream where its lectin activity or RNA-binding properties can exert effects over long distances. PP2-like genes have been identified in many plant species, indicating a wide distribution of PP2 genes in the plant kingdom. Phloem Protein2-Like A1 and Phloem Protein2-Like A2 are presumed to have roles in phloem function, although their specific functions remain uncharacterised. Some members of the family, like PP2-Like A5, contain a TIR domain which is implicated in NAD(+) hydrolase activity and is essential for self-association required for this activity. Phloem lectins bind chito-oligosaccharides and may have hemagglutinating activity or be involved in plant defense by binding to the chitin cell wall of pathogens.
