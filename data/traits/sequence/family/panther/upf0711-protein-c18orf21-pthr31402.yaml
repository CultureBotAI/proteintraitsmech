label: "UPF0711 PROTEIN C18ORF21"
definition: >-
  This protein family includes human Ribonuclease MRP subunit P24 (Rmp24, also known as C18orf21) and similar animal proteins. Rmp24 is required for the activity of human RNase MRP but not RNase P.
