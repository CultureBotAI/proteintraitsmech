identifier: PANTHER:PTHR16784
label: ENAMELIN
definition: >-
  Enamelin is a secreted structural protein that acts to create dental enamel matrix. Enamelin protein is proteolytically cleaved into several products, which are identified by their molecular weights and appear to have different functions in different enamel compartments. It is not currently known how enamelin interacts with other proteins of the enamel matrix. Enamelin mutations have been found to cause certain forms of amelogenesis imperfecta, a condition in which enamel is malformed.
