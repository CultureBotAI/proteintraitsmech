    text: >-
      This family of proteins appears to play a role in the process of cytokinesis, specifically in the timing of cell separation. Members of this family may function either as enzymes involved in the degradation of glucans within the cell wall at the neck region between mother and daughter cells, or as regulatory proteins that control this metabolic step. The presence of intragenic tandem repeats, which can vary among strains, suggests a potential for variability in function or regulation within this family.
