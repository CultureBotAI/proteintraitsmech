identifier: PANTHER:PTHR11662
label: "SOLUTE CARRIER FAMILY 17"
definition: >-
  This entry represents Vesicular glutamate transporter and related proteins. Members of this family function as uniporters, symporters, and antiporters, often driven by electrochemical gradients. They play critical roles in transporting L-glutamate, phosphate, chloride, protons, potassium, sodium, and other anions. These transport activities are essential for processes such as synaptic transmission, cellular nutrient uptake, and ion homeostasis. Some members are involved in specialised functions like urate transport in the kidney, vesicular storage of neurotransmitters, and regulation of retinal vessel development. The activity of these transporters can be allosterically regulated by ions such as H+ and Cl-, and they are associated with various physiological functions in different tissues, including the nervous system, kidney, and chloroplasts in plants.
definition_source: "InterPro:IPR050382 abstract (PANTHER PTHR11662 is a member signature)"
