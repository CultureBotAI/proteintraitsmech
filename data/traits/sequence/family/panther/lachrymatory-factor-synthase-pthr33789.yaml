  - kind: GENERAL
    text: >-
      This family of proteins is involved in the production of a compound known as the lacrymatory factor, which is responsible for causing tears. The enzyme catalyzes the transformation of 1-propenylsulphenic acid into the lacrymatory factor. The 1-propenylsulphenic acid is an unstable intermediate that is generated from the breakdown of trans-1-propenyl-L-cysteine sulphoxide (PRENCSO) by the enzyme alliinase. This biochemical reaction is significant in the context of plants where it serves as a defense mechanism, particularly noted in species like onions that release a tear-inducing substance when their tissues are damaged.
