identifier: PANTHER:PTHR37308
label: "INTEGRAL MEMBRANE PROTEIN"
definition: >-
  This entry represents a group of prokaryotic proteins associated with transmembrane transport of undecaprenyl phosphate lipids, which is required for the biogenesis of microbial cell surface polymers, including UniProtKB:Q9KNC5 from Vibrio cholerae (VCA0040). Members of this family usually have between 6 and 9 predicted transmembrane segments.
