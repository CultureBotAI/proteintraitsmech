identifier: PANTHER:PTHR40053
label: "SPORULATION-CONTROL PROTEIN SPO0M"
definition: >-
  This family consists of several bacterial SpoOM proteins which are thought to control sporulation in Bacillus subtilis.Spo0M exerts certain negative effects on sporulation and its gene expression is controlled by sigmaH.
