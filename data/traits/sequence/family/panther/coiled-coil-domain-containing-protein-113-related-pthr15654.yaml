identifier: PANTHER:PTHR15654
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 113-RELATED"
definition: >-
  This family of proteins includes components associated with centriolar satellites, which are crucial for primary cilium formation. The primary cilium is a microtubule-based organelle that extends from the surface of many vertebrate cells and is involved in signal transduction. The proteins in this family contain coiled-coil domains, which are known to facilitate protein-protein interactions. These interactions are essential for the assembly and stability of the centriolar satellites and thus play a significant role in the biogenesis of the primary cilium. The presence of these proteins in multiple species suggests a conserved function in ciliogenesis across different organisms.
