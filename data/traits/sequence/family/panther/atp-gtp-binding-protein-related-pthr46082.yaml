identifier: PANTHER:PTHR46082
label: "ATP/GTP-BINDING PROTEIN-RELATED"
definition: >-
  This family of proteins includes members with a multi-domain architecture that is involved in nucleotide binding and hydrolysis. Nucleotide-binding leucine-rich repeat (NLR)-like protein from Hyaloscypha variabilis contains a purine nucleoside phosphorylase (PNP) domain at the N-terminal that cleaves the N-glycosidic bond of ATP, and to a lesser extent dATP with very weak activity on adenosine and deoxyadenosine and no activity on (d)ADP or (d)AMP. The C-terminal region is characterised by the presence of TRP repeats, which may be involved in protein-protein interactions.
