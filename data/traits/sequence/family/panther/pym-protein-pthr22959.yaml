identifier: PANTHER:PTHR22959
label: "PYM PROTEIN"
definition: >-
  Partner of Y14 and mago (PYM, also known as WIBG) is a key regulator of the exon junction complex (EJC), a multiprotein complex that associates immediately upstream of the exon-exon junction on mRNAs and serves as a positional landmarks for the intron exon structure of genes and directs post-transcriptional processes in the cytoplasm such as mRNA export, nonsense-mediated mRNA decay (NMD) or translation.
