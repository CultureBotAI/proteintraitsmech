label: "OROTATE PHOSPHORIBOSYLTRANSFERASE 1-RELATED"
definition: >-
  OROTATE PHOSPHORIBOSYLTRANSFERASE 1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46683. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function transferase activity, catalytic activity, pentosyltransferase activity. Members participate in pyrimidine nucleobase metabolic process, carbohydrate derivative biosynthetic process, nucleoside metabolic process. Members localise to cytoplasm.
