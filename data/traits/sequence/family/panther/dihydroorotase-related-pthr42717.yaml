identifier: PANTHER:PTHR42717
label: DIHYDROOROTASE-RELATED
definition: >-
  Atu3266 from Agrobacterium tumefaciens and Oant2987 from Ochrobactrum anthropi catalyze the hydrolysis of acetyl-(R)-mandelate and similar esters. These enzymes were previously misannotated as either dihydroorotases or adenine deaminases.
