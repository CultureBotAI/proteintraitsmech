identifier: PANTHER:PTHR22839
label: "THO COMPLEX SUBUNIT 3  THO3"
definition: >-
  This entry includes Tex1 from budding yeasts and THOC3 from animals and plants. Tex1/THOC is part of the TREX complex involved in mRNA export. TREX complex is thought to couple mRNA transcription, processing and nuclear export. It specifically associates with spliced mRNA and not with unspliced pre-mRNA. The THOC1-THOC2-THOC3 core complex alone is sufficient to bind export factor NXF1-NXT1 and promote ATPase activity of DDX39B.
definition_source: "InterPro:IPR040132 abstract (PANTHER PTHR22839 is a member signature)"
