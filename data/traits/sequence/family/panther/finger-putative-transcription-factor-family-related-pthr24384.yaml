definitions:
  - kind: GENERAL
    text: >-
      FINGER PUTATIVE TRANSCRIPTION FACTOR FAMILY-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24384. PANTHER protein class: DNA-binding transcription factor. Members are annotated with the molecular function cis-regulatory region sequence-specific DNA binding, RNA polymerase II cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that are involved in various developmental and regulatory processes. Members of this family are characterized by the presence of C2H2-type zinc-finger domains, which facilitate DNA binding and allow these proteins to regulate gene expression. Functions attributed to these proteins include roles in embryonic central nervous system development, neuronal fate specification, muscle structure, and transcriptional regulation of specific genes. Some family members are implicated in processes such as cell proliferation, migration, inflammation, and embryonic development. Additionally, certain proteins within this family have been associated with the modulation of signaling pathways and the maintenance of pluripotency in stem cells.
    source: "InterPro:IPR050752 abstract (LLM-generated, not curator-reviewed)"
