identifier: PANTHER:PTHR32282
label: "BINDING PROTEIN TRANSPEPTIDASE, PUTATIVE-RELATED"
definition: >-
  The glycosyltransferase 51/transpeptidase family is involved in bacterial cell wall formation. Members of the family catalyse the synthesis of cross-linked peptidoglycan from lipid intermediates. The enzymes typically have a bifunctional structure with a penicillin-insensitive transglycosylase N-terminal domain that forms linear glycan strands and a penicillin-sensitive transpeptidase C-terminal domain responsible for cross-linking peptide subunits. This process is essential for maintaining cell wall integrity and shape. Some family members are monofunctional glycosyltransferases that specialise in glycan chain elongation. The activity of these enzymes can be regulated by environmental pH and inhibited by antibiotics such as moenomycin. The family plays a crucial role in various stages of bacterial growth, including vegetative growth and spore outgrowth.
definition_source: "InterPro:IPR050396 abstract (PANTHER PTHR32282 is a member signature)"
