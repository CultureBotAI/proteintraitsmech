  - kind: GENERAL
    text: >-
      MITOCHONDRIAL 2-OXODICARBOXYLATE CARRIER 1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45678. PANTHER protein class: secondary carrier transporter, transporter. Members are annotated with the molecular function transmembrane transporter activity, transporter activity. and participate in establishment of localization, transport.
