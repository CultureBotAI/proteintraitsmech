  - kind: GENERAL
    text: >-
      The CFA/CMAS family comprises enzymes that modify fatty acids and related molecules, primarily through the transfer of methyl groups from S-adenosyl-L-methionine (SAM). Members of this family are involved in the biosynthesis of mycolic acids, which are critical components of the mycobacterial cell wall, affecting cell envelope permeability, host immunomodulation, and persistence. The family includes mycolic acid methyltransferases that convert cis-olefins to trans-olefins and introduce methyl branches, cyclopropane mycolic acid synthases that form cyclopropane rings in mycolic acids, and enzymes involved in the biosynthesis of oxygenated mycolic acids such as methoxymycolate and ketomycolate. Some members also modify short-chain fatty acids and participate in the biosynthesis of antibiotics like novobiocin.
    source: "InterPro:IPR050723 abstract (LLM-generated, not curator-reviewed)"
