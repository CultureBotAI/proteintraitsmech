identifier: PANTHER:PTHR34847
label: "NODULATION PROTEIN U"
definition: >-
  The NodU/CmcH family consists of carbamoyltransferases involved in various biosynthetic pathways. Members of this family play key roles in the modification of natural compounds, such as antibiotics and nodulation factors. For instance, they are responsible for the 3'-carbamoylation of the noviosyl ring in novobiocin biosynthesis, a crucial step in producing this aminocoumarin antibiotic that inhibits bacterial DNA gyrases. Additionally, they participate in the 6-O-carbamoylation of Nod-factors, which are signaling molecules essential for symbiotic nitrogen fixation in legumes. Some members also catalyze the carbamoylation reaction in cephamycin biosynthesis, an important process for the production of this class of β-lactam antibiotics. Furthermore, the family includes enzymes involved in the biosynthesis of 2-deoxystreptamine-containing aminoglycoside antibiotics, such as nebramycin and kanamycin, by transferring carbamoyl groups to these compounds. The family's activities are critical for the modification and effectiveness of these bioactive molecules.
