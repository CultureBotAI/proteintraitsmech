  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of cellular processes that prevent epithelial cells from undergoing a transformation into a mesenchymal cell state. They play a role in maintaining cell polarity and adhesion, thereby inhibiting the increased migratory and invasive capabilities that characterize the mesenchymal phenotype. Their function is crucial in controlling epithelial-mesenchymal transition, a critical event in developmental processes, tissue regeneration, and cancer progression.
