identifier: PANTHER:PTHR12604
label: "KU AUTOANTIGEN DNA HELICASE"
definition: >-
  KU AUTOANTIGEN DNA HELICASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12604. PANTHER protein class: DNA helicase, DNA metabolism protein. Members are annotated with the molecular function telomeric DNA binding, double-stranded DNA binding. Members participate in cellular aromatic compound metabolic process, double-strand break repair via nonhomologous end joining, double-strand break repair. Members localise to protein-containing complex, nuclear protein-containing complex.
