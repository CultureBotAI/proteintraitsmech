identifier: PANTHER:PTHR12604
label: "KU AUTOANTIGEN DNA HELICASE"
definition: >-
  KU AUTOANTIGEN DNA HELICASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12604. PANTHER protein class: DNA helicase, DNA metabolism protein. Members are annotated with the molecular function telomeric DNA binding, double-stranded DNA binding. Members participate in double-strand break repair via nonhomologous end joining, telomere maintenance. Members localise to nuclear protein-containing complex.
