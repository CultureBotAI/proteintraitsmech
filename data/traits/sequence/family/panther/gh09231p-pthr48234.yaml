  - kind: GENERAL
    text: >-
      This family of proteins is involved in bacterial adhesion and invasion processes. They facilitate the attachment of bacteria to various host substrates, including fibronectin, fibrinogen, elastin peptides, and tropoelastin. These interactions enable the bacteria to invade endothelial cells and adhere to activated platelets, contributing to bacterial colonization and persistence within the host. The proteins possess multiple binding regions that interact with both soluble and immobilized forms of fibronectin and fibrinogen. They can mediate invasion through actin rearrangement in host cells, a process that is also mediated by integrin alpha-5/beta-1. Additionally, they play a role in the induction of experimental endocarditis by promoting colonization and persistence of bacteria in host tissues.
    source: "InterPro:IPR052506 abstract (LLM-generated, not curator-reviewed)"
