identifier: PANTHER:PTHR47656
label: "HOMEOBOX PROTEIN MIXL"
definition: >-
  This entry represents human Homeobox protein MIXL1 and similar sequences mainly found in vertebrates. MIXL1 is a homeobox transcription factor essential for the patterning of axial mesendodermal structures during early embryogenesis. It interacts with the T-box protein Brachyury and related members of the T-box family of transcription factors; this interaction negatively regulates MIXL1 transcriptional activity. In mice, enforced expression of MIXL1 results in transplantable AML (acute myeloid leukaemia), suggesting a leukaemogenic potential for MIXL1.
