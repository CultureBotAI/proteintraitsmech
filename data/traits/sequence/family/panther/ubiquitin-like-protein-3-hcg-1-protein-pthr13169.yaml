identifier: PANTHER:PTHR13169
label: "UBIQUITIN-LIKE PROTEIN 3  HCG-1 PROTEIN"
definition: >-
  Proteins in this entry possess a ubiquitin-2 like Rad60 SUMO-like domain. These ubiquitin-fold proteins are plasma membrane-anchored by prenylation. Proteins include mammalian ubiquitin-like protein 3, which has a ubiquitous distribution, and plant membrane-anchored ubiquitin-fold proteins 1 to 6, which, in Arabidopsis, recruit and dock specific E2 ubiquitin-conjugating enzymes to the plasma membrane. They appear to interact noncovalently with an E2 surface opposite the active site that forms a covalent linkage with Ub. This entry also includes uncharacterised proteins from fungi.
definition_source: "InterPro:IPR040015 abstract (PANTHER PTHR13169 is a member signature)"
