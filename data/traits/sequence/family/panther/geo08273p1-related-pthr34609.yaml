identifier: PANTHER:PTHR34609
label: GEO08273P1-RELATED
definition: >-
  This family of proteins includes members that are integral components of tight junctions, which are structures that seal the space between adjacent epithelial cells. They are implicated in the regulation of paracellular ion transport across epithelial cell layers. The proteins in this family contain a MARVEL domain, which is associated with processes involving membrane apposition and formation of vesicle-like structures, suggesting a role in membrane trafficking and tight junction assembly or maintenance.
