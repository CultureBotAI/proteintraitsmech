identifier: PANTHER:PTHR46150
label: "RHO GTPASE-ACTIVATING PROTEIN 100F"
definition: >-
  This family of proteins includes Rho GTPase-activating proteins (GAPs) that function as regulators of Rho-type GTPases, converting them from an active GTP-bound state to an inactive GDP-bound state. They play a crucial role in cytoskeletal remodeling by controlling the activity of Rho GTPases such as RHOA, CDC42, and RAC1. Members of this family are involved in various cellular processes, including placental development, trophoblast cell migration, presynaptic development, axon polarity acquisition, and synaptic component localization. They act downstream of specific signaling pathways and are essential for the regulation of movement, egg-laying, and maintaining high levels of synaptic proteins in active zones.
