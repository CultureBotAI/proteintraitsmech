identifier: PANTHER:PTHR22991
label: "PROTEIN CBG13490"
definition: >-
  This family of proteins includes members that interact with components of the hemostatic system, particularly platelets, to modulate aggregation and coagulation processes. They typically act by binding to specific platelet receptors such as integrin alpha-2/beta-1, GPIbalpha, and potentially others, blocking interactions with collagen, von Willebrand factor, or other agonists that promote platelet aggregation. Some members exhibit anticoagulant properties by binding to coagulation factors. Additionally, certain proteins within this family may have roles in immune responses, such as inducing histamine release, or possess antiparasitic and antibiotic activities. The functions of these proteins are often associated with their ability to regulate cell adhesion, migration, proliferation, and angiogenesis, which may be mediated through interactions with integrin receptors.
