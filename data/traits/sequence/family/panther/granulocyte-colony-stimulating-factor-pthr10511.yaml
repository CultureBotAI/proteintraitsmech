identifier: PANTHER:PTHR10511
label: "GRANULOCYTE COLONY-STIMULATING FACTOR"
definition: >-
  This family includes granulocyte colony-stimulating factor (GCSF) and myelomonocytic growth factor (MGF). GCSF acts in hematopoiesis by affecting the production, differentiation and function of 2 related white cell groups in the blood. MGF also acts in hematopoiesis, stimulating proliferation and colony formation of normal and transformed avian cells of the myeloid lineage.
