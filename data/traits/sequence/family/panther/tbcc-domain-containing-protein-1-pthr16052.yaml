identifier: PANTHER:PTHR16052
label: "TBCC DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  TBCC-domain containing 1 (TBCCD1) has a role in internal cell organization in animals, Chlamydomonas reinhardtii, and trypanosomes. In humans, it is required for centrosome and Golgi apparatus positioning.
