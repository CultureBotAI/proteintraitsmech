identifier: PANTHER:PTHR22648
label: "TRANSCRIPTION TERMINATION FACTOR NUSA"
definition: >-
  NusA is involved in transcriptional pausing, termination and anti-termination. NusA from Thermotoga maritima contains an N-terminal domain InterPro:IPR013735 and three RNA-binding domains (one S1 domain InterPro:IPR003029 and two KH domains InterPro:IPR025249 ). The N-terminal domain consists of a bifurcated coiled β-sheet within an α/β(3)/α/β/α fold, which can be divided into two subdomains: a globular head and a helical body. The globular head subdomain may interact with RNA polymerase, while the helical body displays a similar structure to that of the helical domain in sigma70.
definition_source: "InterPro:IPR030842 abstract (PANTHER PTHR22648 is a member signature)"
