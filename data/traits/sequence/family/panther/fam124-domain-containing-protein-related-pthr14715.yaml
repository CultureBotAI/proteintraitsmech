identifier: PANTHER:PTHR14715
label: "FAM124 DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  This entry represents a group of eukaryotic proteins that are approximately 480 amino acids in length. FAM124 belongs to the Vicinial Oxygen Chelatase (VOC) superfamily of proteins and is comprised of two tandem α/β domains, which might be enzymatic. Certain FAM124 domains fused to the TRADD-N domain are predicted to have secondarily lost their enzymatic activity and might be involved in protein-protein interactions.
