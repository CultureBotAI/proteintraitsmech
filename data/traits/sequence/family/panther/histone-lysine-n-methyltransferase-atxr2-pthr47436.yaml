identifier: PANTHER:PTHR47436
label: "HISTONE-LYSINE N-METHYLTRANSFERASE ATXR2"
definition: >-
  This entry includes ATXR2 from Arabidopsis. ATXR2 is a histone lysine methyltransferase that promotes the accumulation of histone H3 proteins that are trimethylated on lysine 36 (H3K36me3) during callus formation on callus-inducing medium. It promotes early stages of cellular dedifferentiation through activation of LATERAL ORGAN BOUNDARIES DOMAIN (LBD) genes and acts as a regulator of de novo root organogenesis.
