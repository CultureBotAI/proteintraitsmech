identifier: PANTHER:PTHR21636
label: "PROTEIN DOK-7"
definition: >-
  Dok-7 is a cytoplasmic adaptor protein and a member of the Dok family. It is a substrate of MuSK (a receptor tyrosine kinase) and an activator of MuSK's kinase activity. Mutations of the Dok-7 gene cause Myasthenic syndrome, congenital, 10 (CMS10), a form of congenital myasthenic syndrome, a group of disorders characterised by failure of neuromuscular transmission, including pre-synaptic, synaptic, and post-synaptic disorders that are not of autoimmune origin. The Dok family adapters are phosphorylated by different protein tyrosine kinases. Dok proteins are involved in processes such as modulation of cell differentiation and proliferation, as well as in control of the cell spreading and migration The Dok protein contains an N-terminal pleckstrin homology (PH) domain followed by a central phosphotyrosine binding (PTB) domain, which has a PH-like fold, and a proline- and tyrosine-rich C-terminal tail. The PH domain binds to acidic phospholids and localizes proteins to the plasma membrane, while the PTB domain mediates protein-protein interactions by binding to phosphotyrosine-containing motifs.
