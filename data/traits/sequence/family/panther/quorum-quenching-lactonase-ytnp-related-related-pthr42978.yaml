identifier: PANTHER:PTHR42978
label: "QUORUM-QUENCHING LACTONASE YTNP-RELATED-RELATED"
definition: >-
  This family of proteins includes enzymes that exhibit hydrolytic activity on various lactone substrates, including N-acyl homoserine lactonase from Bacillus thuringiensis, which catalyses the hydrolysis of N-acyl homoserine lactones, which are signalling molecules involved in bacterial quorum sensing. Some family members are involved in the degradation of plant-produced benzoxazolinones, acting as gamma-lactamases that convert these compounds into less toxic forms. The proteins typically show a preference for certain substrates based on acyl chain length and the presence of specific substitutions. They are part of the metallo-beta-lactamase superfamily and share a common structural fold that coordinates metal ions, which are essential for their catalytic function. The family also includes enzymes that degrade vitamin B6 derivatives and may have roles in defence against competing bacteria by disrupting their communication systems. Proteins in this entry are mainly found in bacteria and fungi.
