identifier: PANTHER:PTHR31423
label: "YBAK DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry includes prolyl-tRNA editing protein ProX from Acetoanaerobium sticklandii and uncharacterised eukaryotic proteins known as prolyl-tRNA synthetase associated domain-containing proteins. ProX functions in trans to edit the amino acid moiety from incorrectly charged Ala-tRNA(Pro).
