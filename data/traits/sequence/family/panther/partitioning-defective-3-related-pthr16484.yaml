identifier: PANTHER:PTHR16484
label: "PARTITIONING DEFECTIVE 3 RELATED"
definition: >-
  The PAR3 family consists of adapter proteins involved in the establishment and maintenance of cell polarity, playing a pivotal role in asymmetrical cell division. Members of the family are central to the formation of epithelial tight junctions and are implicated in various cellular processes, including the targeting of the phosphatase PTEN to cell junctions, Schwann cell peripheral myelination, and the establishment of neuronal polarity and axon formation. The family proteins interact with PARD6B and atypical protein kinase C proteins via GTP-bound Rho small GTPases, influencing tight junction assembly and cell polarization. Some members are also involved in early embryonic development, contributing to cell adhesion, gastrulation, and the establishment of apicobasal and anterior-posterior asymmetries.
