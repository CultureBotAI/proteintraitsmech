identifier: PANTHER:PTHR45920
label: "FORMIN HOMOLOGY 2 DOMAIN CONTAINING, ISOFORM I"
definition: >-
  FORMIN HOMOLOGY 2 DOMAIN CONTAINING, ISOFORM I — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45920. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function actin filament binding. Subfamilies participate in cortical actin cytoskeleton organization. Subfamilies localise to cytoskeleton, intracellular anatomical structure, cytoplasm.
