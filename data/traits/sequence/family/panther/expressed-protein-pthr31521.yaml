identifier: PANTHER:PTHR31521
label: "EXPRESSED PROTEIN"
definition: >-
  Narrow leaf 1 (Nal1) is a serine protease with pleiotropic roles in plant development, affecting several agronomic traits including leaf width, plant height, root architecture, and grain yield. Nal1 regulates lateral leaf growth by modulating basipetal polar auxin transport and vascular patterning, which are essential for proper leaf development. It also influences photosynthetic efficiency by regulating carboxylation activity, thereby impacting the rate of photosynthesis. In addition, Nal1 degrades the TOPLESS-related corepressor OsTPR2, thereby modulating the expression of downstream genes involved in hormone signalling pathways. Nal1 proteins also contribute to the determination of panicle and spikelet numbers, traits that are directly associated with grain productivity.
definition_source: "InterPro:IPR057906 abstract (PANTHER PTHR31521 is a member signature)"
