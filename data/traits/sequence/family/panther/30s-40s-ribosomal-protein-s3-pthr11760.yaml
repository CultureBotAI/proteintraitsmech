identifier: PANTHER:PTHR11760
label: "30S/40S RIBOSOMAL PROTEIN S3"
definition: >-
  Ribosomal protein uS3 is one of the proteins from the small ribosomal subunit. This entry describes the ribosomal protein uS3 found in bacteria, archaea, and eukaryotes. The ribosomal protein uS3 plays a crucial role in translation initiation as it positions the mRNA for translation by binding to the 30S and 70S ribosomal subunits and participates in the mRNA unwinding. In eukaroyes, it has also been reported to have extra-ribosomal functions. For example, uS3 has the ability to nick DNA. It also participates in the nuclear factor-kappa B (NF-kB) signalling pathway. Finally, it could be involved in the regulation of apoptosis. Ribosomes are the particles that catalyse mRNA-directed protein synthesis in all organisms. The codons of the mRNA are exposed on the ribosome to allow tRNA binding. This leads to the incorporation of amino acids into the growing polypeptide chain in accordance with the genetic information. Incoming amino acid monomers enter the ribosomal A site in the form of aminoacyl-tRNAs complexed with elongation factor Tu (EF-Tu) and GTP. The growing polypeptide chain, situated in the P site as peptidyl-tRNA, is then transferred to aminoacyl-tRNA, and the new peptidyl-tRNA, extended by one residue, is translocated to the P site with the aid of the elongation factor G (EF-G) and GTP as the deacylated tRNA is released from the ribosome through one or more exit sites. About 2/3 of the mass of the ribosome consists of RNA and 1/3 consists of protein. The proteins are named in accordance with the subunit of the ribosome which they belong to: the small (S1 to S31) and the large (L1 to L44). Usually they decorate the rRNA cores of the subunits. Many ribosomal proteins, particularly those of the large subunit, are composed of a globular, surfaced-exposed domain with
definition_source: "InterPro:IPR057258 abstract (PANTHER PTHR11760 is a member signature)"
