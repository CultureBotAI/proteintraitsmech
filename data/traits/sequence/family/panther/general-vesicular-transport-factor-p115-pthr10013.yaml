identifier: PANTHER:PTHR10013
label: "GENERAL VESICULAR TRANSPORT FACTOR P115"
definition: >-
  General vesicular transport factor P115, also known as USO1, is required for inter-cisternal transport in the Golgi stack and for transcytotic fusion and/or subsequent binding of the vesicles to the target membrane. It is required for both the formation of the Golgi stacks and the maintenance of the individual cisternae.
