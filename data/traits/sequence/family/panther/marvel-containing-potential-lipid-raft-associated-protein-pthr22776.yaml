  - kind: GENERAL
    text: >-
      This family of proteins includes members with a variety of functions related to cellular transport, immune regulation, and cell differentiation. Some proteins in this family are involved in vesicular trafficking, particularly in the cycling between the Golgi complex and the plasma membrane, which may be important for myelin biogenesis and function. Others act as regulators of immune checkpoints, specifically in the recycling and expression of PD-L1 on the cell surface, which is crucial for immune tolerance and antitumor immunity. Additionally, certain members have been implicated in cell differentiation within the intestinal epithelium. The family also contains proteins that may participate in ion transport by forming voltage-dependent, potassium-selective channels when incorporated into lipid bilayers.
