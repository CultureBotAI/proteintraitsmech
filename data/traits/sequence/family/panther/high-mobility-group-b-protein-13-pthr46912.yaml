identifier: PANTHER:PTHR46912
label: "HIGH MOBILITY GROUP B PROTEIN 13"
definition: >-
  This entry represents a group of 3xHMG-box proteins (containing three copies of the HMG-box domain and a unique basic N-terminal domain), including 3xHMG-box1 (AT4G11080, also known as HMGB13) and 3xHMG-box2 (AT4G23800, also known as HMGB6) from Arabidopsis. Their three HMG-box domains and the basic N-terminal domain contribute to DNA binding. Their expression is induced in late G2 phase of the cell cycle, and upon nuclear envelope breakdown in prophase they rapidly associate with the chromosomes. Shortly after mitosis they are degraded and an N-terminal destruction-box mediates the proteolysis. They may play a role in the organisation of plant mitotic chromosomes.
definition_source: "InterPro:IPR044601 abstract (PANTHER PTHR46912 is a member signature)"
