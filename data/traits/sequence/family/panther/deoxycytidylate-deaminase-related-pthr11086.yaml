identifier: PANTHER:PTHR11086
label: "DEOXYCYTIDYLATE DEAMINASE-RELATED"
definition: >-
  Deoxycytidylate deaminase (EC:3.5.4.12) (dCMP deaminase) hydrolyzes deoxycytidylate mono phosphate (dCMP) into deoxyuridine mono phosphate (dUMP), thus providing the nucleotide substrate for thymidylate synthase. The enzyme requires zinc for catalytic activity which is regulated by the ratio of dCTP to dTTP, both the end products of the pyrimidine salvage pathway. It contains a cytidine and deoxycytidylate deaminase domain. This entry also includes CDADC1 (cytidine and dCMP deaminase domain-containing protein 1), also known as testis development protein NYD-SP15, which may play an important role in testicular development and spermatogenesis. CDADC1 contains two cytidine and deoxycytidylate deaminase domains.
definition_source: "InterPro:IPR015517 abstract (PANTHER PTHR11086 is a member signature)"
