identifier: PANTHER:PTHR15297
label: "IMMUNOGLOBULIN SUPERFAMILY MEMBER 6"
definition: >-
  The function of IGSF6 (also known as DOwn-Regulated by Activation or DORA) is not clear. The human gene is encoded with an intron of the METTL9 gene; this locus is locus associated with inflammatory bowel disease and activation of dendritic cells by CD40L down-regulates the DORA gene.
