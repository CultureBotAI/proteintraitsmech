identifier: PANTHER:PTHR15503
label: "LDOC1 RELATED"
definition: >-
  This family includes mammalian retrotransposon-derived proteins from the Mart family: RTL1/Mart1, PEG10/Mart2, ZCCHC5/Mart3, Zcchc16/Mart4, RGAG4/Mart5 and related retrotransposon Gag-like proteins. RTL1/Mart1 plays an essential role in capillaries endothelial cells for the maintenance of feto-maternal interface and for development of the placenta..
