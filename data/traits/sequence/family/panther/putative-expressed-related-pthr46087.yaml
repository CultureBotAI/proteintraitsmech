identifier: PANTHER:PTHR46087
label: "PUTATIVE, EXPRESSED-RELATED"
definition: >-
  This entry represents the SEMI-ROLLED LEAF 2 protein (SRL2) from Oryza sativa and related plant proteins. SRL2 is involved in the regulation of leaf development, specifically in the modulation of leaf rolling. This protein is mainly expressed in the vascular bundles of leaf blades, leaf sheaths, and roots, especially in their sclerenchymatous cells. SRL2 was implicated in the cellular differentiation processes on the abaxial (lower) side of leaves, influencing the development of specific cell types that contribute to the leaf's structure. This protein may play a role in the transdifferentiation of mesophyll cells into sclerenchymatous cells, which are known for their supportive function in plants.
definition_source: "InterPro:IPR055296 abstract (PANTHER PTHR46087 is a member signature)"
