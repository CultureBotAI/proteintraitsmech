identifier: PANTHER:PTHR47530
label: "E3 UBIQUITIN LIGASE BIG BROTHER-RELATED"
definition: >-
  This entry represents a group of plant proteins, including AtBBR (At3g19910) from Arabidopsis. Their function is not clear. They share protein sequence similarity with E3 ubiquitin-protein ligase BIG BROTHER in their RING finger domain.
