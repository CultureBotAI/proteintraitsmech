identifier: PANTHER:PTHR31412
label: "ZINC METALLOPROTEASE EGY1"
definition: >-
  This entry includes proteins from bacteria, archaea and plants. Some proteins in this entry belong to peptidase family M50, hence they have been predicted to be metalloendopeptidases. This entry includes the chloroplastic protein EGY1/2/3 from Arabidopsis. EGY1/2/3 proteins belong to the peptidase M50B family and are multi-pass membrane proteins involved in chloroplast development. EGY1 is an ATP-independent metalloprotease required for the development of both thylakoid grana and a well-organised lamellae system in chloroplast.
