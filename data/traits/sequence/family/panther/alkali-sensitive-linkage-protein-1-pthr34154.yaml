identifier: PANTHER:PTHR34154
label: "ALKALI-SENSITIVE LINKAGE PROTEIN 1"
definition: >-
  ALKALI-SENSITIVE LINKAGE PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR34154. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies participate in polysaccharide metabolic process, fungal-type cell wall organization or biogenesis, organic substance metabolic process. Subfamilies localise to fungal-type cell wall, cell periphery.
