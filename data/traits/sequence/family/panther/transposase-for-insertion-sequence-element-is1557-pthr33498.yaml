identifier: PANTHER:PTHR33498
label: "TRANSPOSASE FOR INSERTION SEQUENCE ELEMENT IS1557"
definition: >-
  This entry represents a group of proteins predominantly found in bacteria, that belong to the ISL3 family of transposases, including IS1557 from Mycobacterium tuberculosis and IS1001 from Bordetella parapertussis. Members of this protein family contain the DDE domain (InterPro:IPR002560).
