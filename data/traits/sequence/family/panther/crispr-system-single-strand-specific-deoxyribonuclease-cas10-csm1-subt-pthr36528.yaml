  - kind: GENERAL
    text: >-
      This family of proteins is involved in the CRISPR adaptive immune system, which defends against mobile genetic elements like viruses and plasmids. Members possess a single-strand-specific deoxyribonuclease (ssDNase) activity that digests ssDNA with both exo- and endonuclease actions. They are part of the type III-A Csm effector complex, which also includes CRISPR RNA (crRNA) and target ssRNA. The complex binds crRNA and acts as a crRNA-guided RNase, DNase, and cyclic oligoadenylate synthase. Binding of target RNA to the crRNA is essential for these activities. The proteins synthesize cyclic oligoadenylates (cOAs) from ATP, which act as second messengers to stimulate ssRNase activity and induce an antiviral state. The N-terminal HD domain is responsible for ssDNase activity, while the C-terminal GGDEF domain synthesizes cOAs. ssDNase activity is regulated by target RNA binding and is inhibited by EDTA.
    source: "InterPro:IPR052117 abstract (LLM-generated, not curator-reviewed)"
