identifier: PANTHER:PTHR15651
label: "ARMADILLO REPEAT-CONTAINING PROTEIN 8"
definition: >-
  Proteins in this family contain the armadillo-type fold, such as ARMC8 from humans and Vid28 from budding yeasts. Vid28 is a subunit of the GID Complex, a multisubunit ubiquitin ligase, involved in catabolite-induced degradation of gluconeogenic enzymes. ARMC8 plays an important role in regulating cell migration and proliferation, but its exact function is not clear.
