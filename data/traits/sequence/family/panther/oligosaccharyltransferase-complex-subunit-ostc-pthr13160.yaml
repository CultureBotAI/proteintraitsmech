identifier: PANTHER:PTHR13160
label: "OLIGOSACCHARYLTRANSFERASE COMPLEX SUBUNIT OSTC"
definition: >-
  The oligosaccharyltransferase complex catalyzes the transfer of oligosaccharide from a dolichol pyrophosphate donor en bloc onto a free asparagine residue of a newly synthesized nascent chain during the translocation in the endoplasmic reticulum lumen. OSTC, also known as DC2, is a oligosaccharyltransferase (OST) complex subunit. Together with KCP2, DC2 regulates the gamma-secretase-directed processing of amyloid precursor protein (APP).
definition_source: "InterPro:IPR042416 abstract (PANTHER PTHR13160 is a member signature)"
