identifier: PANTHER:PTHR10613
label: "LEUKOCYTE SURFACE ANTIGEN CD47"
definition: >-
  Leukocyte surface antigen CD47 (also known as integrin-associated protein, IAP) is a widely expressed membrane protein with multiple functions in immunological and neuronal processes. For example, CD47-induces caspase-independent cell death which may be mediated by cytoskeleton reorganisation. In red blood cells, CD47 acts like a marker of self by ligating the macrophage inhibitory receptor signal regulatory protein alpha. The protein can also act as a thrombospondin receptor. This entry also includes a group of CD-47-like proteins found in poxviruses (Poxviridae) such as protein A38, also known as Protein OPG166.
