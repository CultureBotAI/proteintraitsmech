identifier: PANTHER:PTHR47394
label: "SMALL CELL ADHESION GLYCOPROTEIN"
definition: >-
  SMAGP is a small transmembrane glycoprotein that contains a single-pass type III transmembrane helix and is heavily O-glycosylated with sialic acid modifications. SMAGP is localised predominantly at lateral parts of the cell membrane at cell-cell epithelial junctions and on cytoplasmic vesicle membranes. The protein is expressed in various tissues including kidney, placenta, brain and breast. SMAGP may play a role in epithelial cell-cell contacts and tumor invasiveness.
