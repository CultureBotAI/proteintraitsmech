identifier: PANTHER:PTHR33741
label: "TRANSMEMBRANE PROTEIN DDB_G0269096-RELATED"
definition: >-
  This entry represents a family of integral membrane proteins from all cellular organisms, including At3g47980 from Arabidopsis thaliana ( UniProtKB:Q84MC3 ), which is involved in nitrite transport. Members of this family have at least four transmembrane spanning helices. The most conserved region of an alignment of the proteins is a motif HPP. The specific role of these proteins is uncertain.
