identifier: PANTHER:PTHR10721
label: "MITOCHONDRIAL IMPORT INNER MEMBRANE TRANSLOCASE SUBUNIT TIM44"
definition: >-
  This entry includes mitochondrial import inner membrane translocase subunit Tim44 and its bacterial homologues. All possess a Tim44-like domain. Tim44 is an essential component of the PAM complex, which is required for the translocation of transit peptide-containing proteins from the inner membrane into the mitochondrial matrix in an ATP-dependent manner. It recruits mitochondrial HSP70 to drive protein translocation into the matrix using ATP as an energy source.
