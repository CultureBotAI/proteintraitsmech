    text: >-
      INTEGRAL MEMBRANE PROTEIN OF SOXR-REDUCING COMPLEX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30335. PANTHER protein class: oxidoreductase. Members localise to plasma membrane, cell periphery.
