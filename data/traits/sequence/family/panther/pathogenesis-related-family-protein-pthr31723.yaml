identifier: PANTHER:PTHR31723
label: "PATHOGENESIS-RELATED FAMILY PROTEIN"
definition: >-
  This family of proteins includes members that are typically associated with plant defense responses. They are often induced by pathogen attack and are part of the plant's innate immune system. These proteins can be involved in various mechanisms, such as the strengthening of cell walls, inhibition of pathogen enzymes, or direct antimicrobial activity. Their expression is usually regulated by pathogen recognition and signaling pathways that activate defense genes. The specific functions of individual members of this family may vary, but they generally contribute to the protection of the plant against a wide range of pathogens.
