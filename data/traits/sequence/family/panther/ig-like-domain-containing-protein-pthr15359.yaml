  - kind: GENERAL
    text: >-
      This family of proteins functions as modulators of calcium-binding by calmodulin, regulating its activity and the various processes it controls. Members of this family are characterized by an intrinsically disordered nature, with some residual structure primarily in the IQ domain. This domain is responsible for mediating interactions with calmodulin. Through their regulatory role, these proteins may influence neuronal differentiation by modulating calmodulin-dependent kinase signaling pathways.
