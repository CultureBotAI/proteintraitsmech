identifier: PANTHER:PTHR15440
label: "XRP2 PROTEIN"
definition: >-
  XRP2, also known as RP2, acts as a GTPase-activating protein (GAP). It has been shown to bind the GTP form of the small G protein Arf-like 3 (Arl3); this interaction regulates the trafficking of ciliary tip kinesins. Mutations in the retinitis pigmentosa 2 (RP2) gene cause a severe form of X-linked retinal degeneration.
