identifier: PANTHER:PTHR28076
label: "SPORULATION-SPECIFIC PROTEIN 71"
definition: >-
  This entry includes a group of meiosis-specific fungal proteins, including Mug56 from fission yeasts and Spo71 from budding yeasts. SPO71 is involved in the recruitment of the lipid transfer protein VPS13 to the prospore membrane during sporulation. It plays an important role in the prospore membrane development. MUG56 is required for meiosis.
