identifier: PANTHER:PTHR22975
label: "UBIQUITIN SPECIFIC PROTEINASE"
definition: >-
  This family includes ubiquitin carboxyl-terminal hydrolases 53 and 54 that, despite their classification in the peptidase C19 family, do not exhibit peptidase activity. Instead, certain members of this family are associated with tight junctions and are implicated in the survival of auditory hair cells and hearing. They may contribute to this biological process by modulating the barrier properties and mechanical stability of tight junctions.
