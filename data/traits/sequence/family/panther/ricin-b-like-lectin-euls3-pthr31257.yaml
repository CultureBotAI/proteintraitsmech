identifier: PANTHER:PTHR31257
label: "RICIN B-LIKE LECTIN EULS3"
definition: >-
  This entry represents a group of plant proteins, including EULS3 from Arabidopsis and related proteins from rice. They are lectins which bind carbohydrates. Rice Euonymus-related lectins (EULs) are stress-related lectins composed of one or two EUL domains. Arabidopsis EULS3 is involved in stomatal closure.
