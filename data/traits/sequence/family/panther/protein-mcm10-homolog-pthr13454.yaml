identifier: PANTHER:PTHR13454
label: "PROTEIN MCM10 HOMOLOG"
definition: >-
  Minichromosome maintenance protein 10 (Mcm10) is a eukaryotic DNA replication factor that regulates the stability and chromatin association of DNA polymerase alpha. It is required for DNA synthesis and for entry into or completion of S phase. It is associated with the DNA polymerase-alpha (pol-alpha) primase complex throughout the cell cycle, and is a nuclear chaperone for Cdc17, which is otherwise rapidly degraded. It is also required for maintenance of transcriptional silencing.
