identifier: PANTHER:PTHR31429
label: "WRKY TRANSCRIPTION FACTOR 36-RELATED"
definition: >-
  This entry represents a group of plant WRKY transcription factors. In Arabidopsis, WRKY1 binds to a 5'-CGTTGACCGAG-3' consensus core sequence which contains a W box, a frequently occurring elicitor-responsive cis-acting element. WRKY33 regulates the antagonistic relationship between defense pathways mediating responses to the bacterial pathogen P. syringae and the necrotrophic pathogen B.cinerea. It functions as a convergent substrate of CPK5/CPK6 and MPK3/MPK6, which cooperatively regulate camalexin (an antimicrobial compound) biosynthesis via the differential phospho-regulation of WRKY33 activity. WRKY33 also functions with WRKY25 as positive regulator of salt stress response and abscisic acid (ABA) signalling and with WRKY25/WRKY26 as positive regulator of plant thermotolerance by partially participating in ethylene-response signal transduction pathway. WRKY5 from rice acts as positive regulator of leaf senescence being involved in onset and progression of this process. It acts as negative regulator of drought tolerance by inhibiting ABA-induced stomatal closure during drought stress.
definition_source: "InterPro:IPR044810 abstract (PANTHER PTHR31429 is a member signature)"
