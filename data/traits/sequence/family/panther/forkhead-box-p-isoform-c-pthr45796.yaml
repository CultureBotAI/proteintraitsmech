definitions:
  - kind: GENERAL
    text: >-
      FORKHEAD BOX P, ISOFORM C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45796. PANTHER protein class: DNA-binding transcription factor, helix-turn-helix transcription factor, winged helix/forkhead transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
