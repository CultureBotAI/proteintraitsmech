identifier: PANTHER:PTHR47437
label: "JNK-INTERACTING PROTEIN 1-LIKE PROTEIN"
definition: >-
  This entry represents the JNK (c-Jun N-terminal kinase)-interacting proteins (JIP) scaffold family, a group of scaffold proteins that regulate signalling by stress-activated MAPKs (mitogen-activated protein kinase), including C-Jun-amino-terminal kinase-interacting protein 1/2 from humans (JIP1/2). These proteins selectively mediate JNK signalling by aggregating specific components of the MAPK cascade to form a functional JNK signalling module and are required for JNK activation in response to excitotoxic stress. They regulate the activation of MAPK8/JNK1 and differentiation of CD8+ T-cells. JIP-1 from Drosophila melanogaster, also known as JNK-interacting protein 1, is known to play roles in fast axonal transport that are important for neuron structure and function. Members of this family are found in animals.
definition_source: "InterPro:IPR047178 abstract (PANTHER PTHR47437 is a member signature)"
