identifier: PANTHER:PTHR46966
label: "HOMEOBOX EXPRESSED IN ES CELLS 1"
definition: >-
  Hesx1 is a class of homeodomain proteins that bind to DNA. It has been shown that Hesx1 functions as a transcriptional repressor required for normal forebrain development, eyes and other structures such as the olfactory placodes and pituitary gland. It has been described that alterations in Hesx1 produce impairment of its DNA binding properties leading to Septo-Optic Dysplasia (SOD) in humans, which exhibits optic nerve and pituitary gland hypoplasia as well as midline brain abnormalities like absence of the corpus callosum and septum pellucidum. This entry represents Hesx1A, Hesx1B and ANF-1.
definition_source: "InterPro:IPR043402 abstract (PANTHER PTHR46966 is a member signature)"
