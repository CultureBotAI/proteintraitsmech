  - kind: GENERAL
    text: >-
      This family of proteins includes decoy receptors that interact with various tumor necrosis factor superfamily ligands. They play a crucial role in regulating osteoclastogenesis by acting as decoy receptors for TNFSF11/RANKL, neutralizing its function and inhibiting osteoclast activation. These proteins are also involved in promoting osteoclast apoptosis, thus contributing to bone homeostasis, which is influenced by the local balance between TNFSF11 and the decoy receptors. Additionally, they may have a role in preventing arterial calcification and can act as decoy receptors for TNFSF10/TRAIL, providing protection against apoptosis. The binding of TNFSF10/TRAIL to these receptors can block the inhibition of osteoclastogenesis.
    source: "InterPro:IPR052459 abstract (LLM-generated, not curator-reviewed)"
