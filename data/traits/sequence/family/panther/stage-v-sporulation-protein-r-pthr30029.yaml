identifier: PANTHER:PTHR30029
label: "STAGE V SPORULATION PROTEIN R"
definition: >-
  One of the family members UniProtKB:P37875 is Bacillus subtilis stage V sporulation protein R, which is involved in spore cortex formation. Stage V sporulation protein R is involved in spore cortex formation. Little is known about cortex biosynthesis, except that it depends on several sigma E controlled genes, including spoVR. YcgB has been suggested to be part of a conserved signalling pathway with YeaH and YeaG. This pathway may be involved in nitrogen metabolism (see Supplementary note 5 in)
