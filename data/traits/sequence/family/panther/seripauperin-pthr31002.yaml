  - kind: GENERAL
    text: >-
      The SRP1/TIP1 family is characterized by proteins that are predominantly involved in cell wall composition and organization. Members of this family are found as components of the cell wall, with some required for anaerobic growth and others contributing to cell surface hydrophobicity. A subset of proteins within this family, known as the Seripauperin subfamily, shares these characteristics. Additionally, one member of the SRP1/TIP1 family exhibits esterase activity, preferring esters of fatty acids with chain lengths ranging from 4 to 16 carbon atoms. The presence of intragenic tandem repeats is noted in some proteins, indicating potential variability in function or structure among different strains of S. cerevisiae.
    source: "InterPro:IPR050788 abstract (LLM-generated, not curator-reviewed)"
