identifier: PANTHER:PTHR37365
label: "TESTIS-EXPRESSED PROTEIN 44"
definition: >-
  This family of proteins includes the uncharacterised testis-expressed protein 44 (in humans, the protein is a product of C2orf57). Proteins in the family are found in chordates and are typically between 318 and 395 amino acids in length.
