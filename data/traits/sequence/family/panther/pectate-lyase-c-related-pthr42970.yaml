  - kind: GENERAL
    text: >-
      The Polysaccharide Lyase 1 family includes pectinolytic enzymes that play a crucial role in the degradation of pectin, a plant cell wall polysaccharide. Members of the family are characterized by their ability to cleave internal glycosidic bonds in highly methylated pectins, a process that is essential for the breakdown of this complex carbohydrate. The enzymes preferentially act on pectate, the anionic form of pectin, rather than on the methyl ester form. The family encompasses four classes of enzymes: pectin lyase, polygalacturonase, pectin methylesterase, and rhamnogalacturonase. Pectin lyase, in particular, is significant for its role in the depolymerization of pectin, facilitating the disassembly of the plant cell wall structure during various biological processes.
    source: "InterPro:IPR052063 abstract (LLM-generated, not curator-reviewed)"
