identifier: PANTHER:PTHR33318
label: "ASPARTYL/GLUTAMYL-TRNA(ASN/GLN) AMIDOTRANSFERASE SUBUNIT"
definition: >-
  This entry represents a group of plant proteins, including protein JASON from Arabidopsis. JASON positively regulates AtPS1 (Arabidopsis thaliana Parallel Spindles1) expression, allowing the proper organization and orientation of metaphase II spindle plates in MII.
