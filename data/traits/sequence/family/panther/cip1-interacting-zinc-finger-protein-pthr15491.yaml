identifier: PANTHER:PTHR15491
label: "Cip1-interacting zinc finger protein"
definition: >-
  Cip1-interacting zinc finger protein may regulate the subcellular localization of p21(CIP/WAF1). p21(CIP/WAF1) has a critical role in the negative control of cell growth. The Drosophila melanogaster orthologue, protein zinc finger protein on ecdysone puffs, may have a role in the activation of early and late genes.
