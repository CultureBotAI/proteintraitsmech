identifier: PANTHER:PTHR47926
label: "PENTATRICOPEPTIDE REPEAT-CONTAINING PROTEIN"
definition: >-
  This entry represents a group of plant pentatricopeptide repeat-containing proteins (PPRs) part of the plant combinatorial and modular protein (PCMP) family, including At4g14850, At3g57430, At3g11460 and CRR2. The PPR proteins have been proposed to contact the RNA sequence with selected repeats at specific nucleotides. At4g14850, also known as Lovastatin insensitive 1, plays regulatory roles in cytosolic and plastidial isoprenoid biosynthesis through RNA editing. At3g57430 also acts as a RNA editing factor in chloroplasts. At3g11460, also known as MEF10, is required for RNA editing in mitochondria. CRR2 is required for the intergenic processing between chloroplast rsp7 and ndhB transcripts and it is necessary for chloroplast NADH dehydrogenase-like (NDH) complex-dependent cyclic electron transport around photosystem I. This entry also includes At1g15510, At3g16610 and At2g39620. The PPR proteins have been proposed to contact the RNA sequence with selected repeats at specific nucleotides. At1g15510 also known as Protein EARLY CHLOROPLAST BIOGENESIS 2, regulates the RNA editing of the chloroplast transcript accD, and is essential for the early stages of chloroplast biogenesis. It is required for the RNA editing of the chloroplast transcript ndhF.
