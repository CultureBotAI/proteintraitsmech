identifier: PANTHER:PTHR15025
label: "VOLTAGE-DEPENDENT CALCIUM CHANNEL GAMMA-1 SUBUNIT-RELATED"
definition: >-
  VOLTAGE-DEPENDENT CALCIUM CHANNEL GAMMA-1 SUBUNIT-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15025. PANTHER protein class: ion channel, transporter, voltage-gated ion channel. Members are annotated with the molecular function transporter regulator activity, channel regulator activity. Members participate in regulation of monoatomic ion transmembrane transport, regulation of calcium ion transport, regulation of monoatomic cation transmembrane transport. Members localise to voltage-gated calcium channel complex, membrane protein complex, plasma membrane protein complex.
