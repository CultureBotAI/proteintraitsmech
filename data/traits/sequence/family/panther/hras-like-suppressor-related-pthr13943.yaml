identifier: PANTHER:PTHR13943
label: "HRAS-LIKE SUPPRESSOR - RELATED"
definition: >-
  The H-rev107 family proteins are multifunctional enzymes with both phospholipase A1/2 and acyltransferase activities. They catalyze the calcium-independent release of fatty acids from glycerophospholipids at the sn-1 or sn-2 position, with a higher activity for PLA1 over PLA2 for most substrates. Additionally, they exhibit O-acyltransferase activity, transferring fatty acyl groups from glycerophospholipids to lysophospholipids. They also show N-acyltransferase activity, transferring fatty acyl groups from phosphatidylcholine and other glycerophospholipids to the primary amine of phosphatidylethanolamine, forming N-acylphosphatidylethanolamine, a precursor for N-acylethanolamines. Some family members are involved in organelle degradation during eye lens terminal differentiation, contributing to lens transparency. Others may act as host factors for picornaviruses, facilitating viral genome release into the cytoplasm. The C-terminal transmembrane domain is essential for targeting to damaged organelles.
