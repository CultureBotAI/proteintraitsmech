identifier: PANTHER:PTHR21107
label: "CYTOCHROME C OXIDASE ASSEMBLY PROTEIN COX19"
definition: >-
  This family of proteins is involved in the assembly of mitochondrial cytochrome c oxidase, a key component of the respiratory chain. Members of this family may also play a role in the transduction of an SCO1-dependent redox signal from the mitochondrion to ATP7A, which is important for regulating cellular copper homeostasis.
