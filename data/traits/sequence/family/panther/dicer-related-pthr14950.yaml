identifier: PANTHER:PTHR14950
label: DICER-RELATED
definition: >-
  DICER-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14950. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 21 of its annotated subfamilies. Subfamilies are annotated with the molecular function RNA endonuclease activity, RNA binding, hydrolase activity, acting on ester bonds. Subfamilies participate in regulatory ncRNA-mediated gene silencing, RNA metabolic process, gene expression. Subfamilies localise to nucleus, intracellular anatomical structure, cytoplasm.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
