identifier: PANTHER:PTHR14950
label: DICER-RELATED
definition: >-
  DICER-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14950. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 21 of its annotated subfamilies. Subfamilies are annotated with the molecular function nucleic acid binding, RNA binding, catalytic activity. Subfamilies participate in nucleobase-containing compound metabolic process, RNA processing, cellular aromatic compound metabolic process. Subfamilies localise to intracellular anatomical structure, nucleus, cytoplasm.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
