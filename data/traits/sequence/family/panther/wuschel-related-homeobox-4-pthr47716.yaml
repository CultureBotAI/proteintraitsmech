identifier: PANTHER:PTHR47716
label: "WUSCHEL-RELATED HOMEOBOX 4"
definition: >-
  This entry represents WOX4, a WUSCHEL-related homeobox protein from plants. Proteins in this family contain a sequence of eight residues (TLPLFPMH) downstream of the homeodomain called the WUS box. WOX4 is a transcription factor and part of the TDIF-TDR-WOX4 signaling pathway that plays a crucial role in the maintenance of the vascular meristem organisation during secondary growth.
