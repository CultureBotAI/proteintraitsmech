identifier: PANTHER:PTHR22961
label: "SER/THR PROTEIN KINASE-TRB"
definition: >-
  Tribbles encode an evolutionarily conserved protein family that influences proliferation, motility, metabolism, and oncogenic transformation. Originally identified in Drosophila, tribbles homologues are characterised by a central serine/threonine kinase-like domain (KD) and a C-terminal binding site for E3 ubiquitin ligases. Although the KD is the defining feature of the tribbles family, these proteins are considered to be catalytically inactive because they lack conserved residues from the characteristic adenosine triphosphate binding site and catalytic core motif within the KD. This entry represents the tribbles family, including TRB-1, TRB-2 and TRB-3, the mammalian homologues of Drosophila tribbles. This entry also matches serine/threonine-protein kinase 40 (STK40). This kinase may be a negative regulator of NF-kappa-B and p53-mediated gene transcription.
