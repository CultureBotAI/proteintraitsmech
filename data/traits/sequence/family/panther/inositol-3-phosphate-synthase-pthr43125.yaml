  - kind: GENERAL
    text: >-
      INOSITOL-3-PHOSPHATE SYNTHASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43125. Members are annotated with the molecular function isomerase activity. and participate in organic hydroxy compound metabolic process, alcohol metabolic process, small molecule biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are key in the biosynthesis of myo-inositol, a molecule with various cellular functions including as a precursor for inositol phospholipids and inositol phosphates. Members of this family catalyze the NAD-dependent conversion of glucose 6-phosphate to 1D-myo-inositol 3-phosphate. This reaction is the first and rate-limiting step in the production of myo-inositol. In addition to their central role in myo-inositol production, these enzymes also contribute to oxidative stress resistance by providing the precursor for the synthesis of the protective antioxidant mycothiol.
    source: "InterPro:IPR052199 abstract (LLM-generated, not curator-reviewed)"
