  - kind: GENERAL
    text: >-
      The ribose 5-phosphate isomerase family consists of enzymes that play a crucial role in carbohydrate metabolism. Members of this family are responsible for the interconversion of ribose-5-phosphate and ribulose 5-phosphate, a reversible reaction that forms part of the non-oxidative phase of the pentose phosphate pathway. This pathway is essential for the production of ribose sugars for nucleotide synthesis and for the generation of reducing equivalents in the form of NADPH, which is used in various anabolic reactions, including fatty acid synthesis and the maintenance of redox balance within the cell.
