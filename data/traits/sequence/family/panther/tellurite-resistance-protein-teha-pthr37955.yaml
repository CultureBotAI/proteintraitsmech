identifier: PANTHER:PTHR37955
label: "TELLURITE RESISTANCE PROTEIN TEHA"
definition: >-
  This family of proteins is involved in conferring resistance to potassium tellurite, a toxic compound. Members of this family function as ion channels that facilitate the transport processes associated with tellurite resistance. The activity of these proteins is essential for the survival of organisms in environments containing tellurite. While the exact mechanism of resistance is not fully elucidated, it is known that high copy numbers of these proteins can enhance tellurite resistance in certain bacterial species. The proteins may remain phenotypically silent under conditions where tellurite is not present or when expressed at low levels.
