    text: >-
      TELLURITE RESISTANCE PROTEIN TEHA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR37955. Members are annotated with the molecular function efflux transmembrane transporter activity, monoatomic cation transmembrane transporter activity, monoatomic ion transmembrane transporter activity. and localise to cell periphery, cellular anatomical entity, membrane.
