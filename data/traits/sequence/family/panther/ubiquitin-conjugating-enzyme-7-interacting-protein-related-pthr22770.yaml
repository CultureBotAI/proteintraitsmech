  - kind: GENERAL
    text: >-
      The protein family is involved in the regulation of various cellular processes through ubiquitination. Members function as E3 ubiquitin-protein ligases, accepting ubiquitin from E2 enzymes and transferring it to substrates. They play a crucial role in the NF-kappa-B signaling pathway, inflammation regulation, and innate immunity. The family is part of the LUBAC complex, which conjugates linear polyubiquitin chains to substrates, mediating NF-kappa-B activation and protecting against TNF-induced cell death. They also participate in xenophagy by forming a ubiquitin coat on bacteria, signaling for degradation. Additionally, they regulate the Wnt signaling pathway during angiogenesis and are involved in synaptic plasticity, spermatogenesis, and antiviral responses.
