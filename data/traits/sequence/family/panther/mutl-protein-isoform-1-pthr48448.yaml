identifier: PANTHER:PTHR48448
label: "MUTL PROTEIN ISOFORM 1"
definition: >-
  DNA mismatch repair MutS is involved in the maintenance of mitochondrial genome integrity. Members of this family, such as MSH1 from Arabidopsis thaliana, play a crucial role in controlling mitochondrial genome configuration. They achieve this by suppressing asymmetric recombination at certain repeat pairs, thereby preventing the rearrangement of the mitochondrial DNA. This function is essential for the proper functioning and stability of the mitochondrial genome, which is critical for cellular energy production and overall plant development.
