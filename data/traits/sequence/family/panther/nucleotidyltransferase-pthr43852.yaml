identifier: PANTHER:PTHR43852
label: NUCLEOTIDYLTRANSFERASE
definition: >-
  This family of proteins includes Protein adenylyltransferase MntA which functions as antitoxins within type VII toxin-antitoxin (TA) systems. They neutralise the effects of cognate toxins through post-translational modifications, specifically by AMPylating the toxins. The AMPylation involves the addition of AMP to specific tyrosine residues on the toxins, which can occur as di- or tri-AMPylation. These proteins are also capable of binding to their own promoter regions, suggesting a role in autoregulation of their expression. The antitoxin activity is crucial for the stability of certain plasmids, especially when expressed in bacterial systems like E. coli. Structural elements such as alpha-helices are important for their interaction with the toxins, and deletions in these regions can significantly reduce antitoxin function.
