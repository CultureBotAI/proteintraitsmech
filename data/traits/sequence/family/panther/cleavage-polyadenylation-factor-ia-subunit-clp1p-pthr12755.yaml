identifier: PANTHER:PTHR12755
label: "CLEAVAGE/POLYADENYLATION FACTOR IA SUBUNIT CLP1P"
definition: >-
  This entry includes Clp1 and Grc3/NOL9. Polyribonucleotide 5-hydroxyl-kinase Clp1 is a component of the cleavage factor IA (CF IA) complex, which is involved in the endonucleolytic cleavage during polyadenylation-dependent pre-mRNA 3'-end formation. It is involved in both the endonucleolyitc cleavage and polyadenylation steps of mRNA 3'-end maturation. Human Clp1 can also function as a tRNA splicing enzyme. In human, mutations in Clp1 affect tRNA biogenesis and lead to impairment of both peripheral and central nervous system function, causing severe motor-sensory defects, cortical dysgenesis and microcephaly. Clp1 contains three domains, a small N-terminal β sandwich domain involved in DNA binding, a C-terminal domain containing a novel α/β-fold and a central domain that binds ATP. NOL9 and its orthologue Gre3 are polynucleotide 5'-kinases involved in rRNA processing. NOL9 can phosphorylate single-stranded and double-stranded RNA and DNA substrates. Its kinase activity is required for the processing of the 32S precursor into 5.8S and 28S rRNAs, more specifically for the generation of the major 5.8S(S) form.
