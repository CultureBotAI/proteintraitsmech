identifier: PANTHER:PTHR28221
label: "RNA POLYMERASE I-SPECIFIC TRANSCRIPTION INITIATION FACTOR RRN6"
definition: >-
  RNA polymerase I-specific transcription-initiation factor Rrn6 is a component of a multisubunit core transcription factor, essential for the initiation of rDNA transcription by Pol I. The DNA-bound core factor (CF) resembles a right hand holding the DNA molecule between the fingers and the palm, with the thumb pointing toward Pol I. The palm is composed of the N-terminal regions of Rrn11 and Rrn6, the thumb is composed of the C-terminal of Rrn11 while the fingers and knuckles are composed of Rrn7 and the C-terminal half of Rrn6, respectively. This entry represents the β-propeller domain of Rrn6 which is part of the palm (or module I in ) of the CF which interacts with Rrn11. These proteins are found in fungi.
definition_source: "InterPro:IPR019350 abstract (PANTHER PTHR28221 is a member signature)"
