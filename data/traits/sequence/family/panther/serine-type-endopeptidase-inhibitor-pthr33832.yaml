  - kind: GENERAL
    text: >-
      The protease inhibitor I20 (potato type II proteinase inhibitor) family consists of proteins that function primarily as inhibitors of proteolytic enzymes such as trypsin and chymotrypsin. Members of this family are potent inhibitors of trypsin, with varying degrees of effectiveness against chymotrypsin. Some members do not inhibit elastase and subtilisin DY, while others also show inhibitory activity against pronase E. These inhibitors are typically induced in response to wounding and may play a role in plant defense by limiting protein degradation caused by endogenous or pathogen-derived proteases.
    source: "InterPro:IPR051391 abstract (LLM-generated, not curator-reviewed)"
