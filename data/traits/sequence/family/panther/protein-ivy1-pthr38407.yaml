identifier: PANTHER:PTHR38407
label: "PROTEIN IVY1"
definition: >-
  IVY1 is a phospholipid-binding protein from yeast that interacts with both the GTPase Ypt7 and the Sec1-related Vps33 protein. It seems to be involved in vacuole membrane homeostasis. Its overexpression causes vacuole fragmentation.
