identifier: PANTHER:PTHR15407
label: FUKUTIN-RELATED
definition: >-
  This entry covers FKTN protein in mammals and its orthologues in C.elegans (W02B3.4, W02B3.1 and T07A5.1), yeast (MNN4) and related Mannosyltransferase regulator proteins. Ribitol-5-phosphate transferase (FKTN) is a eukaryotic protein necessary for the maintenance of muscle integrity, cortical histiogenesis, and normal ocular development. Mutations in the fukutin gene have been shown to result in Fukuyama-type congenital muscular dystrophy characterised by brain malformation - one of the most common autosomal-recessive disorders in Japan. FKTN participates in glycosylation of alpha-dystroglycan/DAG1. MNN4 from budding yeast may function as a positive regulator for mannosylphosphate transferase.
