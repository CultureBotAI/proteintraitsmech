identifier: PANTHER:PTHR13191
label: "RIBOSOMAL RNA PROCESSING PROTEIN 7-RELATED"
definition: >-
  Ribosomal RNA-processing protein 7 (RRP7) is an essential protein in yeast that is involved in pre-rRNA processing and ribosome assembly. It is speculated to be required for correct assembly of rpS27 into the pre-ribosomal particle.
