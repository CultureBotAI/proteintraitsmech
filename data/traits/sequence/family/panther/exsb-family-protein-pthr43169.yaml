identifier: PANTHER:PTHR43169
label: "EXSB FAMILY PROTEIN"
definition: >-
  This family of proteins is involved in the biosynthesis of a nickel-pincer cofactor, which is a (SCS)Ni(II) pincer complex and includes Pyridinium-3,5-bisthiocarboxylic acid mononucleotide synthase (LarE). Members of this family catalyse the ATP-dependent incorporation of sulphur atoms into pyridinium-3,5-biscarboxylic acid mononucleotide (P2CMN) to form pyridinium-3,5-bisthiocarboxylic acid mononucleotide (P2TMN). The sulphur transfer is mediated by a cysteine residue within the enzyme, which is converted into dehydroalanine in the process, rendering the enzyme inactive after the reaction. This sacrificial mechanism indicates that two enzyme molecules are consumed for each P2TMN produced. Additionally, these proteins are known to bind nickel and are implicated in the activation of lactate racemase and potentially other enzymes dependent on the nickel-pincer cofactor. This entry also includes uncharacterised archaeal proteins such as slr1717, MJ1599, MJ1638, MJ0830 and MJ1016.
