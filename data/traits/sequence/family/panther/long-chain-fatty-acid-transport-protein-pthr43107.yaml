label: "LONG-CHAIN FATTY ACID TRANSPORT PROTEIN"
definition: >-
  LONG-CHAIN FATTY ACID TRANSPORT PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43107. PANTHER protein class: secondary carrier transporter, transporter. Members are annotated with the molecular function long-chain fatty acid-CoA ligase activity, monocarboxylic acid transmembrane transporter activity, lipid transporter activity. Members participate in long-chain fatty acid metabolic process, long-chain fatty acid transport, import into cell. Members localise to plasma membrane.
