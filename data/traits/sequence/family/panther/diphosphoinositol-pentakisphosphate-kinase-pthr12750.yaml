identifier: PANTHER:PTHR12750
label: "DIPHOSPHOINOSITOL PENTAKISPHOSPHATE KINASE"
definition: >-
  This entry represents the VIP1 subfamily of the histidine acid phosphatase family. Budding yeast Vip1 is a inositol hexakisphosphate and inositol heptakisphosphate kinase. The N-terminal domain of yeast Vip1 has inositol-hexakisphosphate kinase activity and is followed by a phosphatase domain of as yet unknown specificity, but which is very likely to act on multiply phosphorylated inositol species. The histidine phosphatase superfamily is so named because catalysis centres on a conserved His residue that is transiently phosphorylated during the catalytic cycle. Other conserved residues contribute to a 'phosphate pocket' and interact with the phospho group of substrate before, during and after its transfer to the His residue. Structure and sequence analyses show that different families contribute different additional residues to the 'phosphate pocket' and, more surprisingly, differ in the position, in sequence and in three dimensions, of a catalytically essential acidic residue. The superfamily may be divided into two main branches. The relationship between the two branches is not evident by (PSI-)BLAST but is clear from more sensitive sequence searches and structural comparisons.
