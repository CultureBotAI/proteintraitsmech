identifier: PANTHER:PTHR21222
label: "MIT DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  The MIT domain-containing protein 1 family is involved in the final stages of cell division, specifically in the abscission process that completes cytokinesis. Members of this family possess a MIT domain that interacts with the MIT-interacting motifs of ESCRT-III complex components, playing a crucial role in the separation of daughter cells. Additionally, the C-terminal domain of these proteins is known to bind lipid membranes enriched with acidic phosphoinositides, which is essential for their localization to the midbody during cell division. While all family members are implicated in cytokinesis, some appear not to be involved in endosomal transport, indicating a specialized function in cell division.
