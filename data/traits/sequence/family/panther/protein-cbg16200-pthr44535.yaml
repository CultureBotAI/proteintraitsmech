  - kind: GENERAL
    text: >-
      This family of proteins includes serine/threonine kinases that play a crucial role in cell cycle regulation, particularly in mitotic progression and spindle dynamics. They are involved in the phosphorylation of various substrates, including histones and other kinases, which is essential for chromosome separation and cell division. Some members are also implicated in the regulation of ciliary biogenesis and organogenesis, as well as in maintaining renal tubular integrity. Additionally, one member is predicted to be catalytically inactive but is important for asymmetric cell division and embryogenesis, suggesting a regulatory function within the family.
