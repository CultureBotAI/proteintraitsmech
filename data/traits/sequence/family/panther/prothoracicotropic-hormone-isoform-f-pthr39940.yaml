identifier: PANTHER:PTHR39940
label: "PROTHORACICOTROPIC HORMONE, ISOFORM F"
definition: >-
  This family of proteins includes secretory polypeptides primarily involved in the regulation of insect development. They act as hormonal messengers, stimulating the production and release of ecdysone, a critical steroid hormone for insect growth and metamorphosis. The proteins are synthesized in the brain and are known to influence the prothoracic glands. Some members of this family may also have additional, yet unidentified, physiological or developmental roles, as suggested by the presence of post-translationally cleaved peptides with unknown functions.
