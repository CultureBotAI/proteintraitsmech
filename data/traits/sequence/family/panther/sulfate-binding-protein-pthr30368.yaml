identifier: PANTHER:PTHR30368
label: "SULFATE-BINDING PROTEIN"
definition: >-
  This entry represents thiosulfate/sulfate binding proteins. Sulfate binding protein (SBP) specifically binds sulfate and thiosulfate-binding protein (TSBP or CysP) specifically binds thiosulfate. They are involved in the ABC transport of sulfate and thiosulfate in eubacteria. This family are an example of type 2 periplasmic binding proteins that differ in size and ligand specificity, but have similar tertiary structures consisting of two globular subdomains connected by a flexible hinge. They have been shown to bind their ligand in the cleft between these domains in a manner resembling a Venus flytrap.
