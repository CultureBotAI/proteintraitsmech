definitions:
  - kind: GENERAL
    text: >-
      YES-ASSOCIATED PROTEIN YAP1 FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR17616. PANTHER protein class: transcription cofactor. Members are annotated with the molecular function transcription coactivator activity, transcription regulator activity, transcription coregulator activity. and participate in positive regulation of nitrogen compound metabolic process, response to stimulus, positive regulation of biosynthetic process. and localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The YAP1 family comprises transcriptional regulators that function as coactivators or corepressors. They are essential components of the Hippo signaling pathway, which is crucial for controlling organ size, suppressing tumors, and regulating apoptosis and proliferation. Family members mediate tissue tension and 3D tissue shape by influencing the cortical actomyosin network. They interact with TEAD transcription factors and are involved in various cellular processes, including cell contact-mediated growth control, epithelial-mesenchymal transition, and ciliogenesis suppression. Some members also play roles in neural plate development, stress response, and aging.
    source: "InterPro:IPR051583 abstract (LLM-generated, not curator-reviewed)"
