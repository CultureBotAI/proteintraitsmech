identifier: PANTHER:PTHR46095
label: "ZINC FINGER PROTEIN 593"
definition: >-
  This family of proteins is involved in the maturation of pre-60S ribosomal particles, specifically by promoting the nuclear export of the 60S ribosome. Members of this family are characterized by the presence of a C2H2-type zinc-finger domain, which is typically associated with DNA-binding activity. However, some family members are known to negatively modulate the DNA binding activity of other transcription factors, such as Oct-2, thereby influencing transcriptional regulatory processes. The proteins within this family are largely disordered except for the zinc finger domain, indicating a structured region that mediates their functional interactions.
