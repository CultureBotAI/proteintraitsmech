identifier: PANTHER:PTHR24106
label: "NACHT, LRR AND CARD DOMAINS-CONTAINING"
definition: >-
  The NOD-like receptor (NLR) family is involved in the innate immune response, acting as pattern recognition receptors (PRRs) that detect pathogen-associated molecular patterns (PAMPs) and danger danger associated molecular patterns (DAMPs). Members of the family participate in various signalling pathways, including NF-kappa-B, MAP kinases, and type I/II interferon pathways, contributing to the transcriptional activation of genes involved in immune response, and play roles in gastrointestinal immunity, antiviral defence, autophagy, and inflammation regulation. Some NLRs detect specific bacterial peptidoglycan fragments, while others negatively regulate immune responses to prevent excessive inflammation. Proteins in this entry are implicated in metabolic regulation, appetite control, and cellular stress responses.
definition_source: "InterPro:IPR051261 abstract (PANTHER PTHR24106 is a member signature)"
