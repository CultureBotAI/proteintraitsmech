label: "MRNA-CAPPING ENZYME"
definition: >-
  MRNA-CAPPING ENZYME — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10367. PANTHER protein class: RNA processing factor, RNA metabolism protein, mRNA capping factor. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, catalytic activity, acting on RNA, transferase activity. Members participate in cellular aromatic compound metabolic process, heterocycle metabolic process, macromolecule biosynthetic process.
