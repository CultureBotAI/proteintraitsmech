identifier: PANTHER:PTHR47488
label: "HEAVY METAL TRANSPORT/DETOXIFICATION SUPERFAMILY PROTEIN"
definition: >-
  This entry includes a group of plant proteins, including protein PYRICULARIA ORYZAE RESISTANCE 21 (PI21) from rice. PI21 is a proline rich protein that includes a putative heavy metal-binding domain and putative protein-protein interaction motifs. PI21 appears to slow the plant's defense responses, which may support optimization of defense mechanisms.
