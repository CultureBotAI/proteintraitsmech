identifier: PANTHER:PTHR46240
label: "SER/THR PROTEIN KINASE ULK4"
definition: >-
  This entry represents the Serine/threonine-protein kinase ULK4 (also known as Unc-51-like kinase 4, EC:2.7.11.1), found in animals. This enzyme may be involved in the remodeling of cytoskeletal components, such as alpha-tubulin, and in this way regulates neurite branching and elongation, as well as cell motility. In humans, ULK4 gene has been proposed to be a rare susceptibility risk factor for a range of psychiatric diseases including schizophrenia.
