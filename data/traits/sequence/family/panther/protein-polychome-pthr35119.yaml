identifier: PANTHER:PTHR35119
label: "PROTEIN POLYCHOME"
definition: >-
  This family of plant proteins includes POLYCHOME (UVI4, UV-B-INSENSITIVE 4) and its paralogue GIGAS CELL1 (GIG1, UV-B-INSENSITIVE 4-like). GIG1 and UVI4 negatively regulate activities of anaphase-promoting complex/cyclosome (APC/C) ubiquitin ligase. GIG1 and UVI4 may regulate endomitosis and endoreplication, preventing an unscheduled increase in cellular ploidy, by inhibiting APC/C in different ways. They preferentially inhibit APC/C(CDC20) and APC/C(FZR), respectively.
