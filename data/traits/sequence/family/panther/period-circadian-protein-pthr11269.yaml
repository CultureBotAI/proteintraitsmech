definitions:
  - kind: GENERAL
    text: >-
      PERIOD CIRCADIAN PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11269. PANTHER protein class: transcription cofactor. Members are annotated with the molecular function transcription cis-regulatory region binding, protein binding, double-stranded DNA binding. and participate in response to external stimulus, negative regulation of cellular metabolic process, negative regulation of biological process. and localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins plays a crucial role in the regulation of circadian rhythms, which are internal biological processes that follow a roughly 24-hour cycle. These proteins function as transcriptional repressors within the molecular circadian clock mechanism, forming a feedback loop that controls gene expression related to various physiological functions, including metabolism, sleep, body temperature, and hormonal levels. They interact with other core clock components to regulate the timing of protein expression, aligning physiological processes with the day-night cycle. Mutations in these proteins can lead to altered circadian rhythms and affect species-specific behaviors.
    source: "InterPro:IPR050760 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
