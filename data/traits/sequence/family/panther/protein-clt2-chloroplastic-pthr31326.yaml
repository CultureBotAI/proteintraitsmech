identifier: PANTHER:PTHR31326
label: "PROTEIN CLT2, CHLOROPLASTIC"
definition: >-
  This family represents the Plasmodium falciparum chloroquine resistance transporter (CRT) and homologous proteins. CRT regulates other transporters, like Na-H antiporter or nonselective cation transporters. The Arabidopsis homologues are involved in thiol transport from the plastid to the cytosol, playing a significant role in regulating GSH levels and the redox potential of the cytosol. Homologues from Dictyostelium discoideum are also included in this entry.
