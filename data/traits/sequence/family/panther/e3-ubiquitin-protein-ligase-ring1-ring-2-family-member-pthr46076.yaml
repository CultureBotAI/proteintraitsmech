identifier: PANTHER:PTHR46076
label: "E3 UBIQUITIN-PROTEIN LIGASE RING1 / RING 2 FAMILY MEMBER"
definition: >-
  E3 ubiquitin-protein ligase RING1 (EC:2.3.2.27) is one of the three E3 ubiquitin-protein ligases that mediate monoubiquitination of 'Lys-119' of histone H2A, which is a specific tag for repression of epigenetic transcription and particularly for inactivation of chromosome X of female mammals. RING1 is a component of the Polycomb group (PcG) multiprotein PRC1-like complex, the repressive BCOR complex, and the the E2F6.com-1 complex in G0 phase. RING1 has a RING-type zinc finger. E3 ubiquitin-protein ligase RING2 (EC:2.3.2.27) mediates monoubiquitination of 'Lys-119' of histone H2A (H2AK119Ub), which is a specific tag for epigenetic transcriptional repression and participates in X chromosome inactivation of female mammals. RING2 is a component of the PRC1 complex, and other chromatin-associated Polycomb (PcG) complexes such as BCOR. It is also a component of the MLL1/MLL complex. This entry includes E3 ubiquitin-protein ligase RING1/RING2.
