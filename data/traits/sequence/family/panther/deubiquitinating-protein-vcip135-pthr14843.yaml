identifier: PANTHER:PTHR14843
label: "DEUBIQUITINATING PROTEIN VCIP135"
definition: >-
  VCPIP1, also known as VCIP135, is a deubiquitinating enzyme that functions in p97/p47-mediated Golgi reassembly. It hydrolyzes 'Lys-11'- and 'Lys-48'-linked polyubiquitin chains. It has also been found to dictate the duration of botulinum neurotoxin type A intoxication. VCPIP1 can also deubiquitinate SPRTN (a metalloprotease that cleaves DNA-protein crosslinks) and promotes its chromatin relocalization.
