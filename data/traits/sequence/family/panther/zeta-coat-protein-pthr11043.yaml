identifier: PANTHER:PTHR11043
label: "ZETA-COAT PROTEIN"
definition: >-
  Coatomer (COPI) is a cytosolic protein complex that coats Golgi-derived transport vesicles. It consists of seven subunits (alpha-, beta-, beta'-, gamma-, delta-, epsilon-, and zeta-COP) and is involved in retrograde transport between Golgi and ER. This entry includes the zeta subunit, which may be involved in regulating the coat assembly. This entry also includes TSET complex member tstD from Dictyostelium discoideum (Slime mold). TSET is a membrane trafficking complex.
