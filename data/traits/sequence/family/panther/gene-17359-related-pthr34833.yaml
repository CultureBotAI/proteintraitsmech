identifier: PANTHER:PTHR34833
label: "GENE, 17359-RELATED"
definition: >-
  This family of proteins is found in eukaryotes and is functionally uncharacterised. Members of the family contain a conserved HRYQNPW sequence motif. This family includes the human protein SPMIP2 (UniProtKB:Q96LM5) that is also known as sperm-associated microtubule inner protein 2.
