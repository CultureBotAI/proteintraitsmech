identifier: PANTHER:PTHR31172
label: "STOMATAL CLOSURE-RELATED ACTIN-BINDING PROTEIN 1"
definition: >-
  Stomatal closure-related actin-binding (SCAB) proteins bind, bundle and stabilise actin filaments and regulate stomatal movement. Homologues are known only from plants.
