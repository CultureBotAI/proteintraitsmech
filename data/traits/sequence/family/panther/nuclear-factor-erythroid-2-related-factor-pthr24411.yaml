identifier: PANTHER:PTHR24411
label: "NUCLEAR FACTOR ERYTHROID 2-RELATED FACTOR"
definition: >-
  This entry represents a group of related animal transcription factors, including NFE2 and NFE2-like proteins, such as NFE2-like 1 (also known as NFE2-related factor 1, NFE2L1/Nrf1), NFE2L2 and NFE2L3 (or Nrf3). This family also includes the orthologue CNC from Drosophila, which regulates the activation of genes by oxidative stress and SKN-1 from C. elegans. These are Cap'n'Collar (CNC) Basic leucine zipper (bZIP) transcription factors that are defined by a conserved 43-amino acid region (called the CNC domain) located N-terminal to the bZIP DNA-binding domain. NFE2 functions in development; it is required for the proper development of platelets. As part of the NF-E2 complex, it is essential for regulating erythroid and megakaryocytic maturation and differentiation. The three Nrfs function in stress responses. Nrf1 is an essential protein that binds to the antioxidant response element (ARE) and is also involved in regulating oxidative stress. In addition, it also regulates genes involved in cell and tissue differentiation, inflammation, and hepatocyte homeostasis. Nrf3 has been linked to differentiation, inflammation, and carcinogenesis. Nrf2, the most extensively studied member of this subfamily, acts as a xenobiotic-activated receptor that regulates the adaptive response to oxidants and electrophiles. As the master regulator of the antioxidant defense pathway, it plays roles in the biology of inflammation, obesity, and cancer. Mammalian Nrf2 was shown to be protective during infections as diverse as septic shock, pneumonia, chronic granulomatous disease (CGD) and periodontitis.
