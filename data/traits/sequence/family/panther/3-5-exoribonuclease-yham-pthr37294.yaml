identifier: PANTHER:PTHR37294
label: "3'-5' EXORIBONUCLEASE YHAM"
definition: >-
  The YhaM family is characterized by proteins that predominantly exhibit 3'-5' exoribonuclease activity, which is crucial for the degradation of RNA molecules from the 3' end towards the 5' end. A member of the family also displays single-stranded DNA 3'-5' exonuclease activity and is implicated in the secondary pathway of 23S rRNA 3' end maturation. Additionally, a unique protein within the family functions as a dihydroneopterin 2',3'-cyclic phosphate phosphodiesterase, hydrolyzing the cyclic phosphate of dihydroneopterin compounds and other phosphodiesters, but not nucleotide triphosphates or cyclic nucleotides. The YhaM family thus encompasses enzymes with critical roles in nucleic acid metabolism, including RNA processing and degradation, as well as specialized phosphodiester hydrolysis.
