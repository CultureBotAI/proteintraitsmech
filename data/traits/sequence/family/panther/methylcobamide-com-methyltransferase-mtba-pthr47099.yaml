identifier: PANTHER:PTHR47099
label: "METHYLCOBAMIDE:COM METHYLTRANSFERASE MTBA"
definition: >-
  This family of proteins includes methyltransferases that play a crucial role in methanogenesis, a process of methane production in archaea. Members of this family are involved in transferring methyl groups from methylated corrinoid proteins or free cob(I)alamin to coenzyme M, which is a key step in the formation of the substrate for coenzyme-B sulfoethylthiotransferase. The methyltransferases are involved in different pathways, including the methanol pathway and the methylamines methanol pathway, as well as methanogenesis from methylated-thiols. They catalyse the transfer of a methyl group to the cobalt cofactor of a corrinoid protein and then to coenzyme M, facilitating the production of methane. The activity of these enzymes can be inhibited by chelating agents such as EDTA and EGTA.
definition_source: "InterPro:IPR052024 abstract (PANTHER PTHR47099 is a member signature)"
