identifier: PANTHER:PTHR19980
label: "RNA CLEAVAGE STIMULATION FACTOR"
definition: >-
  This entry includes Rna14 from yeasts, protein suppressor of forked (su(f)) from Drosophila melanogaster, CSTF3 from animals and CstF77 from Arabidopsis. In budding yeasts, Rna14 is part of the cleavage factor I A (CF IA) complex and is required for both the cleavage and polyadenylation activities of CF IA. Protein suppressor of forked may have similar function. CstF77 is involved in floral repressor gene (FLC) silencing.
