identifier: PANTHER:PTHR46247
label: "CRS2-ASSOCIATED FACTOR 1, CHLOROPLASTIC"
definition: >-
  This entry represents a group of plant CRS2-associated factors, including At4g31010/At5g54890 found in Arabidopsis mitochondrions and At2g20020/At1g23400 found in chloroplasts. They are required for the splicing of group IIB introns.
