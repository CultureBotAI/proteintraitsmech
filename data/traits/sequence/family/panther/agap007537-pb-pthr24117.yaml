identifier: PANTHER:PTHR24117
label: AGAP007537-PB
definition: >-
  This entry represents BCL-6 corepressor from humans (BCOR) and similar proteins from animals. BCOR is a transcriptional corepressor that may specifically inhibit gene expression when recruited to promoter regions by sequence-specific DNA-binding proteins such as BCL6 and MLLT3. This repression may be mediated at least in part by histone deacetylase activities which can associate with this corepressor. It functions as a negative regulator of osteo-dentinogenic capacity in adult stem cells through the repression of AP-2alpha, which implies inhibition of methylation on histone H3 'Lys-4' (H3K4me3) and 'Lys-36' (H3K36me2).
