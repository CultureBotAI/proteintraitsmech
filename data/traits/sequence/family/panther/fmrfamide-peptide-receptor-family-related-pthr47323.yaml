identifier: PANTHER:PTHR47323
label: "FMRFAMIDE PEPTIDE RECEPTOR FAMILY-RELATED"
definition: >-
  This family of proteins includes G-protein coupled receptors that interact with specific neuropeptides. They are involved in the regulation of arousal from a sleep-like state during critical developmental transitions. These receptors may signal through the G(q) alpha type of G proteins and play a role in modulating sensory responses, contributing to the coordination of complex physiological processes such as developmental molting.
