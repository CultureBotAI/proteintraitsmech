definitions:
  - kind: GENERAL
    text: >-
      MANNITOL PERMEASE IIC COMPONENT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30181. Members are annotated with the molecular function phosphotransferase activity, alcohol group as acceptor, carbohydrate transmembrane transporter activity, active transmembrane transporter activity. Members participate in carbohydrate transmembrane transport, import across plasma membrane, organic substance transport. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Phosphoenolpyruvate-dependent Sugar Phosphotransferase System (sugar PTS) is a major carbohydrate active transport system that catalyzes the phosphorylation of incoming sugar substrates concomitantly with their translocation across the cell membrane. The PTS consists of several components, including the EIIC type-2 domain which forms the translocation channel and contains the substrate-binding site, the EIIA type-2 domain which is phosphorylated by phospho-HPr on a histidine residue and transfers the phosphoryl group to the EIIB type-2 domain, and the EIIB type-2 domain which is phosphorylated by phospho-EIIA on a cysteine residue and transfers the phosphoryl group to the sugar substrate. The family is involved in the transport of specific sugars such as D-mannitol and fructose, with some variations in the requirement for HPr among different systems.
    source: "InterPro:IPR050893 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
