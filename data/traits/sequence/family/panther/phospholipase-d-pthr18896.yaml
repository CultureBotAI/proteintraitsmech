identifier: PANTHER:PTHR18896
label: "PHOSPHOLIPASE D"
definition: >-
  Phospholipase D (PLD) catalyses the hydrolysis of the phosphodiester bond of glycerophospholipids to generate phosphatidic acid and a free head group. Phospholipase D activities have been detected in simple to complex organisms from viruses and bacteria to yeast, plants, and mammals. In higher organisms, PLD specifically catalyzes the hydrolysis of phosphatidylcholine (PC) to phosphatidic acid (PA) and choline and is activated in response to stimulators of vesicle transport, endocytosis, exocytosis, cell migration, and mitosis. There are two mammalian phospholipase D genes whose products (PLD1 and PLD2) are alternatively spliced. Both forms have two highly conserved HKD motifs that are essential for catalysis and dimerisation. It has now been observed that there are abnormalities in PLD expression and activity in many human cancers. Most bacteria use an enzyme belonging to the phospholipase D family as cardiolipin synthase. In contrast, eukaryotes and most actinobacteria use a cardiolipin synthase of the CDP-alcohol phosphatidyltransferase family.
definition_source: "InterPro:IPR015679 abstract (PANTHER PTHR18896 is a member signature)"
