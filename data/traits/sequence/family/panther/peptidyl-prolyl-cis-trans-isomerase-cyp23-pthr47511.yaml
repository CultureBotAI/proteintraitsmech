identifier: PANTHER:PTHR47511
label: "PEPTIDYL-PROLYL CIS-TRANS ISOMERASE CYP23"
definition: >-
  This entry represents a group of predicted plant peptidyl-prolyl cis-trans isomerases, including AtCYP23 from Arabidopsis and OsCYP23 from rice. OsCYP23 is ER-located and may be associated with specific substrates for metabolic regulation related to sodium or chloride ions.
