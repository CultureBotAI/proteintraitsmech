  - kind: GENERAL
    text: >-
      The PDP family is involved in the regulation of gene expression through interaction with the PRC2 complex and modulation of the H3K27me3 level. Members of the PDP family, such as PDP1, PDP2, PDP3, and PDP6, are known to interact with MSI4/FVE and MSI5, which leads to the suppression of FLC, MAF4, and MAF5 expression. This suppression is crucial for promoting flowering in Arabidopsis thaliana. The PWWP domain present in these proteins suggests a role in chromatin-mediated regulation of gene expression, which is consistent with their involvement in histone methylation dynamics.
    source: "InterPro:IPR052657 abstract (LLM-generated, not curator-reviewed)"
