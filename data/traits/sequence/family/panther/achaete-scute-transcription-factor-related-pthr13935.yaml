identifier: PANTHER:PTHR13935
label: "ACHAETE-SCUTE TRANSCRIPTION FACTOR-RELATED"
definition: >-
  Basic helix-loop-helix proteins (bHLH) are a group of eukaryotic transcription factors that exert a determinative influence in a variety of developmental pathways. These transcription factors are characterised by a highly evolutionary conserved bHLH domain that mediates specific dimerisation. They facilitate the conversion of inactive monomers to trans-activating dimers at appropriate stages of development. Proteins in this entry include MASH1/Ascl1a and related proteins from plants, worms, insects and mammals. MASH1/Ascl1a is a regulator of axonal growth across vertebrates and can induce modifications to the intrinsic state of neurons to promote functional regeneration in response to CNS injury.
definition_source: "InterPro:IPR015660 abstract (PANTHER PTHR13935 is a member signature)"
