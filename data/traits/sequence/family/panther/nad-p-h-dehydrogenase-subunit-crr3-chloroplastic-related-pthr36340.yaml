identifier: PANTHER:PTHR36340
label: "NAD(P)H DEHYDROGENASE SUBUNIT CRR3, CHLOROPLASTIC-RELATED"
definition: >-
  Protein CRR3 is probably a subunit of the NAD(P)H dehydrogenase found in the chloroplasts of plants. It is required for the accumulation of the hydrogenase in chloroplasts of Arabidopsis.
