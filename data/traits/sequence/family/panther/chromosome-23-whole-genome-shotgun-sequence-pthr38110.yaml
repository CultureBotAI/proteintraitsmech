  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in the biosynthesis of secondary metabolites such as glycolipid biosurfactants and reduced long-chain polyketides. Members of this family participate in complex gene clusters that mediate the production of specific bioactive compounds. These proteins are associated with the synthesis and modification of fatty acid-derived moieties that are subsequently linked to sugar residues or amino acids. Functions attributed to these proteins include hydroxylation of fatty acids, glycosylation, acetylation, and acylation processes, as well as the formation of amide bonds between fatty acyl substrates and amino acids. The biosynthetic pathways in which these proteins are involved lead to the production of molecules with potential antimicrobial properties and other bioactivities.
