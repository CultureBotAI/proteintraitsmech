identifier: PANTHER:PTHR13182
label: "ZINC FINGER PROTEIN 622"
definition: >-
  This entry represents a group of proteins that contain at least two copies of a C2H2-type zinc finger, including cytoplasmic 60S subunit biogenesis factor ZNF622 from animals, Reh1 and Rei1 from budding yeasts, and core trichothecene cluster protein 15 (TRI15) from Fusarium. Cytoplasmic 60S subunit biogenesis factor ZNF622, Reh1 and Rei1 are involved in maturation of the large (60S) ribosomal subunit. Rei1 is required for re-importing the 60S subunit export factor Arx1 from the cytoplasm to the nucleus, and both Reh1 and Rei1 are required for cytoplasmic maturation of the 60S subunit, that the two proteins have redundant functions, but without both the 60S subunit is labile to salt. TRI15 is a component in the biosynthesis of trichothecene mycotoxins, although its role is unknown.
definition_source: "InterPro:IPR040025 abstract (PANTHER PTHR13182 is a member signature)"
