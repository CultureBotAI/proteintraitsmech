identifier: PANTHER:PTHR43321
label: "GLUTAMATE DECARBOXYLASE"
definition: >-
  This entry represents glutamate decarboxylase (Gad; EC:4.1.1.15) it is a pyridoxal 5'-phosphate (PLP)-dependent enzyme, which catalyses the irreversible α-decarboxylation of L-glutamate to gamma-aminobutyrate (GABA). This enzyme is widely distributed amongst eukaryotes and prokaryotes, but its function varies in different organisms. GadD has a crucial role in the vertebrate central nervous system where it is responsible for the synthesis of GABA, the major inhibitory neurotransmitter. In the majority of vertebrates Gad occurs in two isoforms, Gad65 and Gad67, both active at neutral pH. Gad isoforms (GadA and GadB) have also been reported in some bacterial species, including the Gram-negative bacterium and Gram-positive bacterium. A unique feature of plant and yeast Gad is the presence of a calmodulin (CaM)-binding domain in the C-terminal region. In Saccharomyces cerevisiae (Baker's yeast), Gad expression is required for normal oxidative stress tolerance. In plants, Gad is thought to be a stress-adapter chaperonin sensing Ca2+ signals.
