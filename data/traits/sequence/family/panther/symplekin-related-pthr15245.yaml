identifier: PANTHER:PTHR15245
label: SYMPLEKIN-RELATED
definition: >-
  Proteins in this entry include Symplekin from animals and Pta1 from yeasts. Symplekin is a scaffold protein that functions as a component of a multimolecular complex involved in histone mRNA 3'-end processing. Pta1 is involved in pre-tRNA processing. Pta1 is a subunit of the cleavage and polyadenylation factor (CPF), which plays a key role in polyadenylation-dependent pre-mRNA 3'-end formation and cooperates with cleavage factors including the CFIA complex and NAB4/CFIB.
