identifier: PANTHER:PTHR31806
label: "PURINE-CYTOSINE PERMEASE FCY2-RELATED"
definition: >-
  This entry represents a family of purine-cytosine permeases from bacteria and fungi, including Fcy2/21/22 from budding yeasts and fcyB from Emericella nidulans. Fcy2 is a purine-cytosine permease (PCP) that mediates the active transport of purines and cytosine. Fcy21 and Fcy22 show protein sequence similarity to Fcy2, but cannot substitute for its function.
