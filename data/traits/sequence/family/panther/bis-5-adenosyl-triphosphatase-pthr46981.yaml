definitions:
  - kind: GENERAL
    text: >-
      BIS(5'-ADENOSYL)-TRIPHOSPHATASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46981. PANTHER protein class: metabolite interconversion enzyme, phosphatase. Members are annotated with the molecular function pyrophosphatase activity, hydrolase activity, acting on acid anhydrides, ubiquitin protein ligase binding. Members participate in regulation of proteasomal protein catabolic process, regulation of primary metabolic process, negative regulation of proteasomal ubiquitin-dependent protein catabolic process. Members localise to cytoplasm, membrane-bounded organelle, membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins exhibits a multifaceted enzymatic activity, including the hydrolysis of dinucleoside polyphosphates such as Ap3A and Ap4A into AMP and ADP or ADP and AMP, respectively. They also show adenylylsulfatase activity, converting adenosine 5'-phosphosulfate into AMP and sulfate, and adenosine 5'-monophosphoramidase activity, hydrolyzing purine nucleotide phosphoramidates to AMP and ammonia. Additionally, they can catalyze the ammonolysis of adenosine 5'-phosphosulfate and other substrates. Beyond their catalytic roles, these proteins modulate transcriptional activation by CTNNB1, influencing cell proliferation and survival gene expression. They are involved in apoptosis through SRC and AKT1 signaling pathways and inhibit MDM2-mediated degradation of p53/TP53, contributing to p53/TP53-mediated apoptosis. Their tumor suppressor function is linked to their ability to bind specific nucleotide compounds, independent of their catalytic activity.
    source: "InterPro:IPR052677 abstract (LLM-generated, not curator-reviewed)"
