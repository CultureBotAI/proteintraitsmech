identifier: PANTHER:PTHR47594
label: "PPR CONTAINING PLANT-LIKE PROTEIN"
definition: >-
  THYLAKOID ASSEMBLY 8 (THA8) is a pentatricopeptide repeat (PPR)-containing protein that mediates group II organellar RNA introns splicing. It is required for embryo development in Arabidopsis. In maize, mutation of the THA8 gene causes defects in the biogenesis of chloroplast thylakoid membranes.
