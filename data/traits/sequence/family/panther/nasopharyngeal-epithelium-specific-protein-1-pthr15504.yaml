identifier: PANTHER:PTHR15504
label: "NASOPHARYNGEAL EPITHELIUM SPECIFIC PROTEIN 1"
definition: >-
  Cilia- and flagella-associated protein 45, also known as coiled-coil domain-containing protein 19 (CCDC19) or nasopharyngeal epithelium specific protein (NESG1), has been identified in humans as a tumour suppressor. It activates the expression of miR-184, which suppresses the expression of C-Myc, a key oncogenic transcription factor.
