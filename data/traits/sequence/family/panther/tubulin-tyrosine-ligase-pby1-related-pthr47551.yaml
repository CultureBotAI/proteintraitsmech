identifier: PANTHER:PTHR47551
label: "TUBULIN--TYROSINE LIGASE PBY1-RELATED"
definition: >-
  This entry represents a group of probable tubulin-tyrosine ligases from fungi, including Pby1 from budding yeast. Tubulin--tyrosine ligase catalyses the post-translational addition of a tyrosine to the C-terminal end of detyrosinated alpha-tubulin.
