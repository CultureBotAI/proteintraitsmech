definition: >-
  MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46716. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function MAP kinase kinase kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein. and participate in positive regulation of canonical NF-kappaB signal transduction, immune system process, immune response.
