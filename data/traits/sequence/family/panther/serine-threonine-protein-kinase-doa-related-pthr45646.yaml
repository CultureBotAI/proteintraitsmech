  - kind: GENERAL
    text: >-
      This family of proteins includes dual specificity kinases that act on serine/threonine and tyrosine residues. They phosphorylate serine- and arginine-rich proteins of the spliceosomal complex, influencing RNA splicing. Members of this family are involved in the regulation of alternative splicing of pre-mRNAs, such as tissue factor (F3) in endothelial cells. Some members also play roles in cellular processes like gluconeogenesis suppression, cell wall and septum formation, and cell separation. They may also regulate transcriptional activity by phosphorylating transcriptional activators or repressors. Inhibitors like Leucettine L41 and TG003 can affect their kinase activity and subsequent regulatory functions.
    source: "InterPro:IPR051175 abstract (LLM-generated, not curator-reviewed)"
