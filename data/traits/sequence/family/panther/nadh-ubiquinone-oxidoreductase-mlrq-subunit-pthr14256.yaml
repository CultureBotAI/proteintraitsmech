identifier: PANTHER:PTHR14256
label: "NADH-UBIQUINONE OXIDOREDUCTASE MLRQ SUBUNIT"
definition: >-
  The MLRQ subunit of mitochondrial NADH-ubiquinone reductase complex I is nuclear and is found in plants, insects, fungi and higher metazoans. It appears to act within the membrane and, in mammals, is highly expressed in muscle and neural tissue, indicative of a role in ATP generation.
