identifier: PANTHER:PTHR15570
label: "G0/G1 SWITCH PROTEIN 2"
definition: >-
  This group represents the G0/G1 switch protein 2 (G0S2). In humans, it promotes apoptosis by binding to BCL2, hence preventing the formation of protective BCL2-BAX heterodimers.
