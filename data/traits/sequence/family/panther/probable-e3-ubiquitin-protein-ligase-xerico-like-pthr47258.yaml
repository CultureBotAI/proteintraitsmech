identifier: PANTHER:PTHR47258
label: "Probable E3 ubiquitin-protein ligase XERICO-like"
definition: >-
  This entry represents a group of RING zinc-finger proteins, including XERICO from Arabidopsis. XERICO has been shown to interact with an E2 ubiquitin-conjugating enzyme (AtUBC8) and ASK1-interacting F-box protein (AtTLP9). It promotes accumulation of abscisic acid (ABA) that antagonizes GA effects during development.
