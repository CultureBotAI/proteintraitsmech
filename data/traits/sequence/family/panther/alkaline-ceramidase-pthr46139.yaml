identifier: PANTHER:PTHR46139
label: "ALKALINE CERAMIDASE"
definition: >-
  This entry consists of several bacterial and eukaryotic ceramidases and homologues with no ceramidase activity. Ceramidases are enzymes involved in regulating cellular levels of ceramides, sphingoid bases, and their phosphates. A protein belonging to this group, the fly ortologue, has been reported to regulate sphingolipid flux and affect ceramide concentrations in the arthropod but lack ceramidase activity.
