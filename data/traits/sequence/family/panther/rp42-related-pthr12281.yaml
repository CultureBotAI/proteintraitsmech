identifier: PANTHER:PTHR12281
label: "RP42 RELATED"
definition: >-
  The eukaryotic defective in cullin neddylation (DCN) protein family, contributes to neddylation of cullin components of SCF-type E3 ubiquitin ligase complexes. These multi-protein complexes are required for polyubiquitination and subsequent degradation of target proteins by the 26S proteasome. Proteins in the DCN family include: Yeast DCN1. Vertebrate DCN1-like protein 1-5. Plant Defective in cullin neddylation protein AAR3. DCN family proteins all contain a Potentiating neddylation (PONY) domain ( InterPro:IPR005176 ), contains a cullin-binding surface within its C-terminal region and is sufficient to promote neddylation. The N-terminal region of the protein often contains a UBA-like domain.
definition_source: "InterPro:IPR014764 abstract (PANTHER PTHR12281 is a member signature)"
