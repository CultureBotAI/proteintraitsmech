identifier: PANTHER:PTHR10633
label: "LEUKEMIA INHIBITORY FACTOR"
definition: >-
  Leukemia inhibitory factor is a small cytokine that has the capacity to induce terminal differentiation in leukemic cells. It also induces hematopoietic differentiation in normal and myeloid leukemia cells, and neuronal cell differentiation, as well as stimulating acute-phase protein synthesis in hepatocytes.
