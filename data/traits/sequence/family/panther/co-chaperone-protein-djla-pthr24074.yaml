identifier: PANTHER:PTHR24074
label: "CO-CHAPERONE PROTEIN DJLA"
definition: >-
  This entry includes DjlA found in bacteria, Chaperone protein dnaJ 72 and J domain-containing protein found in eukaryotes. DjlA is a regulatory DnaK co-chaperone involved in the induction of the wcaABCDE operon for colanic acid polysaccharide capsule synthesis. The protein functions as a homodimer and is localised to the inner membrane as a single-pass type III membrane protein. DjlA interacts directly with DnaK and activates the RcsB/RcsC phosphotransfer signalling pathway.
