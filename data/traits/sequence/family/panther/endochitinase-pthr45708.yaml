identifier: PANTHER:PTHR45708
label: ENDOCHITINASE
definition: >-
  ENDOCHITINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45708. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 35 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, hydrolase activity, hydrolyzing O-glycosyl compounds, chitinase activity. Subfamilies localise to extracellular region, cellular anatomical entity.
