identifier: PANTHER:PTHR15535
label: "TRANSMEMBRANE PROTEIN 2-RELATED"
definition: >-
  This family of proteins is involved in the metabolism of hyaluronic acid (HA), a major component of the extracellular matrix. It includes Cell migration-inducing and hyaluronan-binding protein (CEMIP) and Cell surface hyaluronidase (CEMIP2) which mediate the depolymerization of high-molecular-weight HA into intermediate-sized fragments. This process is crucial for various physiological functions, including the regulation of angiogenesis, heart development, and cell migration. CEMIP is known to bind HA and is implicated in the catabolism of HA in tissues such as the dermis and synovium. It may also play roles in pathological conditions by promoting epithelial-mesenchymal transition (EMT) and cancer progression. Additionally, these proteins can regulate cell adhesion and migration by modulating HA degradation at focal adhesion sites.
