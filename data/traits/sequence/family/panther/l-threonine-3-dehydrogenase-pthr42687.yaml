identifier: PANTHER:PTHR42687
label: "L-THREONINE 3-DEHYDROGENASE"
definition: >-
  The NAD(P)-dependent epimerase/dehydratase family is characterized by enzymes that utilize NAD(+) or NADP(+) as cofactors to catalyze the epimerization or dehydration of various substrates. Members of this family are involved in diverse metabolic pathways, including the catabolism of amino acids such as L-threonine. The L-threonine 3-dehydrogenase, for instance, is an enzyme that catalyzes the NAD(+)-dependent oxidation of L-threonine to 2-amino-3-ketobutyrate. This reaction is a key step in the L-threonine degradation pathway. The family includes both characterized enzymes with known functions and uncharacterized proteins that are predicted to have similar enzymatic activities based on sequence similarity. The presence of conserved motifs and domains within this family suggests a common catalytic mechanism involving the transfer of a hydride ion to or from the NAD(+) or NADP(+) cofactor during the reaction process.
