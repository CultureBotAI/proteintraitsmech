identifier: PANTHER:PTHR13453
label: "KAT8 REGULATORY NSL COMPLEX SUBUNIT 2"
definition: >-
  The nonspecific lethal (NSL) complex associates with the histone acetyltransferase MOF (KAT8) in both Drosophila and mammals. KAT8 regulatory NSL complex subunit 2 (KANSL2 or NSL2) is part of the NSL complex, which is involved in acetylation of nucleosomal histone H4 on several lysine residues and therefore may be involved in the regulation of transcription.
definition_source: "InterPro:IPR026316 abstract (PANTHER PTHR13453 is a member signature)"
