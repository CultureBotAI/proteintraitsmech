  - kind: GENERAL
    text: >-
      The PDP family is involved in the regulation of flowering in Arabidopsis thaliana. Members of the PDP family, such as PDP2 and PDP5, interact with components of the Polycomb Repressive Complex 2 (PRC2) and influence gene expression by modulating the levels of the histone modification H3K27me3. Through this interaction, they suppress the expression of flowering locus C (FLC), MAF4, and MAF5, which are key repressors of flowering. The PDP family thus plays a crucial role in the transition from vegetative growth to flowering, an essential process for plant reproduction.
