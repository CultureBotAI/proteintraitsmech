  - kind: GENERAL
    text: >-
      The Caulimoviridae movement protein family is responsible for the intercellular transport of viral genomes in plant cells. These proteins facilitate the cell-to-cell propagation of viral particles by modifying plasmodesmata to allow the passage of viral ribonucleocapsids. They achieve this by forming tubule structures that increase the size exclusion limit of plasmodesmata, effectively bypassing the host cell wall barrier. This mechanism is crucial for the efficient spread of the virus without the need for viral budding, ensuring the movement of the viral genome directly to adjacent cells.
    source: "InterPro:IPR051596 abstract (LLM-generated, not curator-reviewed)"
