identifier: PANTHER:PTHR31896
label: "FAMILY REGULATORY PROTEIN, PUTATIVE (AFU_ORTHOLOGUE AFUA_3G14730)-RELATED"
definition: >-
  The acyltransferase family described here is involved in the biosynthesis of various secondary metabolites, including indole alkaloids, dimeric xanthones, meroterpenoids, cyclopeptides, and ergot alkaloids. These enzymes catalyse the transfer of acyl groups, such as acetyl or other acyl-CoA derivatives, to specific substrates, leading to the modification and maturation of bioactive compounds. The family members display substrate specificity and participate in complex biosynthetic pathways, contributing to the structural diversity of natural products with pharmaceutical potential, pathogen resistance, and mycotoxin production. The enzymes are characterised by their ability to tolerate a range of acyl groups and are involved in tailoring reactions that are crucial for the biological activity and final structure of the metabolites. This entry also includes EPS1 that harbours a non-canonical active site and an unprecedented isochorismoyl-glutamate A pyruvoyl-glutamate lyase activity that produces salicylic acid from the isochorismoyl-glutamate A substrate.
definition_source: "InterPro:IPR051283 abstract (PANTHER PTHR31896 is a member signature)"
