identifier: PANTHER:PTHR28670
label: "UV-STIMULATED SCAFFOLD PROTEIN A"
definition: >-
  UV-stimulated scaffold protein A (UVSSA) is part of a UV-induced ubiquitinated protein complex involved in transcription-coupled nucleotide excision repair (TC-NER) in response to UV damage. It stabilise the TC-NER master organising protein ERCC6 (also known as CSB) by delivering the deubiquitinating enzyme USP7 to TC-NER complexes.
