identifier: PANTHER:PTHR47257
label: "PH-RESPONSE TRANSCRIPTION FACTOR PACC/RIM101"
definition: >-
  The pacC/RIM101 family comprises transcription factors that regulate gene expression in response to ambient pH changes. Members of this family activate transcription of alkaline-expressed genes and repress acid-expressed genes when the ambient pH is alkaline. They are involved in various physiological processes, including virulence, mating, sporulation, and invasive growth in different fungal species. Some members specifically recognize and bind to DNA consensus sequences, contributing to the precise regulation of target genes. The activity of these transcription factors is critical for adapting to environmental pH shifts and is essential for the pathogenicity and lifecycle of the organisms.
