identifier: PANTHER:PTHR28003
label: "NUCLEOPORIN POM34"
definition: >-
  Proteins containing this domain are components of the nuclear pore complex. One member of this domain is Nucleoporin POM34 (UniProtKB:Q12445) which is thought to have a role in anchoring peripheral Nups into the pore and mediating pore formation.
