  - kind: GENERAL
    text: >-
      The acetyltransferase family is involved in various biological processes, including the biosynthesis of secondary metabolites such as satratoxins, which are trichothecene mycotoxins linked to human food poisonings. Members of the family function as acetyltransferases, which are enzymes that transfer acetyl groups to substrates. Some family members are implicated in the detoxification of harmful compounds, such as puromycin, thereby contributing to cellular defense mechanisms. The family includes proteins that are part of gene clusters encoding multiple enzymes, which work together to synthesize and modify complex organic molecules. These proteins may also play roles in endogenous protection from toxicity and in the regulation of expression of gene clusters responsible for metabolite production.
    source: "InterPro:IPR052523 abstract (LLM-generated, not curator-reviewed)"
