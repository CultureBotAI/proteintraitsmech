identifier: PANTHER:PTHR46988
label: "TWO PORE CALCIUM CHANNEL PROTEIN 1"
definition: >-
  In Arabidopsis, AtTPC1 mediates Ca(2+) flux and regulates germination and stomatal movement. In tobacco cells, NtTPC1 has roles in defense responses and acts as the major ROS-responsive Ca2+ channel.
