identifier: PANTHER:PTHR10890
label: "CYSTEINYL-TRNA SYNTHETASE"
definition: >-
  This entry represents a subgroup of the class-I aminoacyl-tRNA synthetase family. It includes cysteinyl-tRNA synthetase and the related enzyme mycothiol ligase. Cysteine-tRNA ligase (also known as Cysteinyl-tRNA synthetase) (EC:6.1.1.16) is an alpha monomer and belongs to class Ia. It is highly specific despite not possessing the amino acid editing activity characteristic of many other tRNA ligases. Mycothiol ligase, also known as L-cysteine:1D-myo-inositol 2-amino-2-deoxy-alpha-D-glucopyranoside ligase, uses ATP to ligate a Cys residue to a mycothiol precursor molecule, in the second to last step in mycothiol biosynthesis.
