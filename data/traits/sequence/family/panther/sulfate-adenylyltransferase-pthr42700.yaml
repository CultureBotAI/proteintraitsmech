  - kind: GENERAL
    text: >-
      SULFATE ADENYLYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42700. PANTHER protein class: nucleotidyltransferase. Members are annotated with the molecular function adenylyltransferase activity, nucleotidyltransferase activity. and participate in sulfur compound metabolic process. and localise to cytoplasm, cellular anatomical entity, intracellular anatomical structure.
