identifier: PANTHER:PTHR42700
label: "SULFATE ADENYLYLTRANSFERASE"
definition: >-
  The sulfate adenylyltransferase and APS kinase family is involved in the intracellular assimilation of sulfate. Members of this family catalyze the formation of adenosine-5'-phosphosulfate (APS) from inorganic sulfate and ATP, a key step in the biosynthesis of sulfur-containing amino acids. Some proteins within the family have a non-functional APS kinase domain that is implicated in allosteric regulation by 3'-phosphoadenosine 5'-phosphosulfate (PAPS). Binding of PAPS to this domain induces a conformational change that decreases the substrate affinity of the enzyme. This regulatory mechanism ensures the proper balance of activated sulfate within the cell.
