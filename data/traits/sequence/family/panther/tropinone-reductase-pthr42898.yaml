identifier: PANTHER:PTHR42898
label: "TROPINONE REDUCTASE"
definition: >-
  This entry represents a group of tropinone reductase-like short-chain dehydrogenases (SDRs) from bacteria and plants. This entry includes tropinone reductase 1/2 (TR1/2) from Datura stramonium (Common thornapple). TR1 catalyses the stereospecific reduction of tropinone to tropine. The Arabidopsis thaliana homologues show high sequence similarity, but do not reduce tropinone. One of the Arabidopsis thaliana homologue, SAG13 (At2g29350), has been shown to reduce small lipophilic ketones and several monoterpene ketones. This entry also includes noroxomaritidine/norcraugsodine reductase (NR) rom Narcissus aff. pseudonarcissus MK-2014 (Daffodil). NR catalyses the conversion of noroxomaritidine to oxomaritidine, a precursor of haemanthamine- and crinamine-type alkaloids, promising anticancer agents.
definition_source: "InterPro:IPR045000 abstract (PANTHER PTHR42898 is a member signature)"
