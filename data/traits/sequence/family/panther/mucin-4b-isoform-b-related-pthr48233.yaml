  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of vulval development in certain organisms. Members of this family function as negative regulators, working to counteract the effects of Ras-mediated signaling pathways that promote vulval induction. They perform their regulatory role within the same cells where they are expressed, indicating a cell-autonomous mechanism of action. Through their activity, these proteins help to maintain proper developmental processes and ensure that vulval formation occurs correctly and at the appropriate developmental stage.
