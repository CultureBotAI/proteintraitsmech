identifier: PANTHER:PTHR20765
label: "SOLUTE CARRIER FAMILY 43 MEMBER 3-RELATED"
definition: >-
  This family includes Equilibrative nucleobase transporter 1 (also known as Solute carrier family 43 member 3), a sodium-independent purine-selective nucleobase transporter which mediates the equilibrative transport of extracellular purine nucleobases such as adenine, guanine and hypoxanthine.
