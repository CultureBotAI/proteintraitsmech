identifier: PANTHER:PTHR31814
label: "Phosphomevalonate kinase"
definition: >-
  This entry includes phosphomevalonate kinases from bacteria, fungi, plants and archaea. The eukaryote enzyme is phosphomevalonate kinase Erg8. The phosphomevalonate kinase from Sulfolobus solfataricus catalyses the phosphorylation of (R)-mevalonate 5-phosphate to (R)-mevalonate 5-diphosphate and is important in the pathway for the biosynthesis of archaeal membrane lipids.
