identifier: PANTHER:PTHR13179
label: "DEP DOMAIN CONTAINING PROTEIN 5"
definition: >-
  Proteins in this family contain a DEP domain, which is a globular domain of about 80 residues. This entry includes GTPase-activating proteins (GAPs), such as Iml1 from fungi and GATOR complex protein DEPDC5 from mammals. In Saccharomyces cerevisiae, Iml1 is a GAP subunit of both the SEA (Seh1-associated) and Iml1 complexes (Iml1-Npr2-Npr3). SEA complex is associated dynamically with the vacuole and is involved in autophagy. Iml1 complex is required for non-nitrogen-starvation (NNS)-induced autophagy. In mammals, DEPDC5 is a component of the GATOR1 complex functions as an inhibitor of the amino acid-sensing branch of the TORC1 pathway.
definition_source: "InterPro:IPR027244 abstract (PANTHER PTHR13179 is a member signature)"
