identifier: PANTHER:PTHR15327
label: "MICROFIBRIL-ASSOCIATED PROTEIN"
definition: >-
  MFAP1 is a component of the elastin-associated microfibrils. Drosophila MFAP1 binds to Prp38, a tri-small nuclear ribonucleoprotein component, and is required for pre-mRNA processing and G2/M progression.
