identifier: PANTHER:PTHR40455
label: "ANTITOXIN HIGA"
definition: >-
  HigA is the antitoxin component of a type II toxin-antitoxin (TA) system HigB/HigA. The toxin protein HigB is a ribosome-dependent mRNA interferase belonging to RelE family, which cleave mRNAs at the ribosomal A site. The antitoxin HigA possesses DNA binding activity within its helix-turn-helix fold (HTH) and modulates HigBA expression.
