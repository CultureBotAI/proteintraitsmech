  - kind: GENERAL
    text: >-
      This family of proteins includes L,D-transpeptidases that are likely involved in the synthesis of bacterial cell walls by catalyzing the formation of a specific type of cross-link between peptidoglycan strands. These enzymes are characterized by their ability to generate meso-diaminopimelyl-3 to meso-diaminopimelyl-3 cross-links, which are essential for maintaining cell wall integrity and shape in certain bacteria. Members of this family share structural similarities and are related to the YkuD family, suggesting a conserved mechanism of action across different bacterial species.
