identifier: PANTHER:PTHR47185
label: "PX DOMAIN-CONTAINING PROTEIN YPR097W"
definition: >-
  This is a family of conserved fungal proteins which contain DUF3818 and PXA domains, including LEC1/YPR097W from budding yeast and C663.15c/C1450.12 from fission yeast. LEC1 is a phosphoinositide-binding protein that plays a role in regulation of ergosterol distribution in the cell. It facilitates ergosterol transport between plasma membrane and lipid droplets.
