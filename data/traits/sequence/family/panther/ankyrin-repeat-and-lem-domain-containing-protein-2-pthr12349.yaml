identifier: PANTHER:PTHR12349
label: "ANKYRIN REPEAT AND LEM DOMAIN-CONTAINING PROTEIN 2"
definition: >-
  ANKYRIN REPEAT AND LEM DOMAIN-CONTAINING PROTEIN 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12349. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, palmitoyltransferase activity, transferase activity. Subfamilies participate in protein lipidation, nitrogen compound metabolic process, metabolic process.
