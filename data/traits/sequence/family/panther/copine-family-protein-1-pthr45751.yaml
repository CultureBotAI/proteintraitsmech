  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases and copine domain-containing proteins. The E3 ubiquitin-protein ligases are involved in various cellular processes, including the modulation of hormone signaling pathways such as jasmonate and abscisic acid, which are crucial for plant responses to stress and developmental cues. They function by mediating the ubiquitination and subsequent proteasomal degradation of specific target proteins, thus regulating protein levels within the cell. The copine domain-containing proteins are implicated in muscle development, particularly in the assembly of dense bodies and M lines, by recruiting various components to integrin-mediated attachment sites. Collectively, these proteins play significant roles in cellular signaling, protein turnover, and structural organization.
    source: "InterPro:IPR052079 abstract (LLM-generated, not curator-reviewed)"
