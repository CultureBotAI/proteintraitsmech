  - kind: GENERAL
    text: >-
      COPINE FAMILY PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45751. PANTHER protein class: calcium-binding protein. Members are annotated with the molecular function ubiquitin-protein transferase activity, catalytic activity, acting on a protein, ubiquitin-like protein transferase activity. and participate in protein ubiquitination, post-translational protein modification. and localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
