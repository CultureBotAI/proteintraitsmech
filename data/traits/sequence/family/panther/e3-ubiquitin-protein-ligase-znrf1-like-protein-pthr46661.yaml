  - kind: GENERAL
    text: >-
      The ZNRF ubiquitin-protein ligase family is characterized by its members' E3 ubiquitin ligase activity, which is crucial for various biological processes including neuronal transmission, plasticity, cell differentiation, and inflammation regulation. Members of this family ubiquitinate specific substrates such as the Na(+)/K(+) ATPase alpha-1 subunit and AKT1, influencing their endocytosis and degradation. This activity is essential for maintaining cellular functions and signaling pathways. The family's involvement in the regulation of mTORC1 activation and modulation of immune responses through TLR trafficking highlights its role in cellular homeostasis and response to external stimuli. The RING-type zinc finger domain present in these proteins is essential for their E3 ligase function.
    source: "InterPro:IPR051878 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
