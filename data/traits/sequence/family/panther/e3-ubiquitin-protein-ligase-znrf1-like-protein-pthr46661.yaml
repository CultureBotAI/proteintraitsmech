definitions:
  - kind: GENERAL
    text: >-
      E3 UBIQUITIN-PROTEIN LIGASE ZNRF1-LIKE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46661. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity. Members participate in proteasome-mediated ubiquitin-dependent protein catabolic process, protein K48-linked ubiquitination. Members localise to intracellular membrane-bounded organelle, cytoplasm, membrane.
