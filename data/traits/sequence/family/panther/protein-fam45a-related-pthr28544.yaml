identifier: PANTHER:PTHR28544
label: "PROTEIN FAM45A-RELATED"
definition: >-
  This family includes DENN (differentially expressed in normal cells and neoplasia) domain-containing protein 10 (also known as FAM45A) and DENN domain-containing protein 10B (also known as FAM45B). DENN domain-containing protein 10 is a guanine nucleotide exchange factor (GEF) for Rab small GTPases. It has been shown to define a novel regulatory step in the homeostasis of late endocytic pathway, including endosomal positioning, maturation and secretion.
