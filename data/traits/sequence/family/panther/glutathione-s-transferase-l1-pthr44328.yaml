identifier: PANTHER:PTHR44328
label: "GLUTATHIONE S-TRANSFERASE L1"
definition: >-
  This entry represents a group of plant Glutathione S-transferases, including GSTL1/2/3 from Arabidopsis. They have glutathione-dependent thiol transferase activity. GSTL1/3 are cytosolic, while GSTL2 is chloroplastic.
