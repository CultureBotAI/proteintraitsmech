identifier: PANTHER:PTHR21404
label: HEN1
definition: >-
  This entry consists of the eukaryal and bacterial 3'-RNA ribose 2'-O-methyltransferase, Hen1. Eukaryal Hen1 is a methyltransferase that adds a 2'-O-methyl group at the 3'-end small RNAs to protects the 3'-end of sRNAs from uridylation activity and subsequent degradation. In bacetria, Hen1 catalyses the same chemical reaction, but forms Pnkp/Hen1 heterotetramer and is involved in RNA repair.
