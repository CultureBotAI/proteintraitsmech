label: "VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 27"
definition: >-
  VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 27 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47794. PANTHER protein class: membrane traffic protein. Members are annotated with the molecular function phosphatidylinositol-3-phosphate binding, phosphatidylinositol binding, ubiquitin binding. Members participate in protein transport to vacuole involved in ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway, protein targeting to vacuole. Members localise to endosome, cytoplasm, protein-containing complex.
