identifier: PANTHER:PTHR47794
label: "VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 27"
definition: >-
  VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 27 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47794. PANTHER protein class: membrane traffic protein. Members are annotated with the molecular function phosphatidylinositol-3-phosphate binding, ubiquitin-like protein binding, phosphatidylinositol binding. Members participate in establishment of protein localization to organelle, protein transport to vacuole involved in ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway, protein targeting to vacuole. Members localise to cytoplasm, membrane-bounded organelle, cytoplasmic vesicle.
