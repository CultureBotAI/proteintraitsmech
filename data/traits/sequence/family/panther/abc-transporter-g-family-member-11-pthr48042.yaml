identifier: PANTHER:PTHR48042
label: "ABC TRANSPORTER G FAMILY MEMBER 11"
definition: >-
  The ABC transporter G family is involved in various transport functions across the plant cell membrane. Members of this family are implicated in the development and maintenance of plant structures such as the cuticle, root suberin, and pollen coat by regulating the transport of lipids, cutin, waxes, and possibly lignin precursors. They play a role in developmental plasticity, stress responses, and vascular development. Some members are also involved in the secretion of cuticular wax, which is crucial for plant interactions with the environment, including response to microbial infection and influencing plant attractiveness to insect vectors. Additionally, a member of the family in Petunia hybrida is responsible for the release of volatile organic compounds that attract pollinators during the evening and night.
