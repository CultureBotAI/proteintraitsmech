identifier: PANTHER:PTHR22573
label: "PHOSPHOHEXOMUTASE FAMILY MEMBER"
definition: >-
  This entry represents a group of phosphoglucomutases from bacteria and eukaryotes, including Pgm from bacteria, PGM1/5 from humans, Pgm1/2 from yeasts and chloroplastic/cytoplasmic PGM from plants. Phosphoglucomutase, alpha-D-glucose phosphate-specific (EC:5.4.2.2) links the anaerobic or aerobic glycolysis of glucose-6-phosphate and glucose-1-phosphate produced by various glycan phosphorylases by catalysing the transfer of a phosphate group between C-1 and C-6 of glucose.
