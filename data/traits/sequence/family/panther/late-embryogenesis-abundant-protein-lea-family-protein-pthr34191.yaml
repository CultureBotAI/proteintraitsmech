identifier: PANTHER:PTHR34191
label: "LATE EMBRYOGENESIS ABUNDANT PROTEIN (LEA) FAMILY PROTEIN"
definition: >-
  This entry represents a group of proteins from plants, including the Late embryogenesis abundant proteins (LEAs), late embryonic proteins abundant in higher plant seed embryos LEA1/2 from Cicer arietinum (Chickpea) and LEAD7 from Gossypium hirsutum (Upland cotton); and Stress-induced protein KIN2 from Arabidopsis thaliana.
