identifier: PANTHER:PTHR23055
label: "CALCIUM BINDING PROTEINS"
definition: >-
  A number of other proteins including visinin, hippocalcin, neurocalcin, S-modulin, visinin-like protein, frequenin, guanylyl cyclase-activating proteins GCAP-1 and GCAP-2 belong to this family. All of the family members are generally N-myristoylated proteins containing four EF-hand calcium-binding consensus motifs. Recoverin is a Ca(2+) -binding protein that controls phosphorylation of the visual receptor rhodopsin by inhibiting rhodopsin kinase (GRK-1) in photoreceptor cells. It serves as a cancer-retina antigen that is expressed in retina and tumour cells and evokes antibodies and/or T cells in patients with cancer.
