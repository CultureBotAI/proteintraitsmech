identifier: PANTHER:PTHR22455
label: "CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 91"
definition: >-
  CFAP91 (also known as AMY-1-associating protein expressed in testis 1 or AAT-1) is a component of a spoke-associated complex, regulates flagellar dynein activity by mediating regulatory signals between the radial spokes and dynein arms. It binds to AMY1 and may play a role in spermatogenesis.
