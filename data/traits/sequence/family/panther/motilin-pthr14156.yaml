identifier: PANTHER:PTHR14156
label: MOTILIN
definition: >-
  Promotilin can be cleaved into two chains: motilin and motilin-associated peptide. Motilin plays an important role in the regulation of interdigestive gastrointestinal motility and indirectly causes rhythmic contraction of duodenal and colonic smooth muscle.
