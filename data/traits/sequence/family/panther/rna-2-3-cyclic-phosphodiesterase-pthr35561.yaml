identifier: PANTHER:PTHR35561
label: "RNA 2',3'-CYCLIC PHOSPHODIESTERASE"
definition: >-
  Members of this entry are bacterial and archaeal RNA cyclic phosphodiesterases (CPDases). They hydrolyse RNA 2',3'-cyclic phosphodiester to an RNA 2'-phosphomonoester. In vitro, they are able to ligate half-tRNA molecules, though the RNA ligase activity appears to be weak in archaea.
