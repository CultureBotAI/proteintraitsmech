identifier: PANTHER:PTHR47671
label: "PLECKSTRIN DOMAIN-CONTAINING FAMILY G MEMBER 6"
definition: >-
  Pleckstrin homology domain-containing family G member 6 (PLEKHG6), also known as MyoGEF, is a guanine nucleotide exchange factor required for cytokinesis. It interacts with ezrin; this interaction promotes RhoG-dependent apical cytoskeleton rearrangements in epithelial cells.
