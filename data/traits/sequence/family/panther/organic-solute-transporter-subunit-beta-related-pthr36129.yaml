  - kind: GENERAL
    text: >-
      This family of proteins includes essential components of the Ost-alpha/Ost-beta complex, which functions as a heterodimeric intestinal basolateral transporter. These proteins are responsible for the export of bile acids from enterocytes into portal blood, with a higher efficiency for transporting taurine-conjugated bile acids compared to glycine-conjugated ones. They also facilitate the enterohepatic circulation of sterols by transporting various steroids, including estrone 3-sulfate and dehydroepiandrosterone 3-sulfate. Additionally, they can transport eicosanoids like prostaglandin E2. These proteins interact with SLC51A, influencing its glycosylation, membrane trafficking, and stability, which are critical for the formation and function of the Ost-alpha/Ost-beta complex at the cell membrane surface.
    source: "InterPro:IPR052678 abstract (LLM-generated, not curator-reviewed)"
