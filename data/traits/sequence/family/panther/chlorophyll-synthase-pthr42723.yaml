identifier: PANTHER:PTHR42723
label: "CHLOROPHYLL SYNTHASE"
definition: >-
  This family of proteins is found in bacteria, archaea, fungi and plants and includes enzymes involved in various prenyltransferase reactions, which are critical steps in the biosynthesis of diverse isoprenoid compounds. These enzymes transfer prenyl groups to acceptor molecules, playing roles in the synthesis of archaeal membrane lipids, chlorophylls, carotenoids, and other terpenoids. Some members catalyze the esterification of chlorophyllide and bacteriochlorophyllide with prenyl diphosphates, while others are involved in the elongation of carotenoids. Additionally, certain enzymes within this family participate in the biosynthesis of complex natural products with biological activities, such as fumagillin and erinacines, by catalyzing the transfer of prenyl groups or cyclization of diterpenes.
definition_source: "InterPro:IPR050475 abstract (PANTHER PTHR42723 is a member signature)"
