  - kind: GENERAL
    text: >-
      This family of proteins is involved in cytokinesis, the process where the cytoplasm of a eukaryotic cell divides to form two daughter cells. Members of this family play a role in the ingression of the plasma membrane during this process, which is crucial for the separation of the daughter cells. They may also influence the synthesis of the primary septum, a structure essential for cell division in yeast. The presence of a C2 domain in some members suggests a role in membrane interaction during cytokinesis, although this domain is not necessary for the protein's recruitment to the actomyosin ring.
    source: "InterPro:IPR052981 abstract (LLM-generated, not curator-reviewed)"
