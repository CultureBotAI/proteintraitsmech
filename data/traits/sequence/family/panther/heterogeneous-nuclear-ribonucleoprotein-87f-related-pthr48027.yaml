identifier: PANTHER:PTHR48027
label: "HETEROGENEOUS NUCLEAR RIBONUCLEOPROTEIN 87F-RELATED"
definition: >-
  This family comprises RNA-binding proteins with roles in RNA transcription or processing, particularly under stress conditions. Some members of the family are involved in C-to-U editing of mitochondrial RNA, with some controlling a significant proportion of mitochondrial editing sites. They exhibit a strong affinity for single-stranded nucleic acids, especially poly(U) sequences. SLIRP functions as a nuclear receptor corepressors by interacting with specific RNA structures, such as the SRA RNA, to modulate nuclear receptor coactivation. These proteins are implicated in stress tolerance mechanisms and may influence transcriptional regulation through their RNA-binding capabilities.
