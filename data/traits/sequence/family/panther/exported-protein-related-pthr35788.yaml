identifier: PANTHER:PTHR35788
label: "EXPORTED PROTEIN-RELATED"
definition: >-
  This family of proteins includes those involved in antibiotic resistance, specifically resistance to glycopeptide antibiotics such as vancomycin. The family member VanW is known to confer resistance to vancomycin by an as yet not fully elucidated mechanism, which is believed to involve the remodeling of cell wall precursors that vancomycin targets. Another member, YoaR, is currently uncharacterized, but its association with the family suggests a potential role in bacterial response to environmental stress or antibiotic pressure. The exact functions and mechanisms of action for this family remain to be fully characterized, and they may vary among different family members.
