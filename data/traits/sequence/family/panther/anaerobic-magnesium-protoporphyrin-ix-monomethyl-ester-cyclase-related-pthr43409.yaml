identifier: PANTHER:PTHR43409
label: "ANAEROBIC MAGNESIUM-PROTOPORPHYRIN IX MONOMETHYL ESTER CYCLASE-RELATED"
definition: >-
  This family includes Anaerobic magnesium-protoporphyrin IX monomethyl ester cyclase from Rhodobacter capsulatus (BchE) and similar radical SAM superfamily proteins that are involved in diverse biosynthetic pathways, including the formation of tetrapyrroles and bacteriochlorophylls, essential components for photosynthesis and light-harvesting in certain bacteria. The BchE family members catalyse the formation of the isocyclic E-ring in Mg-protoporphyrin monomethyl ester, leading to protochlorophyllide a, a precursor to chlorophyll. These enzymes perform methylation reactions, such as the methylation of hopanoids and the biosynthesis of bacteriochlorophyll c, which is crucial for green sulfur bacteria in low-light conditions. Other members are involved in antibiotic biosynthesis, fosfomycin production, and modification of other organic compounds, indicating a broad functional spectrum related to methylation processes.
