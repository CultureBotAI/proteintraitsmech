identifier: PANTHER:PTHR46054
label: "MATERNAL EFFECT PROTEIN STAUFEN"
definition: >-
  This family of proteins includes RNA-binding proteins that are involved in the transport and localization of RNAs within cells. They play a critical role in the microtubule-dependent transport of RNAs, particularly in polarized and neuronal cell types, facilitating the localization of specific mRNAs to dendrites and other cellular regions. This is essential for processes such as neurite outgrowth and synaptic plasticity. Members of this family contain domains that bind double-stranded RNA and interact with tubulin, contributing to their role in cross-linking cytoskeletal and RNA components. Some members are also implicated in viral processes, interacting with viral proteins during particle budding. The family is characterized by the presence of double-stranded RNA-binding motifs (DRBMs), with the DRBM 3 domain being a significant determinant for RNA-binding activity.
