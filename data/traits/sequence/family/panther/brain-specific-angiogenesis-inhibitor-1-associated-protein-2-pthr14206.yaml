identifier: PANTHER:PTHR14206
label: "BRAIN-SPECIFIC ANGIOGENESIS INHIBITOR 1-ASSOCIATED PROTEIN 2"
definition: >-
  This entry represents a group of I-BAR (Bin/amphipysin/Rvs) domain containing proteins, including IRSp53, IRTKS, Pinkbar. BAR domain forms an anti-parallel all-helical dimer, with a curved (banana-like) shape, that promotes membrane tubulation. The BAR domain containing proteins can be classified into three types: BAR, F-BAR and I-BAR. BAR and F-BAR proteins generate positive membrane curvature, while I-BAR proteins induce negative curvature. Proteins in this family also contain an additional C-terminal SH3 domain.
definition_source: "InterPro:IPR027681 abstract (PANTHER PTHR14206 is a member signature)"
