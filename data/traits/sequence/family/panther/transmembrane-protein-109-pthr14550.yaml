identifier: PANTHER:PTHR14550
label: "TRANSMEMBRANE PROTEIN 109"
definition: >-
  TMEM109, also known as Mg23, is a endoplasmic reticulum protein that facilitates DNA damage-induced apoptosis. It plays a protective role against UVC by accumulating alphaBC in the close vicinity of the ER.
