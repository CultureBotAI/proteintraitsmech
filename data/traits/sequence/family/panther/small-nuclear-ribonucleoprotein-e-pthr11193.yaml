identifier: PANTHER:PTHR11193
label: "SMALL NUCLEAR RIBONUCLEOPROTEIN E"
definition: >-
  Small nuclear ribonucleoprotein E (SME1) is involved in pre-mRNA splicing. It is required for pre-mRNA splicing, cap modification and for the stability of snRNA U1, U2, U4 and U5. The eukaryotic Sm proteins (B/B', D1, D2, D3, E, F and G) assemble into a hetero-heptameric ring around the Sm site of the 2,2,7-trimethyl guanosine (m3G) capped U1, U2, U4 and U5 snRNAs (Sm snRNAs) forming the core of the snRNP particle. The snRNP particle, in turn, assembles with other components onto the pre-mRNA to form the spliceosome which is responsible for the excision of introns and the ligation of exons. Members of this family share a highly conserved Sm fold containing an N-terminal helix followed by a strongly bent five-stranded antiparallel β-sheet. Sm subunit E binds subunits F and G to form a trimer which then assembles onto snRNA along with the D1/D2 and D3/B heterodimers forming a seven-membered ring structure.
definition_source: "InterPro:IPR027078 abstract (PANTHER PTHR11193 is a member signature)"
