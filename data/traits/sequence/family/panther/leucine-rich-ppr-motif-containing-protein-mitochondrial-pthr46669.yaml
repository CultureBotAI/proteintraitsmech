identifier: PANTHER:PTHR46669
label: "LEUCINE-RICH PPR MOTIF-CONTAINING PROTEIN, MITOCHONDRIAL"
definition: >-
  LRP130 is a pentatricopeptide motif protein that binds to mitochondrial and nuclear RNAs. It associates with mRNA/mRNP complexes at the outside of NE and ER, and plays a role in control of mRNA metabolism. It may be involved in mitochondrial RNA transcript stability, transcription termination, and RNA processing.
