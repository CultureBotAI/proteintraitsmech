identifier: PANTHER:PTHR12983
label: "RING FINGER 10 FAMILY MEMBER"
definition: >-
  This entry represents a group of E3 ubiquitin-protein ligases including MAG2 from budding yeasts and RNF10 from animals, which contain a RING-finger. RNF10 has been shown to be involved in transcriptional regulation of the myelin-associated glycoprotein gene and myelin formation in Schwann cells. It catalyses monoubiquitination of 40S ribosomal proteins RPS2/us5 and RPS3/us3 in response to ribosome stalling. MAG2 is E3 ubiquitin-protein ligase involved in the degradation of non-functional 18S rRNAs in response to stalled ribosomes.
definition_source: "InterPro:IPR039739 abstract (PANTHER PTHR12983 is a member signature)"
