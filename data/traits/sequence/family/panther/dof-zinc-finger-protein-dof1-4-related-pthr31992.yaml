identifier: PANTHER:PTHR31992
label: "DOF ZINC FINGER PROTEIN DOF1.4-RELATED"
definition: >-
  Dof domain is a zinc finger DNA-binding domain that shows resemblance to the Cys2 zinc finger, although it has a longer putative loop where an extra Cys residue is conserved. Dof domain containing proteins are transcription factors that play various roles in plants.
