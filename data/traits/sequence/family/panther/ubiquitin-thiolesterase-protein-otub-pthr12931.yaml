identifier: PANTHER:PTHR12931
label: "UBIQUITIN THIOLESTERASE PROTEIN OTUB"
definition: >-
  UBIQUITIN THIOLESTERASE PROTEIN OTUB — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12931. PANTHER protein class: cysteine protease, protein modifying enzyme. Members are annotated with the molecular function cysteine-type peptidase activity, protein binding, ubiquitin-like protein binding. and participate in protein deubiquitination, post-translational protein modification, protein K48-linked deubiquitination. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
