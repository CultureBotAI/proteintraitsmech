label: "UBIQUITIN THIOLESTERASE PROTEIN OTUB"
definition: >-
  UBIQUITIN THIOLESTERASE PROTEIN OTUB — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12931. PANTHER protein class: cysteine protease, protein modifying enzyme. Members are annotated with the molecular function cysteine-type deubiquitinase activity, ubiquitin binding. Members participate in protein K48-linked deubiquitination. Members localise to nucleus, intracellular anatomical structure.
