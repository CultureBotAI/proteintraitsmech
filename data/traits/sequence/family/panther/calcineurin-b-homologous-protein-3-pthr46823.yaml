definitions:
  - kind: GENERAL
    text: >-
      CALCINEURIN B HOMOLOGOUS PROTEIN 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46823. Members are annotated with the molecular function calcium ion binding, phosphatase inhibitor activity. Members participate in positive regulation of myeloid cell differentiation, regulation of sodium ion transmembrane transporter activity, positive regulation of cell development. Members localise to nucleus, plasma membrane, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Calcineurin B Homologous Protein 3 family plays a crucial role in cellular pH regulation by modulating plasma membrane-type Na(+)/H(+) exchange activity. It is involved in hematopoietic stem cell differentiation, particularly towards the megakaryocytic lineage, and is essential for linking ERK cascade activation to the expression of ETS family genes during this process. Additionally, it participates in granulocytic differentiation in an ERK-dependent manner. Members of the family also inhibit the phosphatase activity of calcineurin and are known to bind calcium and magnesium through EF-hand domains, which induces a conformational change in the protein.
    source: "InterPro:IPR052490 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
