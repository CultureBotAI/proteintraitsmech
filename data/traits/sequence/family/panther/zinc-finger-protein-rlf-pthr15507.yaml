  - kind: GENERAL
    text: >-
      ZINC FINGER PROTEIN RLF — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15507. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function DNA-binding transcription factor activity, RNA polymerase II-specific, DNA binding. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
