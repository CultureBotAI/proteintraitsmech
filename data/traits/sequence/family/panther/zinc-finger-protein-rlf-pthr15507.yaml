  - kind: GENERAL
    text: >-
      ZINC FINGER PROTEIN RLF — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15507. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function DNA-binding transcription factor activity, RNA polymerase II-specific, organic cyclic compound binding, DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes and transcriptional regulators. The enzymatic members are involved in the breakdown of complex carbohydrates, such as dextran, which may influence bacterial adherence to surfaces like teeth. Other members of the family, characterized by zinc finger domains, are implicated in the regulation of gene expression, likely through binding to DNA and influencing transcriptional processes. These regulatory proteins are essential for various cellular functions and may have roles in development, differentiation, and maintenance of cellular states.
    source: "InterPro:IPR052251 abstract (LLM-generated, not curator-reviewed)"
