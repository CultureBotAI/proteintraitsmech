      CELLULOSE-BINDING DOMAIN-CONTAINING PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33239. Members are annotated with the molecular function extracellular matrix structural constituent. Members participate in extracellular matrix organization. Members localise to extracellular matrix.
