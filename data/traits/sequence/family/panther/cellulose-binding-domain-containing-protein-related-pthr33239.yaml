  - kind: GENERAL
    text: >-
      This family of proteins includes members that are specific to the spore germination and stalk formation stages in the life cycle of the slime mold Dictyostelium discoideum. One member is characterized by an internal repeat motif that is indicative of its role in spore germination. Other members are associated with the stalk formation process, suggesting a functional specialization in the developmental transition from spore to multicellular organism. The exact molecular functions of these proteins are not fully elucidated, but their stage-specific expression implies a role in the regulation of cellular differentiation and morphogenesis during the life cycle of D. discoideum.
    source: "InterPro:IPR052879 abstract (LLM-generated, not curator-reviewed)"
