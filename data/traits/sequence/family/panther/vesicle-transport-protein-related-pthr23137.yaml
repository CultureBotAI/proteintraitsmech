identifier: PANTHER:PTHR23137
label: "VESICLE TRANSPORT PROTEIN-RELATED"
definition: >-
  Sft2 is a non-essential membrane protein that localizes to a late-Golgi compartment and is involved in vesicle fusion with the Golgi complex. It is thought to interact with Sed5, a yeast t-SNARE protein that plays a role in ER-Golgi and intra-Golgi vesicular transport. Sft2 and related proteins are found in eukaryotes and show four putative transmembrane regions.
