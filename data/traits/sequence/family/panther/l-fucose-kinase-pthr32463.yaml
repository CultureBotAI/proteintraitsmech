definitions:
  - kind: GENERAL
    text: >-
      L-FUCOSE KINASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32463. PANTHER protein class: kinase. Members are annotated with the molecular function kinase activity, phosphotransferase activity, alcohol group as acceptor. Members participate in nucleotide biosynthetic process, nucleotide-sugar metabolic process, carbohydrate derivative biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the salvage pathways of various sugars. Members of this family exhibit kinase activity, where they catalyze the phosphorylation of specific sugar substrates using ATP or GTP. Some members are bifunctional, having both kinase and pyrophosphorylase activities, specifically converting L-fucose to GDP-L-fucose. Others are involved in the phosphorylation of D-glycero-alpha-D-manno-heptose 7-phosphate to form a bisphosphate product. The activities of these enzymes are crucial for the reutilization of sugars from the degradation of oligosaccharides, contributing to the metabolic processes within the cell.
    source: "InterPro:IPR052203 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
