identifier: PANTHER:PTHR19918
label: "CELL DIVISION CYCLE 20  CDC20   FIZZY -RELATED"
definition: >-
  The anaphase promoting complex/cyclosome (APC/C) is a multisubunit ubiquitin ligase that targets mitotic regulators for degradation in exit from mitosis. At the end of mitosis, APC/C is activated by phosphorylation and association with the WD-40 protein Cdc20/Fizzy. The inhibitory phosphorylation of Cdc20/Fizzy may have a role as a safeguard to keep the cyclosome inactive in early mitosis and under conditions of mitotic checkpoint arrest. This entry includes Cdc20/Fizzy homologues from fungi, plants and animals. Three characterised budding yeasts homologues are included in this entry: Cdc20, Cdh1 and Ama1. Cdc20 and Cdh1 have been shown to activate APC/C during mitosis, while Ama1 is a meiosis-specific activator of the APC/C. The APC/C-Cdh1 is also found involved in the cellular response to DNA damage.
definition_source: "InterPro:IPR033010 abstract (PANTHER PTHR19918 is a member signature)"
