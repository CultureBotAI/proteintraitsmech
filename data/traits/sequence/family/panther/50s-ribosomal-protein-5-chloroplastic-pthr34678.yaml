identifier: PANTHER:PTHR34678
label: "50S RIBOSOMAL PROTEIN 5, CHLOROPLASTIC"
definition: >-
  PSRP5 is a component of the chloroplast large ribosomal subunit (50S) and exists in multiple forms (alpha, beta, gamma) due to different transit peptide cleavage sites. The chloroplast ribosome is responsible for translating chloroplast genome-encoded proteins, including components of the photosynthetic apparatus.
