identifier: PANTHER:PTHR30157
label: "FERRIC REDUCTASE, NADPH-DEPENDENT"
definition: >-
  Siderophores are produced in various bacteria (and some plants) to extract iron from hosts. This entry represents a group of siderophore-interacting proteins, including ViuB and VuuB from Vibrio cholerae and YqjH from E. coli. ViuB is a putative siderophore-interacting protein (SIP), functionally substituted for the E. coli ferric reductase YqjH, which promotes the release of iron from the siderophore in the bacterial cytoplasm. VuuB is a ferric-siderophore reductase involved in iron removal from the siderophores after their transport into the cell. It acts as a major ferric-vulnibactin reductase catalysing the reduction of Fe3+-vulnibactin, a catecholate siderophore synthesized by V.vulnificus. It catalyses reduction of Fe3+-aerobactin, a citrate-hydroxamate siderophore produced by other bacteria, in the absence of IutB.
