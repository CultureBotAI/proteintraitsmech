identifier: PANTHER:PTHR39110
label: "TRANSMEMBRANE PROTEIN"
definition: >-
  This family of proteins is implicated in the process of merozoite invasion of erythrocytes. Members are believed to be involved in the initial attachment of the merozoite to the erythrocyte surface, which is a critical step in the life cycle of the parasite. Additionally, these proteins possess a region at the N-terminus that is suggested to have lipid-binding capabilities, which may play a role in membrane interactions or the formation of complexes necessary for invasion.
