  - kind: GENERAL
    text: >-
      WD REPEAT PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14344. Members participate in cellular aromatic compound metabolic process, methylation, macromolecule biosynthetic process. Members localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the post-transcriptional modification of tRNA molecules. Members of this family function in partnership with specific methyltransferases to methylate the 2'-O-ribose of nucleotides at the 34th position of the tRNA anticodon loop. This methylation is crucial for the correct positioning of the substrate tRNA during the modification process. Additionally, these proteins have roles in cellular processes such as the suppression of autophagy induced by amino acid starvation and the enhancement of cell growth suppression activities mediated by certain kinases. Some members also participate in the regulation of the retromer complex, which is important for the recycling of plasma membrane proteins from endosomes, and may be involved in the regulation of transposable elements.
    source: "InterPro:IPR051973 abstract (LLM-generated, not curator-reviewed)"
