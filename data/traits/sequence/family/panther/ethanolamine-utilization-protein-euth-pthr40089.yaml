identifier: PANTHER:PTHR40089
label: "ETHANOLAMINE UTILIZATION PROTEIN EUTH"
definition: >-
  Protonated ethanolamine does not enter cells, while uncharged ethanolamine diffuses freely across the membrane. External concentrations of the two forms vary with the pH. It has been shown in Salmonella enterica that EutH is a membrane protein that facilitates diffusion of protonated ethanolamine. It is involved in bacterial survival and replication in acidified macrophage vacuoles.
