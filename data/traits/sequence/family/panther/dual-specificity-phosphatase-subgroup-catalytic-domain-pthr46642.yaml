identifier: PANTHER:PTHR46642
label: "DUAL SPECIFICITY PHOSPHATASE, SUBGROUP, CATALYTIC DOMAIN"
definition: >-
  This family of proteins includes phosphoglucan phosphatases that are associated with starch granules and are involved in starch metabolism. Members of this family function to dephosphorylate phospho-oligosaccharides that accumulate during the night, playing a role in the regulation of starch degradation. These enzymes exhibit specificity for the glucan C3 and C6 positions, with some members showing a preference for the C6 position. The activity of these phosphatases is essential for the proper control of starch accumulation and is required for the initial steps of starch degradation at the granule surface. Additionally, these proteins possess a C-terminal polysaccharide-binding domain, which is necessary for their glucan phosphatase activity through interaction with the phosphatase domain.
