identifier: PANTHER:PTHR34297
label: "HYPOTHETICAL CYTOSOLIC PROTEIN-RELATED"
definition: >-
  Asp23 was identified as an alkaline shock protein expressed in a sigmaB-dependent manner in Staphylococcus aureus ( UniProtKB:Q2FW64 ). Following an alkaline shock, Asp23 accumulates in the soluble protein fraction of the S. aureus cell. Asp23 is one of the most abundant proteins in the cytosolic protein fraction of stationary S. aureus cells, with a copy-number of >25000 per cell. It is linked to the staphylococcal cell membrane and anchored there by AmpA. The overall function for the family is thus a cell envelope-related one in Gram-positive bacteria..
