  - kind: GENERAL
    text: >-
      F-BOX ONLY PROTEIN 42 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46432. Members are annotated with the molecular function ubiquitin ligase-substrate adaptor activity, protein-macromolecule adaptor activity. and localise to SCF ubiquitin ligase complex, intracellular protein-containing complex, cullin-RING ubiquitin ligase complex.
