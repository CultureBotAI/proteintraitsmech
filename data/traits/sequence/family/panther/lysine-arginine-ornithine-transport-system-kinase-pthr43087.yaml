  - kind: GENERAL
    text: >-
      This family of proteins includes GTPases with potential chaperone activity, involved in the assembly and repair of enzyme complexes. They may catalyze the reversible interconversion of isobutyryl-CoA and n-butyryl-CoA using radical chemistry. Some members also exhibit ATPase activity and are involved in cofactor delivery and holo-enzyme assembly. The family contains proteins with a P-loop GTPase domain that may act as a chaperone, and a 5'-deoxyadenosylcobalamin binding region homologous to ICM subunits. They may also participate in the repair of their cofactors, which can become inactivated during catalytic turnover.
