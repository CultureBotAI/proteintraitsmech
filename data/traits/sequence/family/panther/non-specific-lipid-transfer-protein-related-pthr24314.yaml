  - kind: GENERAL
    text: >-
      This family of proteins is involved in the degradation of chlorophyll b, a process essential for the proper turnover and recycling of chlorophyll molecules during plant development and stress responses. Members of this family function as chlorophyll(ide) b reductases, enzymes that catalyze the reduction of chlorophyll b to chlorophyll a, which is a key step in the chlorophyll catabolic pathway. These proteins are part of the short-chain dehydrogenases/reductases (SDR) superfamily and are also classified as chlorophyll catabolic enzymes (CCEs). They are localized within the chloroplast and can utilize various chlorophyll b derivatives as substrates.
    source: "InterPro:IPR052625 abstract (LLM-generated, not curator-reviewed)"
