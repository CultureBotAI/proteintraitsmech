identifier: PANTHER:PTHR42784
label: "PYRANOSE 2-OXIDASE"
definition: >-
  This family includes a group of GMC oxidoreductases, including Pyranose 2-oxidase from Trametes hirsuta (White-rot fungus), a diagnostic marker of diabetes mellitus. Members of this entry catalyse the oxidation of various sugars and related compounds. Some members play crucial roles in metabolic processes such as lignin degradation in wood rot fungi, where they generate hydrogen peroxide as a cosubstrate for ligninolytic peroxidases. The family is characterised by the presence of a flavin adenine dinucleotide (FAD) cofactor and is inhibited by compounds such as HgCl2.
