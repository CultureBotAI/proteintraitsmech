identifier: PANTHER:PTHR12120
label: "TNFR-CYS DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents a group of tumour necrosis factor receptors predominantly found in chordates, including human tumor necrosis factor receptor superfamily member 19/27/EDAR (TNR19/27/EDAR), which can mediate activation of JNK and NF-kappa-B and may promote caspase-independent cell death. TNR19, also known as TAJ and TROY, activates the RhoA and inhibits neurite outgrowth. It is involved in the development of the epidermis in human and mice. TNR27 is a receptor for EDA isoform A2, but not for EDA isoform A1. On the contrary, EDAR is a receptor for EDA isoform A1, but not for EDA isoform A2. Mutations in the gene encoding for this protein are associated with certain forms of of ectodermal dysplasia. The tumour necrosis factor (TNF) receptor (TNFR) superfamily comprises more than 20 type-I transmembrane proteins. Family members are defined based on similarity in their extracellular domain - a region that contains many cysteine residues arranged in a specific repetitive pattern. The cysteines allow formation of an extended rod-like structure, responsible for ligand binding. Upon receptor activation, different intracellular signalling complexes are assembled for different members of the TNFR superfamily, depending on their intracellular domains and sequences. Activation of TNFRs can therefore induce a range of disparate effects, including cell proliferation, differentiation, survival, or apoptotic cell death, depending upon the receptor involved.
