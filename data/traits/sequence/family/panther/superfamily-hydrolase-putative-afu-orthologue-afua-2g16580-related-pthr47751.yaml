  - kind: GENERAL
    text: >-
      The polyketide transferase af380 family is involved in the biosynthesis of various secondary metabolites with diverse biological activities. Members of this family function as transferases, typically catalyzing the transfer of polyketide chains onto different molecular scaffolds, which are often part of larger biosynthetic gene clusters. These enzymes play crucial roles in the formation of complex natural products such as fujikurins, brefeldin A, fumagillin, phaeospelide A, aculenes, gregatins, and atranones. The biosynthetic pathways often involve multiple enzymatic steps, including cyclization, oxidation, and lactonization, to produce the final bioactive compounds. The family also includes thiohydrolases that may be involved in the release and macrolactonization of polyketide chains. The diverse functions of these enzymes underscore their importance in the production of compounds with potential pharmaceutical applications.
    source: "InterPro:IPR051411 abstract (LLM-generated, not curator-reviewed)"
