identifier: PANTHER:PTHR33405
label: "PROTEIN FLX-LIKE 2"
definition: >-
  FLC EXPRESSOR (FLX) is a specific component of the FRI complex (FRI-C). Several FLX-like proteins exist in Arabidopsis. FLX-like 4 (FLX4) is known to be also a component of FRI-C and, like FLX, is required for the activation of FLC by FRI. FLC and FRI are determinants of the vernalization-requiring, winter-annual habit, blocking flowering prior to winter.
