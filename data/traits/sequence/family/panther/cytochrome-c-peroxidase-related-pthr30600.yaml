definitions:
  - kind: GENERAL
    text: >-
      CYTOCHROME C PEROXIDASE-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30600. PANTHER protein class: peroxidase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on peroxide as acceptor, antioxidant activity, catalytic activity.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family encompasses enzymes with peroxidase activity, primarily reducing hydrogen peroxide (H2O2) to water using reduced cytochrome c as an electron donor. Members are involved in various biological processes, including iodate respiration, where they play a role in detoxifying H2O2 produced by iodate reductases. Some family members are essential for the biosynthesis of tryptophan tryptophylquinone (TTQ), a cofactor of methylamine dehydrogenase (MADH), thus participating in methylamine metabolism. Others are involved in the anammox process, reducing nitric oxide to hydroxylamine, contributing significantly to the Earth's nitrogen cycle. The family's structural features include domains reminiscent of class 1 cytochromes c and, in some cases, calcium-binding sites with unique ligand sets.
    source: "InterPro:IPR051395 abstract (LLM-generated, not curator-reviewed)"
