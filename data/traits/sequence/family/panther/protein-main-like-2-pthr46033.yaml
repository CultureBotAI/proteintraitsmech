identifier: PANTHER:PTHR46033
label: "PROTEIN MAIN-LIKE 2"
definition: >-
  This entry represents a group of plant mobile domain containing proteins. They are required for the organisation of the root apical meristem (RAM) and the shoot apical meristem (SAM). Proteins in this entry include Protein MAINTENANCE OF MERISTEMS (MAIN) and its homologues, MAIN-like 1/2 (MAIL1/2) from Arabidopsis thaliana. They are required to maintain genome stability and cell division activity in meristematic cells. MAIL1 also plays a role in cell differentiation as it acts as an important factor for cell fate determination and maintenance throughout plant development. In Arabidopsis, MAIN possess three closely related homologues, namely MAIL1/2/3. MAIN shows high protein sequence similarity to MAIL1 and MAIL2, while MAIL3 encodes a protein with an additional putative serine/threonine-specific protein phosphatase domain, not included in this entry.
definition_source: "InterPro:IPR044824 abstract (PANTHER PTHR46033 is a member signature)"
