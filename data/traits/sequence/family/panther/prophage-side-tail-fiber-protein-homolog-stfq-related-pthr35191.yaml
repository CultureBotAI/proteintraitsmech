  - kind: GENERAL
    text: >-
      This family of proteins includes structural components of bacteriophage tail fibers, which are involved in the initial stages of bacterial infection. Members of this family are responsible for recognizing and binding to specific bacterial receptors, determining the host range of the phage. The tail fibers can be divided into proximal and distal halves, with the distal half containing a thin tip that interacts with bacterial lipopolysaccharide receptors. These interactions are crucial for the attachment of the virion to the host cell, facilitating the subsequent injection of viral DNA into the bacterial cell. Some family members are involved in the reversible attachment to host molecules, extending the host range of the virus.
    source: "InterPro:IPR051934 abstract (LLM-generated, not curator-reviewed)"
