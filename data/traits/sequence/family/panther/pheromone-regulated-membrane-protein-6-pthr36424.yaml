identifier: PANTHER:PTHR36424
label: "PHEROMONE-REGULATED MEMBRANE PROTEIN 6"
definition: >-
  Kch family members are potassium transporters that mediate K+ influx. Budding yeast Kch1 and its paralogue, Kch2, promote low-affinity K+ uptake and are essential for K+-dependent activation of HACS during mating pheromone response.
