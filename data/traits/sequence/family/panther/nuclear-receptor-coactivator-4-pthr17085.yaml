identifier: PANTHER:PTHR17085
label: "NUCLEAR RECEPTOR COACTIVATOR 4"
definition: >-
  Nuclear receptor coactivator 4, also known as ARA70, is a coactivator for the androgen receptor (AR) and can function as a ligand-enhanced coactivator of PPARgamma. AR can suppress PPARgamma-ARA70 transactivation, suggesting cross-talk between PPARgamma- and AR-mediated responses in adipocytes. NCOA4 has been identified as a selective cargo receptor for the autophagic turnover of ferritinin, a critical process for regulation of iron homeostasis. This entry also includes Nuclear receptor coactivator 4-B from Xenopus laevis which inhibits activation of DNA replication origins, possibly by obstructing DNA unwinding via interaction with the MCM2-7 complex. This protein binds chromatin before initiation of DNA replication and detaches during replication.
definition_source: "InterPro:IPR039947 abstract (PANTHER PTHR17085 is a member signature)"
