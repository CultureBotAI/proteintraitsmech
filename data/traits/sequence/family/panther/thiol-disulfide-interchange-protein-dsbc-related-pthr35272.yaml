identifier: PANTHER:PTHR35272
label: "THIOL:DISULFIDE INTERCHANGE PROTEIN DSBC-RELATED"
definition: >-
  This entry represents DsbC, a thiol:disulphide interchange protein that functions as a periplasmic disulphide isomerase and redox catalyst. DsbC corrects non-native disulphide bonds in misfolded proteins by transferring its own disulphide bond to substrate proteins, becoming reduced in the process. As part of a periplasmic reducing system with DsbG, DsbC controls cysteine sulfenylation levels and provides reducing equivalents to rescue oxidatively damaged secreted proteins. DsbC is subsequently reoxidised by DsbD. The protein exhibits dual functionality, combining disulphide bond rearrangement activity with chaperone-like assistance in protein folding. DsbC is essential for the formation, rearrangement, and proper maturation of disulphide bonds in periplasmic proteins, contributing to their stability and correct three-dimensional structure.
