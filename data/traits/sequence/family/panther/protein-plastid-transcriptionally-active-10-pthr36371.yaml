identifier: PANTHER:PTHR36371
label: "PROTEIN PLASTID TRANSCRIPTIONALLY ACTIVE 10"
definition: >-
  This entry represents a group of plant proteins, including PTAC10 from Arabidopsis. PTAC10 is a component of the PEP (plastid-encoded RNA polymerase) complex, which transcribes photosynthesis-related genes and plastid tRNAs during later developmental stages. PTAC10 contains a single S1 RNA-binding domain. PTAC10 knock-out lines have been shown to display an albino phenotype and impaired chloroplast development. PTAC10 is essential for plastid gene expression in Arabidopsis and can be phosphorylated by cpCK2. Phosphorylation of pTAC10 could enhance its RNA-binding activity.
definition_source: "InterPro:IPR044967 abstract (PANTHER PTHR36371 is a member signature)"
