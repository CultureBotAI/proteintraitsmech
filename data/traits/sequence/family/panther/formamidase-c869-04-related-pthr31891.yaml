identifier: PANTHER:PTHR31891
label: "FORMAMIDASE C869.04-RELATED"
definition: >-
  This family includes amidohydrolases of formamide and acetamide. The formamidase from Methylophilus methylotrophus (Bacterium W3A1) forms a homotrimer suggesting that this may be a common property of other members of this family.
