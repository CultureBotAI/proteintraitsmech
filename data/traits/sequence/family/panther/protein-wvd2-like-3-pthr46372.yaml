identifier: PANTHER:PTHR46372
label: "PROTEIN WVD2-LIKE 3"
definition: >-
  In animals, Targeting Protein for Xklp2 (TPX2) is critical for mitotic spindle assembly. It has a highly conserved TPX2 central domain, an Aurora-A binding domain and a TPX2_C domain that contains a conserved pentapeptide KLEEK motif. However, in plants besides the TPX2 homologue (with three domains), several proteins were found with only the TPX2_C domain. This group of TPX2_C domain only proteins in plants has been named as WDL (or WVD2-like) proteins, as the first identified member is known as WVD2. These WDL proteins bind to microtubules; however, they have lost the function of targeting Xklp2 and were found to play roles in plant development and responses to environment cues. This entry includes WAVE-DAMPENED2 (WVD2) and WDL1-4. WVD2, and its closest paralogue WDL1, modulate both rotational polarity and anisotropic cell expansion during organ growth and also promote clockwise root and etiolated hypocotyls coiling, clockwise leaf curling, but left-handed petiole twisting. WDL3 stabilises microtubules, playing an important role in the regulation of hypocotyl cell elongation. WDL3 levels are regulated by an ubiquitin-26S proteasome-dependent pathway in response to light and functions as a negative regulator of hypocotyl cell elongation in the light.
definition_source: "InterPro:IPR044806 abstract (PANTHER PTHR46372 is a member signature)"
