identifier: PANTHER:PTHR13886
label: "JNK/SAPK-ASSOCIATED PROTEIN"
definition: >-
  C-Jun-amino-terminal kinase (JNK)-interacting protein 3 (JIP3) and 4 (JIP4) are two highly related scaffolding proteins for MAP kinases. They are binding partners for molecular motors kinesin-1 and dynactin, as well as for the small G protein ARF6, which they bind through their leucine zipper II (LZII) region. ARF6, together with JIP3 and JIP4, regulates membrane-tethered membrane type 1-matrix metalloproteinase exocytosis in cancer invasion. The function of JIP4 has been shown to be different from that of other JIP proteins. Although JIP4 binds JNK, it does not activate JNK signaling.
definition_source: "InterPro:IPR039911 abstract (PANTHER PTHR13886 is a member signature)"
