identifier: PANTHER:PTHR47490
label: "PROTEIN BLISTER"
definition: >-
  This entry represents a group of plant proteins, including protein BLISTER (BLI) from Arabidopsis thaliana. BLI interacts with the Pc-G histone methyltransferase CURLY LEAF (CLF) and may also act independently in Arabidopsis development. It negatively controls the activity of IRE1A/IRE1B under normal growth condition.
