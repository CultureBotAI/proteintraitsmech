identifier: PANTHER:PTHR32258
label: "PROTEIN NETWORKED 4A"
definition: >-
  This family of proteins is characterized by a plant-specific role in actin binding and association with various cellular structures. Members of this family are involved in forming membrane-cytoskeletal adapter complexes that may bridge the endoplasmic reticulum and the plasma membrane or associate with F-actin at the tonoplast, plasma membrane, and plasmodesmata. The presence of a NAB (NET actin-binding) domain suggests a common mechanism for F-actin binding across the family, which is essential for their function in cellular architecture and signaling.
