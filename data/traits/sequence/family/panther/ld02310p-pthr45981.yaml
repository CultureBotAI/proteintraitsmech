identifier: PANTHER:PTHR45981
label: LD02310P
definition: >-
  LD02310P — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45981. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function ubiquitin protein ligase activity. Subfamilies participate in protein polyubiquitination, nitrogen compound metabolic process, organic substance metabolic process. Subfamilies localise to intracellular anatomical structure, cytoplasm.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
