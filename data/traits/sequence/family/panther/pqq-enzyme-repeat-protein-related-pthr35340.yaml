identifier: PANTHER:PTHR35340
label: "PQQ ENZYME REPEAT PROTEIN-RELATED"
definition: >-
  This family of proteins includes enzymes that are involved in the transfer of sulfuryl groups from donor molecules to acceptor phenolic compounds from bacteria, archaea and fungi. These enzymes play a crucial role in various biological processes, including the metabolism of hormones, neurotransmitters, and drugs, by modifying the chemical properties of these compounds through sulfation. Sulfation is a key step in the biotransformation and detoxification pathways, and it also affects the bioavailability and excretion of substances. Members of this family are characterised by their ability to catalyse the sulfuryl group transfer, which is an essential function in cellular homeostasis and signalling.
definition_source: "InterPro:IPR053143 abstract (PANTHER PTHR35340 is a member signature)"
