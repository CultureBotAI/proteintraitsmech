identifier: PANTHER:PTHR21680
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 124"
definition: >-
  This entry includes coiled-coil domain-containing protein 124 (Ccdc124) from animals and Oxs1 from fission yeasts. Ccdc124 is a centrosome and midbody protein involved in cytokinesis. Oxs1 (SPBC29A10.12) is part of the Pap1-Oxs1 complex that regulates transcription when cells are exposed to diamide or Cd that causes disulfide stress.
definition_source: "InterPro:IPR010422 abstract (PANTHER PTHR21680 is a member signature)"
