identifier: PANTHER:PTHR43101
label: BETA-FRUCTOSIDASE
definition: >-
  This family of proteins includes enzymes that are primarily involved in the hydrolysis of sucrose and related oligosaccharides. Members of this family are characterized by their ability to cleave the glycosidic bond in sucrose to release fructose and glucose. Some members are also capable of hydrolyzing sucrose-6-phosphate. The enzymatic activity of these proteins allows bacteria to utilize sucrose as a sole carbon source, which is crucial for their metabolism and survival in environments where sucrose is the predominant sugar. Additionally, certain members of this family have been shown to hydrolyze other fructosides such as raffinose, inulin, and levan in a specific manner, further underscoring the importance of these enzymes in carbohydrate metabolism.
