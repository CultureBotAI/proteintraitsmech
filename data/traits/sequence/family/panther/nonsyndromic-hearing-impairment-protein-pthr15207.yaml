identifier: PANTHER:PTHR15207
label: "NONSYNDROMIC HEARING IMPAIRMENT PROTEIN"
definition: >-
  Gasdermin-E, also known as DFNA5, is involved in the p53-regulated cellular response to response to DNA damage probably by cooperating with p53. It can be cleaved by CASP3 into two parts: GSDME-N and GSDME-C. The GSDME-N fragment can perforate membranes and thereby induce pyroptosis. Purified GSDME-N has been shown to efficiently lyse phosphoinositide/cardiolipin-containing liposomes and form pores on membranes made of artificial or natural phospholipid mixtures. This entry also includes Pejvakin, a gasdermin family member. It is a peroxisome-associated protein required to protect auditory hair cells against noise-induced damage.
