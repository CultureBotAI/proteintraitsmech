identifier: PANTHER:PTHR15728
label: "DEADENYLATION COMPLEX CATALYTIC SUBUNIT PAN2"
definition: >-
  This family of proteins functions as catalytic subunits in the PAN2-PAN3 deadenylation complex, which is involved in the cytoplasmic degradation of mRNA. These proteins shorten poly(A) tails of RNA, a process that is stimulated by poly(A)-binding proteins. Following deadenylation, the mRNA is rapidly degraded by the CCR4-NOT complex. The deadenylated mRNAs are further degraded by either exosome-mediated 3'-5' exonucleolytic degradation or deadenylation-dependent decapping and 5'-3' exonucleolytic degradation. Additionally, these proteins may play a role in the post-transcriptional maturation of mRNA poly(A) tails and can be involved in regulating the stability of specific mRNAs under certain conditions, such as the HIF1A-mediated hypoxic response.
