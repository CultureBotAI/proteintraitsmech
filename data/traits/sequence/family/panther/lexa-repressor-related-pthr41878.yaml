identifier: PANTHER:PTHR41878
label: "LEXA REPRESSOR-RELATED"
definition: >-
  Members of this entry are similar to the protein product of ORF-3 (UniProtKB:Q44206) found on plasmid pRiA4 in the bacterium Agrobacterium rhizogenes. This plasmid is responsible for tumorigenesis at wound sites of plants infected by this bacterium, but the ORF-3 product does not seem to be involved in the pathogenetic process. Other proteins found in this entry are annotated as being putative TnpR resolvases (UniProtKB:Q9LCU7, UniProtKB:Q50439), but no further evidence was found to back this. Moreover, another member of this entry is described as a probable lexA repressor (UniProtKB:Q7UEI4) and in fact carries a LexA DNA binding domain (InterPro:IPR006199), but no references were found to expand on this.
definition_source: "InterPro:IPR012912 abstract (PANTHER PTHR41878 is a member signature)"
