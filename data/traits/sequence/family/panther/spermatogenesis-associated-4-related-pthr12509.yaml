identifier: PANTHER:PTHR12509
label: "SPERMATOGENESIS-ASSOCIATED 4-RELATED"
definition: >-
  This family of proteins is associated with spermatogenesis and ciliary function. Members are involved in apoptosis regulation and microtubule dynamics. They play a role in microtubule stabilization, bundling, and protection against depolymerization, which is crucial for cell migration, ciliary structure integrity, and function. These proteins also interact with actin, contributing to cytoskeletal organization and cell motility. They are essential for the survival of certain cell types and are implicated in the planar cell polarity signaling pathway, which is important for the asymmetric distribution of microtubules in ciliated epithelia.
