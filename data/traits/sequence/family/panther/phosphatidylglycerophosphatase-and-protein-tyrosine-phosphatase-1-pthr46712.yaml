identifier: PANTHER:PTHR46712
label: "PHOSPHATIDYLGLYCEROPHOSPHATASE AND PROTEIN-TYROSINE PHOSPHATASE 1"
definition: >-
  Phosphatidylglycerophosphatase and protein-tyrosine phosphatase 1 (PTPMT1) regulates phospholipid biosynthesis. In mammals, it is a mitochondrial phosphatidylglycerophosphate (PGP) phosphatase that regulates cardiolipin biosynthesis.
