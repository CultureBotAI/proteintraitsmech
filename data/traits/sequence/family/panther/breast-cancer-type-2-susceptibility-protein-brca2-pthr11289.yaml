identifier: PANTHER:PTHR11289
label: "BREAST CANCER TYPE 2 SUSCEPTIBILITY PROTEIN BRCA2"
definition: >-
  The breast cancer type 2 susceptibility protein (BRCA2) is a breast tumour suppressor involved in double-strand break repair and/or homologous recombination. BRCA2 gene expression is regulated in a cell-cycle dependent manner and peak expression of BRCA2 mRNA occurring in S phase, suggesting BRCA2 may participate in regulating cell proliferation. BRCA2, and related protein BRCA1, have transcriptional activation potential and the two proteins are associated with the activation of double-strand break repair and/or homologous recombination. The two proteins have been shown to coexist and colocalize in a biochemical complex. BRCA2 has a number of 39 amino acid repeats that are critical for binding to RAD51 (a key protein in DNA recombinational repair) and resistance to methyl methanesulphonate treatment. There are eight repeats in BRCA2 designated as BRC1 to BRC8. BRC1, BRC2, BRC3, BRC4, BRC7, and BRC8 have high sequence identity and bind to Rad51, whereas BRC5 and BRC6 are less well conserved and are unable to bind Rad51. It has been suggested that BRCA2 plays a role in positioning Rad51 at the site of DNA repair or in removing Rad51 from DNA once repair has been completed. Mutations in BRCA1 and BRCA2 have been linked to an elevated risk of young onset breast cancer and confer a high risk of the disease through a dominantly inherited fashion. BRCA2 mutations are typically microdeletions. Homologues exist in plants: the BRCA2A and BRCA2B proteins from Arabidopsis thaliana are required for repair of breaks in double-stranded DNA and homologous recombination and in the prophase stage of meiosis are required for formation of RAD51 and DMC1 foci in males.
