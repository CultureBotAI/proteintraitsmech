identifier: PANTHER:PTHR16200
label: "RING ZINC FINGER"
definition: >-
  The ZNRF3/Arkadia protein family comprises E3 ubiquitin-protein ligases that play crucial roles in regulating the Wnt signaling pathway and the BMP-SMAD signaling axis. Members of the family mediate the ubiquitination and subsequent degradation of key components in these pathways, such as Wnt receptor complex components and SMAD inhibitors. This regulation is essential for processes like limb specification, mesoderm patterning during embryonic development, and maintaining the size of the intestinal stem cell zone. Some family members also bind polysumoylated substrates, enhancing transcriptional responses or promoting nucleotide excision repair. The activity of these ligases is modulated by their ability to bind ubiquitin non-covalently, which stabilizes the E2 enzyme in a closed conformation, facilitating ubiquitin transfer.
