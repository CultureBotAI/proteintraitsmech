identifier: PANTHER:PTHR45878
label: "ZINC FINGER PROTEIN WIP2"
definition: >-
  WIP proteins form a plant specific subfamily of C2H2 zinc finger (ZF) proteins. Arabidopsis TRANSPARENT TESTA 1 protein (At1g34790, also known as WIP1 or TT1) may act as a transcriptional regulator involved in the differentiation of young endothelium. WIP2, also known as NTT, is a transcription factor that promotes replum development in Arabidopsis fruits.
