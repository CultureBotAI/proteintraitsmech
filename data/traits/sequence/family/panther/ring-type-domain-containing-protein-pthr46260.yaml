  - kind: GENERAL
    text: >-
      This family of proteins is involved in the final stages of cell division, specifically cytokinesis. Members of this family play a crucial role in ensuring the proper separation and distribution of chromosomes into daughter cells. They are essential for maintaining mitotic integrity, chromosomal stability, and preventing aneuploidy by protecting cells from mitotic errors and centrosomal amplification. These proteins are also implicated in the formation of the midbody structure, which is critical for the abscission process that physically separates the daughter cells at the end of cytokinesis.
