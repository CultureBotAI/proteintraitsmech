  - kind: GENERAL
    text: >-
      The protein family is involved in transcriptional regulation and chromatin remodeling. Members of the family function as transcriptional activators, interacting with various transcriptional activators and cofactors to modulate gene expression. They play roles in the regulation of the circadian clock by controlling the transcriptional activity of core components such as CLOCK and BMAL1/2. They also influence the expression of genes like MMP3, impacting processes like stromelysin expression. The family includes proteins that may have significance in embryonic and postnatal development, as well as neuronal differentiation. Some members possess an atypical PHD domain that negatively modulates cofactor binding, suggesting a complex regulatory mechanism within chromatin structure and transcriptional machinery.
    source: "InterPro:IPR052440 abstract (LLM-generated, not curator-reviewed)"
