    text: >-
      RETINOIC ACID INDUCED 1/TRANSCRIPTION FACTOR 20 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14955. PANTHER protein class: zinc finger transcription factor. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
