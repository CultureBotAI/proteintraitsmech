    text: >-
      RETINOIC ACID INDUCED 1/TRANSCRIPTION FACTOR 20 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14955. PANTHER protein class: zinc finger transcription factor. and participate in regulation of gene expression, regulation of DNA-templated transcription, regulation of cellular process. and localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
