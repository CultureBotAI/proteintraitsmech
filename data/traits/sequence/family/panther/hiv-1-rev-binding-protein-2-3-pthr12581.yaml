identifier: PANTHER:PTHR12581
label: "HIV-1 REV BINDING PROTEIN 2, 3"
definition: >-
  This group represents ribosomal RNA assembly protein KRR1, required for 40S ribosome biogenesis. It is involved in nucleolar processing of pre-18S ribosomal RNA and ribosome assembly in Saccharomyces cerevisiae. In Schizosaccharomyces pombe it is known as Mis3.
