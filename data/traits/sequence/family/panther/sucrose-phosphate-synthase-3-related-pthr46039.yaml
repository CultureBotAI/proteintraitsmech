identifier: PANTHER:PTHR46039
label: "SUCROSE-PHOSPHATE SYNTHASE 3-RELATED"
definition: >-
  In plants, sucrose synthesis involves just two enzymes: sucrose-phosphate synthase (SPS) catalyses the synthesis of sucrose-6F-phosphate (Suc6P), which is then hydrolysed to sucrose by sucrose-phosphatase (SPP). This entry represents the sucrose-phosphate synthase (SPS) family. In Arabidopsis there are 4 SPS proteins, including AtSPSA1 (At5g20280), AtSPSA2 (At5g11110), AtSPSB (At1g04920) and AtSPSC (At4g10120). It has been shown that the four SPS proteins are functionally redundant in processes that are important for plant growth, vegetative and reproductive development, and nonstructural carbohydrate metabolism. This entry also includes bacterial sequences.
