identifier: PANTHER:PTHR21284
label: "EG:80H7.2 PROTEIN"
definition: >-
  EG:80H7.2 PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21284. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies participate in cell-cell junction assembly, multicellular organism development, cellular process. Subfamilies localise to cell-cell junction, cell junction, apical junction complex.
