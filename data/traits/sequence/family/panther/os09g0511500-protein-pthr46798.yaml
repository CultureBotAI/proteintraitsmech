identifier: PANTHER:PTHR46798
label: "OS09G0511500 PROTEIN"
definition: >-
  This entry includes RFI2, IPI1 and related proteins. In Arabidopsis RFI2 is an E3 ubiquitin-protein ligase that mediates phytochrome (phyA and phyB)-controlled seedling deetiolation responses such as hypocotyl elongation in response to red and far-red light. In rice IPI1 affects plant architecture through precisely tuning IPA1 protein levels in different tissues.
