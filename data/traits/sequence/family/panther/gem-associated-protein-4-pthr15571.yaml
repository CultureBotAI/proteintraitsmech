identifier: PANTHER:PTHR15571
label: "GEM-ASSOCIATED PROTEIN 4"
definition: >-
  Gemin4 is one of the core components of the SMN complex, which contains survival motor neuron (SMN), the seven Gemin proteins (Gemin2-8), and Unrip. The complex is closely associated with the splicing small nuclear ribonucleoproteins (U snRNPs), which are the subunits of the spliceosome and consist of a U snRNA, the Sm core proteins and several proteins unique to the various RNPs. SMN and Gemin4 both interact specifically with the U snRNA and the Sm core proteins, suggesting they facilitate the assembly by forming a bridge between the two components. The Gemin4 protein has also been referred to an important molecule in the RNA-induced silencing complex (RISC) that participates in the mature process of miRNAs.
definition_source: "InterPro:IPR033265 abstract (PANTHER PTHR15571 is a member signature)"
