identifier: PANTHER:PTHR38007
label: "CRISPR SYSTEM CMS PROTEIN CSM5"
definition: >-
  The CRISPR-Cas system is a prokaryotic defence mechanism against foreign genetic elements. The key elements of this defence system are the Cas proteins and the CRISPR RNA. Type III complexes share the Cas10 subunit but are subclassifed as type IIIA (CSM) and type IIIB (CMR), depending on their specificity for DNA or RNA targets, respectively. This family represents the CRISPR system CMS protein Csm5.
