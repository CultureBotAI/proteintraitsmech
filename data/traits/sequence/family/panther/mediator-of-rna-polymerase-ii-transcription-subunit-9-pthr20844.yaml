identifier: PANTHER:PTHR20844
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION, SUBUNIT 9"
definition: >-
  This entry represents subunit Med9 of the Mediator complex. Subunit Med9 is part of the middle module of the Mediator complex; this associates with the core polymerase subunits to form the RNA polymerase II holoenzyme. Med9 alternatively known as the chromosome segregation protein, CSE2 (UniProtKB:P33308) is required, along with CSE1 (UniProtKB:P33307) for accurate mitotic chromosome segregation in Saccharomyces cerevisiae (Baker's yeast). This entry includes Med9 from metazoa.
