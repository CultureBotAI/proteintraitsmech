  - kind: GENERAL
    text: >-
      The beta-defensin family comprises peptides with a primary role in host defense, exhibiting broad-spectrum antimicrobial activity against Gram-negative and Gram-positive bacteria. Members of this family are characterized by their ability to permeabilize bacterial membranes, leading to bacterial cell death. Some beta-defensins also bind to bacterial lipopolysaccharides, potentially neutralizing their effects and contributing to immunoregulation. Additionally, certain atypical beta-defensins are involved in reproductive processes, such as facilitating sperm transport within the female reproductive tract, forming a sperm reservoir, and aiding in sperm protection against immunodetection. These functions are attributed to their glycosylation patterns, which impart a negative surface charge to the sperm glycocalyx. The family's role extends to the inhibition of lipopolysaccharide-mediated inflammation, further underscoring their importance in innate immunity and host defense.
    source: "InterPro:IPR050544 abstract (LLM-generated, not curator-reviewed)"
