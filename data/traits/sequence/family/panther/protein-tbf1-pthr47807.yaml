identifier: PANTHER:PTHR47807
label: "PROTEIN TBF1"
definition: >-
  This family of proteins is involved in telomere maintenance and gene expression regulation. Members bind to specific telomeric DNA sequences and can act as transcriptional regulators. They play a role in regulating telomere length, either by promoting or inhibiting telomere elongation. Additionally, these proteins are capable of binding to promoter regions of genes, including ribosomal protein genes and rDNA loci, to activate transcription. Some family members also function as genome partitioners, contributing to chromatin organization and preventing the spread of transcriptional silencing or activation from affecting adjacent regions.
