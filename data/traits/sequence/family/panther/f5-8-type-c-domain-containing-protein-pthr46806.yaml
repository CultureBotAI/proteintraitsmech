    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes receptors involved in cardiovascular development, angiogenesis, neuronal circuit formation, and organogenesis. Members mediate chemorepulsant activity of semaphorins and bind to VEGF, initiating signaling pathways for motor neuron guidance and cell migration. Some family members are copper-binding glycoproteins with ferroxidase activity, playing roles in iron transport and antioxidant defense. Others are coagulation factors acting as critical cofactors in hemostasis. Additionally, the family includes proteins that contribute to phagocytic removal of apoptotic cells, mucosal healing, and VEGF-dependent neovascularization. They bind to phosphatidylserine-containing membranes and integrin receptors, influencing vascular morphogenesis and remodeling.
