identifier: PANTHER:PTHR13112
label: "UPF3 REGULATOR OF NONSENSE TRANSCRIPTS-LIKE PROTEIN"
definition: >-
  This entry includes nonsense-mediated mRNA decay protein 3 (Upf3) and its homologues. In budding yeasts, Upf3 is involved in the nonsense-mediated mRNA decay (NMD) pathway. Human Upf3a and Upf3b are components of the exon-junction complex (EJC), which promotes nonsense-mediated mRNA decay (NMD) and regulate translation efficiency.
