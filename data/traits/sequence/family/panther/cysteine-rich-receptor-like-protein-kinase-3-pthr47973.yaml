  - kind: GENERAL
    text: >-
      This family of proteins includes serine/threonine kinases that are characterized by cysteine-rich sequences. Members are involved in various signaling pathways and cellular processes. One member is known to be activated by cold and acts as a negative regulator of freezing tolerance by phosphorylating specific target proteins, which leads to their translocation into the nucleus in response to cold stress. The family is part of the larger protein kinase superfamily and shares common structural features that are typical of serine/threonine kinases.
