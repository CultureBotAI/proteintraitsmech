      CYSTEINE-RICH RECEPTOR-LIKE PROTEIN KINASE 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47973. PANTHER protein class: transmembrane signal receptor. Members are annotated with the molecular function protein serine/threonine kinase activity. Members participate in protein phosphorylation.
