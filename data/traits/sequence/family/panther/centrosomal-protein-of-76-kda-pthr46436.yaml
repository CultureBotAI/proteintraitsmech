identifier: PANTHER:PTHR46436
label: "CENTROSOMAL PROTEIN OF 76 KDA"
definition: >-
  The CEP76 family comprises centrosomal proteins that play a crucial role in ensuring proper centriole duplication. Members of the CEP76 family are essential for maintaining the fidelity of cell division by restricting centriole duplication to a single event per cell cycle, thereby preventing centriole reduplication. This regulatory function is vital for cell cycle progression and genomic stability.
