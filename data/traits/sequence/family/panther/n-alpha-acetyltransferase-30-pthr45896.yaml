identifier: PANTHER:PTHR45896
label: "N-ALPHA-ACETYLTRANSFERASE 30"
definition: >-
  Protein N(alpha)-terminal acetylation is one of the most common protein modifications in eukaryotic cells. This entry includes N-alpha-acetyltransferase 30 (NAA30), also known as Mak3, and related proteins. In budding yeast it's the catalytic subunit of the NatC Nalpha-terminal acetyltransferase. Human NatC (hNatC) complex also contains the catalytic subunit hMak3 and the auxiliary subunits hMak10 and hMak31. However, Arabidopsis AtMAK3 function does not require NatC complex formation as in yeast.
