identifier: PANTHER:PTHR28196
label: "NUCLEOLAR PROTEIN NET1-RELATED"
definition: >-
  This entry represents a group of fungal nucleolar proteins, including Dnt1 from fission yeasts and Tof2/Net1 from budding yeasts. Net1 regulates the homologous MEN (mitotic exit network) pathway by sequestering Cdc14 phosphatase in the nucleolus before mitotic exit. Net1 negatively regulates the homologous SIN (septation initiation network) and MEN pathways. Net1 is required for rDNA silencing and minichromosome maintenance. Net1 regulates the MEN through the Cdc14 phosphatase. Tof2 is a paralogue of Net1. It is required for rDNA silencing and mitotic rDNA condensation. It coordinates the biphasic release of Cdc14 during anaphase by restraining a population of Cdc14 in the nucleolus.
definition_source: "InterPro:IPR043185 abstract (PANTHER PTHR28196 is a member signature)"
