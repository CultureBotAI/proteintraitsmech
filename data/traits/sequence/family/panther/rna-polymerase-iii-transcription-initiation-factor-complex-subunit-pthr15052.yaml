identifier: PANTHER:PTHR15052
label: "RNA POLYMERASE III TRANSCRIPTION INITIATION FACTOR COMPLEX SUBUNIT"
definition: >-
  This family of proteins is involved in the transcription process mediated by RNA polymerase III. Members of this family are components of the transcription factor complex TFIIIC, which is essential for the assembly of the transcription initiation complex on tRNA genes and the transcription of 5S rRNA and other stable RNAs. These proteins bind to specific promoter elements within the DNA, facilitating the recruitment and function of RNA polymerase III. Some family members also play a role in stabilizing interactions within the TFIIIC complex and may be involved in nuclear organization by localizing to chromatin insulator sequences.
