identifier: PANTHER:PTHR31800
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 32"
definition: >-
  This family of proteins is found in eukaryotes. Proteins in this family are typically between 160 and 188 amino acids in length. The gene that encodes this protein is C15orf57, but its protein product is called CCDC32 (Coiled-coil domain containing protein 32). The exact function of this protein is unknown.
