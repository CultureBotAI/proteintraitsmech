identifier: PANTHER:PTHR15316
label: "SPLICEOSOME ASSOCIATED PROTEIN 114/SWAP SPLICING FACTOR-RELATED"
definition: >-
  Mammalian splicing factor SF3a consists of three subunits of 60, 66, and 120kDa and functions early during pre-mRNA splicing by converting the U2 snRNP to its active form. The 120kDa subunit (SF3a120) has a carboxy-terminal ubiquitin-like domain and two SWAP (suppressor-of-white-apricot) domains, referred to collectively as the SURP module, at its amino-terminus. This entry represents SF3a120 (also known as SF3A1) and its homologues such as Prp21 from budding yeasts and Sap114 from fission yeasts.
definition_source: "InterPro:IPR045146 abstract (PANTHER PTHR15316 is a member signature)"
