identifier: PANTHER:PTHR34002
label: "BLR1656 PROTEIN"
definition: >-
  Glycoside hydrolase family 12 CAZy:GH12 comprises enzymes with two known activities: Endo-β-1,4-glucanase (EC:3.2.1.4) and Xyloglucan-specific endo-β-1,4-glucanase / endo-xyloglucanase (EC:3.2.1.151). These enzymes were formerly known as cellulase family H. O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
