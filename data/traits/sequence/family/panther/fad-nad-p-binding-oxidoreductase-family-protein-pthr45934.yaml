identifier: PANTHER:PTHR45934
label: "FAD/NAD(P)-BINDING OXIDOREDUCTASE FAMILY PROTEIN"
definition: >-
  This entry includes monooxygenase (MO) 1, 2 and 3 from plants. MO1 shares homology with monooxygenases that degrade salicylic acid. It is up-regulated in the compatible interaction of Alternaria brassicicola with Arabidopsis thaliana ecotype DiG. This entry also includes pqsH 2-heptyl-3,4-dihydroxyquinoline synthase involved in the terminal step of the biosynthesis of quinolone.
