  - kind: GENERAL
    text: >-
      The myosin family encompasses a group of actin-based motor molecules with ATPase activity, involved in various intracellular movements. Members of this family bind to actin filaments or bundles and function as plus end-directed motors, facilitating cargo transport along actin filaments. They play critical roles in cell shape regulation, cell spreading, adhesion, and the formation and elongation of filopodia. In specialized cells, they contribute to processes such as photoreceptor disk renewal, vesicle trafficking, and mechanotransduction in cochlear hair cells. Some family members also participate in the formation of dendritic filopodia in neurons, spine formation, and the organization of osteoclast podosome belts. The family's unconventional myosins, characterized by their divergent tail domains, interact with specific membranous compartments and are essential for the dynamic rearrangement of the cytoskeleton and the transport of cellular components.
    source: "InterPro:IPR051724 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
