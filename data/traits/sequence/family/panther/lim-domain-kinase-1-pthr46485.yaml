identifier: PANTHER:PTHR46485
label: "LIM DOMAIN KINASE 1"
definition: >-
  This family of proteins includes serine/threonine kinases that play a crucial role in regulating actin filament dynamics and cytoskeletal organization. They act downstream of Rho family GTPase pathways and are involved in processes such as cell motility, cell cycle progression, and differentiation. Members of this family phosphorylate and inactivate actin-depolymerizing factors, leading to stabilization of the actin cytoskeleton. Some also participate in microtubule organization during mitosis and have roles in suppressing ciliogenesis. Additionally, certain members have dual specificity kinase activity, phosphorylating substrates on serine/threonine and tyrosine residues, and are implicated in spermatogenesis.
