identifier: PANTHER:PTHR46617
label: "FORKHEAD BOX PROTEIN G1"
definition: >-
  This entry includes the transforming protein Qin from Avian sarcoma virus, which is homologue of the chicken orthologue of FOXG1, c-qin. It carries transforming activity of the virus. The FOXG subfamily includes a winged helix transcription factor FOXG1, which is also called brain factor 1 (BF-1), brain factor 2 (BF-2), Forkhead box protein G1A, Forkhead box protein G1B, Forkhead box protein G1C, Forkhead-related protein FKHL1, Forkhead-related protein FKHL2, or Forkhead-related protein FKHL3. FOXG1 acts as a transcription repression factor which plays an important role in the establishment of the regional subdivision of the developing brain and in the development of the telencephalon. It is repetitively used in the sequential events of telencephalic development to control multi-steps of brain circuit formation ranging from cell cycle control to neuronal differentiation in a clade- and species-specific manner. Individuals with mutations in FOXG1 harbour "FOXG1-related encephalopathy", characterised by two clinical phenotypes/syndromes including microcephaly, developmental delay, severe cognitive disabilities, early-onset dyskinesia and hyperkinetic movements, stereotypies, epilepsy, and cerebral malformation for those with deletions or intragenic mutations of FOXG1. FOX transcription factors recognize the core sequence 5'-(A/C)AA(C/T)A-3'.
definition_source: "InterPro:IPR047208 abstract (PANTHER PTHR46617 is a member signature)"
