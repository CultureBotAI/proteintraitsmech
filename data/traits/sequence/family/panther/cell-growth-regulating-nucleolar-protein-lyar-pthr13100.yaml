identifier: PANTHER:PTHR13100
label: "CELL GROWTH-REGULATING NUCLEOLAR PROTEIN LYAR"
definition: >-
  Proteins in this family contain a C2H2, LYAR-type zinc finger. Included in this family is cell growth-regulating nucleolar protein (LYAR), which maintains the appropriate processing of 47S/45S pre-rRNA to 32S/30S pre-rRNAs and their subsequent processing to produce 18S and 28S rRNAs. It is also a repressor of the gamma-globin promoter and oxidative stress genes.
