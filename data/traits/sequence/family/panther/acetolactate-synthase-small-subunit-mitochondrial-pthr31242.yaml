  - kind: GENERAL
    text: >-
      This family of proteins includes regulatory subunits of acetolactate synthase, an enzyme that catalyzes the first step in the biosynthesis of branched-chain amino acids. Members of this family stimulate the activity of the catalytic subunit of acetolactate synthase, significantly enhancing its function. They also play a role in the enzyme's sensitivity to feedback inhibition by valine and are involved in the regulation by ATP. These proteins are found in the mitochondria and are essential for the production of the amino acids leucine, isoleucine, and valine, which are vital for various cellular functions.
    source: "InterPro:IPR053050 abstract (LLM-generated, not curator-reviewed)"
