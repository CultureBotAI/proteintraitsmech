identifier: PANTHER:PTHR47707
label: "8-OXO-DGTP DIPHOSPHATASE"
definition: >-
  This family includes mutator MuT (also known as 8-oxo-dGTP diphosphatase) and similar proteins such as CTP pyrophosphohydrolase NudG from E.coli. MutT is a 7,8-dihydro-8-oxoguanine triphosphatase converting 8-oxoguanine triphosphatase to the monophosphate with high efficiency. It acts both on 8-oxoGTP as well as 8-oxodGTP. It also can convert, less efficiently, the GDP and dGDP forms to the monophosphates. Consequently it reduces the availability of 8-oxoGTP and the rate of mutation. NudG (also referred to as Orf135 protein), is a MutT-type enzyme that hydrolyzes 5-Me-dCTP with high activity, but also dCTP, 2-OH-dATP and 8-OH-dGTP with lower activity.
definition_source: "InterPro:IPR047127 abstract (PANTHER PTHR47707 is a member signature)"
