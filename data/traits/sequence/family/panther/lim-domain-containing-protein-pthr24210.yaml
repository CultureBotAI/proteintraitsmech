identifier: PANTHER:PTHR24210
label: "LIM DOMAIN-CONTAINING PROTEIN"
definition: >-
  This group represents LIM and senescent cell antigen-like-containing domain protein 1 (LIMS1, also known as PINCH-1), and its homologues LIMS2-4, LIM domain-containing protein unc-97 and LIM domain-containing protein pin-2. LIMS1 is LIM domain adapter protein that functions in the integrin and growth factor signal transduction pathway. Unc-97 is part of the integrin containing attachment complex, which is required for muscle development and maintenance; it may also function in adherens junction.
