identifier: PANTHER:PTHR22611
label: "PROTEIN NAKED CUTICLE"
definition: >-
  This entry includes protein naked cuticle (Nkd) and its homologues from animals. Nkd is an evolutionarily conserved inducible antagonist of Wnt/beta-catenin signaling. Nkd is essential for segmentation in Drosophila melanogaster. It contains an unconventional nuclear localization motif essential for its function and nuclear localization.
