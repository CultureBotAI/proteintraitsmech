  - kind: GENERAL
    text: >-
      This family of proteins is involved in the modification of Nod factors, which are signaling molecules central to the establishment of symbiotic relationships between certain plants and nitrogen-fixing bacteria. Specifically, these proteins carry out the 2-O-methylation of the fucosyl group on Nod factors, a modification that is crucial for the proper function of these signaling molecules. Members of this family share structural similarities that define their role in the methylation process.
