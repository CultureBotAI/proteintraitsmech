identifier: PANTHER:PTHR13225
label: "MISEXPRESSION SUPPRESSOR OF RAS 6"
definition: >-
  This entry describes a family of uncharacterised proteins found in animals and bacteria, including FlmR from Flagellimonas meridianipacifica (WP_106143370, UniProtKB:A0A2T0MFS9) and OhkR from Ohtaekwangia koreensis (WP_159453773, UniProtKB:A0A1T5M544), which have been reported to be peptide arginases that modify Arg residues to ornithine in bioactive RiPP peptides.
