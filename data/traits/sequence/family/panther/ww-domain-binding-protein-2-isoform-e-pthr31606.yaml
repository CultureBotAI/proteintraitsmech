identifier: PANTHER:PTHR31606
label: "WW DOMAIN BINDING PROTEIN 2, ISOFORM E"
definition: >-
  This entry represents WBP2 and related proteins from animals, fungi and plants. WBP2 encodes the WW domain-binding protein 2 that acts as a transcriptional coactivator for the estrogen and progesterone receptors. WBP2 binds to the target gene promoter and is required for the binding of the phosphorylated form of RNA polymerase II to the same promoter. Furthermore, it is also essential for histone acetylation at the same target region. WWP2 N-terminal-like (WBP2NL), also known as post-acrosomal sheath WW domain-binding protein (PAWP), is a testis-specific protein localized in the post-acrosomal sheath of spermatozoa. The WBP2NL protein enters the oocyte during fertilization, and induces meiotic resumption and oocyte activation events. It may be associated with cellular proliferation and tumourigenic processes.
definition_source: "InterPro:IPR044852 abstract (PANTHER PTHR31606 is a member signature)"
