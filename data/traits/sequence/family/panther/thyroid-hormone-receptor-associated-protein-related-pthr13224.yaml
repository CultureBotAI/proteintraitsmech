identifier: PANTHER:PTHR13224
label: "THYROID HORMONE RECEPTOR-ASSOCIATED PROTEIN-RELATED"
definition: >-
  This entry represents a group of proteins from animal and fungi, including human Mediator of RNA polymerase II transcription subunit 16 (MED16). Mediator is a large complex of up to 33 proteins that is conserved from plants through fungi to humans - the number and representation of individual subunits varying with species. It is arranged into four different sections, a core, a head, a tail and a kinase-activity part, and the number of subunits within each of these is what varies with species. Overall, Mediator regulates the transcriptional activity of RNA polymerase II but it would appear that each of the four different sections has a slightly different function. Med16 is one of the subunits of the Tail portion of the Mediator complex and is required for lipopolysaccharide gene-expression. Several members including the human protein, UniProtKB:Q9Y2X0, have one or more WD40 domains on them.
definition_source: "InterPro:IPR048338 abstract (PANTHER PTHR13224 is a member signature)"
