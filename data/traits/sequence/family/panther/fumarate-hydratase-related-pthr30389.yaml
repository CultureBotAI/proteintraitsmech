  - kind: GENERAL
    text: >-
      The Class-I Fumarase Family comprises enzymes that catalyze the reversible hydration of fumarate to (S)-malate, a key step in the tricarboxylic acid (TCA) cycle for energy production in the form of NADH. Members function predominantly as aerobic enzymes, with some displaying D-tartrate dehydratase activity, although they are generally unable to convert (R)-malate, L-tartrate, or meso-tartrate. The family also includes L(+)-tartrate dehydratases, which are involved in tartrate metabolism. Activity of these enzymes can be regulated by various inhibitors, such as 2-thiomalate and 3-hydroxy-2-nitropropionate, and some are sensitive to inactivation by oxygen. The family is characterized by the presence of a catalytic [4Fe-4S] cluster, essential for their enzymatic function.
    source: "InterPro:IPR051208 abstract (LLM-generated, not curator-reviewed)"
