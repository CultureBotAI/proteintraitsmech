identifier: PANTHER:PTHR14068
label: "EUKARYOTIC TRANSLATION INITIATION FACTOR 3  EIF3 -RELATED"
definition: >-
  Eukaryotic translation initiation factor 3 subunit B (EIF3B) is a component of the eukaryotic translation initiation factor 3 (eIF-3) complex, which is required for several steps in the initiation of protein synthesis. EIF3B is considered to be the major scaffolding subunit and interacts with subunits A, G, I, and J. It contains an RNA recognition motif (RRM) in its N-terminal region.
