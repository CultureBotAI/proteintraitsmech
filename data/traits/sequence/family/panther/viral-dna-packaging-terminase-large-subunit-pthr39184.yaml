identifier: PANTHER:PTHR39184
label: "Viral DNA packaging terminase large subunit"
definition: >-
  This family of proteins includes large terminase subunits that play a crucial role in the life cycle of certain viruses. These proteins function as ATP-driven molecular motors that facilitate the translocation of viral DNA into empty capsids. They also possess endonucleolytic activity, which is essential for initiating and terminating the packaging of viral DNA. The large terminase subunit works in conjunction with a smaller subunit that recognizes specific viral DNA sequences. Together, they form a complex with the portal protein, creating a packaging machine that cleaves the viral genome concatemer during the packaging process. After the DNA is encapsulated, the terminase complex is replaced by other proteins to complete the assembly of the viral particle.
