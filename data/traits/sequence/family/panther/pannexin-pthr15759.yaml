identifier: PANTHER:PTHR15759
label: PANNEXIN
definition: >-
  Pannexins, including pannexins 1, 2 and 3, are a family of proteins exhibiting channel activity. Pannexin channels have many biological functions such as propagation of calcium waves, release of IL-1beta, and responses to ischemic conditions. Pannexin shares sequence homology with the invertebrate gap junction proteins, innexins. However, pannexins are functional in single membranes, but not as intercellular channels in appositional membranes seen in the gap junction hemichannels.
