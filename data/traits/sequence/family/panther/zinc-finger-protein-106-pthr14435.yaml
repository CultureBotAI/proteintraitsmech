identifier: PANTHER:PTHR14435
label: "ZINC FINGER PROTEIN 106"
definition: >-
  Zinc finger protein 106 (Znf106) is an RNA-binding protein that associates with the core splicing factor RNA binding motif protein 39 (RBM39) and localizes to nuclear speckles adjacent to spliceosomes. It is essential for maintenance of peripheral motor neuron and skeletal muscle function.
