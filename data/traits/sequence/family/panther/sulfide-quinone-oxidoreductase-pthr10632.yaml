identifier: PANTHER:PTHR10632
label: "SULFIDE:QUINONE OXIDOREDUCTASE"
definition: >-
  In photolithouautotrophic and chemolithouautotrophic bacteria that utilise sulphide as a hydrogen source, Sulphide Quinone Reductase (SQR) is critical in the initial oxidation step of sulphide. The electrons generated from the oxidation of sulphide are used to generate NADH. SQR is a member of the disulphide containing pyridine dinucleotide oxidoreductase family. The members of this protein include glutathione reductase, thioredoxin reductase, mercuric ion reductase and lipoamide dehydrogenase and they all shuttle electrons from NADPH through FAD to a disulphide/dithiol active site.
