  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural modification of the erythrocyte membrane. Members of this family are implicated in the alteration of intermolecular interactions within the cytoplasmic domain of band 3, a process that is critical for the formation of the parasitophorous vacuole. This vacuole is essential for the survival and replication of certain parasites within red blood cells. The family includes proteins that may play a role in the invagination of the red cell membrane, which is a prerequisite for vacuole formation. Additionally, some members are suggested to have a continuous role in the structural organization of cellular compartments in plants, indicating a broader functional spectrum.
    source: "InterPro:IPR052423 abstract (LLM-generated, not curator-reviewed)"
