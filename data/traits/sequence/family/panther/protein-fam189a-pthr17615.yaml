identifier: PANTHER:PTHR17615
label: "PROTEIN FAM189A"
definition: >-
  This family includes Endosomal transmembrane epsin interactor 1/2/3, also known as FAM189 (family with sequence similarity 189). ENTREP1 functions as an activator of the E3 ubiquitin protein ligase ITCH in the ubiquitination of the CXCL12-activated CXCR4 receptor which triggers CXCR4 endocytosis and desensitization, negatively regulating the CXCL12/CXCR4 signaling pathway. COTE1 (FAM189B/ENTREP3) contributes to hepatocellular carcinoma tumourigenesis by regulating cell proliferation through modulating WWOX signalling.
definition_source: "InterPro:IPR030431 abstract (PANTHER PTHR17615 is a member signature)"
