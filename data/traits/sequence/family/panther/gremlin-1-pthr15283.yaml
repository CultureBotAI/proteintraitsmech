identifier: PANTHER:PTHR15283
label: "GREMLIN 1"
definition: >-
  GREMLIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15283. Members are annotated with the molecular function receptor ligand activity, cytokine binding. Members participate in negative regulation of BMP signaling pathway, animal organ development, animal organ morphogenesis. Members localise to extracellular region.
