identifier: PANTHER:PTHR15283
label: "GREMLIN 1"
definition: >-
  GREMLIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15283. Members are annotated with the molecular function receptor ligand activity, signaling receptor activator activity, cytokine binding. and participate in animal organ morphogenesis, negative regulation of signal transduction, regulation of transmembrane receptor protein serine/threonine kinase signaling pathway. and localise to extracellular space.
