  - kind: GENERAL
    text: >-
      The CbbQ/NirQ/NorQ/GpvN family includes proteins involved in various cellular processes. Some members function as ATPases that enhance gas vesicle formation, which are proteinaceous nanostructures that regulate buoyancy in microbial planktonic organisms. Other members are involved in the post-translational activation and assembly of RuBisCO, an enzyme critical for carbon fixation in photosynthetic organisms. Additionally, certain proteins in the family act as activators of nitrite and nitric oxide reductases, playing a role in the denitrification process. The family also includes proteins that may regulate the formation of active methanol dehydrogenase, which is involved in methanol metabolism. Overall, the CbbQ/NirQ/NorQ/GpvN family encompasses a diverse group of proteins with functions related to gas vesicle formation, enzyme activation and assembly, and metabolic regulation.
