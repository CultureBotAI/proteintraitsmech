    text: >-
      TRANSMEMBRANE PROTEIN 64 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46593. Members participate in regulation of cytosolic calcium ion concentration. Members localise to endoplasmic reticulum.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
