  - kind: GENERAL
    text: >-
      The TVP38/TMEM64 family is involved in the regulation of cell differentiation processes, particularly affecting osteoclast and adipocyte lineage commitment. Family members positively regulate osteoclast differentiation by enhancing TNFSF11-induced calcium signaling pathways, which involve interaction with SERCA2. This interaction is crucial for CREB1 activation and mitochondrial ROS production, essential for osteoclast generation. The calcium spikes in the cytosol and subsequent activation of NFATC1 lead to osteoclast differentiation and activation. Conversely, the TVP38/TMEM64 family negatively regulates osteoblast differentiation and promotes adipocyte differentiation by modulating the canonical Wnt signaling pathway. It influences mesenchymal stem cell fate by downregulating CTNNB1 expression, activity, and nuclear localization, favoring osteogenesis over adipogenesis.
    source: "InterPro:IPR053069 abstract (LLM-generated, not curator-reviewed)"
