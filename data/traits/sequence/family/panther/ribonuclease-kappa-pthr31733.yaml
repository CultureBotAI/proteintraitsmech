identifier: PANTHER:PTHR31733
label: "RIBONUCLEASE KAPPA"
definition: >-
  Ribonuclease kappa is an endoribonuclease which preferentially cleaves ApU and ApG phosphodiester bonds. It hydrolyses UpU bonds at a lower rate. Its Ceratitis capitata homologue, also known as Cc RNase, exhibits ribonucleolytic activity against poly(C) and poly(U) synthetic substrates, as well as rRNA. RNase K (also known as V-type proton ATPase subunit f) regulates the activity of vacuolar (H+)-ATPase (V-ATPase) which is responsible for acidifying and maintaining the pH of intracellular compartments and required at an early stage of receptor-mediated endocytosis.
