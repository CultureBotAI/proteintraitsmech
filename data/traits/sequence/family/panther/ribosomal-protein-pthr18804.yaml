  - kind: GENERAL
    text: >-
      This family of proteins includes components of the large ribosomal subunit, specifically identified as bL36. Members of this family are involved in the assembly and function of ribosomes, which are essential for protein synthesis. In bacteria, these proteins are part of the 50S ribosomal subunit and play a role in the translation of mRNA into polypeptides. One member of this family is also noted to be a component of the mitochondrial ribosome in eukaryotes, indicating a conserved function in the translation machinery within mitochondria, which is responsible for synthesizing proteins encoded by the mitochondrial genome. These proteins are typically small and basic, and they contribute to the structure and stability of the ribosome.
    source: "InterPro:IPR052010 abstract (LLM-generated, not curator-reviewed)"
