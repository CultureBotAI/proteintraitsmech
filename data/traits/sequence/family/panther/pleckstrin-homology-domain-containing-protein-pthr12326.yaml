identifier: PANTHER:PTHR12326
label: "PLECKSTRIN HOMOLOGY DOMAIN CONTAINING PROTEIN"
definition: >-
  The DEF8 family is involved in various cellular processes related to the endolysosomal system, autophagy, and bone resorption. Members of the family act as multivalent adapter proteins that regulate fusion events between late endosomes and lysosomes, which are essential for the maturation of endolysosomal compartments. They play a role in the degradation of growth factor receptors and clearance of autophagosomes, often through interactions with small GTPases like RAB7A and ARL8B. In osteoclasts, DEF8 family proteins are crucial for the peripheral distribution of lysosomes and the formation of ruffled borders, which are key for bone resorption. Some members also participate in muscle differentiation and may act as scaffold proteins for AKT1 signaling. Additionally, they can be involved in the transduction of apoptotic signals and contribute to the pathogenesis of infections by maintaining the integrity of pathogen-containing vacuoles.
