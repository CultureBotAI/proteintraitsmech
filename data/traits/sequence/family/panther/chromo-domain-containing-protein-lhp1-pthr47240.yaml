identifier: PANTHER:PTHR47240
label: "CHROMO DOMAIN-CONTAINING PROTEIN LHP1"
definition: >-
  LIKE HETEROCHROMATIN PROTEIN1 (LHP1) is a polycomb repressive complex1 subunit required for epigenetic silencing of FLOWERING LOCUS C (FLC), which encodes a repressor of flowering. It also interacts with LIF2, which is a heterogeneous nuclear ribonucleoprotein involved in Arabidopsis thaliana cell fate and stress responses.
