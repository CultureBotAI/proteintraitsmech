    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in natural product biosynthesis, functioning similarly to non-ribosomal peptide synthetases. They are characterized by their ability to modify a single substrate rather than condensing multiple building blocks. Members of this family contain three distinct domains: an adenylation domain that activates substrate amino acids, a peptidyl carrier protein domain that carries the activated amino acid, and a reductase domain of the ferredoxin-NADP reductase type. The adenylation domain specifically recognizes and activates amino acids like L-serine, L-alanine, and L-valine, forming a thioester bond with the peptidyl carrier protein domain. The exact natural products synthesized by these enzymes are not yet known.
    source: "InterPro:IPR052979 abstract (LLM-generated, not curator-reviewed)"
