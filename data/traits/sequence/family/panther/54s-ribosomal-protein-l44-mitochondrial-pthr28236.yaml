identifier: PANTHER:PTHR28236
label: "54S RIBOSOMAL PROTEIN L44, MITOCHONDRIAL"
definition: >-
  This entry represents the large ribosomal subunit protein mL53 (also known as MRPL44) from fungi. It is a component of the mitochondrial ribosome (mitoribosome), a dedicated translation machinery responsible for the synthesis of mitochondrial genome-encoded proteins, including at least some of the essential transmembrane subunits of the mitochondrial respiratory chain.
