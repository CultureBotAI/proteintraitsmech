identifier: PANTHER:PTHR18806
label: "RBM25 PROTEIN"
definition: >-
  This family of proteins is involved in the regulation of alternative pre-mRNA splicing and plays a role in apoptotic cell death. Members of this family includes RNA-binding protein 25 (RBM25) from human and its orthologue from S.pombe U1 snRNP-associated protein usp107. RBM25 modulates the expression of the apoptotic factor BCL2L1 by influencing the ratio of its isoforms. They are capable of binding to specific RNA sequences, which promotes the selection of certain splice sites, affecting the generation of different mRNA isoforms. It is also involved in the generation of an abnormal and truncated splice form of SCN5A in heart failure. S. pombe usp107 is a component of the U1 snRNP particle and may contribute to the recognition and binding of pre-mRNA 5'-splice sites.
