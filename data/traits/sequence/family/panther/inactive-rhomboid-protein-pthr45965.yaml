  - kind: GENERAL
    text: >-
      INACTIVE RHOMBOID PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45965. PANTHER protein class: serine protease, protein modifying enzyme. and participate in regulation of cell communication, regulation of protein secretion, regulation of secretion. and localise to nuclear outer membrane-endoplasmic reticulum membrane network, organelle membrane, endoplasmic reticulum subcompartment.
