identifier: PANTHER:PTHR31770
label: "CHEMOKINE-LIKE PROTEIN TAFA FAMILY MEMBER"
definition: >-
  This family of proteins includes chemokine-like factors that are involved in various biological processes related to the immune system and neuronal functions. Members of this family have been shown to play roles in modulating pain hypersensitivity, chemoattracting macrophages, promoting phagocytosis, and increasing reactive oxygen species release. They are also implicated in the regulation of microglia polarization and act as neurotrophic factors contributing to neuronal survival and neurobiological functions. Additionally, some proteins in this family serve as ligands for specific receptors, influencing neural stem-cell proliferation and differentiation.
