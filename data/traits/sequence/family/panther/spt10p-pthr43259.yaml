identifier: PANTHER:PTHR43259
label: SPT10P
definition: >-
  This family of proteins includes enzymes that are involved in the transfer of acetyl groups from acetyl-CoA to various substrates. Members of this family are typically referred to as N-acetyltransferases and are known to play a role in the modification of small molecules, proteins, and other macromolecules. This modification can alter the function, localization, or stability of the target molecules and is important in a wide range of biological processes including metabolism, signal transduction, and gene expression. The specific substrates and biological functions of the uncharacterized N-acetyltransferases in this family remain to be elucidated through experimental studies.
