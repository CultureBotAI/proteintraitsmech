identifier: PANTHER:PTHR47777
label: "HOMEOBOX PROTEIN SEBOX"
definition: >-
  SEBOX is a probable transcription factor involved in preparing oocytes for embryonic development in mice. It is required for early embryonic development in pigs and appears to regulate the degradation of maternal transcripts and the expression of pluripotency genes.
