  - kind: GENERAL
    text: >-
      This family of proteins includes oxidoreductases that participate in various metabolic pathways. Members are involved in the biosynthesis of deoxy sugars, which are components of antibiotics and other bioactive natural products. They catalyze the reduction of keto moieties in sugar nucleotides to produce different deoxy sugar derivatives. Some family members function in the degradation of D-xylose, a component of hemicelluloses, by oxidizing it into D-xylonolactone. They exhibit a preference for NADP(H) as a cofactor, although some can also use NAD(H). Activity regulation by various compounds and salts is noted in certain members, indicating a complex regulation of their enzymatic activities. The family is characterized by a conserved domain structure that aligns them with the Gfo/Idh/MocA family, suggesting a shared evolutionary origin and similar catalytic mechanisms.
    source: "InterPro:IPR050984 abstract (LLM-generated, not curator-reviewed)"
