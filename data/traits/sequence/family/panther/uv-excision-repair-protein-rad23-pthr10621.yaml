definition: >-
  UV EXCISION REPAIR PROTEIN RAD23 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10621. PANTHER protein class: damaged DNA-binding protein, DNA metabolism protein. Members are annotated with the molecular function polyubiquitin modification-dependent protein binding, ubiquitin binding, proteasome binding. Members participate in proteasome-mediated ubiquitin-dependent protein catabolic process, proteolysis involved in protein catabolic process. Members localise to nucleoplasm, cytoplasm, cytosol.
