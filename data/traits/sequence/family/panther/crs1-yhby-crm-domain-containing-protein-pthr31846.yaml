identifier: PANTHER:PTHR31846
label: "CRS1 / YHBY (CRM) DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents a group of plant intron splicing facilitator, including CRS1/CFM2/CFM3 from Arabidopsis. They contain the CRM domain, which is a RNA binding domain. CRS1 is a chloroplastic protein required for the splicing of group IIA introns by regulating the intron folding. CFM3 is involved in group IIB intron splicing, while CFM2 functions dually in group I and group II intron splicing.
