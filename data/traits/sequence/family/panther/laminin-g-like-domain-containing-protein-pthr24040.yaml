  - kind: GENERAL
    text: >-
      The protein family includes proteins involved in various biological processes such as cell growth and survival, cell adhesion, cell migration, anticoagulation, steroid hormone regulation, and TGF-beta activation control. Members act as ligands for receptor tyrosine kinases, transport androgens, serve as cofactors in coagulation factor degradation, and regulate TGF-beta in a latent state. They are implicated in endothelial cell survival, cytokine signaling, hepatic regeneration, neuron survival and migration, platelet activation, thrombotic responses, and metabolic clearance rate of steroid hormones.
