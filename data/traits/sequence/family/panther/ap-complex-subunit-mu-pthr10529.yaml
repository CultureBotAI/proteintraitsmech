    text: >-
      AP COMPLEX SUBUNIT MU — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10529. PANTHER protein class: membrane traffic protein. and participate in vesicle-mediated transport, establishment of localization, cellular process. and localise to cytoplasm, membrane-bounded organelle, cytoplasmic vesicle.
