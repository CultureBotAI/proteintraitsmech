  - kind: GENERAL
    text: >-
      This family of proteins is involved in endomembrane trafficking, specifically in the recycling of proteins to the plasma membrane. Members of this family form a complex with other proteins and actin, which is crucial for the modulation of the trans-Golgi network and early endosome functions. These proteins are also implicated in linking post-Golgi traffic with the actin cytoskeleton, playing a role at the intersection of exocytic and endocytic pathways.
