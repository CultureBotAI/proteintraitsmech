definitions:
  - kind: GENERAL
    text: >-
      STEROIDOGENIC ACUTE REGULATORY PROTEIN-LIKE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46121. and participate in cellular component organization, organelle localization, vesicle targeting. and localise to lysosomal membrane, endoplasmic reticulum subcompartment, nuclear outer membrane-endoplasmic reticulum membrane network.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The STARD3 family includes sterol-binding proteins that facilitate cholesterol transport from the endoplasmic reticulum to endosomes. The transport is initiated by phosphorylation of an FFAT motif, which promotes membrane tethering. Family members act as lipid transfer proteins, redistributing sterol to endosomes at the expense of the cell membrane, and support membrane formation within endosomes. The START domain within these proteins is responsible for lipid transfer, featuring a hydrophobic cavity for lipid accommodation. The MENTAL domain anchors proteins to endosome membranes, allowing the START domain to interact with the cytosol. Some family members also bind other lipids, such as lutein. While primarily mediating cholesterol transport to endosomes, potential involvement in transport to other membranes like mitochondria has been suggested, pending further evidence. The family does not engage in transcriptional cholesterol sensing.
    source: "InterPro:IPR051869 abstract (LLM-generated, not curator-reviewed)"
