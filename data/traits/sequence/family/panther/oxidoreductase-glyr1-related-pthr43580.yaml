  - kind: GENERAL
    text: >-
      The HIBADH-related NP60 subfamily is involved in various biological processes, including chromatin modification, gene expression regulation, and oxidative stress tolerance. Members of this family act as nucleosome-destabilizing factors during transcriptional activation, recognizing and binding histone H3 and DNA without a preference for specific epigenetic markers. They interact with other proteins to form multifunctional enzyme complexes that facilitate Pol II transcription through nucleosomes. Some members may have oxidoreductase activity, although the active site is not conserved, suggesting a role as an oligomerization module. Additionally, certain members catalyze the NADPH-dependent reduction of glyoxylate and succinic semialdehyde, potentially playing a role in redox homeostasis and oxidative stress response.
    source: "InterPro:IPR051265 abstract (LLM-generated, not curator-reviewed)"
