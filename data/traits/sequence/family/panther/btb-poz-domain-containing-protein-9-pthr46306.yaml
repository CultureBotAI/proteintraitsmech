identifier: PANTHER:PTHR46306
label: "BTB/POZ DOMAIN-CONTAINING PROTEIN 9"
definition: >-
  This family of proteins includes BTB/POZ domain-containing proteins that are implicated in the regulation of sleep and motor activity. They are believed to play a role in maintaining homeostasis in these processes, potentially by influencing dopamine biosynthesis, which is a critical neurotransmitter involved in the control of movement and the sleep-wake cycle. The presence of the BTB/POZ domain suggests that these proteins may also be involved in protein-protein interactions, which could be important for their regulatory functions.
