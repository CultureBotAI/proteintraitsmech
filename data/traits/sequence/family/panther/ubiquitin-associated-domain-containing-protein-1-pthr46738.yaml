identifier: PANTHER:PTHR46738
label: "UBIQUITIN-ASSOCIATED DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This entry represents UBAC1 and related proteins found in eukaryotes. Ubiquitin-associated domain-containing protein 1 (UBAC1) proteins include non-catalytic components of the KPC complex, a specific type of E3 ubiquitin-protein ligase complex. Members of this group function as adaptors within the KPC complex, facilitating the transfer of polyubiquitinated target proteins to the 26S proteasome for degradation. These proteins are involved in the polyubiquitination of key regulatory proteins such as CDKN1B, which plays a role in cell cycle control, and NFKB1, a component of the NF-kappa-B signalling pathway. The ubiquitin-associated (UBA) domains present in these proteins are responsible for recognising and binding polyubiquitinated substrates, indicating a role in targeting proteins for proteasomal degradation, which is essential for various cellular processes, including cell cycle progression and signal transduction.
definition_source: "InterPro:IPR052476 abstract (PANTHER PTHR46738 is a member signature)"
