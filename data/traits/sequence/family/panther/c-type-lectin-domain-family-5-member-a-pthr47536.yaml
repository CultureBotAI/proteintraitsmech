identifier: PANTHER:PTHR47536
label: "C-TYPE LECTIN DOMAIN FAMILY 5 MEMBER A"
definition: >-
  This family of proteins includes cell surface receptors that play a crucial role in osteoclastogenesis and inflammatory responses. They are known to signal through the phosphorylation of TYROBP. In humans, these proteins also serve as macrophage receptors for dengue virus serotypes 1-4, triggering pro-inflammatory cytokine release without facilitating viral entry.
