identifier: PANTHER:PTHR11845
label: "5'-DEOXYNUCLEOTIDASE HDDC2"
definition: >-
  Escherichia coli YfbR is a conserved HD-domain-containing protein with orthologues found in bacteria, archaea, and eukaryotes. YfbR shows strict specificity towards deoxyribonucleoside 5'-monophosphates, and has been established as an essential component of the deoxycytidine pathway for de novo synthesis of thymidylate. The human genome encodes one YfbR orthologue, the uncharacterised HD-domain-containing protein HDDC2. In yeast, HD-domain proteins YGK1 (YGL101W) and YB92 (YBR242W) from Saccharomyces cerevisiae are nucleoside 5'-monophosphatases, with substrate preference for deoxyribonucleoside 5'-monophosphatase over ribonucleoside 5'-monophosphatase.
