identifier: PANTHER:PTHR40279
label: "PQQC-LIKE PROTEIN"
definition: >-
  This entry describes the coenzyme PQQ (pyrroloquinoline quinone) biosynthesis protein PqqC and its related protein, CADD. Pyrroloquinoline quinone (PQQ) is the prosthetic group of several bacterial enzymes, including methanol dehydrogenase of methylotrophs and the glucose dehydrogenase of a number of bacteria. PQQC is an oxidase whose reaction involves a ring closure and eight-electron oxidation of its substrate (AHQQ) to produce PQQ. Chlamydia-specific toxin CADD, also known as PqqC-like protein, induces apoptosis in mammalian cell lines. BesC from Streptomyces cattleya shows homology to CADD, has been shown to catalyse the formation of 4-Cl-allylglycine from 4-Cl-lysine and requires Fe(II) as a cofactor.
definition_source: "InterPro:IPR039068 abstract (PANTHER PTHR40279 is a member signature)"
