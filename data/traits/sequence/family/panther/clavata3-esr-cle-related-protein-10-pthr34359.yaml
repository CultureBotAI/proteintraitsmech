identifier: PANTHER:PTHR34359
label: "CLAVATA3/ESR (CLE)-RELATED PROTEIN 10"
definition: >-
  This entry includes CLAVATA3/ESR (CLE)-related protein 9-13 (CLE9-13) from Arabidopsis and FON2 SPARE1 (FOS1) form from rice. FOS1, a CLE-related protein, regulates floral meristem maintenance. CLE proteins share a C-terminal CLE domain with CLV3, a small secreted polypeptide active as a ligand with a function in shoot apical meristem maintenance. CLE proteins are synthesised as precursors with an N-terminal signal peptide and are C-terminally processed to generate short bioactive peptides of approximately 12-14 amino acids. The mature peptides are secreted to the extracellular space where they function as signalling molecules in a variety of developmental and physiological processes. CLE peptides contain conserved hydroxyproline residues that undergo O-glycosylation with arabinose, which enhances receptor binding affinity. CLV3 and other A-type CLE peptides are involved in the suppression of stem cell development in root and shoot development, in contrast to the B-type CLE peptides CLE41 and CLE44 in Arabidopsis, which are not. In legumes, specific CLE peptides regulate nodulation through the SUNN receptor kinase pathway, controlling the autoregulation of nodulation to limit nodule numbers based on nitrogen availability, and some CLE peptides also regulate arbuscular mycorrhizal colonisation by modulating strigolactone biosynthesis. The family shows diverse expression patterns across plant tissues and plays roles in root development, meristem regulation, and symbiotic interactions.
