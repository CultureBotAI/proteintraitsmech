identifier: PANTHER:PTHR45789
label: FI18025P1
definition: >-
  This family of proteins includes transcription factors that play crucial roles in developmental processes such as chondrocyte differentiation, cartilage formation, and neurogenesis. They are characterized by their ability to bind to a specific DNA motif, which is essential for the regulation of gene expression related to chondrogenesis. Members of this family are involved in various stages of chondrocyte maturation, from prechondrocyte differentiation to the maintenance of proliferating chondroblasts and the regulation of chondrocyte hypertrophy. They also have roles in oligodendroglia differentiation in the developing spinal tube and may act as transcriptional repressors for certain genes. Additionally, some members are implicated in the modulation of WNT signaling and the differentiation of specific T-cell subsets, as well as in promoting brown adipocyte differentiation.
