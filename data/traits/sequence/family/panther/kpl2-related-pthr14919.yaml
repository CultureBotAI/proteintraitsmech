  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural and functional integrity of sperm flagella, specifically in axoneme development, which is crucial for sperm motility. These proteins are also key for the proper formation of the manchette and sperm head, impacting sperm morphology. Their essential role in male fertility is underscored by their contribution to the localization of intraflagellar transport proteins, such as IFT20, to the manchette, indicating a function in dynein-mediated protein transport during spermatogenesis. Beyond reproductive functions, these proteins are implicated in bone growth, where they appear to be necessary for the differentiation of osteoblasts, the cells responsible for bone formation.
    source: "InterPro:IPR052634 abstract (LLM-generated, not curator-reviewed)"
