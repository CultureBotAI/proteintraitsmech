  - kind: GENERAL
    text: >-
      The Short-chain Dehydrogenases/Reductases (SDR) family comprises enzymes with oxidoreductase activity, involved in various biosynthetic pathways. Members of the family participate in the synthesis of secondary metabolites such as botcinic acid, calbistrin A, and cladofulvin, which have roles in plant virulence, potential anti-leukemia properties, and fungal fitness, respectively. The family includes enzymes like polyketide synthases, trans-enoyl reductases, and cytochrome P450 monooxygenases. These enzymes catalyze key steps such as reduction of ketones to alcohols, methylation, hydroxylation, and dimerization reactions in the biosynthesis of complex polyketides and other metabolites.
