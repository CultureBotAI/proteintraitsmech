identifier: PANTHER:PTHR11670
label: "ACONITASE/IRON-RESPONSIVE ELEMENT FAMILY MEMBER"
definition: >-
  This entry represents Aconitate hydratase A found predominantly in bacteria. Iron-responsive element-binding protein 2 and Cytoplasmic aconitate hydratase from animals; and Aconitate hydratase from plants also belong to this family. It also includes Phosphinomethylmalate isomerase (Pmi) involved in the biosynthesis of phosphinothricin tripeptide, a natural-product antibiotic and potent herbicide. Pmi has no aconitase activity with citrate as a substrate and is not able to complement an acnA mutant. Aconitase (aconitate hydratase; EC:4.2.1.3) is an iron-sulphur protein that contains a [4Fe-4S]-cluster and catalyses the interconversion of isocitrate and citrate via a cis-aconitate intermediate. Aconitase functions in both the TCA and glyoxylate cycles, however unlike the majority of iron-sulphur proteins that function as electron carriers, the [4Fe-4S]-cluster of aconitase reacts directly with an enzyme substrate. In eukaryotes there is a cytosolic form (cAcn) and a mitochondrial form (mAcn) of the enzyme. In bacteria there are also 2 forms, aconitase A (AcnA) and B (AcnB). Several aconitases are known to be multi-functional enzymes with a second non-catalytic, but essential function that arises when the cellular environment changes, such as when iron levels drop. Eukaryotic cAcn and mAcn, and bacterial AcnA have the same domain organisation, consisting of three N-terminal α/β/α domains, a linker region, followed by a C-terminal 'swivel' domain with a β/β/α structure (1-2-3-linker-4), although mAcn is smaller than cAcn. However, bacterial AcnB has a different organisation: it contains an N-terminal HEAT-like domain, followed by the 'swivel' domain, then the three α/β/α domains (HEAT-4-1-2-3). Eukaryotic cAcn enzyme balances the amount of citrate and isocitrate in the cyto
