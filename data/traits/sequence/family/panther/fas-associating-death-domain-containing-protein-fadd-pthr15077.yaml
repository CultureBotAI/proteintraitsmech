identifier: PANTHER:PTHR15077
label: "FAS-ASSOCIATING DEATH DOMAIN-CONTAINING PROTEIN FADD"
definition: >-
  This entry includes FAS-associated death domain (FADD) proteins from animals. This entry includes the Fas-associated death domain (FADD) protein. This protein is an apoptotic adaptor molecule that recruits caspase-8 or caspase-10 to the activated Fas (CD95) or TNFR-1 receptors. The resulting aggregate, called the death-inducing signalling complex (DISC), performs caspase-8 proteolytic activation. Active caspase-8 initiates the subsequent cascade of caspases mediating apoptosis.
