  - kind: GENERAL
    text: >-
      This family of proteins is involved in the cellular uptake of riboflavin, also known as vitamin B2, which is an essential nutrient for many organisms. Members of this family are capable of transporting not only riboflavin but also its derivatives, flavin mononucleotide (FMN) and flavin adenine dinucleotide (FAD), across cellular membranes. These proteins are part of the major facilitator superfamily and facilitate the passage of these molecules through the cell membrane, impacting various biological processes by ensuring the availability of these critical cofactors for metabolic reactions.
