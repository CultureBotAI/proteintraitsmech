identifier: PANTHER:PTHR45709
label: "LARGE SUBUNIT GTPASE 1 HOMOLOG-RELATED"
definition: >-
  GNL1, also known as HSR1, is localized to the human MHC class I region and is highly homologous to a putative GTP-binding protein, MMR1 from mouse. These proteins represent a new subfamily of GTP-binding proteins that has only eukaryote members. This entry also includes Lsg1 from budding yeasts, LSG1-2 from Arabidopsis and Ns3 from fruit flies. Yeast Lsg1 is involved in 60S ribosomal subunit biogenesis. LSG1-2 is required for 40S maturation. Ns3 regulates insulin signaling and control body size.
