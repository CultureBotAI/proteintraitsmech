    text: >-
      FORMATE DEHYDROGENASE, NITRATE-INDUCIBLE, IRON-SULFUR SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43545. PANTHER protein class: dehydrogenase, oxidoreductase.
