label: "PHOSPHATIDYLETHANOLAMINE N-METHYLTRANSFERASE"
definition: >-
  PHOSPHATIDYLETHANOLAMINE N-METHYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32138. PANTHER protein class: methyltransferase, metabolite interconversion enzyme. Members are annotated with the molecular function N-methyltransferase activity, S-adenosylmethionine-dependent methyltransferase activity. Members participate in phosphatidylcholine biosynthetic process, organonitrogen compound biosynthetic process.
