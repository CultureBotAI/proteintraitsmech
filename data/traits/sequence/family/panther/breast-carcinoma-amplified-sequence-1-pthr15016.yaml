identifier: PANTHER:PTHR15016
label: "BREAST CARCINOMA-AMPLIFIED SEQUENCE 1"
definition: >-
  Human NABC1 (also denoted as breast carcinoma amplified sequence-1 (BCAS1)) is overexpressed in most breast cancer cell lines and down-regulated in some colorectal tumors. It forms detergent stable homodimer, and it is this homodimeric form that accumulates in cells that overexpress this protein.
