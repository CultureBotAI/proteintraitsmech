identifier: PANTHER:PTHR48036
label: "SPLICING FACTOR (PAD-1), PUTATIVE (AFU_ORTHOLOGUE AFUA_1G15810)-RELATED"
definition: >-
  This entry represents RBM39 (also known as CAPER, CC1, RNPC2) proteins from mammals and a group of putative RNA splicing factors including the Pad1 protein from fungi. All are characterised by an N-terminal arginine-rich, low complexity domain followed by three (or in the case of 4 human paralogs, two) RNA recognition domains. These proteins are closely related to the U2AF splicing factor family ( ).
