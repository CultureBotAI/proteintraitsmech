label: "E3 UBIQUITIN-PROTEIN LIGASE RNF8"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE RNF8 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15067. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity. Members participate in ubiquitin-dependent protein catabolic process, protein ubiquitination. Members localise to ubiquitin ligase complex, cytoplasm, cytosol.
