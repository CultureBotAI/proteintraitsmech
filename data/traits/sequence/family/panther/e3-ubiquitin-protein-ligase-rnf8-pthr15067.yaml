identifier: PANTHER:PTHR15067
label: "E3 UBIQUITIN-PROTEIN LIGASE RNF8"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE RNF8 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15067. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function acyltransferase activity, ubiquitin-protein transferase activity, catalytic activity, acting on a protein. Members participate in protein ubiquitination, protein metabolic process, protein modification by small protein conjugation or removal. Members localise to cytoplasm, cytosol, intracellular protein-containing complex.
