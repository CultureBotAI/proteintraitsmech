identifier: PANTHER:PTHR22699
label: "THIOREDOXIN DOMAIN-CONTAINING PROTEIN 16"
definition: >-
  TXNDC genes are members of the thioredoxin superfamily and were shown to play a role in redox homeostasis, protein folding, electron transfer, and also acting as cellular adapters. However, the function of TXDNC16 is still not clear. They have been identified as a meningioma-associated antigen.
