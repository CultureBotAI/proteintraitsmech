identifier: PANTHER:PTHR39063
label: "ORAL-FACIAL-DIGITAL SYNDROME 1 PROTEIN HOMOLOG"
definition: >-
  This family of proteins, which includes centriole and centriolar satellite protein OFD1, is involved in the structural integrity and functional regulation of centrioles, which are critical for cell division and signaling. Members of this family play a key role in determining the length of mother and daughter centrioles and are essential for the biogenesis of cilia, cellular projections that play a significant role in signal transduction for development and tissue maintenance. These proteins are also implicated in the regulation of Wnt signalling pathways and the determination of the left-right axis during embryonic development. Additionally, they participate in the recruitment of important ciliary proteins such as IFT88 and CEP164 to the centrioles.
definition_source: "InterPro:IPR055289 abstract (PANTHER PTHR39063 is a member signature)"
