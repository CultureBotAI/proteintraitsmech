identifier: PANTHER:PTHR47208
label: "OS02G0174800 PROTEIN"
definition: >-
  This entry represents a group of plant FCS-Like Zinc finger proteins, including FLZ12/13/14 from Arabidopsis. They are adaptor proteins which facilitate the interaction of kinase SnRK1 with other proteins. The FLZ domain of FLZ12 alone has been found to be sufficient to mediate interaction with SnRK1alpha subunit.
