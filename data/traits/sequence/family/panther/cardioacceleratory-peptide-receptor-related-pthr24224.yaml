  - kind: GENERAL
    text: >-
      This family of proteins includes G-protein coupled receptors (GPCRs) that are involved in various signaling pathways. Members of this family are characterized by their ability to interact with G proteins and initiate intracellular second messenger cascades, typically involving phosphatidylinositol-calcium or cAMP. Specific functions identified within this family include the reception of neuropeptides such as nematocin and cardioactive peptide (CCAP), which influence behaviors like gustatory associative learning and male mating in nematodes, as well as cardiovascular regulation in insects. Some members may also modulate the activity of other receptors within the family, affecting intracellular signaling dynamics.
