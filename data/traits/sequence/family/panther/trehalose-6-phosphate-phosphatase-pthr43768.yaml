identifier: PANTHER:PTHR43768
label: "TREHALOSE 6-PHOSPHATE PHOSPHATASE"
definition: >-
  This entry represents a group of trehalose-phosphate phosphatases, including OTSB from bacteria and PPA/C/I from Arabidopsis. In E. coli, OTSB removes the phosphate from trehalose 6-phosphate (Tre6P) to produce free trehalose and catalyses the dephosphorylation of glucose-6-phosphate (Glu6P) and 2-deoxyglucose-6-phosphate (2dGlu6P). Arabidopsis PPA has been shown to removes the phosphate from trehalose 6-phosphate to produce free trehalose.
