identifier: PANTHER:PTHR46336
label: "OS02G0260700 PROTEIN"
definition: >-
  This entry represents a subset of proteins from the Bric-a-Brac/Tramtrack/Broad Complex (BTB) family predominantly found in the plant class Magnoliopsida, including POB1 from Arabidopsis. BTB proteins direct the selective ubiquitylation of proteins following their assembly into Cullin3-based ubiquitin ligases. Proteins in this family contain a BTB (broad complex/tramtrack/bric-a-brac, also known as poxvirus and zinc finger (POZ) domain and a BACK (BTB-and-C-terminal-Kelch) domain. POB1 (also known as light-response BTB2, Lrb2) is predicted to be involved in ubiquitination and to negatively regulate the ABA-mediated inhibition of germination.
definition_source: "InterPro:IPR045890 abstract (PANTHER PTHR46336 is a member signature)"
