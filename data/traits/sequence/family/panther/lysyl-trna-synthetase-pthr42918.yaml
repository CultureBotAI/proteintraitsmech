label: "LYSYL-TRNA SYNTHETASE"
definition: >-
  LYSYL-TRNA SYNTHETASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42918. PANTHER protein class: aminoacyl-tRNA synthetase, translational protein. Members are annotated with the molecular function tRNA binding, catalytic activity, acting on RNA, ligase activity. Members participate in tRNA metabolic process, translation, amino acid metabolic process. Members localise to cytoplasm, cytosol.
