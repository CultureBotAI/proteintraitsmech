definitions:
  - kind: GENERAL
    text: >-
      METALLOENDOPEPTIDASE OMA1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22726. PANTHER protein class: metalloprotease, protease, protein modifying enzyme. Members are annotated with the molecular function metalloendopeptidase activity. Members participate in protein catabolic process. Members localise to membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes mitochondrial and outer membrane metalloproteases involved in quality control and stress response. Mitochondrial members act as part of the inner membrane quality control system, cleaving mistranslated or misfolded proteins and regulating mitochondrial dynamics and apoptosis in response to stress. They play roles in the integrated stress response, lipid metabolism, and energy expenditure. Outer membrane members function as chaperones and proteases, maintaining membrane integrity by assembling or eliminating proteins based on their folding state, and are involved in LPS-assembly protein degradation. The family is characterized by a stress-sensor region that regulates proteolytic activity, often activated by autocatalytic cleavage upon mitochondrial depolarization.
    source: "InterPro:IPR051156 abstract (LLM-generated, not curator-reviewed)"
