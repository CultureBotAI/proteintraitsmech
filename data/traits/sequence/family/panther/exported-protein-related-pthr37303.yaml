identifier: PANTHER:PTHR37303
label: "EXPORTED PROTEIN-RELATED"
definition: >-
  Cysteine-rich protein CsxC is a component of the exosporium of Clostridium. The exosporium is the sac-like outermost layer of spores of these species, and is likely to contribute to adhesion, dissemination, and virulence.
