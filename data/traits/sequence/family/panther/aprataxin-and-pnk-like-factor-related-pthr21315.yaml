identifier: PANTHER:PTHR21315
label: "APRATAXIN AND PNK-LIKE FACTOR-RELATED"
definition: >-
  The protein APLF (aprataxin and PNK-like factor or Xip1; EC:4.2.99.18) is a nuclease involved in single-strand and double-strand DNA break repair. It has endo- and exonuclease activities and contains a FHA (forkhead-associated) domain and zinc-finger-like CYR motifs. APLF interacts with XRCC1 and XRCC4 via its FHA domain.
