identifier: PANTHER:PTHR30094
label: "BIFUNCTIONAL GLUTATHIONYLSPERMIDINE SYNTHETASE/AMIDASE-RELATED"
definition: >-
  This family of proteins includes enzymes that are primarily involved in the biosynthesis and hydrolysis of glutathionylspermidine (Gsp). Members of this family exhibit ligase activity, catalyzing the formation of an amide bond between glutathione (GSH) and spermidine with the concomitant hydrolysis of ATP. Some members also possess amidase activity, reversing the reaction by hydrolyzing Gsp back to GSH and spermidine. These activities are crucial for maintaining intracellular thiol redox balance and defending against oxidative stress. The family includes bifunctional enzymes with distinct domains for synthetase and amidase activities, which may be independently folded and functional. Some members are involved in the synthesis of trypanothione, a compound essential for the antioxidant defense in certain parasitic organisms. The family is characterized by a preATP-grasp domain in the C-terminal section, which is indicative of their enzymatic function.
