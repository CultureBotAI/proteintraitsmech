  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the reversible phosphorolysis of various glycosidic bonds. Members of this family are involved in the metabolism of carbohydrates such as beta-(1->2)-D-glucans, N,N'-diacetylchitobiose, cellobionic acid, and cellobiose. These enzymes function by breaking down these carbohydrates into smaller sugar molecules and phosphate derivatives, which can then be utilized in various metabolic pathways including glycolysis and the pentose phosphate pathway. Some members are also implicated in the biosynthesis of cyclic beta-(1,2)-glucan, which is important for processes such as nodule invasion and bacteroid development in certain bacteria. The enzymes typically show specificity for their substrates, which range from di- to oligosaccharides, and are characterized by their ability to invert the anomeric configuration during the reaction.
    source: "InterPro:IPR052047 abstract (LLM-generated, not curator-reviewed)"
