identifier: PANTHER:PTHR14856
label: "PQ-LOOP REPEAT-CONTAINING PROTEIN 1-LIKE PROTEIN"
definition: >-
  The Solute Carrier Family 66 (SLC66) is involved in the bidirectional transport of phospholipids across the phospholipid bilayer, affecting membrane asymmetry. Members of the SLC66 family, such as scramblase ANY1 in yeast, facilitate the movement of phosphatidylserine (PS) and phosphatidylethanolamine (PE) between membrane leaflets. This activity is essential for proper lipid distribution in cellular membranes and may play a role in the endosome to trans-Golgi network trafficking pathway. The exact mechanism and the extent of PS scramblase activity within the family remain topics of scientific investigation.
