identifier: PANTHER:PTHR20855
label: "ADIPOR/PROGESTIN RECEPTOR-RELATED"
definition: >-
  Members of this family are integral membrane proteins. This family includes a protein with hemolytic activity from Bacillus cereus. YOL002c (AdipoR-like receptor IZH2) from Saccharomyces cerevisiae encodes a protein that plays a key role in metabolic pathways that regulate lipid and phosphate metabolism. In eukaryotes, members are seven-transmembrane pass molecules found to encode functional receptors with a broad range of apparent ligand specificities, including progestin and adiponectin (AdipoQ) receptors (AdipoR), and hence have been named PAQR proteins. The mammalian members include progesterone binding proteins. Unlike the case with GPCR receptor proteins, the evolutionary ancestry of the members of this family can be traced back to the Archaea.
definition_source: "InterPro:IPR004254 abstract (PANTHER PTHR20855 is a member signature)"
