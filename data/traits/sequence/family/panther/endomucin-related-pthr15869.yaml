identifier: PANTHER:PTHR15869
label: ENDOMUCIN-RELATED
definition: >-
  Endomucin, also known as sialomucin or mucin-like sialoglycoprotein, is a membrane-bound glycoprotein expressed luminally by endothelial cells that line postcapillary venules, a primary site of leukocyte recruitment during inflammation. It interferes with the assembly of focal adhesion complexes and inhibits interaction between cells and the extracellular matrix.
