identifier: PANTHER:PTHR48433
label: "OUTER ENVELOPE PROTEIN 61-LIKE"
definition: >-
  Outer envelope protein 61 is involved in protein import into the endoplasmic reticulum and chloroplasts. It is thought to act as chaperone docking proteins during post-translational protein translocation into the ER. It also implicated in chaperone-mediated targeting of proteins to chloroplasts, interacting specifically with chloroplast precursors to facilitate their delivery to the chloroplast translocase. The TPR region within this protein is essential for interaction with HSP70-1, and the linker domain is crucial for the selective recognition of chloroplast precursor complexes, distinguishing it from mitochondrial precursors.
definition_source: "InterPro:IPR053319 abstract (PANTHER PTHR48433 is a member signature)"
