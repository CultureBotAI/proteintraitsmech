identifier: PANTHER:PTHR35728
label: "MICROTUBULE-BINDING PROTEIN TANGLED-RELATED"
definition: >-
  TANGLED1 (TAN1) is a microtubule-binding protein that localizes to the division site and mitotic microtubules and plays a critical role in division plane orientation in plants. It acts as a component of a cortical guidance cue that remains behind when the preprophase band (PPB) is disassembled and directs the expanding phragmoplast to the former PPB site during cytokinesis. It has been shown to mediate microtubule zippering or end-on microtubule interactions, depending on their contact angle.
definition_source: "InterPro:IPR044709 abstract (PANTHER PTHR35728 is a member signature)"
