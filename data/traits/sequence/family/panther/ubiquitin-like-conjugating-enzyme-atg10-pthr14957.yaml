definition: >-
  UBIQUITIN-LIKE-CONJUGATING ENZYME ATG10 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14957. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin-like protein conjugating enzyme activity. Members participate in protein modification by small protein conjugation, autophagosome assembly, lipoprotein biosynthetic process. Members localise to cytoplasm, cytosol.
