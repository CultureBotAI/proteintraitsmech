definitions:
  - kind: GENERAL
    text: >-
      AGAP000281-PA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45781. PANTHER protein class: HMG box transcription factor. Members are annotated with the molecular function chromatin DNA binding. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional regulators and coactivators that play crucial roles in various biological processes such as neural stem cell commitment, corticogenesis, lymphoid cell development, and organogenesis. Members of this family are known to bind to GC-rich DNA sequences, potentially altering chromatin structure and modulating the accessibility of transcription factors to DNA. They are involved in the control of the neural stem cell pool, neurite outgrowth, and the development of lymphoid tissue-inducer cells, which are essential for the formation of secondary lymphoid organs. These proteins act as developmental checkpoints and are pivotal in thymocyte positive selection and T cell lineage commitment. They also contribute to the differentiation of innate lymphoid cells and the specification of natural killer cell lineage. Additionally, they have a role in cell fate reprogramming, chromatin structure control, and cell cycle progression. Some family members are implicated in the regulation of hormone-responsive genes and the response to various stimuli such as dexamethasone, cAMP, and insulin.
    source: "InterPro:IPR051365 abstract (LLM-generated, not curator-reviewed)"
