    text: >-
      This family of proteins includes factors that may play a role in early developmental processes such as gastrulation. Specifically, members of this family have been implicated in influencing the movement of the archenteron, a structure involved in the development of the gut in embryos. The exact mechanisms and the breadth of functions within this family are not fully characterized, as it also includes proteins that are currently uncharacterized and may have diverse roles in cellular processes.
