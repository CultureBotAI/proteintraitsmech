  - kind: GENERAL
    text: >-
      The TRIM/NHL protein family includes E3 ubiquitin-protein ligases that play crucial roles in various cellular processes, including embryonic stem cell proliferation, neuronal functions, and innate immunity. Members of the family mediate ubiquitination of specific substrates, contributing to protein degradation pathways and post-transcriptional gene regulation. They are involved in neuroprotection, rapid ischemic tolerance, antiviral responses, and regulation of cell cycle transitions. Some family members interact with microRNAs and RNA-binding proteins to modulate gene expression, affecting processes like neural development and cell differentiation. The NHL domain, often forming a six-bladed beta-propeller, is a key feature for RNA targeting and protein-protein interactions, while the RING domain is essential for ligase activity.
    source: "InterPro:IPR050952 abstract (LLM-generated, not curator-reviewed)"
