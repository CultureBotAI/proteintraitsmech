definitions:
  - kind: GENERAL
    text: >-
      26S PROTEASOME REGULATORY SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23073. PANTHER protein class: protease, protein modifying enzyme. Members are annotated with the molecular function ATP-dependent activity. and participate in proteasomal protein catabolic process, protein metabolic process, proteasome-mediated ubiquitin-dependent protein catabolic process. and localise to proteasome complex, peptidase complex, protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the ATP-dependent degradation of ubiquitinated proteins. Members function as regulatory subunits within the 26S proteasome complex, which plays a crucial role in maintaining cellular protein homeostasis. They participate in unfolding ubiquitinated target proteins that are then translocated into a proteolytic chamber for degradation into peptides. This process is essential for the removal of misfolded or damaged proteins and for regulating the levels of proteins involved in various cellular processes, including cell cycle progression, apoptosis, and DNA damage repair. Some family members are also implicated in the recognition, binding, and translocation of substrate proteins into the archaeal 20S proteasome core particle, essential for proteolytic gate opening.
    source: "InterPro:IPR050221 abstract (LLM-generated, not curator-reviewed)"
