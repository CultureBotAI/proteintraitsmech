identifier: PANTHER:PTHR31476
label: "PROTEIN WHAT'S THIS FACTOR 1 HOMOLOG, CHLOROPLASTIC"
definition: >-
  This entry represents the PORR (plant organelle RNA recognition domain, previously DUF860) family of proteins which localise to either mitochondria or chloroplasts, and it seems likely that most PORR proteins function in organellar RNA metabolism. Including in this family are Protein root primordium defective 1-like (RPD1) and Protein WHAT'S THIS FACTOR1. RPD1 is involved in pre-arranging the maintenance of the active cell proliferation during root primordium development. WTF1 is a RNA-binding protein involved in the chloroplastic group II intron splicing.
