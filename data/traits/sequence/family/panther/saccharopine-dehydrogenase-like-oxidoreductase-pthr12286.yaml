  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of complex lipids, specifically in the reduction of the double bond between C-4 and C-5 during the production of phthiocerol dimycocerosates (DIM A) and glycosylated phenolphthiocerol dimycocerosates (PGL). These compounds are significant components of the cell wall of certain bacteria and play a role in modulating the host immune response during infection. Members of this family exhibit oxidoreductase activity, catalyzing the NAD(P)H-dependent reduction of enoyl substrates within the lipid biosynthesis pathway.
    source: "InterPro:IPR051276 abstract (LLM-generated, not curator-reviewed)"
