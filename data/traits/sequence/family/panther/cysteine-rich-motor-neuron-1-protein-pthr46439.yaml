identifier: PANTHER:PTHR46439
label: "CYSTEINE-RICH MOTOR NEURON 1 PROTEIN"
definition: >-
  This family of proteins is implicated in central nervous system (CNS) development, specifically in the differentiation and survival of motor neurons. Members of this family interact with growth factors that are critical for these processes. Additionally, some members are involved in angiogenesis, contributing to capillary formation and maintenance. They also modulate bone morphogenetic protein (BMP) activity by influencing its processing and cellular delivery, which can impact various developmental and physiological pathways.
