identifier: PANTHER:PTHR30001
label: RIBONUCLEASE
definition: >-
  Ribonuclease E and ribonuclease G are related enzymes that cleave a wide variety of RNAs. In Escherichia coli, both enzymes have been shown to play a role in the maturation of the 5' end of 16S RNA. RNase E is a major subunit the eubacterial degradosome - a large, multiprotein, multienzyme complex involved in RNA processing and degradation in E. coli and other proteobacteria. These enzymes prefer 5'-monophosphorylated 5'-triphosphorylated substrates. The 5'-monophosphate-assisted cleavage requires at least 2 and preferably 3 or more unpaired 5'-terminal nucleotides.
