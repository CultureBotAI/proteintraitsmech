identifier: PANTHER:PTHR14224
label: "SIMILAR TO PREFERENTIALLY EXPRESSED ANTIGEN IN MELANOMA-LIKE 3"
definition: >-
  This entry describes PRAME protein, Leucine-rich repeat-containing protein 14 (LRRC14) and related proteins. Preferentially expressed antigen of melanoma (PRAME) was first isolated as a human melanoma antigen by cDNA expression cloning using melanoma-reactive cytotoxic Tcells (CTL). PRAME is a tumor associated antigen (TAA) of particular interest since it is widely expressed by lymphoid and myeloid malignancies and solid tumours, including melanomas, sarcomas, head and neck cancers, small-cell lung carcinomas and renal cell cancers. In normal tissues, PRAME expression has been reported in testis and low levels are found in endometrium, ovaries and adrenals. However, the PRAME gene is also expressed, although at a lower intensity, in CD34+ stem cells from healthy donors, which might constitute a problem for its application as a target in tumour immunotherapy. Epigenetic events represent the main mechanism regulating the expression of PRAME including DNA methylation of several promoter regions.
definition_source: "InterPro:IPR050694 abstract (PANTHER PTHR14224 is a member signature)"
