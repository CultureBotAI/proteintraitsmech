identifier: PANTHER:PTHR48423
label: "INTERLEUKIN-27 RECEPTOR SUBUNIT ALPHA"
definition: >-
  The Type I Cytokine Receptor family, Type 2 subfamily, includes receptors that play crucial roles in immune system regulation and defense mechanisms. Members of this family are receptors for interleukins, such as IL27 and IL23, and mediate signal transduction through the Jak-Stat signaling pathway. They are involved in the regulation of Th1-type immune responses and may participate in both innate and adaptive immunity. These receptors are essential for responding to infections in peripheral tissues and may be implicated in autoimmune inflammatory diseases and tumorigenesis. The family is characterized by the presence of specific motifs such as the box 1 motif, necessary for JAK interaction and activation, and the WSXWS motif, important for protein folding, intracellular transport, and cell-surface receptor binding.
