identifier: PANTHER:PTHR22640
label: "STRUCTURAL MAINTENANCE OF CHROMOSOMES FLEXIBLE HINGE DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This entry represents structural maintenance of chromosomes flexible hinge domain-containing (SMC-FH) animal proteins, including human Structural maintenance of chromosomes flexible hinge domain-containing protein 1 (SMCHD1) SMC-FH proteins are atypical SMC proteins, characterised by their unique homodimeric arrangement and ATPase activity. SMC-FH plays a crucial role in epigenetic silencing by regulating chromatin architecture and promoting heterochromatin formation on both autosomes and the X chromosome. It is essential for X chromosome inactivation in females, facilitating the spreading of heterochromatin and creating a compartment-less nuclear architecture. Additionally, it is involved in silencing specific autosomal loci and contributes to DNA repair by promoting non-homologous end joining and inhibiting homologous recombination.
definition_source: "InterPro:IPR038892 abstract (PANTHER PTHR22640 is a member signature)"
