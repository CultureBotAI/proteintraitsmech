identifier: PANTHER:PTHR38682
label: "V-TYPE ATP SYNTHASE SUBUNIT C"
definition: >-
  The V-ATPase V0D/AC39 subunit family is involved in the synthesis of ATP from ADP utilizing a proton gradient across the membrane. The family includes proteins that are integral components of the V-type ATP synthase complex, which is responsible for ATP production in various cellular membranes. Some members of the family are also involved in ATP-driven sodium extrusion, highlighting a role in ion transport and homeostasis. The family's function is essential for energy conversion and is critical for the survival and function of organisms across different domains of life. A-type ATPases (archaeal-type ATPases) and V-ATPases, all included in this entry, are thought to have evolved from common ancestral genes.
