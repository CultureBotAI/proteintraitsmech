identifier: PANTHER:PTHR22571
label: FILAGGRIN-RELATED
definition: >-
  This family of proteins is involved in the structural integrity and mechanical strength of the epidermis, particularly in the formation of the stratum corneum. Members play a crucial role in cell-cell adhesion within the cornified cell layers and contribute to the assembly of the epidermal cornified cell envelopes. They are also implicated in the aggregation of keratin intermediate filaments and the promotion of disulfide-bond formation among these filaments during the terminal differentiation of mammalian epidermis.
