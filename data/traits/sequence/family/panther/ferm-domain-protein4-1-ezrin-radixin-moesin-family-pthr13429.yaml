identifier: PANTHER:PTHR13429
label: "FERM DOMAIN (PROTEIN4.1-EZRIN-RADIXIN-MOESIN) FAMILY"
definition: >-
  This family includes FERM domain-containing protein 6 (FRMD6, also known as willin and hEx/human expanded), its homologue from Drosophila, Expanded (Ex) and FERM domain-containing protein 1 (FRMD1). Ex, is a regulator of the Hippo/SWH (Sav/Wts/Hpo) signalling pathway, which plays a pivotal role in organ size control and is tumour suppression by restricting proliferation and promoting apoptosis. Human FRMD6 was first thought to function independently of the Hippo pathway as it lacks the C-terminal domain of Ex that allows it to directly interact with various downstream Hippo signalling components. However, it has been shown to act as an upstream regulator of Hippo signalling that modulates actin cytoskeleton dynamics and mechanical phenotype of neuronal cells through ERK signalling. FRMD6 is widely distributed in various tissues and cell types; in the nervous system is involved in neuronal differentiation, myelination, nerve injury repair, and vesicle exocytosis. It has been implicated in the progression of Alzheimer's disease (AD) and positioned as a novel AD risk gene. There is not much information about FRMD1 to date. Both FRMD1 and FRMD6 contain a single FERM domain, which is found in the cytoskeletal-associated proteins such as ezrin, moesin, radixin, 4.1R, and merlin.
