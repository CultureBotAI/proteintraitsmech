identifier: PANTHER:PTHR23270
label: "PROGRAMMED CELL DEATH PROTEIN 11  PRE-RRNA PROCESSING PROTEIN RRP5"
definition: >-
  Rrp5 is involved in the biogenesis of rRNA. It is required for formation of both 18S and 5.8S rRNA in budding yeasts. In humans, it is also known as NFBP, which is essential for the generation of 18S rRNA. In Arabidopsis, it is essential for normal development of female gametophytes.
