definitions:
  - kind: GENERAL
    text: >-
      OS08G0374000 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31213. Members are annotated with the molecular function signaling receptor activity, protein phosphatase regulator activity, carboxylic acid binding. Members participate in response to abscisic acid, cellular response to oxygen-containing compound, signal transduction. Members localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in various plant-specific physiological processes, including pathogen defense, hormone binding and signaling, and allergenic responses. Members of the family are known to participate in the recognition and response to pathogens, as well as in the regulation of plant growth and development through interaction with hormones such as abscisic acid, cytokinins, gibberellins, and melatonin. Some proteins within this family have enzymatic activity, such as ribonuclease activity, and are implicated in the biosynthesis of alkaloids. Additionally, several members are associated with allergenic reactions in humans, particularly in response to pollen and certain fruits.
    source: "InterPro:IPR050279 abstract (LLM-generated, not curator-reviewed)"
