  - kind: GENERAL
    text: >-
      The peptidase C40 family comprises enzymes with diverse cell wall remodeling activities. Members of this family are involved in processes such as peptidoglycan binding, cell wall expansion, and cell separation during vegetative growth. Some proteins within this family exhibit endopeptidase activity, cleaving specific peptide bonds within the peptidoglycan layer, which is crucial for bacterial cell wall integrity and dynamics. For instance, some proteins hydrolyze gamma-D-glutamate-meso-diaminopimelic acid bonds, while others target gamma-D-glutamyl-L-lysine linkages. Additionally, certain family members are implicated in the invasion of host cells by Listeria species, suggesting a role in bacterial pathogenicity. The family also includes bifunctional enzymes with both muramidase and DL-endopeptidase activities, contributing to cell wall turnover and conjugation processes. Regulatory mechanisms such as proteolytic processing are observed in some members, indicating a complex control of activity in response to cellular growth phases.
    source: "InterPro:IPR051202 abstract (LLM-generated, not curator-reviewed)"
