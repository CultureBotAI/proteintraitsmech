definitions:
  - kind: GENERAL
    text: >-
      TELOMERASE PROTEIN COMPONENT 1 TEP1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44791. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function DNA polymerase activity, RNA binding. Members participate in telomere maintenance, mitotic recombination. Members localise to nuclear protein-containing complex, catalytic complex, ribonucleoprotein complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes components of the telomerase ribonucleoprotein complex, which plays a crucial role in the replication of chromosome termini. Members are involved in the stabilization and localization of vault RNA within the ribonucleoprotein vault particle, a structure implicated in nucleo-cytoplasmic transport. Some family members have a specific binding affinity for telomerase RNA, which may be indicative of an interaction with a region of RNA secondary structure.
    source: "InterPro:IPR052652 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
