  - kind: GENERAL
    text: >-
      TELOMERASE PROTEIN COMPONENT 1 TEP1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44791. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function DNA polymerase activity, RNA binding, organic cyclic compound binding. Members participate in telomere maintenance, mitotic recombination, cellular aromatic compound metabolic process. Members localise to nuclear protein-containing complex, catalytic complex, ribonucleoprotein complex.
