  - kind: GENERAL
    text: >-
      TELOMERASE PROTEIN COMPONENT 1 TEP1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44791. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, catalytic activity, acting on DNA, RNA binding. Members participate in cellular aromatic compound metabolic process, telomere organization, chromosome organization. Members localise to ribonucleoprotein complex, protein-containing complex, catalytic complex.
