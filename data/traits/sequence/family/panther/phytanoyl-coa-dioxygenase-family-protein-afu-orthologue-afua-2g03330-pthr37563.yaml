  - kind: GENERAL
    text: >-
      This family of proteins includes dioxygenases involved in the biosynthesis of various fungal secondary metabolites, such as ergot alkaloids, swainsonine, communesins, fumitremorgins, and kanamycin. These enzymes catalyze oxidative reactions that are essential for the formation of bioactive compounds with potential pharmaceutical applications. The reactions mediated by these proteins are often part of complex biosynthetic pathways that transform simple precursor molecules into structurally diverse and biologically active alkaloids. The family members share a common function in introducing oxygen into substrates, which can lead to the formation of new bonds, ring structures, or the activation of molecules for further modification.
    source: "InterPro:IPR051961 abstract (LLM-generated, not curator-reviewed)"
