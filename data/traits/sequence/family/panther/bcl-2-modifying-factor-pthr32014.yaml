identifier: PANTHER:PTHR32014
label: "BCL-2-MODIFYING FACTOR"
definition: >-
  Bcl-2-modifying factor (BMF) is thought to play a role in inducing apoptosis. It is thought to bind to Bcl-2 proteins. This family of proteins is found in eukaryotes. Proteins in this family are typically between 75 and 190 amino acids in length. There are two conserved sequence motifs: GNA and DQF.
