identifier: PANTHER:PTHR34362
label: "WPP DOMAIN-CONTAINING PROTEIN 1-RELATED"
definition: >-
  This family includes WPP domain-containing proteins 1/2/3 (also known as MFP1 attachment factors 1/2/3), homologues of the MFP1 attachment factor 1 (MAF1), a plant-specific nuclear envelope (NE)-associated protein first identified in tomato. These proteins are NE-associated proteins containing a WPP domain predicted to consist of a β-strand and three α-helices, sufficient for NE targeting. These proteins regulate the mitotic activity in roots and play a role with HSP70-1 in facilitating WIT1 (WPP domain-interacting tail-anchored protein 1) nuclear envelope targeting.
