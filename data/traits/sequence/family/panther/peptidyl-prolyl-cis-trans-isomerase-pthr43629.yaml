  - kind: GENERAL
    text: >-
      The PpiC/parvulin rotamase family is characterized by its peptidyl-prolyl cis-trans isomerase (PPIase) activity, which plays a crucial role in accelerating the folding of proteins. Members of the family exhibit a preference for substrates with hydrophobic side chains, such as leucine and phenylalanine, at the P1 position. While the family generally contributes to protein folding, one member is noted for not being inhibited by immunosuppressive drugs cyclosporin A or FK506, suggesting a regulatory mechanism distinct from other PPIases. The family's function is essential for various cellular processes, as proper protein folding is critical for maintaining cellular function and homeostasis.
