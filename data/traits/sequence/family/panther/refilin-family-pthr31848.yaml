identifier: PANTHER:PTHR31848
label: "Refilin family"
definition: >-
  This protein family includes the actin regulators, Refilin A and B. Refilin (also known as Cfm or FAM101) is thought to stabilise peri-nuclear actin filament bundles, important in fibroblasts. Refilin is important as changes in localisation and shape in the nucleus plays a role in cellular and developmental processes. Refilins are essential partner molecules of Filamin B involved in regulating differentiation and proliferation of chondryocytes.
