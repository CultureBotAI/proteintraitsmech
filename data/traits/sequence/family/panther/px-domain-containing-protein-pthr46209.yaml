identifier: PANTHER:PTHR46209
label: "PX DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry includes SNX10/11. They belong to the nexin family, which contains a conserved PX (phox homology) domain that is responsible for binding to specific phosphoinositides. SNX10 is involved in intracellular vesicular trafficking. It has been linked to osteopetrosis. SNX11 is involved in protein sorting and membrane trafficking in endosomes.
