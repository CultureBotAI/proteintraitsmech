definitions:
  - kind: GENERAL
    text: >-
      PLECKSTRIN HOMOLOGY DOMAIN-CONTAINING FAMILY M MEMBER 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46556. Members are annotated with the molecular function kinesin binding, cytoskeletal protein binding, protein binding. and participate in lysosome localization, organelle localization, Golgi organization. and localise to cytoplasmic vesicle, organelle membrane, endosome.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in intracellular vesicle trafficking, particularly affecting lysosome movement and localization. They act as effectors for small GTPase ARL8B, facilitating the recruitment of kinesin-1 to lysosomes, which in turn promotes their transport along microtubules. These proteins are also key in natural killer (NK) cell function, where they contribute to the polarization of cytolytic granules and microtubule-organizing centers towards the immune synapse during the targeting of cells by NK cells. Additionally, they play a role in maintaining the structural integrity of the Golgi apparatus and may be involved in the formation of membrane tubules.
    source: "InterPro:IPR053015 abstract (LLM-generated, not curator-reviewed)"
