identifier: PANTHER:PTHR43977
label: "STRUCTURAL MAINTENANCE OF CHROMOSOMES PROTEIN 3"
definition: >-
  STRUCTURAL MAINTENANCE OF CHROMOSOMES PROTEIN 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43977. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function double-stranded DNA binding. Subfamilies participate in mitotic sister chromatid cohesion, cell cycle. Subfamilies localise to chromosome, intracellular anatomical structure, cohesin complex.
