identifier: PANTHER:PTHR12353
label: "DISKS LARGE-ASSOCIATED PROTEIN  DAP   SAP90/PSD-95-ASSOCIATED PROTEIN"
definition: >-
  This entry represents the SAPAP family, whose members include mars from fruit flies and disks large-associated proteins from vertebrates. Mars binds to microtubules and protein phosphatase 1. It is involved in cell signalling, mitotic spindle organisation and regulation of mitotic cell cycle. It is essential for the early development of Drosophila embryos.
