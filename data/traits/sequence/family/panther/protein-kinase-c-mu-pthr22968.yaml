label: "PROTEIN KINASE C, MU"
definition: >-
  PROTEIN KINASE C, MU — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22968. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity. Members participate in phospholipase C-activating G protein-coupled receptor signaling pathway, intracellular signal transduction. Members localise to cytoplasm, cytosol.
