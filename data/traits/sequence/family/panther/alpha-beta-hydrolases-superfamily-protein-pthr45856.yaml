identifier: PANTHER:PTHR45856
label: "ALPHA/BETA-HYDROLASES SUPERFAMILY PROTEIN"
definition: >-
  The lipase family, part of the AB hydrolase superfamily, encompasses secreted enzymes predominantly involved in the hydrolysis of mono- and diacylglycerols. Members of this family exhibit a strong preference for cleaving ester bonds at the 1,3-positions of glycerides, releasing free fatty acids, particularly oleic acid, and glycerol. These lipases play a crucial role in lipid metabolism, especially for organisms like Malassezia species that lack fatty acid synthase genes and rely on external lipid sources for growth. The family's involvement extends to pathogenicity, as the lipases are implicated in skin conditions such as Dandruff and seborrheic dermatitis by breaking down sebaceous lipids and generating irritants. Some members also have the ability to synthesize diacylglycerols from monoacylglycerols. The activity of these lipases is regulated by metal ions and specific inhibitors, and their activity is maximized at a lipid-water interface, suggesting interfacial activation mechanisms.
