    text: >-
      This family of proteins is involved in the regulation of actin cytoskeleton dynamics. Members of this family are known to nucleate the formation of linear actin filaments, which are essential for various cellular processes including cell shape determination, cell division, and cell signaling. The proteins typically contain domains that regulate their activity through autoinhibitory interactions, which can be released upon binding of activated GTPases, leading to actin filament nucleation and elongation.
