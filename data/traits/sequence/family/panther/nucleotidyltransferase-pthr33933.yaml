identifier: PANTHER:PTHR33933
label: NUCLEOTIDYLTRANSFERASE
definition: >-
  This family of proteins includes probable antitoxin components of type VII toxin-antitoxin (TA) systems. Members of this family are thought to neutralize their cognate toxins through a mechanism that likely involves di-AMPylation or AMPylation. These antitoxins may bind nucleotides with varying affinities, with some showing a preference for TTP and ATP over ADP and AMP. The interaction between these antitoxins and their respective toxins is crucial for the regulation of the TA system, which plays a role in a variety of cellular processes including the response to stress.
