identifier: PANTHER:PTHR40068
label: "TRANSCRIPTION REPRESSOR NIAR-RELATED"
definition: >-
  In Bacillus subtilis, NadR represses transcription of the nadBCA and nifS-nadR operons in the presence of nicotinic acid. It also binds to DNA upstream of the niaP gene and probably regulating it. This protein may bind nicotinic acid. NadR is also known as NiaR.
