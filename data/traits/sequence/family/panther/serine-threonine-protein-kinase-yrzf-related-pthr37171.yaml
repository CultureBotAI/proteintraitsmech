  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of meiotic drive, a process that biases the transmission of alleles to progeny. Members of this family function as a poison/antidote system, where they may act as a DNA nuclease that leads to the killing of spores that do not inherit the allele, while also possessing a kinase activity that confers resistance to this nuclease activity. Some members are known to suppress the meiotic drive of other proteins within the same family, indicating a complex regulatory mechanism of allele transmission during meiosis.
    source: "InterPro:IPR052396 abstract (LLM-generated, not curator-reviewed)"
