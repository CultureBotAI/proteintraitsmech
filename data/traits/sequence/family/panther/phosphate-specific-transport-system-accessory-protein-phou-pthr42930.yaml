identifier: PANTHER:PTHR42930
label: "PHOSPHATE-SPECIFIC TRANSPORT SYSTEM ACCESSORY PROTEIN PHOU"
definition: >-
  PhoU is a negative regulator in Pho regulon which plays a key role in phosphate homeostasis. Members of the Pho regulon include alkaline phosphatase (AP), the PhoB-PhoR proteins and the PstSCAB and PhoU proteins. PhoU is encoded together with proteins of the phosphate-specific transport (Pst) system in the polycistronic pstSCAB-phoU operon. PhoU is essential for the repression of the Pho regulon at high phosphate conditions by a mechanism which is not fully understood. It has been proposed that PhoU may not only control the abundance of the PstSCAB2 transporter through the PhoBR two-component signaling pathway, but also control its activity. PhoU is known to interact with PhoR and PstB, and it may be involved in the formation of a signaling complex at the cytoplasmic membrane that responds to environmental Pi levels.
definition_source: "InterPro:IPR028366 abstract (PANTHER PTHR42930 is a member signature)"
