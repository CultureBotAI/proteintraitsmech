definitions:
  - kind: GENERAL
    text: >-
      MEIOSIS-SPECIFIC TRANSCRIPTION FACTOR NDT80 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35144. PANTHER protein class: P53-like transcription factor, immunoglobulin fold transcription factor. Members are annotated with the molecular function DNA-binding transcription factor activity. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, reproduction. and localise to intracellular organelle lumen, membrane-enclosed lumen, membrane-bounded organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that are key regulators of various cellular processes in fungi. Members of this family act as positive regulators of acid phosphatase activity and are crucial for the response to nitrogen and carbon starvation. They play a significant role in vegetative incompatibility, a system for non-self-recognition that leads to programmed cell death. Some members are also involved in meiosis and sporulation, recognizing specific DNA sequences to activate the transcription of genes necessary for these processes. Additionally, they can influence drug sensitivity, hyphal growth, biofilm formation, and virulence by regulating the expression of genes related to ergosterol biosynthesis, cell wall components, and cell separation.
    source: "InterPro:IPR052605 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
