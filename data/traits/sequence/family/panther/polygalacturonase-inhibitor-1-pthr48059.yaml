  - kind: GENERAL
    text: >-
      This family of proteins includes inhibitors of fungal polygalacturonase, which are key components in plant defense against phytopathogenic fungi. Members of this family are involved in the inhibition of a range of polygalacturonases from different fungal species, contributing to the plant's resistance mechanisms. Some members have been noted to have a preference for polygalacturonase from specific fungi, while others may not inhibit all polygalacturonases equally. Additionally, a member of this family is implicated in the regulation of floral organ number and another in promoting the flowering transition under long day conditions, indicating a role beyond pathogen resistance.
    source: "InterPro:IPR051848 abstract (LLM-generated, not curator-reviewed)"
