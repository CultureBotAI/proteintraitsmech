  - kind: GENERAL
    text: >-
      NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46552. PANTHER protein class: oxidoreductase. Members are annotated with the molecular function primary active transmembrane transporter activity, NADH dehydrogenase activity, electron transfer activity. Members participate in ATP synthesis coupled electron transport, mitochondrial electron transport, NADH to ubiquinone. Members localise to inner mitochondrial membrane protein complex, mitochondrial respiratory chain complex I, respiratory chain complex I.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Complex I Subunit 2 family comprises core subunits of the mitochondrial membrane respiratory chain NADH dehydrogenase, also known as Complex I. These proteins are essential for the catalytic activity and assembly of Complex I, which is responsible for the initial step in the mitochondrial electron transport chain. Complex I catalyzes the transfer of electrons from NADH to ubiquinone, a process fundamental to cellular respiration and energy production. Members of this family are believed to be part of the minimal assembly required for catalysis, indicating a conserved role across various species in facilitating efficient electron transfer and contributing to the proton gradient generation across the mitochondrial inner membrane.
    source: "InterPro:IPR050175 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
