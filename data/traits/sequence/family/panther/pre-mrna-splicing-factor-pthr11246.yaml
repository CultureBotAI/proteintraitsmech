identifier: PANTHER:PTHR11246
label: "PRE-MRNA SPLICING FACTOR"
definition: >-
  This entry represents a group of pre-mRNA-processing factors, including Syf1/Clf1 from budding yeasts and protein crooked neck (CRN) from fruit flies. Syf1 acts as a component of the NTC complex (or Prp19-associated complex), associates to the spliceosome to mediate conformational rearrangement or to stabilize the structure of the spliceosome after U4 snRNA dissociation, which leads to spliceosome maturation. Clf1 is a splicing factor that are part of at least two multisubunit protein complexes, a small nuclear RNA-free structure similar to what was reported as the Prp19 complex and an RNP structure that contains the U2, U5, and U6 small nuclear RNAs. Human CRN-like protein is also implicated in pre-mRNA splicing. The crn mutation in Drosophila has been shown to cause abnormalities in the central and peripheral nervous systems.
definition_source: "InterPro:IPR045075 abstract (PANTHER PTHR11246 is a member signature)"
