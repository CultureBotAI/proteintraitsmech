identifier: PANTHER:PTHR23086
label: "PHOSPHATIDYLINOSITOL-4-PHOSPHATE 5-KINASE"
definition: >-
  This entry includes type I and type II phosphatidylinositol-phosphate-kinases (PIPKs). Type I (phosphatidylinositol-4-phosphate 5-kinase/PIP5K) and type II (phosphatidylinositol-5-phosphate 4-kinase/PIP4K) PIPKs catalyse the formation of phosphoinositol-4,5-bisphosphate via the phosphorylation of phosphatidylinositol-4-phosphate and phosphatidylinositol-5-phosphate, respectively, all of which are involved in the phosphoinositide signalling pathway.
