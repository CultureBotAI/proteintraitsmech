  - kind: GENERAL
    text: >-
      DNA REPAIR-SCAFFOLDING PROTEIN SPIDR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR34347. PANTHER protein class: DNA metabolism protein. Members participate in double-strand break repair via homologous recombination, regulation of establishment of protein localization, regulation of cellular process. Members localise to nuclear chromosome, nucleoplasm, membrane-enclosed lumen.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
