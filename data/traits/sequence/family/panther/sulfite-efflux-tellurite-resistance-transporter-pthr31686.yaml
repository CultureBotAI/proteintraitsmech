label: "Sulfite Efflux Tellurite-Resistance Transporter"
definition: >-
  Sulfite Efflux Tellurite-Resistance Transporter — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31686. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function transmembrane transporter activity. Subfamilies participate in inorganic anion transport. Subfamilies localise to plasma membrane, cell periphery.
