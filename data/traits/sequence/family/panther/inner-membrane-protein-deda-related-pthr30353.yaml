identifier: PANTHER:PTHR30353
label: "INNER MEMBRANE PROTEIN DEDA-RELATED"
definition: >-
  This entry represents the DedA family of proteins which includes the inner membrane proteins YghB, YqjA, and DedA. DedA may be involved in undecaprenyl phosphate (UndP) transport and recycling. It is involved in biosynthesis of LPS lipid A and in the maintenance of membrane potential and plays a role in virulence, probably by allowing bacteria to resist the host immune response YghB may be a membrane transporter required for proton motive force (PMF)-dependent drug efflux. It required, with YqjA, for the proper export of certain periplasmic amidases and, possibly, other Tat substrates. It may play a role in determining membrane lipid composition.
definition_source: "InterPro:IPR032818 abstract (PANTHER PTHR30353 is a member signature)"
