  - kind: GENERAL
    text: >-
      The Myosin-III family comprises actin-based motor proteins with protein kinase activity, playing a crucial role in sensory functions. Members are essential for the development and morphogenesis of cochlear hair bundles, influencing the production and length of stereocilia and limiting microvilli growth, thus contributing to the hair bundle's staircase architecture. They are involved in actin filament elongation at stereocilia tips by transporting actin regulatory factors. Additionally, in photoreceptor cells, they are required for the stability of specific proteins and the normal termination of phototransduction.
    source: "InterPro:IPR052409 abstract (LLM-generated, not curator-reviewed)"
