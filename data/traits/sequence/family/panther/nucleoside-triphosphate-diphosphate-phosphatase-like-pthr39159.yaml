identifier: PANTHER:PTHR39159
label: "Nucleoside triphosphate/diphosphate phosphatase-like"
definition: >-
  This entry represents the nucleoside triphosphate/diphosphate phosphatase (Ntdp) family and similar proteins mainly found in bacteria and archaea. Ntdp family proteins are characterised by their ability to hydrolyse nucleoside triphosphates and diphosphates. They exhibit nucleoside phosphatase activity towards a variety of nucleoside triphosphates (NTPs) and diphosphates (NDPs), including those of adenosine, guanosine, uridine, cytidine, and their deoxy counterparts. These enzymes play a role in nucleotide metabolism, contributing to the regulation of intracellular nucleotide pools and the maintenance of nucleotide balance within the cell. Some members of the Ntdp family are also implicated in bacterial virulence, influencing the production of hemolysins, nucleases, and other extracellular proteins, as well as affecting cell wall protein expression. The enzymatic activity of these proteins can be regulated by substrate concentration and the presence of non-hydrolyzable analogs.
definition_source: "InterPro:IPR050212 abstract (PANTHER PTHR39159 is a member signature)"
