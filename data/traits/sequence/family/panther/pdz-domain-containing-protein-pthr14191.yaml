  - kind: GENERAL
    text: >-
      The NHER family comprises scaffold proteins that regulate the surface expression and function of various membrane proteins, linking them to the actin cytoskeleton. They are involved in ion transport, second messenger cascades, and may enhance Wnt signaling. Some family members interact with regulatory components like NHERF1 to modulate membrane protein trafficking and activity. They play roles in multidrug resistance, chloride channel activity, cholesterol homeostasis, and renal tubule function. They are also involved in the regulation of phosphate reabsorption, sperm capacitation, and chloride and bicarbonate homeostasis in spermatozoa.
