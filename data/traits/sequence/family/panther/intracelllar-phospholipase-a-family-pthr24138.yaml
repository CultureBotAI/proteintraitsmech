identifier: PANTHER:PTHR24138
label: "INTRACELLLAR PHOSPHOLIPASE A FAMILY"
definition: >-
  This family includes a group of proteins mainly found in bacteria, such as Teg from Priestia megaterium, the putative sporulation hydrolase CotR from Bacillus subtilis and the cGAMP-activated phospholipase CapV from Pseudomonas aeruginosa. CapVis an effector phospholipase of a CBASS antiviral system (cyclic oligonucleotide-based antiphage signaling system), which provides immunity against bacteriophages.
