identifier: PANTHER:PTHR31153
label: "CALMODULIN CALCIUM-DEPENDENT NAD KINASE"
definition: >-
  Most of the proteins in this entry contain the zeta toxin domain, including NADKc from Arabidopsis and uncharacterised proteins from bacteria. NADKc is a kinase that phosphorylates NAD to produces NADP in a calmodulin calcium-dependent manner.
