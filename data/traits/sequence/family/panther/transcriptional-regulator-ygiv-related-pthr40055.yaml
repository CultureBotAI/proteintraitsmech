identifier: PANTHER:PTHR40055
label: "TRANSCRIPTIONAL REGULATOR YGIV-RELATED"
definition: >-
  This entry represents DNA gyrase inhibitor from Escherichia coli (SmbC) and similar sequences mainly found in bacteria. SmbC inhibits the supercoiling activity of DNA gyrase by inhibiting this enzyme prior to (or at the step of) binding of DNA. It protects cells against toxins that target DNA gyrase, by inhibiting activity of these toxins and reducing the formation of lethal double-strand breaks in the cell. It can also protect cells against alkylating agents that act independently of DNA gyrase, suggesting a more general role in protecting cells against DNA damage. YgiV from Escherichia coli, which represses the expression of specific genes, also belongs to this family. STM3175 from Salmonella typhimurium, which is also thought to be a transcription factor, has been related with the tolerance of albicidin, an antibiotic peptide that inhibits the supercoiling activity of bacterial DNA gyrase and is active at nanomolar concentrations against a range of different gram-positive and gram-negative bacterial species.
definition_source: "InterPro:IPR050908 abstract (PANTHER PTHR40055 is a member signature)"
