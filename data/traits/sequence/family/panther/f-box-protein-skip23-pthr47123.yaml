  - kind: GENERAL
    text: >-
      This family of proteins includes members that are typically involved in the ubiquitin-proteasome pathway. They function as components of SCF (SKP1-cullin-F-box) E3 ubiquitin ligase complexes, which play a crucial role in targeting specific proteins for ubiquitination and subsequent degradation by the proteasome. This regulatory mechanism is essential for various cellular processes, including cell cycle progression, signal transduction, and stress responses. Some family members contain an F-box domain that is critical for protein-protein interactions, particularly with SKP1 and cullin proteins, forming the core of the SCF complex. The diversity of F-box proteins allows for the recognition and ubiquitination of a wide range of substrates, thereby controlling numerous biological functions.
    source: "InterPro:IPR051304 abstract (LLM-generated, not curator-reviewed)"
