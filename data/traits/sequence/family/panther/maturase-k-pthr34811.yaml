identifier: PANTHER:PTHR34811
label: "MATURASE K"
definition: >-
  This entry represents maturase K, which is usually encoded in the trnK tRNA gene intron, and probably assists in splicing its own and other chloroplast group II introns. Group II introns are widespread in plant cell organelles. In vivo, most plant group II introns do not self-splice, but require the assistance of proteinaceous splicing factors, known as maturases. In higher plants, maturases are encoded for in the nuclear genes, but are otherwise encoded by organellar introns.
