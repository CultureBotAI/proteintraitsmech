identifier: PANTHER:PTHR31918
label: "TRANSMEMBRANE PROTEIN 181"
definition: >-
  TMEM181 mutants are resistant to CDT bacterial toxins. TMEM181 is a cell-surface protein, and CDT may bind to it to enter the cell through endocytosis. This protein is homologous to GPR180, TMEM145, and Wntless (WLS), which have been described as GOST proteins (for GOLD domain seven-transmembrane helix proteins) together with TMEM87A/B, GPR107, and GPR108, given they share the same domain topology consisting of a GOLD domain atop of a membrane-spanning seven-transmembrane helix domain.
definition_source: "InterPro:IPR040416 abstract (PANTHER PTHR31918 is a member signature)"
