  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural maintenance of the Golgi apparatus by interacting with the protein giantin, which is crucial for protein transport between the endoplasmic reticulum and the Golgi. Members of this family are also implicated in hormone-induced steroid biosynthesis in Leydig cells. They play a role in recruiting and enhancing the activity of PI4KB at the Golgi membrane, thereby increasing the local concentration of its substrate. Additionally, some members are known to interact with viral proteins, suggesting a role in microbial infections by aiding in viral RNA replication.
    source: "InterPro:IPR052269 abstract (LLM-generated, not curator-reviewed)"
