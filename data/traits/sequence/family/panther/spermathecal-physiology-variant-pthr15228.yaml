  - kind: GENERAL
    text: >-
      The Rho GTPase-activating protein (RhoGAP) family is involved in the regulation of the Rho-type GTPases, which are critical for actin cytoskeleton dynamics, cell morphology, polarity, and motility. Family members act as GTPase activators by converting active GTP-bound Rho GTPases to their inactive GDP-bound state. Some proteins within the family have domains that can exert an autoinhibitory effect on RhoGAP activity, such as the BAR domain. These proteins play roles in various cellular processes including endothelial cell tubulogenesis, angiogenesis, and the negative regulation of cell spreading. They may also interact with other proteins, such as FLNA, to localize to specific cellular structures and influence cell signaling pathways. The family's activity is essential for maintaining proper cellular function and structure across a range of organisms from yeast to humans.
    source: "InterPro:IPR051025 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
