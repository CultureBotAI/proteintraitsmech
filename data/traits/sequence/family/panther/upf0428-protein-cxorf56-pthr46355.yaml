identifier: PANTHER:PTHR46355
label: "UPF0428 PROTEIN CXORF56"
definition: >-
  This entry includes protein STEEP (CXorf56) from humans and related proteins. STEEP1 is a molecular adapter that stimulates membrane curvature formation and subsequent endoplasmic reticulum exit site establishment by recruiting PI3K complex I, leading to COPII vesicle-mediated transport. STEEP interacts with STING and enables STING signaling by promoting ER exit.
