identifier: PANTHER:PTHR34639
label: "PROTEIN FLATTOP"
definition: >-
  Flattop (Fltp, (also known as Cilia- and flagella-associated protein 126 CFAP126) regulates basal body docking and positioning in mono- and multiciliated cells. These are microtubule inner proteins (MIP) part of the doublet microtubules (DMTs) in cilia and sperm axoneme.
