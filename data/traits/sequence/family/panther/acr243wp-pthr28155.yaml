identifier: PANTHER:PTHR28155
label: ACR243WP
definition: >-
  This family of proteins includes subunits of eukaryotic DNA-directed RNA polymerase I, which are involved in the transcription of DNA into RNA. They play a role in the synthesis of ribosomal RNA precursors and possess intrinsic RNA cleavage activity. Members of this family, such as the heterodimer formed by RPA34 and RPA49, are known to stimulate transcript elongation by RNA polymerase I.
