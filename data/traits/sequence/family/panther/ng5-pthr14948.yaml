  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes including the regulation of glucose uptake and transport, synaptic transmission, and neurotransmitter release. Members of this family modulate the recycling of glucose transporters in response to insulin, are implicated in maintaining pools of neurotransmitter receptors necessary for synapse development and function, and may play roles in regulating the function of voltage-gated sodium channels and synaptic facilitation. They are associated with the regulation of AMPA receptor function and expression, and may influence the final steps of neurotransmitter release by modulating calcium sensing and SNARE complex formation.
