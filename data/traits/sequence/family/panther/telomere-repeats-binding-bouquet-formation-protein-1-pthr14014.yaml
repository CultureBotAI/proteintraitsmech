identifier: PANTHER:PTHR14014
label: "TELOMERE REPEATS-BINDING BOUQUET FORMATION PROTEIN 1"
definition: >-
  Telomere repeats-binding bouquet formation protein 1 (TERB1) is a TRF1-binding protein that promotes chromosome movement and telomere rigidity in meiosis. Disruption of the TRF1-TERB1 interaction has been shown to result in failure of spermatogenesis. The structure of TERB1 has been revealed.
