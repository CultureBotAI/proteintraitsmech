  - kind: GENERAL
    text: >-
      This family of proteins is involved in the process of sexual cell fusion in the slime mold Dictyostelium discoideum. Members of this family are cell surface glycoproteins that play a crucial role during the sexual phase of the organism's life cycle by mediating cell-to-cell fusion events. These proteins are essential for the formation of multinucleate cells, a key step in the development of the fruiting body of D. discoideum.
    source: "InterPro:IPR053133 abstract (LLM-generated, not curator-reviewed)"
