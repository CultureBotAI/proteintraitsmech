  - kind: GENERAL
    text: >-
      This family of proteins includes members that are structurally related to the short-chain dehydrogenases/reductases (SDR) superfamily, specifically the 17-beta-hydroxysteroid dehydrogenase (17-beta-HSD) type 3 subfamily. These enzymes are typically involved in the metabolism of steroid hormones, which is crucial for various physiological processes including sex differentiation, the development of secondary sexual characteristics, and the regulation of endocrine functions. Although most members of this family are described as inactive, they may still retain roles in the metabolism of steroid hormones or related regulatory pathways.
