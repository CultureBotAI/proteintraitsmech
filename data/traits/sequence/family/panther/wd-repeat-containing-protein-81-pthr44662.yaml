  - kind: GENERAL
    text: >-
      The WD repeat WDR81 family proteins function as negative regulators of PI3 kinase/PI3K activity on endosomal membranes, influencing the phosphatidylinositol 3-phosphate content and thus affecting endosome dynamics including fusion, recycling, sorting, and transport. They are implicated in the lysosomal degradation pathway by facilitating the delivery of specific cargos for degradation. Additionally, they play roles in aggrephagy, the autophagic degradation of ubiquitinated protein aggregates, by modulating protein interactions and recruitment of autophagy-related proteins. These proteins are also involved in maintaining mitochondrial structure and organization.
