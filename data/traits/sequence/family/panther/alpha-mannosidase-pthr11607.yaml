  - kind: GENERAL
    text: >-
      The glycosyl hydrolase 38 family is involved in the catabolism and processing of N-linked carbohydrates. Members of this family are responsible for the hydrolysis of alpha-mannosidic linkages in various glycoconjugates, including glycoproteins and oligosaccharides. Some family members play a critical role in the biosynthesis of complex N-glycans by controlling the conversion of high mannose to complex N-glycans, which is a key step in the N-glycan maturation pathway. Others are necessary for the degradation of N-linked carbohydrates during glycoprotein turnover. Certain enzymes within the family have specific functions, such as involvement in spermatogenesis or resistance to salt stress. The family includes lysosomal alpha-mannosidases, which are essential for the breakdown of glycoproteins, and epididymis-specific alpha-mannosidases, which may play a role in sperm maturation and sperm-egg interaction. Activity of these enzymes can be regulated by various inhibitors, including swainsonine and metal ions.
    source: "InterPro:IPR050843 abstract (LLM-generated, not curator-reviewed)"
