identifier: PANTHER:PTHR35259
label: "BOMBESIN RECEPTOR-ACTIVATED PROTEIN C6ORF89"
definition: >-
  Bombesin receptor-activated protein (BRAP, C6orf89) is an important regulator of immune and inflammatory responses in the human airway epithelium. BRAP interacts with the orphan G protein-coupled bombesin receptor subtype 3. BRAP is widely expressed in human airway epithelial cells and vascular endothelial cells and exhibits histone deacetylase enhancer properties. It may play roles in cell cycle progression and wound repair. It regulates NF-kB activity by enhancing histone deacetylase (HDAC) activity.
definition_source: "InterPro:IPR038757 abstract (PANTHER PTHR35259 is a member signature)"
