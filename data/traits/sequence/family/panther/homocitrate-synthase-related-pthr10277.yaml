identifier: PANTHER:PTHR10277
label: "HOMOCITRATE SYNTHASE-RELATED"
definition: >-
  Members of the 2-IPM synthase/homocitrate synthase family are involved in the biosynthesis of essential amino acids, specifically leucine and lysine. They catalyse key condensation reactions in the respective biosynthetic pathways. The 2-isopropylmalate synthases catalyse the formation of 2-isopropylmalate from acetyl-CoA and 3-methyl-2-oxobutanoate, a crucial step in leucine biosynthesis. Homocitrate synthases, on the other hand, catalyse the condensation of 2-oxoglutarate with acetyl-CoA to yield homocitrate, initiating the alpha-aminoadipate pathway for lysine biosynthesis. Some family members also exhibit activity towards the formation of citramalate from pyruvate and acetyl-CoA. This entry also includes members of the 4-hydroxy 2-ketovalerate aldolase family (also known as 4-hydroxy-2-ketovalerate aldolase and 4-hydroxy-2-oxopentanoate aldolase (HOA)) that converts 4-hydroxy-2-oxopentanoate to acetaldehyde and pyruvate, the penultimate step in the meta-cleavage pathway for the degradation of phenols, cresols and catechol. The entry also includes enzymes with regulatory domains that are subject to feedback inhibition by the end products of the pathways, such as leucine and lysine, ensuring the balance of amino acid synthesis in the cell.
definition_source: "InterPro:IPR050073 abstract (PANTHER PTHR10277 is a member signature)"
