identifier: PANTHER:PTHR24085
label: "NUCLEAR HORMONE RECEPTOR"
definition: >-
  NUCLEAR HORMONE RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24085. PANTHER protein class: C4 zinc finger nuclear receptor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, nuclear receptor binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in cellular response to peptide hormone stimulus, regulation of transcription by RNA polymerase II, cellular response to peptide. Members localise to nucleus, intracellular anatomical structure, transcription regulator complex.
