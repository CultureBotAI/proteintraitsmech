identifier: PANTHER:PTHR24085
label: "NUCLEAR HORMONE RECEPTOR"
definition: >-
  NUCLEAR HORMONE RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24085. PANTHER protein class: C4 zinc finger nuclear receptor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, RNA polymerase II-specific DNA-binding transcription factor binding, transcription regulator activity. Members participate in cellular response to hormone stimulus, response to peptide hormone, regulation of DNA-templated transcription. Members localise to membrane-bounded organelle, cellular anatomical entity, protein-containing complex.
