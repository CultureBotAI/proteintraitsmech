identifier: PANTHER:PTHR11054
label: 6-PHOSPHOGLUCONOLACTONASE
definition: >-
  This entry represents 6PGL proteins found in prokaryotic and eukaryotic organisms. 6-phosphogluconolactonases (6PGL) EC:3.1.1.31 are cytosolic enzymes found in all organisms that catalyse the hydrolysis of 6-phosphogluconolactone to 6-phosphogluconic acid in the oxidative phase of the pentose phosphate pathway. Trypanosoma brucei and other characterised 6PGL proteins [InterPro:IPR039104] share an α/β hydrolase fold, with both parallel and anti-parallel β-sheets surrounded by eight α-helices. In Escherichia coli (strain K12), 6PGL (YbhE) is characterised by a 7-bladed β-propeller fold InterPro:IPR022528 (PDB:1RI6).
definition_source: "InterPro:IPR039104 abstract (PANTHER PTHR11054 is a member signature)"
