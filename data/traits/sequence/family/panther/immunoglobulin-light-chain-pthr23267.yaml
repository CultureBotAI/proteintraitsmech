identifier: PANTHER:PTHR23267
label: "IMMUNOGLOBULIN LIGHT CHAIN"
definition: >-
  The Immunoglobulin Variable (IgV) protein family consists of variable domains of immunoglobulin light chains involved in antigen recognition. Members of this family are produced by B lymphocytes and exist as either membrane-bound or secreted glycoproteins. They play a crucial role in the humoral immune response by serving as receptors on B cells for specific antigen binding, which initiates clonal expansion and differentiation into plasma cells. Secreted forms act as antibodies to mediate the elimination of antigens. Each immunoglobulin possesses two antigen binding sites, formed by the variable domains of a heavy chain and an associated light chain. These domains undergo V-(D)-J rearrangement and somatic hypermutations, allowing for affinity maturation and adaptation to a diverse range of antigens. Some members are non-functional due to genetic alterations affecting the immunoglobulin chain synthesis.
