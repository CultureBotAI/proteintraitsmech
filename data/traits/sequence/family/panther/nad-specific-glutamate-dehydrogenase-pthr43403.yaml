identifier: PANTHER:PTHR43403
label: "NAD-SPECIFIC GLUTAMATE DEHYDROGENASE"
definition: >-
  This family consists of several bacterial proteins which are closely related to NAD-glutamate dehydrogenase found in Streptomyces clavuligerus. Glutamate dehydrogenases (GDHs) are a broadly distributed group of enzymes that catalyse the reversible oxidative deamination of glutamate to ketoglutarate and ammonia.
