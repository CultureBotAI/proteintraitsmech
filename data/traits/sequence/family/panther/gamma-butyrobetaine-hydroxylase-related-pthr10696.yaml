identifier: PANTHER:PTHR10696
label: "GAMMA-BUTYROBETAINE HYDROXYLASE-RELATED"
definition: >-
  The protein family includes alpha-ketoglutarate-dependent dioxygenases that catalyse hydroxylation reactions in various metabolic pathways. Members are involved in the degradation of lysine through a pathway that includes cadaverine and glutarate, converting glutarate to L-2-hydroxyglutarate. Other family members hydroxylate trimethyllysine to hydroxytrimethyllysine, a step in carnitine biosynthesis. Additionally, some enzymes contribute to antibiotic biosynthesis, such as clavaminate synthase, or participate in the synthesis of other specialised metabolites like hapalindole-type alkaloids. The family also includes enzymes that hydroxylate or oxidise unique substrates like tyrosine isonitrile, uridine-5'-phosphate, and enduracididine. These enzymes are characterised by their requirement for iron and alpha-ketoglutarate as co-substrates and are involved in diverse biological processes, including amino acid metabolism, secondary metabolite biosynthesis, and post-translational modifications.
definition_source: "InterPro:IPR050411 abstract (PANTHER PTHR10696 is a member signature)"
