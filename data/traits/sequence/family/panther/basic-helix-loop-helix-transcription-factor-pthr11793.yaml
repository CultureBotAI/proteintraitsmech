definitions:
  - kind: GENERAL
    text: >-
      BASIC HELIX-LOOP-HELIX TRANSCRIPTION FACTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11793. PANTHER protein class: basic helix-loop-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. Members localise to non-membrane-bounded organelle, protein-containing complex, transcription regulator complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is comprised of transcription factors involved in the initiation of neuronal differentiation and various developmental processes. Members of the family are characterized by their ability to bind to E-box motifs (5'-CANNTG-3') in the promoter regions of target genes, thereby activating transcription. They play roles in the development of the GnRH axis, neuronal plasticity, and tissue-specific cell fate determination during embryogenesis, such as muscle or early B-cell differentiation. Some family members also participate in mesenchymal to epithelial transition and may interact with other proteins like ATOH7, MYOD1, and CDP2 to regulate gene expression. The presence of a 9aaTAD motif suggests a transactivation function. The family is also implicated in sex determination and may influence lifespan and metabolism.
    source: "InterPro:IPR051098 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
