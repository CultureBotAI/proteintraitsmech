identifier: PANTHER:PTHR47833
label: "PHOTOSYNTHETIC NDH SUBUNIT OF LUMENAL LOCATION 4, CHLOROPLASTIC"
definition: >-
  This family represents a group of plant FKBP-type peptidylprolyl isomerases, including photosynthetic NDH subunit of lumenal location 4 (PNSL4, also known as FKBP16-2, At4g39710), FKBP13 and related proteins. In Arabidopsis, FKBP16-2 is localized to the lumen side of the thylakoid and may be an NAD(P)H dehydrogenase (NDH) complex subunit specific to chloroplasts. FKBP13 shows significant sequence similarity to PNSL4. It interacts with the Rieske Fe-S subunit of the cytochrome b6f complex.
definition_source: "InterPro:IPR044183 abstract (PANTHER PTHR47833 is a member signature)"
