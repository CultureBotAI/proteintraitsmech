identifier: PANTHER:PTHR31194
label: "SHN  SHINE , DNA BINDING / TRANSCRIPTION FACTOR"
definition: >-
  The AP2/ERF transcription factor family, specifically the ERF subfamily, is involved in a wide range of plant developmental processes and stress responses. Members of this family typically function as transcriptional activators, binding to the GCC-box pathogenesis-related promoter element to regulate gene expression. They play key roles in the cytokinin signalling pathway, affecting the development of cotyledons, leaves, and embryos. Some members are also implicated in cuticle formation by inducing wax biosynthesis, conferring drought resistance. Additionally, certain proteins within this family are involved in symbiotic nodule signalling, root infection by symbiotic rhizobia, and nodule development in response to rhizobial Nod factors.
