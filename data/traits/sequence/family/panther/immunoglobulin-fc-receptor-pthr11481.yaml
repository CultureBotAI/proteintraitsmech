  - kind: GENERAL
    text: >-
      The protein family includes receptors that bind to the Fc region of immunoglobulins, particularly IgG and IgE, and are involved in various immune response functions. Members of the family mediate processes such as antibody-dependent cellular cytotoxicity (ADCC), phagocytosis, antigen presentation, and modulation of B-cell and T-cell activation. These receptors are expressed on a variety of immune cells, including natural killer (NK) cells, monocytes, and mast cells, and play roles in both innate and adaptive immunity. They can influence the outcome of infections, inflammatory responses, and allergic reactions. Some family members are also implicated in B-cell differentiation and may have regulatory roles in normal and neoplastic B-cell development. The family's involvement in immune complex clearance from circulation and the modulation of antibody production further highlights its significance in maintaining immune homeostasis and responding to pathogenic challenges.
    source: "InterPro:IPR050488 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
