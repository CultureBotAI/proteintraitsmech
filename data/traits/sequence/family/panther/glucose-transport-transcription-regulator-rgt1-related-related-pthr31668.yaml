definition: >-
  GLUCOSE TRANSPORT TRANSCRIPTION REGULATOR RGT1-RELATED-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31668. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies participate in positive regulation of DNA-templated transcription, regulation of transcription by RNA polymerase II, cellular response to nitrogen compound. Subfamilies localise to nucleus, intracellular anatomical structure.
