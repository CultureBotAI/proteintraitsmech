identifier: PANTHER:PTHR47847
label: "FCS-LIKE ZINC FINGER 17"
definition: >-
  This entry represents a group plant FCS-Like Zinc finger proteins, including FLZ17 and FLZ18 from Arabidopsis. They have been shown to interact with SNF1-related kinase (SnRK1) and may act as mediators conferring tissue- and stimulu-type specific differences in SnRK1 regulation.
