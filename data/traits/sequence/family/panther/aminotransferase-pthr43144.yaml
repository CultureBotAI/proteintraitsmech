identifier: PANTHER:PTHR43144
label: AMINOTRANSFERASE
definition: >-
  Two lysine biosynthesis pathways evolved separately in organisms, the diaminopimelic acid (DAP) and aminoadipic acid (AAA) pathways. The DAP pathway synthesizes L-lysine from aspartate and pyruvate, and diaminopimelic acid is an intermediate. This pathway is utilised by most bacteria, some archaea, some fungi, some algae, and plants. The AAA pathway synthesizes L-lysine from alpha-ketoglutarate and acetyl coenzyme A (acetyl-CoA), and alpha-aminoadipic acid is an intermediate. This pathway is utilised by most fungi, some algae, the bacterium Thermus thermophilus, and probably some archaea, such as Sulfolobus, Thermoproteus, and Pyrococcus. No organism is known to possess both pathways. There are four known variations of the DAP pathway in bacteria: the succinylase, acetylase, aminotransferase, and dehydrogenase pathways. These pathways share the steps converting L-aspartate to L-2,3,4,5- tetrahydrodipicolinate (THDPA), but the subsequent steps leading to the production of meso-diaminopimelate, the immediate precursor of L-lysine, are different. The succinylase pathway acylates THDPA with succinyl-CoA to generate N-succinyl-LL-2-amino-6-ketopimelate and forms meso-DAP by subsequent transamination, desuccinylation, and epimerization. This pathway is utilised by proteobacteria and many firmicutes and actinobacteria. The acetylase pathway is analogous to the succinylase pathway but uses N-acetyl intermediates. This pathway is limited to certain Bacillus species, in which the corresponding genes have not been identified. The aminotransferase pathway converts THDPA directly to LL-DAP by diaminopimelate aminotransferase (DapL) without acylation. This pathway is shared by cyanobacteria, Chlamydia, the archaeon Methanothermobacter thermautotrophicus, and the plant Arabidopsis tha
