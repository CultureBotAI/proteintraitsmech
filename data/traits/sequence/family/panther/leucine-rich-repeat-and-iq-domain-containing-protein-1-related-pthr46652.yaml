  - kind: GENERAL
    text: >-
      The SDS22 and internalin families encompass proteins with diverse roles in cellular regulation and pathogenicity. The SDS22 family members are regulatory subunits of protein phosphatase 1 (PP1), which modulate the phosphatase activity of PP1 complexes, playing a crucial role in various cellular processes including cell cycle regulation and muscle contractility. The internalin family proteins are characterized by their involvement in bacterial virulence, particularly in the genus Listeria. They mediate the entry of Listeria monocytogenes into host cells by interacting with specific host cell receptors such as E-cadherin and MET receptor tyrosine kinase. Internalins are also implicated in modulating host immune responses and facilitating bacterial spread within host tissues. These families share a common feature of leucine-rich repeat (LRR) domains, which are typically involved in protein-protein interactions, although they serve distinct biological functions.
    source: "InterPro:IPR050836 abstract (LLM-generated, not curator-reviewed)"
