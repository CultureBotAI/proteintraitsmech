identifier: PANTHER:PTHR47784
label: "STEROL UPTAKE CONTROL PROTEIN 2"
definition: >-
  This family of proteins includes transcription factors that are key regulators of anaerobic gene expression, particularly for genes encoding cell wall mannoproteins. They are known to bind specific anaerobic response elements in the promoters of target genes. Additionally, these proteins play a crucial role in the uptake and regulation of sterol biosynthesis by interacting with sterol regulatory elements in the promoters of enzymes involved in sterol metabolism. They may also participate in the down-regulation of certain cell wall proteins during anaerobic adaptation.
