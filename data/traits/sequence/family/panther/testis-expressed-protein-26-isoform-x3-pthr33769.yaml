identifier: PANTHER:PTHR33769
label: "TESTIS-EXPRESSED PROTEIN 26 ISOFORM X3"
definition: >-
  MEDAG/Meda-4 promotes differentiation of preadipocytes into adipocytes, and lipid accumulation and glucose uptake in mature adipocytes. It affects two major transcription regulators, Ppar-gamma2 and C/EBP-alpha, and targets genes involved in adipocyte differentiation and lipid storage. There seems to be links between Meda-4 expression and sex hormonal imbalance-induced obesity progression and metabolic alterations. The function of TEX26 is not clear. This entry includes a group of animal proteins, including MEDAG/TEX26.
