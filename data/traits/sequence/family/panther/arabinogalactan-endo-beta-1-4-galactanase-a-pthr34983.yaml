identifier: PANTHER:PTHR34983
label: "ARABINOGALACTAN ENDO-BETA-1,4-GALACTANASE A"
definition: >-
  O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Proteins in this family are endo-1,4- beta-galactanases (EC:3.2.1.89). They have a TIM barrel fold.
