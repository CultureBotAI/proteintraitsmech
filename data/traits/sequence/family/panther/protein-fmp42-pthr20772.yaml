  - kind: GENERAL
    text: >-
      This family of proteins includes transporters that are part of the SLC43A transporter group, classified under TC 2.A.1.44. Members of this family are involved in the transport of various amino acids across cellular membranes. They are characterized by their ability to transport cationic amino acids such as L-arginine, L-lysine, and to a lesser extent, L-histidine and ornithine. Some family members are selective for L-arginine and do not require other inorganic ions for transport. Others may facilitate the net uptake of L-tyrosine and maintain intracellular pools of aromatic and large neutral amino acids through exchange mechanisms. These transporters play crucial roles in cellular processes such as gametogenesis, amino acid homeostasis, and are essential for parasite survival and virulence.
    source: "InterPro:IPR052599 abstract (LLM-generated, not curator-reviewed)"
