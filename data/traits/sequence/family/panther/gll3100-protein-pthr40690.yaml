identifier: PANTHER:PTHR40690
label: "GLL3100 PROTEIN"
definition: >-
  This entry represents a group of prokaryotic proteins that includes UniProtKB:A0A2T1AE85 from Tritonibacter scottomollicae (DgcN), an N-acetyltransferase responsible for N-acetylation of D-Glutamate, an essential component of bacterial peptidoglycans. DgcN consists of an N-terminal Rossman-like domain InterPro:IPR035402, with four β-strands composing a hydrogen-bonded β-sheet and six α-helices, and a C-terminal domain InterPro:IPR035086, consisting of four β-strands and five α-helices and showing a P-loop.
definition_source: "InterPro:IPR011669 abstract (PANTHER PTHR40690 is a member signature)"
