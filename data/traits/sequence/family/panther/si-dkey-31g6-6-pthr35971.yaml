  - kind: GENERAL
    text: >-
      This family of proteins includes structural components involved in myofibrillogenesis and the assembly of myosin into sarcomeric A bands in striated muscle. Members exhibit serine/threonine protein kinase activity, phosphorylating various substrates including N-cadherin and sodium/potassium-transporting ATPase subunits. They also bind to multiple forms of phosphatidylinositol phosphates, influencing the PI3K/AKT/mTOR signaling pathway and thereby contributing to the regulation of cardiomyocyte size and adhesion. Additionally, some members are core components of the 3M complex, which is essential for microtubule dynamics and genome integrity. They play a role in the ubiquitin ligase pathway, affecting Golgi morphogenesis and dendrite patterning in the brain, and are required for the localization of certain ubiquitin ligases to the Golgi apparatus in neurons.
    source: "InterPro:IPR052385 abstract (LLM-generated, not curator-reviewed)"
