identifier: PANTHER:PTHR23033
label: "BETA1,3-GALACTOSYLTRANSFERASE"
definition: >-
  This group of proteins consist of glycoprotein-N-acetylgalactosamine 3-beta-galactosyltransferases (C1GALT1) and C1GALT1-specific chaperone 1 (C1GALT1C1). C1GALT1 helps to generate the core 1 O-glycan Gal-beta1-3GalNAc-alpha1-Ser/Thr (T antigen), which is a precursor for many extended O-glycans in glycoproteins. C1GALT1-specific chaperone 1 (C1GALT1C1) was first described as a glycosyltransferase, however, it has no transferase activity and rather acts as a chaperone probably acts as a specific molecular chaperone assisting the folding/stability of C1GALT1.
