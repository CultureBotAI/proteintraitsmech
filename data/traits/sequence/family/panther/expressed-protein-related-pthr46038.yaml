identifier: PANTHER:PTHR46038
label: "EXPRESSED PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant uncharacterised proteins, including At1g28695 and At4g15970 from Arabidopsis. They belong to the glycosyltransferase Family 77 (CAZy:GT77) and contain a conserved domain found in other nucleotide-diphospho-sugar transferases.
