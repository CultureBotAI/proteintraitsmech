definitions:
  - kind: GENERAL
    text: >-
      HOMEOBOX PROTEIN HMX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46110. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function double-stranded DNA binding, RNA polymerase II transcription regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
