identifier: PANTHER:PTHR34995
label: "DNA-DIRECTED RNA POLYMERASE SUBUNIT BETA"
definition: >-
  RNA polymerase beta'' is involved in the transcription of DNA into RNA. Members of this family are DNA-dependent RNA polymerases that utilise the four ribonucleoside triphosphates as substrates to catalyse the synthesis of RNA from a DNA template. This process is fundamental to the expression of genes and the regulation of cellular functions.
