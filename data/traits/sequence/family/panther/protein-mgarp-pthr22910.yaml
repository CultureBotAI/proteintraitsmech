identifier: PANTHER:PTHR22910
label: "PROTEIN MGARP"
definition: >-
  Protein MGARP, also known as HUMMR, localises to mitochondria and interacts with the mitochondrial membrane protein Miro. In response to hypoxia, it biases mitochondrial movement in the anterograde direction.
