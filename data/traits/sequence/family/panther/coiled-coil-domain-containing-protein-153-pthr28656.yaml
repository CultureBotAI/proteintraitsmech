identifier: PANTHER:PTHR28656
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 153"
definition: >-
  This entry represents Dynein regulatory complex protein 12 from Tetrahymena thermophila (DRC12, also known as Coiled-coil domain-containing protein 153) and similar eukaryotic sequences. DRC12 is a component of the nexin-dynein regulatory complex (N-DRC), a key regulator of ciliary/flagellar motility which maintains the alignment and integrity of the distal axoneme and regulates microtubule sliding in motile axonemes.
