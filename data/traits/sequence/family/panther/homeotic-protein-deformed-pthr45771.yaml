definitions:
  - kind: GENERAL
    text: >-
      HOMEOTIC PROTEIN DEFORMED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45771. PANTHER protein class: DNA-binding transcription factor, homeodomain transcription factor, helix-turn-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in positive regulation of transcription by RNA polymerase II, anterior/posterior pattern specification, anatomical structure development. Members localise to nucleoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Antp homeobox family, specifically the Deformed subfamily, consists of sequence-specific transcription factors that are integral to a developmental regulatory system. These proteins confer specific positional identities to cells along the anterior-posterior axis during development. Members of the family are characterized by their ability to bind DNA at specific sites, influencing the transcription of genes involved in establishing body plans and segmental identities. The family plays a crucial role in the development of various species, from invertebrates to vertebrates, indicating a highly conserved function across different phyla. The proteins typically contain a homeobox domain that facilitates DNA binding, and some members have been shown to activate transcription of apoptotic activators or regulate gene expression related to cell fate specification and organ development.
    source: "InterPro:IPR050609 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
