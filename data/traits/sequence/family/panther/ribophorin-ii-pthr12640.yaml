identifier: PANTHER:PTHR12640
label: "RIBOPHORIN II"
definition: >-
  Swp1 is an essential subunit of the N-oligosaccharyl transferase (OST) complex which catalyses the transfer of a high mannose oligosaccharide from a lipid-linked oligosaccharide donor to an asparagine residue within an Asn-X-Ser/Thr consensus motif in nascent polypeptide chains. N-glycosylation occurs cotranslationally and the complex associates with the Sec61 complex at the channel-forming translocon complex that mediates protein translocation across the endoplasmic reticulum (ER). All subunits are required for a maximal enzyme activity.
definition_source: "InterPro:IPR008814 abstract (PANTHER PTHR12640 is a member signature)"
