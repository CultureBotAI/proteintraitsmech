identifier: PANTHER:PTHR24086
label: "NUCLEAR RECEPTOR SUBFAMILY 5 GROUP A"
definition: >-
  The nuclear hormone receptor subfamily 5 includes group A member 1 (NR5A1) or steroidogenic factor 1 (SF-1), group A member 2 (NR5A) or liver receptor homologue-1, and FTZ-F1 (group A member 3) and FTZ-F1 beta (group B member 1) from Drosophila. SF-1 is a key regulator for steroid biosynthesis and essential for sexual differentiation and formation of the primary steroidogenic tissues. NR5A2 is involved in bile acid/cholesterol homeostasis and in the development of some human cancers. Steroid or nuclear hormone receptors (NRs) constitute an important superfamily of transcription regulators that are involved in widely diverse physiological functions, including control of embryonic development, cell differentiation and homeostasis. Members of the superfamily include the steroid hormone receptors and receptors for thyroid hormone, retinoids, 1,25-dihydroxy-vitamin D3 and a variety of other ligands. The proteins function as dimeric molecules in nuclei to regulate the transcription of target genes in a ligand-responsive manner. In addition to C-terminal ligand-binding domains, these nuclear receptors contain a highly-conserved, N-terminal zinc-finger that mediates specific binding to target DNA sequences, termed ligand-responsive elements. In the absence of ligand, steroid hormone receptors are thought to be weakly associated with nuclear components; hormone binding greatly increases receptor affinity. NRs are extremely important in medical research, a large number of them being implicated in diseases such as cancer, diabetes, hormone resistance syndromes, etc. While several NRs act as ligand-inducible transcription factors, many do not yet have a defined ligand and are accordingly termed 'orphan' receptors. During the last decade, more than 300 NRs have been described, many
