identifier: PANTHER:PTHR44819
label: "V-TYPE IMMUNOGLOBULIN DOMAIN-CONTAINING SUPPRESSOR OF T-CELL ACTIVATION"
definition: >-
  V-type immunoglobulin domain-containing suppressor of T-cell activation (VISTA) is a type I transmembrane protein consisting of a single N-terminal immunoglobulin (Ig) V domain, an approximately 30 amino acid (aa) stalk, a transmembrane domain, and a 95 aa cytoplasmic tail. It is primarily expressed on hematopoietic cells and functions as both a ligand and a receptor. It serves as a immune-checkpoint protein that hampers the generation of effective anti-tumor immunity. Besides cancer, VISTA also regulates the development of autoimmune and inflammatory diseases.
