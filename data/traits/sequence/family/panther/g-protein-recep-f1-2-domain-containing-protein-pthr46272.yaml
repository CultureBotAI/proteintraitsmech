    text: >-
      This family of proteins includes G-protein coupled receptors (GPCRs) that are classified as orphan receptors, which means their endogenous ligands have not been identified. Members of this family are thought to signal through a G(q/11)-mediated pathway, although the specific biological processes they regulate remain to be elucidated. As GPCRs, they are likely involved in transducing extracellular signals into intracellular responses, a characteristic function of receptors in this superfamily.
