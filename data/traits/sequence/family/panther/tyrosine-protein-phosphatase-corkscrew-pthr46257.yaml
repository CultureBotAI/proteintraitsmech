definitions:
  - kind: GENERAL
    text: >-
      TYROSINE-PROTEIN PHOSPHATASE CORKSCREW — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46257. PANTHER protein class: protein phosphatase, protein modifying enzyme. Members are annotated with the molecular function protein tyrosine phosphatase activity, protein binding. Members participate in peptidyl-tyrosine dephosphorylation, intracellular signal transduction, cell differentiation. Members localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes non-receptor tyrosine phosphatases that play a role in modulating signaling pathways initiated by tyrosine phosphorylated cell surface receptors. They are involved in various cellular processes such as hematopoiesis, development, and cell fate determination. Members of this family contain SH2 domains that can function as auto-inhibitory domains or mediate interactions with other proteins, influencing the phosphatase activity. They are implicated in the regulation of oocyte maturation, neuromuscular junction formation, fluid homeostasis, vulva induction, and the inhibition of dauer formation. Some members are also involved in the negative regulation of mast cell activation and the induction of gene expression in response to specific stimuli.
    source: "InterPro:IPR052123 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
