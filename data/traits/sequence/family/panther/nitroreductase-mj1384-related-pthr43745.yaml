  - kind: GENERAL
    text: >-
      The protein family includes enzymes involved in the processing of precursor peptides into their active forms. Members of the family are necessary for the maturation of bacteriocins, which are ribosomally synthesized antibacterial peptides. Specifically, the family is responsible for the conversion of inactive precursors such as microcin B17 (McbA) and trifolitoxin (TfxA) into their active bactericidal forms. These proteins play a crucial role in bacterial competition and survival by producing compounds that inhibit the growth of competing strains. The family exhibits similarity to nitroreductases, suggesting a potential shared mechanism or evolutionary relationship.
