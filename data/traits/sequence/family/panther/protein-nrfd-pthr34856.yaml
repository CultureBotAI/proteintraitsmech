  - kind: GENERAL
    text: >-
      This family of proteins is involved in electron transfer processes within cellular respiration. Members are typically integral membrane components that interact with the quinone pool, facilitating the transfer of electrons to various terminal electron acceptors such as cytochrome c, menaquinol, tetrathionate, dimethyl sulfoxide (DMSO), and polysulfides. These proteins play a role in anaerobic respiration and are implicated in various reduction reactions, contributing to the energy metabolism of the cell. They may also function in anchoring other subunits of multi-protein complexes to the membrane, thereby assisting in the formation of functional electron transport systems.
