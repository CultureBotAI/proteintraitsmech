      PROTEIN NRFD — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR34856. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
