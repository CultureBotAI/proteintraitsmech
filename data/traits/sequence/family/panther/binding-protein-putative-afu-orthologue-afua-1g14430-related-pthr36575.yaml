  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes known as lytic polysaccharide monooxygenases (LPMOs) that are involved in the oxidative cleavage of polysaccharides. They are characterized by their ability to act on starch substrates by oxidizing the C1 position. These proteins typically contain a carbohydrate-binding module 20 (CBM20) domain, which is responsible for binding to starch, thereby facilitating the enzyme's activity on its substrate. The activity of these enzymes can be inhibited by compounds such as beta-cyclodextrin or amylose, which block access to the active site. While most members of this family are active on starch, there are variants within the family that are reported to be inactive on this substrate.
    source: "InterPro:IPR052282 abstract (LLM-generated, not curator-reviewed)"
