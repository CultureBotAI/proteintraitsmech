identifier: PANTHER:PTHR47421
label: "GS HOMEOBOX 2"
definition: >-
  This family represents the Gsx factors Gsx1 and Gsx2, also known as GSH1/2. These closely related proteins are among the earliest transcription factors expressed in neuronal progenitors of the lateral ganglionic eminence (LGE) in the ventral telencephalon. Both Gsx1 and Gsx2 are expressed in the developing MGE (medial ganglionic eminence) and diencephalon, Gsx2 is expressed at a high level in progenitors of the dorsal LGE (dLGE), whereas Gsx1 is expressed mainly in the MGE and ventral LGE. Gsx1 and Gsx2 control the choice between excitatory and inhibitory cell fates of the interneurons in the developing spinal cord. It has been shown that these factors are essential for striatal and olfactory bulb neurogenesis. Gsx1 also activates the transcription of the GHRH gene and also plays an important role in pituitary development.
