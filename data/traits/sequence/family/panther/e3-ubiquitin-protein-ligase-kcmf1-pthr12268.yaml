  - kind: GENERAL
    text: >-
      The KCMF1 and Dystrophin protein family is involved in a variety of cellular functions related to the maintenance of cellular structure, signaling, and protein degradation. Members of the family such as E3 ubiquitin-protein ligases KCMF1 have intrinsic E3 ubiquitin ligase activity, promoting ubiquitination and regulating signaling pathways. Dystrophin and related proteins anchor the extracellular matrix to the cytoskeleton, play roles in stabilizing the sarcolemma, and are involved in synaptic transmission. Dystrobrevins function as scaffolding proteins, assembling molecules to membranes and regulating gene expression. Utrophins may also anchor the cytoskeleton to the plasma membrane. Overall, the family is crucial for muscle integrity, synaptic function, and the regulation of protein turnover.
    source: "InterPro:IPR050774 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
