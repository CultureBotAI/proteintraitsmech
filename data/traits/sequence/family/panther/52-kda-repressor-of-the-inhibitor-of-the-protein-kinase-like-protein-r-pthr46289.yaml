identifier: PANTHER:PTHR46289
label: "52 KDA REPRESSOR OF THE INHIBITOR OF THE PROTEIN KINASE-LIKE PROTEIN-RELATED"
definition: >-
  This family of proteins acts as upstream regulators of interferon-induced serine/threonine protein kinase R (PKR). They are involved in the modulation of PKR activity by potentially interfering with the inhibitory function of DNAJC3, a known regulator of PKR. Through this interaction, these proteins may play a role in controlling kinase activity and consequently influence cell growth suppression.
