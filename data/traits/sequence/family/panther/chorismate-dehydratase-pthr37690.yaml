identifier: PANTHER:PTHR37690
label: "CHORISMATE DEHYDRATASE"
definition: >-
  Chorismate dehydratase, also known as menaquinone biosynthetic enzyme MqnA, catalyses the dehydration of chorismate into 3-[(1-carboxyvinyl)oxy]benzoate, a step in an alternative pathway for the biosynthesis of menaquinone (MK, vitamin K2). In prokaryotes, menaquinone is an obligatory component of the electron-transfer pathway.
