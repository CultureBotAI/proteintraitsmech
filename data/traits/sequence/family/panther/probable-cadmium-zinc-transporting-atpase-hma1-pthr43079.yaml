identifier: PANTHER:PTHR43079
label: "PROBABLE CADMIUM/ZINC-TRANSPORTING ATPASE HMA1"
definition: >-
  This family of proteins includes P-type ATPases that are involved in the transport of various metal ions across cellular membranes. Members of this family are primarily responsible for the homeostasis of heavy metals, such as zinc, cobalt, nickel, and cadmium, by either importing or exporting these ions to maintain cellular function and protect against oxidative stress. Some proteins in this family are also implicated in the regulation of gene expression related to competence development in bacteria.
