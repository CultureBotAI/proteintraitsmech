identifier: PANTHER:PTHR43849
label: "BLL3936 PROTEIN"
definition: >-
  In some species, the 12-transmembrane spanning (DctM) and 4-transmembrane spanning (DctQ) components of tripartite ATP-independent periplasmic (TRAP)-type transporters are fused. This entry describes such transporters, found in the archaea and in bacteria.
