identifier: PANTHER:PTHR12549
label: "JMJC DOMAIN-CONTAINING HISTONE DEMETHYLATION PROTEIN"
definition: >-
  This entry represents a group of lysine-specific demethylases (LSDs) 3A and 3B. It also describes a group of JmjC-containing proteins, including JHDM2A/B/C (also known as KDM3A/B and JMJD1C), and hairless (HR) proteins. They have histone demethylase (HDM) activity that specifically demethylates 'Lys-9' of histone H3. This entry also includes IBM1 (also known as JMJ25, At3g07610), JMJ24, and JMJ26-29 from Arabidopsis. IBM1 is a histone demethylase directly associated with chromatin of two siRNA biogenesis factors, RDR2 and DCL3.
definition_source: "InterPro:IPR045109 abstract (PANTHER PTHR12549 is a member signature)"
