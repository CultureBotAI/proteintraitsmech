identifier: PANTHER:PTHR16742
label: CYCLICIN
definition: >-
  This family consists of Cylicin-1 and Cylicin-2. The are proteins of the sperm head cytoskeleton. Cylicins might play the architectural role during spermatogenesis. They may be involved in spermatid differentiation.
