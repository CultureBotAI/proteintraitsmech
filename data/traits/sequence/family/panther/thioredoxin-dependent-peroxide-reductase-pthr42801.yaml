      THIOREDOXIN-DEPENDENT PEROXIDE REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42801. PANTHER protein class: peroxidase, oxidoreductase, metabolite interconversion enzyme. Members are annotated with the molecular function oxidoreductase activity, acting on peroxide as acceptor, antioxidant activity, oxidoreductase activity. and participate in cellular response to oxidative stress, cellular response to stimulus, response to oxidative stress. and localise to cytoplasm.
