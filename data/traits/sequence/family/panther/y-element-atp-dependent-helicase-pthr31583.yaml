identifier: PANTHER:PTHR31583
label: "Y' element ATP-dependent helicase"
definition: >-
  This family of proteins includes ATP-dependent helicases that play a role in DNA unwinding. They are implicated in the maintenance of telomeres, specifically through a telomerase-independent mechanism. Members of this family are associated with the yeast subtelomeric Y' repeat, suggesting a specialized function in the genomic regions close to the telomeres of yeast chromosomes.
