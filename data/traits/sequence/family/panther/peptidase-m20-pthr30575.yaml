identifier: PANTHER:PTHR30575
label: "PEPTIDASE M20"
definition: >-
  The peptidase M20 family is composed of enzymes that catalyze the hydrolysis of various substrates, including dipeptides and specific amino acid derivatives. Members of the peptidase M20A subfamily, such as Xaa-Arg dipeptidases, are involved in metabolite repair mechanisms, specifically by hydrolyzing dipeptides with basic amino acids at the C-terminus, which may be by-products of carnosine synthesis. Other members of the peptidase M20 family, like p-aminobenzoyl-glutamate hydrolases, participate in the cleavage of p-aminobenzoyl-glutamate to p-aminobenzoate and glutamate, a process important in folate metabolism. Additionally, some enzymes, such as indole-3-acetyl-aspartic acid hydrolase, exhibit high substrate specificity, hydrolyzing compounds like indole-3-acetyl-aspartate to indole-3-acetic acid. The diverse functions of the peptidase M20 family reflect its role in various biological processes, including amino acid metabolism, peptide degradation, and plant hormone metabolism.
