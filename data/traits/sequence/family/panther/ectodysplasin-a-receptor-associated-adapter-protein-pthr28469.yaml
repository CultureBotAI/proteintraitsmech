identifier: PANTHER:PTHR28469
label: "ECTODYSPLASIN-A RECEPTOR-ASSOCIATED ADAPTER PROTEIN"
definition: >-
  EDARADD is a death domain-containing adaptor molecule for ectodysplasin-A receptor. Mutations of the EDARADD gene has been linked to hypohidrotic ectodermal dysplasia (HED), a rare disorder characterised by deficient development of structures derived from the ectoderm including hair, nails, eccrine glands, and teeth. Homologues are known only from chordates.
