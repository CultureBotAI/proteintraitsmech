  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in various oxidation-reduction processes. Members of this family are characterized by their ability to catalyze reactions involving the transfer of electrons, typically with NAD or NADH as cofactors. The reactions they catalyze are important in the metabolism of sugars and related compounds. Some family members are involved in the biosynthesis of bacterial O antigens by oxidizing specific UDP-sugars, while others may participate in the transformation of different glucosides. The exact physiological substrates and metabolic pathways can vary among the family members, and some enzymes exhibit substrate specificity, not acting on certain UDP-sugars or glucosamines.
