identifier: PANTHER:PTHR23246
label: "NEW-GLUE PROTEIN"
definition: >-
  This family of proteins includes members that are involved in the regulation of actin cytoskeleton dynamics and transcriptional regulation. One protein in this family is known to bind actin, suggesting a role in the modulation of actin filament assembly and disassembly, which is crucial for various cellular processes such as cell shape maintenance, motility, and division. Another member of this family contains a GATA zinc finger domain, indicating a function in DNA binding and transcriptional regulation. GATA zinc finger domain-containing proteins typically interact with GATA consensus sequences in the promoters of target genes, thereby controlling the expression of genes involved in developmental processes and cellular differentiation pathways.
