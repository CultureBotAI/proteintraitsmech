identifier: PANTHER:PTHR28611
label: NORRIN
definition: >-
  NORRIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28611. Members are annotated with the molecular function receptor ligand activity, signaling receptor activator activity, cytokine activity. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, positive regulation of RNA biosynthetic process. and localise to external encapsulating structure, collagen-containing extracellular matrix.
