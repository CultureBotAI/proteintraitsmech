identifier: PANTHER:PTHR43078
label: "UDP-GLUCURONIC ACID DECARBOXYLASE-RELATED"
definition: >-
  This family represents UDP-glucuronic acid decarboxylases (UXS, also known as UDP-glucuronate decarboxylase or UDP-XYL synthase) which catalyse the NAD-dependent decarboxylation of UDP-glucuronic acid to form UDP-xylose, a sugar donor required for the synthesis of glycoproteins, polysaccharides, various metabolites, and oligosaccharides in plants, animals, fungi and bacteria. They are members of the short-chain dehydrogenase/reductase (SDR) superfamily that also include epimerases, dehydratases, and reductases that use nucleotide-activated monosaccharides as substrates and share a Rossmann-fold NAD(P)H/NAD(P)(+) binding domain. This entry also includes UDP-N-acetyl-alpha-D-glucosaminuronate decarboxylase, a bacterial homologue that catalyses the NAD-dependent decarboxylation of UDP-N-acetylglucosaminuronic acid to UDP-N-acetylxylosamine and cannot utilise as substrates UDP-uronates, such as UDP-glucuronic acid and UDP-galacturonic acid.
