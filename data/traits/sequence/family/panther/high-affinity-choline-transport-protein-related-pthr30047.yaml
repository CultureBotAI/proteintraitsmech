identifier: PANTHER:PTHR30047
label: "HIGH-AFFINITY CHOLINE TRANSPORT PROTEIN-RELATED"
definition: >-
  These prokaryotic transport proteins belong to a family known as BCCT (for Betaine/Carnitine/Choline Transporters) and are specific for compounds containing a quaternary nitrogen atom. The BCCT proteins contain 12 transmembrane regions and are energised by proton symport. They contain a conserved region with four tryptophans in their central region.
