  - kind: GENERAL
    text: >-
      The protein family includes autotransporter proteins primarily involved in virulence and host interaction. Autotransporters are characterized by their ability to facilitate their own translocation across the bacterial outer membrane. The family members possess a signal peptide that guides them to the periplasmic space, followed by a C-terminal translocator domain forming a pore in the outer membrane for passenger domain translocation to the cell surface. Functions vary but include serine protease activity, mucinolytic activity, hemagglutination, heme binding, and immunoglobulin A1 cleavage. Some members act as adhesins, mediating bacterial attachment and invasion, or contribute to biofilm formation and autoaggregation. The family plays a significant role in bacterial pathogenicity by facilitating colonization, evasion of host immune responses, and nutrient acquisition.
    source: "InterPro:IPR050909 abstract (LLM-generated, not curator-reviewed)"
