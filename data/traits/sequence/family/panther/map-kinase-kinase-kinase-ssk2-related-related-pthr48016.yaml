  - kind: GENERAL
    text: >-
      The MAP kinase kinase kinase (MAP3K) family is involved in a variety of cellular processes including signal transduction cascades, cell cycle regulation, stress responses, and immune system function. Members of this family activate downstream MAP kinase pathways by phosphorylating MAP2Ks, which in turn phosphorylate MAPKs, leading to the activation of transcription factors such as NF-kappa-B, AP1, and DDIT3. They play roles in plant defense, cytokinesis, cell differentiation, and responses to environmental stimuli like osmotic changes, heat shock, and oxidative stress. Some are involved in specific pathways like the innate immune MAP kinase signaling cascade, cell wall integrity signaling in fungi, and plant organ morphology regulation. Activation mechanisms include autophosphorylation and phosphorylation by other kinases, and some members possess regulatory domains like SAM and RA domains.
    source: "InterPro:IPR050538 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
