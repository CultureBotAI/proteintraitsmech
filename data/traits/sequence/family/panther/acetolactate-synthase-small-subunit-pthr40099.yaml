identifier: PANTHER:PTHR40099
label: "ACETOLACTATE SYNTHASE, SMALL SUBUNIT"
definition: >-
  This entry represents a pair of ACT domains. These domains bind to amino acids and often form regulatory subunits of enzymes. Proteins containing this domain pair are found in bacteria and archaea.
