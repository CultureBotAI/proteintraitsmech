identifier: PANTHER:PTHR11487
label: THIOESTERASE
definition: >-
  This family contains thioesterases involved in non-ribosomal peptide biosynthesis or polyketide biosynthesis, as well as those involved in vertebrate fatty acid biosynthesis (medium-chain S-acyl fatty acid synthase thioesterases, EC:3.1.2.14). Based on domain architecture, they belong to type II (stand-alone, non-integrated) thioesterases (TEII). Based on the structural fold, they belong to the thioesterases of the α/β hydrolase fold. This group of thioesterases is distantly related to the integrated (type I) thioeterases that are intrinsic components of animal fatty acid synthase and in this context serve to terminate chain elongation. Prokaryotic members of this family are involved in non-ribosomal peptide biosynthesis or polyketide biosynthesis. Type I polyketide synthases (PKSs) and non-ribosomal peptide synthetases (NRPSs) are organised into modules, each adding one fatty acid or amino acid substrate to a growing chain. Synthetic intermediates are covalently tethered by thioester linkages to a carrier protein domain in each module. Cyclization and release of the product is catalysed by the type I thioesterase (TEI) which is usually fused C-terminally to the last module (integrated). In most systems, another component, type II thioesterase, represented by this family, is also present. For example, SrfTE is a TEI domain embedded at the downstream end of the final subunit, SrfC, and SrfA-TE is a stand-alone TEII. These enzymes are not essential; however, they are important for effective synthesis, because deletion of the genes leads to a drastic reduction in product yields. TEII enzymes that are associated with the synthetases of the peptide antibiotics surfactin (TEII srf) and bacitracin (TEII bac) were shown to efficiently regenerate miss-acylated thiol groups of 4 
