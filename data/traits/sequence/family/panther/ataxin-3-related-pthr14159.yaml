identifier: PANTHER:PTHR14159
label: ATAXIN-3-RELATED
definition: >-
  This family consists of ataxin-3 (Machado-Joseph disease protein 1) and ataxin-3 homologues. They are deubiquitinating enzymes from peptidase family C86 implicated in protein quality control pathways and transcriptional regulation. Ataxin-3 contains an N-terminal Josephin domain followed by tandem ubiquitin (Ub)-interacting motifs (UIMs) and a polyglutamine stretch. The NMR structure of the Josephin domain of human ataxin-3 (MEROPS identifier C86.001) shows a papain-like fold similar to that found in other deubiquitinases in families C12 and C19. A cysteine peptidase is a proteolytic enzyme that hydrolyses a peptide bond using the thiol group of a cysteine residue as a nucleophile. Hydrolysis involves usually a catalytic triad consisting of the thiol group of the cysteine, the imidazolium ring of a histidine, and a third residue, usually asparagine or aspartic acid, to orientate and activate the imidazolium ring. In only one family of cysteine peptidases, is the role of the general base assigned to a residue other than a histidine: in peptidases from family C89 (acid ceramidase) an arginine is the general base. Cysteine peptidases can be grouped into fourteen different clans, with members of each clan possessing a tertiary fold unique to the clan. Four clans of cysteine peptidases share structural similarities with serine and threonine peptidases and asparagine lyases. From sequence similarities, cysteine peptidases can be clustered into over 80 different families. Clans CF, CM, CN, CO, CP and PD contain only one family. Cysteine peptidases are often active at acidic pH and are therefore confined to acidic environments, such as the animal lysosome or plant vacuole. Cysteine peptidases can be endopeptidases, aminopeptidases, carboxypeptidases, dipeptidyl-peptidases or om
