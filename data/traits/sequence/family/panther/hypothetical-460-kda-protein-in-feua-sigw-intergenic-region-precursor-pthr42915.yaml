identifier: PANTHER:PTHR42915
label: "HYPOTHETICAL 460 KDA PROTEIN IN FEUA-SIGW INTERGENIC REGION [PRECURSOR]"
definition: >-
  NamZ is an exo-beta-N-acetylmuramidase which catalyses an exo-lytic cleavage of beta-1,4-acetylmuramic acid from from the non-reducing ends of peptidoglycan chains and it is a founding member of a new family of glycosidases (CAZy:GH171). NamZ consists of a N-terminal catalytic domain with a Rossmann-like fold (InterPro:IPR048502) and a C-terminal auxiliary α/β domain (InterPro:IPR048503). It is predominantly found in bacteroidetes but also in firmicutes, proteobacteria and actinobacteria.
