  - kind: GENERAL
    text: >-
      This family of proteins includes auxiliary components of large-conductance, voltage and calcium-activated potassium channels (BK alpha). They are involved in modulating the gating properties of these channels, including shifts in voltage dependence of activation and conversion of channel types in various cellular contexts. Some members interact with the KCNMA1 channel, influencing its activation at different voltages and calcium levels. Additionally, the family encompasses proteins that participate in platelet adhesion and aggregation through binding to von Willebrand factor, playing a crucial role in hemostasis. Other members are involved in hormonal cascades, such as the ecdysone-induced gene regulation in insects, and in stabilizing enzymes within the circulatory system.
    source: "InterPro:IPR051432 abstract (LLM-generated, not curator-reviewed)"
