identifier: PANTHER:PTHR28576
label: "PIGGYBAC TRANSPOSABLE ELEMENT-DERIVED PROTEIN 5"
definition: >-
  PiggyBac transposable element-derived protein 5 (PGBD5) is a DNA transposase that mediates PGBD5-induced DNA rearrangements in rhabdoid tumour cells. It can induce genomic rearrangements that inactivate the HPRT1 gene.
