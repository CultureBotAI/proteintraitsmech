identifier: PANTHER:PTHR35322
label: "PROTEIN CPR-5"
definition: >-
  CPR5 is part of the nuclear pore complex (NPC) and plays a role in gating. It is involved in plant growth and immunity. It plays a role in the control of programmed cell death (PCD), acting as a negative regulator of the senescence and chlorotic lesions induced by biotic (e.g., pathogens) and abiotic (e.g., sugars, darkness) agents. CPR5 also promotes cell division and endoduplication through CPR5-CKI (CYCLIN-DEPENDENT KINASE INHIBITOR) signalling pathway.
