identifier: PANTHER:PTHR15911
label: "WW DOMAIN-CONTAINING ADAPTER PROTEIN WITH COILED-COIL"
definition: >-
  WAC interacts with RNF20/40 through its C-terminal coiled-coil region and promotes RNF20/40 s E3 ligase activity for H2B ubiquitination. Drosophila WAC, also known as Wacky, promotes the interaction between TTT and Pontin/Reptin, thereby promoting mTORC1 activity by facilitating mTORC1 dimerization and mTORC1-Rag interaction.
