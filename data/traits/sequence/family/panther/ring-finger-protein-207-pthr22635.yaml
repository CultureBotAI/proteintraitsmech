identifier: PANTHER:PTHR22635
label: "RING FINGER PROTEIN 207"
definition: >-
  RING finger protein 207 (RNF207) is a regulator of cardiac excitation probably by effects on HERG trafficking and localization in a heat shock protein-dependent manner. RNF207 contains a RING-type ring finger and an atypical B box-type ring finger.
