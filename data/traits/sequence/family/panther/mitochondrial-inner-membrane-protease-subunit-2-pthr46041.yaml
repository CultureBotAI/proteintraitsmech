identifier: PANTHER:PTHR46041
label: "MITOCHONDRIAL INNER MEMBRANE PROTEASE SUBUNIT 2"
definition: >-
  This entry represents the mitochondrial inner membrane protease (IMP) subunit 2 (MEROPS identifier S26.012). IMP removes an N-terminal targeting signal from a protein synthesized in the mitochondrial matrix but destined for export across the membrane to the mitochondrial inter-membrane space. IMP is a hetero-oligomer containing two homologous subunits that are both serine endopeptidases (IMP1 and IMP2) plus SOM1. IMP1 and IMP2 have overlapping specificities.
definition_source: "InterPro:IPR037730 abstract (PANTHER PTHR46041 is a member signature)"
