identifier: PANTHER:PTHR11021
label: "SMALL NUCLEAR RIBONUCLEOPROTEIN F  SNRNP-F"
definition: >-
  Small nuclear ribonucleoproteins (snRNPs) are components of major and minor spliceosomes that play an important role in the splicing of cellular pre-mRNAs. snRNPs contain a common core, composed of seven Sm proteins bound to snRNA. Five small snRNPs (U1, U2, U4 and U5) share the Sm heptamer ring composed of SmB/B', SmD1/2/3, SmE, SmF, and SmG (also known as snRNP-G), while U6 snRNP has a heptamer ring consist of seven Sm-like (Lsm) proteins: Lsm2, Lsm3, Lsm4, Lsm5, Lsm6, Lsm7 and Lsm8. This entry includes the snRNP heptamer ring components SmF (small nuclear ribonucleoprotein F), Lsm6 and LSM36B from Arabidopsis.
