identifier: PANTHER:PTHR12586
label: "CDP-DIACYLGLYCEROL--SERINE O-PHOSPHATIDYLTRANSFERASE"
definition: >-
  This entry represents the CDP-alcohol phosphatidyltransferase class-II family, whose members include Pgs1 from S. cerevisiae. Pgs1 is a phosphatidylglycerolphosphate synthase that catalyzes the committed step to the synthesis of of cardiolipin.
