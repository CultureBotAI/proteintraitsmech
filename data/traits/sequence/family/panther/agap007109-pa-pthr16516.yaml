  - kind: GENERAL
    text: >-
      AGAP007109-PA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16516. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
