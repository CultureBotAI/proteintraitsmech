identifier: PANTHER:PTHR22768
label: "DNA REPLICATION COMPLEX GINS PROTEIN PSF3"
definition: >-
  DNA replication in eukaryotes results from a highly coordinated interaction between proteins, often as part of protein complexes, and the DNA template. One of the key early steps leading to DNA replication is formation of the pre-replication complex, or pre-RC. The pre-RC is formed by the sequential binding of the origin recognition complex (ORC), Cdc6 and Cdt1 proteins, and the MCM complex. Activation of the pre-RC into the initiation complex (IC) is achieved via the action of S-phase kinases, eventually leading to the loading of the replication machinery. A novel replication complex, GINS (for Go, Ichi, Nii, and San; meaning 5-1-2-3 in Japanese, after the four related subunits of the complex Sld5, Psf1, Psf2 and Psf3), has been identified. The GINS complex is conserved in eukaryotic cells and is essential for DNA replication. When the DNA replication fork is opened, GINS is required to maintain the association between the MCM and Cdc45 in the large replicator complex. The GINS complex acts as a replicative helicase that unlocks the double-stranded DNA prior to the moving replication fork. Psf2's expression is up regulated in many diseases, especially tumors, and adversely affects prognosis. The GINS complex is essential for initiation of DNA replication in Xenopus egg extracts. This 100kDa stable complex includes Sld5, Psf1, Psf2, and Psf3. Homologues of these components are found also in other eukaryotes. This family of proteins represents the Psf3 component. Electron microscopy of GINS shows that it forms a ring-like structure, reminiscent of the structure of PCNA, the DNA polymerase delta replication clamp. The eukaryotic GINS subunits are homologous. The four subunits of the complex consist of two domains each, termed the α-helical (A) and β-strand (B) domains. Th
