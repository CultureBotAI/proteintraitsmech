identifier: PANTHER:PTHR21039
label: "HISTIDINOL PHOSPHATASE-RELATED"
definition: >-
  This entry represents the histidinol phosphate phosphatase, HisJ of Bacillus subtilis, and related proteins from a number of species within a larger family of phosphatases in the PHP hydrolase family. HisJ catalyses the penultimate step of histidine biosynthesis but shows no homology to the functionally equivalent sequence in Escherichia coli, a domain of the bifunctional HisB protein. Note, however, that many species have two members and that Clostridium perfringens, predicted not to make histidine, has five members of this family; not all members of this family may act on HisJ.
definition_source: "InterPro:IPR010140 abstract (PANTHER PTHR21039 is a member signature)"
