identifier: PANTHER:PTHR12601
label: "EUKARYOTIC TRANSLATION INITIATION FACTOR 3 SUBUNIT  EIF-3"
definition: >-
  This entry includes protein clueless from Drosophila, Clu1 from yeasts and protein CLU from plants. They are involved in proper cytoplasmic distribution of mitochondria. Protein clueless from Drosophila is required for mitochondrial subcellular localisation, interacts genetically with parkin. It is highly expressed in larval neuroblasts, affects mitochondrial localisation and suppresses mitochondrial oxidative damage. Budding yeast Clu1 is a subunit of the eukaryotic translation initiation factor 3 (eIF3). It can influence mitochondrial morphology and distribution.
