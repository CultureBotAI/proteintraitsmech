  - kind: GENERAL
    text: >-
      The GT2 glycosyltransferase family is involved in various biological processes across different organisms. In fungi, members of this family maintain the cell wall's outer surface by synthesizing an unknown extracellular or cell wall polysaccharide, essential for plant-fungal interactions and hyphal growth on solid matrices. They also play roles in infection-related morphogenesis, pathogenesis, stress tolerance, and hyphal hydrophobicity, potentially through the glycosylation of heat shock proteins and other substrates, affecting growth, pathogenicity, and cell wall integrity. Another subset of this family, the glycosyltransferase 47 family, is crucial for heparan-sulfate biosynthesis, adding glucuronic acid and N-acetylglucosamine units to heparan sulfate chains, which is vital for cellular functions in higher organisms.
    source: "InterPro:IPR052427 abstract (LLM-generated, not curator-reviewed)"
