  - kind: GENERAL
    text: >-
      The TPT transporter family is involved in the transport of various substances across cellular membranes. Members of this family function as nucleotide-sugar transporters, facilitating the import of nucleotide-sugars such as GDP-mannose, UDP-glucose, and UDP-galactose into the Golgi lumen or endoplasmic reticulum. These transport processes are essential for the synthesis of glycoproteins, glycolipids, and oligosaccharides, impacting cell wall composition, glycosylation, and other cellular functions. Some family members also transport sugar phosphates like triose phosphates, phosphoenolpyruvate, and glucose-6-phosphate, playing roles in photosynthesis, carbon fixation, and metabolic pathways. The family includes antiporters specific for GDP-fucose, which are involved in fucosylation processes essential for cell signaling and development. Overall, the TPT transporter family is crucial for various biosynthetic pathways and cellular homeostasis.
    source: "InterPro:IPR050186 abstract (LLM-generated, not curator-reviewed)"
