identifier: PANTHER:PTHR12228
label: "TRANSCRIPTION INITIATION FACTOR TFIID 55 KD SUBUNIT-RELATED"
definition: >-
  Transcription initiation factor TFIID subunit 7 (TAF7) is a component of the general purpose transcription factor complex TFIID. This entry includes TAF7 from animals, plants and fungi. The DNA-binding general transcription factor complex TFIID is central to the initiation of DNA-dependent RNA polymerase II transcription. TFIID is the only general transcription initiation factor that bind to the TATA box. The binding of TFIID to the TATA-box is the first step in the formation of a complex able to initiate transcription. TFIID consists of the TATA binding protein (TBP) and 14 TBP-associated factors (TAFs). One copy of each TAF1, TAF2, TAF3, TAF7, TAF8, TAF11, TAF13, two copies of each TAF4, TAF5, TAF6, TAF9, TAF10, TAF12, and three copies of TAF14.
