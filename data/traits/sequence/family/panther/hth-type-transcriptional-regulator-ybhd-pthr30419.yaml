  - kind: GENERAL
    text: >-
      HTH-TYPE TRANSCRIPTIONAL REGULATOR YBHD — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30419. PANTHER protein class: helix-turn-helix transcription factor. Members participate in regulation of DNA-templated transcription. Members localise to cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional regulators that typically contain a helix-turn-helix (HTH) motif, which is indicative of their role in DNA binding and regulation of gene expression. Members of this family are involved in various cellular processes, including the catabolism of specific compounds such as protocatechuate and sodium dodecyl sulfate (SDS), the regulation of operons related to nitrogen metabolism, malolactic fermentation, and the response to sulfur sources. They can act as activators or repressors of transcription, often responding to environmental cues or the presence of specific inducers. Some members are also known to regulate their own expression. The proteins are part of the LysR transcriptional regulatory family, which is one of the largest families of bacterial transcriptional regulators.
    source: "InterPro:IPR050950 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
