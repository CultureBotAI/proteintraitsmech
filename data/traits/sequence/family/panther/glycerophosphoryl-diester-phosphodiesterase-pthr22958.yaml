identifier: PANTHER:PTHR22958
label: "GLYCEROPHOSPHORYL DIESTER PHOSPHODIESTERASE"
definition: >-
  This family of proteins includes enzymes with glycerophosphodiester phosphodiesterase activity, which are involved in the metabolism of glycerophospholipids. They hydrolyze glycerophosphocholine to glycerol-phosphate and choline, a process important for the synthesis of phosphatidylcholine and the utilization of glycerophosphocholine as a phosphate source. Some family members may also hydrolyze other glycerophosphodiesters, such as glycerophosphoinositol and glycerophosphoethanolamine. Additionally, certain proteins within this family are implicated in the regulation of skeletal muscle differentiation, independent of their enzymatic activity.
