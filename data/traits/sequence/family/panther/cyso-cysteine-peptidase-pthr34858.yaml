identifier: PANTHER:PTHR34858
label: "CYSO-CYSTEINE PEPTIDASE"
definition: >-
  The protein family encompasses a variety of proteases with distinct functions related to protein modification and processing. Members of the family are involved in the assembly and maturation of viral components, such as the tail tip complex in bacteriophages, indicating a role in viral replication and assembly. Other members display desampylase activity, regulating protein modification by cleaving small archaeal modifier proteins from conjugates, thereby controlling the availability of these modifiers for further protein tagging. Additionally, some proteases in the family are responsible for hydrolyzing specific adducts, such as the CysO-cysteine adduct, to release essential amino acids like L-cysteine. Collectively, the family's activities are crucial for various biological processes, including viral assembly, post-translational modification regulation, and amino acid recycling.
