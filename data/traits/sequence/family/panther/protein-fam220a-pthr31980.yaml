identifier: PANTHER:PTHR31980
label: "PROTEIN FAM220A"
definition: >-
  FAM220A, also known as SIPAR, inhibits STAT3 activity by accelerating its dephosphorylation. STAT3 is a member of the STAT family (signal transducers and activators of transcription) that plays an esential role in cell growth and differentiation.
