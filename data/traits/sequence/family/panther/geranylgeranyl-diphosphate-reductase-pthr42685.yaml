identifier: PANTHER:PTHR42685
label: "GERANYLGERANYL DIPHOSPHATE REDUCTASE"
definition: >-
  The geranylgeranyl reductase family is involved in the biosynthesis of archaeal membrane lipids and chlorophyll synthesis. Members of this family catalyze the reduction of unsaturated archaeols into saturated archaeols, forming archaetidic acid from digeranylgeranylglycerophospholipids via hydrogenation of isoprenoid chains. Some members reduce geranylgeranyl diphosphate to phytyl diphosphate, providing phytol for tocopherol and chlorophyll synthesis. Others are involved in the reduction of menaquinone in mycobacteria or the hydrogenation of geranylgeraniol during bacteriochlorophyll biosynthesis.
