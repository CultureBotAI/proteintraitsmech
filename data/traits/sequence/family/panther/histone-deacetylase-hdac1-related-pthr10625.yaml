identifier: PANTHER:PTHR10625
label: "HISTONE DEACETYLASE HDAC1-RELATED"
definition: >-
  HISTONE DEACETYLASE HDAC1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10625. Members are annotated with the molecular function histone deacetylase activity, hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides. Members participate in epigenetic regulation of gene expression, protein-DNA complex organization.
