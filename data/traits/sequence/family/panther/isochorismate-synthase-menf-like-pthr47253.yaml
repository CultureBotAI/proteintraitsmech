identifier: PANTHER:PTHR47253
label: "Isochorismate synthase MenF-like"
definition: >-
  This entry represents a group of Isochorismate synthases, including MenF from bacteria and AtIcs1/2 from Arabidopsis. MenF catalyses the conversion of chorismate to isochorismate, the initial step of menaquinone biosynthesis. ICS1 and ICS2 are targeted to the plastids and are involved in the salicylic acid (SA) biosynthesis.
