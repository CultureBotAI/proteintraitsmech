identifier: PANTHER:PTHR24113
label: "RAN GTPASE-ACTIVATING PROTEIN 1"
definition: >-
  Ran GTPase-activating protein (RanGap) is a GTPase activator for the nuclear Ras-related regulatory protein Ran, converting it to the putatively inactive GDP-bound state. RanGap is an antagonist of RCC1, a nuclear protein that converts RanGDP to RanGTP and keep Ran in an active state. Together, they control Ran dependent transport between the nucleus and cytoplasm. In human, RanGap is regulated by sumoylation and phosphorylation through the cell cycle.
