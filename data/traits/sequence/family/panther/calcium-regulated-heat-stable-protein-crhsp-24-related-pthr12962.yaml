definitions:
  - kind: GENERAL
    text: >-
      CALCIUM-REGULATED HEAT STABLE PROTEIN CRHSP-24-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12962. PANTHER protein class: RNA metabolism protein. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding, mRNA 3'-UTR binding. and participate in regulation of mRNA stability, regulation of mRNA catabolic process, regulation of macromolecule metabolic process. and localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes RNA-binding factors that are involved in the regulation of mRNA stability and the synthesis of histone variants. Members of this family have been shown to bind specifically to mRNA, including the 3'-UTR ends of histone H1 and H3.3 mRNAs, which encompasses the polyadenylation signal. This binding activity suggests a role in the post-transcriptional regulation of gene expression. Some members are also known to bind single-stranded DNA in vitro. The functions of these proteins are crucial in processes such as the negative regulation of histone variant synthesis, particularly in the context of brain development. The calcium-regulated members of this family are responsive to changes in intracellular calcium levels, which may influence their interaction with target mRNAs.
    source: "InterPro:IPR052069 abstract (LLM-generated, not curator-reviewed)"
