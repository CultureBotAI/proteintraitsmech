identifier: PANTHER:PTHR38102
label: "PERIPLASMIC CHAPERONE SPY"
definition: >-
  This family of proteins includes periplasmic components involved in bacterial stress response and protein quality control. Members act as auxiliary proteins in the Cpx two-component envelope stress response system, modulating the response to various inducers. They bind the periplasmic domain of the sensor histidine kinase CpxA, inhibiting its kinase activity and thus the induction of the stress response in the absence of inducers. Additionally, these proteins exhibit chaperone activity, aiding in the refolding of misfolded proteins and preventing protein aggregation in the periplasm. They can also enhance the stability of periplasmic proteins and protect against inactivation by antimicrobial compounds such as tannins. The family is characterized by a cradle-shaped structure that may interact with substrates and other periplasmic components.
