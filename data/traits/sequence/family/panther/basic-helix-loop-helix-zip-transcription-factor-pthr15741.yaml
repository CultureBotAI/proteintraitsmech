definitions:
  - kind: GENERAL
    text: >-
      BASIC HELIX-LOOP-HELIX ZIP TRANSCRIPTION FACTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15741. PANTHER protein class: DNA-binding transcription factor. Members are annotated with the molecular function cis-regulatory region sequence-specific DNA binding, RNA polymerase II cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family in question is involved in transcriptional regulation, with members forming sequence-specific DNA-binding complexes that recognize the E box motif 5'-CACGTG-3'. These complexes can act as transcriptional repressors or activators, depending on the context and interacting partners. Family members are implicated in various biological processes including glycolytic gene regulation, fat oxidation, mitochondrial respiration, lifespan maintenance, fertility, body size regulation, autophagy, cell migration, and stress responses. They play roles in modulating longevity in response to multiple signaling pathways and environmental factors, and in the transcriptional regulation of genes encoding extracellular matrix components. Some members are also involved in host-pathogen interactions, influencing the infection by certain pathogens.
    source: "InterPro:IPR052207 abstract (LLM-generated, not curator-reviewed)"
