identifier: PANTHER:PTHR15932
label: "UBIQUITIN INTERACTION MOTIF-CONTAINING PROTEIN 1"
definition: >-
  RAP80 is responsible for recruitment of the BRCA1-A complex (BRCA1, BARD1, BRCC36, Abraxas, and RAP80) to sites of DNA damage by binding Lys63-linked Ub chains through tandem α-helical Ub interacting motifs. RAP80 also contains an N-terminal SUMO interacting motif (SIM) that has been shown to specifically bind the SUMO-2 isoform.
