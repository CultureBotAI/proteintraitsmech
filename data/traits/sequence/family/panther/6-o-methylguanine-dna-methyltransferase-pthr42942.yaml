identifier: PANTHER:PTHR42942
label: "6-O-METHYLGUANINE DNA METHYLTRANSFERASE"
definition: >-
  The ATL subfamily of the MGMT family is involved in the recognition and repair of DNA damage. Members of this family bind to DNA containing O(6)-alkylguanine adducts, with a preference for larger alkyl groups. They facilitate the repair process by flipping the damaged base out of the DNA helix into an extrahelical position, which is then accessible to nucleotide excision repair (NER) proteins. The ATL proteins play a role in directing the repair pathway choice, with smaller adducts being processed by the global genome repair pathway and bulkier lesions stalling transcription and being directed to transcription-coupled repair. Some members also bind to AP sites and prevent methyl-directed mismatch repair of O(6)-alkylguanine:T mispairs for larger alkyl groups.
