identifier: PANTHER:PTHR46143
label: CALPAIN-7
definition: >-
  This entry represents the PalB/RIM13 subfamily of the peptidase C2 family and calpain proteins found in eukaryotes. The Calpain-like protease palB/RIM13 proteins are involved in the proteolytic cleavage of transcription factors in response to alkaline ambient pH. These proteins are crucial for the initial proteolytic cleavage within the signalling protease box of transcription factors such as pacC and pacc-1. In Aspergillus species, this cleavage results in an intermediate protein that undergoes further processing. Additionally, members of this group are implicated in virulence, particularly in invasive pulmonary aspergillosis. These proteins belong to the peptidase C2 group, specifically the PalB/RIM13 subfamily.
