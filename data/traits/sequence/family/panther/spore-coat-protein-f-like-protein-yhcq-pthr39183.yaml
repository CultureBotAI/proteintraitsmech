identifier: PANTHER:PTHR39183
label: "SPORE COAT PROTEIN F-LIKE PROTEIN YHCQ"
definition: >-
  The Coat F proteins contribute to the Bacillales spore coat. They occur multiple times in the genomes in which they are found. Bacillus subtilis endospore protein coats protect them and may play a role in their germination. Spore coat protein F, on the outer surface of the endospore, is one of a suite of proteins that could be used to differentiate between members of the Bacillus genus.
