identifier: PANTHER:PTHR39319
label: "SI:DKEY-256H2.1"
definition: >-
  This family of proteins inckudes Peptide-N(4)-(N-acetyl-beta-D-glucosaminyl)asparagine amidase F (PNGF), which is involved in the enzymatic process of detaching glycans from glycoproteins. The enzymatic activity is specific to glycosylated asparagine residues that are flanked by polypeptide chains. The cleavage mechanism facilitated by these enzymes ensures the removal of the entire glycan structure, which is essential for various biological processes including protein degradation, quality control, and cellular signalling.
