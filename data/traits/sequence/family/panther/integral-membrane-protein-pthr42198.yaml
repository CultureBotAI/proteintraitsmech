identifier: PANTHER:PTHR42198
label: "INTEGRAL MEMBRANE PROTEIN"
definition: >-
  This entry represents uncharacterised proteins from archaea, including protein MJ0935 from Methanocaldococcus jannaschii. These proteins are related to the eukaryote integral membrane proteins EMC3 and TMCO1-like. The structure has been solved for protein MJ0480 also from M. jannaschii, which has four transmembrane helices. It has been suggested that archaeal proteins may function as insertases of the archaeal plasma membrane. They may interact with their substrates in a groove-like structure at an amphiphilic protein-lipid interface and allow the transmembrane segments of the substrate to slide into the lipid bilayer.
definition_source: "InterPro:IPR038978 abstract (PANTHER PTHR42198 is a member signature)"
