  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes including cell division, infection mechanisms, and cellular adhesion. Members of this family play roles in organizing microtubule structures, facilitating mitotic exit, and shaping membranes during cell division or sporulation. Some proteins within this family are also implicated in pathogenic infection, acting as adhesins that enhance bacterial adherence to host cells. They may participate in signaling pathways that coordinate cellular and nuclear division, and their activity can be regulated in a host-dependent manner.
