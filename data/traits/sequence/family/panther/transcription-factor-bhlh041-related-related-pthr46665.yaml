identifier: PANTHER:PTHR46665
label: "TRANSCRIPTION FACTOR BHLH041-RELATED-RELATED"
definition: >-
  This entry represents a group of plant putative transcription factors, including bHLH92/bHLH041 from Arabidopsis and bHLH148 from Oryza sativa subsp. japonica. They contain the basic helix-loop-helix (bHLH) domain. bHLH148 may act on an initial response of jasmonate-regulated gene expression toward drought tolerance as part of a BHLH148-TIFY11D/JAZ12-COI1A complex.
