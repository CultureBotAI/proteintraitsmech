identifier: PANTHER:PTHR28436
label: "MITOCHONDRIAL IMPORT RECEPTOR SUBUNIT TOM5 HOMOLOG"
definition: >-
  In budding yeasts, Tom5 forms part of the pre-protein translocase complex of the outer mitochondrial membrane (TOM complex). This family is found in metazoans. Proteins in this family are homologues of yeast Tom5 and are approximately 50 amino acids in length.
