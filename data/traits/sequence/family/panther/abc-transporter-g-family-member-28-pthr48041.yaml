  - kind: GENERAL
    text: >-
      The ABCG family of ATP-binding cassette (ABC) transporters is characterized by its broad substrate specificity and involvement in various biological processes across different organisms. Members of this family actively extrude a wide range of compounds, including physiological metabolites, dietary toxins, and xenobiotics, often in an ATP-dependent manner. They play crucial roles in lipid transport, sterol homeostasis, porphyrin homeostasis, and the cellular efflux of heme. Some members are involved in the transport of pigment precursors in eye color determination, while others participate in plant defense responses, arbuscular mycorrhizal symbiosis, and abiotic stress responses in plants. Additionally, certain ABCG transporters are implicated in the exclusion of xenobiotics from the brain and contribute to multidrug resistance in cells. The family also includes transporters that mediate the export of signaling molecules like abscisic acid in plants and are essential for processes such as pollen fitness and vascular development.
    source: "InterPro:IPR050352 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
