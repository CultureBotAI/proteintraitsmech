identifier: PANTHER:PTHR43077
label: "TRANSPORT PERMEASE YVFS-RELATED"
definition: >-
  This family of proteins includes components of the type VII secretion system (Ess) and ABC transporter permeases. The Ess components, such as EsaA, are involved in forming a secretion platform across the cytoplasmic membrane, working in conjunction with other proteins like EssB, EssC, and EssE to facilitate the secretion process. The ABC transporter permeases, such as DrrB, are part of the ABC transporter complex and are likely responsible for the translocation of substrates, including antibiotics like doxorubicin, across the membrane, contributing to antibiotic resistance.
