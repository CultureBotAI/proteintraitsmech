identifier: PANTHER:PTHR46326
label: "ZINC FINGER PROTEIN ZAT1-RELATED"
definition: >-
  This entry represents a group of plant zinc finger proteins, including ZAT1/4/9 from Arabidopsis. They may regulate the maturation of the outermost cells of the root cap in Arabidopsis. Overexpression of ZAT1 has been shown to induce the ectopic expression of PUTATIVE ASPARTIC PROTEASE3 involved in the programmed cell death. ZAT1 possesses two conserved EAR motifs, the second EAR motif is essential for the growth inhibition by ZAT1.
