identifier: PANTHER:PTHR31442
label: "HOMEODOMAIN-LIKE SUPERFAMILY PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant Myb domain proteins, including LUX, BOA and MYBC1 from Arabidopsis. LUX and BOA are transcription factors and critical components of the regulatory circuit of the circadian clock. LUX also binds to ELF3 and associates with ELF4 in a diurnal complex which is required for the expression of the growth-promoting transcription factors PIF4 and PIF5 and subsequent hypocotyl growth in the early evening. MYBC1 has been shown to negatively regulate freezing tolerance in Arabidopsis.
definition_source: "InterPro:IPR044841 abstract (PANTHER PTHR31442 is a member signature)"
