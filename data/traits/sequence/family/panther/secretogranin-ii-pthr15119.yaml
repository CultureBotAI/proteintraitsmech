identifier: PANTHER:PTHR15119
label: "SECRETOGRANIN II"
definition: >-
  Secretogranin-2 (ScgII), a neuroendocrine secretory granule protein, is almost exclusively found in large dense core vesicles of a wide variety of endocrine and neuronal tissues. It belongs to the chromogranin family, whose members are acidic proteins present in the secretory granules of a wide variety of endocrine and neuro-endocrine cells. ScgII has been linked to several neurological diseases, like Alzheimer's disease, Parkinson's disease, epilepsy, stroke or ischemia and and diabetic retinopathy. ScgII also plays a role in visual system plasticity by modulating a range of neurotransmitters and neuropeptides. Secretoneurin (SN), a 33-amino acid neuropeptide derived from secretogranin II, acts as an angiogenic cytokine and chemoattractant for eosinophils. Manserin is another peptide derived from secretogranin II.
definition_source: "InterPro:IPR038858 abstract (PANTHER PTHR15119 is a member signature)"
