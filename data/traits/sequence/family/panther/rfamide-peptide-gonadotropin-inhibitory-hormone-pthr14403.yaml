identifier: PANTHER:PTHR14403
label: "RFAMIDE PEPTIDE GONADOTROPIN INHIBITORY HORMONE"
definition: >-
  This family includes both FMRFamide-related peptides and growth hormone-releasing peptides. FMRFamide-related peptides are neurotransmitters, hormone-like substances and tumor suppressor peptides. Neuropeptide RFRP-1 acts as a potent negative regulator of gonadotropin synthesis and secretion. Neuropeptides NPSF and NPVF efficiently inhibit forskolin-induced production of cAMP, but RFRP-2 shows no inhibitory activity. Neuropeptide NPVF blocks morphine-induced analgesia. FMRFamide-related peptides may act in concert with kisspeptin, through opposing affects, to regulate the activity of gonadotropin-releasing hormone (GnRH) neurons across the seasons, leading to an annual change in fertility and the cyclical seasonal transition from non-breeding to breeding season.
definition_source: "InterPro:IPR026297 abstract (PANTHER PTHR14403 is a member signature)"
