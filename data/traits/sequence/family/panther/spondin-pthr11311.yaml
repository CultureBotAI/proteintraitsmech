  - kind: GENERAL
    text: >-
      The Spondin/Thrombospondin type-1 domain-containing family is involved in cell adhesion, axon guidance, and the innate immune response. Members of the family promote attachment and neurite outgrowth in spinal cord and sensory neurons, contributing to axonal growth and guidance in the central and peripheral nervous systems. Some members also function as opsonins for macrophage phagocytosis of bacteria, binding to microbial components such as lipopolysaccharide, thus playing a role in the immune response. Additionally, they are involved in angiogenesis, actin cytoskeleton rearrangement, and may influence the expression of genes like notch1b, which is important for embryonic development and the function of the glomerular filtration barrier.
    source: "InterPro:IPR051418 abstract (LLM-generated, not curator-reviewed)"
