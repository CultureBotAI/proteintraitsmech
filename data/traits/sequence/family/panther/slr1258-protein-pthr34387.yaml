identifier: PANTHER:PTHR34387
label: "SLR1258 PROTEIN"
definition: >-
  This family of proteins includes both characterised and uncharacterised members mainly found in bacteria. The characterised members are known as 26 kDa periplasmic immunogenic proteins, which are likely involved in the immune response, possibly as antigens recognised by the host's immune system during infection. The uncharacterised proteins, denoted as YggE in various bacterial species, have not been functionally described.
