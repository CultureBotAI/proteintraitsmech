identifier: PANTHER:PTHR47190
label: "DEHYDROGENASE, PUTATIVE-RELATED"
definition: >-
  This family of proteins is involved in the degradation of plant cell wall components, specifically lignin and cellulose. Members of this family have the ability to oxidize cellobiose, a disaccharide derived from the hydrolysis of cellulose, converting it into cellobionolactone. The enzymatic activity of these proteins plays a crucial role in the biological process of lignocellulose breakdown, which is fundamental for carbon cycling in the environment. The family is part of the GMC oxidoreductase superfamily, which is characterized by a wide range of oxidoreductase activities.
