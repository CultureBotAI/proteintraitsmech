identifier: PANTHER:PTHR34388
label: "DNA POLYMERASE III SUBUNIT DELTA"
definition: >-
  This family of proteins includes subunits of DNA polymerase III, specifically the delta subunit, which plays a crucial role in bacterial DNA replication. The delta subunit is involved in the assembly of the DNA polymerase III holoenzyme by interacting with other subunits to facilitate the loading of the beta sliding clamp onto the DNA. This process is essential for the replication machinery to achieve high processivity during DNA synthesis. The delta subunit's interaction with the gamma subunit is particularly important for transferring the beta subunit onto the DNA. Additionally, these proteins may exhibit 3' to 5' exonuclease activity, contributing to the proofreading function of the polymerase. DNA polymerase III delta (holA, EC:2.7.7.7 ) and delta prime (holB) subunits are distinct proteins encoded by separate genes. The delta prime subunit (holB) exhibits sequence homology to the tau and gamma subunits (dnaX), but the delta subunit (holA) does not demonstrate this same homology with dnaX. The delta, delta prime, gamma, chi and psi subunits form the gamma complex sub-assembly of DNA polymerase III holoenzyme, which couples ATP to assemble the ring-shaped beta subunit around DNA forming a DNA sliding clamp. Both delta and delta prime are monomeric in their native state, and they bind each other tightly to form a 1:1 complex. Neither delta nor delta prime alone binds tightly to the gamma subunit.
definition_source: "InterPro:IPR005790 abstract (PANTHER PTHR34388 is a member signature)"
