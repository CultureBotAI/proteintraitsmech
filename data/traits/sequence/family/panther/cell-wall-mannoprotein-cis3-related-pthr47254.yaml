identifier: PANTHER:PTHR47254
label: "CELL WALL MANNOPROTEIN CIS3-RELATED"
definition: >-
  The PIR protein family includes cell wall mannoproteins that are essential components of the outer cell wall layer in yeast. Members of the family play a crucial role in maintaining cell wall stability and integrity, which is vital for optimal yeast growth. They are necessary for the yeast's resistance to various antifungal agents and cell wall-perturbing substances, as well as for tolerance to heat shock. Some family members may also be involved in meiosis and sporulation processes. The defining feature of these proteins is the presence of PIR repeats, which are necessary for the covalent linkage of the proteins to the cell wall, although the number of repeats can vary among different yeast strains.
