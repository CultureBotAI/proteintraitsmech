identifier: PANTHER:PTHR46750
label: "KUNITZ-TYPE PROTEASE INHIBITOR 1"
definition: >-
  KUNITZ-TYPE PROTEASE INHIBITOR 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46750. PANTHER protein class: protease inhibitor. Members are annotated with the molecular function serine-type endopeptidase inhibitor activity, enzyme inhibitor activity, peptidase regulator activity. Members participate in epidermis development, cellular component organization, extracellular structure organization. Members localise to cell periphery, membrane, plasma membrane.
