identifier: PANTHER:PTHR16524
label: "CELL DEATH REGULATOR AVEN"
definition: >-
  Aven represents a new class of cell death regulator. It inhibits the proteolytic activation of caspases in a cell-free extract and suppresses apoptosis induced by Apaf-1 plus caspase-9.
