identifier: PANTHER:PTHR10872
label: "SH2B ADAPTER PROTEIN"
definition: >-
  SH2B family contains three members of adaptor proteins: SH2B1, 2 and 3. Typical SH2B proteins contain a SH2 (Src homology 2) and a PH (pleckstrin homology) domain. They serve as adaptors involved in signalling by the receptors for growth factors, such as insulin-like growth factor 1, platelet-derived growth factor and nerve growth factor.
