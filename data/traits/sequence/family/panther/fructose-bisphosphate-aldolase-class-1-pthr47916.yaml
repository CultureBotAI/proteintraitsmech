  - kind: GENERAL
    text: >-
      The DeoC/FbaB aldolase family is involved in various metabolic processes, including the degradation of signaling molecules and the biosynthesis of aromatic amino acids. Members of this family catalyze aldol condensation and transaldol reactions, playing key roles in pathways such as the degradation of phospho-AI-2, which terminates the induction of the lsr operon and closes the AI-2 signaling cycle. This results in the formation of glycerone phosphate and acetyl-CoA. Additionally, some members are involved in an alternative pathway for the biosynthesis of 3-dehydroquinate, a precursor in the canonical pathway for aromatic amino acid biosynthesis. The family also includes enzymes that catalyze the reversible aldol condensation/cleavage of fructose-bisphosphate, as well as other aldolase activities related to carbohydrate metabolism.
    source: "InterPro:IPR050456 abstract (LLM-generated, not curator-reviewed)"
