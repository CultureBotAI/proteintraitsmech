identifier: PANTHER:PTHR15545
label: "PDZ DOMAIN CONTAINING RING FINGER PROTEIN 3, 4"
definition: >-
  This family of proteins includes E3 ubiquitin-protein ligases that play a role in protein ubiquitination, a post-translational modification essential for various cellular processes. Members of this family are involved in regulating the surface level of specific membrane proteins, such as MUSK, by mediating their ubiquitination and subsequent endocytosis and lysosomal degradation. This action is crucial for processes like myogenic differentiation. The family features a conserved RING-type zinc finger domain, which is necessary for their E3 ligase activity. Some members are also implicated in modulating ion channel currents by affecting the channel's plasma membrane presence.
