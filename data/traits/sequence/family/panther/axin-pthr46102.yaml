identifier: PANTHER:PTHR46102
label: AXIN
definition: >-
  This entry includes Axin-1 and Axin-2 from vertebrates and related proteins from invertebrates. Axin is a central component of the canonical Wnt signaling pathway that interacts with the adenomatous polyposis coli protein APC and the kinase GSK3beta to downregulate the effector beta-catenin. Axin-1 (axis inhibition protein 1) is a scaffold protein that is involved in many signalling pathways, including the Wnt, transforming growth factor-beta, MAP kinase pathways, as well as p53 activation cascades. It controls many biological processes ranging from sugar intake, cell proliferation, and organ development to cell death. Mutations in Axin-1 gene cause hepatocellular carcinoma (HCC), a primary malignant neoplasm of epithelial liver cells, and caudal duplication anomaly (CADUA), a condition characterised by the occurrence of duplications of different organs in the caudal region. Like its mammalian counterpart, Drosophila Axin homologue, Daxin, acts as a negative regulator of wg/Wnt signaling. In C. elegans AXL-1 functions redundantly with its ortholog, PRY-1, in negatively regulating BAR-1/beta-catenin signaling in the developing vulva and the Q neuroblast lineage. AXL-1 also functions independently of PRY-1 in negatively regulating canonical Wnt signaling during excretory cell development.
