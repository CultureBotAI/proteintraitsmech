identifier: PANTHER:PTHR48477
label: "PHOSPHATE TRANSPORTER PHO1"
definition: >-
  PHO1 is characterised by its role in inorganic phosphate (Pi) transport and homeostasis in plants. It is involved in various aspects of Pi handling, including sensing Pi starvation, exporting Pi out of cells, and transferring Pi between different plant tissues such as roots and shoots. It contains an SPX domain that binds inositol polyphosphate signaling molecules, which may be involved in sensing Pi levels, and an EXS domain essential for Pi efflux and proper cellular localisation. PHO1 contributes to the regulation of Pi starvation responses and may interact with transcription factors through its SPX domain. Overall, PHO1 plays a crucial role in maintaining phosphate balance within the plant, which is vital for various physiological processes including growth and stress responses.
definition_source: "InterPro:IPR052486 abstract (PANTHER PTHR48477 is a member signature)"
