identifier: PANTHER:PTHR39957
label: AT09846P1-RELATED
definition: >-
  This family includes a group of proteins from arthropods that contain the single domain Von Willebrand factor type C ( ), including Protein Vago from Drosophila melanogaster, which is likely to play a significant role in the immune response against viral infections, and the toxin U-scoloptoxin(16)-Ssd1a from Scolopendra dehaani.
