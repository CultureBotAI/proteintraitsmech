identifier: PANTHER:PTHR30287
label: "MEMBRANE COMPONENT OF PREDICTED ABC SUPERFAMILY METABOLITE UPTAKE TRANSPORTER"
definition: >-
  This entry represents a group of bacterial membrane proteins that may be part of the ABC transporter, including the uncharacterised YbbP from Escherichia coli. Rv0987 from Mycobacterium tuberculosis, also included in this entry, is likely part of an ABC transporter complex involved in host cell binding either through secretion of an adherence factor or through maintaining the architecture and integrity of the mycobacterial cell envelope. It could be required for host endothelial-cell invasion and/or intracellular survival.
