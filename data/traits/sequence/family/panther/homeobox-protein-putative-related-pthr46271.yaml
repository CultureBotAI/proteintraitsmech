identifier: PANTHER:PTHR46271
label: "HOMEOBOX PROTEIN, PUTATIVE-RELATED"
definition: >-
  This entry includes a group of homeobox proteins, including RAX and RAX2. RAX is a transcription factor that plays a critical role in the eye and forebrain development of vertebrate species. It is involved in the establishment of the retina. Mutations in the RAX gene cause microphthalmia, isolated 3, which is a disorder of eye formation, ranging from small size of a single eye to complete bilateral absence of ocular tissues. Homeobox protein ceh-8 is the RAX orthologue from C. elegans required for cell specification of the RIA interneurons. Retina and anterior neural fold homeobox protein 2 (RAX2) is known to bind to the Ret-1 and Bat-1 element within the rhodopsin promoter and may be involved in modulating the expression of photoreceptor specific genes. This entry also includes ceh-8 from Caenorhabditis elegans required for cell specification of the RIA interneurons.
definition_source: "InterPro:IPR043562 abstract (PANTHER PTHR46271 is a member signature)"
