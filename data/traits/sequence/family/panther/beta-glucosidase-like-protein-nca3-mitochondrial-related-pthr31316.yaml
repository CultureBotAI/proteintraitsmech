identifier: PANTHER:PTHR31316
label: "BETA-GLUCOSIDASE-LIKE PROTEIN NCA3, MITOCHONDRIAL-RELATED"
definition: >-
  The SUN family proteins are secreted beta-glucosidases involved in various cellular processes including aging, oxidative stress response, mitochondrial biogenesis, cytokinesis, cell wall biogenesis, and septation. They play roles in the host-pathogen interaction, adhesion to host tissue, and biofilm formation. Some family members are involved in mitophagy under nitrogen starvation, cell wall remodeling under different environmental conditions, and cell sensitivity to boric acid. They exhibit hydrolytic activity on linear (1->3)-beta-D-glucans and are implicated in the maintenance of kinase activity and mitochondrial expression of ATP synthase subunits.
