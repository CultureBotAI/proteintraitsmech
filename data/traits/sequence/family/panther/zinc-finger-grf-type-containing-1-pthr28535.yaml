definitions:
  - kind: GENERAL
    text: >-
      ZINC FINGER GRF-TYPE CONTAINING 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28535. Members participate in double-strand break repair. Members localise to nucleus, chromosome, site of double-strand break.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes 5'-3' DNA helicases that are involved in DNA repair processes, particularly in the repair of replication-blocking DNA lesions. They are known to be recruited to sites of DNA damage and enhance homologous recombination (HR) by directly stimulating the strand exchange activity of RAD51. These proteins facilitate recombinational repair post RAD51 recruitment and are not essential for RAD51 loading at damage sites. They also enhance HR by upregulating EXO1-mediated DNA end resection at double-strand breaks. Additionally, they are necessary for the recruitment of RPA2, a replication protein, to DNA damage sites. These helicases contribute to the initiation of the G2/M checkpoint in the cell cycle but are not involved in maintaining it. They possess enzymatic activities that promote the branch migration of Holliday junctions and the dissociation of D-loops and DNA flaps, which are critical steps in DNA repair and recombination.
    source: "InterPro:IPR052800 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
