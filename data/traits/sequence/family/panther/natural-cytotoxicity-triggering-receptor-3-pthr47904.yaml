identifier: PANTHER:PTHR47904
label: "NATURAL CYTOTOXICITY TRIGGERING RECEPTOR 3"
definition: >-
  NCR3, also known as NKp30, is a natural cytotoxicity receptor expressed on natural killer (NK) cells. It is critically involved in direct cytotoxicity against various tumour cells and directs both maturation and selective killing of dendritic cells. In humans the cell-encoded ligands of NKp30 have been reported, such as heparan sulphates, Galectin-3, the intracellular protein BCL2-associated athanogene 6 (BAG-6) and the TM cell surface protein B7H6. Several alternative ligands have been reported for NKp30, including pp65 from CMV 11, HA from poxviruses including Vaccinia virus, Duffy binding-ike domain 1alpha from Plasmodium falciparum, and beta-1,3-glucans from the pathogenic fungi Cryptococcus neoformans and Candida albicans.
definition_source: "InterPro:IPR043226 abstract (PANTHER PTHR47904 is a member signature)"
