  - kind: GENERAL
    text: >-
      The Serine-Aspartate Repeat-Containing Protein (SDr) family includes cell surface-associated calcium-binding proteins that play a crucial role in bacterial adhesion and pathogenesis. Members of the SDr family mediate interactions with extracellular matrix components, such as host NRXN1, to promote bacterial adhesion. Some family members specifically interact with bone sialoprotein, contributing to staphylococcal osteomyelitis and arthritis. Others bind to human fibrinogen, interfering with fibrin clot formation or promoting bacterial attachment, which may initiate foreign-body infections. The BOS complex subunits, also part of this family, are components of the multi-pass translocon (MPT) complex, facilitating the insertion of multi-pass membrane proteins into lipid bilayers. They take over after the SEC61 complex, occluding its lateral gate to promote the insertion of subsequent transmembrane regions.
    source: "InterPro:IPR051417 abstract (LLM-generated, not curator-reviewed)"
