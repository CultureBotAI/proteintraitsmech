identifier: PANTHER:PTHR31673
label: "PROTEIN COBRA"
definition: >-
  This entry COBRA family proteins. In Arabidopsis thaliana, members of the family are all extracellular glycosyl-phosphatidyl inositol-anchored proteins (GPI-linked). COBRA is involved in determining the orientation of cell expansion, probably by playing an important role in cellulose deposition. It may act by recruiting cellulose synthesising complexes to discrete positions on the cell surface. Some members of this entry are annotated as phytochelatin synthase, but these annotations are incorrect.
