identifier: PANTHER:PTHR31045
label: "PLAC8 FAMILY PROTEIN-RELATED"
definition: >-
  PLAC8 FAMILY PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31045. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 16 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, cyclase activity. Subfamilies participate in lipid metabolic process, isoprenoid metabolic process, metabolic process.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
