identifier: PANTHER:PTHR16038
label: "NOP SEVEN ASSOCIATED PROTEIN 1"
definition: >-
  Yeast Nsa1 is a ribosomal assembly factor that is functionally linked to type II AAA-ATPase Rix7. Rix7 associates with Nsa1-containing nucleolar pre-60S particles and is required for the maturation of the large ribosomal subunit. The mammalian homologue of Nsa1 is the nucleolar protein WDR74 (WD-repeat containing 74), which has been shown to associate with NVL2 (Rix7 homologue) in the presence of the nuclear Mtr4 exosome complex. WDR74/Nsa1 is composed of an N-terminal seven-bladed WD40 domain followed by a lysine-rich C terminus that is required for nucleolar localization. The WD40 domain of WDR74 serves as a platform for recruitment of NVL2 to pre-60S particles.
definition_source: "InterPro:IPR037379 abstract (PANTHER PTHR16038 is a member signature)"
