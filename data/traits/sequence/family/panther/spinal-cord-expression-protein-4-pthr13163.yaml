identifier: PANTHER:PTHR13163
label: "SPINAL CORD EXPRESSION PROTEIN 4"
definition: >-
  Shedding of transmembrane protein 35 (TMEM35) produces a soluble peptide that may modulate neurite outgrowth in the adrenal zona glomerulosa after sodium depletion. TMEM35 could be required for normal activity of the hypothalamic-pituitary-adrenal axis and limbic circuitry. TMEM35A, also known as NACHO, acts as a acetylcholine receptor chaperone that mediates the proper assembly and functional expression of the nicotinic acetylcholine receptors (nAChRs) throughout the brain.
