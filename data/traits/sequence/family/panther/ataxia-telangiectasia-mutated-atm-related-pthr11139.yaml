    text: >-
      ATAXIA TELANGIECTASIA MUTATED ATM -RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11139. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity. Members localise to nucleus, intracellular anatomical structure.
