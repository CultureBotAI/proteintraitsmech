identifier: PANTHER:PTHR10739
label: CYTIDYLYLTRANSFERASE
definition: >-
  This entry represents a group of choline-phosphate cytidylyltransferases (CCTs), including PCYT1A/B (CCT-alpha/beta) from humans and Pcy1 from budding yeasts. CCT catalyses the key rate-limiting step in CDP-choline pathway for phosphatidylcholine biosynthesis.
