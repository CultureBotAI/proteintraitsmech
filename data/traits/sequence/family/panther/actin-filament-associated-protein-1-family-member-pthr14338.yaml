identifier: PANTHER:PTHR14338
label: "ACTIN FILAMENT-ASSOCIATED PROTEIN 1 FAMILY MEMBER"
definition: >-
  The actin-filament associated protein (AFAP) family of adaptor proteins include AFAP1, AFAP1L1, and AFAP1L2/XB130. They contain the pleckstrin homology (PH) domain that plays a role in recruiting proteins to different membranes.
