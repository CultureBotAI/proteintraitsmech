identifier: PANTHER:PTHR43875
label: "MALTODEXTRIN IMPORT ATP-BINDING PROTEIN MSMX"
definition: >-
  This family includes bacterial and archaeal ATP-binding proteins that are part of ABC transporter complexes which mediate the uptake of different substrates, including sugar/oligosaccharides and glycerol-3-phosphate. These complexes are composed of two ATP-binding proteins, two transmembrane proteins and a solute-binding protein. Proteins in this entry are the ATPases responsible for the energy coupling to the transport system and include MalK, UgpC, SugC, MsiK, MsmK, AglK, GgtA, among others. These proteins have a similar structure despite low sequence conservation. The maltose/maltodextrin import ATP-binding protein MalK is an extensively studied protein part of the ABC transporter complex, involved in maltose/maltodextrin import. It functions in the MalKFGE ABC transporter complex to transport maltose into the cell by using ATP hydrolysis. MalK is the cytoplasmic nucleotide-binding protein of the multi-subunit complex in which MalF and MalG, the two transmembrane proteins, are present in single copies, and MalK as a homodimer.
