identifier: PANTHER:PTHR36117
label: "4-HYDROXYPHENYLACETATE 3-MONOOXYGENASE-RELATED"
definition: >-
  4-hydroxyphenylacetate (4HPA) 3-monooxygenase consists of two components, a large component, HpaB, which is an oxygenase, and a small component, HpaC, which is a reductase. 4-HPA 3-monooxygenase is NADH-dependent and uses FAD as the redox chromophore. HpaB utilises FADH2 supplied by HpaC to catalyse the hydroxylation of 4-hydroxyphenylacetic acid, leading to the production of 3,4-dihydroxyphenylacetic acid (DHPA). This entry represents the 4-hydroxyphenylacetate 3-monooxygenase oxygenase component, HpaB. It also represents the related prokaryotic enzymes Pyoverdin chromophore biosynthetic protein (PvcC), which may play a role in one of the proposed hydroxylation steps of pyoverdine chromophore biosynthesis, 4-nitrophenol 2-monooxygenase, oxygenase component (NphA1), which utilizes the flavins supplied by NphA2 to catalyse the degradation of 4-nitrophenol (4-NP) via 4-nitrocatechol (4-NC) for its use as the sole carbon, nitrogen, and energy source by Rhodococcus sp., and 4-hydroxybutyryl-CoA dehydratase (4-BUDH), a key enzyme in the metabolism of gamma-aminobutyrate. (3S)-3-amino-3-(3-chloro-4-hydroxyphenyl) propanoyl-[peptidyl-carrier protein SgcC2] monooxygenase (SgcC), the oxygenase component of a two-component system involved in antibiotic biosynthesis is also included in this group.
