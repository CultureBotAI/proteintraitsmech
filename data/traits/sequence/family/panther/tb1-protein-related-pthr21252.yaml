identifier: PANTHER:PTHR21252
label: "TB1 PROTEIN-RELATED"
definition: >-
  SLC25A46 is a modified solute transporter that has been recruited to the outer mitochondrial membrane and interacts with the inner membrane remodeling protein mitofilin (Fcj1). It plays a role in mitochondrial dynamics and cristae maintenance. Mutations in the SLC25A46 gene cause optic atrophy spectrum disorder.
