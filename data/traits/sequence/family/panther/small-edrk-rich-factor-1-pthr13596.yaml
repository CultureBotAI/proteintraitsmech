identifier: PANTHER:PTHR13596
label: "SMALL EDRK-RICH FACTOR 1"
definition: >-
  This entry includes SERF1, SERF2 and related proteins. They are short proteins rich in aspartate, glutamate, lysine and arginine. These proteins are positive regulators of amyloid protein aggregation and proteotoxicity. They induce conformational changes in amyloid proteins, driving them into compact formations preceding the formation of aggregates.
