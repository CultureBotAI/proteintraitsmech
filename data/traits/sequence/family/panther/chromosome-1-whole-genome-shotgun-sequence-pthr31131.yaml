  - kind: GENERAL
    text: >-
      This family of proteins functions as sensors and regulators within the mammalian target of rapamycin complex 1 (mTORC1) signaling pathway, which is crucial for cellular growth and metabolism in response to nutrient availability. Members of this family can form homodimers or heterodimers and are involved in sensing intracellular levels of arginine. The binding of arginine to certain members allosterically inhibits their interaction with the GATOR2 subcomplex, thereby activating mTORC1. Other members, which do not bind arginine directly, still contribute to the negative regulation of the TORC1 pathway through their interaction with the GATOR complex.
    source: "InterPro:IPR051719 abstract (LLM-generated, not curator-reviewed)"
