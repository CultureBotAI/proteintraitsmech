identifier: PANTHER:PTHR19321
label: "PROTEIN REGULATOR OF CYTOKINESIS 1 PRC1-RELATED"
definition: >-
  This is a family of microtubule associated proteins, including MAP65 (MAP65-1/2/3/4/5/6/7/8/9) from Arabidopsis, Ase1 from yeast, and PRC1 from mammals. Ase1 is required for spindle elongation and stabilisation. It is cell cycle-regulated by anaphase promoting complex. It is a potential Cdc28p substrate.
