identifier: PANTHER:PTHR10835
label: "SQUALENE MONOOXYGENASE"
definition: >-
  Squalene is a precursor for the synthesis of sterols in eukaryotes. Squalene monooxygenase, also called squalene epoxidase, catalyzes the first oxygenation step in sterol biosynthesis and is a rate-limiting enzyme in this pathway. In Saccharomyces cerevisiae, squalene is the first precursor dedicated to ergosterol biosynthesis. Squalene monooxygenase is regulated both transcriptionally and post-translationally. It is involved in tumorigenesis.
