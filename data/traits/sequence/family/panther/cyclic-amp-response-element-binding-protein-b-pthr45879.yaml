identifier: PANTHER:PTHR45879
label: "CYCLIC AMP RESPONSE ELEMENT-BINDING PROTEIN B"
definition: >-
  Transcription initiation is dictated by the presence and activity of specific nuclear factors that bind to DNA regulatory sequences and interact with the transcriptional machinery. The functions of some of these factors can be altered by phosphorylation, which affects both DNA binding and transcriptional activation. Phosphorylation is effected by specific protein kinases that have been activated by the stimulus of signal transduction pathways, resulting in the regulation of gene transcription by modulating the phosphorylation sites of transcription factors. Cyclic AMP (cAMP) regulates the expression of many genes via a conserved gene promoter element CRE (cAMP response element), which has the sequence 5'-TGACGTCA-3'. The cAMP response element binding protein (CREB) is a nuclear factor that is regulated by protein kinase A phosphorylation. Transcription is stimulated on binding to the CRE of a phosphorylated CREB dimer, which is held together by leucine zippers. Dimerisation and transcriptional efficacy have been found to be stimulated by phosphorylation at several distinct sites, and it has thus been suggested that CREB may be regulated by multiple kinases. Sequence analysis of the gene has revealed a cluster of protein kinase A, protein kinase C, and casein kinase II consensus recognition sites near the N terminus of the protein sequence, and the proximity of these sites to one another indicates the possibility of interaction in a positive or negative fashion to regulate CREB bioactivity. The 'leucine zipper' is a structure that is believed to mediate the function of several eukaryotic gene regulatory proteins. The zipper consists of a periodic repetition of leucine residues at every seventh position, and regions containing them appear to span 8 turns of α-helix. The l
