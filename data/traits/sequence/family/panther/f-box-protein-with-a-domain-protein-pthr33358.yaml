identifier: PANTHER:PTHR33358
label: "F-BOX PROTEIN WITH A DOMAIN PROTEIN"
definition: >-
  The members of this plant family from Arabidopsis thaliana appear to be proteins found in the chloroplast, expressed in the pollen tube during the petal differentiation and expansion stage. The function is not known.
