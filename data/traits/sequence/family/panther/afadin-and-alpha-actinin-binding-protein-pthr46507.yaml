definitions:
  - kind: GENERAL
    text: >-
      AFADIN- AND ALPHA-ACTININ-BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46507. Members participate in cellular component biogenesis, microtubule-based transport, cilium assembly. Members localise to non-membrane-bounded organelle, microtubule organizing center, ciliary basal body.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in cellular adhesion systems, contributing to the organization of various types of cell-cell adherens junctions, including homotypic, interneuronal, and heterotypic connections. Members of this family may facilitate the linkage between the nectin-afadin and E-cadherin-catenin systems via alpha-actinin, potentially playing a role in the organization of the actin cytoskeleton at adherens junctions. They are also implicated in cell motility, localizing to the leading edge of moving cells and possibly influencing cell movement through Rac signaling activation. Additionally, these proteins act as centrosome maturation factors, maintaining pericentriolar material integrity and aiding proper microtubule nucleation at mitotic spindle poles. They are involved in ciliogenesis by recruiting specific components to the cilia, indicating a role in cellular signaling and structure.
    source: "InterPro:IPR052300 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
