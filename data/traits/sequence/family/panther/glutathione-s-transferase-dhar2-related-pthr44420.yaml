identifier: PANTHER:PTHR44420
label: "GLUTATHIONE S-TRANSFERASE DHAR2-RELATED"
definition: >-
  This entry represents a group of dehydroascorbate reductases (DHARs), including DHAR1/2/3/4 from Arabidopsis. They act as thiol transferases but have no glutathione conjugating activity. They catalyse the glutathione (GSH)-dependent reduction of oxidized ascorbate (dehydroascorbate, DHA). As a result, DHARs regenerate a pool of reduced ascorbate and detoxify reactive oxygen species (ROS). Unlike most other glutathione transferases, DHARs are monomeric. DHAR2 and DHAR4 are predicted to be cytosolic, while DHAR3 is predicted to be chloroplastic, and DHAR1 is predicted to be mitochondrial. The cytosolic DHAR is important for ozone tolerance.
definition_source: "InterPro:IPR044627 abstract (PANTHER PTHR44420 is a member signature)"
