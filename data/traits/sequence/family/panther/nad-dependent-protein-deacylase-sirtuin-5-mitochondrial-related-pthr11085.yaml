      NAD-DEPENDENT PROTEIN DEACYLASE SIRTUIN-5, MITOCHONDRIAL-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11085. Members are annotated with the molecular function histone deacetylase activity, nucleotide binding, hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
