identifier: PANTHER:PTHR46351
label: "WOUND-INDUCED PROTEIN WIN2"
definition: >-
  The pathogenesis-related protein-4 (PR-4) family is a group of proteins containing a BARWIN-like domain. This entry includes BARWIN from barley, PR4A/B from wheat, and AtHEL from Arabidopsis. In barley BARWIN is induced by wounding or pathogens. Homologues of the BARWIN protein are also involved in the plant response to fungal infection and mechanical wounding. Even though PR-4 proteins have been classified as chitinases, however, several BARWIN homologues have been shown to possess ribonuclease activity. Antifungal DNase activity has also been observed, together with RNase activity, for the Theobroma cacao TcPR-4b protein.
definition_source: "InterPro:IPR044301 abstract (PANTHER PTHR46351 is a member signature)"
