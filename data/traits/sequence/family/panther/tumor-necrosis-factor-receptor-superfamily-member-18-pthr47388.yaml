  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that bind to TNFSF18, a ligand involved in the regulation of immune responses. Members are implicated in the interaction between activated T-lymphocytes and endothelial cells, playing a role in the modulation of T-cell receptor-mediated apoptosis. They are also known to activate the NF-kappa-B signaling pathway through the TRAF2/NIK axis, which is crucial for immune and inflammatory responses.
