definitions:
  - kind: GENERAL
    text: >-
      POLYCOMB PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10253. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function nucleosome binding, binding. and participate in heterochromatin formation, regulation of RNA biosynthetic process, negative regulation of RNA metabolic process. and localise to PcG protein complex, histone methyltransferase complex, nuclear protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in epigenetic regulation of gene expression through the modification of histones. Members of this family are part of the Polycomb group (PcG) proteins, which form multiprotein complexes that methylate specific lysine residues on histone H3, leading to transcriptional repression of target genes. These modifications can heritably alter chromatin structure and maintain the repressed state of genes across cell divisions. Functions of these proteins include roles in development, such as the maintenance of homeotic gene repression, regulation of seed endosperm development, and X chromosome inactivation. They are also implicated in the regulation of various metabolic processes and cellular differentiation. The WD repeat domain within these proteins is responsible for recognizing specific trimethylated histone peptides, contributing to the targeting of the PcG complexes to chromatin.
    source: "InterPro:IPR051243 abstract (LLM-generated, not curator-reviewed)"
