identifier: PANTHER:PTHR22850
label: "WD40 REPEAT FAMILY"
definition: >-
  The WD repeat RBAP46/RBAP48/MSI1 family is involved in chromatin metabolism and regulation. Members of this family function as core histone-binding subunits targeting chromatin assembly factors, chromatin remodeling factors, and histone deacetylases to histone substrates, regulated by nucleosomal DNA. They are components of several complexes, including the type B histone acetyltransferase (HAT-B) complex for chromatin assembly post-DNA replication, the core histone deacetylase (HDAC) complex for transcriptional repression, the NuRD complex for transcriptional repression through histone deacetylation and nucleosome remodeling, and the PRC2/EED-EZH2 complex for homeotic gene repression during development. Additionally, they play roles in telomeric silencing, meiotic regulation, and various developmental processes by maintaining transcriptionally repressive states of genes.
