identifier: PANTHER:PTHR13587
label: "INTEGRATOR COMPLEX SUBUNIT 3"
definition: >-
  The Integrator complex is involved in small nuclear RNA (snRNA) U1 and U2 transcription, and in their 3'-box-dependent processing. This complex associates with the C-terminal domain of RNA polymerase II largest subunit and is recruited to the U1 and U2 snRNAs genes. This entry represents integrator complex subunit 3 (Ints3). It is also a component of the sensor of single-stranded DNA complex (SOSS), which associates with single-stranded DNA, important for DNA repair and efficient homologous recombination. This subunit serves as a central adaptor for SOSS complex assembly and stability, and facilitates the accumulation of the complex to the sites of DNA damage. Its N-terminal region acts as a scaffold for SOSSB1 and SOSSC interaction and it is not essential for ssDNA binding.
definition_source: "InterPro:IPR045334 abstract (PANTHER PTHR13587 is a member signature)"
