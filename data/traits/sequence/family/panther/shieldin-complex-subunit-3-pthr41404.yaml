identifier: PANTHER:PTHR41404
label: "SHIELDIN COMPLEX SUBUNIT 3"
definition: >-
  RINN1 is a component of the shieldin complex, together with RINN2, RINN3 and REV7. The shieldin complex plays an important role in repair of DNA double-stranded breaks (DSBs). Recruitment of shieldin to DSBs promotes NHEJ-dependent repair of intrachromosomal breaks, immunoglobulin class-switch recombination, and fusion of unprotected telomeres.
