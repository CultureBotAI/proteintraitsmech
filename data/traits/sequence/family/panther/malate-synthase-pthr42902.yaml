identifier: PANTHER:PTHR42902
label: "MALATE SYNTHASE"
definition: >-
  This entry represents glyoxysomal malate synthases and one of two bacterial forms, designated malate synthase A. Malate synthase and isocitrate lyase are the two characteristic enzymes of the glyoxylate cycle. The glyoxylate cycle allows certain organisms, like plants and fungi, to derive their carbon requirements from two-carbon compounds, by bypassing the two carboxylation steps of the citric acid cycle. Isocitrate lyase, first catalyzes the aldol cleavage of isocitrate to succinate (an intermediate of the tricarboxylic acid cycle) and glyoxylate. Then malate synthase catalyzes the condensation of acetyl CoA with glyoxylate to yield malate (another intermediate of the tricarboxylic acid cycle). This entry includes UniProtKB:A0A0R4IAX5 encoded by ugl gene from zebrafish, which has been recently described as being originated from a duplication of the malate synthase gene, but sequence changes have resulted in loss of malate synthase activity and instead it has ureidoglycolate lyase activity.
definition_source: "InterPro:IPR006252 abstract (PANTHER PTHR42902 is a member signature)"
