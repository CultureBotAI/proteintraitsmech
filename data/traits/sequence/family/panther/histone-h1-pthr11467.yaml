identifier: PANTHER:PTHR11467
label: "HISTONE H1"
definition: >-
  HISTONE H1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11467. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function chromatin DNA binding, double-stranded DNA binding, nucleosome binding. Members participate in negative regulation of DNA recombination, chromosome condensation. Members localise to nucleus, intracellular anatomical structure.
