label: BETA-DEFENSIN-RELATED
definition: >-
  BETA-DEFENSIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21388. PANTHER protein class: defense/immunity protein, antimicrobial response protein. Members are annotated with the molecular function chemokine receptor binding. Members participate in innate immune response, defense response to Gram-negative bacterium, defense response to Gram-positive bacterium. Members localise to extracellular region.
