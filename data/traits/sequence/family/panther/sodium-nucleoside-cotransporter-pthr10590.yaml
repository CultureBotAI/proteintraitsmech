identifier: PANTHER:PTHR10590
label: "SODIUM/NUCLEOSIDE COTRANSPORTER"
definition: >-
  Nucleosides are hydrophilic molecules and require specialised transport proteins for permeation of cell membranes. There are two types of nucleoside transport processes: equilibrative bidirectional processes driven by chemical gradients, and inwardly directed concentrative processes driven by an electrochemical gradient. The two types of nucleoside transporters are classified into two families: the solute carrier (SLC) 29 and SLC28 families, corresponding to equilibrative and concentrative nucleoside transporters, respectively. The microbial proteins include broad specificity transporters, such as the Escherichia coli NupC protein which transports all nucleosides (both ribo- and deoxyribonucleosides) except hypoxanthine and guanine nucleosides. Bacillus subtilis NupC transporter has been shown to be involved in transport of the pyrimidine nucleoside uridine. A recently characterised fungal protein, the first transporter of this type to be described in eukaryotes, exhibited transport activity for adenosine, uridine, inosine and guanosine but not cytidine, thymidine or the nucleobase hypoxanthine. The characterised mammalian proteins can be divided into three subgroups; CNT1, CNT2 and CNT3. CNT1 preferentially transports pyrimidines and weakly transports adenosine. Several antiviral and anticancer nucleoside analogues, including AZT and dFdC are also substrates for CNT1. CNT2 selectively transports purines, and the human form has also been shown to facilitate the uptake of some antiviral compounds including ddI and ribavirin. CNT3 has a broader specificity, transporting both purines and pyrimidines. Several anticancer nucleoside analogues such as CdA, dFdC and FdU are also transported by CNT3. Substrate specificity appears to depend on a region containing transmembrane re
