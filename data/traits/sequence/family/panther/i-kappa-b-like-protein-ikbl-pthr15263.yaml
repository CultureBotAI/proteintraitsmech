identifier: PANTHER:PTHR15263
label: "I-KAPPA-B-LIKE PROTEIN  IKBL"
definition: >-
  NF-kappa-B inhibitor-like protein 1 (NFKBIL1, also known as IKBL) is a member of the nuclear IkB family. Classical IkB proteins retain NF-kB dimers in the cytoplasm; IkBL belongs to the atypical or nuclear IkB proteins. It inhibits LPS-induced NF-kB activation and transcription of TNF-alpha and IL-6.
