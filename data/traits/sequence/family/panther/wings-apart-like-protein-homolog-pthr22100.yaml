identifier: PANTHER:PTHR22100
label: "WINGS APART-LIKE PROTEIN HOMOLOG"
definition: >-
  Wings apart-like protein (WAPL) regulates heterochromatin structure. It is required to hold sister chromatids of meiotic heterochromatin together and is implicated in both heterochromatin pairing during female meiosis and the modulation of position-effect variegation (PEV). hWAPL (UniProtKB:Q7Z5K2), the human homologue, is found to play a role in the development of cervical carcinogenesis, and is thought to have similar functions to Drosophila wapl protein. Malfunction of the hWAPL pathway is thought to activate an apoptotic pathway that consequently leads to cell death.
definition_source: "InterPro:IPR039874 abstract (PANTHER PTHR22100 is a member signature)"
