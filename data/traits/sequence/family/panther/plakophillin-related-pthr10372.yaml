identifier: PANTHER:PTHR10372
label: PLAKOPHILLIN-RELATED
definition: >-
  The p120 subfamily of armadillo-related proteins includes deta-catenin, Splicing regulator ARVCF, p0071/plakophilin-4, and plakophilins 1-3. These proteins are involved in mediating cell-cell adhesion. Besides their junctional localisation, these proteins can be found in the cytoplasm and nucleus where they play additional roles.
