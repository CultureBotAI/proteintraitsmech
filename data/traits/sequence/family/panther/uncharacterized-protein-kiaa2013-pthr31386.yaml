identifier: PANTHER:PTHR31386
label: "UNCHARACTERIZED PROTEIN KIAA2013"
definition: >-
  This entry represents Uncharacterized protein KIAA2013 and similar proteins from animals. K2013 might be related to cannabinoid receptors and neurodegenerative disorders such as ALS. The function of this protein is still unknown.
