identifier: PANTHER:PTHR12777
label: "SMALL NUCLEAR RIBONUCLEOPROTEIN SM D2"
definition: >-
  This entry represents the small nuclear ribonucleoprotein Sm D2 (Smd2). Smd2 is a component of the SM core complex, a ring complex consists of six or seven subunits. SM complex associates with the snRNPs and is involved in the RNA-processing pathways.
