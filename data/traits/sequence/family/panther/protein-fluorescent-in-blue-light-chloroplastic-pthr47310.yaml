identifier: PANTHER:PTHR47310
label: "PROTEIN FLUORESCENT IN BLUE LIGHT, CHLOROPLASTIC"
definition: >-
  FLUORESCENT IN BLUE LIGHT (FLU) is a nuclear-encoded plastid protein that, after import and processing, becomes tightly associated with plastid membranes. It controls chlorophyll biosynthesis by interacting directly with Glu tRNA reductase (HEMA1). It operates independently of heme and seems to selectively affect only the Mg(2+) branch of tetrapyrrole biosynthesis.
