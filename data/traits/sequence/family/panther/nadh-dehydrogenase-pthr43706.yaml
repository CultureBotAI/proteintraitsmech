identifier: PANTHER:PTHR43706
label: "NADH DEHYDROGENASE"
definition: >-
  This entry represents a group of alternative NADH:quinone oxidoreductases (also known as NDH-2) that deliver electrons to the respiratory chain by oxidation of NADH and reduction of quinones but does not pump protons. NDH-2 have particular relevance in yeasts like Saccharomyces cerevisiae and in several prokaryotes, whose respiratory chains are devoid of complex I, in which NDH-2 keep the balance and are the main entry point of electrons into the respiratory chains. Structures of NDH-2 from the yeast Saccharomyces cerevisiae, also called Ndi1 (PDB:4G6H and PDB:4G9K), and those from bacteria, Caldalkalibacillus thermarum (PDB:4NWZ) and Staphylococcus aureus (PDB:4XDB7), have been determined. Interestingly, since NDH-2s are present only in bacteria and certain plant, fungal and protozoan mitochondria, but not in mammals, they have been used as a drug target for Mycoplasma tuberculosis, Plasmodium falciparum and Toxoplasma gondii.
definition_source: "InterPro:IPR045024 abstract (PANTHER PTHR43706 is a member signature)"
