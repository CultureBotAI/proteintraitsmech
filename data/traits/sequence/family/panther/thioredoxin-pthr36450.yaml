identifier: PANTHER:PTHR36450
label: THIOREDOXIN
definition: >-
  This entry represents a group of related prokaryotic sequences, including Thioredoxin from Methanothermobacter thermautotrophicus. This protein has been reported to not function as a glutathione-disulfide oxidoreductase in the presence of glutathione and glutathione reductase and show low thioredoxin activity in vitro. ArsE from Shewanella putrefaciens (UniProtKB:E6XP51) is also included in this group. It is a small, thioredoxin-like component of a nitroreductase active in converting the nitro group of two different synthetic aromatic organoarsenical compounds to an amine.
