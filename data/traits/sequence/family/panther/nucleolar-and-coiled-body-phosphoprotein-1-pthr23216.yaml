identifier: PANTHER:PTHR23216
label: "NUCLEOLAR AND COILED-BODY PHOSPHOPROTEIN 1"
definition: >-
  This entry includes mammalian NOLC1 (also known as Nopp140) and its orthologue dao-5 from C.elegans. They are nucleolar proteins that contain a central domain consisting of ten repeats of acidic serine clusters alternating with lysine-, alanine- and proline-rich basic stretches. Human NOLC1 interacts with casein kinase 2 (CK2), RNA polymerase I, p80 coilin, NAP57, and both major classes (box H/ACA and box C/D) of snoRNPs. It acts as a regulator of RNA polymerase I by connecting RNA polymerase I with enzymes responsible for ribosomal processing and modification. Mutations of the Dao-5 gene alters rDNA transcription and increases germ cell apoptosis in C. elegans. It binds to RNA polymerase I and rDNA and is required for efficient RNA polymerase I-mediated rDNA transcription. It also plays a role in the modulation of nucleolus size.
definition_source: "InterPro:IPR039191 abstract (PANTHER PTHR23216 is a member signature)"
