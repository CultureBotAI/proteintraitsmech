identifier: PANTHER:PTHR12670
label: CERAMIDASE
definition: >-
  This family represents a group of neutral/alkaline ceramidases found in both bacteria and eukaryotes. They hydrolyse the sphingolipid ceramide into sphingosine and free fatty acid.
