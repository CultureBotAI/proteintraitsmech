    text: >-
      PERIPLASMIC BETA-GLUCOSIDASE-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30620. PANTHER protein class: glucosidase, hydrolase. Members are annotated with the molecular function glucosidase activity. Members participate in glucan metabolic process, carbohydrate catabolic process, macromolecule catabolic process.
