identifier: PANTHER:PTHR12764
label: "WD REPEAT DOMAIN-RELATED"
definition: >-
  Intraflagellar transport protein 122 homolog (Ift122) and Intraflagellar transport protein 121 homolog (Ift121, also known as WD repeat-containing protein 35) are a multiple WD40-repeat containing proteins, required for ciliogenesis. They are components of the IFT complex A (IFT-A), a complex required for retrograde ciliary transport and entry into cilia of G protein-coupled receptors (GPCRs). Primary cilia are assembled and maintained by evolutionarily conserved intraflagellar transport (IFT) proteins that are involved in the coordinated movement of macromolecular cargo from the basal body to the cilium tip and back. Mice with mutant Ift122 lack cilia and have multiple developmental defects and the Sonic Hedgehog (Shh) signaling pathway is disrupted.
definition_source: "InterPro:IPR039857 abstract (PANTHER PTHR12764 is a member signature)"
