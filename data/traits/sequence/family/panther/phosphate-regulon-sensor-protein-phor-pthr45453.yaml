identifier: PANTHER:PTHR45453
label: "PHOSPHATE REGULON SENSOR PROTEIN PHOR"
definition: >-
  This prokaryotic protein family includes sensor protein kinases that are part of two-component regulatory systems, which are typically involved in detecting environmental signals and initiating appropriate cellular responses, and photoreceptors known as bacteriophytochromes. Sensor kinases autophosphorylate on a histidine residue and transfer the phosphate to a response regulator, which then modulates the expression of various genes. These proteins regulate processes such as cell wall metabolism, virulence, biofilm production, oxidative stress resistance, osmolarity changes and antibiotic resistance. This entry includes: Sensor protein kinase WalK from Staphylococcus aureus, which regulates genes involved in cell wall metabolism, virulence regulation, biofilm production, oxidative stress resistance and antibiotic resistance Sensor protein kinase GraS from Staphylococcus aureus, which is involved in resistance against cationic antimicrobial peptides (CAMPs) Sensor protein BceS from Bacillus subtilis, involved in the regulation of bacitracin resistance Sensor-like histidine kinase SenX3 from Mycobacterium tuberculosis, which plays a role in the phosphate starvation response Activity of these kinases can be regulated by factors such as zinc-binding, which negatively affects autophosphorylation, or environmental conditions like phosphate availability. Bacteriophytochromes, such as Bacteriophytochrome from Pseudomonas aeruginosa (BphY,) and Cyanobacterial phytochrome B from Nostoc sp. (PhyB,), are light-sensitive and exist in two forms that are interconvertible by light, with absorption maxima in the red and far-red regions of the spectrum. They may also absorb green light and are implicated in regulating pigment synthesis for protection against intense light.
definition_source: "InterPro:IPR050351 abstract (PANTHER PTHR45453 is a member signature)"
