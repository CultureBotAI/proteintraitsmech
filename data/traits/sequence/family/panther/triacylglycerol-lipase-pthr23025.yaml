label: "TRIACYLGLYCEROL LIPASE"
definition: >-
  TRIACYLGLYCEROL LIPASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23025. PANTHER protein class: lipase. Members are annotated with the molecular function carboxylic ester hydrolase activity, triglyceride lipase activity. Members participate in glycerolipid metabolic process, triglyceride catabolic process, acylglycerol catabolic process. Members localise to cytoplasm, cytosol.
