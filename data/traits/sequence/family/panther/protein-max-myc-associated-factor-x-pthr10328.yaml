identifier: PANTHER:PTHR10328
label: "PROTEIN MAX  MYC-ASSOCIATED FACTOR X"
definition: >-
  PROTEIN MAX MYC-ASSOCIATED FACTOR X — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10328. PANTHER protein class: basic helix-loop-helix transcription factor. Members are annotated with the molecular function DNA-binding transcription factor activity. Members participate in positive regulation of transcription by RNA polymerase II. Members localise to RNA polymerase II transcription regulator complex.
