identifier: PANTHER:PTHR43816
label: "NICOTINAMIDE PHOSPHORIBOSYLTRANSFERASE"
definition: >-
  This entry represents the family of nicotinamide phosphoribosyl transferases (NAMPT). NAMPT consists of two intertwined α/β domains one of which is a rudiment of the classical TIM-barrel. It forms dimers that exist in a head to tail configuration. Nicotinamide phosphoribosyl transferase (NAMPT) catalyses the condensation of nicotinamide with 5-phosphoribosyl-1-pyrophosphate to yield nicotinamide mononucleotide, an intermediate in the biosynthesis of NAD. NAMPT is also known as pre-B cell colony-enhancing factor (PBEF) or visfatin.
