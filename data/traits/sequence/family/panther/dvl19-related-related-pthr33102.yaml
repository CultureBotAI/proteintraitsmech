identifier: PANTHER:PTHR33102
label: DVL19-RELATED-RELATED
definition: >-
  This family of proteins acts as regulatory molecules coordinating cellular responses essential for differentiation, growth, and development. They are involved in restricting polar cell proliferation in lateral organs such as leaves and petioles. Additionally, they play a role in coordinating the recruitment and differentiation of socket cells at trichome sites, which are hair-like projections on plant surfaces. These proteins are implicated in regulating positional cues and cell proliferation along the body axis.
