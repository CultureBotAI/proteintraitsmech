label: "MITOCHONDRIAL RIBOSOMAL PROTEIN S25"
definition: >-
  This entry includes subunits of the mitochondrial ribosome including the small ribosomal subunit protein mS25 (also known as MRPS25) from mammals, and its orthologues from yeast, the large ribosomal subunit protein mL61 (also known as Mrp49).
