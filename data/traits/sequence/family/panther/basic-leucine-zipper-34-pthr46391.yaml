identifier: PANTHER:PTHR46391
label: "BASIC LEUCINE ZIPPER 34"
definition: >-
  This family of proteins includes transcriptional activators and regulators. Members of this family are involved in various cellular processes, including the control of cell wall patterning, pollen development, metabolic pathways, cellular transport, and lipid metabolism. They share a basic leucine zipper domain, which is typically involved in DNA binding and dimerization, essential for their function as transcription factors.
