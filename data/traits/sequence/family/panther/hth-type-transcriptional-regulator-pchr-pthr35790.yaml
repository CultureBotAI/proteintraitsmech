identifier: PANTHER:PTHR35790
label: "HTH-TYPE TRANSCRIPTIONAL REGULATOR PCHR"
definition: >-
  The protein family includes transcriptional regulators that respond to environmental stimuli such as metal ions, specifically zinc, to regulate gene expression. Members of the family act as repressors or activators by binding to specific DNA motifs in the promoter regions of target genes. They are involved in various biological processes including multidrug resistance, metal ion homeostasis, and biosynthesis pathways. The family's regulatory mechanisms are often dependent on the presence of coregulators like zinc, which influences their DNA-binding activity. Some members also autoregulate their own expression.
