identifier: PANTHER:PTHR47605
label: "TRANSCRIPTIONAL ELONGATION REGULATOR MINIYO"
definition: >-
  This family includes Transcriptional elongation regulator MINIYO from Arabidopsis thaliana and related plant proteins. MINIYO acts as a positive regulator of transcriptional elongation, a crucial process in gene expression. Members of this family are essential for initiating cell differentiation by interacting with RNA polymerase II and the Elongator complex. They play a significant role in maintaining the levels of transcriptional elongation activity, particularly in tissues undergoing differentiation.
