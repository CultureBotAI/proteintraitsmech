identifier: PANTHER:PTHR12710
label: "NUCLEAR PROTEIN LOCALIZATION 4"
definition: >-
  Npl4 forms the Cdc48-Ufd1-Npl4 complex, which is a segregase complex that is involved in several ubiquitin-related processes. By coupling the ubiquitin-binding properties of Ufd1-Npl4 with the ATPase activity of Cdc48 (p97 in mammals), Cdc48-Ufd1-Npl4 is believed to aid in the extraction of ubiquitylated proteins from higher order complexes. It also plays a role in the regulated destruction of resident ER membrane proteins.
