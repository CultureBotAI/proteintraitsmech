identifier: PANTHER:PTHR21640
label: Nesprin-4
definition: >-
  Nesprins (nuclear envelope spectrin-repeat proteins) are a family of giant spectrin-repeat containing proteins that act as versatile intracellular protein scaffolds. They are characterised by a central extended spectrin-repeat (SR) and a C-terminal Klarsicht/ANC-1/Syne homology (KASH) domain that can associate with Sad1p/UNC-84 (SUN)-domain proteins of the inner nuclear membrane within the periplasmic space of the nuclear envelope (NE). This entry represents Nesprin-4 predominantly from mammals. Nesprin-4 links the nucleus to microtubules through its binding to kinesin-1. It is a component of the linker of the nucleoskeleton and cytoskeleton (LINC) complex, which plays critical roles in nuclear positioning, cell polarisation and cellular stiffness.
definition_source: "InterPro:IPR030268 abstract (PANTHER PTHR21640 is a member signature)"
