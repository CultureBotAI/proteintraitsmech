identifier: PANTHER:PTHR11241
label: "DEOXYURIDINE 5'-TRIPHOSPHATE NUCLEOTIDOHYDROLASE"
definition: >-
  The essential enzyme dUTP pyrophosphatase (EC:3.6.1.23, dUTPase) is specific for dUTP and is critical for the fidelity of DNA replication and repair. dUTPase hydrolyzes dUTP to dUMP and pyrophosphate, simultaneously reducing dUTP levels and providing the dUMP for dTTP biosynthesis. dUTPase decreases the intracellular concentration of dUPT so that uracil cannot be incorporated into DNA. The crystal structure of human dUTPase reveals that each subunit of the dUTPase trimer folds into an eight-stranded jelly-roll β-barrel, with the C-terminal β-strands interchanged among the subunits. The structure is similar to that of the Escherichia coli enzyme, despite low sequence homology between the two enzymes.
