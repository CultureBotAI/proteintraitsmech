identifier: PANTHER:PTHR21408
label: "HOMEODOMAIN-ONLY PROTEIN"
definition: >-
  HOPX contains a homeobox-like domain but lacks certain conserved residues required for DNA binding. It is expressed in tumour cells and various normal tissues. It plays an essential role in the differentiation of various cells and could act as a tumour suppressor via the epigenetic regulation of SNAIL transcription.
