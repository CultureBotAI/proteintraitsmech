identifier: PANTHER:PTHR45897
label: "HIGH-AFFINITY CHOLINE TRANSPORTER 1"
definition: >-
  This family of proteins includes high-affinity sodium-coupled choline transmembrane symporters. They function as electrogenic, voltage-dependent transporters with variable charge/choline stoichiometry. These proteins are crucial for acetylcholine synthesis, as they transport choline from the synaptic cleft into presynaptic nerve terminals following neurotransmitter release. The transport process is also influenced by chloride ions, which are likely regulatory rather than cotransported. The activity of these transporters is modulated by internalization and recycling between the cell surface and intracellular organelles. A specific motif in the C-terminal region is important for this regulation. The proteins are inhibited by hemicholinium 3 and are essential for cholinergic neuronal communication.
