identifier: PANTHER:PTHR43552
label: "DIAMINOBUTYRATE--2-OXOGLUTARATE AMINOTRANSFERASE"
definition: >-
  This family consists of L-diaminobutyric acid transaminases. This general designation covers both EC:2.6.1.76 (diaminobutyrate-2-oxoglutarate transaminase, which uses glutamate as the amino donor in DABA biosynthesis), and EC:2.6.1.46 (diaminobutyrate--pyruvate transaminase, which uses alanine as the amino donor). Most members with known function are EC:2.6.1.76, and at least some annotations as EC:2.6.1.46 in current databases at time of model revision are incorrect. A distinct branch of this family contains examples of EC:2.6.1.76 nearly all of which are involved in ectoine biosynthesis. EC:2.6.1.76 has also been characterised as part of an alternative polyamine biosynthetic pathway in Vibrio cholerae. A related enzyme is 4-aminobutyrate aminotransferase (EC EC:2.6.1.19 ), also called GABA transaminase. These enzymes all are pyridoxal phosphate-containing class III aminotransferase.
