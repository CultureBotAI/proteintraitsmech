identifier: PANTHER:PTHR43405
label: "GLYCOSYL HYDROLASE DIGH"
definition: >-
  This family of proteins includes glycosyl hydrolases that localize to the divisome, a complex involved in bacterial cell division. Members of this family are involved in the cleavage of peptidoglycans, specifically targeting regions that lack peptide side chains, known as denuded peptidoglycans. The enzymatic activity exhibited by these proteins may include glucosaminidase or muramidase functions, which are essential for cell wall remodeling and turnover during bacterial growth and division. The family is characterized by a structural similarity to the glycosyl hydrolase-like 10 (GHL10) family, suggesting a conserved mechanism of action across its members.
