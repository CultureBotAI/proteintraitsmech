identifier: PANTHER:PTHR13377
label: "PLACENTAL PROTEIN 6"
definition: >-
  This entry represents a group of eukaryotic transmembrane proteins, including TMEM115 from animals, Pdh1 from fission yeasts and Rbl19 from Arabisopsis. Human TMEM115 is an integral membrane protein of the Golgi complex involved in retrograde transport. Budding yeast TMEM115 homologue, YOL107W, has been shown to localise COP II vesicles.
