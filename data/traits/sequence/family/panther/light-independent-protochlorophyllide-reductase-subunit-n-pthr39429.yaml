identifier: PANTHER:PTHR39429
label: "LIGHT-INDEPENDENT PROTOCHLOROPHYLLIDE REDUCTASE SUBUNIT N"
definition: >-
  The BchN/ChlN family includes proteins that are components of the dark-operative protochlorophyllide reductase (DPOR) complex. DPOR is responsible for the light-independent reduction of protochlorophyllide (Pchlide) ring D, resulting in the formation of chlorophyllide a (Chlide). This reaction is a key step in the biosynthesis of chlorophyll, which is essential for photosynthesis. The family members utilize Mg-ATP and reduced ferredoxin as substrates for the reduction process. The NB-protein complex, consisting of subunits BchN-BchB or ChlN-ChlB, serves as the catalytic component of DPOR. Some members of the family are also involved in the conversion of chlorophylls into bacteriochlorophylls by reducing ring B of the tetrapyrrole.
