    text: >-
      MEMBRANE COMPONENT OF TRANSPORTER-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30572. PANTHER protein class: transporter. Members are annotated with the molecular function transmembrane transporter activity. and localise to cell periphery, cellular anatomical entity, membrane.
