identifier: PANTHER:PTHR43952
label: "MYB FAMILY TRANSCRIPTION FACTOR-RELATED"
definition: >-
  This entry represents a group of plant MYB transcription factors, including RADIALIS and RADIALIS-like 1-6. RADIALIS is specifically expressed in the dorsal region of developing flowers and is involved in the dorsoventral asymmetry of flowers.
