identifier: PANTHER:PTHR43390
label: "SIGNAL PEPTIDASE I"
definition: >-
  This group of serine peptidases belong to MEROPS peptidase family S26 (signal peptidase I family, clan SF), subfamily S26A. At least 3 eubacterial leader peptidases are known: murein prelipoprotein peptidase, which cleaves the leader peptide from a component of the bacterial outer membrane; type IV prepilin leader peptidase; and the serine-dependent leader peptidase 1, which has the more general role of cleaving the leader peptide from a variety of secreted proteins and proteins directed to the periplasm and periplasmic membrane. Leader peptidase 1 is similar to the eukaryotic signal peptidase, although the bacterial protein is monomeric, while the eukaryotic protein is multimeric. Mitochondria contain a similar two-subunit serine protease that removes leader peptides from nuclear- and mitochondrial-encoded proteins, which localise in the inner mitochondrial space. The catalytic residues of a number of these peptides have been identified as a serine/lysine dyad.
