identifier: PANTHER:PTHR28188
label: "MITOCHONDRIAL IMPORT RECEPTOR SUBUNIT TOM5"
definition: >-
  MITOCHONDRIAL IMPORT RECEPTOR SUBUNIT TOM5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28188. PANTHER protein class: primary active transporter, transporter. Members are annotated with the molecular function protein transmembrane transporter activity. Members participate in protein targeting, establishment of protein localization to organelle, protein targeting to mitochondrion. Members localise to organelle outer membrane, mitochondrial outer membrane translocase complex, mitochondrial envelope.
