identifier: PANTHER:PTHR34768
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 89"
definition: >-
  This entry represents coiled-coil domain-containing protein 89 (CCDC89) and tumor suppressor candidate gene 1 protein (TUSC1). Coiled-coil domain-containing protein 89 (CCDC89), also known as Bc8 orange-interacting protein (BOIP), interacts with the orange domain of HRT1. BOIP binds to the orange domain of HRT1/Hey1 and is predominantly expressed at a specific stage in spermatogenesis. BOIP may play a role in the maturation process from haploid round spermatids to spermatozoa, possibly as a tissue-specific regulator of HRT1/Hey1 activity. CCDC89 is distributed uniformly within the cytoplasm but translocates to the nucleus when bound to HEY1. The protein undergoes phosphorylation at threonine residues. Hairy-related transcription factor (HRT), also known as Bc8, is a transcriptional repressor and has been identified as effector of the Notch signalling pathway. HRT proteins contain a conserved amino acid domain, denoted either as the Orange domain or as helix III/IV located at the C-terminal after the bHLH domain that is characteristic of all HES/E(spl)-related proteins, also referred to as bHLH-Orange (bHLH-O) proteins. TUSC1 is a tumour suppressor candidate gene 1 protein that is widely expressed at low levels with higher expression in the testis. The protein contains predicted coiled-coil regions that may be involved in protein-protein interactions; it also contains disordered regions. TUSC1 was identified through analysis of homozygous deletions in human lung cancer and is down-regulated in some tumour cell lines. It has also been identified as a potential tumour suppressor in human cancers and could be a novel therapeutic target for glioblastoma.
