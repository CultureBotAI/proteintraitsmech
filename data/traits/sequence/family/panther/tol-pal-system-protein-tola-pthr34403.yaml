identifier: PANTHER:PTHR34403
label: "TOL-PAL SYSTEM PROTEIN TOLA"
definition: >-
  This entry represents the serine-aspartate repeat-containing protein (SDr) family. This family includes proteins involved in bacterial virulence mechanisms. These proteins are cell surface-associated and play a role in promoting bacterial attachment to human fibrinogen, facilitating the formation of bacterial clumps. These clumps can interfere with host defence mechanisms, such as preventing bacterial phospholipid hydrolysis by phospholipase A2 and reducing macrophage phagocytosis. Additionally, some members are responsible for inducing human platelet aggregation, which may contribute to the development of infective endocarditis. The proteins also interact with components of the extracellular matrix, which is crucial for bacterial adhesion and pathogenesis. This entry also include eukaryotic members, such as Germ cell nuclear acidic protein from Mus musculus, which may play a role in DNA-protein cross-links (DPCs) clearance through a SUMO-dependent recruitment to sites of DPCs, ensuring the genomic stability by protecting germ cells and early embryos from various sources of damage.
definition_source: "InterPro:IPR050972 abstract (PANTHER PTHR34403 is a member signature)"
