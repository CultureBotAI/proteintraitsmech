identifier: PANTHER:PTHR13523
label: "COILED-COIL-HELIX-COILED-COIL-HELIX DOMAIN CONTAINING 2/NUR77"
definition: >-
  This family includes Coiled-coil-helix-coiled-coil-helix domain-containing protein 2 and 10 (CHCHD2/10) from human and its orthologues. CHCHD2/10 are homologous proteins that form a complex in the mitochondrial intermembrane space and cooperate to regulate mitochondrial function, playing a role in mitochondrial dynamics and cristae organisation. CHCHD2 is a transcription factor that binds to specific DNA elements and activate transcription under varying oxygen conditions, including both hypoxia and normoxia. It has been reported to regulate oxidative phosphorylation (OXPHOS), promoting the expression of the COX4I2 subunit during stress, inhibiting apoptosis. CHCHD10 regulates mitochondrial COX activity and mitochondrial respiration at hypoxia. Mutations in CHCHD2 and CHCHD10 have been identified as causing Parkinson's disease and amyotrophic lateral sclerosis/frontotemporal dementia/myopathy, respectively.
