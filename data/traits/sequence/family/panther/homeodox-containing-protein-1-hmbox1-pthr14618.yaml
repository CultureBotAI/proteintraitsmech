identifier: PANTHER:PTHR14618
label: "HOMEODOX-CONTAINING PROTEIN 1 HMBOX1"
definition: >-
  HMBOX1 binds to 5'-TTAGGG-3' repeats in telomeric DNA and may play a role in recruitment of the telomerase complex to telomeres. It also plays a role in the alternative lengthening of telomeres (ALT) pathway in telomerase-negative cells where it promotes formation and/or maintenance of ALT-associated promyelocytic leukemia bodies (APBs).
definition_source: "InterPro:IPR040363 abstract (PANTHER PTHR14618 is a member signature)"
