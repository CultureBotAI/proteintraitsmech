  - kind: GENERAL
    text: >-
      This family of proteins includes members involved in the biosynthesis of polyketides, a class of secondary metabolites with diverse structures and functions. The proteins in this family are associated with type II polyketide synthases (PKS), which are multi-enzyme complexes that catalyze the formation of polyketide chains through the condensation of acyl-CoA precursors. Some members of this family may act as cyclases, aiding in the formation of aromatic rings during the biosynthesis of specific polyketides, such as tetracenomycin C. The presence of these proteins is indicative of their role in the production of complex polyketide structures, which can have antibiotic, antifungal, or anticancer properties.
