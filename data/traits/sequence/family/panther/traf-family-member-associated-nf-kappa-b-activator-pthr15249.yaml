identifier: PANTHER:PTHR15249
label: "TRAF FAMILY MEMBER-ASSOCIATED NF-KAPPA-B ACTIVATOR"
definition: >-
  TANK-binding kinase 1 (TBK1) and inducible IkappaB-kinase (IKK) are central regulators of type-I interferon induction. TANK (TRAF family member-associated NF-kappa-B activator) is a adaptor protein that connects IKK complexes with IKK epsilon and TBK1 kinases. It negatively regulates NF-kappaB activation by DNA damage via inhibiting ubiquitination of TRAF6. It is also a negative regulator of osteoclastogenesis and bone formation.
