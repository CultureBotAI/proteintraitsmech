identifier: PANTHER:PTHR15463
label: "AP1 GAMMA SUBUNIT BINDING PROTEIN 1"
definition: >-
  Synergin gamma (SYNRG) plays a role in endocytosis and/or membrane trafficking at the trans-Golgi network. It is a component of clathrin-coated vesicles and of the aftiphilin/p200/gamma-synergin complex, which plays roles in AP1G1/AP-1-mediated protein trafficking.
