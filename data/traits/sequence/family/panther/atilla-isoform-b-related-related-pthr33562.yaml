  - kind: GENERAL
    text: >-
      This family of proteins is involved in the homeostatic regulation of sleep. Members of this family are essential for maintaining normal sleep patterns and for the recovery of sleep after periods of sleep deprivation. They function as important regulators of potassium channels, specifically the Shaker (Sh) K(+) channel. By potentially enhancing the activity of these channels, they contribute to the reduction of neuronal excitability, thereby linking the physiological need for sleep to a decrease in neuronal activity.
