identifier: PANTHER:PTHR37698
label: "PHOTOSYNTHETIC NDH SUBUNIT OF SUBCOMPLEX B 1, CHLOROPLASTIC"
definition: >-
  PNSB1 is a subunit of the chloroplast NAD(P)H dehydrogenase complex that shuttles electrons from NAD(P)H:plastoquinone, via FMN and iron-sulfur (Fe-S) centers, to quinones in the photosynthetic chain and possibly in a chloroplast respiratory chain.
