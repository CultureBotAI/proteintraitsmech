  - kind: GENERAL
    text: >-
      The protein family is involved in the biosynthesis of various polyketide-derived compounds, including pigments and polyunsaturated fatty acids (PUFAs). One member catalyzes the formation of a yellow pigment in conidia by condensing acetate units into a heptaketide naphthopyrene. Another is implicated in the production of the red antibiotic prodigiosin, facilitating the formation of a bipyrrole precursor. The remaining members are part of a PUFA synthase complex that synthesizes essential fatty acids like DHA and DPA through an anaerobic polyketide synthase pathway, distinct from the conventional fatty acid synthase pathway for saturated fatty acids. The family showcases a variety of enzymatic domains, including ketosynthase, acyl-carrier protein, and malonyl-CoA:ACP transacylase domains, which are involved in the elongation and modification of polyketide and fatty acid chains.
    source: "InterPro:IPR052568 abstract (LLM-generated, not curator-reviewed)"
