  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of gene expression through epigenetic mechanisms. They play a role in preventing gene silencing by counteracting specific methylation of DNA and histones at certain genomic loci. These proteins are part of a complex that influences RNA processing, including alternative splicing, and the epigenetic status of genes with heterochromatin regions. They are implicated in the modulation of transposable element expression and contribute to disease resistance by controlling histone methylation at key immune receptor genes, thereby affecting the production of full-length transcripts and the occupancy of RNA polymerase II.
    source: "InterPro:IPR053316 abstract (LLM-generated, not curator-reviewed)"
