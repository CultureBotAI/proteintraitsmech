  - kind: GENERAL
    text: >-
      This family of proteins includes components involved in the immune system's recognition and response to antigens. Members function as receptors on B and T lymphocytes, recognizing specific antigens to initiate adaptive immune responses. They also serve as effector molecules, mediating various immune functions such as antigen presentation, hypersensitivity reactions, and antibody-dependent cellular cytotoxicity. Some members are involved in the assembly and stabilization of major histocompatibility complex (MHC) class I molecules, facilitating antigen processing and presentation. Others are implicated in mucosal immunity, complement activation, and the clearance of pathogens and apoptotic cells. The family encompasses a range of immunoglobulins with distinct roles in humoral immunity, as well as proteins that interact with natural killer cells to trigger immune activation.
