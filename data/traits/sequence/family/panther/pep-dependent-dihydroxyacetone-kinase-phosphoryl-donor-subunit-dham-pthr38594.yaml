identifier: PANTHER:PTHR38594
label: "PEP-DEPENDENT DIHYDROXYACETONE KINASE, PHOSPHORYL DONOR SUBUNIT DHAM"
definition: >-
  Several bacteria use glycerol dehydrogenase to transform glycerol into dihydroxyacetone (Dha), which is subsequently converted into Dha phosphate (Dha-P) by an ATP- or phosphoenolpyruvate (PEP)-dependent Dha kinase. Listeria innocua possesses two potential PEP-dependent Dha kinases. This entry includes the PEP-dependent dihydroxyacetone kinases 1 and 2, phosphoryl donor subunit DhaM from Listeria innocua serovar 6a. This entry also includes DhaM from Lactococcus lactis subsp. lactis. Its structure has been solved.
