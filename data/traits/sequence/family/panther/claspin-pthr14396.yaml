identifier: PANTHER:PTHR14396
label: CLASPIN
definition: >-
  Claspin is an essential protein for the ATR-Chk1-dependent activation of the DNA replication checkpoint response in Xenopus and human cells. DNA damage induces the formation of a complex between Claspin and BRCA1, a second regulator of Chk1 activation. It is thought that ATR regulates Claspin phosphorylation in response to DNA damage and replication stress, resulting in recruitment and phosphorylation of BRCA1. BRCA1 and Claspin then function to activate Chk1. This entry represents both claspin and claspin homologues found mainly in Drosophila.
