identifier: PANTHER:PTHR46839
label: "SUSHI DOMAIN-CONTAINING PROTEIN 6"
definition: >-
  The expression of Sushi domain-containing protein 6 (SUSD6), also known as DRAGO or KIAA0247, is regulated by p53 and may cooperate with p53 as oncosuppressor. It has been shown to inhibit growth, migration, invasion of non-small-cell lung cancer through regulating the Notch pathway and work as a tumor suppressor in glioma.
