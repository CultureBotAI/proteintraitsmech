identifier: PANTHER:PTHR28620
label: "CENTROMERE PROTEIN V"
definition: >-
  This family of proteins is involved in the structural organization of chromosomes during cell division. Members are essential for the proper distribution of pericentromeric heterochromatin within interphase nuclei. They play a crucial role in the formation and organization of centromeres, which are key to chromosome alignment and segregation. Additionally, these proteins are implicated in the process of cytokinesis, the final step of cell division where the cytoplasm is divided between two daughter cells.
