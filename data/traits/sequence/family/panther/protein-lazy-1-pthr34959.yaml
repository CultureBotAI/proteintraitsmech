identifier: PANTHER:PTHR34959
label: "PROTEIN LAZY 1"
definition: >-
  The LAZY1 family contains plant-specific proteins involved in gravitropism by regulation of auxin flow. The direction of gravity is perceived by plants mainly by gravity-sensing cells (statocytes), which detect the sedimentation of starch-accumulating high-density amyloplasts. This results in a chemical signal that is transmitted to responding tissues (auxin transport), where the signal induces the differential growth of the lower and upper surfaces of gravity-responsive organs.
