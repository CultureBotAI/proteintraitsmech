identifier: PANTHER:PTHR10920
label: "RIBOSOMAL RNA METHYLTRANSFERASE"
definition: >-
  The ribosomal RNA large subunit methyltransferase E ( EC:2.1.1 ) methylates the 23S rRNA. It specifically methylates the uridine in position 2552 of 23s rRNA in the 50S particle using S-adenosyl-L-methionine as a substrate. It was previously known as cell division protein FtsJ. This entry represents the ribosomal RNA large subunit methyltransferase E family, which also includes tRNA (uridine-2'-O-)-methyltransferases. This enzyme methylates the 2'-O-ribose of nucleotides at positions 32 and 34 of the tRNA anticodon loop.
