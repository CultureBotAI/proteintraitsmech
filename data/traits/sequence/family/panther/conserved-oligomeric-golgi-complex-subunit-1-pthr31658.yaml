identifier: PANTHER:PTHR31658
label: "CONSERVED OLIGOMERIC GOLGI COMPLEX SUBUNIT 1"
definition: >-
  The conserved oligomeric Golgi complex (COG) is a peripheral membrane protein complex involved in intra-Golgi protein trafficking. The complex is composed of eight subunits that are located in two lobes; Lobe A contains COG1-4, and Lobe B is composed of COG5-8. COG1 and COG8 are required for the stable association between two COG subcomplexes.
