  - kind: GENERAL
    text: >-
      This family of proteins includes components of the mitochondrial ribosome, also known as mitoribosomes. These proteins are integral to the mitoribosome's structure and function, which is specialized for the synthesis of proteins encoded by the mitochondrial genome. Some of these proteins are essential for the formation of the mitochondrial respiratory chain's transmembrane subunits. Mitoribosomes are closely associated with the mitochondrial inner membrane, allowing for the cotranslational integration of nascent polypeptides directly into the membrane.
    source: "InterPro:IPR052837 abstract (LLM-generated, not curator-reviewed)"
