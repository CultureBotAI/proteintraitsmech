identifier: PANTHER:PTHR21527
label: "NUCLEOPORIN NUP35"
definition: >-
  NUCLEOPORIN NUP35 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21527. PANTHER protein class: transporter. Members are annotated with the molecular function lipid binding, phospholipid binding, structural constituent of nuclear pore. Members participate in nucleus organization, NLS-bearing protein import into nucleus, intracellular transport. Members localise to nuclear pore, protein-containing complex, nuclear protein-containing complex.
