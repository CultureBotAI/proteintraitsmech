  - kind: GENERAL
    text: >-
      This family of proteins includes both activating and inhibitory receptors that are widely involved in the regulation of the immune system. Members of this family are characterized by their ability to modulate cellular responses through interactions with cytoplasmic phosphatases and adapter molecules. They play roles in cellular signaling, with some acting as inhibitory receptors by recruiting phosphatases that dephosphorylate signaling molecules, thereby blocking signal transduction. Others act as activating receptors that associate with adapter molecules bearing immunoreceptor tyrosine-based activation motifs (ITAMs). These proteins are involved in processes such as immune cell regulation, target cell recognition, and activation of dendritic cells. They may also interact with viral proteins to modulate host immune responses.
