identifier: PANTHER:PTHR22633
label: "NEURONAL TYROSINE-PHOSPHORYLATED PHOSPHOINOSITIDE-3-KINASE ADAPTER 2-RELATED"
definition: >-
  This entry includes NYAP1 and NYAP2 from neuronal tyrosine-phosphorylated adaptor for the PI 3-kinase (NYAP) family (consists of NYAP1, NYAP2, NAP3/Myosin16). NYAPs activate PI3K in PI3K pathway, which is a fundamental pathway for various cellular events in neurons. They also interact with components of the WAVE1 complex, which mediates actin cytoskeleton remodeling through Arp2/3 complex. It was suggested that NYAPs connect PI3K activation to WAVE1 signalling in neurons.
