identifier: PANTHER:PTHR30545
label: "SUGAR FERMENTATION STIMULATION PROTEIN A"
definition: >-
  This family contains sugar fermentation stimulation protein SfsA, which is probably a regulatory factor involved in maltose metabolism. SfsA has been shown to bind DNA and described as a nuclease, as it contains a well-conserved PDDEXK nuclease active site. The structure of SfsA has been solved (, )
