identifier: PANTHER:PTHR47684
label: "PROTEIN TONSOKU"
definition: >-
  TONSOKU (also known as MGOUN3 or BRUSHY1 (BRU1)) is a nuclear leucine-glycine-asparagine (LGN) domain protein that links responses to DNA damage and epigenetic gene silencing in Arabidopsis. Mutants with defects in TONSOKU display a fasciated stem and disorganized meristem structures. TONSOKU is specifically expressed during S phase and acts with GIP1 synergistically for the maintenance of centromeric cohesion.
definition_source: "InterPro:IPR044227 abstract (PANTHER PTHR47684 is a member signature)"
