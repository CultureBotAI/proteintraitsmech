identifier: PANTHER:PTHR15993
label: HEMOGEN
definition: >-
  Hemogen (EDAG in human and RP59 in rat) regulates the proliferation and differentiation of hematopoietic cells and resists cell apoptosis through the activation of NF-kappa B. It may also have a role in spermatogenesis and in sex determination in chicken.
