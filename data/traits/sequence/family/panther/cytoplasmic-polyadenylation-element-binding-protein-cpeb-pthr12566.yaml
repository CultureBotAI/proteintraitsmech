identifier: PANTHER:PTHR12566
label: "CYTOPLASMIC POLYADENYLATION ELEMENT BINDING PROTEIN  CPEB"
definition: >-
  CPEB family members are RNA-binding proteins that are essential regulators of post-transcriptional gene expression. CPEBs target mRNAs defined by a cis-acting sequence in their 3' untranslated region (UTR), known as cytoplasmic polyadenylation element (CPE; with a consensus sequence of UUUUUAU). They are indirectly responsible for both translational repression and translational activation by polyadenylation. They are involved in may biological processes such as cell proliferation, senescence, cell polarity, and synaptic plasticity. They regulate the translation of maternal mRNAs controlling meiotic cell cycle progression. Mammals have four CPEBs, CPEB1-4, among which CPEB1/2/4 are essential to successful mitotic cell division. All four paralogues have two RNA recognition motifs (RRMs) and a zinc-binding domain (ZZ domain). Drosophila CPEB homologue is known as Orb2, which may have a role in long-term memory formation.
definition_source: "InterPro:IPR034819 abstract (PANTHER PTHR12566 is a member signature)"
