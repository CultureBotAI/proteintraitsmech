  - kind: GENERAL
    text: >-
      This family of proteins includes subunits of the RPD3C(L) histone deacetylase complex (HDAC), which are involved in the removal of acetyl groups from lysine residues on the N-terminal part of core histones such as H2A, H2B, H3, and H4. This deacetylation process is crucial for epigenetic repression, influencing transcriptional regulation, cell cycle progression, and developmental events. Members of this family are also implicated in linking transcriptional coactivators and corepressors, as well as in the regulation of transcription of specific genes through mechanisms involving recruitment of other proteins to promoters and modification of histones.
    source: "InterPro:IPR053051 abstract (LLM-generated, not curator-reviewed)"
