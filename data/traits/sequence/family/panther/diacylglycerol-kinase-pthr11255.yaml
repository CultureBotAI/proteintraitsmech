identifier: PANTHER:PTHR11255
label: "DIACYLGLYCEROL KINASE"
definition: >-
  Diacylglycerol (DAG) is a second messenger that acts as a protein kinase C activator. Upon cell stimulation, diacylglycerol kinase (DGK) converts DAG into phosphatidate, initiating the resynthesis of phosphatidylinositols and attenuating protein kinase C activity. Most vertebrate species contain 10 different DGK isozymes. The catalytic domain constitutes the single largest sequence element within the DGK proteins that is commonly and uniquely shared by all family members. DGK proteins can be classified into five classes based on the presence or absence of specific functional domains. DGKs play an important role in controlling diverse cellular processes including development, cell division and proliferation, neuronal and immune responses, vascular traffic, apoptosis and cytoskeletal reorganization.
definition_source: "InterPro:IPR037607 abstract (PANTHER PTHR11255 is a member signature)"
