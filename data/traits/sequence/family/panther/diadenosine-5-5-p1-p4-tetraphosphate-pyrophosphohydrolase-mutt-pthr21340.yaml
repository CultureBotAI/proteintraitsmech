definitions:
  - kind: GENERAL
    text: >-
      DIADENOSINE 5,5-P1,P4-TETRAPHOSPHATE PYROPHOSPHOHYDROLASE MUTT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21340. PANTHER protein class: metabolite interconversion enzyme, hydrolase. Members are annotated with the molecular function pyrophosphatase activity, hydrolase activity, acting on acid anhydrides, catalytic activity. and participate in purine ribonucleoside monophosphate metabolic process, biosynthetic process, ATP biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with decapping and hydrolytic activities, primarily involved in the metabolism of nucleotide-like molecules. Members of this family are capable of removing the 5'-end m7GpppN cap from viral and host mRNAs, a process essential for mRNA decay. This decapping activity is crucial for regulating mRNA turnover and may influence host protein synthesis by promoting the degradation of host mRNAs and facilitating stage-specific viral protein synthesis. Some family members also exhibit hydrolytic activity towards diphosphoinositol polyphosphates and other nucleotide polyphosphates, such as diadenosine tetraphosphate (Ap4A), which they asymmetrically hydrolyze to yield AMP and ATP. These activities suggest a role in modulating cellular processes, including the secretory pathway, potentially impacting virion formation and other cellular functions.
    source: "InterPro:IPR051325 abstract (LLM-generated, not curator-reviewed)"
