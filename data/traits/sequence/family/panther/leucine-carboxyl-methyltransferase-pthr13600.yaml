identifier: PANTHER:PTHR13600
label: "LEUCINE CARBOXYL METHYLTRANSFERASE"
definition: >-
  This group represents the Ppm1 (also known as LCMT1) subgroup of leucine carboxymethyltransferases. Ppm1 regulates the activity of serine/threonine phosphatase 2A (PP2A) through methylation of the C-terminal leucine residue of the catalytic subunit of PP2A. This affects the heteromultimeric composition of PP2A which in turn affects protein recognition and substrate specificity. Like many other methyltransferases Ppm1 uses S-adenosylmethionine (SAM) as the methyl donor. Ppm1 contains the common SAM-dependent methyltransferase core fold, with various insertions and additions creating a specific PP2A binding site.
definition_source: "InterPro:IPR016651 abstract (PANTHER PTHR13600 is a member signature)"
