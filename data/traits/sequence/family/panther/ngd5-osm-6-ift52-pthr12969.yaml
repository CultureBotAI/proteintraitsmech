identifier: PANTHER:PTHR12969
label: NGD5/OSM-6/IFT52
definition: >-
  This entry includes mammalian intraflagellar transport protein 52 homolog (IFT52) and its homologues from bacteria. IFT52 is a component of the IFT complex B complex required for the movement of components required for the assembly, maintenance and function of primary cilia. Transport occurs in both directions. Mutations in the IFT52 gene can lead to short-rib thoracic dysplasia 16 with or without polydactyly.
