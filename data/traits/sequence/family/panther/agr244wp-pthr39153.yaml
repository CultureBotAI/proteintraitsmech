identifier: PANTHER:PTHR39153
label: AGR244WP
definition: >-
  Rcf3 (YBR255c-A) associates with monomeric cytochrome c oxidase and respiratory chain supercomplexes. It is an homologue of the N-terminal Rcf2 peptide, and seems to have an overlapping role with Rcf2. A lack of Rcf2 and Rcf3 increases oxygen flux through the respiratory chain by up-regulation of the cytochrome c oxidase activity. This family of proteins is found mainly in fungi.
