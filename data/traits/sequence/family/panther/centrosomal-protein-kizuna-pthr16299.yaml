identifier: PANTHER:PTHR16299
label: "CENTROSOMAL PROTEIN KIZUNA"
definition: >-
  Kizuna (is a Japanese word meaning "bond") is a centrosomal protein required for establishing a robust mitotic centrosome architecture that can endure the forces that converge on the centrosomes during spindle formation. It is required for stabilising the expanded pericentriolar material around the centriole. It can be regulated through phosphorylation by polo-like kinase 1 (Plk1).
