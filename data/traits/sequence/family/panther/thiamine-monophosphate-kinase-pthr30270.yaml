identifier: PANTHER:PTHR30270
label: "THIAMINE-MONOPHOSPHATE KINASE"
definition: >-
  This family represents thiamine-monophosphate kinase (ThiL), an enzyme that converts thiamine monophosphate into thiamine pyrophosphate (TPP, coenzyme B1), an enzyme cofactor. Thiamine monophosphate may be derived from de novo synthesis or from unphosphorylated thiamine, known as vitamin B1. The N-terminal domain of ThiL binds ATP and is related to the ATP-binding domains of hydrogen expression/formation protein HypE, the AIR synthases, FGAM synthase and selenophosphate synthetase (SelD). Eukaryotes lack this enzyme, and add pyrophosphate from ATP to unphosphorylated thiamine in a single step.
definition_source: "InterPro:IPR006283 abstract (PANTHER PTHR30270 is a member signature)"
