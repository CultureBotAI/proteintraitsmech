  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases involved in the antephase checkpoint of the cell cycle. They function by delaying the onset of mitosis in response to microtubule poisons, acting in early prophase before chromosome condensation. These proteins are implicated in signaling mitotic stress through the ubiquitination of target proteins, leading to their proteasomal degradation. They are known to mediate 'Lys-48'-linked ubiquitination, which targets proteins for degradation, and may also facilitate 'Lys-63'-linked ubiquitination, which is typically involved in signaling rather than degradation. Members of this family are believed to act as tumor suppressors and are involved in cell cycle arrest at G2/M. They contain FHA domains, which are important for their anti-proliferative properties and may interact with phosphorylated proteins, and PBZ-type zinc fingers, which bind poly(ADP-ribose) in a zinc-dependent manner, essential for their checkpoint function.
    source: "InterPro:IPR052256 abstract (LLM-generated, not curator-reviewed)"
