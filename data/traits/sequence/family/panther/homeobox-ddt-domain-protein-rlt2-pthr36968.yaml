identifier: PANTHER:PTHR36968
label: "HOMEOBOX-DDT DOMAIN PROTEIN RLT2"
definition: >-
  This entry represents a family of plant proteins, including the Homeobox-DDT domain proteins RLT1-3 from Arabidopsis thaliana. The AtISWI chromatin remodelling complex physically interacts with RLTs, and this prevents plants from activating the vegetative-to-reproductive transition early by regulating several key genes that contribute to flower timing. RLT2 may also be involved in the transcriptional regulation of endogenous seed genes.
