  - kind: GENERAL
    text: >-
      The Dehydrogenase/reductase SDR family member 7C proteins are NADH-dependent oxidoreductases involved in the oxidation of all-trans-retinol to all-trans-retinal. They play a crucial role in the regulation of cardiac and skeletal muscle metabolic functions, maintaining Ca(2+) intracellular homeostasis by repressing Ca(2+) release from the sarcoplasmic reticulum in myotubes. These proteins are also implicated in controlling Ca(2+) overload in the cytosol and the sarcoplasmic reticulum. Additionally, they contribute to glucose uptake into skeletal muscles and enhance muscle performance by activating PI3K and mTORC2-mediated AKT1 phosphorylation signaling pathways, potentially through the production of all-trans-retinoic acid. The N-terminal region of these proteins is associated with the sarcoplasmic reticulum membrane, while the C-terminal catalytic domain is oriented towards the myoplasm.
    source: "InterPro:IPR052148 abstract (LLM-generated, not curator-reviewed)"
