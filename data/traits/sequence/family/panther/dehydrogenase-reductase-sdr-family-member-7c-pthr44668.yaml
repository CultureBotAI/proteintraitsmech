identifier: PANTHER:PTHR44668
label: "Dehydrogenase/reductase SDR family member 7C"
definition: >-
  Dehydrogenase/reductase SDR family member 7C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44668. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Subfamilies participate in intracellular calcium ion homeostasis.
