identifier: PANTHER:PTHR28235
label: "PROTEIN FYV4, MITOCHONDRIAL"
definition: >-
  The entry includes the mitochondrial small ribosomal protein mS41 family in fungi (previously known as Fyv4), a component of the mitochondrial ribosome small subunit. It is required for survival upon exposure to K1 killer toxin and has also been described in telomere length regulation.
