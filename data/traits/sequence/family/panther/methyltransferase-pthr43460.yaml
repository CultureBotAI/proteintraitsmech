    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The RlmA family consists of enzymes that are involved in the post-transcriptional modification of bacterial ribosomal RNA. Members of this family are 23S rRNA methyltransferases, which specifically methylate guanosine at position 745 (G745) in 23S rRNA. This methylation is important for the proper function of the ribosome, potentially affecting the accuracy of protein synthesis. The methyltransferase activity of these enzymes is crucial for the maturation and function of the ribosome, which is the cellular machinery responsible for protein synthesis. The RlmA family is part of the larger methyltransferase superfamily, indicating that these proteins share a common mechanism for transferring a methyl group from S-adenosylmethionine to their substrate rRNA.
    source: "InterPro:IPR052939 abstract (LLM-generated, not curator-reviewed)"
