  - kind: GENERAL
    text: >-
      CYCLIN-D-BINDING MYB-LIKE TRANSCRIPTION FACTOR 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46380. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function transcription cis-regulatory region binding, DNA-binding transcription factor activity. Members participate in regulation of DNA-templated transcription. Members localise to nucleus, intracellular anatomical structure.
