definitions:
  - kind: GENERAL
    text: >-
      CYCLIN-D-BINDING MYB-LIKE TRANSCRIPTION FACTOR 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46380. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function transcription cis-regulatory region binding, DNA-binding transcription factor activity. Members participate in regulation of DNA-templated transcription. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The DMTF1 family comprises DNA-binding proteins involved in transcriptional regulation and replication termination. Members of this family function as transcriptional activators, recognizing specific DNA sequences to regulate gene expression. For instance, they activate the CDKN2A/ARF locus in response to signaling pathways, promoting growth arrest through p53/TP53. Some family members bind to rDNA terminator elements, mediating RNA polymerase I transcription termination and contributing to rDNA stability. Others may have roles in cell integrity and transcription of RNA binding proteins. The family includes proteins that may stimulate or inhibit transcription, recognizing enhancer and promoter sites of rRNA transcription and other genes transcribed by RNA polymerase II. They are also involved in genome partitioning and may act as chromatin insulators.
    source: "InterPro:IPR051651 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
