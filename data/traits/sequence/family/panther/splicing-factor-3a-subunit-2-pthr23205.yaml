definitions:
  - kind: GENERAL
    text: >-
      SPLICING FACTOR 3A SUBUNIT 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23205. PANTHER protein class: RNA splicing factor, RNA processing factor, RNA metabolism protein. and participate in cellular aromatic compound metabolic process, protein-RNA complex assembly, cellular component biogenesis. and localise to catalytic step 2 spliceosome, U2-type spliceosomal complex, U2 snRNP.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The SF3A2 family is involved in the critical process of pre-mRNA splicing, which is essential for the removal of introns from transcribed pre-mRNAs. Members of the SF3A2 family are components of the 17S U2 SnRNP complex within the spliceosome. They play a pivotal role in early spliceosome assembly and in recognizing the intron branch site during splicing. This recognition is crucial for selecting the branch-site adenosine, which serves as the nucleophile in the first step of splicing. The SF3A2 family is also part of the SF3A subcomplex, which is necessary for the formation of the pre-spliceosome 'E' complex and the pre-catalytic spliceosome 'A' complex. Additionally, they are involved in the constitution of pre-catalytic spliceosome 'B' complexes, including the Bact complex, further underscoring their importance in the splicing pathway.
    source: "InterPro:IPR052092 abstract (LLM-generated, not curator-reviewed)"
