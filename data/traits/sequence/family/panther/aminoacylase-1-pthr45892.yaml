  - kind: GENERAL
    text: >-
      The Aminoacylase-1 family is characterized by its enzymatic function in catalyzing the hydrolysis of N-acetylated amino acids, resulting in the release of acetate and free amino acids. This reaction is a key step in the metabolism of acetylated amino acids, which are not only intermediates in the degradation of proteins but also play roles in various metabolic pathways. The family is part of the peptidase M20A family, indicating a shared structural fold and catalytic mechanism among its members. The enzymes in this family are involved in the breakdown of N-acylated or N-acetylated amino acids, with the exception of L-aspartate, which is not a substrate for these enzymes. The Aminoacylase-1 family is conserved across various species, including humans, mice, rats, pigs, and the organism Dictyostelium discoideum, highlighting its fundamental role in nitrogen metabolism.
    source: "InterPro:IPR052083 abstract (LLM-generated, not curator-reviewed)"
