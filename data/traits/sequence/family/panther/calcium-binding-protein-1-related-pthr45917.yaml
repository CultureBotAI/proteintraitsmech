identifier: PANTHER:PTHR45917
label: "CALCIUM-BINDING PROTEIN 1-RELATED"
definition: >-
  Calcium-binding proteins (CaBPs) are a family of Ca(2+)-binding proteins related to calmodulin with strong sequence similarity to Calmodulin (CaM), which is an important component of Ca(2+)-mediated cellular signal transduction in the central nervous system. Like calmodulin, CaBP family members regulate effectors such as voltage-gated Ca2+ channels in a Ca2+-dependent manner. CaBPs are localised in the brain and sensory organs. Mutations in calcium-binding protein 2 (CaBP2) cause hearing loss, revealing a role for CaBP2 in the mammalian auditory system. This family contains calcium binding protein 1, 2, 4 and 5.
