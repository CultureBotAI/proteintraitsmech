identifier: PANTHER:PTHR11250
label: TACHYKININ
definition: >-
  TACHYKININ — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11250. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function G protein-coupled receptor binding. Subfamilies participate in G protein-coupled receptor signaling pathway, inflammatory response, positive regulation of cytosolic calcium ion concentration. Subfamilies localise to extracellular region.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
