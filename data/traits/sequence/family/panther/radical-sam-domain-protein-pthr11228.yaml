identifier: PANTHER:PTHR11228
label: "RADICAL SAM DOMAIN PROTEIN"
definition: >-
  The Radical SAM superfamily is a diverse group of enzymes that perform a wide range of functions, all of which involve radical-based mechanisms. Members of this superfamily are characterised by their use of a [4Fe-4S] cluster to reductively cleave S-adenosylmethionine (SAM) to initiate radical formation. Functions within this family include the biosynthesis of various cofactors, modification of tRNA and rRNA, biotin synthesis, lipid metabolism, and the generation of radical species for use in various enzymatic transformations. Notable reactions catalysed by these enzymes include the formation of thioether bonds, oxidative decarboxylations, and the generation of complex organic molecules. Included in this family are PqqA peptide cyclase (PqqE) which is involved in the biosynthesis of pyrroloquinoline quinone (PQQ), Mycofactocin maturase MftC, an enzyme that catalyses the first step of the biosynthesis of the enzyme cofactor mycofactocin (MFT), Pre-heme d1 synthase which catalyses the removal of two propionate side chains from the intermediate 12,18-didecarboxysiroheme (DDSH) and may introduce the keto functions on rings A and B, yielding the heme d1 precursor dihydro-heme d1, and other enzymes involved in the biosynthesis of other modified biomolecules, highlighting its critical role in microbial metabolism and physiology.
definition_source: "InterPro:IPR050377 abstract (PANTHER PTHR11228 is a member signature)"
