identifier: PANTHER:PTHR35705
label: "WPP DOMAIN-INTERACTING TAIL-ANCHORED PROTEIN 1"
definition: >-
  WIT1 and WIT2 are tail-anchored proteins required for the nuclear envelope anchoring of RANGAP (Ran GTPase activating protein) in root tips in Arabidopsis. They could be involved in determining plant nuclear shape and pollen tube guidance.
