identifier: PANTHER:PTHR10579
label: "CALCIUM-ACTIVATED CHLORIDE CHANNEL REGULATOR"
definition: >-
  The CLCR family includes proteins that are involved in mediating calcium-activated chloride conductance. Members of this family may play a role in various physiological processes such as goblet cell metaplasia, mucus hypersecretion, cystic fibrosis, airway hyperresponsiveness (AHR), and the regulation of tissue inflammation in the innate immune response. Some members are implicated in the regulation of mucus production and/or secretion by goblet cells and may act as tumor suppressors. The metalloprotease region of these proteins is responsible for autoproteolytic processing and may cross-cleave other CLCA substrates. Additionally, some members are involved in cell adhesion, potentially playing a role in the early stages of lung metastasis through interaction with integrins.
definition_source: "InterPro:IPR051266 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, not curator-reviewed)"
