identifier: PANTHER:PTHR17271
label: "PLECKSTRIN HOMOLOGY  PH  DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins is involved in the regulation of the actin cytoskeleton. Members of this family target specific proteins to the actin cytoskeleton and are essential for the modulation of cytoskeletal organization. They play a role in the formation of cellular structures such as stress fibers and rootlets, and are required for processes like cell spreading, cell contraction, and mitotic progression. These proteins interact with RhoA and ROCK1 to regulate the stability of actin fibers, which is crucial for maintaining the structural integrity of muscle cells and neuronal cells. They also possess actin-binding domains, which allow them to bind and stabilize filamentous F-actin, preventing its depolymerization and facilitating the recruitment of additional proteins necessary for actin formation and turnover.
