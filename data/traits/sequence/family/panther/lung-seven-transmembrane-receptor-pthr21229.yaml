identifier: PANTHER:PTHR21229
label: "LUNG SEVEN TRANSMEMBRANE RECEPTOR"
definition: >-
  This entry represents a group of transmembrane proteins, including mammalian GPR107, GPR108, TMEM87A and TMEM87B which have been collectively termed lung seven transmembrane receptor or LUSTR and are evolutionary related. Together with GPR180, TMEM145, TMEM181, and WLS, they have been described as GOST proteins (for GOLD domain seven-transmembrane helix proteins) given they share the same domain architecture consisting of a GOLD domain atop of a membrane-spanning seven-transmembrane helix domain. GPR107 and GPR108 localize to the Golgi and have suggested roles in protein trafficking. GPR107 is implicated in the transport of Pseudomonas aeruginosa Exotoxin A, Campylobacter jejuni cytolethal distending toxin (CDT), and ricin, while GPR107 knockout cells display deficits in receptor-mediated endocytosis and recycling. GPR108 is critical for the transduction of a majority of AAV serotypes. It may play a potential role in the regulation of Toll-like receptor-mediated signaling. This entry also includes proteins from fungi and plants. The plant proteins in this entry, including CAND6 and CAND7, are predicted to be G-protein coupled receptors.
