identifier: PANTHER:PTHR32361
label: "FERRIC/CUPRIC REDUCTASE TRANSMEMBRANE COMPONENT"
definition: >-
  The ferric reductase (FRE) family comprises enzymes that function as metalloreductases, facilitating the reduction of extracellular Fe(3+) to Fe(2+) and Cu(2+) to Cu(+). Members of the FRE family are involved in the reductive uptake of iron and copper from various sources, including Fe(3+)-salts and Fe(3+) bound to catecholate or hydroxamate siderophores. The reduced Fe(2+) and Cu(+) ions dissociate from their carriers and are subsequently imported into the cell via high-affinity transport systems. These proteins play a crucial role in iron and copper homeostasis and are essential for processes such as siderophore-mediated iron acquisition, vacuolar iron and copper reduction, and maintenance of cell wall integrity and mitochondrial function. Some family members are also implicated in the regulation of growth, development, and pathogen-host interactions.
