definitions:
  - kind: GENERAL
    text: >-
      U1 SMALL NUCLEAR RIBONUCLEOPROTEIN 70 KD — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13952. PANTHER protein class: RNA splicing factor, RNA metabolism protein, RNA processing factor. Members are annotated with the molecular function mRNA binding, snRNA binding, organic cyclic compound binding. and participate in cellular aromatic compound metabolic process, biosynthetic process, organic substance metabolic process. and localise to precatalytic spliceosome, protein-containing complex, nuclear protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the splicing of pre-mRNA, a critical step in gene expression where introns are removed and exons are joined to form a mature mRNA molecule. Members of the family are components of the spliceosomal U1 small nuclear ribonucleoprotein (snRNP) complex, which recognizes the pre-mRNA 5' splice-site and facilitates the assembly of the spliceosome. The family includes proteins that bind to the U1-snRNA, particularly to the loop I region, through an RNA recognition motif (RRM) domain. Some members may also interact with the minor spliceosome and contribute to the recognition of 5' splice sites in U12-type introns. Additionally, certain proteins in the family are implicated in essential cellular processes such as oogenesis and meiotic chromosomal segregation. The family's involvement extends to nutritional signaling pathways and the regulation of sporulation-specific genes.
    source: "InterPro:IPR051183 abstract (LLM-generated, not curator-reviewed)"
