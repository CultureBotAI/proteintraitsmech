  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the halogenation of organic substrates using hydrogen peroxide. Members of this family are characterized by their ability to utilize vanadium as a cofactor in the oxidation of halides, such as chloride or bromide, to generate hypohalous acids. These acids can then react with various organic substrates to form halogenated products, which are significant in various biological and chemical processes. The enzymes are known for their role in the biosynthesis of halogenated metabolites, which can have diverse functions including antimicrobial activity.
