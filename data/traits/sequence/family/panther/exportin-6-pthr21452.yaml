identifier: PANTHER:PTHR21452
label: EXPORTIN-6
definition: >-
  XPO6 is a nuclear export receptor that transfers profilin-actin complexes from the nucleus to the cytoplasm. Reduced interaction of Exp6 and RanGTP has been linked to cellular senescence. It mediates the nuclear export of actin and profilin-actin complexes in somatic cells.
