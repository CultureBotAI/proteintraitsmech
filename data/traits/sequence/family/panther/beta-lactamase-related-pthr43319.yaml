  - kind: GENERAL
    text: >-
      This family of proteins exhibits enzymatic activities associated with the hydrolysis of ester and beta-lactam bonds. Members of this family are characterized by their ability to act as esterases, preferentially cleaving short-chain p-nitrophenol esters, as well as beta-lactamases, targeting substrates with a beta-lactam ring such as nitrocefin and ampicillin. These proteins play a role in bacterial defense mechanisms by degrading beta-lactam antibiotics, and they may also participate in various physiological processes through their esterase activity. The activity of these enzymes is subject to inhibition by specific active site residue modifiers, indicating a level of regulatory control over their function. Additionally, at least one member is known to function as an immunogen, eliciting both humoral and cell-mediated immune responses.
    source: "InterPro:IPR052907 abstract (LLM-generated, not curator-reviewed)"
