identifier: PANTHER:PTHR43270
label: "BETA-ALA-HIS DIPEPTIDASE"
definition: >-
  The peptidase M20 family is involved in the hydrolysis of dipeptides, with specific members displaying tissue-specific catabolism of threonyl dipeptides and high activity toward cysteinylglycine, an intermediate in glutathione metabolism. Some members are involved in the degradation of glutathione and other gamma-glu-X bond-containing peptides, playing roles in cell cycle arrest and apoptosis. Others specialize in the hydrolysis of Xaa-His dipeptides, such as carnosine and anserine. Additionally, one member contributes to body odor formation by hydrolyzing Cys-Gly-S-conjugates. Activity can be regulated by inhibitors like bestatin and metal ions, and some members are part of the GSH degradosomal complex.
