identifier: PANTHER:PTHR47360
label: "MUREIN DD-ENDOPEPTIDASE MEPS/MUREIN LD-CARBOXYPEPTIDASE"
definition: >-
  This family of proteins includes enzymes with murein DD-endopeptidase activity, which specifically target D-Ala-meso-diaminopimelic acid (mDAP) cross-links within bacterial cell walls. Their primary function is to facilitate cell wall expansion by cleaving these cross-links, allowing for the insertion of new glycan strands. Members of this family are functionally redundant, meaning that multiple enzymes can perform the same role within the cell. Additionally, some members exhibit weak LD-carboxypeptidase activity, which involves cleaving peptide bonds between L-mDAP and D-Ala. These activities are crucial for maintaining cell wall integrity and remodeling during growth and division.
