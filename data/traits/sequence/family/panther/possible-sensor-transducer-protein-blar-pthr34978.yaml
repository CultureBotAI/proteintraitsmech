  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the response to antibiotic stress, particularly beta-lactam antibiotics. They function as penicillin-interactive proteins and have a potential role as antirepressors. These proteins are integral membrane proteins that can sense the presence of beta-lactam antibiotics and transduce this information to the cytoplasm. This process involves the acylation of a serine residue in the sensor domain upon antibiotic binding, leading to a conformational change that activates a zinc protease domain. This domain then initiates autoproteolysis and cleavage of a transcriptional repressor, resulting in the derepression of antibiotic resistance genes.
    source: "InterPro:IPR052173 abstract (LLM-generated, not curator-reviewed)"
