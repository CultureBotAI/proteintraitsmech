  - kind: GENERAL
    text: >-
      The SWT21 family proteins are primarily involved in mRNA splicing, where they help stabilize the U1 snRNP-5' splice site interaction. The TCAB1 family proteins function as RNA chaperones, playing a crucial role in telomere maintenance and RNA localization to Cajal bodies. They recognize and bind the Cajal body box (CAB box) in small Cajal body RNAs (scaRNAs) and telomerase RNA template component (TERC), essential for telomerase holoenzyme complex activity and localization. TCAB1 proteins also contribute to DNA repair by relocalizing to DNA double-strand breaks and recruiting the ubiquitin ligase RNF8 to promote homologous recombination and non-homologous end joining.
    source: "InterPro:IPR051150 abstract (LLM-generated, not curator-reviewed)"
