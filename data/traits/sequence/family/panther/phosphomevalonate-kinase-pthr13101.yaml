identifier: PANTHER:PTHR13101
label: "PHOSPHOMEVALONATE KINASE"
definition: >-
  Phosphomevalonate kinase ( EC:2.7.4.2 ) catalyses the phosphorylation of 5-phosphomevalonate into 5-diphosphomevalonate, an essential step in isoprenoid biosynthesis via the mevalonate pathway. In an example of non orthologous gene displacement, two different types of phosphomevalonate kinase are found -the higher eukaryotic form and the ERG8 type. This model represents the form of the enzyme found in animals.
