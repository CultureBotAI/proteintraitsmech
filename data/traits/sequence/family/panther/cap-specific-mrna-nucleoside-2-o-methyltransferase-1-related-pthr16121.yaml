definitions:
  - kind: GENERAL
    text: >-
      CAP-SPECIFIC MRNA (NUCLEOSIDE-2'-O-)-METHYLTRANSFERASE 1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16121. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, catalytic activity, acting on RNA, O-methyltransferase activity. and participate in cellular aromatic compound metabolic process, macromolecule biosynthetic process, macromolecule methylation. and localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family includes S-adenosyl-L-methionine-dependent methyltransferases that are responsible for the methylation of the ribose moiety at the 5'-cap of mRNAs and small nuclear RNAs. Members of the family catalyze the transfer of a methyl group to the 2'-O position of the ribose of the first or second nucleotide next to the cap structure, producing cap1 (m(7)GpppRm) or cap2 (m(7)GpppRmpNm) modifications, respectively. These modifications are crucial for enhancing translation efficiency and may play a role in the interferon response pathway. Some members show a preference for cap0 (unmethylated) transcripts, while others can methylate both cap0 and cap1 structures. The family also includes viral proteins that methylate the cap structure of late viral transcripts, as well as uncharacterized proteins that are likely to share similar functions.
    source: "InterPro:IPR050851 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
