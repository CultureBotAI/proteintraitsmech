identifier: PANTHER:PTHR33210
label: "PROTODERMAL FACTOR 1"
definition: >-
  This family of plant proteins includes protodermal factor 1, a putative extracellular proline-rich protein that it is exclusively expressed in the L1 layer of vegetative, inflorescence and floral meristems and the protoderm of organ primordia.
