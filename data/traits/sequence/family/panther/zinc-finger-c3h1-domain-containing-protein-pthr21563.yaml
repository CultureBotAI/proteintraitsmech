identifier: PANTHER:PTHR21563
label: "ZINC FINGER C3H1 DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry contains proteins with a putative zinc finger with three conserved cysteines and a histidine (Znf-C3H1) in the C-x8-C-x5-C-x3-H conformation. NURS complex subunit red1 from the fission yeast Schizosaccharomyces pombe is required for the elimination of meiosis-specific mRNAs from mitotic cells by destabilising mRNAs containing a DSR degradation signal sequence. In addition to Red1, the nuclear RNA silencing (NURS) includes the Mtl1, Red5, Ars2, Rmn1, and Iss10 proteins and associates with several other complexes that are involved in either signalling or mediating RNA silencing. This entry also includes human zinc finger C3H1 domain-containing protein (Znf-C3H1). This is also required for mRNA degradation, and is a subunit of the trimeric poly(A) tail exosome targeting (PAXT) complex, which directs a subset of long and polyadenylated poly(A) RNAs for exosomal degradation.
definition_source: "InterPro:IPR039278 abstract (PANTHER PTHR21563 is a member signature)"
