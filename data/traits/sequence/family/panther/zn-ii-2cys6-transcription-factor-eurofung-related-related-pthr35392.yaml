identifier: PANTHER:PTHR35392
label: "ZN(II)2CYS6 TRANSCRIPTION FACTOR (EUROFUNG)-RELATED-RELATED"
definition: >-
  This entry represents a family of transcription factors from ascomycetes, including Satratoxin biosynthesis SC3 cluster transcription factor SAT20 from Stachybotrys chartarum and Transcription factor kpeA from Aspergillus oryzae. KpeA regulates kojic acid production by negatively controlling kojR and kojA expression and also affects conidial development by regulating central developmental pathway genes including brlA, abaA, and wetA. The protein requires six conserved cysteine residues for proper function in coordinating zinc ions for DNA binding. KpeA is nuclear-localised and represents a unique member of the Zn(2)-C6 transcription factor family. SAT20 is a transcriptional regulator that may regulate the expression of the satratoxin biosynthesis SC3 cluster, one of the 3 clusters involved in the biosynthesis of satratoxins, trichothecene mycotoxins that are associated with human food poisonings.
definition_source: "InterPro:IPR052973 abstract (PANTHER PTHR35392 is a member signature)"
