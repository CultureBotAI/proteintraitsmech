identifier: PANTHER:PTHR16156
label: "AFTIPHILIN A-RELATED"
definition: >-
  This entry represents Aftiphilin and related proteins from animals, including Uncharacterised protein CLBA1 (Clathrin-binding box of aftiphilin-containing protein 1). Aftin forms a stable complex with p200 and gamma-synergin. It may play a role in membrane trafficking. Aftiphilin contains a clathrin box, with two identified clathrin-binding motifs.
