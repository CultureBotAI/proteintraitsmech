identifier: PANTHER:PTHR14495
label: "SHIELDIN COMPLEX SUBUNIT 2"
definition: >-
  This entry refers to Shieldin complex subunit 2 (also known as Protein FAM35A or RINN2). Shieldin complex is composed of REV7, RINN1 (CTC-534A2.2), RINN2 (FAM35A), and RINN3 (C20ORF196), and plays an important role in repair of DNA double-stranded breaks.
