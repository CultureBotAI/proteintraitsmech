  - kind: GENERAL
    text: >-
      This family of proteins includes armadillo repeat-containing proteins involved in male fertility and sperm motility, specifically by promoting autophagic degradation of ribosomes during spermatogenesis to supply energy for sperm flagellar motility. Additionally, the family encompasses serine/threonine-protein kinases that play a role in the spatial and temporal control of cortical activities in mitotic and postmitotic cells, plasma membrane function in developing pollen, cell expansion, cell elongation, and embryo development.
