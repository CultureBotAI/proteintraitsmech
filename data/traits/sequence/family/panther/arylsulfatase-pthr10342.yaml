identifier: PANTHER:PTHR10342
label: ARYLSULFATASE
definition: >-
  This family represents Arylsulfatase B (ARSB) and its paralogues, ARSI and ARSJ. ARSB removes sulfate groups from chondroitin-4-sulfate (C4S) and regulates its degradation. It is involved in the regulation of cell adhesion, cell migration and invasion in colonic epithelium. ARSI displays arylsulfatase activity at neutral pH, when co-expressed with SUMF1. Arylsulfatase activity has been detected in the secretion medium of retinal cell line, but no activity has been recorded when measured in cell extracts.
