identifier: PANTHER:PTHR12822
label: "PROTEIN YIPF"
definition: >-
  This entry includes Yip5 from yeasts and YIPF1/YIPF2 from animals. Yip5 interacts with Rab GTPase and is localized to late Golgi vesicles. Together with YIPF6, YIPF1 and YIPF2 play a role in the Golgi reassembly and glycan synthesis.
