identifier: PANTHER:PTHR33539
label: "UPF0764 PROTEIN C16ORF89"
definition: >-
  This family of proteins is found in eukaryotes and includes human C16orf89, which is thyroid-specific. Proteins in this family are typically between 288 and 410 amino acids in length. There are two completely conserved C residues that may be functionally important.
