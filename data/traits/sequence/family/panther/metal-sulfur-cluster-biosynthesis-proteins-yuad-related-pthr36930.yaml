  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis and coordination of metal-sulfur clusters and the reduction of N-oxygenated molecules. Members of this family are characterized by the presence of a MOSC domain, which is responsible for the tight coordination of the molybdenum cofactor within the core of the enzyme. The proteins in this family play a role in various metabolic processes, including the reduction of N-hydroxylated prodrugs to increase drug bioavailability and the regulation of endogenous nitric oxide levels through the reduction of mitochondrial N(omega)-hydroxy-L-arginine. The enzymatic activity involves electron transfer from NADH to cytochrome b5 reductase and cytochrome b5, which primes the active site for substrate reduction.
    source: "InterPro:IPR052716 abstract (LLM-generated, not curator-reviewed)"
