  - kind: GENERAL
    text: >-
      This family of proteins includes oxidoreductases involved in various biosynthetic pathways. Members of this family participate in the synthesis of diverse bioactive compounds, including cytotoxic compounds, antifungal agents, meroterpenoids, and fungal alkaloids. They function in the reduction of intermediates, catalyzing reactions that contribute to the formation of complex molecules with potential pharmacological applications. These proteins are characterized by their similarity to the NmrA-type oxidoreductase family and often belong to the isoflavone reductase subfamily, indicating a role in the reduction of isoflavone-like molecules.
