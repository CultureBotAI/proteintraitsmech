identifier: PANTHER:PTHR36251
label: "FELS-1 PROPHAGE HOST SPECIFICITY PROTEIN-RELATED"
definition: >-
  This family of proteins is involved in the attachment of virions to host receptors, specifically initiating the process of viral DNA ejection. They play a crucial role in the assembly of the distal tail tip of the virus by interacting with other viral proteins. Additionally, these proteins are responsible for the irreversible binding to the host receptor, which triggers structural changes in the viral tail, culminating in the injection of viral DNA into the host cell through the receptor's trimeric pore.
