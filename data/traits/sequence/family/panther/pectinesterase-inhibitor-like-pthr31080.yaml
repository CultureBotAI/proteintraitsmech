identifier: PANTHER:PTHR31080
label: "PECTINESTERASE INHIBITOR-LIKE"
definition: >-
  This family of proteins includes inhibitors of pectin methylesterase (PME), which are involved in the modulation of PME activity and pectin methylesterification. These proteins play a crucial role in maintaining cell wall integrity, particularly in response to pathogenic attacks such as those from necrotrophic pathogens. They are also implicated in the regulation of plant development processes, including seed germination, root growth, and phyllotactic patterning, by controlling the degree of pectin methylesterification in various plant tissues. The activity of these inhibitors is pH-dependent, with a higher affinity in slightly acidic conditions.
