    text: >-
      GLIAL FIBRILLARY ACIDIC PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45652. PANTHER protein class: intermediate filament. Members are annotated with the molecular function structural constituent of cytoskeleton. Members participate in intermediate filament organization. Members localise to intermediate filament cytoskeleton, intermediate filament, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes various types of intermediate filaments that play critical roles in cell structure and integrity. They are involved in maintaining the shape and mechanical resilience of cells, especially in muscle and neuronal tissues. In muscle cells, they are essential for the proper structure and function of sarcomeres, contributing to the strength and stability of muscle fibers during contraction. In neurons, they are involved in maintaining neuronal caliber and may cooperate with other proteins to form networks that support the nervous system's architecture. Some family members are also implicated in the stabilization of specific mRNAs and may participate in transcriptional regulation.
    source: "InterPro:IPR050405 abstract (LLM-generated, not curator-reviewed)"
