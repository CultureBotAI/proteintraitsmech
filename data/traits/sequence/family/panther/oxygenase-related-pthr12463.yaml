identifier: PANTHER:PTHR12463
label: OXYGENASE-RELATED
definition: >-
  Based on homology with E. coli AlkB, nine mammalian AlkB homologues have been identified. Like E. coli AlkB, ALKBH2 and ALKBH3 have been shown to possess DNA repair activity. However, findings suggest a wide functional diversity for other mammalian AlkB proteins, with substrates ranging from DNA and RNA to protein. ALKBH4 has been demonstrated to be an active Fe(II)/2OG-dependent decarboxylase in vitro. ALKBH4 mediates demethylation of actin and thereby regulates the actin-myosin II interaction. Depletion of ALKBH4 leads to defects in cytokinesis and cell motility. This entry also includes Nmad-1, one of the five members of the ALKB family found in C. elegans, which is a 6mA DNA demethylase and may be involved in epigenetic inheritance.
definition_source: "InterPro:IPR032857 abstract (PANTHER PTHR12463 is a member signature)"
