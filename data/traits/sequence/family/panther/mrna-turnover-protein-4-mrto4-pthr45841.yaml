identifier: PANTHER:PTHR45841
label: "MRNA TURNOVER PROTEIN 4 MRTO4"
definition: >-
  This entry represents the ribosome assembly factor mrt4 and related proteins. Mrt4 is a ribosomal stalk protein uL10 (also known as P0 or Rpp0) paralogue involved in ribosome biogenesis and mRNA turnover. uL10 (P0) is cytoplasmic and is present in cytoplasmic pre-60S particles and mature 60S subunits. Mrt4, however, is nuclear and has been identified in pre-60S ribosome complexes but not in mature 60S subunits, suggesting that it binds ribosomes at an early stage of assembly in the nucleolus and during assembly it is exchanged for uL10 (P0). The dual-specificity phosphatase Yvh1 is required for Mrt4 displacement from the pre-60S subunit. P0 is required for the release of Mrt4 and exchanges with this factor at the cytoplasm.
definition_source: "InterPro:IPR033867 abstract (PANTHER PTHR45841 is a member signature)"
