identifier: PANTHER:PTHR13779
label: "WERNER HELICASE-INTERACTING PROTEIN 1 FAMILY MEMBER"
definition: >-
  This family of proteins includes ATPases associated with various cellular activities, particularly those involved in DNA replication and repair processes. Members of this family are characterized by an AAA ATPase domain that provides energy for their functions through the hydrolysis of ATP. They play crucial roles in responding to stalled DNA replication forks, maintaining DNA topology, and ensuring chromosome integrity. Some members are involved in modulating DNA polymerase delta-mediated DNA synthesis, either by stimulating or decreasing it in the presence of ATP. Additionally, certain proteins within this family contribute to the innate immune defense against viruses by interacting with components of the antiviral signaling pathway, such as RIGI and MAVS, and promoting specific polyubiquitination events that facilitate signal transduction.
