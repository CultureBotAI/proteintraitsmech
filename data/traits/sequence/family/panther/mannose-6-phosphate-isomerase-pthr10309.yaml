identifier: PANTHER:PTHR10309
label: "MANNOSE-6-PHOSPHATE ISOMERASE"
definition: >-
  Mannose-6-phosphate isomerase or phosphomannose isomerase ( ) (PMI) is the enzyme that catalyses the interconversion of mannose-6-phosphate and fructose-6-phosphate. In eukaryotes PMI is involved in the synthesis of GDP-mannose, a constituent of N-and O-linked glycans and GPI anchors and in prokaryotes it participates in a variety of pathways, including capsular polysaccharide biosynthesis and D-mannose metabolism. PMI's belong to the cupin superfamily whose functions range from isomerase and epimerase activities involved in the modification of cell wall carbohydrates in bacteria and plants, to non-enzymatic storage proteins in plant seeds, and transcription factors linked to congenital baldness in mammals. Three classes of PMI have been defined. This group represents a mannose-6-phosphate isomerase.
definition_source: "InterPro:IPR016305 abstract (PANTHER PTHR10309 is a member signature)"
