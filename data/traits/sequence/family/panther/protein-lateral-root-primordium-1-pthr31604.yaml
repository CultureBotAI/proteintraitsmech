identifier: PANTHER:PTHR31604
label: "PROTEIN LATERAL ROOT PRIMORDIUM 1"
definition: >-
  This entry represents a group of plant proteins, including protein SHORT INTERNODES (SHI) and its paralogues from Arabidopsis. In Arabidopsis, the SHI family comprises ten members. They contain a RING finger-like zinc finger motif. SHI may act as a negative regulator of GA responses through transcriptional control binding directly to the 5'-T/GCTCTAC-3' DNA motif found in the promoter regions. In rice, it regulates tillering and panicle branching by modulating SPL14/IPA1 transcriptional activity on the downstream TB1 and DEP1 target genes.
