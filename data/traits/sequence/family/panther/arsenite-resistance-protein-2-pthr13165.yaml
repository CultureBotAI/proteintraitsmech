identifier: PANTHER:PTHR13165
label: "ARSENITE-RESISTANCE PROTEIN 2"
definition: >-
  This entry includes SERRATE (SE) from plants and its homologues, Ars2, from animals and Pir2 from Schizosaccharomyces pombe. These proteins play a role in nuclear RNA metabolism. They interact with the nuclear cap-binding complex (CBC) and mediates interactions with diverse RNA processing and transport machineries in a transcript-dependent manner. Interestingly, the plant SERRATE does not have the RNA recognition motif (RRM) domain found in metazoans and S. pombe. In Arabidopsis, SE acts as a mediator between the cap-binding complex (CBC) and both the pre-mRNA splicing and primary microRNAs (miRNAs) processing machinery. Drosophila Ars2 has been shown to regulate both miRNA- and siRNA- dependent silencing and suppress RNA virus infection.
definition_source: "InterPro:IPR039727 abstract (PANTHER PTHR13165 is a member signature)"
