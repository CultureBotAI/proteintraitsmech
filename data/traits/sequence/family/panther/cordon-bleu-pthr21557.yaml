identifier: PANTHER:PTHR21557
label: CORDON-BLEU
definition: >-
  This entry includes protein cordon-bleu (COBL) and COBLL1. Single WH2 domains can sequester G-actin. COBL contains three G-actin-binding WH2 domains and act as a dynamizer of actin assembly. COBL has profilin-like filament nucleating and severing activities. It is a CaM-controlled component important for early neuronal morphogenesis.
