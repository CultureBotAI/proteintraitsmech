identifier: PANTHER:PTHR16839
label: GALANIN
definition: >-
  Galanin is a peptide hormone that controls various biological activities. Galanin-like immuno-reactivity has been found in the central and peripheral nervous systems of mammals, with high concentrations demonstrated in discrete regions of the central nervous system, including the median eminence, hypothalamus, arcuate nucleus, septum, neuro-intermediate lobe of the pituitary, and the spinal cord. Its localisation within neurosecretory granules suggests that galanin may function as a neurotransmitter, and it has been shown to coexist with a variety of other peptide and amine neurotransmitters within individual neurons. Although the precise physiological role of galanin is uncertain, it has a number of pharmacological properties: it stimulates food intake, when injected into the third ventricle of rats; it increases levels of plasma growth hormone and prolactin, and decreases dopamine levels in the median eminence; and infusion into humans results in hyperglycemia and glucose intolerance, and inhibits pancreatic release of insulin, somatostatin and pancreatic peptide. Galanin also modulates smooth muscle contractility within the gastro-intestinal and genito-urinary tracts, all such activities suggesting that the hormone may play an important role in the nervous modulation of endocrine and smooth muscle function. This family represents the 124 amino acid precursor protein to galanin. The precursor includes a signal peptide, galanin (29 amino acids), and a 60-amino acid galanin mRNA-associated peptide. In the precursor, galanin includes a C-terminal glycine and is flanked on each side by dibasic tryptic cleavage sites. The deduced amino acid sequence of rat galanin is 90% similar to porcine galanin, with all three amino acid differences in the C-terminal heptapeptide. The p
