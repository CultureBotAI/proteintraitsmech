  - kind: GENERAL
    text: >-
      This family of proteins exhibits phosphodiesterase activity, specifically hydrolyzing artificial chromogenic substrates such as bis-p-nitrophenyl phosphate and, to a lesser extent, thymidine 5'-monophosphate p-nitrophenyl ester and p-nitrophenylphosphorylcholine. They do not show catalytic activity towards cyclic nucleotides like cAMP or cGMP, nor do they act on nucleotides or typical phospholipase substrates like phosphatidylcholine. The natural substrate for these enzymes remains unidentified. They are characterized by their membership in the metallophosphoesterase superfamily and are competitively inhibited by phosphate ions, suggesting a regulatory mechanism sensitive to phosphate levels.
    source: "InterPro:IPR053193 abstract (LLM-generated, not curator-reviewed)"
