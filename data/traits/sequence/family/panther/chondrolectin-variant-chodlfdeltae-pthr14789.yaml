  - kind: GENERAL
    text: >-
      This family of proteins includes receptors and elements of receptor complexes involved in various biological processes. Members of this family have roles in the immune system, such as mediating phagocytosis enhancement and functioning as receptors for defense collagens and pulmonary surfactant proteins. Some are implicated in vascular development, including angiogenesis and hematopoietic precursor cell interactions. Additionally, certain family members are involved in the development of the nervous system, contributing to neurite outgrowth, elongation, and motor axon guidance. The family also contains receptors for hyaluronate, which may be involved in cell adhesion and signaling pathways. The diverse functions of these proteins reflect their involvement in intercellular communication and cellular response to environmental cues.
