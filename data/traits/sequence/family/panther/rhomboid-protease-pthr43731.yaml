identifier: PANTHER:PTHR43731
label: "RHOMBOID PROTEASE"
definition: >-
  The Rhomboid protease S54 family comprises mitochondrial and chloroplastic serine proteases involved in intramembrane proteolysis. Members of this family play crucial roles in various cellular processes, including the regulation of mitochondrial function, apoptosis, cell division, and sporulation. They are responsible for the proteolytic processing of several key proteins such as OPA1, PINK1, PGAM5, DIABLO/SMAC, and others, which are essential for maintaining mitochondrial integrity, morphology, and the apoptotic response. Some family members are also implicated in plant-specific functions such as root growth, floral development, and photoprotection. The family is characterized by its ability to cleave substrates within the membrane, a feature that distinguishes it from many other proteases.
