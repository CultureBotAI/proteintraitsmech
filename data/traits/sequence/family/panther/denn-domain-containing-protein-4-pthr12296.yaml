definitions:
  - kind: GENERAL
    text: >-
      DENN DOMAIN-CONTAINING PROTEIN 4 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12296. PANTHER protein class: guanyl-nucleotide exchange factor, G-protein modulator, protein-binding activity modulator. Members participate in regulation of intracellular signal transduction, regulation of cellular process, regulation of small GTPase mediated signal transduction. Members localise to cytoplasmic vesicle, intracellular vesicle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The DENN domain-containing protein family functions as guanine nucleotide exchange factors (GEFs) that activate various RAB proteins, including RAB10 and RAB12, by promoting the exchange of GDP for GTP, thus converting them from an inactive to an active form. These proteins play crucial roles in cellular processes such as autophagy, vesicular trafficking, and maintenance of cell polarity. They are involved in the regulation of autophagy in response to starvation, protein transport from recycling endosomes to lysosomes, and insulin-stimulated glucose transporter delivery to the plasma membrane. Additionally, some family members are implicated in the development and maintenance of photoreceptor cells, cytokinesis, polarized cell expansion, and basal resistance against bacteria.
    source: "InterPro:IPR051696 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
