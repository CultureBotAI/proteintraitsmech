identifier: PANTHER:PTHR42955
label: "GLYCERALDEHYDE-3-PHOSPHATE DEHYDROGENASE"
definition: >-
  This family of proteins includes enzymes that are essential for the glycolytic pathway. They are responsible for the conversion of glyceraldehyde 3-phosphate to 1,3-bisphosphoglycerate, a reaction that involves the use of NAD as a cofactor. Initially, a hemiacetal intermediate is formed between the substrate and a cysteine residue within the enzyme. This intermediate is then oxidised to a thioester, resulting in the reduction of NAD to NADH. Subsequently, the thioester is targeted by inorganic phosphate, leading to the production of 1,3-bisphosphoglycerate. The process is critical for cellular energy production, as it contributes to the generation of ATP and NADH, which are vital for various metabolic processes. Members are mainly found in proteobacteria.
