identifier: PANTHER:PTHR10331
label: "T COMPLEX PROTEIN 10"
definition: >-
  Proteins in this family include T-complex protein 10 homolog 1 (TCP10L) and its paralogue centromere protein J (CENPJ, also known as Centrosomal P4.1-associated protein, CPAP). TCP10L is expressed specifically in the nucleus of spermatogenic cells during spermatogenesis and it interacts with DAPK-3 which implies that TCP10L might play crucially important roles in spermatogenesis through its interaction with DAPK-3. It may be involved in transcriptional regulation. It acts as a tumour suppressor in hepatocellular carcinoma (HCC) cells. CENPJ is involved in centriole-length regulation. It allows persistent slow growth of the centriolar microtubule plus end and its overexpression leads to abnormally long microtubules. CENPJ not only inhibits microtubule nucleation from the centrosome, but acts as a microtubule plus-end tracking protein that stabilises centriolar microtubules and inhibits microtubule polymerisation and extension from the distal ends of centrioles.
definition_source: "InterPro:IPR026581 abstract (PANTHER PTHR10331 is a member signature)"
