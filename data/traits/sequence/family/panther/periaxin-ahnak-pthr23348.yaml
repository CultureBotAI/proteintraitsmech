definitions:
  - kind: GENERAL
    text: >-
      PERIAXIN/AHNAK — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23348. and participate in regulation of RNA splicing, regulation of gene expression, regulation of macromolecule metabolic process. and localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes scaffolding components that are essential for the structural integrity and function of myelinated nerves. They play a crucial role in the maintenance of the peripheral myelin sheath, which is crucial for efficient nerve impulse transmission and sensory perception. These proteins are involved in the transport of specific mRNAs and are necessary for remyelination after nerve injury. They also contribute to the elongation of Schwann cells and the proper spacing of nodes of Ranvier, affecting the speed of nerve impulse conduction. Additionally, they participate in the formation of specific cytoplasmic structures in myelinated nerves and are implicated in recruiting other proteins to the Schwann cell membrane. In the eye lens fiber cells, they are part of complexes that maintain proper cell morphology and plasma membrane composition.
    source: "InterPro:IPR052082 abstract (LLM-generated, not curator-reviewed)"
