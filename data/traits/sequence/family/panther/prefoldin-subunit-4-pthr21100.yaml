identifier: PANTHER:PTHR21100
label: "PREFOLDIN SUBUNIT 4"
definition: >-
  This group represents a prefoldin, subunit 4 (PFDN4, also known as Gim3 in budding yeasts). PFDN4 is part of the prefoldin heterohexamer copmlex (consists of two PFD-alpha type and four PFD-beta type subunits) that binds specifically to cytosolic chaperonin (c-CPN) and transfers targeted proteins to it. It binds to nascent polypeptide chain and promotes folding in an environment in which there are many competing pathways for nonnative proteins.
