identifier: PANTHER:PTHR14235
label: OSTEOCALCIN
definition: >-
  Bone gamma-carboxyglutamic acid protein (BGP), also known as osteocalcin, is a calcium-binding bone matrix protein that contains the vitamin-K-dependent amino acid, gamma-carboxyglutamic acid. It is a noncollagen proteins made in osteoblasts and odontoblasts and has been linked to bone formation. It may also act as a hormone to affect insulin sensitivity and energy expenditure; however, only the undercarboxylated form of osteocalcin is active.
