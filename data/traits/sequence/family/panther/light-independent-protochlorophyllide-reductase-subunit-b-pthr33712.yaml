identifier: PANTHER:PTHR33712
label: "LIGHT-INDEPENDENT PROTOCHLOROPHYLLIDE REDUCTASE SUBUNIT B"
definition: >-
  The ChlB/BchB/BchZ family includes proteins involved in the biosynthesis of chlorophylls and bacteriochlorophylls. Members of this family function as components of the dark-operative protochlorophyllide reductase (DPOR) complex, which catalyzes the light-independent reduction of ring D of protochlorophyllide (Pchlide) to form chlorophyllide a (Chlide). This reaction is crucial for chlorophyll biosynthesis in photosynthetic organisms. The complex uses Mg-ATP and reduced ferredoxin as substrates. Some members are also involved in converting chlorophylls into bacteriochlorophylls by reducing ring B of the tetrapyrrole. Additionally, the family includes proteins that may play a role in the biosynthesis of the prosthetic group of nitrogenase (FeMo cofactor), which is essential for nitrogen fixation in certain bacteria.
