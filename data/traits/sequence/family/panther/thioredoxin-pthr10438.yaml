identifier: PANTHER:PTHR10438
label: THIOREDOXIN
definition: >-
  This family of proteins is involved in redox regulation, acting as thiol-disulfide oxidoreductases. They participate in various redox reactions by reversibly oxidizing their active center dithiol to a disulfide, which can activate or regulate a number of cytosolic enzymes. Some members are known to play roles in response to pathogens, oxidative stresses, and in the regulation of MAP kinases. Thioredoxin domain-containing protein 2 from mouse, may be involved in processes such as sperm development and fibrous sheath assembly in sperm tail morphogenesis. Additionally, they are implicated in the biosynthesis of host-selective toxins in certain plant pathogens.
