identifier: PANTHER:PTHR28646
label: "TRANSMEMBRANE PROTEIN 201"
definition: >-
  TMEM201, also known as SAMP1, is a RanGTP binding transmembrane protein found in the inner nuclear membrane. It is functionally associated with the LINC complex protein Sun1 and proteins of the A-type lamina network. In Caenorhabditis elegans, it plays a role in nuclear migration.
