identifier: PANTHER:PTHR48407
label: "CRANIOFACIAL DEVELOPMENT PROTEIN 1"
definition: >-
  This family includes SWR1-complex protein 5 (Swc5) from fungi, craniofacial development protein 1 (CFDP1) and 2 (CFDP2) from animals and some uncharacterised protein from plants. Swc5 is a component of the SWR1 complex which mediates the ATP-dependent exchange of histone H2A for the H2A variant HZT1 leading to transcriptional regulation of selected genes by chromatin remodeling. It is involved in chromosome stability. Gene duplication of the ancestral bnct (bucentaur) gene leads to the h-type bnct (cfdp1) gene and the p97bcnt (cfdp2) gene. Cfdp2 is rumiant-specific, containing a region derived from the endonuclease domain of a retrotransposable element RTE-1 not found in human and mouse. For this reason bcnt has been used as a model for molecular evolution. CFDP1, also known as Cp27, may play a role during embryogenesis.
definition_source: "InterPro:IPR027124 abstract (PANTHER PTHR48407 is a member signature)"
