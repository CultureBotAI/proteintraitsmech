identifier: PANTHER:PTHR33403
label: SPR1
definition: >-
  This entry represents a group of plant proteins, including SPR1 and SP1L1-5 from Arabidopsis. They may share the same functions and act redundantly to control directional cell expansion by organizing cortical microtubule orientation.
