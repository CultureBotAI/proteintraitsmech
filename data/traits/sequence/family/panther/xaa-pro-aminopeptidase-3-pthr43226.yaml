identifier: PANTHER:PTHR43226
label: "XAA-PRO AMINOPEPTIDASE 3"
definition: >-
  Xaa-Pro dipeptidase specialises in the hydrolysis of dipeptides where the C-terminal residue is either proline (Xaa-Pro) or hydroxyproline. These enzyme preferentially cleave Gly-Pro dipeptides but are also capable of processing other dipeptides with a prolyl residue, such as Ala-Pro, Met-Pro, Phe-Pro, Val-Pro, and Leu-Pro. It plays a crucial role in collagen metabolism by breaking down the high concentration of imino acids present in collagen. Additionally, the human homologue is known to be regulated by specific inhibitors, which can indirectly influence inflammatory processes by affecting the CARD8 inflammasome.
definition_source: "InterPro:IPR052433 abstract (PANTHER PTHR43226 is a member signature)"
