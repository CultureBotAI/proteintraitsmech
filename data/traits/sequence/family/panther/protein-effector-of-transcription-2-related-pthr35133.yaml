identifier: PANTHER:PTHR35133
label: "PROTEIN EFFECTOR OF TRANSCRIPTION 2-RELATED"
definition: >-
  Effectors of transcription (ETs) are plant-specific regulatory proteins characterised by the presence of two to five C-terminal DNA- and Zn-binding repeats, and a highly conserved cysteine pattern. There are three ETs in Arabidopsis thaliana. AtET2 plays a role in the regulation of plant hormone GA (gibberellin) and cell-cycle-related protein GASA4. Regulation of GA response has also been observed in Brassica napus ET, and could be a conserved feature of these proteins.
definition_source: "InterPro:IPR038909 abstract (PANTHER PTHR35133 is a member signature)"
