  - kind: GENERAL
    text: >-
      The LytR/CpsA/Psr (LCP) family proteins are involved in cell wall biosynthesis and maintenance. Members of this family are responsible for the transfer of anionic cell wall polymers (APs) from their lipid-linked precursors to peptidoglycan, which is a critical step in cell wall teichoic acid biosynthesis. This function is essential for maintaining cell wall integrity and is implicated in the regulation of resistance to certain antibiotics, such as oxacillin and teicoplanin. Additionally, some family members are associated with the regulation of virulence factors, biofilm formation, and stress response mechanisms. The LCP family includes proteins with regulatory roles, such as MsrR, which is involved in SarA attenuation, affecting both antibiotic resistance and virulence factor synthesis. Other members, like TagU, TagT, and TagV, are polyisoprenyl-teichoic acid--peptidoglycan teichoic acid transferases, directly participating in teichoic acid attachment to the cell wall. The family also encompasses proteins with broader roles in cell wall biosynthesis, such as LcpA, which may transfer arabinogalactan onto peptidoglycan.
    source: "InterPro:IPR050922 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
