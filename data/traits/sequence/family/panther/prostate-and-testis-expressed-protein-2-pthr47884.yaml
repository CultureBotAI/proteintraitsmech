identifier: PANTHER:PTHR47884
label: "PROSTATE AND TESTIS EXPRESSED PROTEIN 2"
definition: >-
  Prostate and testis expressed protein 2 (PATE2, also known as PATE-M) belongs to the PATE family and is expressed in prostate and testis. PATE proteins are secreted, small, cysteine-rich proteins selectively expressed in male reproductive tissues involved in sperm-oolemma fusion and penetration (prostate, testis, epididymis, seminal vesicle), but not sperm-zona binding. These proteins include 10 cysteine residues conforms to a consensus cysteine pattern found in a well-conserved large family of three-fingered proteins (TFPs), characterised by a distinct disulfide bonding pattern between 8 and 10 cysteine residues. Critical roles of the PATE (Pate)-like proteins in activities related not only to fertility and reproduction but also to neuronal activity. Neurons and sperm share many common "neuron specific" receptors. Nicotinic acetylcholine receptors (nACHR) subunits alpha7, 9, 3, 5 and beta 4 have all been demonstrated to be present in human sperm and the alpha-7 subunit likely exists as a homomer in the posterior post-acrosomal and neck regions of sperm. Human acrosome reaction initiated by acetylcholine involves the alpha-7 nAChR. Common functionality of nAChR in both reproductive and neuronal tissues thus reconciles the neuro-modulatory activity of the PATE (Pate)-like proteins.
definition_source: "InterPro:IPR029691 abstract (PANTHER PTHR47884 is a member signature)"
