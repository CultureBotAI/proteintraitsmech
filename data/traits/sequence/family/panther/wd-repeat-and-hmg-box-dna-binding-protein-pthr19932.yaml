identifier: PANTHER:PTHR19932
label: "WD REPEAT AND HMG-BOX DNA BINDING PROTEIN"
definition: >-
  WD REPEAT AND HMG-BOX DNA BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19932. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function chromatin binding. and participate in DNA repair, DNA damage response, mitotic cell cycle. and localise to membrane-enclosed lumen, non-membrane-bounded organelle, chromosome.
