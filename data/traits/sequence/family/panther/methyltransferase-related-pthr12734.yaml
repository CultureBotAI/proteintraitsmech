identifier: PANTHER:PTHR12734
label: METHYLTRANSFERASE-RELATED
definition: >-
  This entry includes yeast Bud23 and its homologues from animals and plants. They are S-adenosyl-L-methionine-dependent methyltransferases that specifically methylates the N7 position of a guanine in 18S rRNA. Bud23 homologue in Arabidopsis, known as Rid2 (ROOT INITIATION DEFECTIVE 2), is also involved in pre-rRNA processing. This protein requires the methyltransferase adapter protein TRM112 for full rRNA methyltransferase activity.
