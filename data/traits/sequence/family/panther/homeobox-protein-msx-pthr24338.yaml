identifier: PANTHER:PTHR24338
label: "HOMEOBOX PROTEIN MSX"
definition: >-
  The Msh homeobox family is involved in a variety of developmental processes, including transcriptional repression, bone and tooth development, limb-pattern formation, and embryonic morphogenesis. Members act as transcriptional regulators, with some repressing the transcription of genes involved in myoblast differentiation and odontoblast differentiation. They bind to specific DNA sequences to regulate gene expression and are involved in reciprocal signaling between dental epithelial and mesenchymal cells. They also play roles in the development of the inner ear, the formation of the middle ear, skull, and nasal bones, and the proper production of touch cell precursors. The family's functions are stage-specific and involve interactions with other proteins such as PIAS1 and histone methyltransferases to modulate gene expression and cellular differentiation.
