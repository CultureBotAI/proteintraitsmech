identifier: PANTHER:PTHR12292
label: "RWD DOMAIN-CONTAINING PROTEIN"
definition: >-
  RWD domain containing 1 (RWDD1) and Gir2 from S. cerevisiae have a similar amino acid composition. RWDD1 has been shown to interact with the androgen receptor and functions as a coactivator of androgen-dependent transcription. Gir2 and its interacting partner, Rbg1, associate with ribosomes.
