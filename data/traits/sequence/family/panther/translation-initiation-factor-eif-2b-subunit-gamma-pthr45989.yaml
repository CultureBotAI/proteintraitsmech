definitions:
  - kind: GENERAL
    text: >-
      TRANSLATION INITIATION FACTOR EIF-2B SUBUNIT GAMMA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45989. PANTHER protein class: translation initiation factor, translation factor, translational protein. Members are annotated with the molecular function translation regulator activity, nucleic acid binding, translation initiation factor activity, guanyl-nucleotide exchange factor activity. and participate in organonitrogen compound biosynthetic process, translational initiation, cytoplasmic translation. and localise to cytoplasm, guanyl-nucleotide exchange factor complex, intracellular protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins functions as components of the eukaryotic translation initiation factor 2B (eIF2B) complex. They play a crucial role in the initiation of protein synthesis by catalyzing the exchange of GDP for GTP on the eIF2 complex gamma subunit. This exchange is essential for the recruitment of methionyl-initiator methionine tRNA to the ribosome. The activity of these proteins is regulated by the phosphorylation status of the eIF2 alpha subunit, with phosphorylation repressing their guanine nucleotide exchange factor activity, leading to a reduction in global protein synthesis. Additionally, some members are known to be activated by specific chemical inhibitors of the integrated stress response, which enhance their activity regardless of the phosphorylation state of eIF2.
    source: "InterPro:IPR051960 abstract (LLM-generated, not curator-reviewed)"
