identifier: PANTHER:PTHR13016
label: "AMMECR1 HOMOLOG"
definition: >-
  Nuclear protein AMMECR1, presently a protein of unknown function, is encoded by one of the genes affected by an X-linked deletion that causes the association of Alport syndrome, midface hypoplasia, intellectual disability and elliptocytosis in humans. Homologues appear in species ranging from bacteria and archaea to eukaryotes, including Protein PH0010 from Pyrococcus horikoshii. The high level of conservation of the AMMECR1 domain points to a basic cellular function, potentially in either the transcription, replication, repair or translation machinery.
definition_source: "InterPro:IPR023473 abstract (PANTHER PTHR13016 is a member signature)"
