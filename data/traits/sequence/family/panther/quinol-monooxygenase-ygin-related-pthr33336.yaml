  - kind: GENERAL
    text: >-
      The LsrG family is involved in the degradation of phospho-AI-2, which terminates the induction of the lsr operon and closes the AI-2 signaling cycle. Members of this family catalyze the isomerization of (4S)-4-hydroxy-5-phosphonooxypentane-2,3-dione (P-DPD) to 3-hydroxy-5-phosphonooxypentane-2,4-dione (P-HPD). This reaction is a key step in the quorum sensing pathway, a mechanism that bacteria use to regulate gene expression in response to changes in cell-population density. Some members of the LsrG family are also putative monooxygenases that may contribute to the degradation of aromatic compounds or may function in redox cycles related to quinone metabolism.
    source: "InterPro:IPR050744 abstract (LLM-generated, not curator-reviewed)"
