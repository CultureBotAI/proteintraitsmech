identifier: PANTHER:PTHR32039
label: "MAGNESIUM-CHELATASE SUBUNIT CHLI"
definition: >-
  Magnesium-chelatase is a three-component enzyme, consisting of CHLI, CHLD and CHLH subunits, that catalyses the insertion of Mg2 into protoporphyrin IX, the first unique step in the synthesis of (bacterio)chlorophyll. As a result, Mg-chelatase has an important role in channeling intermediates into the (bacterio)chlorophyll branch in response to conditions suitable for photosynthetic growth. The reaction takes place in two steps including an ATP-dependent activation followed by an ATP-dependent chelation step. This family represents CHLI subunit (38-42kDa), which possesses high affinity for ATP and play a major role in chlorophyll biosynthesis, as ATP hydrolysis by this subunit is crucial for this reaction and its activity is a determinant of the rate of Mg insertion into the tetrapyrrole ring. In Arabidopsis there are two CHLI isoforms, CHLI1 and CHLI2, which share similar expression profiles but CHLI2 has a lower ATPase activity than CHLI1 and a limited role in chlorophyll biosynthesis. However, CHLI2 contributes to the assembly of the Mg-chelatase complex. It does not bind abscisic acid (ABA), but is a positive regulator of ABA signaling.
definition_source: "InterPro:IPR045006 abstract (PANTHER PTHR32039 is a member signature)"
