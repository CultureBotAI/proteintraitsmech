identifier: PANTHER:PTHR31215
label: "OS05G0510400 PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant F-box proteins, including AUF1 (At1g78100) and AUF2 (At1g22220) from Arabidopsis. AUF1/2 may mediate the crosstalk between auxin and cytokinin, which modifies auxin distribution and ultimately root elongation.
