  - kind: GENERAL
    text: >-
      This family of proteins functions as peptidyl-prolyl cis-trans isomerases (PPIases) that catalyze the isomerization of proline imidic peptide bonds in oligopeptides, which is a rate-limiting step in protein folding. These enzymes are known to facilitate the proper folding of proteins during synthesis. Members of this family exhibit a specificity for substrates that have proline or hydroxyproline residues, such as certain types of collagen. They are also subject to inhibition by immunosuppressive drugs like tacrolimus, also known as FK506.
