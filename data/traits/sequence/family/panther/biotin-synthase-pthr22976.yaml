identifier: PANTHER:PTHR22976
label: "BIOTIN SYNTHASE"
definition: >-
  This family consists of biotin synthase (BioB), bifunctional biotin synthase AB (BioAB), 6-carboxymethyl-5-methyl-4-hydroxy-2-pyridinol synthase (HcaG) and similar radical SAM enzymes with a TIM barrel structure. Biotin synthase works with flavodoxin, S-adenosylmethionine, and possibly cysteine to catalyze the last step of the biotin biosynthetic pathway. The reaction consists of the introduction of a sulphur atom into dethiobiotin, thus requiring activation of C-H bonds. Biotin (vitamin H) is a prosthetic group in enzymes catalysing carboxylation and transcarboxylation reactions. Biotin synthase from Escherichia coli is a homodimer of 76kDa, with each polypeptide chain carrying an oxygen-sensitive (4Fe-4S) cluster, probably ligated by three cysteines of a CXXXCXXC box conserved among all known BioB sequences and a fourth still not identified ligand. BioB displays a pyridoxal phosphate-dependent cysteine desulphurase activity, which allows mobilisation of the sulphur atom from free cysteine. HcgA from Methanocaldococcus maripaludis (HcgA) is involved in the biosynthesis of the iron-guanylylpyridinol (FeGP) cofactor used by [Fe]-hydrogenase. It catalyses the formation of 6-carboxymethyl-5-methyl-4-hydroxy-2-pyridinol.
definition_source: "InterPro:IPR002684 abstract (PANTHER PTHR22976 is a member signature)"
