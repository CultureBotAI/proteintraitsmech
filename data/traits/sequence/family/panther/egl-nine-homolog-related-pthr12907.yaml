identifier: PANTHER:PTHR12907
label: "EGL NINE HOMOLOG-RELATED"
definition: >-
  The protein family includes prolyl hydroxylases that function as cellular oxygen sensors, catalyzing the post-translational formation of 4-hydroxyproline in hypoxia-inducible factor (HIF) alpha proteins under normoxic conditions. These enzymes hydroxylate specific proline residues within the oxygen-dependent degradation domains of HIF1A and HIF2A, leading to their proteasomal degradation via the von Hippel-Lindau ubiquitination complex. Under hypoxic conditions, the hydroxylation reaction is reduced, allowing HIFs to avoid degradation, translocate to the nucleus, heterodimerize with HIF1B, and increase the expression of hypoxia-inducible genes. The family plays a critical role in various physiological processes including hypoxia tolerance, apoptosis regulation in cardiac and skeletal muscle, neuronal death, cell cycle regulation, primary cilia formation, and the DNA damage response. Substrate selectivity is attributed to a characteristic Beta(2)beta(3) 'finger-like' loop domain.
