identifier: PANTHER:PTHR44542
label: "THIOSULFATE SULFURTRANSFERASE 18"
definition: >-
  This entry represents a group of rhodanese-like domain-containing proteins from bacteria, archaea and plants, including STR17/STR18/HARC1 from Arabidopsis. HARC1 is an arsenate reductase that reduces arsenate to arsenite in the root, facilitating efflux of arsenic back into the soil to limit both its accumulation in the root and transport to the shoot. STR17/STR18 are sulfurtransferases. STR18 catalyses the transfer of a sulfur ion from a donor to cyanide or to other thiol compounds.
