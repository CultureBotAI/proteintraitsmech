identifier: PANTHER:PTHR11864
label: "PRE-MRNA-PROCESSING PROTEIN PRP40"
definition: >-
  This entry represents a group of pre-mRNA-processing proteins, including budding yeast Prp40, and its homologues. Prp40 is required for pre-spliceosome formation, which is the first step of pre-mRNA splicing. In human, there are two Prp40 homologues, PRP40A and PRP40B. They are also involved in pre-mRNA splicing.
