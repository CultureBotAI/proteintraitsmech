  - kind: GENERAL
    text: >-
      DNA GYRASE/TOPOISOMERASE SUBUNIT A — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43493. PANTHER protein class: DNA topoisomerase. Members are annotated with the molecular function ATP-dependent activity, acting on DNA, ATP-dependent activity, DNA binding. and participate in cellular aromatic compound metabolic process, DNA conformation change, cellular component organization. and localise to protein-containing complex, catalytic complex.
