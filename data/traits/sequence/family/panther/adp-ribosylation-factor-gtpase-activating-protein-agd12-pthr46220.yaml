identifier: PANTHER:PTHR46220
label: "ADP-RIBOSYLATION FACTOR GTPASE-ACTIVATING PROTEIN AGD12"
definition: >-
  This entry represents a group of plant ADP-ribosylation factor GTPase-activating proteins (ArfGAPs), such as AGD11/12/13 from Arabidopsis. ArfGAPs are a family of proteins containing an ArfGAP catalytic domain that induces the hydrolysis of GTP bound to the small guanine nucleotide-binding protein Arf, a member of the Ras superfamily of GTPases. Of all known members belonging to the ARF-GAP protein family only AGD11, 12, and 13 possess a C2 domain enabling them to bind phospholipids, phosphoinositide and proteins in a calcium-dependent manner.
