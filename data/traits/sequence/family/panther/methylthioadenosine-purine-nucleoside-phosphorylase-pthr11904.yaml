identifier: PANTHER:PTHR11904
label: "METHYLTHIOADENOSINE/PURINE NUCLEOSIDE PHOSPHORYLASE"
definition: >-
  This entry consists of three clades of purine phosphorylases based on a neighbour-joining tree using the MTAP family as an out group. The highest-branching clade (InterPro:IPR011269) consists of a group of sequences from both Gram-positive and Gram-negative bacteria which have been shown to act as purine nucleotide phosphorylases but whose physiological substrate and role in vivo remain unknown. Of the two remaining clades, one is xanthosine phosphorylase (XAPA, InterPro:IPR010943); it is limited to certain gammaproteobacteria and constitutes a special purine phosphorylase found in a specialised operon for xanthosine catabolism. The enzyme also acts on the same purines (inosine and guanosine) as the other characterised members of this subfamily, but is only induced when xanthosine must be degraded. The remaining and largest clade consists of purine nucleotide phosphorylases (PNPH, InterPro:IPR011270) from metazoa and bacteria which act primarily on guanosine and inosine, and do not act on adenosine. Sequences from Clostridium and Thermotoga fall between these last two clades and are uncharacterised with respect to substrate range.
definition_source: "InterPro:IPR011268 abstract (PANTHER PTHR11904 is a member signature)"
