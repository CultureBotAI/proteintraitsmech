identifier: PANTHER:PTHR33864
label: "NEUROPEPTIDE-LIKE PROTEIN-RELATED"
definition: >-
  This family of neuropeptides is found in invertebrates including Orcokinin peptides type A/B (ORCKA/B). Orcokinin precursor-related peptides have been identified in the brain of the crayfish Procambarus clarkii. Orcokinins are crustacean peptides eliciting potent myotropic effects in gut tissues, and are also found in other invertebrates.
