identifier: PANTHER:PTHR48461
label: "MULTICOPPER OXIDASE LPR1-LIKE"
definition: >-
  Multicopper oxidase LPR1 and LPR2 are involved in copper homeostasis and oxidative stress response, particularly in the context of root growth and inorganic phosphate homeostasis in plants. Members of the family function in a common pathway that modulates root meristem activity in response to phosphate availability. LPR1 may contribute to the oxidative stress response by oxidizing various substrates, as shown with 2,2'-azinobis-(3-ethylbenzthiazoline-6-sulphonate) in vitro, suggesting a broader role in plant metabolism and environmental stress adaptation. LPR1 is involved in the regulation of the auxin response to Pi starvation and function in opposite ways in regulating the root growth response to Pi starvation in the endoplasmic reticulum compared to LPR2.
definition_source: "InterPro:IPR052152 abstract (PANTHER PTHR48461 is a member signature)"
