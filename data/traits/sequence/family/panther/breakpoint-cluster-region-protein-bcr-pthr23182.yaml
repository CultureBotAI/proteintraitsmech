identifier: PANTHER:PTHR23182
label: "BREAKPOINT CLUSTER REGION PROTEIN  BCR"
definition: >-
  Abr (active breakpoint cluster region-related protein) and Bcr (breakpoint cluster region protein) are homologous proteins containing a C-terminal domain with GTPase-activating protein (GAP) activity specific for Rac. They control multiple cellular functions of murine macrophages. They contain several domains, including tandem DH-PH, C2 and GAP domains. Bcr has an extra N-terminal oligomerization domain.
