identifier: PANTHER:PTHR46314
label: "SOLUTE CARRIER FAMILY 25 MEMBER 44"
definition: >-
  SLC25A44 belongs to the the solute carrier family 25 (SLC25). Members of SLC25 are known to transport molecules across the mitochondrial membrane. In brown adipose tissue (BAT), SLC25A44 has been shown to transport branched-chain amino acid (BCAA; valine, leucine and isoleucine) into mitochondria and to be required for BCAA catabolism.
