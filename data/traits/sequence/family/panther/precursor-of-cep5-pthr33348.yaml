identifier: PANTHER:PTHR33348
label: "PRECURSOR OF CEP5"
definition: >-
  This entry includes CEP proteins from Arabidopsis thaliana, including CEP2/CEP5-10. They may serve as negative regulators that mediate environmental influences on plant development. They are extracellular signalling peptides that may regulate primary root growth rate and systemic nitrogen (N)-demand signalling. They mediate up-regulation of genes involved in N uptake and assimilation pathways. CEP5 represses plant growth rate, it regulates shoot gravitropic responses.
