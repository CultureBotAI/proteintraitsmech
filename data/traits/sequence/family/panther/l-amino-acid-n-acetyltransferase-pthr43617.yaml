    text: >-
      L-AMINO ACID N-ACETYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43617. PANTHER protein class: acetyltransferase. Members are annotated with the molecular function acyltransferase activity, transferring groups other than amino-acyl groups, acyltransferase activity.
