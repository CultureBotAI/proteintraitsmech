identifier: PANTHER:PTHR41709
label: "KAIB-LIKE PROTEIN 1"
definition: >-
  The cyanobacterial circadian clock protein KaiB is encoded in the kaiABC operon that controls circadian rhythms. It is a component of the KaiABC clock protein complex, which constitutes the main circadian regulator in cyanobacteria. KaiB has homologues of unknown function in some Archaea and Proteobacteria, and paralogs in some Cyanobacteria. KaiB forms homodimers, homotetramers, and multimeric complexes with KaiA and/or KaiC.
