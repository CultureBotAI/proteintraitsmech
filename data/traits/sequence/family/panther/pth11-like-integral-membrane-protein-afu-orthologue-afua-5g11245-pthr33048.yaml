identifier: PANTHER:PTHR33048
label: "PTH11-LIKE INTEGRAL MEMBRANE PROTEIN (AFU_ORTHOLOGUE AFUA_5G11245)"
definition: >-
  The Satratoxin biosynthesis SC1-like family is involved in the biosynthesis of various secondary metabolites with diverse biological activities. Members of the family are typically part of gene clusters that mediate the production of compounds such as wortmanamides, satratoxins, polyenoic acids, tetraketides fugralins and phomoidrides. These metabolites have roles ranging from antihypercholesterolemic agents to potential manipulators of microbiota. The family includes proteins with functions such as polyketide synthases, condensation domains, acetyltransferases, and enzymes for modification and transport. The exact roles of some members within their respective pathways are yet to be elucidated, but they are collectively important for the biosynthesis and functional expression of bioactive compounds. This family includes rhodopsin domain-containing proteins
definition_source: "InterPro:IPR052337 abstract (PANTHER PTHR33048 is a member signature)"
