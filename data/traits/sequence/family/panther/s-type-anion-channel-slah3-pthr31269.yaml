identifier: PANTHER:PTHR31269
label: "S-TYPE ANION CHANNEL SLAH3"
definition: >-
  This entry represents a family of S-type (slow current) anion channels that in Arabidopsis consists of SLAC1 (SLOW ANION CHANNEL-ASSOCIATED 1, At1g12480) and SLAC1-homologue proteins 1-4 (SLAH1-4). They have in common their plasma membrane localisation, but show distinct tissue-specific expression patterns. They are distant homologues of bacterial and fungal C4-dicarboxylate transporters. SLAC1 is localised specifically to the plasma membrane of guard cells. It mediates CO2 sensitivity and is essential for stomatal closure in response to various endogenous and environmental stimuli, such as abscisic acid, ozone, light/dark transitions, humidity change, calcium ions, hydrogen peroxide and nitric oxide. It also functions as an essential negative regulator of inward potassium channels in guard cells.
definition_source: "InterPro:IPR030183 abstract (PANTHER PTHR31269 is a member signature)"
