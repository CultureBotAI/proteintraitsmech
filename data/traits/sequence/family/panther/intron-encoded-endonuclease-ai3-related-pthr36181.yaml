identifier: PANTHER:PTHR36181
label: "INTRON-ENCODED ENDONUCLEASE AI3-RELATED"
definition: >-
  This family of proteins includes mitochondrial and nuclear DNA endonucleases that are primarily involved in intron homing, a process where introns or inteins are inserted into specific sites within genes. These enzymes recognize specific DNA sequences and introduce double-stranded breaks, facilitating the spread of the intron or intein that encodes them. Members of this family typically contain one or more LAGLIDADG motifs, which are characteristic of this type of homing endonuclease and contribute to their catalytic activity. Some members are also associated with complex I subunits, indicating a potential role in mitochondrial function or structure.
