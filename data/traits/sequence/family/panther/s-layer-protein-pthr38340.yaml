  - kind: GENERAL
    text: >-
      This family of proteins includes a variety of bacterial exotoxins that share a common feature in their structure, a Gly-rich region implicated in calcium binding. These proteins are involved in targeting host cells and disrupting their normal function, often by forming pores in the cell membrane, leading to cell lysis. Some members of this family are bifunctional, possessing additional enzymatic activities such as adenylate cyclase activity, which can interfere with host cell signaling pathways. The toxins are typically associated with virulence and contribute to the pathogenicity of the bacteria by damaging host tissues and evading the immune response. Other members of the family are involved in the modification of specific biopolymers, contributing to the formation of structures necessary for bacterial survival.
    source: "InterPro:IPR050557 abstract (LLM-generated, not curator-reviewed)"
