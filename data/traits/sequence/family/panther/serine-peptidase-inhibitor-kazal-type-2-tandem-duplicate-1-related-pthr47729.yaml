  - kind: GENERAL
    text: >-
      This family of proteins includes inhibitors with bifunctional properties, each possessing two homologous halves with active inhibitory roles. One half is responsible for inhibiting trypsin, a serine protease involved in the digestion of proteins, while the other half targets elastase, another serine protease that breaks down elastin and other proteins. Additionally, some members of this family are characterized by having multiple Kazal family inhibitory domains, which are known to participate in protease inhibition. These domains are typically arranged in tandem and are evolutionarily related, suggesting a conserved mechanism of action across different species within this protein family.
