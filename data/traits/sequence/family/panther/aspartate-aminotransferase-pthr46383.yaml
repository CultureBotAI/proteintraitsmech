identifier: PANTHER:PTHR46383
label: "ASPARTATE AMINOTRANSFERASE"
definition: >-
  The Class-I Pyridoxal-Phosphate-Dependent Aminotransferase family is characterised by its members' ability to catalyse the reversible transamination reactions involving various amino acids and keto acids. These enzymes typically utilize pyridoxal phosphate as a cofactor. This protein family includes bacterial Aspartate/prephenate aminotransferases that convert aspartate and 2-oxoglutarate to glutamate and oxaloacetate, with some members also able to transaminate prephenate. Other substrates like phenylalanine, tyrosine, tryptophan, and L-asparagine are also used by certain enzymes within the family. Some members exhibit specificity towards aromatic amino acids, while others participate in lysine catabolism or the biosynthesis of compounds such as methanofuran. This diversity reflects the family's involvement in various metabolic pathways, including amino acid biosynthesis, catabolism, and homeostasis.
definition_source: "InterPro:IPR050596 abstract (PANTHER PTHR46383 is a member signature)"
