  - kind: GENERAL
    text: >-
      This family of proteins includes G protein-coupled receptors (GPCRs) that are involved in chemosensory processes. Members of this family are implicated in the negative regulation of RAS/MAPK signaling pathways during certain developmental processes, such as vulva induction. They also play a role in the olfactory system, being required for the olfactory imprinting necessary for the response to specific odorants. These proteins signal through specific G-alpha protein subunits and are essential for the suppression of certain signaling pathways in response to environmental cues like food starvation.
    source: "InterPro:IPR051080 abstract (LLM-generated, not curator-reviewed)"
