definitions:
  - kind: GENERAL
    text: >-
      NON-HOMOLOGOUS END-JOINING FACTOR 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32235. Members are annotated with the molecular function organic cyclic compound binding, DNA binding. and participate in cellular aromatic compound metabolic process, double-strand break repair via nonhomologous end joining, double-strand break repair. and localise to protein-containing complex, intracellular protein-containing complex, nuclear protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the DNA damage response, specifically in the repair of double-strand breaks (DSBs) through the non-homologous end joining (NHEJ) pathway. Members of this family play a crucial role in maintaining genomic stability by facilitating the ligation of DSBs, which can arise from various sources such as ionizing radiation, reactive oxygen species, or during V(D)J recombination. These proteins are characterized by their ability to form complexes with other NHEJ components, such as XRCC4, and to bridge broken DNA ends, effectively acting as a scaffold to hold the DNA fragments in proximity for repair. They are also known to interact with DNA polymerase lambda and the Ku heterodimer, which are essential for the processing of non-cohesive or mismatched DNA ends. The family is conserved across different species, indicating its fundamental role in cellular survival and the preservation of genetic information.
    source: "InterPro:IPR052287 abstract (LLM-generated, not curator-reviewed)"
