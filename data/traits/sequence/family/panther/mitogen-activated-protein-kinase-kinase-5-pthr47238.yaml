  - kind: GENERAL
    text: >-
      This family of proteins includes dual specificity mitogen-activated protein kinase kinases (MAP2Ks) that play a crucial role in the MAP kinase signal transduction pathway. They are essential components of the stress-activated protein kinase/c-Jun N-terminal kinase (SAP/JNK) signaling pathway. These kinases are unique in their ability to directly activate the JNKs by phosphorylation, with specific preferences for phosphorylation sites within the Thr-Pro-Tyr motif. They are involved in various cellular processes, including the response to pro-inflammatory cytokines, apoptosis through the mitochondrial death signaling pathway, and transcriptional regulation in response to certain stimuli. Additionally, they are activated by phosphorylation by specific MAP kinase kinase kinases and contain conserved docking sites within their D and DVD domains for substrate and upstream kinase binding, respectively.
    source: "InterPro:IPR052468 abstract (LLM-generated, not curator-reviewed)"
