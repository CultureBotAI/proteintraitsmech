identifier: PANTHER:PTHR12274
label: GRANULIN
definition: >-
  Metazoan granulins are a family of cysteine-rich peptides of about 6 kDa which may have multiple biological activity. A precursor protein (known as acrogranin) potentially encodes seven different forms of granulin (grnA to grnG) which are probably released by post-translational proteolytic processing. Granulins are evolutionary related to PMP-D1, a peptide extracted from the pars intercerebralis of migratory locusts. In humans, Progranulin (PGRN) is of 7.5 granulin repeats encoded by the granulin (GRN) gene. It is a secreted growth factor implicated in a multitude of processes ranging from regulation of inflammation to wound healing and tumorigenesis. Progranulin can be processed in the lysosome through the actions of cathepsins. Haploinsufficiency of progranulin causes frontotemporal lobar degeneration (FTLD), and complete loss of PGRN leads to a lysosomal storage disorder, neuronal ceroid lipofuscinosis (NCL).
definition_source: "InterPro:IPR039036 abstract (PANTHER PTHR12274 is a member signature)"
