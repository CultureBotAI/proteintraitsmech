identifier: PANTHER:PTHR46153
label: "ACYL CARRIER PROTEIN"
definition: >-
  Acyl carrier protein (ACP) is a highly conserved cofactor protein required by Type II fatty acid synthases (FASs). Plant fatty acid biosynthesis occurs in both plastids and mitochondria. In Arabidopsis, eight gene loci can be recognized by sequence homology to encode ACP isoforms, five of which are plastidic ACPs (ptACPs), and three of which appear to be mtACPs. This entry represents the ptACPs, which includes AtACP1-5 from Arabidopsis. From phylogenetic studies, they can be classified in two groups, one comprising AtACP1, AtACP2, AtACP3 and AtACP5, the other comprises AtACP4 and ACP homologues from related species. These proteins respond to different abiotic stresses such as salt, drought and deficiencies in nitrogen, phosphorus, potassium and iron. AtACP1 (At3g05020), AtACP2 (At1g54580), and AtACP3 (At1g54630) are near constitutively expressed in leaves, roots, and seeds, whereas AtACP4 (At4g25050) is predominantly expressed in leaves and is induced upon illumination of plants and AtACP5 (At5g27200) is preferentially expressed in roots and down-regulated by salt stress.
definition_source: "InterPro:IPR044813 abstract (PANTHER PTHR46153 is a member signature)"
