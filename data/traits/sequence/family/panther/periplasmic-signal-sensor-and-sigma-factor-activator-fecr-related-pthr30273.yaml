identifier: PANTHER:PTHR30273
label: "PERIPLASMIC SIGNAL SENSOR AND SIGMA FACTOR ACTIVATOR FECR-RELATED"
definition: >-
  This family contains transmembrane signal transduction proteins involved in Fe2+ dicitrate sensing. Experimentally characterised members include Escherichia coli FecR and Pseudomonas putida PupR. Members of this family are a distinct group of anti-sigma factors. In E. coli, binding of ferric citrate to the outer membrane receptor/transporter protein FecA initiates a signal that is transmitted by FecR across the cytoplasmic membrane into the cytoplasm where FecI, the sigma factor, is activated. The periplasmic N terminus of FecA interacts with the periplasmic C-terminal portion of FecR, then FecR transmits the signal across the membrane, and the cytoplasmic N terminus of FecR interacts with FecI, which results in FecI activation.
definition_source: "InterPro:IPR012373 abstract (PANTHER PTHR30273 is a member signature)"
