    text: >-
      D-XYLOSE-BINDING PERIPLASMIC PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30036. Members are annotated with the molecular function carbohydrate binding. and localise to cell envelope, cellular anatomical entity, outer membrane-bounded periplasmic space.
