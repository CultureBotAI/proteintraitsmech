definitions:
  - kind: GENERAL
    text: >-
      HIGH MOBILITY GROUP PROTEIN 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46040. and participate in regulation of gene expression, regulation of cellular process. and localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in various aspects of chromatin regulation and neuronal gene expression. Members of the family are required for the correct progression through the G2 phase of the cell cycle and entry into mitosis, as well as for the repression of neuronal specific gene promoters mediated by RCOR1/CoREST. Other members play a role in neuronal differentiation, acting as chromatin-associated proteins. They can inhibit the effects of HMG20B, counteract the neuronal silencer REST, and activate neuronal-specific genes. Additionally, they are involved in the recruitment of the histone methyltransferase KMT2A/MLL1, leading to increased methylation of histone H3 lysine 4, which is a mark associated with active transcription.
    source: "InterPro:IPR051965 abstract (LLM-generated, not curator-reviewed)"
