identifier: PANTHER:PTHR47136
label: SYNEMIN
definition: >-
  Synemin, also known as desmuslin, is a type-VI intermediate filament (IF) protein which plays an important cytoskeletal role within the muscle cell cytoskeleton. It associates with the major IF proteins, desmin and/or vimentin, within muscle cells and forms heteropolymeric IFs.
