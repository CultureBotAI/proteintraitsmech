identifier: PANTHER:PTHR11766
label: "TYROSYL-TRNA SYNTHETASE"
definition: >-
  Two main groups can be distinguished among tyrosine-tRNA ligases: one group contains bacterial and organellar eukaryotic proteins and the other archaeal and cytosolic eukaryotic proteins. This entry represents the bacterial and organellar eukaryotic tyrosine-tRNA ligases. Tyrosine-tRNA ligases (TyrRS; also known as Tyrosyl-tRNA synthetases) (EC:6.1.1.1) are widely distributed, being found in archaea, bacteria and eukaryotes. TyrRS is a homodimer which attaches Tyr to the appropriate tRNA. TyrRS is a class I tRNA synthetases, so it aminoacylates the 2'-OH of the nucleotide at the 3' end of the tRNA. The core domain is based on the Rossman fold and is responsible for the ATP-dependent formation of the enzyme bound aminoacyl-adenylate. It contains the class I characteristic 'HIGH' and 'KMSKS' motifs, which are involved in ATP binding. Studies have shown that the 'KMSKS' motif plays a role in the initial binding of tRNA(Tyr) to tyrosine-tRNA ligase. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 
definition_source: "InterPro:IPR024088 abstract (PANTHER PTHR11766 is a member signature)"
