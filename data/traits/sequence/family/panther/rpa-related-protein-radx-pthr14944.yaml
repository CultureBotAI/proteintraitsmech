identifier: PANTHER:PTHR14944
label: "RPA-RELATED PROTEIN RADX"
definition: >-
  RADX is an RPA-like, single-stranded DNA binding protein recruited to replication forks to maintain genome stability. It has been shown to modulate stalled fork protection by antagonizing RAD51.
