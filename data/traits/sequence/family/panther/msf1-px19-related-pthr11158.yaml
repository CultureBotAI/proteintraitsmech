identifier: PANTHER:PTHR11158
label: "MSF1/PX19 RELATED"
definition: >-
  Protein slowmo (Slmo) is a mitochondrial protein from Drosophila involved in development of the nervous system and germline proliferation. Slmo contains a conserved PRELI/MSF1 domain, found in proteins from a wide variety of eukaryotic organisms. Slmo is a homologue of yeast UPS proteins Ups1, Ups2, and Ups3, that control phospholipid metabolism in the mitochondrial intermembrane space. Humans possess four principal homologues of the Ups family, namely PRELID1 (also known as PRELI), PRELID2, SLMO1 and SLMO2 (also termed PRELID3a and PRELID3b). The Ups family is evolutionary conserved from yeast to man, and together with its mitochondrial chaperones (TRIAP1/Mdm35), represent a unique heterodimeric lipid transfer system. In yeast mitochondria, Ups1 and Ups2 form tight complexes with Mdm35 and together they regulate the subsequent biosynthesis of cardiolipin and phosphatidylethanolamine.
