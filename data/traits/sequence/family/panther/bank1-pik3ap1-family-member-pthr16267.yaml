identifier: PANTHER:PTHR16267
label: "BANK1/PIK3AP1 FAMILY MEMBER"
definition: >-
  The protein family is involved in B-cell development and signaling, acting as an adapter linking B-cell receptor (BCR) signaling to the phosphoinositide 3-kinase (PI3K)-Akt pathway. It supports BCR and PI3K activation by providing a docking site for PIK3R1 and complements the role of CD19. Additionally, it connects Toll-like receptor (TLR) signaling to PI3K activation, regulating inflammatory cytokine production and is implicated in natural killer cell PI3K activation. The family also plays a role in B-cell survival through REL activation. Another function includes promoting BCR-induced Ca(2+) mobilization from intracellular stores and facilitating Lyn-mediated phosphorylation of IP3 receptors.
