identifier: PANTHER:PTHR15682
label: "UNHEALTHY RIBOSOME BIOGENESIS PROTEIN 2 HOMOLOG"
definition: >-
  This family of proteins is involved in ribosome biogenesis and the regulation of the p53/TP53 pathway. Members of this family play a crucial role in the development of hematopoietic stem cells and are also required for the processing of pre-rRNA, which is a fundamental step in the assembly of the 60S ribosomal subunit. These proteins are associated with nucleolar pre-ribosomal complexes, indicating a role in early stages of ribosome assembly.
