identifier: PANTHER:PTHR24340
label: "HOMEOBOX PROTEIN NKX"
definition: >-
  This family of proteins includes transcription factors that play critical roles in embryonic development and organogenesis. Members are involved in the specification and differentiation of various cell types, particularly within the central nervous system, heart, thyroid, lungs, and pancreas. They are characterized by their ability to bind DNA and regulate the expression of target genes, which influences processes such as neuron development, heart formation, and insulin production. Some proteins within this family act as transcriptional activators, while others function as repressors. They are also implicated in the maintenance of energy homeostasis and may have tumor suppressor functions.
