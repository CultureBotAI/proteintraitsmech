identifier: PANTHER:PTHR10417
label: "GLUCOCORTICOID MODULATORY ELEMENT-BINDING PROTEIN"
definition: >-
  GLUCOCORTICOID MODULATORY ELEMENT-BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10417. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function transcription cis-regulatory region binding, RNA polymerase II transcription regulatory region sequence-specific DNA binding, RNA polymerase II cis-regulatory region sequence-specific DNA binding. Subfamilies participate in regulation of DNA-templated transcription, regulation of transcription by RNA polymerase II, regulation of biosynthetic process. Subfamilies localise to intracellular anatomical structure, nucleus, organelle.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
