identifier: PANTHER:PTHR10417
label: "GLUCOCORTICOID MODULATORY ELEMENT-BINDING PROTEIN"
definition: >-
  GLUCOCORTICOID MODULATORY ELEMENT-BINDING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10417. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding. Subfamilies participate in regulation of transcription by RNA polymerase II. Subfamilies localise to nucleus, intracellular anatomical structure.
