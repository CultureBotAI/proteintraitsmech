identifier: PANTHER:PTHR46657
label: "CENTROSOMAL PROTEIN OF 128 KDA"
definition: >-
  This entry represents centrosomal protein 128 and related proteins. Centrosomal protein 128 is involved in the negative regulation of ciliogenesis and plays a role in spermatogenesis. It contributes to the regulation of the TGFB/BMP signalling pathway at the primary cilium, where it is required for ciliary localisation of RAB11A, likely affecting the trafficking and regulation of TGFB/BMP pathway components. Centrosomal protein 128 is also required, together with ODF2, for the formation of the subdistal appendage of the centriole (by similarity).
