identifier: PANTHER:PTHR12246
label: "PALMITOYLTRANSFERASE ZDHHC16"
definition: >-
  This entry includes palmitoyltransferases such as PFA4, ZDHHC16, ZDHHC20, ERF2 from fungi and its homologues. PFA4 from S. cerevisiae mediates the reversible addition of palmitate to target proteins, thereby regulating their membrane association and biological function. It palmitoylates several amino acid permeases and chitin synthase CHS3, which is required for its proper export from the ER. ZDHHC16 is a palmitoyl acyltransferase that mediates palmitoylation of proteins such as PLN and ZDHHC6. In zebrafish, there are two ZDHHC16 homologues, ZDHHC16A and ZDHHC16B. They are involved in the proliferation of neural stem cells by regulating the FGF/ERK pathway. Palmitoyltransferase ZDHHC20 can catalyse the addition of palmitate onto various protein substrates. It catalyses the palmitoylation of Cys residues in the cytoplasmic C-terminal of EGFR, and modulates the duration of EGFR signalling by modulating palmitoylation-dependent EGFR internalisation and degradation. ZDHHC20 can also utilise acyl-CoA with C14 and C18 fatty acid chains. ERF2 from S. cerevisiae forms a complex with SHR5, palmitoyltransferase specific for Ras proteins. It palmitoylates RAS2, which is required for its proper plasma membrane localisation. In S. pombe it forms a complex with erf4 complex, a palmitoyltransferase with a major role in driving sexual development. It palmitoylates ras1, isp3 and rho3.
