identifier: PANTHER:PTHR47658
label: "HIGH MOBILITY GROUP B PROTEIN 12-RELATED"
definition: >-
  HIGH MOBILITY GROUP B PROTEIN 12-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47658. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function DNA binding. Subfamilies participate in nucleus organization, organelle fusion, multicellular organism development. Subfamilies localise to nucleus, intracellular anatomical structure.
