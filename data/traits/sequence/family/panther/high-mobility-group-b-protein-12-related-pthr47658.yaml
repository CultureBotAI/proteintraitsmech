identifier: PANTHER:PTHR47658
label: "HIGH MOBILITY GROUP B PROTEIN 12-RELATED"
definition: >-
  HIGH MOBILITY GROUP B PROTEIN 12-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47658. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function nucleic acid binding, DNA binding, binding. Subfamilies participate in organelle organization, nucleus organization, multicellular organism development. Subfamilies localise to intracellular anatomical structure, nucleus, organelle.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
