identifier: PANTHER:PTHR13364
label: "DEFECTIVE SPERMATOGENESIS PROTEIN 39"
definition: >-
  Spermatogenesis-defective protein 39 (spe-39) from the nematode Caenorhabditis elegans is involved in endosomal maturation and intracellular membrane reorganization during spermatogenesis. Also included in this entry is vacuolar protein sorting-associated protein 16B (Vps16B; also known as protein full-of-bacteria) from the fruit fly Drosophila melanogaster. Vps16B is required for phagosome maturation and the innate immune response to bacteria.
