  - kind: GENERAL
    text: >-
      The nuclear hormone receptor family NR1 subfamily consists of ligand-activated transcription factors that play pivotal roles in the regulation of development, metabolism, and immune functions. Members of this family are characterized by a modulating N-terminal domain, a central DNA-binding domain, and a C-terminal ligand-binding domain. They function as receptors for various endogenous hormones, including thyroid hormones, oxysterols, bile acids, and vitamin D3, as well as for xenobiotic compounds. These receptors can act as repressors or activators of transcription, depending on the presence of their respective ligands. They are involved in diverse biological processes such as cholesterol homeostasis, lipid metabolism, circadian rhythm regulation, and glucose homeostasis. The NR1 subfamily includes thyroid hormone receptors, oxysterols receptors, bile acid receptor, and vitamin D3 receptor, among others, highlighting their broad impact on physiological functions.
    source: "InterPro:IPR050234 abstract (LLM-generated, not curator-reviewed)"
