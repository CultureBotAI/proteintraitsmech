identifier: PANTHER:PTHR35662
label: "INTERACTOR OF HORMAD1 PROTEIN 1"
definition: >-
  Interactor of HORMAD1 protein 1 (IHO1, previously known as coiled-coil domain-containing protein 36 or DUF4700) is required for DNA double-strand breaks (DSBs) formation in unsynapsed regions during meiotic recombination. It is thought to function, in collaboration with SPO11-auxiliary proteins MEI4 and REC114, through the formation of DSB-promoting recombinosomes on chromatin at the onset of meiosis.
definition_source: "InterPro:IPR031529 abstract (PANTHER PTHR35662 is a member signature)"
