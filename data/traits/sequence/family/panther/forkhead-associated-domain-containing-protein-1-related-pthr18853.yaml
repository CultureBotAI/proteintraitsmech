identifier: PANTHER:PTHR18853
label: "FORKHEAD-ASSOCIATED DOMAIN-CONTAINING PROTEIN 1-RELATED"
definition: >-
  This family of proteins includes coiled-coil domain-containing protein 27 (CCDC27) and Forkhead-associated domain-containing protein 1 (FHAD1). CCDC27 contains a single coiled-coil region located in the central portion of the sequence. CCDC27 is widely conserved across mammalian species and shows enriched expression in testis. The protein contains multiple disordered regions including acidic-rich compositional bias regions. CCDC27 is classified as a forkhead-associated domain-containing protein 1-related protein. The function of this protein remains to be determined. FHAD1 is a regulator of sperm motility and spermatocyte meiosis.
definition_source: "InterPro:IPR052642 abstract (PANTHER PTHR18853 is a member signature)"
