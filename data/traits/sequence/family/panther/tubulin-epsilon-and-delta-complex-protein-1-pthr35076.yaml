identifier: PANTHER:PTHR35076
label: "TUBULIN EPSILON AND DELTA COMPLEX PROTEIN 1"
definition: >-
  This entry includes protein 1 found in association with tubulins epsilon and delta complex. This complex is required for centriole maintenance and it has been demonstrated that it is a component of several ciliary structures. It acts as a positive regulator of ciliary hedgehog signalling which plays key roles in embryonic development and in cancers. Additionally, this protein may play a role in counteracting perturbation of actin filaments, such as after treatment with the actin depolymerising microbial metabolite Chivosazole F.
