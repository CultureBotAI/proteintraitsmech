identifier: PANTHER:PTHR20929
label: "LUNG ADENOMA SUSCEPTIBILITY 1-RELATED"
definition: >-
  Dynein-f, also known as dynein I1, is an inner-arm dynein complex comprising two different heavy chains together with a number of intermediate and light chains. In Chlamydomonas, IC97 is the intermediate chain of the Dynein-f complex. This entry includes IC97 (UniProtKB:C7A2A8) and its homologues, including CASC1 (also known as Dnai7) from humans. The CAncer Susceptibility Candidate 1 (CASC1) gene is expressed in lung tissues, and is a strong candidate for the pulmonary adenoma susceptibility 1 (Pas1) locus, the major determinant of strain variation in lung tumour susceptibility. There appears to be a strong correlation between functional polymorphism of CASC1 and lung tumour suspectibility in mice. Different mouse strains fall into two genotype groups (susceptible and intermediate) according to differences in the 60th codon of the CASC1 gene. The mouse CASC1 gene shares 81% similarity with the human equivalent; the role of CASC1 in human lung-cancer risk may nevertheless differ from that in mice.
