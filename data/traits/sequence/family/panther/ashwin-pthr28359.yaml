identifier: PANTHER:PTHR28359
label: ASHWIN
definition: >-
  Ashwin is a developmental protein that is expressed in the neural plate, and later in the embryonic brain, eyes, and spinal cord. It may be involved in the regulation cell survival and anteroposterior patterning. Ashwin has been shown to form a complex with HSPC117, which is a catalytic subunit of the tRNA-splicing ligase complex.
definition_source: "InterPro:IPR024887 abstract (PANTHER PTHR28359 is a member signature)"
