identifier: PANTHER:PTHR30118
label: "HTH-TYPE TRANSCRIPTIONAL REGULATOR LEUO-RELATED"
definition: >-
  This entry represents HTH-type transcriptional regulators including YidZ, Nodulation proteins, SyrM and related proteins. These proteins are characterised by its role in gene expression regulation related to various bacterial functions. Members of the family act as transcriptional activators or repressors. They are involved in diverse biological processes including nodulation in symbiotic relationships, degradation of environmental pollutants such as gamma-hexachlorocyclohexane and pentachlorophenol, and regulation of virulence factors. Some regulators respond to specific inducers like flavonoids, which modulate the expression of genes necessary for nodulation. Others control the expression of operons involved in the metabolism of compounds like naphthalene and salicylate. The family also includes global transcription factors that can activate or repress multiple operons, influencing a range of cellular processes. The common feature among these proteins is their helix-turn-helix (HTH) motif, which facilitates DNA binding and the subsequent regulation of gene expression.
definition_source: "InterPro:IPR050389 abstract (PANTHER PTHR30118 is a member signature)"
