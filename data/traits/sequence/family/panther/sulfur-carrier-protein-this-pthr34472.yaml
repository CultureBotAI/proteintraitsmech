identifier: PANTHER:PTHR34472
label: "SULFUR CARRIER PROTEIN THIS"
definition: >-
  This entry identifies the ThiS family, which are thiamine-biosynthesis proteins related to MoaD. MoaD is a molybdenum cofactor biosynthesis protein. Both ThiS and MoaD proteins are involved in sulphur transfer.
