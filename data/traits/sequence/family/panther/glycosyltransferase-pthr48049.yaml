identifier: PANTHER:PTHR48049
label: GLYCOSYLTRANSFERASE
definition: >-
  The UDP-glycosyltransferase family is involved in the biosynthesis of a wide range of glycosylated compounds, which play crucial roles in plant metabolism and defence. Members of this family catalyse the transfer of sugar moieties from activated sugar donors like UDP-glucose to acceptor molecules, including flavonoids, hydroxycoumarins, and triterpenes. These glycosylation reactions enhance the solubility, stability, and biological activity of the compounds, contributing to processes such as pigment formation, fruit ripening, and the production of saponins with medicinal properties. The family exhibits substrate specificity, with some members showing multifunctional activity towards various substrates, while others are more specialised. The glycosylated products are involved in plant colouration, antioxidant activity, and the detoxification of xenobiotics.
definition_source: "InterPro:IPR050481 abstract (PANTHER PTHR48049 is a member signature)"
