identifier: PANTHER:PTHR46812
label: "CARBOXYMETHYLENEBUTENOLIDASE HOMOLOG"
definition: >-
  Carboxymethylenebutenolidase (CMBL) is a human homologue of Pseudomonas dienelactone hydrolase involved in the bacterial halocatechol degradation pathway. It is a cysteine hydrolase that can convert the prodrug olmesartan medoxomil into its pharmacologically active metabolite olmerstatan, an angiotensin receptor blocker, in liver and intestine. This entry also includes uncharacterised DLH domain-containing proteins from plants.
