identifier: PANTHER:PTHR28399
label: BARTTIN
definition: >-
  Barttin is a beta-subunit for ClC-Ka and ClC-Kb chloride channels, with which it co-localises in basolateral membranes of renal tubules and of potassium-secreting epithelia of the inner ear. Mutations in Barttin gene cause Bartter syndrome 4A (BS4A), which is an autosomal recessive disorder characterised by impaired salt re-absorption in the thick ascending loop of Henle with pronounced salt wasting, hypokalemic metabolic alkalosis, and varying degrees of hypercalciuria.
