identifier: PANTHER:PTHR47987
label: "OS08G0249100 PROTEIN"
definition: >-
  This family includes a group of receptor-like cytosolic serine/threonine-protein kinases including RBK1/2 and the protein kinase STUNTED. RBK1 is involved in regulating Casparian strip formation and it also plays a roles in trichome branching and in the control of basal resistance to powdery mildew. STUNTED promotes cell proliferation in the gibberellic acid (GA) signaling pathway, acting downstream of RGA, and possibly through a negative regulation of two cyclin-dependent kinase inhibitors SIM and SMR1.
