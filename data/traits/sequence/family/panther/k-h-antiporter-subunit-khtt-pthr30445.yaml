  - kind: GENERAL
    text: >-
      The AAE transporter family is involved in the transport of various substrates across cellular membranes. Members of this family function as antiporters, exchanging one substance for another across the membrane, utilizing the gradient of one to move the other against its gradient. This mechanism is vital for maintaining cellular homeostasis and can be involved in the uptake of nutrients as well as the expulsion of toxins or by-products of metabolism. Specific members within this family have been identified to catalyze the electrogenic exchange of aspartate with alanine, and some are involved in the protection of cells from toxic by-products like methylglyoxal. The family includes several subfamilies, such as the YbjL and YidE subfamilies, indicating a diversity of functions and substrates among its members.
    source: "InterPro:IPR050144 abstract (LLM-generated, not curator-reviewed)"
