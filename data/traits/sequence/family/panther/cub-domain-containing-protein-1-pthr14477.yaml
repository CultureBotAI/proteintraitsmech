identifier: PANTHER:PTHR14477
label: "CUB DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  CDCP1 is a cell surface glycoprotein that has been recognized both as a tumour marker and as a potential target to disrupt progression of cancer. CDCP1 has been shown to modulate cellsubstratum adhesion and motility in colon cancer cell lines.
