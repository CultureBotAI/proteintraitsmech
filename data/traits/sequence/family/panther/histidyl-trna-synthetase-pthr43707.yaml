identifier: PANTHER:PTHR43707
label: "HISTIDYL-TRNA SYNTHETASE"
definition: >-
  This entry represents histidine-tRNA ligase (HisS or HisRS) and its paralogue, ATP phosphoribosyltransferase regulatory subunit (HisZ). Despite the significant sequential and structural similarity, HisRS and HisZ have different functions. HisRS is a class IIa aminoacyl-tRNA synthetase (ligase), while HisZ is a regulatory subunit of the hetero-octameric ATP phosphoribosyl transferase that regulate reactions initiating histidine biosynthesis.
