identifier: PANTHER:PTHR11712
label: "POLYKETIDE SYNTHASE-RELATED"
definition: >-
  Beta-ketoacyl-ACP synthase EC:2.3.1.41 (KAS) is the enzyme that catalyses the condensation of malonyl-ACP with the growing fatty acid chain. It is found as a component of a number of enzymatic systems, including fatty acid synthetase (FAS), which catalyses the formation of long-chain fatty acids from acetyl-CoA, malonyl-CoA and NADPH; the multi-functional 6-methysalicylic acid synthase (MSAS) from Penicillium patulum, which is involved in the biosynthesis of a polyketide antibiotic; polyketide antibiotic synthase enzyme systems; Emericella nidulans multifunctional protein Wa, which is involved in the biosynthesis of conidial green pigment; Rhizobium nodulation protein nodE, which probably acts as a beta-ketoacyl synthase in the synthesis of the nodulation Nod factor fatty acyl chain; narbonolide/10-deoxymethynolide synthase, which is involved in the biosynthesis of narbomycin and pikromycin in Streptomyces venezuelae; and yeast mitochondrial protein CEM1. The condensation reaction is a two step process, first the acyl component of an activated acyl primer is transferred to a cysteine residue of the enzyme and is then condensed with an activated malonyl donor with the concomitant release of carbon dioxide.
definition_source: "InterPro:IPR000794 abstract (PANTHER PTHR11712 is a member signature)"
