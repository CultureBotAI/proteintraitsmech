identifier: PANTHER:PTHR24112
label: "LEUCINE-RICH REPEAT, ISOFORM F-RELATED"
definition: >-
  This family of proteins includes regulatory subunits that modulate the activity of protein phosphatase 1 (PP1) complexes, acting as inhibitors. They are involved in the control of various cellular processes by regulating the dephosphorylation of target proteins. Additionally, this family encompasses proteins that interact with actin cytoskeleton components, playing a role in actin polymerization and cell motility. These proteins are implicated in the formation of cell protrusions, cell polarity, and migration, as well as in signal transduction pathways related to cell activation and differentiation.
