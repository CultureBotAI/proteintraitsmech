identifier: PANTHER:PTHR16441
label: FIDIPIDINE
definition: >-
  Human CCDC93 is part of the COMMD/CCDC22/CCDC93 (CCC) complex that interacts with the multisubunit WASH complex, which is required for endosomal deposition of F-actin and cargo trafficking in conjunction with the retromer. The CCC complex controls Notch activation by modulating its intracellular trafficking.
