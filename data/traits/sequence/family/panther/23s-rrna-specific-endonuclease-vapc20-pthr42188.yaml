identifier: PANTHER:PTHR42188
label: "23S RRNA-SPECIFIC ENDONUCLEASE VAPC20"
definition: >-
  VapC20 is a toxin from the type II toxin-antitoxin (TA) system of Mycobacterium tuberculosis; its cognate antitoxin is known as VapB20. VapC20 inhibits translation by cleavage of the sarcin-ricin loop of 23S rRNA.
