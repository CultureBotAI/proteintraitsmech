definitions:
  - kind: GENERAL
    text: >-
      BLR3025 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35369. Members participate in cellular aromatic compound metabolic process, DNA repair, DNA damage response.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The SulA family includes cell division inhibitors that are part of the SOS system, which responds to DNA damage. Members of the SulA family accumulate in response to DNA damage, leading to the cessation of cell division and the formation of long, non-septate filaments. They function by binding to a polymerization-competent form of FtsZ, a key protein in the assembly of the bacterial Z ring, essential for cell division. The binding occurs in a 1:1 ratio in the presence of GTP, inhibiting FtsZ polymerization and thus preventing the formation of the Z ring. This action helps to prevent the segregation of damaged DNA into daughter cells, allowing time for DNA repair mechanisms to correct any damage before cell division resumes.
    source: "InterPro:IPR050356 abstract (LLM-generated, not curator-reviewed)"
