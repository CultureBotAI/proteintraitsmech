identifier: PANTHER:PTHR34568
label: "RRM DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents a family of uncharacterised plant proteins that have an helix-turn-helix domain (InterPro:IPR058941), including Arabidopsis thaliana AT3G52170 (UniProtKB:Q8L641) and AT5G58210 (UniProtKB:Q8GWS7). These proteins are annotated as DNA binding proteins and are are thought to be involved in transcriptional regulation.
