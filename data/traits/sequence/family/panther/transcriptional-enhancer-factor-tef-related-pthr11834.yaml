identifier: PANTHER:PTHR11834
label: "TRANSCRIPTIONAL ENHANCER FACTOR  TEF  RELATED"
definition: >-
  TRANSCRIPTIONAL ENHANCER FACTOR TEF RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11834. PANTHER protein class: DNA-binding transcription factor, helix-turn-helix transcription factor, winged helix/forkhead transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. Members localise to protein-containing complex, transcription regulator complex.
