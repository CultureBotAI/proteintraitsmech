identifier: PANTHER:PTHR13022
label: "EUKARYOTIC TRANSLATION INITIATION FACTOR 3 SUBUNIT 11"
definition: >-
  Eukaryotic translation initiation factor 3 subunit K is a Component of the eukaryotic translation initiation factor 3 (eIF-3) complex, which is involved in protein synthesis and, together with other initiation factors, stimulates binding of mRNA and methionyl-tRNAi to the 40S ribosome.
