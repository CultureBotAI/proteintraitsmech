identifier: PANTHER:PTHR24292
label: "CYTOCHROME P450"
definition: >-
  The cytochrome P450 family is involved in the metabolism of insect hormones and the breakdown of synthetic insecticides. Members of this family are necessary for resistance to certain insecticides like DDT and imidacloprid. Some proteins within the family enable insects to feed on furanocoumarin-producing plants by detoxifying xanthotoxin and other furanocoumarins. They also metabolize a variety of structurally unrelated compounds, including steroids, fatty acids, and xenobiotics. The family includes enzymes that have adapted to metabolize various xenobiotic substances, contributing to the survival of insects in environments with toxic compounds.
