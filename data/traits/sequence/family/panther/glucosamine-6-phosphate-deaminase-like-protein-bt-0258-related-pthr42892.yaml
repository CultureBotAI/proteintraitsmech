  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the reversible isomerization-deamination of glucosamine 6-phosphate to fructose 6-phosphate and ammonium ion. Members of this family are involved in amino sugar metabolism, specifically in the conversion of glucosamine-6-phosphate, a derivative of glucose and an intermediate in the synthesis of various amino sugars and aminoglycans. The activity of these enzymes is critical for the proper functioning of cellular metabolic pathways, including the production of structural polysaccharides and the regulation of nitrogen metabolism.
