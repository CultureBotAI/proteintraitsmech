  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with phospholipase C activity, specifically involved in the hydrolysis of glycosylphosphatidylinositol (GPI) and phosphatidylinositol (PI) anchors. These proteins do not cleave PI phosphates. Members of this family are implicated in various biological processes, including the release of soluble variant surface glycoproteins from the cell wall of parasites such as Trypanosoma brucei, potentially playing roles in parasite differentiation or antigenic variation. In some bacteria, these enzymes are considered potential virulence factors, possibly participating in the lysis of the phagolysosomal membrane and contributing to pathogenesis. The family encompasses a range of organisms, indicating a conserved function across different species.
