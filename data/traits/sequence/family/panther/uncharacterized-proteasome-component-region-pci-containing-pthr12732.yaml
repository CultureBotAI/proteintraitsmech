identifier: PANTHER:PTHR12732
label: "UNCHARACTERIZED PROTEASOME COMPONENT REGION PCI-CONTAINING"
definition: >-
  This entry includes a group of mRNA export factors, including Csn12 and Thp1 from budding yeasts and their homologues from fungi, animal and plants. Csn12 is part of the THO complex involved in transcription elongation and mRNA processing and export. Thp1 is a component of the TREX-2 complex (Sac3-Thp1-Sus1-Cdc31) involved in transcription elongation and mRNA export from the nucleus. The animal homologue, PCID2, is part of the TREX-2 complex (consists of PCID2, GANP, CENP and DSS1).
