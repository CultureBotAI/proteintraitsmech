identifier: PANTHER:PTHR46511
label: "MORN REPEAT-CONTAINING PROTEIN 3"
definition: >-
  This entry represents the MORN repeat-containing protein 3 (MORN3) family. Human MORN3 is involved in the regulation of the tumor suppressor p53/TP53 through the assembly of a Morn3-mediated protein complex (referred to as suppresome). MORN3 functions by tethering the enzymes SIRT1 and MDM2 to p53/TP53, leading to its deacetylation-mediated functional inactivation and ubiquitination-dependent degradation. Additionally, mouse MORN3 has been demonstrated to be involved in the regulation of spermatogenesis.
definition_source: "InterPro:IPR052472 abstract (PANTHER PTHR46511 is a member signature)"
