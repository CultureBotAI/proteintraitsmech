  - kind: GENERAL
    text: >-
      This family of proteins is involved in chromatin remodeling, which is a critical process in the regulation of gene expression. Members of this family participate in altering DNA-nucleosome topology, thereby affecting transcriptional activation and repression of specific genes. They are components of various chromatin remodeling complexes, such as SWI/SNF and RSC, and are essential for the stability and targeting of these complexes to particular genomic loci. Functions attributed to these proteins include the transfer of histone octamers, DNA translocation, and nucleosome repositioning, which are necessary for proper transcription regulation, chromosome segregation, and cellular response to stress. Some family members are also implicated in the regulation of cardiac genes and the organization of the cellular cytoskeleton.
