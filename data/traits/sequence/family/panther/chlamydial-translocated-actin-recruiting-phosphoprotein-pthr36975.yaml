identifier: PANTHER:PTHR36975
label: "Chlamydial Translocated Actin-Recruiting Phosphoprotein"
definition: >-
  The chlamydial CPn_0572/CT_456/TC_0741 family includes proteins that are involved in signaling events related to actin recruitment. Members of the family appear to play a role in initiating or participating in the cellular processes that lead to the internalization of the pathogen into host cells. The actin recruitment is a critical step in the infection mechanism of Chlamydia, facilitating the entry and survival of the bacteria within the host.
