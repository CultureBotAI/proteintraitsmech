identifier: PANTHER:PTHR34605
label: "PHAGE_INTEGRASE DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes enzymes that catalyze site-specific recombination events. Members are characterized by their ability to recognize and recombine specific DNA sequences, typically involving short conserved sequences. These proteins play key roles in the integration and excision of DNA segments, such as phage genomes into host bacterial chromosomes, and are crucial for the maintenance of genomic stability and the regulation of gene expression. The family is associated with the 'phage' integrase family, indicating a shared evolutionary origin and similar mechanistic functions in DNA manipulation.
