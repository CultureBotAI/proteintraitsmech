identifier: PANTHER:PTHR44490
label: "EUKARYOTIC TRANSLATION ELONGATION FACTOR 1 EPSILON-1"
definition: >-
  Eukaryotic translation elongation factor 1 epsilon-1 (EEF1E1), also known as elongation factor p18, is a nonenzyme factor associated with a macromolecular tRNA synthetase complex. It shares sequence homology to elongation factor subunits (EF-1). It interacts with ATM/ATR for the activation of p53 and works as a potent tumour suppressor.
