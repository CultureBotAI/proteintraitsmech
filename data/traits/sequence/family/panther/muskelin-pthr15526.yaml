  - kind: GENERAL
    text: >-
      This family of proteins is involved in the ubiquitin-proteasome system, specifically as components of the CTLH E3 ubiquitin-protein ligase complex. They interact with UBE2H to facilitate ubiquitination and subsequent proteasomal degradation of specific target proteins, such as the transcription factor HBP1. Additionally, these proteins play a role in the endocytic pathway, being required for the internalization and degradation of the GABA receptor GABRA1. They are also implicated in cellular responses to the extracellular matrix, mediating cell spreading and cytoskeletal changes in response to THBS1. A characteristic feature of these proteins is the presence of a LisH domain, which is important for dimerization and may contain a nuclear targeting signal.
    source: "InterPro:IPR052456 abstract (LLM-generated, not curator-reviewed)"
