identifier: PANTHER:PTHR21142
label: SARCOGLYCANS
definition: >-
  Beta-sarcoglycan is a component of the sarcoglycan complex, a subcomplex of the dystrophin-glycoprotein complex which forms a link between the F-actin cytoskeleton and the extracellular matrix. The sarcoglycan (SG) complex consists of four subunits, the transmembrane proteins sarcoglycan alpha, beta gamma and delta. Defects in the subunits of the SG complex are responsible for several muscular dystrophies.
