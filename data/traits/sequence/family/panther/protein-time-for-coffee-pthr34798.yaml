identifier: PANTHER:PTHR34798
label: "PROTEIN TIME FOR COFFEE"
definition: >-
  Arabidopsis TIME FOR COFFEE (TIC) is a circadian regulator that coordinates developmental, metabolic, and environmental signals. It controls root meristem size by changes in auxin accumulation.
