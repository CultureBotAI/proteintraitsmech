identifier: PANTHER:PTHR47295
label: "EG45-LIKE DOMAIN CONTAINING PROTEIN 1-RELATED"
definition: >-
  This entry represents a group of EG45-like domain containing proteins, including EGC1/2 from Arabidopsis and CjBAp12 from Citrus jambhiri. EGC2, also known as AtPNP-A, is an immunoreactant plant natriuretic peptide (irPNP) analog. It shares some similarity with the cell wall loosening expansins but does not contain the carbohydrate-binding wall anchor. It signals via the second messenger cyclic guanosine 3',5'-monophosphate and modulates ion and water transport and homeostasis. It is secreted into the apoplastic space in response to stress and can enhance its own expression.
definition_source: "InterPro:IPR044206 abstract (PANTHER PTHR47295 is a member signature)"
