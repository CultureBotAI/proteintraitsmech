identifier: PANTHER:PTHR46313
label: "Prolycopene isomerase-like"
definition: >-
  This entry represents a family of proteins involved in the metabolism of carotenoids (such as propycopene and myxoxanthophyll), including the Prolycopene isomerase from Arabidopsis (CrtISO). Members of this family are predominantly found in plants and cyanobacteria. CrtISO is a carotene cis-trans-isomerase ( EC:5.2.1.13 ) that converts 7,9,9'-tri-cis-neurosporene to 9'-cis-neurosporene and 7,9,9',7'-tetra-cis-lycopene (also known as prolycopene) into all-trans-lycopene. Members of this family include the Slr1293 protein, a carotenoid biosynthesis protein which was shown to be the C-3',4' desaturase (CrtD) of myxoxanthophyll biosynthesis in Synechocystis sp. (strain PCC 6803), and close homologues (presumed to be functionally equivalent) from other cyanobacteria, where myxoxanthophyll biosynthesis is either known or expected. This enzyme can act on neurosporene and so presumably catalyses the first step that is committed to myxoxanthophyll.
definition_source: "InterPro:IPR045892 abstract (PANTHER PTHR46313 is a member signature)"
