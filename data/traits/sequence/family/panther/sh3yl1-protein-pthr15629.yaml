identifier: PANTHER:PTHR15629
label: "SH3YL1 PROTEIN"
definition: >-
  This family of proteins is involved in the organization of the actin cytoskeleton, fluid phase endocytosis, and vesicle trafficking. Members of this family contain an SH3 domain, which suggests a role in the interaction with proline-rich regions of other proteins, potentially mediating assembly of protein complexes involved in cytoskeletal organization and membrane dynamics.
