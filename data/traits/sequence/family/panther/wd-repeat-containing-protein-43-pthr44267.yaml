identifier: PANTHER:PTHR44267
label: "WD REPEAT-CONTAINING PROTEIN 43"
definition: >-
  This family of proteins is involved in ribosome biogenesis, particularly in the processing and transcription of pre-18S ribosomal RNA. Members of this family are part of the small subunit (SSU) processome, which is the first precursor of the small eukaryotic ribosomal subunit. They play a role in coordinating the assembly of ribosome biogenesis factors, RNA chaperones, and ribosomal proteins with nascent pre-rRNA to facilitate RNA folding, modifications, rearrangements, and cleavage. Additionally, they are involved in the targeted degradation of pre-ribosomal RNA by the RNA exosome and are essential for maintaining high-level expression of target genes during transcription. These proteins are also required for stem cell pluripotency and embryonic development.
