definition: >-
  NUCLEOLAR PROTEIN FAMILY A MEMBER 1 SNORNP PROTEIN GAR1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23237. PANTHER protein class: RNA metabolism protein. Members are annotated with the molecular function snoRNA binding. Members participate in rRNA modification, pseudouridine synthesis, ribonucleoprotein complex biogenesis. Members localise to nucleolus, nuclear lumen, sno(s)RNA-containing ribonucleoprotein complex.
