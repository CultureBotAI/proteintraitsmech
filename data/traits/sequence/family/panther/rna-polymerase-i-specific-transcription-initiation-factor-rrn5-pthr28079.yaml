identifier: PANTHER:PTHR28079
label: "RNA POLYMERASE I-SPECIFIC TRANSCRIPTION INITIATION FACTOR RRN5"
definition: >-
  This entry represents Rrn5 from fungi. Rrn5 is a component of the UAF (upstream activation factor) complex which interacts with the upstream element of the RNA polymerase I promoter and forms a stable preinitiation complex.
