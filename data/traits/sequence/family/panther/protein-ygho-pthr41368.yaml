identifier: PANTHER:PTHR41368
label: "PROTEIN YGHO"
definition: >-
  This family includes the bacterial ceramide synthase BcerS from Caulobacter crescentus, which is involved in de novo bacterial ceramide synthesis. It catalyses the condensation of 3-oxosphinganine with an acyl-CoA to generate oxidized ceramides. It may have a preference for monounsaturated acyl-CoA substrates, as it has a threefold greater preference for C16:1-CoA over C16:0-CoA as a substrate in vitro. The biosynthetic steps of ceramide synthesis in bacteria occur in a different order from that in eukaryotes and phylogenetic analyses suggest that the bacterial and eukaryotic ceramide pathways evolved independently. This entry also includes YghO from E. coli, whose function is unknown.
definition_source: "InterPro:IPR039968 abstract (PANTHER PTHR41368 is a member signature)"
