    text: >-
      A-KINASE ANCHOR PROTEIN 14 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR35075. PANTHER protein class: scaffold/adaptor protein. Members are annotated with the molecular function protein kinase A binding, protein kinase A regulatory subunit binding. and localise to serine/threonine protein kinase complex, intracellular protein-containing complex, catalytic complex.
