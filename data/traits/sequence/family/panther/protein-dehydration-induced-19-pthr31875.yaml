identifier: PANTHER:PTHR31875
label: "PROTEIN DEHYDRATION-INDUCED 19"
definition: >-
  This entry represents Di19 proteins. Protein dehydration-induced19 (Di19) increases the sensitivity of plants to environmental stress, such as salinity, drought, osmotic stress and cold. The protein is also induced by an increased supply of stress-related hormones such as abscisic acid ABA and ethylene. Di19 has been found to be strongly expressed in both the roots and leaves of Arabidopsis thaliana during progressive drought. It is phosphorylated by AtCPK11 in a Ca(2+)-dependent manner
