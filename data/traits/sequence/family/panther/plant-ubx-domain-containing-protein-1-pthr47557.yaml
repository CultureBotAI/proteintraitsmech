identifier: PANTHER:PTHR47557
label: "PLANT UBX DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This entry represents a group of plant UBX domain-containing proteins, including AtPUX1 from Arabidopsis. AtPUX1 regulates the hexameric structure and ATPase activity of AtCDC48, an essential AAA-ATPase chaperone that functions in numerous diverse cellular activities. The UBX domain is comprised of ~80 amino acids and shares common secondary structure organisation with ubiquitin. In contrast to ubiquitin, UBX domains lack the C-terminal glycine motif necessary for covalent coupling to target proteins.
definition_source: "InterPro:IPR044232 abstract (PANTHER PTHR47557 is a member signature)"
