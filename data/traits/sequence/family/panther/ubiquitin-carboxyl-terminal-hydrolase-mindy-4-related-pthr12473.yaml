identifier: PANTHER:PTHR12473
label: "UBIQUITIN CARBOXYL-TERMINAL HYDROLASE MINDY-4-RELATED"
definition: >-
  Deubiquitinating enzymes (DUBs) remove ubiquitin (Ub) from Ub-conjugated substrates to regulate the functional outcome of ubiquitylation. MINDY-3/4 belong to the MINDY (motif interacting with Ub-containing novel DUB) family (peptidase family C121), whose members are deubiquitinating enzymes releasing Lys48-linked ubiquitin.
