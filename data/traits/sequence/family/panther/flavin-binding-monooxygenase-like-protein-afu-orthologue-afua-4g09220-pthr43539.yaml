  - kind: GENERAL
    text: >-
      FLAVIN-BINDING MONOOXYGENASE-LIKE PROTEIN (AFU_ORTHOLOGUE AFUA_4G09220) — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43539. PANTHER protein class: oxygenase, oxidoreductase. Members are annotated with the molecular function flavin adenine dinucleotide binding, monooxygenase activity, organic cyclic compound binding.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in various biological processes, primarily including auxin biosynthesis and the transport of potassium and divalent cations. Members of the family function as monooxygenases, catalyzing the conversion of indole-3-pyruvic acid to indole-3-acetic acid, a key step in auxin production, which is crucial for plant growth and development. Some members are also involved in the degradation pathway of urate to allantoin and may participate in endoplasmic reticulum associated degradation (ERAD) by binding non-native proteins for ubiquitination. The family includes proteins that enhance the activity of cation/potassium transporters, indicating a role in ion homeostasis.
    source: "InterPro:IPR050982 abstract (LLM-generated, not curator-reviewed)"
