      SERINE/THREONINE-PROTEIN PHOSPHATASE PP2A 65 KDA REGULATORY SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10648. PANTHER protein class: phosphatase modulator. Members are annotated with the molecular function protein phosphatase regulator activity. Members participate in protein dephosphorylation. Members localise to cytoplasm.
