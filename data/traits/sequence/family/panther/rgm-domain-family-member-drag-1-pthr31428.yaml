identifier: PANTHER:PTHR31428
label: "RGM DOMAIN FAMILY MEMBER DRAG-1"
definition: >-
  This entry represents the repulsive guidance molecule (RGM) family, which consists of bone morphogenetic protein (BMP) coreceptors RGMA, DRAGON (RGMB), and hemojuvelin (RGMC). RGM is a GPI-linked axon guidance molecule of the retinotectal system, and controls cell motility, adhesion, immune cell regulation and systemic iron metabolism. RGM is repulsive for a subset of axons, those from the temporal half of the retina. Temporal retinal axons invade the anterior optic tectum in a superficial layer, and encounter RGM expressed in a gradient with increasing concentration along the anterior-posterior axis. Temporal axons can receive posterior-dependent information by sensing gradients or concentrations of guidance cues. Thus, RGM will likely provide positional information for temporal axons invading the optic tectum in the stratum opticum.
definition_source: "InterPro:IPR040287 abstract (PANTHER PTHR31428 is a member signature)"
