  - kind: GENERAL
    text: >-
      This family of proteins includes members that contain both ankyrin repeats and MYND-type zinc fingers. Ankyrin repeats are known to mediate protein-protein interactions, and are typically involved in various cellular processes such as signaling, cell cycle control, and transcriptional regulation. MYND-type zinc fingers are typically involved in protein-protein interactions as well, and are often found in proteins that play roles in chromatin remodeling, transcriptional repression, and developmental processes. Proteins in this family are likely to be involved in the regulation of gene expression through their interaction with other proteins and may have roles in cellular differentiation and development.
