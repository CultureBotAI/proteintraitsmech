identifier: PANTHER:PTHR47001
label: "TRANSCRIPTION FACTOR BHLH121"
definition: >-
  This entry represents a group of plant transcription factors, including bHLH11 and bHLH121 from Arabidopsis. They belong to the members of clade IVb of bHLH transcription factors. bHLH121 can bind to the promoters of the FIT (a crucial regulator of Fe-deficiency response) and bHLH Ib genes. It interacts with bHLH105 (ILR3) transcription factors and its closest homologues to positively regulate the expression of FIT. bHLH11 functions as a negative regulator of FIT-dependent Fe uptake and modulates Fe levels in Arabidopsis plants.
definition_source: "InterPro:IPR044579 abstract (PANTHER PTHR47001 is a member signature)"
