identifier: PANTHER:PTHR35005
label: "3-DEHYDRO-SCYLLO-INOSOSE HYDROLASE"
definition: >-
  This family includes the enzymes creatininase and 2-amino-5-formylamino-6-ribosylaminopyrimidin-4(3H)-one 5'-monophosphate deformylase, also known as formamide hydrolase. Creatinase or creatinine amidohydrolase ( EC:3.5.2.10 ) catalyses the hydrolysis of creatinine to creatine, which can then be metabolised to urea and sarcosine by creatinase ( EC:3.5.3.3 ). Creatininase is a member of the urease-related amidohydrolase superfamily. Formamide hydrolase catalyses the hydrolysis of the formamide of 2-amino-5-formylamino-6-ribosylamino-4(3H)-pyrimidinone 5'-monophosphate (FAPy) to form 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate (APy) ( EC:3.5.1.102 ). This family also includes 3-dehydro-scyllo-inosose hydrolase from the marine, hyperthermophilic bacterium Thermotoga maritima. The enzyme converts 3-dehydro-scyllo-inosose (diketo-inositol) to 5-dehydro-L-gluconate by catalysing ring-opening hydrolysis, and is a component of the myo-inositol degradation pathway. T. maritima is unable to grow on myo-inositol as a single carbon source.
definition_source: "InterPro:IPR003785 abstract (PANTHER PTHR35005 is a member signature)"
