  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various cellular processes. Some proteins within this family play a role in adipocyte differentiation, where they are implicated in the signaling pathways that lead to the phosphorylation of key proteins involved in cell growth and metabolism. Specifically, they promote the phosphorylation of AKT1, which is a crucial step in the activation of mTORC2 signaling after growth factor stimulation. Other members of this family are associated with ubiquitin metabolism and are necessary for the control of DNA replication. The functions of some proteins in this family have not been characterized, suggesting a potential diversity of roles across different species.
