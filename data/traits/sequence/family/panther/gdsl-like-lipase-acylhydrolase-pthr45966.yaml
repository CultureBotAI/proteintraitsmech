identifier: PANTHER:PTHR45966
label: "GDSL-LIKE LIPASE/ACYLHYDROLASE"
definition: >-
  GDSL-type esterases/lipases are hydrolytic enzymes with multifunctional properties, such as broad substrate specificity, regiospecificity, and stereoselectivity. They have been identified in microbes and many plants. They have diverse physical functions such as affecting the germination rate and early growth of seedlings subjected to high concentrations of glucose, or being involved in biotic stress responses. This entry represents a group of plant GDSL esterases/lipases, including GLIP1-5 and GLL25 from Arabidopsis. GDSL LIPASE-LIKE 1 (GLIP1) modulates systemic immunity through the regulation of ethylene signaling components. GLIP1 and GLIP3 have been shown to contribute to the plant resistance to Botrytis cinerea. GLIP2 is involved in the resistance to Erwinia carotovora via the negative regulation of auxin signaling. GLL25 (also known as GOLD36 or MVP1), have lost the conserved active site 'GDSL' motif and have no lipase activity. GLL25 is Involved in organisation of the endomembrane system and is required for endoplasmic reticulum morphology and organelle distribution.
