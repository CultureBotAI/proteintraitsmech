identifier: PANTHER:PTHR24287
label: "P450, PUTATIVE (EUROFUNG)-RELATED"
definition: >-
  This entry includes members of the CYP52 family from class E, cytochrome P450 proteins, found in fungi. These enzymes should be classed as sequence cluster group II. Group II proteins are distributed widely amongst the kingdoms of life, but the CYP52 family has been first described only amongst Candida-related species of fungi, and as such may represent a novel development in Candida yeast. CYP52 proteins catalyse the conversion of fatty acids and alkanes to alpha,omega-dicarboxylic acids. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and fatty acids. In bacteria, they are important for several metabolic processes, such as the biosynthesis of antibiotic erythromycin in Saccharopolyspora erythraea (Streptomyces erythraeus). Cytochrome P450 enzymes use haem to oxidise their substrates, using protons derived from NADH or NADPH to split the oxygen so a single atom can be added to a substrate. They also require electrons, which they receive from a variety of redox partners. In certain cases, cytochrome P450 can be fused to its redox partner to produce a bi-functional protein, such as with P450BM-3 from Bacillus megaterium, which has haem and flavin domains. Organisms produce many different cytochro
