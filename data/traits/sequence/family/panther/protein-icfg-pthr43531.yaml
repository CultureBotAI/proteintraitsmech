identifier: PANTHER:PTHR43531
label: "PROTEIN ICFG"
definition: >-
  PROTEIN ICFG — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43531. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function transmembrane signaling receptor activity. Subfamilies participate in chemotaxis, response to external stimulus, response to chemical. Subfamilies localise to plasma membrane, cell periphery.
