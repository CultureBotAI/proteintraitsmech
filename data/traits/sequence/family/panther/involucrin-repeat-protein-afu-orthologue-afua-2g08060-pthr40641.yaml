identifier: PANTHER:PTHR40641
label: "INVOLUCRIN REPEAT PROTEIN (AFU_ORTHOLOGUE AFUA_2G08060)"
definition: >-
  This family of proteins includes tethering components that are crucial for the localization and function of Woronin bodies, which are organelles in certain fungi. Members of this family are involved in the cellular response to hyphal damage by facilitating the occlusion of septal pores, thereby compartmentalizing and protecting undamaged sections of the hyphae. The proteins possess an N-terminal domain that interacts with Woronin bodies, anchoring them at the septal pore, and a C-terminal domain that binds to the septal pore itself, ensuring the correct positioning of the Woronin bodies for their role in cellular defense.
