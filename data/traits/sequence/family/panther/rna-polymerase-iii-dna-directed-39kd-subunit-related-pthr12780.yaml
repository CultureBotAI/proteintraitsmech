identifier: PANTHER:PTHR12780
label: "RNA POLYMERASE III  DNA DIRECTED , 39KD SUBUNIT-RELATED"
definition: >-
  The entry represents a subunit specific of RNA Pol III, the tRNA specific polymerase. The C34 subunit of Saccharomyces cerevisiae RNA Pol III is part of a subcomplex of three subunits which have no counterpart in the other two nuclear RNA polymerases. This subunit interacts with TFIIIB70 and therefore participates in Pol III recruitment. This entry also includes some homologus archaeal proteins of unknown function.
