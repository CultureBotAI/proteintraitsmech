identifier: PANTHER:PTHR46572
label: "RHO1 GDP-GTP EXCHANGE PROTEIN 1-RELATED"
definition: >-
  This family of proteins includes guanine nucleotide-exchange factors (GEFs) that specifically activate Rho-type GTPases, primarily Rho1, by catalyzing the exchange of GDP for GTP. These proteins play a crucial role in the regulation of cell wall biosynthesis, cell wall integrity, septum formation, and the organization of the actin cytoskeleton. They are involved in signaling pathways that control cell wall defects and coordinate actin deposition with cell wall biosynthesis during growth. Some family members also interact with additional Rho-type GTPases, such as Rho5, influencing their activation state and downstream signaling events.
