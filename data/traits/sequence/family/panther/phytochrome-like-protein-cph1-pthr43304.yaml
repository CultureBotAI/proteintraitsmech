  - kind: GENERAL
    text: >-
      This family of proteins includes sensor kinases and photoreceptors that are part of two-component regulatory systems, which are typically involved in environmental response and signal transduction. Members of this family are known to play roles in processes such as methyl sulfide metabolism, methanogenesis, and photoreception, with some acting as heme-binding sensors. They can exist in different forms that are interconvertible by light, absorbing in the red and far-red regions of the spectrum. Additionally, some members may be involved in the synthesis of quorum sensing signal molecules and the regulation of cellular morphology and metabolic fluxes. Others are implicated in nodulation and may function as protein kinases that phosphorylate response regulators in response to environmental signals.
    source: "InterPro:IPR052162 abstract (LLM-generated, not curator-reviewed)"
