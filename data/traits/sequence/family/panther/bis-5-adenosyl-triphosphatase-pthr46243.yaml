identifier: PANTHER:PTHR46243
label: "BIS(5'-ADENOSYL)-TRIPHOSPHATASE"
definition: >-
  This family of proteins is involved in the hydrolysis of dinucleoside polyphosphates, particularly those containing a purine base and at least three phosphate groups. The primary activity observed in these proteins is the cleavage of bis(5'-adenosyl)-triphosphates to produce AMP and ADP. This enzymatic function plays a role in regulating intracellular levels of dinucleoside polyphosphates, which can increase under stress conditions such as heat shock. Some members of the family also exhibit additional enzymatic activities, including hydrolysis of other nucleotide derivatives and modulation of various cellular processes such as apoptosis, cell proliferation, and survival signaling pathways.
