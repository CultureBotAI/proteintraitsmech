identifier: PANTHER:PTHR45747
label: "HISTONE-LYSINE N-METHYLTRANSFERASE E(Z)"
definition: >-
  This entry represents a group of histone-lysine N-methyltransferases that belong to the Polycomb group (Pc-G), including: Drosophila melanogaster Enhancer of zeste E(z). Mammalian EZH-1 and EZH-2. Arabidopsis thaliana CURLY LEAF (CLF), a transcriptional repressor of floral homeotic gene AGAMOUS. Arabidopsis thaliana CLF-like. Arabidopsis thaliana MEDEA (MEA), a suppressor of endosperm development. Arabidopsis thaliana EZA1. The Polycomb Repressive Complex 2 (PRC2) is a chromatin modifying complex that consists of three core components: EED, SUZ12 and one of the two histone H3K27 methyltransferases, EZH1 or EZH2. The PRC2 complex catalyses di- and trimethylation of histone H3 lysine 27 (H3K37me2/3), which has a repressive role. Even though EZH1 and EZH2 form similar PRC2 complexes, they exhibit contrasting repressive roles. In terms of their expression in mice, EZH1 is more abundant in nonproliferative adult organs, while EZH2 expression is tightly associated with proliferation.
definition_source: "InterPro:IPR045318 abstract (PANTHER PTHR45747 is a member signature)"
