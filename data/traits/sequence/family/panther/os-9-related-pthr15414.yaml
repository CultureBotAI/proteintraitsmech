identifier: PANTHER:PTHR15414
label: OS-9-RELATED
definition: >-
  OS9 is conserved among eukaryotes and shows similarities with mannose-6-phosphate receptors (MPRs). Proteins in this family are lectins that functions in endoplasmic reticulum (ER) quality control and ER-associated degradation (ERAD). Proteins in this entry also include endoplasmic reticulum lectin 1 (ERLEC1, also known as XTP3-B), which may function in endoplasmic reticulum quality control and endoplasmic reticulum-associated degradation (ERAD) of both non-glycosylated proteins and glycoproteins.
