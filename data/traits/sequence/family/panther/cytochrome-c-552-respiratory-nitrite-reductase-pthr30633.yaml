identifier: PANTHER:PTHR30633
label: "CYTOCHROME C-552 RESPIRATORY NITRITE REDUCTASE"
definition: >-
  The enzyme cytochrome c nitrite reductase (c552) catalyses the six-electron reduction of nitrite to ammonia as one of the key steps in the biological nitrogen cycle, where it participates in the anaerobic energy metabolism of dissimilatory nitrate ammonification. Cytochrome c nitrite reductase from Sulfurospirillum deleyianum is a functional dimer, with 10 close-packed haem groups of type c and an unusual lysine-coordinated high-spin haem at the active site.
