identifier: PANTHER:PTHR43018
label: "PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE ALDOLASE"
definition: >-
  This family of proteins includes enzymes that catalyze the first step in the shikimate pathway, which is the condensation of phosphoenolpyruvate (PEP) and D-erythrose-4-phosphate (E4P) to produce 3-deoxy-D-arabino-heptulosonate-7-phosphate (DAHP). This reaction is a key regulatory point in the biosynthesis of aromatic amino acids. Members of this family are subject to feedback inhibition by various end products of the pathway, such as L-phenylalanine and L-tyrosine.
