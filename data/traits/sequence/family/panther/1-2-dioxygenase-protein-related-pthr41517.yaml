identifier: PANTHER:PTHR41517
label: "1,2-DIOXYGENASE PROTEIN-RELATED"
definition: >-
  This entry represents Gentisate 1,2-dioxygenase (GDO) from Ralstonia sp., and similar proteins predominantly found in bacteria and fungi. GDO catalyses the oxygen-dependent ring fission of gentisate between the carboxyl and proximal hydroxyl groups at positions 1 and 2 of the aromatic ring to form maleyl pyruvate.
