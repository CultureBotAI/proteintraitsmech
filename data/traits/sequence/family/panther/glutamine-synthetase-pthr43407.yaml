label: "GLUTAMINE SYNTHETASE"
definition: >-
  GLUTAMINE SYNTHETASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43407. PANTHER protein class: ligase, metabolite interconversion enzyme. Members are annotated with the molecular function ligase activity. Members participate in L-amino acid biosynthetic process, proteinogenic amino acid biosynthetic process, intracellular chemical homeostasis. Members localise to cytoplasm, membrane.
