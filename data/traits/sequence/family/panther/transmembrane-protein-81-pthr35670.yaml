identifier: PANTHER:PTHR35670
label: "TRANSMEMBRANE PROTEIN 81"
definition: >-
  TMEM81 is a type I transmembrane protein with a large, N-terminal lumenal domain with an immunoglobulin-like fold, and a short cytoplasmic tail. The function of TMEM81 is not clear. Homologues are found only in chordates.
