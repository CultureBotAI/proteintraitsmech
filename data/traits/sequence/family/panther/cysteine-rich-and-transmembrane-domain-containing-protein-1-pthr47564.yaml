identifier: PANTHER:PTHR47564
label: "CYSTEINE-RICH AND TRANSMEMBRANE DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  This family includes a group of eukaryotic proteins containing the uncharacterised cysteine-rich, transmembrane (TM) module, CYSTM, found in a wide range of tail-anchored membrane proteins, which may play a role in stress tolerance. This entry includes CYSTM1 from animals, whose function is not clear, the uncharacterised protein YBR016W and YDL012C from yeast.
