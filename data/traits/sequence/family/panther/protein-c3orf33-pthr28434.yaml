identifier: PANTHER:PTHR28434
label: "PROTEIN C3ORF33"
definition: >-
  This entry includes human MISO (IMitochondrial inner membrane subdomain organizer, previously known as C3orf33) and related animal proteins. C3orf33, also known as AC3-33, is a secretory protein that inhibits Elk1 transcriptional activity via ERK pathway. This protein naturally assembles into mitochondrial subdomains and functions as a regulator of mitochondrial morphology, dynamics and homeostasis.
