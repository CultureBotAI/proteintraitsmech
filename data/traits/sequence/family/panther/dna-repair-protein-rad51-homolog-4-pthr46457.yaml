identifier: PANTHER:PTHR46457
label: "DNA REPAIR PROTEIN RAD51 HOMOLOG 4"
definition: >-
  This family of proteins is involved in the homologous recombination repair (HRR) pathway, which is crucial for the repair of double-stranded DNA breaks that can occur during DNA replication or result from DNA-damaging agents. Members of this family are known to bind to single-stranded DNA (ssDNA) and exhibit DNA-dependent ATPase activity. They are part of the RAD51 paralog protein complex BCDX2, which functions in the BRCA1-BRCA2-dependent HR pathway. This complex operates downstream of BRCA2 recruitment and upstream of RAD51 recruitment, with a specific role in binding to the intersection of Holliday junctions and replication fork junctions. Additionally, these proteins are implicated in telomere maintenance and can stimulate Holliday junction resolution, contributing to genomic stability.
