identifier: PANTHER:PTHR34524
label: CALCYPHOSIN
definition: >-
  Calcium binding signalling proteins are characterised by their ability to bind calcium, which suggests a role in cellular signalling events. While some members are hypothesised to function as regulatory proteins rather than as calcium buffers or transport proteins, the exact mechanisms by which they influence signalling pathways remain to be fully elucidated. The potential regulatory function implies that these proteins may interact with other cellular components to modulate processes that are sensitive to calcium levels, which is a common second messenger in many signalling cascades. These proteins usually contain EF-hand domains.
