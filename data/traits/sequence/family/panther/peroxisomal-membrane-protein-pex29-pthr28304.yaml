  - kind: GENERAL
    text: >-
      The PEX28-32 family is involved in the regulation of peroxisome number, size, and distribution within the cell. Members of this family are peroxisomal membrane proteins that play a role in peroxisome maintenance and dynamics. The family includes subfamilies such as PEX28 and PEX29, which share similar functions in peroxisome regulation but may have distinct roles or regulatory mechanisms within the broader context of peroxisome biogenesis and homeostasis.
