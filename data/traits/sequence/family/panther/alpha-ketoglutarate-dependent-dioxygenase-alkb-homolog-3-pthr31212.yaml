identifier: PANTHER:PTHR31212
label: "ALPHA-KETOGLUTARATE-DEPENDENT DIOXYGENASE ALKB HOMOLOG 3"
definition: >-
  AlkB proteins are dioxygenases that repair alkylation damage to DNA and RNA. Nine mammalian AlkB homologues exist (ALKBH1-8, FTO), but only a subset functions as DNA/RNA repair enzymes. This entry represents AlkB homologue 3 (ALKBH3, ABH3), which has a strong preference for single-stranded DNA also demethylates 1-methyladenine (1meA) and 3-methylcytosine (3meC) in RNA. ALKBH3 is overexpressed in various cancers and contributes to cancer cell survival.
