  - kind: GENERAL
    text: >-
      This family of proteins includes G-protein coupled receptors with a primary role in the detection of odorants. These receptors are involved in the sense of smell and are responsible for the recognition and discrimination of a wide variety of airborne molecules. The function of these receptors is typically mediated by G proteins that activate downstream signaling pathways, such as adenylyl cyclase, leading to a cellular response. Some members of this family may also play a role in sperm cell recognition and potentially in taste perception.
