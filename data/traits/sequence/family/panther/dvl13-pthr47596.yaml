identifier: PANTHER:PTHR47596
label: DVL13
definition: >-
  The DVL/RTFL small polypeptides family comprises regulatory molecules that play a crucial role in coordinating cellular responses essential for plant differentiation, growth, and development. Members of the family are involved in restricting polar cell proliferation within lateral organs and orchestrating the recruitment and differentiation of socket cells at trichome sites, thereby contributing to the precise formation and patterning of plant structures.
