identifier: PANTHER:PTHR43675
label: "ARSENITE METHYLTRANSFERASE"
definition: >-
  Methylation is an important reaction in the biotransformation of arsenic. Arsenite methyltransferase catalyses the transfer of a methyl group from AdoMet to trivalent arsenicals producing methylated and dimethylated arsenicals.
