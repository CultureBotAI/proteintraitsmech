identifier: PANTHER:PTHR47090
label: "PROTEIN EDS1-RELATED"
definition: >-
  Proteins in this entry contain the highly conserved domain known as the EP domain, which consists of hydrophobic interactions, salt bridges, and an extensive hydrogen bonding network. In Arabidopsis EDS1 (ENHANCED DISEASE SUSCEPTIBILITY1, At3g48090) is a positive regulator of basal resistance and of effector-triggered immunity specifically mediated by Toll-interleukin-1 receptor-nucleotide binding-leucine-rich repeat (TIR-NB-LRR) resistance proteins. EDS1 associations with senescence-associated gene 101 (SAG101) or phytoalexin deficient 4 (PAD4) in separate complexes. Despite its homology to eukaryotic lipases, the catalytic activity of EDS1 is dispensable for immune function. This entry includes EDS1, EDS1L and EDS1B from Arabidopsis.
definition_source: "InterPro:IPR044214 abstract (PANTHER PTHR47090 is a member signature)"
