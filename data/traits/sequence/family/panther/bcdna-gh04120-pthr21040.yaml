identifier: PANTHER:PTHR21040
label: BCDNA.GH04120
definition: >-
  HEXDC is a beta-hexosaminidase that hydrolyses the terminal non-reducing N-acetyl-D-hexosamine residues in N-acetyl-beta-D-hexosaminides. This entry also includes Lacto-N-biosidase/N-acetyllactosaminidase, a hydrolase that shows both lacto-N-biosidase (LNBase) and N-acetyllactosaminidase (LacNAcase) activity. It catalyses the release of the disaccharide lacto-N-biose (LNB, Gal-beta1,3-GlcNAc) from the non-reducing end of glycans such as lacto-N-tetraose (LNT).
definition_source: "InterPro:IPR038901 abstract (PANTHER PTHR21040 is a member signature)"
