  - kind: GENERAL
    text: >-
      This family of proteins is involved in various developmental processes, including the regulation of shape and survival during different life stages. Members of this family are characterized by their ability to bind chitin, which is a key component in the structure of cuticles and extracellular matrices. They play critical roles in the morphological transformations that occur during metamorphosis, such as the pupal shape change in insects. Additionally, these proteins are essential for the proper segregation of chromosomes during meiosis and are involved in the formation of the peritrophic membrane, which is important for the maintenance of gut structure and function. Some family members are also implicated in the formation of a cohesive chitin layer in oocytes post-fertilization, indicating a role in early embryonic development.
    source: "InterPro:IPR051940 abstract (LLM-generated, not curator-reviewed)"
