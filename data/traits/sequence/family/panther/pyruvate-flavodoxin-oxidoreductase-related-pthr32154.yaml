  - kind: GENERAL
    text: >-
      The pyruvate:ferredoxin/flavodoxin oxidoreductase family comprises enzymes that catalyze the oxidative decarboxylation of various 2-oxoacids, such as pyruvate, 2-oxobutyrate, and 2-oxoglutarate, to form their CoA derivatives. These reactions are crucial for connecting glycolysis to other metabolic pathways like the Wood-Ljungdahl pathway and the tricarboxylic acid cycle. Members of this family are also involved in the reduction of ferredoxin or flavodoxin, which can subsequently provide reducing equivalents for processes such as nitrogen fixation. The family includes pyruvate synthase subunits, ketoisovalerate oxidoreductases, and oxalate oxidoreductases, highlighting its role in a diverse range of metabolic processes. Some members are sensitive to oxygen, and others are regulated by cofactors like magnesium ions and thiamine diphosphate.
    source: "InterPro:IPR050722 abstract (LLM-generated, not curator-reviewed)"
