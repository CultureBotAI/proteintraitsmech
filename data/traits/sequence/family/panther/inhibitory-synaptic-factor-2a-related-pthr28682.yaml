identifier: PANTHER:PTHR28682
label: "INHIBITORY SYNAPTIC FACTOR 2A-RELATED"
definition: >-
  This entry includes inhibitory synaptic factor 2A/B (INSYN2A/B). INSYN2A is part of the complex that mediates postsynaptic inhibition. The function of INSYN2B is not clear.
