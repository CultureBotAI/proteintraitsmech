identifier: PANTHER:PTHR39365
label: "MX REGION OF TRA-2 RELATED-RELATED"
definition: >-
  Sex-determining transformer protein 2 (Tra-2) plays a major role in controlling sexual cell fates in Caenorhabditis. Tra-2 functions to promote female development. It interacts with and suppresses the male-promoting activity of an intracellular protein complex containing FEM-1, FEM-2, and FEM-3. Tra-2 is a transmembrane receptor inactivated by Her-1, a protein required for male development.
