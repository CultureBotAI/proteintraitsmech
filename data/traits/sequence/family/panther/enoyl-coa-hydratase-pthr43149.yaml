identifier: PANTHER:PTHR43149
label: "ENOYL-COA HYDRATASE"
definition: >-
  This entry represents a group of delta 3,5,delta 2,4-dienoyl-CoA isomerase, including ECH1 from animals and AtDCI1 from Arabidopsis. ECH1 is an auxiliary enzyme of unsaturated fatty acid beta-oxidation. This entry also includes uncharacterised bacterial proteins.
