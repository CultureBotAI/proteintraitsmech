definitions:
  - kind: GENERAL
    text: >-
      PIRNA BIOGENESIS PROTEIN EXD1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46628. and participate in negative regulation of gene expression, cellular aromatic compound metabolic process, heterocycle metabolic process. and localise to protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the piRNA metabolic process, which is crucial for the repression of transposable elements during meiosis. Members of this family form part of the PET complex, a multiprotein assembly essential for piRNA processing during spermatogenesis. These proteins act as RNA adapters within the complex and are associated with the loading of Piwi proteins with piRNAs. Although they possess a 3'-5' exonuclease domain, they lack the critical DEDD residues necessary for catalytic activity, rendering them inactive exonucleases. The family plays a significant role in maintaining germline integrity by preventing the mobilization of transposable elements.
    source: "InterPro:IPR052144 abstract (LLM-generated, not curator-reviewed)"
