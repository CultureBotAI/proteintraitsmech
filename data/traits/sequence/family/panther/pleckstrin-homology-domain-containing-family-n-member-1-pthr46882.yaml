identifier: PANTHER:PTHR46882
label: "PLECKSTRIN HOMOLOGY DOMAIN-CONTAINING FAMILY N MEMBER 1"
definition: >-
  Pleckstrin homology domain-containing family N member 1 (PLEKHN1), also known as CLPABP, is a cardiolipin phosphatidic acid binding protein that associates with microtubules and accumulates in RNA granules, which contain cytochrome-c mRNA. It binds to Bid (a pro-apoptotic protein), removes Bid from transient Bid-Bax complexes, and promotes apoptosis.
definition_source: "InterPro:IPR042835 abstract (PANTHER PTHR46882 is a member signature)"
