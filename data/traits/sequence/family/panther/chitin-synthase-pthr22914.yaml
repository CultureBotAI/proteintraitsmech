identifier: PANTHER:PTHR22914
label: "CHITIN SYNTHASE"
definition: >-
  Chitin synthase (EC:2.4.1.16), also known as chitin-UDP acetyl-glucosaminyl transferase, is a plasma membrane-bound protein which catalyses the conversion of UDP-N-acettyl-D-glucosamine and {(1,4)-(N-acetyl- beta-D-glucosaminyl)}(N) to UDP and {(1,4)-(N-acetyl-beta-D- glucosaminyl)}(N+1) to produce chitin, an abundant biopolymer found in a diverse group of organisms, ranging from fungal species to insects and crustaceans. Chitin synthases are grouped into six classes (I-VI), classes I to III comprise one family, which are smaller proteins (average 900 amino acids) and classes IV to VI comprise a second family whose proteins have an average size of nearly 1,200 amino acids. It plays a major role in cell wall biogenesis in fungi, as chitin is crucial for the maintenance of cell morphology and in C. elegans is essential during embryogenesis providing mechanical support and chemical impermeability.
definition_source: "InterPro:IPR004835 abstract (PANTHER PTHR22914 is a member signature)"
