identifier: PANTHER:PTHR43465
label: "DUF1680 DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_1G08910)"
definition: >-
  This entry represents the homologues of enzymes belonging to the glycosyl hydrolase 127 family, including non-reducing end beta-L-arabinofuranosidase from Bifidobacterium longum (UniProtKB:E8MGH8, also known as Beta-AFase). Beta-AFase, an unusual beta-L-arabinofuranosidase enzyme (EC:3.2.1.185), releases l-arabinose from the l-arabinofuranose (Araf)-beta1,2-Araf disaccharide and also transglycosylates 1-alkanols with retention of the anomeric configuration. Terminal beta-l-arabinofuranosyl residues have been found in arabinogalactan proteins from a number of different plant species. Beta-l-Arabinofuranosyl linkages with 1-4 arabinofuranosides are also found in the sugar chains of extensin and solanaceous lectins, hydroxyproline (Hyp)2-rich glycoproteins that are widely observed in plant cell wall fractions. The critical residue for catalytic activity is Glu-338, in a ET/SCAS sequence context.
definition_source: "InterPro:IPR049174 abstract (PANTHER PTHR43465 is a member signature)"
