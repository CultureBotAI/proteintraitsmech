identifier: PANTHER:PTHR14352
label: "HAUS AUGMIN-LIKE COMPLEX SUBUNIT 7"
definition: >-
  Haus7 is a component of the HAUS augmin-like complex. The complex interacts with the gamma-tubulin ring complex, and this interaction is required for spindle assembly, chromosome segregation and cytokinesis.
