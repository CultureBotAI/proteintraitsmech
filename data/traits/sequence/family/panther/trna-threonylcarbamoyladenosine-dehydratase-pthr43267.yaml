identifier: PANTHER:PTHR43267
label: "TRNA THREONYLCARBAMOYLADENOSINE DEHYDRATASE"
definition: >-
  This is a family of E1-like enzymes that contain the NAD/FAD-binding fold. Proteins in this entry include ThiF/MoeB/HesA from bacteria and E1-like enzymes from eukaryotes. ThiF/MoeB/HesA are involved in molybdopterin and thiamine biosynthesis. The common reaction mechanism catalysed by MoeB and ThiF, like other E1 enzymes, begins with a nucleophilic attack of the C-terminal carboxylate of MoaD and ThiS, respectively, on the alpha-phosphate of an ATP molecule bound at the active site of the activating enzymes, leading to the formation of a high-energy acyladenylate intermediate and subsequently to the formation of a thiocarboxylate at the C termini of MoaD and ThiS. MoeB, as the MPT synthase (MoaE/MoaD complex) sulfurase, is involved in the biosynthesis of the molybdenum cofactor, a derivative of the tricyclic pterin, molybdopterin (MPT). ThiF catalyses the adenylation of ThiS, as part of the biosynthesis pathway of thiamin pyrophosphate (vitamin B1).
definition_source: "InterPro:IPR045886 abstract (PANTHER PTHR43267 is a member signature)"
