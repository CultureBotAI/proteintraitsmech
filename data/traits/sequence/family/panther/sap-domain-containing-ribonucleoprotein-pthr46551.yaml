identifier: PANTHER:PTHR46551
label: "SAP DOMAIN-CONTAINING RIBONUCLEOPROTEIN"
definition: >-
  The SAP domain-containing ribonucleoprotein family includes SARNP from animals and its orthologues from yeast THO1 and mlo1. This family is involved in various cellular processes including DNA and RNA binding, transcriptional and translational control, and mRNA export. Members of the family have a higher affinity for single-stranded DNA and are known to bind scaffold/matrix attachment region DNA, as well as single-stranded RNA. They enhance the RNA unwinding activity of DDX39A and may play a role in cell growth, metabolism, and carcinogenesis. These proteins are components of the TREX complex, which is associated with spliced mRNA and is involved in coupling mRNA transcription, processing, and nuclear export. The complex is recruited to mRNA near the 5' end and functions in mRNA export to the cytoplasm via the TAP/NFX1 pathway. Additionally, the TREX complex is essential for the export of certain viral mRNAs and virus production. It also associates with DDX39B, which facilitates RNA binding of DDX39B and likely plays a role in mRNA export]
definition_source: "InterPro:IPR052240 abstract (PANTHER PTHR46551 is a member signature)"
