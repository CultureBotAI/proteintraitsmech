identifier: PANTHER:PTHR34418
label: "NUCLEAR PORE COMPLEX PROTEIN NUP214 ISOFORM X1"
definition: >-
  Nuclear pore complex protein NUP214 (also known as Protein LONO1 and Protein EMBRYO DEFECTIVE 1011) is a component of the nuclear pore complex in Arabidopsis, required for mature mRNA export from the nucleus to the cytoplasm, essential for normal embryogenesis and seed viability. It is important during early embryogenesis, being involved in the first asymmetrical cell division of the zygote and regulates the number and planes of cell divisions required for generating the normal embryo proper and suspensor, apical-basal axis, cotyledons and meristem.
definition_source: "InterPro:IPR044694 abstract (PANTHER PTHR34418 is a member signature)"
