identifier: PANTHER:PTHR21225
label: "PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE ALDOLASE  DAHP SYNTHETASE"
definition: >-
  Members of this group catalyze the first enzymatic reaction of the shikimate pathway. The common (shikimate) pathway links metabolism of carbohydrates to biosynthesis of aromatic amino acids phenylalanine, tyrosine, tryptophan, and derivatives in microorganisms and in plants. In a sequence of seven enzymatic reactions, D-erythrose 4-phosphate (E4P), an intermediate of the pentose phosphate pathway, and phosphoenol pyruvate (PEP), a glycolytic intermediate, are converted to chorismate. The pathway begins with the stereospecific condensation of E4P and PEP to yield 7-phospho 2-dehydro 3-deoxy-D-arabino-heptulosonate (DAHP), catalyzed by 3-deoxy-7-phosphoheptulonate synthase (DAHPS) ( EC:2.5.1.54 ). The divalent metal cation requirement of this enzyme can be satisfied by a broad range of metals. A Cys residue in a Cys-X-X-His motif has been identified as part of a metal binding site. In Escherichia coli, the enzyme exists in three isoforms, each specifically inhibited by one of the three aromatic amino acids. DAHP synthetases fall into two classes, class I (represented by this entry) and class II. Class I was believed to be limited to microorganisms and class II to plants. However, a more recent study showed that class II also contains enzymes from a microbial eukaryote and several bacteria. Brick and Woodard proposed that the difference between the two classes lies in their metal ion requirement for activity. Whereas class I requires no metal cation, class II is dependent on a metal cation for activity. However, recently a class I DAHP synthase from Thermotoga maritima has been purified, characterised, and shown to be a metalloenzyme. The three-dimentional structures of DAHP synthases have been determined. The DAHPS(Phe) monomer is a (β/α)8 barrel with an additional N-ter
