identifier: PANTHER:PTHR11943
label: "GALACTOSE-1-PHOSPHATE URIDYLYLTRANSFERASE"
definition: >-
  Galactose-1-phosphate uridyl transferase EC:2.7.7.12 (GalT) catalyses the transfer of an uridyldiphosphate group on galactose (or glucose) 1-phosphate. During the reaction, the uridyl moiety links to a histidine residue. In the Escherichia coli enzyme, it has been shown that two histidine residues separated by a single proline residue are essential for enzyme activity. On the basis of sequence similarities, two apparently unrelated families seem to exist. Class-I enzymes are found in eukaryotes as well as some bacteria such as E. coli or Streptomyces lividans, while class-II enzymes have been found so far only in bacteria such as Bacillus subtilis or Lactobacillus helveticus.
