identifier: PANTHER:PTHR14009
label: "LEUCINE ZIPPER-EF-HAND CONTAINING TRANSMEMBRANE PROTEIN"
definition: >-
  This family represents a group of LETM1-like mitochondrial inner membrane proteins, including LETM1/LETM2 from mammals and YLH47/MDM38 from yeasts LETM1 is a proton/calcium antiporter that mediates proton-dependent calcium efflux from mitochondrion. LETM2 is preferentially expressed in testis and sperm. In humans, deletion of LETM1 causes Wolf-Hirschhorn syndrome.
