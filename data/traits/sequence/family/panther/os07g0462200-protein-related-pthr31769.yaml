  - kind: GENERAL
    text: >-
      The DESIGUAL family is involved in various developmental processes in Arabidopsis thaliana. Members of the family contribute to secondary cell wall biology, particularly in lignin biosynthesis, which is crucial for plant structural integrity and defense. Some members are also implicated in ensuring bilateral symmetry development and early leaf margin patterning, likely through the regulation of auxin and CUC2 distribution. Additionally, they play a role in embryo provasculature development, cotyledon vascular complexity, and connectivity, as well as regulating cell proliferation.
