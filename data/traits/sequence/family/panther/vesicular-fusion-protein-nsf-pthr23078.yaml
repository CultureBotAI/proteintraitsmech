identifier: PANTHER:PTHR23078
label: "VESICULAR-FUSION PROTEIN NSF"
definition: >-
  This family of vesicle-fusing ATPases includes NSF, an essential protein in membrane fusion events. NSF plays the role of a chaperone by activating SNAP receptor proteins (SNAREs) so that they can participate in membrane fusion. For subsequent rounds of fusion, the SNARE complex must be disassembled, and NSF, in conjunction with SNAPs, utilises its intrinsic ATPase activity to provide a driving force that disassembles SNARE complexes.
