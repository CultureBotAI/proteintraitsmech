    text: >-
      CELL DIVISION CONTROL PROTEIN 24 OB DOMAIN-CONTAINING PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21166. Members are annotated with the molecular function DNA exonuclease activity, producing 5'-phosphomonoesters, 3'-5'-DNA exonuclease activity, 3'-5' exonuclease activity. and participate in cellular aromatic compound metabolic process, reproduction, meiotic cell cycle process.
