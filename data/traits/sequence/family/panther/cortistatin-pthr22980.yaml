identifier: PANTHER:PTHR22980
label: CORTISTATIN
definition: >-
  CORTISTATIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22980. PANTHER protein class: neuropeptide, peptide hormone. Members are annotated with the molecular function chromatin binding. Members participate in reciprocal meiotic recombination, DNA-templated DNA replication, replication fork processing. Members localise to nuclear protein-containing complex.
