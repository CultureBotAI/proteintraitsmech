identifier: PANTHER:PTHR14205
label: "WD-REPEAT PROTEIN"
definition: >-
  Proteins in this entry contain WD40 repeats. This entry includes mammalian EARP and GARP complex-interacting protein 1 (EIPR1 or TSSC1), which is a component of the endosomal retrieval machinery, binding to both the tethering complexes GARP and EARP. GARP participates in SNARE-dependent fusion of endosome-derived carriers with the trans-Golgi network, wheras EARP does the same for recycling endosomes. Also included in this family is the EARP-interacting protein 1 from the nematode Caenorhabditis elegans, which trafficks cargo to the dense-core vesicle, a secretory organelle that mediates the regulated release of peptide hormones, growth factors, and biogenic amines and which originates from the trans-Golgi of neurons and neuroendocrine cells. The WD repeat-containing protein DWA2 from Arabidopsis thaliana is also a member of this family. DWA2 is a component of an E3 ubiquitin-protein ligase complex that acts as negative regulator in abscisic acid signaling.
definition_source: "InterPro:IPR040323 abstract (PANTHER PTHR14205 is a member signature)"
