identifier: PANTHER:PTHR23318
label: "ATP SYNTHASE GAMMA-RELATED"
definition: >-
  This family includes Serine/threonine-protein phosphatase 4 regulatory subunit 3 (PP4R3) from Saccharomyces cerevisiae, a core regulatory subunit of the histone H2A phosphatase complex, which dephosphorylates H2AS128ph (gamma-H2A) that has been displaced from sites of DNA lesions in the double-stranded DNA break repair process. Members of this family are involved in various cellular processes, including DNA damage repair, cell cycle checkpoint recovery, and cytoskeletal organization, cell polarity, chemotaxis, gene expression, cytokinesis, and myosin II assembly. Some proteins in this group are also implicated in the localisation of cell fate determinants during cell division and in the exclusion of certain proteins from the nucleus.
