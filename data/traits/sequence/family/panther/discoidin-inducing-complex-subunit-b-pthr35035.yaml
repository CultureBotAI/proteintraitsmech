  - kind: GENERAL
    text: >-
      This family of proteins includes components of a complex involved in quorum sensing, which is a mechanism that bacteria use to coordinate gene expression according to the density of their population. Specifically, these proteins regulate the expression of discoidin genes, which are important for growth and development. Although individual members of this family do not induce discoidin by themselves, they contribute to the function of the complex in which they are a part.
