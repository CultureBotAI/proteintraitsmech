  - kind: GENERAL
    text: >-
      The protein family is involved in the protection and maintenance of transcriptional and developmental programs. It has a crucial role in safeguarding bivalent promoters and poised enhancers from hypermethylation, with a distinct preference for these regulatory elements. The family members function by forming a complex with TET1, binding to DNA, and preventing the binding of DNMT3A/3B, thus inhibiting de novo methylation. This activity is essential for the proper regulation of gene expression and the prevention of aberrant methylation patterns that could lead to developmental defects or diseases.
    source: "InterPro:IPR052466 abstract (LLM-generated, not curator-reviewed)"
