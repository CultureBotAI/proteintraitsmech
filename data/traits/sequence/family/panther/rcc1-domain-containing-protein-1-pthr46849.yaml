  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes, including transcriptional repression of satellite repeats and the regulation of histone methylation, specifically H3K36 methylation in centromeric regions. Members of this family work in conjunction with KDM8 to maintain genomic stability by ensuring proper mitotic spindle organization and chromosome segregation. Additionally, these proteins play a crucial role in cytoskeletal dynamics by regulating alpha-tubulin deacetylation and microtubule stability. This regulation is essential for cell migration and the induction of epithelial to mesenchymal transition (EMT) in response to TGF-beta signaling, potentially through the modulation of KDM8 activity.
