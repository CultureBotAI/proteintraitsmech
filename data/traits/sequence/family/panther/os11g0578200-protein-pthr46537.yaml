identifier: PANTHER:PTHR46537
label: "OS11G0578200 PROTEIN"
definition: >-
  This entry represents a group of plant putative E3 ubiquitin-protein ligases, including RING1A and RING1B from Arabidopsis. Together with LHP1, they form a PRC1-like complex, which binds trimethyl-H3K27 marked by the CLF-containing PRC2, resulting in transcriptional suppression of KNOX.
