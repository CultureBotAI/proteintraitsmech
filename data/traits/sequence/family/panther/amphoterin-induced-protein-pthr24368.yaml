identifier: PANTHER:PTHR24368
label: "AMPHOTERIN-INDUCED PROTEIN"
definition: >-
  The Amphoterin-induced protein (AMIGO) family consists of three cell surface leucine-rich repeat (LRR) proteins. AMIGO-1 is expressed on fibre tracts of neuronal tissues and participates in their formation. It has two other homologues, AMIGO-2, also known as DEGA (differentially expressed in human gastric adenocarcinoma) or as Alivin-1, due to its role in promoting survival of neurons,, and AMIGO-3, the function of which is not clear. All are thought to be cell adhesion molecules. They all have the same domain structure with an extracellular, N-terminal leucine-rich repeat (LRR) domain with six LRRs, an Ig domain, and a single transmembrane helix followed by a cytoplasmic tail.
definition_source: "InterPro:IPR031283 abstract (PANTHER PTHR24368 is a member signature)"
