identifier: PANTHER:PTHR13102
label: "NUCLEOLAR PROTEIN 9"
definition: >-
  Nucleolar protein 9 (NOP9) is an RNA-binding nucleolar protein found in yeast and required for pre-rRNA processing. It is a component of both the 90S pre-ribosome and the pre-40S ribosome. This entry also includes APUM23 from Arabidopsis. APUM23 is a nucleolar PUF protein involved in pre-rRNA processing.
