    text: >-
      The BCS1 subfamily of AAA ATPases functions as mitochondrial chaperones essential for the assembly of mitochondrial respiratory chain complex III. Members of the BCS1 subfamily play a crucial role in maintaining mitochondrial tubular networks, respiratory chain assembly, and the formation of the LETM1 complex. In plants, they are also involved in regulating morphology and anatomy during seed maturation.
