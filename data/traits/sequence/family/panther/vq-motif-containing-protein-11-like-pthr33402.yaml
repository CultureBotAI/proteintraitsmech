identifier: PANTHER:PTHR33402
label: "VQ MOTIF-CONTAINING PROTEIN 11-LIKE"
definition: >-
  This entry includes a group of VQ motif-containing proteins (VQPs) from plants, including VQ4/11/13/19/31/33 from Arabidopsis. This subgroup of VQPs can be phosphorylated by the MAPKs MPK3 and MPK6, and have been named MPK3/6-targeted VQPs (MVQs). VQ4, also known as MVQ1, may act as an inhibitor of WRKY functions. In general, Arabidopsis VQPs interacted specifically with the C-terminal WRKY domains of group I and the sole WRKY domains of group IIc WRKY transcription factors. Arabidopsis VQPs reported to control stress responses include the calmodulin (CaM)-binding protein CamBP25 and VQ9, which regulate osmotic and salinity tolerance, respectively, the sigma factor binding proteins SIB1 and SIB2, which act as activators of WRKY33 in plant defence, and the negative regulator of the jasmonate defence pathway.
definition_source: "InterPro:IPR039611 abstract (PANTHER PTHR33402 is a member signature)"
