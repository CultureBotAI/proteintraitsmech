identifier: PANTHER:PTHR14659
label: "ALPHA- AND GAMMA-ADAPTIN-BINDING PROTEIN P34"
definition: >-
  Alpha- and gamma-adaptin-binding protein p34 is a protein involved in membrane trafficking. It is known to interact with both alpha and gamma adaptin. It has been speculated that p34 may play a chaperone role such as preventing the soluble adaptors from co-assembling with soluble clathrin, or helping to remove the adaptors from the coated vesicle. It may also aid in the recruitment of soluble adaptors onto the membrane.
