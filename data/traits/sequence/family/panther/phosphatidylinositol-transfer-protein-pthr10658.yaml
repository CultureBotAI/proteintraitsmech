identifier: PANTHER:PTHR10658
label: "PHOSPHATIDYLINOSITOL TRANSFER PROTEIN"
definition: >-
  Phosphatidylinositol transfer proteins (PITPs) are ubiquitous cytosolic proteins that catalyse the transfer of phosphatidylinositol (PI) between membranes. PITPs are an essential component of the polyphosphoinositide synthesis machinery and is hence required for proper signalling by epidermal growth factor and f-Met-Leu-Phe, as well as for exocytosis. The role of PITP in polyphosphoinositide synthesis may also explain its involvement in intracellular vesicular traffic. Phosphatidylinositol transfer protein alpha and beta isoforms (PIPNA/B) are also able to catalyse the transfer of phosphatidylcholine (PC) between membranes. PIPNB is required for COPI-mediated retrograde transport from the Golgi to the endoplasmic reticulum where phosphatidylinositol and phosphatidylcholine transfer activity is essential for this function.
definition_source: "InterPro:IPR001666 abstract (PANTHER PTHR10658 is a member signature)"
