identifier: PANTHER:PTHR12178
label: "EF-HAND DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry includes N-terminal EF-hand calcium binding proteins 1, 2 and 3 (NECAB1, NECAB2 and NECAB3). They are expressed in the adult mouse hippocampus and dentate gyrus and in the rat/human spinal cord. NECAB2 has been shown to bind to the adenosine A(2A) receptor and the mGlu(5) receptor. NECAB3 has been shown to regulate HIF-1 (hypoxia inducible factor-1) activity via Mint3 in cancer cells.
