identifier: PANTHER:PTHR34820
label: "INNER MEMBRANE PROTEIN YEBZ"
definition: >-
  This entry represents copper transport protein C and D. Copper resistance protein C (CopC) is a bacterial blue copper protein that binds 1 atom of copper per protein molecule. Along with CopA, CopC mediates copper resistance by sequestration of copper in the periplasm. CopD, together with CopC, perform copper uptake into the cytoplasm.
