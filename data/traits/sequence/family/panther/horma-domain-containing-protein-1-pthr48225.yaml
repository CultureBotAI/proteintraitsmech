identifier: PANTHER:PTHR48225
label: "HORMA DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  The HORMA domain-containing protein family is essential for proper meiotic progression in eukaryotes. Members of this family play multiple roles during meiosis, including the regulation of DNA double-strand break (DSB) processing, synaptonemal complex formation, and activation of the ATR kinase in response to unsynapsed chromatin. These proteins are crucial for homologous chromosome pairing and recombination, ensuring genomic stability and successful gametogenesis. They are involved in various checkpoints, particularly the male mid-pachytene and female meiotic prophase checkpoints, to monitor and maintain meiotic integrity. The family also includes proteins that coordinate the activity of recombination machinery and are implicated in meiotic silencing of unsynapsed chromatin (MSUC).
