  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional repressors that interact with a specific DNA consensus sequence to regulate gene expression, potentially in a tissue-specific manner. Members of this family are involved in the negative regulation of postnatal growth, particularly affecting muscle and organ development in females. They play a critical role in myoblast differentiation and mitochondrial activity, primarily through the repression of IGF2 transcription. Additionally, these proteins are implicated in the cell cycle control of myoblasts and may influence the transcription of E2F family members. They also contribute positively to the cell cycle and survival of pancreatic beta cells, influencing cell adhesion and the formation of cell-to-cell junctions, which may affect beta cell differentiation and function. Furthermore, they are associated with insulin sensitivity and glucose metabolism.
    source: "InterPro:IPR052865 abstract (LLM-generated, not curator-reviewed)"
