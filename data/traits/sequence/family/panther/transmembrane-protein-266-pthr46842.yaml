identifier: PANTHER:PTHR46842
label: "TRANSMEMBRANE PROTEIN 266"
definition: >-
  Transmembrane protein 266 (TMEM266), also known as HVRP1 (Hv1 related protein 1), is a voltage sensor regulated by extracellular Zn2. It may have an important function in the nervous system.
