identifier: PANTHER:PTHR24107
label: "YNEIN REGULATORY COMPLEX SUBUNIT 5"
definition: >-
  This family of proteins is involved in the regulation of ciliary and flagellar motility, specifically through the nexin-dynein regulatory complex (N-DRC). Members of this family are essential for maintaining the alignment and integrity of the distal axoneme and for regulating microtubule sliding in motile axonemes. They may also play a role in the assembly of the N-DRC and are implicated in the motility of sperm.
