  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with protease activity that are associated with the cytoskeleton and are implicated in muscle growth and neuromuscular junction maturation and stabilization. Members of this family may participate in cleaving specific muscle proteins, contributing to muscle function. Additionally, some members are involved in cytokinesis, the process of cell division, by recruiting other proteins to facilitate the synthesis of cellular structures necessary for cell separation.
