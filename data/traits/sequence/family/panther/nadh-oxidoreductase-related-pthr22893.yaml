identifier: PANTHER:PTHR22893
label: "NADH OXIDOREDUCTASE-RELATED"
definition: >-
  This entry include a group of oxidoreductases, found in the Old yellow enzyme (OYE) family which includes 12-oxophytodienoate reductase, pentaerythritol tetranitrate reductase, morphinone reductase, and related enzymes. It includes Oye2/3 from budding yeasts. Oye2/3 are flavin-dependent NADPH oxidoreductases that have roles in oxidative stress and programmed cell death in yeast.
