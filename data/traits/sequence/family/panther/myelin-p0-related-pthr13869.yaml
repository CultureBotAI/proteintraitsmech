identifier: PANTHER:PTHR13869
label: "MYELIN P0 RELATED"
definition: >-
  This entry represents a group of transmembrane proteins, including myelin protein P0, myelin protein zero-like protein 1/2/3, sodium channel subunit beta-2 and v-set and immunoglobulin domain-containing protein 1. Myelin protein P0 is required for normal myelination in the peripheral nervous system. It mediates adhesion between adjacent myelin wraps and ultimately drives myelin compaction. Mutations in the gene MPZ, encoding myelin protein zero (MPZ), cause inherited neuropathies collectively called Charcot-Marie-Tooth type 1B. Sodium channel regulatory subunit beta-2 is a regulatory subunit of multiple voltage-gated sodium (Nav) channels directly mediating the depolarisation of excitable membranes. This entry also includes Junctional adhesion molecule-like (JAML) which is localised at the cell plasma membrane in the areas of cell-cell contacts and is involved in the transmigration of leukocytes within epithelial and endothelial tissues through adhesive interactions with epithelial and endothelial CXADR.
definition_source: "InterPro:IPR000920 abstract (PANTHER PTHR13869 is a member signature)"
