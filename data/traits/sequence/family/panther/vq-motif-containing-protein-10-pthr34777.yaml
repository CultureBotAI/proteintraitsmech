identifier: PANTHER:PTHR34777
label: "VQ MOTIF-CONTAINING PROTEIN 10"
definition: >-
  This entry includes a group of VQ motif-containing proteins from plants, including VQ1/10 from Arabidopsis. In general, Arabidopsis VQPs interacted specifically with the C-terminal WRKY domains of group I and the sole WRKY domains of group IIc WRKY transcription factors. Arabidopsis VQPs reported to control stress responses include the calmodulin (CaM)-binding protein CamBP25 and VQ9, which regulate osmotic and salinity tolerance, respectively, the sigma factor binding proteins SIB1 and SIB2, which act as activators of WRKY33 in plant defence, and the negative regulator of the jasmonate defence pathway.
definition_source: "InterPro:IPR039608 abstract (PANTHER PTHR34777 is a member signature)"
