  - kind: GENERAL
    text: >-
      This family of proteins is part of the major facilitator superfamily (MFS), which is one of the largest groups of secondary transporters. Members of this family are involved in facilitating the transport of various substrates across cellular membranes. The transport mechanism typically involves the use of a proton or sodium gradient to drive the transport process, functioning as symporters, antiporters, or uniporters. While the specific substrates for the TsgA homologs are not detailed in the provided annotations, the MFS transporters generally play a critical role in the uptake of nutrients, efflux of toxins, and maintenance of ion gradients, which are essential processes for cellular function and homeostasis.
