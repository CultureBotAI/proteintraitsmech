  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of bacilysin, a nonribosomally synthesized dipeptide antibiotic composed of L-alanine and L-anticapsin. Members of this family function as isomerases, specifically catalyzing the allylic isomerization of endocyclic-delta(4),delta(8)-7R-dihydro-hydroxyphenylpyruvate to exocyclic-delta(3),delta(5)-dihydro-hydroxyphenylpyruvate. This reaction results in a mixture of olefin isomers. Bacilysin acts as an irreversible inactivator of the glutaminase domain of glucosamine synthetase, an enzyme involved in the biosynthesis of glucosamine-6-phosphate.
    source: "InterPro:IPR052535 abstract (LLM-generated, not curator-reviewed)"
