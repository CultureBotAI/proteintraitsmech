definitions:
  - kind: GENERAL
    text: >-
      RNA (RNA) POLYMERASE II ASSOCIATED PROTEIN HOMOLOG — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45984. Members are annotated with the molecular function heat shock protein binding. Members participate in protein targeting, establishment of protein localization to organelle, protein localization to mitochondrion. Members localise to cytoplasm, cytosol, mitochondrion.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in distinct cellular processes. Some members play a role in the cytoplasmic assembly and/or trafficking of ciliary or axonemal dynein arms, which are essential for ciliary and flagellar movement, and may be implicated in fertilization. These members also exhibit GTPase activity. Other members of the family are involved in mitochondrial protein import, acting as receptors in the mitochondrial membrane for cytosolically synthesized preproteins. They bind mature portions of precursor proteins, may interact with cellular components, and display weak ATPase activity, potentially functioning as chaperone-like proteins to maintain precursors in an unfolded state suitable for import.
    source: "InterPro:IPR051982 abstract (LLM-generated, not curator-reviewed)"
