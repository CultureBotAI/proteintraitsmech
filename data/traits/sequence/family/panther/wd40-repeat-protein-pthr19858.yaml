identifier: PANTHER:PTHR19858
label: "WD40 REPEAT PROTEIN"
definition: >-
  Periodic tryptophan protein 2 (also known as UTP1) is involved in nucleolar processing of pre-18S ribosomal RNA. In budding yeast, it is a component of the ribosomal small subunit (SSU) processome composed of at least 40 protein subunits and snoRNA U3.
