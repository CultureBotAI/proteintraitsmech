identifier: PANTHER:PTHR43728
label: "SLR0304 PROTEIN"
definition: >-
  This entry represents a family of proteins predominantly found in bacteria that have an N-terminal radical SAM domain and a C-terminal domain whose function is unknown (see ). The C-terminal region has several conserved Cys residues, one of which is replaced by selenocysteine in at least five bacterial reference genomes. Slr0304 protein from Synechocystis sp. PCC 6803 ( ) and Slr3097 protein from Nostoc sp. PCC 7120 ( ), included in this family, have been named as ArsS, a radical SAM enzyme involved in arsenosugar biosynthesis.
