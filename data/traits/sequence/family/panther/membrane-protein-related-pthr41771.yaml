identifier: PANTHER:PTHR41771
label: "MEMBRANE PROTEIN-RELATED"
definition: >-
  The sequences featured in this family are similar to two proteins expressed by Lactococcus lactis, YibE (UniProtKB:Q9CHC5) and YibF (UniProtKB:Q9CHC4). Most of the members of this family are annotated as being putative membrane proteins, and in fact the sequences contain a high proportion of hydrophobic residues.
