  - kind: GENERAL
    text: >-
      SERINE/THREONINE-PROTEIN KINASE TNNI3K-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44329. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes both active serine/threonine kinases and pseudokinases. The active kinases are involved in various cellular processes such as signal transduction pathways, stress responses, and regulation of gene expression. They may function in defense mechanisms, potassium homeostasis, and viral egress. The pseudokinases, despite lacking catalytic activity, play crucial roles in programmed cell death processes like necroptosis. They are activated by phosphorylation and binding to specific inositol phosphates, leading to cellular events such as membrane localization and plasma membrane damage. Some family members are also involved in the regulation of nuclear envelope integrity in response to viral infection.
    source: "InterPro:IPR051681 abstract (LLM-generated, not curator-reviewed)"
