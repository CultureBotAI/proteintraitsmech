identifier: PANTHER:PTHR12129
label: "HEPARAN SULFATE 2-O-SULFOTRANSFERASE"
definition: >-
  Heparan sulphate (HS) is a long unbranched polysaccharide found covalently attached to various proteins at the cell surface and in the extracellular matrix, where it acts as a co-receptor for a number of growth factors, morphogens, and adhesion proteins. HS-O-sulphotransferase (Hs2st) occupies a critical position in the succession of enzymes responsible for the biosynthesis of HS, catalysing the transfer of sulphate to the C2-position of selected hexuronic acid residues within the nascent HS chain. Mice that lack HS2ST undergo developmental failure after midgestation, the most dramatic effect being the complete failure of kidney development. This family is related to InterPro:IPR005331. Uronyl 2-sulfotransferase, a sulfotransferase that catalyses the transfer of sulfate to the position 2 of uronyl residues in glycosaminoglycan chains, is also included in this entry. It has mainly activity toward iduronyl residues in dermatan sulfate, and weaker activity toward glucuronyl residues of chondroitin sulfate and it has little to no activity toward desulfated N-resulfated heparin or N-sulfoheparosan.
