identifier: PANTHER:PTHR10441
label: "CD8 ALPHA CHAIN"
definition: >-
  The CD8 alpha subunit is a component of the CD8 α-β heterodimer and is additionally found as a homodimeric complex. Both of these species assist in the recognition of MHC class I-peptide complexes by the α-β T cell receptor (TCR). CD8 binds to constant regions of the peptide-MHC complex and augments antigen-specific interactions that are formed by the TCR. Additionally, CD8 is directly coupled to TCR signalling by virtue of its interactions with the p56Lck kinase, as well as other proteins. CD8 expression is limited to and one of the defining characteristics of cytolytic T cells.
definition_source: "InterPro:IPR015468 abstract (PANTHER PTHR10441 is a member signature)"
