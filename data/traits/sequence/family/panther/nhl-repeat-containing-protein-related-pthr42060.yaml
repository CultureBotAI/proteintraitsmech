  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are putative hetero-Diels-Alderase, which are involved in the biosynthesis of complex meroterpenoids. These enzymes are thought to catalyze the key step of linking a polyketide moiety with a terpene component, such as humulene or its derivatives, to form a distinctive tropolone-humulene skeleton. This reaction is a crucial part of the biosynthetic pathways leading to compounds with significant biological activities, including xenovulene A, which inhibits the human gamma-aminobutyrate A (GABAA) benzodiazepine receptor, and eupenifeldin, which has antitumor properties. The family members are characterized by their similarity to the eupF Diels-Alderase and are likely to share a common catalytic mechanism in the formation of these bioactive meroterpenoids.
    source: "InterPro:IPR052998 abstract (LLM-generated, not curator-reviewed)"
