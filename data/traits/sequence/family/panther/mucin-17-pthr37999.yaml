  - kind: GENERAL
    text: >-
      This family of proteins is involved in the protection and lubrication of mucosal surfaces. Members of this family are thought to contribute to the stabilization of the mucus layer, which serves as a barrier against environmental stress and pathogens. They may also play a role in cellular signaling processes that regulate the viscosity and production of mucus, thus aiding in the preservation of mucosal integrity and function.
