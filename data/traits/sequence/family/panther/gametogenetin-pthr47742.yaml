identifier: PANTHER:PTHR47742
label: GAMETOGENETIN
definition: >-
  Gametogenetin (GGN) is a family of proteins largely found in vertebrates. GGN reacts with POG in the maturation of sperm and is expressed virtually only in the testis. It is also expressed in lower levels in the oocyte and is required for the survival of pre-implantation embryos. GGN plays a role in male meiotic DNA double strand break repair. It is found to be associated with the intracellular membrane, binds with GGNBP1 and may be involved in vesicular trafficking.
definition_source: "InterPro:IPR031400 abstract (PANTHER PTHR47742 is a member signature)"
