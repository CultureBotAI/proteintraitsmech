identifier: PANTHER:PTHR45683
label: "MITOCHONDRIAL NICOTINAMIDE ADENINE DINUCLEOTIDE TRANSPORTER 1-RELATED-RELATED"
definition: >-
  This entry represents a group of substrate carrier proteins that are related to the nicotinamide adenine dinucleotide transporter found in mitochondria, including human NAD/FAD transporter SLC25A32, yeast Yea6/Flx1/Yia6, and AtNDT1/AtNDT2/PXN/AtFOLT1 from Arabidopsis. Structurally, they consist of three tandem repeats of a domain of approximately one hundred residues. Each of these domains contains two transmembrane regions. In budding yeasts, Yea6 and Yia6 are mitochondrial inner membrane carrier protein that mediates the import of NAD+ into mitochondria. Flx1 transports FAD from the cytosol to the mitochondrial matrix. In humans, SLC25A32 transports folate and FAD across the inner membranes of mitochondria. Mutations in the SLC25A32 gene cause neural tube defects (NTD). SLC25A32 has also been implicated in multiple acyl-CoA dehydrogenase deficiency (MADD) or glutaric aciduria type II (GAII).
definition_source: "InterPro:IPR044712 abstract (PANTHER PTHR45683 is a member signature)"
