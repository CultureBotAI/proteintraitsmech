identifier: PANTHER:PTHR24334
label: "HOMEOBOX PROTEIN GBX"
definition: >-
  GBX-1 and GBX-2 are homeobox proteins. The role of the mouse GBX-2 in defining the mid/hindbrain organiser has been studied extensively, but little is known about GBX-1. GBX-1 is expressed first during gastrulation and later in a dynamic pattern in the central nervous system. Homeobox protein unplugged (unpg) from Drosophila plays a regulatory role in neural branching of the tracheae. Like vertebrate orthologue Gbx2, unplugged may also have a role in brain development. Studies indicate that Drosophila brain displays developmental genetic features similar to those observed for the midbrain/hindbrain boundary region in vertebrates. The homeobox domain (homeodomain) is a 60-residue motif first identified in a number of Drosophila homeotic and segmentation proteins, but now known to be well-conserved in many other animals, including vertebrates. Proteins containing homeobox domains are likely to play an important role in development - most are known to be sequence-specific DNA-binding transcription factors. The domain binds DNA through a helix-turn-helix (HTH) structure.
