identifier: PANTHER:PTHR31945
label: "TRANSCRIPTION FACTOR SCREAM2-RELATED"
definition: >-
  This entry includes bHLH transcription factors from plants that play diverse roles in plant development and responses. ICE1 is involved in regulating cold-induced transcription of CBF/DREB1 genes, and stomatal differentiation. Transcription factor FIT is involved in iron acquisition while AMS (ABORTED MICROSPORES) plays a crucial role in tapetum development and it is required for male fertility and pollen differentiation, especially during the post-meiotic transcriptional regulation of microspore development within the developing anther. Transcription factor BHLB6 is involved in phosphate starvation response and acts as a positive regulator of phosphate homeostasis and phosphate signalling by antagonising SPX4. It also playa a role as transcriptional activator in the regulation of jasmonate-mediated stress-inducible gene expression. The family is characterised by the ability to bind specific DNA sequences, often containing E-box motifs, and to function as dimers, which is crucial for their regulatory roles.
