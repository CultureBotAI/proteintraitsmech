  - kind: GENERAL
    text: >-
      The homeobox protein family is characterized by the presence of a homeobox domain, enabling these proteins to function as transcription factors. They are involved in a wide range of developmental processes, including craniofacial development, odontogenesis, stomach organogenesis, embryonic patterning, and neuron differentiation. Members of the family bind to specific DNA sequences to regulate gene expression, influencing cell fate specification, morphogenetic movements, and asymmetric cell division. Some proteins within the family also play roles in suppressing Wnt signaling, acting as transcriptional repressors or activators, and are essential for postnatal growth, nursing, and energy balance control. The family includes proteins that are part of negative regulatory loops, such as with microRNAs, and are involved in cell-type specific survival during sex determination. They are also implicated in the development of the brain, eyes, sensory organs, and limbs, as well as in the regulation of non-apoptotic cell death.
    source: "InterPro:IPR050848 abstract (LLM-generated, not curator-reviewed)"
