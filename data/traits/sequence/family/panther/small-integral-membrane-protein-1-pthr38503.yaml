identifier: PANTHER:PTHR38503
label: "SMALL INTEGRAL MEMBRANE PROTEIN 1"
definition: >-
  SMIM1 is a small integral membrane protein that regulates red blood cell formation. The Vel blood group antigen is expressed on the red blood cells of most individuals. SMIM1 has been shown to encode the Vel blood group antigen.
