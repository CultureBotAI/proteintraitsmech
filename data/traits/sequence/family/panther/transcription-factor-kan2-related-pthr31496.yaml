identifier: PANTHER:PTHR31496
label: "TRANSCRIPTION FACTOR KAN2-RELATED"
definition: >-
  This entry represents KANADI (Kan), a family of plant transcription factors. In Arabidopsis, there are four Kan members, KAN1-4, which are expressed in the phloem. KAN1 may control cambium activity through acting on auxin transport by inhibiting PIN gene expression. KAN1 has also been shown to repress the transcription of AS2 (ASYMMETRIC LEAVES2) in abaxial cells and regulate adaxial-abaxial polarity. It also plays a role in lateral root formation and development. This entry also includes RL9 (also known as SHALLOT-LIKE1, SLL1) from Oryza sativa subsp. japonica. RL9 controls rice leaf rolling by regulating leaf abaxial cell development.
