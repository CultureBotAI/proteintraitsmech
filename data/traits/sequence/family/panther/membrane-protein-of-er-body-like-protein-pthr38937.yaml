identifier: PANTHER:PTHR38937
label: "MEMBRANE PROTEIN OF ER BODY-LIKE PROTEIN"
definition: >-
  This family of proteins may play a role in the sequestration of excess cytosolic iron and manganese into the endoplasmic reticulum, potentially reducing metal ion toxicity. These proteins are not essential for the accumulation of endoplasmic reticulum body components, including the protein PYK10.
