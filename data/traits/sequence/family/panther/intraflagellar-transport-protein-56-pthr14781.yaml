identifier: PANTHER:PTHR14781
label: "INTRAFLAGELLAR TRANSPORT PROTEIN 56"
definition: >-
  This entry refers to Tetratricopeptide repeat protein 26 (TTC26, also known as Intraflagellar transport protein 56). TTC26 is required for ciliogenesis and normal cilia function in zebrafish. A mutation in the mouse TTC26 gene leads to impaired hedgehog signalling and causes hop-sterile (hop), which is characterised by a hopping gait, polydactyly, hydrocephalus, and male sterility. Mouse TTC26 binds directly to the Ift46 subunit of Intraflagellar Transport (IFT) complex B, however, the TTC26 defect does not result in a decrease in the number or length of primary cilia.
definition_source: "InterPro:IPR030511 abstract (PANTHER PTHR14781 is a member signature)"
