  - kind: GENERAL
    text: >-
      The glycosyl hydrolase 31 family is involved in the degradation of various oligosaccharides. Members of this family catalyze the hydrolysis of glycosidic bonds, specifically liberating alpha-xylose from the non-reducing terminal glucose of xyloglucan oligosaccharides, which is crucial in xyloglucan degradation. Some enzymes within this family exhibit a preference for certain substrates, such as the alpha-(1-3)-isomaltosyl moiety, and are involved in the intracellular degradation of specific cyclic tetrasaccharides. The family's enzymes are characterized by their ability to recognize and cleave distinct linkages in oligosaccharides, contributing to diverse metabolic processes including the breakdown and utilization of complex carbohydrates.
    source: "InterPro:IPR051816 abstract (LLM-generated, not curator-reviewed)"
