    text: >-
      NUCLEAR HORMONE RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24083. PANTHER protein class: C4 zinc finger nuclear receptor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific, signaling receptor activity. Members participate in regulation of transcription by RNA polymerase II, cell differentiation, anatomical structure development.
