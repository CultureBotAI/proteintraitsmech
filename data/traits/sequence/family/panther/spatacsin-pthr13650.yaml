identifier: PANTHER:PTHR13650
label: SPATACSIN
definition: >-
  Defects in the spatacsin gene are the cause of spastic paraplegia 11, a neurodegenerative disorder characterised by a slow, gradual, progressive weakness and spasticity of the lower limbs. Human and rat spacticin protein has been shown to be expressed in the central nervous system, particularly in cortical and spinal motor neurons as well as in retina.
