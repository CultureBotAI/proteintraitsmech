identifier: PANTHER:PTHR12656
label: "BRG-1 ASSOCIATED FACTOR 250  BAF250"
definition: >-
  This entry represents the mammalian BAF250a/b and its homologue osa from fruit flies. They are part of the SWI/SNF-like ATP-dependent chromatin remodelling complex that regulates gene expression through regulating nucleosome remodelling. In humans there are two BAF250 isoforms, BAF250a/ARID1a and BAF250b/ARID1b. BAF250a/b may be E3 ubiquitin ligases that target histone H2B. This entry also includes Arabidopsis LFR protein, which is involved in leaf and flower development and is required for the formation of anther cell layers and normal expression of genes that regulates anther development.
