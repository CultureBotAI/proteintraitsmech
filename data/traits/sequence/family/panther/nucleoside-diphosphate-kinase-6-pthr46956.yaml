identifier: PANTHER:PTHR46956
label: "NUCLEOSIDE DIPHOSPHATE KINASE 6"
definition: >-
  Nucleoside diphosphate kinase 6 (NDPk6, also known as NM23-H6) is expressed mainly in mitochondria, but also found at a lower level in most tissues. NDPk6 has all nine residues considered crucial for enzyme structure and activity, and has been found to have NDP kinase activity. It may play a role in cell growth and cell cycle progression. The nm23-H6 gene locus has been implicated in a variety of malignant tumours.
definition_source: "InterPro:IPR037994 abstract (PANTHER PTHR46956 is a member signature)"
