  - kind: GENERAL
    text: >-
      This family of proteins is characterized by the presence of a CXXC motif repeat, which suggests a potential role in binding to other proteins or possibly to DNA. Members of this family are known as variant surface proteins (VSPs) in Giardia, which indicates that they may be involved in antigenic variation, a mechanism that pathogens use to evade the host immune response. VSPs are typically found on the surface of the trophozoite stage of the parasite and are thought to play a role in host-parasite interactions, possibly by facilitating attachment to the host's intestinal epithelium or by protecting the parasite from the host's immune system.
