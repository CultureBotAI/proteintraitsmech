identifier: PANTHER:PTHR32149
label: "LYMPHOCYTE ANTIGEN 6 COMPLEX LOCUS PROTEIN G6C"
definition: >-
  The function of LY6G6C is not clear. It is a GPI-anchored cell surface protein, highly expressed at the leading edges of cells, on filopodia, which are normally involved in cell adhesion and migration. Homologues are found only in mammals.
