  - kind: GENERAL
    text: >-
      The protein family is characterized by the presence of a SCAN domain and often includes C2H2-type zinc finger domains, indicating a role in DNA binding and transcriptional regulation. Members of the family are involved in various regulatory functions, such as transcriptional repression and activation, and are essential for processes like myelination in oligodendrocytes and maintenance of progenitor cells in the CNS. They can bind specific DNA sequences and may act as transcription factors, influencing the transition from premyelinating to myelinating states in oligodendrocytes and promoting cell cycle progression in CNS development.
