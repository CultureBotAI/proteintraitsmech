identifier: PANTHER:PTHR22708
label: "LEUCINE-RICH REPEAT-CONTAINING PROTEIN 56"
definition: >-
  The function of leucine-rich repeat-containing protein 56 (LRRC56) from vertebrates is not clear. However, its homologue in Chlamydomonas, also known as ODA8, is a conserved flagellar protein with a role in formation and transport of mature dynein complexes during flagellar assembly. LRRC56 from Trypanosoma brucei brucei is required for the assembly of dynein arms in the distal portion of flagellum axoneme.
definition_source: "InterPro:IPR040091 abstract (PANTHER PTHR22708 is a member signature)"
