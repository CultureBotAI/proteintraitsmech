label: "DNAJ HOMOLOG SUBFAMILY C MEMBER 12"
definition: >-
  This entry represents JDP1, also known as DnaJ homologue subfamily C member 12 (DNAJC12), which is a J domain-containing protein with unknown function. Its expression in breast cancer cells is associated with its estrogen receptor status.
