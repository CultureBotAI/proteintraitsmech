  - kind: GENERAL
    text: >-
      This family of proteins is involved in auxin signal transduction, which is a key process in plant growth and development. Members of this family function as receptor-like kinases and are implicated in the regulation of cell expansion and proliferation. Some proteins within this family form complexes that activate ROP signaling pathways, essential for plant responses to the hormone auxin. Additionally, these proteins may play roles in brassinosteroid-mediated plant growth and development, as well as in microspore and pollen development. The unique structural feature of these proteins is the presence of leucine-rich repeat (LRR) domains that are disrupted by non-LRR regions, forming two LRR solenoid structures that are distinct from the canonical horseshoe structures of LRR proteins.
    source: "InterPro:IPR052422 abstract (LLM-generated, not curator-reviewed)"
