identifier: PANTHER:PTHR16270
label: "HYPOTHETICAL LOC287798"
definition: >-
  Mitochondrial nucleoid-associated protein 1 (MTNAP1, previously known as C17orf80) has been identified as is a mitochondrial membrane-associated protein that interacts with nucleoids. It is a critical regulator of mitochondrial DNA abundance that binds double-stranded DNA throughout the mitochondrial genome without sequence specificity. MTNAP1 controls mitochondrial DNA copy number by promoting its replication and plays important roles in mitochondrial metabolism and cell proliferation. The protein is localised to mitochondrial nucleoids in the matrix and is retained in nucleoids under mitochondrial DNA replication stress. MTNAP1 is a single-pass type I membrane protein anchored in the mitochondrial inner membrane. MTNAP1 also plays important roles in mitochondrial metabolism and cell proliferation.
definition_source: "InterPro:IPR037694 abstract (PANTHER PTHR16270 is a member signature)"
