identifier: PANTHER:PTHR37323
label: "GCN5-RELATED N-ACETYLTRANSFERASE"
definition: >-
  This family of proteins is involved in the biosynthesis of ornithine lipids, which are a type of phosphorus-free membrane lipid. Members of this family function as enzymes that catalyze the acylation of ornithine with a 3-hydroxyacyl moiety derived from an acyl carrier protein. This enzymatic activity results in the formation of lyso-ornithine lipid (LOL), representing the initial step in the production of ornithine lipids. These lipids play a role in membrane integrity and function in various bacterial species.
