  - kind: GENERAL
    text: >-
      The Arabidopsis thaliana F-box protein family is involved in various regulatory processes through the ubiquitin-proteasome pathway. Members of the family function as part of SCF (SKP1-CUL1-F-box protein) E3 ubiquitin ligase complexes, which target proteins for ubiquitination and subsequent degradation. This post-translational modification is crucial for plant growth, development, and stress responses. Specific members within the family, such as ETP1 and ETP2, act as negative regulators of EIN2 protein stability, affecting ethylene signaling. Others, like SUPPRESSOR OF NIM1 1, negatively regulate plant defense pathways independent of salicylic acid. The diversity of the F-box domain and associated motifs, such as kelch repeats or leucine-rich repeats, suggests a wide range of substrates and functions.
    source: "InterPro:IPR050233 abstract (LLM-generated, not curator-reviewed)"
