  - kind: GENERAL
    text: >-
      This family of proteins is characterized by the presence of an F-box motif, which is typically involved in protein-protein interactions. Members of this family are known to play crucial roles in the ubiquitin-proteasome pathway. They function as part of the SCF (SKP1-CUL1-F-box protein) complex, acting as substrate-recognition components for the E3 ubiquitin ligases. By recognizing specific target proteins for ubiquitination, they facilitate the regulated degradation of these proteins, thus controlling various cellular processes such as cell cycle progression, signal transduction, and transcription.
