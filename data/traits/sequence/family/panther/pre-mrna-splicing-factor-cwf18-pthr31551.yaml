identifier: PANTHER:PTHR31551
label: "PRE-MRNA-SPLICING FACTOR CWF18"
definition: >-
  The cwf18 family is involved in mRNA splicing. It has been isolated as a subcomplex of the splicosome in Schizosaccharomyces pombe (Fission yeast). This entry also includes Ccdc12 from animals and RXLR100 from Plasmopara viticola.
