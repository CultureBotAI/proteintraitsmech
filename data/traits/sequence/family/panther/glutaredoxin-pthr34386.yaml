identifier: PANTHER:PTHR34386
label: GLUTAREDOXIN
definition: >-
  This family of proteins includes members that are involved in electron transport systems, particularly for the ribonucleotide reductase system NrdEF, which is essential for DNA synthesis. Some proteins in this family function as glutaredoxins, a group of small redox enzymes that use glutathione as a cofactor to catalyze thiol-disulfide exchange reactions. These reactions are crucial for maintaining cellular redox homeostasis and for the reduction of protein disulfides. Additionally, certain members are implicated in a cysteine salvage pathway, catalyzing the reduction of N-acetyl-S-hydroxy-L-cysteine to N-acetyl-L-cysteine, which is likely important in the catabolism of alkylated cysteine residues.
