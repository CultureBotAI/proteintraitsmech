identifier: PANTHER:PTHR46318
label: "UPSTREAM BINDING TRANSCRIPTION FACTOR"
definition: >-
  The UBF1 family proteins are primarily involved in the regulation of ribosomal RNA (rRNA) gene transcription. They recognize the rRNA gene promoter and activate transcription mediated by RNA polymerase I. This is achieved through cooperative interactions with the SL1/TIF-IB complex, to which they bind specifically at the upstream control element. Members of the UBF1 family are essential for the transcriptional regulation of ribosomal biogenesis, a critical process for cellular growth and proliferation. Some members of the family, such as those in mice, are also essential for the proliferation of certain cell types during early development. Additionally, a related protein in Caenorhabditis elegans is involved in mitochondrial DNA maintenance and may associate with telomeric DNA.
