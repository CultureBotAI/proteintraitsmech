  - kind: GENERAL
    text: >-
      This family of proteins consists of seed storage proteins known as zeins, which are predominantly found in maize. Zeins accumulate in protein bodies within the endosperm of the maize seed and serve as a nutrient source during seed germination. They are characterized by their solubility in alcohol but insolubility in water, which distinguishes them from other seed storage proteins. Zeins are rich in proline and glutamine and have a role in determining the quality of the maize kernel, influencing its nutritional and industrial properties.
