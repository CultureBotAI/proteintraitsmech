identifier: PANTHER:PTHR43342
label: "NADH-QUINONE OXIDOREDUCTASE, E SUBUNIT"
definition: >-
  The NADP-reducing hydrogenase complex from Desulfovibrio is a heterotetramer encoded by the hndABCD operon. It catalyses the reduction of NADP in the presence of molecular H2 to yield NADPH. This entry represents NADP-reducing hydrogenase subunit HndA from D.fructosivorans and similar prokaryotic sequences, such as HydC that acts as a bifurcating [FeFe] hydrogenase, which uses the exergonic oxidation of reduced ferredoxin to drive the unfavorable oxidation of NADH to produce H2. Proteins in this entry belong to the [2Fe-2S] ferredoxin family and are organised into two independent structural domains.
