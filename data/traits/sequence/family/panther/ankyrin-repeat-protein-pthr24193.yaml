  - kind: GENERAL
    text: >-
      The Ankyrin Repeat and SOCS Box (ASB) family proteins are involved in a variety of cellular processes, including transcription regulation, ubiquitination, and proteasomal degradation of target proteins. They often act as substrate-recognition components of E3 ubiquitin-protein ligase complexes, which are part of the ubiquitin-proteasome system responsible for protein turnover. Some family members function as transcription factors interacting with purine-rich repeats, while others may play roles in the immune response or cell cycle regulation. The ankyrin repeats typically mediate protein-protein interactions, and the SOCS box domain is crucial for binding to the Elongin BC complex, an adapter in E3 ligase complexes.
    source: "InterPro:IPR050663 abstract (LLM-generated, not curator-reviewed)"
