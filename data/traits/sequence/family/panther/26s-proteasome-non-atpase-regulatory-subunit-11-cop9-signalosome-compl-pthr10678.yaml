  - kind: GENERAL
    text: >-
      This family of proteins includes components of the 26S proteasome and the COP9 signalosome. Members involved in the 26S proteasome play a role in the ATP-dependent degradation of ubiquitinated proteins, maintaining protein homeostasis by removing misfolded or damaged proteins and those no longer needed, thus participating in cell cycle progression, apoptosis, and DNA damage repair. They are essential for proteasome assembly and are linked to increased proteasome activity in embryonic stem cells. Other family members are part of the COP9 signalosome complex, which regulates the ubiquitin conjugation pathway by deneddylation of cullin subunits of E3 ligase complexes, altering their activity. This process is involved in various cellular and developmental processes, including photomorphogenesis, neuronal differentiation, and circadian rhythm regulation.
    source: "InterPro:IPR050871 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
