identifier: PANTHER:PTHR14952
label: "ROPPORIN-1-LIKE PROTEIN"
definition: >-
  ROPPORIN-1-LIKE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14952. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies participate in spermatid development, sperm capacitation, spermatid differentiation. Subfamilies localise to motile cilium, intracellular anatomical structure, cytoplasm.
