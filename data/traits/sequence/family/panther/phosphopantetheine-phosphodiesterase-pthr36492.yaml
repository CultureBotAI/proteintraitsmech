  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with phosphodiesterase activity, specifically involved in the hydrolysis of the phosphopantetheine group from holo-carrier proteins. Members of this family are characterized by their role in the modification of carrier proteins, which is a critical step in various metabolic processes. These proteins are part of the metallophosphoesterase superfamily, indicating the presence of a metal ion in the catalytic site that is essential for their phosphodiesterase activity.
