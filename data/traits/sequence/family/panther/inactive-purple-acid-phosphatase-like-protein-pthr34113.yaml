identifier: PANTHER:PTHR34113
label: "INACTIVE PURPLE ACID PHOSPHATASE-LIKE PROTEIN"
definition: >-
  This family of proteins includes Protein EARLY STARVATION 1 and its homologues from plants. It is involved in the binding and organisation of alpha-glucans, particularly starch and crystalline maltodextrins, within the chloroplasts. Members of this family play a crucial role in starch metabolism by affecting the turnover of starch granules. They modulate the accessibility of starch polymers to various enzymes that are responsible for starch modification, degradation, and synthesis. These proteins are also essential for the regulation of starch degradation in leaves and the distribution of starch in nonphotosynthetic tissues. Additionally, they contribute to plant gravitropic responses by facilitating the formation and accumulation of starch granules, which serve as statoliths in plant cells, aiding in the plant's ability to sense gravity. This function is particularly significant in the development of gravitropic responses in both shoots and roots, as well as in the tight packing of starch granules in grains.
definition_source: "InterPro:IPR052495 abstract (PANTHER PTHR34113 is a member signature)"
