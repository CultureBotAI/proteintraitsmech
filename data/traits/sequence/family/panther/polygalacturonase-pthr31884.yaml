identifier: PANTHER:PTHR31884
label: POLYGALACTURONASE
definition: >-
  The glycosyl hydrolase 28 family is involved in the maceration and soft-rotting of plant tissue. Members of this family are enzymes that hydrolyze the 1,4-alpha glycosidic bonds of de-esterified pectate in the smooth region of the plant cell wall. These enzymes play a crucial role in the degradation of pectin, a major component of the plant cell wall. By breaking down pectin, they facilitate the penetration and spread of plant pathogens, contributing to disease progression in various plant hosts. The activity of glycosyl hydrolase 28 family members is essential for organisms that rely on the consumption or decay of plant material, making them important targets for the study of plant diseases and the development of agricultural biotechnology applications.
