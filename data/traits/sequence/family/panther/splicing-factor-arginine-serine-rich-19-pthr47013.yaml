identifier: PANTHER:PTHR47013
label: "SPLICING FACTOR, ARGININE/SERINE-RICH 19"
definition: >-
  SCAF1, also known as SRA1, is a member of the human SR (Ser/Arg-rich) superfamily of pre-mRNA splicing factors. It interacts with the CTD domain of the RNA polymerase II polypeptide A and is involved in pre-mRNA splicing. It has been linked to cancers.
