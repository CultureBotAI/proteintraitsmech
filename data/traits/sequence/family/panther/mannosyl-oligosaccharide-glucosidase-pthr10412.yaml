identifier: PANTHER:PTHR10412
label: "MANNOSYL-OLIGOSACCHARIDE GLUCOSIDASE"
definition: >-
  This family of enzymes belongs to glycosyl hydrolase family 63 ( ). They catalyse the specific cleavage of the non-reducing terminal glucose residue from Glc(3)Man(9)GlcNAc(2). Mannosyl oligosaccharide glucosidase is the first enzyme in the N-linked oligosaccharide processing pathway. This family also includes glucosylglycerate hydrolase which catalyses the hydrolysis of glucosylglycerate to glycerate and glucose, during the mycobacterial recovery from nitrogen starvation. This process promotes the rapid mobilisation of the glucosylglycerate that accumulates under these conditions. This enzyme can also hydrolyse mannosylglycerate with lower efficiency. O-Glycosyl hydrolases ( ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
