identifier: PANTHER:PTHR47297
label: "Nicotinamidase 1"
definition: >-
  This entry represents a group of amidohydrolases from plants and bacteria, including AtNIC1 from Arabidopsis. AtNIC1 catalyses the deamidation of nicotinamide, an early step in the NAD+ salvage pathway. It prevents the accumulation of intracellular nicotinamide, a known inhibitor of poly(ADP-ribose) polymerases (PARP enzymes).
