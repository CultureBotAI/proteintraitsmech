identifier: PANTHER:PTHR35073
label: OTOSPIRALIN
definition: >-
  Otospiralin, has a role in maintaining the neurosensory epithelium of the inner ear. Otospiralin is also expressed in the central nervous system, where could be involved in signalling pathways and play a role in repair mechanisms.
