identifier: PANTHER:PTHR35524
label: "ALPHA-ACETOLACTATE DECARBOXYLASE"
definition: >-
  Alpha-acetolactate decarboxylase converts acetolactate into acetoin. In Streptococcus thermophilus, it regulates leucine and valine biosynthesis by diverting the flux of alpha-acetolactate towards acetoin when the branched-chain amino acids are present in high concentration.
