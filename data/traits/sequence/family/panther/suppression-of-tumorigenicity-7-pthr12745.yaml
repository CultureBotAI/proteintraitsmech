identifier: PANTHER:PTHR12745
label: "SUPPRESSION OF TUMORIGENICITY 7"
definition: >-
  The ST7 (for suppression of tumorigenicity 7) protein is thought to be a tumour suppressor gene. It localises to the cytoplasm and plasma membrane and may mediate tumor suppression by regulating genes that are involved in oncogenic pathways and/or maintain cellular structure. The molecular function of this protein is uncertain.
