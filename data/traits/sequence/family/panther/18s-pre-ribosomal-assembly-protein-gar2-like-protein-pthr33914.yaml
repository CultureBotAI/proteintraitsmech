identifier: PANTHER:PTHR33914
label: "18S PRE-RIBOSOMAL ASSEMBLY PROTEIN GAR2-LIKE PROTEIN"
definition: >-
  Development of stomata in Arabidopsis thaliana begins with de novo asymmetric divisions in which a small cell, known as a meristemoid, and a larger daughter cell is formed. Stomatal protein BASL is a regulator of asymmetric cell division. It is required for the polar localization of POLAR.
