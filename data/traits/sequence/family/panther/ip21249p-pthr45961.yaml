  - kind: GENERAL
    text: >-
      The Dual Specificity Protein Phosphatase family is involved in the regulation of key signaling pathways through the dephosphorylation of MAP kinases such as ERK, JNK, and p38, which are critical for various cellular responses. Members of the family negatively regulate TCR signaling by inactivating the MAP3K7 adapter TAB1. Some exhibit phosphatase activity with synthetic substrates, but show limited or no activity with natural phosphoamino acids due to possible steric hindrance at the active site. Additionally, they play a role in down-regulating the cellular antiviral response by dephosphorylating activated STAT1, thereby blocking interferon-stimulated innate immune responses.
    source: "InterPro:IPR052103 abstract (LLM-generated, not curator-reviewed)"
