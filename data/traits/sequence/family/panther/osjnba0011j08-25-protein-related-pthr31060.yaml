identifier: PANTHER:PTHR31060
label: "OSJNBA0011J08.25 PROTEIN-RELATED"
definition: >-
  This entry represents a group of BTB/POZ domain-containing proteins mostly from plants, including At3g05675, At2g13690, At1g63850, At5g60050 and At3g50780 from Arabidopsis thaliana. At3g05675 and related proteins may act as a substrate-specific adapter of an E3 ubiquitin-protein ligase complex (CUL3-RBX1-BTB) which mediates the ubiquitination and subsequent proteasomal degradation of target proteins.
