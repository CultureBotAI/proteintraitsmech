    text: >-
      This family of proteins includes members that are implicated in plant responses to environmental stresses such as cold and drought conditions. They are thought to play roles in the plant's resistance mechanisms by possibly participating in cellular processes that mitigate the effects of these stresses. Some family members are inducible by abscisic acid, a plant hormone that regulates growth and development, and is especially involved in responses to environmental stress.
