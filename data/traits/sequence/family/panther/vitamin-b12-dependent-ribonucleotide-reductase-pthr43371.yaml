identifier: PANTHER:PTHR43371
label: "VITAMIN B12-DEPENDENT RIBONUCLEOTIDE REDUCTASE"
definition: >-
  The ribonucleoside diphosphate reductase class-2 family is involved in the biosynthesis of deoxyribonucleotides from ribonucleotides, providing the necessary precursors for DNA synthesis. Members of this family are vitamin B12-dependent enzymes that play a crucial role in DNA repair and replication, especially during conditions of oxygen limitation. Some family members are adenosylcobalamin-dependent ribonucleoside-triphosphate reductases, which are allosterically regulated by ATP and dNTP, indicating a sophisticated control mechanism for maintaining deoxyribonucleotide levels in the cell.
