identifier: PANTHER:PTHR47275
label: "NAD(P)H-QUINONE OXIDOREDUCTASE SUBUNIT I, CHLOROPLASTIC"
definition: >-
  This entry represents NAD(P)H-quinone oxidoreductase subunit I, which catalyses the conversion of plastoquinone and NADH to plastoquinol and NAD+ [EC:7.1.1.2]. The enzyme shuttles electrons from NAD(P)H to plastoquinone via FMN and iron-sulphur (Fe-S) centres in the photosynthetic chain and possibly in a chloroplast respiratory chain, coupling the redox reaction to proton translocation and conserving the redox energy in a proton gradient. The enzyme binds two 4Fe-4S clusters at iron-sulphur centres similar to those of bacterial-type 4Fe-4S ferredoxins, with plastoquinone believed to be the immediate electron acceptor in this species.
definition_source: "InterPro:IPR004497 abstract (PANTHER PTHR47275 is a member signature)"
