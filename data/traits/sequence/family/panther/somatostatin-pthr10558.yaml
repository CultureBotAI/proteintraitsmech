identifier: PANTHER:PTHR10558
label: SOMATOSTATIN
definition: >-
  Somatostatin (SST) also known as somatotropin release-inhibiting factor (SRIF), is a hypothalamic hormone, a pancreatic hormone, and a central and peripheral neurotransmitter. Somatostatin, acting through the 5 somatostatin receptors, it has been found to regulate the secretion of various hormones such as pituitary growth hormone (GH), thyroid-stimulating hormone (TSH), prolactin, pituitary, insulin and glucagon. It also inhibits secretion in the intestine (including gastric acid in the stomach), pancreatic acinar cells and pancreatic beta-cells, cell proliferation, stimulates absorption in the intestine and modulates smooth muscle contractility. Somatostatin has a wide distribution throughout the central nervous system as well as in peripheral tissues, for example in the pituitary, pancreas and stomach and is released from the hypothalamus. In the CNS, it is a neurotransmitter and neuromodulator activating a hyperpolarising K+ current and inhibiting Ca2+ influx, and is believed to play important roles in regulating locomotor activity and cognitive function. These various actions are mediated by a family of seven transmembrane domain G protein-coupled receptors that comprise of five distinct subtypes: Somatostatin receptor 1 (SSTR1), Somatostatin receptor 2 (SSTR2), Somatostatin receptor 3 (SSTR3), Somatostatin receptor 4 (SSTR4) and Somatostatin receptor 5 (SSTR5). This entry represents the somatostatin family, including somatostatin and cortistatin from humans.
