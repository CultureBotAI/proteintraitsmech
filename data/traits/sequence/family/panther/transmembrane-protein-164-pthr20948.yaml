identifier: PANTHER:PTHR20948
label: "TRANSMEMBRANE PROTEIN 164"
definition: >-
  This entry represents the transmembrane protein 164 (TMEM164) which is a positive regulator of ferroptosis. It selectively mediates ATG5-dependent autophagosome formation during ferroptosis, rather than during starvation, and regulates the degradation of ferritin, GPX4 and lipid droplets to increase iron accumulation and lipid peroxidation, thereby promoting ferroptotic cell death.
