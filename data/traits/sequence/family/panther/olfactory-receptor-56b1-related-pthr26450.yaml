identifier: PANTHER:PTHR26450
label: "OLFACTORY RECEPTOR 56B1-RELATED"
definition: >-
  The olfactory receptor family is comprised of G-protein coupled receptors with a primary function as odorant receptors. These receptors detect and bind specific molecules from the environment, initiating a signal transduction pathway that results in the perception of smell. Activation of these receptors typically leads to the elevation of intracellular Ca2, cAMP, and the activation of protein kinases such as PKA and MAPK3/MAPK1. Some members of the family, such as Olfactory receptor 51E2, respond to short-chain fatty acids and L-lactate, influencing physiological processes such as melanocyte function, blood pressure regulation, and cell proliferation and migration, particularly in retinal pigment epithelial cells.
