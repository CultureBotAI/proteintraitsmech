identifier: PANTHER:PTHR11959
label: "4-HYDROXYPHENYLPYRUVATE DIOXYGENASE"
definition: >-
  4-hydroxyphenylpyruvate dioxygenase ( EC:1.13.11.27 ) oxidises 4-hydroxyphenylpyruvate, a tyrosine and phenylalanine catabolite, to homogentisate. Homogentisate can undergo a further non-enzymatic oxidation and polymerisation into brown pigments that protect some bacterial species from light. A similar process occurs spontaneously in blood and is haemolytic. In some bacterial species, this enzyme has been studied as a haemolysin.
