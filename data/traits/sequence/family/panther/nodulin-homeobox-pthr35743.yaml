identifier: PANTHER:PTHR35743
label: "NODULIN HOMEOBOX"
definition: >-
  This entry represents a group of plant proteins, including nodulin homeobox protein (NDX) from Arabidopsis. AtNDX associates with single-stranded DNA and inhibits COOLAIR transcription, which in turn modifies FLC (FLOWERING LOCUS C) expression. It is a key heterochromatin regulator that functions in pericentromeric regions to control siRNA production and non-CG methylation.
