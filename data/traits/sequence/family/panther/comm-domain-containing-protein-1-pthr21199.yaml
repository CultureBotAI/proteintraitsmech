identifier: PANTHER:PTHR21199
label: "COMM DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  COMM domain-containing protein 1, also called Murr1, is involved in copper homeostasis. It has been identified as a regulator of the human delta epithelial sodium channel. It has been shown to directly link to early endosomes through its interaction with a protein complex containing CCDC22, CCDC93, and C16orf62. The COMM domain is found at the C terminus of a variety of proteins; presumably all COMM domain-containing proteins are located in the nucleus and the COMM domain plays a role in protein-protein interactions. Several family members have been shown to bind and inhibit NF-kappaB.
definition_source: "InterPro:IPR037351 abstract (PANTHER PTHR21199 is a member signature)"
