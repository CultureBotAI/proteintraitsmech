  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the regulation of receptor protein kinases. Specifically, they interact with and regulate the function of receptor protein kinases such as WAK1. This interaction is crucial for the phosphorylation of specific target proteins, which is a key step in signal transduction pathways. The C-terminal region of these proteins, which is rich in cysteine residues, plays an essential role in their ability to interact with kinase receptors. Through these interactions, members of this family are implicated in various cellular processes, including response to environmental stimuli.
