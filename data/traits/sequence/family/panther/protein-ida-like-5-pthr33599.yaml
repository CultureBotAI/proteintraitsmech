identifier: PANTHER:PTHR33599
label: "PROTEIN IDA-LIKE 5"
definition: >-
  Mutations in IDA (INFLORESCENCE DEFICIENT IN ABSCISSION) block floral organ abscission in Arabidopsis thaliana. IDA signals through the leucine-rich repeat-receptor-like kinases (LRR-RLKs) HAESA (HAE), and HAESA-LIKE2 (HSL2) to control the fall of flowers after pollination.
