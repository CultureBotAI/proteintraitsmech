identifier: PANTHER:PTHR45988
label: "C2H2 TYPE ZINC FINGER TRANSCRIPTION FACTOR FAMILY-RELATED"
definition: >-
  This entry represents a group of plant Cys2/His2 (C2H2)-type zinc-finger proteins, including AZF1/2/3 and ZAT6/10 from Arabidopsis. They belong to the C1-2i subclass of zinc-finger proteins in Arabidopsis. In general they function as transcription repressors under drought, cold, and high-salinity stress conditions. AZF1 and AZF2 have been shown to negatively regulate abscisic acid-repressive and auxin-inducible genes under abiotic stress conditions. ZAT6 has been shown to regulate root development and nutrient stress responses.
