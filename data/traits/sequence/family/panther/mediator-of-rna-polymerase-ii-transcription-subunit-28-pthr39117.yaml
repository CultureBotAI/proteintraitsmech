identifier: PANTHER:PTHR39117
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 28"
definition: >-
  Med28 is a subunit of the large protein complex Mediator, a central coregulator of transcription in eukaryotes. In plants, Med28 mutants are affected in root development and senescence, phenotypes that are possibly associated to redox changes.
