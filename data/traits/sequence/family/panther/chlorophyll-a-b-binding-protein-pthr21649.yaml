identifier: PANTHER:PTHR21649
label: "CHLOROPHYLL A/B BINDING PROTEIN"
definition: >-
  The light-harvesting complex (LHC) consists of chlorophylls A and B and the chlorophyll A-B binding protein. LHC functions as a light receptor that captures and delivers excitation energy to photosystems I and II with which it is closely associated. Under changing light conditions, the reversible phosphorylation of light harvesting chlorophyll a/b binding proteins (LHCII) represents a system for balancing the excitation energy between the two photosystems. The N-terminal of the chlorophyll A-B binding protein extends into the stroma where it is involved with adhesion of granal membranes and photo-regulated by reversible phosphorylation of its threonine residues. Both these processes are believed to mediate the distribution of excitation energy between photosystems I and II. This family also includes the photosystem II protein PsbS, which plays a role in energy-dependent quenching that increases thermal dissipation of excess absorbed light energy in the photosystem. This entry is limited to plant and chromista proteins.
definition_source: "InterPro:IPR001344 abstract (PANTHER PTHR21649 is a member signature)"
