identifier: PANTHER:PTHR48140
label: "FATTY ACID DESATURASE 4, CHLOROPLASTIC-RELATED"
definition: >-
  The CarF family of fatty acid desaturases is involved in the biosynthesis of chloroplast-specific phosphatidylglycerol molecular species. Members of the CarF family catalyze the introduction of a trans double bond close to the carboxyl group of palmitic acid. This specific enzymatic activity is crucial for the formation of phosphatidylglycerol with a distinct fatty acid composition, which is essential for proper chloroplast function and plant development. The histidine box domains within these proteins are key for binding the catalytic metal ions necessary for the desaturation process.
