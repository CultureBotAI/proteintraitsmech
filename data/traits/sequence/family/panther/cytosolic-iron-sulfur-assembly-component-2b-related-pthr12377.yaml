identifier: PANTHER:PTHR12377
label: "CYTOSOLIC IRON-SULFUR ASSEMBLY COMPONENT 2B-RELATED"
definition: >-
  MIP18 is a component of the cytosolic iron-sulfur protein assembly (CIA) complex, a multiprotein complex that mediates the incorporation of iron-sulfur cluster into extramitochondrial Fe/S proteins. This entry includes MIP18 and its homologues, such as YHR122W from S. cerevisiae and AE7 from plants.
