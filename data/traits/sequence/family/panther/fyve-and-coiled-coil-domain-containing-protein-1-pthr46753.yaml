identifier: PANTHER:PTHR46753
label: "FYVE AND COILED-COIL DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  FYVE AND COILED-COIL DOMAIN-CONTAINING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46753. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies participate in vesicle transport along microtubule, positive regulation of macroautophagy, regulation of autophagosome maturation. Subfamilies localise to late endosome, lysosome, autophagosome.
