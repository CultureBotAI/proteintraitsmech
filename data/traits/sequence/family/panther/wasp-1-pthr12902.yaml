identifier: PANTHER:PTHR12902
label: WASP-1
definition: >-
  This entry represents the SCAR/WAVE family. Members in this family include actin-binding protein WASF1-3 (WAVE 1-3), protein SCAR 1-4, protein WAVE5 and SCAR-like proteins. SCAR/WAVE family members are downstream effector molecules receiving information from multiple signalling pathways and responding by promoting the actin nucleating activity of the ubiquitous Arp2/3 complex. They are part of the WAVE complex that regulates lamellipodia formation in animals and maintains cell shape in plants. WAVE1 is also involved in the regulation of mitochondrial dynamics.
