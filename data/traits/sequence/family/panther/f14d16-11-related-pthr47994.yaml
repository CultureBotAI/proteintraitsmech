identifier: PANTHER:PTHR47994
label: F14D16.11-RELATED
definition: >-
  This entry represents a group of Myb transcription factors from plants which are involved in a variety of plant developmental processes and stress responses. Members of the family play crucial roles in anther development, microsporogenesis, and tapetal function, which are essential for pollen development. They are also key regulators of metabolic pathways, such as the biosynthesis of aliphatic glucosinolates, which contribute to plant defense against herbivores Additionally, some MYB proteins are implicated in the plant's response to abiotic stresses, including salt and osmotic stress, by regulating stress-responsive genes and metabolic adjustments. The family includes proteins that act as probable transcription factors, with some members specifically involved in the regulation of cell wall modification and suberin deposition under stress conditions.
