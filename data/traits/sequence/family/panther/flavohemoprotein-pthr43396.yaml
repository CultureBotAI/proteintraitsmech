identifier: PANTHER:PTHR43396
label: FLAVOHEMOPROTEIN
definition: >-
  FLAVOHEMOPROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43396. PANTHER protein class: transporter. Members are annotated with the molecular function flavin adenine dinucleotide binding, oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, dioxygenase activity. Members participate in cellular response to stress, cellular response to chemical stimulus, catabolic process. Members localise to intracellular anatomical structure.
