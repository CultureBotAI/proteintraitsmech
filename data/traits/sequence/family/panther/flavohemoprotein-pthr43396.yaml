label: FLAVOHEMOPROTEIN
definition: >-
  FLAVOHEMOPROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43396. PANTHER protein class: transporter. Members are annotated with the molecular function nucleoside phosphate binding, flavin adenine dinucleotide binding, oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen. Members participate in cellular metabolic process, cellular response to stimulus, cellular response to chemical stimulus. Members localise to cellular anatomical entity, intracellular anatomical structure.
