  - kind: GENERAL
    text: >-
      This family of proteins includes microtubule-binding proteins that play a role in the organization and stability of microtubules. They are involved in the localization of calcium-sensitive signal transduction machinery in sperm and are essential for the beating of motile cilia by being part of the dynein-decorated doublet microtubules in the cilia axoneme. These proteins also contribute to the assembly of both primary and motile cilia by facilitating the removal of specific proteins from the mother centriole, which is a prerequisite for ciliogenesis. Additionally, they are implicated in the orientation of the mitotic spindle and the oriented division of keratinocytes, which is important for epidermal stratification.
    source: "InterPro:IPR052102 abstract (LLM-generated, not curator-reviewed)"
