identifier: PANTHER:PTHR42976
label: "BIFUNCTIONAL CHITINASE/LYSOZYME-RELATED"
definition: >-
  This family of proteins includes enzymes with chitinase activity, which are involved in the degradation of chitin. Chitin is a major component of fungal cell walls and the exoskeletons of arthropods and other animals. Members of this family play a role in various biological processes, including the breakdown of chitin for nutrient acquisition and defense mechanisms against chitin-containing pathogens. Some proteins in this family exhibit bifunctional activity, combining chitinase with lysozyme functions, which further contributes to their role in antimicrobial defense by breaking down bacterial cell walls. These proteins are classified within the glycosyl hydrolase 18 family and are further subdivided into different subfamilies based on sequence similarity and functional characteristics.
