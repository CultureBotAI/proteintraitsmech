definitions:
  - kind: GENERAL
    text: >-
      AGAP001464-PB — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45996. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional activators that are involved in the unfolded protein response (UPR) and cellular stress responses. They bind to specific DNA elements such as the cAMP response element (CRE) and the unfolded protein response element (UPRE), thereby regulating gene expression. These proteins play roles in various cellular processes including cell survival, proliferation, migration, differentiation, and inflammatory responses. They are also implicated in the regulation of lipid metabolism, particularly in maintaining normal plasma triglyceride concentrations. Some family members are involved in the response to endoplasmic reticulum stress by activating target genes that help in adapting to and surviving stress conditions. Additionally, they may interact with other transcription factors and histone deacetylases to modulate transcriptional outcomes.
    source: "InterPro:IPR051381 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
