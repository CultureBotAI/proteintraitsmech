identifier: PANTHER:PTHR13865
label: "TIGHT JUNCTION PROTEIN"
definition: >-
  TIGHT JUNCTION PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13865. PANTHER protein class: tight junction. Members are annotated with the molecular function cell adhesion molecule binding. Members participate in cell-cell junction organization, protein localization to cell junction, cell-cell adhesion. Members localise to bicellular tight junction, plasma membrane, cell periphery.
