identifier: PANTHER:PTHR34035
label: "TESTIS-EXPRESSED PROTEIN 47"
definition: >-
  This entry represents human Testis-expressed protein 47 (TEX47) and similar proteins predominantly found in animals. The function of these proteins is unknown. This domain has a detectable similarity to domains that are members of Acylphosphatase/BLUF domain-like superfamily InterPro:IPR036046 and are predicted to adopt similar structure.
