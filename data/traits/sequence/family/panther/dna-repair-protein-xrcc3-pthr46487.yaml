identifier: PANTHER:PTHR46487
label: "DNA REPAIR PROTEIN XRCC3"
definition: >-
  DNA REPAIR PROTEIN XRCC3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46487. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function four-way junction DNA binding. Members participate in double-strand break repair via homologous recombination, telomere maintenance, mitotic recombination. Members localise to chromosome, replication fork, nuclear protein-containing complex.
