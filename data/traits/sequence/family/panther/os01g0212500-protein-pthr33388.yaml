identifier: PANTHER:PTHR33388
label: "OS01G0212500 PROTEIN"
definition: >-
  SPEAR is a transcription repressor family specific in embryophyte, with many members in land plants. All of them contain a conserved SPL-motif in their N-terminal and an ethylene-responsive element binding factor-associated amphiphilic repression (EAR) motif in the C-terminal, and are therefore known as SPL-like, EAR-containing proteins (SPEARs). SPOROCYTELESS (SPL) belongs to this family. SPL and SPEARs may play a variety of developmental roles in plants.
