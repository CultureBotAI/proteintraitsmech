identifier: PANTHER:PTHR23311
label: "HEAT SHOCK REGULATED 2"
definition: >-
  This family of proteins includes centrosomal protein of 72 kDa (CEP72) which is involved in centrosomal and spindle assembly functions. CEP72 plays a crucial role in the recruitment of essential proteins to the centrosome, a key cellular structure involved in organising microtubules. They are responsible for providing microtubule-nucleation activity through interaction with gamma-tubulin ring complexes (gamma-TuRCs), which is essential for the formation of a focused bipolar spindle during cell division. This spindle formation is necessary for generating proper tension between sister chromatids. Additionally, these proteins are implicated in the process of centriole duplication, ensuring the correct replication and segregation of these organelles. They also promote the centrosomal localisation of various proteins including CDK2, KIZ, AKAP9, CDK5RAP22, CEP152, WDR62, and CEP63. This entry also includes leucine rich repeat containing 36 which is probably a CEP72 paralogue.
definition_source: "InterPro:IPR055320 abstract (PANTHER PTHR23311 is a member signature)"
