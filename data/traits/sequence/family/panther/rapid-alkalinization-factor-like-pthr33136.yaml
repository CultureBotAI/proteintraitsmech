identifier: PANTHER:PTHR33136
label: "RAPID ALKALINIZATION FACTOR-LIKE"
definition: >-
  RAPID ALKALINIZATION FACTOR-LIKE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33136. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 37 of its annotated subfamilies. Subfamilies participate in cell communication, signal transduction, cellular process. Subfamilies localise to cell-cell junction, cell junction, anchoring junction.
