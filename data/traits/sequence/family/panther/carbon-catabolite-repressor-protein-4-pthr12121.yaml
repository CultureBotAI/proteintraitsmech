identifier: PANTHER:PTHR12121
label: "CARBON CATABOLITE REPRESSOR PROTEIN 4"
definition: >-
  The CCR4/nocturin family is involved in various cellular processes related to mRNA turnover and general transcription regulation. Members of the family act as catalytic components of the CCR4-NOT core complex, which functions both in the nucleus as a general transcription factor and in the cytoplasm as the major mRNA deadenylase. The complex is linked to bulk mRNA degradation, miRNA-mediated repression, and translational repression during initiation. Some family members exhibit 3'-5' RNase activity with a preference for polyadenylated substrates and may also have low exonuclease activity towards single-stranded DNA. Additionally, certain proteins within the family play roles in pre-rRNA processing, circadian rhythm regulation, metabolic gene post-transcriptional control, and antiviral responses. The family's involvement in transcription and mRNA decay reflects its importance in gene expression regulation and cellular response to environmental cues.
