  - kind: GENERAL
    text: >-
      This family of proteins functions as heterodimeric glycoprotein hormones that are involved in the regulation of thyroid cell metabolism. Members of this family can bind and activate the thyroid-stimulating hormone receptor (TSHR), which leads to an increase in cyclic AMP (cAMP) production. This signaling pathway is crucial for controlling the metabolic processes within thyroid cells.
