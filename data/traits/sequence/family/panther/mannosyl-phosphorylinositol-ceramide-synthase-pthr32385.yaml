  - kind: GENERAL
    text: >-
      MANNOSYL PHOSPHORYLINOSITOL CERAMIDE SYNTHASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32385. PANTHER protein class: glycosyltransferase. Members are annotated with the molecular function mannosyltransferase activity. Members participate in glycosphingolipid biosynthetic process, phospholipid biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes glycosyltransferases involved in various cellular processes such as vesicular trafficking, cell wall biogenesis, and synthesis of complex lipids. Members of this family are characterized by their ability to transfer sugar moieties from activated sugar donors to specific acceptor molecules, which can be proteins or lipids. Some proteins within this family have additional domains that confer specialized functions, such as binding to specific phospholipids or possessing additional enzymatic activities. These proteins play crucial roles in the modification of host cell processes during pathogen infection, the synthesis of cell wall components in fungi, and the regulation of cell morphology and membrane dynamics through the synthesis of mannosylated ceramides.
    source: "InterPro:IPR051706 abstract (LLM-generated, not curator-reviewed)"
