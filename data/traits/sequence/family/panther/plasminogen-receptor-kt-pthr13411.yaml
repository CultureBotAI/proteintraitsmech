identifier: PANTHER:PTHR13411
label: "PLASMINOGEN RECEPTOR (KT)"
definition: >-
  Plg-R(KT) is a receptor for plasminogen and is involved in the plasminogen-dependent regulation of macrophage invasion, chemotactic migration, and recruitment in the inflammatory response. It is essential for mammary lobuloalveolar development and lactation.
