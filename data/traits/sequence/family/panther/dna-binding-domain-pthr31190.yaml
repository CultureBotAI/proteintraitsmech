identifier: PANTHER:PTHR31190
label: "DNA-BINDING DOMAIN"
definition: >-
  This entry represents a group of plant ethylene-responsive transcription factors, including ERF1 from Nicotiana tabacum (Common tobacco), RAP2-3 (also known as AtEBP) from Arabidopsis and ERF.C.3 from Solanum lycopersicum (Tomato). They are ethylene-inducible DNA binding proteins that bind to the GCC-box pathogenesis-related promoter element. ERFC3 acts downstream of MYC2 in the jasmonate-mediated response to Botrytis cinerea infection.
