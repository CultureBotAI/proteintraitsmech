label: "LYSYL OXIDASE-LIKE-RELATED"
definition: >-
  LYSYL OXIDASE-LIKE-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45817. PANTHER protein class: oxidase, metabolite interconversion enzyme. Members are annotated with the molecular function catalytic activity, acting on a protein, oxidoreductase activity. and participate in peptidyl-amino acid modification, nitrogen compound metabolic process, organic substance metabolic process. and localise to extracellular space.
