identifier: PANTHER:PTHR28174
label: "54S RIBOSOMAL PROTEIN L36, MITOCHONDRIAL"
definition: >-
  Mitochondria contain 55S ribosomes, with a 28S subunit and a 39S subunit. These ribosomes resemble bacterial ribosomes and eukaryotic-cytoplasmic ribosomes in their main functional properties, but they differ in structure and physical chemical properties. Many of the mitochondrial ribosomal proteins (MRPs) are distinctive, having no closely related homologues in bacterial or eukaryotic-cytoplasmic ribosomes. This entry represents the large ribosomal subunit protein bL31m (also known as MRPL36) from fungi which is a highly diverged eubacterial ribosomal protein bL31 homologue with derived domains functioning in mRNA selection in yeast mitochondria.
definition_source: "InterPro:IPR034600 abstract (PANTHER PTHR28174 is a member signature)"
