identifier: PANTHER:PTHR43477
label: "DIHYDROANTICAPSIN 7-DEHYDROGENASE"
definition: >-
  This family of proteins includes enzymes that are part of the short-chain dehydrogenases/reductases (SDR) superfamily. Members of this family are involved in various metabolic processes, including the biosynthesis of secondary metabolites, fatty acids, and siderophores, as well as the detoxification of harmful compounds. They typically exhibit NAD(H) or NADP(H) dependent oxidoreductase activity, catalysing reactions such as the reduction of ketones to alcohols or the oxidation of alcohols to ketones. These enzymes play roles in the synthesis of complex natural products with potential pharmacological activities, regulation of iron transport and homeostasis, and conversion of cyclic substrates, which may include detoxification mechanisms. This entry includes DHRS6, a cytosolic type 2 R-beta-hydroxybutyrate dehydrogenase belonging to the short chain dehydrogenase/reductase (SDR) family. DHRS6 catalyses the NAD-dependent conversion of (R)-hydroxybutyrate to acetoacetate. Found in humans and other vertebrates, DHRS6 is proposed to function in cytosolic ketone body utilisation during starvation or to generate precursors for lipid and sterol synthesis, complementing the mitochondrial type 1 R-beta-hydroxybutyrate dehydrogenase system. Its crystal structure reveals a tetrameric organisation with a classical SDR Rossmann fold.
definition_source: "InterPro:IPR051122 abstract (PANTHER PTHR43477 is a member signature)"
