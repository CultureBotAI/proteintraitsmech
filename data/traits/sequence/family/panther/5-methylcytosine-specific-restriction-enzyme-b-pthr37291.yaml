  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes involved in the recognition and processing of methylated DNA. Members of this family are capable of binding to DNA that contains methylated cytosines, which can be produced by various DNA methylases. Some proteins within this family recognize specific DNA sequences with methylated cytosines and may cleave the DNA at these sites, although the exact cleavage patterns can vary. These proteins play a role in the restriction-modification systems of bacteria, providing defense against foreign DNA such as that from bacteriophages. They can also participate in regulating gene expression through epigenetic modifications. The family includes enzymes that recognize methylated cytosines preceded by a purine residue and enzymes that recognize specific double-stranded DNA sequences.
    source: "InterPro:IPR052934 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
