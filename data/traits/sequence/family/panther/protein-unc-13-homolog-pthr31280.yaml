identifier: PANTHER:PTHR31280
label: "PROTEIN UNC-13 HOMOLOG"
definition: >-
  This family consists mainly of uncharacterised proteins from plants. The unc-13 homologue from Arabidopsis thaliana has been shown to control tethering of the proton ATPase AHA1 to the plasma membrane, and to be essential for the opening of stomata in repsonse to low levels of carbon dioxide and light. The unc13-like protein contains two Munc13 homology domains, which are known to mediate synaptic priming in neuronal exocytosis in animals, and may act similarly for plant stomata. PATROL1 controls the tethering of proton ATPase AHA1 to the plasma membrane and is essential for stomatal opening in response to low carbon dioxide concentration and light. The protein translocates reversibly between the cytoplasm and plasma membrane depending on environmental conditions. PATROL1 contains two Munc13 domains (MHD1 and MHD2; InterPro:IPR016093 and InterPro:IPR004166).
definition_source: "InterPro:IPR008528 abstract (PANTHER PTHR31280 is a member signature)"
