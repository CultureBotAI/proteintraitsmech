definitions:
  - kind: GENERAL
    text: >-
      DESMOGLEIN FAMILY MEMBER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24025. PANTHER protein class: cell adhesion molecule, cadherin. Members are annotated with the molecular function calcium ion binding. Members participate in cell-cell adhesion. Members localise to cell-cell junction.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes components of intercellular desmosome junctions, which are critical for cell-cell adhesion. They interact with plaque proteins and intermediate filaments, playing a key role in maintaining tissue integrity. Some members are involved in the maintenance of planar cell polarity and inhibition of cell proliferation and differentiation. Others mediate calcium-dependent heterophilic interactions and are essential for normal sensory functions. These proteins typically contain cadherin domains that bind calcium ions to ensure structural rigidity and proper function.
    source: "InterPro:IPR050971 abstract (LLM-generated, not curator-reviewed)"
