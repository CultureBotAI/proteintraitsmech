identifier: PANTHER:PTHR13594
label: "CENTRIOLAR COILED-COIL PROTEIN OF 110 KDA"
definition: >-
  CCP110 is a centriole protein implicated in the regulation of cell division, centrosome duplication, centriole length and in the suppression of ciliogenesis. Its levels and localization to the centrosome are tightly regulated in a cell cycle dependent manner. CP110 has been shown to interact with two calcium-binding proteins, centrin and calmodulin (CaM), to regulate cytokinesis.
