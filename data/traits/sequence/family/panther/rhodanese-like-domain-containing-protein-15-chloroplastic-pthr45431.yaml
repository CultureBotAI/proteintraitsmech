identifier: PANTHER:PTHR45431
label: "RHODANESE-LIKE DOMAIN-CONTAINING PROTEIN 15, CHLOROPLASTIC"
definition: >-
  This family of proteins is involved in sulfur metabolism, specifically in the transfer of sulfur from donor molecules. Members of this family are known to catalyze the transfer of sulfur to various acceptor compounds, including cyanide and thiol compounds, forming products such as sulfite and thiocyanate. Some proteins within this family are thought to play a role in plant senescence processes. The activity of these proteins can be regulated by various factors, including the concentration of substrates and inhibitors such as thiosulfate, sulfite, and salts. The family includes proteins with rhodanese-like domains and thiosulfate sulfurtransferase activity, and some members are localized to the chloroplast.
