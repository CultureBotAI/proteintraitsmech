label: "PROTEIN PAM68, CHLOROPLASTIC"
definition: >-
  This entry includes chloroplastic protein PAM68 and some uncharacterised proteins from Cyanobacteria (blue-green algae). PAM68 is involved in early steps in photosystem II (PSII) biogenesis and in maturation and stability of newly synthesized psbA protein.
