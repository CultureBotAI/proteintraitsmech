identifier: PANTHER:PTHR30081
label: "PROTEIN-EXPORT MEMBRANE PROTEIN SEC"
definition: >-
  This entry represents archaeal and bacterial SecD and SecF protein export membrane proteins and their archaeal homologues. It is found in association with Pfam:PF07549 SecD and SecF proteins are part of the multimeric protein export complex comprising SecA, D, E, F, G, Y, and YajC. SecD and SecF are required to maintain a proton motive force. Secretion across the inner membrane in some Gram-negative bacteria occurs via the preprotein translocase pathway. Proteins are produced in the cytoplasm as precursors, and require a chaperone subunit to direct them to the translocase component. From there, the mature proteins are either targeted to the outer membrane, or remain as periplasmic proteins. The translocase protein subunits are encoded on the bacterial chromosome.
