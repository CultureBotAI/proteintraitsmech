identifier: PANTHER:PTHR45832
label: "SERINE/THREONINE-PROTEIN KINASE SAMKA-RELATED-RELATED"
definition: >-
  This entry represents human Serine/threonine-protein kinase PAK 3 and similar proteins predominantly found in animals, fungi and actinomycetes. This family also includes a number of predicted serine/threonine and tyrosine kinases, which are key regulators of cell signalling pathways. Members are involved in various cellular processes such as growth, proliferation, differentiation, and apoptosis. They share a conserved kinase domain (InterPro:IPR000719), although some are predicted to be catalytically inactive, suggesting a possible regulatory role. The active kinases transfer phosphate groups from ATP to specific serine, threonine, or tyrosine residues on target proteins, modulating their activity. The family encompasses proteins with diverse functions and regulatory mechanisms, reflecting the complexity of cellular signalling networks.
