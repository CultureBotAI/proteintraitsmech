identifier: PANTHER:PTHR18871
label: "CENTROSOMAL PROTEIN OF 112 KDA"
definition: >-
  This family of proteins includes Centrosomal protein of 112 kDa which is thought to be involved in the organisation and function of the centrosome, a cellular structure critical for the organisation of microtubules and the segregation of chromosomes during cell division. Members of this family are known to play a role in the stabilization of microtubules as well as in the maintenance of centrosome cohesion and positioning. They may also be implicated in the regulation of cell cycle progression, particularly during the G2/M transition. Mutations in these proteins have been associated with various types of cancer, underscoring their importance in maintaining genomic stability and proper cell division. In neurons, it localises to the cytoplasm of dendrites and is also enriched in the nucleus where it interacts with the RNA polymerase III transcriptional repressor Maf1 to regulate gamma-aminobutyric acid A receptor surface expression. In addition, the protein has been identified as a component of the human centrosome.
definition_source: "InterPro:IPR055310 abstract (PANTHER PTHR18871 is a member signature)"
