  - kind: GENERAL
    text: >-
      The Mitochondrial Inner Membrane Protease (IMP) Subunit 1 family comprises enzymes that play a crucial role in the maturation of mitochondrial proteins. Members of this family are responsible for catalyzing the removal of transit peptides from precursor proteins that are targeted from the mitochondrial matrix, across the inner membrane, into the inter-membrane space. This proteolytic process is essential for the proper functioning of the mitochondrial protein import machinery. Specific substrates for these proteases include nuclear-encoded proteins such as DIABLO, CYB2, and GUT2, as well as mitochondrially encoded proteins like COX2. The IMP1 subfamily belongs to the broader peptidase S26 family and includes both catalytic and non-catalytic components that may have distinct substrate specificities, ensuring a wide range of mitochondrial proteins are correctly processed and matured.
    source: "InterPro:IPR052064 abstract (LLM-generated, not curator-reviewed)"
