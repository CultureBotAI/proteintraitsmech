  - kind: GENERAL
    text: >-
      This family of proteins includes NmrA-type oxidoreductases involved in various redox reactions. Members of this family are implicated in the reduction of quinones and may have roles in redox sensing and regulation of growth. Additionally, some proteins in this family participate in complex biosynthetic pathways, such as the production of alkaloidal terpenoids. These processes involve multiple enzymatic steps, including cyclization of farnesyl pyrophosphate, oxidative conversions, decarboxylations, and acylations to produce bioactive compounds. The family members exhibit a conserved domain that is characteristic of the NmrA-type oxidoreductase family, indicating a shared evolutionary origin and similar catalytic functions.
