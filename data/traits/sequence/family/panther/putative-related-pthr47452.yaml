  - kind: GENERAL
    text: >-
      This family of proteins is involved in the biosynthesis of type 2G receptor polysaccharides (RPS), which are critical components of the cell surface. Members of this family are believed to function as transferases, specifically as 1-3GalNAc alpha transferases, which are essential for the production of the host-like Gal beta 1-3GalNAc motif within the RPS. The activity of these enzymes is crucial for the proper assembly and expression of cell surface polysaccharides that may play a role in host-microbe interactions.
    source: "InterPro:IPR053362 abstract (LLM-generated, not curator-reviewed)"
