    text: >-
      This family of proteins is involved in the signaling pathways of T-cells. Members of this family are implicated in the transmission of signals that lead to the activation of specific transcription factors, such as c-Maf, which is associated with the differentiation of T-helper 2 (Th2) cells. The proteins may have distinct roles depending on the isoform, with some isoforms linking T-cell receptor-mediated signals to the activation of specific pathways critical for T-cell function and immune response.
