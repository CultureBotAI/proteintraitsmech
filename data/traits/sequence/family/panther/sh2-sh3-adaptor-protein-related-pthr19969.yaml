  - kind: GENERAL
    text: >-
      SH2-SH3 ADAPTOR PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19969. PANTHER protein class: scaffold/adaptor protein. Members are annotated with the molecular function receptor tyrosine kinase binding, signaling adaptor activity. Members participate in enzyme-linked receptor protein signaling pathway, cell migration. Members localise to cytoplasm.
