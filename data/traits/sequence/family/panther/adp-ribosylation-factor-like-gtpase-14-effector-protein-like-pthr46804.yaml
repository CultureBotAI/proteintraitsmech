  - kind: GENERAL
    text: >-
      This family of proteins includes members that are likely involved in intracellular signaling pathways. They are characterized by their association with the small GTPase ARL14, suggesting a role in modulating the activity of this GTPase. Proteins in this family may participate in the regulation of immune responses, as ARL14 has been implicated in the trafficking of MHC class II molecules to the cell surface in antigen-presenting cells. The exact molecular functions and biological processes these effector proteins-like are involved in remain to be fully elucidated, but they are thought to contribute to the fine-tuning of immune cell signaling and potentially other GTPase-related functions.
