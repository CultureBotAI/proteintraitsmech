  - kind: GENERAL
    text: >-
      CARBOHYDRATE SULFOTRANSFERASE 15 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15723. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function sulfotransferase activity. and participate in hexose biosynthetic process, carbohydrate biosynthetic process.
