    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins functions as sulfotransferases, catalyzing the transfer of sulfate groups from 3'-phosphoadenosine 5'-phosphosulfate (PAPS) to specific hydroxyl groups of chondroitin sulfate A. The main activity involves the formation of chondroitin sulfate E by sulfating the C-6 hydroxyl group of the GalNAc 4-sulfate residue. Members of this family also contribute to the generation of highly sulfated structures by transferring sulfate to unique non-reducing terminal sequences of chondroitin sulfate. These modifications are similar to those found in thrombomodulin chondroitin sulfate. Additionally, there is evidence suggesting a potential role in B-cell receptor-mediated activation, which is important for B-cell development and regulation, although this function is not conclusively demonstrated in vivo. The activity of these enzymes is known to be inhibited by specific sulfated carbohydrate compounds.
    source: "InterPro:IPR052654 abstract (LLM-generated, not curator-reviewed)"
