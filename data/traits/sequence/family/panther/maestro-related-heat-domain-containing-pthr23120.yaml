identifier: PANTHER:PTHR23120
label: "MAESTRO-RELATED HEAT DOMAIN-CONTAINING"
definition: >-
  This entry represents a group of maestro heat-like repeat-containing proteins, including protein Maestro and SPIF from animals, and SGR6 from Arabidopsis. They contain HEAT repeats motif or regions that are highly similar to HEAT repeats. Maestro (Male-specific Transcription in the developing Reproductive Organs (MRO)) is expressed in human granulosa cumulus cells and in testicular germ cells. SPIF may play a role in the process of sperm capacitation. SGR6 (SHOOT GRAVITROPISM6) is a membrane-associated protein involved in the formation and/or maintenance of invaginated vacuolar membrane structures in gravity-sensing cells.
definition_source: "InterPro:IPR045206 abstract (PANTHER PTHR23120 is a member signature)"
