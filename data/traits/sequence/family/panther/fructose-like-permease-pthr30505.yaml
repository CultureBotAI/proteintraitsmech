definitions:
  - kind: GENERAL
    text: >-
      FRUCTOSE-LIKE PERMEASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30505. Members are annotated with the molecular function phosphotransferase activity, alcohol group as acceptor, carbohydrate transmembrane transporter activity, active transmembrane transporter activity. Members participate in carbohydrate transmembrane transport, import across plasma membrane. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS), which is a key carbohydrate active transport system in bacteria. The family includes components that catalyze the phosphorylation of sugar substrates during their translocation across the cell membrane. Specific members of the family are responsible for the transport and phosphorylation of fructose, mannose, and 2-O-alpha-mannosyl-D-glycerate. The system comprises several domains: EIIC forms the translocation channel and binds the substrate; EIIB is phosphorylated on a cysteinyl residue and transfers the phosphoryl group to the sugar; EIIA is phosphorylated on a histidyl residue and transfers the phosphoryl group to EIIB. Some members have a duplicated EIIB domain (EIIB') that facilitates phosphoryl transfer and high-affinity recognition of the diphosphoryl transfer protein (DTP).
    source: "InterPro:IPR050864 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
