identifier: PANTHER:PTHR14189
label: "PROTEIN PHOSPHATASE METHYLESTERASE-1 RELATED"
definition: >-
  This group represents eukaryotic protein phosphatase methylesterase 1. It demethylates proteins that have been reversibly carboxymethylated. Carboxymethylation is a highly conserved means of regulation in eukaryotic cells.
