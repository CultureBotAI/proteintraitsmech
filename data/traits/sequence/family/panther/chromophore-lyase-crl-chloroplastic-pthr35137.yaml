identifier: PANTHER:PTHR35137
label: "CHROMOPHORE LYASE CRL, CHLOROPLASTIC"
definition: >-
  This entry represents the CpcT/CpeT biliprotein lyase, which has been shown to covalently attach chromophores to cystiene residue(s) of phycobiliproteins. These proteins contain a conserved motif PYR in the amino terminal half of the protein that may be functionally important. In the chromatically adapting cyanobacterium Fremyella diplosiphon, the proteins have been shown to be induced by green light, as part of the cpeCDESTR operon.
