  - kind: GENERAL
    text: >-
      LIPOPROTEIN-RELEASING SYSTEM TRANSMEMBRANE PROTEIN LOLE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30489. and participate in cellular macromolecule localization, protein localization to membrane. and localise to membrane protein complex, cell periphery, cellular anatomical entity.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in an ATP-dependent transport system that facilitates the release of lipoproteins from the inner membrane, targeting them to the outer membrane in bacteria. The release mechanism is contingent on a specific sorting signal, which is the absence of an aspartic acid residue at the second position of the mature lipoprotein. These proteins are integral components of the membrane and are part of a larger complex known as the LolCDE system, which is essential for the proper localization of lipoproteins, playing a critical role in bacterial membrane organization and function.
    source: "InterPro:IPR051447 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
