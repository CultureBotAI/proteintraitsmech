identifier: PANTHER:PTHR43219
label: "CRISPR-ASSOCIATED ENDONUCLEASE CAS1"
definition: >-
  This entry describes a Cas1 subgroup that includes Cas1 proteins of the related HMARI and TNEAP subtypes of CRISPR/Cas system. The CRISPR-Cas system is a prokaryotic defence mechanism against foreign genetic elements. The key elements of this defence system are the Cas proteins and the CRISPR RNA.
