  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that are involved in various cellular processes, including the regulation of cell proliferation and apoptosis. They play a role in mediating ubiquitination and subsequent proteasomal degradation of specific target proteins. Some members are involved in the negative regulation of NOD2 signaling pathways by targeting RIPK2 for degradation. Others are implicated in the endoplasmic reticulum-associated degradation (ERAD) pathway, such as the ubiquitination of CANX. Additionally, certain family members are associated with the regulation of ER stress responses, including the activation of JNK signaling and the splicing of XBP1 mRNA. The family also includes proteins that may function in protein trafficking and localization, as well as in the sorting of vacuolar proteins.
    source: "InterPro:IPR051826 abstract (LLM-generated, not curator-reviewed)"
