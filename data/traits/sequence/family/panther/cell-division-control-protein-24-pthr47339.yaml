identifier: PANTHER:PTHR47339
label: "CELL DIVISION CONTROL PROTEIN 24"
definition: >-
  This family of proteins includes guanine nucleotide exchange factors (GEFs) that are involved in the regulation of small GTPases, such as CDC42. Members of this family play a crucial role in cell signaling related to morphogenesis, mating, and cell division. They facilitate the exchange of GDP for GTP on CDC42, thereby activating this GTPase to influence cytoskeletal organization and cell polarity. These proteins are also implicated in processes such as septation and the elongation of conjugation tubes, as well as the selection and organization of budding sites in yeast cells.
