identifier: PANTHER:PTHR11418
label: GLUCAGON
definition: >-
  A number of polypeptidic hormones, mainly expressed in the intestine or the pancreas, belong to a group of structurally related peptides. Once such hormone, glucagon is widely distributed and produced in the alpha-cells of pancreatic islets. It affects glucose metabolism in the liver by inhibiting glycogen synthesis, stimulating glycogenolysis and enhancing gluconeogenesis. It also increases mobilisation of glucose, free fatty acids and ketone bodies, which are metabolites produced in excess in diabetes mellitus. Glucagon is produced, like other peptide hormones, as part of a larger precursor (preproglucagon), which is cleaved to produce glucagon, glucagon-like protein I (GLP-1) and glucagon-like protein II (GLP-2). GLP-1 and GLP-2 are key neuroendocrine signals for the gut-brain axis to control food intake and glucose homeostasis. The structure of glucagon itself is fully conserved in all known mammalian species.
definition_source: "InterPro:IPR015550 abstract (PANTHER PTHR11418 is a member signature)"
