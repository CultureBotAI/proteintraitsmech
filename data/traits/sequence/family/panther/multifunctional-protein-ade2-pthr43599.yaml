identifier: PANTHER:PTHR43599
label: "MULTIFUNCTIONAL PROTEIN ADE2"
definition: >-
  MULTIFUNCTIONAL PROTEIN ADE2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43599. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, ligase activity. Subfamilies localise to intracellular anatomical structure, cytoplasm, cytosol.
