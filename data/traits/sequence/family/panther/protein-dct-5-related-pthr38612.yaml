identifier: PANTHER:PTHR38612
label: "PROTEIN DCT-5-RELATED"
definition: >-
  This family of proteins is mostly found in Chromadorea. Proteins in this family include dct-5. Dct-5 is a target of DAF-16, a forkhead transcription factor, which is a key regulator of longevity, metabolism and dauer diapause in Caenorhabditis elegans.
