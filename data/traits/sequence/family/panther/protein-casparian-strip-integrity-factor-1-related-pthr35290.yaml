identifier: PANTHER:PTHR35290
label: "PROTEIN CASPARIAN STRIP INTEGRITY FACTOR 1-RELATED"
definition: >-
  This entry represents a group of plant proteins, including Protein Casparian strip integrity factor 1/2 (CIF1/2) from Arabidopsis. They are required for contiguous Casparian strip formation in Arabidopsis roots.
