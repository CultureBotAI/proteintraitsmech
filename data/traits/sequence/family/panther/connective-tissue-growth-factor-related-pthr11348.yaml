definitions:
  - kind: GENERAL
    text: >-
      CONNECTIVE TISSUE GROWTH FACTOR-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11348. PANTHER protein class: growth factor. Members are annotated with the molecular function integrin binding. Members participate in positive regulation of cell differentiation, cell adhesion. Members localise to extracellular region.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The CCN family is involved in a wide range of cellular processes including proliferation, adhesion, migration, differentiation, survival, and wound healing. Members of the family act as mitoattractants, mediate cell adhesion through heparin and divalent cations, and enhance growth factor-induced DNA synthesis. They play roles in angiogenesis, matrix remodeling, and bone turnover modulation. CCN proteins interact with integrins and other membrane receptors like NOTCH1, influencing stem cell function, myogenic differentiation, and inflammatory responses. They are implicated in tissue regeneration, endothelial cell function, and metabolic regulation in pancreatic beta-cells.
    source: "InterPro:IPR050941 abstract (LLM-generated, not curator-reviewed)"
