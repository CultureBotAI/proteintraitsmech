identifier: PANTHER:PTHR42947
label: "COB--COM HETERODISULFIDE REDUCTASE SUBUNIT B 1"
definition: >-
  The HdrB/HdrD family is involved in the reversible reduction of CoM-S-S-CoB to the thiol-coenzymes H-S-CoM (coenzyme M) and H-S-CoB (coenzyme B), playing a crucial role in methanogenesis. The family includes subunits of heterodisulfide reductase complexes that transfer electrons from various donors such as hydrogen, formate, or reduced ferredoxin to the disulfide bond of CoM-S-S-CoB. Some members are also capable of electron bifurcation, directing electron pairs from reduced coenzyme F420 towards the simultaneous reduction of ferredoxin and CoB-CoM heterodisulfide. This process is essential for energy conservation in methanogenic archaea and may also occur during anaerobic methane oxidation in the presence of Fe(III).
