  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that perform radical-mediated chemical reactions, typically involving the cleavage or formation of carbon-based bonds in various substrates. Members of this family are characterized by the presence of a glycyl radical that is essential for their catalytic activity. The enzymes are involved in diverse metabolic processes, such as the anaerobic degradation of aromatic compounds, fermentation of amino acids, and utilization of organosulfur compounds. They catalyze reactions like the addition of fumarate to toluene, decarboxylation of hydroxyphenylacetates, cleavage of C-S bonds in sulfonates, and dehydration of hydroxyproline. These activities contribute to the catabolism of complex molecules in various environmental and physiological contexts, often providing growth advantages or metabolic benefits to the organisms that harbor them. The enzymes are sensitive to oxygen, which can rapidly inactivate them, highlighting their adaptation to anaerobic conditions.
