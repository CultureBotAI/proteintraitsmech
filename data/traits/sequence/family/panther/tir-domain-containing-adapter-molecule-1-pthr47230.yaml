identifier: PANTHER:PTHR47230
label: "TIR DOMAIN-CONTAINING ADAPTER MOLECULE 1"
definition: >-
  This family includes TIR domain-containing adapter molecule 1 and 2 (TICAM1/2). TICAM1 is involved in innate immunity against invading pathogens. It is an adapter used by TLR3 and TLR4 (through TICAM2) to mediate NF-kappa-B and interferon-regulatory factor (IRF) activation, and to induce apoptosis. TICAM2 functions as sorting adapter in different signalling pathways to facilitate downstream signaling leading to type I interferon induction. It physically bridges TLR4 and TICAM1 and functionally transmits signal to TICAM1 in early endosomes after endocytosis of TLR4. In TLR2 signalling, physically bridges TLR2 and MYD88 and is required for the TLR2-dependent movement of MYD88 to endosomes following ligand engagement. TICAM2 forms a complex with RAB11FIP2 that is recruited to the phagosomes to promote the activation of the actin-regulatory GTPases RAC1 and CDC42 and subsequent phagocytosis of Gram-negative bacteria.
definition_source: "InterPro:IPR046946 abstract (PANTHER PTHR47230 is a member signature)"
