identifier: PANTHER:PTHR46258
label: "LONGIN DOMAIN-CONTAINING PROTEIN"
definition: >-
  Sec22a is a multi-pass membrane protein that may be involved in vesicle transport between the ER and the Golgi complex. Sec22c is an endoplasmic reticulum (ER)-localised transmembrane protein involved in regulation of the vesicle transport between the ER and the Golgi. This entry includes Sec22a and Sec22c. They belong to the synaptobrevin family.
