identifier: PANTHER:PTHR47032
label: "UDP-D-XYLOSE:L-FUCOSE ALPHA-1,3-D-XYLOSYLTRANSFERASE-RELATED"
definition: >-
  This family of proteins includes enzymes that catalyze the transfer of D-xylose from UDP-alpha-D-xylose to L-fucose, a reaction likely involved in the biosynthesis of rhamnogalacturonan II (RG-II). RG-II is a complex pectic polysaccharide found in the primary cell wall and is crucial for cell wall integrity, particularly in rapidly growing plant tissues. These proteins share a conserved DXD motif, which is important for their enzymatic activity.
