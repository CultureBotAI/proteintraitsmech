identifier: PANTHER:PTHR46340
label: "UBX DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  UBX DOMAIN-CONTAINING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46340. Members are annotated with the molecular function protein binding, polyubiquitin modification-dependent protein binding. and participate in negative regulation of proteasomal protein catabolic process, negative regulation of proteasomal ubiquitin-dependent protein catabolic process, negative regulation of protein modification process. and localise to cytoplasm, membrane-bounded organelle, nucleus.
