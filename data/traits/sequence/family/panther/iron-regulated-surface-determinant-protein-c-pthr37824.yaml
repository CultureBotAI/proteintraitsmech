  - kind: GENERAL
    text: >-
      The IsdA family proteins are cell wall-anchored surface receptors involved in iron acquisition from host heme sources, crucial for the growth of bacteria like Staphylococcus aureus. They extract heme from oxidized methemoglobin and facilitate its transfer to other proteins in the heme uptake system. Additionally, IsdA family proteins play roles in immune evasion by protecting against host defense mechanisms such as bactericidal proteases, skin fatty acids, beta-defensins, and cathelicidin. They also bind fibronectin and fibrinogen, promoting bacterial clumping and colonization. The NEAT domain within these proteins is key for heme and fibrinogen binding, while also inhibiting apolactoferrin activity and conferring resistance to lactoferricin.
    source: "InterPro:IPR050436 abstract (LLM-generated, not curator-reviewed)"
