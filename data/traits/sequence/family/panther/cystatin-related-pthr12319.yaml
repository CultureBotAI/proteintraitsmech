  - kind: GENERAL
    text: >-
      This family of proteins includes inhibitors of cysteine proteinases. Members of this family are known to selectively inhibit the activity of specific proteinases, thereby playing a role in protecting tissues from proteolytic damage during various stages of development. The proteins within this family are characterized by their ability to regulate the activity of cysteine proteinases, which are enzymes involved in protein degradation and processing, as well as in various physiological processes including immune responses.
