  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the bacterial meta-cleavage pathway, which is a part of the degradation process for phenylpropionic acid. Members of this family are responsible for catalyzing the cleavage of the C5-C6 bond in specific dienol ring fission products. They belong to the AB hydrolase superfamily and share a common enzymatic function related to the breakdown of complex organic molecules, playing a role in bacterial metabolism and the recycling of organic compounds.
