  - kind: GENERAL
    text: >-
      This family of proteins includes SET domain-containing proteins that are part of the class V-like SAM-binding methyltransferase superfamily. These proteins are characterized by the presence of a SET domain, which is associated with lysine methyltransferase activity. Typically, members of this family are involved in the methylation of lysine residues on histone proteins, a post-translational modification that plays a critical role in the regulation of gene expression by affecting chromatin structure and dynamics. The methyltransferase activity of these proteins often requires the binding of S-adenosylmethionine (SAM) as a methyl donor. Through their enzymatic activity, these proteins contribute to the establishment of specific epigenetic marks, which can lead to either the activation or repression of gene transcription depending on the context and specific lysine residues that are methylated.
    source: "InterPro:IPR053010 abstract (LLM-generated, not curator-reviewed)"
