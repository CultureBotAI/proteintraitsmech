  - kind: GENERAL
    text: >-
      This family of proteins functions as endocytic receptors involved in the uptake of various substances including lipoproteins, vitamins, and iron, playing a critical role in their metabolism. They form a complex structure with a long stem and a globular crown, which is essential for their interaction with a range of ligands such as albumin, transferrin, and high-density lipoproteins. Calcium is required for ligand binding. These proteins are also implicated in the internalization of the cobalamin-intrinsic factor complex, contributing to vitamin B12 absorption. They are expressed in absorptive epithelia like the intestine and renal proximal tubules, and are important for the transport of nutrients and other molecules across these tissues. Additionally, they may have a role in embryonic development by mediating the uptake of lipids and proteins at the maternal-fetal interface.
    source: "InterPro:IPR053119 abstract (LLM-generated, not curator-reviewed)"
