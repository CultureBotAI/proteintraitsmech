  - kind: GENERAL
    text: >-
      ACID HYDRATASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30143. PANTHER protein class: lyase, hydratase. Members are annotated with the molecular function lyase activity, hydro-lyase activity, catalytic activity. and localise to cytoplasm, cellular anatomical entity, intracellular anatomical structure.
