identifier: PANTHER:PTHR30143
label: "ACID HYDRATASE"
definition: >-
  The hydratase/decarboxylase family, specifically the MhpD subfamily, consists of enzymes that play a crucial role in various bacterial catabolic pathways. Members of this family are responsible for the hydration of unsaturated keto acids, converting them into their corresponding hydroxy-keto acids. For instance, they catalyze the transformation of 2-hydroxypentadienoic acid to 4-hydroxy-2-ketopentanoic acid, a reaction involved in the breakdown of aromatic compounds. Some family members are also implicated in the degradation of testosterone and 2-aminophenol, indicating a broader metabolic significance. The enzymes exhibit a commonality in their reaction mechanism, which involves the addition of water across a double bond of an unsaturated substrate, demonstrating their functional coherence within the family.
