  - kind: GENERAL
    text: >-
      This family of proteins includes N-methyltransferases involved in the biosynthesis of complex alkaloidal terpenoids. They catalyze the methylation of L-lysine to produce N,N-dimethyl-L-lysine, a precursor for the synthesis of dimethylcadaverine. This reaction is a key step in the formation of flavunoidine, a compound with a tetracyclic terpenoid core. Members of this family are typically part of gene clusters that coordinate the synthesis of such specialized metabolites, which often have significant biological activity. The enzymes from this family share a common structural fold and utilize S-adenosylmethionine (SAM) as the methyl donor, characteristic of the class V-like SAM-binding methyltransferase superfamily.
    source: "InterPro:IPR053201 abstract (LLM-generated, not curator-reviewed)"
