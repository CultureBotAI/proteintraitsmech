identifier: PANTHER:PTHR44414
label: "PROTEIN NEDD1"
definition: >-
  This family of proteins is essential for the progression of mitosis, a critical phase of the cell cycle. Members of this family facilitate the nucleation of microtubules from the spindle, which is a key step in the formation of the mitotic spindle required for chromosome segregation. Additionally, these proteins may have a significant role in the embryonic development and differentiation of the central nervous system, suggesting a broader functional spectrum beyond mitotic spindle formation.
