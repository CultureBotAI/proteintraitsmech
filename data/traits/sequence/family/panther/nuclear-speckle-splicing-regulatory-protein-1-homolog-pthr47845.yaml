  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of pre-mRNA splicing within the cell nucleus. Members of this family are typically localized to nuclear speckles, which are dynamic structures implicated in the storage and modification of splicing factors. Proteins in this family may play a role in the assembly and disassembly of spliceosomes, the complex molecular machines that remove introns from pre-mRNA transcripts. Through their involvement in splicing regulation, these proteins contribute to the control of gene expression and the generation of protein diversity through alternative splicing.
