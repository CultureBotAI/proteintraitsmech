identifier: PANTHER:PTHR17045
label: "MELANOCYTE SPECIFIC GENE RELATED  CITED"
definition: >-
  CITED, CBP/p300-interacting transactivator with ED-rich tail, is characterised by a conserved 32-amino acid sequence at the C terminus. CITED protein does not bind DNA directly and is thought to function as a transcriptional co-activator.
