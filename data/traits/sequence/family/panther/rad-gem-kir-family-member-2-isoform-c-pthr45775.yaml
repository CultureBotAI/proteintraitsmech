identifier: PANTHER:PTHR45775
label: "RAD, GEM/KIR FAMILY MEMBER 2, ISOFORM C"
definition: >-
  This family of proteins includes GTP-binding members that are implicated in various cellular processes, including signal transduction, regulation of voltage-dependent L-type Ca(2+) currents, and cardiac function. Some proteins in this family have been shown to interact with the plasma membrane and may participate in receptor-mediated signaling pathways. They exhibit guanine nucleotide-binding activity and are characterized by a low intrinsic GTPase activity or undetectable GTPase activity. Additionally, these proteins may play roles in the regulation of heart rate, contractile force, and cardiac hypertrophy, as well as in the trafficking of calcium channel subunits to the cell membrane. They may also be involved in actin cytoskeletal reorganization and angiogenesis, suggesting a broad functional spectrum within cellular and physiological contexts.
