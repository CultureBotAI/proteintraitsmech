identifier: PANTHER:PTHR15010
label: "ACYLOXYACYL HYDROLASE"
definition: >-
  Acyloxyacyl hydrolase (AOAH) is a a host enzyme that removes the secondary (acyloxyacyl-linked) fatty acids from LPS (a potent bacterial endotoxin), rendering it immunologically inert. This activity is important for the recovery from immune tolerance that follows Gram-negative infection.
