identifier: PANTHER:PTHR47011
label: "CD226 ANTIGEN"
definition: >-
  CD226, also known as DNAM-1, is a nectin receptor that contains two extracellular Ig-like domains (CD226-D1 and CD226-D2), and is widely expressed in monocytes, platelets, T cells, and most of the resting NK cells. The interactions between CD226 and its nectin/Necl family ligands, CD155 (also known as Necl-5) and CD112 (nectin-2), play important roles in modulating NK cell adhesion and cytotoxicity, facilitating immunological synapse formation and promoting cytokine secretion during inflammation.
