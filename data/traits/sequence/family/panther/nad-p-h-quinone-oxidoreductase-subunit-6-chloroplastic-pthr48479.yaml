identifier: PANTHER:PTHR48479
label: "NAD(P)H-QUINONE OXIDOREDUCTASE SUBUNIT 6, CHLOROPLASTIC"
definition: >-
  NAD(P)H-quinone oxidoreductase subunit 6 is involved in the photosynthetic electron transport chain within chloroplasts. It is responsible for shuttling electrons from NAD(P)H to plastoquinone via FMN and iron-sulfur (Fe-S) centers. The process is coupled with proton translocation across the membrane, which contributes to the creation of a proton gradient. This gradient is then utilised for ATP synthesis, thereby conserving the energy from the redox reaction. NAD(P)H-quinone oxidoreductase subunit 6's role is not limited to photosynthesis, as it may also participate in a chloroplast respiratory chain, indicating a broader involvement in plant energy metabolism.
definition_source: "InterPro:IPR050290 abstract (PANTHER PTHR48479 is a member signature)"
