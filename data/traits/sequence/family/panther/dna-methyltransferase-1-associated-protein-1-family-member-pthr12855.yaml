identifier: PANTHER:PTHR12855
label: "DNA METHYLTRANSFERASE 1-ASSOCIATED PROTEIN 1 FAMILY MEMBER"
definition: >-
  This entry consists of the SWR1-complex protein 4 (Swc4) from yeast, also known as EAF2, and its mammalian homologue DNA methyltransferase 1-associated protein 1 (Dmap1). They are components of the NuA4 histone acetyltransferase (HAT) complex, which is highly conserved in eukaryotes. NuA4 acetylates the nucleosomal histones H4 and H2A and plays primary roles in transcription, DNA repair, and cell cycle control. The subunits of the NuA4 complex are shared by the ATP-dependent chromatin-remodeling SWR1 complex in yeast and its human orthologue, Snf 2-related CREB-binding protein (CBP) activator protein (SRCAP) complex. The mammalian NuA4 complex includes the SRCAP complex, and thus combines the functions of the yeast NuA4 and Swr1 complexes. The SWR1/SRCAP complex mediates the ATP-dependent exchange of histone H2A for the H2A variant HZT1 leading to transcriptional regulation of selected genes by chromatin remodeling.
