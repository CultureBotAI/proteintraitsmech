  - kind: GENERAL
    text: >-
      This family of proteins includes various aldehyde dehydrogenases with diverse functions. Members are involved in metabolic pathways such as the degradation of D-sulfoquinovose, generating sulfolactate, and the utilization of taurine as a nitrogen source. Some enzymes in this family are responsible for the NAD(P)-dependent oxidation of glyceraldehyde-3-phosphate to 3-phosphoglycerate, playing a role in generating NADPH for biosynthetic reactions. Others are implicated in F420 biosynthesis by oxidizing lactaldehyde to lactate. Additionally, certain members may participate in phosphonate degradation. The enzymes exhibit substrate specificity and are regulated by various metabolites, indicating their adaptation to specific cellular roles.
    source: "InterPro:IPR051020 abstract (LLM-generated, not curator-reviewed)"
