  - kind: GENERAL
    text: >-
      This family of proteins is involved in maintaining epithelial barrier function through the recruitment of MARVELD2/tricellulin to tricellular tight junctions, which is crucial for normal hearing and the survival of auditory neurosensory hair cells. Members of this family may also be implicated in lipid homeostasis, insulin secretion, and the regulation of alternative pre-mRNA splicing via binding to specific splicing factors. Additionally, they can function as B7-like molecules with T-cell inhibitory activity and may play a role in viral infections by modulating host-virus interactions. They are also associated with the clearance of triglyceride-rich lipoproteins from the blood, binding lipoproteins in the presence of free fatty acids for cellular uptake.
    source: "InterPro:IPR051874 abstract (LLM-generated, not curator-reviewed)"
