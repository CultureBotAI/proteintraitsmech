identifier: PANTHER:PTHR23503
label: "SOLUTE CARRIER FAMILY 2"
definition: >-
  This entry includes Class I and II glucose transporters. Facilitative sugar transport is mediated by members of the GLUT transporter family, which form an aqueous pore across the membrane through which sugars can move in a passive (i.e., energy-independent) manner. The GLUT family of glycosylated transmembrane proteins are predicted to span the membrane 12 times with both amino- and carboxyl-termini located in the cytosol. On the basis of sequence homology and structural similarity, three subclasses of sugar transporters have been defined: Class I (GLUTs 1-4) are glucose transporters; Class II (GLUTs 5, 7, 9 and 11) are fructose transporters; and Class III (GLUTs 6, 8, 10, 12 and HMIT1) are structurally atypical members of the GLUT family, which are poorly defined at present, indeed GLUT6 may only be a pseudo-gene.
definition_source: "InterPro:IPR045263 abstract (PANTHER PTHR23503 is a member signature)"
