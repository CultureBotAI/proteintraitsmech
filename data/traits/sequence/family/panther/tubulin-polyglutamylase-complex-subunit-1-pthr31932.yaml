identifier: PANTHER:PTHR31932
label: "TUBULIN POLYGLUTAMYLASE COMPLEX SUBUNIT 1"
definition: >-
  Tubulin polyglutamylase complex subunit 1-like TPGS1 (also known as PGs1) is part of the tubulin polyglutamylase complex, which plays a role in post-translational addition of glutamate residues to C-terminal tubulin tails. It is required for sperm axoneme assembly and normal animal behaviour.
