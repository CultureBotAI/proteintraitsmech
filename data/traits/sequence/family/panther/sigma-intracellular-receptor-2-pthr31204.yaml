  - kind: GENERAL
    text: >-
      This family of proteins includes intracellular receptors that are known to bind various drugs and are highly expressed in proliferating cells. They are thought to play a significant role in regulating cell survival, morphology, and differentiation. Members of this family may also act as regulators of cellular cholesterol homeostasis and potentially function as sterol isomerases. Additionally, they may influence the activity of certain cytochrome P450 enzymes, which are involved in drug metabolism and synthesis of cholesterol, steroids, and other lipids.
