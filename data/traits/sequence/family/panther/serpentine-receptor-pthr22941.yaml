  - kind: GENERAL
    text: >-
      This family of proteins is characterized by its role in the nematode sensory system. Members of this family are typically G protein-coupled receptors (GPCRs) that are involved in the detection of environmental cues and the regulation of behaviors such as chemotaxis, thermotaxis, and mating. These receptors are distinguished by their serpentine topology, with seven transmembrane domains that facilitate signal transduction across the cell membrane. The specific functions of individual members may vary, but they generally contribute to the sophisticated network of signal perception and response in nematodes.
