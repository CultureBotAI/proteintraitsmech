  - kind: GENERAL
    text: >-
      The protein family comprises transcription factors involved in the regulation of diverse biosynthetic gene clusters in fungi. Members of this family regulate the synthesis of secondary metabolites, including mycotoxins like patulin and oosporein, pigments such as pulcherrimin, and compounds with antimicrobial properties like sorbicillinoids and terreic acid. They also participate in the detoxification of plant-produced benzoxazolinones. These transcription factors typically bind to specific DNA motifs within the promoters of their target gene clusters, activating or repressing transcription in response to various environmental cues. Some members are also involved in yeast cell adherence, filamentous growth, biofilm formation, and drug resistance, indicating a role in fungal adaptation and virulence.
    source: "InterPro:IPR051127 abstract (LLM-generated, not curator-reviewed)"
