identifier: PANTHER:PTHR45940
label: "WUSCHEL-RELATED HOMEOBOX 1-RELATED"
definition: >-
  This entry includes WUSCHEL and homeodomain WUSCHEL-RELATED (WOX) proteins from plants. Proteins in this entry have been classified as a WOX clade that contains the WUS, WOX1, WOX2, WOX3, WOX5, WOX6 and WOX7. WUSCHEL is a transcription factor that plays a central role during early embryogenesis, oogenesis and flowering. WOXs are transcription factors that regulate meristem development in embryos, as well as vegetative and reproductive organs.
