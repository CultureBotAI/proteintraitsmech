identifier: PANTHER:PTHR10223
label: "26S PROTEASOME NON-ATPASE REGULATORY SUBUNIT 4"
definition: >-
  The 26S proteasome is composed of a core protease, known as the 20S proteasome, capped at one or both ends by the 19S regulatory complex (RC). The RC is composed of at least 18 different subunits in two subcomplexes, the base and the lid, which form the portions proximal and distal to the 20S proteolytic core, respectively. This family consists of the RC subunit S5A or non-ATPase regulatory subunit 4 (PSMD4, also known as Rpn10). Rpn10 binds and presumably selects ubiquitin-conjugates for destruction.
definition_source: "InterPro:IPR027040 abstract (PANTHER PTHR10223 is a member signature)"
