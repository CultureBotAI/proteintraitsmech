identifier: PANTHER:PTHR28158
label: "37S RIBOSOMAL PROTEIN S35, MITOCHONDRIAL"
definition: >-
  This entry represents the small ribosomal subunit protein mS45, also known as Ribosomal protein S35, which localises to the mitochondria in live cells and co-fractionates with purified mitochondrial ribosomes. This group of proteins have a function in the control of cell respiration by acting on the mitochondrial protein synthesis machinery and a role in mitochondrial integrity. Observations also indicate that in Schizosaccharomyces pombe (Fission yeast), alterations of mitochondrial function are linked to changes in cell cycle and cell morphology control mechanisms.
