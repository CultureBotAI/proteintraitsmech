identifier: PANTHER:PTHR45844
label: "TRANSCRIPTION FACTOR BHLH30"
definition: >-
  This entry represents a group of plant bHLH transcription factors, including AIG1 and related proteins from Arabidopsis. AIG1, also known as TARGET OF MOOPTEROS 5 or BHLH32, is required for MP (MONOPTEROS, an auxin-dependent transcription factor)-dependent root initiation.
