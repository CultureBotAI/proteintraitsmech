identifier: PANTHER:PTHR28255
label: YBR137W-like
definition: >-
  This entry represents a family of proteins from bacteria and some fungal species, including YBR137W from Saccharomyces cerevisiae (UniProtKB:P38276). This protein may play a role in the regulation of tail-anchored (TA) protein targeting. It shows an antiparallel β-sheet made of four β-strands surrounded by seven α-helices.
