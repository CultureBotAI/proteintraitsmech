identifier: PANTHER:PTHR19364
label: "IMMUNITY-RELATED GTPASE FAMILY Q PROTEIN"
definition: >-
  IRG proteins (immunity-related GTPases) contain a Ras-like G domain and were first described as genes strongly induced by infection. Despite its phylogenetic relationship to the IRG proteins, IRGQ (FKSG27) is not a GTPase. Its function is not known.
