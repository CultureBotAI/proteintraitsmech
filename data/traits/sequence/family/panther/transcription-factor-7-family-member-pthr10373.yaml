identifier: PANTHER:PTHR10373
label: "TRANSCRIPTION FACTOR 7 FAMILY MEMBER"
definition: >-
  Members of this family of HMG box containing factors play an essential role in the Wnt/Wingless signalling cascade. They are known to associate with beta-catenin in the nucleus to mediate Wnt signaling. This family exist in vertebrates, Drosophila melanogaster and Caenorhabditis elegans, and includes transcription factor 7, transcription factor 7-like 1 and 2, lymphoid enhancer-binding factor 1 and proteins pangolin and pop-1.
