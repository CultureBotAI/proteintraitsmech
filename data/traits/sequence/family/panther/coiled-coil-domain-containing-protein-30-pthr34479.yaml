  - kind: GENERAL
    text: >-
      This family of proteins is characterized by the presence of a coiled-coil domain, which suggests a role in providing structural support and facilitating protein-protein interactions. Members of this family are similar to the prefoldin subunit beta, indicating a potential involvement in the stabilization of nascent polypeptide chains and the promotion of correct folding. Prefoldin is a molecular chaperone complex that captures and delivers unfolded proteins to the cytosolic chaperonin for facilitated folding.
