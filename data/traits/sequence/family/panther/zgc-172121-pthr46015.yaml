      ZGC:172121 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46015. Members are annotated with the molecular function S-adenosylmethionine-dependent methyltransferase activity. and participate in organic acid biosynthetic process, aspartate family amino acid biosynthetic process, sulfur compound metabolic process.
