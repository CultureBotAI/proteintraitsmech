  - kind: GENERAL
    text: >-
      ZGC:172121 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46015. Members are annotated with the molecular function S-adenosylmethionine-dependent methyltransferase activity. Members participate in aspartate family amino acid biosynthetic process, cellular modified amino acid metabolic process, sulfur compound metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Homocysteine S-methyltransferase family comprises enzymes that catalyze the transfer of a methyl group from S-methylmethionine (SMM) to various substrates, including homocysteine, adenosyl-L-homocysteine (AdoMet), and selenocysteine. These enzymes play a role in the SMM cycle in plants, which is involved in the regulation of AdoMet levels, a key methyl donor for numerous methylation reactions. Some family members show specificity for DL-homocysteine over DL-cysteine and do not possess selenocysteine methyltransferase activity, while others can methylate selenocysteine and are involved in selenium detoxification. Activity of these enzymes can be inhibited by L-methionine, indicating a regulatory mechanism for controlling enzyme function. The family is involved in essential metabolic pathways that contribute to amino acid processing and potentially to the detoxification of harmful compounds.
    source: "InterPro:IPR051486 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
