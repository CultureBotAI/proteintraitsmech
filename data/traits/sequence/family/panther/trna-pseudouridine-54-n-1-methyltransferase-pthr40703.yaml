identifier: PANTHER:PTHR40703
label: "TRNA (PSEUDOURIDINE(54)-N(1))-METHYLTRANSFERASE"
definition: >-
  Proteins in this entry belong to the TrmY family (under the methyltransferase superfamily). Archaeal TrmY specifically catalyses the N1-methylation of pseudouridine at position 54 (Psi54) in tRNAs.
