  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of the G-protein coupled receptor Fz/Smo superfamily. They are characterized by a seven-transmembrane domain architecture typical of GPCRs and are implicated in signal transduction processes. Specifically, they play a role in the Wnt/beta-catenin signaling pathway, which is crucial for various developmental processes, cell proliferation, and differentiation. Some family members contain a Lys-Thr-X-X-X-Trp motif that is known to interact with the PDZ domain of Disheveled (Dvl) family members, a key interaction in the activation of the Wnt signaling pathway.
    source: "InterPro:IPR050949 abstract (LLM-generated, not curator-reviewed)"
