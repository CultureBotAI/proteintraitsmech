identifier: PANTHER:PTHR15581
label: "CENTROMERE PROTEIN R"
definition: >-
  Centromere protein R (CENP-R, also known as NRIF3) is a transcription co-regulator that can have both co-activator and co-repressor functions. It is involved in the co-activation of nuclear receptors for retinoid X (RXRs) and thyroid hormone (TRs) in a ligand-dependent fashion. It is a probable component of a centromeric complex involved in assembly of kinetochore proteins, mitotic progression and chromosome segregation.
definition_source: "InterPro:IPR009601 abstract (PANTHER PTHR15581 is a member signature)"
