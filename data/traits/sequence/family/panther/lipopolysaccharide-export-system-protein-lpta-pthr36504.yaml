definitions:
  - kind: GENERAL
    text: >-
      LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36504. Members are annotated with the molecular function lipid transfer activity, lipid transporter activity. and participate in carbohydrate derivative transport, lipid transport. and localise to external encapsulating structure, cell outer membrane, outer membrane-bounded periplasmic space.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the assembly and transport of lipopolysaccharide (LPS) across the bacterial cell envelope. Members of this family are essential for the translocation of LPS from the inner membrane to the outer membrane. They are believed to form a structural bridge between the inner and outer membranes, interacting with other Lpt proteins such as LptC and LptD to facilitate the movement of LPS through the periplasmic space. This process is critical for maintaining cell envelope integrity, viability, and pathogenicity in various bacterial species. Some family members are known to bind LPS directly and adopt a beta-jellyroll structure, which is characteristic of Lpt proteins in E. coli.
    source: "InterPro:IPR052037 abstract (LLM-generated, not curator-reviewed)"
