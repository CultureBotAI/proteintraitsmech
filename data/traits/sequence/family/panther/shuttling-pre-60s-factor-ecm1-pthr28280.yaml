definitions:
  - kind: GENERAL
    text: >-
      SHUTTLING PRE-60S FACTOR ECM1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28280. Members participate in ribosomal subunit export from nucleus, ribosome biogenesis. Members localise to nucleolus, nuclear lumen, preribosome, large subunit precursor.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the nucleocytoplasmic transport process, specifically in the export of the 60S ribosomal subunit from the nucleus. Members of this family function as pre-ribosomal factors that are essential for the proper assembly and maturation of the 60S subunit, which is a critical component of the eukaryotic ribosome. The ribosome is responsible for protein synthesis, and the 60S subunit forms the larger part of the ribosome, where it joins with the 40S subunit to create the functional 80S ribosome during translation. The export of the 60S subunit from the nucleus to the cytoplasm is a key step in ribosome biogenesis, and proteins in this family play a crucial role in this process.
    source: "InterPro:IPR053278 abstract (LLM-generated, not curator-reviewed)"
