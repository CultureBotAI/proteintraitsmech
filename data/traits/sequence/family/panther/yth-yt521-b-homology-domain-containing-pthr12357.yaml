identifier: PANTHER:PTHR12357
label: "YTH  YT521-B HOMOLOGY  DOMAIN-CONTAINING"
definition: >-
  The YTH (YT521-B homology) domain has been suggested to be an evolutionarily conserved m6A-dependent RNA binding domain. Proteins containing this domain includes mammalian YTHD and YTDC proteins, Arabidopsis CPSF30 (At1g30460), and budding yeast Pho92. These proteins recognise and bind N6-methyladenosine (m6A)-containing mRNAs, and regulate their stability. YTHD acts as a regulator of mRNA stability by promoting degradation of m6A-containing mRNAs via interaction with the CCR4-NOT complex. The YTHDF paralogues (YTHDF1, YTHDF2 and YTHDF3) shares m6A-containing mRNAs targets and act redundantly to mediate mRNA degradation and cellular differentiation. In Saccharomyces cerevisiae, Pho92 is a post-transcriptional regulator that regulates Pho4 mRNA stability by binding to the 3'-UTR in a phosphate-dependent manner. Its YTH domain exhibits RNA-binding activity. Its orthologue from S. pombe, Mmi1, is an RNA-binding protein that recognises and binds N6-methyladenosine (m6A)-containing RNAs, a modification present at internal sites of mRNAs and some non-coding RNAs. It functions alone and as part of the erh1-mmi1 complex, to recruit the CCR4-NOT complex and the NURS complex to target RNAs.
definition_source: "InterPro:IPR045168 abstract (PANTHER PTHR12357 is a member signature)"
