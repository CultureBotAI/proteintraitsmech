  - kind: GENERAL
    text: >-
      COMPLEMENT FACTOR H-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45785. PANTHER protein class: complement component.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the regulation of the complement system, a critical component of the innate immune response. Members of the family include glycoproteins that inhibit complement activation on self cells by binding to specific markers, accelerating the decay of C3 convertase, and acting as cofactors for factor I to degrade C3b. Some family members also mediate cellular responses by interacting with receptors, aiding in pathogen phagocytosis and destruction. Additionally, certain proteins within the family are associated with lipid metabolism and may influence tissue-bound complement fragments, competing with physiological inhibitors. The family also includes a protein that aids in viral entry into host cells by participating in the dissolution of virion membranes.
    source: "InterPro:IPR051503 abstract (LLM-generated, not curator-reviewed)"
