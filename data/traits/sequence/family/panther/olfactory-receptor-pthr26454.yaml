identifier: PANTHER:PTHR26454
label: "OLFACTORY RECEPTOR"
definition: >-
  This family includes human olfactory receptor proteins from subfamily 6C and similar proteins such as 6X, 6J, 6T, 6V, as well as related proteins from other vertebrates. Olfactory receptors (ORs) play a central role in olfaction. ORs belong to the class A rhodopsin-like family of G protein-coupled receptors and constitute the largest multigene family in mammals of approximately 1,000 genes. More than 60% of human ORs are non-functional pseudogenes compared to only about 20% in mouse. Each OR can recognize structurally similar odorants, and a single odorant can be detected by several ORs.
definition_source: "InterPro:IPR047132 abstract (PANTHER PTHR26454 is a member signature)"
