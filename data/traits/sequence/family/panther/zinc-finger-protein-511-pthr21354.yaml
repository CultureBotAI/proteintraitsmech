identifier: PANTHER:PTHR21354
label: "ZINC FINGER PROTEIN 511"
definition: >-
  This entry includes the uncharacterised zinc finger protein 511 (ZNF511) which contains C2H2-type zinc fingers. The gene for a homologue from the fruit fly Drosophila melanogaster, known as protein lethal(2)k10201, is vital and a component of the wunen locus which guides migrating germ cells from the lumen of the developing gut towards the overlying mesoderm.
