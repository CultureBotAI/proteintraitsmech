identifier: PANTHER:PTHR47614
label: GLYCOPHORIN-C
definition: >-
  Antigens of the Gerbich blood group system are expressed on glycophorin C (GPC) and glycophorin D (GPD), which are both encoded by a single gene, GYPC. They stabilize red blood cell membranes through their intracellular interaction with protein 4.1 and p55. Gebrich antigens can act as receptors for the malarial parasite Plasmodium falciparum. Gerbich antibodies usually do not cause serious hemolytic transfusion reactions (HTR); autoantibodies of anti-Ge2- or anti-Ge3 specificity can cause autoimmune hemolytic anemia (AIHA).
