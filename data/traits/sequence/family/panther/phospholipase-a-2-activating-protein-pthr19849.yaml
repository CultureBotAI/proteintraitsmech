identifier: PANTHER:PTHR19849
label: "PHOSPHOLIPASE A-2-ACTIVATING PROTEIN"
definition: >-
  PHOSPHOLIPASE A-2-ACTIVATING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19849. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function protein binding, ubiquitin-like protein binding, ubiquitin binding. Members participate in modification-dependent macromolecule catabolic process, modification-dependent protein catabolic process, proteasome-mediated ubiquitin-dependent protein catabolic process. Members localise to cytoplasm, membrane-bounded organelle, nucleus.
