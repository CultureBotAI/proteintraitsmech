identifier: PANTHER:PTHR10912
label: "ADP-RIBOSYL CYCLASE"
definition: >-
  CD38, the HUGO gene name, is also called T10 or ADP-ribosyl cyclase/cyclic ADP-ribose hydrolase (EC:3.2.2.5). CD38 is a novel enzyme capable of catalysing multiple reactions, including NAD glycohydrolase, ADP-ribosyl cyclase, cyclic ADP ribose hydrolase and base-exchange activities. Two of the enzymatic products, cyclic ADP-ribose (cADPR) and nicotinic acid adenine dinucleotide phosphate (NAADP), are calcium messengers in a wide variety of cells from protist, plant, and mammal to human. CD38 is a positive and negative regulator of cell activation and proliferation, depending on the cellular environment. It is involved in adhesion between human lymphocytes and endothelial cells and is involved in the metabolism of two calcium messengers, cADPR and NAADP. CD157 (also called BP-3/IF-7, BST-1 or Mo5) has ADP-ribosyl cyclase and cyclic ADP-ribose hydrolase activities. CD157 supports the growth of a pre-B cell line, DW34. Anti-CD157 mAb IF-7 has synergistic effects on anti-CD3-induced growth of T progenitor cells, and facilitates the development of [alpha][beta] TCR+ cells in foetal thymic organ culture system.
definition_source: "InterPro:IPR003193 abstract (PANTHER PTHR10912 is a member signature)"
