identifier: PANTHER:PTHR31904
label: "BYPASS OF STOP CODON PROTEIN 5-RELATED"
definition: >-
  This entry includes Bul1, Bul2, Bsc5 and YNR068C from Saccharomyces cerevisiae and homologues from fungi. They are adaptor proteins that facilitate the ligase-substrate interaction. Bul1 binds the ubiquitin ligase Rsp5, via an N-terminal PPSY motif. The complex containing Bul1 and Rsp5 is involved in intracellular trafficking of the general amino acid permease Gap1, degradation of Rog1 in cooperation with Bul2 and GSK-3, and mitochondrial inheritance. Bul2, which is homologous to Bul1, also interacts with Rsp5. Bul3p, the product of two adjacent open reading frames (Bsc5 and YNR068C) separated by a stop codon that undergoes readthrough translation. BUL3 is involved in ubiquitin-mediated sorting of plasma membrane proteins and interacts with WW domains of Rsp5 in vitro.
definition_source: "InterPro:IPR039634 abstract (PANTHER PTHR31904 is a member signature)"
