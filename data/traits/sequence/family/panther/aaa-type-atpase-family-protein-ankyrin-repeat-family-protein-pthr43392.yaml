    text: >-
      AAA-TYPE ATPASE FAMILY PROTEIN / ANKYRIN REPEAT FAMILY PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43392. PANTHER protein class: DNA metabolism protein, DNA helicase. Members are annotated with the molecular function pyrophosphatase activity, ATP hydrolysis activity, ribonucleoside triphosphate phosphatase activity.
