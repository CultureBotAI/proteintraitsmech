identifier: PANTHER:PTHR43392
label: "AAA-TYPE ATPASE FAMILY PROTEIN / ANKYRIN REPEAT FAMILY PROTEIN"
definition: >-
  The CbxX/CfxQ family includes proteins with diverse functions, primarily associated with the activation and expression of RuBisCO, an enzyme critical for carbon fixation in photosynthetic organisms. Members of this family exhibit ATPase activity, which is necessary for the release of RuBP from inhibited RuBisCO, facilitating the carboxylation process. Additionally, some proteins within this family are part of the ESX specialized secretion systems (T7SS) in bacteria, playing roles in virulence, iron acquisition, and DNA conjugation. These proteins likely use their ATPase activity to provide energy for the export of various substrates through these secretion systems.
