identifier: PANTHER:PTHR14292
label: "INTERLEUKIN-18-BINDING PROTEIN"
definition: >-
  Interleukin-18-binding protein (IL18BP) isoform A binds to IL-18 and inhibits its activity. It is required for normal NK cell abundance and function and also contributes to maintaining steady-state levels of circulating IL-18.
