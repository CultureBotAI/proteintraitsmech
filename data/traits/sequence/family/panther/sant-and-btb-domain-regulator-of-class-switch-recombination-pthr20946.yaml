identifier: PANTHER:PTHR20946
label: "SANT AND BTB DOMAIN REGULATOR OF CLASS SWITCH RECOMBINATION"
definition: >-
  Class switch recombination (CSR) is the process by which B cells switch production from IgM/IgD to other immunoglobulin isotypes in the inmune response process. This entry includes the SANT and BTB domain regulator of class switch recombination (SANBR, previously known as KIAA1841), a negative regulator of CSR. This entry also includes some uncharacterised eukaryotic proteins.
