identifier: PANTHER:PTHR40111
label: "CEPHALOSPORIN-C DEACETYLASE"
definition: >-
  Carbohydrate esterase 7 (CE7) enzymes possess multifunctional deacetylase activity against a range of small substrates. The family includes cephalosporin-C deacetylases and acetylxylan esterases (AXEs). These enzymes preferably deacetylate cephalosporin C, acetylated xylose, and short xylooligosaccharides.
