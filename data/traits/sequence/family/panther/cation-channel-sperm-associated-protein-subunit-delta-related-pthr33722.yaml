identifier: PANTHER:PTHR33722
label: "CATION CHANNEL SPERM-ASSOCIATED PROTEIN SUBUNIT DELTA-RELATED"
definition: >-
  CATSPER (cationic channel of sperm) is a complex ion channel that mediates Ca2+ entry in sperm flagellum and is required for sperm hyperactivation and male fertility. The CATSPER channel consists of four CatSper proteins (CatSper1-4) that form a tetramer surrounding a Ca(2+)-selective pore. In addition to the pore-forming proteins, the CATSPER channel contains auxiliary subunits, including CatSperD (cation channel sperm-associated protein subunit delta) and CatSperE. CatSperD is essential for the cation channel function and may play a role in channel assembly or transport.
