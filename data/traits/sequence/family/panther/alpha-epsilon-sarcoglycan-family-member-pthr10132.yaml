identifier: PANTHER:PTHR10132
label: "ALPHA-/EPSILON-SARCOGLYCAN FAMILY MEMBER"
definition: >-
  This entry contains alpha and epsilon sarcoglycans. The sarcoglycan family proteins are single pass transmembrane proteins that are part of the dystrophin-associated glycoprotein complex (DGC), a multiprotein complex that links the actin cytoskeleton to the extracellular matrix in cardiac and skeletal muscle. The DGC can be classified biochemically into three subcomplexes: the cytoplasmic subcomplex (contains dystrophin, the dystrobrevins and the syntrophins), the dystroglycan subcomplex and the sarcoglycan subcomplex. The function of the sarcoglycan subcomplex is not clear. However, mutations in alpha-, beta-, gamma- and delta-sarcoglycan cause different forms of autosomal recessive limb girdle muscular dystrophies (LGMD) demonstrating its importance for normal muscle function.
definition_source: "InterPro:IPR008908 abstract (PANTHER PTHR10132 is a member signature)"
