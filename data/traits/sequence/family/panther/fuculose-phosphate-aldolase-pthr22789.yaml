  - kind: GENERAL
    text: >-
      The aldolase class II family is involved in various metabolic pathways, including the degradation of sugars such as L-fucose, D-arabinose, and L-rhamnulose, as well as the anaerobic utilization of L-ascorbate. Members of this family catalyze key reactions such as the reversible cleavage of L-rhamnulose-1-phosphate to dihydroxyacetone phosphate and L-lactaldehyde, the isomerization of L-ribulose 5-phosphate to D-xylulose 5-phosphate, and the dehydration of methylthioribulose-1-phosphate. These enzymes play crucial roles in the metabolism of rare sugars, the salvage pathway of toxic by-products, and the biosynthesis of coenzymes. They operate through mechanisms involving retroaldol/aldol reactions or decarboxylation, often requiring metal ions for activity. The family includes several subfamilies such as MtnB, AraD/FucA, and RhaD, each with specific substrate preferences and functions.
    source: "InterPro:IPR050197 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
