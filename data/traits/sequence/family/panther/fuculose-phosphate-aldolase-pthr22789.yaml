    text: >-
      FUCULOSE PHOSPHATE ALDOLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22789. PANTHER protein class: aldolase, lyase. Members are annotated with the molecular function lyase activity, carbon-carbon lyase activity. and participate in carbohydrate catabolic process, monosaccharide metabolic process, small molecule catabolic process. and localise to cytoplasm, cytosol.
