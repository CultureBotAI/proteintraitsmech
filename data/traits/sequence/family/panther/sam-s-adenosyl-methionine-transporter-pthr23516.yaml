identifier: PANTHER:PTHR23516
label: "SAM (S-ADENOSYL METHIONINE) TRANSPORTER"
definition: >-
  This entry represents a group of molybdate-anion transporters, including MFSD5 (also known as hsMOT2) from humans and molybdate transporter (CrMOT2, UniProtKB:H2ESC) from Chlamydomonas. They mediate high-affinity intracellular uptake of the rare oligo-element molybdenum.
