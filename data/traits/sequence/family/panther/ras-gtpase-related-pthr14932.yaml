identifier: PANTHER:PTHR14932
label: "RAS GTPASE-RELATED"
definition: >-
  Rab-like protein 6 (RABL6 or RBEL1) is one of several proteins identified as binding partners of the ARF tumour suppressor, which protects against cancer through protein-protein interactions, interacting with CDKN2A. RABL6 binds GTP and is found either in the cytoplasm or the nucleus depending in the isoform; isoform 1 is O-glycosylated and cytoplasmic.
