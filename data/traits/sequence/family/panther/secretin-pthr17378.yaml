identifier: PANTHER:PTHR17378
label: SECRETIN
definition: >-
  A number of polypeptidic hormones, mainly expressed in the intestine or the pancreas, belong to a group of structurally related peptides. Members of the structurally similar group include glucagon, glicentin precursor, secretin, gastric inhibitory protein, vasoactive intestinal peptide (VIP), prealbumin, peptide HI-27 and growth hormone releasing factor. Secretin is a 27-amino acid hormone produced by specific endocrine cells, S cells, located in the mucosa of the proximal small intestine. Secretin is initially synthesised as a precursor protein known as prosecretin. Secretin receptors are found in high levels in the pancreas, stomach and heart. They activate adenylyl cyclase through stimulation of G proteins. It is involved in a number of processes, among them, regulation of the pH of the duodenal content, food intake and water homeostasis. Secretin stimulates secretion of enzymes and ions in the pancreas and intestine, and is present in small amounts in the brain (e.g., in the hypothalamus, brainstem and cerebral cortex). Additionally, it plays a role in diet induced thermogenesis as it activates brown fat thermogenesis which stimulates lipolysis, a signal that is sensed in the brain and promotes satiation.
