identifier: PANTHER:PTHR10724
label: "30S RIBOSOMAL PROTEIN S1"
definition: >-
  The bacterial ribosomal protein bS1 family is involved in the initiation of protein synthesis by binding mRNA and facilitating its recognition by the 30S ribosomal subunit. Members of the family play a role in unwinding double-stranded RNA, preferentially binding to polypyrimidine tracts and transiently formed single-stranded RNA regions. Some family members are involved in trans-translation, a process that rescues stalled ribosomes by binding transfer-messenger RNA (tmRNA). Additionally, certain proteins within the family negatively autoregulate their own translation and may be involved in the translation of chloroplast-encoded proteins, heat stress response, and biosynthesis of thylakoid membrane proteins. The family includes proteins that are essential for the translation of most natural mRNAs, except for leaderless mRNA, and may act as RNA chaperones to unfold structured mRNA on the ribosome.
definition_source: "InterPro:IPR050437 abstract (PANTHER PTHR10724 is a member signature)"
