identifier: PANTHER:PTHR21174
label: "Predicted HD phosphohydrolase"
definition: >-
  There are currently no experimental data for members of this group or their homologues. However, members of this family contain a version of the HDc domain (metal-dependent phosphohydrolases with conserved "HD" motif), indicating possible phosphohydrolase activity.
