identifier: PANTHER:PTHR45884
label: "N-ACETYLTRANSFERASE ECO"
definition: >-
  N-ACETYLTRANSFERASE ECO — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45884. PANTHER protein class: acetyltransferase. Members are annotated with the molecular function peptide-lysine-N-acetyltransferase activity, peptide N-acetyltransferase activity, catalytic activity, acting on a protein. and participate in cellular component organization, mitotic sister chromatid cohesion. and localise to non-membrane-bounded organelle, protein-containing complex, nucleus.
