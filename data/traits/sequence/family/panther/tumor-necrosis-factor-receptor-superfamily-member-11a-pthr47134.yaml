identifier: PANTHER:PTHR47134
label: "TUMOR NECROSIS FACTOR RECEPTOR SUPERFAMILY MEMBER 11A"
definition: >-
  This family of proteins includes receptors that are crucial for the process of osteoclastogenesis, which is the formation of osteoclasts. These receptors bind to the ligand TNFSF11/RANKL/TRANCE/OPGL and are essential for the signaling that leads to the differentiation and activation of osteoclasts. They are also involved in the immune system, playing a role in the regulation of T-cell and dendritic cell interactions. The signaling cascade initiated by these receptors includes the activation of transcription factors like NFATC1 and enzymes such as PLCG2, which are important for the transcriptional events and cellular responses necessary for osteoclast development.
