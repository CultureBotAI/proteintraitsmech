identifier: PANTHER:PTHR10362
label: "HISTIDINE AMMONIA-LYASE"
definition: >-
  This family includes phenylalanine ammonia-lyase, (PAL; EC:4.3.1.24), histidine ammonia-lyase, (HAL; EC:4.3.1.3), and tyrosine aminomutase, (EC:5.4.3.6). PAL and HAL are members of the Lyase class I_like superfamily of enzymes that, catalyze similar beta-elimination reactions and are active as homotetramers. Both PAL and HAL contain a catalytic Ala-Ser-Gly triad that is post-translationally cyclised. PAL is a key biosynthetic catalyst in phenylpropanoid assembly in plants and fungi, and is involved in the biosynthesis of a wide variety of secondary metabolites such as flavanoids, furanocoumarin phytoalexins and cell wall components. These compounds are important for normal growth and in responses to environmental stress. HAL catalyses the first step in histidine degradation, the removal of an ammonia group from histidine to produce urocanic acid. The core domain in PAL and HAL share about 30% sequence identity, with PAL containing an additional approximately 160 residues extending from the common fold. Tyrosine 2,3-aminomutase has aminomutase activity and, to a much lesser extent, ammonia-lyase activity. PAL is being explored as enzyme substitution therapy for Phenylketonuria (PKU), a disorder which involves an inability to metabolize phenylalanine. HAL failure in humans results in the disease histidinemia.
definition_source: "InterPro:IPR001106 abstract (PANTHER PTHR10362 is a member signature)"
