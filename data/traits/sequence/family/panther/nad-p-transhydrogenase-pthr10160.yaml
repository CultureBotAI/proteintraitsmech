label: "NAD(P) TRANSHYDROGENASE"
definition: >-
  NAD(P) TRANSHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10160. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function nucleotide binding, oxidoreductase activity, acting on NAD(P)H. Members participate in NADP metabolic process, generation of precursor metabolites and energy.
