identifier: PANTHER:PTHR16528
label: "GOLGI-ASSOCIATED PDZ AND COILED-COIL MOTIF-CONTAINING"
definition: >-
  GOPC, also known as PIST or CAL, is primarily localized to the Golgi apparatus. It binds the G protein-coupled receptor beta1AR and modulates beta1AR intracellular trafficking. GOPC also interacts with cystic fibrosis transmembrane regulator (CFTR), retains CFTR in the cell and targets it for degradation.
