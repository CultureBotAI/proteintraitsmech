  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of the cytochrome P450 superfamily, which are heme-thiolate proteins. These enzymes are involved in the metabolism of a wide variety of substrates, including xenobiotics, steroids, fatty acids, and drugs. They function primarily in the liver and are responsible for the oxidative metabolism of both endogenous and exogenous compounds. Their activity can result in the detoxification of substances or, conversely, the activation of compounds to more toxic forms. Cytochrome P450 enzymes are also important in the biosynthesis of steroid hormones and the metabolism of vitamins. They exhibit a characteristic spectral absorbance at 450 nm when bound to carbon monoxide, which is the basis for their naming. The diversity of reactions catalyzed by cytochrome P450 enzymes is large and includes hydroxylation, epoxidation, dealkylation, and reduction reactions.
    source: "InterPro:IPR052666 abstract (LLM-generated, not curator-reviewed)"
