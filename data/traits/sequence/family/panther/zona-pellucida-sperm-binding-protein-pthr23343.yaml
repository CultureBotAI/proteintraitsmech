  - kind: GENERAL
    text: >-
      The Zona Pellucida Domain (ZPD) family includes glycoproteins that are essential components of the zona pellucida, an extracellular matrix that surrounds oocytes. The ZPD family mediates critical reproductive processes such as sperm binding, induction of the acrosome reaction, and prevention of post-fertilization polyspermy. The zona pellucida is typically composed of three to four proteins, including ZP1, ZP2, ZP3, and sometimes ZP4. Members of the ZPD family contribute to the structural integrity of the zona pellucida and may serve as primary or secondary sperm receptors. The ZP domain within these proteins is crucial for the polymerization of ZP proteins, facilitating the formation of the zona pellucida matrix.
    source: "InterPro:IPR051148 abstract (LLM-generated, not curator-reviewed)"
