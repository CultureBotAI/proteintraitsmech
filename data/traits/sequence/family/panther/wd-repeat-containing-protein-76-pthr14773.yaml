definitions:
  - kind: GENERAL
    text: >-
      WD REPEAT-CONTAINING PROTEIN 76 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14773. Members are annotated with the molecular function DNA binding. and participate in regulation of response to stress, regulation of cell cycle phase transition, regulation of cellular response to stress. and localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in DNA-binding and recognition of specific DNA modifications. They are known to bind to both single- and double-stranded DNA, with a preference for UV-damaged DNA, suggesting a role in DNA repair and maintenance. Some family members have been identified as specific readers of the modified DNA base 5-hydroxymethylcytosine (5hmC), which is important in epigenetic regulation. The presence of WD repeats indicates a potential role in protein-protein interactions, which may be crucial for their function in DNA-metabolic processes.
    source: "InterPro:IPR050853 abstract (LLM-generated, not curator-reviewed)"
