identifier: PANTHER:PTHR36843
label: "HEME-DEPENDENT PEROXIDASE YWFI-RELATED"
definition: >-
  Proteins in this family are heme-dependent peroxidases, including coproheme decarboxylase (ChdC, also known as HemQ) and chlorite dismutase (CLD). Coproheme decarboxylases (ChdC) catalyze the hydrogen peroxide-mediated conversion of coproheme to heme b. Its structure has been revealed. Chlorite dismutase catalyses the disproportionation of chlorite into chloride and oxygen.
