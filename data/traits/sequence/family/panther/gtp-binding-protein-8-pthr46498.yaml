  - kind: GENERAL
    text: >-
      The EngB GTPase family is part of the TRAFAC class TrmE-Era-EngA-EngB-Septin-like GTPase superfamily. Members of the EngB GTPase family, such as GTP-binding protein 8, are involved in various cellular processes due to their ability to bind and hydrolyze GTP. One of the family members is known to be a component of MIOREX complexes, which are large expressome-like assemblies of ribosomes that play a role in all steps of post-transcriptional gene expression. This suggests that the EngB GTPase family may be involved in the regulation of gene expression at the post-transcriptional level, potentially through interaction with ribosomal components and influencing translation or other aspects of RNA metabolism.
    source: "InterPro:IPR052279 abstract (LLM-generated, not curator-reviewed)"
