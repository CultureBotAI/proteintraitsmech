identifier: PANTHER:PTHR31179
label: "RAB GTPASE-BINDING EFFECTOR PROTEIN"
definition: >-
  Rabaptins interact with the GTP form of the small GTPase Rab5, a potent regulator of endocytic transport. Two rabaptins have been identified, rabaptin-5 and rabaptin-5beta. Both proteins bind to Rab5 and cooperate in endocytic membrane fusion.
