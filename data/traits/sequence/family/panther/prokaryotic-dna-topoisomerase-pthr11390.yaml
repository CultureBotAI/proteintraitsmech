identifier: PANTHER:PTHR11390
label: "PROKARYOTIC DNA TOPOISOMERASE"
definition: >-
  This entry describes the type IA topoisomerases, which are highly conserved enzymes that are structurally distinct from type IB enzymes. The structures of both topoisomerases I and III have been elucidated, and consist of four domains that together form a toroidal molecule with a central hole that is large enough to accommodate single- and double-stranded DNA. It is believed that the domains transiently separate from one another to allow the entrance and exit of DNA strands. DNA topoisomerases regulate the number of topological links between two DNA strands (i.e. change the number of superhelical turns) by catalysing transient single-or double-strand breaks, crossing the strands through one another, then resealing the breaks. These enzymes have several functions: to remove DNA supercoils during transcription and DNA replication; for strand breakage during recombination; for chromosome condensation; and to disentangle intertwined DNA during mitosis. DNA topoisomerases are divided into two classes: type I enzymes (EC:5.6.2.2; topoisomerases I, III and V) break single-strand DNA, and type II enzymes (EC:5.6.2.2; topoisomerases II, IV and VI) break double-strand DNA. Type I topoisomerases are ATP-independent enzymes (except for reverse gyrase), and can be subdivided according to their structure and reaction mechanisms: type IA (Topo IA; bacterial and archaeal topoisomerase I, topoisomerase III and reverse gyrase) and type IB (Topo IB; eukaryotic topoisomerase I and topoisomerase V). These enzymes are primarily responsible for relaxing positively and/or negatively supercoiled DNA, except for reverse gyrase, which can introduce positive supercoils into DNA. This function is vital for the processes of replication, transcription, and recombination. Unlike Topo IA enzymes, Topo 
