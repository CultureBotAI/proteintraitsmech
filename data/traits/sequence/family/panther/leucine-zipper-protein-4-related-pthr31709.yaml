identifier: PANTHER:PTHR31709
label: "LEUCINE ZIPPER PROTEIN 4-RELATED"
definition: >-
  This family of proteins includes Antho-RFamide neuropeptides which are likely transcriptional transactivators and potential neuromuscular transmitters. They share similarity to the FARP (FMRFamide related peptide) family, suggesting a role in neuronal signaling or modulation. One member is known to bind DNA at the transcription initiation site and upstream sequences of a specific promoter, thereby activating transcription. Other members, while their exact functions are not fully elucidated, are hypothesized to act as transmitters at neuromuscular synapses.
