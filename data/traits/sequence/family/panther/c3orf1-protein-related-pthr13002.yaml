identifier: PANTHER:PTHR13002
label: "C3ORF1 PROTEIN-RELATED"
definition: >-
  This family of proteins includes complex I assembly factor TIMMDC1 from human and its orthologues, which are mitochondrial chaperones that are involved in the assembly of the mitochondrial NADH:ubiquinone oxidoreductase complex, also known as complex I. Members of this family participate in constructing the membrane arm of complex I, which is essential for the proper function of the enzyme in the respiratory chain.
