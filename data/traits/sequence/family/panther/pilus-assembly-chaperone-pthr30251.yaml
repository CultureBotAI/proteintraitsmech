  - kind: GENERAL
    text: >-
      The Periplasmic Pilus Chaperone family consists of proteins involved in the biogenesis and assembly of various types of fimbriae and pili, which are filamentous structures on the surface of bacteria. These chaperones mediate the assembly of pili by forming soluble multimeric complexes with pilus subunits, protecting them from proteolytic degradation and preventing premature polymerization. The family members play a crucial role in bacterial adhesion to host cells and surfaces, contributing to colonization and virulence. They are part of different fimbrial operons and are essential for the proper assembly of fimbriae such as type 1, F1C, CS6, and others, which are involved in adherence to eukaryotic cells and may assist in microcolony formation.
    source: "InterPro:IPR050643 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
