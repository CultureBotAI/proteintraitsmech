  - kind: GENERAL
    text: >-
      This family of proteins includes O-mannosyl-transferases that are involved in the post-translational modification of proteins by transferring mannosyl residues to serine or threonine hydroxyl groups. Members of this family primarily modify the cadherin superfamily, adding O-linked mannose glycans in specific regions and thus playing distinct roles in the decoration of cadherin domains. Additionally, they can also mannosylate other proteins, exemplified by their activity on PDIA3.
