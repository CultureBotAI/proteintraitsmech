  - kind: GENERAL
    text: >-
      This family of proteins includes putative signaling proteins that are implicated in the regulation of beta-lactamase. Members of this family are not believed to directly sense beta-lactams but may play a role in the signaling pathways that control the expression of beta-lactamase, an enzyme responsible for antibiotic resistance to beta-lactam antibiotics. The exact mechanism of action and the pathway in which these proteins operate are not fully elucidated.
