identifier: PANTHER:PTHR14619
label: "NEURON-DERIVED NEUROTROPHIC FACTOR"
definition: >-
  NDNF (neuron-derived neurotrophic factor) is a glycosylated, disulfide-bonded secretory protein that contains fibronectin type III domains and two predicted N-linked glycosylation sites. It is expressed in brain and spinal cord that promotes migration and neurite growth. It acts as a modulator that promotes endothelial cell survival, vessel formation and plays an important role in the process of revascularization through NOS3-dependent mechanisms.
