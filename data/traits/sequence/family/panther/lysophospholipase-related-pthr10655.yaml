identifier: PANTHER:PTHR10655
label: LYSOPHOSPHOLIPASE-RELATED
definition: >-
  This family of proteins includes enzymes that exhibit a variety of hydrolytic activities, primarily acting on ester bonds. Acyl-protein thioesterase 1/2 are involved in the hydrolysis of fatty acids from S-acylated cysteine residues in proteins, a process known as depalmitoylation, which is important for the regulation of protein localization and function. Some proteins within this family show a preference for palmitoylated G-alpha proteins as substrates. Lysophospholipase-like protein 1 is a palmitoyl thioesterase that catalyses depalmitoylation of CGAS and KCNMA1, acting as a regulator of innate immunity. Other members display broader substrate specificity, including carboxylesterase activity, which may be involved in the degradation of various compounds, such as Carboxylesterase SOBER1 from Arabidopsis thaliana, which functions as a negative regulator of the hypersensitive response (HR) triggered by the bacterial type III effector protein AvrBsT. The activities of these proteins are essential for diverse biological processes, including signal transduction, lipid metabolism, and the regulation of protein modifications.
