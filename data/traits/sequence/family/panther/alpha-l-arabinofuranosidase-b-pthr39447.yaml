identifier: PANTHER:PTHR39447
label: "ALPHA-L-ARABINOFURANOSIDASE B"
definition: >-
  ABFB is an alpha-L-arabinofuranosidase involved in the degradation of arabinoxylan, a major component of plant hemicellulose. It catalyses the hydrolysis of alpha-1,2-, alpha-1,3- and alpha-1,5-L-arabinofuranosidic bonds in L-arabinose-containing hemicelluloses such as arabinoxylan and L-arabinan.
