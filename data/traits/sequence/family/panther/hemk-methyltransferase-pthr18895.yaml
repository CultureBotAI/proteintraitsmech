identifier: PANTHER:PTHR18895
label: "HEMK METHYLTRANSFERASE"
definition: >-
  The N5-glutamine methyltransferase family is responsible for the post-translational modification of class 1 translation termination release factors. Members of the family methylate the glutamine residue within the universally conserved GGQ motif of these release factors, which is essential for proper termination of protein synthesis. This methylation is crucial for the accuracy and efficiency of the translation termination process. The family includes both bacterial and eukaryotic proteins, with some members also involved in the methylation of mitochondrial translation release factors. The activity of these enzymes ensures the fidelity of protein synthesis by modifying the release factors that recognize stop codons and promote the disassembly of the ribosomal complex.
