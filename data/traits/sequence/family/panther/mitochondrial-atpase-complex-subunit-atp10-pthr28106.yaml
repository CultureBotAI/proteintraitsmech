identifier: PANTHER:PTHR28106
label: "MITOCHONDRIAL ATPASE COMPLEX SUBUNIT ATP10"
definition: >-
  This entry includes ATPase complex subunit ATP10, mostly from yeasts and plants. In budding yeasts, ATP10 is a mitochondria protein that is essential for the assembly of the mitochondrial F1-F0 complex. It assists assembly of Atp6 into the F0 unit of the yeast mitochondrial ATPase.
