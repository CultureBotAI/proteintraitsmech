  - kind: GENERAL
    text: >-
      The fgaFS/easG family includes enzymes involved in the biosynthesis of ergot alkaloids, a group of secondary metabolites with diverse biological activities. Members of this family catalyze key reduction steps in the ergot alkaloid pathway, converting intermediates such as chanoclavine-I aldehyde to agroclavine and 6,8-dimethyl-6,7-didehydroergoline to festuclavine. These reactions are crucial for the formation of various ergot compounds, including ergopeptines like ergotamine and ergovaline. The family also encompasses enzymes involved in the biosynthesis of isofumigaclavines and the reduction of azo compounds in xenobiotics. The enzymes typically exhibit oxidoreductase activity, utilizing NAD(P)H as an electron donor to facilitate the reduction of their substrates.
    source: "InterPro:IPR051604 abstract (LLM-generated, not curator-reviewed)"
