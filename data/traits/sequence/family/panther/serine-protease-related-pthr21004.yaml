identifier: PANTHER:PTHR21004
label: "SERINE PROTEASE-RELATED"
definition: >-
  The peroxisomal leader peptide-processing protease (TYSND1, trypsin domain-containing 1) removes the N-terminal transit peptide from proteins containing a PTS2 target sequence. The plant glyoxysomal processing protease (DEG15) performs a similar function in the glyoxysome, a specialized peroxisome. DEG15 exists as a homodimer or as a monomer; as a dimer it is a processing enzyme, as a monomer it degrades denatured proteins. These peptidases are trypsin homologues and members of MEROPS family S1 and subfamily S1B. Cleavage requires a cysteine residue in P1 or P2.
