identifier: PANTHER:PTHR35330
label: "SIROHEME BIOSYNTHESIS PROTEIN MET8"
definition: >-
  This entry represents a family of proteins from fungi and prokaryotes, including Siroheme biosynthesis protein met8 from budding and fission yeast, Precorrin-2 dehydrogenase from the archaea Methanosarcina barkeri (Mba_PC2_DH) and Precorrin-2 dehydrogenase from Bacillus subtilis (SirC). In Saccharomyces cerevisiae, Met8 is a bifunctional dehydrogenase ( ) and ferrochelatase ( ). It catalyses the final two steps in the biosynthesis of sirohaem, involving a NAD(+)-dependent dehydrogenation of precorrin-2 to generate sirohydrochlorin followed by ferrochelation to yield sirohaem. Siroheme is a heme-like prosthetic group used by sulfite and nitrite reductases. The structure of Met8 has been resolved. A single active site, Asp141, has been shown to play an essential role in both dehydrogenase and chelatase processes. Mba_PC2_DH is involved in the archaeal biosynthesis of heme. It catalyses the oxidation of precorrin-2 into sirohydroclorin. SirC catalyses the dehydrogenation of precorrin-2 to form sirohydrochlorin which is used as a precursor in both siroheme biosynthesis and in the anaerobic branch of adenosylcobalamin biosynthesis.
definition_source: "InterPro:IPR028161 abstract (PANTHER PTHR35330 is a member signature)"
