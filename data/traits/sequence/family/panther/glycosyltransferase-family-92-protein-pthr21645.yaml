  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are classified as glycosyltransferases, specifically within the glycosyltransferase 92 group. These enzymes are responsible for the transfer of sugar moieties from activated donor molecules to specific acceptor molecules, forming glycosidic bonds. This process is crucial for the synthesis of glycoconjugates, such as glycoproteins, glycolipids, and polysaccharides, which are essential components of cell membranes and extracellular matrices. The glycosyltransferase 92 family members are involved in various biological processes, including cell signaling, cell adhesion, and immune response, by modulating the structure and function of glycoconjugates. Their activity is vital for the proper functioning of cells and the organism as a whole.
    source: "InterPro:IPR052012 abstract (LLM-generated, not curator-reviewed)"
