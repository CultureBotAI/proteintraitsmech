identifier: PANTHER:PTHR10869
label: "PROLYL 4-HYDROXYLASE ALPHA SUBUNIT"
definition: >-
  This entry includes prolyl 4-hydroxylases from eukaryotes and related proteins from prokaryotes. Mammalian prolyl 4-hydroxylase alpha catalyses the posttranslational formation of 4-hydroxyproline in -xaa-pro-gly-sequences in collagens and other proteins. Prokaryotic enzymes might catalyse hydroxylation of antibiotic peptides. These are 2-oxoglutarate-dependent dioxygenases, requiring 2-oxoglutarate and dioxygen as cosubstrates and ferrous iron as a cofactor.
definition_source: "InterPro:IPR045054 abstract (PANTHER PTHR10869 is a member signature)"
