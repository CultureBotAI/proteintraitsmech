identifier: PANTHER:PTHR11731
label: "PROTEASE FAMILY S9B,C DIPEPTIDYL-PEPTIDASE IV-RELATED"
definition: >-
  The peptidase S9B family, also known as the DPPIV subfamily, includes serine proteases with dipeptidyl peptidase activity, which cleave off N-terminal dipeptides from proteins with a preference for a proline residue at the penultimate position. Members of this family are involved in various physiological processes, including immune response regulation, tissue remodeling, and cell signaling. Some proteins within this family act as venom toxins, contributing to the processing of venom proteins and modulation of immune cell chemotaxis. Others are involved in cell surface expression and modulation of potassium channels, although they lack dipeptidyl aminopeptidase activity. The family also includes prolyl tripeptidyl peptidases that release tripeptides from protein N-termini, and proteins that participate in extracellular matrix degradation and play roles in tissue remodeling, fibrosis, wound healing, inflammation, and tumor growth.
