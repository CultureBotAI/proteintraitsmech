identifier: PANTHER:PTHR11958
label: "SODIUM/DICARBOXYLATE SYMPORTER-RELATED"
definition: >-
  The dicarboxylate/amino acid:cation symporter family is involved in the sodium-dependent, high-affinity transport of amino acids such as L-glutamate, L- and D-aspartate, and L-cysteine across cell membranes. Members function as symporters, co-transporting amino acids with Na+ ions and a proton, while counter-transporting a K+ ion. They play crucial roles in rapidly clearing glutamate from synaptic clefts, terminating postsynaptic action, and contributing to glutathione biosynthesis and oxidative stress protection. Some members also mediate Cl- flux independent of amino acid transport and exhibit substrate-specific transport regulation.
