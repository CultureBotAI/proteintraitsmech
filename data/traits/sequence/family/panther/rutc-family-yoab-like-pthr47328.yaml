identifier: PANTHER:PTHR47328
label: "RutC family, YoaB-like"
definition: >-
  This group of proteins belong to a large family of YjgF/YER057c/UK114-like proteins present in bacteria, archaea, and eukaryotes with no definitive function. The conserved domain is similar in structure to chorismate mutase but there is no sequence similarity and no functional connection. Members of this family have been implicated in isoleucine (Yeo7, Ibm1, aldR) and purine (YjgF) biosynthesis, as well as threonine anaerobic degradation (tdcF) and mitochondrial DNA maintenance (Ibm1). This protein homotrimerizes forming a distinct intersubunit cavity that may serve as a small molecule binding site.
definition_source: "InterPro:IPR035709 abstract (PANTHER PTHR47328 is a member signature)"
