identifier: PANTHER:PTHR15478
label: "PLECKSTRIN HOMOLOGY-LIKE DOMAIN, PQ-RICH PROTEIN"
definition: >-
  PHLDA family members include PHLDA1, 2, and 3. They are phosphatidylinositol (PIP) binding proteins and function as repressors of Akt. They are involved in p53/TP53-dependent apoptosis.
