identifier: PANTHER:PTHR23204
label: "CLEAVAGE AND POLYADENYLATION SPECIFIC FACTOR"
definition: >-
  This entry includes cleavage and polyadenylation specificity factor subunit 6/7 (CPSF6/7) from mammals and CG7185 from Drosophila melanogaster. This entry also includes proteins from fungi and plants. CPSF6/7 are components of the Cleavage Factor Im complex (CFIm) which plays a key role in pre-mRNA 3'-cleavage and polyadenylation. These proteins are components of the cleavage factor Im (CFIm) complex that functions as an activator of the pre-mRNA 3'-end cleavage and polyadenylation processing required for the maturation of pre-mRNA into functional mRNAs.
