identifier: PANTHER:PTHR13459
label: "E3 UBIQUITIN-PROTEIN LIGASE RNF220 ISOFORM X1"
definition: >-
  This family of proteins includes E3 ubiquitin-protein ligases that are involved in the ubiquitination and subsequent proteasomal degradation of specific substrates, such as SIN3B. These proteins also function independently of their ligase activity, stabilizing CTNNB1 through deubiquitination mediated by USP7, which in turn promotes Wnt signaling. Additionally, they play a role in the regulation of the nuclear lamina structure, which is crucial for maintaining the integrity of the nucleus. The family is characterized by its diverse functions in cellular signaling pathways and structural maintenance.
