identifier: PANTHER:PTHR34208
label: "S-ADENOSYL-L-METHIONINE-DEPENDENT METHYLTRANSFERASE-RELATED"
definition: >-
  This family includes two functionally redundant pectin methyltransferases, Cotton Golgi-related 2 and 3 (CGR2/3), which are required for homogalacturonan pectins (HG) methylesterification in the Golgi apparatus prior to integration into cell walls, essential for general growth and development. Changes in pectin composition impacts carbon (C) partitioning, photosynthesis and respiration efficiency by influencing leaf mesophyll cell walls morphology and physiology. Pectin methylesterification modulates both expansion and positioning of cells in leaves, probably by changing cell walls plasticity.
definition_source: "InterPro:IPR044689 abstract (PANTHER PTHR34208 is a member signature)"
