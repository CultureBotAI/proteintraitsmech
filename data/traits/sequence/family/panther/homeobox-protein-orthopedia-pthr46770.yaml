    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is primarily involved in the development and differentiation of neuroendocrine cells within the hypothalamus, as well as in the patterning of larval skeletal structures. Members of this family play crucial roles in the specification of various neuron types, including dopaminergic neurons in specific regions of the brain. Some proteins within this family are also implicated in the development of the central nervous system more broadly. They are characterized by belonging to the paired homeobox family, specifically the Bicoid subfamily, which suggests a function in transcriptional regulation during embryonic development.
    source: "InterPro:IPR051895 abstract (LLM-generated, not curator-reviewed)"
