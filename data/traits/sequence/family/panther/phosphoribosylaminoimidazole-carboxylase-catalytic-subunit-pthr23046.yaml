identifier: PANTHER:PTHR23046
label: "PHOSPHORIBOSYLAMINOIMIDAZOLE CARBOXYLASE CATALYTIC SUBUNIT"
definition: >-
  The novo purine biosynthesis proceeds by two divergent paths. In bacteria, yeasts, and plants, 5-aminoimidazole ribonucleotide (AIR) is converted to 4-carboxy-AIR (CAIR) by two enzymes: N5-carboxy-AIR (N5-CAIR) synthetase (PurK) and N5-CAIR mutase (class I PurE). In animals, the conversion of AIR to CAIR requires a single enzyme, AIR carboxylase (class II PurE). Class I and class II PurEs are mechanistically related but bind different substrates.
definition_source: "InterPro:IPR024694 abstract (PANTHER PTHR23046 is a member signature)"
