identifier: PANTHER:PTHR41710
label: "GLYCOSYL TRANSFERASE, FAMILY 39"
definition: >-
  This entry represents a protein family found in bacteria and archaea, almost always in the same genomes as members of family InterPro:IPR018746, and frequently as a nearby gene. The few invariant residues in this family, found toward the N terminus, include a dipeptide DE, a tripeptide HGP, and two different Arg residues. Up to three members may be found in a genome. This group of proteins include Dolichyl-phosphate-mannose-protein mannosyltransferase from the extremely halophilic archaea Haloarcula hispanica (Dpm4, also known as Agl23, (UniProtKB:G0HVI9). This protein is involved in both N- and O-glycosylation of S-layer glycoproteins in whole cells, but not in lysates, suggesting a flippase-like or flippase-associated function.
definition_source: "InterPro:IPR019962 abstract (PANTHER PTHR41710 is a member signature)"
