identifier: PANTHER:PTHR47535
label: "MUSCLE-SPECIFIC PROTEIN 300 KDA, ISOFORM G"
definition: >-
  This family of proteins is involved in the LINC complex, which connects the nuclear lamina to the cytoskeleton, facilitating the transmission of mechanical forces across the nuclear envelope and playing a role in nuclear movement and positioning. Members of this family are likely to serve as anchoring proteins, tethering the nucleus to the cytoskeleton and interacting with components such as PLEC and the intermediate filament system. They are implicated in cellular processes like the regulation of cell morphology, centrosome polarization, and directional migration in response to mechanical stimuli. Some family members also contribute to the spatial organization of myonuclei in muscle fibers and the anchoring of cellular organelles to structural components within the cell.
