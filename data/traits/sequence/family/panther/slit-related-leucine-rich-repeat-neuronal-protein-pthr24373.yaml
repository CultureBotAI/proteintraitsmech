  - kind: GENERAL
    text: >-
      The protein family is involved in a variety of developmental processes, immune responses, and cellular signaling pathways. Members of the family function as cell surface receptors, contributing to neurite outgrowth inhibition, brain development, and axon migration. They also play roles in synapse formation and maintenance in the nervous system, acting as ligands for presynaptic receptors and regulating excitatory synapse development. Some family members are involved in the innate immune response, mediating B-cell activation via lipopolysaccharide interaction. Others modulate chondrocyte differentiation, collagen fibrillogenesis, and bone morphogenetic protein signaling. Additionally, the family includes proteins that regulate TGF-beta activation, influencing microglia function and immune signaling. The family also encompasses proteins that contribute to wound healing, cholesterol homeostasis, and energy expenditure regulation.
