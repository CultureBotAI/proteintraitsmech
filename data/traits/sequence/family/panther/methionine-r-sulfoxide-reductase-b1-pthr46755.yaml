identifier: PANTHER:PTHR46755
label: "METHIONINE-R-SULFOXIDE REDUCTASE B1"
definition: >-
  The Methionine-R-sulfoxide reductase B1 family comprises enzymes that catalyze the reduction of methionine (R)-sulfoxide to methionine, a reaction that can reverse post-translational modifications or oxidative stress effects. Members of the family are involved in regulating actin assembly by interacting with MICAL proteins to promote actin filament repolymerization. Additionally, they play a role in innate immunity by restoring oxidized actin to its reduced state, facilitating actin repolymerization in macrophages.
