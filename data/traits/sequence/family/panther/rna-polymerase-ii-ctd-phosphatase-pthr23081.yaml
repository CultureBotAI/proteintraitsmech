identifier: PANTHER:PTHR23081
label: "RNA POLYMERASE II CTD PHOSPHATASE"
definition: >-
  This entry represents Fcp1 and its homologues, including CTDP1 from humans and CPL1/2/3/4/5 from Arabidopsis. They are carboxy-terminal domain (CTD) phosphatases. CPL1 has been shown to interact with two NMD (nonsense-mediated decay) factors, eIF4AIII and UPF3, and is involved in the dephosphorylation of eIF4AIII. CPL4 functions as a pol II CTD phosphatase and has been shown to dephosphorylate both Ser2- and Ser5-PO(4) of CTD in vitro. Budding yeast Fcp1 has been shown to dephosphorylate RNA polymerase (RNAP) II subunit, and this interaction is modulated by the Pin1 protein.
definition_source: "InterPro:IPR039189 abstract (PANTHER PTHR23081 is a member signature)"
