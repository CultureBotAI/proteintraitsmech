identifier: PANTHER:PTHR28128
label: "GOLGI APPARATUS MEMBRANE PROTEIN TVP15"
definition: >-
  Proteins in this family co-localise with COPI vesicle coat proteins. In yeast it is a Golgi membrane protein involved in vesicular trafficking, interacting with Tvp18 and Tvp23.
