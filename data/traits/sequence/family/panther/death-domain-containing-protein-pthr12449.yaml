identifier: PANTHER:PTHR12449
label: "DEATH DOMAIN-CONTAINING PROTEIN"
definition: >-
  NOL4 has been identified as a methylation target for cervical and head and neck cancer. NOL4L was first identified in acute myeloid leukaemia and was shown to be involved in cell progression in neuroblastoma. NOL4L effects gene expression in the PI3K/AKT pathway and is critical for tumor progression and metastasis in ovarian cancer cells.
