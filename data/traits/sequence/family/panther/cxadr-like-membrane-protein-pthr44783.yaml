identifier: PANTHER:PTHR44783
label: "CXADR-LIKE MEMBRANE PROTEIN"
definition: >-
  CXADR-like membrane protein (CLMP), also known as ACAM, belongs to the CTX family, whose members are type I transmembrane proteins within the immunoglobulin superfamily (IgSF). It is a component of epithelial tight junctions. It has been implicated in adipocyte maturation and development of obesity. Mutations of the CLMP gene cause Congenital Short Bowel Syndrome (CSBS).
