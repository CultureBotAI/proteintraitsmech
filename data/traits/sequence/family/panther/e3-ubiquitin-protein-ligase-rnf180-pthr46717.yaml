identifier: PANTHER:PTHR46717
label: "E3 UBIQUITIN-PROTEIN LIGASE RNF180"
definition: >-
  RNF180 (also known as Rines: RING finger protein in neural stem cells) is an integral membrane protein located mainly on the cytoplasmic side of the endoplasmic reticulum. It promotes polyubiquitination and degradation by the proteasome pathway of ZIC2. It is thought that it is involved in modulation of neuronal function, such as regulation of synaptic structure and synaptic plasticity due to its high expression in mature brain. It has been related to neurodegenerative diseases and to disorders associated with emotion. Methylation of RNF180 has been linked to gastric cancer.
