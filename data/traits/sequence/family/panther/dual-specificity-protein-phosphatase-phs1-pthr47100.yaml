identifier: PANTHER:PTHR47100
label: "DUAL SPECIFICITY PROTEIN PHOSPHATASE PHS1"
definition: >-
  PHS1 is dual-specificity phophosphatase from plants. It specifically interacts with two MAPKs, MPK12 and MPK18. PHS1-MPK18 signalling probably regulates cortical microtubule functions. It is also a negative regulator of abscisic acid (ABA) signalling. Plant hormone ABA control numeros processes, such as dormancy and germination of seeds, senescence and resistance to abiotic stresses.
