identifier: PANTHER:PTHR20950
label: "GALANIN-RELATED PEPTIDE"
definition: >-
  The galanin-like peptide (GALP) exists in two isoforms which have different physiological functions. Isoform 1 is a neuropeptide from the hypothalamus that binds to the G-protein-coupled galanin receptors and is required for regulation of gonadotropin-releasing hormone secretion amongst other central nervous system homeostatic processes. Isoform 2 (also known as alarin), produced by alternative splicing and sharing only the N-terminal pentapeptide with mature isoform 1, is a vasoconstrictor in the microvasculature of the skin and does not bind to G-protein-coupled galanin receptors. It also has antimicrobial activity against Gram-negative bacteria.
definition_source: "InterPro:IPR039244 abstract (PANTHER PTHR20950 is a member signature)"
