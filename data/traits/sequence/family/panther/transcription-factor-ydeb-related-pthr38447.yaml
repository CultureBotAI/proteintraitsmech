identifier: PANTHER:PTHR38447
label: "TRANSCRIPTION FACTOR YDEB-RELATED"
definition: >-
  This family of proteins includes transcription factors that interact with RNA polymerase to control ribosomal RNA transcription. Members are involved in the regulation of replication and persistence during infection in some species. They also play a role in the response to various stresses, including starvation, oxidative, and genotoxic stress, and are important for maintaining rRNA levels under normal growth conditions.
