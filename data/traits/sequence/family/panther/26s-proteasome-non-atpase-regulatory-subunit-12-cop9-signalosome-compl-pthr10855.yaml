identifier: PANTHER:PTHR10855
label: "26S PROTEASOME NON-ATPASE REGULATORY SUBUNIT 12/COP9 SIGNALOSOME COMPLEX SUBUNIT 4"
definition: >-
  The 26S proteasome consists of a 20S proteolytic core particle (CP) and a 19S regulatory particle (RP). The RP can be further divided into two subcomplexes, the base that directly associates with the CP and a peripheral lid. The RP lid is structurally similar to the COP9 signalosome (CSN). The core CSN subunits (CSN4/5/7/6) show a remarkable one-to-one sequence correspondence with those of the RP lid (RPN5/11/9/8), suggesting a common ancestry and architecture. This family includes the 26S Proteasome non-ATPase regulatory subunit 12 (PSMD12 or RPN5), a component of the 26S proteasome lid, and the COP9 signalosome subunit 4.
definition_source: "InterPro:IPR040134 abstract (PANTHER PTHR10855 is a member signature)"
