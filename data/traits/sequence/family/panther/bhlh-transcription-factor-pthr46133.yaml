identifier: PANTHER:PTHR46133
label: "BHLH TRANSCRIPTION FACTOR"
definition: >-
  This family represents a group of plant transcription factors, including ILR3 (also known as AtbHLH105) and its closest homologues bHLH34, bHLH104 and bHLH115 from Arabidopsis. These transcription factors can form homo- and heterodimers and are involved in the positive regulation of Fe homeostasis by directly activating bHLH38, bHLH39, bHLH100, and bHLH101 expression. ILR3 can also act as a transcriptional repressor when interacting with POPEYE (PYE)/bHLH47, which plays a negative role in the Fe deficiency responses. bHLH34 and bHLH104 are also involved in the glucose-mediated and ABA signalling pathways.
definition_source: "InterPro:IPR044818 abstract (PANTHER PTHR46133 is a member signature)"
