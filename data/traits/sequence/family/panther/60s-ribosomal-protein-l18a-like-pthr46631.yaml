identifier: PANTHER:PTHR46631
label: "60S RIBOSOMAL PROTEIN L18A-LIKE"
definition: >-
  This entry includes eL20z, which may be a non-functional duplication of the RPL18AA gene (encodes 60S ribosomal protein L18a-1). It has been suggested to be a pseudogene, RNA seq evidence shows that this protein is transcribed.
