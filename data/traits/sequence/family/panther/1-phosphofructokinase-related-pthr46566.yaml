identifier: PANTHER:PTHR46566
label: 1-PHOSPHOFRUCTOKINASE-RELATED
definition: >-
  This entry represents a family of hexose kinases that includes the tagatose-6-kinases from the carbohydrate kinase PfkB family (LacC subfamily), 1-phosphofructokinases and 6-phosphofructokinases isozyme 2 from the carbohydrate kinase PfkB family. Tagatose-6-phosphate kinase (EC:2.7.1.144) is part of the tagatose-6-phosphate pathway of lactose degradation. Fructose 1-phosphate kinase (also known as 1-phosphofructokinase) acts in concert with the fructose-specific phosphotransferase system (PTS), which phosphorylates fructose during transport to fructose-1-phosphate. The action of 1-phosphofructokinase results in beta-D-fructose-1,6-bisphosphate and is an entry point into glycolysis (GenProp:GenProp0688).
definition_source: "InterPro:IPR017583 abstract (PANTHER PTHR46566 is a member signature)"
