identifier: PANTHER:PTHR22951
label: "CLATHRIN ASSEMBLY PROTEIN"
definition: >-
  Clathrin mediated endocytosis (CME) is a transmembrane cargo and ligand internalisation process that uses a clathrin coat to form vesicles. During this process, clathrin needs to be connected to the membrane through adapter proteins, such as the main adapter AP2 (adapter protein complex 2) and AP180. AP180 assembles clathrin faster than any other protein examined in vitro. Mammalian AP180 is only detectable in neurons, where it is strongly enriched within pre-synaptic boutons. It has been shown that synapses with mutated or disrupted AP180 fail to produce a sufficient number of synaptic vesicles. This entry includes AP180 and related proteins.
definition_source: "InterPro:IPR045192 abstract (PANTHER PTHR22951 is a member signature)"
