identifier: PANTHER:PTHR23290
label: "RRNA N6-ADENOSINE-METHYLTRANSFERASE METTL5"
definition: >-
  The protein family includes enzymes involved in the modification of rRNA and the biosynthesis of branched-chain polyamines. Members of the family that act as rRNA N6-adenosine-methyltransferases function as catalytic subunits in heterodimers with TRMT112 or similar proteins, specifically methylating adenine in 18S rRNA, which is crucial for translation and cellular processes such as pluripotency and differentiation in embryonic stem cells. Other members are involved in the biosynthesis of branched-chain polyamines, supporting thermophilic growth at high temperatures by catalyzing the condensation of spermidine with aminopropyl groups from decarboxylated S-adenosylmethionines to produce N(4)-bis(aminopropyl)spermidine and related compounds.
