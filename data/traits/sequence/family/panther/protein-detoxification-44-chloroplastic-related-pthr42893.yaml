identifier: PANTHER:PTHR42893
label: "PROTEIN DETOXIFICATION 44, CHLOROPLASTIC-RELATED"
definition: >-
  Escherichia coli DinF is a membrane protein that has been found to protect cells against oxidative stress and bile salts. The expression of DinF is regulated as part of the SOS system. It may act by detoxifying oxidizing molecules that have the potential to damage DNA. Some member of this family have been reported to enhance the virulence of plant pathogenic bacteria by enhancing their ability to grow in the presence of toxic compounds. This entry also includes DETOXIFICATION 42-47 (DTX42-47) from Arabidopsis. DTX42 (also known as AtMATE) is a citrate transporter critical for aluminum tolerance. DTX43 is a citrate transporter responsible for loading citrate into xylem tissues, which helps facilitate iron transport to shoots. In general, proteins from the MATE family are involved in exporting metabolites across the cell membrane and are often responsible for multidrug resistance (MDR). These proteins mediate resistance to a wide range of cationic dyes, fluroquinolones, aminoglycosides and other structurally diverse antibodies and drugs. MATE proteins are found in bacteria, archaea and eukaryotes. These proteins are predicted to have 12 α-helical transmembrane regions, some of the animal proteins may have an additional C-terminal helix.
definition_source: "InterPro:IPR044644 abstract (PANTHER PTHR42893 is a member signature)"
