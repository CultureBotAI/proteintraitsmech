definitions:
  - kind: GENERAL
    text: >-
      TONSOKU-LIKE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46358. and participate in replication fork processing, double-strand break repair, double-strand break repair via homologous recombination. and localise to membrane-enclosed lumen, non-membrane-bounded organelle, nuclear replication fork.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the maintenance of genome integrity during DNA replication by promoting homologous recombination-mediated repair of double-strand breaks at stalled or collapsed replication forks. Members of this family are components of the MMS22L-TONSL complex, which is essential for the assembly of RAD51 filaments on single-stranded DNA, a critical step in the homologous recombination process. These proteins act as histone readers, recognizing and binding newly synthesized histones, particularly unmodified histone H4 at Lys-20 and histone H3.1. They are recruited to double-strand breaks after histone replacement by histone chaperones and the eviction of the replication protein A complex from these sites, facilitating the recruitment of RAD51 and subsequent DNA repair.
    source: "InterPro:IPR052311 abstract (LLM-generated, not curator-reviewed)"
