  - kind: GENERAL
    text: >-
      This family of proteins is involved in the transport of specific substrates across cellular membranes. Members are likely part of an ABC transporter complex that confers resistance to certain compounds, such as the antibiotic doxorubicin. These proteins are thought to play a key role in the translocation process of the substrate, moving it from one side of the membrane to the other, which is a critical function in the resistance mechanism.
