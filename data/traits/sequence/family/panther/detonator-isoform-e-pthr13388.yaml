identifier: PANTHER:PTHR13388
label: "DETONATOR, ISOFORM E"
definition: >-
  The transmembrane protein 132 family (TMEM132) consists of TMEM132A, TMEM132B, TMEM132C, TMEM132D, TMEM132E. These are transmembrane proteins that regulate neuronal structure and function. In mammalian cells, they may regulate NAP1 in the WAVE regulatory complex (WRC) to finely modulate actin nucleation, cellular cytoskeletal and morphological changes. TMEM132 members have been associated with panic disorders, anxiety and major depressive disorders. TMEM132A may play a role in embryonic and postnatal development of the brain. It increased resistance to cell death induced by serum starvation in cultured cells. It regulates cAMP-induced GFAP gene expression via STAT3 phosphorylation. These proteins consist of six globular domains: N-terminal InterPro:IPR031435, 2nd InterPro:IPR055422, 3rd InterPro:IPR055421, 4th InterPro:IPR031437, 5th InterPro:IPR055423 and 6th InterPro:IPR055424. The latter three are a tandem of Ig-like domains. InterPro:IPR031436 represents the C-terminal region which includes a single transmembrane helix.
