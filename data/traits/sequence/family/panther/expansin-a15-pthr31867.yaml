identifier: PANTHER:PTHR31867
label: EXPANSIN-A15
definition: >-
  Expansins are unusual proteins that mediate cell wall extension in plants. They are believed to act as a sort of chemical grease, allowing polymers to slide past one another by disrupting non-covalent hydrogen bonds that hold many wall polymers to one another. This process is not degradative and hence does not weaken the wall, which could otherwise rupture under internal pressure during growth. Sequence comparisons indicate at least four distinct expansin cDNAs in rice and at least six in Arabidopsis thaliana. The proteins are highly conserved in size and sequence (75-95% amino acid sequence similarity between any pairwise comparison), and phylogenetic trees indicate that this multigene family formed before the evolutionary divergence of monocotyledons and dicotyledons. Sequence and motif analyses show no similarities to known functional domains that might account for expansin action on wall extension. It is thought that several highly-conserved tryptophans may function in expansin binding to cellulose, or other glycans. The high conservation of the family indicates that the mechanism by which expansins promote wall extensin tolerates little variation in protein structure.
