  - kind: GENERAL
    text: >-
      This family of proteins facilitates the transport of water and small neutral solutes across cell membranes, ensuring intracellular homeostasis in various organs such as the liver, kidney, and brain. Members of this family are involved in maintaining endoplasmic reticulum homeostasis, particularly under stress conditions, by regulating redox balance through the transport of hydrogen peroxide. This function is crucial for managing oxidative stress and maintaining an environment conducive to protein folding and translation within the endoplasmic reticulum. Additionally, these proteins play a role in kidney development and function, including the regulation of endosomal acidification in the proximal tubule. Some members may also be involved in the glycosylation processing of PKD1, which affects its membrane trafficking and prevents the accumulation of unfolded proteins in the endoplasmic reticulum.
    source: "InterPro:IPR051883 abstract (LLM-generated, not curator-reviewed)"
