definitions:
  - kind: GENERAL
    text: >-
      MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 12 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46007. PANTHER protein class: RNA metabolism protein, general transcription factor. Members are annotated with the molecular function transcription coactivator activity, transcription regulator activity, transcription coregulator activity. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, positive regulation of RNA biosynthetic process. and localise to mediator complex, protein-containing complex, nuclear protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Mediator complex subunit 12 family comprises proteins that are integral components of the Mediator complex, serving as coactivators in the regulated transcription of RNA polymerase II-dependent genes. These proteins act as bridges, relaying information from gene-specific regulatory proteins to the basal transcription machinery. They are involved in the recruitment of the Mediator complex to gene promoters, facilitating the assembly of a functional preinitiation complex with RNA polymerase II and general transcription factors. Members of this family may specifically regulate transcription in pathways such as Wnt signaling and SHH signaling. They play roles in various developmental processes, including body axis formation, brain, ear, kidney, limb development, neural crest formation, pigmentation, and vulval induction. Additionally, they are implicated in asymmetric cell division and hypodermal development.
    source: "InterPro:IPR051647 abstract (LLM-generated, not curator-reviewed)"
