identifier: PANTHER:PTHR47138
label: PERILIPIN-1
definition: >-
  Perilipin-1 (PLIN1) localizes at the surface of lipid droplets to regulate triglyceride storage and hydrolysis in adipocytes. It interacts with the CIDE-N domain of Fsp27 and increases Fsp27-mediated lipid exchange, lipid transfer and lipid droplet growth. Plin1 defect leads to low adiposity in mice and partial lipodystrophy in human.
