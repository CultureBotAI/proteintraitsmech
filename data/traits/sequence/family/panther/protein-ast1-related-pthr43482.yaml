  - kind: GENERAL
    text: >-
      This family of proteins includes members that are associated with lipid rafts and are involved in the targeting and transport of specific proteins from the Golgi to the plasma membrane. Some family members may also facilitate the clustering of these target proteins, which is important for their incorporation into lipid rafts and subsequent transport to the cell surface. Additionally, certain proteins within this family are characterized by the presence of a zinc-containing alcohol dehydrogenase domain, suggesting a role in enzymatic activities related to quinone oxidoreductase functions within the mitochondrial context.
