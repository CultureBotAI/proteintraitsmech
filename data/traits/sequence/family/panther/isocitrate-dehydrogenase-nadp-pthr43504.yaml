identifier: PANTHER:PTHR43504
label: "ISOCITRATE DEHYDROGENASE [NADP]"
definition: >-
  Bacterial isocitrate dehydrogenases (IDHs) (EC:1.1.1.42) can be classified into two types on the basis of their subunit structure. One is a homodimer, consisting of subunits of about 40-45kDa, which exists in many bacterial species, including Escherichia coli. The other is a monomer with a molecular mass of 80-100kDa, which has been reported in several bacteria, including Azotobacter vinelandii, Vibrio parahaemolyticus and Corynebacterium glutamicum. Although bacterial monomeric and dimeric IDHs catalyse the same reaction, homology of amino acid sequence is hardly found between both types of IDHs.
definition_source: "InterPro:IPR004439 abstract (PANTHER PTHR43504 is a member signature)"
