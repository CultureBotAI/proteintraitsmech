  - kind: GENERAL
    text: >-
      This family of proteins includes phosphatase 2C-like enzymes, which are characterized by their ability to dephosphorylate serine and threonine residues in target substrates. These enzymes play a crucial role in various cellular processes, including cell cycle regulation, stress response, and signal transduction pathways. They function as Mg2+ or Mn2+-dependent enzymes and are involved in the negative regulation of cellular processes by counteracting the action of kinases. The PP2C-like domain is responsible for the catalytic activity of these proteins.
    source: "InterPro:IPR053287 abstract (LLM-generated, not curator-reviewed)"
