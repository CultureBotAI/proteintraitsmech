identifier: PANTHER:PTHR13410
label: "PROTEIN PBDC1"
definition: >-
  This entry represents the family of protein PBDC1 (polysaccharide biosynthesis domain-containing protein 1). Proteins in this entry are from fungi and animals. The budding yeast PBDC1 homologue is known as YPL225W. Protein PBDC1 homolog from S. cerevisiae also known as Ypl225w (Chp1, Chaperone 1 for eEF1A) functions as a co-translational chaperone by forming dual interactions with the eEF1A G domain nascent chain and the UBA domain of ribosome-bound nascent polypeptide-associated complex. This protein primes the eEF1A nascent chains for binding to GTP as part of a folding mechanism which is tightly coupled to chaperone recycling.
definition_source: "InterPro:IPR008476 abstract (PANTHER PTHR13410 is a member signature)"
