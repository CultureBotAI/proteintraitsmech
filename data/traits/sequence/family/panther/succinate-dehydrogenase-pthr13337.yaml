identifier: PANTHER:PTHR13337
label: "SUCCINATE DEHYDROGENASE"
definition: >-
  This family consists of mitochondrial succinate dehydrogenase [ubiquinone] cytochrome b small subunit CybS (also known an SQR) and import inner membrane translocase subunit Tim18. Members of this subfamily are classified as Type C SQRs because they contain two transmembrane subunits and one heme group. CybS and CybL are the two transmembrane proteins of eukaryotic SQRs. They contain heme and quinone binding sites. CybS is the eukaryotic homologue of the bacterial SdhD subunit. CybS is a membrane-anchoring subunit of succinate dehydrogenase (SDH) that is involved in complex II of the mitochondrial electron transport chain and is responsible for transferring electrons from succinate to ubiquinone (coenzyme Q). CybS is composed of a flavoprotein catalytic subunit, an iron-sulfur protein and one or two hydrophobic transmembrane subunits. The two-electron oxidation of succinate in the flavoprotein active site is coupled to the two-electron reduction of quinone in the transmembrane subunits via electron transport through FAD and three iron-sulfur centres. The reversible reduction of quinone is an essential feature of respiration, allowing transfer of electrons between respiratory complexes. Mutations in human Complex II result in various physiological disorders including hereditary paraganglioma and pheochromocytoma tumors. The gene encoding for the SdhD subunit is classified as a tumor suppressor gene. In Saccharomyces cerevisiae, Tim18 is a component of the TIM22 complex, a complex that mediates the import and insertion of multi-pass transmembrane proteins into the mitochondrial inner membrane. The TIM22 complex forms a twin-pore translocase that uses the membrane potential as external driving force. Its role in the complex is unclear but it may be involved in the assembly
