identifier: PANTHER:PTHR34444
label: LOC361192
definition: >-
  This family of proteins is found in animals, including the cilia- and flagella-associated protein 90 (CFAP90) from human, which has been recently identified as a microtubule inner protein (MIP) part of the dynein-decorated doublet microtubules (DMTs) in cilia axoneme, which is required for motile cilia beating.
