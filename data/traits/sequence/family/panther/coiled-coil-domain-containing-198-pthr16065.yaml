identifier: PANTHER:PTHR16065
label: "COILED-COIL DOMAIN CONTAINING 198"
definition: >-
  This entry represents the metazoan family of proteins called FAME. Proteins in this family are typically between 128 and 299 amino acids in length. Knockout experiments link FAME to altered body weight and energy expenditure. FAME is a kidney-enriched, membrane-bound protein, influencing albumin levels in urine and ferritin in blood.
