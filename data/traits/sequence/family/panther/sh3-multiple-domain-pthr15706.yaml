identifier: PANTHER:PTHR15706
label: "SH3 MULTIPLE DOMAIN"
definition: >-
  The protein family is involved in the regulation of reactive oxygen species (ROS) generation and localization, particularly through the activation of NADPH oxidases (NOXs). Members of this family serve as organizer proteins that potentiate the superoxide-generating activity of NOX1 and NOX3, and are essential for the assembly and/or activation of the NADPH-oxidase complex, which is responsible for the oxidative burst in phagocytes. This burst is crucial for superoxide production and the immune response. Additionally, some members are required for the biogenesis of otoconia/otolith, which are important for the perception of gravity in the inner ear. Others are involved in invadopodia and podosome formation, extracellular matrix degradation, and may play a role in cell polarity, morphogenesis, and the neurotoxic effects of amyloid-beta peptide. The family is characterized by the presence of PX domains, which mediate lipid-binding and membrane localization, and SH3 domains, which facilitate interactions with other proteins.
