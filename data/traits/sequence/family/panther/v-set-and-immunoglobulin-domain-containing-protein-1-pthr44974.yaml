identifier: PANTHER:PTHR44974
label: "V-SET AND IMMUNOGLOBULIN DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  V-set and immunoglobulin domain-containing protein 1 (VSIG1, also konwn as A34) belongs to the immunoglobulin superfamily (IgSF), whose members have one or more Ig-like domains in the extracellular region that is implicated in cell-cell adhesion, a transmembrane domain, and one cytoplasmic C-terminal region. VSIG1 is required for the proper differentiation of glandular gastric epithelia.
