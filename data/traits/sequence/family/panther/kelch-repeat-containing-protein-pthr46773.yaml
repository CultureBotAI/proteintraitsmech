  - kind: GENERAL
    text: >-
      This family of proteins features the kelch motif, which typically forms a beta-propeller structure. These structures are known to mediate a variety of protein-protein interactions. Members of this family are involved in diverse cellular processes, including but not limited to, cytoskeleton organization, cellular morphology, and signal transduction pathways. The kelch repeat-containing proteins may act as scaffolds that assemble key components of a signaling pathway or as regulators of protein degradation. They are also implicated in the response to oxidative stress and in the modulation of transcription factors. Given the presence of the kelch repeats, these proteins may interact with actin and influence the cytoskeleton dynamics.
