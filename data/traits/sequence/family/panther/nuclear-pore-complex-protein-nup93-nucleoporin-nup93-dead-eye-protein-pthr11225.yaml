identifier: PANTHER:PTHR11225
label: "NUCLEAR PORE COMPLEX PROTEIN NUP93  NUCLEOPORIN NUP93   DEAD EYE PROTEIN"
definition: >-
  Nup93/Nic96 is a component of the nuclear pore complex. It is required for the correct assembly of the nuclear pore complex. In Saccharomyces cerevisiae, Nic96 has been shown to be involved in the distribution and cellular concentration of the GTPase Gsp1. The structure of Nic96 has revealed a mostly α helical structure.
