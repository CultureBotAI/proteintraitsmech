definition: >-
  This entry includes protein BRANCHLESS TRICHOME (BLT, At1g64690) and At5g41620 from Arabidopsis. BLT is a regulator of trichome branching. It interacts with STICHEL, another key regulator of trichome branching. The function of At5g41620 is not clear.
