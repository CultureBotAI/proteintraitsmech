identifier: PANTHER:PTHR43538
label: "ALPHA-IPM SYNTHASE/HOMOCITRATE SYNTHASE"
definition: >-
  (R)-citramalate synthase catalyses the condensation of pyruvate and acetyl-coenzyme A to form (R)-citramalate, the first dedicated step in the citramalate pathway. The citramalate pathway constitutes the main pathway for isoleucine biosynthesis in Geobacter sulfurreducens.
