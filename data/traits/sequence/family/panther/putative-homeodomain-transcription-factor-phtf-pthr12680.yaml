identifier: PANTHER:PTHR12680
label: "PUTATIVE HOMEODOMAIN TRANSCRIPTION FACTOR  PHTF"
definition: >-
  This entry represents a group of homeodomain containing proteins from animals, including PHTF1/2 from mammals. In rat PHTF1 is an integral membrane protein abundantly expressed in testis. It is localised in the endoplasmic reticulum saccules applied to the trans face of the Golgi system.
