identifier: PANTHER:PTHR28028
label: "60S RIBOSOMAL SUBUNIT ASSEMBLY/EXPORT PROTEIN LOC1"
definition: >-
  Loc1 is required for efficient assembly and nuclear export of the 60S ribosomal subunit. These proteins localise to the nucleolus and are involved in ribosome biogenesis. Budding yeast Loc1 recognizes double-stranded RNA structures and is required for efficient localization of ASH1 mRNA.
definition_source: "InterPro:IPR037650 abstract (PANTHER PTHR28028 is a member signature)"
