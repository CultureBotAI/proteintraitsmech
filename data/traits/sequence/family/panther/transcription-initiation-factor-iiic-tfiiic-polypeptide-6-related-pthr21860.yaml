identifier: PANTHER:PTHR21860
label: "TRANSCRIPTION INITIATION FACTOR IIIC TFIIIC , POLYPEPTIDE 6-RELATED"
definition: >-
  This entry includes TFIIIC subunit GTF3C6 (also known as TFIIIC35) from animals. Human TFIIIC35 does not contain the phosphoglycerate mutase domain of its yeast counterpart. TFIIIC is required for transcription of tRNA and 5 S RNA genes by RNA polymerase III.
