identifier: PANTHER:PTHR43865
label: RUBRERYTHRIN-RELATED
definition: >-
  This family of proteins includes rubrerythrin from Porphyromonas gingivalis, Clostridium perfringens and related sequences from bacteria and archaea. Rubrerythrin is involved in cellular defense mechanisms against oxidative stress. Members of this family are known to catalyse the reduction of hydrogen peroxide, thereby protecting the cell from the damaging effects of reactive oxygen species. Some proteins within this family, such as rubrerythrin-1 from Clostridium acetobutylicum, function as part of an NADH peroxidase system, utilizing electron transport intermediaries to facilitate the reduction of hydrogen peroxide using NADH as an electron donor. The activity of certain family members is enhanced by the presence of rubredoxin, which acts as an electron-transfer shuttle in the catalytic process.
definition_source: "InterPro:IPR052364 abstract (PANTHER PTHR43865 is a member signature)"
