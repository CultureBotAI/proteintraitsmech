  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in carbohydrate metabolism, specifically in the phosphorylation of various sugar derivatives. Members of this family are known to catalyze the phosphorylation of 2-keto-3-deoxy sugars, playing a role in different metabolic pathways. Some enzymes in this family are involved in galactose catabolism, converting 2-keto-3-deoxygalactonate to its phosphorylated form, while others participate in the semi-phosphorylative Entner-Doudoroff pathway, phosphorylating 2-keto-3-deoxygluconate. The catalytic efficiency and substrate specificity can vary among family members, with some showing a preference for specific substrates over others.
    source: "InterPro:IPR052700 abstract (LLM-generated, not curator-reviewed)"
