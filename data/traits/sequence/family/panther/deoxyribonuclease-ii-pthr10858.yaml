identifier: PANTHER:PTHR10858
label: "DEOXYRIBONUCLEASE II"
definition: >-
  Deoxyribonuclease II (EC:3.1.22.1) hydrolyses DNA under acidic conditions with a preference for double-stranded DNA typically found in lysosomes in higher eukaryotes. It is also found in a few genera of bacteria in which it is believed to have arisen via horizontal transfer. It catalyses the endonucleolytic cleavage of DNA to 3'-phosphomononucleotide and 3'-phosphooligonucleotide end-products. The enzyme may play a role in apoptosis. This family also includes hypothetical proteins from Caenorhabditis elegans.
