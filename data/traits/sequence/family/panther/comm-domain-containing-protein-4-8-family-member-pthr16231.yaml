identifier: PANTHER:PTHR16231
label: "COMM DOMAIN-CONTAINING PROTEIN 4-8 FAMILY MEMBER"
definition: >-
  This entry includes COMM domain-containing proteins 4/6/7/8 (COMMD4/6/7/8), which may modulate the activity of cullin-RING E3 ubiquitin ligase (CRL) complexes. COMM (copper metabolism gene MURR1) domain proteins constitute a family initially identified as interacting partners of COMMD1 (previously known as MURR1), the prototype member of this protein family. COMMD1 is a multifunctional protein that has been shown to participate in two apparently distinct activities, regulation of the transcription factor NF-kappa-B and control of copper metabolism. The family is defined by the presence of a C-terminal motif termed COMM domain, which functions as an interface for protein-protein interactions. The proteins designated as COMMD or COMM domain containing 1-10 are extensively conserved in multicellular eukaryotic organisms.
definition_source: "InterPro:IPR047155 abstract (PANTHER PTHR16231 is a member signature)"
