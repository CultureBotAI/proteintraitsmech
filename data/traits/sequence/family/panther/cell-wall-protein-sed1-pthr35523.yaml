identifier: PANTHER:PTHR35523
label: "CELL WALL PROTEIN SED1"
definition: >-
  Sed1 is a major structural GPI-cell wall glycoprotein from Saccharomyces cerevisiae. It may have a possible role in mitochondrial genome maintenance. This family also includes Sed1 paralogue, Spi1, a cell wall protein that plays a role in resistance to cell wall stress, and related proteins from fungi.
