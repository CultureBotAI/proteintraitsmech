  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that mitigate oxidative stress by catalyzing the conversion of superoxide radicals into less harmful hydrogen peroxide, which can then be further processed into water. These enzymes are characterized by their ability to bind copper ions and function without zinc, which is atypical for superoxide dismutases. Their unique structure allows them to operate effectively in environments where zinc and copper availability is limited, such as at the host-pathogen interface. Additionally, these enzymes play a role in the survival of fungal persisters within biofilms by degrading reactive oxygen species, aiding in evasion of the host's immune response and contributing to antifungal resistance.
    source: "InterPro:IPR053257 abstract (LLM-generated, not curator-reviewed)"
