identifier: PANTHER:PTHR47655
label: "QUINIC ACID UTILIZATION ACTIVATOR"
definition: >-
  QUINIC ACID UTILIZATION ACTIVATOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47655. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function DNA-binding transcription factor activity. Subfamilies participate in positive regulation of transcription by RNA polymerase II.
