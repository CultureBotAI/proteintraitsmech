identifier: PANTHER:PTHR15467
label: "ZINC-FINGERS AND HOMEOBOXES RELATED"
definition: >-
  ZINC-FINGERS AND HOMEOBOXES RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15467. PANTHER protein class: homeodomain transcription factor, helix-turn-helix transcription factor. Members are annotated with the molecular function DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of gene expression, regulation of DNA-templated transcription, regulation of cellular process. Members localise to nucleus, intracellular membrane-bounded organelle, intracellular organelle.
