identifier: PANTHER:PTHR30038
label: "ALDEHYDE FERREDOXIN OXIDOREDUCTASE"
definition: >-
  This family of proteins includes enzymes that are involved in the oxidative decarboxylation of aldehydes into their corresponding carboxylic acids, utilising ferredoxin as an electron acceptor. Members of this family are characterised by the presence of tungsten in their active sites and are known to participate in various metabolic pathways, including glycolysis and gluconeogenesis. Some act in lieu of more common enzymes such as glyceraldehyde-3-phosphate dehydrogenase and phosphoglycerate kinase, while others are involved in the fermentation of peptides. The activity of these enzymes is modulated by various compounds, with some enhancing and others inhibiting their function. They are sensitive to oxygen and can be inhibited by substances like arsenite, iodoacetate, and cyanide.
