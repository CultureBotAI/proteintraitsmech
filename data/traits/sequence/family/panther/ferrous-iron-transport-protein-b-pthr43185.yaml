    method: GENERATED
  - kind: GENERAL
    text: >-
      The FeoB GTPase family is comprised of proteins that function primarily as transporters for the uptake of ferrous iron (Fe(2+)) across the cell inner membrane into the cytoplasm. These transporters are GTP-driven, coupling GTP-binding and hydrolysis to channel opening and Fe(2+) uptake. The GTPase activity involves a guanine nucleotide-binding site that undergoes conformational changes between active GTP-bound and inactive GDP-bound states. This conformational shift is thought to be essential for the function of the transporter, potentially regulating the opening and closing of the channel for iron transport. Some family members may also be involved in manganese uptake rather than iron. The family belongs to the TRAFAC class TrmE-Era-EngA-EngB-Septin-like GTPase superfamily and plays a crucial role in bacterial iron homeostasis, which is vital for various cellular processes, including growth and survival in iron-restricted environments.
    source: "InterPro:IPR050860 abstract (LLM-generated, not curator-reviewed)"
