  - kind: GENERAL
    text: >-
      FERROUS IRON TRANSPORT PROTEIN B — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43185. PANTHER protein class: transfer/carrier protein. Members are annotated with the molecular function metal ion transmembrane transporter activity. and localise to cell periphery, cellular anatomical entity, membrane.
