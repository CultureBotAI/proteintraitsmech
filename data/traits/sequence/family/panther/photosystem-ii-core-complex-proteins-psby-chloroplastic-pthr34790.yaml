identifier: PANTHER:PTHR34790
label: "PHOTOSYSTEM II CORE COMPLEX PROTEINS PSBY, CHLOROPLASTIC"
definition: >-
  This entry represents photosystem II core complex protein psbY from plants. In higher plants, two related PsbY proteins exist, PsbY-1 and PsbY-2, which appear to function as a heterodimer. In spinach and Arabidopsis, these two proteins arise from a single-copy nuclear gene that is processed in the chloroplast. PsbY has two low manganese-dependent activities: a catalase-like activity and an L-arginine metabolising activity that converts L-arginine into ornithine and urea.
