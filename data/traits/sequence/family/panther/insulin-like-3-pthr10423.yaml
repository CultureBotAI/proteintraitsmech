identifier: PANTHER:PTHR10423
label: "INSULIN-LIKE 3"
definition: >-
  This entry includes insulin-like 3 from mammals and insulin-like peptide 4 (Ilp4 or dILP4) from fruit flies. Insulin-like 3 (INSL3) is a secreted protein produced by testicular Leydig cells and in lower amounts by ovarian follicular theca interna cells and the corpus luteum. It acts as a theca cell-derived growth factor for preantral follicle and its action is mediated by growth differentiation factor 9. Signaling through INSL3 and its cognate G protein-coupled receptor RXFP2 is important for testicular descent. It seems to be dispensable for spermatogenesis and fertility in adult males. The function of Ilp4 is not clear.
