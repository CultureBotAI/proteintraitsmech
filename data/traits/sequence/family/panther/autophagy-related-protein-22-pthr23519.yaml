identifier: PANTHER:PTHR23519
label: "AUTOPHAGY-RELATED PROTEIN 22"
definition: >-
  The ATG22 and LtaA protein families are involved in distinct cellular processes. The ATG22 family proteins function as vacuolar effluxers, mediating the efflux of amino acids from autophagic degradation, which is crucial for maintaining protein synthesis and cell viability during nitrogen starvation. They play a key role in autophagy, a cellular degradation pathway. On the other hand, the LtaA family proteins are proton-coupled antiporter flippases that catalyze the translocation of lipid-linked disaccharides, which anchor lipoteichoic acids to the cell membrane. This process is selective and essential for bacterial cell wall integrity and survival under acidic conditions during infection.
