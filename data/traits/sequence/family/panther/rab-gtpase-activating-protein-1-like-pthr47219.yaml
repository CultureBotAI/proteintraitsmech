  - kind: GENERAL
    text: >-
      This family of proteins includes GTPase-activating proteins (GAPs) that regulate the activity of Rab GTPases, which are key regulators of intracellular membrane trafficking. Members of this family are involved in various cellular processes such as autophagosome formation, cell cycle progression, cytokinesis, endocytosis, and vesicular transport. They function by accelerating the hydrolysis of GTP bound to Rab proteins, converting them from an active GTP-bound state to an inactive GDP-bound state. This action is critical for the control of vesicle budding, transport, and fusion events within the cell. The proteins typically contain TBC domains and may interact with specific Rab GTPases, influencing processes like microtubule nucleation, glucose uptake, and cell migration.
    source: "InterPro:IPR050302 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
