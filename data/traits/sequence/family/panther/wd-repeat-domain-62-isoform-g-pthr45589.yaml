identifier: PANTHER:PTHR45589
label: "WD REPEAT DOMAIN 62, ISOFORM G"
definition: >-
  This family of proteins includes WD repeat-containing protein 62 (WDR62), a microcephaly-related, microtubule (MT)-associated protein (MAP) that localises to the spindle pole and regulates spindle organisation by recruiting katanin to the spindle pole by forming a complex with TPX2/Aurora A. It has been suggested to be an adaptor protein between its recruiting factor TPX2/Aurora A and the effector katanin to orchestrate the regulation of spindle dynamics. The microtubule-binding affinity of WDR62 is autoinhibited through JNK phosphorylation-induced intramolecular interaction. It is implicated in the development of the cerebral cortex, influencing both the proliferation and migration of neurons. Additionally, these proteins are involved in the duplication of centrioles, specifically the mother-centriole-dependent process. This function appears to be mediated through the formation of a complex at the centrosome, which sequentially incorporates CEP152, CDK5RAP2, and CEP63, and ultimately recruits CDK2, an enzyme essential for the duplication of centrioles.
