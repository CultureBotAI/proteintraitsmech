identifier: PANTHER:PTHR33801
label: "ABSCISIC STRESS-RIPENING PROTEIN 5"
definition: >-
  This is a family of plant proteins induced by water deficit stress (WDS), or abscisic acid (ABA) stress and ripening. The Ip3 cDNA clone is expressed at high levels in the roots, and is induced by ABA under WDS.
