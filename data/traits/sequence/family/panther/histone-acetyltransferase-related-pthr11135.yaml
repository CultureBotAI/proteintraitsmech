identifier: PANTHER:PTHR11135
label: "HISTONE ACETYLTRANSFERASE-RELATED"
definition: >-
  This entry includes proteins with a radical SAM domain and a radical SAM C-terminal extension domain. One such protein is elongator complex protein 3 (ELP3): the catalytic histone acetyltransferase subunit of the RNA polymerase II elongator complex, which is itself part of the RNA polymerase II (RNAPII) holoenzyme responsible for transcriptional elongation. A bacterial ELP3 homologue known as tRNA uridine(34) acetyltransferase, reflecting its role in mediating the formation of carboxymethyluridine in the wobble base at position 34 in tRNAs is also included in this family. This entry also includes protein YhcC from Escherichia coli, which binds an [4Fe-4S] cluster, coordinated with three cysteines and an exchangeable S-adenosyl-L-methionine. YhcC cleaves S-adenosyl-L-methionine into methionine and 5'-deoxyadenosine. This entry also includes archaeosine synthase subunit beta (RaSEA) from archaea, it is a SAM enzyme which plays a role in the synthesis of archaeosine. Uncharacterised homologues are known from bacteria, archaea and eukaryotes. ELP3 is required for the complex integrity and for the association of the complex with nascent RNA transcript. ELP3 is thought to act as a highly conserved histone acetyltransferase (HAT) capable of acetylating core histones in vitro, however, it is clearly a multi-domain protein. The HAT activity is thought to be present only in the C-terminal GNAT domain (histone acyltransferase domain). Studies suggest that both the histone acetyltransferase and radical S-adenosylmethionine domains are essential for function, although the exact role of the Radical SAM domain is still unclear. The radical SAM domain is important for the structural integrity of the protein complex, as in yeast (previously demonstrated). However, an alternative may be
