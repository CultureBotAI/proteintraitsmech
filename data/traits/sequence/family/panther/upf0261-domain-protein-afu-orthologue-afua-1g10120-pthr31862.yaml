  - kind: GENERAL
    text: >-
      The UPF0261 family includes proteins that function as inhibitors of viral RNA replication, conferring resistance to various tobamoviruses. Members of the family interfere with the replication process by disrupting the association of tobamovirus replication proteins with host membrane-associated proteins, thereby preventing the formation of the replication complex necessary for viral negative-strand RNA synthesis. Specific proteins within the family have been shown to inhibit tobamoviruses such as tobacco mild green mosaic virus, pepper mild mottle virus, and certain strains of tomato mosaic virus and tobacco mosaic virus.
    source: "InterPro:IPR051353 abstract (LLM-generated, not curator-reviewed)"
