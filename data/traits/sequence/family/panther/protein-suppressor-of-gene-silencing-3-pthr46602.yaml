identifier: PANTHER:PTHR46602
label: "PROTEIN SUPPRESSOR OF GENE SILENCING 3"
definition: >-
  This entry represents a group of plant proteins, including Protein SUPPRESSOR OF GENE SILENCING 3 (SGS3) from Arabidopsis. Post-transcriptional gene silencing (PTGS) in plants requires at least two proteins-SGS3 and MET1 (a DNA-methyltransferase). SGS3 is required for juvenile development and the production of trans-acting siRNAs. SGS3 is also involved in a mechanism for plant resistance to viruses.
