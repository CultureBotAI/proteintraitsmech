identifier: PANTHER:PTHR46269
label: EPIPHYCAN-RELATED
definition: >-
  Proteoglycans are heavily glycosylated proteins that can be divided into large hyaluronan-binding proteoglycans like aggrecan, and small proteoglycans including the small leucine-rich repeat protein (SLRP) superfamily. The SLRP family is divided into five classes (class I-V) of structurally and genetically related molecules which may play a role in the regulation of the extracellular matrix architecture. This entry includes SLRP family class III proteins, which includes mimecan, epiphycan and opticin which are characterised by a relatively low number of LRRs. Mimecan, also known as osteoglycin, induces bone formation in conjunction with TGF-beta-1 or TGF-beta-2. Its expression can be modulated by growth factors and cytokines. It may play roles in many biological processes, including cellular growth, angiogenesis, and inflammation. Epiphycan may have a role in bone formation and also in establishing the ordered structure of cartilage through matrix organisation. Opticin inhibits angiogenesis in the vitreous humor of the eye, and therefore represses neovascularization and may be involved in collagen fibre organisation via regulation of other members of the SLRP superfamily.
