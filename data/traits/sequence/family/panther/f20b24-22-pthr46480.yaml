identifier: PANTHER:PTHR46480
label: F20B24.22
definition: >-
  Voltage-gated hydrogen channel 1 (Hvcn1, also known as Hv1 or VSOP) mediates the voltage-dependent proton permeability of excitable membranes. It forms a proton-selective channel through which protons may pass in accordance with their electrochemical gradient. It is required for high-level superoxide production by phagocytes. It has also been shown to regulate human sperm motility through activating alkalization-activated calcium channels. The structure of Hvcn1 has been solved.
