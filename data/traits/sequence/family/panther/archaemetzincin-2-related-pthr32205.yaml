  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with a probable role as zinc metalloproteases. Members of this family are characterized by their ability to bind zinc, which is essential for their catalytic activity. These enzymes are likely involved in the breakdown of various peptide substrates, utilizing the metal ion to hydrolyze peptide bonds. The family is part of the peptidase M54 group, suggesting a shared evolutionary origin and similar structural features among its members. The specific biological processes and substrates for these proteases may vary, but they are generally implicated in protein turnover and regulation.
