definitions:
  - kind: GENERAL
    text: >-
      JUN TRANSCRIPTION FACTOR-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11462. PANTHER protein class: DNA-binding transcription factor, basic leucine zipper transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, transcription regulator activity, DNA-binding transcription factor activity, RNA polymerase II-specific. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of DNA-templated transcription. and localise to protein-containing complex, transcription regulator complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that recognize and bind to specific DNA motifs, such as the AP-1 consensus sequence, to regulate gene expression. Members of this family are involved in various cellular processes, including the response to growth factors, amino acid starvation, and cellular stress. They function by forming dimers, often with proteins from the FOS family, to create an AP-1 transcription complex, enhancing DNA binding and transcriptional activity. Some are implicated in cell death pathways, steroidogenic gene expression, and the response to oncogenic signals. They share a characteristic bZIP domain that mediates DNA binding and dimerization.
    source: "InterPro:IPR050946 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
