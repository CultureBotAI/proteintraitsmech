identifier: PANTHER:PTHR43726
label: "3-METHYLORNITHINE SYNTHASE"
definition: >-
  This family includes 3-methylornithine synthase (also known as pylB), which catalyzes a step in the biosynthesis pathway of pyrrolysine (isomerization of L-lysine to (2R,3R)-3-methylornithine via a radical-based mechanism) and [FeFe] hydrogenase maturase subunit HydE, which is required for the maturation of the [FeFe]-hydrogenase HydA.
definition_source: "InterPro:IPR034422 abstract (PANTHER PTHR43726 is a member signature)"
