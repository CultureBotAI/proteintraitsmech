identifier: PANTHER:PTHR31358
label: "PROTEIN WVD2-LIKE 4"
definition: >-
  In animals, Targeting Protein for Xklp2 (TPX2) is critical for mitotic spindle assembly. It has a highly conserved TPX2 central domain, an Aurora-A binding domain and a TPX2_C domain that contains a conserved pentapeptide KLEEK motif. However, in plants besides the TPX2 homologue (with three domains), several proteins were found with only the TPX2_C domain. This group of TPX2_C domain only proteins in plants has been named as WDL (or WVD2-like) proteins, as the first identified member is known as WVD2. These WDL proteins bind to microtubules; however, they have lost the function of targeting Xklp2 and were found to play roles in plant development and responses to environment cues. This entry includes WDL5/6 from Arabidopsis.
definition_source: "InterPro:IPR044833 abstract (PANTHER PTHR31358 is a member signature)"
