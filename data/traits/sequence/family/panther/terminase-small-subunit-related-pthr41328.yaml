  - kind: GENERAL
    text: >-
      The SPP1-like small terminase family is involved in the packaging of viral DNA into the procapsid of bacteriophages. Members of this family recognize specific DNA packaging sequences and regulate the ATPase activity of the terminase large subunit. The small terminase subunit, in conjunction with the large subunit, forms a complex that docks on the portal protein, creating a packaging machine. This complex facilitates the cleavage of viral genome concatemers and the subsequent packaging of DNA into the capsid. The process continues until the capsid is full, at which point the terminase complex is replaced by neck proteins to complete the assembly of the viral particle.
    source: "InterPro:IPR052404 abstract (LLM-generated, not curator-reviewed)"
