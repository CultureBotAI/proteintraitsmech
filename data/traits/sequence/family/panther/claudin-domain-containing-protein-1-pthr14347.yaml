identifier: PANTHER:PTHR14347
label: "CLAUDIN DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  The function of Claudin domain-containing protein 1 (CLDN1) is not clear. It belongs to the claudin family, which comprises four-pass transmembrane proteins involved in the formation of tight junctions (TJs).
