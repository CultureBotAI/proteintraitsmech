identifier: PANTHER:PTHR14110
label: "MITOCHONDRIAL IMPORT INNER MEMBRANE TRANSLOCASE SUBUNIT TIM22"
definition: >-
  The membrane-embedded multi-protein complexes of mitochondria mediate the transport of nuclear-encoded proteins across and into the outer or inner mitochondrial membranes. Two translocases of the inner mitochondrial membrane (TIM22 and TIM23 complexes) mediate protein transport at the inner membrane. The TIM22 complex (a twin-pore carrier translocase) catalyses the insertion of multi-spanning proteins that have internal targeting signals into the inner membrane. The TIM22 complex mediates the membrane insertion of multi-spanning inner-membrane proteins that have internal targeting signals, and it uses the membrane potential as an external driving force. The Tim22 subunit of the mitochondrial import inner membrane translocase is included in this family. Tim22 forms a hydrophilic, high-conductance channel with distinct opening states and pore diameters, that is voltage-activated and specifically responds to an internal targeting signal.
definition_source: "InterPro:IPR039175 abstract (PANTHER PTHR14110 is a member signature)"
