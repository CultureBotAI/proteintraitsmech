identifier: PANTHER:PTHR43590
label: "ARSENIC RESISTANCE PROTEIN ARSH (AFU_ORTHOLOGUE AFUA_5G15030)"
definition: >-
  Members of this protein family occur in arsenate resistance operons that include at least two different types of arsenate reductase. ArsH is not required for arsenate resistance in some systems. This family belongs to the larger family of NADPH-dependent FMN reductases (InterPro:IPR005025). ArsH from the cyanobacterium Synechocystis sp. PCC 6803 is an efficient NADPH-dependent quinone reductase.
