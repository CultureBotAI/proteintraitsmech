identifier: PANTHER:PTHR24088
label: "28S RIBOSOMAL PROTEIN S17, MITOCHONDRIAL"
definition: >-
  This entry represents the small ribosomal subunit protein uS17m (also known as 28S ribosomal protein S17) from metazoans. The mammalian mitochondrial ribosome (mitoribosome), consists of small (28S) and large (39S) subunits, is responsible for the synthesis of 13 proteins of the inner mitochondrial membrane. The 28S small subunit, contains a 12S rRNA (950 nucleotides) and 29 proteins, is much more elongated than its bacterial 30S counterpart.
