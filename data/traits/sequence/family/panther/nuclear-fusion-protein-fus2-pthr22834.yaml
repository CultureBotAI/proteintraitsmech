identifier: PANTHER:PTHR22834
label: "NUCLEAR FUSION PROTEIN FUS2"
definition: >-
  The Dynamin-binding protein family is characterized by its role as guanine nucleotide exchange factors (GEFs), primarily for CDC42, influencing various intracellular processes. Family members are involved in the organization of the actin and microtubule cytoskeleton, regulation of apical junctions, and spindle orientation in epithelial cells, contributing to lumenogenesis and ciliogenesis. Some members are implicated in membrane trafficking between the cell surface and the Golgi. Additionally, certain proteins within the family are associated with cell polarity, cytokinesis, and septum formation in yeast, as well as renal ciliogenesis and kidney development in zebrafish. The family's functions are critical for maintaining cellular structure and facilitating cell fusion during zygote formation.
