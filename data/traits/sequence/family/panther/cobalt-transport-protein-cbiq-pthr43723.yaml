definitions:
  - kind: GENERAL
    text: >-
      COBALT TRANSPORT PROTEIN CBIQ — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43723. Members participate in monoatomic cation transmembrane transport, transition metal ion transport. Members localise to ATP-binding cassette (ABC) transporter complex, membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the transport of metal ions across cellular membranes, specifically cobalt. Members of this family are components of the energy-coupling factor (ECF) transporter complex, which plays a crucial role in the uptake of cobalt ions. The complex has been shown to facilitate cobalt import when expressed in E. coli and may also have the capacity to transport nickel, albeit with much lower affinity. The function of these proteins is essential for organisms that require cobalt as a micronutrient for various biochemical processes.
    source: "InterPro:IPR052770 abstract (LLM-generated, not curator-reviewed)"
