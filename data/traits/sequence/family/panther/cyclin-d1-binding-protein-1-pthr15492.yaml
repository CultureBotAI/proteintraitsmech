identifier: PANTHER:PTHR15492
label: "CYCLIN D1-BINDING PROTEIN 1"
definition: >-
  Cyclin-D1-binding protein 1 (CCNDBP1, also known as GCIP) is a helix-loop-helix protein that may negatively regulate cell cycle progression and functions in tumour suppression. It may act, at least in part, via inhibition of the cyclin-D1/CDK4 complex, thereby preventing phosphorylation of RB1 and blocking E2F-dependent transcription. This protein has also been reported to alleviate DNA damage through the activation of the ATM-CHK2 pathway and has been proposed to be used as biomarker to detect certain cancers [, }.
