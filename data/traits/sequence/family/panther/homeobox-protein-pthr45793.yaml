identifier: PANTHER:PTHR45793
label: "HOMEOBOX PROTEIN"
definition: >-
  HOMEOBOX PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45793. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
