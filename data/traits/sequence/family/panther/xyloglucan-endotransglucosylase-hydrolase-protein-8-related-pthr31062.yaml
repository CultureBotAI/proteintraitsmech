identifier: PANTHER:PTHR31062
label: "XYLOGLUCAN ENDOTRANSGLUCOSYLASE/HYDROLASE PROTEIN 8-RELATED"
definition: >-
  This entry represents a subgroup of the glycoside hydrolase family 16. This entry includes beta-glucanases (EC:3.2.1.73) from bacteria and xyloglucan endotransglucosylase/hydrolases (XTHs, EC:2.4.1.207) from plants. This entry includes a group of xyloglucan endotransglucosylase/hydrolases (XTHs) from plants. Xyloglucan is a soluble hemicellulose with a backbone of beta-1,4-linked glucose units, partially substituted with alpha-1,6-linked xylopyranose branches. It binds noncovalently to cellulose, cross-linking the adjacent cellulose microfibrils, giving it a key structural role as a matrix polymer. XTHs catalyses xyloglucan endohydrolysis (XEH) and/or endotransglycosylation (XET) and are involved in the modification of cell wall structure by cleaving and, often, also re-joining xyloglucan molecules in primary plant cell walls. The glycosyl hydrolases family 16 (GH16) contains functionally heterogeneous members, including lichenase (EC:3.2.1.73); xyloglucan xyloglucosyltransferase (EC:2.4.1.207); agarase (EC:3.2.1.81); kappa-carrageenase (EC:3.2.1.83); endo-beta-1,3-glucanase (EC:3.2.1.39); endo-beta-1,3-1,4-glucanase (EC:3.2.1.6); endo-beta-galactosidase (EC:3.2.1.103). These enzymes share a common ancestor and have diverged significantly in their primary sequence. The GH16 catalytic domain has a classical sandwich-like β-jelly roll fold, formed by two main, closely packed and curved antiparallel β-sheets, creating a deep channel harboring the catalytic machinery. Even though the GH16 domains have now diverged significantly in their primary sequences, they all feature a common catalytic motif, E-[ILV]-D-[IVAF]-[VILMF](0,1)-E. The two glutamic acid residues in the conserved motif are the nucleophile and the general base involved in catalysis, whereas the aspartic acid re
