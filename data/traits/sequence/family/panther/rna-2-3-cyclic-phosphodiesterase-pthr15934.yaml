  - kind: GENERAL
    text: >-
      This family of proteins is involved in targeting cAMP-dependent protein kinase (PKA) to specific cellular locations, such as the membrane or cytoskeletal structures. In one context, the membrane-associated form of these proteins can reduce the activity of the epithelial sodium channel (ENaC), playing a role in sodium ion transport regulation. In its cytoplasmic form, the protein may regulate ENaC channel feedback inhibition by intracellular sodium. Additionally, some isoforms within this family may participate in the trafficking of other membrane proteins, such as aquaporin-2, to the plasma membrane, implicating a role in water transport and cellular homeostasis.
    source: "InterPro:IPR052641 abstract (LLM-generated, not curator-reviewed)"
