label: "CENTROMERE/KINETOCHORE PROTEIN ZW10"
definition: >-
  CENTROMERE/KINETOCHORE PROTEIN ZW10 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12205. PANTHER protein class: microtubule or microtubule-binding cytoskeletal protein. Members participate in mitotic spindle assembly checkpoint signaling, endoplasmic reticulum to Golgi vesicle-mediated transport, mitotic cell cycle. Members localise to kinetochore, condensed chromosome, protein-containing complex.
