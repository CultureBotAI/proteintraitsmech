definitions:
  - kind: GENERAL
    text: >-
      NADP-SPECIFIC GLUTAMATE DEHYDROGENASE 1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43571. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity. Members participate in L-amino acid biosynthetic process, proteinogenic amino acid biosynthetic process, glutamate metabolic process. Members localise to cytoplasm, cytosol.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Glu/Leu/Phe/Val dehydrogenases family includes enzymes that catalyze the reversible oxidative deamination of glutamate to alpha-ketoglutarate and ammonia, a reaction that plays a central role in nitrogen metabolism. Members of this family are primarily NADP-specific, although some can utilize both NAD and NADP as cofactors, indicating potential roles in both anabolic and catabolic pathways. The enzymes are competitively inhibited by various compounds, suggesting a regulatory role in amino acid metabolism. The family is characterized by a broad taxonomic distribution, with members found in various organisms including yeasts, bacteria, and fungi.
    source: "InterPro:IPR050724 abstract (LLM-generated, not curator-reviewed)"
