  - kind: GENERAL
    text: >-
      NADP-SPECIFIC GLUTAMATE DEHYDROGENASE 1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43571. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, catalytic activity. Members participate in organic acid biosynthetic process, dicarboxylic acid metabolic process, alpha-amino acid biosynthetic process. Members localise to cytoplasm, cytosol.
