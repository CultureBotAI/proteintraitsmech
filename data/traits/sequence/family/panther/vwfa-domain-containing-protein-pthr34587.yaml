  - kind: GENERAL
    text: >-
      This family of proteins includes secreted factors that are essential for the initial stages of host invasion by certain pathogens. Members are involved in the penetration of host epidermal cells, a critical step for establishing infection. These proteins are not required for the later stages of infection, such as biotrophic and necrotrophic colonization of the host tissue. Their role is specifically linked to the early interaction between the pathogen and its host, facilitating the pathogen's entry and subsequent establishment within the host organism.
