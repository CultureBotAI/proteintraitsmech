  - kind: GENERAL
    text: >-
      This family of proteins includes G-type lectin S-receptor-like serine/threonine-protein kinases and EP1-like glycoproteins. The kinases are part of the protein kinase superfamily and are involved in various defense mechanisms in plants. They play a role in innate immunity, resistance to pathogens such as fungi and bacteria, and defense against herbivorous insects like the brown planthopper. Some members are also implicated in seed germination by regulating the expression of alpha-amylase genes. The EP1-like glycoproteins may be involved in cell-to-cell signaling and could have a role in programmed cell death or in limiting water flow through the epidermal cell wall.
    source: "InterPro:IPR051343 abstract (LLM-generated, not curator-reviewed)"
