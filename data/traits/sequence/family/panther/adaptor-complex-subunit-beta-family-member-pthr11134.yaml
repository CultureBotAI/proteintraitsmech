identifier: PANTHER:PTHR11134
label: "ADAPTOR COMPLEX SUBUNIT BETA FAMILY MEMBER"
definition: >-
  Adaptor protein (AP) complexes function in protein transport via transport vesicles in different membrane traffic pathways. AP complexes are involved in the formation of clathrin-coated vesicles (CCVs) by recruiting the scaffold protein, clathrin. AP complexes are also involved in the cargo selection by recognising the sorting signals in proteins. Several AP complexes have been identified: AP-2 mediates endocytosis from the plasma membrane, while AP-1, AP-3 and AP-4 play a role in the endosomal/lysosomal sorting pathways. AP complexes are heterotetramers which consist of two large subunits, one medium subunit and one small subunit. One of the large subunits (alpha, gamma, delta and epsilon) mediates binding to the target membrane. The other large subunit (beta) recruits clathrin through the clathrin-binding sequence.
definition_source: "InterPro:IPR026739 abstract (PANTHER PTHR11134 is a member signature)"
