  - kind: GENERAL
    text: >-
      This family of proteins includes S-adenosyl-L-methionine-dependent methyltransferases involved in diverse biosynthetic pathways. Members are responsible for the methylation of various substrates, contributing to the biosynthesis of complex molecules with antibiotic, immunosuppressant, or other bioactive properties. These enzymes play roles in the modification of secondary metabolites, such as glycoside antibiotics, iron-chelating compounds, and macrolide antibiotics. They catalyze the transfer of methyl groups to specific positions on their substrates, which can be part of larger biosynthetic gene clusters responsible for the production of medicinally relevant compounds.
