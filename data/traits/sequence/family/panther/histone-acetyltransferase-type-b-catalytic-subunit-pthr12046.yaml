identifier: PANTHER:PTHR12046
label: "HISTONE ACETYLTRANSFERASE TYPE B CATALYTIC SUBUNIT"
definition: >-
  This entry represents the catalytic subunit of histone acetyltransferase type B (EC:2.3.1.48) (also known as HAT1), which is the catalytic component of the histone acetylase B (HAT-B) complex. The HAT-B complex is composed of at least HAT1 and HAT2. In the cytoplasm, this complex binds to the histone H4 tail. In the nucleus, the HAT-B complex has an additional component, the histone H3/H4 chaperone HIF1. This enzyme acetylates soluble but not nucleosomal H4 at Lys-12, which is required for telomeric silencing. HAT1 has intrinsic substrate specificity that modifies lysine in recognition sequence GXGKXG. It is involved in DNA double-strand break repair.
