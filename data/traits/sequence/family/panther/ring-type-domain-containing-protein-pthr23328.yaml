definitions:
  - kind: GENERAL
    text: >-
      RING-TYPE DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23328. Members are annotated with the molecular function nucleosome binding, aminoacyltransferase activity, ubiquitin-protein transferase activity. and participate in cellular aromatic compound metabolic process, double-strand break repair, cellular response to stress. and localise to non-membrane-bounded organelle, nucleus, intracellular membrane-bounded organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that play a crucial role in DNA damage response. They are involved in the accumulation and regulation of repair proteins at sites of DNA damage, particularly double-strand breaks (DSBs) and interstrand cross-links (ICLs). These proteins function by recognizing and binding to ubiquitinated histones, amplifying histone ubiquitination, and promoting the formation of 'Lys-63'-linked ubiquitin conjugates. This activity is essential for the recruitment of other repair factors and complexes to DNA lesions, thereby facilitating proper repair pathway utilization. Some family members also participate in transcriptional silencing near DSBs to prevent transcription-repair conflicts and are implicated in immune system processes such as class switch recombination. The family is characterized by the presence of MIU and UMI motifs, which mediate specificity for different types of ubiquitin chains through their juxtaposition with LR motifs.
    source: "InterPro:IPR051657 abstract (LLM-generated, not curator-reviewed)"
