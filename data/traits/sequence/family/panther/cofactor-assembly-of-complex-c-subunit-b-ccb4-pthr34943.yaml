identifier: PANTHER:PTHR34943
label: "COFACTOR ASSEMBLY OF COMPLEX C SUBUNIT B CCB4"
definition: >-
  Cofactor maturation pathways such as the CCB system (system IV) for cytochrome c-heme attachment are conserved in all organisms performing oxygenic photosynthesis. The CCB system consists of four proteins: CCB1-4. CCB2 and CCB4 are paralogues derived from a unique cyanobacterial ancestor. Orthologues are conserved in higher plants. This entry includes the plant CCB4 and its homologues from cyanobacteria.
