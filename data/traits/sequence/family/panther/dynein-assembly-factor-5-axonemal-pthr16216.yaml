identifier: PANTHER:PTHR16216
label: "DYNEIN ASSEMBLY FACTOR 5, AXONEMAL"
definition: >-
  This family includes Dynein axonemal assembly factor 5 (DAAF5). Members of this family are cytoplasmic and play a crucial role in the formation of the dynein inner and outer arms, which are essential for the movement of cilia. These arms are attached to the peripheral outer doublet A microtubule of the axoneme, the core structural component of a cilium. DAAF5 is a cytoplasmic protein involved in the delivery of the dynein machinery to the motile cilium. It is required for the assembly of the axonemal dynein inner and outer arms, two structures attached to the peripheral outer doublet A microtubule of the axoneme, that play a crucial role in cilium motility.
