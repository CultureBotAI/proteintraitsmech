  - kind: GENERAL
    text: >-
      The Dehydrogenase/reductase SDR family member 7 proteins are NADPH-dependent oxidoreductases involved in the reduction of compounds with carbonyl groups, including steroids, retinoids, and xenobiotics. They play a role in the inactivation of 5alpha-dihydrotestosterone, potentially affecting androgen receptor function, and in the conversion of all-trans-retinal to all-trans-retinol. The family's involvement in the reduction of cortisone and various xenobiotics suggests a role in xenobiotic biotransformation. Although dehydrogenase activity has not been observed, these proteins may act as tumor suppressors.
    source: "InterPro:IPR053011 abstract (LLM-generated, not curator-reviewed)"
