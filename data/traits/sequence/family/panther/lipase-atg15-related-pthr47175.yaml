definitions:
  - kind: GENERAL
    text: >-
      LIPASE ATG15-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47175. PANTHER protein class: lipase. Members are annotated with the molecular function hydrolase activity, phospholipase activity. Members participate in microautophagy, membrane organization, neutral lipid catabolic process. Members localise to intracellular organelle lumen, membrane-enclosed lumen, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The ATG15 lipase family is involved in the autophagic process, playing a crucial role in the degradation of intravacuolar contents. Members of this family are essential for the lysis of subvacuolar cytoplasmic components and autophagic bodies targeted to the vacuole, as well as the disintegration of intravacuolar multivesicular body (MVB) vesicles. This disintegration process is vital for cellular life span extension. The ATG15 lipases are implicated in various cellular functions, including vegetative growth, reproduction, and virulence in some species. Additionally, they contribute to the biosynthesis of certain virulence factors, such as deoxynivalenol in pathogenic fungi. All members belong to the AB hydrolase superfamily, characterized by a common structural fold and catalytic mechanism.
    source: "InterPro:IPR050805 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
