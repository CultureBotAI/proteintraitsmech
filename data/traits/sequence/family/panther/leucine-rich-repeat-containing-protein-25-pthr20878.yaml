identifier: PANTHER:PTHR20878
label: "LEUCINE-RICH REPEAT CONTAINING PROTEIN 25"
definition: >-
  Leucine-rich repeat-containing protein 25 (LRRC25) is an inhibitor of signalling pathways. In the RLR-mediated type I interferon signaling pathway, LRRC25 targets DDX58/RIG-I for autophagic degradation. Similarly, the NF-kappa-B signaling pathway and the inflammatory response are inhibited by targeting p65/RELA for degradation. LRRC25 is a type I transmembrane protein with an N-terminal lumenal domain, a single transmembrane domain and a larger cytoplasmic domain. The leucine-rich repeats are in the N-terminal, lumenal domain.
definition_source: "InterPro:IPR039243 abstract (PANTHER PTHR20878 is a member signature)"
