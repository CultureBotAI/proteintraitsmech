identifier: PANTHER:PTHR15464
label: "TRANSCRIPTION FACTOR 19"
definition: >-
  Transcription factor 19 (TCF19) contains a PHD and a Forkhead-associated (FHA) domain. It is a transcription factor that interacts with histone H3K4Me3 and controls gluconeogenic gene expression via the nucleosome-remodeling-deacetylase complex.
