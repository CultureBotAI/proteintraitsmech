  - kind: GENERAL
    text: >-
      This family of proteins is characterized by the presence of sushi domains, which are also known as complement control protein (CCP) modules. Sushi domains are found in a variety of extracellular and membrane-bound proteins and are typically involved in protein-protein interactions. They play a role in a wide range of biological processes including the complement system, blood coagulation, cellular adhesion, and immune response. Proteins containing sushi domains may act as regulators of these pathways, participating in the maintenance of homeostasis and modulation of signaling events. The specific functions of individual members of this family can vary widely, reflecting the diverse roles of sushi domain-containing proteins in different physiological contexts.
    source: "InterPro:IPR053298 abstract (LLM-generated, not curator-reviewed)"
