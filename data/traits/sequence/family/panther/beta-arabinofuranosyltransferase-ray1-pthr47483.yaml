identifier: PANTHER:PTHR47483
label: "BETA-ARABINOFURANOSYLTRANSFERASE RAY1"
definition: >-
  This entry includes RAY1 from Arabidopsis and some uncharacterised proteins from bacteria. RAY1 catalyses the addition of a beta-arabinofuranose residue onto a beta-galactosyl residue of an Yariv-precipitable wall polymer in vivo.
