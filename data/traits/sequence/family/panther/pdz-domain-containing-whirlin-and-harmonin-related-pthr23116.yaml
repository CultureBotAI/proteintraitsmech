  - kind: GENERAL
    text: >-
      This family of proteins is involved in sensory perception, particularly in hearing and vision. Members of this family play a crucial role in the formation and maintenance of the USH2 complex, which is essential for the proper function of hair cells in the inner ear. They are necessary for the elongation and maintenance of stereocilia, the mechanosensory structures on hair cells responsible for transducing sound vibrations into neural signals. In the retina, these proteins are required for maintaining the periciliary membrane complex, which is believed to be involved in intracellular protein transport. Additionally, some family members are part of the intermicrovillar adhesion complex, contributing to brush border differentiation and microvilli organization in the inner ear.
    source: "InterPro:IPR051844 abstract (LLM-generated, not curator-reviewed)"
