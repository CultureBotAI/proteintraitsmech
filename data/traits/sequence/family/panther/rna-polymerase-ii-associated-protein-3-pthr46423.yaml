identifier: PANTHER:PTHR46423
label: "RNA POLYMERASE II-ASSOCIATED PROTEIN 3"
definition: >-
  The RPAP3 family proteins are implicated in forming an interface between the RNA polymerase II enzyme and chaperone/scaffolding proteins. They appear to play a crucial role in connecting RNA polymerase II to regulators of protein complex formation, which is essential for transcriptional regulation. Additionally, a member of the family in Schizosaccharomyces pombe is involved in meiosis, suggesting a possible role in cell division and differentiation. Another human family member is associated with cellular response to X-ray and regulates protein stability, indicating a broader functional spectrum that may include stress response and cell cycle control.
