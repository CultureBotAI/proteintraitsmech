identifier: PANTHER:PTHR11022
label: "PEPTIDOGLYCAN RECOGNITION PROTEIN"
definition: >-
  This is a group of animal peptidoglycan recognition proteins homologous to Bacteriophage T3 lysozyme. The bacteriophage molecule, but not its moth homologue, has been shown to have N-acetylmuramoyl-L-alanine amidase activity. One member, Tag7, is a cytokine.
