identifier: PANTHER:PTHR43498
label: "FERREDOXIN:COB-COM HETERODISULFIDE REDUCTASE SUBUNIT A"
definition: >-
  This entry represents a group of reductases, including HdrA1 from Archaea. HdrA1 is part of a complex that catalyzes the reversible reduction of CoM-S-S-CoB to the thiol-coenzymes H-S-CoM (coenzyme M) and H-S-CoB (coenzyme B).
