identifier: PANTHER:PTHR48020
label: "PROTON MYO-INOSITOL COTRANSPORTER"
definition: >-
  The myo-inositol transporter family is characterized by proteins that facilitate the transport of myo-inositol across cellular membranes. Members of this family are predominantly part of the major facilitator superfamily and are involved in sugar transport, with a specific focus on myo-inositol, a molecule important for cell signaling and osmoregulation. Some family members are also capable of transporting inositol stereoisomers and other related compounds. These transporters are found in various organisms, including humans, yeast, plants, and other eukaryotes. They function as symporters, often coupling the transport of myo-inositol with protons (H+), and are integral to maintaining cellular inositol levels, impacting processes such as osmotic balance and nutrient uptake. Certain transporters within this family also play a role in the traversal of the blood-brain barrier, vacuolar sugar import, and may respond to environmental stressors by altering transport activity.
