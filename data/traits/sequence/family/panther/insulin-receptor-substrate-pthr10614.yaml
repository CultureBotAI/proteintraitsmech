identifier: PANTHER:PTHR10614
label: "INSULIN RECEPTOR SUBSTRATE"
definition: >-
  INSULIN RECEPTOR SUBSTRATE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10614. PANTHER protein class: scaffold/adaptor protein. Members are annotated with the molecular function phosphatidylinositol 3-kinase binding, signaling receptor binding. and participate in insulin receptor signaling pathway, regulation of cellular process. and localise to cytoplasm, cytosol, cell periphery.
