  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in centromere and heterochromatin binding, DNA binding, and may play roles in centromere formation, kinetochore assembly, and DNA transposition. Some proteins within this family are known to bind specific DNA sequences, such as the CENP-B box in alphoid satellite DNA, and may organize these sequences into higher-order structures. Others are derived from tigger transposable elements and may retain functions related to transposition. Additionally, certain family members are implicated in biosynthetic pathways, such as the production of chaetoglobosin A, and may perform enzymatic functions like epoxidation, dehydrogenation, and Diels-Alder cyclization. The family also includes proteins that may regulate gene expression, as seen in the control of pyruvate decarboxylase synthesis.
