identifier: PANTHER:PTHR15564
label: "MACPF DOMAIN-CONTAINING PROTEIN"
definition: >-
  This entry represents the BMP/retinoic acid-inducible neural-specific protein (BRINP) family, including BRINP1/2/3. BRINP proteins are involved in neurogenesis and brain development. These proteins play a role in inhibiting neuronal cell proliferation by negatively regulating cell cycle progression, particularly by suppressing the G1/S transition in postmitotic neurons. This regulation is essential for proper brain development and the functioning of GABAergic neurons. Additionally, certain BRINP proteins have been implicated in promoting the proliferation, migration, and invasion of pituitary gonadotrope cells when overexpressed, suggesting a potential role in pituitary tumour development. BRINP proteins are also characterised by their responsiveness to BMP and retinoic acid, which are key signalling molecules in neural-specific pathways.
definition_source: "InterPro:IPR033237 abstract (PANTHER PTHR15564 is a member signature)"
