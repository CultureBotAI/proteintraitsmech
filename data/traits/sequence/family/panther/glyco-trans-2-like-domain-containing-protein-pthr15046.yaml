label: "GLYCO_TRANS_2-LIKE DOMAIN-CONTAINING PROTEIN"
definition: >-
  GLYCO_TRANS_2-LIKE DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15046. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function UDP-glycosyltransferase activity, hexosyltransferase activity. Subfamilies participate in primary metabolic process, carbohydrate derivative metabolic process.
