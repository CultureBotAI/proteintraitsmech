identifier: PANTHER:PTHR33353
label: "PUTATIVE (AFU_ORTHOLOGUE AFUA_1G12560)-RELATED"
definition: >-
  Although weak endoglucanase activity has been demonstrated in several members of this family, they lack the clustered conserved catalytic acidic amino acids present in most glycoside hydrolases. Many members of this family lack measurable cellulase activity on their own, but enhance the activity of other cellulolytic enzymes. They are therefore unlikely to be true glycoside hydrolases. The substrate-binding surface of this family is a flat Ig-like fold. This family of enzymes were originally classified as glycoside hydrolases (GH61) and they have been reclassified as the Auxiliary Activity Family 9 (, ) of CAZy.
definition_source: "InterPro:IPR049892 abstract (PANTHER PTHR33353 is a member signature)"
