identifier: PANTHER:PTHR43626
label: "ACYL-COA N-ACYLTRANSFERASE"
definition: >-
  This entry represents acetyltransferases found in pro- and eukaryotes. This entry includes a group of plant acetyltransferases, including NSI from Arabidopsis (also known as GCN5-related N-acetyltransferase 2), SNAT1/2 from rice and Histone acetyltransferase TAP1/2 from Glycine max (Soybean). NSI is a vascular-expressed acetyltransferase that interacts with NSP, which is a nuclear shuttle protein. It has dual specificity triggering both N-alpha-acetylation (NTA), with a preference for alanine, serine, threonine, methionine and to a lower extent valine as substrates (can also use glycine and leucine), and epsilon-lysine acetylation (KA) of several plastid proteins. NSI is also involved in melatonin biosynthesis by catalysing the formation of N-acetylserotonin (NAS) from serotonin and of melatonin (N-acetyl-5-methoxytryptamine) from 5-methoxytryptamine (5-MT). It has been shown to regulate the nuclear export of the viral genome and potentially other non transcriptional nuclear events in plant cells. SNAT1 catalyses the N-acetylation of serotonin into N-acetylserotonin, the penultimate step in the synthesis of melatonin. TAP1 acts as a susceptibility factor that is hijacked by Avh52 in order to promote acetylation of histones H2A and H3 during early infection by Phytophthora sojae. This entry also includes ArgA amino-acid acetyltransferase from Mycobacterium tuberculosis that catalyses the conversion of L-glutamate to alpha-N-acetyl-L-glutamate.
