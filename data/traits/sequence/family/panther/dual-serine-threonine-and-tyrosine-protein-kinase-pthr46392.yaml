identifier: PANTHER:PTHR46392
label: "DUAL SERINE/THREONINE AND TYROSINE PROTEIN KINASE"
definition: >-
  The Dual serine/threonine and tyrosine protein kinase family is characterized by its role in regulating ERK phosphorylation downstream of fibroblast growth factor-receptor activation. Members of this family are involved in the regulation of both caspase-dependent apoptosis and caspase-independent cell death pathways. In particular, within the skin, these kinases are predominant in suppressing caspase-dependent apoptosis in response to UV stress across various dermal cell types. Additionally, they are implicated in embryonic development, suggesting a broader biological significance. The family's dual kinase activity reflects its capacity to phosphorylate substrates on serine/threonine as well as tyrosine residues, which is indicative of its versatile role in cell signaling and regulatory mechanisms.
