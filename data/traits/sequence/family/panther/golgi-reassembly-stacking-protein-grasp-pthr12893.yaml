identifier: PANTHER:PTHR12893
label: "GOLGI REASSEMBLY STACKING PROTEIN  GRASP"
definition: >-
  GRASP55 (Golgi reassembly stacking protein of 55kDa) and GRASP65 (a 65kDa) protein are highly homologous. GRASP55 is a component of the Golgi stacking machinery. GRASP65 is an N-ethylmaleimide-sensitive membrane protein required for the stacking of Golgi cisternae in a cell-free system.
