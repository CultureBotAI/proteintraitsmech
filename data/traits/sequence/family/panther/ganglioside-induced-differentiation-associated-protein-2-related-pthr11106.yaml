label: "GANGLIOSIDE INDUCED DIFFERENTIATION ASSOCIATED PROTEIN 2-RELATED"
definition: >-
  GANGLIOSIDE INDUCED DIFFERENTIATION ASSOCIATED PROTEIN 2-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11106. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function hydrolase activity, acting on glycosyl bonds, catalytic activity, acting on a protein. Subfamilies participate in purine nucleoside metabolic process, protein modification process, DNA damage response. Subfamilies localise to nucleus, nuclear lumen, intracellular anatomical structure.
