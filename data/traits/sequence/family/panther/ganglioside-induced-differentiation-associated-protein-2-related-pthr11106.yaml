identifier: PANTHER:PTHR11106
label: "GANGLIOSIDE INDUCED DIFFERENTIATION ASSOCIATED PROTEIN 2-RELATED"
definition: >-
  GANGLIOSIDE INDUCED DIFFERENTIATION ASSOCIATED PROTEIN 2-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11106. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, hydrolase activity, hydrolase activity, acting on glycosyl bonds. Subfamilies participate in nucleobase-containing compound metabolic process, cellular aromatic compound metabolic process, nitrogen compound metabolic process. Subfamilies localise to intracellular anatomical structure, nucleus, nucleoplasm.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
