  - kind: GENERAL
    text: >-
      This family of proteins includes sequence-specific transcription factors that are integral to a developmental regulatory system, providing cells with distinct positional identities along the anterior-posterior axis. Members of this family are characterized by their ability to bind to gene promoters and activate transcription. They play roles in various developmental processes, including hair follicle differentiation and early embryonic development. Some members show a preference for binding to methylated DNA.
