identifier: PANTHER:PTHR36167
label: "C2H2 FINGER DOMAIN TRANSCRIPTION FACTOR (EUROFUNG)-RELATED"
definition: >-
  This entry represents a group of proteins mostly from fungi, including CON7 from Magnaporthe grisea and CQS2 from Cryptococcus neoformans. CON7 is a transcription factor that regulates infection-related morphogenesis in the rice blast fungus Magnaporthe grisea. CQS2 is a component of the quorum sensing peptide QSP1 signalling cascade during both bisexual and unisexual reproduction. QSP1 controls the binding of CQS2 to promoters, thereby modulating the expression of QSP1-regulated genes.
