identifier: PANTHER:PTHR46232
label: "SMARCE1 REGULATOR OF CHROMATIN"
definition: >-
  SMARCE1 REGULATOR OF CHROMATIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46232. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function nucleosome binding, RNA polymerase II-specific DNA-binding transcription factor binding, chromatin DNA binding. Members participate in negative regulation of cellular metabolic process, negative regulation of biological process, negative regulation of RNA metabolic process. Members localise to SWI/SNF superfamily-type complex, protein-containing complex, SWI/SNF complex.
