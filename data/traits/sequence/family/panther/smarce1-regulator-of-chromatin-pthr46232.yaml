label: "SMARCE1 REGULATOR OF CHROMATIN"
definition: >-
  SMARCE1 REGULATOR OF CHROMATIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46232. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function nuclear receptor binding, chromatin DNA binding, nucleosome binding. Members participate in negative regulation of DNA-templated transcription. Members localise to SWI/SNF complex.
