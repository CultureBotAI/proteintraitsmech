identifier: PANTHER:PTHR31100
label: "AT-HOOK MOTIF NUCLEAR-LOCALIZED PROTEIN 15"
definition: >-
  This entry includes AT-hook motif nuclear-localized proteins 15-29 (AHL15-29) from Arabidopsis. They have two conserved structural units, the AT-hook motif and the Plant and Prokaryote Conserved (PPC) domain, the latter also known as DUF296. Members of the AHL family regulate diverse aspects of growth and development in plants. AHL20 has been shown to negatively regulate defenses in Arabidopsis.
