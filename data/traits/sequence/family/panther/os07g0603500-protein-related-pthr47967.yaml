  - kind: GENERAL
    text: >-
      The Aspartic Proteinase A1 family comprises extracellular proteases involved in diverse biological processes across various plant species. Members of this family are known for their role in nitrogen uptake through the digestion of prey in carnivorous plants, such as nepenthesin-1 and nepenthesin-2 found in pitcher fluid. In Arabidopsis thaliana, they participate in the regulation of endogenous sugar levels, influence plant morphology and development, and are implicated in the timing of tapetal programmed cell death critical for pollen development. Additionally, some members are involved in salicylic acid-dependent inducible resistance responses, potentially releasing peptide elicitors for the activation of resistance mechanisms. The family is characterized by a sensitivity to inhibition by pepstatin and related compounds, indicating a conserved mechanism of activity regulation.
    source: "InterPro:IPR051708 abstract (LLM-generated, not curator-reviewed)"
