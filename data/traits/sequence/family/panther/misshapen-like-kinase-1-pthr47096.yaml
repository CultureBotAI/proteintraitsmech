  - kind: GENERAL
    text: >-
      The STE20 subfamily of serine/threonine kinases is involved in a variety of cellular processes including the response to environmental stress, cytokine signaling, and the regulation of actin cytoskeleton. Members of this family play key roles in developmental processes, such as embryogenesis, neuronal structure, and synaptic function. They act as upstream activators of pathways like the JUN N-terminal pathway and are essential for Wnt signaling, influencing gene expression and cytoskeletal rearrangements. Additionally, they participate in negative selection of thymocytes and may regulate cell migration, spreading, and dendrite arborization. This family includes kinases that phosphorylate targets such as cofilin-1, SMAD1, and TANC1, modulating actin polymerization, AMPA receptor trafficking, and stress-activated MAPK pathways.
    source: "InterPro:IPR051700 abstract (LLM-generated, not curator-reviewed)"
