identifier: PANTHER:PTHR13123
label: LD30288P
definition: >-
  This entry includes a group of animal F-box containing proteins, including FBX25 and FBX32. FBXO32 is a substrate recognition component of a SCF (SKP1-CUL1-F-box protein) E3 ubiquitin-protein ligase complex which mediates the ubiquitination and subsequent proteasomal degradation of target proteins. FBX25 is strongly expressed in human brain.
