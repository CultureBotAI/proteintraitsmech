  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various cellular processes, such as sorting and selective transport of receptors and ligands across polarized epithelia, regulation of bile acid synthesis through production and/or transport of fibroblast growth factors, and potential roles in cell-cell interactions. These proteins typically contain MAM domains, which may mediate protein-protein interactions, and some also have LDL-receptor class A domains, which are often involved in ligand binding or cell adhesion. The specific functions of these proteins can vary, but they generally contribute to cellular communication and transport mechanisms.
