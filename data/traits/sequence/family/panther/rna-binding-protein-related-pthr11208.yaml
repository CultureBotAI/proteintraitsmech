identifier: PANTHER:PTHR11208
label: "RNA-BINDING PROTEIN RELATED"
definition: >-
  This entry represents a group of KH domain-containing proteins that share protein sequence similarity with fungal BBP protein, such as KH domain-containing RNA-binding protein QKI and KHDR1-3 from human. QKI is a RNA-binding protein that plays a central role in myelination and regulates pre-mRNA splicing, mRNA export and protein translation. BBP/SF1 family members include the branchpoint binding proteins (BBP) from yeast and their mammalian homologue, splicing factor 1 (SF1). They are KH domain containing proteins required for pre-spliceosome formation, which is the first step of pre-mRNA splicing. In budding yeasts, BBP binds the conserved RNA sequence UACUAAC, called the branchpoint motif, found near the 3' end of yeast introns. Besides its function in pre-mRNA splicing, BBP is also involved in nuclear retention of pre-mRNA. Mammalian SF1, also known as ZFM1, may act as transcription repressor.
