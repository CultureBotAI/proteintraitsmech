identifier: PANTHER:PTHR30203
label: "OUTER MEMBRANE CATION EFFLUX PROTEIN"
definition: >-
  This protein family includes Multidrug resistance outer membrane protein MdtP from Escherichia coli, Nodulation protein T from Rhizobium leguminosarum and similar bacterial proteins. MdtP is thought to be involved in resistance to puromycin, acriflavine and tetraphenylarsonium chloride. NodT forms part of the RND (Resistance-Nodulation-cell Division) type efflux systems. These proteins work with an inner membrane ABC transporter ATPase and an adapter called a membrane fusion protein. Many members of this family are likely to export primarily small molecules rather than proteins, but are related to the type I protein secretion outer membrane proteins TolC and PrtF.
definition_source: "InterPro:IPR010131 abstract (PANTHER PTHR30203 is a member signature)"
