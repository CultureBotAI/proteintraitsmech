identifier: PANTHER:PTHR12203
label: "KDEL  LYS-ASP-GLU-LEU  CONTAINING - RELATED"
definition: >-
  The protein family is involved in the post-translational modification of proteins through O-glycosylation, specifically targeting extracellular EGF repeats and other consensus sequence motifs. Members of the family function as glycosyltransferases, transferring glucose or xylose from UDP-sugars to serine residues within specific consensus sequences. This modification plays a crucial role in protein folding, stability, and signaling, with notable involvement in the Notch signaling pathway, which is essential for various developmental processes. Some family members also participate in lipopolysaccharide core biosynthesis and glycosphingolipid modification, indicating a diverse set of biological functions related to carbohydrate attachment.
