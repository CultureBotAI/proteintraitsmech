identifier: PANTHER:PTHR15371
label: TIM23
definition: >-
  This entry includes mitochondrial import inner membrane translocase subunit Tim23 and chloroplastic outer envelope pore protein 16-1/2 (OEP161/162). In plants OEP161/162 are distantly related to the translocase of the inner mitochondrial membrane Tim17. OEP161/162 are amino acid-selective channel proteins and translocation pores for NADPH:protochlorophyllide oxidoreductase A (PORA). The TIM23 complex forms a dynamic multisubunit machinery that recognises preproteins and can transport them into the inner membrane or into the matrix. It is composed of three subunits, Tim50, Tim23, and Tim17, that expose the domains to the intermembrane space. This entry includes the mitochondrial import inner membrane translocase subunit Tim23, consisting of an N-terminal intermembrane space domain that interacts with Tim50, and a C-terminal membrane-embedded domain that, together with Tim17, forms a protein-conducting channel across the inner membrane. Tim50 helps keeping the Tim23 channel in a closed state in the absence of presequence proteins, regulating the gating through the TIM channel.
definition_source: "InterPro:IPR045238 abstract (PANTHER PTHR15371 is a member signature)"
