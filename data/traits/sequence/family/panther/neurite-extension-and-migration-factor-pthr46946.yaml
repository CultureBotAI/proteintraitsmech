identifier: PANTHER:PTHR46946
label: "NEURITE EXTENSION AND MIGRATION FACTOR"
definition: >-
  Nexmif (Neurite extension and migration factor), also known as KIAA2022, regulates neurite outgrowth via N-Cadherin and delta-Catenin signalling. Mutations of the KIAA2022 gene cause mental retardation, X-linked 98 (MRX98).
