identifier: PANTHER:PTHR12124
label: "POLYMYOSITIS/SCLERODERMA AUTOANTIGEN-RELATED"
definition: >-
  Rrp6 is a nuclear-specific catalytic component of the RNA exosome complex which has 3'->5' exoribonuclease activity and participates in a multitude of cellular RNA processing and degradation events. In animals is also known as exosome complex component 10 (EXOSC10). In contrast to yeast and humans where Rrp6 is encoded by a single gene, plants such as Arabidopsis thaliana, rice, and polar, have three homologues of Rrp6.
