identifier: PANTHER:PTHR12341
label: "5'->3' EXORIBONUCLEASE"
definition: >-
  This entry includes 5'-3'exoribonuclease type 1 and type 2. Putative viral exonucleases 059L and 012L, plant Xrn3 and Xrn4 also belong to this family. 5'-3'-exoribonucleases are enzymes that degrade RNA by removing terminal nucleotides from the 5' end. An exosome and a 5'-3'-exoribonuclease are important in the degradation of very unstable transcripts.
