identifier: PANTHER:PTHR12616
label: "VACUOLAR PROTEIN SORTING VPS41"
definition: >-
  This entry includes Vps41 and Vps8. Vps8 is one of the Golgi complex components necessary for vacuolar sorting. Eukaryotic cells contain a highly dynamic endomembrane system, in which individual organelles keep their identity despite continuous vesicle generation and fusion. Vesicles that bud from a donor membrane are targeted and delivered to each individual organelle, where they release their cargo after fusion with the acceptor membrane. Vps8 is the core component of the endosomal tethering complex CORVET (class C core vacuole/endosome tethering). Vps8 co-operates with Vps21-GTP to mediate endosomal clustering in a reaction that is dependent on Vps3. Vps8 is the only CORVET subunit that is enriched on late endosomes, suggesting that it is a marker for the maturation of late endosomes. Late endosomes form intraluminal vesicles, and the resulting multivesicular bodies fuse with the vacuole to release their cargoes. Vsp41 is a subunit of the homotypic vacuole fusion and vacuole protein sorting (HOPS) complex, which is essential for membrane docking and fusion at the Golgi-to-endosome and endosome-to-vacuole stages of protein transport. This protein interacts with Caspase-8, which plays a key role in apoptosis and development. Vsp41 consists of a β-propeller at the N-terminal ( ), represented in this entry, followed by an α-solenoid (TPR-like) domain, a CHCR domain and a RING zinc finger ( ).
