  - kind: GENERAL
    text: >-
      The PINX1 family proteins are involved in ribosomal RNA (rRNA) processing, specifically at the A0, A1, and A2 sites, and play a role in the negative regulation of telomerase activity. They are implicated in the final trimming of U18 and U24 small nucleolar RNAs (snoRNAs). Some family members have been identified as microtubule-binding proteins essential for chromosome segregation, mediating the accumulation of TRF1 and TERT in the nucleolus, enhancing TRF1 binding to telomeres, and acting as telomerase inhibitors. These functions suggest a role in cell proliferation control and potential tumor suppressor activity. The family also includes proteins involved in ribosome biogenesis and cell proliferation in plants.
    source: "InterPro:IPR050656 abstract (LLM-generated, not curator-reviewed)"
