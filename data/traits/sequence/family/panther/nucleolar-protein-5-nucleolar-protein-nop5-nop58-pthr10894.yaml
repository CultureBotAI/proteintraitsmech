identifier: PANTHER:PTHR10894
label: "NUCLEOLAR PROTEIN 5  NUCLEOLAR PROTEIN NOP5  NOP58"
definition: >-
  This entry includes a group of pre-RNA processing ribonucleoproteins (RNPs), including Nop56/Nop58 from animals and their homologue, Nop5, from archaea. Proteins in this family contains the Nop domain, which is a RNP binding module, exhibiting RNA and protein binding surfaces. It is oval-shaped and exclusively α-helical. Nucleolar protein 56 and 58 (NOP56/58) are required for 60S ribosomal subunit synthesis. They are core components of box C/D small nucleolar ribonucleoprotein (snoRNP) particles. In humans, NOP56 is associated with a type of slowly progressive neurodegenerative disorder characterised by late-onset ataxia followed by variable involvement of the motor neuron system.
