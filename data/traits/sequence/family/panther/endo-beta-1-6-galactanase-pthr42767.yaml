identifier: PANTHER:PTHR42767
label: "ENDO-BETA-1,6-GALACTANASE"
definition: >-
  In Trichoderma viride, endo-beta-1,6-galactanase (6GAL) hydrolyzes galactooligomers with a degree of polymerization higher than 3. This family also includes Exo-beta-1,6-galactobiohydrolase (EXGAL) from Bifidobacterium longum, which specifically releases the non-reducing terminal beta-1,6-galactobiose of beta-1,6-galactooligosaccharides. 6GAL and EXGAL are members of Glycoside Hydrolase Family 30 (GH30), subfamily 5.
