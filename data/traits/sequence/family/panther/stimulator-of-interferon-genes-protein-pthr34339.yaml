identifier: PANTHER:PTHR34339
label: "STIMULATOR OF INTERFERON GENES PROTEIN"
definition: >-
  Stimulator of interferon genes protein (STING) or endoplasmic reticulum interferon stimulator (ERIS, also known as Transmembrane protein 173 in human), is a transmembrane adaptor protein which is involved in innate immune signalling processes. It induces expression of type I interferons (IFN-alpha and IFN-beta) via the NF-kappa-B and IRF3, pathways in response to non-self cytosolic RNA and dsDNA. In addition to promote the production of type I interferons, members of this family play a direct role in autophagy.
