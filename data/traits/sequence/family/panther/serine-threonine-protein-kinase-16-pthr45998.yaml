      SERINE/THREONINE-PROTEIN KINASE 16 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45998. PANTHER protein class: non-receptor serine/threonine protein kinase. Members are annotated with the molecular function protein serine/threonine kinase activity. Members localise to intracellular anatomical structure, cytoplasm.
