identifier: PANTHER:PTHR47461
label: "PHYTOLONGIN PHYL1.2"
definition: >-
  Phytolongin is a longin-related family of proteins specific to plants. Similar to longin, they contain the N-terminal longin domain and the C-terminal transmembrane domain. However, the central SNARE motif is replaced in Phytolongins by another domain termed the 'Phyl domain'. Phylogenetic analysis revealed that the Phytolongins are derivatives of the plant specific VAMP72 longin sub-family and allows elucidation of Phytolongin evolution. These proteins are involved in membrane-trafficking machinery. Four phytolongins in Arabidopsis have been shown to be distributed along the secretory pathway: Phyl2.1 and Phyl2.2 are strictly located at the endoplasmic reticulum network, Phyl1.2 associates with the Golgi bodies, and Phyl1.1 locates mainly at the plasma membrane and partially in the Golgi bodies and post-Golgi compartments.
definition_source: "InterPro:IPR044783 abstract (PANTHER PTHR47461 is a member signature)"
