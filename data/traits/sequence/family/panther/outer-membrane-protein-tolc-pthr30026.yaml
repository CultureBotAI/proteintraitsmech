identifier: PANTHER:PTHR30026
label: "OUTER MEMBRANE PROTEIN TOLC"
definition: >-
  This protein family includes Outer membrane protein TolC from Escherichia coli, Protein CyaE from Bordetella pertussis and similar bacterial sequences. TolC is required for the function of several efflux systems involved in export of antibiotics and other toxic compounds from the cell. It plays a role in substrate specificity during efflux. CyaE is necessary for transport of calmodulin-sensitive adenylate cyclase-hemolysin. This entry also includes proteins necessary for the secretion of alkaline protease, and various other proteases. Structurally, the family is characterised by forming a 'channel-tunnel' that spans the outer membrane and periplasmic space, with a proximal end sealed by coiled helices.
