definitions:
  - kind: GENERAL
    text: >-
      HEAVY METAL TRANSPORTER — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43553. PANTHER protein class: ATP-binding cassette (ABC) transporter, transporter. Members are annotated with the molecular function ATP binding, ATPase-coupled transmembrane transporter activity. Members localise to ATP-binding cassette (ABC) transporter complex, membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Energy-coupling factor (ECF) transporter ATP-binding protein family is involved in the transport of various substrates across the cell membrane. Members of this family are part of the ECF ABC-transporter complex, which is distinct from classic ABC transporters. These proteins utilize the energy from ATP hydrolysis to translocate a diverse range of substrates, including vitamins and other small molecules, into the cell. The ECF transporter complex typically consists of a substrate-specific component and an ATP-binding component, which is responsible for energy coupling. The transport process is highly specific and dependent on the presence of both the ECF transporter complex and the substrate-binding protein. Some family members are also involved in the uptake of essential nutrients like biotin, thiamine, and riboflavin, particularly under low substrate concentrations.
    source: "InterPro:IPR050095 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
