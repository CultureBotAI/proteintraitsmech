identifier: PANTHER:PTHR37863
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 196-RELATED"
definition: >-
  This entry represents proteins from the coiled-coil domain-containing protein 196 family. They are derived from the CCDC196 gene. It is found only in mammals, and they contain a coiled coil. A human member of this protein has been recently reported.
