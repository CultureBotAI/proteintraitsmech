identifier: PANTHER:PTHR13391
label: "MITOCHONDRIAL DISTRIBUTION REGULATOR MISATO"
definition: >-
  This entry represents a group of eukaryotic proteins, including Misato from Drosophila melanogaster (MST) and its homologues such as protein DML1 from fungi and protein misato homolog 1 (MSTO1) from mammals. Misato from Drosophila and DML1p from fungi are descendants of an ancestral tubulin-like protein, and exhibit regions with similarity to members of a GTPase family that includes eukaryotic tubulin and prokaryotic FtsZ. DML1p and Misato have been co-opted into a role in mtDNA inheritance in yeast, and into a cell division-related mechanism in flies, respectively. DML1p might additionally function in the partitioning of the mitochondrial organelle itself, or in the segregation of chromosomes, thereby explaining its essential requirement. DML1 is involved in the partitioning of the mitochondrial organelle and mitochondrial DNA (mtDNA) inheritance. MST is required for mitotic spindle assembly and viability and for tubulin polymerization and stability. MSTO1 is involved in the regulation of mitochondrial distribution and morphology. It is required for mitochondrial fusion and mitochondrial network formation.
definition_source: "InterPro:IPR049942 abstract (PANTHER PTHR13391 is a member signature)"
