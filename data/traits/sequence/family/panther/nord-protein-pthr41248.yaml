  - kind: GENERAL
    text: >-
      The NorD/CobT protein family is involved in various aspects of bacterial metabolism. The majority of the family members, such as NorD from different Brucella species, are part of the norEFCBQD operon, which encodes nitric oxide reductase. These proteins are essential virulence factors likely involved in the detoxification of nitric oxide produced by macrophages during the immune response. Another member, CobT from Sinorhizobium, functions as an aerobic cobaltochelatase subunit, catalyzing cobalt insertion into the corrin ring. Additionally, some uncharacterized proteins like PA0525 from Pseudomonas aeruginosa and YojO from Bacillus subtilis are associated with the anaerobic respiratory chain for denitrification, although their precise roles are not well-defined. Collectively, the NorD/CobT family plays a crucial role in bacterial survival and pathogenicity by participating in nitric oxide detoxification, cobalamin biosynthesis, and the denitrification process.
    source: "InterPro:IPR051928 abstract (LLM-generated, not curator-reviewed)"
