identifier: PANTHER:PTHR47522
label: "SALVADOR FAMILY WW DOMAIN-CONTAINING PROTEIN 1"
definition: >-
  Salvador (sav, also known as Shar-pei) is a scaffold protein that plays an important role in the Hippo/SWH (Sav/Wts/Hpo) signalling pathway, which is involved in organ size control and tumour suppression by restricting proliferation and promoting apoptosis. In Drosophila it mediates cell proliferation arrest during imaginal disc growth. It also promotes both cell cycle exit and apoptosis.
