  - kind: GENERAL
    text: >-
      This family of proteins includes monooxygenases that catalyze diverse oxidative reactions, often involving the cleavage of carbon-sulfur bonds without breaking carbon-carbon bonds. Members are involved in various biological processes, such as the degradation of sulfur-containing compounds like dibenzothiophene-sulfone, the metabolism of nitrilotriacetate, and the conversion of long-chain alkanes into primary alcohols. Some enzymes in this family are also implicated in the biosynthesis of antibiotics, such as the oxidation of pristinamycin IIB to pristinamycin IIA. The family is characterized by a broad substrate specificity, with some members capable of acting on sulfides, sulfoxides, and sulfones, contributing to sulfur assimilation, detoxification, and environmental sulfur cycling.
    source: "InterPro:IPR051260 abstract (LLM-generated, not curator-reviewed)"
