  - kind: GENERAL
    text: >-
      The dermatan-sulfate isomerase family is involved in the biosynthesis of dermatan sulfate, a type of glycosaminoglycan/mucopolysaccharide. Members of this family are responsible for the conversion of D-glucuronic acid to L-iduronic acid (IdoUA) residues, a key step in the formation of dermatan sulfate. This process is crucial for the proper function of various biological systems, as dermatan sulfate plays a significant role in cell signaling, coagulation, and the modulation of enzyme activities. The family includes both active epimerases and epimerase-like proteins that may have a regulatory or yet undefined role in dermatan sulfate biosynthesis.
    source: "InterPro:IPR052447 abstract (LLM-generated, not curator-reviewed)"
