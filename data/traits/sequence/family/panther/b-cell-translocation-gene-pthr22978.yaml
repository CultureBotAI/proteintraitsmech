identifier: PANTHER:PTHR22978
label: "B-CELL TRANSLOCATION GENE"
definition: >-
  The BTG/Tob family members contain an conserved N-terminal domain, known as APRO domain (AntiPROliferative) or BTG domain. In mammals, six family members have been identified: BTG1, BTG2/PC3/Tis21, BTG3/ANA, BTG4/PC3B, Tob1/Tob and Tob2. They interact with CAF1, a subunit of the CCR4-NOT complex. They display antiproliferative properties as their ectopic expression in a variety of cell lines reduced cell proliferation.
definition_source: "InterPro:IPR033332 abstract (PANTHER PTHR22978 is a member signature)"
