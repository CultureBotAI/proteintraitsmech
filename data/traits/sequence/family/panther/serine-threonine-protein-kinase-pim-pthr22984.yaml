  - kind: GENERAL
    text: >-
      SERINE/THREONINE-PROTEIN KINASE PIM — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22984. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein. and participate in protein phosphorylation, phosphorylation, organic substance metabolic process. and localise to cytoplasm.
