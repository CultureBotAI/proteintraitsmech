  - kind: GENERAL
    text: >-
      The PIM kinase family comprises serine/threonine kinases involved in cell survival, proliferation, and tumorigenesis. Members regulate various cellular processes, including MYC transcriptional activity, cell cycle progression, cap-dependent protein translation, and apoptosis inhibition. They phosphorylate and stabilize MYC, enhancing its activity, and phosphorylate pro-apoptotic proteins such as BAD, reducing apoptosis. PIM kinases also influence cell cycle regulators like CDKN1A/B and CDC25A/C, promoting cell cycle transitions. Their role in tumorigenesis is underscored by their proto-oncogenic activity and ability to mediate survival signaling. Some family members are implicated in energy metabolism, insulin secretion regulation, and drug resistance through ABC transporter activation. Additionally, they may participate in chromatin structure modulation and bone marrow cell homing and migration.
    source: "InterPro:IPR051138 abstract (LLM-generated, not curator-reviewed)"
