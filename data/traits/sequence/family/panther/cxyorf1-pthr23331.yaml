identifier: PANTHER:PTHR23331
label: CXYORF1
definition: >-
  This entry represents members of the WASH1 family, which are components of the WASH complex that is present at the surface of endosomes and activates the Arp2/3-mediated F-actin polymerisation. WASH1 contains N-terminal WASH homology regions (also known as the WAHD domain, which covers the WHD1/EVH1 and WHD2 domains), a proline-rich region and a C-terminal WH2 domain. WASH1 localises to early endosomal subdomains through an essential interaction with FAM21 via its WHD1 domain and directly binds tubulin through its WHD2 domain, while linking to Arp2/3-mediated F-actin polymerisation via its C-terminal WH2 domain.
