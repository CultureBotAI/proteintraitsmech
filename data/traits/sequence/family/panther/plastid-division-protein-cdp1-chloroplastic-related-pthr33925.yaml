identifier: PANTHER:PTHR33925
label: "PLASTID DIVISION PROTEIN CDP1, CHLOROPLASTIC-RELATED"
definition: >-
  This family represents plant plastid division protein CDP1-like, Protein ACCUMULATION AND REPLICATION OF CHLOROPLASTS 6 (ARC6) and its paralogue PARC6, components of the plastid division machinery which are essential for the chloroplast replication process. ARC6 is evolutionarily related to the cyanobacterial cell division protein Ftn2/ZipN, being unique to the division machineries of cyanobacteria and chloroplasts. Their sequences share about 19% identity and are quite conserved along their length. Chloroplast division implies the assembly and constriction of the tubulin-like FtsZ ring on the stromal surface of the inner envelope membrane (IEM) and the dynamin-like ARC5 ring on the cytosolic surface of the outer envelope membrane (OEM). The assembly of these structures is coordinated by a pair of paralogous proteins, ARC6 and PARC6 from the IEM, and PDV2 and PDV1 from the OEM. They contain single transmembrane (TM) domains towards their C terminus with short C-terminal regions extending into the intermembrane space (IMS).
definition_source: "InterPro:IPR044685 abstract (PANTHER PTHR33925 is a member signature)"
