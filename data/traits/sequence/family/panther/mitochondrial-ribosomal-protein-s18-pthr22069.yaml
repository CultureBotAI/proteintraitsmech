identifier: PANTHER:PTHR22069
label: "MITOCHONDRIAL RIBOSOMAL PROTEIN S18"
definition: >-
  The Radial spoke head protein 9 homolog (RSPH9) is involved in the assembly and function of axonemal radial spoke complexes, which are crucial for the motility of sperm and cilia. Members of this family are essential for radial spoke head assembly and central pair microtubule stability, impacting the motility of olfactory and neural cilia. They also play a role in maintaining the structural integrity of ciliary axonemes in both 9+0 and 9+2 motile cilia, which are important for the proper functioning of ependymal motile cilia.
definition_source: "InterPro:IPR055316 abstract (PANTHER PTHR22069 is a member signature)"
