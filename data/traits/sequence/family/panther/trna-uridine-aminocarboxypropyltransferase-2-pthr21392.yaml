identifier: PANTHER:PTHR21392
label: "TRNA-URIDINE AMINOCARBOXYPROPYLTRANSFERASE 2"
definition: >-
  Proteins in this entry contain a DTW domain (with the presence of a central DTXW motif). DTW domain containing protein may have a SAM-dependent acp transferase activity. This entry includes DTWD2, also known as tRNA-uridine aminocarboxypropyltransferase 2, from humans, DTWD2A from Arabidopsis and TAPT (also known as YfiP) from Escherichia coli. TAPT is a tRNA-uridine aminocarboxypropyltransferase that catalyses the formation of 3-(3-amino-3-carboxypropyl)uridine (acp3U) at position 47 of tRNAs.
