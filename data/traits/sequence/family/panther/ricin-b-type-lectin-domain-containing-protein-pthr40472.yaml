identifier: PANTHER:PTHR40472
label: "RICIN B-TYPE LECTIN DOMAIN-CONTAINING PROTEIN"
definition: >-
  SE-cephalotoxin was reported in the salivary gland of the cuttlefish Sepia esculenta. Cephalopods contain toxins in their salivary glands, which may help to paralyse prey animals. This protein seems to be conserved in bonyfishes; it has been found in the swim bladder of the European Eel. This entry also includes protein rapunzel, whose function is still not clear. Mutations of the rapunzel gene cause skeletal overgrowth in Zebrafish.
