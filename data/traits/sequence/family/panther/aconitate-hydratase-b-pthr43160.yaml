  - kind: GENERAL
    text: >-
      ACONITATE HYDRATASE B — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43160. PANTHER protein class: lyase, hydratase. Members are annotated with the molecular function hydro-lyase activity, iron-sulfur cluster binding. Members participate in tricarboxylic acid cycle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Aconitase/IPM Isomerase family is involved in several metabolic pathways, including the tricarboxylic acid (TCA) cycle and the alpha-aminoadipate pathway for lysine biosynthesis. Family members catalyze the isomerization of citrate to isocitrate via cis-aconitate, a key step in the TCA cycle. Some members also catalyze the reversible dehydration of (R)-homocitrate to cis-homoaconitate, which is part of lysine biosynthesis. Additionally, certain proteins within the family are implicated in the catabolism of short chain fatty acids through the TCA and 2-methylcitrate cycles. The family includes proteins with RNA-binding regulatory functions, influencing the synthesis of other proteins and contributing to post-transcriptional regulation. Some members are essential for mitochondrial DNA maintenance, protecting against mutations and breaks. The family is characterized by a diverse range of functions, including metabolic enzyme activity, regulatory roles, and contributions to genetic stability.
    source: "InterPro:IPR050926 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
