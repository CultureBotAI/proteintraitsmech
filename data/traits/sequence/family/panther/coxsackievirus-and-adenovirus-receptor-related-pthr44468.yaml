identifier: PANTHER:PTHR44468
label: "COXSACKIEVIRUS AND ADENOVIRUS RECEPTOR-RELATED"
definition: >-
  This family of proteins is involved in cellular adhesion and integrity, particularly in the formation and maintenance of tight junctions in epithelial cells. They play a crucial role in the epithelial apical junction complex and are implicated in the transepithelial migration of leukocytes. These proteins interact with JAML, a transmembrane protein on leukocytes, to mediate the activation of gamma-delta T-cells, which are important for tissue homeostasis and repair. The signaling cascade triggered by this interaction involves PI3-kinase and MAP kinases, leading to T-cell proliferation and the secretion of cytokines and growth factors that promote epithelial tissue repair. Additionally, in humans, these proteins serve as receptors for Coxsackievirus B and adenoviruses, facilitating microbial infection.
