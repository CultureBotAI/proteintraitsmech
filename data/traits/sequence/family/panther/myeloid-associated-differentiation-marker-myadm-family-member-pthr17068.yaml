identifier: PANTHER:PTHR17068
label: "MYELOID-ASSOCIATED DIFFERENTIATION MARKER MYADM FAMILY MEMBER"
definition: >-
  This entry represents a family of proteins from vertebrates, including Myeloid-associated differentiation marker from human (MYADM). MYADM regulates cell spreading and migration, and membrane condensation. It also mediates Rac1 targeting to ordered membranes. This protein regulates the connection between the plasma membrane and the cortical cytoskeleton, controlling the endothelial inflammatory response. Its expression has been associated with asthma severity. MYADM has been proposed as biomarker for non-small-cell lung cancer. Members of this group of proteins show two tandem Marvel domains (InterPro:IPR008253).
definition_source: "InterPro:IPR047123 abstract (PANTHER PTHR17068 is a member signature)"
