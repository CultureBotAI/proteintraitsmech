identifier: PANTHER:PTHR30328
label: "TRANSCRIPTIONAL REPRESSOR"
definition: >-
  This entry represents proteins containing a homeobox-like domain and a C-terminal domain found in a number of different TetR transcription regulator proteins. The homeobox-like domain binds DNA through a helix-turn-helix (HTH) structure and is very similar in sequence and structure to domains in a wide range of DNA-binding proteins. These proteins are involved in various cellular processes such as osmoprotectant biosynthesis, lipid utilization, antibiotic resistance, and cell division. Members of the family are predominantly from bacteria, but also some homologues from archaea and eukaryotes, and includes, but not limited to, the following: Nucleoid occlusion factor SlmA, a DNA-associated cell division inhibitor that is directly involved in preventing Z ring assembly on portions of the membrane surrounding the nucleoid HTH-type transcriptional regulator BetI, a repressor involved in the biosynthesis of the osmoprotectant glycine betaine from choline HTH-type transcriptional regulator EthR, a repressor from Mycobacterium tuberculosis implicated in ethionamide drug resistance HTH-type transcriptional regulator RutR, a master transcriptional regulator that represses the degradation of pyrimidines and purines from Escherichia coli HTH-type transcriptional regulator UidR, a repressor for the uidRABC operon HTH-type transcriptional regulator AcnR, a repressor of the aconitase gene HTH-type transcriptional regulator KstR2, a repressor of a small regulon that may play a role in the utilization of cholesterol
definition_source: "InterPro:IPR050109 abstract (PANTHER PTHR30328 is a member signature)"
