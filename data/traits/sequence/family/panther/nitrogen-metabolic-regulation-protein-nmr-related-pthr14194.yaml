identifier: PANTHER:PTHR14194
label: "NITROGEN METABOLIC REGULATION PROTEIN NMR-RELATED"
definition: >-
  This entry includes SARED1 from Eschscholzia californica, and At5g02240, At2g37660 from Arabidopsis. This group of proteins evolved from a plant-specific branch of the ubiquitous Rossmann fold NAD(P)H/NAD(P)(+) binding reductases, with NADP-dependent epimerases or hydroxysteroid reductases as the most likely ancestors. Sanguinarine (SA) belongs to a family of plant secondary metabolites called quaternary benzo[c]phenanthridine alkaloids (QBAs). SARED1 is a sanguinarine reductase that catalyses the reduction of benzophenanthridines, preferentially sanguinarine, to the corresponding dihydroalkaloids.
definition_source: "InterPro:IPR044163 abstract (PANTHER PTHR14194 is a member signature)"
