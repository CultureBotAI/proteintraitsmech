identifier: PANTHER:PTHR47043
label: "UDP-N-ACETYLGLUCOSAMINE TRANSFERASE SUBUNIT ALG13"
definition: >-
  This family of proteins includes UDP-N-acetylglucosamine transferase subunits that are essential components in the pathway of protein N-glycosylation. They play a crucial role in the second step of the dolichol-linked oligosaccharide pathway, which is a fundamental process for the proper folding and stability of many proteins. Members of this family are characterized by their enzymatic activity as part of the glycosyltransferase 28 family, catalyzing the transfer of N-acetylglucosamine from UDP-N-acetylglucosamine to dolichol-phosphate.
