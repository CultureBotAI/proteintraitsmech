label: "5-HYDROXYTRYPTAMINE RECEPTOR"
definition: >-
  5-HYDROXYTRYPTAMINE RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24247. PANTHER protein class: G-protein coupled receptor. Members are annotated with the molecular function G protein-coupled amine receptor activity, neurotransmitter receptor activity. Members participate in chemical synaptic transmission, G protein-coupled receptor signaling pathway. Members localise to dendrite, plasma membrane.
