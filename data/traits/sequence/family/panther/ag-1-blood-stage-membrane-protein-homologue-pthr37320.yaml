  - kind: GENERAL
    text: >-
      This family of proteins is involved in the critical process of merozoite invasion into host erythrocytes. Members of this family are associated with the rhoptry, an organelle found in the apicomplexan parasites, and contribute to the proper functioning of rhoptry structures and mechanisms. The activity of these proteins is essential for the parasite's life cycle, particularly in the stage where it infects red blood cells, which is a key step in disease progression in the host.
