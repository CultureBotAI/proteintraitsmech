  - kind: GENERAL
    text: >-
      This family of proteins includes precursors to various hormones that are involved in a wide range of physiological functions. They play a crucial role in the regulation of stress responses and environmental adaptation. Members of this family are involved in increasing skin pigmentation by stimulating melanin production in melanocytes. They also participate in the modulation of appetite through orexigenic and anorexigenic peptides. Additionally, these proteins are involved in the endocrine system, where they stimulate the adrenal glands to release cortisol, a hormone essential for stress response and metabolism regulation. Furthermore, some peptides derived from these precursors act as endogenous opiates, which can influence pain and immune responses.
    source: "InterPro:IPR050878 abstract (LLM-generated, not curator-reviewed)"
