identifier: PANTHER:PTHR31435
label: "PROTEIN NATD1"
definition: >-
  This family represents Gcn5-related N-acetyltransferases (GNAT) ([ec:2.3.1.-]), which catalyse the transfer of the acetyl from the CoA donor to a primary amine of the acceptor and share a domain composed of four conserved sequence motifs A-D. It includes Protein NATD1 from animals, Acetyltransferase At1g77540 from Arabidopsis and the uncharacterised protein YjdJ from E.coli. At1g77540 is a H3/H4 histone acetyltransferase.
