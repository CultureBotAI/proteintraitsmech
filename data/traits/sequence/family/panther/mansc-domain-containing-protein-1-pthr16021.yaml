      MANSC DOMAIN CONTAINING PROTEIN 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR16021. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies localise to Golgi apparatus, intracellular anatomical structure, cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is implicated in the process of erythrocyte invasion by merozoites, which includes binding to erythrocyte surface proteins and possibly interacting with the host cytoskeleton to facilitate cell membrane rupture. Members of this family may also be involved in the formation and function of the food vacuole during the intraerythrocytic lifecycle of the parasite. Additionally, some proteins in this family have been suggested to bind to host proinflammatory cytokines, potentially modulating host immune responses during infection.
    source: "InterPro:IPR052660 abstract (LLM-generated, not curator-reviewed)"
