identifier: PANTHER:PTHR33607
label: ENDONUCLEASE-1
definition: >-
  Bacterial periplasmic or secreted ( ) Escherichia coli endonuclease I (EndoI) is a sequence independent endonuclease located in the periplasm. It is inhibited by different RNA species. It is thought to normally generate double strand breaks in DNA, except in the presence of high salt concentrations and RNA, when it generates single strand breaks in DNA. Its biological role is unknown. Other family members are known to be extracellular. This family also includes a non-specific, Mg 2+ -activated ribonuclease precursor ( ).
