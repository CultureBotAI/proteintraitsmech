identifier: PANTHER:PTHR21227
label: "TRNA-SPLICING ENDONUCLEASE SUBUNIT SEN2"
definition: >-
  tRNA-splicing endonucleases ( ) catalyse the endonucleolytic cleavage of pre tRNA at the 5' and 3' splice sites to release the intron and produces two half tRNA molecules bearing 5' hydroxyl and 2', 3'-cyclic phosphate termini. The genes encoding these proteins are homologous in eukaryotes and archea. The eukaryotic tRNA-splicing endonucleases are heterotetrameric while the archaeal endonucleases can be split into homodimeric and homotetrameric subgroups.
definition_source: "InterPro:IPR006676 abstract (PANTHER PTHR21227 is a member signature)"
