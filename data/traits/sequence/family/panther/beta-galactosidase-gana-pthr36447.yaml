identifier: PANTHER:PTHR36447
label: "BETA-GALACTOSIDASE GANA"
definition: >-
  O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. This group of beta-galactosidase enzymes (EC:3.2.1.23) belong to the glycosyl hydrolase 42 family CAZy:GH42. The enzyme catalyses the hydrolysis of terminal, non-reducing terminal beta-D-galactosidase residues.
