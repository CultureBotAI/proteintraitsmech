identifier: PANTHER:PTHR23360
label: "G-PROTEIN COUPLED RECEPTORS FAMILY 1 PROFILE DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  This entry represents a protein family specific to nematodes. Chemoreception is mediated in Caenorhabditis elegans by members of the seven-transmembrane G-protein-coupled receptor class (7TM GPCRs) of proteins which are of the serpentine type. Srsx is a solo family amongst the superfamilies of chemoreceptors. Chemoperception is one of the central senses of soil nematodes like C. elegans which are otherwise 'blind' and 'deaf'.
definition_source: "InterPro:IPR047130 abstract (PANTHER PTHR23360 is a member signature)"
