identifier: PANTHER:PTHR30414
label: "MINICONDUCTANCE MECHANOSENSITIVE CHANNEL YBDG"
definition: >-
  YbdG is a low-abundance MscM-type mechanosensitive (MS) channel, which sense elevated membrane tension that arises from rapid water influx occurring when cells move from high to low osmolarity environments (hypoosmotic shock). YbdG plays minor roles in maintaining cell integrity, obviating the need to activate the major MS channels, MscS and MscL.
