identifier: PANTHER:PTHR15443
label: "ZONA PELLUCIDA BINDING PROTEIN  SP38"
definition: >-
  This family contains a number of zona-pellucida-binding proteins that seem to be restricted to mammals. These are sperm proteins that bind to the 90kDa family of zona pellucida glycoproteins in a calcium-dependent manner. These represent some of the specific molecules that mediate the first steps of gamete interaction, allowing fertilisation to occur.
