identifier: PANTHER:PTHR46980
label: TRICALBIN-1-RELATED
definition: >-
  This family of proteins may be involved in membrane trafficking processes. Members are characterized by the presence of C2 domains, which in some cases show Ca(2+)-dependent phospholipid binding, suggesting a role in membrane interactions and signaling. The C2 domains bind to various phospholipids, including phosphatidylserine and phosphoinositides. Additionally, some members contain an SMP-LTD domain, which is a barrel-like structure capable of binding and transferring glycerophospholipids between bilayers. The combination of these domains indicates a functional role in lipid transport and membrane organization.
