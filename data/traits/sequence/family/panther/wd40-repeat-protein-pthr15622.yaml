  - kind: GENERAL
    text: >-
      This family of proteins includes components that are likely involved in ubiquitination and proteasomal degradation pathways. They are thought to act as substrate-recognition parts of SCF-like ECS E3 ubiquitin ligase complexes. These complexes play a crucial role in targeting specific proteins for ubiquitination, marking them for degradation by the proteasome. The presence of a SOCS box domain suggests these proteins interact with the Elongin BC complex, which is an adapter for various E3 ubiquitin ligase complexes. Some family members are known to recognize specific substrates such as type II iodothyronine deiodinase/DIO2 and may regulate the stability of other proteins like HIPK2 through proteasomal degradation.
    source: "InterPro:IPR051983 abstract (LLM-generated, not curator-reviewed)"
