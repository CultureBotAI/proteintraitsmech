  - kind: GENERAL
    text: >-
      This family of proteins includes prolyl 3-hydroxylases and prolyl 3,4-dihydroxylases that are involved in the post-translational modification of the small ribosomal subunit protein uS12. The hydroxylation of a specific proline residue within uS12 is crucial for regulating the efficiency of protein translation termination. Some members of this family are also implicated in the formation of stress granules, which are involved in mRNA triage and cellular stress responses. The family is characterized by a shared evolutionary origin and is collectively referred to as the TPA1 family, indicating a conserved function across diverse species.
