  - kind: GENERAL
    text: >-
      This family of proteins is involved in neurodegeneration and transcription regulation. Members act as components of the STAGA transcription coactivator-HAT complex, mediating interactions with CRX, a photoreceptor cell-specific transcription factor, and contributing to CRX-dependent gene activation. They are also necessary for the stabilization of the microtubule cytoskeleton, which is crucial for maintaining cell structure and facilitating intracellular transport.
