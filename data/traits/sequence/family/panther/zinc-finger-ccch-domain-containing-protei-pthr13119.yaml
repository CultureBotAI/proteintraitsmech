identifier: PANTHER:PTHR13119
label: "ZINC FINGER CCCH DOMAIN-CONTAINING PROTEI"
definition: >-
  This entry includes protein suppressor of sable (also known as Su(s)) from flies and related proteins from eukaryotes. They contain closely related CCCH zinc finger (ZF) motifs. Su(s) is a nuclear RNA-binding protein that inhibits the accumulation of certain aberrant mRNAs. It has been shown to interact with Wdr82, and together they inhibit Pol II elongation through Hsp70-alphabeta elements.
