identifier: PANTHER:PTHR21584
label: "DIFFERENTIAL DISPLAY AND ACTIVATED BY P53  DDA3 /G2 S PHASE EXPRESSED 1"
definition: >-
  This is a family of phosphoproteins which includes proline/serine-rich coiled-coil protein 1 (PSRC1, also known as DDA3) and G2 and S phase-expressed protein 1 (GTSE1). DDA3 is a microtubule-destabilising protein that controls spindle dynamics and mitotic progression by regulating microtubule depolymerases, such as Kif2a and MCAK. Deletion of DDA3 causes spindle hyper-stabilisation, inter-kinectochore tension loss, chromosome congression defects. This leads to unaligned chromosomes at metaphase and the accumulation of CENP-E (a plus end-motor protein) at kinectochore in these chromosomes. It has also been suggested that DDA3 may participate in p53/TP53-regulated growth suppression.
