identifier: PANTHER:PTHR23330
label: "P300 TRANSCRIPTIONAL COFACTOR JMY-RELATED"
definition: >-
  P300 TRANSCRIPTIONAL COFACTOR JMY-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23330. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function protein-containing complex binding. Subfamilies participate in actin cytoskeleton organization, Arp2/3 complex-mediated actin nucleation. Subfamilies localise to intracellular anatomical structure, cytoplasm.
definition_source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
