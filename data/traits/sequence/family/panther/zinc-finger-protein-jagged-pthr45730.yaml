identifier: PANTHER:PTHR45730
label: "ZINC FINGER PROTEIN JAGGED"
definition: >-
  This entry represents a group of plant zinc finger proteins, including JAGGED, JAGGED-like from Arabidopsis and STAMENLESS 1 from rice. JAGGED is a transcription factor activated in the emerging organ primordia and in the distal region of immature organs. It controls growth anisotropy and coordination between cell size and cell cycle during plant organogenesis. JAGGED-like acts redundantly with JAGGED to define stamen and carpel shape. STAMENLESS 1 regulates floral organ identity and cell proliferation in the inner floral whorls. It may specify the identities of lodicule and stamen through positive regulation of MADS16 expression. May contribute to morphogenesis by suppressing OSH1 expression in the lateral organs.
definition_source: "InterPro:IPR045320 abstract (PANTHER PTHR45730 is a member signature)"
