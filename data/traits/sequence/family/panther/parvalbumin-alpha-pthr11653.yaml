identifier: PANTHER:PTHR11653
label: "PARVALBUMIN ALPHA"
definition: >-
  Fish allergies are common in Europe, particularly among male children and young adults. Children allergic to fish react variably to different species. Cod is among the most common offenders, while salmon is the one best tolerated. The allergy-eliciting protein has been isolated from the white muscle albumin. It is a parvalbumin, designated Allergen M. Parvalbumins are calcium (Ca)-binding proteins of low molecular weight. Like many other Ca-binding proteins, they belong to the EF-hand family characterised by helix-loop-helix (HLH) binding motifs (two helices pack together at an angle of ~90 degrees, separated by a loop region where calcium binds). In the parvalbumin HLH structural motif, calcium is coordinated through one carbonyl oxygen atom and the oxygen-containing side-chains of 5 amino acid residues, or 4 residues and a water molecule. Initially, parvalbumins were detected in relatively high amounts in lower vertebrate white muscle, where they were thought to be important for fibre relaxation. They were subsequently found, although in lesser amounts, in the fast twitch skeletal muscles of higher vertebrates, as well as in a variety of non-muscle tissues, including testis, endocrine glands, skin and specific neurons. There are two distinct phylogenetic lineages: alpha and beta. Most muscles contain parvalbumin of only alpha or beta origin. Cod parvalbumin belongs to the beta-lineage and shares significant similarity with parvalbumin of other fish species. Allergen M contains 113 residues, is a homogenous acidic protein and belongs to a group of muscle sarcoplasmic proteins. It carries the major allergenic determinants associated with cod sensitivity, which is dependent directly on the linear structure rather than on the molecular conformation. The allergenic activit
