identifier: PANTHER:PTHR46668
label: "BTB/POZ DOMAIN AND ANKYRIN REPEAT-CONTAINING PROTEIN NH5.2"
definition: >-
  This entry represents a group of plant BTB/POZ domain and ankyrin repeat-containing proteins, including NPR5/6 from Arabidopsis and NOOT1 from Medicago truncatula. NPR5 and NPR6, also known as BLADE ON PETIOLE 2 and 1 (BOP2/1), regulates Arabidopsis thaliana lateral organ cell fate and polarity through regulation of LOB domain and adaxial-abaxial polarity genes. They function as transcriptional activators during Arabidopsis thaliana leaf formation. They are also required for maintaining floral fate. In Gossypium hirsutum BLADE-ON-PETIOLE1 homologue, GhBOP1, is involved in in plant defence against a fungal pathogen.
definition_source: "InterPro:IPR044284 abstract (PANTHER PTHR46668 is a member signature)"
