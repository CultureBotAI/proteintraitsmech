identifier: PANTHER:PTHR37394
label: "PROTEIN PARTING DANCERS"
definition: >-
  This family of plant proteins includes Arabidopsis parting dancers (PTD), a protein that is required for chromosome segregation during meiosis. It is involved in type I crossover formation.
