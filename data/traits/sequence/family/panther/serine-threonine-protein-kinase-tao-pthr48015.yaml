    method: GENERATED
  - kind: GENERAL
    text: >-
      The STE20 protein kinase family is involved in various signaling pathways that regulate key cellular processes. Members of this family function as MAP4K components in the MAPK pathway, playing crucial roles in responses to mating pheromones, cell polarity, and cell cycle regulation. They are also integral to the Hippo signaling pathway, which is pivotal for organ size control and tumor suppression by modulating cell proliferation and apoptosis. STE20 kinases phosphorylate a range of substrates, including histone H2B and various regulatory proteins, influencing apoptosis, cytoskeleton dynamics, cell adhesion, migration, and transcriptional regulation. Their kinase activity is regulated by caspase cleavage, homodimerization, autophosphorylation, and interactions with small G proteins and regulatory proteins.
    source: "InterPro:IPR050285 abstract (LLM-generated, not curator-reviewed)"
