  - kind: GENERAL
    text: >-
      SERINE/THREONINE-PROTEIN KINASE TAO — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48015. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. and participate in regulation of response to stimulus, regulation of cell communication, regulation of MAPK cascade.
