identifier: PANTHER:PTHR47835
label: "HFM1, ATP DEPENDENT DNA HELICASE HOMOLOG"
definition: >-
  This family of proteins includes ATP-dependent DNA helicases that play a crucial role in meiotic recombination. They are involved in the formation of crossovers and the complete synapsis of homologous chromosomes, which are essential for accurate chromosome segregation during meiosis. These helicases preferentially unwind DNA in the 3' to 5' direction and are specific to recombination events that result in interference-sensitive crossovers, also known as class I meiotic crossovers. Their activity is necessary for the proper formation of bivalents, structures formed by a pair of synapsed homologous chromosomes, ensuring genetic diversity and stability in the resulting gametes.
