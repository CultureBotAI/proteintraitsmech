identifier: PANTHER:PTHR47391
label: "BIORIENTATION OF CHROMOSOMES IN CELL DIVISION 1 LIKE 1"
definition: >-
  This entry represents the human Biorientation of chromosomes in cell division protein 1-like 1 (also known as BOD1L1, UniProtKB:Q8NFC6) and related proteins. BOD1L1 is a component of the fork protection machinery required to protect stalled/damaged replication forks from uncontrolled DNA2-dependent resection. It acts by stabilising RAD51 at stalled replication forks and protecting RAD51 nucleofilaments from the antirecombinogenic activities of FBH1 and BLM. This entry also includes the paralogous BOD1L2 and BOD1 that are required for proper chromosome biorientation through the detection or correction of syntelic attachments in mitotic spindles.
