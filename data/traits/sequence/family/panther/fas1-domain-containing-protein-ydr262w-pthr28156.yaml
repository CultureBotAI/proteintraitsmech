identifier: PANTHER:PTHR28156
label: "FAS1 DOMAIN-CONTAINING PROTEIN YDR262W"
definition: >-
  This entry represents a group of FAS1 domain-containing proteins, including Mug57 from S. pombe and YDR262W from S. cerevisiae. Mug57 is a meiotically upregulated gene (mug) that may have a role in sporulation.
