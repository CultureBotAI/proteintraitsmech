identifier: PANTHER:PTHR20959
label: "TRANSPORT AND GOLGI ORGANIZATION PROTEIN 6 FAMILY MEMBER"
definition: >-
  This entry includes Rtp1 from yeasts and TANGO6 from animals. Rtp1 is required for RNA polymerase II biogenesis. TANGO6 may be involved in protein secretion and Golgi organization.
