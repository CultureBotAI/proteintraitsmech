identifier: PANTHER:PTHR31983
label: "ENDO-1,3(4)-BETA-GLUCANASE 1"
definition: >-
  This is a family of endo-beta-1,3(4)-glucanases belonging to glycoside hydrolase family 81 (CAZy:GH81) that are also known as Glucan endo-1,3-beta-D-glucosidases. Proteins in this entry include fission yeast Eng1/Eng2 and budding yeast Dse4 (also known as Eng1). They have been shown to hydrolyse linear beta-1,3-glucan chains. Eng1 is required for the degradation of the primary septum after completion of cytokinesis. Eng2 may couple the endocytic coat to the actin module. This entry also includes some uncharacterised proteins from plants and bacteria. O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
