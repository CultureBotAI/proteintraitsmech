identifier: PANTHER:PTHR42917
label: "2,4-DIENOYL-COA REDUCTASE"
definition: >-
  This family of proteins includes various NADH:flavin oxidoreductases and NADH oxidases. Members of this family are involved in a range of redox reactions, often utilizing NADH or NADPH as electron donors to reduce flavin or other substrates. They play roles in metabolic processes such as the beta-oxidation of unsaturated fatty acids, bile acid degradation, heme degradation and the reduction of metal ions. These enzymes typically contain binding domains for FMN, FAD, and NAD(P)H, and may have additional domains that contribute to their specific functions. They are characterised by their ability to catalyse oxidation-reduction reactions, which are essential for various cellular processes, including energy production and detoxification.
definition_source: "InterPro:IPR051793 abstract (PANTHER PTHR42917 is a member signature)"
