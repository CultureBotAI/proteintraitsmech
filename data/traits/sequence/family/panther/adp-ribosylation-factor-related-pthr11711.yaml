identifier: PANTHER:PTHR11711
label: "ADP RIBOSYLATION FACTOR-RELATED"
definition: >-
  This entry represents a branch of the small GTPase superfamily that includes the ADP ribosylation factor Arf, Arl (Arf-like), and Arp (Arf-related proteins). Arf proteins are major regulators of vesicle biogenesis in intracellular traffic. They cycle between inactive GDP-bound and active GTP-bound forms that bind selectively to effectors. The classical structural GDP/GTP switch is characterised by conformational changes at the so-called switch 1 and switch 2 regions, which bind tightly to the gamma-phosphate of GTP but poorly or not at all to the GDP nucleotide. Structural studies of Arf1 and Arf6 have revealed that although these proteins feature the switch 1 and 2 conformational changes, they depart from other small GTP-binding proteins in that they use an additional, unique switch to propagate structural information from one side of the protein to the other. This entry also includes Signal recognition particle receptor subunit beta (SRbeta), which is closely related to Arf- and Ras-type GTPases by sequence. It contains a cysteine within the G1 GTPase consensus sequence where most Ras-type GTPases contain a glycine and members of the Arf family of GTPases contain an aspartic acid at this position. The identity of this amino acid appears to be crucial to the activity of Arf and Ras GTPases, which explains why SR beta doesn't have GTPase activity and differs functionally from both Arf-like and other Ras-type GTPases. SRbeta is involved in the targeting of nascent polypeptide chains to the protein translocation machinery in the endoplasmic reticulum membrane. Small GTPases form an independent superfamily within the larger class of regulatory GTP hydrolases. This superfamily contains proteins that control a vast number of important processes and possess a common, structur
