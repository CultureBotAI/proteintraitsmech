identifier: PANTHER:PTHR11048
label: PRENYLTRANSFERASES
definition: >-
  This entry includes various prenyltransferases, including: 4-hydroxybenzoate octaprenyltransferase (ubiA) catalyses the prenylation of para-hydroxybenzoate, a step in the biosynthesis of ubiquinone-8. mitochondrial 4-hydroxybenzoate polyprenyltransferase catalyses the prenylation of para-hydroxybenzoate, a step in the biosynthesis of coenzyme Q. Decaprenyl-phosphate phosphoribosyltransferase transfers a 5-phosphoribosyl residue from phosphoribose diphosphate to decaprenyl phosphateto form decaprenylphosphoryl-5-phosphoribose, a step in the biosynthesis of decaprenylphosphoryl arabinose, a precursor of a component required for mycobacterial cell wall biosynthesis. 4-hydroxybenzoate geranyltransferases 1 and 2 required for the biosynthesis of shikonin, a naphthoquinone secondary metabolite in plants. 4-hydroxybenzoate solanesyltransferase prenylates para-hydroxybenzoate during plastoquinone-9 biosynthesis.
definition_source: "InterPro:IPR039653 abstract (PANTHER PTHR11048 is a member signature)"
