identifier: PANTHER:PTHR21456
label: "FAMILY WITH SEQUENCE SIMILARITY 102"
definition: >-
  This entry includes human early estrogen-induced gene proteins 1 and 2 (EEIG1/2), also known as FAM102A and FAM102B, respectively, and some uncharacterised proteins from fungi. EEIG1 was first identified as early estrogen-inducible gene in breast cancer cell lines. More recently, EEIG1 has been described as a RANK ligand (RANKL)-inducible protein that controls RANK-mediated osteoclast formation, which constitutes a possible therapeutic target for pathological bone destruction.
