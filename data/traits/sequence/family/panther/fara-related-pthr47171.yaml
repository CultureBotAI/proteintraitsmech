  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that regulate the expression of genes involved in the catabolism of amides, omega amino acids, and lactams. Some members are also implicated in the biosynthesis and detoxification of fusaric acid and its derivatives, which are mycotoxins with phytotoxic properties. The proteins play a role in the positive regulation of gene expression in response to specific inducers and contribute to the self-protection of the fungus by preventing the accumulation of toxic compounds.
