identifier: PANTHER:PTHR12788
label: "PROTEIN-TYROSINE SULFOTRANSFERASE 2"
definition: >-
  Protein-tyrosine sulfotransferase catalyses the O-sulfation of tyrosine residues within acidic motifs of polypeptides, a common post-translational modification in eukaryotes. Mammals possess two protein-tyrosine sulfotransferases, designated TPST-1 and TPST-2. This family also includes NoeE from Sinorhizobium fredii, which is required for the formation of sulfated nod factor.
