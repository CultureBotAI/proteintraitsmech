identifier: PANTHER:PTHR34550
label: "30S RIBOSOMAL PROTEIN S31, CHLOROPLASTIC"
definition: >-
  This entry includes small ribosomal subunit protein bTHXc/bTHXm from plant chloroplast and mitochondria, closely related to bacterial ribosomal small subunit protein bTHX (previously THX). Proteins in this entry have additional N-terminal transit peptides.
