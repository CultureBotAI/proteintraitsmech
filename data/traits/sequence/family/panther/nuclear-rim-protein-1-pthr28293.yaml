identifier: PANTHER:PTHR28293
label: "NUCLEAR RIM PROTEIN 1"
definition: >-
  This entry includes Nur1 from budding yeasts and Mug154 from fission yeasts. Nur1 is part of the perinuclear network that controls recombination at multiple loci to maintain genome stability. Mug15 may has a role in meiosis.
