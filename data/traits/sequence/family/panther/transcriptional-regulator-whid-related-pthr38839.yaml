identifier: PANTHER:PTHR38839
label: "TRANSCRIPTIONAL REGULATOR WHID-RELATED"
definition: >-
  WhiB is a putative transcription factor in Actinobacteria, required for differentiation and sporulation. The process of mycelium formation in Streptomyces, which occurs in response to nutrient limitation, is controlled by a number of whi genes, named for the white colour of aerial hyphae when mutations occur in these genes. The normal colour is grey. The exact role of WhiB is not clear, but a mutation in the gene results in white, tightly coiled aerial hyphae.
definition_source: "InterPro:IPR003482 abstract (PANTHER PTHR38839 is a member signature)"
