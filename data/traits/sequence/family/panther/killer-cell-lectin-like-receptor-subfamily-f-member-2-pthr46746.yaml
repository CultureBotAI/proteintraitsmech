  - kind: GENERAL
    text: >-
      The protein family is composed of C-type lectin domain-containing receptors with diverse roles in the immune system. Members are involved in pathogen recognition, mediating immune cell interactions, and antigen presentation. They recognize various molecular patterns, including those from bacteria, fungi, and damaged cells, and are implicated in the activation and modulation of immune responses. Some family members function as costimulatory molecules, enhancing T-cell proliferation, or as endocytic receptors, facilitating antigen uptake and presentation. Others contain ITIM motifs, which modulate cellular responses by binding phosphatases upon phosphorylation. Collectively, the family contributes to innate and adaptive immunity by detecting pathogens, presenting antigens, and regulating immune cell signaling.
