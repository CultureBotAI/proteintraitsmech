identifier: PANTHER:PTHR23090
label: "NH 3 /GLUTAMINE-DEPENDENT NAD +  SYNTHETASE"
definition: >-
  This entry represents NAD(+) synthetases, including glutamine-dependent NAD(+) synthetases and NH(3)-dependent NAD(+) synthetases. NAD+ is involved electron transport and redox reactions and in DNA ligation and protein ADP-ribosylation. In yeast and most other organisms, NAD is generated through the de novo pathway and the salvage pathway. In the de novo pathway, quinolinic acid is converted to nicotinic acid mononucleotide (NaMN). In the salvage pathway, NaMN is generated by recycling of nicotinamide. Both pathways converge on NaMN, which is then converted into deamido-NAD+. Subsequently, deamido-NAD+ is converted to NAD+ by NAD+ synthetase. NAD+ synthetase has been extensively studied in bacteria. It is encoded by nadE gene in E. coli and by outB gene in B. subtilis. These prokaryotic enzymes are ammonia-dependent (containing an ammonia-utilising domain). However, some pokaryotic NAD(+) synthetases, such as that from Mycobacterium tuberculosis, contain a nitrilase-related domain, are glutamine-dependent.
