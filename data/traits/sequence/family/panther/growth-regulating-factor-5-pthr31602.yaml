identifier: PANTHER:PTHR31602
label: "GROWTH-REGULATING FACTOR 5"
definition: >-
  Growth-regulating factors (GRFs) are transcription factors that play a regulatory role in growth and development of leaves and cotyledons. Typical GRFs contain QLQ and WRC domains. The QLQ domain is involved in protein-protein interactions, while the WRC domain contains a nuclear localisation signal and a DNA-binding motif. Arabidopsis have 9 GRF members (AtGRF1-9): AtGRF1 and AtGRF2 act as transcriptional activators; AtGRF1 and AtGRF3 contribute to the regulation of various biological processes associated with defense response and disease resistance; AtGRF7 has been reported to function as transcriptional repressor of osmotic stress-responsive genes by binding to the cis-element TGTCAGG.
