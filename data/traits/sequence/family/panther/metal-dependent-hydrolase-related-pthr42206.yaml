identifier: PANTHER:PTHR42206
label: "METAL-DEPENDENT HYDROLASE-RELATED"
definition: >-
  This entry represents Uncharacterized protein MJ1127 and proteins that are related to a large superfamily of metalloenzymes. It shares protein sequence similarity with TatD, which is a DNase that is also part of the twin-arginine translocation (Tat) system that transports large folded proteins containing a characteristic twin-arginine motif in their signal peptide across membranes in Escherichia coli.
