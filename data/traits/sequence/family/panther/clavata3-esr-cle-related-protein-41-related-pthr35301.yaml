identifier: PANTHER:PTHR35301
label: "CLAVATA3/ESR (CLE)-RELATED PROTEIN 41-RELATED"
definition: >-
  This entry includes CLAVATA3/ESR (CLE)-related protein 41/42/44 (CLE41/42/44) from Arabidopsis and TDIF from Zinnia violacea. TDIF functions as a phloem-derived, non-cell-autonomous signal that controls stem cell fate in the procambium. Tracheary element differentiation inhibition factor (TDIF and CLE41/CLE44 peptides act as inhibitors of tracheary element differentiation. TDIF/CLE41/CLE44 promote the proliferation of vascular cells and prevent them from differentiating into xylem by regulating WOX4 expression through the TDR/PXY receptor. CLE42 binds PXL2 (PXY-like 2). TDIF-related peptides also have activity to enhance axillary bud formation. CLE proteins share a C-terminal CLE domain with CLV3, a small secreted polypeptide active as a ligand with a function in shoot apical meristem maintenance. CLE proteins are synthesised as precursors with an N-terminal signal peptide and are C-terminally processed to generate short bioactive peptides of approximately 12-14 amino acids. The mature peptides are secreted to the extracellular space where they function as signalling molecules in a variety of developmental and physiological processes. CLE peptides contain conserved hydroxyproline residues that undergo O-glycosylation with arabinose, which enhances receptor binding affinity. CLV3 and other A-type CLE peptides are involved in the suppression of stem cell development in root and shoot development, in contrast to the B-type CLE peptides CLE41 and CLE44 in Arabidopsis, which are not. In legumes, specific CLE peptides regulate nodulation through the SUNN receptor kinase pathway, controlling the autoregulation of nodulation to limit nodule numbers based on nitrogen availability, and some CLE peptides also regulate arbuscular mycorrhizal colonisation by modulating strigolactone
