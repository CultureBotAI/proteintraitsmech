identifier: PANTHER:PTHR14928
label: "MICRO-RNA BINDING ZINC FINGER CCCH DOMAIN-CONTAINING PROTEIN 7"
definition: >-
  Zinc finger CCCH domain-containing proteins A (ZC3H7A) and B (ZC3H7B) bind to microRNAs MIR7-1, MIR16-2 and MIR29A hairpins recognizing the 3'-ATA(A/T)-5' motif in the apical loop. Homologues are known from animals.
