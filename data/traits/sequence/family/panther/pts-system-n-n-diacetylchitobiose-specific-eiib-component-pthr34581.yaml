identifier: PANTHER:PTHR34581
label: "PTS SYSTEM N,N'-DIACETYLCHITOBIOSE-SPECIFIC EIIB COMPONENT"
definition: >-
  This family of proteins is involved in the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS), which is a major carbohydrate active transport system. These proteins function by catalyzing the phosphorylation of incoming sugar substrates simultaneously with their translocation across the cell membrane. Members of this family are responsible for the transport of various sugars including N,N'-diacetylchitobiose, galactose, lichenan, cellobiose, and oligo-beta-mannosides. They contain a PTS EIIB type-3 domain that is phosphorylated by phospho-EIIA on a cysteinyl residue, which then transfers the phosphoryl group to the sugar substrate in coordination with the sugar uptake processed by the PTS EIIC type-3 domain.
