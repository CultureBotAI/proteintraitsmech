identifier: PANTHER:PTHR24055
label: "MITOGEN-ACTIVATED PROTEIN KINASE"
definition: >-
  Mitogen-activated protein (MAP) kinases are integral components of kinase cascades, in which at least three protein kinases act sequentially to ultimately activate the MAP kinase itself. Activation occurs via dual phosphorylation on conserved threonine and tyrosine residues within a TXY motif. The MAP kinase family is involved in numerous cellular processes, including proliferation, differentiation, migration, transformation, and programmed cell death. These kinases are typically activated by a variety of extracellular stimuli, such as pro-inflammatory cytokines and physical stress. Once activated, MAP kinases phosphorylate a wide array of substrates, including transcription factors, cytoskeletal components, and regulators of apoptosis, translation, and other signalling pathways. They play a central role in signal transduction mechanisms, notably the MAPK/ERK cascade, influencing key cellular functions such as growth, adhesion, survival, and differentiation. In addition to their roles in transcriptional regulation, MAP kinases also participate in the modulation of endosomal dynamics, including lysosome processing, endosome cycling, and Golgi apparatus fragmentation during mitosis.
definition_source: "InterPro:IPR050117 abstract (PANTHER PTHR24055 is a member signature)"
