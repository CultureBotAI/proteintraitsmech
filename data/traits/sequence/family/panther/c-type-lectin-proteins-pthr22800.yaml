identifier: PANTHER:PTHR22800
label: "C-TYPE LECTIN PROTEINS"
definition: >-
  The NKG2/CD94 receptor family includes activating and inhibitory receptors expressed on natural killer (NK) cells and some T-cell subsets. These receptors play crucial roles in immune surveillance by recognizing MHC class I molecules, particularly HLA-E in humans, which present self or virally derived peptides. The family members regulate NK cell activation, effector functions, and contribute to the immune response against viral infections and tumor cells. They are involved in maternal-fetal tolerance and may be implicated in autoimmunity prevention. Some family members can induce cell exhaustion in the tumor microenvironment, acting as immune checkpoints. Viral evasion strategies include the manipulation of these receptors to avoid immune detection. The receptors typically signal through associations with adapter proteins like TYROBP/DAP12, leading to cell activation or inhibition via phosphorylation or dephosphorylation of signaling molecules.
