identifier: PANTHER:PTHR12963
label: "THYROID RECEPTOR INTERACTING PROTEIN RELATED"
definition: >-
  Activating signal cointegrator 1 (TRIP4) is a transcription coactivator that interacts with nuclear receptors, including thyroid hormone receptor, the androgen receptor and ESR1, provided ligand is bound to the receptor. This interaction facilitates nuclear receptor-mediated transcription. TRIP4 contains a C4-type zinc finger. It is polyufmylated by the UFM1-conjugating system and deufmylated by the protease UFSP2; ufmylation promotes the recruitment of additional transcriptional coactivators. TRIP4 also functions as part of the RQC trigger (RQT) complex that activates the ribosome quality control (RQC) pathway, a pathway that degrades nascent peptide chains during problematic translation. This entry also includes TRIP4 orthologues from yeast, RQT4, which is part of the RQC trigger (RQT) complex that activates the ribosome quality control (RQC) pathway, a pathway that degrades nascent peptide chains during problematic translation.
