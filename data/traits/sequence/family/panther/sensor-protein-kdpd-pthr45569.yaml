  - kind: GENERAL
    text: >-
      SENSOR PROTEIN KDPD — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45569. Members are annotated with the molecular function phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein, kinase activity. and localise to cell periphery, cellular anatomical entity, membrane.
