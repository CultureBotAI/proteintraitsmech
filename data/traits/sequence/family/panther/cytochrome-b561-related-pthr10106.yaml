identifier: PANTHER:PTHR10106
label: "CYTOCHROME B561-RELATED"
definition: >-
  This entry represents a group of transmembrane reductases, including CYBRD1/CYB561/CYB561A3 from humans. Cytochrome b561 is a ferric-chelate reductase that reduces Fe3+ to Fe2+ before its transport from the endosome to the cytoplasm. It probably uses ascorbate as an electron donor. Cytochrome b reductase 1 (CYBRD1) is an iron-regulated ferric reductase that catalyses the reduction of ferric to ferrous ion in the process of iron absorption in duodenal enterocytes. It shares protein sequence similarity with cytochrome b561, an enzyme involved in the regeneration of ascorbic acid (AA) from semi dehydroascorbic acid (DHA) or ascorbate free radical (AFR). CYB561A3 is a lysosomal membrane ascorbate-dependent ferrireductas.
definition_source: "InterPro:IPR043205 abstract (PANTHER PTHR10106 is a member signature)"
