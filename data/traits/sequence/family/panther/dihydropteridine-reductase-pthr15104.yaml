identifier: PANTHER:PTHR15104
label: "DIHYDROPTERIDINE REDUCTASE"
definition: >-
  DIHYDROPTERIDINE REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15104. PANTHER protein class: reductase, oxidoreductase. Members are annotated with the molecular function nucleoside phosphate binding, nucleotide binding, heterocyclic compound binding. Members participate in organic hydroxy compound metabolic process, cellular aromatic compound metabolic process, proteinogenic amino acid metabolic process. Members localise to cytoplasm.
