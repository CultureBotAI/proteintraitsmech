definition: >-
  DIHYDROPTERIDINE REDUCTASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR15104. PANTHER protein class: reductase, oxidoreductase. Members are annotated with the molecular function nucleotide binding, anion binding, oxidoreductase activity. Members participate in aromatic amino acid family catabolic process, L-amino acid metabolic process, proteinogenic amino acid metabolic process. Members localise to cytoplasm.
