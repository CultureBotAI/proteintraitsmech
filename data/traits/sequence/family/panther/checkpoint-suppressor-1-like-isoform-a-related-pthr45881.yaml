identifier: PANTHER:PTHR45881
label: "CHECKPOINT SUPPRESSOR 1-LIKE, ISOFORM A-RELATED"
definition: >-
  CHECKPOINT SUPPRESSOR 1-LIKE, ISOFORM A-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45881. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Subfamilies participate in regulation of transcription by RNA polymerase II.
