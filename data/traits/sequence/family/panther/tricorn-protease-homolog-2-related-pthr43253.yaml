identifier: PANTHER:PTHR43253
label: "TRICORN PROTEASE HOMOLOG 2-RELATED"
definition: >-
  This is a group of serine peptidases belong to the MEROPS peptidase family S41. The members of this group contain the tricorn core protease of bacteria and archaea. The tricorn protease is responsible for degrading oligopeptides, probably derived from the proteasome. Its crystal structure has been resolved to 2 A resolution.
