identifier: PANTHER:PTHR48007
label: "LEUCINE-RICH REPEAT RECEPTOR-LIKE PROTEIN KINASE PXC1"
definition: >-
  This family includes a group of plant LRR receptor-like serine/threonine-protein kinases including pollen receptor-like kinases 1-6 (PRKs 1-6) and some members of STRUBBELIG-RECEPTOR FAMILY (SRF1/4/7). This family also include inactive kinase At1g60630. PRK1 and PRK2 are involved in the control of pollen germination and pollen tube polar growth. SRF4 is required for the control of leaf size.
