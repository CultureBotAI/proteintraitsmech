identifier: PANTHER:PTHR43260
label: 3-KETOSTEROID-DELTA-1-DEHYDROGENASE
definition: >-
  This entry represents family of KsdD-like steroid dehydrogenases and related proteins. 3-Ketosteroid delta(1)-dehydrogenase catalyzes the 1(2)-dehydrogenation of 3-ketosteroid substrates using flavin adenine dinucleotide as a cofactor. The enzyme plays a crucial role in microbial steroid degradation, both under aerobic and anaerobic conditions, by initiating the opening of the steroid nucleus.
