identifier: PANTHER:PTHR28063
label: "RNA POLYMERASE II NUCLEAR LOCALIZATION PROTEIN IWR1"
definition: >-
  Budding yeast Iwr1 binds to Pol II and directs its nuclear import. It also plays an important role in preinitiation complex formation by all three nuclear RNA polymerases.
