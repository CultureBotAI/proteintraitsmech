identifier: PANTHER:PTHR46320
label: "GLYCEROPHOSPHODIESTER PHOSPHODIESTERASE 1"
definition: >-
  GLYCEROPHOSPHODIESTER PHOSPHODIESTERASE 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46320. PANTHER protein class: phosphodiesterase, hydrolase. Members are annotated with the molecular function hydrolase activity, phosphoric diester hydrolase activity, phosphoric ester hydrolase activity. and participate in organic hydroxy compound metabolic process, nitrogen compound metabolic process, biogenic amine metabolic process. and localise to cell periphery, membrane, plasma membrane.
