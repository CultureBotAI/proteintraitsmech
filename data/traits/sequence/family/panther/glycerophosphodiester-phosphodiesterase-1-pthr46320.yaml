definition: >-
  GLYCEROPHOSPHODIESTER PHOSPHODIESTERASE 1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46320. PANTHER protein class: phosphodiesterase, hydrolase. Members are annotated with the molecular function phosphoric diester hydrolase activity. Members participate in phospholipid metabolic process, alcohol metabolic process, biogenic amine metabolic process. Members localise to plasma membrane, cell periphery.
