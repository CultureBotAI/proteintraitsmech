  - kind: GENERAL
    text: >-
      This family of proteins includes major seed storage prolamins, which are plant storage proteins primarily found in seeds. They are rich in proline and glutamine and are typically found in the endosperm of cereals. These proteins play a crucial role in the storage of nitrogen, carbon, and sulfur for the developing seedling. They are also involved in the formation of protein bodies during seed development and are important for the nutritional quality of the seed, as they are a source of amino acids for humans and animals. Members of this family are characterized by their solubility in alcohol-based solutions and their insolubility in water, which is a distinctive feature of prolamins.
    source: "InterPro:IPR051529 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
