identifier: PANTHER:PTHR34990
label: "UDP-2,3-DIACYLGLUCOSAMINE HYDROLASE-RELATED"
definition: >-
  LpxH (also known as YbbF) is an Escherichia coli UDP-2,3-diacylglucosamine hydrolase thought to catalyse the fourth step of lipid A biosynthesis, in which a precursor UDP-2,3-diacylglucosamine is hydrolysed to yield 2,3-diacylglucosamine 1-phosphate and UMP. YbbF belongs to the metallophosphatase (MPP) superfamily. MPPs are functionally diverse, but all share a conserved domain with an active site consisting of two metal ions (usually manganese, iron, or zinc) coordinated with octahedral geometry by a cage of histidine, aspartate, and asparagine residues. This entry includes Escherichia coli LpxH (YbbF) and related proteins. Most of the proteins in this entry contain a metallophosphatase domain.
