  - kind: GENERAL
    text: >-
      The PDZ and LIM domain protein family is involved in a variety of cellular processes including the organization of the cytoskeleton, cell migration, and maintaining cell polarity. Members act as molecular adapters, linking proteins to the cytoskeleton and coordinating protein-protein interactions at focal adhesions and in the nucleus. They play roles in signaling pathways such as Wnt and TGFB, and in the regulation of receptors and transcriptional activity of nuclear receptors. Some family members are involved in heart development, bone formation, and the regulation of synaptic receptor transport and postsynaptic growth in neurons. They may also function as scaffolds for assembling protein complexes and have roles in muscle cell actin filament organization.
    source: "InterPro:IPR050604 abstract (LLM-generated, not curator-reviewed)"
