identifier: PANTHER:PTHR33921
label: "CALVIN CYCLE PROTEIN CP12-2, CHLOROPLASTIC"
definition: >-
  This entry includes CP12, a chloroplast protein that regulates the Calvin cycle responsible for CO2 assimilation. Oxidized CP12 forms a supramolecular complex with two key Calvin cycle enzymes, GAPDH (glyceraldehyde-3-phosphate dehydrogenase) and PRK (phosphoribulokinase), down-regulating their activity. It also interacts with other enzymes such as aldolase and malate dehydrogenase. This entry also includes proteins from Cyanobacteria (blue-green algae).
