identifier: PANTHER:PTHR19848
label: "WD40 REPEAT PROTEIN"
definition: >-
  WD40 REPEAT PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19848. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies participate in ribosomal large subunit assembly, non-membrane-bounded organelle assembly, ribosome biogenesis. Subfamilies localise to nucleus, nucleolus, nuclear lumen.
