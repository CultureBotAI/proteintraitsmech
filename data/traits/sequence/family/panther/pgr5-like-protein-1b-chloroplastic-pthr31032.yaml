identifier: PANTHER:PTHR31032
label: "PGR5-LIKE PROTEIN 1B, CHLOROPLASTIC"
definition: >-
  PGR5-like protein 1 (PGRL1) is involved in photosynthetic cyclic electron flow, which is driven by PSI (photosystem I). PGRL1 forms homodimers and PGRL1-PGR5 heterodimers. The PGR5-PGRL1 complex mediates the second photosynthetic cyclic electron transport (CET) circuit, accepting electrons from ferredoxin (Fd) and reducing the plastoquinone (PQ) pool, thus acting as an Fd-PQ reductase. In Arabidopsis thaliana, there are two orthologues, PGRL1A and PGRLB.
