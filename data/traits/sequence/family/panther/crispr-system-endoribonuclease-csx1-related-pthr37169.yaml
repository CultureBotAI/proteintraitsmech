identifier: PANTHER:PTHR37169
label: "CRISPR SYSTEM ENDORIBONUCLEASE CSX1-RELATED"
definition: >-
  This family of proteins is involved in the CRISPR adaptive immune system, which provides defense against mobile genetic elements such as viruses, transposable elements, and conjugative plasmids. Members of this family are associated with the processing of CRISPR RNA (crRNA) and the subsequent targeting and degradation of invading nucleic acids complementary to the crRNA. Some proteins in this family are endoribonucleases activated by cyclic oligoadenylates, such as cyclic tetraadenylate (cA4), to degrade linear RNA. The RNase activity of these proteins is regulated by the levels of cyclic oligoadenylates, highlighting a sophisticated mechanism of activity modulation in response to cellular signals.
