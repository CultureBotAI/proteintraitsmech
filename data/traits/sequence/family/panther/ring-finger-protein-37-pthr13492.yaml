identifier: PANTHER:PTHR13492
label: "RING FINGER PROTEIN 37"
definition: >-
  Proteins in this entry contain the U-box domain, which has been suggested to be a modified RING finger motif where the metal-coordinating cysteines and histidines have been replaced with other amino acids. RING finger protein 37 (RNF37, also known as Ubox5) belongs to the U box protein family, whose members are ubiquitin-protein ligases.
