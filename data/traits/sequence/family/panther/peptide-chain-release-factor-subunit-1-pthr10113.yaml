identifier: PANTHER:PTHR10113
label: "PEPTIDE CHAIN RELEASE FACTOR SUBUNIT 1"
definition: >-
  This entry represents the eRF1 and aRF1 proteins. Terminating protein synthesis on the ribosome requires the presence of a class I polypeptide chain release factor (RF) to induce peptidyl-tRNA hydrolysis. Bacteria possess two class I RFs; RF1 which recognises UAG and UAA, and RF2 which recognises UGA and UAA. Mitochondrial RFs are related structurally and functionally to those of bacteria. Eukaryotes posses only a single class 1 factor, eRF1, which recognises all three termination codons. Similarly, in all archaeal species where the complete sequence of the genome is available, only a single class I factor, aRF1, has been identified so far. The aRF1 family is highly homologous to the eRF1 family, indicating a common origin and ancestor molecule. The bacterial and mitochondrial class I RFs show no significant sequence similarity with their eukaryotic and archaeal counterparts and are considered to form a separate family. For more information see.
