identifier: PANTHER:PTHR35786
label: "REDOX-SENSING TRANSCRIPTIONAL REPRESSOR REX"
definition: >-
  This entry represents the redox-sensing transcriptional repressor Rex. Rex is thought to be responsible for modulating transcription according to changes in the cellular NADH/NAD(+) redox state and binds to the promoter of the aldehyde-alcohol dehydrogenase adhE gene.
