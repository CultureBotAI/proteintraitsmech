identifier: PANTHER:PTHR14199
label: "NEUROBLASTOMA BREAKPOINT FAMILY MEMBER 6-LIKE PROTEIN"
definition: >-
  This family represents the neuroblastoma breakpoint family (NBPF) of proteins which contains a highly conserved domain of unknown function, which is known as NBPF, also known as Olduvai or DUF1220. The NBPF/DUF1220 domain is present in multiple copies in NBPF proteins. An association has been established between DUF1220 subtype CON1 copy number and autism severity, and between subtype CON2 copy number and cognitive function.
definition_source: "InterPro:IPR055306 abstract (PANTHER PTHR14199 is a member signature)"
