identifier: PANTHER:PTHR46180
label: VINCULIN
definition: >-
  Vinculin is an actin filament (F-actin) binding protein involved in cell-matrix adhesion and cell-cell adhesion. In addition to actin, vinculin interacts with other structural proteins such as talin and alpha-actinins. Vinculin is a large protein of 116kDa (about a 1000 residues). Structurally the protein consists of an acidic N-terminal domain of about 90kDa separated from a basic C-terminal domain of about 25kDa by a proline-rich region of about 50 residues. The central part of the N-terminal domain consists of a variable number (3 in vertebrates, 2 in Caenorhabditis elegans) of repeats of a 110 amino acids domain. Interestingly, vinculin exists in two conformations in the cell: an open, active form and a closed, auto-inhibited state in which the head domain forms extensive interactions with the tail.
definition_source: "InterPro:IPR017997 abstract (PANTHER PTHR46180 is a member signature)"
