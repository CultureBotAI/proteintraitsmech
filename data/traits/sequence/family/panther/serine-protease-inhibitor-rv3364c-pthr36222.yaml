      SERINE PROTEASE INHIBITOR RV3364C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36222. PANTHER protein class: protease inhibitor, protein-binding activity modulator.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes effectors that interact with host serine proteases such as cathepsin G, located on macrophage cell membranes. They play a role in modulating the host's immune response by inhibiting the enzymatic activity of these proteases. Inhibition of cathepsin G prevents the activation of caspase-1-dependent apoptosis pathways, thereby blocking macrophage pyroptosis. This mechanism is crucial for the survival of certain bacteria within host cells, as it helps them evade the immune system and maintain a persistent infection.
    source: "InterPro:IPR053141 abstract (LLM-generated, not curator-reviewed)"
