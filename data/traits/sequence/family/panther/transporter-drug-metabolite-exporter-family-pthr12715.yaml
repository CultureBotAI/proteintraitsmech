identifier: PANTHER:PTHR12715
label: "TRANSPORTER, DRUG/METABOLITE EXPORTER FAMILY"
definition: >-
  This family of proteins includes transporters that are part of the EamA transporter family. Members of this family are likely to be involved in the export of specific amino acids that have terminal alkyne groups, which may have antibiotic properties. These amino acids include L-propargylglycine and L-beta-ethynylserine. The proteins may play a role in the resistance mechanism of the producing organisms by exporting these antibiotic compounds, thus preventing self-toxicity. The function of some members within this family remains uncharacterized, suggesting potential diversity in substrate specificity or transport mechanisms.
