identifier: PANTHER:PTHR48014
label: "SERINE/THREONINE-PROTEIN KINASE FRAY2"
definition: >-
  This family represents a group of pseudokinases including human STE20-related kinase adapter protein alpha/beta (STRADA/B) and related proteins. They contain a domain with similarity to protein kinases but lacks crucial residues for catalytic activity. STRADA/B form a complex with CAB39/MO25 (CAB39/MO25alpha or CAB39L/MO25beta) which binds to and activates STK11/LKB1, being STRADA more effective than STRADB. These proteins adopt a closed conformation typical of active protein kinases and binds STK11/LKB1 as a pseudosubstrate, promoting conformational change of STK11/LKB1 in an active conformation.
definition_source: "InterPro:IPR047173 abstract (PANTHER PTHR48014 is a member signature)"
