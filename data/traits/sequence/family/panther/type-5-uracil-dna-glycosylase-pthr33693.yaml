  - kind: GENERAL
    text: >-
      The Type-4 and Type-5 uracil-DNA glycosylase family consists of enzymes that play a crucial role in DNA repair by excising uracil from DNA. This occurs as a result of cytosine deamination or misincorporation of dUMP instead of dTMP. Members of the family can process uracil in various contexts, including double-stranded DNA with U/G, U/A, U/C, or U/T base pairs, and single-stranded DNA. Type-5 enzymes exhibit broader substrate specificity, capable of removing additional bases like hypoxanthine, xanthine, and 5'-modified uracils. Some members are regulated by product inhibition, with activity affected by the presence of AP-sites. Domain-specific features, such as the N-terminal region and pseudo-FCL region, contribute to protein stability, DNA binding, and catalysis.
    source: "InterPro:IPR051536 abstract (LLM-generated, not curator-reviewed)"
