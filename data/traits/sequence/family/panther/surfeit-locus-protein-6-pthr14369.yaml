identifier: PANTHER:PTHR14369
label: "SURFEIT LOCUS PROTEIN 6"
definition: >-
  This entry represents the surfeit locus protein SURF6 from mammals and its homologues from plants and fungi. In mammals, SURF6 is a component of the nucleolar matrix and has a strong binding capacity for nucleic acids. SURF6 is always found in the nucleolus regardless of the phase of the cell cycle suggesting that it is a structural protein constitutively present in nucleolar substructures. A role in rRNA processing has been proposed for this protein.
