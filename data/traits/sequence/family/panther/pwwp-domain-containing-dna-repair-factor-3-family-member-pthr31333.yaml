identifier: PANTHER:PTHR31333
label: "PWWP DOMAIN-CONTAINING DNA REPAIR FACTOR 3 FAMILY MEMBER"
definition: >-
  This entry includes MUM1 (also known as PWWP3A or EXPAND1), MUM1-like protein 1 (MUM1L1 or PWWP3B) and PWWP domain-containing DNA repair factor 4 from animals. PWWP domain-containing DNA repair factor 3A (also known as EXPAND1 or MUM1) is a nucleosome-binding protein that contributes to the maintenance of chromatin state. Through its interaction with 53BP1, it serves as an accessory factor in the DNA damage response pathway to promote chromatin change in response to DNA damage. MUM1 promotes cell survival following DNA damage, suggesting that it may facilitate DNA repair by regulating the organization of chromatin structure.
