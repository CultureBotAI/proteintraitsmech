identifier: PANTHER:PTHR46227
label: "GLUTAMATE RECEPTOR-INTERACTING PROTEIN GRIP"
definition: >-
  Glutamate receptor-interacting proteins (GRIPs) are multi-PDZ domain scaffolding proteins required for dendrite development. There are two members of the GRIP family: GRIP1 and GRIP2/ABP (AMPA receptor binding protein). GRIPs regulate AMPAR receptor trafficking and neuronal plasticity. They also bind various receptor and signalling proteins, such as EphB receptors, ephrinB ligands, the proteoglycan NG2, the Fraser syndrome protein Fras1, and matrix metalloproteinase 5. This entry includes glutamate receptor-interacting protein 1/2 (GRIP1/2).
