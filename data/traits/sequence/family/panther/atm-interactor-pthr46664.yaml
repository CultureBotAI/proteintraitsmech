identifier: PANTHER:PTHR46664
label: "ATM INTERACTOR"
definition: >-
  This family includes human ATM interactor (ATMIN, also known as ATM/ATR-substrate CHK2-interacting zinc finger protein (ASCIZ)) and related proteins from animals. These proteins are transcription factors that are essential for cell survival and the formation of RAD51 foci, a response to methylating DNA damage. Members of this family are also involved in the regulation of ATM (ataxia telangiectasia mutated) kinase activity, particularly in the absence of DNA damage, potentially by stabilising ATM. Furthermore, these proteins are known to bind to and activate the transcription of the DYNLL1 promoter, which may have further implications in cellular response mechanisms to DNA damage.
definition_source: "InterPro:IPR055303 abstract (PANTHER PTHR46664 is a member signature)"
