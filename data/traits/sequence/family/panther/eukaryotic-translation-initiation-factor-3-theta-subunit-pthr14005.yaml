identifier: PANTHER:PTHR14005
label: "EUKARYOTIC TRANSLATION INITIATION FACTOR 3, THETA SUBUNIT"
definition: >-
  Eukaryotic translation initiation factor 3 subunit A is a component of the eukaryotic translation initiation factor 3 (eIF-3) complex, which is required for several steps in the initiation of protein synthesis. However, the subunit is not required for the general function of eIF3 in translation initiation. It may play a role in regulating translation of a subset of mRNAs and in regulating cell cycle progression and cell proliferation.
