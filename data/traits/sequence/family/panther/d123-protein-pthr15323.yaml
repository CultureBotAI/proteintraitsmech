identifier: PANTHER:PTHR15323
label: "D123 PROTEIN"
definition: >-
  This entry represents the eukaryotic cell division cycle 123 (Cdc123) family, also known as the translation initiation factor eIF2 assembly family. These proteins are approximately 330 residues long. Budding yeast Cdc123 regulates the cell cycle in a nutrient dependent manner. Cdc123 is member of the ATP grasp family that binds the γ subunit of the eukaryotic translation initiation factor 2 (eIF2). eIF2 plays a key role in protein synthesis.
