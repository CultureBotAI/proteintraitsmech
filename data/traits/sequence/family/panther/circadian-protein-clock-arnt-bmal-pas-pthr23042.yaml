    text: >-
      CIRCADIAN PROTEIN CLOCK/ARNT/BMAL/PAS — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23042. PANTHER protein class: basic helix-loop-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. Members localise to receptor complex, protein-containing complex, nucleus.
