identifier: PANTHER:PTHR35093
label: "OUTER MEMBRANE PROTEIN NMB0088-RELATED"
definition: >-
  This family includes TodX from Pseudomonas putida (strain F1/ATCC 700007) UniProtKB:Q51971 and TbuX from Burkholderia pickettii (Ralstonia pickettii) (Pseudomonas pickettii) PKO1 UniProtKB:Q9RBW8. These are membrane proteins of uncertain function that are involved in toluene catabolism. Related proteins involved in the degradation of similar aromatic hydrocarbons are also in this family, such as CymD UniProtKB:O33458. This family also includes FadL involved in translocation of long-chain fatty acids across the outer membrane. It is also a receptor for the bacteriophage T2.
