identifier: PANTHER:PTHR43778
label: "PYRUVATE CARBOXYLASE"
definition: >-
  This entry represents a group of enzymes involved in transfer of carboxyl group such as Pyruvate carboxylase, Oxaloacetate decarboxylase and Methylmalonyl-CoA carboxyltransferase. Pyruvate carboxylase (PCB) catalyses a 2-step reaction, involving the ATP-dependent carboxylation of the covalently attached biotin in the first step and the transfer of the carboxyl group to pyruvate in the second, leading to oxaloacetate production. In B.subtilis, this enzyme plays an anaplerotic function as it is necessary for growth on glucose, but is not required for sporulation. Oxaloacetate decarboxylase catalyses the decarboxylation of oxaloacetate coupled to Na+ translocation whereas Methylmalonyl-CoA carboxyltransferase 5S subunit specifically catalyses the transfer of the carboxyl group from biotin of the 1.3S subunit to pyruvate to form oxaloacetate and 1.3S biotin.
definition_source: "InterPro:IPR055268 abstract (PANTHER PTHR43778 is a member signature)"
