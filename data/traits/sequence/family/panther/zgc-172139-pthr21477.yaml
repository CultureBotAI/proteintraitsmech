identifier: PANTHER:PTHR21477
label: "ZGC:172139"
definition: >-
  This entry represents Protein PHLOEM PROTEIN 2-LIKE A1 (PP2-like) found in plants and Uncharacterized protein KIAA0930 proteins found in animals. KIAA0930 is localised in the cytosol and not secreted from cells. Expression of KIAA0930 (C22orf9) is significantly higher in pancreatic, colorectal, gastric, and tongue cancer tissues than in normal tissues. The PP2 superfamily comprises phloem lectins that are among the most abundant proteins in phloem sap. These proteins are characterised by their carbohydrate-binding properties. The precise function of these proteins remains to be determined.
