identifier: PANTHER:PTHR32217
label: "LYMPHOCYTE ANTIGEN 6H"
definition: >-
  The LY6H/LY6L protein family is characterized by its role in modulating the activity of nicotinic acetylcholine receptors (nAChRs). Members of this family, such as LY6H in humans and mice, are believed to inhibit the maximum response of alpha-3:beta-4-containing nAChRs. They may also be involved in the intracellular trafficking of alpha-7-containing nAChRs, potentially inhibiting their surface expression and affecting alpha-7/CHRNA7 signaling in hippocampal neurons. While the specific functions of some members are not detailed, the shared LY6 domain suggests a conserved role in immune cell signaling, as indicated by the involvement of LY6A in T-cell activation.
