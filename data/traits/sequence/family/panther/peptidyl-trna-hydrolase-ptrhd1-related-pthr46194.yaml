identifier: PANTHER:PTHR46194
label: "PEPTIDYL-TRNA HYDROLASE PTRHD1-RELATED"
definition: >-
  PTRHD1 is predicted to be peptidyl-tRNA hydrolase due to their amino acid sequence similarity. However, its real function is still not clear. Mutations in PTRHD1 cause autosomal-recessive juvenile parkinsonism and intellectual disability.
