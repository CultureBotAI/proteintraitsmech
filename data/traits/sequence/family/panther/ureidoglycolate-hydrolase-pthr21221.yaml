identifier: PANTHER:PTHR21221
label: "UREIDOGLYCOLATE HYDROLASE"
definition: >-
  Ureidoglycolate lyase (EC:4.3.2.3) is involved in the degradation of ureidoglycolate, an intermediate of purine degradation. It breaks down (S)-ureidoglycolate to produce glyoxylate and urea. This family of ureidoglycolate lyases were initially annotated as ureidoglycolate hydrolases, but this has since been corrected.
