identifier: PANTHER:PTHR30400
label: "MONOFUNCTIONAL BIOSYNTHETIC PEPTIDOGLYCAN TRANSGLYCOSYLASE"
definition: >-
  This family is one of the transglycosylases involved in the late stages of peptidoglycan biosynthesis. Members tend to be small, about 240 amino acids in length, and consist almost entirely of a domain, which describes transglycosylases. Species with this protein will have several other transglycosylases as well. All species with this protein are proteobacteria that produce murein (peptidoglycan).
