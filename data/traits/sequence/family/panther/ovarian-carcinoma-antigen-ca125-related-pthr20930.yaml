identifier: PANTHER:PTHR20930
label: "OVARIAN CARCINOMA ANTIGEN CA125-RELATED"
definition: >-
  OVARIAN CARCINOMA ANTIGEN CA125-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR20930. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function ubiquitin binding. Subfamilies participate in macroautophagy. Subfamilies localise to phagophore assembly site, intracellular anatomical structure, cytoplasm.
