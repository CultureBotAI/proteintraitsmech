identifier: PANTHER:PTHR13048
label: "TRAFFICKING PROTEIN PARTICLE COMPLEX SUBUNIT 3"
definition: >-
  This entry includes Bet3 (also known as TRAPPC3) and Bet3-like (TRAPPC3L) proteins from eukaryotes. They seem to be involved in vesicle-mediated transport. Yeast Bet3 is a core component of transport protein particle (TRAPP) complexes I-III. The TRAPPI complex recognises the coat (COPII) on ER-derived vesicles, whereas the TRAPPII complex recognises the coat (COPI) on Golgi-derived vesicles. TRAPPIII is responsible for vesicular transport from early endosomes to Golgi, facilitating Atg9 cycling in autophagy. Mammalian TRAPPs complexity is increased by the presence of multiple TRAPP homologues and novel subunits or binding proteins that are not part of the yeast TRAPP complexes. Bet3 and its homologue Bet3-like are both components of the mammalian TRAPP complex.
definition_source: "InterPro:IPR016721 abstract (PANTHER PTHR13048 is a member signature)"
