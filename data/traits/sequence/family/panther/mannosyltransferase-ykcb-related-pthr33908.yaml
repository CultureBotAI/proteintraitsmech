  - kind: GENERAL
    text: >-
      MANNOSYLTRANSFERASE YKCB-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33908. PANTHER protein class: transferase, metabolite interconversion enzyme. Members are annotated with the molecular function pentosyltransferase activity. and localise to cell periphery, cellular anatomical entity, membrane.
