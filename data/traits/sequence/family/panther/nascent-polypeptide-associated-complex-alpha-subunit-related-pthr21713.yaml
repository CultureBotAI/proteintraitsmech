identifier: PANTHER:PTHR21713
label: "NASCENT POLYPEPTIDE ASSOCIATED COMPLEX ALPHA SUBUNIT-RELATED"
definition: >-
  In Saccharomyces cerevisiae, nascent polypeptide-associated complex subunit alpha (also known as EGD2) is a component of the nascent polypeptide-associated complex (NAC), a dynamic component of the ribosomal exit tunnel, protecting the emerging polypeptides from interaction with other cytoplasmic proteins to ensure appropriate nascent protein targeting. In human and mouse, nascent polypeptide-associated complex subunit alpha (known as NACA) prevents inappropriate targeting of non-secretory polypeptides to the endoplasmic reticulum (ER). It binds to nascent polypeptide chains as they emerge from the ribosome and blocks their interaction with the signal recognition particle (SRP), which normally targets nascent secretory peptides to the ER.
