  - kind: GENERAL
    text: >-
      ATP SYNTHASE SUBUNIT B', CHLOROPLASTIC — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR33445. PANTHER protein class: ATP synthase, primary active transporter, transporter. Members are annotated with the molecular function ATPase-coupled monoatomic cation transmembrane transporter activity, proton transmembrane transporter activity. Members localise to proton-transporting ATP synthase complex, intracellular anatomical structure, membrane.
