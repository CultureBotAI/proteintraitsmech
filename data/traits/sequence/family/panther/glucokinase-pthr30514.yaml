identifier: PANTHER:PTHR30514
label: GLUCOKINASE
definition: >-
  This entry represents HTH-type transcriptional regulator RpiR-like family of proteins which includes RpiR, MurR, HexR and some uncharacterised transcriptional regulators mainly from bacteria. These proteins consist of two domains, a N-terminal helix-turn-helix (HTH) DNA-binding domain and a C-terminal sugar isomerase (SIS) domain that may bind phosphosugars. In E. coli, RpiR negatively regulates the expression of rpiB gene. Both rpiB and rpiA are ribose phosphate isomerases that catalyze the reversible reactions of ribose 5-phosphate into ribulose 5-phosphate. HexR binds to the promoters of the central metabolic operons and thus it is involved in glucose-responsive regulation. In addition, HexR also regulates genes involved in nitrogen metabolism, redox potential, and denitrification, suggesting that HexR may play an important role in connecting these major pathways in responses to environmental adaptation. In gammaproteobacteria P. putida and Shewanella oneidensis, binding of the 2-dehydro-3-deoxyphosphogluconate (KDPG) metabolic intermediate of glycolysis was reported to dissociate HexR from its target DNA. The transcriptional repressor MurR controls the expression of murP and murQ, which are involved in transporting and metabolizing N-acetylmuramic acid (MurNAc) generating N-acetylmuramic acid-6-phosphate (MurNAc-6-P) and N-acetylglucosamine-6-phosphate (GlcNAc-6-P), both are able to bind to MurR and weaken the DNA binding ability of MurR.
