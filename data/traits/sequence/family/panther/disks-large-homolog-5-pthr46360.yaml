    text: >-
      DISKS LARGE HOMOLOG 5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46360. PANTHER protein class: scaffold/adaptor protein. Members participate in negative regulation of intracellular signal transduction. Members localise to plasma membrane, cell periphery.
