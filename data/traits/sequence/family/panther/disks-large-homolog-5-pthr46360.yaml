    method: GENERATED
  - kind: GENERAL
    text: >-
      The MAGUK family proteins are multifunctional regulators of various signaling pathways. They are pivotal in the Hippo signaling pathway, where they can both negatively and positively modulate the pathway's activity. They facilitate interactions between different kinases and other proteins to control kinase activity and pathway activation, impacting cell proliferation, epithelial polarity, and epithelial-mesenchymal transition. Additionally, they play roles in cell migration, invasion, dendritic spine formation, and synaptogenesis, particularly by modulating the cell surface localization of N-cadherin. MAGUK family members are also positive regulators of the hedgehog signaling pathway, influencing early stages of the smoothened activity cycle and promoting the activation of downstream effectors at the ciliary tip.
    source: "InterPro:IPR053004 abstract (LLM-generated, not curator-reviewed)"
