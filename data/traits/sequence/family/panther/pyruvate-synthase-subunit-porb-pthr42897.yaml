identifier: PANTHER:PTHR42897
label: "PYRUVATE SYNTHASE SUBUNIT PORB"
definition: >-
  This family of prokaryotic proteins includes various subunits involved in oxidative decarboxylation reactions that are essential for anaerobic metabolism, including Pyruvate synthase subunit PorB from Pyrococcus furiosus. Members of this group catalyse the conversion of different substrates such as pyruvate, ketoisovalerate, and oxalate into their respective products, often with the concomitant reduction of electron acceptors. These enzymes play a role in energy production and carbon flow in anaerobic conditions, enabling organisms to utilize a range of compounds as energy sources. Some members are also involved in the metabolism of aromatic compounds, contributing to the versatility of microbial metabolic pathways. The activities of these proteins are often dependent on cofactors such as thiamine diphosphate and magnesium ions.
