identifier: PANTHER:PTHR39583
label: "TYPE II SECRETION SYSTEM PROTEIN J-RELATED"
definition: >-
  This family of proteins is involved in the type II secretion system, which is an energy-dependent process that transports extracellular factors such as proteases and toxins from the periplasm. Members of this family are part of the pseudopilus tip complex, playing a crucial role in the recognition and binding of secretion substrates. Some members may also contribute to increased bacterial adhesive capabilities.
