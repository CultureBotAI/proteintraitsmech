identifier: PANTHER:PTHR31404
label: "MITOCHONDRIAL GENOME MAINTENANCE PROTEIN MGM101"
definition: >-
  The Mgm101 is a Rad52-type single-stranded annealing protein (SSAP) required for mitochondrial DNA (mtDNA) repair and maintenance. Its C-terminal tail is required for single-stranded DNA binding. It may also play roles in the replication of the mitochondrial genome and the maintenance of its telomeres.
