identifier: PANTHER:PTHR10117
label: "TRANSIENT RECEPTOR POTENTIAL CHANNEL"
definition: >-
  The classical or canonical TRPC family (formerly short-TRPs, STRPs) encompasses channels presenting a large number of different activation modes. Some are store-operated, whereas others are receptor-operated channels activated by the production of diacylglicerol or redox processes. TRPC proteins also control growth cone guidance in both mammalian and amphibian model systems. All seven channels of this family share the common property of activation through phospholipase C (PLC)-coupled receptors. It is believed that functional TRPC channels are generated in situ by association of four TRPC proteins to form either homotetramers or heterotetramers. Transient receptor potential (TRP) channels can be described as tetramers formed by subunits with six transmembrane domains and containing cation-selective pores, which in several cases show high calcium permeability. The molecular architecture of TRP channels is reminiscent of voltage-gated channels and comprises six putative transmembrane segments (S1-S6), intracellular N-and C-termini, and a pore-forming reentrant loop between S5 and S6. TRP channels represent a superfamily conserved from worms to humans that comprise seven subfamilies: TRPC (canonical), TRPV (vanilloid), TRPM (melastatin or long TRPs), TRPA (ankyrin, whose only member is Transient receptor potential cation channel subfamily A member 1, TrpA1), TRPP (polycystin), TRPML (mucolipin) and TRPN (Nomp-C homologues), which has a single member that can be found in worms, flies, and zebrafish. TRPs are classified essentially according to their primary amino acid sequence rather than selectivity or ligand affinity, due to their heterogeneous properties and complex regulation. TRP channels are involved in many physiological functions, ranging from pure sensory functions
