    text: >-
      COILED-COIL-HELIX-COILED-COIL-HELIX DOMAIN CONTAINING 6 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR21588. Members participate in mitochondrial membrane organization, cellular component organization, inner mitochondrial membrane organization. Members localise to inner mitochondrial membrane protein complex, membrane, intracellular organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural organization of the mitochondrial inner membrane. Members function as components of the MICOS complex, which is essential for the formation and maintenance of crista junctions, the overall architecture of the inner membrane, and the establishment of contact sites with the outer membrane. Some members have been identified to have a dual role, also acting as transcription factors that can influence gene expression, such as repressing the transcription of BAG1. They are critical for maintaining the stability of the MICOS complex and the characteristic morphology of mitochondrial cristae.
    source: "InterPro:IPR052632 abstract (LLM-generated, not curator-reviewed)"
