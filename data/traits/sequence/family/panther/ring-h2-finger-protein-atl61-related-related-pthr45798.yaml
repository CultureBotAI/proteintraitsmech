  - kind: GENERAL
    text: >-
      This family of proteins includes E3 ubiquitin-protein ligases that exhibit in vitro E3 ligase activity, mediating protein monoubiquitination. Members are involved in plant defense signaling by monoubiquitinating phosphorylated BIK1 in response to pathogen detection. They contain a RING-type zinc finger domain that is responsible for binding to E2 ubiquitin-conjugating enzymes, a characteristic feature that suggests a role in the ubiquitination pathway.
