identifier: PANTHER:PTHR36121
label: "PROTEIN SXY"
definition: >-
  This entry represents TfoX/Sxy-type transcriptional regulators, which may play a key role in the development of genetic competence by regulating the expression of late competence-specific genes. TfoX from Haemophilus influenzae positively regulates genes required for DNA transformation (late competence-specific genes) in association with CRP. Protein Sxy from Escherichia coli, also known as TfoX induces low levels of natural DNA uptake by inducing transcription of the competence genes (the CRP-S regulon) required for DNA transformation.
