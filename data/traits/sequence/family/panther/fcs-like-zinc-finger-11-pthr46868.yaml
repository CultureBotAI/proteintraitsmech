identifier: PANTHER:PTHR46868
label: "FCS-LIKE ZINC FINGER 11"
definition: >-
  This entry includes FCS-like zinc finger (FLZ) 10 and 11 from Arabidopsis. They are adaptor proteins which facilitate the interaction of kinase SnRK1 with other proteins. FLZ10 has been shown to work as repressors of SnRK1 signalling.
