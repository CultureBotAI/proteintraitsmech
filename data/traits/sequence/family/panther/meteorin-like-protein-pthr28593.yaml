identifier: PANTHER:PTHR28593
label: "METEORIN-LIKE PROTEIN"
definition: >-
  METRNL is a secreted hormone induced following exercise or cold exposure that promotes energy expenditure and browning of white adipose tissue. The protein stimulates eosinophil-dependent IL4 expression and promotes alternative activation of adipose tissue macrophages, leading to increased thermogenic gene expression.
