identifier: PANTHER:PTHR13806
label: FLOTILLIN-RELATED
definition: >-
  Flotillin proteins are membrane-bound chaperones that localize to lipid rafts, where they may recruit the proteins that need to be localized in lipid rafts to be active and facilitate their interaction and oligomerization. Proteins in this entry include flotillin-1 (also known as reggie-2), flotillin-2 (also known as reggie-1) and their homologues. Flotillin-1 and flotillin-2 associate with membrane microdomains known as rafts. They play a role in various cellular processes such as insulin signaling, T cell activation, membrane trafficking, phagocytosis, and epidermal growth factor receptor signaling. This entry also include bacterial homologues of Flotillin-1. These bacterial proteins are found in membrane microdomains that may be equivalent to eukaryotic membrane rafts. Similarly to eukaryotic flotillin proteins, flotillins in bacteria play an essential role in organizing and maintaining the correct architecture of the functional membrane microdomains.
