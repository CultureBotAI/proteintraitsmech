definitions:
  - kind: GENERAL
    text: >-
      PROTEIN MSN1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR37784. Members are annotated with the molecular function cis-regulatory region sequence-specific DNA binding, RNA polymerase II cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in positive regulation of nitrogen compound metabolic process, positive regulation of biosynthetic process, positive regulation of RNA biosynthetic process.
