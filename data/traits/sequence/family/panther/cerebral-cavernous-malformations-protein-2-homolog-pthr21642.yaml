identifier: PANTHER:PTHR21642
label: "CEREBRAL CAVERNOUS MALFORMATIONS PROTEIN 2 HOMOLOG"
definition: >-
  Cerebral cavernous malformations 2 (CCM2, also known Malcavernin) is a component of the cerebral cavernous malformations (CCM) signalling pathway. The CCM pathway is a crucial regulator of heart and vessel formation and integrity, and aberrations in the pathway cause CCM pathogenesis, resulting in congenital vascular anomalies of the central nervous system. CCM2 may also function as a scaffold protein for MAP2K3-MAP3K3 signalling. It seems to play a major role in the modulation of MAP3K3-dependent p38 activation induced by hyperosmotic shock.
definition_source: "InterPro:IPR026159 abstract (PANTHER PTHR21642 is a member signature)"
