identifier: PANTHER:PTHR15573
label: "G-PROTEIN COUPLED RECEPTOR 160-RELATED"
definition: >-
  Probable G-protein coupled receptor 160 (GPR160) is an orphan receptor from G-protein coupled receptors (GPCRs) family. The function of GPR160 is not clear. It has been linked to apoptosis and cell cycle arrest of prostate cancer cells.
