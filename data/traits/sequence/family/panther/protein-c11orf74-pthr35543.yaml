identifier: PANTHER:PTHR35543
label: "PROTEIN C11ORF74"
definition: >-
  IFTAP (C11ORF74) interacts with the IFT-A complex and is accumulated at the distal tip in the absence of an IFT-A subunit IFT139. In IFTAP-knockout (KO) cells, the BBSome components cannot enter cilia. However, IFTAP-KO mice demonstrated no obvious anatomical abnormalities associated with ciliary dysfunctions.
definition_source: "InterPro:IPR040028 abstract (PANTHER PTHR35543 is a member signature)"
