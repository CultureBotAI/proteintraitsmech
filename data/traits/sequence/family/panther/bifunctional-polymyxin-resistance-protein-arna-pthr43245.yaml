identifier: PANTHER:PTHR43245
label: "BIFUNCTIONAL POLYMYXIN RESISTANCE PROTEIN ARNA"
definition: >-
  BIFUNCTIONAL POLYMYXIN RESISTANCE PROTEIN ARNA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43245. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor, racemase and epimerase activity, acting on carbohydrates and derivatives. Subfamilies participate in nucleotide-sugar metabolic process, nucleobase-containing compound biosynthetic process, carbohydrate derivative biosynthetic process.
