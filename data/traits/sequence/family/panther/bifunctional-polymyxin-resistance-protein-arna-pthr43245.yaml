    text: >-
      BIFUNCTIONAL POLYMYXIN RESISTANCE PROTEIN ARNA — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43245. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor, racemase and epimerase activity, acting on carbohydrates and derivatives. Subfamilies participate in nucleotide-sugar metabolic process, nucleobase-containing compound biosynthetic process, carbohydrate derivative biosynthetic process.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with bifunctional activities, primarily involved in the modification of lipid A, which is a component of the bacterial outer membrane. The enzymes catalyze the oxidative decarboxylation of UDP-glucuronic acid to UDP-4-keto-arabinose and the addition of a formyl group to UDP-4-amino-4-deoxy-L-arabinose, resulting in UDP-L-4-formamido-arabinose. These modifications are crucial for bacterial resistance to polymyxin and other cationic antimicrobial peptides. Additionally, the family encompasses various dehydrogenases involved in steroid biosynthesis, as well as epimerases/dehydratases that participate in carbohydrate and nucleotide sugar metabolism, contributing to diverse biological processes such as cell wall biosynthesis and steroid hormone production.
    source: "InterPro:IPR050177 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
