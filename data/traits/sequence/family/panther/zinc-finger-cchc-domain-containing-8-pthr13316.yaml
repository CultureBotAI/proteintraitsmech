identifier: PANTHER:PTHR13316
label: "ZINC FINGER, CCHC DOMAIN CONTAINING 8"
definition: >-
  The ZCCHC8 family is involved in the regulation of RNA stability and processing within the nucleus. Members of this family serve as scaffolding subunits of the trimeric nuclear exosome targeting (NEXT) complex, which plays a critical role in the surveillance and degradation of aberrant transcripts and non-coding RNAs. The NEXT complex acts as an RNA exosome cofactor, directing certain non-coding, short-lived RNAs towards exosomal degradation. Additionally, the ZCCHC8 family is implicated in pre-mRNA splicing and is essential for the 3'-end maturation of the telomerase RNA component (TERC). This maturation process is crucial for the proper targeting of TERC to the nuclear RNA exosome and for maintaining telomerase function, which is vital for chromosome integrity and cellular longevity.
