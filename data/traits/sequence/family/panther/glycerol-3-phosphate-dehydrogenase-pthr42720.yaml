identifier: PANTHER:PTHR42720
label: "GLYCEROL-3-PHOSPHATE DEHYDROGENASE"
definition: >-
  This family of proteins includes enzymes that are involved in the metabolism of glycerol. They catalyze the oxidation of glycerol 3-phosphate (G3P) to dihydroxyacetone phosphate (DHAP), a key step in glycerol utilization and energy production. Some members of this family are also capable of oxidizing glyceraldehyde 3-phosphate (GAP) to an unknown product, potentially contributing to hydrogen peroxide (H2O2) production during infection. The enzymes are characterized by their ability to reduce oxygen to hydrogen peroxide in the process, which is significant for the cytotoxic effects of certain pathogens on host cells. They do not exhibit dehydrogenase activity with NAD(+) as a cofactor, and while some may show oxidase activity with other electron acceptors, this is not considered their primary physiological function.
