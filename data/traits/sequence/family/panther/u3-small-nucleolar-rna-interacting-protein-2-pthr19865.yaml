identifier: PANTHER:PTHR19865
label: "U3 SMALL NUCLEOLAR RNA INTERACTING PROTEIN 2"
definition: >-
  This entry includes Rrp9 from budding yeasts and its homologue, U3 small nucleolar RNA-interacting protein 2 (also known as U3-55K) from animals. Rrp9 interacts with U3 snRNP and is involved in pre-rRNA processing. Human U3-55 protein has also been shown to bind to U3 snoRNA.
