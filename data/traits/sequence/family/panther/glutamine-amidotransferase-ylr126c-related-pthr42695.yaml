identifier: PANTHER:PTHR42695
label: "GLUTAMINE AMIDOTRANSFERASE YLR126C-RELATED"
definition: >-
  This entry represents a subgroup of class 1 glutamine amidotransferase (GATase1). GATase activity catalyses the transfer of ammonia from the amide side chain of glutamine to an acceptor substrate. Glutamine amidotransferases (GATase) includes the triad family of amidotransferases which have a conserved Cys-His-Glu catalytic triad in the glutaminase active site. In this subgroup this triad is conserved. Proteins in this subgroup are mostly from archaea, bacteria, plants and fungi. This entry includes ChyE from Penicillium rubens, YLR126C from budding yeast, GGP1-5 from plants. ChyE converts 2-(2-aminopropanamido)benzoic acid and 2-(2-aminopropanamido)benzamidine into 2-(2-(2-carboxyacetamido)propanamido)benzoic acid and 3-((1-((2-carbamoylphenyl)amino)-1-oxopropan-2-yl)amino)-3-oxopropanoic acid, respectively. In Arabidopsis, GGP1 hydrolyzes the gamma-glutamyl peptide bond of several glutathione (GSH) conjugates to produce Cys-Gly conjugates related to glucosinolates. The gamma-Glu-Cys-Gly-GSH conjugates are the sulfur-donating molecule in glucosinolate biosynthesis. The function of YLR126C is still not clear.
definition_source: "InterPro:IPR044992 abstract (PANTHER PTHR42695 is a member signature)"
