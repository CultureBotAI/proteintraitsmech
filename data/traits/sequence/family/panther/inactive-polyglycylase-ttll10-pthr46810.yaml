identifier: PANTHER:PTHR46810
label: "INACTIVE POLYGLYCYLASE TTLL10"
definition: >-
  TTLL10 is a polyglycylase, which modifies both tubulin and non-tubulin proteins, generating side chains of glycine on the γ-carboxyl groups of specific glutamate residues of target proteins. It polyglycylates alpha tubulin and beta tubulin, but is not able to initiate glycylation and only has activity toward monoglycylated tubulin. It has the ability to polyglycylate non-tubulin proteins such as NAP1; in this case it can initiate glycylation and does not require preliminary monoglycylation by another glycylase. This family also includes UniProtKB:Q6ZVT0, which is inactive.
definition_source: "InterPro:IPR027752 abstract (PANTHER PTHR46810 is a member signature)"
