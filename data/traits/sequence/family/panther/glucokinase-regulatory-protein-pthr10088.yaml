identifier: PANTHER:PTHR10088
label: "GLUCOKINASE REGULATORY PROTEIN"
definition: >-
  N-acetylmuramic acid 6-phosphate etherase (MurQ) is an enzyme involved in peptidoglycan recycling in Escherichia coli. In cyanobacteria MurQ may promote low-light adaptation through peptidoglycan recycling. MurQ contains a sugar isomerase (SIS) domain with similarity to the glucokinase regulatory protein (GKRP) in humans. GCKR regulates glucokinase (GK), an enzyme responsible for regulating the uptake and storage of dietary glucose. In the liver, GKRP forms an inhibitory complex with glucokinase (GCK). The disruption and reformation of this complex occurs in response to direct binding of glucose to GCK, and fructose 1-phosphate (F1P) and fructose 6-phosphate (F6P) to GKRP.
