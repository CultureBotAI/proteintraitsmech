identifier: PANTHER:PTHR43138
label: "ACETYLTRANSFERASE, GNAT FAMILY"
definition: >-
  This family of proteins includes N-acetyltransferases involved in the cellular response to oxidative stress. Members of this family are known to acetylate intermediates in proline metabolism, specifically the (S)-1-pyrroline-5-carboxylate (P5C) or its tautomer glutamate-5-semialdehyde (GSA), which are implicated in arginine biosynthesis within mitochondria. The acetylation process is believed to reduce the levels of reactive oxygen species (ROS) generated by these intermediates, thereby protecting the cell from oxidative damage. Some members also have the ability to acetylate and detoxify azetidine-2-carboxylate (AZC), a proline analog, although this is not considered a natural substrate in yeast.
