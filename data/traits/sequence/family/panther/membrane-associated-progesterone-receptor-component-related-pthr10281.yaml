identifier: PANTHER:PTHR10281
label: "MEMBRANE-ASSOCIATED PROGESTERONE RECEPTOR COMPONENT-RELATED"
definition: >-
  This entry includes Membrane-associated progesterone receptor components (MAPR) such as PGRC1/2, Neuferricin, Neudesin and related proteins, which are involved in a variety of cellular functions related to heme-binding, lipid homeostasis, and membrane dynamics. PGRC2 also plays a role in adipocyte function and systemic glucose homeostasis. Members of this entry, despite lacking conserved iron-binding His residues in their heme-binding domains, are capable of binding heme and are implicated in processes such as neuronal differentiation in the case of neuferricin and neudesin, progesterone binding, heme homeostasis, and regulation of cytochrome P450 enzymes. They also act as intracellular heme chaperones and are involved in the maintenance of reproductive lifespan and systemic glucose homeostasis. Cytochrome P450 regulator dap1 from S. pombe, the orthologue of PGRC1/2, is required for sterol biosynthesis. It functions as a positive regulator of cytochrome P450 enzymes erg5 and erg11, a function that requires bound heme.
definition_source: "InterPro:IPR050577 abstract (PANTHER PTHR10281 is a member signature)"
