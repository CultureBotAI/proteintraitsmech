  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional activators involved in the regulation of various metabolic processes. Members of this family are responsible for the expression of genes related to the catabolism of aromatic amino acids, such as activating the transcription of aminotransferases and decarboxylases. They also play a role in the response to environmental stress by binding to specific response elements in the DNA to mediate the induction of genes encoding transporters, which may be involved in acid resistance and ammonia transport. Additionally, some family members are associated with the biosynthesis of pigments through the activation of gene clusters involved in the degradation of amino acids like L-tyrosine.
    source: "InterPro:IPR052780 abstract (LLM-generated, not curator-reviewed)"
