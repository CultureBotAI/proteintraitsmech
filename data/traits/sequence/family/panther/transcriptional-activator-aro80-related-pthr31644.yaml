      TRANSCRIPTIONAL ACTIVATOR ARO80-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31644. PANTHER protein class: DNA-binding transcription factor. Members are annotated with the molecular function transcription regulator activity, DNA-binding transcription factor activity, RNA polymerase II-specific. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
