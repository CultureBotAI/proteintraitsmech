identifier: PANTHER:PTHR43854
label: "INDOLEPYRUVATE OXIDOREDUCTASE SUBUNIT IORB"
definition: >-
  This family of proteins is involved in the oxidative decarboxylation of arylpyruvates. Members of this family function as enzymes that facilitate the ferredoxin-dependent conversion process, which is a key step in the metabolic pathway. The enzymatic activity is crucial for the catabolism of aromatic compounds, where it contributes to the breakdown and utilization of these molecules for energy production and biosynthesis.
