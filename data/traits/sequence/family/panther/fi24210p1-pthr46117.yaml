    text: >-
      FI24210P1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46117. PANTHER protein class: basic helix-loop-helix transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II.
