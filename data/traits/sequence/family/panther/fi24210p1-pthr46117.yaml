  - kind: GENERAL
    text: >-
      The Upstream Stimulatory Factor family comprises transcription factors that recognize and bind to E-boxes with the consensus DNA sequence 5'-CACGTG-3'. These binding sites are commonly found in the promoters of various viral and cellular genes, indicating a role for the family in the regulation of gene expression. Members of this family are involved in diverse biological processes, including the regulation of metabolic gene expression and the maintenance of metabolic interactions between cellular organelles. Some family members specifically regulate genes such as the surfactant protein-A (SP-A) and transcription factor IIIA (TFIIIA), while others may influence the expression of genes with the CACGTG motif on their promoters.
    source: "InterPro:IPR051732 abstract (LLM-generated, not curator-reviewed)"
