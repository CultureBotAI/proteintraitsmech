definitions:
  - kind: GENERAL
    text: >-
      FI24210P1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46117. PANTHER protein class: basic helix-loop-helix transcription factor. Members are annotated with the molecular function cis-regulatory region sequence-specific DNA binding, RNA polymerase II cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process.
