identifier: PANTHER:PTHR15054
label: "HISTIDINE-RICH CALCIUM-BINDING PROTEIN-RELATED"
definition: >-
  The histidine-rich calcium-binding protein of sarcoplasmic reticulum (HRC) may play a role in the regulation of calcium sequestration or release in the SR of skeletal and cardiac muscle. This protein is very acidic (31% of Asp and Glu) and rich in histidine (13%). The sequence of HRC contains 10 tandem repeats of a 26 to 29 amino acid residues domain. This domain starts with an invariant hexapeptide (HRHRGH), followed by a stretch of acidic residues. The end of the domain consists of an almost invariant nonapeptide (STESDRHQA). The highly acidic central cores of each repeat are likely to constitute the calcium-binding sites of HRC.
definition_source: "InterPro:IPR015666 abstract (PANTHER PTHR15054 is a member signature)"
