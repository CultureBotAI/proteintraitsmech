identifier: PANTHER:PTHR14392
label: "NIBAN FAMILY MEMBER"
definition: >-
  Niban (FAM129A) is overexpressed in various cancers, including thyroid, head and neck, renal, and liver cancers, with high expression levels detected from the early stages of tumour development and maintained throughout progression. It has been implicated in the endoplasmic reticulum (ER) stress response and may modulate cell death pathways by regulating translation. Related proteins, such as Niban-like protein 1 and Niban2, have also been associated with the suppression of apoptosis in cancer cells, with Niban2 further linked to promoting melanoma cell invasion in vitro.
definition_source: "InterPro:IPR026088 abstract (PANTHER PTHR14392 is a member signature)"
