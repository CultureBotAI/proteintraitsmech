identifier: PANTHER:PTHR46764
label: "E3 UBIQUITIN-PROTEIN LIGASE BAH1"
definition: >-
  BAH1 (also known as NLA in Arabidopsis) that function as a RING-type ubiquitin E3 ligase. It regulates the accumulation of salicylic acid and immune responses to Pseudomonas syringae DC3000, a bacterial pathogen. It acts as a negative regulator of resistance to the necrotrophic fungal pathogen Plectosphaerella cucumerina by modulating the accumulation of the phytoalexin camalexin and the salicylic acid- and jasmonate- dependent defense pathways.
