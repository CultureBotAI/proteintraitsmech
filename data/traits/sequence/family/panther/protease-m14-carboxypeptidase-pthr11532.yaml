definitions:
  - kind: GENERAL
    text: >-
      PROTEASE M14 CARBOXYPEPTIDASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11532. PANTHER protein class: protease, protein modifying enzyme. Members are annotated with the molecular function metallocarboxypeptidase activity. Members participate in protein processing, peptide metabolic process, biosynthetic process. Members localise to extracellular region.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are primarily involved in the post-translational modification of proteins and peptides. They function as carboxypeptidases, which means they cleave C-terminal amino acids from proteins and peptides. Members of this family are involved in various biological processes, such as the regulation of peptide hormone and growth factor activity, modulation of the Wnt signaling pathway, and the processing of prohormones. They play roles in cellular interactions, inflammation, and the immune response by regulating the activity of vasoactive and inflammatory peptides. Some members also have roles in the extracellular matrix organization and may act as transcriptional repressors.
    source: "InterPro:IPR050753 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
