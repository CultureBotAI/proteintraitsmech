identifier: PANTHER:PTHR46170
label: "GATOR COMPLEX PROTEIN WDR59"
definition: >-
  The WDR59 family is a group of proteins involved in cellular nutrient sensing and regulation. They play a crucial role in the GATOR (GAP Activity Towards Rags) complex, specifically in the GATOR2 subcomplex, which helps modulate the mTORC1 signalling pathway, thereby influencing cell growth and metabolism. In fungi, the homologue of WDR59 is called MTC5 (Maintenance of telomere capping protein 5) and has been identified as a component of the SEA complex. This complex associates with the vacuolar membrane and plays a role in intracellular trafficking, autophagy, response to nitrogen starvation, and amino acid biogenesis. This entry also includes similar uncharacterised eukaryotic proteins such as DDB_G0292056 from Dictyostelium discoideum.
