identifier: PANTHER:PTHR43082
label: FERREDOXIN-LIKE
definition: >-
  Rhizobium meliloti (Sinorhizobium meliloti) FixX protein contains a cluster of cysteine residues characteristic of bacterial ferredoxins. The gene product from Escherichia coli could be a 3Fe-4S cluster-containing protein. These are highly homologous to an Azotobacter ferredoxin which has been shown to donate electrons to nitrogenase.
