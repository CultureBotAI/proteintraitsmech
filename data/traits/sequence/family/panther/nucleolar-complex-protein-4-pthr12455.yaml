identifier: PANTHER:PTHR12455
label: "NUCLEOLAR COMPLEX PROTEIN 4"
definition: >-
  NOC4 is involved in nucleolar processing of pre-18S ribosomal RNA and ribosome assembly. It plays a role in the nuclear export of 40S pre-ribosomal subunit to the cytoplasm. It forms a complex with Nop14p that mediates maturation and nuclear export of 40S ribosomal subunits.
