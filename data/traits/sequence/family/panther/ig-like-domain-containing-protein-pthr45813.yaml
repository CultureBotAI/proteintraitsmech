  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that are known to play a critical role in lung surfactant homeostasis and may also influence adipocyte function. Several members of this family are described as orphan receptors, indicating that their endogenous ligands or functions have not yet been identified. All proteins in this family belong to the G-protein coupled receptor 2 family and are part of the Adhesion G-protein coupled receptor (ADGR) subfamily, which is characterized by a long N-terminus with various adhesion domains that facilitate cell-cell and cell-matrix interactions.
