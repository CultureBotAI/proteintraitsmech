identifier: PANTHER:PTHR28284
label: "NUCLEOPORIN NUP60"
definition: >-
  This family represents nucleoporin Nup60, a component of the yeast nuclear pore complex (NPC). Yeast NPCs are shaped as an octagonal ring. A subset of nucleoporins (Nups) form filaments that extend into the cytoplasm and a different subset form a basket structure that extends into the nucleoplasm. All other Nups are distributed symmetrically about a central axis in the NPC forming a ringed scaffold with a central transporter that serves as the conduit for macromolecular transport. The nucleoporins Nup60, Nup2, and Nup1 form part of the nuclear basket structure. Nup60 and Nup1 are the only two Nups in S. cerevisiae that localize exclusively to the nucleoplasmic side of the NPC. The translocation of macromolecules between the nucleus and cytosol of eukaryotic cells occurs through the NPC and is facilitated by karyopherins (Kaps, importins, exportins, or transportins). Nups that contain FG peptide repeats (FG Nups) are proposed to function as binding sites for karyopherins. Nup60 is a FG Nup that also contains a putative RNA-binding RRM motif. Nup60 binds to Nup2 and serves as a docking site for Kap95p-Kap60p (karyopherin α-β) and Kap123p. Nup60 is required for the nuclear and cytoplasmic localization of some transcripts, such as ASH1 mRNA.
definition_source: "InterPro:IPR034432 abstract (PANTHER PTHR28284 is a member signature)"
