identifier: PANTHER:PTHR33021
label: "BLUE COPPER PROTEIN"
definition: >-
  Phytocyanins are blue copper proteins found in chloropasts of higher plants. They can be further subdivided into uclacyanins, stellacyanins, plantacyanins, and early nodulins. Stellacyanins have a blue copper coordinated by two His, one Cys and one Gln. In plantacyanins and uclacyanins, the ligands of the type-I Cu sites are two His, one Cys and one Met. Early nodulins (also known as phytocyanin-like proteins) lack amino acid residues that coordinate Cu, so they are involved in other processes without binding Cu. They may act as a carbohydrate transporters.
definition_source: "InterPro:IPR039391 abstract (PANTHER PTHR33021 is a member signature)"
