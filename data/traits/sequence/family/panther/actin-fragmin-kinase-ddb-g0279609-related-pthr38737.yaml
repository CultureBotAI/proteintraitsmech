identifier: PANTHER:PTHR38737
label: "ACTIN-FRAGMIN KINASE DDB_G0279609-RELATED"
definition: >-
  This family of proteins from protists includes Dictyostelium's four homologues of actin-fragmin kinase. Only one of these homologues conserves all the putative catalytic residues. To date actin-fragmin kinase has only been described in Physarum, and is not included in this entry.
