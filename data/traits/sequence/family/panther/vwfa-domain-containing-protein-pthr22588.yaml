identifier: PANTHER:PTHR22588
label: "VWFA DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes collagen VI chains that serve as cell-binding proteins. They are involved in the formation of a network that supports cells in connective tissues. Collagen VI is important for maintaining the integrity of various organs and tissues throughout the body. Additionally, a member of this family, Protein PIF, plays a crucial role in the biomineralization process in marine organisms, specifically in the formation and growth of the nacreous layer of shells by promoting aragonite crystallization and binding to the organic matrix.
