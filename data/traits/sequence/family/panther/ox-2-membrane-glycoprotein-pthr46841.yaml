identifier: PANTHER:PTHR46841
label: "OX-2 MEMBRANE GLYCOPROTEIN"
definition: >-
  This entry represents OX-2 membrane glycoprotein (OX2G) from humans and other vertebrates and its viral homologues, including OX-2 membrane glycoprotein homologue (OX2V) from Human herpesvirus 8 (HHV-8). Member of this protein family show two immunoglobulin domains. OX2G, also known as CD200, co-stimulates T-cell proliferation. It may regulate myeloid cell activity in a variety of tissues. It is involved in regulation of macrophage function. Interaction of CD200 with its receptor acts to suppress inflammatory responses. This protein has been shown to play important roles in controlling autoimmunity, inflammation, the development and spread of cancer, hypersensitivity, and spontaneous fetal loss. OX2V is encoded by herpesvirurses and has significant homology with cellular OX2. Viral OX2 encodes a glycosylated cell surface protein which has been shown to target myeloid-lineage cells.
definition_source: "InterPro:IPR047164 abstract (PANTHER PTHR46841 is a member signature)"
