identifier: PANTHER:PTHR46193
label: "6-PHOSPHOGLUCONATE PHOSPHATASE"
definition: >-
  This family of proteins includes enzymes that are primarily involved in the metabolism of various phosphorylated carbohydrates. The founding member of this family is Beta-phosphoglucomutase that catalyses the interconversion of D-glucose 1-phosphate and D-glucose 6-phosphate, forming beta-D-glucose 1,6-(bis)phosphate as an intermediate. Members of this family exhibit phosphatase activity, catalysing the dephosphorylation of sugar phosphates to their corresponding sugars. They are implicated in key metabolic pathways such as glycolysis and the pentose phosphate pathway, contributing to the regulation of carbohydrate intermediates and the synthesis of sugar nucleotides like UDP-glucose. Some family members have broader substrate specificity, acting on a range of sugar phosphate substrates, while others display more specialized activities towards specific substrates like 6-phosphogluconate, mannitol 1-phosphate, or sorbitol 6-phosphate. The enzymes in this family are structurally related, belonging to the HAD-like hydrolase superfamily, and are characterised by their ability to hydrolyse phosphomonoesters.
definition_source: "InterPro:IPR051600 abstract (PANTHER PTHR46193 is a member signature)"
