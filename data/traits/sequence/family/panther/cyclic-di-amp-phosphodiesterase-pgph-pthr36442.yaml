identifier: PANTHER:PTHR36442
label: "CYCLIC-DI-AMP PHOSPHODIESTERASE PGPH"
definition: >-
  The PgpH phosphodiesterase family is characterized by its enzymatic activity as a phosphodiesterase, primarily hydrolyzing cyclic di-3',5'-adenylate (c-di-AMP), a second messenger involved in various cellular processes such as growth, DNA repair, and cell wall homeostasis. Members of the PgpH family are considered to be major c-di-AMP phosphodiesterases within their respective bacterial cells. Excess c-di-AMP is toxic, and its regulation is crucial for cellular function. Some family members are also implicated in host-pathogen interactions, where c-di-AMP is secreted into the host cytoplasm, triggering an immune response. Additionally, the family's activity can be regulated by other nucleotides such as ppGpp, which inhibits c-di-AMP hydrolysis without affecting binding. The family is defined by a conserved cytoplasmic HD domain responsible for its phosphodiesterase activity.
