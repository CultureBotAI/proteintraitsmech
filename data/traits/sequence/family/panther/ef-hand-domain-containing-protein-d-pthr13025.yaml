identifier: PANTHER:PTHR13025
label: "EF-HAND DOMAIN-CONTAINING PROTEIN D"
definition: >-
  This entry includes EF-hand domain-containing protein D1/2 (EFHD1/2). EFHD1 may function as a mitochondrial Ca(2+) sensor underlying Ca(2+)-dependent activation of mitoflashes. EFHD2 is a Ca2+ binding adapter protein involved in various cellular functions. In mice, EFHD2 (also known as Swiprosin-1) may regulate B-cell receptor (BCR)-induced immature and primary B-cell apoptosis.
