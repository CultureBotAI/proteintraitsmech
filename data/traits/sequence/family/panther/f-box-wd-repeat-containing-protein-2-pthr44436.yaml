identifier: PANTHER:PTHR44436
label: "F-BOX/WD REPEAT-CONTAINING PROTEIN 2"
definition: >-
  F-box/WD repeat-containing protein 2 (FBXW2) is a substrate-recognition component of the SCF (SKP1-CUL1-F-box protein)-type E3 ubiquitin ligase complex. It inhibits tumour migration, invasion and metastasis in lung cancer cells by targeting beta-catenin for degradation.
