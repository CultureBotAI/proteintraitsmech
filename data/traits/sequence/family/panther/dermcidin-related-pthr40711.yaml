identifier: PANTHER:PTHR40711
label: DERMCIDIN-RELATED
definition: >-
  Dermcidin is an antibiotic peptide secreted by sweat glands. It is proteolytically processed to generate a 47-amino acid peptide with antimicrobial activity in response to a variety of pathogenic microorganisms. Lacritin is a tear glycoprotein that induces tear secretion and promotes epithelial homeostasis. Lacritin has anti-microbial, cytoprotective and wound-healing properties. It is down-regulated in conditions such as dry eye, keratitis, and other eye pathologies. Lacritin is highly expressed in human lacrimal gland and moderately in major and minor salivary glands. This entry include a group of anti-microbial proteins, including Dermcidin and Lacritin.
