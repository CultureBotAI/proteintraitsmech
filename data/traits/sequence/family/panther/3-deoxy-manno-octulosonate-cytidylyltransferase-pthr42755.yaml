identifier: PANTHER:PTHR42755
label: "3-DEOXY-MANNO-OCTULOSONATE CYTIDYLYLTRANSFERASE"
definition: >-
  The proteins in this family are found mainly in bacteria and plants. In bacteria, 3-deoxy-D-manno-octulosonic acid (Kdo) transferase is involved in lipopolysaccharide synthesis; it catalyses the transfer of two Kdo residues from CMP-Kdo to lipid IV(A), the precursor of lipid A. In plants it is though to be involved in the synthesis of a mitochondrial lipid A-like molecule.
