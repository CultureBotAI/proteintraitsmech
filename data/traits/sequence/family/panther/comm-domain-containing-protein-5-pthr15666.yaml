identifier: PANTHER:PTHR15666
label: "COMM DOMAIN CONTAINING PROTEIN 5"
definition: >-
  COMMD5 (also known as HCaRG) is a member of the COMMD family defined by the presence of a conserved and unique motif termed the COMM (copper metabolism gene MURR1) domain, which functions as an interface for protein-protein interactions. It is a nuclear protein involved in the regulation of cell proliferation. It is also a regulator of renal epithelial cell growth and differentiation causing G(2)M cell cycle arrest.
