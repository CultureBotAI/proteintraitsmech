identifier: PANTHER:PTHR37539
label: "SECRETED PROTEIN-RELATED"
definition: >-
  Rubber oxygenase Lcp (for latex clearing protein) is involved in the initial step of rubber degradation. It catalyses the extracellular cleavage of poly (cis-1,4-isoprene) in Gram-positive rubber degrading bacteria such as Streptomyces sp. K30. This family consists of Lcp, but also includes uncharacterised proteins from Gram-negative bacteria and fungi.
