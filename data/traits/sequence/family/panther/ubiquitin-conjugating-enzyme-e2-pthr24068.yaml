identifier: PANTHER:PTHR24068
label: "UBIQUITIN-CONJUGATING ENZYME E2"
definition: >-
  UBIQUITIN-CONJUGATING ENZYME E2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24068. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin-like protein conjugating enzyme activity, ubiquitin conjugating enzyme activity, acyltransferase activity. and participate in protein polyubiquitination, protein metabolic process, protein modification by small protein conjugation or removal. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
