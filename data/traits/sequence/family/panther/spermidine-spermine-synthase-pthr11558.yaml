identifier: PANTHER:PTHR11558
label: "SPERMIDINE/SPERMINE SYNTHASE"
definition: >-
  The nearly ubiquitous polyamines (putrescine, spermidine and spermine) are polycationic mediators of cell proliferation and differentiation whose functions likely provide both stability and neutralisation for nucleic acids. The following polyamine biosynthetic enzymes are evolutionary related: Spermidine synthase (EC:2.5.1.16) (putrescine aminopropyltransferase). It catalyses the last step in the biosynthesis of spermidine from arginine and methionine; the conversion of putrescine to spermidine using decarboxylated S-adenosylmethionine as the cofactor. Spermine synthase (EC:2.5.1.22) (spermidine aminopropyltransferase). It converts spermidine into spermine using decarboxylated S-adenosylmethionine as the cofactor. Putrescine N-methyltransferase (EC:2.1.1.53). It catalyzes a step in the biosynthesis of nicotine in plants; the methylation of putrescine to N- methylputrescine using S-adenosylmethionine as the cofactor. The Thermotoga maritima spermidine synthase monomer consists of two domains: an N-terminal domain composed of six β-strands, and a Rossmann-like C- terminal domain. The larger C-terminal catalytic core domain consists of a seven-stranded β-sheet flanked by nine α-helices. This domain resembles a topology observed in a number of nucleotide and dinucleotide-binding enzymes, and in S-adenosyl-L-methionine (AdoMet)- dependent methyltransferase (MTases).
