identifier: PANTHER:PTHR10241
label: "LETHAL 2  GIANT LARVAE PROTEIN"
definition: >-
  LETHAL 2 GIANT LARVAE PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10241. PANTHER protein class: membrane trafficking regulatory protein. Members are annotated with the molecular function GTPase activator activity, myosin binding, syntaxin binding. Members participate in Golgi to plasma membrane transport, exocytosis. Members localise to plasma membrane, cytoplasm.
