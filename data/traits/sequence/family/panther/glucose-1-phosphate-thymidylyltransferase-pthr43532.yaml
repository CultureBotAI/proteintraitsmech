identifier: PANTHER:PTHR43532
label: "GLUCOSE-1-PHOSPHATE THYMIDYLYLTRANSFERASE"
definition: >-
  This group of proteins comprises a tightly conserved but broadly distributed subfamily (here designated as short form) of known and putative bacterial glucose-1-phosphate thymidylyltransferases (EC:2.7.7.24, also known as dTDP-D-glucose synthase). It is well characterised in several species as the first of four enzymes involved in the biosynthesis of dTDP-L-rhamnose, a cell wall constituent and a feedback inhibitor of the enzyme. The enzyme is active as a homotetramer. dTTP + alpha-D-glucose 1-phosphate = diphosphate + dTDP-glucose.
