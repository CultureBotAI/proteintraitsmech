identifier: PANTHER:PTHR47696
label: "THAP DOMAIN-CONTAINING PROTEIN 2"
definition: >-
  The THAP domain is a C2CH module with zinc-dependent sequence-specific DNA-binding activity. Several THAP domain-containing proteins have been described. This entry represents THAP domain-containing protein 2 (THAP2) and similar animal proteins.
