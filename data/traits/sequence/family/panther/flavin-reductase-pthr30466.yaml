identifier: PANTHER:PTHR30466
label: "FLAVIN REDUCTASE"
definition: >-
  This family of proteins is involved in the reduction of flavin mononucleotide (FMN) to its reduced form (FMNH2), a critical step in various metabolic pathways. The reduced FMN acts as an electron donor for different enzymatic reactions, including the reduction of pyrimidine by RutA in the Rut pathway, the hydroxylation of aromatic compounds, and the desulfurization of dibenzothiophene. These proteins are capable of using NADH as an electron donor for the reduction of FMN, and some members can also reduce FAD. They play a role in the metabolism of various compounds, contributing to processes such as antibiotic biosynthesis, degradation of environmental pollutants, and iron acquisition.
definition_source: "InterPro:IPR050268 abstract (PANTHER PTHR30466 is a member signature)"
