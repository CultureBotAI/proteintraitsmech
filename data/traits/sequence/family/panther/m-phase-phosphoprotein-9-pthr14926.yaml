identifier: PANTHER:PTHR14926
label: "M-PHASE PHOSPHOPROTEIN 9"
definition: >-
  This is a family of proteins phosphorylated in the M (mitotic) phase, known as M-phase phosphoprotein 9 (MPHOSPH9 or MPP9). MPHOSPH9 appears to localise to the distal and proximal end of centriole pairs in duplicated centrosomes. Following centrosome splitting it is no longer visible, suggesting a role in the early steps of the centrosome cycle. In ciliated cells, it localises to the distal and proximal end of daughter centriole and proximal but not distal end of the mother centriole, suggesting that it may have a role in ciliogenesis.
definition_source: "InterPro:IPR026636 abstract (PANTHER PTHR14926 is a member signature)"
