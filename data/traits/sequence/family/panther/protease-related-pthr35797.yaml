identifier: PANTHER:PTHR35797
label: PROTEASE-RELATED
definition: >-
  Methanococcus maripaludis Rce1, MmRce1, is a type II CAAX prenyl endopeptidase. MmRce1 cleaves the CAAX motif C-terminal to both P1 and P1' positions. Similarly to its eukaryotic orthologues, hydrolysis depends on a farnesylated cysteine residue; but unlike human Rce1, it does not show activity towards geranylgeranylated peptides. This entry contains MmRce1 homologues from bacteria and archaea.
