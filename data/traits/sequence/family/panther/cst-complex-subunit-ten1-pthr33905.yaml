identifier: PANTHER:PTHR33905
label: "CST COMPLEX SUBUNIT TEN1"
definition: >-
  This entry represents the CST complex subunit Ten1 homologue from plants and animals. Even though the protein sequence similarity is very low between budding yeast Ten1 (InterPro:IPR024222) and animal/plant Ten1, they are evolutionarily related. Ten1 is essential for telomere integrity and it negatively regulates telomerase activity. Two distinct telomere capping complexes have evolved: CST complex in budding yeast and shelterin complex in vertebrates. Budding yeast CST is composed of Cdc13, Ten1 and Stn1. The homologues of Ten1 and Stn1 have been identified in vertebrates and plants. The vertebrate CST complex does not appear to play a primary role in telomere protection, but may complement the function of shelterin complex. Similar to budding yeast Ten1, mammalian Ten1 forms the CST complex with Stn1 homologue and binds to single strand DNA (ssDNA). However, unlike budding yeast CST, the binding of mammalian CST to ssDNA is not sequence specific. The mammalian CST complex may have both telomeric and non-telomeric functions. In plants, the CST complex is structurally analogous to mammalian CST and it plays a role in chromosome end protection.
