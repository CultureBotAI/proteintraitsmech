identifier: PANTHER:PTHR23266
label: "IMMUNOGLOBULIN HEAVY CHAIN"
definition: >-
  The Immunoglobulin Heavy Variable (IgHV) family includes proteins that are critical components of the adaptive immune system. Members of this family are involved in antigen recognition and are produced by B lymphocytes. The variable region of the immunoglobulin heavy chain, which is part of the B cell receptor, binds specific antigens, triggering immune responses. This region undergoes V-(D)-J rearrangement and somatic hypermutation, processes that contribute to the diversity of antibodies and their ability to mature in affinity for antigens. The family includes both functional immunoglobulin chains and probable non-functional open reading frames. Functional members mediate humoral immunity by forming antigen binding sites with light chains, leading to the elimination of antigens. Non-functional members may arise from gene rearrangement or mutation events that prevent the production of a viable immunoglobulin chain.
