identifier: PANTHER:PTHR46958
label: "B-CELL RECEPTOR CD22"
definition: >-
  B-CELL RECEPTOR CD22 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46958. Members are annotated with the molecular function carboxylic acid binding, protein phosphatase binding, signaling receptor binding. Members participate in regulation of B cell proliferation, negative regulation of signal transduction, B cell activation. Members localise to early endosome, recycling endosome, external side of plasma membrane.
