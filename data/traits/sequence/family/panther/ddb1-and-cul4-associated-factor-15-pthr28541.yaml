identifier: PANTHER:PTHR28541
label: "DDB1- AND CUL4-ASSOCIATED FACTOR 15"
definition: >-
  DCAFs, Ddb1- and Cul4-associated factors, are substrate receptors for the Cul4-Ddb1 Ubiquitin Ligase. There are 18 different factors, the majority of which are WD40-repeat-proteins. This family represents the DDB1- and CUL4-associated factor 15 (DCAF15), which is the substrate-recognition component of the DCX(DCAF15) complex, a cullin-4-RING E3 ubiquitin-protein ligase complex that mediates ubiquitination and degradation of target proteins, and acts as a regulator of the natural killer (NK) cells effector functions. Aryl sulfonamide anticancer agents appear to promote binding of DCAF15 to the RNA-recognition motif (RRM) of RBM39, which suggests that derivatives of the aryl-sulfonamides may be used to target other RRM-containing proteins.
definition_source: "InterPro:IPR038914 abstract (PANTHER PTHR28541 is a member signature)"
