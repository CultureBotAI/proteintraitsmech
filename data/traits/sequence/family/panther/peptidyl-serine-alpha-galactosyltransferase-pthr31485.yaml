identifier: PANTHER:PTHR31485
label: "PEPTIDYL SERINE ALPHA-GALACTOSYLTRANSFERASE"
definition: >-
  This entry represents a group of plant glycosyltransferases, including HPAT1-3 and SERGT1 from Arabidopsis. HPAT1 is a hydroxyproline O-arabinosyltransferase involved in the O-arabinosylation of several proteins including extensins and small signaling peptides. It catalyses the transfer of the initial L-arabinose to the hydroxyl group of Hyp residues. SERGT1, also known as AtSGT1, is a peptidyl serine O-alpha-galactosyltransferase. Proteins in this entry also include PLENTY from Lotus japonicus and RDN1/2 (ROOT DETERMINED NODULATION1/2) from Medicago truncatula.
definition_source: "InterPro:IPR044845 abstract (PANTHER PTHR31485 is a member signature)"
