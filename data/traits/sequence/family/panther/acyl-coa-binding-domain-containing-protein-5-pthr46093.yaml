label: "ACYL-COA-BINDING DOMAIN-CONTAINING PROTEIN 5"
definition: >-
  ACYL-COA-BINDING DOMAIN-CONTAINING PROTEIN 5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46093. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function nucleotide binding, anion binding, lipid binding. Subfamilies participate in lipid transport, lipid localization. Subfamilies localise to intracellular anatomical structure, cytoplasm, cytosol.
