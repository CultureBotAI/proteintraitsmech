identifier: PANTHER:PTHR48422
label: "PROTEIN EVA-1 HOMOLOG B-RELATED"
definition: >-
  This entry represents the EVA1 A and B. EVA1A, also known as TMEM166, regulates cell autophagy and apoptosis, which are essential for maintaining cellular homeostasis and responding to cellular stress. EVA1A has also been shown to promote papillary thyroid cancer progression and epithelial-mesenchymal transition via upregulating immune-related signaling pathways. EVA1 play a pivotal role in these pathways, ensuring the proper execution of cell death mechanisms that are vital for organismal development and the prevention of disease.
