identifier: PANTHER:PTHR10170
label: "HUNTINGTON DISEASE PROTEIN"
definition: >-
  The huntingtin family consists of huntingtin proteins, including Dictyostelium HD protein homologue. Abnormalities in the huntingtin protein (Htt) are associated with Huntington's disease, but despite its importance the function of Htt is largely unknown. In Dictyostelium discoideum Htt is required for normal chemotaxis and cytokinesis.
