identifier: PANTHER:PTHR14221
label: "WD REPEAT DOMAIN 44"
definition: >-
  Proteins in this entry contain WD40 repeats. Besides a number of uncharacterised proteins, the family includes the following: WD repeat-containing protein 44 (WDR44; also known as Rabphilin-11), found in vertebrates, which binds the small G protein Rab11 and is implicated in vesicle recycling. 2-deoxy-glucose resistant protein 2 (Dgr2) from yeast, which increases cellular tolerance to 2-deoxy-glucose.
