identifier: PANTHER:PTHR19237
label: NUCLEOBINDIN
definition: >-
  This family consists of nucleobindin-1 (NUCB1, also known as CALNUC or Nuc), nucleobindin-2 (NUCB2, also known as nesfatin or NEFA), and yeast homologues. Nucb2 is a calcium-binding protein that may have a role in calcium homeostasis. It can be cleaved into an isoform named nesfatin-1, which is an anorexigenic peptide that seems to play an important role in hypothalamic pathways regulating food intake and energy homeostasis, acting in a leptin-independent manner. Nucb1 is a major calcium-binding protein of the Golgi, which may have a role in calcium homeostasis. Nucb1/2 act as non-receptor guanine nucleotide exchange factors which bind to and activate alpha subunits of guanine nucleotide-binding proteins (G proteins). Nucb1 is expressed in pancreatic islets and other endocrine tissues and may have a role in in Ca(2+) handling/sensing in secretory cells. Nucleobindin-1 encodes a nesfatin-1-like peptide that stimulates insulin secretion.
