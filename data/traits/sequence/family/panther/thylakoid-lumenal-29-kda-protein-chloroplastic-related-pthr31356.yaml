identifier: PANTHER:PTHR31356
label: "THYLAKOID LUMENAL 29 KDA PROTEIN, CHLOROPLASTIC-RELATED"
definition: >-
  This entry represents a group of heme-binding peroxidases mostly from plants and fungi, including Ccp1 from budding yeasts and APX1-6 from Arabidopsis. APX1 is a L-ascorbate peroxidase that acts as a central component of the reactive oxygen gene network of Arabidopsis. Ccp1 is a mitochondrial cytochrome-c peroxidase that acts as hydrogen peroxide sensor and modulates antioxidant defense.
