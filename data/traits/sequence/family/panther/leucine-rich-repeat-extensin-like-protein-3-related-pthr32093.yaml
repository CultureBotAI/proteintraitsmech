identifier: PANTHER:PTHR32093
label: "LEUCINE-RICH REPEAT EXTENSIN-LIKE PROTEIN 3-RELATED"
definition: >-
  This family of proteins is involved in the modulation of cell morphogenesis. They play a crucial role in the regulation of cell wall formation, assembly, and growth polarization. Some members of this family are specifically expressed in pollen, while others are implicated in root hair morphogenesis and elongation. These proteins are characterized by the presence of leucine-rich repeat (LRR) domains, which are typically involved in protein-protein interactions, and extensin-like regions that may be associated with the cell wall structure and function.
