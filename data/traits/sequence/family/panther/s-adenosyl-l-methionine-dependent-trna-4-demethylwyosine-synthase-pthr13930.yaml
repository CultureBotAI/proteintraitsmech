identifier: PANTHER:PTHR13930
label: "S-ADENOSYL-L-METHIONINE-DEPENDENT TRNA 4-DEMETHYLWYOSINE SYNTHASE"
definition: >-
  This entry respresents S-adenosyl-L-methionine-dependent tRNA 4-demethylwyosine synthase Tyw1 from eukaryotes and archaea. They are involved in the pathway wybutosine-tRNA(Phe) biosynthesis. It binds one [4Fe-4S] cluster and one [2Fe-2S] cluster. The [4Fe-4S] cluster is coordinated with three cysteines and an exchangeable S-adenosyl-L-methionine. The two carbon source required for this reaction has been identified as pyruvate. The exact role of the SAM molecule has yet to be determined. There appear to be two distinct sets of proteins with different multi-domain architectures, however they are sufficiently similar in the Radical SAM portion that they remain a single cluster. Wybutosine is a hyper modified guanosine with a tricyclic base found at the 3'-position adjacent to the anticodon of eukaryotic phenylalanine tRNA. It is important for translational reading-frame maintenance.
definition_source: "InterPro:IPR034556 abstract (PANTHER PTHR13930 is a member signature)"
