identifier: PANTHER:PTHR46606
label: SHOOTIN-1
definition: >-
  Shootin-1 is involved in the generation of internal asymmetric signals required for neuronal polarisation. The protein has been shown to interact with phosphatidylinositol 3-kinase (PI 3-kinase), which is a key regulator in the initial events of neuronal polarisation.
