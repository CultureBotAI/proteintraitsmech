identifier: PANTHER:PTHR35129
label: "GUANINE NUCLEOTIDE-BINDING PROTEIN SUBUNIT GAMMA 1"
definition: >-
  This protein family represents Guanine nucleotide-binding protein subunit gamma 1 from Arabidopsis thaliana (GG1) and Guanine nucleotide-binding protein subunit gamma 2 (GG2) from Oryza sativa. These G proteins are involved as modulators or transducers in various transmembrane signaling systems. Members of this family are only found in streptophytes. In Arabidopsis thaliana GG1 and GG2 are functionally interchangeable in specific pathways.
