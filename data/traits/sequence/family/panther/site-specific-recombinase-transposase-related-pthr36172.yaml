identifier: PANTHER:PTHR36172
label: "Site-specific recombinase/transposase-related"
definition: >-
  This family of proteins includes enzymes involved in site-specific recombination and transposition processes. Members of this family function as resolvases, catalyzing the resolution of cointegrated replicons to produce the final transposition products. These proteins are also related to transposases, which are enzymes that facilitate the movement of DNA segments within the genome. The family encompasses proteins with similarity to both site-specific recombinase resolvases and transposases from different subfamilies, indicating a potential role in DNA recombination and repair mechanisms.
