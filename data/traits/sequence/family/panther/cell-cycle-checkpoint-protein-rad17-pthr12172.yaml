identifier: PANTHER:PTHR12172
label: "CELL CYCLE CHECKPOINT PROTEIN RAD17"
definition: >-
  This entry represents checkpoint protein Rad24 from budding yeasts and its homologue, Rad17 from other organisms. In Saccharomyces cerevisiae, Rad24 forms a complex with replication factor C (RFC) proteins, including Rfc2, Rfc3, Rfc4, and Rfc5. When DNA damage is detected, the Rad24-RFC complex loads Rad17-Mec3-Ddc1 complex onto chromatin and activates DNA damage checkpoint, which then leads to cell cycle arrest and DNA repair. The Rad24-RFC complex is involved in both the mitotic and meiotic checkpoints. Besides checkpoint activation, Rad24 is also involved in double-strand break ends processing, DNA repair and telomere maintenance.
definition_source: "InterPro:IPR004582 abstract (PANTHER PTHR12172 is a member signature)"
