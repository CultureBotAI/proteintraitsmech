identifier: PANTHER:PTHR15081
label: "NUCLEAR AUTOANTIGENIC SPERM PROTEIN  NASP -RELATED"
definition: >-
  This family of eukaryotic proteins includes human Nuclear autoantigenic sperm protein (NASP), a component of the histone chaperone network. Members of this family are involved in various cellular processes related to DNA replication, cell cycle progression, and cell proliferation. They form complexes with HSP90 and H1 linker histones, which facilitate the translocation of these histones to the nucleus for DNA binding. Some proteins in this family are implicated in nucleosome assembly, acting as chaperones for specific histones, such as H3 and CENP-A, and may also play roles in chromosome segregation and silencing. Additionally, certain members are associated with innate immune responses and may be involved in the uptake or spreading of dsRNA. The functions of these proteins are crucial for maintaining genomic stability and proper cell function.
definition_source: "InterPro:IPR051730 abstract (PANTHER PTHR15081 is a member signature)"
