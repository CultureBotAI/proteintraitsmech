identifier: PANTHER:PTHR39563
label: "XANTHINE PHOSPHORIBOSYLTRANSFERASE"
definition: >-
  Xanthine-guanine phosphoribosyltransferases, part of the purine salvage pathway, catalyse the transfer of the phosphoribosyl group from 5-phospho-alpha-D-ribosyl 1-pyrophosphate to xanthine, guanine and (to a leser extent) hypoxanthine to form GMP, XMP, and IMP, respectively. This enzyme uses magnesium as a cofactor and belong to the wider purine/pyrimidinephosphoribosyltransferase family.
