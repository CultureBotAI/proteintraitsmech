identifier: PANTHER:PTHR22946
label: "DIENELACTONE HYDROLASE DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  This entry represents FrsA esterase proteins, cutinases, hydrolases and related proteins. The FrsA family proteins are esterases that catalyse the hydrolysis of esters. Members of this family are involved in various biological processes, including the degradation of cutin, a plant cuticle polyester, and the hydrolysis of synthetic polyesters like poly(ethylene terephthalate), commonly known as PET. Some family members participate in complex biosynthetic pathways for natural products with biological activities, such as mycotoxin production, antibiotic properties, and cell cycle inhibition. The family includes proteins that can act as quorum-quenching agents, disrupting bacterial communication. Additionally, certain FrsA family proteins are implicated in fungal virulence and plant pathogenicity, with roles in melanin biosynthesis and the production of fungal signals recognised by resistant plants.
definition_source: "InterPro:IPR050261 abstract (PANTHER PTHR22946 is a member signature)"
