identifier: PANTHER:PTHR15608
label: "SPLICING FACTOR U2AF-ASSOCIATED PROTEIN 2"
definition: >-
  Tat-SF1 (HIV Tat-specific factor 1, also known as 17S U2 SnRNP complex component HTATSF1) interacts with components of both the transcription and splicing machineries. It is required to stabilize the branchpoint-interacting stem loop. It has been shown to be a cofactor for human immunodeficiency virus-type 1 (HIV-1) Tat, which stimulates transcription elongation of HIV-1 through a series of events termed Tat transactivation. It contains two RNA recognition motifs (RRMs) and a highly acidic carboxyl-terminal half.
