identifier: PANTHER:PTHR24139
label: "CALCIUM-INDEPENDENT PHOSPHOLIPASE A2"
definition: >-
  This family includes 85/88 kDa calcium-independent phospholipase A2 (PLPL9/PNPLA9, also known as Patatin-like phospholipase domain-containing protein 9, PLA2G6 (phospholipase A2 group VI) or iPLA2beta) and related animal sequences. PNPLA9 is a Ca-independent phospholipase that catalyses the hydrolysis of glycerophospholipids at the sn-2 position, being involved in phospholipid remodelling with implications in cellular membrane homeostasis, mitochondrial integrity and signal transduction. It is stimulated by ATP and inhibited by bromoenol lactone (BEL). In humans, PNPLA9 in expressed ubiquitously and is involved in signal transduction, cell proliferation, and apoptotic cell death. It plays a critical role in membrane homeostasis. Mutations in human PNPLA9 leads to infantile neuroaxonal dystrophy (INAD) and idiopathic neurodegeneration with brain iron accumulation (NBIA).
