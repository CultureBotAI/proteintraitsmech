identifier: PANTHER:PTHR47287
label: "C2H2 AND C2HC ZINC FINGERS SUPERFAMILY PROTEIN"
definition: >-
  C2H2 zinc finger proteins (ZFPs) constitute an abundant family of nucleic acid binding proteins in the genomes of higher and lower eukaryotes. This entry represents a group of plant ZFPs, including ZFP3, KNUCKLES and LATE FLOWERING from Arabidopsis. ZFP3 is a putative transcriptional regulator negatively regulating ABA suppression of seed germination in Arabidopsis. Together with other ZFPs, it regulates light and ABA responses during germination and early seedling development. KNUCKLES plays an important role in the termination of floral meristem activity and LATE FLOWERING controls the transition to flowering.
definition_source: "InterPro:IPR044246 abstract (PANTHER PTHR47287 is a member signature)"
