definitions:
  - kind: GENERAL
    text: >-
      SULFATASE MODIFYING FACTOR 1, 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23150. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function oxidoreductase activity, acting on a sulfur group of donors. Subfamilies participate in protein modification process.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in various biological processes, including the post-translational modification of sulfatases and the biosynthesis of ergothioneine, an antioxidant that protects bacteria from oxidative stress. Some family members are inactive enzymes that inhibit sulfatase activation, while others are active oxidases catalyzing the formation of formylglycine, a key step in activating sulfatases. Additionally, the family includes serine/threonine-protein kinases that may interact with host proteins during intracellular growth and a chaperone protein necessary for the proper folding of secreted enzymes. Hercynine oxygenases within the family catalyze the oxidative sulfurization of hercynine in ergothioneine biosynthesis, contributing to bacterial virulence and protection against redox stress.
    source: "InterPro:IPR051043 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
