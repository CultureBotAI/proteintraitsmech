    text: >-
      AAA ATPASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_2G12920)-RELATED-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45644. and localise to bounding membrane of organelle, membrane, mitochondrial outer membrane.
