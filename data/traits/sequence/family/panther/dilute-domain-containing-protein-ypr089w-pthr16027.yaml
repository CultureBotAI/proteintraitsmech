  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in the regulation of GTPase signaling pathways, particularly in the context of vascular development and endothelial cell function. They play a crucial role in the formation of vascular structures through vasculogenesis and angiogenesis. These proteins modulate the activity of Rho GTPases, which are key regulators of cell architecture and adhesion, thereby influencing endothelial cell morphogenesis and tubulogenesis of blood vessels. Some family members act as downstream effectors of Ras and Rap proteins, impacting processes such as cell adhesion, migration, and possibly transformation. Additionally, certain proteins in this family have been implicated as negative regulators of autophagy under conditions of amino acid starvation.
