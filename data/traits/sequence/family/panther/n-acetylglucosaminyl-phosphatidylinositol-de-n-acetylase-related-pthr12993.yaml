identifier: PANTHER:PTHR12993
label: "N-ACETYLGLUCOSAMINYL-PHOSPHATIDYLINOSITOL DE-N-ACETYLASE-RELATED"
definition: >-
  Members of this family include N-acetylglucosaminyl-phosphatidylinositol de-N-acetylase ( EC:3.5.1.89 ) that catalyses the second step in glycosylphosphatidylinositol (GPI) biosynthesis and 1D-myo-inositol 2-acetamido-2-deoxy-alpha-D-glucopyranoside deacetylase ( EC:3.5.1.103 ), involved in the biosynthesis of mycothiol (an unusual thiol compound found in Actinobacteria).
