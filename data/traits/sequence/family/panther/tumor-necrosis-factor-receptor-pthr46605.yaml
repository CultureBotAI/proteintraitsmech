definitions:
  - kind: GENERAL
    text: >-
      TUMOR NECROSIS FACTOR RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46605. PANTHER protein class: transmembrane signal receptor. Members are annotated with the molecular function death receptor activity, growth factor binding. Members participate in Rho protein signal transduction, cellular response to stimulus. Members localise to plasma membrane, cell surface, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that modulate signaling pathways for cell survival, differentiation, and apoptosis. They interact with neurotrophins such as NGF, BDNF, NTF3, and NTF4, with varying affinities for mature and precursor forms. Members of this family can form heterodimeric complexes, influencing neuronal development and synaptic plasticity. They are involved in the regulation of the actin cytoskeleton, RHOA inactivation, and insulin-dependent glucose uptake by modulating the translocation of GLUT4. Additionally, these proteins contribute to the circadian regulation of clock genes and metabolic genes in the brain and liver. Some members also have roles in immune response and can interact with viral proteins.
    source: "InterPro:IPR052302 abstract (LLM-generated, not curator-reviewed)"
