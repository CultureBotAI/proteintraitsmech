identifier: PANTHER:PTHR46251
label: "RUN DOMAIN-CONTAINING 3 PROTEIN RUNDC3"
definition: >-
  This entry represents a group of proteins predominantly found in vertebrates, including RUN domain-containing protein 3A/B (RUNDC3A/B) from mammals. RUNDC3A, also called Rap2-interacting protein 8 (RPIP8), may act as an effector of Rap2A GTPase in neuronal cells. RUNDC3B, also called Rap2-interacting protein 9 (RPIP-9), contains a RUN domain in its N-terminal region that mediates interaction with Rap2, an important component of the Mitogen-Activated Protein Kinase (MAPK) cascade, which regulates cellular proliferation and differentiation. It also contains characteristic binding sites for MAPK intermediates.
