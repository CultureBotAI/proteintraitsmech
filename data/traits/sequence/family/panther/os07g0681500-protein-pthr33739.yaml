identifier: PANTHER:PTHR33739
label: "OS07G0681500 PROTEIN"
definition: >-
  This entry represents a group of plant proteins, including MED33A/B (RFR1/REF4) from Arabidopsis. MED33A/B are components of the Mediator complex, a coactivator involved in the regulated transcription of nearly all RNA polymerase II-dependent genes. They are required for phenylpropanoid homeostasis in Arabidopsis.
