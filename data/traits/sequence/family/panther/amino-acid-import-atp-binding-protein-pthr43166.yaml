identifier: PANTHER:PTHR43166
label: "AMINO ACID IMPORT ATP-BINDING PROTEIN"
definition: >-
  The Methionine Import ATP-binding Protein Family is involved in the transport of methionine across the cellular membrane. Members of this family are part of the ABC transporter complex MetNIQ, which is responsible for the energy-dependent uptake of methionine, an essential amino acid required for protein synthesis and various metabolic processes. The ATP-binding proteins within this family are crucial for energy coupling to the transport system, utilising ATP hydrolysis to translocate methionine into the cell. Some members also participate in the import of formyl-L-methionine and may be regulated by intracellular methionine levels. Additionally, variations within the family can transport other substrates such as phosphonates, arginine, and possibly other amino acids, indicating a broader role in nutrient acquisition.
