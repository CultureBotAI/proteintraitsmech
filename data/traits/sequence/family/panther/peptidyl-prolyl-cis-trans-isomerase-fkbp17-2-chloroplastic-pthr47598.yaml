  - kind: GENERAL
    text: >-
      The FKBP-type PPIase family comprises proteins that function as peptidyl-prolyl cis-trans isomerases (PPIases), which are enzymes that accelerate the folding of proteins by catalyzing the cis-trans isomerization of proline imidic peptide bonds in oligopeptides. These proteins are typically involved in protein folding processes and may play a role in various cellular functions due to their impact on the conformational states of target proteins. Members of the FKBP-type PPIase family are characterized by their enzymatic activity and are found in various cellular compartments, including the chloroplast in plants.
    source: "InterPro:IPR053111 abstract (LLM-generated, not curator-reviewed)"
