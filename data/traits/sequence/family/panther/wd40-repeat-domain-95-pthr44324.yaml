  - kind: GENERAL
    text: >-
      This family of proteins contains WD repeat motifs, which are minimally conserved regions of approximately 40 amino acids typically bracketed by glycine-histidine (GH) and tryptophan-aspartic acid (WD) dipeptides. These repeats are involved in the formation of beta-propeller structures that facilitate protein-protein interactions. Members of this family are implicated in a variety of cellular processes, including signal transduction, RNA processing, gene regulation, vesicular trafficking, cytoskeletal assembly, and cell cycle control. Additionally, some members possess EF-hand calcium-binding domains, suggesting a role in calcium-mediated signaling pathways.
