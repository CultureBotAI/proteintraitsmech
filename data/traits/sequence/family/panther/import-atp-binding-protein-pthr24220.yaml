identifier: PANTHER:PTHR24220
label: "IMPORT ATP-BINDING PROTEIN"
definition: >-
  LolD is part of the LolCDE complex. LolCDE is an ATP-binding cassette (ABC) transporter, releasing lipoproteins from the inner membrane of Escherichia coli, thereby initiating lipoprotein sorting to the outer membrane. The LolCDE complex is composed of two copies of an ATPase subunit, LolD, and one copy each of integral membrane subunits LolC and LolE. LolD hydrolyses ATP on the cytoplasmic side of the inner membrane, while LolC and/or LolE recognise and release lipoproteins anchored to the periplasmic leaflet of the inner membrane. ABC transporters belong to the ATP-Binding Cassette (ABC) superfamily, which uses the hydrolysis of ATP to energise diverse biological systems. ABC transporters minimally consist of two conserved regions: a highly conserved ATP binding cassette (ABC) and a less conserved transmembrane domain (TMD). These can be found on the same protein or on two different ones. Most ABC transporters function as a dimer and therefore are constituted of four domains, two ABC modules and two TMDs. ABC transporters are involved in the export or import of a wide variety of substrates ranging from small ions to macromolecules. The major function of ABC import systems is to provide essential nutrients to bacteria. They are found only in prokaryotes and their four constitutive domains are usually encoded by independent polypeptides (two ABC proteins and two TMD proteins). Prokaryotic importers require additional extracytoplasmic binding proteins (one or more per systems) for function. In contrast, export systems are involved in the extrusion of noxious substances, the export of extracellular toxins and the targeting of membrane components. They are found in all living organisms and in general the TMD is fused to the ABC module in a variety of combinations. Some euk
