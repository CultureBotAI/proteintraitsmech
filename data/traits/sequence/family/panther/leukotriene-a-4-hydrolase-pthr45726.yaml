identifier: PANTHER:PTHR45726
label: "LEUKOTRIENE A-4 HYDROLASE"
definition: >-
  This entry includes leukotriene A4 hydrolase (LTA4H; EC:3.3.2.6; MEROPS identifier M01.004) and the close homologues cold-active aminopeptidase (Colwellia psychrerythraea -type peptidase; ColAP; MEROPS identifier M01.031), and arginyl aminopeptidase-like 1 (also known as aminopeptidase RNPEPL1, MEROPS identifier M01.022), all members of the aminopeptidase M1 family. LTA4H, is a bifunctional enzyme possessing an aminopeptidase as well as an epoxide hydrolase activity. The two activities occupy different, but overlapping sites. The activity and physiological relevance of the aminopeptidase is as yet unknown while the epoxide hydrolase converts leukotriene A4 (LTA4) into leukotriene B4 (LTB4), a potent chemotaxin that is fundamental to the inflammatory response of mammals. It accepts a variety of substrates, including some opioid, di- and tripeptides, as well as chromogenic aminoacyl-p-nitroanilide derivatives. The aminopeptidase activity of LTA4H is possibly involved in the processing of peptides related to inflammation and host defense. Kinetic analysis shows that LTA4H hydrolyzes arginyl tripeptides with high efficiency and specificity, indicating its function as an arginyl aminopeptidase. LTA4H is overexpressed in certain human cancers, and has been identified as a functionally important target for mediating anticancer properties of resveratrol, a well known red wine polyphenolic compound with cancer chemopreventive activity.
