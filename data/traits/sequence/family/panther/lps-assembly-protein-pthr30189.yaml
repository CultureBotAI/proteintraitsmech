  - kind: GENERAL
    text: >-
      LPS-ASSEMBLY PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30189. Members localise to cell outer membrane, cell envelope, transporter complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The LptD family proteins are integral components of the bacterial outer membrane, primarily involved in the assembly of lipopolysaccharide (LPS). LPS is a key constituent of the outer leaflet of the outer membrane in Gram-negative bacteria, crucial for maintaining structural integrity and protecting against environmental stress. Members of the LptD family work in conjunction with LptE, another essential protein in the LPS transport machinery. The LptD proteins possess an N-terminal periplasmic domain that likely interacts with LptA and a C-terminal transmembrane domain that forms a beta-barrel structure and interacts with LptE. This interaction is vital for the proper insertion and assembly of LPS onto the cell surface. Some LptD proteins also contribute to resistance against solvents like n-hexane and are implicated in outer membrane permeability and envelope biogenesis.
    source: "InterPro:IPR050218 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
