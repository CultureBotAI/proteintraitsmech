identifier: PANTHER:PTHR15925
label: "MITOCHONDRIAL RIBOSOMAL PROTEIN S23"
definition: >-
  This entry represents the small ribosomal subunit protein mS23, previously known as MRP-S23, one of the proteins that makes up the 55S ribosome in eukaryotes. It does not appear to carry any common motifs; either RNA binding or ribosomal. All of the mammalian MRPs are encoded in nuclear genes that are evolving more rapidly than those encoding cytoplasmic ribosomal proteins. The MRPs are imported into mitochondria where they assemble in co-ordination with mitochondrially transcribed rRNAs into ribosomes that are responsible for translating the 13 mRNAs for essential proteins of the oxidative phosphorylation system. MRP-S23 is significantly up-regulated in uterine cancer cells.
