identifier: PANTHER:PTHR34814
label: "NITROSOGUANIDINE RESISTANCE PROTEIN SNG1"
definition: >-
  This family of proteins includes members that may function in the cellular response to alkylating agents. One characterized member is suggested to act as an export permease for N-methyl-N'nitro-N-nitrosoguanidine (MNNG), a mutagenic and carcinogenic chemical. The proteins in this family are also noted for their similarity to each other, suggesting a conserved role or function within the yeast species from which they are derived.
