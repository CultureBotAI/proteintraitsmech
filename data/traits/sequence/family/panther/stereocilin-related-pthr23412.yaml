identifier: PANTHER:PTHR23412
label: "STEREOCILIN RELATED"
definition: >-
  Members of this family includes stereocilin, mesothelin, mesothelin-like protein and otoancorin. They are predicted to have superhelical structures with ARM-type repeats which suggests that they may act as superhelical lectins to bind the carbohydrate moieties of extracellular glycoproteins.
