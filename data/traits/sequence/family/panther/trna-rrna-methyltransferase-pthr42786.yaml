identifier: PANTHER:PTHR42786
label: "TRNA/RRNA METHYLTRANSFERASE"
definition: >-
  This entry includes TrmJ and LasT from E.coli. TrmJ is a tRNA methyltransferase that catalyzes the formation of 2'O-methylated cytidine (Cm32) or 2'O-methylated uridine (Um32) at position 32 in tRNA. The function of LasT is not clear.
