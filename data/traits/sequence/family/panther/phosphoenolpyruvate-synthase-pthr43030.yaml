identifier: PANTHER:PTHR43030
label: "PHOSPHOENOLPYRUVATE SYNTHASE"
definition: >-
  Phosphoenolpyruvate synthase converts pyruvate into phosphoenolpyruvate (PEP). This is an essential step in gluconeogenesis when pyruvate or lactate are used as a carbon source. PEP can also be utilised as an energy source for the phosphotransferase system of sugar uptake.
