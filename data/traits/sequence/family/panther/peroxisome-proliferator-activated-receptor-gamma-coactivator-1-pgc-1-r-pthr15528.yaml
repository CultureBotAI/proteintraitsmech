identifier: PANTHER:PTHR15528
label: "PEROXISOME PROLIFERATOR ACTIVATED RECEPTOR GAMMA COACTIVATOR 1  PGC-1 -RELATED"
definition: >-
  The PGC-1 family members, including PGC-1alpha, PGC-1beta and PRC, are transcriptional coactivators that regulate cell metabolic processes ranging from mitochondrial biogenesis to oxidative respiration. They target NRF-1, a transcription factor that binds to a palindromic sequence in the cytochrome c promoter and associate with the expression of many genes required for expression and function of the respiratory chain. They also bind to CREB (cAMP response element-binding protein) and ERRalpha (estrogen-related receptor alpha). However, knockout of individual components in the PGC-1 family can result in diverse phenotypes ranging from early embryonic lethality to complete viability with very mild effects on global mitochondrial content and function. They contain an N-terminal region with a nuclear receptor coactivator signature-LXXLL and a C-terminal region with a RS domain and a RNA recognition motif.
definition_source: "InterPro:IPR034605 abstract (PANTHER PTHR15528 is a member signature)"
