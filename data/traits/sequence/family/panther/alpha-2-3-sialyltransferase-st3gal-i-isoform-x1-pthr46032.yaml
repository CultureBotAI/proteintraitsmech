  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes known as beta-galactoside alpha2-3 sialyltransferases, which are involved in the terminal sialylation of glycoproteins and glycolipids. These enzymes catalyze the transfer of sialic acid from the nucleotide sugar donor CMP-Neu5Ac onto acceptor substrates that terminate with Galbeta-(1->3)-GalNAc through an alpha2-3 linkage. The sialylation process is crucial for the biosynthesis of brain gangliosides, which are essential for myelin-associated glycoprotein (MAG) function, axonal myelin stability, and regeneration. Additionally, these enzymes participate in the regulation of CD8-positive T cell survival by sialylating core 1 O-glycans on T cell glycoproteins, thus preventing premature apoptosis and controlling memory T cell survival. They also contribute to the formation of specific gangliosides such as GD1a, GM1b, and GT1b, and sialylate pluripotent stem cell-associated antigens, forming structures like SSEA4.
    source: "InterPro:IPR051757 abstract (LLM-generated, not curator-reviewed)"
