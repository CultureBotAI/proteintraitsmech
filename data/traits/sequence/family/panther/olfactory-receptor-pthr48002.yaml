  - kind: GENERAL
    text: >-
      The olfactory receptor family is comprised of G-protein coupled receptors with the primary function of detecting odorants. These receptors are activated by a diverse array of chemical compounds, including organosulfur odorants with thioether groups, and in some cases, their activity is enhanced by copper binding. One member of the family also acts as a receptor for the hormone Asprosin, influencing glucose release from hepatocytes and regulating appetite and fertility. The activity of these receptors is typically mediated by G proteins that activate adenylyl cyclase, leading to an increase in intracellular cAMP levels.
    source: "InterPro:IPR050427 abstract (LLM-generated, not curator-reviewed)"
