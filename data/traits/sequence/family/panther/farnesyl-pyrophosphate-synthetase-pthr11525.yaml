identifier: PANTHER:PTHR11525
label: "FARNESYL-PYROPHOSPHATE SYNTHETASE"
definition: >-
  Farnesyl pyrophosphate synthase (FPS; EC:2.5.1.10; also known as Erg2) and geranylgeranyl diphosphate synthase (GGPS) are key enzymes in the synthesis of various isoprenoid-containing compounds and proteins. FPS catalyzes the sequential condensation of isopentenyl pyrophosphate to form farnesyl pyrophosphate. FPS is a Mg 2 -containing protein, binding three ions. In Schizosaccharomyces pombe, GGPS is a paralogue of FPS, and geranylgeranyl diphosphate synthase is a heterodimer of FPS and GGPS. This family also includes a further isoprenoid biosynthesis enzyme, chrysanthemyl diphosphate synthase (also known as bifunctional chrysanthemol synthase, chloroplastic) from plants, which has been shown to catalyse two pathway steps in the biosynthesis of pyrethrins.
definition_source: "InterPro:IPR039702 abstract (PANTHER PTHR11525 is a member signature)"
