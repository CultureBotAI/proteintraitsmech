identifier: PANTHER:PTHR23186
label: "RETINOIC ACID-INDUCED PROTEIN 2"
definition: >-
  Retinoic acid (RA) has been shown to modulate the expression of a number of proteins implicated in the control of early embryonic development. One of these is retinoic acid-induced protein 2 (RAI2), which has been isolated in mouse and humans. Sine oculis-binding protein homologue (Jxc1, SOBP) is implicated in the development of the cochlea in the inner ear. Mutations in this gene also cause intellectual disability (ID).
