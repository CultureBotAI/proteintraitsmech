definitions:
  - kind: GENERAL
    text: >-
      PAPILLOMAVIRUS REGULATORY FACTOR PRF-1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13006. PANTHER protein class: transcription cofactor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity. Members participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that are characterized by their ability to bind DNA through specific motifs, such as CR1 and CR2, which mediate sequence-specific DNA binding. Members of this family are involved in the regulation of gene expression by binding to enhancer or promoter elements of target genes. For instance, some proteins within this family bind to the MYOD1 enhancer, playing a crucial role in muscle differentiation. Others are implicated in the transcriptional regulation of genes such as SLC2A4 and HD, or in the transcription of papillomavirus genes. The DNA-binding activity is essential for the transcriptional regulatory function of these proteins, which is a common feature shared by members of this family.
    source: "InterPro:IPR052253 abstract (LLM-generated, not curator-reviewed)"
