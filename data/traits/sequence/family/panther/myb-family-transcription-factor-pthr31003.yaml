identifier: PANTHER:PTHR31003
label: "MYB FAMILY TRANSCRIPTION FACTOR"
definition: >-
  This entry represents a group of plant Myb family transcription factors, including HHO1-6, HRS1 and EFM from Arabidopsis. HRS1 represses primary root development in response to phosphate deficiency conditions, only when nitrate is present. It is also required for suppressing abscisic acid (ABA) signalling in germinating embryo axis, which promotes the timely germination of seeds. EFM functions as a flowering repressor, directly repressing FT expression in a dosage-dependent manner in the leaf vasculature.
