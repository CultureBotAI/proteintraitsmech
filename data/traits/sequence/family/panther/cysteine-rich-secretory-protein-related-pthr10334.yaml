identifier: PANTHER:PTHR10334
label: "CYSTEINE-RICH SECRETORY PROTEIN-RELATED"
definition: >-
  The cysteine-rich secretory proteins (Crisp) are predominantly found in the mammalian male reproductive tract as well as in the venom of reptiles. This family includes mammalian testis-specific protein (Tpx-1), also known as cysteine-rich secretory protein 2 (CRISP2); venom allergen 5 from vespid wasps and venom allergen 3 from fire ants, which are potent allergens that mediate allergic reactions to stings insects of the Hymenoptera family; scoloptoxins from Scolopendra dehaani (Thai centipede); plant pathogenesis proteins of the PR-1 family, which are synthesised during pathogen infection or other stress-related responses; allurin, a sperm chemoattractant, serotriflin, etc. The precise function of some of these proteins is still unclear. Tpx-1 or CRISP2 may regulate some ion channels' activity and thereby regulate calcium fluxes during sperm capacitation. This entry also includes antigen 5 like allergen Cul n 1 from biting midge salivary glands and Protein lon-1 from Caenorhabditis elegans that regulates body size morphogenesis, but does not affect male tail development.
definition_source: "InterPro:IPR001283 abstract (PANTHER PTHR10334 is a member signature)"
