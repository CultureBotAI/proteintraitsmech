  - kind: GENERAL
    text: >-
      This family of proteins includes peptidyl-prolyl cis-trans isomerases (PPIases) that are known to accelerate the folding of proteins during protein synthesis. These enzymes facilitate the cis-trans isomerization of proline imidic peptide bonds in oligopeptides, which is a rate-limiting step during folding. Members of this family are involved in various cellular processes, including signal transduction, protein trafficking, and immune response. They are characterized by their ability to bind immunosuppressive drugs such as FK506 and rapamycin, which inhibit their isomerase activity. However, they are not inhibited by cyclosporin A, distinguishing them from some other PPIases.
