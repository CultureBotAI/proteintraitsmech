  - kind: GENERAL
    text: >-
      PROTEIN DISULFIDE-ISOMERASE C17H9.14C-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45672. PANTHER protein class: chaperone. Members are annotated with the molecular function catalytic activity, acting on a protein, protein disulfide isomerase activity. and participate in cellular metabolic process, cellular biosynthetic process, organic substance biosynthetic process. and localise to endoplasmic reticulum, intracellular organelle.
