  - kind: GENERAL
    text: >-
      The protein disulfide isomerase family is involved in the formation, isomerization, and reduction or oxidation of disulfide bonds in proteins within the endoplasmic reticulum lumen. Members of this family act as protein-folding catalysts, interacting with nascent polypeptides to facilitate proper folding and stabilization through disulfide bond formation. Some family members have additional roles, such as involvement in glycosylation, prolyl hydroxylation, triglyceride transfer, and endoplasmic reticulum quality control. They may also be essential for various developmental processes, including pollen development, ovule fertilization, and embryo development. Certain proteins within this family possess thioredoxin activity and may engage in interactions with receptors to mediate cellular processes such as the phagocytosis of apoptotic cells.
    source: "InterPro:IPR051063 abstract (LLM-generated, not curator-reviewed)"
