identifier: PANTHER:PTHR10593
label: "SERINE/THREONINE-PROTEIN KINASE RIO"
definition: >-
  This is a family of plant-specific transcription factors including protein indeterminate-domain 1-16 (IDD1-16) from Arabidopsis containing the conserved INDETERMINATE DOMAIN (IDD) with four zinc finger motifs. These proteins are involved in regulation of multiple developmental processes. IDD8/NUC, IDD3/MAGPIE (MAG), and IDD10/JACKDAW (JKD) regulate root development and patterning [. IDD8/NUTCRACKER (NUC) also regulates photoperiodic flowering by modulating sugar transport and metabolism. IDD15/SHOOT GRAVITROPISM 5 (SGR5) is involved in the gravitropic response of inflorescence stems. INDETERMINATE1 plays an important role in regulating the transition to flowering in maize. This family also includes similar proteins from rice, such as EHD2, which are transcription activators that act as a flowering master switches in both long and short days, independently of the circadian clock.
definition_source: "InterPro:IPR031140 abstract (PANTHER PTHR10593 is a member signature)"
