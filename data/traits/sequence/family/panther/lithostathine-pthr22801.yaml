  - kind: GENERAL
    text: >-
      The protein family includes calcium-dependent lectins involved in innate immune defense, apoptosis, and embryogenesis. Members bind to specific sugar moieties on microorganisms, activating the complement pathway and contributing to pathogen opsonization. Some recognize high mannose oligosaccharides with terminal alpha-1,2-linked mannose epitopes, while others have affinity for fucose, N-acetylglucosamine, or surfactant phospholipids. Functions extend to cell migration regulation, apoptotic cell DNA binding, and surfactant tension reduction in alveoli, essential for respiration. The family also includes members with roles in skeletal growth, hemostasis modulation, and endocytosis.
    source: "InterPro:IPR050801 abstract (LLM-generated, not curator-reviewed)"
