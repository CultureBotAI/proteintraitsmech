  - kind: GENERAL
    text: >-
      This family of proteins is involved in the quality control of mitochondrial translation. Members of this family function as part of a mitoribosome-associated pathway that addresses interruptions during elongation. They form heterodimers with MTRES1 to facilitate the ejection of incomplete nascent chains and peptidyl transfer RNA (tRNA) from stalled ribosomes. The presence of a GGQ domain suggests an interaction with the peptidyltransferase center of the large ribosomal subunit, triggering hydrolysis of the nascent chain. Additionally, these proteins may have roles in mitoribosome rescue, as indicated by the recruitment of mitoribosome biogenesis factors to quality control intermediates.
    source: "InterPro:IPR052405 abstract (LLM-generated, not curator-reviewed)"
