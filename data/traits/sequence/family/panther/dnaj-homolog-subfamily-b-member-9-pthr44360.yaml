  - kind: GENERAL
    text: >-
      This family of proteins includes co-chaperones that interact with Hsp70 proteins, particularly HSPA5/BiP, to modulate the unfolded protein response (UPR) and endoplasmic reticulum-associated degradation (ERAD) pathways. Members of this family contain a J domain that stimulates the ATPase activity of HSPA5/BiP and a divergent targeting domain that recognizes aggregation-prone sequences, facilitating the recognition of misfolded proteins. These proteins are involved in the regulation of ERN1/IRE1 activity in the endoplasmic reticulum by disrupting its dimerization and inactivation under unstressed conditions. They are essential for the survival of B-cell progenitors and normal antibody production, indicating a significant role in immune response. Additionally, some members may participate in pre-mRNA splicing and are required for cellular growth under various temperature conditions.
    source: "InterPro:IPR051948 abstract (LLM-generated, not curator-reviewed)"
