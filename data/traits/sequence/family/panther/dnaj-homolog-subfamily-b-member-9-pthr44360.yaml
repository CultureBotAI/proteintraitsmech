  - kind: GENERAL
    text: >-
      DNAJ HOMOLOG SUBFAMILY B MEMBER 9 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44360. PANTHER protein class: chaperone. Members are annotated with the molecular function protein binding, protein-folding chaperone binding. and participate in ERAD pathway, response to endoplasmic reticulum stress, cellular response to stress. and localise to endoplasmic reticulum.
