identifier: PANTHER:PTHR11195
label: DESTABILASE-RELATED
definition: >-
  This is a family of invertebrate-type lysozymes. It includes Destabilase (EC:3.5.1.44), an endo-epsilon(gamma-Glu)-Lys isopeptidase, which cleaves isopeptide bonds formed by transglutaminase (Factor XIIIa) between glutamine gamma-carboxamide and the ε-amino group of lysine.
