  - kind: GENERAL
    text: >-
      The glycosyl hydrolase 31 family is involved in the degradation of sulfoquinovosyl diacylglycerides (SQDG) and sulfoquinovosyl glycerol (SQGro), releasing sulfoquinovose (SQ) which is utilized as a source of carbon and sulfur. In E. coli, SQ is further degraded through the SQ-EMP sulfoglycolysis pathway. The family includes enzymes that exhibit retaining glycoside hydrolase activity, forming the alpha anomer of SQ. They can hydrolyze substrate analogs like para-nitrophenyl alpha-sulfoquinovoside (PNPSQ), with no activity toward 4-nitrophenyl alpha-D-glucopyranoside (PNPGlc). Some members also show alpha-glucosidase activity in vitro. The family's enzymes are regulated by inactivators like 5-fluoro-beta-L-idopyranosyl fluoride (5FIdoF) and are characterized by molecular coevolution of amino acid pairs essential for substrate recognition and structural integrity.
    source: "InterPro:IPR052990 abstract (LLM-generated, not curator-reviewed)"
