  - kind: GENERAL
    text: >-
      The protein tyrosine phosphatase family is involved in various cellular processes including cell cycle regulation, cell proliferation, motility, and invasive activity. Members of this family have dual specificity, dephosphorylating proteins with phosphotyrosine or phosphoserine residues. They play roles in mitotic progression, particularly the G1 to S phase transition, and are implicated in cancer metastasis and cardiac hypertrophy. Some members are involved in cytokinesis, chromosome segregation, and spindle assembly. Others have functions in cilia formation and maintenance, and in the DNA damage response, acting as regulators of checkpoints and promoting exit from mitosis. The family includes non-receptor class CDC14 subfamily members, which are essential for coordinating nuclear division with cytokinesis and are involved in transcription regulation of ribosomal genes.
    source: "InterPro:IPR050561 abstract (LLM-generated, not curator-reviewed)"
