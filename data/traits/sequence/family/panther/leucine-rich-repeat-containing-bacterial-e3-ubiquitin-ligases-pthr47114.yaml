  - kind: GENERAL
    text: >-
      The LRR-containing bacterial E3 ligase family comprises effector E3 ubiquitin ligases that manipulate the host's ubiquitination pathway to promote bacterial survival within host tissues. These proteins typically exist in an autoinhibited state and are activated upon substrate binding. They are known to ubiquitinate various host proteins, leading to their proteasomal degradation, which interferes with host cell defense mechanisms such as the NF-kappa-B signaling pathway. Some family members specifically target host proteins like IKBKG, U2AF1, and guanylate-binding proteins, modulating inflammatory responses and suppressing host cell defenses. Others can ubiquitinate gasdermins or components of the LUBAC complex, impacting cell death pathways and innate immunity.
    source: "InterPro:IPR051071 abstract (LLM-generated, not curator-reviewed)"
