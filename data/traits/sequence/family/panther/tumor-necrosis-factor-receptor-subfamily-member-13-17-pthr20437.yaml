identifier: PANTHER:PTHR20437
label: "TUMOR NECROSIS FACTOR RECEPTOR SUBFAMILY MEMBER 13/17"
definition: >-
  The tumour necrosis factor (TNF) receptor (TNFR) superfamily comprises more than 20 type-I transmembrane proteins. Family members are defined based on similarity in their extracellular domain - a region that contains many cysteine residues arranged in a specific repetitive pattern. The cysteines allow formation of an extended rod-like structure, responsible for ligand binding. Upon receptor activation, different intracellular signalling complexes are assembled for different members of the TNFR superfamily, depending on their intracellular domains and sequences. Activation of TNFRs can therefore induce a range of disparate effects, including cell proliferation, differentiation, survival, or apoptotic cell death, depending upon the receptor involved. TNFRs are widely distributed and play important roles in many crucial biological processes, such as lymphoid and neuronal development, innate and adaptive immunity, and maintenance of cellular homeostasis. Drugs that manipulate their signalling have potential roles in the prevention and treatment of many diseases, such as viral infections, coronary heart disease, transplant rejection, and immune disease. This entry includes the TNF receptors 13C and 17. TNFR 17 acts as a receptor for both a proliferation-inducing ligand (APRIL) and B cell-activating factor (BAFF, also called BLyS or TALL-I). It is preferentially expressed by mature B-cells, suggesting a that it is involved in cell survival and proliferation. It has been demonstrated that it acts through the activation of NF-kappa-B and JNK pathways. TNFR 13C is a B-cell receptor specific for BAFF and it promotes the mature B-cells survival and response.
