  - kind: GENERAL
    text: >-
      The ARTD/PARP family proteins are key players in DNA repair and cellular stress responses. They catalyze the transfer of ADP-ribose units from NAD+ to target proteins, forming poly-ADP-ribose chains. This post-translational modification is crucial for DNA damage detection and repair, including base excision repair and double-strand break repair. The family includes enzymes that mediate both poly-ADP-ribosylation and mono-ADP-ribosylation, with specificity for various amino acids influenced by interacting factors. Beyond DNA repair, these enzymes are involved in transcription regulation, programmed cell death, membrane repair, adipogenesis, and innate immunity. They also play roles in chromatin structure modulation, transcription elongation regulation, and the cGAS-STING pathway. Some family members are implicated in apoptosis following DNA damage, and others are involved in sleep regulation in response to neuronal DNA damage.
    source: "InterPro:IPR050800 abstract (LLM-generated, not curator-reviewed)"
