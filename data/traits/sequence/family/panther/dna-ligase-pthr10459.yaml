definitions:
  - kind: GENERAL
    text: >-
      DNA LIGASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10459. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function pentosyltransferase activity, catalytic activity, acting on a protein. Members participate in double-strand break repair, post-translational protein modification, cellular aromatic compound metabolic process. Members localise to nucleolus, nuclear lumen, membrane-bounded organelle.
