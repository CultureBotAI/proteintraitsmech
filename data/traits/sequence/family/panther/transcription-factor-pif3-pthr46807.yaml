identifier: PANTHER:PTHR46807
label: "TRANSCRIPTION FACTOR PIF3"
definition: >-
  This entry represents a group of plant transcription factors that belongs to the basic helix-loop-helix (bHLH) family, including PIF3/PIF3-like from Arabidopsis, and APG/PIL15 from rice. Phytochrome interacting factors (PIFs) are transcription factors that regulate various light responses. PIF3 (PHYTOCHROME INTERACTING FACTOR 3) is a phytochrome-interacting bHLH factor that targets G-box motifs through its bHLH domain. PIF3 binds to phytochrome B, and the PAS domain of PIF3 is a major contributor to this interaction. PIF3, together with PIF4/5, plays a key role promoting dark-induced senescence. In rice PIL15 plays important roles in red light-mediated (phyA and/or phyB-dependent) signal transduction pathways. APG interacts with POSITIVE REGULATOR OF GRAIN LENGTH 1 (PGL1), and this interaction represents a grain length and weight-controlling pathway in which APG is a negative regulator whose function is inhibited by PGL1.
definition_source: "InterPro:IPR044273 abstract (PANTHER PTHR46807 is a member signature)"
