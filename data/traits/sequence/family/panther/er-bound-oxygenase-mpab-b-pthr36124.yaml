identifier: PANTHER:PTHR36124
label: "ER-bound oxygenase mpaB/B'"
definition: >-
  This entry includes the endoplasmic reticulum (ER)-bound oxygenases mpaB' (MPAB2) and mpaB (MPAB) from Penicillium brevicompactum and Penicillium roqueforti, respectively, which are part of the gene cluster that mediates the biosynthesis of mycophenolic acid (MPA) and mediates the oxidative cleavage the C19-C20 double bond in farnesyl-DHMP (FDHMP) to yield FDHMP-3C via a mycophenolic aldehyde intermediate. This entry also includes uncharacterised sequences from bacteria.
