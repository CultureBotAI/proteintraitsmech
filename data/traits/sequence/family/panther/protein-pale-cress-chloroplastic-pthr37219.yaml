identifier: PANTHER:PTHR37219
label: "PROTEIN PALE CRESS, CHLOROPLASTIC"
definition: >-
  The PAC (PALE CRESS) protein is required for leaf and chloroplast development. PAC mutation arrests chloroplast development at an early stage, affecting the abundance and maturation of specific chloroplast-encoded transcripts. The PAC protein may be a nucleus-encoded factor that functions in plastid mRNA maturation and accumulation.
