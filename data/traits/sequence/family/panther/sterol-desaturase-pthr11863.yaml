identifier: PANTHER:PTHR11863
label: "STEROL DESATURASE"
definition: >-
  The sterol desaturase family is involved in various crucial biological processes, including the biosynthesis of sterols such as cholesterol and ergosterol, which are essential components of cell membranes and precursors to steroid hormones and vitamins. Some members of this family function as enzymes that introduce double bonds into sterol molecules, a key step in the formation of complex sterols. Others are involved in the desaturation and hydroxylation of fatty acids, contributing to the production of signalling molecules and the regulation of lipid metabolism. Additionally, some members participate in the synthesis of very-long-chain alkanes, which are important for the formation of protective waxy layers in plants, contributing to cuticular permeability and drought tolerance. Proteins in this family are mainly found in eukaryotes and bacteria.
definition_source: "InterPro:IPR050307 abstract (PANTHER PTHR11863 is a member signature)"
