identifier: PANTHER:PTHR10083
label: "KUNITZ-TYPE PROTEASE INHIBITOR-RELATED"
definition: >-
  This entry includes Tissue factor pathway inhibitor (TFPI) from animals and Kunitz-type serine protease inhibitors, also known as Venom chymotrypsin inhibitors (VKTCIs) which primarily function as inhibitors of serine proteases, with some members also exhibiting the ability to block voltage-gated potassium channels (Kv) such as Kunitz-type U15-theraphotoxin-Hhn1c from Chinese bird spider. These inhibitors are characterised by their Kunitz/BPTI domain, which is responsible for their protease inhibitory activity. The family includes toxins from various venomous organisms, such as snakes, scorpions, and sea anemones. Members of this family often have dual functions, inhibiting both serine proteases and ion channels, which contributes to their role in the defense mechanisms of the organisms that produce them. The inhibitory activities of these proteins are crucial for modulating processes like blood coagulation, inflammation, and neurotransmission, making them significant in both physiological and pathological contexts.
definition_source: "InterPro:IPR050098 abstract (PANTHER PTHR10083 is a member signature)"
