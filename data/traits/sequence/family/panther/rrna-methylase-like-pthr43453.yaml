identifier: PANTHER:PTHR43453
label: "RRNA METHYLASE-LIKE"
definition: >-
  tRNA (guanosine(18)-2'-O)-methyltransferase (also known as tRNA [Gm18] methyltransferase, and TrmH) catalyses the 2'-O methylation of guanosine at position 18 (Gua18) in the D loop of tRNA. In the reaction, S-adenosyl-L-methionine (AdoMet) functions as a methyl group donor and is converted to S-adenosyl-L-homocysteine (AdoHcy). The methylation of tRNA nucleotides helps to stabilize the L-shaped tRNA structure and improve their molecular recognition. TrmH enzymes can be classified into two types based on their substrate tRNA specificity. Type I TrmH, which includes Thermus thermophilus TrmH, can modify all tRNA species. Type II TrmH, which includes Echerichia coli TrmH and Saccharomyces cerevisiae TrmH, modifies only a subset of tRNA species.
definition_source: "InterPro:IPR033671 abstract (PANTHER PTHR43453 is a member signature)"
