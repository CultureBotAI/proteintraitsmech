identifier: PANTHER:PTHR37739
label: "KINESIN-LIKE PROTEIN KIN-12D"
definition: >-
  This entry represents a group of kinesin-like proteins, including KIF15 from animals and KIN-12A-G from plants. KIF15 homologue in Xenopus, Xklp2, is required for centrosome separation during mitosis. KIN-12E has been shown to regulate metaphase spindle flux and help control spindle size in Arabidopsis. KIN12 are plus-end directed kinesin-like motor enzymes that plays a critical role in the organization of phragmoplast microtubules during cytokinesis.
