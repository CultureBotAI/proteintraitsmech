identifier: PANTHER:PTHR36406
label: "MEDIATOR OF RNA POLYMERASE II TRANSCRIPTION SUBUNIT 30"
definition: >-
  The large protein complex Mediator is a central coregulator of transcription in eukaryotes. It acts as a bridge to pass on the information from the transcription factors to the basal transcriptional unit at the core promoter, resulting in either transcriptional activation or repression. The plant Mediator subunits typically show very low homology to other species, plant Meds being closer to human than to yeast counterparts. The plant Mediator appears to be composed of one or more members of 34 subunits, as opposed to 25 and 30 members in yeast and metazoans, respectively. This entry represents subunit 30 of the plant complex.
definition_source: "InterPro:IPR034568 abstract (PANTHER PTHR36406 is a member signature)"
