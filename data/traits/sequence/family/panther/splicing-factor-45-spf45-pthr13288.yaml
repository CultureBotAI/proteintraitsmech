identifier: PANTHER:PTHR13288
label: "SPLICING FACTOR 45 SPF45"
definition: >-
  This entry includes proteins with a G-patch domain and a RNA recognition motif domain, including mammalian splicing factor 45 (SPF45; also known as RNA-binding motif protein 17 or RBM17) and plant DNA-damage-repair/toleration protein DRT111 (also known as RSN2). SPF45 is an mRNA spliceosomal protein that is required for alternative splicing and the utilization of cryptic splice sites. The beta-110 mutation in the haemoglobin beta causes activation of a cryptic 3' splice site that is the cause of human beta-thalassemia (sickle-cell anemia). DRT111 is also required for pre-mRNA splicing, particularly the mRNA for receptor-like kinase SNC4, which activates the defence response to microbial pathogens in plants.
