identifier: PANTHER:PTHR47085
label: "ZINC FINGER MYND DOMAIN-CONTAINING PROTEIN 15"
definition: >-
  Zinc finger MYND domain-containing protein 15 (ZMYND150 is a histone deacetylase-dependent transcriptional repressor that plays a role in spermiogenesis. Mutations of the ZMYND15 gene have been linked to azoospermia.
