identifier: PANTHER:PTHR45787
label: LD11652P
definition: >-
  The LMO/RBTN protein family includes transcription factors and cofactors that play critical roles in hematopoietic development, neural lineage gene regulation, and motor neuron identity establishment. Members of the family, such as Rhombotin-1 and Rhombotin-2, are involved in specifying embryonic mesoderm to hematopoietic fate, often acting synergistically with other factors like TAL1/SCL and GATA1. They may also interact with DNA or other transcription factors to regulate gene expression within neural lineage cells. LIM domain only proteins (LMOs) like LMO3 and LMO4 function as transcription cofactors, influencing motor neuron identity and modulating gene expression in various developmental processes, including gastrulation and neurula stages. They can disrupt complexes like LDB1-LHX3, affecting interneuron gene expression, and act as positive cofactors for GATA transcription factors. The family is characterized by the presence of LIM zinc-binding domains, which are crucial for their interactions and functions.
