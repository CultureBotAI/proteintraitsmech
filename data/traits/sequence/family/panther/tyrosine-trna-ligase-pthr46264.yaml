definitions:
  - kind: GENERAL
    text: >-
      TYROSINE-TRNA LIGASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46264. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, catalytic activity, acting on RNA, ligase activity. and participate in cellular aromatic compound metabolic process, heterocycle metabolic process, tRNA metabolic process. and localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The Tyrosine--tRNA ligase family is responsible for the aminoacylation of tRNA(Tyr) with the amino acid tyrosine, a fundamental process in protein synthesis. Members of the family perform a two-step reaction where tyrosine is first activated by ATP to form Tyr-AMP, and subsequently transferred to the acceptor end of tRNA(Tyr). This reaction ensures the correct addition of tyrosine to the growing polypeptide chain during mRNA translation. The family includes enzymes that may also be involved in nuclear tRNA export and can exhibit specificity for certain tRNA determinants. Some members are capable of attaching D-tyrosine to tRNA(Tyr), albeit less efficiently than L-tyrosine.
    source: "InterPro:IPR050489 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
