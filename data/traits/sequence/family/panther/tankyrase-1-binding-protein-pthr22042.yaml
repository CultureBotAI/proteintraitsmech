identifier: PANTHER:PTHR22042
label: "TANKYRASE 1 BINDING PROTEIN"
definition: >-
  TNKS1BP1 (also known as TAB182) interacts with the telomeric poly(ADP-ribose) polymerase, tankyrase 1. It is an integral component of the CNOT complex, which has transcriptional regulatory, deadenylation and E3 ligase activity. This family also includes uncharacterised protein KIAA1671.
