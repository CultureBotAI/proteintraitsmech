identifier: PANTHER:PTHR11955
label: "FATTY ACID BINDING PROTEIN"
definition: >-
  Fatty acid binding proteins (FABPs) and cellular retinoic-acid-binding proteins (CRBPs) are part of the intracellular-lipid-binding proteins (iLBPs) family. The primary role of all the FABP members is regulation of fatty acid uptake and intracellular transport. To date, nine FABPs have been identified in mammals, each showing specific tissue distribution patterns and ligand preference. All FABP members have a similar β-barrel structure; fatty acid ligands are accommodated in the central cavity of the β-barrel, which dramatically increases their solubility in the aqueous cytoplasm, facilitating their movement to target sites. Retinoic-acid-binding proteins (CRBPs) are specific for vitamin A derivatives and can be classified into the cellular retinoic acid-binding proteins (CRABP-I and II) and the cellular retinol-binding proteins (CRBP-I, II, III, and IV).
