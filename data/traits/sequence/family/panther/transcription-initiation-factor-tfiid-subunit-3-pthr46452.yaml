identifier: PANTHER:PTHR46452
label: "TRANSCRIPTION INITIATION FACTOR TFIID SUBUNIT 3"
definition: >-
  Transcription initiation factor TFIID subunit 3 (TAF3 or TAF(II)47) is a component of the general purpose transcription factor complex TFIID. TAF2 contains a histone fold domain. This entry includes TAF3 from animals and fungi. Interestingly, TAF3 has not been identified in plants. The DNA-binding general transcription factor complex TFIID is central to the initiation of DNA-dependent RNA polymerase II transcription. TFIID is the only general transcription initiation factor that bind to the TATA box. The binding of TFIID to the TATA-box is the first step in the formation of a complex able to initiate transcription. TFIID consists of the TATA binding protein (TBP) and 14 TBP-associated factors (TAFs). One copy of each TAF1, TAF2, TAF3, TAF7, TAF8, TAF11, TAF13, two copies of each TAF4, TAF5, TAF6, TAF9, TAF10, TAF12, and three copies of TAF14.
