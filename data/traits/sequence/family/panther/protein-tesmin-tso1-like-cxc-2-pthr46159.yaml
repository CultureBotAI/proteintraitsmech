identifier: PANTHER:PTHR46159
label: "PROTEIN TESMIN/TSO1-LIKE CXC 2"
definition: >-
  This entry represents a group of CRC domain-containing proteins, including TSO1 and TCX2/3/4 from Arabidopsis. They are are homologues of the LIN54 DNA-binding components of the mammalian DREAM complex, a protein complex responsible for the regulation of cell cycle-dependent gene expression. TSO1 has been shown to regulate meristem organization and cell division. It may transcriptionally represses MYB3R1 (a conserved cell cycle regulator), and together they coordinate cell proliferation with differentiation in shoot and root. TCX3 (also known as SOL1) and TCX2 (also known as SOL2) have been shown to regulate fate transition and cell divisions in the Arabidopsis stomatal lineage.
definition_source: "InterPro:IPR044522 abstract (PANTHER PTHR46159 is a member signature)"
