identifier: PANTHER:PTHR33414
label: "PROTEIN PLASTID MOVEMENT IMPAIRED 1-RELATED 1"
definition: >-
  This entry represents a group of plant proteins, including protein PLASTID MOVEMENT IMPAIRED 1 (PMI1) and PMIR1/2 from Arabidopsis. PMI1 and PMIR1 are required for efficient chloroplast photorelocation movement. PMI1 is a mobile signal that initiates coordinated changes in protein-protein and protein-plasma membrane interactions for chloroplast movement in response to light, which determines where in the cell chloroplasts are able to anchor to the plasma membrane. PMIR2 seems not necessary for chloroplast and nuclear photorelocation movements. PMI1 has been found to mediate ABA sensitivity during germination.
definition_source: "InterPro:IPR039614 abstract (PANTHER PTHR33414 is a member signature)"
