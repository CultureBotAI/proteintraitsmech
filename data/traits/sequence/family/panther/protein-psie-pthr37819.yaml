identifier: PANTHER:PTHR37819
label: "PROTEIN PSIE"
definition: >-
  Phosphate-starvation-inducible E (PsiE) expression is under direct positive and negative control by PhoB and cAMP-CRP, respectively. PsiE is an integral membrane protein with four transmembrane helices. The second α helix contains a conserved glutamic acid residue and the third helix contains a conserved arginine residue. The function of PsiE remains to be determined.
