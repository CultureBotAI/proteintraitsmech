identifier: PANTHER:PTHR10157
label: "DOPAMINE BETA HYDROXYLASE RELATED"
definition: >-
  This family represents Dopamine beta-hydroxylase (DBH) and related enzymes, including tyramine beta-hydroxylase, MOXD1 homologue 1/2 and DBH-like monooxygenase protein 1/2. DBH, also known as Dopamine beta-hydroxylase, is a class of ascorbate-dependent enzymes from the catecholamine biosynthetic pathway that requires copper as a cofactor and uses ascorbate as an electron donor. DBH catalyses the conversion of dopamine to the neurotransmitter norepinephrine: 3,4-dihydroxyphenethylamine + ascorbate + O 2 = noradrenaline + dehydroascorbate + H 2 O DBH exists in both soluble (in chromaffin granules) and membrane bound forms. The protein functions as a homotetramer. This entry includes monooxigenases found in metazoans, plants and fungi.
