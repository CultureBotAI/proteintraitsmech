definitions:
  - kind: GENERAL
    text: >-
      EXONUCLEASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR42924. Members are annotated with the molecular function DNA exonuclease activity, producing 5'-phosphomonoesters, 5'-3' exonuclease activity, RNA nuclease activity.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in nucleotide metabolism and RNA processing. Members of this family are capable of hydrolyzing phosphate esters, such as the hydrolysis of the phosphate ester at carbon-1 of 5-phospho-D-ribose 1,2-cyclic phosphate to form ribose 2,5-bisphosphate. Additionally, they can catalyze the removal of 3'-phosphates from 3',5'-bis-phosphonucleotides and the successive hydrolysis of 5'-phosphomononucleotides from the ends of RNA and DNA oligonucleotides. Some family members are involved in the maturation of rRNA by trimming the 5'-end of rRNA precursors. The family includes enzymes that can hydrolyze both RNA and DNA substrates, with a preference for RNA, and can act on both single-stranded and annealed double-stranded nucleic acids, although with different efficiencies.
    source: "InterPro:IPR052018 abstract (LLM-generated, not curator-reviewed)"
