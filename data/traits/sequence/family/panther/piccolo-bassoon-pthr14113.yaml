definition: >-
  PICCOLO/BASSOON — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14113. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function structural molecule activity. Subfamilies participate in synapse assembly, nervous system development, protein localization to synapse. Subfamilies localise to cortical cytoskeleton, axon, glutamatergic synapse.
