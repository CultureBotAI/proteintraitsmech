      PICCOLO/BASSOON — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14113. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 4 of its annotated subfamilies. Subfamilies are annotated with the molecular function structural molecule activity. Subfamilies participate in synapse assembly, nervous system development, protein localization to synapse. Subfamilies localise to cortical cytoskeleton, axon, glutamatergic synapse.
    source: "PANTHER 19.0 (composed from the family name and the GO / protein-class annotations shared by all of its annotated subfamilies)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family functions as scaffold proteins at the presynaptic cytomatrix of the active zone (CAZ), a key site for neurotransmitter release. They are involved in the formation of Piccolo-Bassoon transport vesicles (PTVs), which are essential for synaptic contact development. At the CAZ, they organize synaptic vesicle clusters and regulate membrane fusion and endocytosis. Beyond assembly, they interact with proteins like SIAH1 and ATG5 to modulate presynaptic protein ubiquitination and autophagy. They also play a role in synapse to nucleus signaling, affecting gene expression by associating with transcriptional corepressor CTBP1, influencing its nuclear import.
    source: "InterPro:IPR052098 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
