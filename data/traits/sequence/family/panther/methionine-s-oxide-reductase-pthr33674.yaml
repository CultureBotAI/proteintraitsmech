identifier: PANTHER:PTHR33674
label: "METHIONINE-S-OXIDE REDUCTASE"
definition: >-
  This entry includes a group of uncharacterised plant proteins, including At4g08330 from Arabidopsis. These proteins are predicted to adopt a typical β-tent fold with zinc coordinating residues conserved. It is closely related to SelR domain [InterPro:IPR002579].
