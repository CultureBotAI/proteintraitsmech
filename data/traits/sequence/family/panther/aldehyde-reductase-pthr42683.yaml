identifier: PANTHER:PTHR42683
label: "ALDEHYDE REDUCTASE"
definition: >-
  This entry includes the cinnamyl alcohol dehydrogenases (CADs) and closely related sequences which are members of the medium chain dehydrogenase/reductase (MDR)/zinc-dependent alcohol dehydrogenase-like family and contain two domains: a C-terminal NAD(P) binding-Rossmann fold domain and an N-terminal catalytic domain with distant homology to GroES. CADs reduce cinnamaldehydes to cinnamyl alcohols in the last step of monolignal metabolism in plant cells walls in a NADPH dependent manner and bind two zinc ions. This family also includes geissoschizine synthase from Madagascar periwinkle, a protein involved in monoterpenoid indole alkaloids (MIAs) biosynthesis pathway. MIAs, such as catharanthine, tabersonine, vincadifformine, vindoline or vincristine, are important anticancer drugs. CAD family members are also found in non-plant species, such as ADH6/ADH7 from yeast where they have an aldehyde reductase activity and may be involved in fusel alcohol synthesis or in aldehyde tolerance, and YahK/YjgB from bacteria. ADH-like proteins typically form dimers (typically higher plants, mammals) or tetramers (yeast, bacteria).
