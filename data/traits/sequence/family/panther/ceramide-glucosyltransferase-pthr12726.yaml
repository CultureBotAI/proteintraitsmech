identifier: PANTHER:PTHR12726
label: "CERAMIDE GLUCOSYLTRANSFERASE"
definition: >-
  This is a family of ceramide beta-glucosyltransferases ( ), which catalyse the transfer of glucose to ceramide, the first glycosylation step in glycosphingolipid biosynthesis. They belong to the glycosyl transferase family 21.
