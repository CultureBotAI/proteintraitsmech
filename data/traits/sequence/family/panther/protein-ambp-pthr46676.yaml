identifier: PANTHER:PTHR46676
label: "PROTEIN AMBP"
definition: >-
  Protein AMBP is a precursor that gives rise to two different secreted proteins upon endopeptidase cleavage in hepatocytes. One of the two proteins after cleavage, alpha1-microglobulin is a glycoprotein that belongs to the lipocalin family. It has immunoregulatory properties and is involved in heme-catabolism. The second protein, bikunin, is a Kunitz-type proteinase inhibitor of the inter-alpha-inhibitor family.
