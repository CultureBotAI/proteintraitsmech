    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the transfer of acetyl groups from acetyl coenzyme A to various substrates, including ribosomal proteins and nucleoid-associated DNA-binding proteins. Some members are known to modify specific ribosomal proteins, converting them into acetylated forms, which may affect their function or stability. Other members have broader substrate specificity, with activities extending to the acetylation and succinylation of proteins involved in nucleoid structure and function. The family also contains uncharacterized proteins that are predicted to have acetyltransferase activity based on sequence similarity.
