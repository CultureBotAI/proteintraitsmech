identifier: PANTHER:PTHR16040
label: "AUSTRALIN, ISOFORM A-RELATED"
definition: >-
  The chromosomal passenger complex of Aurora B kinase, INCENP, and Survivin has essential regulatory roles at centromeres and the central spindle in mitosis. Cell division cycle-associated protein 8, also known as Borealin, is also a member of the complex. Approximately half of Aurora B in mitotic cells is complexed with INCENP, Borealin, and Survivin. Depletion of Borealin by RNA interference delays mitotic progression and results in kinetochore-spindle mis-attachments and an increase in bipolar spindles associated with ectopic asters.
definition_source: "InterPro:IPR018867 abstract (PANTHER PTHR16040 is a member signature)"
