    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the maturation of ribosomes, which are essential cellular machines for protein synthesis. Members of this family are implicated in the processing of precursor ribosomal RNA (rRNA), specifically contributing to the cleavage events that are necessary for the proper formation of the 40S ribosomal subunit. The proteins in this family appear to play a role in the early stages of rRNA processing, participating in the cleavage at specific sites within the precursor rRNA molecule.
