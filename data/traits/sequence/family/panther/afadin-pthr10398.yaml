identifier: PANTHER:PTHR10398
label: AFADIN
definition: >-
  Afadin (also known as MLLT4 or AF-6) is an actin filament (F-actin) and Rap1 small G protein-binding protein that plays a role in cell adhesion, cell polarisation, migration, survival, proliferation, and differentiation. It binds to nectins and regulates actomyosin. organisation in the formation of cell-cell junctions. It controls the levels of RhoA activation, which may critically regulate the lymphangiogenesis of mouse embryos. It is also involved in oncogenesis and metastasis.
