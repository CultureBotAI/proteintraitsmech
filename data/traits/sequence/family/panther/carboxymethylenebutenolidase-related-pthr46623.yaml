  - kind: GENERAL
    text: >-
      This family of proteins is involved in the ring cleavage of cyclic ester dienelactone to produce maleylacetate, a step in the degradation of certain compounds. Some members of this family have been identified as carboxymethylenebutenolidases, which are enzymes that catalyze the hydrolysis of dienelactone, a compound that can be found in various metabolic pathways including the breakdown of environmental pollutants. The family includes enzymes that may participate in the biodegradation of 5-nitroanthranilate by hydrolyzing lactones to produce maleylpyruvate. Members of this family share a similarity in sequence and structural characteristics, indicating a common evolutionary origin and similar catalytic mechanisms.
    source: "InterPro:IPR051049 abstract (LLM-generated, not curator-reviewed)"
