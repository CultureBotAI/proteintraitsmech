  - kind: GENERAL
    text: >-
      This family of proteins is part of the major facilitator superfamily (MFS), which is one of the largest groups of secondary transporters. Members of this family are involved in various transport functions across the cellular membrane, utilizing the electrochemical gradient. The proteins in this family are characterized by their ability to facilitate the movement of small solutes in response to ion gradients. One characterized member is known to participate in the export of staphylopine, a metallophore, suggesting a role in metal ion homeostasis and transport. However, the specific functions of other members within this family may vary and are not fully characterized.
