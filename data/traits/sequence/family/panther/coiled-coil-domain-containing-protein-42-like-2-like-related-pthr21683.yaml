  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structure and function of cilia and flagella, which are cellular appendages that play a critical role in cell motility, fluid movement, and sensory functions. Members of this family are associated with the axoneme, the core skeletal structure of cilia and flagella, and are implicated in the regulation of the assembly and activity of the axonemal inner dynein arm. This suggests a role in the control of ciliary and flagellar beating patterns. Some proteins within this family are also essential for sperm development, indicating a specific function in the reproductive system.
