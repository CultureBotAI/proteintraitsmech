identifier: PANTHER:PTHR47120
label: "THAP DOMAIN-CONTAINING PROTEIN 3"
definition: >-
  The THAP domain is a C2CH module with zinc-dependent sequence-specific DNA-binding activity. Several THAP domain-containing proteins have been described. THAP3 is a component of a THAP1/THAP3-HCFC1-OGT complex that is required for the regulation of the transcriptional activity of the cell cycle-specific gene RRM1.
