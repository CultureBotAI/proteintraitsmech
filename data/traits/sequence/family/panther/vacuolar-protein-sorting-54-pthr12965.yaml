identifier: PANTHER:PTHR12965
label: "VACUOLAR PROTEIN SORTING 54"
definition: >-
  Vacuolar protein sorting-associated protein 54 (Vps54) is a component of the GARP (Vps52/53/54) complex that is involved in retrograde transport from early and late endosomes to the trans-Golgi network (TGN). Mammalian GARP complex has been shown to play a general role in the delivery of retrograde cargo into the TGN.
definition_source: "InterPro:IPR039745 abstract (PANTHER PTHR12965 is a member signature)"
