  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various signaling processes. Some proteins within this family are known to act as ligands for specific G protein-coupled receptors, such as LGR7, RXFP3, and RXFP4. These interactions suggest roles in neuropeptide signaling and potentially influence physiological functions such as gut contractility, thymic development, and regulation. The family is characterized by structural similarity to the insulin family, indicating a possible evolutionary relationship and functional resemblance to insulin in terms of peptide hormone action.
