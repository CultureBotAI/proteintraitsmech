identifier: PANTHER:PTHR23341
label: "HIGH MOBILITY GROUP PROTEINS HMG-A AND C"
definition: >-
  HIGH MOBILITY GROUP PROTEINS HMG-A AND C — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23341. PANTHER protein class: HMG box transcription factor. Members are annotated with the molecular function transcription coregulator activity, protein-macromolecule adaptor activity. Members participate in regulation of DNA-templated transcription. Members localise to nucleus.
