identifier: PANTHER:PTHR33088
label: MUCIN-2
definition: >-
  This entry includes protein PELPK1/2 from Arabidopsis thaliana and similar sequences predominantly found in plants. PELPK2 is a presumptive inparalog of PELPK1 (also known as Proline-rich protein 10, At5g09530), a positive regulator of germination and plant growth. They contain 36 repeats of a unique pentapeptide (Pro-Glu-Leu|Ile|Val-Pro-Lys), named the PELPK motif, which is also found in proteins from many other angiosperms. Members of this family localized to the cell wall, being part part of the hydroxyproline-rich glycoprotein (HRGP) super-family of cell wall proteins. This entry also includes some uncharacterised proteins from bacteria, animals and fungi.
