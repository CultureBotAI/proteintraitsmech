  - kind: GENERAL
    text: >-
      TRIOKINASE/FMN CYCLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR28629. PANTHER protein class: cyclase, lyase. Members are annotated with the molecular function phosphotransferase activity, alcohol group as acceptor, kinase activity. Members participate in carbohydrate catabolic process, organic hydroxy compound metabolic process, alcohol metabolic process. Members localise to cytoplasm, cytosol.
