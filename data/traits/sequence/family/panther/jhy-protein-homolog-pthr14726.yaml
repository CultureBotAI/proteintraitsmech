identifier: PANTHER:PTHR14726
label: "JHY PROTEIN HOMOLOG"
definition: >-
  Jhy protein is the protein product of the gene Jhy (previously known as 4931429I11Rik). This protein family is found in eukaryotes. In humans, the gene encoding this protein lies in the position chromosome 11 open reading frame 63. The function of Jhy protein is still to be determined.
