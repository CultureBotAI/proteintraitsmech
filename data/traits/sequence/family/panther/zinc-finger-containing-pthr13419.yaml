identifier: PANTHER:PTHR13419
label: "ZINC FINGER-CONTAINING"
definition: >-
  This entry represents CXXC-type zinc finger proteins CXXC4 and CXXC5. CXXC4 is a potential tumour suppressor directly regulated by EZH2. It has been shown to inactivate mitogen activated protein kinase signaling. CXXC5 is a retinoid-inducible nuclear factor (RINF) involved in normal myelopoiesis. It has been associated with various malignant tumours.
