identifier: PANTHER:PTHR43634
label: "OW CONDUCTANCE MECHANOSENSITIVE CHANNEL"
definition: >-
  This entry represents a group of mechanosensitive channel proteins from bacteria and plants, including YnaI from E. coli and MSL2/3 from Arabidopsis. YnaI has been shown to protect cells against hypoosmotic stress when highly overexpressed. MSL2/3 are chloroplastic proteins that regulate chloroplast size and FtsZ ring formation.
