    text: >-
      The cytochrome b5 family is characterized by a domain that binds heme under oxidizing conditions. Members of this family are involved in redox signaling pathways and are essential for the coordinated beating of multiple cilia. The cytochrome b5 domain-containing proteins function as radial spoke stalk proteins, which are likely to play a role in the regulation of ciliary motion, possibly through redox-mediated mechanisms.
