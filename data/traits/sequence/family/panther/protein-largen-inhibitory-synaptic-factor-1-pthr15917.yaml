identifier: PANTHER:PTHR15917
label: "Protein Largen/Inhibitory synaptic factor 1"
definition: >-
  This entry includes protein Largen and INSYN1 (inhibitory synaptic factor 1). Largen regulates cell size control. INSYN1 is part of the complex that mediates postsynaptic inhibition.
