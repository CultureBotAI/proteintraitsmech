identifier: PANTHER:PTHR43443
label: "3-HEXULOSE-6-PHOSPHATE ISOMERASE"
definition: >-
  6-phospho 3-hexuloisomerase (PHI, also known as rmpB) is part of the ribulose monophosphate (RuMP) pathway, which in one direction removes the toxic metabolite formaldehyde by assimilation into fructose-6-phosphate. In the other direction, in species lacking a complete pentose phosphate pathway, the RuMP pathway yields ribulose-5-phosphate, necessary for nucleotide biosynthesis, at the cost of also yielding formaldehyde. These latter species tend usually have a formaldehyde-activating enzyme to attach formaldehyde to the C1 carrier tetrahydromethanopterin.
definition_source: "InterPro:IPR017552 abstract (PANTHER PTHR43443 is a member signature)"
