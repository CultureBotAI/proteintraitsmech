identifier: PANTHER:PTHR20836
label: "DIHYDRODIPICOLINATE REDUCTASE"
definition: >-
  Dihydrodipicolinate reductase (DHDPR), a product of an essential gene referred to as dapB, catalyzes the second step of lysine biosynthesis. It catalyses the reduction of 2,3-dihydrodipicolinate (DHDP) to 2,3,4,5-tetrahydrodipicolinate (THDP) in a nucleotide dependent reaction: 2,3-dihydrodipicolinate + NAD(P)H = 2,3,4,5-tetrahydrodipicolinate + NAD(P)(+) Interestingly, DHDPR could also function as a dehydratase in addition to the role of a nucleotide dependent reductase.
