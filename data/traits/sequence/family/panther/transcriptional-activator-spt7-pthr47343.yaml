identifier: PANTHER:PTHR47343
label: "TRANSCRIPTIONAL ACTIVATOR SPT7"
definition: >-
  This entry includes transcriptional activator Spt7, which is a component of the transcription regulatory histone acetylation complexes SAGA, SLIK and SALSA. The transcription regulatory histone acetylation complex Spt-Ada-Gcn5 acetyltransferase (SAGA) is involved in RNA polymerase II-dependent transcriptional regulation of approximately 10% of yeast genes. SAGA preferentially acetylates histones H3 and H2B and deubiquitinates histone H2B. SAGA is known as PCAF in vertebrates and PCAF acetylates nucleosomal histone H3. The SAGA complex consists of at least TRA1, CHD1, SPT7, TAF5, ADA3, SGF73, SPT20/ADA5, SPT8, TAF12, TAF6, HFI1/ADA1, UBP8, GCN5, ADA2, SPT3, SGF29, TAF10, TAF9, SGF11 and SUS1, and some of these components are present as two copies. The complex is built up from distinct modules, each of which has a separate function and crosslinks with either other proteins or other modules in the complex.
definition_source: "InterPro:IPR037782 abstract (PANTHER PTHR47343 is a member signature)"
