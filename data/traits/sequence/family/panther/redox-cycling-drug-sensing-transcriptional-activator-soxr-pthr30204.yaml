identifier: PANTHER:PTHR30204
label: "REDOX-CYCLING DRUG-SENSING TRANSCRIPTIONAL ACTIVATOR SOXR"
definition: >-
  This entry represents the MerR family of transcriptional regulators, a group of transcriptional activators with similar N-terminal helix-turn-helix DNA binding regions and C-terminal effector binding regions that are specific to the effector recognised. MerR-type regulators are present in diverse bacterial genera in the cytoplasm. The helix-turn-helix DNA-binding motif is located in the N-terminal part of these transcriptional regulators and is followed by a coiled-coil region. The C-terminal part of merR-type regulators contains effector binding regions that are specific to the effector recognised. Most merR-type transcriptional regulators respond to environmental stimuli, like heavy metals, oxidative stress, or antibiotics and a subgroup of metalloregulators are bacterial transcription activators that respond to metal ions. This entry also represents MerR homologs such as YehV (now MlrA).
definition_source: "InterPro:IPR047057 abstract (PANTHER PTHR30204 is a member signature)"
