identifier: PANTHER:PTHR24289
label: "STEROID 17-ALPHA-HYDROXYLASE/17,20 LYASE"
definition: >-
  STEROID 17-ALPHA-HYDROXYLASE/17,20 LYASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24289. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 9 of its annotated subfamilies. Subfamilies are annotated with the molecular function catalytic activity, monooxygenase activity, steroid hydroxylase activity. Subfamilies participate in lipid metabolic process, metabolic process, steroid metabolic process.
