  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of gene expression. Members of this family are known to activate transcription by interacting with the histone acetyltransferase HAG1/GCN5. This interaction leads to the acetylation of histone H3 at the promoters of target genes, which is a key epigenetic modification that facilitates the initiation of transcription. Through this mechanism, proteins in this family play a crucial role in controlling the expression of genes that are essential for various biological processes.
