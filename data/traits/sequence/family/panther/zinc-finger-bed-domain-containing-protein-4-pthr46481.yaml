  - kind: GENERAL
    text: >-
      The Zinc finger BED domain-containing protein family includes transcriptional regulators that interact with DNA and RNA, often binding to poly-guanine tracts to activate transcription. Members are involved in various developmental processes, such as vulval organogenesis, cell cycle regulation, and gonadal development. Some proteins within the family may also play roles in the biosynthesis of complex polyesters and in the regulation of distal tip cell migration. The BED domain is a characteristic feature that facilitates DNA-binding, suggesting a shared mechanism of action across the family in gene expression modulation and developmental regulation.
