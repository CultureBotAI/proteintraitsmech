  - kind: GENERAL
    text: >-
      This family of proteins functions as guanine nucleotide exchange factors (GEFs) for mitochondrial dynamin-related GTPases, specifically OPA1. They facilitate the activation of OPA1 by promoting the exchange of GDP for GTP, which is crucial for mitochondrial fusion processes, particularly those involving OPA1 and MFN1. Additionally, these proteins are vital for the biogenesis of mitochondrial ribosomes. They form part of a protein-RNA complex that includes RCC1L, NGRN, RPUSD3, RPUSD4, TRUB2, FASTKD2, and 16S mitochondrial ribosomal RNA. This complex is responsible for regulating the abundance of 16S mt-rRNA and is necessary for the intra-mitochondrial translation of core subunits of the oxidative phosphorylation system.
    source: "InterPro:IPR053035 abstract (LLM-generated, not curator-reviewed)"
