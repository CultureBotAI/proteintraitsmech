identifier: PANTHER:PTHR31165
label: "PROTEIN G1-LIKE2"
definition: >-
  This entry represents a group of ALOG (Arabidopsis LSH1 and Oryza G1) domain containing proteins, including LSH1-10 from Arabidopsis and G1/G1L1-8 from rice. G1 may be involved in transcriptional regulation and specifies sterile lemma identity in the rice spikelet. LSH1 is involved in phytochrome-mediated light signaling and in shoot meristem identity. The expression of LSH3 and LSH4 can be regulated by CUC1, which may suppress organ differentiation in the boundary region. The 125-residue ALOG (Arabidopsis LSH1 and oryza G1) domain is rich in basic amino acids, especially arginine, and is highly conserved among land plants. Members of the ALOG family of proteins function as key developmental regulators. It has been proposed that the ALOG domain originated from the N- terminal DNA-binding domains of integrases belonging to the tyrosine recombinase superfamily encoded by a distinct type of DIRS1-like LTR retrotransposon found in several eukaryotes. Secondary structure predictions revealed an all-α helical domain with four conserved helices.
definition_source: "InterPro:IPR040222 abstract (PANTHER PTHR31165 is a member signature)"
