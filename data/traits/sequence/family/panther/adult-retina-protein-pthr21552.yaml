identifier: PANTHER:PTHR21552
label: "ADULT RETINA PROTEIN"
definition: >-
  CREBRF, also known as LRF, recruits CREB3 (also known as Luman) into nuclear foci and represses CREB3-mediated activation of UPRE (unfolded protein response element)-containing promoters. CREB3 is implicated in herpes simplex virus-1 (HSV-1) latency/reactivation and the unfolded protein response (UPR) pathway. Homologues are found predominantly in metazoa.
