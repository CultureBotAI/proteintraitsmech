  - kind: GENERAL
    text: >-
      The protein family is characterized by its role as guanine nucleotide exchange factors (GEFs) that activate Rho GTPase family members, influencing signaling pathways that regulate neuronal shape, growth, and plasticity. These proteins are involved in actin cytoskeleton reorganization, contributing to cell migration, growth, and various developmental processes such as neuronal development, axonal outgrowth, dendrite formation, and synaptic function. Some family members also play a role in adipogenesis and myogenesis. They typically possess one or more DH domains that catalyze nucleotide exchange for RAC1 and/or RHOA, and may be regulated by interactions with SH3 domains or inositol phospholipids.
    source: "InterPro:IPR051336 abstract (LLM-generated, not curator-reviewed)"
