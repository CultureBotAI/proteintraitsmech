identifier: PANTHER:PTHR13355
label: "GLUCOSAMINE 6-PHOSPHATE N-ACETYLTRANSFERASE"
definition: >-
  This family groups acetyltransferases with broad specificity from bacteria, archaea and eukaryotes, including glucosamine 6-phosphate N-acetyltransferase (GNPNAT1; EC:2.3.1.4) from mammals and plants, and GCN5-related N-acetyltransferase 3 (GNAT3) from plants. GNPNAT1 is a component in the pathway for UDP-N-acetyl-alpha-D-glucosamine biosynthesis. GNPNAT1 transfers the acetyl group from acetyl-CoA to D-glucosamine 6-phosphate to generate N-acetyl-D-glucosamine 6-phosphate. The enzyme contains a GNAT domain and is naturally a homodimer. The enzyme from Aspergillus fumigatus, the causative agent of aspergillosis, is a potential drug target. GNAT3 is an acetyltransferase with dual specificity triggering both N-alpha-acetylation (NTA) and epsilon-lysine acetylation (KA), possibly with a low efficiency or toward specific plastid substrates.
definition_source: "InterPro:IPR039143 abstract (PANTHER PTHR13355 is a member signature)"
