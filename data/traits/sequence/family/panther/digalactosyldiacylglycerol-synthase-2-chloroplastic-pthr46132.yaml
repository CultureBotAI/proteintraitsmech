identifier: PANTHER:PTHR46132
label: "DIGALACTOSYLDIACYLGLYCEROL SYNTHASE 2, CHLOROPLASTIC"
definition: >-
  This entry represents a group of digalactosyldiacylglycerol synthases, including DGDG1 and DGDG2 from Arabidopsis. They are involved in the synthesis of the chloroplast lipid digalactosyldiacylglycerol (DGDG). DGDG provides stability to the photosystem I (PSI) complex, especially to the PsaA, PsaB, PsaC, PsaL and PsaH subunits. The DGDG1 and DGDG2 homologues can also be found in soybean and Lotus. Besides in plastids, they are also expressed during later stages of nodule development in infected cells and in cortical tissue.
definition_source: "InterPro:IPR044525 abstract (PANTHER PTHR46132 is a member signature)"
