identifier: PANTHER:PTHR33129
label: "PROTEIN KINASE DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  This family of proteins includes secreted effectors known to induce necrosis in host plants, which is a typical response of plant innate immunity. Members of this family possess a modular structure characterized by a signal peptide, a conserved N-terminal region, and variable C-terminal domains. The N-terminal region contains specific motifs essential for the translocation of these effectors into plant cells, facilitating their role in plant-pathogen interactions. The distinct motifs and domains within the N-terminus are crucial for their function and localization.
