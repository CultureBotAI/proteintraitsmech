identifier: PANTHER:PTHR43003
label: "DNA-3-METHYLADENINE GLYCOSYLASE"
definition: >-
  This family of proteins is involved in the cellular response to DNA damage, specifically alkylation lesions. Members of this family function as DNA glycosylases that recognize and excise various alkylated bases from DNA, thereby initiating the base excision repair (BER) pathway. These enzymes hydrolyze the N-glycosidic bond between the damaged base and the sugar-phosphate DNA backbone, creating an abasic site that is further processed by other repair proteins. Some members also exhibit a bifunctional role, acting as transcriptional activators to regulate the expression of genes involved in alkylation damage resistance. Additionally, certain proteins within this family may participate in damage signaling by recognizing and binding to abasic sites without displaying glycosylase activity, potentially facilitating the recruitment of other repair factors.
