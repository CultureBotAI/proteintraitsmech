identifier: PANTHER:PTHR14463
label: "LIPASE MATURATION FACTOR"
definition: >-
  This family of transmembrane proteins includes the lipase maturation factors LMF1 and LMF2. Lipoprotein lipase and hepatic lipase require LMF1 to fold into their active states. LMF1 acts as a specific chaperone for dimeric lipases, required both for maturation and transport of active lipoprotein lipase (LPL) through the secretory pathway.
