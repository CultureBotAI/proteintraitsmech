identifier: PANTHER:PTHR16650
label: C21ORF13-RELATED
definition: >-
  Lebercilin (LCA5) might be involved in minus end-directed microtubule transport. Defects in LCA5 are the cause of Leber congenital amaurosis type 5 (LCA5). LCA designates a clinically and genetically heterogeneous group of childhood retinal degenerations, generally inherited in an autosomal recessive manner. LCA represents the most common genetic cause of congenital visual impairment in infants and children. This family consists of Lebercilin and Lebercilin-like proteins.
