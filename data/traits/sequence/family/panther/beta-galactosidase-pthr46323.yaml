identifier: PANTHER:PTHR46323
label: BETA-GALACTOSIDASE
definition: >-
  The Beta-galactosidase family is composed of enzymes that catalyze the hydrolysis of beta-galactosides into monosaccharides mainly from bacteria, but also included in this entry are senquences from fungi and some plants. Members of the family are also capable of transglycosylation, which can result in the production of galacto-oligosaccharides (GOS). These enzymes are inhibited by various metal ions and chelating agents, and some are activated by specific cations. The family includes both large and small subunits of the enzyme, which may function together in a complex. Beta-galactosidases are involved in lactose degradation and are found across various bacterial species. They have applications in the dairy industry for lactose removal and GOS production.
