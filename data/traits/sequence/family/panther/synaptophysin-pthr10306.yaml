identifier: PANTHER:PTHR10306
label: SYNAPTOPHYSIN
definition: >-
  Synaptophysin and synaptoporin are related glycoproteins: they are the major integral membrane proteins of a certain class of small neurosecretory vesicles, although they may also be found in vesicles of various non-endocrine cells. The polypeptide chain spans the membrane four times and possibly acts as an ion or solute channel.
