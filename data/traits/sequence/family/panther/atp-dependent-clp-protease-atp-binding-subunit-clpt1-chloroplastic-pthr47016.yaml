identifier: PANTHER:PTHR47016
label: "ATP-DEPENDENT CLP PROTEASE ATP-BINDING SUBUNIT CLPT1, CHLOROPLASTIC"
definition: >-
  This entry includes a group of plant proteins, including CLPT1/2 from Arabidopsis. CLPT1/2 are accessory proteins regulating the assembly of the plastidial Clp protease system. During assembly of the Clp proteolytic core, ClpT1 first binds to the P-ring (consisting of ClpP3-6 subunits) followed by ClpT2, and only then does the P-ring combine with the R-ring (ClpP1, ClpR1-4 subunits). CLPT1/2 share structural similarities to the N-domains of bacterial ClpA/C chaperones.
