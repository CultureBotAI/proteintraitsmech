identifier: PANTHER:PTHR40562
label: "Nitrite reductase (NADH) small subunit"
definition: >-
  In Proteobacteria and Actinobacteria the main nitrite reductase activity is contributed by the NADH-dependent nitrite reductase, which detoxifies the nitrite formed as the product of nitrate reduction. The NADH-nitrite reductase operon consists of 4 genes: nirB, nirD, nirC and cysG. The enzyme is formed by the two subunits nirB and nirD. NirC is a nitrite transporter and cysG is required for the synthesis of sirohaem, a cofactor of the nirB subunit. NirD displays some sequence similarities with the 2Fe-2S Rieske domain (see PROSITE:PDOC00177), but it does not contain the essential residues for the coordination of the iron sulphur. The entry includes the NirD subunit.
definition_source: "InterPro:IPR017881 abstract (PANTHER PTHR40562 is a member signature)"
