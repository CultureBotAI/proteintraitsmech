definitions:
  - kind: GENERAL
    text: >-
      U3 SMALL NUCLEOLAR RNA U3 SNORNA ASSOCIATED PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22851. PANTHER protein class: RNA metabolism protein. Members participate in cellular aromatic compound metabolic process, cellular component biogenesis, biosynthetic process. Members localise to membrane-enclosed lumen, intracellular non-membrane-bounded organelle, small-subunit processome.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in various cellular processes, including the assembly of the small subunit processome, a precursor to the small eukaryotic ribosomal subunit. They are implicated in ribosomal RNA processing, which involves RNA folding, modifications, rearrangements, and cleavage, as well as targeted RNA degradation by the RNA exosome. Additionally, these proteins function as substrate-recognition components of the DCX (DDB1-CUL4-X-box) E3 ubiquitin-protein ligase complex, playing a crucial role in embryo preimplantation, meiotic cycle progression in oocytes, and zygotic gene expression. They are also involved in the regulation of oocyte and zygotic chromatin structure during maternal to zygotic transition, as well as in the transformation of the endometrium for blastocyst implantation. They target specific proteins for polyubiquitination and proteasomal degradation, which is essential for various developmental and cellular processes.
    source: "InterPro:IPR051733 abstract (LLM-generated, not curator-reviewed)"
