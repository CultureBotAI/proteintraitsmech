definitions:
  - kind: GENERAL
    text: >-
      ZINC FINGER PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45925. PANTHER protein class: C2H2 zinc finger transcription factor, zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of DNA-templated transcription. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional regulators that bind to specific DNA motifs to activate or repress gene transcription. They play roles in various biological processes such as brown adipose tissue differentiation, thermogenesis, chondrocyte differentiation, neuron differentiation, cellular response to replication stress, and regulation of gene expression in response to retinoic acid. Members of this family are characterized by the presence of C2H2-type zinc-finger domains, which are crucial for DNA binding and interaction with other proteins such as SOX9. They are involved in the regulation of genes like UCP1, col2a1a, HMGN1, and SNCA, and can influence cell proliferation and survival.
    source: "InterPro:IPR051967 abstract (LLM-generated, not curator-reviewed)"
