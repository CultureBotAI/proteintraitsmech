identifier: PANTHER:PTHR46407
label: "OS02G0208700 PROTEIN"
definition: >-
  This entry represents a group of plant F-box/kelch-repeat proteins, including KMD1-4 from Arabidopsis. They belong to the kiss me deadly (KMD) family, whose members target type-B ARR proteins for degradation. They form an S-phase kinase-associated PROTEIN1 (SKP1)/Cullin/F-box protein (SCF) E3 ubiquitin ligase complex and directly interact with type-B ARR proteins, which then regulates the transcriptional response to cytokinin. KMD1 (At1g80440, also known as KFB20), KMD2 (AT1G15670, also known KFB01) and KDM4 (also known as SKIP20) interact with four PAL isozymes and mediate their proteolytic turnover via the ubiquitination-26S proteasome pathway.
definition_source: "InterPro:IPR044595 abstract (PANTHER PTHR46407 is a member signature)"
