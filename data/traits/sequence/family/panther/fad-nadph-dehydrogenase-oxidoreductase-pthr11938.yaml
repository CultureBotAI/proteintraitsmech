  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in electron transfer processes and nitrogen metabolism. Members of this family function as electron carriers, transferring electrons from NADPH or NADH to various acceptor molecules, often as part of P450 systems. These proteins are essential for the biosynthesis of steroid hormones and other metabolic processes in mitochondria. Additionally, some family members catalyze the synthesis of glutamate from glutamine and 2-oxoglutarate, playing a critical role in amino acid metabolism and the assimilation of nitrogen. The activity of these enzymes is regulated by various factors, including phosphorylation and the presence of specific substrates or inhibitors.
