identifier: PANTHER:PTHR22166
label: "ENDOPLASMIC RETICULUM JUNCTION FORMATION PROTEIN LUNAPARK"
definition: >-
  Lunapark (Lnp) is an endoplasmic reticulum (ER)-shaping membrane protein named after its conserved L-N-P-A-R-K peptide motif. It may serve as a curvature-stabilizing protein within tubular three-way junctions of the ER. Mutations in the Lnp gene has been linked to neurodevelopmental syndrome.
