definitions:
  - kind: GENERAL
    text: >-
      PROTEIN LIN-28 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46109. PANTHER protein class: RNA metabolism protein. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding. and participate in cellular aromatic compound metabolic process, negative regulation of macromolecule biosynthetic process, heterocycle metabolic process. and localise to cytoplasm, membrane-bounded organelle, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of microRNA (miRNA) biogenesis and mRNA translation. Members of this family bind to primary miRNA transcripts, particularly those with a 5'-GGAG-3' motif, and can sequester them to prevent processing into mature miRNAs. They are also known to bind mRNAs and enhance their translation, particularly those related to developmental timing, pluripotency, and metabolism. The proteins can recognize structural features in RNA, such as G-quartets, and are associated with the translational machinery, affecting initiation events and mRNA stability. They have roles in muscle differentiation, tissue repair, and maintaining the pluripotent state of stem cells by suppressing differentiation-inducing miRNAs like let-7.
    source: "InterPro:IPR051373 abstract (LLM-generated, not curator-reviewed)"
    method: GENERATED
