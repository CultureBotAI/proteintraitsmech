identifier: PANTHER:PTHR31560
label: "UPF0652 PROTEIN C16A11.03C-RELATED"
definition: >-
  This entry describes a family of non-canonical E2 ubiquitin-conjugating proteins that lack the typical HPN motif characteristic of conventional E2 enzymes, including from Plasmodium falciparum and similar proteins mainly from in Apicomplexan parasites, fungi and some amoeba species. These proteins show a C-terminal domain ( ) that possess a highly conserved catalytic cysteine residue, which forms a thioester bond with ubiquitin.The N-terminal region contains coiled helices involved in protein-protein interactions with other ubiquitin pathway components like Rbx1.
