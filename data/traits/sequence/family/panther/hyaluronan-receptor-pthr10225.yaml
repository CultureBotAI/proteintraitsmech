identifier: PANTHER:PTHR10225
label: "HYALURONAN  RECEPTOR"
definition: >-
  CD44, also known as the hyaluronan receptor, is a polymorphic cell-surface glycoprotein synthesised in a variety of cells. The protein interacts with actin-based cytoskeletons, and co-localises with ERM proteins (ezrin, radixin and moesin) at actin filament- plasma membrane interaction sites. CD44 may be involved in cell migration, adhesion and differentiation in normal cells, as well as in metastasis in cancer cells. It is a receptor for extracellular materials, such as soluble or cell-bound hyaluronic acid, collagen, fibronectin and serglycin. The protein has a single membrane-spanning domain and has a heavily glycosylated extracellular domain; its cytoplasmic domain is reportedly associated with an ankyrin-like protein. Some of the proteins in this group are responsible for the molecular basis of the blood group antigens, surface markers on the outside of the red blood cell membrane. Most of these markers are proteins, but some are carbohydrates attached to lipids or proteins [Reid M.E., Lomas-Francis C. The Blood Group Antigen FactsBook Academic Press, London / San Diego, (1997)]. CD44 antigen (Phagocytic glycoprotein I) belongs to the Indian blood group system and is associated with In(a/b) antigen. In addition to CD44 antigens this entry also includes lymphatic vessel endothelial hyaluronic acid receptor 1, also known as cell surface retention sequence binding protein-1 (CRSBP-1). CRSBP-1, a membrane glycoprotein, can mediate cell-surface retention of secreted growth factors containing CRS motifs such as PDGF-BB. The role of CRSBP-1 is unknown. This entry appears to be restricted to metazoa.
