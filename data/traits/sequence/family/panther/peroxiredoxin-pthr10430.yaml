identifier: PANTHER:PTHR10430
label: PEROXIREDOXIN
definition: >-
  PRX5-like proteins belongs to the peroxiredoxin (PRX) family. PRX5 is a homodimeric thioredoxin (TRX) peroxidase widely expressed in tissues and found cellularly in mitochondria, peroxisomes and the cytosol. The cellular location of PRX5 suggests that it may have an important antioxidant role in organelles that are major sources of reactive oxygen species (ROS), as well as a role in the control of signal transduction. Budding yeast PRX5 homologue, Ahp1, may act as both a peroxidase and a receptor for alkylhydroperoxides. Pmp20 from fission yeast may act as a chaperone rather than a peroxidase. As with all other PRXs, the N-terminal peroxidatic cysteine of PRX5 is oxidized into a sulfenic acid intermediate upon reaction with peroxides. Human PRX5 is able to resolve this intermediate by forming an intramolecular disulfide bond with its C-terminal cysteine (the resolving cysteine), which can then be reduced by TRX, just like an atypical 2-cys PRX. This resolving cysteine, however, is not conserved in other members of the subfamily. In such cases, it is assumed that the oxidized cysteine is directly resolved by an external small-molecule or protein reductant, typical of a 1-cys PRX. PRX5 homodimers show an A-type interface, similar to atypical 2-cys PRXs.
definition_source: "InterPro:IPR037944 abstract (PANTHER PTHR10430 is a member signature)"
