identifier: PANTHER:PTHR20884
label: "GDP-D-GLUCOSE PHOSPHORYLASE 1"
definition: >-
  GDP-D-glucose phosphorylase 1 (GDPGP1) is a specific and highly efficient GDP-D-glucose phosphorylase regulating the levels of GDP-D-glucose in cells. This family also includes the GDP-L-galactose phosphorylases VTC2 and VTC2L (VTC5) from Arabidopsis, which use preferentially GDP-L-galactose and GDP-D-glucose as substrates and are part of the Smirnoff-Wheeler pathway for ascorbate biosynthesis in plants. They act as a phosphorylase rather than as transferases. This entry also includes uncharacterised proteins from bacteria.
