identifier: PANTHER:PTHR12372
label: PECANEX
definition: >-
  Pecanex is a multi-pass transmembrane protein. Its function is not clear. In fruit flies, it is a maternal neurogenic gene and is involved in notch (N) signaling. In rat, it is expressed in spermatocytes and probably functions in the testes.
