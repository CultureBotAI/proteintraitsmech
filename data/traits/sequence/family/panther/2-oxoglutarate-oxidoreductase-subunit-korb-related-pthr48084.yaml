  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that catalyze the coenzyme A-dependent oxidative decarboxylation of various 2-oxoacids, such as pyruvate, 2-oxobutyrate, glyoxylate, and 2-oxoglutarate, to form their corresponding CoA derivatives. These reactions are crucial in metabolic pathways, including the tricarboxylic acid cycle and alternative metabolic routes. The enzymes are characterized by their interaction with ferredoxin or other electron acceptors and are involved in key energy-producing processes within the cell. One member is specifically noted to participate in an alternative TCA pathway, important for the metabolism of lipids such as fatty acids and cholesterol, particularly in the context of M.tuberculosis infection.
    source: "InterPro:IPR051457 abstract (LLM-generated, not curator-reviewed)"
