identifier: PANTHER:PTHR21325
label: "PHOSPHOLIPASE B, PLB1"
definition: >-
  PLB1 is a membrane-associated phospholipase. It contains four tandem homologous domains (repeats 1 to 4) and a C-terminal membrane binding domain. Repeat 2 is the catalytic domain that catalyzes phospholipase A2, lysophospholipase, and lipase activities.
