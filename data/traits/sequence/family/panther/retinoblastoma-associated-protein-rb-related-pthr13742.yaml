identifier: PANTHER:PTHR13742
label: "RETINOBLASTOMA-ASSOCIATED PROTEIN  RB -RELATED"
definition: >-
  This entry represents the retinoblastoma protein family, including retinoblastoma-associated protein (RB, also known as pRb, RB, p1051), retinoblastoma-like protein 1 (RBL1, also known as p107) and retinoblastoma-like protein 2 (RBL2, also known as RB2 or p130). Members of this family contain a conserved domain named the 'pocket' that interacts with the LXCXE motif found in viral proteins, such as SV40 large T antigen. Therefore, this family is also called the pocket protein family. In humans, RB is a tumour suppressor linked to several major cancers. RB forms complexes with E2Fs and represses gene expression by recruiting chromatin remodeling factors, such as histone deacetylases (HDACs) to E2F-responsive promoters. This interaction regulates genes necessary for DNA replication and cell cycle. Phosphorylation of RB family by CDK and cyclin complexes leads to release of the repressor complex and enables E2F-dependent gene expression. Apart from E2Fs, RB also interacts with other transcription factors that govern cell differentiation.
definition_source: "InterPro:IPR028309 abstract (PANTHER PTHR13742 is a member signature)"
