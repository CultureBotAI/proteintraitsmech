identifier: PANTHER:PTHR31947
label: "DNA/RNA-BINDING PROTEIN ALBA 3"
definition: >-
  This entry represents a group of proteins from plants and lower eukaryotes that are related to the archaeal DNA/RNA-binding protein Alba, also called histone-like protein (InterPro:IPR013795), and its eukaryotic homologues RNase P/MRP subunits Pop7/Rpp20 (InterPro:IPR014612) and Rpp25. Members of this family are the uncharacterised protein At2g34160 from Arabidopsis thaliana, which affects rRNA processing, and Endonuclease ALBA3 from Plasmodium falciparum, which can bind both DNA and RNA. Structural comparisons have shown that Alba (Sso10b2 from the thermoacidophilic archaeon Sulfolobus solfataricus) is topologically similar to several RNA-binding proteins (or A-DNA-binding) and includes IF3-C, YhhP, and DNase I. All of them have a similar IF3-C fold and it has been suggested that the ancestral function of the IF3-C fold is related to RNA interaction, and that the Alba superfamily proteins originated as RNA-binding proteins that formed various ribonucleoprotein complexes, probably including RNase P, and were then recruited as a chromosomal protein within the crenarchaeal lineage. Based on this, it has been suggested that the archaeal Alba proteins (PIRSF:PIRSF028732) are involved in RNA binding as well as DNA binding, a prediction that has been confirmed experimentally. For more information about Alba, please see PIRSF:PIRSF028732.
