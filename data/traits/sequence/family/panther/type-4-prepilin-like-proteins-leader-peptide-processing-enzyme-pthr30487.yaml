identifier: PANTHER:PTHR30487
label: "TYPE 4 PREPILIN-LIKE PROTEINS LEADER PEPTIDE-PROCESSING ENZYME"
definition: >-
  The Prepilin leader peptidase/N-methyltransferase family is involved in the biogenesis of type IV pili and type II pseudopili, which are critical for bacterial motility, adhesion, and host colonization. Members of the family function by proteolytically cleaving the leader sequence from precursor proteins, a process essential for pilus assembly. Following cleavage, they catalyze the N-methylation of the N-terminal phenylalanine residue of the mature protein. Some family members are also implicated in the type II general secretory pathway, processing substrates necessary for the secretion system's apparatus. The dual enzymatic activity of these proteins underscores their importance in bacterial cell surface structures and secretion systems.
