identifier: PANTHER:PTHR37996
label: "B- AND T-LYMPHOCYTE ATTENUATOR"
definition: >-
  BTLA is a lymphocyte inhibitory receptor belonging to the immunoglobulin superfamily. The BTLA ligand is a tumour necrosis factor receptor named herpesvirus-entry mediator (HVEM). BTLA-HVEM interactions have been shown to regulate responses in several pathogen and autoimmune settings.
