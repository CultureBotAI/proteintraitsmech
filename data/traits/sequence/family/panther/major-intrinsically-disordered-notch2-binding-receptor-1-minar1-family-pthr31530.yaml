identifier: PANTHER:PTHR31530
label: "MAJOR INTRINSICALLY DISORDERED NOTCH2-BINDING RECEPTOR 1 MINAR1 FAMILY MEMBER"
definition: >-
  Major intrinsically disordered Notch2-binding receptor 1 (MINAR1) is a Notch2-binding protein that has been shown to inhibit angiogenesis and breast cancer growth. MINAR1 is a single-pass type I membrane protein. Homologues are found in vertebrates.
