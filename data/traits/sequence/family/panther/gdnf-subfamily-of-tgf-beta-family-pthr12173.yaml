identifier: PANTHER:PTHR12173
label: "GDNF SUBFAMILY OF TGF-BETA FAMILY"
definition: >-
  The GDNF family members (consists of GDNF, neurturin, artemin and persephin) are structurally similar to transforming growth factor-beta. Unlike other members of the TGF-beta superfamily, which signal through the receptor serine-threonine kinases, GDNF family ligands activate intracellular signalling cascades via the receptor tyrosine kinase Ret. GDNF family ligands binds to GDNF family receptor alpha (GFRalpha) and then the GDNF family ligand-GFRalpha complex binds to and stimulates autophosphorylation of Ret. For instance, GDNF binds to GFRalpha1, Neurturin binds to GFRalpha2, artemin to GFRalpha3 and persephin activates Ret by binding to GFRalpha4. The GDNF family members support the survival of dopamine neurons and motoneurons, and some of them also regulate the development of enteric, sympathetic and parasympathetic neurons.
