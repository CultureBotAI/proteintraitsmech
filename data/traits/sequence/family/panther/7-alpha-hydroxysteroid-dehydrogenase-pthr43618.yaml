  - kind: GENERAL
    text: >-
      This family of proteins includes short-chain dehydrogenases/reductases (SDRs) involved in various biosynthetic pathways for secondary metabolites in fungi and bacteria. These enzymes typically function in the reduction or oxidation of substrates using NAD(P)H as a cofactor. Members of this family are implicated in the biosynthesis of mycotoxins such as phomopsins and satratoxins, antibacterial compounds like viriditoxin, and biosurfactants such as rhamnolipids. They are responsible for key steps in these pathways, including the reduction of keto groups to hydroxyl groups, the formation of dihydropyrones, and the generation of beta-hydroxy acid moieties. The exact roles of some members within their respective pathways are yet to be fully elucidated, and they may exhibit broad substrate specificity, contributing to the diversity of secondary metabolites produced.
    source: "InterPro:IPR052178 abstract (LLM-generated, not curator-reviewed)"
