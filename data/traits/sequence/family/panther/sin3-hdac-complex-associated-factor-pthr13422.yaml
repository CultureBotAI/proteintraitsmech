identifier: PANTHER:PTHR13422
label: "SIN3-HDAC COMPLEX-ASSOCIATED FACTOR"
definition: >-
  SIN3-HDAC complex-associated factor (also known as FAM60A) is found in eukaryotes. It has been shown to be a subunit of the Sin3 deacetylase complex (Sin3/HDAC), important for the repression of genes involved in the TGF-beta signaling pathway.
