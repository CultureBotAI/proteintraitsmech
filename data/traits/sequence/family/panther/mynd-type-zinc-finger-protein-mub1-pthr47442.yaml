identifier: PANTHER:PTHR47442
label: "MYND-TYPE ZINC FINGER PROTEIN MUB1"
definition: >-
  This family of proteins includes MYND-type zinc finger domains and is involved in the regulation of morphogenesis and polarized growth. Members of this family play a crucial role in the onset of polarized growth, branching regulation in hyphae, and spore formation. In yeast, they are also implicated in the ubiquitin-dependent degradation of specific proteins, contributing to cellular protein homeostasis.
