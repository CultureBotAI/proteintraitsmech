identifier: PANTHER:PTHR22879
label: "NUT FAMILY MEMBER 1"
definition: >-
  The gene encoding Nuclear Testis (NUT) protein is found fused to BRD3 or BRD4 genes in some aggressive types of carcinoma due to chromosomal translocations. Proteins of the BRD family contain two bromodomains that bind transcriptionally active chromatin through associations with acetylated histones H3 and H4. Such proteins are crucial for the regulation of cell cycle progression. On the other hand, little is known about NUT protein function.
