identifier: PANTHER:PTHR22589
label: "CARNITINE O-ACYLTRANSFERASE"
definition: >-
  A number of eukaryotic acetyltransferases can, on the basis of sequence similarities, be grouped together into a family. These enzymes include: Choline o-acetyltransferase EC:2.3.1.6, an enzyme that catalyses the biosynthesis of the neurotransmitter acetylcholine. Carnitine o-acetyltransferase EC:2.3.1.7. Peroxisomal carnitine octanoyltransferase EC:2.3.1.137, a fatty acid beta-oxidation pathway enzyme which is involved in the transport of medium-chain acyl-coenzyme A's from peroxisome to mitochondria. Mitochondrial carnitine palmitoyltransferases I and II EC:2.3.1.21 (CPT), enzymes involved in fatty acid metabolism and transport. Mycoplasma pneumoniae putative acetyltransferase C09_orf600.
