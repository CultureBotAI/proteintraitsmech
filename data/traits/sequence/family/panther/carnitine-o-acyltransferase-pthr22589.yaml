identifier: PANTHER:PTHR22589
label: "CARNITINE O-ACYLTRANSFERASE"
definition: >-
  A number of eukaryotic acetyltransferases can, on the basis of sequence similarities, be grouped together into a family. These enzymes include: Choline o-acetyltransferase, an enzyme that catalyses the biosynthesis of the neurotransmitter acetylcholine. Carnitine o-acetyltransferase. Peroxisomal carnitine octanoyltransferase, a fatty acid beta-oxidation pathway enzyme which is involved in the transport of medium-chain acyl-coenzyme A's from peroxisome to mitochondria. Mitochondrial carnitine palmitoyltransferases I and II (CPT), enzymes involved in fatty acid metabolism and transport. Mycoplasma pneumoniae putative acetyltransferase C09_orf600.
