identifier: PANTHER:PTHR43476
label: "3-(3-HYDROXY-PHENYL)PROPIONATE/3-HYDROXYCINNAMIC ACID HYDROXYLASE"
definition: >-
  The PheA/TfdB FAD monooxygenase family is involved in diverse hydroxylation reactions, primarily catalyzing the insertion of an oxygen atom into aromatic compounds. Members of this family are key enzymes in various biological pathways, including the degradation of phenolic compounds and the biosynthesis of antibiotics. They typically act on substrates such as 3-(3-hydroxyphenyl)propionate, hydroxycinnamic acid, and other aromatic molecules, facilitating the breakdown of these compounds into less complex forms that can be further metabolized. Some family members also participate in the modification of intermediate compounds in the production of antibiotics, enhancing their efficacy or altering their properties. The enzymes generally require FAD as a cofactor and exhibit higher catalytic efficiency with NADH over NADPH. The family's role in environmental detoxification and pharmaceutical biosynthesis highlights its importance in both ecological and medical contexts.
