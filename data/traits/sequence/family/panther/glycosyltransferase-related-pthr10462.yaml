identifier: PANTHER:PTHR10462
label: GLYCOSYLTRANSFERASE-RELATED
definition: >-
  The biosynthesis of disaccharides, oligosaccharides and polysaccharides involves the action of hundreds of different glycosyltransferases. These enzymes catalyse the transfer of sugar moieties from activated donor molecules to specific acceptor molecules, forming glycosidic bonds. A classification of glycosyltransferases using nucleotide diphospho-sugar, nucleotide monophospho-sugar and sugar phosphates ([ec:2.4.1.-]) and related proteins into distinct sequence-based families has been described. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. The same three-dimensional fold is expected to occur within each of the families. Because 3-D structures are better conserved than sequences, several of the families defined on the basis of sequence similarities may have similar 3-D structures and therefore form 'clans'. Glycosyltransferase family 6 CAZy:GT6 comprises enzymes with three known activities; alpha-1,3-galactosyltransferase (EC:2.4.1.151); alpha-1,3 N-acetylgalactosaminyltransferase (EC:2.4.1.40); alpha-galactosyltransferase (EC:2.4.1.37).
