identifier: PANTHER:PTHR45700
label: "UBIQUITIN-PROTEIN LIGASE E3C"
definition: >-
  This entry represents a group of E3 ubiquitin-protein ligases, including UBE3A/B/C from animals, Hul5 from budding yeasts, Etc-1 from C. elegans and UPL6/7 from Arabidopsis. They are HECT (Homologous to E6AP C terminus) domain E3 that synthesizes K29- and K48-linked chains.
definition_source: "InterPro:IPR044611 abstract (PANTHER PTHR45700 is a member signature)"
