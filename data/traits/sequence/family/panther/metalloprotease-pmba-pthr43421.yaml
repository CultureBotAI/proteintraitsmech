identifier: PANTHER:PTHR43421
label: "METALLOPROTEASE PMBA"
definition: >-
  This entry represents a group of proteins from bacteria and archaea, including metalloprotease PmbA (also known as TldE) from Escherichia coli. PmbA is involved in proteolytic processing of the antibiotic Microcin B17. It suppresses the inhibitory activity of the carbon storage regulator (CsrA).
