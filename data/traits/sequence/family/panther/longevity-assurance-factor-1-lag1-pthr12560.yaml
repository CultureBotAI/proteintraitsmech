identifier: PANTHER:PTHR12560
label: "LONGEVITY ASSURANCE FACTOR 1  LAG1"
definition: >-
  Yeast ceramide synthase component Lag1 has a paralog, Lac1. This entry includes Lac1, Lag1 and their homologues from plants and animals, involved in sphingolipid synthesis. LAG1 and LAC1 contain multiple membrane-spanning domains and are localised to the endoplasmic reticulum (ER). They are essential subunits of the acyl-CoA-dependent ceramide synthase that is involved in synthesis of ceramide from C26(acyl)-coenzyme A and dihydrosphingosine or phytosphingosine. Human Lac1/Lag1 homologue CERS2 (ceramide synthase 2) is a tumour metastasis suppressor that can inhibit breast cancer cell invasion.
