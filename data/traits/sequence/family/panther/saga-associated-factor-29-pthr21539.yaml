identifier: PANTHER:PTHR21539
label: "SAGA-ASSOCIATED FACTOR 29"
definition: >-
  SAGA-associated factor 29 (SGF29) is a chromatin reader and a component of the transcription regulatory histone acetylation (HAT) complexes SAGA and SLIK. In the SAGA complex, SGF29 binds histone H3 that has been methylated at Lys-4 (H3K4me), and preferably binds the trimethylated form (H3K4me3). SGF29 also acts as a boundary, preventing the spread of heterochromatin into neighbouring genes. SGF29 contains two Tudor domains. The transcription regulatory histone acetylation complex Spt-Ada-Gcn5 acetyltransferase (SAGA) is involved in RNA polymerase II-dependent transcriptional regulation of approximately 10% of yeast genes. SAGA preferentially acetylates histones H3 and H2B and deubiquitinates histone H2B. SAGA is known as PCAF in vertebrates and PCAF acetylates nucleosomal histone H3. The SAGA complex consists of at least TRA1, CHD1, SPT7, TAF5, ADA3, SGF73, SPT20/ADA5, SPT8, TAF12, TAF6, HFI1/ADA1, UBP8, GCN5, ADA2, SPT3, SGF29, TAF10, TAF9, SGF11 and SUS1, and some of these components are present as two copies. The complex is built up from distinct modules, each of which has a separate function and crosslinks with either other proteins or other modules in the complex. SLIK (SAGA-like) is a multi-subunit histone acetyltransferase complex that preferentially acetylates histones H3 and H2B and deubiquitinates histone H2B. It is an embellishment of the SAGA complex. The yeast SLIK complex consists of at least TRA1, CHD1, SPT7, CC TAF5, ADA3, SPT20, RTG2, TAF12, TAF6, HFI1, UBP8 (a deubiquitinase), GCN5, ADA2, SPT3, SGF29, TAF10 and TAF9.
