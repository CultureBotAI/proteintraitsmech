identifier: PANTHER:PTHR33928
label: "POLYGALACTURONASE QRT3"
definition: >-
  This entry includes Arabidopsis QRT3 and related proteins from plants and fungi which share the β-helical structure like pectate lyase. AtQRT3 is a polygalacturonase required for degrading the pollen mother cell wall during microspore development. It contains PbH1 (parallel β-helix) repeats and is a member of glycosyl hydrolase 28 family. Fungal proteins such as BGN13.1 and ARB_02077 may be involved in mycoparasitism, in the hydrolysis of fungal cell wall.
