identifier: PANTHER:PTHR13335
label: "TARGET OF RAPAMYCIN COMPLEX 2 SUBUNIT MAPKAP1"
definition: >-
  This entry includes MAPKAP1/Sin1 from animals, Sin1 from fission yeast, Avo1 from budding yeast and Rip3 from Slime mold. They are part of the Target Of Rapamycin Complex 2 (TORC2) complex, which plays an essential role in signal transduction. The mammalian TORC2 consists of mTOR, MLST8, PRR5, RICTOR, MAPKAP1 and DEPTOR. Within TORC2, MAPKAP1 is required for complex formation and TORC2 kinase activity. The budding yeast TORC2 is composed of Avo1, Avo2, Tsc11, Lst8, Bit61, Slm, Slm2 and Tor2.
