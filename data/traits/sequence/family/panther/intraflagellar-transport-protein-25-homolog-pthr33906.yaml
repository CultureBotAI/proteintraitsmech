identifier: PANTHER:PTHR33906
label: "INTRAFLAGELLAR TRANSPORT PROTEIN 25 HOMOLOG"
definition: >-
  Intraflagellar transport (IFT) is the bidirectional movement of multimeric protein particles, termed IFT particles, between the cell body and the distal tip of a flagellum. IFT particle proteins are thought to serve as scaffolds to facilitate the attachment of cargo proteins to IFT motors, mediating the transport of flagellar precursors. The main constituents of IFT particles are organized into two protein complexes, A and B. IFT25 is a component of the intraflagellar transport (IFT) complex B. It directly interacts with IFT27, forming a subcomplex that may be involved in the regulation of IFT. IFT25 is required for Hedgehog signalling in cilia.
definition_source: "InterPro:IPR033558 abstract (PANTHER PTHR33906 is a member signature)"
