identifier: PANTHER:PTHR10404
label: "N-ACETYLATED-ALPHA-LINKED ACIDIC DIPEPTIDASE"
definition: >-
  This entry includes glutamate carboxypeptidase 2 (FOLH1) and its homologues from peptidase family M28 subfamily B. Not all members of this subfamily are peptidases, and non-peptidase homologues include transferrin receptor proteins (TFRC). FOLH1 is a zinc-dependent carboxypeptidase that also acts as a folate hydrolase and N-acetylated-alpha-linked-acidic dipeptidase (NAALADase). It has a preference for tri-alpha-glutamate peptides. It is required for the uptake of folate in the intestine, and in the brain modulates excitatory neurotransmission through the hydrolysis of the neuropeptide, N-aceylaspartylglutamate (NAAG), releasing glutamate. Two zinc ions are bound per molecule. TFRC acts as a lipid sensor, controlling the fusion of mitochondria by modulating the activation of the JNK pathway.
definition_source: "InterPro:IPR039373 abstract (PANTHER PTHR10404 is a member signature)"
