  - kind: GENERAL
    text: >-
      This family of proteins includes mucins and transcription-associated components. Mucins are high molecular weight glycoproteins that form a protective, lubricating barrier on mucosal surfaces, playing a role in defense against pathogens and particles. They are involved in various cellular processes such as ligand binding, intracellular signaling, epithelial cell protection, adhesion modulation, and potentially in the regulation of epithelial cell growth. The family also appears to include proteins related to the PI3/PI4-kinase family, suggesting a role in signaling pathways. However, the function of some members remains uncharacterized.
