identifier: PANTHER:PTHR18956
label: "HYALURONAN MEDIATED MOTILITY RECEPTOR"
definition: >-
  The extracellular matrix component hyaluronan plays important roles in various processes of organogenesis, cell migration and cancer. Recognition of and binding to hyaluronan is mediated by cell surface receptors. The proteins in this family were initially called receptor for hyaluronan mediated motility (RHAMM), and were thought to be involved in cell motility. However, several lines of evidence suggest that they do not function as a conventional motility receptors for hyaluronan, leading to the suggestion they should be renamed intracellular hyaluronic acid binding protein (IHABP). IHABP is overexpressed in many cancers and may be involved in cellular transformation and metastasis formation, and in regulating extracellular-regulated kinase (ERK) activity.
definition_source: "InterPro:IPR026203 abstract (PANTHER PTHR18956 is a member signature)"
