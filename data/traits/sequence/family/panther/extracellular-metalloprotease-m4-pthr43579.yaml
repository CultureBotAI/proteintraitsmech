  - kind: GENERAL
    text: >-
      This family of proteins includes extracellular metalloproteases that are characterized by their ability to interact with and degrade peptide substrates. Members of this family are involved in various biological processes, including the modulation of antibacterial peptide activity. One known function is the inhibition of insect antibacterial peptides, which can lead to a reduction in the antibacterial activity of certain hemolymph components and cecropins. These metalloproteases are sensitive to specific inhibitors, indicating a regulatory mechanism for their proteolytic activity. The family is part of the broader peptidase M4 family, which is known for its metalloprotease activity.
