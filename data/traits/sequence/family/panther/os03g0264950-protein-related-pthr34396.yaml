label: "OS03G0264950 PROTEIN-RELATED"
definition: >-
  OS03G0264950 PROTEIN-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR34396. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 13 of its annotated subfamilies. Subfamilies are annotated with the molecular function sequence-specific double-stranded DNA binding. Subfamilies participate in regulation of transcription by RNA polymerase II. Subfamilies localise to nucleus, intracellular anatomical structure.
