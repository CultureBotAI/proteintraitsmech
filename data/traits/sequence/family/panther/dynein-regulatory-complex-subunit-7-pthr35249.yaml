identifier: PANTHER:PTHR35249
label: "DYNEIN REGULATORY COMPLEX SUBUNIT 7"
definition: >-
  DRC7 or coiled-coil domain-containing protein 135 (CCD135), known as lobo in Drosophila, is a protein involved in flagelar motility. It is a component of the nexin-dynein regulatory complex, which is an important regulatory node of dynein activity. Lobo is involved in Drosophila sperm motility.
