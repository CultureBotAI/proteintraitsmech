identifier: PANTHER:PTHR12309
label: "SEC61 GAMMA SUBUNIT"
definition: >-
  SEC61 GAMMA SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12309. PANTHER protein class: primary active transporter, transporter. Members are annotated with the molecular function protein transmembrane transporter activity. and participate in localization within membrane, establishment of protein localization to organelle, intracellular transport. and localise to nuclear outer membrane-endoplasmic reticulum membrane network, membrane protein complex, endoplasmic reticulum protein-containing complex.
