identifier: PANTHER:PTHR12309
label: "SEC61 GAMMA SUBUNIT"
definition: >-
  SEC61 GAMMA SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12309. PANTHER protein class: primary active transporter, transporter. Members are annotated with the molecular function protein transmembrane transporter activity. Members participate in post-translational protein targeting to membrane, translocation, localization within membrane, establishment of protein localization to organelle. Members localise to endoplasmic reticulum, rough endoplasmic reticulum membrane, nuclear outer membrane-endoplasmic reticulum membrane network.
