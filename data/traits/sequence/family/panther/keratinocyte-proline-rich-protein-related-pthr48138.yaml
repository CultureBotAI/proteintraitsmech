  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structural organization of keratinocytes, which are the predominant cell type in the epidermis, the outermost layer of the skin. They are characterized by a proline-rich region that suggests a role in protein-protein interactions. These interactions are crucial for the formation of the cytoskeleton and cell-cell adhesion structures, contributing to the integrity and barrier function of the skin. The proteins may also be involved in the regulation of keratinocyte proliferation and differentiation.
