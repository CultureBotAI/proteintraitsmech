identifier: PANTHER:PTHR18978
label: "GRIP-1 ASSOCIATED PROTEIN 1"
definition: >-
  GRIP1-associated protein 1 (GRIPAP1, also known as GRASP-1) is expressed in the CNS and interacts with GRIP1, GRIP2 and AMPA receptors. It may regulate neuronal ras signaling and contribute to the regulation of AMPA receptor distribution by NMDA receptor activity.
