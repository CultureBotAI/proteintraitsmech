identifier: PANTHER:PTHR36927
label: "BLR4337 PROTEIN"
definition: >-
  The OpgC protein family is involved in the biosynthesis of periplasmic glucans, specifically in the succinyl substitution process. Members of this family are believed to function as acyltransferases, catalyzing the transfer of succinyl residues from the cytoplasmic side of the bacterial inner membrane to the growing glucan chains located in the periplasm. This modification of glucans is crucial for the proper function and structural integrity of the bacterial cell envelope, potentially affecting cell shape, protection against environmental stresses, and interaction with host immune systems during pathogenesis.
