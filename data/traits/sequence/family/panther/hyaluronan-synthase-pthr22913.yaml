identifier: PANTHER:PTHR22913
label: "HYALURONAN SYNTHASE"
definition: >-
  HYALURONAN SYNTHASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22913. PANTHER protein class: glycosyltransferase. Members are annotated with the molecular function UDP-glycosyltransferase activity, hexosyltransferase activity. Members participate in glycosaminoglycan biosynthetic process, polysaccharide biosynthetic process, extracellular matrix organization. Members localise to plasma membrane, cell periphery.
