identifier: PANTHER:PTHR22913
label: "HYALURONAN SYNTHASE"
definition: >-
  HYALURONAN SYNTHASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR22913. PANTHER protein class: glycosyltransferase. Members are annotated with the molecular function UDP-glycosyltransferase activity, hexosyltransferase activity. Members participate in cellular component assembly, carbohydrate biosynthetic process, cellular component biogenesis. Members localise to cell periphery, membrane, plasma membrane.
