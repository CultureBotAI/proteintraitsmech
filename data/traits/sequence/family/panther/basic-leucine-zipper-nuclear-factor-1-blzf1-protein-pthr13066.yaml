identifier: PANTHER:PTHR13066
label: "BASIC LEUCINE ZIPPER NUCLEAR FACTOR 1 BLZF1  PROTEIN"
definition: >-
  Golgin-45 is required for normal Golgi structure and for protein transport from the endoplasmic reticulum (ER) through the Golgi apparatus to the cell surface. It interacts with GORASP2 and with the GTP-bound form of RAB2, but not with other Golgi Rab proteins.
