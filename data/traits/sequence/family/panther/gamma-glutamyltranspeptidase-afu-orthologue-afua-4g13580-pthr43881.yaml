  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are structurally related and share a common evolutionary origin, as suggested by their membership in the gamma-glutamyltransferase family. Members of this family are involved in various biochemical processes. One characterized member is implicated in the uric acid degradation pathway, where it facilitates the conversion of oxamate to oxalate, an important step in purine catabolism. Another member, although initially thought to be a glutathione hydrolase, has been reported not to hydrolyze glutathione when overexpressed with an N-terminal His tag. This raises questions about the enzyme's substrate specificity and the potential impact of protein tags on its activity. The exact functions of these enzymes may vary, and their activities could be influenced by post-translational modifications or the presence of protein tags in recombinant constructs.
    source: "InterPro:IPR052896 abstract (LLM-generated, not curator-reviewed)"
