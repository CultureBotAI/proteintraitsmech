identifier: PANTHER:PTHR43699
label: "3-DEHYDROQUINATE DEHYDRATASE"
definition: >-
  The type-I 3-dehydroquinase family is involved in the biosynthesis of aromatic amino acids through the chorismate pathway. Members of this family catalyze the cis-dehydration of 3-dehydroquinate (DHQ) to produce 3-dehydroshikimate, which introduces the first double bond of the aromatic ring. This reaction is the third step in the pathway and is crucial for the formation of aromatic compounds in various organisms. Some proteins within this family may also be inhibited by specific compounds and may have additional regulatory mechanisms affecting their activity.
