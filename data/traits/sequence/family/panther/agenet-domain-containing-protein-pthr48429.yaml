identifier: PANTHER:PTHR48429
label: "AGENET DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family represents a group of plant sequences, including SWOLLEN 1 (SWO1, UniProtKB:Q8LPI8 ) from Arabidopsis thaliana. SWO1 is an Agenet domain-containing protein, required for the maintenance of cell wall integrity under salt stress, through the interaction with importin alpha.
