      MULTIPLE PDZ DOMAIN PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR19964. PANTHER protein class: scaffold/adaptor protein.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
