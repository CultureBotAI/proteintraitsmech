identifier: PANTHER:PTHR43743
label: "POTASSIUM-TRANSPORTING ATPASE ATP-BINDING SUBUNIT"
definition: >-
  Transmembrane ATPases are membrane-bound enzyme complexes/ion transporters that use ATP hydrolysis to drive the transport of protons across a membrane. Some transmembrane ATPases also work in reverse, harnessing the energy from a proton gradient, using the flux of ions across the membrane via the ATPase proton channel to drive the synthesis of ATP. P-ATPases (also known as E1-E2 ATPases) (EC:7.2.2.6) are found in bacteria and in a number of eukaryotic plasma membranes and organelles. P-ATPases function to transport a variety of different compounds, including ions and phospholipids, across a membrane using ATP hydrolysis for energy. There are many different classes of P-ATPases, which transport specific types of ion: H +, Na +, K +, Mg 2+, Ca 2+, Ag + and Ag 2+, Zn 2+, Co 2+, Pb 2+, Ni 2+, Cd 2+, Cu + and Cu 2+. P-ATPases can be composed of one or two polypeptides, and can usually assume two main conformations called E1 and E2. These sequences describe the P-type ATPase subunit of the complex responsible for translocating potassium ions across biological membranes in microbes. In Escherichia coli and other species, this complex consists of the proteins KdpA, KdpB, KdpC and KdpF. KdpB is the ATPase subunit, while KdpA is the potassium-ion translocating subunit. The function of KdpC is unclear, although it has been suggested to couple the ATPase subunit to the ion-translocating subunit, while KdpF serves to stabilise the complex. The potassium P-type ATPases have been characterised as Type IA based on a phylogenetic analysis which places this clade closest to the heavy-metal translocating ATPases (Type IB). Others place this clade closer to the Na+/K+ antiporter type (Type IIC) based on physical characteristics.
definition_source: "InterPro:IPR006391 abstract (PANTHER PTHR43743 is a member signature)"
