identifier: PANTHER:PTHR36307
label: "FLAGELLA BASAL BODY P-RING FORMATION PROTEIN FLGA"
definition: >-
  FlgA is essential for flagellar biosynthesis and motility, and plays a significant role in biofilm formation in Campylobacter. It functions as a flagellar chaperone in P-ring assembly.
