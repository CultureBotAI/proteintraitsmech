  - kind: GENERAL
    text: >-
      The DRAM/TMEM150 family includes proteins that play diverse roles in cellular processes. Members of this family are involved in the modulation of macroautophagy, contributing to the accumulation of autophagosomes and enhancing autophagic flux, which can affect cell survival under stress conditions such as nutrient deprivation. Some proteins within the family act as lysosomal modulators of autophagy and are implicated in p53/TP53-mediated apoptosis. Others are components of mechanosensitive cation channels, potentially contributing to proprioception. Additionally, certain members regulate the localization of phosphatidylinositol 4-kinase to the plasma membrane, influencing phosphatidylinositol 4-phosphate synthesis. The family also includes proteins that may play roles in extracellular matrix engulfment, growth factor receptor recycling, and photoreceptor cell renewal in the retina.
    source: "InterPro:IPR050911 abstract (LLM-generated, not curator-reviewed)"
