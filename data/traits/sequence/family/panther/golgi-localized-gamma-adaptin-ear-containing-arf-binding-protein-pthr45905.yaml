identifier: PANTHER:PTHR45905
label: "GOLGI-LOCALIZED, GAMMA-ADAPTIN EAR CONTAINING, ARF BINDING PROTEIN"
definition: >-
  This family represents GGAs (Golgi-associated, gamma-adaptin homologous, ARF-interacting proteins) family which includes GGA1, GGA2 and GGA3. They are adaptor proteins that play a role in protein sorting and trafficking between the trans-Golgi network (TGN) and endosomes. They mediate the ARF-dependent recruitment of clathrin to the TGN and binds ubiquitinated proteins and membrane cargo molecules with a cytosolic acidic cluster-dileucine (DXXLL) motif and they also regulate retrograde transport of phosphorylated form of BACE1 from endosomes to the trans-Golgi network. These proteins have a multidomain structure consisting of an N-terminal VHS domain linked by a short proline-rich linker to a GAT (GGA and TOM) domain, which is followed by a long flexible linker to the C-terminal appendage, GAE (Gamma-Adaptin Ear) domain.
definition_source: "InterPro:IPR027422 abstract (PANTHER PTHR45905 is a member signature)"
