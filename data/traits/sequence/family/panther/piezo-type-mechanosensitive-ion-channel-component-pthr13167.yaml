identifier: PANTHER:PTHR13167
label: "PIEZO-TYPE MECHANOSENSITIVE ION CHANNEL COMPONENT"
definition: >-
  Piezo ('piesi' meaning pressure in Greek) proteins are pore-forming subunits of mechanically-activated channels. Expressing the proteins in mammalian cell lines has been shown to induce large mechanically-activated cationic currents. In Drosophila, they have been shown to be involved in sensing noxious mechanical stimuli, and plays a major role in nociception (response to strong or painful touch). It is required for maintaining the mechanosensitivity of tarsal bristle mechanosensors. Piezo has been linked to Alzheimer disease in humans.
