identifier: PANTHER:PTHR22605
label: "RZ-TYPE DOMAIN-CONTAINING PROTEIN"
definition: >-
  RNF213 functions as ubiquitin ligase and AAA+ ATPase, and plays a role in vascular development through mechanical processes in the cell. It contains a RING finger domain, which is a well-established ubiquitin ligase domain that covalently modifies substrate proteins with ubiquitin and stimulates the proteasomal protein degradation. It also functions as an ATPase through its AAA+ ATPase modules. The RNF213 gene is a susceptibility gene for moyamoya disease, an idiopathic vascular disorder of intracranial arteries.
