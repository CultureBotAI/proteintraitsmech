label: "2-5A-DEPENDENT RIBONUCLEASE"
definition: >-
  2-5A-DEPENDENT RIBONUCLEASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24141. PANTHER protein class: endoribonuclease, RNA metabolism protein. Members are annotated with the molecular function RNA nuclease activity, RNA binding, hydrolase activity. Members participate in macromolecule biosynthetic process, nucleobase-containing compound metabolic process, RNA processing.
