identifier: PANTHER:PTHR46048
label: "HYDROXYCARBOXYLIC ACID RECEPTOR 2"
definition: >-
  The Hydroxycarboxylic Acid Receptor family includes G-protein coupled receptors that mediate various physiological responses to hydroxycarboxylic acids, eicosanoids, and other ligands. Members of this family act as receptors for compounds such as L-lactate, nicotinic acid, (D)-beta-hydroxybutyrate, and 12-(S)-hydroxy-5,8,10,14-eicosatetraenoic acid (12-S-HETE). They are involved in processes such as anti-lipolysis, cell growth, inflammation, cancer promotion, and immune responses. Activation of these receptors can lead to signaling pathways involving inhibition of adenylyl cyclase, reduced cAMP levels, and activation of ERK1/2, MEK, and NF-kappa-B. Some receptors also play roles in apoptosis of mature neutrophils and in the regulation of adipocyte lipolysis. The family is characterized by its structural similarity to the G-protein coupled receptor 1 family and its ability to bind specific ligands with high affinity, mediating diverse biological effects.
