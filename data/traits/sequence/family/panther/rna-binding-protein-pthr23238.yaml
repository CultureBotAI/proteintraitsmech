identifier: PANTHER:PTHR23238
label: "RNA BINDING PROTEIN"
definition: >-
  This entry represents the multi-functional TET (TAF15/EWS/TLS) or FET (FUS/EWS/TLS) protein family. TAF15/EWS/TLS family members include human FUS (Fused in liposarcoma), EWS (Ewing Sarcoma) and TAF15 (TATA binding associated factor 15), and the Drosophila orthologue Cabeza. They are RNA binding proteins that contain a transcriptional-activation domain (EAD), 3 glycine-arginine (RGG) rich regions, an RNA-binding domain (RBD), and a zinc finger domain. They are involved in transcription and alternative splicing. They are subjected to different environmental signals that induce post-translational modifications in their RBD and in the RGG domains, thus modulating their activity. TAF15/EWS/TLS play important roles in oncogenesis and neuronal disease.
definition_source: "InterPro:IPR034870 abstract (PANTHER PTHR23238 is a member signature)"
