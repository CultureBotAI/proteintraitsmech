identifier: PANTHER:PTHR31645
label: "OLIGOPEPTIDE TRANSPORTER YGL114W-RELATED"
definition: >-
  This family represents a group of oligopeptide transporters, including YSL1-18 from plants and related proteins from fungi, bacteria and archaea. YSL1-18 may be involved in the lateral transport of nicotianamine-chelated metals in the vasculature. They are members of the OPT superfamily of small oligopeptides transporters.
