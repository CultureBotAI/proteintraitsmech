identifier: PANTHER:PTHR47578
label: "THIOREDOXIN-LIKE PROTEIN CDSP32, CHLOROPLASTIC"
definition: >-
  Thioredoxins (Trxs) are ubiquitous enzymes with a CXXC active site that catalyses the reduction of disulfide bonds. This entry represents a group of plant thioredoxin-like proteins, including AtCDSP32 from Arabidopsis and OsCDSP32 from rice. AtCDSP32 includes two Trx modules with one potential active site (219)CGPC(222) and three extra Cys, this region is responsible for the insulin reduction activity of the protein. It forms a heterodimeric complex with MSRB1 (methionine sulfoxide reductases B 1) via reduction of the sulfenic acid formed on MSRB1 catalytic Cys after methionine sulfoxide reduction. Thioredoxins are small disulphide-containing redox proteins that have been found in all the kingdoms of living organisms. Thioredoxin serves as a general protein disulphide oxidoreductase. It interacts with a broad range of proteins by a redox mechanism based on reversible oxidation of two cysteine thiol groups to a disulphide, accompanied by the transfer of two electrons and two protons. The net result is the covalent interconversion of a disulphide and a dithiol. In the NADPH-dependent protein disulphide reduction, thioredoxin reductase (TR) catalyses the reduction of oxidised thioredoxin (trx) by NADPH using FAD and its redox-active disulphide; reduced thioredoxin then directly reduces the disulphide in the substrate protein. Thioredoxin is present in prokaryotes and eukaryotes and the sequence around the redox-active disulphide bond is well conserved. All thioredoxins contain a cis-proline located in a loop preceding β-strand 4, which makes contact with the active site cysteines, and is important for stability and function. Thioredoxin belongs to a structural family that includes glutaredoxin, glutathione peroxidase, bacterial protein disulphide isomerase DsbA, and the N-
