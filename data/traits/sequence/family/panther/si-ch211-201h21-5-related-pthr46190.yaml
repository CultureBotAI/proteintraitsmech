identifier: PANTHER:PTHR46190
label: "SI:CH211-201H21.5-RELATED"
definition: >-
  This family of proteins is involved in the hydrolysis of the N-glycosidic bond of purine and pyrimidine nucleosides, resulting in the separation of ribose and the base. The enzymatic activity varies with different substrates, showing a preference for adenosine, followed by guanosine, inosine, xanthosine, cytidine, and uridine. The members of this family are characterized by their ability to act on commonly occurring nucleosides, playing a role in nucleotide metabolism.
