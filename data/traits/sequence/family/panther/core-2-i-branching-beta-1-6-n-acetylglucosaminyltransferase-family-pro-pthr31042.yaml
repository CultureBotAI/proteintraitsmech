identifier: PANTHER:PTHR31042
label: "CORE-2/I-BRANCHING BETA-1,6-N-ACETYLGLUCOSAMINYLTRANSFERASE FAMILY PROTEIN-RELATED"
definition: >-
  This entry represents a group of glycosyltransferases mostly from plants, including BC10 from rice. BC10 is a Golgi-located type II membrane protein required for the regulation of cellulose biosynthesis in the cell wall. It possesses low glycosyltransferase activity.
