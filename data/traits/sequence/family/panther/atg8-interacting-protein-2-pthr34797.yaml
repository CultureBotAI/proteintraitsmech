identifier: PANTHER:PTHR34797
label: "ATG8-INTERACTING PROTEIN 2"
definition: >-
  Atg8-interacting proteins (ATI1 and ATI2) are unique to plants. Under conditions of carbon starvation, ATI1 and ATI2 become associated with spherical compartments that dynamically move along the ER network. ATI1 is also located on bodies associating with plastids, and it seems to be involved in autophagic plastid-to-vacuole trafficking through its ability to interact with both plastid proteins and ATG8.
