  - kind: GENERAL
    text: >-
      This family of proteins includes components involved in electron transfer processes and redox reactions. Members are typically associated with the catalysis of reactions involving hydrogen or thiosulfate, often with a role in energy metabolism. Some proteins in this family function as b-type cytochromes, which are involved in the electron transfer from hydrogenase to oxygen or quinones, and are anchored to the membrane. Others may participate in systems that repair oxidized proteins or catalyze the reduction of thiosulfate to sulfite and hydrogen sulfide. The electron transfer is usually coupled to the generation of a proton motive force across the membrane.
    source: "InterPro:IPR051542 abstract (LLM-generated, not curator-reviewed)"
