      NI/FE-HYDROGENASE 1 B-TYPE CYTOCHROME SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30485. Members are annotated with the molecular function organic cyclic compound binding, heme binding. and localise to cell periphery, cellular anatomical entity, membrane.
