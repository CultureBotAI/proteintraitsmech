  - kind: GENERAL
    text: >-
      This family of proteins includes cell surface receptors that modulate innate and adaptive immune responses, with a general inhibitory function on immune cells. They are involved in regulating macrophage activation, promoting immunological tolerance, and attenuating T-cell receptor-induced signaling. These proteins serve as receptors for certain ligands, potentially influencing T-cell responses and phagocytosis of apoptotic cells. They also interact with components of the immune system to regulate cytokine production and innate immune responses. Additionally, they are implicated in the transcriptional regulation of RNA polymerase II-dependent genes, acting as coactivators that bridge gene-specific regulatory proteins with the basal transcription machinery.
    source: "InterPro:IPR051669 abstract (LLM-generated, not curator-reviewed)"
