identifier: PANTHER:PTHR14592
label: "UNCHARACTERIZED FAM3"
definition: >-
  Family with sequence similarity 3 (FAM3) members are designated as FAM3A, FAM3B, FAM3C and FAM3D. There is increasing evidence that FAM3A, FAM3B and FAM3C are important regulators of glucose and lipid metabolism, which makes this family a promising therapeutical target for non-alcoholic fatty liver disease (NAFLD) and type 2 diabetes.
