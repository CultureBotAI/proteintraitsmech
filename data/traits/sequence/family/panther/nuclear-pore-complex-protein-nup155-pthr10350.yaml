identifier: PANTHER:PTHR10350
label: "NUCLEAR PORE COMPLEX PROTEIN NUP155"
definition: >-
  This is a family of nucleoporin proteins (Nups). Nucleoporins are the main components of the nuclear pore complex in eukaryotic cells, and mediate bidirectional nucleocytoplasmic transport, especially of mRNA and proteins. Two subsets of nucleoporins that contain peptide repeats have been identified: one is characterised by the FG (Phe-Gly) repeat; the other, which is included in this family, contain WD (Trp-Asp) repeats. WD repeat Nups (Nup37, Nup43, Seh1, ALADIN, RAE, and Sec13) are thought to be involved in the assembly of structural domains of the nuclear pore complex.
