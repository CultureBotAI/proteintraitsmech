identifier: PANTHER:PTHR47447
label: "OS03G0856100 PROTEIN"
definition: >-
  OS03G0856100 PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47447. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 6 of its annotated subfamilies. Subfamilies are annotated with the molecular function mRNA binding, rRNA binding. Subfamilies participate in positive regulation of translation. Subfamilies localise to chloroplast, chloroplast stroma, intracellular anatomical structure.
