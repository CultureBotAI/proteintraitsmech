identifier: PANTHER:PTHR13464
label: "TRANSCRIPTIONAL REGULATOR PROTEIN HCNGP"
definition: >-
  This entry represents the SAP30-binding protein that may act as a transcriptional co-repressor of a gene related to cell survival and induce cell death. Proteins in this entry also include the meiotically up-regulated gene 151 protein from fission yeast.
