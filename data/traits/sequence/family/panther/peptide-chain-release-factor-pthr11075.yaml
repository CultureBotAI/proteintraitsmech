identifier: PANTHER:PTHR11075
label: "PEPTIDE CHAIN RELEASE FACTOR"
definition: >-
  The protein family is characterized by its role as peptidyl-tRNA hydrolases within the mitochondrial large ribosomal subunit. Members act as codon-independent translation release factors that have lost stop codon specificity, which may direct the termination of translation in the mitochondrion, particularly during abortive elongation. They are involved in the hydrolysis of prematurely terminated peptidyl-tRNAs, aiding in the recycling of stalled mitochondrial ribosomes. One member is noted to have a role in meiosis.
