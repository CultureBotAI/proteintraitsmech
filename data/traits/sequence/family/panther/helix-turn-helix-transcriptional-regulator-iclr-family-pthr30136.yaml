definitions:
  - kind: GENERAL
    text: >-
      HELIX-TURN-HELIX TRANSCRIPTIONAL REGULATOR, ICLR FAMILY — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30136. PANTHER protein class: DNA-binding transcription factor, helix-turn-helix transcription factor, winged helix/forkhead transcription factor. Members are annotated with the molecular function DNA-binding transcription factor activity, organic cyclic compound binding, DNA binding. and participate in negative regulation of cellular metabolic process, negative regulation of DNA-templated transcription, negative regulation of RNA metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is composed of HTH-type transcriptional regulators involved in various metabolic and regulatory pathways across different bacterial species. Members of the family function as either activators or repressors of gene expression, often in response to specific metabolic cues. They regulate operons related to the utilization of compounds such as allantoin, glyoxylate, p-hydroxybenzoate, glycerol, 3-hydroxyphenylpropionate, and aromatic compounds. Some members control the expression of genes involved in catabolic pathways, such as the degradation of pectin, xylonate, and 2-keto-3-deoxygluconate, or the glyoxylate bypass operon. They typically act by binding to promoter regions of target genes or operons, modulating the transcriptional response to adapt to environmental changes or internal metabolic states. The binding and regulatory activity of these proteins can be influenced by specific inducers or co-repressors, such as glyoxylate, xylonate, or 1-hexanol, reflecting the dynamic nature of their regulatory roles in bacterial metabolism.
    source: "InterPro:IPR050707 abstract (LLM-generated, not curator-reviewed)"
