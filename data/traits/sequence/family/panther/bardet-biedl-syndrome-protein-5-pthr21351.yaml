identifier: PANTHER:PTHR21351
label: "BARDET-BIEDL SYNDROME PROTEIN 5"
definition: >-
  BBSome complex member BBS5 is part of the BBSome complex that may function as a coat complex required for sorting of specific membrane proteins to the primary cilia. Mutations in the BBS5 gene cause Bardet-Biedl syndrome 5, which is a syndrome characterised by usually severe pigmentary retinopathy, early-onset obesity, polydactyly, hypogenitalism, renal malformation and mental retardation.
