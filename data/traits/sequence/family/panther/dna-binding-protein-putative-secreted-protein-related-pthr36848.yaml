  - kind: GENERAL
    text: >-
      This family of proteins includes glycoside hydrolases that are implicated in the degradation of ulvan, a major polysaccharide found in the cell walls of green seaweed from the Ulvales order. Members of this family are characterized by their ability to cleave the glycosidic linkages within ulvan, which is composed of disaccharide units that include 3-sulfated rhamnose linked to various sugars such as D-glucuronic acid, L-iduronic acid, or D-xylose. The enzymatic activity of these proteins facilitates the breakdown of this complex carbohydrate, suggesting a role in the utilization or recycling of ulvan in the environment.
    source: "InterPro:IPR053161 abstract (LLM-generated, not curator-reviewed)"
