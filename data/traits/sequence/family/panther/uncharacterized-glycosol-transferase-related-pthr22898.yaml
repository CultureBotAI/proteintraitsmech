  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that function as glycosyltransferases, specifically involved in the transfer of fucose to various acceptor substrates. Members of this family are characterized by their ability to catalyze the addition of fucose in alpha 1-2 linkage to different galactose-containing oligosaccharides. These enzymes play a role in the modification of cell surface glycoproteins and glycolipids, which is important for processes such as cell recognition and signaling. Some family members are implicated in physiological functions like axon regeneration after injury. The specificity of substrate recognition varies among family members, with some unable to fucosylate certain types of glycan acceptors, highlighting the diversity of enzyme activity within this family.
    source: "InterPro:IPR052501 abstract (LLM-generated, not curator-reviewed)"
