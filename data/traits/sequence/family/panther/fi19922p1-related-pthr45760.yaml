identifier: PANTHER:PTHR45760
label: FI19922P1-RELATED
definition: >-
  This entry represents a group of mitochondrial carrier proteins, including Mtm1 from budding yeasts and SLC25A39/40 from humans. Mtm1 is a pyridoxal 5'-phosphate (PLP) transporter and is involved in mitochondrial iron homeostasis. SLC25A39 and its paralogue SLC25A40 are mitochondrial transporters essential for glutathione import into mitochondria, which is required for the activity and stability of proteins containing iron-sulfur clusters, as well as erythropoiesis. Knockdown of SLC25A39 in a zebrafish model has been shown to disrupt heme biosynthesis and results in profound anemia.
definition_source: "InterPro:IPR045315 abstract (PANTHER PTHR45760 is a member signature)"
