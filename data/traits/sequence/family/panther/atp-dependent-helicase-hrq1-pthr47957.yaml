identifier: PANTHER:PTHR47957
label: "ATP-DEPENDENT HELICASE HRQ1"
definition: >-
  ATP-DEPENDENT HELICASE HRQ1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47957. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, 3'-5' DNA helicase activity, ATP-dependent activity. and participate in cellular aromatic compound metabolic process, nucleotide-excision repair, interstrand cross-link repair. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
