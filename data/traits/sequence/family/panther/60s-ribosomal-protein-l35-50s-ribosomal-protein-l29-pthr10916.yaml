  - kind: GENERAL
    text: >-
      The universal ribosomal protein uL29 family consists of proteins that are components of the large ribosomal subunit. Members of this family are involved in the stabilization of the tertiary rRNA structure and are located at the polypeptide exit tunnel on the outside of the subunit. They play a role in the proper assembly and function of the ribosome, which is essential for protein synthesis. Some members of this family have been noted to interact with the 23S rRNA and may have additional regulatory functions related to ribosomal activity and protein translation.
    source: "InterPro:IPR050063 abstract (LLM-generated, not curator-reviewed)"
