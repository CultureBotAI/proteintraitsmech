  - kind: GENERAL
    text: >-
      This family of proteins includes accessory components that are essential for modulating glutamate-gated ion currents. Members of this family are believed to influence the gating mechanisms of ionotropic glutamate receptors, specifically those that are not classified as NMDA receptors. These proteins may play a role in the regulation of synaptic transmission and neuronal communication by affecting the function of glutamate receptors, which are critical for excitatory signaling in the nervous system.
