identifier: PANTHER:PTHR47574
label: "CANCER-RELATED REGULATOR OF ACTIN DYNAMICS"
definition: >-
  This family of proteins is essential for maintaining epithelial cell integrity by modulating the actin cytoskeleton. Members of this family are known to enhance actin polymerization. They achieve this by preventing actin-capping proteins from binding to actin filaments, thereby promoting the growth of the actin network which is crucial for various cellular processes.
