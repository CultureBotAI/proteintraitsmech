identifier: PANTHER:PTHR33076
label: "NON-SPECIFIC LIPID-TRANSFER PROTEIN 2-RELATED"
definition: >-
  Plant cells contain proteins, called non-specific lipid-transfer proteins (nsLTPs), which transfer phospholipids, glycolipids, fatty acids and sterols from liposomes or microsomes to mitochondria and are thought to be involved in plant defense. These proteins, expressed throughout the plant tissues but predominantly found in edible parts, could play a major role in membrane biogenesis by conveying phospholipids such as waxes or cutin from their site of biosynthesis to membranes unable to form these lipids. LTPs exist in animal and plant tissues, including rat liver cytosol, potato tuber, castor bean, maize seedlings, spinach, barley and wheat. While there is no sequence similarity between animal and plant LTPs, similarity between the plant proteins is high. Plant LTPs are proteins of about 9 Kd (90 amino acids), containing eight conserved cysteine residues forming 4 disulphide bridges which allow to form a stable, compact barrel-like structure, which is essential for lipid binding. Plant TLPs are also similar to alpha-amylase inhibitor I2 from the seeds of Indian finger millet and amylase/protease inhibitors from rice and barley. Some of the proteins in this family are allergens. Allergies are hypersensitivity reactions of the immune system to specific substances called allergens (such as pollen, stings, drugs, or food) that, in most people, result in no symptoms. A nomenclature system has been established for antigens (allergens) that cause IgE-mediated atopic allergies in humans [WHO/IUIS Allergen Nomenclature Subcommittee King T.P., Hoffmann D., Loewenstein H., Marsh D.G., Platts-Mills T.A.E., Thomas W. Bull. World Health Organ. 72:797-806(1994)]. This nomenclature system is defined by a designation that is composed of the first three letters of the genus; a space; t
