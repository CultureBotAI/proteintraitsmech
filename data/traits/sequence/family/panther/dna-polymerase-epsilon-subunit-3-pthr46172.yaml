definitions:
  - kind: GENERAL
    text: >-
      DNA POLYMERASE EPSILON SUBUNIT 3 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46172. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function chromatin DNA binding, organic cyclic compound binding, DNA binding. and participate in DNA damage response, cellular response to stimulus, macromolecule metabolic process. and localise to nuclear lumen, intracellular protein-containing complex, SWI/SNF superfamily-type complex.
