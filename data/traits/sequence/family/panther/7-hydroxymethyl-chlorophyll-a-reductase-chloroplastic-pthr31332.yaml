identifier: PANTHER:PTHR31332
label: "7-HYDROXYMETHYL CHLOROPHYLL A REDUCTASE, CHLOROPLASTIC"
definition: >-
  This entry includes a group of oxidoreductases, including F420 hydrogenase and dehydrogenase beta subunits (FRHB), Methanobacterium formicicum formate dehydrogenase beta chain (FDHB) (EC:1.2.1.2, UniProtKB:P06130) and chloroplastic 7-hydroxymethyl chlorophyll a reductase (HCAR) (EC:1.17.7.2). Coenzyme F420 hydrogenase (EC:1.12.99.1) reduces the low-potential two-electron acceptor coenzyme. It also includes F(420)H(2) dehydrogenase subunit F (FpoF), which is part of the energy-conserving F(420)H2:heterodisulfide oxidoreductase system.
