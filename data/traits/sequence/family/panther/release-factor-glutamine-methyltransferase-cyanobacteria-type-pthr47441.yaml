identifier: PANTHER:PTHR47441
label: "Release factor glutamine methyltransferase, cyanobacteria-type"
definition: >-
  This family of proteins includes Release factor glutamine methyltransferases (PRMC) mainly from cyanobacteria and uncharacterised plant sequences. PRMC is involved in the post-translational modification of class 1 translation termination release factors. Specifically, these enzymes catalyse the methylation of the glutamine residue within the universally conserved GGQ motif found in release factors RF1/PrfA and RF2/PrfB. This modification is crucial for the proper functioning of the release factors, which play a key role in terminating protein synthesis by prompting the disassembly of the ribosome from the mRNA and the newly synthesised polypeptide chain.
definition_source: "InterPro:IPR052663 abstract (PANTHER PTHR47441 is a member signature)"
