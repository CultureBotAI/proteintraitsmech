identifier: PANTHER:PTHR47653
label: "PROTEIN BARK BEETLE"
definition: >-
  This family of proteins is essential for the development and maturation of septate junctions, which are key structures in the epithelial tissue that contribute to cell adhesion and barrier formation. Members of this family are involved in the localization of core components of septate junctions during late embryogenesis and are specifically required for the formation of tricellular junctions, where three epithelial cells meet. These proteins also play a role in the accumulation of certain proteins at tricellular junctions, indicating a specialized function in cellular contact and communication at these junction points.
