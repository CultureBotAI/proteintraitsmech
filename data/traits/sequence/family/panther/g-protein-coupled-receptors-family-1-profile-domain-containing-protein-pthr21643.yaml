identifier: PANTHER:PTHR21643
label: "G-PROTEIN COUPLED RECEPTORS FAMILY 1 PROFILE DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  Aex-2 is a G-protein-coupled receptor on the GABAergic neurons in nematodes and is the receptor for the Nlp-40 neuropeptide. In this way Nlp-40 delivers temporal information to downstream neurons to execute rhythmic behaviours.
