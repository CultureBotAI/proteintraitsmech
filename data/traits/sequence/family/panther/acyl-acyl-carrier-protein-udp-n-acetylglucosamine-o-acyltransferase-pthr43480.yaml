identifier: PANTHER:PTHR43480
label: "ACYL-[ACYL-CARRIER-PROTEIN]--UDP-N-ACETYLGLUCOSAMINE O-ACYLTRANSFERASE"
definition: >-
  This entry describes LpxA, an enzyme for the biosynthesis of lipid A, a component of lipopolysaccharide (LPS) in the outer membrane outer leaflet of most Gram-negative bacteria. Some differences are found between lipid A of different species, but this protein represents the first step (from UDP-N-acetyl-D-glucosamine) and appears to be conserved in function. Proteins from this family contain many copies of the bacterial transferase hexapeptide repeat.
definition_source: "InterPro:IPR010137 abstract (PANTHER PTHR43480 is a member signature)"
