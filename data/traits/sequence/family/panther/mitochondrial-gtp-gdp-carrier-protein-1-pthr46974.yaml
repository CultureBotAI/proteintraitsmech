  - kind: GENERAL
    text: >-
      This family of proteins includes mitochondrial carriers that facilitate the transport of nucleotides across the inner mitochondrial membrane. Specifically, they are involved in the exchange of GTP and GDP, which is crucial for various mitochondrial functions including iron transport and the maintenance of mitochondrial DNA. These carriers are integral to the mitochondrial membrane and play a key role in cellular energy metabolism by regulating the availability of GTP, an essential molecule for numerous cellular processes.
