identifier: PANTHER:PTHR42100
label: "OXIDOREDUCTASE 178 KDA SUBUNIT, PUTATIVE (AFU_ORTHOLOGUE AFUA_8G04320)-RELATED"
definition: >-
  NADH:ubiquinone oxidoreductase of the mitochondrial respiratory chain (complex I; EC:1.6.99.3 ) is a complicated assembly of at least 25 proteins. This family includes the 17.8kDa subunit from mitochondrial NADH-ubiquinone oxidoreductase from Neurospora crassa and yeast homologues.
