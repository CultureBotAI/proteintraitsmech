identifier: PANTHER:PTHR47731
label: "UBIQUITIN D"
definition: >-
  Ubiquitin D (also known as FAT10) contains two ubiquitin-like β-grasp folds at N and C termini. The C-terminal domain interacts with proteasome subunit RPN10 while the N-terminal domain is associated with the adaptor protein NUB1L, which accelerates FAT10 degradation. FAT10 is a TNF-alpha-inducible ubiquitin-like protein that mediates proteasomal degradation in a ubiquitin-independent manner. It has been implicated in multiple biological activities, including antigen processing, antimicrobial defense, apoptosis, and oncogenesis.
definition_source: "InterPro:IPR042969 abstract (PANTHER PTHR47731 is a member signature)"
