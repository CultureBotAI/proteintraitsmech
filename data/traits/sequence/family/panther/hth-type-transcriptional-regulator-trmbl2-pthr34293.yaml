identifier: PANTHER:PTHR34293
label: "HTH-TYPE TRANSCRIPTIONAL REGULATOR TRMBL2"
definition: >-
  This family of proteins includes prokaryotic transcriptional regulators that interact with DNA to modulate gene expression in response to sugar availability, such as HTH-type sugar sensing transcriptional regulator TrmB from the hyperthermophilic archaea Pyrococcus furiosus, which contains an N-terminal DNA-binding domain with a winged-helix-turn-helix (wHTH) ( ) and a C-terminal sugar-binding domain. Members of this entry bind to specific DNA sequences in gene promoters or operons, thus influencing the recruitment of RNA polymerase and the transcription of target genes. Regulatory activity is modulated by the binding of different sugars, which can induce or repress transcription of genes involved in carbohydrate transport and metabolism. Some family members form higher-order structures upon sugar binding that affect their DNA-binding affinity. This family also includes uncharacterised proteins like YrhO from Bacillus subtilis and MJ1082 from Methanocaldococcus jannaschii.
