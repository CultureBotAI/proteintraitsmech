identifier: PANTHER:PTHR31948
label: "ZINC-FINGER HOMEODOMAIN PROTEIN 2"
definition: >-
  ZINC-FINGER HOMEODOMAIN PROTEIN 2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR31948. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 53 of its annotated subfamilies. Subfamilies are annotated with the molecular function transcription cis-regulatory region binding, DNA-binding transcription factor activity. Subfamilies participate in regulation of DNA-templated transcription, regulation of developmental process. Subfamilies localise to nucleus, intracellular anatomical structure.
