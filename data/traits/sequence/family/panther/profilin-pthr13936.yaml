identifier: PANTHER:PTHR13936
label: PROFILIN
definition: >-
  PROFILIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13936. PANTHER protein class: cytoskeletal protein, non-motor actin binding protein. Members are annotated with the molecular function cytoskeletal protein binding, protein binding, actin binding. and participate in positive regulation of cellular component organization, positive regulation of actin filament bundle assembly, positive regulation of organelle organization. and localise to cytoplasm.
