identifier: PANTHER:PTHR13936
label: PROFILIN
definition: >-
  PROFILIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13936. PANTHER protein class: cytoskeletal protein, non-motor actin binding protein. Members are annotated with the molecular function actin binding. Members participate in regulation of actin filament polymerization, positive regulation of actin filament bundle assembly. Members localise to cytoplasm.
