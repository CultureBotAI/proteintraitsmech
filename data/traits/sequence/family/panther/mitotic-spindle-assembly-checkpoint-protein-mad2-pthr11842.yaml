identifier: PANTHER:PTHR11842
label: "MITOTIC SPINDLE ASSEMBLY CHECKPOINT PROTEIN MAD2"
definition: >-
  This entry includes Mad2 and Mad2-like proteins, including Mad2/Rev7 from yeasts and MAD2A/B from animals. Mad2 is a central component of the spindle assembly checkpoint, which is a feedback control that prevents cells with incompletely assembled spindles from leaving mitosis. Rev7 (also known as MAD2L2 or MAD2B) is an accessory subunit of DNA polymerase zeta. It also acts as an interaction module in a broad array of cellular pathways, including translesion DNA synthesis, cell cycle control, and non-homologous end joining.
