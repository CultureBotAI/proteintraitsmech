identifier: PANTHER:PTHR43135
label: "ALPHA-D-RIBOSE 1-METHYLPHOSPHONATE 5-TRIPHOSPHATE DIPHOSPHATASE"
definition: >-
  This family of proteins includes enzymes that are part of the metallo-dependent hydrolases superfamily. Members of this family exhibit a range of hydrolytic activities, often involving the cleavage of specific chemical bonds in substrates. Some proteins within this family function as carboxypeptidases, releasing C-terminal amino acids with a preference for aromatic residues, such as phenylalanine. These enzymes are capable of degrading ochratoxin A, a harmful mycotoxin found in various agricultural products. The structure of these proteins typically features a two-domain architecture with a TIM-barrel and a beta-sandwich domain. Activity of some family members is known to be inhibited by Zn(2+)-specific chelators. Other proteins in the family are involved in distinct hydrolytic reactions, such as the hydrolysis of alpha-D-ribose 1-methylphosphonate triphosphate.
