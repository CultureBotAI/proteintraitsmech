label: "SER/THR-PROTEIN KINASE RIO2"
definition: >-
  SER/THR-PROTEIN KINASE RIO2 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45852. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein kinase activity. Members participate in maturation of SSU-rRNA, ribosomal small subunit biogenesis, biosynthetic process. Members localise to preribosome, small subunit precursor, cytoplasm, cytosol.
