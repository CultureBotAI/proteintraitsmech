identifier: PANTHER:PTHR10556
label: "3-OXO-5-ALPHA-STEROID 4-DEHYDROGENASE"
definition: >-
  3-oxo-5-alpha-steroid 4-dehydrogenases (EC:1.3.99.5) catalyse the conversion of 3-oxo-5-alpha-steroid + acceptor to 3-oxo-delta(4)-steroid + reduced acceptor. The steroid 5-alpha-reductase enzyme is responsible for the formation of dihydrotestosterone, this hormone promotes the differentiation of male external genitalia and the prostate during foetal development. In humans mutations in this enzyme can cause a form of male pseudohermaphorditism in which the external genitalia and prostate fail to develop normally. A related steroid reductase enzyme, DET2, is found in plants such as Arabidopsis. Mutations in this enzyme cause defects in light-regulated development. Another enzyme in this entry is very-long-chain enoyl-CoA reductase (TECR; EC:1.3.1.93), which catalyzes the last of the four reactions of the long-chain fatty acids elongation cycle by reducing the trans-2,3-enoyl-CoA fatty acid intermediate to an acyl-CoA that can be further elongated by entering a new cycle of elongation.
definition_source: "InterPro:IPR039357 abstract (PANTHER PTHR10556 is a member signature)"
