identifier: PANTHER:PTHR12619
label: "RFX TRANSCRIPTION FACTOR FAMILY"
definition: >-
  This entry includes Rfx1 from budding yeasts, Sak1 from fission yeasts and RFX1-8 from humans. They are transcription factors that contain a RFX DNA binding domain and a conserved C-terminal region. Mutations in the RFX5 gene cause Bare lymphocyte syndrome 2 (BLS2), a severe combined immunodeficiency disease with early onset. Mutations in the RFX6 gene cause Mitchell-Riley syndrome (MTCHRS), a disorder characterised by neonatal diabetes, hypoplastic or annular pancreas, duodenal and jejunal atresia, and absent gallbladder.
