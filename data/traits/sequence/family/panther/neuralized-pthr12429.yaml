identifier: PANTHER:PTHR12429
label: NEURALIZED
definition: >-
  Neuralized (Neur) is a conserved membrane-associated E3 ubiquitin ligase. In Drosophila, Neur is required in a subset of Notch pathway-mediated cell fate decisions during development of the nervous system. Notch signaling, which is crucial to metazoan development, requires endocytosis of Notch ligands. Neur binds to the Notch receptor ligand Delta through its first NHR1 domain and mediates its ubiquitination for endocytosis. In mammals there are two homologues of Neur, Neur1 (NEURL1) and Neur2 (NEURL1B), that can interact with Notch ligands Delta-like1 and Jagged1. Neuralized homologues in flies and mammals have two NHR domains. Neuralized-like protein 2 (NEURL2), 3 (NEURL3) and 4 (NEURL4) are also included in this family. NEURL4 is a HERC2-interacting protein with six neuralized domains, whereas NEURL2 and NEURL3 have one neuralized domain only.
definition_source: "InterPro:IPR037962 abstract (PANTHER PTHR12429 is a member signature)"
