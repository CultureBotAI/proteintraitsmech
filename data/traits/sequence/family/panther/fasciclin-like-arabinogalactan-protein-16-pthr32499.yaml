identifier: PANTHER:PTHR32499
label: "FASCICLIN-LIKE ARABINOGALACTAN PROTEIN 16"
definition: >-
  This family includes group B of Fasciclin-like arabinogalactan proteins (FLAs) from Arabidopsis, which includes FLA 15, 16, 17, 18. They are expressed throughout plant development. FLAs are extracellular glycoproteins containing the Fascilin 1 (FAS1) domains and glycomotif regions, thought to play structural and signalling functions through a wide range of interactions in the plant extracellular matrix.
