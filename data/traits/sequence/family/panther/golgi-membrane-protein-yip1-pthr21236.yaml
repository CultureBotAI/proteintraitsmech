identifier: PANTHER:PTHR21236
label: "GOLGI MEMBRANE PROTEIN YIP1"
definition: >-
  This entry includes Yip1 from yeasts and YIPF4-7 from animals. They are multi-span, transmembrane proteins mainly localised in the Golgi apparatus Budding yeast Yip1 functions in ER to Golgi and intra-Golgi transport at the vesicle docking/fusion step. YIPF4-7 form complexes 1 (YIPF5/7), 2 (YIPF4), and 3 (YIPF6), and are mainly localised at the early, middle, and late compartments of the Golgi apparatus, respectively.
