identifier: PANTHER:PTHR46362
label: "GEM-ASSOCIATED PROTEIN 5"
definition: >-
  This entry represents Gemin-5, a protein involved in the assembly and function of small nuclear ribonucleoproteins (snRNPs), which are essential components of the spliceosome, the complex responsible for the splicing of pre-mRNA in eukaryotic cells. They recognise and bind to snRNAs and the 7-methylguanosine cap found on mRNA and snRNA molecules. They are part of the SMN complex, facilitating the formation of the core snRNP by delivering snRNAs to the complex. Additionally, they may interact with ribosomes and play a role in the regulation of protein synthesis. In Drosophila, is also described as a nuclear receptor cofactor in ecdysone-regulated gene expression during molting and puparium formation and it is essential in muscle and neuronal tissues for motor function, including climbing ability and flight.
definition_source: "InterPro:IPR052640 abstract (PANTHER PTHR46362 is a member signature)"
