identifier: PANTHER:PTHR11743
label: "VOLTAGE-DEPENDENT ANION-SELECTIVE CHANNEL"
definition: >-
  Eukaryotic mitochondrial porins are voltage-dependent anion-selective channels (VDAC) that behave as general diffusion pores for small hydrophilic molecules. The channel adopts an open conformation at low or zero membrane potential and a closed conformation at potentials above 30-40 mV. The proteins are composed of between 12 to 16 β-strands that span the mitochondrial outer membrane. Yeast contains two members of this family (genes POR1 and POR2); vertebrates have at least three members (genes VDAC1, VDAC2 and VDAC3). VDAC2 binds various lipids, including the sphingolipid ceramide, the phospholipid phosphatidylcholine, and the sterols cholesterol and oxysterol. Binding of ceramide promotes the mitochondrial outer membrane permeabilisation (MOMP) apoptotic pathway.
definition_source: "InterPro:IPR001925 abstract (PANTHER PTHR11743 is a member signature)"
