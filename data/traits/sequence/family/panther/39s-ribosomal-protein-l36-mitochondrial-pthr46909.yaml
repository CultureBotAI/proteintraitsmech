  - kind: GENERAL
    text: >-
      This family of proteins is involved in the structure and function of mitochondrial ribosomes, which are specialized for the synthesis of proteins encoded by the mitochondrial genome. These proteins are integral components of the large subunit of mitoribosomes and are thought to play a role in the cotranslational integration of newly synthesized proteins into the mitochondrial inner membrane. Additionally, there is evidence suggesting a potential involvement in telomere capping processes.
    source: "InterPro:IPR052143 abstract (LLM-generated, not curator-reviewed)"
