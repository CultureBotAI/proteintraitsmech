    text: >-
      39S RIBOSOMAL PROTEIN L36, MITOCHONDRIAL — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46909. PANTHER protein class: ribosomal protein, translational protein. Members localise to mitochondrial ribosome, mitochondrial large ribosomal subunit, mitochondrial matrix.
