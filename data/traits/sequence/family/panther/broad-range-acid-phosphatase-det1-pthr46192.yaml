  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are related to the phosphoglycerate mutase (PGM) family, which are traditionally known to be involved in glycolysis and gluconeogenesis by catalyzing the interconversion of 3-phosphoglycerate and 2-phosphoglycerate. Members of this family may not all exhibit PGM enzymatic activity but are suggested to play roles in carbohydrate metabolism. Additionally, some proteins in this family may have functions unrelated to PGM activity, such as involvement in the transport of sterols between cellular membranes.
