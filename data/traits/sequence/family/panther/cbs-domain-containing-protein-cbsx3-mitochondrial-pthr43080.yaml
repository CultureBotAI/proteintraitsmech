identifier: PANTHER:PTHR43080
label: "CBS DOMAIN-CONTAINING PROTEIN CBSX3, MITOCHONDRIAL"
definition: >-
  This family of proteins includes members with diverse functions, some of which are uncharacterized. A subset of proteins within this family are involved in the cellular response to hypoxia, but do not bind AMP, which is a common function of other CBS-domain containing proteins. Another subset is implicated in the metabolism of carbon sources such as acetoin or butanediol, playing a role in growth and sporulation. Additionally, one member is involved in homocysteine biosynthesis through the condensation of sulfide with aspartate semialdehyde, functioning independently of O-acetylhomoserine sulfhydrylase. The family also contains proteins that are currently uncharacterized, suggesting a potential for undiscovered functions or roles within the cell. An archaeal member, has been recently identified as ribosome hibernation factor Dri (Dri: dual ribosomal subunit inhibitor, UniProtKB:A3MX58).
