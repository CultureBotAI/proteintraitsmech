identifier: PANTHER:PTHR48425
label: "KERATIN-ASSOCIATED PROTEIN 2-1"
definition: >-
  Keratin-associated protein type 2 (KRTAP2) is involved in the structural integrity of hair. Members of this family are hair keratin-associated proteins (KRTAPs) that play a crucial role in the hair cortex. They are part of an interfilamentous matrix that embeds hair keratin intermediate filaments. These proteins are essential for creating a rigid and resistant hair shaft by forming extensive disulfide bond cross-linking with the cysteine residues of hair keratins. The matrix proteins are characterised by high-sulfur and high-glycine-tyrosine content, contributing to the durability and resilience of hair.
definition_source: "InterPro:IPR052154 abstract (PANTHER PTHR48425 is a member signature)"
