identifier: PANTHER:PTHR30522
label: "NUCLEOSIDE TRIPHOSPHATE PYROPHOSPHOHYDROLASE"
definition: >-
  MazG hydrolyses all canonical nucleoside and deoxyribonucleoside triphosphates as well as mutagenic dUTP and 8-oxo-dGTP, converting them to the corresponding nucleoside monophosphates and diphosphate. The enzyme is required to maintain mycobacterial capacity to respond to oxidative stress through degradation of oxidation-induced damaged nucleotides. MazG functions as a homotetramer and requires magnesium for activity. The protein is induced by oxidative stress and is involved in transcriptional activation of RelA. In Thermotoga maritima, it has both nucleoside triphosphate pyrophosphohydrolase and pyrophosphatase activities.
definition_source: "InterPro:IPR011551 abstract (PANTHER PTHR30522 is a member signature)"
