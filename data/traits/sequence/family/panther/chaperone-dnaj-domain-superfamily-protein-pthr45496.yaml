  - kind: GENERAL
    text: >-
      This family of proteins includes members involved in the regulation of gene expression through imprinting mechanisms. They play a crucial role in maintaining the balance of parental gene contributions, particularly in the endosperm, which is essential for proper seed development. These proteins are also implicated in postzygotic reproductive isolation by influencing triploid seed development, serving as a component of interploidy hybridization barriers. Their function is dosage-sensitive, indicating that the level of protein expression is key to their role in developmental processes.
