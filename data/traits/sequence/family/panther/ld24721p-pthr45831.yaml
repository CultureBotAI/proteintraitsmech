identifier: PANTHER:PTHR45831
label: LD24721P
definition: >-
  This entry represents the SGT family, which includes Small glutamine-rich tetratricopeptide repeat-containing protein alpha/beta (SGTA/B) from humans and similar sequences spread in eukaryotes and prokaryotes. SGT is a co-chaperone that binds misfolded and hydrophobic patches-containing client proteins in the cytosol. It mediates their targeting to the endoplasmic reticulum but also regulates their sorting to the proteasome when targeting fails. SGT binds directly to HSC70 and HSP70 and regulates their ATPase activity. Most members of this family contain tetratricopeptide repeats.
