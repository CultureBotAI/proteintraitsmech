identifier: PANTHER:PTHR33228
label: "PROTEIN GLUTAMINE DUMPER 4-RELATED"
definition: >-
  The Arabidopsis genome contains seven GLUTAMINE DUPMER (GDU)-encoding genes. GDUs stimulate amino acid export by activating nonselective amino acid facilitators. GDU1 has been shown to induce the secretion of glutamine from hydathodes and increased amino acid content in leaf apoplasm and xylem sap.
