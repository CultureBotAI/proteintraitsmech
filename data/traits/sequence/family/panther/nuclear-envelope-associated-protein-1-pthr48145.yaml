identifier: PANTHER:PTHR48145
label: "NUCLEAR ENVELOPE-ASSOCIATED PROTEIN 1"
definition: >-
  This family represents a group of plants proteins, including nuclear envelope-associated proteins (NEAP) that interact with other proteins of the nuclear envelope. In Arabidopsis thaliana, this family comprises three genes AtNEAP1-3 expressed ubiquitously and a pseudogene AtNEAP4. These proteins consist of coiled-coils and localise to the nuclear periphery where they form part of stable protein complexes. They are able to form homo- and heteromers, and interact with the SUN domain proteins AtSUN1 and AtSUN2, which are involved in the linker of nucleoskeleton and cytoskeleton (LINC) complex.
