identifier: PANTHER:PTHR35527
label: "CHOLOYLGLYCINE HYDROLASE"
definition: >-
  The peptidase C59 family includes enzymes with diverse functions such as bile salt hydrolases and penicillin acylases. Bile salt hydrolases deconjugate glycine- and taurine-linked bile salts in the intestines of humans and animals, releasing amino acid residues and bile acids. They can hydrolyze major human bile salts like GCA, TCA, and TDCA, with varying substrate preferences. Penicillin acylases convert penicillin to 6-aminopenicillanate and act as self-processing peptidases. The family's activity is regulated by products like cholate and deoxycholate, phenylacetate, and penicillin derivatives. Thiol enzyme inhibitors also inhibit these enzymes in vitro.
