identifier: PANTHER:PTHR46369
label: "PROTEIN CELLULOSE SYNTHASE INTERACTIVE 1"
definition: >-
  This entry represents a group of plant cellulose synthase interacting proteins, including CSI1/2/3 from Arabidopsis. They are non-cellulose synthase (CESA) proteins associated with cellulose synthase complexes and are required for cellulose biosynthesis. CSI1 is also a microtubule-associated protein that bridges CESA complexes and cortical microtubules. CSI3 has been shown to regulate plant cellulose biosynthesis and plant anisotropic cell growth that modulates the velocity of cellulose synthase complexes in both a microtubule-dependent and microtubule-independent manner.
definition_source: "InterPro:IPR044297 abstract (PANTHER PTHR46369 is a member signature)"
