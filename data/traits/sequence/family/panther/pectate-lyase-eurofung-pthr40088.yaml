  - kind: GENERAL
    text: >-
      The Polysaccharide Lyase 9 family includes enzymes with pectate lyase activity, which are involved in the degradation of pectin, a component of the plant cell wall. Members of this family exhibit endo-cleaving activity on homogalacturonan, a region in pectin, and can also act on partially methylated pectin. They release monogalacturonate or oligogalacturonates of various sizes as products. These enzymes play a role in plant tissue maceration and are implicated in soft-rot disease in plants. Their activity is regulated by various factors, including metal ions and surfactants, and can be inhibited by metal chelators like EDTA. The family's enzymes are important for the catabolism of pectate and have applications in the processing of plant-based materials.
    source: "InterPro:IPR052052 abstract (LLM-generated, not curator-reviewed)"
