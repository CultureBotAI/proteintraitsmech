identifier: PANTHER:PTHR46583
label: "REGULATOR OF G-PROTEIN SIGNALING 22"
definition: >-
  Rgs22 is a testis-specific regulator of G-protein signaling involved in human and mouse spermiogenesis. It interacts with guanine nucleotide binding protein GNA12/13. It has been shown to inhibit pancreatic adenocarcinoma cell migration through the G12/13 alpha subunit/F-actin pathway.
