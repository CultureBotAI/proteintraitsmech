identifier: PANTHER:PTHR46904
label: "CENTROMERE PROTEIN T"
definition: >-
  This entry represents the centromere protein T (CENP-T). CENP-T is a component of the CENPA-NAC (nucleosome-associated) complex, which plays a central role in assembly of kinetochore proteins, mitotic progression and chromosome segregation. CENP-T and CENP-W form a complex that is directly involved in establishment of centromere chromatin structure coordinately with CENP-A. Histone-fold-containing CENP-T-W and CENP-S-X complexes can form a stable CENP-T-W-S-X heterotetramer. Structural analysis of the CENP-T-W-S-X complex suggests that it can form a unique nucleosome-like structure to generate contacts with DNA.
definition_source: "InterPro:IPR028255 abstract (PANTHER PTHR46904 is a member signature)"
