identifier: PANTHER:PTHR10063
label: TUBERIN
definition: >-
  The activity of GTPases is regulated by the opposing effects of guanine nucleotide exchange factors (GEFs) and GTPase-activating proteins (GAPs). Tuberin (tuberous sclerosis 2 protein or Tsc2) is believed to be a tumor suppressor and is able to stimulate specific GTPases. It stimulates the intrinsic GTPase activity of the Ras-related protein Rap1A and Rab5. In complex with Tsc1, inhibits the nutrient-mediated or growth factor-stimulated phosphorylation of S6K1 and EIF4EBP1 by negatively regulating mTORC1 signaling. It acts as a GTPase-activating protein (GAP) for the small GTPase RheB, a direct activator of the protein kinase activity of mTORC1.
