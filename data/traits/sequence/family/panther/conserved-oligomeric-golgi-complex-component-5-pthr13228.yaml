identifier: PANTHER:PTHR13228
label: "CONSERVED OLIGOMERIC GOLGI COMPLEX COMPONENT 5"
definition: >-
  The COG complex, the peripheral membrane oligomeric protein complex involved in intra-Golgi protein trafficking, consists of eight subunits arranged in two lobes bridged by Cog1. Cog5 is in the smaller, B lobe, bound in with Cog6-8, and is itself bound to Cog1 as well as, strongly, to Cog7. Defects in COG5 are the cause of congenital disorder of glycosylation type 2I (CDG2I). A multisystem disorder caused by a defect in glycoprotein biosynthesis and characterised by under-glycosylated serum glycoproteins.
