identifier: PANTHER:PTHR13891
label: "CYTOCHROME C OXIDASE ASSEMBLY FACTOR 7"
definition: >-
  Proteins in this entry have Sel1-like repeats, a subgroup of tetratricopeptide repeats, and include the following: Beta-lactamase HcpB from Helicobacter pylori, which is a a cysteine-rich protein with a modular architecture consisting of four α/α-motifs that are cross-linked by disulfide bridges. HcpB is a penicillin-binding protein, binding and hydrolysing 6-amino penicillinic acid and 7-amino cephalosporanic acid derivatives. Cytochrome c oxidase assembly factor 7 (COA7), which is required for the assembly of mitochondrial respiratory chain complexes I and IV.
definition_source: "InterPro:IPR040239 abstract (PANTHER PTHR13891 is a member signature)"
