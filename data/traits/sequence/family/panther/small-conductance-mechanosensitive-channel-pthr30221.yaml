identifier: PANTHER:PTHR30221
label: "SMALL-CONDUCTANCE MECHANOSENSITIVE CHANNEL"
definition: >-
  This entry represent a group of mechanosensitive (MS) ion channel proteins mainly from archaea and bacteria. Mechanosensitive channels provide protection against hypo-osmotic shock, responding both to stretching of the cell membrane and to membrane depolarisation. They are present in the membranes of organisms from the three domains of life: bacteria, archaea, and eukarya. There are two families of MS channels: large-conductance MS channels (MscL) and small-conductance MS channels (MscS or YGGB). The pressure threshold for MscS opening is 50% that of MscL. The MscS family is much larger and more variable in size and sequence than the MscL family. Much of the diversity in MscS proteins occurs in the size of the transmembrane regions, which ranges from three to eleven transmembrane helices, although the three C-terminal helices are conserved.
definition_source: "InterPro:IPR045275 abstract (PANTHER PTHR30221 is a member signature)"
