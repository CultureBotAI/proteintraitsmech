identifier: PANTHER:PTHR47733
label: "ATAXIN-7 LIKE PROTEIN 3B, ATXN7L3B"
definition: >-
  Ataxin-7-like protein 3B (ATXN7L3B) interacts with ENY2, a SAGA component. It regulates histone H2Bub1 levels and SAGA deubiquitinase activity through competition for ENY2 binding. It has been linked to neurodegenerative disease.
