identifier: PANTHER:PTHR30033
label: "FLAGELLAR HOOK-ASSOCIATED PROTEIN 1"
definition: >-
  Within the bacterial flagellum, the basal-body rod, the hook, the hook- associated proteins (HAPs), and the helical filament together constitute an axial substructure whose elements share structural features and a common export pathway. This entry represents the hook-associated protein 1 (HAP1, also known as FlgK). The structure of FlgK from Burkholderia pseudomallei has been revealed.
