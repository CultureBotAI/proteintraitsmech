identifier: PANTHER:PTHR34215
label: "BLL0784 PROTEIN"
definition: >-
  This entry represents YlxR from Bacillus subtilis and its bacterial homologues. YlxR regulate metabolic gene expression. The structure of its homologue SP0554 from Streptococcus pneumoniae (UniProtKB:A0A0H2UNW2) revealed an α+β fold with a large positively charged patch on one side of the protein and a putative RNA binding cleft.
