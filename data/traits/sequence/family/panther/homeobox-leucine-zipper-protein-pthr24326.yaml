identifier: PANTHER:PTHR24326
label: "HOMEOBOX-LEUCINE ZIPPER PROTEIN"
definition: >-
  Four homeodomain leucine zipper (HD-Zip) families can be distinguished, termed class I, II, III and IV. This entry represents plant class I homeobox-leucine zipper proteins. They are transcription factors involved in developmental processes. AtHB13 conferred to Arabidopsis transgenic plants tolerance to freezing temperatures. AtHB7 and AtHB12 has been shown to regulate protein phosphatases type 2C (PP2C) and repress PYL5 and PYL8, two ABA receptors, in response to ABA stimulus. Moreover, AtHB5, AtHB6 and AtHB20 have been shown to function in ABA responses.
