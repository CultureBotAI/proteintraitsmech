identifier: PANTHER:PTHR15009
label: "MUELLERIAN-INHIBITING FACTOR"
definition: >-
  Muellerian-inhibiting factor, a member of the transforming growth factor beta family, is a glycoprotein hormone that is structurally related to inhibin and activin. It is expressed in male embryos, preventing formation of the Muellerian ducts. Expression levels in males remain high in early years, but decline around the time of puberty. In females the protein is not detectable until the onset of puberty, where it is expressed in the ovaries and is involved in folliculogenesis. It is also able to inhibit the growth of tumours derived from tissues of Muellerian duct origin.
