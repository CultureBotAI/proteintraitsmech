identifier: PANTHER:PTHR46701
label: "GLYCOSYLTRANSFERASE-LIKE KOBITO 1"
definition: >-
  This entry represents a group of glycosyltransferase-like proteins, including KOBITO1, At2g41451 and At3g57200 from Arabidopsis. KOBITO1 (also known as ELONGATION DEFECTIVE 1 or ABA INSENSITIVE 8) has been implicated in cellulose biosynthesis and hypocotyl elongation. It serves as a negative regulator of photomorphogenesis.
