identifier: PANTHER:PTHR43696
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 157"
definition: >-
  This entry includes coiled-coil domain-containing protein 157 (CCDC157) which contains extensive coiled-coil domains and disordered regions. These proteins show tissue-enhanced expression in testis and are found throughout various tissues. It is essential for sperm differentiation and has been associated with oligoasthenoteratozoospermia-related mutations. It is also an important factor for the fusion of transport carriers to Golgi membranes.
definition_source: "InterPro:IPR029681 abstract (PANTHER PTHR43696 is a member signature)"
