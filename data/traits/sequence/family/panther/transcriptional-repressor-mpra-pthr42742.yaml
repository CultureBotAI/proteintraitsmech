  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in carbohydrate metabolism. Members of this family are known to participate in the degradation of glucomannan, a polysaccharide composed of glucose and mannose. Some proteins in this family function as fructokinases, which are enzymes that phosphorylate fructose to fructose-6-phosphate, an important intermediate in the metabolism of sugars. Other members are mannose-6-phosphate isomerases, which catalyze the isomerization of mannose-6-phosphate to fructose-6-phosphate. The activity of these enzymes is regulated by metal ions, with zinc ions reported to inhibit several family members. Additionally, one protein is noted to be inactivated by EDTA, suggesting a requirement for divalent metal ions for its activity.
    source: "InterPro:IPR051804 abstract (LLM-generated, not curator-reviewed)"
