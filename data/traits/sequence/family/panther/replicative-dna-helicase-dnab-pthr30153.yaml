label: "REPLICATIVE DNA HELICASE DNAB"
definition: >-
  REPLICATIVE DNA HELICASE DNAB — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30153. PANTHER protein class: DNA helicase, DNA metabolism protein. Members are annotated with the molecular function catalytic activity, acting on a nucleic acid, ATP-dependent activity, acting on DNA, DNA helicase activity. and participate in cellular component organization, DNA replication, DNA unwinding involved in DNA replication. and localise to cytoplasm, cytosol.
