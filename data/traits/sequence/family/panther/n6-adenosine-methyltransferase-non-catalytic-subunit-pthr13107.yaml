identifier: PANTHER:PTHR13107
label: "N6-ADENOSINE-METHYLTRANSFERASE NON-CATALYTIC SUBUNIT"
definition: >-
  In humans, the METTL3-METTL14 heterodimer forms a N6-methyltransferase complex that methylates adenosine residues at the N6 position of some mRNAs and regulates the circadian clock, differentiation of embryonic stem cells and cortical neurogenesis. This entry also includes Kar4 from budding yeasts. Kar4 is a phosphoprotein required for expression of karyogamy-specific genes during mating and that it also acts during mitosis and meiosis. N6-adenosine-methyltransferase non-catalytic subunit MTB is another member of this family which associates with MTA, FIP37, VIR and HAKAI to form the so-called 'm6A writer complex' which is essential for adenosine methylation at specific mRNA sequences.
definition_source: "InterPro:IPR045123 abstract (PANTHER PTHR13107 is a member signature)"
