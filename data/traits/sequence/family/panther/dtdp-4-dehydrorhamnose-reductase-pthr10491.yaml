identifier: PANTHER:PTHR10491
label: "DTDP-4-DEHYDRORHAMNOSE REDUCTASE"
definition: >-
  dTDP-4-dehydrorhamnose reductase or RmlD (EC:1.1.1.133) catalyses the reduction of dTDP-6-deoxy-L-lyxo-4-hexulose to yield dTDP-L-rhamnose, which is the final step in the conversion of dTDP-D-glucose to dTDP-L-rhamnose. dTDP-rhamnose is essential for growth of mycobacteria. dTDP-L-rhamnose is the precursor of L-Rhamnose (L-Rha), a component of the lipopolysaccharide (LPS) core and several O antigen polysaccharides of Pseudomonas. Methionine adenosyltransferase 2 subunit beta (MAT2B) also belongs to this family. It is the regulatory subunit of MAT2A, an enzyme that catalyses the formation of S-adenosylmethionine (AdoMet) from methionine and ATP. Also in this family is the probable dTDP-4,6-dihydroxy-2-methyloxan-3-one 4-ketoreductase (oleU) from Streptomyces antibioticus, which is required for the biosynthesis of the aglycone antibiotic oleandomycin.
definition_source: "InterPro:IPR005913 abstract (PANTHER PTHR10491 is a member signature)"
