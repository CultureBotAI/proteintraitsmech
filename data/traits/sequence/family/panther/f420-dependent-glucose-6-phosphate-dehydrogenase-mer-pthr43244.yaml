identifier: PANTHER:PTHR43244
label: "F420-dependent glucose-6-phosphate dehydrogenase/mer"
definition: >-
  The F420-dependent glucose-6-phosphate dehydrogenase family encompasses enzymes that catalyze the oxidation of glucose 6-phosphate (G6P) to 6-phosphogluconolactone, utilizing the coenzyme F420. This reaction is a key step in the pentose phosphate pathway, which provides reducing power and precursors for nucleotide synthesis. Members of this family are also involved in the bioreductive activation of prodrugs, such as the anti-tuberculosis drug PA-824, by supplying reduced F420 to other enzymes. Additionally, these enzymes play a role in mycobacterial resistance to oxidative stress by consuming G6P. The family includes the mer subfamily, which comprises enzymes like phthiodiolone/phenolphthiodiolone dimycocerosates ketoreductase, involved in the biosynthesis of complex lipids in mycobacteria, contributing to their virulence and cell wall structure.
definition_source: "InterPro:IPR050564 abstract (PANTHER PTHR43244 is a member signature)"
