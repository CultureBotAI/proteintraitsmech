identifier: PANTHER:PTHR36174
label: "LIPID II:GLYCINE GLYCYLTRANSFERASE"
definition: >-
  This family of proteins is involved in the synthesis of bacterial cell wall peptidoglycan. Members of this family function as aminoacyltransferases that catalyze the addition of amino acids to the interpeptide bridge of peptidoglycan precursors. They utilize aminoacyl-tRNA as the amino acid donor in a ribosome-independent mechanism. Specifically, they are responsible for the formation of the pentaglycine bridge in Staphylococcus aureus, which is a key structural component of the cell wall. Different members add distinct glycine residues to the growing peptide chain, with some adding the first glycine to the lipid II intermediate, and others adding subsequent glycines. Their activity is crucial for cell wall integrity and is associated with resistance to antibiotics such as methicillin.
