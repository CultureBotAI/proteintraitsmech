identifier: PANTHER:PTHR23506
label: GH10249P
definition: >-
  The Major Facilitator Superfamily (MFS) Vesicular Transporter family is involved in the electrogenic antiport of various substrates across cellular membranes. Members of this family exchange cationic neurotransmitters or polyamines with protons, utilizing the electrochemical proton gradient generated by V-type proton-pump ATPases. This process is essential for the accumulation of neurotransmitters such as acetylcholine, dopamine, adrenaline, noradrenaline, histamine, serotonin, and polyamines like spermine and spermidine inside secretory vesicles. These vesicles release their contents via exocytosis, playing a critical role in neurotransmission, memory formation, and response to environmental stimuli. Some family members are also implicated in the transport of secondary metabolites with insecticidal activity and alpha-ketoglutarate permeation.
