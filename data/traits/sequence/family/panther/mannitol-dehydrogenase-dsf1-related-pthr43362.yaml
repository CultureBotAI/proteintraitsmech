    text: >-
      MANNITOL DEHYDROGENASE DSF1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43362. PANTHER protein class: metabolite interconversion enzyme, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on CH-OH group of donors, oxidoreductase activity, oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor.
