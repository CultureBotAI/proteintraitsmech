identifier: PANTHER:PTHR43362
label: "MANNITOL DEHYDROGENASE DSF1-RELATED"
definition: >-
  This family of proteins includes enzymes that catalyze the NAD(H)-dependent interconversion of D-fructose and D-mannitol, which is a key reaction in the mannitol metabolic pathway. Some members are also involved in the reduction of D-fructuronate to D-mannonate. These enzymes typically show a preference for NADH over NADPH as a cofactor. The family also encompasses uncharacterized oxidoreductases that are presumed to have similar activities based on their sequence similarity.
