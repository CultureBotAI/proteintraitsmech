identifier: PANTHER:PTHR31726
label: "PROTEIN ICE2"
definition: >-
  Ice2 is a fungal ER protein which has been shown to play an important role in forming/maintaining the cortical ER. It has also been identified as a protein which is necessary for nuclear inner membrane targeting.
