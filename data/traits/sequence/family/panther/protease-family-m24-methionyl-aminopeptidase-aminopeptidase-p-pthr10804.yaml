identifier: PANTHER:PTHR10804
label: "PROTEASE FAMILY M24  METHIONYL AMINOPEPTIDASE, AMINOPEPTIDASE P"
definition: >-
  This family includes proliferation-associated protein 2G4 (PA2G4, also known as ErbB3-binding protein 1) and its homologues such as ARX1 from yeast. PA2G4 is a RNA-binding protein involved in growth regulation. This protein is present in pre-ribosomal ribonucleoprotein complexes and may be involved in ribosome assembly and the regulation of intermediate and late steps of rRNA processing. This protein can interact with the cytoplasmic domain of the ErbB3 receptor and may contribute to transducing growth regulatory signals. This protein is also a transcriptional co-repressor of androgen receptor-regulated genes and other cell cycle regulatory genes through its interactions with histone deacetylases. ARX1 from yeast is involved in proper assembly of pre-ribosomal particles during the biogenesis of the 60S ribosomal subunit. Although these proteins belong to the peptidase M24 family, they do not contain metal cofactors and lack aminopeptidase activity.
