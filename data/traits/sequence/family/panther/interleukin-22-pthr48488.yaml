identifier: PANTHER:PTHR48488
label: INTERLEUKIN-22
definition: >-
  This entry represents interleukin-22. Interleukins (IL) are a group of cytokines that play an important role in the immune system. They modulate inflammation and immunity by regulating growth, mobility and differentiation of lymphoid and other cells.
