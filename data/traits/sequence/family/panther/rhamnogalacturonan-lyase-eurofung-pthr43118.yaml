identifier: PANTHER:PTHR43118
label: "RHAMNOGALACTURONAN LYASE (EUROFUNG)"
definition: >-
  The rhamnogalacturonan lyase of the polysaccharide lyase family 11 (RGL11) cleaves glycoside bonds in polygalacturonan as well as RG (rhamnogalacturonan) type-I through a beta-elimination reaction. Functionally characterised members of this family, YesW and YesX from Bacillus subtilis, cleave glycoside bonds between rhamnose and galacturonic acid residues in the RG-I region of plant cell wall pectin. YesW and YesX work synergistically, with YesW cleaving the glycoside bond of the RG chain endolytically, and YesX converting the resultant oligosaccharides through an exotype reaction. There are two types of RG lyases, which both cleave the alpha-1,4 bonds of the RG-I main chain through a beta-elimination reaction, but belong to two structurally unrelated polysaccharide lyase (PL) families, 4 and 11.
definition_source: "InterPro:IPR034641 abstract (PANTHER PTHR43118 is a member signature)"
