identifier: PANTHER:PTHR11680
label: "SERINE HYDROXYMETHYLTRANSFERASE"
definition: >-
  This entry includes serine hydroxymethyltransferases, transaldolases and other uncharacterised proteins. Serine hydroxymethyltransferase is a pyridoxal phosphate (PLP) requiring enzyme whose physiological role is to catalyse the formation of single carbon groups for a number of biosynthetic pathways. It catalyses the reversible interconversion of serine and glycine with tetrahydrofolate serving as the one-carbon carrier. This reaction serves as the major source of one-carbon groups required for the biosynthesis of purines, thymidylate, methionine, and other important biomolecules. Serine hydroxymethyltransferase adopts an α/β structure consisting of a mixed β-sheet and α-helices packed on both sides of it. This entry also includes L-threonine:uridine-5'-aldehyde transaldolase and fluorothreonine transaldolase. L-threonine:uridine-5'-aldehyde transaldolase is involved in the biosynthesis of the capuramycin-type nucleoside antibiotic A-102395. This enzyme catalyses the condensation of L-threonine and uridine-5'-aldehyde to form 5'-C-glycyluridine. Fluorothreonine transaldolase catalyses the final step in 4-fluorothreonine biosynthesis. Mediates a L-threonine/fluoroaceldehyde to 4-fluoro-L-threonine/acetaldehyde crossover reaction. It can also convert chloroacetaldehyde into 4-chloro-L-threonine.
definition_source: "InterPro:IPR049943 abstract (PANTHER PTHR11680 is a member signature)"
