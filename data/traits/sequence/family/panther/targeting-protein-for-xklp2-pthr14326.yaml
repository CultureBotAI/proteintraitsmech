identifier: PANTHER:PTHR14326
label: "TARGETING PROTEIN FOR XKLP2"
definition: >-
  This family represents the eukaryotic targeting protein for Xklp2 (TPX2). TPX2 is a microtubule-associated protein that targets a plus end-directed motor (Xklp2) to the minus ends of microtubules in the mitotic spindle. In Xenopus, it has been shown that Xklp2 protein is required for centrosome separation and maintenance of spindle bi-polarity. It is phosphorylated during mitosis in a microtubule-dependent way. TPX2 activates Aurora A kinase by promoting its autophosphorylation and protects the phosphorylated residue against dephosphorylation.
