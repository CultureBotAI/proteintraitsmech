identifier: PANTHER:PTHR46574
label: "43 KDA RECEPTOR-ASSOCIATED PROTEIN OF THE SYNAPSE"
definition: >-
  This family of proteins is involved in the postsynaptic clustering of nicotinic acetylcholine receptors at the neuromuscular junction. Members of this family may interact with the postsynaptic cytoskeleton, potentially through direct association with actin or spectrin. They contain a cysteine-rich region that is homologous to part of the regulatory domain of protein kinase C, which may play a role in lipid bilayer interactions.
