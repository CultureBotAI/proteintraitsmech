identifier: PANTHER:PTHR22937
label: "E3 UBIQUITIN-PROTEIN LIGASE RNF165"
definition: >-
  This entry represents a group of confirmed and predicted E3 ubiquitin-protein ligases, including RHG1A/MBR1-2 from Arabidopsis and ARK2C found in human and mouse. MBR1 and MBR2 are E3 ubiquitin-protein ligases that function as regulator of MED25 (a subunit of the Mediator complex) stability by targeting MED25 for degradation in a RING-H2-dependent way. The function of RHG1A is not known. In mouse, ARK2C acts as a regulator of motor axon elongation. It is required for efficient motor axon extension in the dorsal forelimb by enhancing the transcriptional responses of the SMAD1/SMAD5/SMAD8 effectors, which are activated downstream of BMP.
definition_source: "InterPro:IPR045191 abstract (PANTHER PTHR22937 is a member signature)"
