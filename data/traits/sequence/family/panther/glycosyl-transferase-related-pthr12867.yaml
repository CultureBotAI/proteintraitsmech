identifier: PANTHER:PTHR12867
label: "GLYCOSYL TRANSFERASE-RELATED"
definition: >-
  Alg13 is the catalytic component of UDP-GlcNAc transferase essential for the second step of the dolichol-linked oligosaccharide pathway. The UDP-GlcNAc transferase complex consists of Alg13 and Alg14, Alg14 being a membrane-spanning subunit required to recruit Alg13 to the cytosolic face of the ER. Alg13 has homology to the C-terminal domain of the bacterial glycosyltransferase Murg.
definition_source: "InterPro:IPR039042 abstract (PANTHER PTHR12867 is a member signature)"
