identifier: PANTHER:PTHR37981
label: "LIPASE 2"
definition: >-
  This entry represent a family of secreted SGNH-hydrolases similar to Streptomyces scabies esterase (SEST). The tertiary fold of this enzyme is substantially different from that of the alpha/beta hydrolase family and unique among all known hydrolases; its active site closely resembles two of the three components of typical Ser-His-Asp(Glu) triad from other serine hydrolases, but may lack the carboxylic acid.
