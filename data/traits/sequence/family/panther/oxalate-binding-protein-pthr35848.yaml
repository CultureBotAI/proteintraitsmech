  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the isomerization of glucose-6-phosphate and the decarboxylation of oxalate. Some members catalyze the conversion of glucose-6-phosphate into fructose-6-phosphate, a key step in glycolysis and gluconeogenesis. Other members convert oxalate into formate and carbon dioxide, which may occur in an oxygen-dependent manner. These enzymes can also catalyze side reactions such as oxalate oxidation and dye oxidations. The activity of some isomerases in this family is regulated by various metabolites and metal ions, indicating a role in metabolic regulation.
    source: "InterPro:IPR051610 abstract (LLM-generated, not curator-reviewed)"
