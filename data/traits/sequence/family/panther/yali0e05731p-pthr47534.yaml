  - kind: GENERAL
    text: >-
      This family of proteins includes oxidoreductases involved in the biosynthesis of various secondary metabolites, such as diterpenes, mycotoxins, indole alkaloids, and meroterpenoids. Members of this family participate in gene clusters that mediate complex biosynthetic pathways, often acting as 'decorative enzymes' that modify precursor molecules through oxidation-reduction reactions. These modifications can include hydroxylation, prenylation, ring expansion, and structural rearrangements, contributing to the diversity of natural products with potential bioactive properties. The specific roles of these enzymes within their respective pathways can vary, with some members' functions remaining to be fully elucidated.
