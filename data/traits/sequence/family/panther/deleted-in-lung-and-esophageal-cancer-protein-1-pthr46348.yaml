identifier: PANTHER:PTHR46348
label: "DELETED IN LUNG AND ESOPHAGEAL CANCER PROTEIN 1"
definition: >-
  Deleted in lung and esophageal cancer (DLEC1) is a tumour suppressor that is frequently silenced by promoter methylation in various kinds of cancer. However, in head and neck squamous cell carcinoma, DLEC1 is not silenced solely by promoter methylation. It has been shown to repress NF-kB signalling in prostate cancer. DLEC1 is essential for spermatogenesis and male fertility and plays an important role in sperm head and tail formation
