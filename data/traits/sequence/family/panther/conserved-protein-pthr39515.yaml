identifier: PANTHER:PTHR39515
label: "CONSERVED PROTEIN"
definition: >-
  This entry represents HTH-type transcriptional regulators (MT0903.1, ML2140, Mb0904, and Rv0880) from Mycobacteriales, a family of winged helix-turn-helix (HTH) domain-containing proteins from mycobacteria involved in coordinating bacterial tolerance to the antitubercular drug bedaquiline. These HTH-type transcriptional regulators function as part of a regulatory network that affects bedaquiline tolerance, potentially impacting drug effectiveness during tuberculosis treatment and contributing to drug resistance mechanisms.
