identifier: PANTHER:PTHR47147
label: SYNCOILIN
definition: >-
  Syncoilin belongs to the intermediate filament family and is highly expressed in skeletal and cardiac muscle. It co-localises with alpha-dystrobrevin (DTNA) and desmin (DES). The dysfunction or absence of syncoilin may result in the disruption of the intermediate filament network, leading to muscle necrosis.
