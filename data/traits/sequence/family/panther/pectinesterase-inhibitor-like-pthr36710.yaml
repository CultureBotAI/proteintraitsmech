  - kind: GENERAL
    text: >-
      This family of proteins includes inhibitors that target specific enzymes involved in the modification of cell wall components. Members of this family are known to inhibit fructosidases and pectin methylesterases, which are enzymes that play roles in plant development and metabolism. These inhibitors are involved in various physiological processes, such as the regulation of fruit ripening, seed germination, and the growth of pollen tubes. They function by modulating the activity of their target enzymes, thereby affecting the methylesterification of pectin, a key component of the plant cell wall. The presence of an N-terminal alpha-hairpin extension in some family members is critical for their inhibitory activity.
    source: "InterPro:IPR052421 abstract (LLM-generated, not curator-reviewed)"
