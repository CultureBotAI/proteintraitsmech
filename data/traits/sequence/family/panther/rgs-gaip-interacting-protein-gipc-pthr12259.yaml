identifier: PANTHER:PTHR12259
label: "RGS-GAIP INTERACTING PROTEIN GIPC"
definition: >-
  Gipc1/2/3 are a group of PDZ domain-containing proteins. They contain a central PDZ domain and GIPC homology (GH1 and GH2) domains. They are involved in trafficking, signaling and recycling of RTKs, GPCRs, integrins and other transmembrane proteins. Gipc1 and Gipc2 have been linked to cancer, while mutations in the Gipc3 gene cause nonsyndromic hearing loss.
