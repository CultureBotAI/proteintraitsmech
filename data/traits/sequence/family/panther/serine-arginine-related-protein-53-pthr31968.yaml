identifier: PANTHER:PTHR31968
label: "SERINE/ARGININE-RELATED PROTEIN 53"
definition: >-
  The SR (serine- and arginine-rich) family proteins and SR-related proteins are important regulators of pre-mRNA splicing. SRRP53 (for SR-related protein of 53kDa) is required in the second step of pre-mRNA splicing and also regulates alternative splicing in a concentration-dependent manner. SRRP53, also known as RSRC1, may also be required for regulation of PIAS1-mediated estrogen receptor beta SUMOylation.
