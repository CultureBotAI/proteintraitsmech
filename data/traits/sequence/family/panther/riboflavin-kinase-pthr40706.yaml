identifier: PANTHER:PTHR40706
label: "RIBOFLAVIN KINASE"
definition: >-
  This entry represents the CTP-dependent riboflavin kinase, found primarily in archaea, that catalyses the phosphorylation of riboflavin to form flavin mononucleotide in riboflavin biosynthesis. It uses CTP as the donor nucleotide. Its structure resembles a RIFT barrel, structurally similar to but topologically distinct from bacterial and eukaryotic examples. The N-terminal is a winged helix-turn-helix DNA-binding domain, and the C-terminal half is most similar in sequence to a group of cradle-loop barrels.
definition_source: "InterPro:IPR039063 abstract (PANTHER PTHR40706 is a member signature)"
