  - kind: GENERAL
    text: >-
      HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43340. PANTHER protein class: glycosyltransferase, transferase, metabolite interconversion enzyme. Members are annotated with the molecular function magnesium ion binding, glycosyltransferase activity, binding. and participate in purine ribonucleoside monophosphate metabolic process, IMP biosynthetic process, purine nucleobase metabolic process. and localise to cytoplasm, cytosol.
