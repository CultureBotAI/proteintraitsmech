  - kind: GENERAL
    text: >-
      This family of proteins includes components of the nexin-dynein regulatory complex (N-DRC), which is crucial for ciliary and flagellar motility. They play a role in maintaining the alignment and integrity of the distal axoneme and regulate microtubule sliding in motile axonemes. Members of this family are characterized by belonging to the AAA ATPase family, with a specific subset forming the DRC11 subfamily, indicating a specialized function within the broader AAA ATPase family.
