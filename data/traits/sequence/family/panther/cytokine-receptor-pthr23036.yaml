  - kind: GENERAL
    text: >-
      The Type I Cytokine Receptor family is characterized by its role in immune system regulation and hematopoiesis. Members of this family are involved in various signaling pathways, such as JAK/STAT, MAPK, and NOTCH, which lead to diverse biological effects including cell proliferation, differentiation, survival, and inflammation control. They are receptors for a range of cytokines, including interleukins, growth hormone, prolactin, and leptin, mediating responses like growth regulation, appetite control, and immune cell development. The receptors typically feature a WSXWS motif essential for proper folding and transport, and a box 1 motif necessary for interaction with JAK kinases. Some receptors also exist in soluble forms, acting as agonists or modulators of signaling. This family plays a critical role in both central and peripheral functions, affecting processes from bone metabolism to neural development and regeneration.
    source: "InterPro:IPR050379 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
