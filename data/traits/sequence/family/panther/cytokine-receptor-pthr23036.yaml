  - kind: GENERAL
    text: >-
      CYTOKINE RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23036. PANTHER protein class: transmembrane signal receptor. Members are annotated with the molecular function cytokine receptor activity, cytokine binding. Members participate in cytokine-mediated signaling pathway, cellular response to cytokine stimulus. Members localise to external side of plasma membrane, membrane, receptor complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
