identifier: PANTHER:PTHR35344
label: "GAS VESICLE STRUCTURAL PROTEIN 2-RELATED"
definition: >-
  The Gas Vesicle Protein A (GvpA) family comprises proteins that form hollow, gas-filled proteinaceous nanostructures known as gas vesicles. These structures enable buoyancy control in various microorganisms, allowing them to position themselves at optimal depths for light or nutrient acquisition during planktonic growth. Gas vesicles are highly permeable to gas and are composed primarily of GvpA, which forms the protein shell. The family also includes minor components like GvpJ and GvpM, which may play roles in nucleating gas vesicle formation. The GvpA family proteins are involved in the formation of gas vesicles that are critical for the survival and adaptability of microorganisms in their respective aquatic or soil habitats.
