identifier: PANTHER:PTHR10978
label: "SUCCINATE DEHYDROGENASE CYTOCHROME B560 SUBUNIT"
definition: >-
  In Escherichia coli and many other bacteria, two small, hydrophobic, mutually homologous subunits of succinate dehydrogenase (a TCA cycle enzyme) are SdhC and SdhD. This entry represents SdhC, the cytochrome b subunit, called b556 in bacteria and b560 in mitochondria. SdhD (see InterPro:IPR014312) is called the hydrophobic membrane anchor subunit, although both SdhC and SdhD participate in anchoring the complex. In some bacteria, this cytochrome b subunit is replaced my a member of the cytochrome b558 family (see InterPro:IPR011138).
