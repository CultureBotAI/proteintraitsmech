  - kind: GENERAL
    text: >-
      The DENND11/AVL9 family includes proteins that function as guanine nucleotide exchange factors (GEFs), which are likely involved in the activation of small GTPases by promoting the exchange of GDP for GTP. This activity is crucial for various cellular processes, including neuritogenesis and neuronal recovery after cerebral ischemia. Members of the DENND11 subfamily are implicated in these neuronal functions. The AVL9 subfamily members are involved in the late secretory pathway, playing roles in cell migration, the generation of secretory vesicles, actin polarization, and polarized growth.
    source: "InterPro:IPR051731 abstract (LLM-generated, not curator-reviewed)"
