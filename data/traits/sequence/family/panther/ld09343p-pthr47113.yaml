  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that modify tubulin by adding polyglutamate side chains, a process known as polyglutamylation. These modifications can regulate microtubule dynamics, which are crucial for various cellular processes including cell division and intracellular transport. Members of this family are thought to function in complexes with other proteins and may have roles in specific cellular contexts, such as in uterine muscle cells. While some members may not be essential for certain microtubule-related functions, they can influence the behavior of cells and organisms by affecting microtubule stability and interactions with microtubule-associated proteins.
    source: "InterPro:IPR053317 abstract (LLM-generated, not curator-reviewed)"
