identifier: PANTHER:PTHR13206
label: "UBIQUITIN LIGASE PROTEIN PHF9  FANCONI ANEMIA GROUP L PROTEIN"
definition: >-
  Fanconi anemia (FA) is a human disorder characterised by cancer susceptibility and cellular sensitivity to DNA crosslinks and other damages. The FA complex repairs the interstrand cross-linking (ICL) lesions and coordinates activities of the downstream DNA repair pathway including nucleotide excision repair, translesion synthesis, and homologous recombination. It is required for the monoubiquitylation of FANCD2 and FANCI heterodimer. The FA core complex consists of FANCA, FANCB, FANCC, FANCE, FANCF, FANCG, FANCL, FANCM, FANCT (UBET2), FAAP100 and FAAP24. FANCL is an ubiquitin ligase that mediates monoubiquitination of FANCD2, a key step in the repair of interstrand DNA crosslinks (ICLs) in the Fanconi anemia (FA) pathway. In humans, defects in FANCL are the cause of Fanconi anemia complementation group L (FANCL). FANCL is a disorder affecting all bone marrow elements and resulting in anemia, leukopenia and thrombopenia. At the cellular level it is associated with hypersensitivity to DNA-damaging agents, chromosomal instability (increased chromosome breakage) and defective DNA repair.
definition_source: "InterPro:IPR026848 abstract (PANTHER PTHR13206 is a member signature)"
