identifier: PANTHER:PTHR39757
label: "Lycopene cyclase, beta/epsilon"
definition: >-
  This family includes lycopene beta-and epsilon-cyclases, which are involved in the biosynthesis of carotenoids in bacteria and plants, and the related capsanthin capsorubin synthase (Ccs) from plants, which converts antheraxanthin or violaxanthin into capsanthin or capsorubin by a mechanism similar to lycopene cyclization. This family also includes neoxanthin synthase, which is involved in the synthesis of neoxanthin, the last product of carotenoid synthesis and a precursor of abscisic acid. Lycopene cyclases generate provitamin A carotenoids which are essential building blocks for cyclic xanthophylls involved in photosynthesis and regulatory networks. The cyclization of lycopene is the final step in carotenoid biosynthesis and may proceed via one of two pathways: the formation of a beta-ring by beta-cyclase, or an epsilon-ring by epsilon-cyclase. Epsilon-cyclase adds only one ring, forming the monocyclic beta-carotene, whereas beta-cyclase introduces a ring at both ends of lycopene to form the bicyclic beta-carotene. Lycopene cyclases are widely distributed across taxonomic groups and have structural diversity. Four partly related families of lycopene cyclases are known: CrtY, CrtL (beta-ionone end group producing), CrtL (eta-ionone end group producing) and CrtL (capsanthin/capsorubin synthase).
