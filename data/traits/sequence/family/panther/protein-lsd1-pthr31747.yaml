identifier: PANTHER:PTHR31747
label: "PROTEIN LSD1"
definition: >-
  This entry represents a group of zinc finger containing proteins from plants and green algae, including LSD and LOL proteins. LSD (LESION SIMULATING DISEASE1) functions as a negative programmed cell death regulator that integrates various signaling pathways in response to both biotic and abiotic stresses. It regulates crosstalk between light acclimation and immunity in Arabidopsis. LSD1 and LOL1 have antagonistic effects on CSD1 and CSD2 accumulation to regulate oxidative stress-induced cell death. The rice LOL2 is involved in rice growth and disease resistance.
definition_source: "InterPro:IPR040319 abstract (PANTHER PTHR31747 is a member signature)"
