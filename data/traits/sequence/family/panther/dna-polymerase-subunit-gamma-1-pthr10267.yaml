identifier: PANTHER:PTHR10267
label: "DNA POLYMERASE SUBUNIT GAMMA-1"
definition: >-
  DNA carries the biological information that instructs cells how to exist in an ordered fashion. Accurate replication is thus one of the most important events in the cell life cycle. This function is mediated by DNA-directed DNA-polymerases, which add nucleotide triphosphate (dNTP) residues to the 5'-end of the growing DNA chain, using a complementary DNA as template. Small RNA molecules are generally used as primers for chain elongation, although terminal proteins may also be used. DNA-dependent DNA-polymerases have been grouped into families, denoted A, B and X, on the basis of sequence similarities. Members of family A, which includes bacterial and bacteriophage polymerases, share significant similarity to Escherichia coli polymerase I; hence family A is also known as the pol I family. The bacterial polymerases also contain an exonuclease activity, which is coded for in the N-terminal portion. The yeast gamma polymerases show some similarity to the prokaryotic nuclear polymerases of family A, but their function is restricted to mitochondrial DNA replication and repair.
definition_source: "InterPro:IPR002297 abstract (PANTHER PTHR10267 is a member signature)"
