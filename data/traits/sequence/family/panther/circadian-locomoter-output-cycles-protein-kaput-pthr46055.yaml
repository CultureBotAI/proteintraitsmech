identifier: PANTHER:PTHR46055
label: "CIRCADIAN LOCOMOTER OUTPUT CYCLES PROTEIN KAPUT"
definition: >-
  This entry represents a group of animal proteins related to core components of the circadian clock, including the human proteins circadian locomoter output cycles protein kaput (CLOCK), neuronal PAS domain-containing protein 2 (NPAS2) and the circadian clock protein PASD1. CLOCK and NPAS2 are core clock components. CLOCK is a transcriptional activator that also has an intrinsic acetyltransferase activity, which enables circadian chromatin remodelling by acetylating histones and nonhistone proteins, including its own partner BMAL1. NPAS2 mediates the diurnal variation in the expression of GABARA1 receptor in the brain and contributes to the regulation of anxiety-like behaviors and GABAergic neurotransmission in the ventral striatum. PASD1 functions as a nuclear repressor of the CLOCK-BMAL1 heterodimer-mediated transcriptional activation of the core clock components, acting as a suppressor of the biological clock that drives the daily circadian rhythms of cells throughout the body.
definition_source: "InterPro:IPR047230 abstract (PANTHER PTHR46055 is a member signature)"
