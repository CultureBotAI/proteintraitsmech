identifier: PANTHER:PTHR45855
label: "TRANSCRIPTION FACTOR PIF1-RELATED"
definition: >-
  This entry represents a group of plant helix-loop-helix (bHLH) transcription factors, including ALC, UNE10, PIFs (phy-interacting factors) and SPATULA from Arabidopsis. ALC enables cell separation in fruit dehiscence, the processes in which the fruit opens and releases the seed. PIF1 regulates chlorophyll biosynthesis to optimise the greening process. SPATULA plays a role in floral organogenesis. UNE10 is required during the fertilisation of ovules by pollen.
