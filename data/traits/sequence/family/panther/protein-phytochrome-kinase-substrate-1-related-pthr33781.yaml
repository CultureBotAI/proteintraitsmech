identifier: PANTHER:PTHR33781
label: "PROTEIN PHYTOCHROME KINASE SUBSTRATE 1-RELATED"
definition: >-
  This entry represents a group of plant proteins, including protein PHYTOCHROME KINASE SUBSTRATES 1-4 (PKS1-4) from Arabidopsis. PKS1 is a novel phot1 signaling element during phototropism, while PKS2 is a phototropin signaling element that regulates leaf flattening and leaf positioning. PKS4 modulates phytochrome-mediated control of hypocotyl growth orientation.
