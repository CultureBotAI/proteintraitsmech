identifier: PANTHER:PTHR13136
label: "TESTIS DEVELOPMENT PROTEIN PRTD"
definition: >-
  This entry includes the animal KAT8 regulatory NSL complex subunit 3 (KANSL3 or NSL3, also known as testis development protein PRTD), the testis-expressed sequence 30 proteins and their homologues, such as C. elegans SUMV-2 protein. KAT8 regulatory NSL complex subunit 3 is part of the NSL complex that is involved in acetylation of nucleosomal histone H4 on several lysine residues and therefore may be involved in the regulation of transcription. The function of the testis-expressed sequence 30 protein is not known. SUMV-2 interacts with SUMV-1, and they may function together with MYS-2 in a nematode KAT8/MOF-like complex to antagonise the activity of the synMuv (synthetic multivulva) genes.
definition_source: "InterPro:IPR026555 abstract (PANTHER PTHR13136 is a member signature)"
