identifier: PANTHER:PTHR46106
label: "IA-2 PROTEIN TYROSINE PHOSPHATASE, ISOFORM C"
definition: >-
  This entry includes mammalian receptor-type tyrosine-protein phosphatase-like N and N2, also known as islet antigen 2/2 beta (IA-2 and IA-2 beta). They are dense core vesicle (DCV) transmembrane proteins that play a role in vesicle-mediated secretory processes. They are major autoantigens in type 1 diabetes and are required for the accumulation of normal levels of insulin-containing vesicles and preventing their degradation. This entry also includes Ida-1 from Caenorhabditis elegans.
