identifier: PANTHER:PTHR36106
label: "ANAEROBIC C4-DICARBOXYLATE TRANSPORTER DCUB"
definition: >-
  These proteins are members of the C4-Dicarboxylate Uptake (Dcu) family. Most proteins in this family are predicted to have 12 GES predicted transmembrane regions; however the one member whose membrane topology has been experimentally determined has 10 transmembrane regions, with both the N- and C-termini localized to the periplasm. The DcuA and DcuB proteins are involved in the transport of aspartate, malate, fumarate and succinate in many species, and are thought to function as antiporters with any two of these substrates. Since DcuA is encoded in an operon with the gene for aspartase, and DcuB is encoded in an operon with the gene for fumarase, their physiological functions may be to catalyze aspartate:fumarate and fumarate:malate exchange during the anaerobic utilization of aspartate and fumarate, respectively. The Escherichia coli DcuA and DcuB proteins have very different expression patterns. DcuA is constitutively expressed; DcuB is strongly induced anaerobically by FNR and C4-dicarboxylates, while it is repressed by nitrate and subject to CRP-mediated catabolite repression.
