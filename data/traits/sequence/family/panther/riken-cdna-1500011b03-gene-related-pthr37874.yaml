  - kind: GENERAL
    text: >-
      This family of proteins includes envelope glycoproteins that function in viral entry into host cells. They have a transmembrane domain that acts as a class I viral fusion protein, which undergoes conformational changes to facilitate membrane fusion. This process is critical for the delivery of the viral nucleocapsid into the host cytoplasm. Additionally, a surface domain of these proteins is responsible for binding to host cell receptors, triggering the fusion process by exposing the fusion peptide. The coordinated action of these domains enables the virus to attach to and fuse with the host cell membrane.
    source: "InterPro:IPR053368 abstract (LLM-generated, not curator-reviewed)"
