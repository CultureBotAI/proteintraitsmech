identifier: PANTHER:PTHR43411
label: "ADENYLOSUCCINATE LYASE"
definition: >-
  This family represents adenylosuccinate lyase (ASL) mainly from bacteria. ASL, PurB in Escherichia coli, catalyses the cleavage of succinylaminoimidazole carboxamide ribotide to aminoimidazole carboxamide ribotide and fumarate and the cleavage of adenylosuccinate to adenylate and fumarate. It also catalyses the conversion of 2-amino-2'-deoxyadenylo-succinate to dZMP and fumarate, when the bacterium is infected by a phage that produces the substrate of this reaction, a step in the synthesis of dZTP (2-amino-2'-deoxyadenosine 5'-triphosphate), which is a nucleotide then used by the phage as a DNA polymerase substrate.
