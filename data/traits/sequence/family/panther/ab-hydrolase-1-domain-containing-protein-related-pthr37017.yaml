identifier: PANTHER:PTHR37017
label: "AB HYDROLASE-1 DOMAIN-CONTAINING PROTEIN-RELATED"
definition: >-
  This family of proteins includes alpha/beta hydrolases from bacteria and fungi, involved in complex biosynthetic pathways for the production of secondary metabolites with diverse biological activities. Members of this family function as epimerases, esterases, and dehydrogenases, participating in the synthesis of compounds such as meroterpenoids and squalene-based molecules. Their activities include the modification of intermediate compounds through oxidation, reduction, methylation, and lactonization reactions, contributing to the structural diversity and bioactivity of the metabolites produced. Among its members is the probable hydrolase R7 catalyses key steps in the formation of structurally intricate products like novofumigatonin and squalestatin S1, which have potential pharmacological applications. Alpha/beta hydrolase nvfD mediates the biosynthesis of novofumigatonin, a heavily oxygenated meroterpenoid containing a unique orthoester moiety. Carbendazim hydrolyzing esterase, also included in this entry, catalyses the hydrolysis of the fungicide carbendazim (methyl-1H-benzimidazol-2-ylcarbamate or MBC) to 2-aminobenzimidazole (2-AB).
definition_source: "InterPro:IPR052897 abstract (PANTHER PTHR37017 is a member signature)"
