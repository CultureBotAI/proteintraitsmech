identifier: PANTHER:PTHR15690
label: "NUCLEAR RECEPTOR COACTIVATOR 6"
definition: >-
  Nuclear receptor coactivator 6 (NCOA6, also known as ASC-2, TRBP and RAP250) is a general coactivator. It is involved in the coactivation of different nuclear receptors, such as steroid receptors (GR and ERs), retinoid receptors (RARs and RXRs), thyroid hormone receptors (TRs), vitamin D3 receptor (VDR) and prostanoid receptors (PPARs). NCOA6 possesses an LXXLL sequence motif, which mediates its interaction with nuclear receptors. Altered expression of NCOA6 may contribute to the development of certain cancers.
