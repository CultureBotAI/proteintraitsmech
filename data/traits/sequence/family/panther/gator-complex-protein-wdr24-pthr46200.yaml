identifier: PANTHER:PTHR46200
label: "GATOR COMPLEX PROTEIN WDR24"
definition: >-
  This entry represents GATOR complex protein WDR24, a component of the GATOR subcomplex GATOR2. GATOR2 is part of the amino acid-sensing branch of the TORC1 signalling pathway, activating mTORC1 by inhibition of the GATOR1 subcomplex. The GATOR2 complex consists of MIOS, SEC13, SEH1L, WDR24 and WDR59. WDR24 has a secondary role in the GATOR-independent promotion of lysosome acidity and regulation of autophagic flux. This entry also includes the restriction of telomere capping protein 1 (Rtc1 or Sea2) from the budding yeast Saccharomyces cerevisiae. It is a component of the SEA complex, termed as GATOR in mammals, which coats the vacuolar membrane and is involved in intracellular trafficking, autophagy, response to nitrogen starvation, and amino acid biogenesis.
