identifier: PANTHER:PTHR48428
label: "PLANT-SPECIFIC TFIIB-RELATED PROTEIN PTF2"
definition: >-
  Plant-specific TFIIB-related protein PTF2 is characterised by its unique role in plant development, particularly in pollen germination and embryogenesis. Members of this family, such as PTF2 from Arabidopsis thaliana, are known to interact with TBP2 and RNA polymerase subunits, suggesting a regulatory function in gene expression. These proteins have the ability to bind double-stranded DNA in vitro, which further supports their involvement in transcriptional regulation.
definition_source: "InterPro:IPR053340 abstract (PANTHER PTHR48428 is a member signature)"
