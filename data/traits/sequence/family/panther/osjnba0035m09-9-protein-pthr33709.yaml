identifier: PANTHER:PTHR33709
label: "OSJNBA0035M09.9 PROTEIN"
definition: >-
  This entry represents Protein SHOU4 and Protein SHOU4-like from plants. These proteins regulate negatively the exocytosis of cellulose synthase complexes (CESAs) at the plasma membrane, thus preventing cellulose synthesis and modulating cell wall function.
