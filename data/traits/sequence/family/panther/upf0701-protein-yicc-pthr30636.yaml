identifier: PANTHER:PTHR30636
label: "UPF0701 PROTEIN YICC"
definition: >-
  This entry represents Endoribonucleases YicC from Escherichia coli and YloC from Bacillus subtilis, and similar bacterial sequences. YicC has been shown to be important for cells in the stationary phase, and essential for growth at high temperatures. This protein contributes to degradation of the iron-responsive small RNA (sRNA) RhyB via collaboration with the exoribonuclease PNPase. It seems to generate a 3'-OH and a 5'-phosphate group. It cleaves preferentially at U residues, but has no activity on dsRNA or dsDNA. Similarly, YloC was shown to be a metal-dependent enzyme that catalyses the cleavage of single-stranded RNA, preferentially at U residues, and exists in an oligomeric form, most likely a hexamer. As such, YloC shares some characteristics with the SARS-CoV Nsp15 endoribonuclease.
