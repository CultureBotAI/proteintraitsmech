identifier: PANTHER:PTHR36024
label: "ANKYRIN REPEAT PROTEIN SKIP35"
definition: >-
  This entry represents a group of plant ankyrin repeat proteins, including SKIP35 from Arabidopsis. The function of SKIP35 is not clear. SKIP35 is an ankyrin repeat protein that interacts with SKP1A/ASK1, a component of SCF ubiquitin E3 ligase complexes. The protein contains multiple ankyrin repeats.
