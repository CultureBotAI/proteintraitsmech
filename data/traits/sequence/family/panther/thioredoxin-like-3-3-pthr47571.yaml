identifier: PANTHER:PTHR47571
label: "THIOREDOXIN-LIKE 3-3"
definition: >-
  Thioredoxins (Trxs) are ubiquitous enzymes with a CXXC active site that catalyses the reduction of disulfide bonds. This entry represents a group of plant thioredoxin-like proteins, including At3g53220 from Arabidopsis. The active site of At3g53220 contains a CGVC motif which differs from the conserved CGPC motif.
