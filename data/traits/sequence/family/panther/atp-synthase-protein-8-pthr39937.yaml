identifier: PANTHER:PTHR39937
label: "ATP SYNTHASE PROTEIN 8"
definition: >-
  The ATPase protein 8 family is involved in the production of ATP from ADP within the mitochondrial membrane. This process is driven by a proton gradient created by the respiratory chain's electron transport complexes. The family is part of the F-type ATPases, which have two domains: F(1), the extramembraneous catalytic core, and F(0), the membrane proton channel. These domains are connected by a central and a peripheral stalk. ATP synthesis at the F(1) domain is mechanically linked to proton translocation through a rotary action of the central stalk subunits. Members of the ATPase protein 8 family are minor subunits located within the F(0) domain, associated with subunit a in the membrane.
