  - kind: GENERAL
    text: >-
      This family of proteins is characterized by the presence of HEAT repeats, which are tandemly repeated units of approximately 37 to 47 amino acids that are found in a number of cytoplasmic proteins. These repeats are thought to be involved in intracellular transport processes and are implicated in the regulation of a variety of cellular functions, including mRNA transport, protein trafficking, and signal transduction. Members of this family are likely to play a role in these processes through their ability to mediate protein-protein interactions. The exact function of the HEATR9 protein within this family is not well characterized, but it is presumed to participate in cellular mechanisms that are consistent with the general functions attributed to HEAT repeat-containing proteins.
