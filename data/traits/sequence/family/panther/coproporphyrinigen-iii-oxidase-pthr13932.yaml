identifier: PANTHER:PTHR13932
label: "COPROPORPHYRINIGEN III OXIDASE"
definition: >-
  Biosynthesis of heme and chlorophyll requires coproporphyrinogen III to be converted to protoporphyrinogen IX by oxidatively decarboxylating the propionate side chains of rings A and B to the corresponding vinyl group. This entry includes HemN, HemW, HemZ from bacteria, and Rsad1 from animals. HemN catalyzes the anaerobic oxidative decarboxylation of propionate groups of rings A and B of coproporphyrinogen III to yield the vinyl groups in protoporphyrinogen IX. HemW may act as a heme chaperone, transferring heme to an unknown acceptor. HemZ is involved in the biosynthesis of porphyrin-containing compound.
definition_source: "InterPro:IPR034505 abstract (PANTHER PTHR13932 is a member signature)"
