identifier: PANTHER:PTHR14402
label: "RECEPTOR TRANSPORTING PROTEIN"
definition: >-
  This family consists of receptor-transporting proteins (RTP1, 2, 3, 4, 5). RTP5 is also known as CXXC-type zinc finger protein 11 (CXXC11). Mammalian RTP1 and RTP2 are accessory proteins to mammalian odorant receptors (ORs) and play significant roles in the translocation of ORs to the plasma membrane. They are expressed in the olfactory sensory neurons and facilitate OR trafficking to the cell-surface membrane and ligand-induced responses in heterologous cells. The functions of RTP3, RTP4 and RTP5 are not clear.
