  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that are involved in the degradation of flavonoids, specifically catalyzing the dioxygenolytic cleavage of the O-heteroaromatic ring of flavonols. The enzymatic reaction results in the breakdown of compounds such as quercetin into smaller molecules, which is a key step in the catabolism of these plant-derived substances. The activity of these enzymes can be modulated by certain inhibitors, suggesting a level of regulatory control over their function.
