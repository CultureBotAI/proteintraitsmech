identifier: PANTHER:PTHR37319
label: TRANSPOSASE
definition: >-
  This entry represents transposase for transposon Tn5 from Escherichia coli (also known as TnpA) and similar bacterial proteins. TnpA mediates transposition of transposon Tn5 by a 'cut and paste' mechanism.
