identifier: PANTHER:PTHR23089
label: "HISTIDINE TRIAD  HIT  PROTEIN"
definition: >-
  The Histidine Triad (HIT) motif, His-x-His-x-His-x-x (x, a hydrophobic amino acid) was identified as being highly conserved in a variety of organisms. On the basis of sequence, substrate specificity, structure, evolution and mechanism, HIT proteins are classified into three branches: the Hint branch, which consists of adenosine 5' -monophosphoramide hydrolases, the FHIT branch, that consists of diadenosine polyphosphate hydrolases, and the GalT branch consisting of specific nucloside monophosphate transferases. In budding yeast Hnt1 has been shown to have adenosine monophosphoramidase activity and function as positive regulators of Cdk7/Kin28 in vivo. FHIT plays a very important role in the development of tumours. In fact, FHIT deletions are among the earliest and most frequent genetic alterations in the development of tumours. The third branch of the HIT superfamily, which includes GalT homologues, contains a related His-X-His-X-Gln motif and transfers nucleoside monophosphate moieties to phosphorylated second substrates rather than hydrolysing them.
definition_source: "InterPro:IPR001310 abstract (PANTHER PTHR23089 is a member signature)"
