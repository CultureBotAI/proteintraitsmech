identifier: PANTHER:PTHR16062
label: SWI/SNF-RELATED
definition: >-
  There are two forms of the RSC remodelling complex in yeast, differing only in whether they contain the Rsc1 or Rsc2 subunits. Rsc1 and Rsc2 have similar structures including two bromodomains and a BAH (Bromo-adjacent homology) domain. There is only a single orthologue of Rsc1/Rsc2 in human cells, a protein designated BAF180 (or Polybromo), which appears to be a fusion protein of Rsc1, Rsc2 and a third RSC protein, Rsc4. BAF180 contains six bromodomains, followed by two BAH domains and an HMG domain close to the C terminus. BAF180 is a subunit of the PBAF (or SWI/SNF-B) remodelling complex, which affects the transcription of many genes. Many human cancers have mutations in the gene encoding BAF180.
definition_source: "InterPro:IPR037382 abstract (PANTHER PTHR16062 is a member signature)"
