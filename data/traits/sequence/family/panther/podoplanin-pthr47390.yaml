definitions:
  - kind: GENERAL
    text: >-
      PODOPLANIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47390. Members participate in regulation of cell activation, signal transduction, cellular response to stimulus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins mediates various cellular processes including cell migration, adhesion, and morphological changes. They play a crucial role in the separation of blood and lymphatic vessels during development by interacting with CLEC1B, which leads to platelet activation. They also modulate platelet aggregation through interaction with CD9. These proteins are involved in epithelial-mesenchymal transition by interacting with cytoskeletal proteins such as MSN and EZR, which results in RHOA activation and increased cell invasiveness. They are responsible for fibroblastic reticular cells' adhesion and contraction within lymph nodes, as well as for the relaxation of these cells through engagement with CLEC1B. Additionally, they participate in the connection of lymphatic endothelium to the extracellular matrix and control the stability and maturation of invadopodia in tumor cells, affecting the degradation of the extracellular matrix. They are essential for normal lung cell proliferation and alveolus formation at birth. Notably, they do not function as water channels or affect the transport of folic acid or amino acids.
    source: "InterPro:IPR052684 abstract (LLM-generated, not curator-reviewed)"
