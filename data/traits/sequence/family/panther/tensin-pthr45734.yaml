  - kind: GENERAL
    text: >-
      The Tensin phosphatase family is involved in various cellular processes including cell migration, proliferation, and cytoskeletal organization. Members of the family promote cell migration by interacting with integrins and the cytoplasmic tail of ITGB1, leading to the disassembly of actin stress fibers. They regulate the stability and degradation of receptors like EGFR and MET, influencing cell survival and proliferation. The family includes protein and lipid phosphatases that are essential for myofibroblast differentiation, extracellular matrix deposition, and podocyte maintenance. They play roles in signal transduction, linking pathways to the cytoskeleton, and in the regulation of the PI3K-AKT pathway. Additionally, they are involved in the regulation of mTORC1 activity in response to glucose conditions and are essential for maintaining the integrity of the glomerular filtration barrier. The family also contributes to the remodeling of the extracellular matrix and is implicated in cartilage development.
    source: "InterPro:IPR051484 abstract (LLM-generated, not curator-reviewed)"
