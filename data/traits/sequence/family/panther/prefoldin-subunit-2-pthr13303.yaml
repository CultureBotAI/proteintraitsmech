identifier: PANTHER:PTHR13303
label: "PREFOLDIN SUBUNIT 2"
definition: >-
  This entry represents prefoldin subunit 2 (PFD2, also known as Gim4 in budding yeasts). PFD2 is part of the prefoldin heterohexamer complex (consists of two PFD-alpha type and four PFD-beta type subunits) that binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins to it. It binds to nascent polypeptide chain and promotes folding in an environment in which there are many competing pathways for non-native proteins.
