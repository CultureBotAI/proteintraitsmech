identifier: PANTHER:PTHR11929
label: "ALPHA- 1,3 -FUCOSYLTRANSFERASE"
definition: >-
  Glycosyltransferase family 10 (CAZy:GT10) comprises enzymes with two known activities; galactoside 3(4)-L-fucosyltransferase (EC:2.4.1.65) and galactoside 3-fucosyltransferase (EC:2.4.1.152). The galactoside 3-fucosyltransferases display similarities with the alpha-2 and alpha-6-fucosyltranferases. The biosynthesis of the carbohydrate antigen sialyl Lewis X (sLe(x)) is dependent on the activity of an galactoside 3-fucosyltransferase. This enzyme catalyses the transfer of fucose from GDP-beta-fucose to the 3-OH of N-acetylglucosamine present in lactosamine acceptors. The biosynthesis of disaccharides, oligosaccharides and polysaccharides involves the action of hundreds of different glycosyltransferases. These enzymes catalyse the transfer of sugar moieties from activated donor molecules to specific acceptor molecules, forming glycosidic bonds. A classification of glycosyltransferases using nucleotide diphospho-sugar, nucleotide monophospho-sugar and sugar phosphates ([ec:2.4.1.-]) and related proteins into distinct sequence-based families has been described. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. The same three-dimensional fold is expected to occur within each of the families. Because 3-D structures are better conserved than sequences, several of the families defined on the basis of sequence similarities may have similar 3-D structures and therefore form 'clans'.
