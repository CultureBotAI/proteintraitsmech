identifier: PANTHER:PTHR46684
label: "TRANSCRIPTION FACTOR FAMA"
definition: >-
  This entry represents a group of plant bHLH transcription factors, including FAMA, SPEECHLESS and MUTE from Arabidopsis. These proteins have been shown to play important parts in stomatal lineage development. SPEECHLESS (SPCH) generates stem cells and promotes their asymmetric division while MUTE regulates the meristemoid to Guard Mother Cell (GMC) transition. FAMA confers guard cell (GC) fate and is expressed at the equal division producing the two young GCs, but not in mature stomata. SPCH can be regulated through phosphorylation by MAPK-mediated and BIN2 (BR INSENSITIVE2). It has been suggested that SPCH integrates brassinosteroid and stomata signalling pathways.
definition_source: "InterPro:IPR044283 abstract (PANTHER PTHR46684 is a member signature)"
