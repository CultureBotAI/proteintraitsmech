identifier: PANTHER:PTHR45096
label: "PROTEIN NEDD1"
definition: >-
  This entry includes NEDD1 and related proteins from plants. Arabidopsis thaliana NEDD1 is a WD40 repeat protein that interacts with the gamma-tubulin complex. It plays a role in microtubule (MT) organization during mitosis and controls gamma-TuRC positioning and function in the interphase MT arrays.
