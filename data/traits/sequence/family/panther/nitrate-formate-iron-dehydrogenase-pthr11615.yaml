  - kind: GENERAL
    text: >-
      The NARF family proteins are essential components of the cytosolic iron-sulfur (Fe/S) protein assembly machinery. They are involved in the maturation of extramitochondrial Fe/S proteins, which are crucial for various cellular processes. Members of this family may also play a role in the transfer of pre-assembled Fe/S clusters to target apoproteins. Some proteins within this family appear to negatively regulate the level of HIF1A expression, although this effect could be indirect. The family is characterized by its involvement in the incorporation of iron-sulfur clusters into Fe/S proteins, which is a fundamental process for cell metabolism and regulation.
    source: "InterPro:IPR050340 abstract (LLM-generated, not curator-reviewed)"
