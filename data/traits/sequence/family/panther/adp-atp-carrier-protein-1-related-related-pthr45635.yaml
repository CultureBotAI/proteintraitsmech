identifier: PANTHER:PTHR45635
label: "ADP,ATP CARRIER PROTEIN 1-RELATED-RELATED"
definition: >-
  This family contains proteins found in eukaryotes. A variety of substrate carrier proteins that are involved in energy transfer are found in the inner mitochondrial membrane. Such proteins include: ADP,ATP carrier protein (ADP/ATP translocase); 2-oxoglutarate/malate carrier protein; phosphate carrier protein; tricarboxylate transport protein (or citrate transport protein); Graves disease carrier protein; yeast mitochondrial proteins MRS3 and MRS4; yeast mitochondrial FAD carrier protein; and many others. Sequence analysis of selected members of the carrier protein family has suggested the presence of six transmembrane (TM) domains, with varying degrees of sequence conservation and hydrophilicity. The TM regions, and adjacent hydrophilic loops, are more highly conserved than other regions of the proteins. All members of the family appear to consist of a tripartite structure, each of the repeated segments being ~100 residues in length. Each repeat contains two TM domains, the first being more hydrophobic, with conserved glycyl and prolyl residues. Five of the six TM domains are followed by the conserved sequence (D/E)-Hy(K/R), where -denotes any residue and Hy is a hydrophobic position. Mitochondrial ADP/ATP translocase, an abundant component of the inner membrane, carries ATP from the matrix into the inter-membrane space and transports ADP back. The protein is an integral membrane protein that functions as a homodimer. Mutations of the human ADP/ATP translocase 1 (also known as SLC25A4) gene cause mitochondrial diseases, such as PEOA2 and MTDPS12B.
