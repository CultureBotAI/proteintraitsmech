identifier: PANTHER:PTHR31047
label: "MEIOTICALLY UP-REGULATED GENE 157 PROTEIN"
definition: >-
  This family includes proteins from bacteria and fungi. It was originally identified as a protein of unknown function from Schizosaccharomyces pombe, which was isolated from a screen to identify novel genes required for meiosis. Members of this family have since been characterised from Streptococcus pneumoniae (UniProtKB:A0A0H2URZ6) and Clostridium perfringens (UniProtKB:Q8XNB2), and represent a new glycoside hydrolase family, also known as GH125. This family is the first characterised metal-independent alpha-mannosidase family. Proteins in this family have been reported to be strict exo-alpha-1,6-mannosidases that operate via a metal-independent inverting catalytic mechanism.
definition_source: "InterPro:IPR008313 abstract (PANTHER PTHR31047 is a member signature)"
