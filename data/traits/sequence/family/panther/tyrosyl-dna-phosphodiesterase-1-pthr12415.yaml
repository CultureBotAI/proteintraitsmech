identifier: PANTHER:PTHR12415
label: "TYROSYL-DNA PHOSPHODIESTERASE 1"
definition: >-
  Tyrosyl-DNA phosphodiesterase 1 (Tdp1) is a DNA repair enzyme that can remove a variety of covalent adducts from DNA through hydrolysis of a 3'-phosphodiester bond, giving rise to DNA with a free 3' phosphate.
