identifier: PANTHER:PTHR22926
label: PHOSPHO-N-ACETYLMURAMOYL-PENTAPEPTIDE-TRANSFERASE
definition: >-
  This entry represents a family of UDP-GlcNAc/MurNAc: polyisoprenol-P GlcNAc/MurNAc-1-P transferases. Members of the family include eukaryotic N-acetylglucosamine-1-phosphate transferases, which catalyse the conversion of UDP-N-acteyl-D-glucosamine and dolichyl phosphate to UMP and N-acetyl-D-glucosaminyl-diphosphodolichol in the glycosylation pathway; and bacterial phospho-N-acetylmuramoyl-pentapeptide-transferases, which catalyse the first step of the lipid cycle reactions in the biosynthesis of cell wall peptidoglycan.
