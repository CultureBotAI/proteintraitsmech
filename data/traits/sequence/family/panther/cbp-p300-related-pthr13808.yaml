identifier: PANTHER:PTHR13808
label: CBP/P300-RELATED
definition: >-
  Histone acetylation is required in many cellular processes including transcription, DNA repair, and chromatin assembly. This family contains human Histone acetyltransferase p300 (EP300), mouse Histone lysine acetyltransferase CREBBP (CPB) and similar plant and animal proteins. EP300 functions as a histone acetyltransferase and regulates transcription via chromatin remodelling. CPB is a transcriptional co-activator that acetylates both histones and non-histone proteins. CBP binds specifically to phosphorylated CREB and enhances its transcriptional activity toward cAMP-responsive genes.I t gives histones a specific tag for transcriptional activation. It mediates acetylation of histone H3 at 'Lys-18' and 'Lys-27' (H3K18ac and H3K27ac, respectively). This protein also acetylates non-histone proteins, like DDX21, FBL, IRF2, MAFG, NCOA3, POLR1E/PAF53 and FOXO1.
