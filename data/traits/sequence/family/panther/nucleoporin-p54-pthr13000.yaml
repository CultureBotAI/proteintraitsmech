identifier: PANTHER:PTHR13000
label: "NUCLEOPORIN P54"
definition: >-
  Nucleoporins are components of the nuclear pore complex, which is required for trafficking across the nuclear membrane. Nucleoporins are named for their molecular weight. This entry represents Nup54 from metazoa, and related nucleoporins from yeast and plants.
