identifier: PANTHER:PTHR47685
label: "MAGNESIUM TRANSPORT PROTEIN CORA"
definition: >-
  The CorA metal ion transporter family is responsible for the regulation of magnesium ion concentrations within the cell. Members of this family mediate the influx of magnesium ions through a central ion permeation pathway formed by the first transmembrane domain of each of the five subunits. The binding of Mg(2+) ions leads to the formation of a symmetrical homopentamer, which surrounds a closed ion permeation pathway. When intracellular Mg(2+) levels are low, the CorA transporters are activated, triggering a conformational change within each subunit and loosening the interactions between subunits, resulting in an open ion conduction pathway. Conversely, high cytoplasmic Mg(2+) levels render the transporters inactive. Some members can also mediate the uptake of cobalt and nickel ions, and are inhibited by cation hexaammines.
