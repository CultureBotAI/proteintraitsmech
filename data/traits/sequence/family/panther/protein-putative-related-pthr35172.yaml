    text: >-
      This family of proteins is involved in the formation of the cornified cell envelope (CE) found in stratified squamous epithelia. Members of this family contribute to the structure of the CE, which is a specialized component of the epidermis that provides a barrier against environmental stresses. The CE is composed of insoluble protein complexes that are cross-linked to form a resilient and protective layer.
