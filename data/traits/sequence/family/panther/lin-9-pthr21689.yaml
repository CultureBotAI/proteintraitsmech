identifier: PANTHER:PTHR21689
label: LIN-9
definition: >-
  This entry represents protein LIN-9/ALWAYS EARLY (LIN-9/ALY). LIN-9 from Caenorhabditis elegans is a homologue of the Drosophila always early (ALY) protein, which functions as a repressor of cell cycle regulated genes. LIN-9 is a component of the evolutionary conserved DREAM (MuvB/DRM) complex, which represses transcription. DREAM complex undergoes a cell cycle dependent switch of subunits. DREAM core binds to the E2F4 transcription factor and to the RBL2 (p130) in quiescent cells, while associates with the transcription factor B-MYB in the S-phase. In humans, LIN-9 acts as a tumor suppressor and plays a role in the expression of genes required for the G1/S transition. In pluripotent embryonic stem cells (ESC), LIN-9 plays an important role for proliferation and genome stability by activating genes with important functions in mitosis and cytokinesis. In Arabidopsis thaliana, ALY is expressed ubiquitously in vegetative and reproductive tissues.
