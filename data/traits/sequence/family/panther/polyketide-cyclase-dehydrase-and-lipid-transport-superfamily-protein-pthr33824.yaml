identifier: PANTHER:PTHR33824
label: "POLYKETIDE CYCLASE/DEHYDRASE AND LIPID TRANSPORT SUPERFAMILY PROTEIN"
definition: >-
  This family includes a group poorly characterised sequences predominantly found in bacteria, such as ORF3 protein (also known as Uncharacterized 17.2 kDa protein in melC2-rnhH intergenic region) from Streptomyces lincolnensis. They contain a START domain found in polyketide cylcases/dehydrases.
