identifier: PANTHER:PTHR35311
label: "KINETOCHORE-ASSOCIATED PROTEIN KNL-2 HOMOLOG"
definition: >-
  This family of proteins is essential for various stages of cell division and development. Members are involved in the recognition and localization of centromeres during mitosis and meiosis, which is crucial for accurate chromosome segregation. They also contribute to the establishment of the epigenetic status of centromeres and are capable of binding to DNA and RNA. Additionally, these proteins are necessary for normal embryo development, indicating a role in early developmental processes.
