identifier: PANTHER:PTHR46834
label: "TRANSCRIPTION FACTOR BHLH91"
definition: >-
  This entry represents a group of plant transcription factors containing a Myc-type, basic helix-loop-helix (bHLH) domain, including the transcription factors bHLH010, bHLH089, bHLH91 and bHLH138 from Arabidopsis thaliana and the transcription factors TIP2 and EAT1 from Oryza sativa. bHLH010, bHLH089 and bHLH91 are involved in pollen development. They are important for the development of the Arabidopsis anther, possibly by forming a feed-forward loop with DYT1. TDR INTERACTING PROTEIN2 (TIP2) is necessary in the meristemoid transition and differentiation during early anther development. TDR and EAT1 are paralogs of TIP2. TIP2 acts upstream of TDR and EAT1 and regulates their expression. EAT1 participates in the regulation of tapetum programmed cell death (PCD) and degradation during male reproductive development in rice.
