identifier: PANTHER:PTHR47755
label: "CELL DIVISION PROTEIN FTSX"
definition: >-
  FtsX is an integral membrane protein encoded in the same operon as signal recognition particle docking protein FtsY and FtsE. FtsE is a hydrophilic nucleotide-binding protein that associates with the inner membrane by means of association with FtsX; FtsE mutants are viable only in high salt, supporting possible roles in cell division or in transport. FtsX belongs to a family of predicted permeases and may play a role in the insertion of proteins required for potassium transport, cell division, and other activities. FtsX is involved in sporulation in the Gram-positive bacterium Bacillus subtilis.
definition_source: "InterPro:IPR004513 abstract (PANTHER PTHR47755 is a member signature)"
