identifier: PANTHER:PTHR21206
label: "SLD5 PROTEIN"
definition: >-
  GINS is a key component of eukaryotic replicative forks. It is part of the CMG (Cdc45-MCM-GINS) complex, the eukaryotic replicative helicase that unwinds double-stranded DNA at replication forks. Beside its role as a key component of the CMG complex, GINS mediates a interactions with many replication factors. GINS is composed of four subunits: Sld5, Psf1, Psf2, and Psf3. The four subunits are structurally related and are likely to derive from a single protein. They share a common fold made up of an α-helical A domain and a β-rich B domain. Sld5 and Psf1 possess the A domain at the N terminus and the B domain at the C terminus, whereas these two domains are swapped in Psf2 and Psf3. All subunits are essential for DNA replication. This family of proteins represents the Sld5 subunit.
definition_source: "InterPro:IPR008591 abstract (PANTHER PTHR21206 is a member signature)"
