identifier: PANTHER:PTHR48061
label: "LEUCINE-RICH REPEAT RECEPTOR PROTEIN KINASE EMS1-LIKE-RELATED"
definition: >-
  This family represents a group of Leucine rich-repeat (LRR) receptor-like proteins (RLP) from plants, including RLP23 from Arabidopsis, which is a component of the RLP23-SOBIR1-BAK1 complex that mediates NLP-triggered immunity. Many members confer resistance to fungal pathogens. In Arabidopsis, at least 57 members have been described, some of them are known to be involved in basal developmental processes, whereas others are involved in defence responses. RLP42 recognises fungal endopolygalacturonases (PGs) and acts as a novel microbe-associated molecular pattern receptor. Receptor-like protein 9DC3/9DC2 and Cf-9 homologue from Solanum pimpinellifolium are also included in this family. 9DC3 is involved in plant defence; it confers resistance to the fungal pathogen C.fulvum through recognition of the AVR9 elicitor protein. Receptor-like protein EIX1 from Solanum lycopersicum confers resistance to the fungal pathogen T.viride through recognition of the EIX elicitor protein.
