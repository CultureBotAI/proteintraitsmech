definitions:
  - kind: GENERAL
    text: >-
      SOLUTE CARRIER FAMILY 39 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12191. PANTHER protein class: secondary carrier transporter, transporter. Members are annotated with the molecular function inorganic molecular entity transmembrane transporter activity, organic anion transmembrane transporter activity, metal ion transmembrane transporter activity. and participate in import across plasma membrane, metal ion transport, intracellular monoatomic cation homeostasis. and localise to cell periphery, membrane, plasma membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The ZIP transporter family mediates the cellular uptake of divalent metal cations such as zinc, manganese, and iron, which are crucial for tissue homeostasis, metabolism, development, and immunity. These transporters function as energy-dependent symporters, often transporting a divalent metal cation alongside bicarbonate anions. Some family members also transport non-essential metals like cadmium, which is cytotoxic and carcinogenic. The ZIP transporters play roles in processes such as epithelial-to-mesenchymal transition, T-cell receptor signaling, meiotic progression, and the adaptation of cells to endoplasmic reticulum stress. They are also involved in dietary zinc uptake, insulin receptor signaling, gluconeogenesis, and innate immunity. The transport activity of these proteins is regulated by metal availability and can be temperature dependent.
    source: "InterPro:IPR050799 abstract (LLM-generated, not curator-reviewed)"
