  - kind: GENERAL
    text: >-
      This family of proteins is involved in the transport of ions across cellular membranes, functioning primarily as antiporters. They play a crucial role in maintaining pH homeostasis by exchanging sodium ions (Na+) for protons (H+). Some members are also capable of exchanging other ions such as arginine and ornithine, or coupling proton uptake with sodium efflux to facilitate the antiport of substrates like malate and lactate. These proteins are essential for various physiological processes, including growth in specific conditions and regulation of intracellular sodium levels. Their activity can be influenced by environmental factors and may be regulated by certain inhibitors.
