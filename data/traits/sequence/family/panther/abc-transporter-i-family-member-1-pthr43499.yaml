identifier: PANTHER:PTHR43499
label: "ABC TRANSPORTER I FAMILY MEMBER 1"
definition: >-
  This family contains the cytochrome c biogenesis protein encoded by ccmA, part Ccm-System I found in bacteria, archaea and plant mitochondria. Bacterial c-type cytochromes are located on the periplasmic side of the cytoplasmic membrane. Several gene products encoded in a locus designated as Cytochrome c maturation (Ccm)-System I are implicated in the transport and assembly of the functional cytochrome c. In some organisms this process involves up to nine (CcmABCDEFGHI) membrane proteins working together to achieve heme ligation. The post-translational pathway includes the transport of a heme b moiety, the translocation of the apocytochrome c and the covalent attachment of the heme with the apocytochrome c. CcmABCD are homologous to the ABC (ATP-binding cassette) transporters and are responsible for conveying heme b to the periplasm and loading it to the heme-chaperone CcmE.
