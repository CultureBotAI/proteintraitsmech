identifier: PANTHER:PTHR12183
label: "MITOCHONDRIAL UBIQUITIN LIGASE ACTIVATOR OF NFKB 1"
definition: >-
  The MDM2/MDM4 and MUL1 family includes proteins that regulate cell cycle arrest and apoptosis, as well as mitochondrial morphology and localization. Members of the family, such as MDM4, inhibit TP53 and TP73, preventing cell cycle arrest and apoptosis by binding their transcriptional activation domains. They also inhibit the degradation of MDM2 and can reverse MDM2-targeted degradation of TP53, while suppressing TP53 transactivation and apoptotic functions. MUL1 proteins, on the other hand, exhibit E3 ubiquitin-protein ligase activity, accepting ubiquitin from E2 enzymes and transferring it to substrates. They play roles in mitochondrial dynamics, promoting fragmentation and influencing localization. MUL1 proteins also ubiquitinate and regulate proteins like AKT1 and TP53, and are involved in immune defense by modulating antiviral responses. The family is characterized by the presence of zinc finger domains and, in some members, RING finger domains that mediate specific protein interactions.
