  - kind: GENERAL
    text: >-
      G-PROTEIN COUPLED RECEPTOR MTH-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47154. PANTHER protein class: G-protein coupled receptor. Members are annotated with the molecular function signaling receptor activity, peptide receptor activity, G protein-coupled peptide receptor activity. Members participate in G protein-coupled receptor signaling pathway, cellular response to stimulus, signaling. Members localise to cell periphery, membrane, plasma membrane.
