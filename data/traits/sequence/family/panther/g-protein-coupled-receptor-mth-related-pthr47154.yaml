  - kind: GENERAL
    text: >-
      The Mth G-protein coupled receptor family is involved in key physiological processes such as biological aging and stress response. These receptors are essential for adult survival across various species. In Drosophila, the Mth receptors play a critical role in the nervous system by up-regulating neurotransmitter exocytosis at larval glutamatergic neuromuscular junctions, which is crucial for proper synaptic function and muscle control. They are implicated in vesicle docking and clustering at release sites, indicating a significant role in synaptic transmission. Agonists like SP/Acp70A and sun can activate Mth receptors in vitro, suggesting a ligand-specific response mechanism.
    source: "InterPro:IPR051384 abstract (LLM-generated, not curator-reviewed)"
