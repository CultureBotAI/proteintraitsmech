identifier: PANTHER:PTHR11088
label: "TRNA DIMETHYLALLYLTRANSFERASE"
definition: >-
  This entry includes tRNA dimethylallyltransferases (IPTs) and adenylate dimethylallyltransferases (IZTs). IPT catalyses the first step in the modification of an adenosine near the anticodon to 2-methylthio-N6-isopentyladenosine. IZT transfers dimethylallyl groups to AMP as part of the biosynthesis of cytokinin phytohormones.
