identifier: PANTHER:PTHR15744
label: BLOM7
definition: >-
  This entry represents a group of KH domain containing proteins from eukaryotes, including RIK (rough sheath 2-interacting KH domain) from plants and BLOM7 (also known as KH homology domain-containing protein 4, KHDC4) from animals. KHDC4 is an RNA-binding protein involved in pre-mRNA splicing. It interacts with the PRP19C/Prp19 complex/NTC/Nineteen complex which is part of the spliceosome. KHDC4 binds preferentially RNA with A/C rich sequences and poly-C stretches. KHDC4 contains two type I K homology (KH) RNA-binding domains. RIK1 interacts with rough sheath2 (RS2), which is a myb domain protein required to repress knox genes during leaf development.
definition_source: "InterPro:IPR031121 abstract (PANTHER PTHR15744 is a member signature)"
