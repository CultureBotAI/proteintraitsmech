identifier: PANTHER:PTHR12484
label: "B-LYMPHOCYTE ANTIGEN-RELATED"
definition: >-
  This entry includes human AK17A and its orthologue from mouse, AK17B. AK17A was originally reported as the pseudoautosomal or X inactivation escape gene 7 (XE7) and as B-lymphocyte antigen precursor. It has been suggested that AKAP-17A is an alternative splicing factor and an SR-related splicing protein that interacts with the classical SR protein ASF/SF2 and the SR-related factor ZNF265. Additional studies have indicated that AKAP-17A is a dual-specific protein kinase A anchoring protein (AKAP) that can bind both type I and type II protein kinase A (PKA) with high affinity and co-localizes with the catalytic subunit of PKA in nuclear speckles as well as the splicing factor SC35 in splicing factor compartments. It is involved in regulation of pre-mRNA splicing possibly by docking a pool of PKA in splicing factor compartments.
definition_source: "InterPro:IPR056852 abstract (PANTHER PTHR12484 is a member signature)"
