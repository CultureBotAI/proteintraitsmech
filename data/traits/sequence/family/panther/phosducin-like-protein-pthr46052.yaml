identifier: PANTHER:PTHR46052
label: "PHOSDUCIN-LIKE PROTEIN"
definition: >-
  This family of proteins is involved in various cellular processes, including the regulation of visual phototransduction and the integration of photoreceptor metabolism. Members of this family function as co-chaperones for CCT in the assembly of heterotrimeric G protein complexes and facilitate the assembly of Gbeta-Ggamma and RGS-Gbeta5 heterodimers. They also play roles in hedgehog signaling and ciliary function. Some members inhibit the transcriptional activation activity of the cone-rod homeobox CRX, which is important in visual function. Additionally, they are implicated in the regulation of G protein signaling by modulating the assembly of G protein subunits.
