identifier: PANTHER:PTHR42643
label: "IONOTROPIC RECEPTOR 20A-RELATED"
definition: >-
  The Ionotropic Receptor family is characterized by its role in sensory perception within the antenna of insects, particularly in Drosophila. Members of the family are integral to the detection of environmental changes such as temperature (thermosensation) and humidity (hygrosensation), as well as the recognition of specific odorants like acetic, propionic, butyric, and 2-oxopentanoic acids. These receptors function as part of olfactory receptor complexes and are essential for behaviors such as cool avoidance, dry detection, humidity preference, and heat-stimulated blood feeding. They are also implicated in forming neural sensory systems that underpin the response to cooling and changes in relative humidity, contributing to the survival and adaptation of insects to their environments.
definition_source: "InterPro:IPR052192 abstract (PANTHER PTHR42643 is a member signature)"
