  - kind: GENERAL
    text: >-
      This family of proteins includes transcriptional regulators, deubiquitinases, and components of ribonucleoprotein complexes. They are involved in various cellular processes such as transcriptional regulation, chromatin remodeling, DNA damage response, and cell cycle progression. Some members function in the maintenance of telomeres, neuronal differentiation, and the regulation of gene expression during development. Others have roles in genome stability by interacting with ubiquitin chains and modulating the ubiquitination status of proteins involved in DNA replication and repair. Additionally, certain proteins in this family contribute to the repression or activation of neuronal genes in non-neuronal cells, influencing neural progenitor cell proliferation and differentiation.
