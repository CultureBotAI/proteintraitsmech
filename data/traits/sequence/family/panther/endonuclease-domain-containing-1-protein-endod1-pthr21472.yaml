identifier: PANTHER:PTHR21472
label: "ENDONUCLEASE DOMAIN-CONTAINING 1 PROTEIN ENDOD1"
definition: >-
  ENDOD1 may act as a DNase and a RNase. It plays a role in the modulation of innate immune signalling through the cGAS-STING pathway by interacting with RNF26. It acts as a tumour suppressor in prostate cancer. ENDOD1 is expressed in various tissues including brain, kidney, lung, and spleen.
