  - kind: GENERAL
    text: >-
      The protein family includes proteins involved in various cellular processes. The tuftelin subfamily members are implicated in the mineralization and structural organization of enamel, suggesting a role in dental development. The GRINL1 subfamily is associated with the Pol II(G) complex form of RNA polymerase II, contributing to mRNA and non-coding RNA synthesis, and may regulate transcription activation via the Mediator complex. The MYZAP subfamily is involved in cellular signaling, targeting proteins to cell junctions, and may interact with NMDA receptor subunits in neurons. The CCD68 subfamily proteins are centriolar, necessary for centriole subdistal appendage assembly and microtubule anchoring in interphase cells.
