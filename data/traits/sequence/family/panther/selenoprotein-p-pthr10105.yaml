identifier: PANTHER:PTHR10105
label: "SELENOPROTEIN P"
definition: >-
  Selenoprotein P (SeP, also known as SEPP1) is a plasma protein which contains 10 selenocysteine residues per polypeptide. It serves as an essential selenium transporter for bones. It contains both a catalytic domain and a C-terminal Se-delivery domain. Several isoforms of SeP with different peptide length have been found to be in cellular extracts and in plasma.
