identifier: PANTHER:PTHR46283
label: "E3 UBIQUITIN-PROTEIN LIGASE MARCH5"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE MARCH5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46283. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity. Members participate in protein polyubiquitination, regulation of mitochondrion organization, regulation of anatomical structure morphogenesis. Members localise to mitochondrial outer membrane, mitochondrial envelope, cytoplasm.
