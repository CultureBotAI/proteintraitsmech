identifier: PANTHER:PTHR46283
label: "E3 UBIQUITIN-PROTEIN LIGASE MARCH5"
definition: >-
  E3 UBIQUITIN-PROTEIN LIGASE MARCH5 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46283. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function aminoacyltransferase activity, catalytic activity, acting on a protein, ubiquitin protein ligase activity. and participate in protein polyubiquitination, post-translational protein modification, regulation of anatomical structure morphogenesis. and localise to cytoplasm, organelle membrane, membrane.
