identifier: PANTHER:PTHR42860
label: "VITAMIN B12-BINDING PROTEIN"
definition: >-
  This family of proteins is involved in the transport of vitamin B12 across cellular membranes. They are components of the ATP-binding cassette (ABC) transporter complex BtuCDF, which is responsible for the import of vitamin B12. Members of this family specifically bind vitamin B12 and are responsible for delivering it to the periplasmic surface of the BtuC component of the transporter complex.
