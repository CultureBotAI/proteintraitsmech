identifier: PANTHER:PTHR24305
label: "CYTOCHROME P450"
definition: >-
  Cytochrome P450 monooxygenases are a diverse family of enzymes involved in the oxidation of organic substances. They play a crucial role in the metabolism of drugs, the synthesis of cholesterol, steroids, and other lipids, and the detoxification of xenobiotics. These enzymes are also involved in the biosynthesis of various natural products, including mycotoxins, phytotoxins, antibiotics, and other secondary metabolites with applications in medicine and agriculture. They catalyse a wide range of chemical reactions, such as hydroxylation, epoxidation, dealkylation, and more, often using molecular oxygen and NADPH as substrates. Members of this entry are mainly found in bacteria and fungi.
