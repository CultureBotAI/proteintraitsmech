identifier: PANTHER:PTHR41695
label: "1,4-ALPHA-GLUCAN BRANCHING ENZYME RV3031-RELATED"
definition: >-
  This entry consists of 1,4-alpha-glucan branching enzymes. Branching enzymes (BEs) generally belong to glycoside hydrolase family 13 (GH13); however this group belongs to the GH57 family. This enzyme catalyzes the formation of branch points in alpha-glucans by cleavage of an alpha-1,4 glycosidic bond and subsequent transfer of the cleaved-off oligosaccharide to a new alpha-1,6 position.
