identifier: PANTHER:PTHR16254
label: "POTASSIUM/PROTON ANTIPORTER-RELATED"
definition: >-
  This entry includes a group of K(+) efflux antiporters, including KEA4/5/6 from Arabidopsis and TMCO3 from animals. They are homologues of bacterial K+/H+ antiporters, plays potential roles in K+ homeostasis and osmotic adjustment.
