  - kind: GENERAL
    text: >-
      This family of proteins includes exonucleases with a role in RNA interference and miRNA processing. Members are involved in the repression of transposon activity, possibly through the degradation of transposon-specific RNA. They are also implicated in the 3'-5' exoribonuclease activity required for the maturation of miRNAs, particularly in the 3'-end trimming of AGO1-bound miRNAs. Some family members are associated with germline gene regulation, affecting processes such as sperm development, X chromosome loss, and gene silencing mechanisms including cosuppression and antisense RNA oligomer-induced silencing.
