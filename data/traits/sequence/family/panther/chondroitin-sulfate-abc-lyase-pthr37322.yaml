identifier: PANTHER:PTHR37322
label: "Chondroitin sulfate ABC lyase"
definition: >-
  Chondroitin sulfate ABC lyases (E.C. 4.2.2.4) are broad-specificity glycosaminoglycan-degrading enzymes. Their preferred substrates are chondroitin sulfate and dermatan sulfate, which are broken down to short oligosaccharides. Two distinct chondroitinase ABC lyases have been identified in Proteus vulgaris; chondroitinase ABC lyase I is an endoeliminase (endolyase) releasing tetrasaccharides and disaccharides, whereas chondroitinase ABC lyase II is an exoeliminase (exolyase) releasing only disaccharides. Chondroitinases have been employed in attempts to promote functional locomotor recovery following trauma to the central nervous system.
definition_source: "InterPro:IPR039174 abstract (PANTHER PTHR37322 is a member signature)"
