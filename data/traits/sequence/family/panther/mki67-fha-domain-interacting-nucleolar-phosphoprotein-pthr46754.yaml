identifier: PANTHER:PTHR46754
label: "MKI67 FHA DOMAIN-INTERACTING NUCLEOLAR PHOSPHOPROTEIN"
definition: >-
  MKI67 FHA DOMAIN-INTERACTING NUCLEOLAR PHOSPHOPROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46754. Members are annotated with the molecular function RNA binding, organic cyclic compound binding. Members participate in maturation of LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA), ribosomal large subunit biogenesis, biosynthetic process. Members localise to nucleolus, nuclear lumen, membrane-bounded organelle.
