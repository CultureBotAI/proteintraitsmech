identifier: PANTHER:PTHR37805
label: "CYTOPLASMIC PROTEIN-RELATED"
definition: >-
  This entry represents a family of bacterial proteins that includes Uncharacterized protein YehS from Escherichia coli, which appears to be associated with growth in the presence of n-butanol or n-hexane. This protein is predicted to have an all-α structure.
