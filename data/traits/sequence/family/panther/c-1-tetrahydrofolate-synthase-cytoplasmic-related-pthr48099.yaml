definition: >-
  C-1-TETRAHYDROFOLATE SYNTHASE, CYTOPLASMIC-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR48099. PANTHER protein class: metabolite interconversion enzyme. Members are annotated with the molecular function hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in cyclic amidines, oxidoreductase activity. Members participate in folic acid-containing compound metabolic process, small molecule metabolic process. Members localise to cytoplasm, cytosol.
