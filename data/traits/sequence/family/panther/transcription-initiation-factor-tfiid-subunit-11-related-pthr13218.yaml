identifier: PANTHER:PTHR13218
label: "TRANSCRIPTION INITIATION FACTOR TFIID SUBUNIT 11-RELATED"
definition: >-
  TFIID is a multiprotein complex composed of the TATA binding protein and TBP-associated factors (TAFs), and is required for accurate and regulated initiation of transcription by RNA polymerase II. This entry represents TAF11, which together with TAF13 and TBP, play key roles during promoter binding by the TFIID and TFIIA transcription factor complexes.
