identifier: PANTHER:PTHR39147
label: "PROTEIN SPT21"
definition: >-
  This entry includes Spt21 from budding yeasts and Ams2 (CENP-A multicopy suppressor protein 2), also known as GATA transcription factor, from fission yeasts. Spt21 is required for transcriptional silencing in Saccharomyces cerevisiae. Ams2 is required for proper chromosome segregation via regulation of CENP-A localization to the centromere.
