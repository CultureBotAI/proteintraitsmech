  - kind: GENERAL
    text: >-
      The Receptor-type tyrosine-protein phosphatase family is involved in various cellular processes, including cell-cell interactions, signal transduction, cellular adhesion, and cell proliferation and migration. Members of this family play roles in the modulation of key signaling pathways by dephosphorylating substrates such as p120 catenin, CTNND1, and CTNNB1, which influence cell adhesion, glucose transporter function, and Wnt signaling. Some members are implicated in CNS function, adipogenic differentiation, epithelial integrity, and may have roles in tumor suppression by negatively regulating growth factor signaling pathways. The family contributes to the maintenance of cellular integrity and is involved in developmental processes such as somitogenesis.
