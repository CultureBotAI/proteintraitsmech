  - kind: GENERAL
    text: >-
      DIPHTHINE METHYLTRANSFERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46042. PANTHER protein class: methyltransferase, metabolite interconversion enzyme. Members are annotated with the molecular function carboxylic ester hydrolase activity. Members participate in peptidyl-amino acid modification, nitrogen compound metabolic process, organic substance metabolic process. Members localise to cytoplasm.
