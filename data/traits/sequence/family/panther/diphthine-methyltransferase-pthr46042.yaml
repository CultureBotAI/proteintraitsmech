    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins catalyzes the demethylation of diphthine methyl ester to form diphthine, an essential step in the biosynthesis of diphthamide, a unique post-translational modification of histidine found in translation elongation factor 2. Diphthamide modification is critical for the function of elongation factor 2 and is the target of ADP-ribosylation by toxins like diphtheria toxin and Pseudomonas exotoxin A. Members of this family are involved in a conserved biosynthetic pathway across different species and play a role in cellular processes such as protein synthesis and potentially in the regulation of the retromer complex, influencing the recycling of plasma membrane proteins.
    source: "InterPro:IPR052415 abstract (LLM-generated, not curator-reviewed)"
