identifier: PANTHER:PTHR31727
label: "OLEOYL-ACYL CARRIER PROTEIN THIOESTERASE 1, CHLOROPLASTIC"
definition: >-
  This family represents acyl-acyl carrier protein (ACP) thioesterases ([ec:3.1.2.-]), enzymes from bacteria and plants that control the termination of fatty acid synthesis by hydrolyzing the acyl-ACP complexes and determines the fatty acid profiles produced by an organism. These enzymes are classified as FatA and FatB. FatA thioesterases (or oleoyl-thioesterases) are highly conserved between different plant species and have high specificity for oleoyl-ACP. Unlike FatA, FatB thioesterases are much more variable and preferentially hydrolyse acyl-ACPs with saturated fatty acyl chains; they can be classified in subfamilies depending on their substrate of preference.
definition_source: "InterPro:IPR045023 abstract (PANTHER PTHR31727 is a member signature)"
