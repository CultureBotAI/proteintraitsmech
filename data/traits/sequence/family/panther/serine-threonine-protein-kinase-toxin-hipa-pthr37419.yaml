identifier: PANTHER:PTHR37419
label: "SERINE/THREONINE-PROTEIN KINASE TOXIN HIPA"
definition: >-
  The HipA Ser/Thr kinase family includes proteins that function as toxins within type II toxin-antitoxin (TA) systems. Members of the family phosphorylate Glu-tRNA-ligase, leading to an increase in uncharged tRNA(Glu), which triggers the stringent response and results in amino acid starvation. This process inhibits cellular functions such as replication, transcription, translation, and cell wall synthesis, thereby reducing growth and contributing to multidrug resistance and persistence. Some family members induce dormancy and can be lethal in high concentrations. The toxic effects of these kinases are typically neutralized by their cognate antitoxins. The family plays a role in the regulation of bacterial persistence, a state associated with tolerance to antibiotics and possibly biofilm formation.
