identifier: PANTHER:PTHR15172
label: GALACTOCEREBROSIDASE
definition: >-
  Glycoside hydrolase family 59 CAZy:GH59 comprises enzymes with only one known activity; galactocerebrosidase ( EC:3.2.1.46 ). Globoid cell leukodystrophy (Krabbe disease) is a severe, autosomal recessive disorder that results from deficiency of galactocerebrosidase (GALC) activity. GALC is responsible for the lysosomal catabolism of certain galactolipids, including galactosylceramide and psychosine. O-Glycosyl hydrolases ( EC:3.2.1. ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
