identifier: PANTHER:PTHR43506
label: "BIOTIN/LIPOATE A/B PROTEIN LIGASE FAMILY"
definition: >-
  The Inactive lipoate--protein ligase 2 family is involved in the mitochondrial lipoylation process, which is essential for the proper functioning of key dehydrogenase complexes involved in metabolic pathways. Specifically, members of this family work in conjunction with LipL1 to facilitate the lipoylation of the E2 components of the branched chain alpha-ketoacid dehydrogenase complex (BCKDH-E2/BCDH) and the alpha-ketoglutarate dehydrogenase complex (KDH). While LipL1 activates lipoate to form lipoyl-AMP, the exact catalytic role of the Inactive lipoate--protein ligase 2 family is not clear. They may transfer lipoyl groups to BCDH and KDH or serve as effector proteins, influencing the lipoylation process without directly catalyzing the reaction.
