identifier: PANTHER:PTHR21556
label: TRESLIN
definition: >-
  Treslin, a TopBP1-interacting protein, is necessary for DNA replication in vertebrates. Treslin is the metazoan counterpart of Sld3. They differ in their molecular sizes and amino acid sequences, however, they share a Sld3-Treslin domain (STD), essential for replication origin firing. Prior to the initiation of DNA replication, treslin associates with TopBP1 in a Cdk2-dependent manner. The proteins then collaborate in the Cdk2-mediated loading of Cdc45 onto replication origins. Treslin is also an important checkpoint regulator, and is required to prevent mitotic entry after treatment with ionizing radiation.
definition_source: "InterPro:IPR026153 abstract (PANTHER PTHR21556 is a member signature)"
