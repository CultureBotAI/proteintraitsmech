identifier: PANTHER:PTHR23158
label: "MELANOMA INHIBITORY ACTIVITY-RELATED"
definition: >-
  The cTAGE and MIA/OTOR family proteins are involved in the transport of large cargos from the endoplasmic reticulum (ER) to the Golgi apparatus. They facilitate the incorporation of these cargos into membrane-bound carriers, particularly those too bulky for standard COPII-coated vesicles. Key functions include the specific loading of collagen VII (COL7A1) into transport carriers and the secretion of lipoproteins, which is crucial for cholesterol and triglyceride homeostasis. The family members interact with COPII coat subunits SEC23A and SEC23B via proline-rich domains containing PPP motifs. Additionally, they are involved in the assembly of COPII components at ER exit sites and may interact with other ER-resident proteins to facilitate cargo transport. While some members are associated with tumor antigens, the primary role of the family appears to be in the specialized secretion process, particularly in cells with specific secretory pathways.
