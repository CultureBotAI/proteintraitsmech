identifier: PANTHER:PTHR31900
label: "F-BOX/RNI SUPERFAMILY PROTEIN-RELATED"
definition: >-
  This entry includes F-box/LRR-repeat containing proteins from plants, such as F-box/LRR-repeat protein 13 and AtMIF1 (also known as F-box protein AT3G62230) from Arabidopsis. These proteins are involved in the ubiquitin-proteasome pathway. Members of the family function as components of SCF (SKP1-CUL1-F-box protein) E3 ubiquitin ligase complexes. These complexes play a crucial role in the selective degradation of proteins by tagging them with ubiquitin, which signals for their degradation by the 26S proteasome. AtMIF1 physically interacts with MYB domain protein 5 (MYB5), which results in MYB5 degradation representing a new regulatory pathway, 26S proteasome-AtMIF1-MYB5 that regulates oil content of seeds, increasing their oil content without affecting plant growth, thus facilitating oil crop breeding. The F-box domain present in these proteins is essential for the interaction with SKP1 (ASK in Arabidopsis), which is a part of the SCF complex. The LRR (leucine-rich repeat) domain suggests that these proteins may be involved in protein-protein interactions, potentially recognizing specific substrate proteins for ubiquitination. This family plays a significant role in various cellular processes by regulating the abundance of key proteins.
definition_source: "InterPro:IPR050232 abstract (PANTHER PTHR31900 is a member signature)"
