identifier: PANTHER:PTHR31312
label: "TRANSCRIPTION ACTIVATOR GLK1"
definition: >-
  This entry represents a group of plant transcriptional activators, including GLK1/2 and APRR2 from Arabidopsis. GLK1 functions with GLK2 to promote chloroplast development. They may function in photosynthetic capacity optimization by integrating responses to variable environmental and endogenous cues. APRR2 interacts with calmodulin-like protein CML9.
