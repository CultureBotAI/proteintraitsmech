identifier: PANTHER:PTHR11364
label: "THIOSULFATE SULFERTANSFERASE"
definition: >-
  This entry represents a group of sulfurtransferases, including thiosulfate sulfurtransferases and 3-mercaptopyruvate sulfurtransferases. Thiosulfate sulfurtransferase (also known as rhodanese, EC:2.8.1.1) is an enzyme which catalyses the transfer of the sulphane atom of thiosulphate to cyanide, to form sulphite and thiocyanate. In vertebrates, rhodanese is a mitochondrial enzyme that is involved in forming iron-sulphur complexes and cyanide detoxification. A cysteine residue takes part in the catalytic mechanism. Some bacterial proteins may also express sulfotransferase activity. These include, SseA from Mycobacterium leprae and Escherichia coli, Azotobacter vinelandii rhdA, Saccharopolyspora erythraea cysA and Synechococcus sp. (strain PCC 7942) rhdA. 3-Mercaptopyruvate sulfurtransferase (MPST, EC:2.8.1.2 catalyses the desulfuration of 3-mercaptopyruvate to generate an enzyme-bound hydropersulfide.
definition_source: "InterPro:IPR045078 abstract (PANTHER PTHR11364 is a member signature)"
