identifier: PANTHER:PTHR43749
label: "RNA-SPLICING LIGASE RTCB"
definition: >-
  This family of proteins includes GTP-dependent RNA ligases that play a crucial role in RNA splicing and repair mechanisms. They are capable of joining RNA molecules with 2',3'-cyclic-phosphate or 3'-phosphate ends to RNA with 5'-hydroxy ends. Additionally, these proteins exhibit versatility by acting as DNA ligases to repair 'dirty' DNA breaks, which are characterized by 3'-phosphate (or cyclic-phosphate) and 5'-hydroxy ends that are not amenable to repair by classical DNA ligases. Their ability to work on both RNA and DNA substrates underscores their importance in cellular maintenance and genome integrity.
