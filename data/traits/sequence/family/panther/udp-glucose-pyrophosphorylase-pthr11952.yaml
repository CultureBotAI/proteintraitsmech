identifier: PANTHER:PTHR11952
label: "UDP- GLUCOSE PYROPHOSPHORYLASE"
definition: >-
  This entry includes UDP-sugar phosphorylases such as UDP-N-acetylglucosamine pyrophosphorylase, UDP-N-acetylhexosamine pyrophosphorylase (UAP1) and UDP-N-acetylglucosamine diphosphorylase, all of which catalyse the transfer of an uridylyl group. UAP1 has two catalytic domains, UDP-N-acetylgalactosamine pyrophosphorylase (EC:2.7.7.83) and UDP-N-acetylglucosamine pyrophosphorylase (EC:2.7.7.23). UDP-N-acetylglucosamine diphosphorylase is required for the biosynthesis of UDP-glucosamine, an essential precursor for glycoprotein and glycolipid synthesis and can utilize UDP-glucosamine or UDP-galactosamine.
definition_source: "InterPro:IPR039741 abstract (PANTHER PTHR11952 is a member signature)"
