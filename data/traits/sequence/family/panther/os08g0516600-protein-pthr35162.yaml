  - kind: GENERAL
    text: >-
      This family of proteins includes cyclin-dependent kinase (CDK) inhibitors that are likely involved in the regulation of the cell cycle. Specifically, they are thought to act as repressors of mitosis during the endoreduplication cell cycle, a variant of the normal cell cycle that involves DNA replication without subsequent cell division. This results in an increase in cell size and DNA content without an increase in cell number. Members of this family play a crucial role in controlling cell proliferation and differentiation by modulating the activity of CDKs, which are key regulators of cell cycle progression.
    source: "InterPro:IPR053115 abstract (LLM-generated, not curator-reviewed)"
