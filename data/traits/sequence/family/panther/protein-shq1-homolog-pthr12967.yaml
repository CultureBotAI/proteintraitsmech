identifier: PANTHER:PTHR12967
label: "PROTEIN SHQ1 HOMOLOG"
definition: >-
  The box H/ACA ribonucleoproteins (RNPs) are protein-RNA complexes responsible for pseudouridylation, the most abundant post-transcriptional modification of cellular RNAs. Each distinct H/ACA RNA assembles with a common set of four proteins, Cbf5 (NAP57 in rodents and dyskerin in humans), Nop10, Nhp2 (L7Ae in archaea) and Gar1.
