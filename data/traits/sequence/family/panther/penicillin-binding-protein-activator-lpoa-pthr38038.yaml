identifier: PANTHER:PTHR38038
label: "PENICILLIN-BINDING PROTEIN ACTIVATOR LPOA"
definition: >-
  This entry represents penicillin-binding protein activators LpoA. It has been suggested that penicillin-binding protein activator acts as a regulator of peptidoglycan synthesis that is essential for the function of penicillin-binding protein 1A (PBP1a).
