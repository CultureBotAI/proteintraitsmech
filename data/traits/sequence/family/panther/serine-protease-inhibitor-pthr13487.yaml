identifier: PANTHER:PTHR13487
label: "SERINE PROTEASE INHIBITOR"
definition: >-
  Reck is a GPI-anchored membrane protein that negatively regulates matrix metalloproteinase-9 (MMP-9) by suppressing MMP-9 secretion and by direct inhibition of its enzymatic activity. It also regulates two other MMPs, MMP-2 and MT1-MMP, known to be involved in cancer progression. Reck and the orphan receptor Gpr124 interact to activate Wnt7a/Wnt7b signalling in CNS vascular development. Reck interacts specifically with the disordered linker region of Wnt7, which confers ligand selectivity for Wnt7.
definition_source: "InterPro:IPR039016 abstract (PANTHER PTHR13487 is a member signature)"
