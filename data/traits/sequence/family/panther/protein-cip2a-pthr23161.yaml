identifier: PANTHER:PTHR23161
label: "PROTEIN CIP2A"
definition: >-
  Cancerous inhibitor of PP2A (CIP2A) functions via protein binding through interactions with many other proteins including MYC, polo like kinase (PLK1) and NIMA protein. It is an inhibitor of PP2A, a tumour suppressor. CIP2A binds to PP2A and inhibits its phosphatase functions resulting in tumorigenic transformation of cells. CIP2A is overexpressed at a high frequency in a number of tumours and expression levels are independent markers for long-term outcomes in many of these tumours.
