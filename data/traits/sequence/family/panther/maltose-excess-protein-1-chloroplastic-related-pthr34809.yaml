identifier: PANTHER:PTHR34809
label: "MALTOSE EXCESS PROTEIN 1, CHLOROPLASTIC-RELATED"
definition: >-
  MEX1 is a maltose transporter essential for the conversion of starch to sucrose in leaves at night, via the export of maltose from the chloroplast. Together with pGlcT, it contributes significantly to the export of starch degradation products from chloroplasts. The protein is localised to the chloroplast inner membrane and contains multiple transmembrane helices. MEX1 is also required for root cap cell formation.
