identifier: PANTHER:PTHR11879
label: "ASPARTATE AMINOTRANSFERASE"
definition: >-
  Aspartate aminotransferase is important for the metabolism of amino acids and Krebs-cycle related organic acids. In plants, it is involved in nitrogen metabolism and in aspects of carbon and energy metabolism. The enzyme catalyses the reaction: L-aspartate + 2-oxoglutarate = oxaloacetate + L-glutamate Aminotransferases share certain mechanistic features with other pyridoxal-phosphate-dependent enzymes, such as the covalent binding of the pyridoxal-phosphate group to a lysine residue. This family also includes some aromatic-amino-acid aminotransferases such as L-tyrosine:2-oxoglutarate aminotransferase ucdG and Tyrosine aminotransferase TyrAT.
