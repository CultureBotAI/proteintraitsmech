identifier: PANTHER:PTHR34661
label: "INCREASED DNA METHYLATION 3"
definition: >-
  This entry represents a group of plant proteins, including IDM2/3 (increased DNA methylation 2/3) from Arabidopsis. IDM2 functions in active DNA demethylation. IDM3 acts as an anti-silencing factor that prevents DNA hypermethylation and gene repression.
