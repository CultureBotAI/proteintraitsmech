identifier: PANTHER:PTHR23176
label: "RHO/RAC/CDC GTPASE-ACTIVATING PROTEIN"
definition: >-
  This family of proteins includes Rho GTPase-activating proteins (GAPs) that are primarily involved in the regulation of Rho-type GTPases. These proteins typically inactivate GTPases by accelerating the hydrolysis of GTP to GDP, thereby switching the GTPase from an active to an inactive state. Members of this family are implicated in various cellular processes, including signal transduction pathways, cell integrity, stress responses, polarized cell growth, bud site selection, and clathrin-mediated endocytosis. Some proteins within this family are also involved in the regulation of the actin cytoskeleton, contributing to cell contraction and the formation of stress fibers. Additionally, certain members interact with phosphoinositides, which may influence their localization and activity within the cell.
