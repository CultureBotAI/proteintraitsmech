identifier: PANTHER:PTHR42655
label: "GLYCOGEN PHOSPHORYLASE"
definition: >-
  This family consists of known phosphorylases, and homologues believed to share the function of using inorganic phosphate to cleave an alpha 1,4 linkage between the terminal glucose residue and the rest of the polymer (maltodextrin, glycogen, etc.). The name of the glucose storage polymer substrate, and therefore the name of this enzyme, depends on the chain lengths and branching patterns. A number of the members of this family have been shown to operate on small maltodextrins, as may be obtained by utilization of exogenous sources. This family represents a distinct clade from the related families: Glycogen/starch/alpha-glucan phosphorylase and Glycosyl transferase, family 35.
definition_source: "InterPro:IPR011834 abstract (PANTHER PTHR42655 is a member signature)"
