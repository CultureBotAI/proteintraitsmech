identifier: PANTHER:PTHR14611
label: "TECTONIC FAMILY MEMBER"
definition: >-
  TCTN1, TCTN2, and TCTN3 are members of the tectonic protein family that play crucial roles in ciliogenesis and ciliary function. While they share some common functions, each protein also has specific roles in the process of cilia formation and maintenance. These proteins interact with several other ciliopathy proteins, forming a complex known as the Tectonic ciliopathy complex. This complex is required for hedgehog signalling transduction and regulation of ciliary membrane composition.
definition_source: "InterPro:IPR040354 abstract (PANTHER PTHR14611 is a member signature)"
