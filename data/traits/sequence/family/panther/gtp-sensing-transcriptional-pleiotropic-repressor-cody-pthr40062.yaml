identifier: PANTHER:PTHR40062
label: "GTP-SENSING TRANSCRIPTIONAL PLEIOTROPIC REPRESSOR CODY"
definition: >-
  This entry represents pleiotropic repressors in Bacillus subtilis, CodY, and other Firmicutes (low-GC Gram-positive bacteria) that respond to intracellular levels of GTP and branched chain amino acids. CodY is a DNA-binding protein that represses the expression of many genes that are induced as cells make the transition from rapid exponential growth to stationary phase and sporulation. It is a GTP-binding protein that senses the intracellular GTP concentration as an indicator of nutritional limitations. At low GTP concentration it no longer binds GTP and stops to act as a transcriptional repressor.
definition_source: "InterPro:IPR014154 abstract (PANTHER PTHR40062 is a member signature)"
