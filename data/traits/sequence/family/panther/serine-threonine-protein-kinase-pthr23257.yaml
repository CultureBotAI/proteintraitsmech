  - kind: GENERAL
    text: >-
      The protein family is involved in a wide range of cellular processes, including signal transduction, cell cycle regulation, apoptosis, and immune responses. Members of this family are serine/threonine-protein kinases that act as regulatory links between membrane-associated GTPases and downstream MAPK cascades, determining cell fate decisions such as proliferation, differentiation, and survival. Some family members also have roles in stress responses, apoptosis, and necroptosis, acting as sensors or effectors in these pathways. They are involved in the phosphorylation of various substrates, including MAP kinase kinases, integrins, and histones, influencing pathways like JNK signaling, integrin-mediated signal transduction, and inflammatory responses. The family includes both catalytically active kinases and predicted pseudokinases with regulatory functions.
    source: "InterPro:IPR050167 abstract (LLM-generated, not curator-reviewed)"
