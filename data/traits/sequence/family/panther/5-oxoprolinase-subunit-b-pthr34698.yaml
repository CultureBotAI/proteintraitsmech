identifier: PANTHER:PTHR34698
label: "5-OXOPROLINASE SUBUNIT B"
definition: >-
  This entry represents 5-oxoprolinase subunit B from Bacillus subtilis (PxpB) and similar proteins widely spread among bacteria. PxpB was originally designated KipI, as it showed to be an inhibitor of B. subtilis sporulation kinase A (KinA). It catalyses the cleavage of 5-oxoproline to form L-glutamate coupled to the hydrolysis of ATP to ADP and inorganic phosphate. It folds into two α/β domains. Members of this family show a carboxyltransferase domain (InterPro:IPR003833) covering its full length.
definition_source: "InterPro:IPR010016 abstract (PANTHER PTHR34698 is a member signature)"
