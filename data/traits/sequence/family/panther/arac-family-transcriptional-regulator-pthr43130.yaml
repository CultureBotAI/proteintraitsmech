identifier: PANTHER:PTHR43130
label: "ARAC-FAMILY TRANSCRIPTIONAL REGULATOR"
definition: >-
  This family of proteins includes enzyme Isonitrile hydratase (InhA) and transcriptional regulators: HTH-type transcriptional regulator GbdR, HTH-type transcriptional regulator CdhR and HTH-type transcriptional regulator GlxA. InhA catalyses the hydration of isonitriles to formamides, likely playing a role in detoxification processes. It is sensitive to thiols and oxidising reagents. The transcriptional regulators are involved in the metabolism of quaternary amines, such as choline and carnitine, by activating the transcription of genes involved in their catabolism and transport. These regulators are critical for the induction of specific genes in response to various metabolites and may be important for bacterial interactions with eukaryotes. These proteins contain a domain represented by.
