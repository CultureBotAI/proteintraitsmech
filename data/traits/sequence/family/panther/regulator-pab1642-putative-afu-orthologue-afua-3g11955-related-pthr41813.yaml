  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that are implicated in the regulation of gene expression for certain biosynthetic processes. Specifically, members of this family are thought to play a role in the control of gene clusters responsible for the biosynthesis of complex molecules. These molecules are composed of a polyketide chain linked to a peptide made up of several amino acids. The activity of these proteins is crucial for the coordinated expression of genes involved in the assembly of these secondary metabolites, which may have important biological functions or applications.
