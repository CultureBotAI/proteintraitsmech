identifier: PANTHER:PTHR13962
label: "FORKHEAD BOX PROTEIN N3-LIKE PROTEIN-RELATED"
definition: >-
  This entry represents a protein family that includes the transcription factors Forkhead box protein N2, N3 and N4 from humans (FOXN2/3/4) and related proteins from animals. Putative forkhead-related transcription factor fkh-5 from Caenorhabditis elegans, is also included in this entry, which binds to DNA sequence motif 5'-CTGTTTCA-3' and regulates expression of a class of small RNAs, known as 21UR-NAs.
