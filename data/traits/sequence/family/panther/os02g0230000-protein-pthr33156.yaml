identifier: PANTHER:PTHR33156
label: "OS02G0230000 PROTEIN"
definition: >-
  This entry includes a group of plant proteins, including NFD6 and NOXY2 from Arabidopsis. Protein NUCLEAR FUSION DEFECTIVE 6 (NFD6) is required for karyogamy during female gametophyte development, when the two polar nuclei fuse to form the diploid central cell nucleus. This entry includes NONRESPONDING TO OXYLIPINS 2 (NOXY2, At5g11630) from Arabidopsis and plant homologues. NOXY2 is involved in plant defense against bacterial pathogens.
