  - kind: GENERAL
    text: >-
      This family of proteins exhibits hydrolytic activity on glycosidic bonds. Members are involved in the degradation of various glycosides, including those with beta-galactosidic and beta-glucuronidic linkages. They catalyze the hydrolysis of terminal non-reducing beta-D-galactose residues in beta-D-galactosides, as well as the removal of D-glucuronic acid side chains from polysaccharides. These enzymes play roles in the utilization of diverse carbon sources, the degradation of cell wall components in green seaweed, and potentially in the reactivation of glucuronide drug conjugates within the gastrointestinal tract. The family is characterized by a conserved domain indicative of the glycosyl hydrolase 2 superfamily.
    source: "InterPro:IPR051913 abstract (LLM-generated, not curator-reviewed)"
