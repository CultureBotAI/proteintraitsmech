identifier: PANTHER:PTHR28072
label: "CRUCIFORM CUTTING ENDONUCLEASE 1, MITOCHONDRIAL-RELATED"
definition: >-
  This entry includes Mrs1 and its paralogue, Cce1 from fungi. They are mitochondrial proteins. Mrs1 is required for splicing of two mitochondrial group I introns (BI3 in COB and AI5beta in COX1). Cce1 is an endonuclease that cleaves Holliday junctions formed during recombination of mitochondrial DNA.
