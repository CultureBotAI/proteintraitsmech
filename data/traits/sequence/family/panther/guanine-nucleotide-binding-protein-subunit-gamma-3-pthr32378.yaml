identifier: PANTHER:PTHR32378
label: "GUANINE NUCLEOTIDE-BINDING PROTEIN SUBUNIT GAMMA 3"
definition: >-
  This entry represents a group of proteins from plants, including Guanine nucleotide-binding protein subunit gamma 3 from Arabidopsis thaliana (GG3). Guanine nucleotide-binding proteins (G proteins) are involved as a modulator or transducer in various transmembrane signalling systems. The beta and gamma chains are required for the GTPase activity, for replacement of GDP by GTP, and for G protein-effector interaction. Guanine nucleotide-binding protein subunit gamma 4 from Oryza sativa (DEP1, also known as GGC3), involved in the regulation of grain size, also belongs to this entry.
