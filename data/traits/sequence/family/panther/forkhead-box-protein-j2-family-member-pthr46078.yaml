identifier: PANTHER:PTHR46078
label: "FORKHEAD BOX PROTEIN J2 FAMILY MEMBER"
definition: >-
  This entry represents a group of fork-head domain-containing proteins, including the transcriptional activators FOXJ2/3 from humans. In humans FOXJ2 has two isoforms, FHX.L and FHX.S. FHX. L can bind to two different type of DNA binding sites. The levels of FOXJ2 expression have been linked to a variety of cancers. The expression of FOXJ3 is associated with cancers and rheumatoid arthritis. In mice FOXJ2 is involved in the regulation of meiosis during spermatogenesis.
