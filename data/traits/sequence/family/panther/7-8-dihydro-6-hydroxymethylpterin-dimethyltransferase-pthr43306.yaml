identifier: PANTHER:PTHR43306
label: "7,8-DIHYDRO-6-HYDROXYMETHYLPTERIN DIMETHYLTRANSFERASE"
definition: >-
  This group of radical S-adenosylmethionine enzymes are found in archaea and bacteria and have been classified as class D RS methylases (RSMT) subclass, whose pioneer member is MJ0619 protein from Methanocaldococcus jannaschii, recently designated GDGT/MA synthase or GDGT/MAS (formerly known as 7,8-dihydro-6-hydroxymethylpterin dimethyltransferase).
