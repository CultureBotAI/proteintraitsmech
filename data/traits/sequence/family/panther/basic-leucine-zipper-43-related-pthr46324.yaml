identifier: PANTHER:PTHR46324
label: "BASIC LEUCINE ZIPPER 43-RELATED"
definition: >-
  This entry represents a group of plant basic leucine zipper proteins (bZIPs), including AtbZIP8 and AtbZIP43. AtbZIP43 may act as positive regulator of BHLH109, which is associated with somatic embryogenesis (SE) induction. The basic (region) leucine zippers (bZIPs) are evolutionarily conserved transcription factors in eukaryotic organisms. In plants bZIPs regulate processes including pathogen defence, light and stress signalling, seed maturation and flower development. The bZIP domain consists of a basic DNA-binding region and the adjacent ZIP domain. The ZIP domain consists of heptad repeats of leucine (L) or related hydrophobic amino acids. The DNA-binding region is a basic region of ~16 amino acid residues containing a nuclear localization signal followed by an invariant N-x7-R/K motif that contacts the DNA The heptad repeat of leucines or other bulky hydrophobic amino acids positioned exactly nine amino acids towards the C terminus, creating an amphipathic helix. To bind DNA, two subunits adhere via interactions between the hydrophobic sides of their helices, which creates a superimposing coiled-coil structure. The ability to form homo- and heterodimers is influenced by the electrostatic attraction and repulsion of polar residues flanking the hydrophobic interaction surface of the helices. As bZIPs generally perform as dimers, heterodimerisation results in an enormous regulatory flexibility.
