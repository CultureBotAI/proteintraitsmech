identifier: PANTHER:PTHR35457
label: "HEME A SYNTHASE"
definition: >-
  The COX15/CtaA family is responsible for the biosynthesis of heme A, a critical component of cytochrome c oxidase, the terminal enzyme of the mitochondrial respiratory chain. Members of this family catalyze the conversion of heme O into heme A through two successive hydroxylations at the methyl group at carbon 8 of the heme molecule. The initial hydroxylation produces heme I, followed by a second hydroxylation that generates an unstable dihydroxymethyl group. This group spontaneously dehydrates to form the characteristic formyl group of heme A. The enzymatic activity of the COX15/CtaA family is essential for the proper functioning of aerobic energy metabolism.
definition_source: "InterPro:IPR050450 abstract (PANTHER PTHR35457 is a member signature)"
