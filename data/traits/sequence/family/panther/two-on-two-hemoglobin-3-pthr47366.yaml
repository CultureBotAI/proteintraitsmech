identifier: PANTHER:PTHR47366
label: "TWO-ON-TWO HEMOGLOBIN-3"
definition: >-
  This entry represents truncated haemoglobin group 2 proteins, including GlbO (also known as Hb) from Mycobacterium and Glb3 from Arabidopsis. Truncated hemoglobins (TrHbs) have a truncated 2-over-2 rather than the canonical 3-over-3 α-helical sandwich fold, found in eubacteria, cyanobacteria, protozoa and plants, but not in animals or yeast. The variability of the amino acid residues of the heme pocket suggested their partition into three groups that share less than 30% sequence similarity with each other. Glb3 is a nuclear-encoded truncated haemoglobin from plants that appears more closely related to HbO than HbN. Glb3 from Arabidopsis thaliana exhibits an unusual concentration-independent binding of oxygen and carbon dioxide.
definition_source: "InterPro:IPR044203 abstract (PANTHER PTHR47366 is a member signature)"
