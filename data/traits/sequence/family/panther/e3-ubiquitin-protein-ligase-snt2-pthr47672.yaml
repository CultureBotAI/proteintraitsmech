identifier: PANTHER:PTHR47672
label: "E3 UBIQUITIN-PROTEIN LIGASE SNT2"
definition: >-
  In fission yeasts, Snt2 is a component of the Lid2 complex, a complex that may be involved in regulation of chromatin remodelling. S. cerevisiae Snt2 is an E3 ubiquitin ligase that regulate histone protein levels.
