identifier: PANTHER:PTHR45728
label: "ACETYL-COA CARBOXYLASE, ISOFORM A"
definition: >-
  This family includes Acetyl-CoA carboxylases, such as acetyl-CoA carboxylase 1 (also known as acetyl-Coenzyme A carboxylase alpha, ACACA), which is cytosolic and acetyl-CoA carboxylase 2 (also known as ACC-beta), which is mitochondrial. These enzymes catalyse the carboxylation of acetyl-CoA to malonyl-CoA, the first and rate-limiting step of de novo fatty acid biosynthesis. This is a 2 steps reaction starting with the ATP-dependent carboxylation of the biotin carried by the biotin carboxyl carrier (BCC) domain, followed by the transfer of the carboxyl group from carboxylated biotin to acetyl-CoA.
