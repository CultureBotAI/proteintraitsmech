identifier: PANTHER:PTHR12412
label: "CAP BINDING PROTEIN"
definition: >-
  Nuclear cap-binding protein subunit 1 (also known as CBP80 or STO1) forms the CBC complex with the nuclear cap-binding protein subunit 2 (InterPro:IPR027157). CBC complex binds co-transcriptionally to the 5' cap of pre-mRNAs and is involved in maturation, export and degradation of nuclear mRNAs. In humans, the CBC complex is also involved in mediating U snRNA and intronless mRNAs export from the nucleus and plays a central role in nonsense-mediated mRNA decay (NMD). During cell proliferation, the CBC complex is involved in microRNAs (miRNAs) biogenesis via its interaction with SRRT/ARS2, thereby being required for miRNA-mediated RNA interference.
definition_source: "InterPro:IPR027159 abstract (PANTHER PTHR12412 is a member signature)"
