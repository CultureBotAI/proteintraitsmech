identifier: PANTHER:PTHR13456
label: "UPF0729 PROTEIN C18ORF32"
definition: >-
  This entry represents a family of uncharacterised proteins, including C18orf32 from human and its homologues. C18orf32 localises to the ER and lipid droplets (LDs) in the cell and has been described to be important for GPI-inositol deacylation. Mutations in this gene cause of a novel autosomal recessive neurodevelopmental disorder with hypotonia and contractures.
