identifier: PANTHER:PTHR46293
label: "E3 UBIQUITIN PROTEIN LIGASE DRIP1"
definition: >-
  DREB2A-Interacting Proteins (DRIPs) are E3 ubiquitin-protein ligases that act as negative regulators of the response to water stress. This family includes DRIP1, DRIP2 and the DRIP homologue (DRIPH) At3g23060 from Arabidopsis, which mediate ubiquitination and subsequent proteasomal degradation of the drought-induced transcriptional activator Dehydration-Responsive Element-Binding Protein 2A (DREB2A). DRIP1 and DRIP2 are functionally redundant. DREB2A regulates the expression of stress-inducible genes via the dehydration-responsive elements and requires posttranslational modification for its activation. DRIPs contain a RING finger, and a RING finger- and WD40-associated ubiquitin-like (RAWUL) domain. The RAWUL domain is responsible for the protein interaction with DREB2A.
