    text: >-
      SERINE/THREONINE-PROTEIN KINASE NEK — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43671. PANTHER protein class: non-receptor serine/threonine protein kinase, protein modifying enzyme. Members are annotated with the molecular function protein serine/threonine kinase activity, phosphotransferase activity, alcohol group as acceptor, catalytic activity, acting on a protein.
