identifier: PANTHER:PTHR12628
label: "POLYCOMB-LIKE TRANSCRIPTION FACTOR"
definition: >-
  POLYCOMB-LIKE TRANSCRIPTION FACTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12628. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function organic cyclic compound binding, chromatin binding, DNA binding. Members participate in negative regulation of gene expression, negative regulation of macromolecule biosynthetic process, negative regulation of cellular metabolic process. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
