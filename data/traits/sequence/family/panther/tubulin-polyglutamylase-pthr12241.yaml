identifier: PANTHER:PTHR12241
label: "TUBULIN POLYGLUTAMYLASE"
definition: >-
  TUBULIN POLYGLUTAMYLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12241. PANTHER protein class: cytoskeletal protein, microtubule or microtubule-binding cytoskeletal protein. Members are annotated with the molecular function cytoskeletal protein binding, ligase activity, protein binding. and participate in microtubule-based process, macromolecule metabolic process, microtubule cytoskeleton organization. and localise to ciliary basal body, membrane-bounded organelle, non-membrane-bounded organelle.
