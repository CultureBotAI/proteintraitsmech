label: "TUBULIN POLYGLUTAMYLASE"
definition: >-
  TUBULIN POLYGLUTAMYLASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12241. PANTHER protein class: cytoskeletal protein, microtubule or microtubule-binding cytoskeletal protein. Members are annotated with the molecular function tubulin binding, ligase activity, catalytic activity, acting on a protein. Members participate in peptidyl-amino acid modification, microtubule cytoskeleton organization. Members localise to cytoskeleton, cilium, ciliary basal body.
