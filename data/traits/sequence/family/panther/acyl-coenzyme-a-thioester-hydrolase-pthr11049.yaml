identifier: PANTHER:PTHR11049
label: "ACYL COENZYME A THIOESTER HYDROLASE"
definition: >-
  This family comprises bacterial and cytosolic acyl-CoA thioester hydrolases. In higher organisms, acyl-CoA thioesterases (ACOTs) catalyse hydrolysis of fatty acyl-CoAs to free fatty acids and CoA-SH. Different ACOT isoforms are localised to distinct cellular organelles. ACOT6 is a cytosolic isoform highly expressed in brain tissue and testis. Other cytosolic isoforms include ACOT12, which appears to be the major cytoplasmic enzyme in the liver, and ACOT11, a brown fat-inducible thioesterase.
