identifier: PANTHER:PTHR45979
label: "PAP/OAS1 SUBSTRATE-BINDING DOMAIN SUPERFAMILY"
definition: >-
  This family includes a group of uncharacterised proteins mainly found in plants. Members often contain InterPro:IPR058920 and are thought to be related to PAP/OAS1 proteins. The PAP/OAS1 proteins bind ATP and interact with RNA. The OAS1 substrate-binding domain enables catalytic 2-5A synthesis (ATP coordination) and non-catalytic RNA stabilisation. It shares structural homology with PAP, as the α N4 helix in OAS1, critical for donor ATP coordination, is intrinsically present in PAP and other nucleotidyl transferases.
definition_source: "InterPro:IPR058921 abstract (PANTHER PTHR45979 is a member signature)"
