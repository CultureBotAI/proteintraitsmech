identifier: PANTHER:PTHR47588
label: "CHALCONE--FLAVONONE ISOMERASE 3-RELATED"
definition: >-
  This entry includes a group of predicted chalcone--flavonone isomerases from plants, such as CHI3 (also known as CHIL, At5g05270) from Arabidopsis. It may function with TT5 to promote flavonoid production. This entry also includes CHIL2 from Humulus lupulus (European hop). CHIL2 is involved in DMX (demethylxanthohumol) biosynthesis.
