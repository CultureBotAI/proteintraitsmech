identifier: PANTHER:PTHR14938
label: "HCLS1-ASSOCIATED PROTEIN X-1"
definition: >-
  HS1-associating protein X-1 (HAX-1) promotes cell survival and is involved in the clathrin-mediated endocytosis pathway. It has been implicated in severe congenital neutropenia (SCN), neurological disorders and cancer. The voltage-dependent Kv3.3 potassium channel has been shown to bind to HAX-1 to induce Arp2/3 (actin-related protein 2/3 complex) dependent actin filament nucleation at the plasma membrane.
