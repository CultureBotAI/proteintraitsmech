  - kind: GENERAL
    text: >-
      This family of proteins includes oxidoreductases that play a crucial role in the biosynthesis of various secondary metabolites, including mycotoxins such as aflatoxins and sterigmatocystin, as well as other polyketide-derived compounds. Members of this family are involved in specific oxidation steps within the biosynthetic pathways. These enzymes typically catalyze the conversion of intermediate compounds to more complex structures, contributing to the formation of key functional groups and rings essential for the biological activity of the final products. The family also includes proteins that are involved in the reduction of various flavins and other substrates, indicating a broad specificity and a role in diverse metabolic processes.
