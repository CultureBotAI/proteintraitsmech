identifier: PANTHER:PTHR16081
label: VERTNIN
definition: >-
  Vertnin is reported to be a maternal factor involved in dorsoventral patterning in zebrafish. It is rapidly transported to the animal pole region after fertilisation and binds to a bmp2b regulatory region to prevent its transcription. In mammals, it is associated with variations in vertebral number.
