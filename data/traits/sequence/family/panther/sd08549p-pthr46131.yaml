identifier: PANTHER:PTHR46131
label: SD08549P
definition: >-
  This family of proteins includes mitochondrial membrane carrier proteins that are involved in the transport of nicotinamide adenine dinucleotide (NAD+) into the mitochondria. These proteins play a role in cellular metabolism by facilitating the import of NAD+, which is necessary for processes such as glycolysis and mitochondrial respiration. While the exact transport mechanism, whether it operates via uniport or antiport, as well as its electrogenicity and substrate selectivity, are yet to be fully characterized, it is known that some members of this family are essential for NAD+ import into mitochondria, whereas others are not.
