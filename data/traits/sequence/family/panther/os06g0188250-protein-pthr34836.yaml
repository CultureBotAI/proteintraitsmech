identifier: PANTHER:PTHR34836
label: "OS06G0188250 PROTEIN"
definition: >-
  Ionotropic glutamate receptors (iGluRs) are a highly conserved family of ligand-gated ion channels present in animals, plants, and bacteria, which are best characterised for their roles in synaptic communication in vertebrate nervous systems. A variant subfamily of iGluRs, the Ionotropic Receptors (IRs), consist of non-glutamate-binding chemosensory receptors first identified in Drosophila melanogaster. They function in detecting odors and tastants. The ionotropic glutamate receptor family mediates most forms of excitatory synaptic transmission in the mammalian CNS. These channels also are required for synaptic plasticity and learning. Glutamate receptors have been divided into AMPA, kainate, and NMDA subtypes based on differences in agonist response. NMDA receptors require both membrane depolarisation and glutamate-binding to open and are key regulators of long-term potentiation in the mammalian brain. AMPA and kainate receptors mediate fast synaptic transmission in the CNS. A fourth subfamily of glutamate receptors, delta, has recently been identified. The function of the delta family in neuronal signalling is unknown. Approximately 30 glutamate receptor genes are present in Drosophila, compared with 15 in Caenorhabditis elegans. Invertebrate glutamate receptors can be subdivided into kainate (15 genes in flies, four in worms), AMPA (three genes in both), NMDA (one type 1 and one type 2 gene in both species), and delta subfamilies (four genes in both) on the basis of sequence similarities with mammalian counterparts. In addition, several novel subtypes are present for which no mammalian homologues have been identified, though several show low similarity with the Arabidopsis Glur5 glutamate receptor. Mammalian NMDA receptors are tetramers containing two type 1 and two
