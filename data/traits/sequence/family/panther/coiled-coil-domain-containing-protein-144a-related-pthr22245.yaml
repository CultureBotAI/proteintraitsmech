identifier: PANTHER:PTHR22245
label: "COILED-COIL DOMAIN-CONTAINING PROTEIN 144A-RELATED"
definition: >-
  This entry includes human coiled-coil domain-containing protein 144A/B/C (C144A/B/C). C144A may play a role in preventing the formation of kidney stones through inhibition of calcium oxalate monohydrate (COM) crystallization, attenuating COM-induced apoptotic injury to renal epithelial cells. C144A may also exhibit antilithiatic (preventing the formation of kidney stones) activity through crystal binding, hindering the crystal attachment to renal epithelial cells, a prerequisite to initiate inflammatory response.
