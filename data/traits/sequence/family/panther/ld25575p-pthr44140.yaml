  - kind: GENERAL
    text: >-
      LD25575P — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44140. Members are annotated with the molecular function protein-folding chaperone binding. Members participate in cellular metabolic process, cellular biosynthetic process, organic substance biosynthetic process. Members localise to endoplasmic reticulum, intracellular organelle.
