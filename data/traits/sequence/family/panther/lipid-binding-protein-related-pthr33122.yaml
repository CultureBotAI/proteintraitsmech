identifier: PANTHER:PTHR33122
label: "LIPID BINDING PROTEIN-RELATED"
definition: >-
  This entry represents a group of plant proteins, including DIR1 (At5g48485) from Arabidopsis. AtDIR1 is an acidic lipid transfer protein essential for systemic acquired resistance (SAR), which is a defence mechanism that induces protection against a wide range of pathogens in distant, pathogen-free parts of plants after a primary inoculation. Upon SAR induction, DIR1 moves from locally infected to distant uninfected leaves to activate defense priming.
