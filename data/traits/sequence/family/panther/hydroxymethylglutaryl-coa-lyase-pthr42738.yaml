identifier: PANTHER:PTHR42738
label: "HYDROXYMETHYLGLUTARYL-COA LYASE"
definition: >-
  3-hydroxy-3-methylglutaryl-CoA lyase (HMGL) catalyses the cleavage of HMG-CoA to acetyl-CoA and acetoacetate, one of the terminal steps in ketone body generation and leucine degradation, and is a key enzyme in the pathway that supplies metabolic fuel to extrahepatic tissues. Mutations in HMGL cause a human autosomal recessive disorder called primary metabolic aciduria that affects ketogenesis and leucine catabolism and can be fatal due to an inability to tolerate hypoglycemia.
definition_source: "InterPro:IPR043594 abstract (PANTHER PTHR42738 is a member signature)"
