identifier: PANTHER:PTHR31826
label: NICALIN
definition: >-
  Nicalin is a Nodal signalling antagonist and a distant homologue of the gamma-secretase component Nicastrin. In humans, Nicalin forms a complex with NOMO (Nodal modulator) and controls the assembly and stability of this complex. It is a component of the multi-pass translocon (MPT) complex that mediates insertion of multi-pass membrane proteins into the lipid bilayer of membranes.
