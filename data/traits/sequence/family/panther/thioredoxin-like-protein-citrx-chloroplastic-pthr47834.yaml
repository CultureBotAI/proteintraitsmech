identifier: PANTHER:PTHR47834
label: "THIOREDOXIN-LIKE PROTEIN CITRX, CHLOROPLASTIC"
definition: >-
  This entry represents thioredoxin-like protein CITRX and related proteins from plants. In Arabidopsis, TRX z (At3g06730) is a thiol-disulfide oxidoreductase that plays a role in chloroplast development. It interacts with fructokinase-like protein 1 (FLN1) represent subunits of the plastid-encoded RNA polymerase (PEP), suggesting a role of chloroplast gene expression.
