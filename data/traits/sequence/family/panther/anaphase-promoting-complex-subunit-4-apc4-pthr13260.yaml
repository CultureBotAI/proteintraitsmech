identifier: PANTHER:PTHR13260
label: "ANAPHASE PROMOTING COMPLEX SUBUNIT 4  APC4"
definition: >-
  The anaphase-promoting complex (APC) or cyclosome is a multi-subunit E3 protein ubiquitin ligase that regulates important events in mitosis, such as the initiation of anaphase and exit from telophase. The APC, in conjunction with other enzymes, assembles multi-ubiquitin chains on a variety of regulatory proteins, thereby targeting them for proteolysis by the 26S proteasome. This family represents the anaphase-promoting complex subunit 4 (APC4). This entry also includes APC4 homologue, EMB-30, from Caenorhabditis elegans.
