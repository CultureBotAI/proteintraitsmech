identifier: PANTHER:PTHR28260
label: "SPINDLE POLE BODY COMPONENT SPC105"
definition: >-
  This entry includes Spc105 from budding yeasts and Spc7 from fission yeasts. Spc7 is a component of the NMS (Ndc80-MIND-Spc7) super complex which has a role in kinetochore function during late meiotic prophase and throughout the mitotic cell cycle. Spc105 and Kre28 forms a kinetochore complex, which is required for kinetochore binding by a discrete subset of kMAPs (BIM1, BIK1 and SLK19) and motors (CIN8, KAR3).
