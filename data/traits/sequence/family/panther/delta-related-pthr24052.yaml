  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various cellular differentiation processes. Some proteins in this family are implicated in the regulation of platelet activation and hematopoiesis through interactions with specific ligands and activation of downstream signaling pathways such as AKT/mTOR. Other members are associated with neuroendocrine differentiation and have been shown to play a role in inhibiting adipocyte differentiation. The diverse functions of these proteins suggest their importance in developmental and physiological processes.
