definitions:
  - kind: GENERAL
    text: >-
      CENTROMERE PROTEIN W — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR34832. and participate in organelle assembly, cellular component assembly, cellular component biogenesis. and localise to membrane-enclosed lumen, supramolecular complex, non-membrane-bounded organelle.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The CENP-W/WIP1 family is involved in the essential processes of kinetochore assembly, mitotic progression, and chromosome segregation. Family members are components of the CENPA-NAC complex, which is crucial for assembling kinetochore proteins and may assist in the integration of newly synthesized CENPA into centromeres. They also form part of a nucleosome-associated complex that preferentially binds to histone H3-containing nucleosomes at the centromere. Additionally, they are constituents of the heterotetrameric CENP-T-W-S-X complex that binds and supercoils DNA, significantly contributing to kinetochore structure. These proteins are inner kinetochore proteins, foundational for kinetochore function and necessary for proper chromosome organization and progression through mitosis.
    source: "InterPro:IPR052484 abstract (LLM-generated, not curator-reviewed)"
