identifier: PANTHER:PTHR22237
label: "APC MEMBRANE RECRUITMENT PROTEIN 2-RELATED"
definition: >-
  This entry includes APC membrane recruitment protein 1/2/3 (Amer1/2/3). Amer1, also known as WTX, binds to the tumour suppressor adenomatous polyposis coli and acts as an inhibitor of Wnt signaling by inducing beta-catenin degradation. Amer2 is a negative regulator of Wnt/beta-catenin signaling involved in neuroectodermal patterning. WTX is a novel gene mutated in a proportion of Wilms' tumors and in patients suffering from sclerosing bone dysplasia.
