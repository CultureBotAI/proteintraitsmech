identifier: PANTHER:PTHR34252
label: "UPF0705 PROTEIN C11ORF49"
definition: >-
  Centriolar satellite-associated tubulin polyglutamylase complex regulator 1 (CSTPP1, previously referred to as C11orf49) is a regulator of the tubulin polyglutamylase complex (TPGC) that controls cytoskeletal organization, nuclear shape, and cilium disassembly by balancing microtubule and actin assembly. Disruption of CSTPP1-TPGC leads to developmental defects.
