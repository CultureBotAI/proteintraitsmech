identifier: PANTHER:PTHR35804
label: "LYSINE EXPORTER LYSO"
definition: >-
  Members of this family contain a conserved core of four predicted transmembrane segments. Some members have an additional pair of N-terminal transmembrane helices. This entry includes lysine exporter LysO (YbjE) from E. coli.
