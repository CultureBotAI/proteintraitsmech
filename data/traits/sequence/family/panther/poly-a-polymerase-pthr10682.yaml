identifier: PANTHER:PTHR10682
label: "POLY A  POLYMERASE"
definition: >-
  POLY A POLYMERASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR10682. PANTHER protein class: mRNA polyadenylation factor, RNA metabolism protein. Members are annotated with the molecular function adenylyltransferase activity, transferase activity, catalytic activity. Members participate in mRNA polyadenylation, mRNA 3'-end processing, RNA 3'-end processing. Members localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
