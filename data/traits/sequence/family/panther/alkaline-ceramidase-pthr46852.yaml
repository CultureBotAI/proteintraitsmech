identifier: PANTHER:PTHR46852
label: "ALKALINE CERAMIDASE"
definition: >-
  This entry represents a group of plant alkaline ceramidases, including AtACER from Arabidopsis. AtACER is an alkaline ceramidase that hydrolyses ceramide to long-chain base (LCB). It is involved in sphingolipid metabolism, disease resistance, nutrient limitation, and response to salt stress.
