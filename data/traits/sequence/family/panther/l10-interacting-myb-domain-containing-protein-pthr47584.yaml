identifier: PANTHER:PTHR47584
label: "L10-interacting MYB domain-containing protein"
definition: >-
  L10-interacting MYB domain-containing protein (LIMYB) is a transcriptional repressor that associates with ribosomal protein promoters. It interacts with NIK1, a leucine-rich repeat receptor-like kinase (LRR-RLK), the virulence target of the begomovirus nuclear shuttle protein, leading to global translation suppression as an antiviral immunity strategy in plants.
