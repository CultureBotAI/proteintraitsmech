  - kind: GENERAL
    text: >-
      The tRNA nucleotidyltransferase/poly(A) polymerase family is involved in the synthesis of the tRNA CCA terminus, which is crucial for proper tRNA function and protein synthesis. Members of this family add the terminal adenosine residue to tRNA, and in some cases, can also add cytidine residues. The enzymes adopt a seahorse-like shape with distinct head, neck, body, and tail domains. While primarily functioning as tRNA nucleotidyltransferases, they do not act as poly(A) polymerases. The activity of these enzymes ensures the maturation and functionality of tRNA molecules by completing the CCA end, which is essential for amino acid attachment and subsequent translation.
    source: "InterPro:IPR052390 abstract (LLM-generated, not curator-reviewed)"
