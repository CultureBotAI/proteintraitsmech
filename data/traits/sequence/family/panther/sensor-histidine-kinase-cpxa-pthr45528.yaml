identifier: PANTHER:PTHR45528
label: "SENSOR HISTIDINE KINASE CPXA"
definition: >-
  This protein family is comprised of sensor histidine kinases that are part of two-component regulatory systems, which are prevalent in bacterial signal transduction. This entry includes Heme sensor protein HssS from Staphylococcus haemolyticus, a member of the two-component regulatory system HssS/HssR, which is involved in heme homeostasis and virulence modulation, and Signal transduction histidine-protein kinase ArlS from Staphylococcus aureus, a member of the two-component regulatory system ArlS/ArlR involved in the regulation of adhesion, autolysis, multidrug resistance and virulence. These kinases typically function as membrane-associated sensors that autophosphorylate a histidine residue in response to environmental stimuli. The phosphoryl group is then transferred to a response regulator, which modulates the expression of target genes. The family plays a crucial role in various cellular processes including virulence, stress response, biofilm formation, and intracellular homeostasis.
