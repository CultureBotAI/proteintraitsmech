identifier: PANTHER:PTHR34290
label: "SI:CH73-390P7.2"
definition: >-
  This entry includes DCC1 (thioredoxin DXXCXXC motif-containing protein 1, AT5G50100) from Arabidopsis thaliana, which belongs to the thiol-disulfide oxidoreductase family. Members of this family contain a conserved DxxCxxC motif in their N-terminal. Two Cys residues present in this motif determined the function of these proteins as Thioredoxins (Trxs), key enzymes for modulating ROS scavenging through the reduction of specific S-S groups. DCC1 is localised in mitochondria and directly interacts with CARBONIC ANHYDRASE2 (CA2), an essential subunit of the respiratory chain NADH dehydrogenase complex (Complex I). DCC1 catalyses a redox modification on CA2, resulting in the regulation of Complex I activity and ROS homeostasis which is important for de novo shoot initiation and improvement the capacity of plant regeneration. This entry also includes uncharacterised proteins from bacteria.
definition_source: "InterPro:IPR044691 abstract (PANTHER PTHR34290 is a member signature)"
