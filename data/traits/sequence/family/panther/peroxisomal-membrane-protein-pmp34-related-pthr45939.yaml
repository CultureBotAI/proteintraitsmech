identifier: PANTHER:PTHR45939
label: "PEROXISOMAL MEMBRANE PROTEIN PMP34-RELATED"
definition: >-
  This family of proteins includes mitochondrial and peroxisomal transporters that are involved in the translocation of various cofactors across the organelle membranes. Members of this family are characterized by their ability to transport molecules such as coenzyme A (CoA), flavin adenine dinucleotide (FAD), flavin mononucleotide (FMN), and nucleotide adenosine monophosphate (AMP), among others. Some proteins in this family are suggested to function through a counter-exchange mechanism, allowing the import of these cofactors into the peroxisomal matrix from the cytosol. Additionally, these proteins lack typical peroxisomal sorting signals and have regions necessary for peroxisome-targeting activity. The family is part of the larger mitochondrial carrier superfamily, which is known for its role in the transport of metabolites and nucleotides across mitochondrial membranes.
