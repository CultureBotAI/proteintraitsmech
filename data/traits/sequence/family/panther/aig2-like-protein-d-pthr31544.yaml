identifier: PANTHER:PTHR31544
label: "AIG2-LIKE PROTEIN D"
definition: >-
  Gamma-glutamyl cyclotransferases (GGCTs) are ubiquitous enzymes found in bacteria, plants, and metazoans. This family includes AIG2 proteins from Arabidopsis, which exhibit RPS2- and avrRpt2-dependent induction early after infection with Pseudomonas syringae pv maculicola strain ES4326 carrying avrRpt2. Its structure consists of a five-stranded β-barrel surrounded by two α-helices and a small β-sheet. A long flexible α-helix protrudes from the structure at the C-terminal end. Conserved residues in a hydrophilic cavity, which are able to bind small ligands, may act as an active site in AIG2-like proteins.
definition_source: "InterPro:IPR045038 abstract (PANTHER PTHR31544 is a member signature)"
