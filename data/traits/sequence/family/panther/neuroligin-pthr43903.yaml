identifier: PANTHER:PTHR43903
label: NEUROLIGIN
definition: >-
  This family of proteins includes cell surface molecules involved in cell-cell interactions, particularly in the nervous system. Members of this family interact with neurexin family proteins to mediate synapse function and synaptic signal transmission. They play roles in the formation and maintenance of synaptic junctions, clustering of synaptic proteins, and modulation of signaling by inhibitory synapses. Some members are involved in the digestion of dietary lipids, hydrolyzing a range of substrates for nutrient absorption. They are also implicated in the protection of neurons against oxidative stress and in the development of the nervous system.
