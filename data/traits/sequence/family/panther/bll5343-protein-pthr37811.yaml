  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with monooxygenase activity that are involved in the modification of jasmonate, a plant hormone. Specifically, these proteins are capable of hydroxylating jasmonate to produce 12-hydroxyjasmonate, also known as tuberonic acid. This modification can influence plant innate immunity, potentially playing a role in the interaction between pathogens and host plants. Members of this family may also be associated with a secondary metabolism gene cluster, suggesting a possible involvement in the synthesis of other metabolites, including efflux substrates and polyketides.
    source: "InterPro:IPR052936 abstract (LLM-generated, not curator-reviewed)"
