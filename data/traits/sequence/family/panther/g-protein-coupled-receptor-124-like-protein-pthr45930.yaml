  - kind: GENERAL
    text: >-
      The Adhesion G protein-coupled receptor A family is involved in various signaling pathways and cellular processes. Members of the family function as receptors that play key roles in the planar cell polarity pathway, central nervous system vascularization, and the establishment of the blood-brain barrier. They act as coactivators of canonical Wnt signaling, assembling complexes essential for Wnt7-specific responses. Some members interact with extracellular matrix components and are implicated in cell adhesion and migration. The family includes orphan receptors whose precise functions are yet to be fully elucidated.
