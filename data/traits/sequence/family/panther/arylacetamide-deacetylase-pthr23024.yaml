identifier: PANTHER:PTHR23024
label: "ARYLACETAMIDE DEACETYLASE"
definition: >-
  The protein family is characterised by enzymes that predominantly exhibit carboxylesterase activity, acting on various esters with differing acyl chain lengths. Members of the family are involved in diverse biological processes, including the biosynthesis of mycotoxins such as sterigmatocystin and aflatoxins, the formation of plant defense chemicals like tulipalins, and the metabolism of xenobiotic compounds. They play roles in the biosynthesis of phytohormones and monoterpenoid indole alkaloids, and in lipid metabolism by hydrolysing triglycerides. Some family members also function as receptors for the plant hormone gibberellin, mediating growth and development responses. The family includes lactone-forming carboxylesterases that catalyse intramolecular transesterifications, and enzymes involved in the detoxification and degradation of plant-produced benzoxazolinones.
definition_source: "InterPro:IPR050466 abstract (PANTHER PTHR23024 is a member signature)"
