identifier: PANTHER:PTHR12307
label: "PROTEIN PHOSPHATASE 1 REGULATORY SUBUNIT"
definition: >-
  This family of proteins acts as regulatory subunits for protein phosphatase 1 (PP1), a serine/threonine-specific phosphatase involved in a variety of cellular processes. Members of this family target PP1 to glycogen particles and regulate its activity in glycogen metabolism. They play a crucial role in the activation of glycogen synthase, which facilitates glycogen synthesis, and in the inhibition of glycogen phosphorylase, thereby limiting glycogen breakdown. These proteins contain distinct regions responsible for binding to PP1, glycogen, and various enzymes involved in glycogen metabolism, such as glycogen phosphorylase and glycogen synthase. Some members are known to possess a carbohydrate-binding module (CBM21) that is involved in localizing to glycogen. The activity of these proteins is essential for the regulation of glycogen storage, particularly in response to insulin stimulation, and they may have roles in cell division, muscle contractility, and protein synthesis.
