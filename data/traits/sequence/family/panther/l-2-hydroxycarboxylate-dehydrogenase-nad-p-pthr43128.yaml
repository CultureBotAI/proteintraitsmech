label: "L-2-HYDROXYCARBOXYLATE DEHYDROGENASE (NAD(P)(+))"
definition: >-
  L-2-HYDROXYCARBOXYLATE DEHYDROGENASE (NAD(P)(+)) — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43128. PANTHER protein class: dehydrogenase, metabolite interconversion enzyme. Members are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Members participate in monocarboxylic acid metabolic process.
