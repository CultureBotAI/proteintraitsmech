identifier: PANTHER:PTHR48458
label: "SET DOMAIN-CONTAINING PROTEIN"
definition: >-
  This family of proteins includes histone-lysine N-methyltransferases that are responsible for the monomethylation of 'Lys-27' on histone H3 (H3K27me1). These enzymes exhibit a preference for nucleosomes containing the H3.1 variant over H3.3. They play a crucial role in the establishment of constitutive heterochromatin, contributing to the silencing of heterochromatic regions. Additionally, they are involved in the regulation of rRNA gene expression by influencing the expression or silencing of specific rRNA gene variants.
definition_source: "InterPro:IPR053114 abstract (PANTHER PTHR48458 is a member signature)"
