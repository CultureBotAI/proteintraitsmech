  - kind: GENERAL
    text: >-
      This family of proteins includes members that are part of the major facilitator superfamily (MFS), which are known to facilitate the transport of a variety of substrates across cellular membranes. Specifically, this family is associated with the Drug:H(+) antiporter-3 (DHA3) group within the MFS, indicating a role in the antiport of drugs and protons across the membrane. This transport activity is typically driven by a proton motive force and is important for the cellular efflux of toxic compounds, contributing to multidrug resistance in bacteria.
    source: "InterPro:IPR053160 abstract (LLM-generated, not curator-reviewed)"
