label: "N-ACETYLGLUCOSAMINYL-PHOSPHATIDYLINOSITOL BIOSYNTHETIC PROTEIN"
definition: >-
  N-ACETYLGLUCOSAMINYL-PHOSPHATIDYLINOSITOL BIOSYNTHETIC PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45871. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 2 of its annotated subfamilies. Subfamilies are annotated with the molecular function acetylglucosaminyltransferase activity. Subfamilies participate in GPI anchor biosynthetic process, phosphatidylinositol biosynthetic process, lipoprotein biosynthetic process. Subfamilies localise to endoplasmic reticulum, endoplasmic reticulum membrane, nuclear outer membrane-endoplasmic reticulum membrane network.
