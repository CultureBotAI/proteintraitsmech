identifier: PANTHER:PTHR12113
label: "DICKKOPF3-LIKE 3"
definition: >-
  This entry includes Dickkopf-related proteins 1-4 (DKK1-4). The Dickkopf (Dkk) proteins are cysteine-rich secretory proteins and highly conserved inhibitors of the canonical Wnt signalling pathway, which play key roles in many essential biological processes.
