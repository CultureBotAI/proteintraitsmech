identifier: PANTHER:PTHR46414
label: "PROTEIN BHLHB9-RELATED"
definition: >-
  This entry includes a group of GPCR-associated sorting proteins, including GASP1, GASP2 and GASP3 (also known as BHLHb9/p60TRP). GASP3/BHLHb9 modulates the phosphorylation and proteolytic processing of amyloid precursor protein (App), N-catherin (Cdh), presenilin (Psen) and tau protein, which might be a new therapeutic target for the treatment of Alzheimer's disease. It also regulates Ngf-dependent neuronal survival and differentiation, promoting neurosynaptogenesis. GASP3 is expressed in central nervous system, heart and skeletal muscle, conferring a possible involvement in cardiovascular functions. GASP-1 regulates the degradation of several GPCRs that traffic to lysosomes after agonist-induced endocytosis. It also interacts with Beclin 2, which is essential for GPCR degradation. GASP-2 is thought to play a role in the regulation of a variety of GPCRs.
