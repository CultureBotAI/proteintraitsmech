identifier: PANTHER:PTHR13412
label: "T-CELL IMMUNOMODULATORY PROTEIN HOMOLOG"
definition: >-
  T-cell immunomodulatory protein (Tip) is a modulator of T-cell function. It has a protective effect in graft versus host disease model and may protect the parasite against attack by the host immune system by immunomodulation. This entry also includes LINKIN from C. elegans. LINKIN is a transmembrane protein required for maintaining tissue integrity through cell adhesion and apical polarization. It is suggested to be an adhesion molecule that uses its extracellular domain to bind molecules on the surface of neighbouring cells and its intracellular domain to regulate microtubule dynamics.
definition_source: "InterPro:IPR024881 abstract (PANTHER PTHR13412 is a member signature)"
