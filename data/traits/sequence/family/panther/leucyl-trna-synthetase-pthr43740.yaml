identifier: PANTHER:PTHR43740
label: "LEUCYL-TRNA SYNTHETASE"
definition: >-
  Leucine-tRNA ligase ( ) is an alpha monomer that belongs to class Ia. The crystal structure of leucine-tRNA ligase from the hyperthermophile Thermus thermophilus has an overall architecture that is similar to that of isoleucine-tRNA ligase, except that the putative editing domain is inserted at a different position in the primary structure. This feature is unique to prokaryote-like leucine-tRNA ligases, as is the presence of a novel additional flexibly inserted domain. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 2'-hydroxyl of the tRNA, whereas class II synthetases preferentially use the 3'-hydroxyl site. Class I includes synthetases specific for arginine, cysteine, glutamic acid, glutamine, isoleucine, leucine, methionine, tyrosine, tryptophan, valine, and some lysine synthetases (non-eukaryotic). Class II includes those specific for alanine, asparagine, aspartic acid, glycine, histidine, phenylalanine, proline, serine, threonine, and some lysine synthetases (non-archaeal). Based on their
definition_source: "InterPro:IPR002302 abstract (PANTHER PTHR43740 is a member signature)"
