identifier: PANTHER:PTHR36884
label: "FIP1[III]-LIKE PROTEIN"
definition: >-
  This entry includes FIPS5 and FIPS3 from Arabidopsis, components of the cleavage and polyadenylation specificity factor (CPSF) complex that plays a key role in pre-mRNA 3'-end formation, recognising the AAUAAA signal sequence and interacting with poly(A) polymerase and other factors to bring about cleavage and poly(A) addition. FIPS5 is an homologue of yeast Fip1, which is a subunit providing a bridge of sorts between poly(A) polymerase, other subunits of the polyadenylation apparatus, and the substrate RNA. It is an RNA-binding protein that plays an role in plant development and stress responses.
