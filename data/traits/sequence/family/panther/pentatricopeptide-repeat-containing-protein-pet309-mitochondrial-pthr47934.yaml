  - kind: GENERAL
    text: >-
      PENTATRICOPEPTIDE REPEAT-CONTAINING PROTEIN PET309, MITOCHONDRIAL — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47934. Members are annotated with the molecular function mRNA binding, organic cyclic compound binding. Members participate in cellular aromatic compound metabolic process, heterocycle metabolic process, macromolecule biosynthetic process. Members localise to cytoplasm, membrane-bounded organelle, mitochondrion.
