identifier: PANTHER:PTHR10211
label: "DEOXYRIBODIPYRIMIDINE PHOTOLYASE"
definition: >-
  This family of proteins is involved in the cellular response to ultraviolet (UV) radiation-induced DNA damage. Members of this family catalyze the light-dependent repair of cyclobutyl pyrimidine dimers, which are DNA lesions formed between adjacent pyrimidine bases on the same DNA strand after exposure to UV light. The repair process, known as photoreactivation, involves the monomerization of these dimers, restoring the DNA to its undamaged state. This activity is crucial for maintaining genomic integrity and is necessary for organismal survival under UV-B light. The proteins are not responsible for repairing other types of UV-induced DNA damage, such as (6-4) photoproducts.
