identifier: PANTHER:PTHR13227
label: "EUKARYOTIC TRANSLATION INITIATION FACTOR 2A"
definition: >-
  Eukaryotic initiation factor 2A (eIF2A) directly binds the initiator methionyl-tRNA (Met-tRNA(i)) to 40 S ribosomal subunits in a codon-dependent manner. It may act by impiging the expression of specific proteins.
