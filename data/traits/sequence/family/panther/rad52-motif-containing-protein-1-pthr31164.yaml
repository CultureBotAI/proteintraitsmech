identifier: PANTHER:PTHR31164
label: "RAD52 MOTIF-CONTAINING PROTEIN 1"
definition: >-
  RAD52 motif-containing protein 1 (RDM1) is involved in DNA damage repair pathway and the cell response to the anti-cancer drug cisplatin. RDM1 contains a small RD motif that is shared with the recombination and repair protein RAD52, and an RNA recognition motif (RRM). The RD motif is responsible for the acidic pH-dependent DNA-binding properties of RDM1. It interacts with ss- and dsDNA, and may act as a DNA-damage recognition factor by recognizing the distortions of the double helix caused by cisplatin-DNA adducts in vitro. In addition, due to the presence of RRM, RDM1 can bind to RNA as well as DNA.
definition_source: "InterPro:IPR040224 abstract (PANTHER PTHR31164 is a member signature)"
