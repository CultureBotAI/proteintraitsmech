identifier: PANTHER:PTHR38147
label: "5-FORMAMINOIMIDAZOLE-4-CARBOXAMIDE-1-(BETA)-D-RIBOFURANOSYL 5'-MONOPHOSPHATE SYNTHETASE-RELATED"
definition: >-
  This entry represents the 5-formaminoimidazole-4-carboxamide-1-(beta)-D-ribofuranosyl 5'-monophosphate synthetase also known as PurP. The last two steps of de novo purine biosynthesis are: i) conversion of 5-aminoimidazole-4-carboxamide-1-beta-D-ribofuranosyl 5'-monophosphate (AICAR) to 5-formaminoimidazole-4-carboxamide-1-beta-D-ribofuranosyl 5'-monophosphate (FAICAR) ii) conversion of FAICAR to inosine5'-monophopsphate (IMP) In bacteria and eukaryotes, these steps are catalysed by the well-characterised bifunctional enzyme PurH. Archaea do not appear to posses PurH, however, and perform these reactions by a different mechanism. In archaea, step i) is catalysed by the well-conserved PurP protein, while step ii) is catalysed by the PurO enzyme in some (though not all) species.
definition_source: "InterPro:IPR023656 abstract (PANTHER PTHR38147 is a member signature)"
