identifier: PANTHER:PTHR14796
label: "NEURENSIN 1-RELATED"
definition: >-
  Neurensin-1 is a vesicular membrane protein expressed exclusively in brain that may play an important role in vesicular organelles transport and nerve signals. Neurensin-2 is also expressed in neural cells, but with a different intracellular localisation: neurensin-1 was found mainly in neuritic processes, while neurensin-2 is found in cell bodies.
