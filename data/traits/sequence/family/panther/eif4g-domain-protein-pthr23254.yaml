definitions:
  - kind: GENERAL
    text: >-
      EIF4G DOMAIN PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23254. PANTHER protein class: RNA metabolism protein. Members are annotated with the molecular function translation regulator activity, nucleic acid binding. and participate in regulation of primary metabolic process, regulation of amide metabolic process, regulation of protein metabolic process.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the regulation of mRNA translation. Members of the family function as coactivators in translation initiation, interacting with polyadenylate-binding proteins to enhance translation of poly(A)-containing mRNAs. Some members are implicated in the replication-dependent translation of histone mRNAs, which lack a poly-A tail and end with a stem-loop, potentially aiding in mRNA circularization to enhance translation. Additionally, certain proteins within the family are involved in the pioneer round of mRNA translation mediated by the cap-binding complex and play a role in nonsense-mediated mRNA decay. The family also includes proteins that may be involved in translationally coupled mRNA turnover and are implicated in the interplay of mRNA decay and translation.
    source: "InterPro:IPR051367 abstract (LLM-generated, not curator-reviewed)"
