identifier: PANTHER:PTHR31382
label: "NA(+)/H(+) ANTIPORTER"
definition: >-
  This entry represents a group of fungal Na+/H+ antiporters, including Nha1 from budding yeasts and Sod2 (SPAC977.10) from fission yeasts. Nha1 is involved in sodium and potassium efflux through the plasma membrane. It plays a role in the homeostatic regulation of the plasma membrane potential. Sod2 is a Na+/H+ exchanger that is responsible for salt tolerance. The structure of Sod2 has been revealed.
