identifier: PANTHER:PTHR30547
label: "UNCHARACTERIZED PROTEIN YHCG-RELATED"
definition: >-
  This family of proteins includes putative nucleases that may play a role in DNA recombination and repair processes. Members are characterized by the presence of a PD-(D/E)XK-like nuclease domain, which suggests they have the ability to interact with and cleave nucleic acid substrates.
