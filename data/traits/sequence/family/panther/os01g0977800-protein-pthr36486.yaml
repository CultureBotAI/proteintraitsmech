  - kind: GENERAL
    text: >-
      This family of proteins includes guanine nucleotide-binding proteins that act as modulators or transducers in various transmembrane signaling systems. They specifically bind GTP and are implicated in the regulation of cell proliferation during root morphogenesis. Additionally, members of this family serve as positive regulators in pathogen resistance, particularly in pathways involving salicylic acid. They are also known to influence the DNA binding activity of certain proteins, thereby activating genes integral to floral initiation.
