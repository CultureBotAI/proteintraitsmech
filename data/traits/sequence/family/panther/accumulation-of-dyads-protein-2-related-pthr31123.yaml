  - kind: GENERAL
    text: >-
      The acetate uptake transporter family is involved in the transport of acetate and ammonia across the cell membrane. Members of the family play various roles in cellular metabolism and regulation, including the uptake of acetate for biosynthesis processes, such as the production of mycotoxins like patulin, and the export of ammonia. Some proteins in the family are implicated in the adaptation of cell metabolism to utilize acetic acid, potentially affecting membrane ATPases and the repression of glyoxylate cycle enzymes. Others are involved in meiotic processes or are upregulated in response to specific cellular conditions, such as the absence of mitochondrial DNA. The family's functions are essential for the regulation of metabolic pathways and cellular responses to environmental changes.
    source: "InterPro:IPR051633 abstract (LLM-generated, not curator-reviewed)"
