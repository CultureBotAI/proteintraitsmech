identifier: PANTHER:PTHR47023
label: "SEX PEPTIDE RECEPTOR"
definition: >-
  This family of proteins includes G-protein coupled receptors that interact with diverse ligands to mediate various physiological responses. Members are involved in controlling reproductive behaviors and sleep homeostasis in Drosophila, as well as aversive gustatory associative learning and long-term memory formation in Caenorhabditis elegans. They function by modulating the synaptic output of neurons and activating transcription factors, which are crucial for behavioral adaptations and memory processes.
