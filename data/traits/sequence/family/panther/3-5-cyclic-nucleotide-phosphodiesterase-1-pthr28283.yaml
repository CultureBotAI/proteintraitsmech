identifier: PANTHER:PTHR28283
label: "3',5'-CYCLIC-NUCLEOTIDE PHOSPHODIESTERASE 1"
definition: >-
  Cyclic-AMP phosphodiesterase (EC:3.1.4.17) (PDE) catalyses the hydrolysis of cAMP to the corresponding nucleoside 5' monophosphate. On the basis of sequence similarity, most PDEs can be grouped together, but some enzymes lie apart from the main family and represent a second distinct class that includes PDEs from Dictyostelium and yeast. This entry contains class-II cyclic-AMP phosphodiesterases.
