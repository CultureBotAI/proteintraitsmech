identifier: PANTHER:PTHR47597
label: "IS A MEMBER OF THE PF|00364 BIOTIN-REQUIRING ENZYMES FAMILY-RELATED"
definition: >-
  This family of proteins includes components of the acetyl coenzyme A carboxylase complex. Members of this family are involved in the initial carboxylation of biotin by biotin carboxylase and the subsequent transfer of the carboxyl group to acetyl-CoA to form malonyl-CoA, a critical step in fatty acid biosynthesis.
