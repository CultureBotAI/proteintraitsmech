identifier: PANTHER:PTHR47700
label: "V CHITINASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_6G13720)-RELATED"
definition: >-
  This family of proteins includes enzymes that exhibit exochitinase activity, which is involved in the degradation of chitin. Some members of this family are part of a multi-subunit toxin complex where one subunit acts as an exochitinase, contributing to the interaction with sensitive cells. This interaction facilitates the entry of another subunit, which is the active toxin component, into the target cell. The family is related to the glycosyl hydrolase 18 family, indicating a shared catalytic mechanism in chitin hydrolysis. This entry also includes Secreted chitinase LysM(11/12/19) and Secreted LysM effector LysM(3/6/9/14/17) with a role in sequestration of chitin oligosaccharides to dampen host defense.
definition_source: "InterPro:IPR053214 abstract (PANTHER PTHR47700 is a member signature)"
