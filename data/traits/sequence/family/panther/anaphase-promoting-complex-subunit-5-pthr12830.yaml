identifier: PANTHER:PTHR12830
label: "ANAPHASE-PROMOTING COMPLEX SUBUNIT 5"
definition: >-
  Apc5 is a subunit of the eukaryotic anaphase-promoting complex/cyclosome (APC/C) which is a multi-subunit ubiquitin ligase that mediates the proteolysis of cell cycle proteins in mitosis and G1. Although Apc5 does not contain a classical RNA binding domain, it binds the poly(A) binding protein (PABP), which directly binds the internal ribosome entry site (IRES) of growth factor 2 mRNA. This entry also includes two Apc5 paralogues from C. elegans: such-1 and gfi-3. They are coexpressed in the germline but have nonoverlapping expression patterns in other tissues. They have a redundant function during the meiotic divisions.
definition_source: "InterPro:IPR037679 abstract (PANTHER PTHR12830 is a member signature)"
