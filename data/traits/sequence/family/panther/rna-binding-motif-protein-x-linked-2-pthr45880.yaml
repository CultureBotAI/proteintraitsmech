  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various aspects of RNA processing, particularly pre-mRNA splicing. Some proteins in this family act as components of the spliceosome, a complex responsible for the removal of introns from pre-mRNA transcripts. They may participate in the assembly of the spliceosome or function within the activated spliceosome, contributing to the splicing of U12-type introns. Additionally, certain members are implicated in the retention of nuclear pre-mRNA and may influence the splicing of transcripts through the regulation of mRNA splicing factors. One member is specifically noted for its role in male sexual differentiation by regulating the mRNA splicing of sex determination genes.
    source: "InterPro:IPR051847 abstract (LLM-generated, not curator-reviewed)"
