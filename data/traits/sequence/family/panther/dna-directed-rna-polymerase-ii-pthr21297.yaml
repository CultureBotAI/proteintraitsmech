identifier: PANTHER:PTHR21297
label: "DNA-DIRECTED RNA POLYMERASE II"
definition: >-
  Rpb4 is a subunit of, the RNA polymerase II core enzyme (RNAP II). It forms a heterodimeric complex with Rpb7 that is essential for promoter-directed transcription initiation. The Rpb4-Rpb7 subcomplex is necessary for promoter-directed transcription initiation but is not required for recruitment of Pol II to active preinitiation complexes and seems to be dispensable for transcription elongation and termination.
