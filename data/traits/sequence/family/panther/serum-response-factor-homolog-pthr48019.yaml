identifier: PANTHER:PTHR48019
label: "SERUM RESPONSE FACTOR HOMOLOG"
definition: >-
  This entry represents Floral homeotic protein AGAMOUS and other MADS-related transcription factors in plants and fungi. This entry also includes Serum response factors from vertebrates. The MADS-box/MEF2 family proteins are transcription factors that play crucial roles in various developmental processes across a wide range of organisms. In plants, they are predominantly involved in the regulation of flower development, controlling floral organ identity, meristem determinacy, and flowering time. They function through the formation of homo- and heterodimers, which bind to specific DNA sequences to regulate gene expression. Some family members are also implicated in root development, seed development, and response to environmental cues like vernalization. In animals, MEF2 family members are key regulators of muscle development, neuronal differentiation, and survival, with additional roles in cell growth, survival, and apoptosis. They bind to MEF2 elements in gene promoters and are involved in muscle-specific, growth factor-induced, and stress-induced gene expression.
definition_source: "InterPro:IPR050142 abstract (PANTHER PTHR48019 is a member signature)"
