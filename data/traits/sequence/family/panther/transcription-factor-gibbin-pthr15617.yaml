identifier: PANTHER:PTHR15617
label: "TRANSCRIPTION FACTOR GIBBIN"
definition: >-
  Transcription factor Gibbin, also known as AT-hook DNA-binding motif-containing protein 1 (AHDC1), is a transcription factor required for the proper patterning of the epidermis, which plays a key role in early epithelial morphogenesis. It directly binds promoter and enhancer regions and acts by maintaining local enhancer-promoter chromatin architecture. It interacts with many sequence-specific zinc-finger transcription factors and methyl-CpG-binding proteins to regulate the expression of mesoderm genes that wire surface ectoderm stratification. Truncating mutations in the gene lead to a syndrome in which patients suffered hypotonia, intellectual disability, global developmental delay, mildly dysmorphic facial features and in some cases sleep apnea.
definition_source: "InterPro:IPR039225 abstract (PANTHER PTHR15617 is a member signature)"
trait_axis: SEQUENCE
trait_category: SEQ_FAMILY
term_kind: CLASS
