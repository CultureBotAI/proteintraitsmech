  - kind: GENERAL
    text: >-
      This family of proteins is involved in cell fate determination during embryogenesis and plays a crucial role in auxin-dependent cell-fate specification and patterning. Members are essential for proper development of plant structures such as cotyledons, leaves, and roots. They regulate the expression and polarity of PIN-formed (PIN) proteins, which are critical for auxin transport and distribution, thus influencing processes like leaf vascular development, stem cell maintenance in meristems, and cellular patterning.
