identifier: PANTHER:PTHR47281
label: "OS09G0557700 PROTEIN"
definition: >-
  This entry represents the Cytochrome b561, DM13 and DOMON domain-containing protein At5g54830 from Arabidopsis thaliana (b561A). This protein is thought to act as a catecholamine-responsive trans-membrane electron transporter. Most members of this family are found in streptophytes.
