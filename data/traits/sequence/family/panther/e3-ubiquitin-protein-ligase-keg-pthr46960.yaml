identifier: PANTHER:PTHR46960
label: "E3 UBIQUITIN-PROTEIN LIGASE KEG"
definition: >-
  This entry represents a group of plant proteins, including KEG from Arabidopsis. KEG is a RING-type E3 ligase and a negative regulator of abscisic acid (ABA) signaling. ABA also promotes KEG degradation via the ubiquitin dependent 26S proteasome pathway. KEG can recruit the ENHANCED DISEASE RESISTANCE1 protein to trans-Golgi network/early endosome vesicles. KEG can also ubiquitinate and mediate the degradation of MKK4 and MKK5 to regulate plant immunity.
