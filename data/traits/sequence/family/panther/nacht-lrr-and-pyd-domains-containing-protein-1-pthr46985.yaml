  - kind: GENERAL
    text: >-
      The NLRP inflammasome family plays a crucial role in innate immunity and inflammation. Members of this family act as cytosolic pattern recognition receptors (PRRs) that detect pathogen-associated signals, leading to the assembly of inflammasome complexes. These complexes recruit and activate caspase-1, which processes pro-inflammatory cytokines IL1B and IL18 and induces pyroptosis, a form of cell death. The family includes sensors that recognize specific pathogens or cellular stress signals, such as Bacillus anthracis lethal toxin or Val-boroPro inhibitor. Autoproteolytic processing within the FIIND domain is a common feature, generating N-terminal and C-terminal parts that associate non-covalently. The C-terminal part often oligomerizes to form the core of the inflammasome filament, with CARD domains playing a central role in caspase recruitment and activation. Regulatory mechanisms include ubiquitination and proteasomal degradation, modulated by DPP8 and DPP9 peptidases. The family's activity is also linked to host resistance to infection and regulation of NF-kappa-B signaling pathways.
    source: "InterPro:IPR051249 abstract (LLM-generated, not curator-reviewed)"
