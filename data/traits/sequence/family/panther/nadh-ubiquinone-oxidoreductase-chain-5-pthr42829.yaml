identifier: PANTHER:PTHR42829
label: "NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 5"
definition: >-
  NADH-quinone oxidoreductase chain 5 is part of the NADH-ubiquinone oxidoreductase (complex I), which catalyses the transfer of two electrons from NADH to ubiquinone in a reaction that is associated with proton translocation across the membrane: NADH + ubiquinone = NAD(+) + ubiquinol This family includes NAD(P)H-quinone oxidoreductase subunit 5, organellar chromatophore 2 from the amoeba Paulinella chromatophora, which carries cyanobacterial genes in its cell nucleus. Probable inorganic carbon transporter subunit DabB is also part of this protein family. The sequence of this protein has been reported to be distantly related to complex I and cyanobacterial CO2-uptake system subunits. Homology between DabB and complex I subunits suggests cation transport without implying redox activity.
definition_source: "InterPro:IPR003945 abstract (PANTHER PTHR42829 is a member signature)"
