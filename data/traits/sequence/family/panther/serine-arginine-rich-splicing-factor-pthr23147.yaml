identifier: PANTHER:PTHR23147
label: "SERINE/ARGININE RICH SPLICING FACTOR"
definition: >-
  The Serine/Arginine-Rich Splicing Factor (SRSF) family is involved in various aspects of mRNA processing, particularly in pre-mRNA splicing. Members of this family play roles in constitutive and alternative splicing, influencing exon inclusion or skipping. They are also implicated in spliceosome assembly and intron recognition. Some SRSFs have functions in miRNA processing and pri-miRNA biogenesis. Additionally, certain SRSFs act as export adapters in mRNA nuclear export, interacting with NXF1-NXT1 and recognizing m6A-modified RNAs. Their RNA-binding activity is semi-sequence specific, and they may have developmental roles or contribute to the regulation of neuron-specific alternative splicing. The SRSF family is characterized by the presence of one or more RNA recognition motifs (RRMs) and an arginine/serine-rich domain, which is essential for their splicing regulatory functions.
