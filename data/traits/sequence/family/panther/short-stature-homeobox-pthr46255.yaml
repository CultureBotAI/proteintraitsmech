  - kind: GENERAL
    text: >-
      SHORT STATURE HOMEOBOX — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46255. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function sequence-specific double-stranded DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II. Members localise to nucleus, intracellular anatomical structure.
