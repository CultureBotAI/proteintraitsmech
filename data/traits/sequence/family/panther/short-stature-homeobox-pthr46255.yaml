  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that are characterized by the presence of a homeobox domain, which is indicative of their role in DNA binding and regulation of gene expression. Members of this family are implicated in growth regulation and developmental processes, including the formation of body structures and neural systems that process somatosensory information. Some members may also be involved in heart development. The functions of these proteins are critical for controlling fundamental aspects of growth and development, and they may have specific roles in skeletal patterning and morphogenesis.
    source: "InterPro:IPR052631 abstract (LLM-generated, not curator-reviewed)"
