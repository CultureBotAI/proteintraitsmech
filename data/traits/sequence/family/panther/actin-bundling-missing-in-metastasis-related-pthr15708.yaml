identifier: PANTHER:PTHR15708
label: "ACTIN BUNDLING/MISSING IN METASTASIS-RELATED"
definition: >-
  This entry represents a subgroup of I-BAR (Bin/amphipysin/Rvs) domain-containing proteins, including MIM (MTSS1) and MTSS2 (also known as ABBA or MTSS1-like). BAR domain forms an anti-parallel all-helical dimer, with a curved (banana-like) shape, that promotes membrane tubulation. BAR domain proteins can be classified into three types: BAR, F-BAR and I-BAR. BAR and F-BAR proteins generate positive membrane curvature, while I-BAR proteins induce negative curvature. Most I-BAR proteins, including MIM and MTSS2, have an additional C-terminal WH2 domain, which binds G-actin.
definition_source: "InterPro:IPR030127 abstract (PANTHER PTHR15708 is a member signature)"
