  - kind: GENERAL
    text: >-
      The CCA-adding enzyme family is responsible for the catalysis of the addition and repair of the essential 3'-terminal CCA sequence in tRNAs, a process that does not require a nucleic acid template. Members of this family sequentially add C, C, and A nucleotides to the tRNA nucleotide-73 using CTP and ATP as substrates, releasing inorganic pyrophosphate. The 3'-terminal CCA sequence is crucial for tRNA processing and repair, serving as the site for amino acid attachment during protein synthesis. Additionally, these enzymes participate in tRNA surveillance, marking unstable tRNAs with a CCACCA sequence for rapid degradation, thus distinguishing them from stable tRNAs that receive only the CCA end. The family's role is vital in maintaining the accuracy and efficiency of protein translation by ensuring the proper functioning of tRNAs.
    source: "InterPro:IPR050264 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
