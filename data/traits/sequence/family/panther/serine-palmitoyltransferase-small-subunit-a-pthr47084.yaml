definitions:
  - kind: GENERAL
    text: >-
      SERINE PALMITOYLTRANSFERASE SMALL SUBUNIT A — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47084. PANTHER protein class: protein modifying enzyme. Members are annotated with the molecular function palmitoyltransferase activity. and participate in amide biosynthetic process, membrane lipid metabolic process, cellular nitrogen compound biosynthetic process. and localise to endoplasmic reticulum protein-containing complex, protein-containing complex, endoplasmic reticulum.
