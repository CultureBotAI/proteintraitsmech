  - kind: GENERAL
    text: >-
      This family of proteins includes galactose- and N-acetylgalactosamine-binding lectins that are implicated in cell-substratum adhesion processes. Members of this family are thought to contribute to the maintenance of cell morphology during certain stages of cell aggregation. Additionally, some proteins within this family may play a role in spore formation and could be involved in the assembly of the spore coat. The functional diversity within this family reflects a range of biological processes related to cell adhesion and development.
