label: "GATA-TYPE DOMAIN-CONTAINING PROTEIN"
definition: >-
  GATA-TYPE DOMAIN-CONTAINING PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR45616. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 42 of its annotated subfamilies. Subfamilies are annotated with the molecular function structural molecule activity. Subfamilies participate in intermediate filament organization, epidermal cell differentiation, epidermis development. Subfamilies localise to keratin filament, intermediate filament cytoskeleton, extracellular region.
