definitions:
  - kind: GENERAL
    text: >-
      DNA PRIMASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR30313. PANTHER protein class: DNA metabolism protein, primase. Members are annotated with the molecular function 5'-3' RNA polymerase activity, DNA-directed 5'-3' RNA polymerase activity. Members participate in macromolecule biosynthetic process, nucleobase-containing compound biosynthetic process, DNA-templated DNA replication. Members localise to cytoplasm.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The DnaG primase family consists of RNA polymerases that synthesize short RNA molecules serving as primers for DNA polymerase during DNA replication. Members of this family are also involved in RNA degradation as part of the exosome complex and function as poly(A)-binding proteins, enhancing the interaction between heteromeric, adenine-rich transcripts and the exosome. The family includes proteins with an N-terminal zinc-binding domain, a central core domain with primase activity, and a C-terminal DnaB-binding domain. These enzymes are essential for DNA replication initiation and are found across various bacterial and archaeal species.
    source: "InterPro:IPR050219 abstract (LLM-generated, not curator-reviewed)"
