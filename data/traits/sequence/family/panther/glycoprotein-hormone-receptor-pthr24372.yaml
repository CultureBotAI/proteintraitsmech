identifier: PANTHER:PTHR24372
label: "GLYCOPROTEIN HORMONE RECEPTOR"
definition: >-
  GLYCOPROTEIN HORMONE RECEPTOR — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24372. PANTHER protein class: G-protein coupled receptor. Members are annotated with the molecular function G protein-coupled peptide receptor activity. Members participate in cellular response to hormone stimulus, positive regulation of adenylate cyclase activity, adenylate cyclase-activating G protein-coupled receptor signaling pathway. Members localise to plasma membrane.
