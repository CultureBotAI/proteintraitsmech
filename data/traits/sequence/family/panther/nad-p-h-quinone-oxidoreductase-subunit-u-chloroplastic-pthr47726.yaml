identifier: PANTHER:PTHR47726
label: "NAD(P)H-QUINONE OXIDOREDUCTASE SUBUNIT U, CHLOROPLASTIC"
definition: >-
  This entry represents a group of chaperone DnaJ-domain containing proteins, including NdhU (also known as CRRL, At5g21430) from Arabidopsis. NdhU is a subunit of chloroplast NDH, which shuttles electrons from NAD(P)H:plastoquinone, via FMN and iron-sulfur (Fe-S) centers, to quinones in the photosynthetic chain and possibly in a chloroplast respiratory chain.
