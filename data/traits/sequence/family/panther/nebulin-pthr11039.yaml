identifier: PANTHER:PTHR11039
label: NEBULIN
definition: >-
  This family of proteins is involved in the structural and functional organisation of sarcomeres, the basic contractile units of muscle fibres. Members of this family bind to actin, contributing to the assembly and stabilization of the Z-disk, which is critical for muscle contraction. This entry includes nebulin (NEBU) which is located in the thin filament of striated muscle in vertebrates and is thought to bind and stabilise F-actin. Nebulette (NEBL), is a nebulin homologue specific to cardiac muscle.
