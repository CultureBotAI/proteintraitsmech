identifier: PANTHER:PTHR31633
label: "H/ACA RIBONUCLEOPROTEIN COMPLEX NON-CORE SUBUNIT NAF1"
definition: >-
  Naf1 is an RNA-binding protein required for the maturation of box H/ACA snoRNPs complex and ribosome biogenesis. During assembly of the H/ACA snoRNPs complex, it associates with the complex, disappearing during maturation of the complex and being replaced by Gar1 to yield mature H/ACA snoRNPs complex. The core domain of Naf1 is homologous to the core domain of Gar1, suggesting that they share a common Cbf5 binding surface.
definition_source: "InterPro:IPR040309 abstract (PANTHER PTHR31633 is a member signature)"
