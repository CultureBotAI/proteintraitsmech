  - kind: GENERAL
    text: >-
      The mycobacterial A85 antigen family includes proteins that play a crucial role in the interaction of mycobacteria with host cells and the maintenance of cell wall integrity. Members of the family are involved in the high-affinity binding to fibronectin, a glycoprotein that facilitates the attachment of Mycobacterium tuberculosis to alveolar macrophages. They also participate in the synthesis of cell wall components by catalyzing the transfer of mycolic acids to arabinogalactan and the formation of trehalose dimycolate, also known as cord factor. Some family members exhibit diacylglycerol acyltransferase and mycolyltransferase activities, contributing to the biosynthesis of triacylglycerol and the cell wall's mycolic layer, respectively. The family's function is essential for the survival of mycobacteria, particularly under stress conditions, and is implicated in the pathogenesis of tuberculosis.
    source: "InterPro:IPR050583 abstract (LLM-generated, not curator-reviewed)"
