identifier: PANTHER:PTHR47727
label: "C-TYPE LECTIN DOMAIN FAMILY 9 MEMBER A"
definition: >-
  CLEC9A is a membrane protein with a single extracellular C-type lectin domain. It is expressed on the surface of the mouse and human dendritic cell subsets specialized for the uptake and processing of material from dead cells. It has been shown to bind filamentous form of actin and associates with actin-binding domains of cytoskeletal proteins.
