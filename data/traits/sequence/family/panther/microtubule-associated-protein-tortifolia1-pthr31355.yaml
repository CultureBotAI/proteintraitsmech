identifier: PANTHER:PTHR31355
label: "MICROTUBULE-ASSOCIATED PROTEIN TORTIFOLIA1"
definition: >-
  This entry includes a group of plant microtubule-associated proteins, including TORTIFOLIA1/SPIRAL2 and SPIRAL2-like (SP2L) from Arabidopsis. They regulate the orientation of cortical microtubules and the direction of organ growth. TORTIFOLIA1-like protein 1 (also known as SPIRAL2) may regulate katanin-based microtubule (MT) severing. During virus infection, it may stabilize MT crossovers to support the formation and intercellular spread of the viral RNA complexes. This entry also includes SINE 1 and 2, paralogous KASH proteins that function during stomatal dynamics induced by light-dark transitions and abscisic acid (ABA), which requires F-actin reorganisation. KASH proteins are outer nuclear membrane proteins part of the linker of nucleoskeleton and cytoskeleton (LINC) complexes and interact in the nuclear envelope lumen with inner nuclear membrane SUN proteins that connect the nucleus and cytoskeleton. SINE2 influences actin depolymerisation and SINE1 actin repolymerisation.
definition_source: "InterPro:IPR033337 abstract (PANTHER PTHR31355 is a member signature)"
