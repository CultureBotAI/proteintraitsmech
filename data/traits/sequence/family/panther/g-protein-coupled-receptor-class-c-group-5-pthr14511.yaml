identifier: PANTHER:PTHR14511
label: "G PROTEIN COUPLED RECEPTOR, CLASS C, GROUP 5"
definition: >-
  The G-protein coupled receptor 3 family is characterized by its members being retinoic acid-inducible G-protein coupled receptors, which suggests a potential interaction between retinoid and G-protein signaling pathways. Members of the family, such as Retinoic acid-induced protein 3, are implicated in modulating differentiation and maintaining epithelial cell homeostasis. They may also function as negative modulators of EGFR signaling and act as tumor suppressors in the lung. However, the exact functions of some members remain unknown, highlighting the family's role in diverse cellular processes and signaling mechanisms.
