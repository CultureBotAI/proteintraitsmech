identifier: PANTHER:PTHR46352
label: "PROTEIN SENSITIVE TO PROTON RHIZOTOXICITY 1"
definition: >-
  This entry represents a group of plant zinc finger proteins, including STOP1/STOP2 from Arabidopsis and their homologues, Os01g0871200/STAR3 from rice. They are putative transcription factors that regulate gene expression associated with multiple stress tolerances in plant roots. STOP1 (sensitive to proton rhizotoxicity 1) regulates transcription of multiple genes critical for tolerance to aluminum (Al) and low pH in Arabidopsis. STOP2 is a physiologically minor isoform of STOP1, but it can activate expression of some genes regulated by STOP1. In rice, ART1 (also known as STAR3) regulates multiple genes implicated in aluminum tolerance. WIP proteins form a plant specific subfamily of C2H2 zinc finger (ZF) proteins. Arabidopsis TRANSPARENT TESTA 1 protein (At1g34790, also known as WIP1 or TT1) may act as a transcriptional regulator involved in the differentiation of young endothelium. WIP2, also known as NTT, is a transcription factor that promotes replum development in Arabidopsis fruits.
definition_source: "InterPro:IPR044300 abstract (PANTHER PTHR46352 is a member signature)"
