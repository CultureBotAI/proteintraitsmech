identifier: PANTHER:PTHR33793
label: ALPHA-AGGLUTININ
definition: >-
  This entry includes a group of cell surface adhesion proteins mostly from fungi, including ALS1-9 from Candida albicans and Sga1 from Saccharomyces cerevisiae. ALS1-7 plays an important role in the pathogenesis of C.albicans infections. Sga1 promotes cellular aggregation during mating. ALS4498 mediates both yeast-to-host tissue adherence and yeast aggregation.
