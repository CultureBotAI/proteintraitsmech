identifier: PANTHER:PTHR12596
label: "EXPORTIN 4,7-RELATED"
definition: >-
  This entry includes Ran-binding protein 17 from humans and similar proteins. Exportins bind cargo molecules in the nuclei and transport them through nuclear pores to the cytoplasm, a process that requires RanGTP. XPO7 mediates the nuclear export of proteins with broad substrate specificity. They bind cooperatively to its cargo and to the GTPase Ran in its active GTP-bound form.
