identifier: PANTHER:PTHR47965
label: "ASPARTYL PROTEASE-RELATED"
definition: >-
  Peptidase family A1, also known as the pepsin family, contains peptidases with bilobed structures. The two domains most probably evolved from the duplication of an ancestral gene encoding a primordial domain. The active site is formed from an aspartic acid residue from each domain. Each aspartic acid occurs within a motif with the sequence D(T/S)G(T/S). Exceptionally, in the histoaspactic peptidase from Plasmodium falciparum, one of the Asp residues is replaced by His. A third essential residue, Tyr or Phe, is found on the N-terminal domain only in a β-hairpin loop known as the "flap"; this residue is important for substrate binding, and most members of the family have a preference for a hydrophobic residue in the S1 substrate binding pocket. Most members of the family are active at acidic pH, but renin is unusually active at neutral pH. Family A1 peptidases are found predominantly in eukaryotes (but examples are known from bacteria). Currently known eukaryotic aspartyl peptidases and homologues include the following: Vertebrate gastric pepsins A (EC:3.4.23.1), gastricsin (EC:3.4.23.3, also known pepsin C), chymosin (EC:3.4.23.4; formerly known as rennin), and cathepsin E (EC:3.4.23.34). Pepsin A is widely used in protein sequencing because of its limited and predictable specificity. Chymosin is used to clot milk for cheese making. Lysosomal cathepsin D (EC:3.4.23.5). Renin (EC:3.4.23.15) which functions in control of blood pressure by generating angiotensin I from angiotensinogen in the plasma. Memapsins 1 (EC:3.4.23.45; also known as BACE 2) and 2 (EC:3.4.23.46; also known as BACE) are membrane-bound and are able to perform one of the two cleavages (the beta-cleavage, hence they are also known as beta-secretases) in the beta-amyloid precursor to release the the amyloi
