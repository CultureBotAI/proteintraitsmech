definitions:
  - kind: GENERAL
    text: >-
      CYTOTOXIC AND REGULATORY T-CELL MOLECULE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR47118. Members are annotated with the molecular function signaling receptor binding. Members participate in positive regulation of natural killer cell mediated cytotoxicity, cell recognition, response to biotic stimulus. Members localise to plasma membrane, cell periphery.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins mediates heterophilic cell-cell adhesion and plays a crucial role in the regulation of T-cell activation, differentiation, and tissue retention. Members of this family interact with CADM1 to enhance NK cell cytotoxicity and IFNG secretion by CD8+ T-cells, as well as to facilitate NK cell-mediated tumor rejection. These proteins are involved in CD8+ T-cell proliferation following TCR activation and are important for the retention of activated CD8+ T-cells within lymph nodes. They also contribute to the intestinal retention of various T-cell subsets and promote adhesion to gut-associated dendritic cells. This interaction may support the expression of gut-homing molecules and the conversion of CD4+ T-cells into CD4+ CD8+ T-cells. Additionally, the extracellular domain of these proteins is implicated in the regulation of cytokine production, although it is not essential for late T-cell polarization.
    source: "InterPro:IPR053096 abstract (LLM-generated, not curator-reviewed)"
