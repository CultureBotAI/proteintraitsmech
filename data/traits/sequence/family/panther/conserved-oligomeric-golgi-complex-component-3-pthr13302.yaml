identifier: PANTHER:PTHR13302
label: "CONSERVED OLIGOMERIC GOLGI COMPLEX COMPONENT 3"
definition: >-
  This entry includes Conserved oligomeric Golgi complex subunit 3 (COG3, also known as Sec34), a component of the peripheral membrane COG complex that is involved in intra-Golgi protein trafficking. COG is a member of the complexes associated with tethering containing helical rods (CATCHR) family which also includes the exocyst, GARP and DSL1 complexes, which are evolutionarily related and share structural features consisting of α-helical bundles towards the C-terminal and an N-terminal coiled-coil region.
definition_source: "InterPro:IPR007265 abstract (PANTHER PTHR13302 is a member signature)"
