identifier: PANTHER:PTHR48030
label: "SPLICING FACTOR 3B SUBUNIT 4"
definition: >-
  This family of proteins is involved in the splicing of pre-mRNAs, a critical step in gene expression. Members of this family are components of the spliceosome, particularly the 17S U2 small nuclear ribonucleoprotein (snRNP) complex. They play a role in early spliceosome assembly and in recognizing the intron branch site during splicing. This recognition is crucial for selecting the branch-site adenosine, which acts as the nucleophile in the first step of splicing. The proteins are part of the SF3B subcomplex, which is necessary for the formation of the 'A' complex by stabilizing the binding of U2 snRNP to the pre-mRNA. Their binding upstream of the branch site is sequence-independent and may serve to anchor the U2 snRNP to the pre-mRNA. Additionally, they are implicated in the assembly of the 'E' complex and participate in the minor spliceosome responsible for splicing U12-type introns.
