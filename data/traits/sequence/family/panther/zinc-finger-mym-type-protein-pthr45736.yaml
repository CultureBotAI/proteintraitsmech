  - kind: GENERAL
    text: >-
      The Zinc finger MYM-type/QRICH1 protein family is involved in various cellular processes, including transcriptional regulation, cell morphology, cytoskeletal organization, and the integrated stress response (ISR). Members of the family function as transcriptional regulators, with some acting as mediators of the ISR by controlling protein homeostasis under ER stress conditions. They play roles in the unfolded protein response (UPR), influencing cell survival or death based on ER stress severity. Certain family members are implicated in the negative regulation of transcription, while others are associated with chondrocyte hypertrophy essential for bone growth. The CARD domain present in some members may regulate caspase activity during programmed cell death.
    source: "InterPro:IPR051284 abstract (LLM-generated, not curator-reviewed)"
