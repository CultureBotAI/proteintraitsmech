  - kind: GENERAL
    text: >-
      This family of proteins includes glutamic endopeptidases known for their ability to cleave peptide bonds preferentially on the C-terminal side of proline residues, although they can also target bonds on the C-terminal side of alanine residues with lower efficiency. Unlike many proline-cleaving enzymes, they can degrade proteins of various sizes. These enzymes are characterized by their moderate inhibition by pepstatin and EPNP, while being unaffected by POP inhibitors or denaturants like urea. Their presence in certain viscoelastic fluids suggests a role in the digestion of prey.
    source: "InterPro:IPR053168 abstract (LLM-generated, not curator-reviewed)"
