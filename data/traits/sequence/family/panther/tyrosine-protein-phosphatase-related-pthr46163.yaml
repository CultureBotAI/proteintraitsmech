identifier: PANTHER:PTHR46163
label: "TYROSINE-PROTEIN PHOSPHATASE-RELATED"
definition: >-
  This family of proteins includes inactive phosphatases and pseudophosphatases that are essential for the oocyte-to-zygote transition in Caenorhabditis elegans. Members of this family are involved in the regulation of the cortical actin cytoskeleton's polarization and rearrangement during oocyte maturation and post-fertilization. They function in a redundant manner to localize specific kinases and other proteins to the cortex and cytoplasmic foci, influencing kinase activity and ensuring proper cellular organization and eggshell formation. Additionally, some members contain N-terminal destruction box motifs that target them for proteasomal degradation.
