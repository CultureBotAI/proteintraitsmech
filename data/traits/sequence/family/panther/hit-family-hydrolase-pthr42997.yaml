identifier: PANTHER:PTHR42997
label: "HIT FAMILY HYDROLASE"
definition: >-
  This family of proteins is involved in the catabolism of diadenosine polyphosphates. Specifically, they catalyse the breakdown of diadenosine 5',5'''-P1,P4-tetraphosphate (Ap4A) into adenosine diphosphate (ADP) and adenosine triphosphate (ATP). These enzymes prefer substrates that are dinucleoside polyphosphates with four or five phosphate residues. They are characterised by their inability to perform the reverse reaction, which is the synthesis of Ap4A from ADP and ATP.
