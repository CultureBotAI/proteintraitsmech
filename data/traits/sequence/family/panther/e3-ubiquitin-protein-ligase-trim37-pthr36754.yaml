  - kind: GENERAL
    text: >-
      The TRIM/RBCC family includes E3 ubiquitin-protein ligases involved in various cellular processes. Members of this family play a crucial role in maintaining centrosome integrity by preventing centriole reduplication, likely through ubiquitination of proteins that promote this process. They also participate in epigenetic regulation by monoubiquitinating histone H2A at Lys-119, which is associated with transcriptional repression within Polycomb group (PcG) PRC2-like complexes. Additionally, they positively regulate peroxisome import by monoubiquitinating the peroxisomal import receptor PEX5, thereby stabilizing it and preventing its degradation. Some members also exhibit anti-HIV activity, contributing to the cellular defense against viral infection.
    source: "InterPro:IPR053003 abstract (LLM-generated, not curator-reviewed)"
