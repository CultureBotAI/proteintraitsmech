  - kind: GENERAL
    text: >-
      E3 UBIQUITIN-PROTEIN LIGASE TRIM37 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR36754. PANTHER protein class: ubiquitin-protein ligase, protein modifying enzyme. Members are annotated with the molecular function ubiquitin protein ligase activity, tumor necrosis factor receptor binding, ubiquitin protein ligase binding. Members participate in protein monoubiquitination, cellular component assembly, cellular component biogenesis. Members localise to peroxisomal membrane, cytoplasm.
