  - kind: GENERAL
    text: >-
      The L-aspartate N-monooxygenase (nitrosuccinate-forming) family is involved in the biosynthesis of various compounds with biological activity. Members of the family catalyze the iterative oxidation of L-aspartic acid to nitrosuccinic acid via intermediate steps involving N-hydroxyaspartic acid and nitrososuccinic acid. These enzymes play a role in the production of cremeomycin, a compound with antibacterial and antiproliferative properties, and desferrioxamine derivatives, which are potential siderophores due to their iron-binding capabilities.
