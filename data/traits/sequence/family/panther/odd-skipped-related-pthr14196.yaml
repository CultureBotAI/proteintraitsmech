definitions:
  - kind: GENERAL
    text: >-
      ODD-SKIPPED - RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR14196. PANTHER protein class: zinc finger transcription factor. Members are annotated with the molecular function RNA polymerase II transcription regulatory region sequence-specific DNA binding, DNA-binding transcription factor activity, RNA polymerase II-specific. Members participate in regulation of transcription by RNA polymerase II, embryo development. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is characterized by members that function predominantly as transcription factors or transcriptional repressors involved in various developmental processes. These proteins play key roles in embryonic development, including heart and urogenital system formation, leg joint formation, hindgut patterning, and morphogenesis. They are also implicated in the regulation of gene expression related to H2O2 metabolism, the mitochondrial apoptotic cascade, and cellular differentiation pathways such as adipocyte differentiation and osteoblast suppression. Some family members are involved in tooth formation and kidney development. The proteins typically contain C2H2-type zinc-finger domains, which are essential for DNA-binding and transcriptional regulation, and some possess additional domains like KRAB for transcriptional repression. The family includes proteins with diverse functions across different species, unified by their structural features and roles in transcriptional regulation.
    source: "InterPro:IPR050717 abstract (LLM-generated, not curator-reviewed)"
