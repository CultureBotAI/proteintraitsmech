  - kind: GENERAL
    text: >-
      This family of proteins includes lipid transfer proteins (LTPs) that are likely involved in the transport of lipid molecules. They may play roles in improving plant freezing survival, controlling flowering and lignin synthesis, and conferring resistance to certain pathogens like Botrytis cinerea and Pseudomonas syringae. Some members are implicated in systemic acquired resistance (SAR) and induced systemic resistance (ISR), suggesting a function in plant immunity. These proteins may also be involved in early seedling development under stress conditions and exhibit anti-fungal activity, potentially by affecting membrane permeability.
