identifier: PANTHER:PTHR46343
label: "HYR DOMAIN-CONTAINING PROTEIN"
definition: >-
  Sushi repeat-containing protein SRPX2 is a multifunctional protein that is involved in seizure disorders, angiogenesis and cellular adhesion. It acts as a ligand for the urokinase plasminogen activator surface receptor. The overexpression of SRPX2 enhances cellular migration and adhesion in gastric cancer cells. Mutations in SRPX2 gene cause rolandic epilepsy with speech dyspraxia and mental retardation X-linked (RESDX). Sushi repeat-containing protein SRPX is deleted in patients with X-linked retinitis pigmentosa. This entry includes SRPX and SRPX2.
