identifier: PANTHER:PTHR46280
label: "PLECKSTRIN HOMOLOGY DOMAIN-CONTAINING FAMILY F MEMBER 2-RELATED"
definition: >-
  The Pleckstrin homology domain-containing family F is involved in various cellular processes including endosome fusion, receptor trafficking, fluid-phase transport, and apoptosis. Members of the family may enhance cellular sensitivity to TNF-induced apoptosis and play a role upstream of RAB5. The family's PH and FYVE domains are critical for localization to endosomes and the endoplasmic reticulum, and for initiating apoptosis through the lysosomal-mitochondrial pathway. This includes translocation to lysosomes, permeabilization of the lysosomal membrane, release of lysosomal enzymes, and alteration of mitochondrial membrane permeability, leading to caspase-independent cell death.
