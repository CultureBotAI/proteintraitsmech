identifier: PANTHER:PTHR12686
label: "3'-5' EXORIBONUCLEASE CSL4-RELATED"
definition: >-
  This entry includes archaeal exosome complex component Csl4 and its homologues from eukaryotes (also known as exosome component 1 EXOSC1 in mammals). In budding yeast, Csl4 is also known as Ski4 due to its superkiller (SKI) phenotype first described as a more efficient ability to kill sensitive non-killer yeast strains. Later, it was found to be part of the yeast exosome complex involved in 3'-5' RNA processing and degradation in both the nucleus and the cytoplasm. Csl4 is a non-catalytic component of the exosome, a complex involved in RNA processing and degradation. The exact composition of the exosome varies, depending on the organism or the subcellular localization, but in all cases it is composed of a ring-shaped core made of three heterodimers (Rrp41p/Rrp45p, Rrp43p /Rrp46p, Rrp42p/Mtr3p) stabilized by the presence of three other proteins (Csl4/Ski4, Rrp4p, Rrp40p). The presence of different proteins in the cap may enable interactions with different substrates. It has been shown that the archaeal DnaG protein needs Csl4 for binding to the exosome. DnaG is a poly(A)-binding protein and enhances the degradation of adenine-rich transcripts by the Csl4-exosome.
definition_source: "InterPro:IPR039771 abstract (PANTHER PTHR12686 is a member signature)"
