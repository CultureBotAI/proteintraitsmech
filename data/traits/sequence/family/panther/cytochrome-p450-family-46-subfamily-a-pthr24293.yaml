identifier: PANTHER:PTHR24293
label: "CYTOCHROME P450 FAMILY 46 SUBFAMILY A"
definition: >-
  Cholesterol 24-hydroxylase (CYP46A1) is the neuronal-specific and rate-limiting enzyme for cholesterol conversion to 24S-hydroxycholesterol (24S-OHC). It has a neuroprotective effect in Huntington's disease, a genetic disease that leads to many cellular dysfunctions, including abnormalities in cholesterol metabolism.
