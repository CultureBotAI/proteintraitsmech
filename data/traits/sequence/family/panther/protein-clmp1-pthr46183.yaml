identifier: PANTHER:PTHR46183
label: "PROTEIN CLMP1"
definition: >-
  This entry represents a group of plant tetratricopeptide repeat proteins, including PHOX1-4 from Arabidopsis and HIP from Zea mays. They are putative co-chaperones of Hsp90/Hsp70. PHOX2, also known as CLMP1, is required for plastid separation.
