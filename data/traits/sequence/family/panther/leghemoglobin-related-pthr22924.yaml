identifier: PANTHER:PTHR22924
label: LEGHEMOGLOBIN-RELATED
definition: >-
  This entry includes plant proteins that bind oxygen through a penta- or hexa-coordinated heme iron and are required for general plant development and during nodulation. Members of this family are leghemoglobins that facilitates the diffusion of O2 to bacteroids in nodules. Other members are non-symbiotic plant hemoglobins that are expressed in specific plant tissues, and overexpressed in organs of stressed plants. Some of these proteins have functions additional to oxygen transport, such as to modulate levels of ATP and NO. Some may even not function as an oxygen storage or transport proteins. Leghaemoglobins are haem-proteins, first identified in root nodules of leguminous plants, where they are crucial for supplying sufficient oxygen to root nodule bacteria for nitrogen fixation to occur. Although leghaemoglobin and myoglobin both share a common fold, and both regulate the facilitated diffusion of oxygen, leghemoglobins regulate oxygen affinity through a mechanism different from that of myoglobin using a novel combination of haem pocket amino acids that lower the oxygen affinity. The structure of leghaemoglobins is similar to that of haemoglobins and myoglobins, although there is little sequence conservation. The protein is largely α-helical, eight helices providing the scaffold for a well-defined haem-binding pocket. By contrast with the tetrameric mammalian globin assembly, the plant form is monomeric. Globins are haem-containing proteins involved in binding and/or transporting oxygen. They belong to a very large and well studied family that is widely distributed in many organisms. Globins have evolved from a common ancestor and can be divided into three groups: single-domain globins, and two types of chimeric globins, flavohaemoglobins and globin-coupled sensors. B
