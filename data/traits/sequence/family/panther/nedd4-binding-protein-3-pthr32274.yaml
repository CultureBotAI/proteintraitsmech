identifier: PANTHER:PTHR32274
label: "NEDD4-BINDING PROTEIN 3"
definition: >-
  N4BP3 was identified as a protein expressed during development that interacts with Nedd4 ubiquitin ligase. N4BP3 is not a ubiquitylation substrate of Nedd4, but it can alter Nedd4 subcellular location, indicating a functional interaction. N4BP3 has been shown to be essential in neurite branching and circuit formation.
