  - kind: GENERAL
    text: >-
      MYB-RELATED TRANSCRIPTION FACTOR, PARTNER OF PROFILIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR32345. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
