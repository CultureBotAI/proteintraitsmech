identifier: PANTHER:PTHR44102
label: "PROTEIN NPG1"
definition: >-
  This entry includes a group of plant proteins, including NPG1 and related proteins (NPGR1 and NPGR2). In Arabidopsis, NPG1 (No Pollen Germination1) is expressed only in pollen, whereas the NPG-related proteins (NPGR1 and NPGR2) are expressed in pollen and other tissues. NPG1 is a calmodulin-binding protein that is essential for pollen germination.
