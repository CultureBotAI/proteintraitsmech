identifier: PANTHER:PTHR13402
label: RGPR-RELATED
definition: >-
  RGPR-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR13402. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 9 of its annotated subfamilies. Subfamilies participate in Golgi organization, protein localization to endoplasmic reticulum, endomembrane system organization. Subfamilies localise to COPII-coated ER to Golgi transport vesicle, ER to Golgi transport vesicle membrane, transport vesicle.
