identifier: PANTHER:PTHR47375
label: "GB|AAF34833.1"
definition: >-
  This entry includes a group of plant proteins, including Protein RICE SALT SENSITIVE 3 (RSS3) from rice. RSS3 interacts with non-R/B-like bHLH transcription factors and forms an RSS3-JAZ-bHLH ternary complex in the nucleus. It also interacts with JASMONATE ZIM-DOMAIN proteins, which are the key regulators of jasmonate (JA) signaling.
