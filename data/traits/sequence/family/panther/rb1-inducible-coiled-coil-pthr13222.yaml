identifier: PANTHER:PTHR13222
label: "RB1-INDUCIBLE COILED-COIL"
definition: >-
  Autophagy-related protein 11 (ATG11; also known as cytoplasm to vacuole targeting protein 9) is required for transport of proteins from the cytosol to the vacuole, including whole mitochondria for autophagic digestion (mitophagy) in the autophagosome during starvation. It also acts as the scaffold that recruit ATG proteins to the pre-autophagosome. The orthologue in mammals is known as RB1-inducible coiled-coil protein 1 (RB1CC1); the orthologue in Schizosaccharomyces pombe is Taz1-interacting factor 1 (taf1).
definition_source: "InterPro:IPR040040 abstract (PANTHER PTHR13222 is a member signature)"
