identifier: PANTHER:PTHR12245
label: "SPRY DOMAIN CONTAINING SOCS BOX PROTEIN"
definition: >-
  The FBXO45/Fsn and SPSB protein families are involved in various cellular processes through their roles in the ubiquitin-proteasome system. Members of these families function as components of E3 ubiquitin ligase complexes, which are crucial for the ubiquitination and subsequent proteasomal degradation of target proteins. These proteins play key roles in synaptic development and function, including the regulation of synaptic terminal growth at the neuromuscular junction, neuron migration, neurotransmission, and the maintenance of axon integrity. They are also implicated in the negative regulation of nitric oxide production in macrophages, and in the modulation of immune responses to viral infections. The FBXO45/Fsn family members are characterized by the presence of an F-box and SPRY domain, while the SPSB family members contain a SPRY domain and a SOCS box domain, which mediates interaction with the Elongin BC complex.
