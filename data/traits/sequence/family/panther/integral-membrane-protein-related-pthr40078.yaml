identifier: PANTHER:PTHR40078
label: "INTEGRAL MEMBRANE PROTEIN-RELATED"
definition: >-
  This entry includes a group of uncharacterised proteins, including YyaS, HI_0522 and YczE from Bacillus subtilis. This family represents a putative integral membrane protein that is likely to be the membrane component of an ABC transport system. This family is found in bacteria and archaea.
