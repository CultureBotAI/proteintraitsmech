identifier: PANTHER:PTHR34611
label: "Rpn/YhgA-like nuclease"
definition: >-
  The Rpn/YhgA-like nuclease family comprises enzymes with low activity DNA endonuclease functions, primarily yielding 3'-hydroxyl ends. Members are involved in RecA-independent recombination and may play a significant role in horizontal gene transfer. Some family members enhance DNA recombination, which can lead to gene replacement in recipient DNA, while others are pseudogenes or inactive proteins. The active nucleases within the family can reduce cell viability and induce DNA damage, triggering the SOS repair response. Regulation of activity varies, with some inhibited by metal ions and others stimulated by Ca(2+) in the presence of Mg(2+). The family's involvement in generating crossover events suggests a role in the diversification of genetic material across different organisms.
