  - kind: GENERAL
    text: >-
      This family of proteins includes serine proteases and carboxylesterases that exhibit a range of activities, including cleaving tripeptides from the N-termini of proteins, modulating host immune responses, and promoting pathogenesis in certain bacterial infections. Some members have been identified as key virulence factors in mycobacterial species, affecting macrophage activation and immune response regulation. Others are involved in the biosynthesis of complex organic compounds, such as norsesquiterpenes, by participating in multi-step enzymatic pathways. The family is characterized by a conserved active site suggesting endopeptidase activity, and the protease activity is typically inhibited by serine protease inhibitors.
    source: "InterPro:IPR051601 abstract (LLM-generated, not curator-reviewed)"
