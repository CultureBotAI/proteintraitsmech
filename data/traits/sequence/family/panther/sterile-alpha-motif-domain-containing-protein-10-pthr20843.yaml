  - kind: GENERAL
    text: >-
      STERILE ALPHA MOTIF DOMAIN CONTAINING PROTEIN 10 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR20843. Members participate in cellular response to stimulus, regulation of cellular process, cell surface receptor signaling pathway. Members localise to cell periphery, membrane, cytoplasmic side of plasma membrane.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in important cellular signaling pathways. Specifically, one characterized member is essential for normal photoreceptor differentiation and is implicated in the epidermal growth factor receptor (EGFR) signaling cascade in the eye. It is believed to function in the activation of the Raf kinase, likely through cooperation with the connector enhancer of KSR (Cnk), which may involve the recruitment of an activating kinase. This suggests that other members of the family may also play roles in signal transduction processes, potentially through the mediation of protein-protein interactions facilitated by the sterile alpha motif (SAM) domain.
    source: "InterPro:IPR052268 abstract (LLM-generated, not curator-reviewed)"
