identifier: PANTHER:PTHR34598
label: "BLL6449 PROTEIN"
definition: >-
  This entry includes a group of oxidoreductases, including AsaB from Aspergillus flavus, Oxidoreductase R1/R2 from Phoma sp., DES from Gibberella fujikuroi, and Chry3 from Gibberella zeae. Proteins in this entry are related to RbtB and RbtG from Penicillium dangeardii. RbtB and RbtG are alpha-ketoglutarate-dependent dioxygenases involved in rubratoxin biosynthesis. AsaB is involved in secondary metabolite biosynthesis. It converts aspergillic acid to hydroxyaspergillic acid. R1/R2 is part of the gene cluster that mediates the biosynthesis of squalestatin S1. Chry3 is part of the gene cluster that mediates the biosynthesis of the yellow pigment chrysogine. DES is part of the gene cluster that mediates the biosynthesis of gibberellins (GAs), diterpenoids that may provide a selective advantage during infection of the preferred host plant, rice.
definition_source: "InterPro:IPR044053 abstract (PANTHER PTHR34598 is a member signature)"
