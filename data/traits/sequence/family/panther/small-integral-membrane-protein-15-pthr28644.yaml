identifier: PANTHER:PTHR28644
label: "SMALL INTEGRAL MEMBRANE PROTEIN 15"
definition: >-
  This family of eukaryotic proteins is functionally uncharacterised. There is a conserved LSWKL sequence motif. This family includes human protein C5orf43. Family members are annotated as small integral membrane protein 15.
