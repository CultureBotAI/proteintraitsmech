identifier: PANTHER:PTHR48151
label: "SH3 DOMAIN-CONTAINING PROTEIN"
definition: >-
  The TSET complex is a heterohexameric membrane trafficking complex that may function in plasma membrane turnover. Members are found across amoebozoa and plants. In plants, homologous proteins are known as TASH3 (TPLATE-associated SH3 domain-containing protein 3) and are components of the related TPLATE complex. These proteins typically contain a C-terminal SH3 domain ( InterPro:IPR001452 ).
