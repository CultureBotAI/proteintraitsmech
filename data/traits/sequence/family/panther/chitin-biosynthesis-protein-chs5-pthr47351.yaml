identifier: PANTHER:PTHR47351
label: "CHITIN BIOSYNTHESIS PROTEIN CHS5"
definition: >-
  This family of proteins is involved in various cellular processes related to the synthesis of chitin and cell fusion. Members of this family are known to form complexes that facilitate the export of specific cargo proteins, such as chitin synthase, to their proper cellular locations. Additionally, they play a role in the targeting of proteins to sites of polarized growth. Some family members act as scaffolds within the Golgi apparatus, retaining proteins required for cell fusion. The degradation of these proteins can trigger the release of cell fusion proteins, indicating a regulatory function in mating processes. Overall, the family is characterized by its involvement in the transport and regulation of proteins essential for chitin biosynthesis and cell fusion events.
