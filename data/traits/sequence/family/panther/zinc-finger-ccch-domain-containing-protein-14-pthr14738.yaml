identifier: PANTHER:PTHR14738
label: "ZINC FINGER CCCH DOMAIN-CONTAINING PROTEIN 14"
definition: >-
  Budding yeast Nab2 is a nuclear polyadenylated RNA-binding protein that contains seven CCCH-type zinc fingers and an RGG box. It is required for nuclear mRNA export and poly(A) tail length control. The tertiary structure has been solved and the protein is all helical (PDB:3LCN). Its animal homologue, known as ZC3H14, has been shown to control poly(A) tail length in neuronal cells.
