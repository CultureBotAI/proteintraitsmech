identifier: PANTHER:PTHR39164
label: "PROTEIN CCDC"
definition: >-
  This entry includes protein CcdC from Bacillus subtilis. The function of Ccdc is not known. In Bacillus velezensis, ccdC gene has been found to be involved in the process of biofilm dispersion.
