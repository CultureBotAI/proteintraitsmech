identifier: PANTHER:PTHR15083
label: "NADH DEHYDROGENASE [UBIQUINONE] 1 BETA SUBCOMPLEX SUBUNIT 6"
definition: >-
  The NADH dehydrogenase [ubiquinone] complex performs the first stage of electron transfer from NADH to the respiratory chain. This entry represents an accessory subunit that is not thought to be involved in catalysis.
