identifier: PANTHER:PTHR46942
label: "SIALIC ACID-BINDING IG-LIKE LECTIN 15"
definition: >-
  Sialic acid-binding Ig-like lectin 15 (SIG15) is a cell-surface receptor that recognize sialylated glycans. It may play a regulatory role in the immune system of vertebrates.
