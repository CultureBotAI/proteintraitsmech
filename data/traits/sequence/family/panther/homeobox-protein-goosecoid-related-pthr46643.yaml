definitions:
  - kind: GENERAL
    text: >-
      HOMEOBOX PROTEIN GOOSECOID-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46643. PANTHER protein class: homeodomain transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in regulation of RNA biosynthetic process, regulation of gene expression, regulation of macromolecule metabolic process. and localise to membrane-bounded organelle, cellular anatomical entity, nucleus.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors characterized by a homeobox domain, which is a DNA-binding motif. They are involved in early embryonic development and organogenesis. Members of this family play crucial roles in regulating the expression of genes that are essential for the development of various structures, such as the middle ear components, and are implicated in the establishment of body axes during gastrulation. They may also participate in defining cell fate specification and lineage determination, particularly in neural crest cells and mesoderm-derived tissues. Some proteins in this family are capable of inducing secondary body axis formation, a process known as organizer activity, which is fundamental in vertebrate developmental biology.
    source: "InterPro:IPR051440 abstract (LLM-generated, not curator-reviewed)"
