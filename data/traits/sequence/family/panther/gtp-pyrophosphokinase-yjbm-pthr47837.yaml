identifier: PANTHER:PTHR47837
label: "GTP PYROPHOSPHOKINASE YJBM"
definition: >-
  This family of proteins functions as (p)ppGpp synthases, enzymes that are integral to the stringent response in eubacteria. Members of this family catalyze the synthesis of ppGpp (guanosine 3'-diphosphate 5'-diphosphate), a molecule that coordinates cellular activities in response to nutritional changes. These proteins can utilize GDP in place of GTP, enhancing (p)ppGpp production. The activity of these enzymes is highly cooperative and allosterically regulated by their products, with pppGpp being a particularly potent activator. The binding of pppGpp occurs in a regulatory cleft of the enzyme, influencing its activity. Although these proteins are structurally related to the RelA/SpoT family, they appear to play a secondary role in the stringent response mechanism.
