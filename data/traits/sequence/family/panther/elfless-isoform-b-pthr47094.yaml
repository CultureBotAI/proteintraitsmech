identifier: PANTHER:PTHR47094
label: "ELFLESS, ISOFORM B"
definition: >-
  This entry includes E3 ubiquitin-protein ligase complex SLX5-SLX8 subunit SLX8 from budding yeast, which mediates ubiquitination and subsequent desumoylation/degradation of sumoylated proteins and proteins containing SUMO-like domains. It acts as a critical suppressor of gross chromosomal rearrangements (GCRs) during normal cell cycle progression. It is also involved in stabilising, restarting or resolving transiently stalled replication forks. It prevents accumulation of DNA damage during cell cycle progression. This entry also includes uncharacterised plant sequences.
