identifier: PANTHER:PTHR33697
label: "T17B22.17 PROTEIN-RELATED"
definition: >-
  This entry includes a group of plant proteins, such as the PWWP domain containing protein PWWP2 (At1g51745, also known SL1) from Arabidopsis thaliana. Its exact function is not known. It is part of PEAT complexes (for PWWPs-EPCRs-ARIDs-TRBs) which mediate histone deacetylation and heterochromatin condensation to facilitate heterochromatin silencing. These complexes repress the production of small interfering RNAs (siRNAs) and DNA methylation.
