definition: >-
  HOMOSERINE DEHYDROGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43331. PANTHER protein class: dehydrogenase, oxidoreductase. Members are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Members participate in aspartate family amino acid biosynthetic process.
