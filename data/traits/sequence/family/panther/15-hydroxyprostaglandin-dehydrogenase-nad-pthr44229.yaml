label: "15-HYDROXYPROSTAGLANDIN DEHYDROGENASE [NAD(+)]"
definition: >-
  15-HYDROXYPROSTAGLANDIN DEHYDROGENASE [NAD(+)] — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR44229. PANTHER protein class: dehydrogenase, metabolite interconversion enzyme. Members are annotated with the molecular function oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor. Members localise to intracellular anatomical structure, cytoplasm.
