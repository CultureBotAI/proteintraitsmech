definitions:
  - kind: GENERAL
    text: >-
      VOLTAGE-DEPENDENT CALCIUM CHANNEL GAMMA SUBUNIT — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12107. PANTHER protein class: transporter, voltage-gated ion channel. Members are annotated with the molecular function inorganic molecular entity transmembrane transporter activity, transporter regulator activity, channel regulator activity. and participate in localization within membrane, establishment of protein localization to vacuole, receptor internalization. and localise to postsynaptic density, protein-containing complex, plasma membrane signaling receptor complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of ion channel trafficking and gating properties, particularly for AMPA-selective glutamate receptors (AMPARs) and L-type calcium channels. They play a role in promoting the targeting of AMPARs to the cell membrane and synapses, as well as modulating their activation, deactivation, and desensitization rates. Some members exhibit specificity for certain AMPAR subunits, while others regulate all subunits. Additionally, they are thought to stabilize calcium channels in a closed state, influencing neuronal excitability and synaptic plasticity.
    source: "InterPro:IPR051072 abstract (LLM-generated, not curator-reviewed)"
