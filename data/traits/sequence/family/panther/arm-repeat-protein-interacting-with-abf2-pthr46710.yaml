identifier: PANTHER:PTHR46710
label: "ARM REPEAT PROTEIN INTERACTING WITH ABF2"
definition: >-
  This entry represents a group of plant Armadillo (Arm) repeat proteins, including ABAP1/ARIA from Arabidopsis. ARIA interacts with a transcriptional regulator of abscisic acid-responsive gene expression. ABAP1 is involved in a negative feedback loop regulating mitotic DNA replication during leaf development.
