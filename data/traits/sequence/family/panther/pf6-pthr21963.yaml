identifier: PANTHER:PTHR21963
label: PF6
definition: >-
  Sperm-associated antigen 17 (SPAG17) seems to be important for the structural integrity of the central apparatus of the sperm axoneme. It interacts (via the C terminus) with SPAG6; the interaction probably occurs on polymerised microtubules.
