identifier: PANTHER:PTHR34700
label: "POTASSIUM BINDING PROTEIN KBP"
definition: >-
  The protein family includes highly specific potassium binding proteins that are essential for normal growth under high external potassium levels. Members of the family may function as sensors for cytoplasmic potassium concentration, binding potassium ions and undergoing significant conformational changes upon binding. The binding affinity is not exclusive to potassium, as larger alkali metal ions such as rubidium and cesium, as well as ammonium, can also be accommodated. The family is characterized by the presence of BON and LysM domains, which synergistically contribute to potassium binding. The BON domain primarily facilitates the binding, while the LysM domain stabilizes the complex. Some members are uncharacterized, but they share similarity with characterized potassium binding proteins, suggesting a conserved function within the family.
