  - kind: GENERAL
    text: >-
      This family of proteins is involved in the transport of various osmolytes across cellular membranes. Members of this family are part of ATP-binding cassette (ABC) transporter complexes, which are responsible for the energy-dependent uptake of specific substrates. These substrates include trimethylamine N-oxide (TMAO), glycine betaine, proline betaine, choline, and occasionally carnitine. The proteins are believed to couple the hydrolysis of ATP to the translocation of these osmolytes, facilitating the cell's response to osmotic stress and contributing to cryoprotection. The activity of these transport systems can be modulated by environmental conditions such as osmotic gradients and low temperatures.
    source: "InterPro:IPR051921 abstract (LLM-generated, not curator-reviewed)"
