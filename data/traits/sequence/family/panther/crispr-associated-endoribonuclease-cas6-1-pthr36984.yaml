identifier: PANTHER:PTHR36984
label: "CRISPR-ASSOCIATED ENDORIBONUCLEASE CAS6 1"
definition: >-
  This entry represents Cas6, a broadly distributed, highly divergent Cas family, including TM1814 from Thermotoga maritima. TM1814 contains a C-terminal motif GXGXXXXXGXG, where the each X between two Gly is hydrophobic and the spacer XXXXX contains (usually) one Arg or Lys. Members of this protein family are found associated with several different CRISPR/cas system subtypes. Cas6 proteins share the ability to recognise and cleave a single phosphodiester bond in a short repeated sequence of the pre-crRNA transcript. The CRISPR-Cas system is a prokaryotic defence mechanism against foreign genetic elements. The key elements of this defence system are the Cas proteins and the CRISPR RNA.
definition_source: "InterPro:IPR010156 abstract (PANTHER PTHR36984 is a member signature)"
