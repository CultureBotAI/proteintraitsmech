  - kind: GENERAL
    text: >-
      This family of proteins includes coreceptors and regulators of signaling pathways essential for developmental processes such as chondrogenesis, osteogenesis, and angiogenesis. Members of this family facilitate the interaction of ligands with their respective receptors, enhancing signaling cascades. They are involved in the bone morphogenetic protein (BMP) signaling pathway, acting as coreceptors for BMP2 and BMP4, and are necessary for the recruitment of BMP receptors to lipid rafts. Some members bind to TGFBR2, activating transforming growth factor-beta (TGFB) signaling, which plays a role in epithelial-mesenchymal transition and cancer progression. Additionally, these proteins participate in the sonic hedgehog (SHH) signaling pathway by binding to lipid-modified SHH, promoting its mobilization and release from the cell membrane, and facilitating its long-range signaling. They also synergize with other proteins to enhance SHH secretion. Furthermore, they may function as adhesive molecules in vascular biology and as coreceptors for vascular endothelial growth factor receptor 2 (VEGFR2), contributing to angiogenesis.
    source: "InterPro:IPR052071 abstract (LLM-generated, not curator-reviewed)"
