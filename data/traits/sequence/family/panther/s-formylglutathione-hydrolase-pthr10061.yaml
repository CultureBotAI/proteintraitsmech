identifier: PANTHER:PTHR10061
label: "S-FORMYLGLUTATHIONE HYDROLASE"
definition: >-
  This entry describes proteins from bacteria, yeast, and human, with a conserved critical role in formaldehyde detoxification as S-formylglutathione hydrolase ( ). Eukaryotic members, particularly the human protein, are better known as esterase D ( ), an enzyme with broad specificity, although S-formylglutathione hydrolase has now been demonstrated as well.
