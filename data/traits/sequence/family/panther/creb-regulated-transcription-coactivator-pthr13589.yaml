identifier: PANTHER:PTHR13589
label: "CREB-REGULATED TRANSCRIPTION COACTIVATOR"
definition: >-
  CREB-regulated transcription coactivator (also known as TORC, transducer of regulated CREB activity) enhances the activity of CRE-dependent transcription via a phosphorylation-independent interaction with the bZIP (basic region/leucine zipper) DNA binding/dimerisation domain of CREB (cAMP Response Element-Binding. The TORC family includes TORC1, TORC2 and TORC3; all three activate CREB-dependent transcription but are differentially expressed and regulated by upstream signals such as AMP-activated protein kinase and LKB1.
definition_source: "InterPro:IPR024786 abstract (PANTHER PTHR13589 is a member signature)"
