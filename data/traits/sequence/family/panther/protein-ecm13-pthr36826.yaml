identifier: PANTHER:PTHR36826
label: "PROTEIN ECM13"
definition: >-
  This entry includes budding yeast Ecm13 and its paralogue, YJR115W. The function of these proteins are not clear. Ecm13 has been found to be induced by treatment with 8-methoxypsoralen and UVA irradiation.
