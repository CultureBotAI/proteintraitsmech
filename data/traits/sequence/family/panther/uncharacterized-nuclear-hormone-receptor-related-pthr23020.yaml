  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes with diverse catalytic activities. One member is an oxidoreductase belonging to the short-chain dehydrogenases/reductases (SDR) family, which typically function in the NAD(P)(H)-dependent metabolism of steroids, alcohols, and lipids. Another member is akin to the choline/ethanolamine kinase family, which is involved in the phosphorylation of choline and ethanolamine as part of phospholipid metabolism. These enzymes play crucial roles in various biological processes, including signal transduction, lipid biosynthesis, and metabolism.
