identifier: PANTHER:PTHR40094
label: "ALPHA-2-MACROGLOBULIN HOMOLOG"
definition: >-
  This family of proteins includes Alpha-2-macroglobulin from Escherichia coli (YfhM) and similar proteins mainly found in bacteria. These proteins serve a protective role for the cell. They act as protease inhibitors, safeguarding the bacterial cell from host-derived peptidases. These proteins employ a 'trapping' mechanism, where cleavage of a specific bait-region domain by host peptidases triggers a conformational change. This change results in the entrapment of the peptidase and activation of a thioester bond, which covalently binds to the peptidase. Although trapped, the peptidases remain active but are inhibited from attacking large substrates. This defense mechanism may protect the periplasm and associated lipoproteins from external endopeptidases. The structural rearrangement upon cleavage is significant, altering over half of the protein's domain structure from its native to an induced form. This entry also includes Circularly permutated Ras protein 2 from Dictyostelium discoideum (Cpras2), which shows regions of homology with the alpha-2 macroglobulins.
definition_source: "InterPro:IPR051802 abstract (PANTHER PTHR40094 is a member signature)"
