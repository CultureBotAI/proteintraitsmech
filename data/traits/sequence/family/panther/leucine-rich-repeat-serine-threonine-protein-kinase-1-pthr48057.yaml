  - kind: GENERAL
    text: >-
      The LRRC69/RLP family is involved in the perception and response to extracellular signals that regulate meristem maintenance and root growth. Members of the family, such as CLV2 in Arabidopsis, are receptor-like proteins that detect CLV3 and CLV3-like peptides. These peptides are crucial for controlling stem cell population size in apical meristems and during organ development. Some family members contribute to plant defense by recognizing nematode-secreted effector proteins, which mimic plant CLE signaling peptides, thus playing a role in the development of nematode feeding structures and infection success. Additionally, the family includes proteins with a predicted inactive kinase domain, suggesting diverse functional roles and regulatory mechanisms within the family.
    source: "InterPro:IPR052595 abstract (LLM-generated, not curator-reviewed)"
