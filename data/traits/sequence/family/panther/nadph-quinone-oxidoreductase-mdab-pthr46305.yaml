identifier: PANTHER:PTHR46305
label: "NADPH:quinone oxidoreductase MdaB"
definition: >-
  This family of proteins includes NADPH-specific quinone reductases that are most active with quinone derivatives and ferricyanide as electron acceptors. They can utilize menadione, 1,4-naphthoquinone, and 1,4-benzoquinone as substrates. Members of this family may operate in conjunction with other proteins to form a quinone redox cycle, which is essential for various cellular processes including the regulation of oxidative stress and electron transport.
