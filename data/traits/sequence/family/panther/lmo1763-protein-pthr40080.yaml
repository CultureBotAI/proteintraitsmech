identifier: PANTHER:PTHR40080
label: "LMO1763 PROTEIN"
definition: >-
  These proteins are found mostly in the Firmicutes (Bacillus and other related Gram-positive bacteria). They are similar in sequence to the trp operon repressor TrpR, but represent a distinct clade. At least one species, Xylella fastidiosa, in the Proteobacteria, has a member of both this family and. Several genomes with a member of this family do not synthesize tryptophan, and members of this family should not be considered trp operon repressors without new evidence.
