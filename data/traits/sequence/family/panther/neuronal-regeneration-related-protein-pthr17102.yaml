identifier: PANTHER:PTHR17102
label: "NEURONAL REGENERATION-RELATED PROTEIN"
definition: >-
  Neuronal protein 3.1, also known as P311, is found in neurone and muscle cells. It contains a conserved PEST (Pro, Glu, Ser, and Thr) motif, which is involved in protein-protein interactions, as well as in targeting proteins for degradation by the ubiquitin/proteasome system. In addition to a potential role in neural function, P311 may be involved in regulating glioma motility and could have some function in myo-fibroblast transformation and prevention of fibrosis. It has also been identified as a potential regulator of alveolar generation.
definition_source: "InterPro:IPR024417 abstract (PANTHER PTHR17102 is a member signature)"
