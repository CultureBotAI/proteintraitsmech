identifier: PANTHER:PTHR44090
label: "WD REPEAT-CONTAINING PROTEIN 61"
definition: >-
  The SKI8 family proteins are multifunctional components of both the PAF1 complex (PAF1C) and the SKI complex. In the PAF1C, they play a crucial role in transcriptional regulation by RNA polymerase II, influencing development, stem cell pluripotency, and hematopoiesis. They interact with the polymerase's CTD in both phosphorylated and non-phosphorylated forms, participating in transcriptional elongation, histone modification, and mRNA 3' end formation. SKI8 family proteins are implicated in ubiquitination of histone H2B and methylation of histone H3 on 'Lys-4' and 'Lys-79', affecting gene expression. Within the SKI complex, they assist in mRNA decay by extracting mRNA from ribosomes and directing it to the exosome for degradation. This function is crucial for mRNA quality control and the prevention of viral cytopathology. Additionally, some family members are involved in meiotic recombination and the regulation of flowering time in plants.
