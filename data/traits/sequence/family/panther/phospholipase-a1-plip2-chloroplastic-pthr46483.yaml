identifier: PANTHER:PTHR46483
label: "PHOSPHOLIPASE A1 PLIP2, CHLOROPLASTIC"
definition: >-
  This entry includes a group of plant glycerolipid A1 lipases, including PLIP1/2/3 from Arabidopsis. PLIP1 is a plastid phospholipase A1 that releases polyunsaturated fatty acids from chloroplast phosphatidylglycerol, leading to the export of the fatty acids to the ER for seed oil biosynthesis. PLIP2/3 are also present in the chloroplasts. They respond to ABA and are involved in jasmonic acid biosynthesis.
