identifier: PANTHER:PTHR36536
label: "UPF0111 PROTEIN HI_1603"
definition: >-
  This family includes prokaryotic proteins of unknown function, as well as a protein annotated as the pit accessory protein from Rhizobium meliloti (Sinorhizobium meliloti) ( UniProtKB:O30498 ). However, while it has been hypothesised that this protein may play a role in orthophosphate transport (Pit stands for phosphate transport), its exact function is unknown. This entry represents a clade of the wider family described by InterPro:IPR018445, excluding the Gram-positive bacterial family members.
