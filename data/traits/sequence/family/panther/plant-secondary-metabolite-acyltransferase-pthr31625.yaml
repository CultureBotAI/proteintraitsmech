identifier: PANTHER:PTHR31625
label: "Plant secondary metabolite acyltransferase"
definition: >-
  This family of proteins is involved in the modification of plant secondary metabolites through the transfer of acyl groups from donor molecules such as malonyl-CoA, coumaroyl-CoA, and other acyl-CoAs to acceptor molecules, which are often phenolic glucosides or anthocyanins. These modifications typically involve the addition of malonyl, coumaroyl, or other acyl groups to specific hydroxyl groups of the acceptor compounds. The enzymatic activity of these proteins plays a crucial role in the biosynthesis and diversification of plant secondary metabolites, which can serve various functions including pigmentation, defense against herbivores and pathogens, and plant-environment interactions. The proteins in this family are characterized by a conserved HXXXXD motif essential for their acyltransferase activity and are inhibited or regulated by various compounds and metal ions.
