identifier: PANTHER:PTHR11849
label: ETS
definition: >-
  This entry represents ETS family of transcription factors, including ETS translocation variant 1-5 (ETV1-5) and related proteins from animals. Most members of this protein family contain an ETS (erythroblast transformation specific) domain and belong to the winged helix DNA-binding domain superfamily. ETV1-5 are overexpressed in multiple cancers. ETV1 is critical for fast conduction physiology in the heart. ETV3 is a transcriptional repressor that contribute to growth arrest during terminal macrophage differentiation by repressing target genes involved in Ras-dependent proliferation. ETV4 is a transcriptional activator that may play a role in keratinocyte differentiation.
