identifier: PANTHER:PTHR47669
label: "PHOSPHATIDYLINOSITOL TRANSFER PROTEIN SFH5"
definition: >-
  In budding yeasts, Phosphatidylinositol transfer proteins (PITPs) are defined by their ability to transfer phosphatidylinositol (PtdIns) or phosphatidylcholine (PtdCho) monomers between membrane bilayers in vitro. The major PITP is encoded by SEC14. However, four other yeast SFH (Sec Fourteen Homologue) proteins designated Sfh2, Sfh3, Sfh4, and Sfh5, have been identified. This entry represents Sfh5 from fungi, a non-classical PITP. It has PtdIns transfer activity in vitro and may function in regulation of post-Golgi membrane trafficking events. It is also involved in the organization of the actin cytoskeleton. Sfh5 is a novel heme-binding protein with an unusual heme-binding arrangement that involves co-axial tyrosine/histidine coordination strategy and a complex electronic structure which penta-coordinates high spin Fe3. It is conserved across Fungi and may play a role organic oxidant-induced stress responses, being the founding member of a new class of hemoproteins.
