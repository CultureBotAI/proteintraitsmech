identifier: PANTHER:PTHR37755
label: "PROTEIN TIC 56, CHLOROPLASTIC"
definition: >-
  Preproteins are imported into chloroplasts through the translocon complexes of the outer (TOC) and inner (TIC) envelope membranes. The TIC translocon consists of Tic56, together with Tic20, Tic100,and Tic214. Tic56 mutant plants have an albino phenotype, but protein import in Tic56 mutant plants is functional to a considerable degree.
