identifier: PANTHER:PTHR12485
label: "NADH-UBIQUINONE OXIDOREDUCTASE SUBUNIT B"
definition: >-
  This family contains the eukaryotic NADH dehydrogenase [ubiquinone] 1 alpha subcomplex subunit 7 (NDUA7 or NDUFA7, also known as NADH:ubiquinone oxidoreductase subunit B14.5a, Complex I-B14.5a). This is approximately 100 residues long, and forms part of a multiprotein complex that resides on the inner mitochondrial membrane and it is part of the accessory subunits, not involved in catalysis.
