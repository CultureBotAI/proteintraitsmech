identifier: PANTHER:PTHR48079
label: "PROTEIN YEEZ"
definition: >-
  This family of proteins includes enzymes that are involved in various metabolic processes, including the biosynthesis of sterols, antibiotics, and other bioactive molecules. Members of this family are characterised by their dependence on NAD(P) as a cofactor, performing functions such as oxidative decarboxylation, reduction, and dehydration reactions. These proteins are implicated in the modification of steroid molecules (NSDHL), the conversion of aurachins (AUAH), and the biosynthesis of complex compounds like UCS1025A (UcsJ), which has antibacterial and antitumor properties. The family also includes enzymes that participate in the conversion of antibiotics, such 2'-dehydrokanamycin reductase which converts 2'-dehydrokanamycin A into kanamycin A, contributing to their bioactivation. The diverse enzymatic activities within this family reflect a broad functional repertoire, with each member playing a specific role in cellular metabolism and the biosynthesis of secondary metabolites.
definition_source: "InterPro:IPR051783 abstract (PANTHER PTHR48079 is a member signature)"
