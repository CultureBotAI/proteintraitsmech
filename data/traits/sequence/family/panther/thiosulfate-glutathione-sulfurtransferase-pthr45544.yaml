identifier: PANTHER:PTHR45544
label: "THIOSULFATE:GLUTATHIONE SULFURTRANSFERASE"
definition: >-
  This entry represents the human Thiosulfate:glutathione sulfurtransferase (TSTD1, UniProtKB:Q8NFU3 ) and related proteins. TSTD1 catalyzes a predicted thiosulfate-dependent conversion of glutathione to GSS(-), a central intermediate in hydrogen sulfide metabolism.
