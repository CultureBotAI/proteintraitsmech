identifier: PANTHER:PTHR47221
label: "FIBRINOGEN ALPHA CHAIN"
definition: >-
  This entry includes the alpha, beta and gamma chains of fibrinogen (FGA/B/G), Angiopoietin-1/2 (ANGPT1/2) and similar animal proteins. This entry also includes Fibrinogen-like Protein 1 that is a major immune inhibitory ligand of Lymphocyte-activation gene 3 (LAG-3). Blockade of the FGL1-LAG-3 interaction by monoclonal antibodies was shown to stimulate tumor immunity and is therapeutic against established mouse tumors. Fibrinogens are cleaved by thrombin to yield fibrins, which polymerize to form the insoluble fibrin clot which blocks sites of vascular injury, preventing further blood loss. The clot is subsequently degraded by plasmin (fibrinolysis). There are three fibrinogens, alpha, beta and gamma. Thrombin activates fibrinogen to release a fibrinopeptide. The newly exposed N terminus forms an Glu-Lys isopeptide bond, which is stabilized by factor XIIIA. Fibrinogen is also required for successful pregnancy, and in knockout mice fatal uterine bleeding occurs around the tenth day of gestation. Several diseases are a result of mutations in the FGA gene, including congenital afibrinogenemia, resulting in a hemophilia which can be mild to severe; amyloidosis 8, which causes extensive visceral amyloid deposits, renal amyloidosis and hypertension and congenital dysfibrinogenemia. ANGPT1 binds and activates the tyrosine kinase receptor TEK/TIE2 by inducing its dimerisation and tyrosine phosphorylation. It plays an important role in the regulation of angiogenesis, endothelial cell survival, proliferation, migration, adhesion and cell spreading, reorganization of the actin cytoskeleton, but also maintenance of vascular quiescence. ANGPT2 binds to TEK/TIE2, competing for the ANGPT1 binding site, and modulating ANGPT1 signalling.
