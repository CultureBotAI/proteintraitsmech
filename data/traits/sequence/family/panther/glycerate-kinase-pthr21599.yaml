identifier: PANTHER:PTHR21599
label: "GLYCERATE KINASE"
definition: >-
  This family includes glycerate kinase 2 ( EC:2.7.1.31 ), which catalyses the phosphorylation of (R)-glycerate to 3-phospho-(R)-glycerate in the presence of ATP. There are two glycerate kinases in E. coli, known as GKI and GKII and GKII is encoded by glxK.
