identifier: PANTHER:PTHR12458
label: "ORF PROTEIN"
definition: >-
  This entry includes cilia- and flagella-associated protein 20 (CFA20) and CFAP20DC, also known as C3orf67. CFA20 is a cilium- and flagellum-specific protein that plays a role in axonemal structure organisation and motility. In Chlamydomonas reinhardtii, it stabilises outer doublet microtubules (DMTs) of the axoneme and may work as a scaffold for intratubular proteins, such as tektin and PACRG, to produce the beak structures in DMT1.
