identifier: PANTHER:PTHR43556
label: "PEPTIDE CHAIN RELEASE FACTOR RF3"
definition: >-
  Peptide chain release factor 3 (RF-3, PrfC) is a GTPase found in a broad range of bacteria that accelerates dissociation of class I release factors (RF1 and RF2) from the ribosome following peptide release. In addition to its contribution to translation termination by recycling the class I release factors, RF3 has also been implicated in dissociation of peptidyl-tRNAs from elongating ribosomes and in a post-peptidyltransferase quality control (post-PT QC) mechanism that selectively terminates ribosomes carrying erroneous peptides.
definition_source: "InterPro:IPR004548 abstract (PANTHER PTHR43556 is a member signature)"
