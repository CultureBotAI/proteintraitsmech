identifier: PANTHER:PTHR23199
label: "NEUROTROPHIN 1-RELATED"
definition: >-
  NEUROTROPHIN 1-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23199. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 5 of its annotated subfamilies. Subfamilies are annotated with the molecular function growth factor activity, signaling receptor binding. Subfamilies participate in innate immune response, nervous system development, central nervous system development. Subfamilies localise to extracellular region.
