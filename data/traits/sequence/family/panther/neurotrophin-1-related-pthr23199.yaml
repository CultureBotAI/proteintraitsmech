  - kind: GENERAL
    text: >-
      This family of proteins includes neurotrophins that function as ligands for Toll and Toll-related receptors, playing a pivotal role in the development and function of the central nervous system. They are involved in the establishment of dorsal-ventral polarity during embryonic development, motor axon targeting, neuronal survival, and synaptic targeting at the neuromuscular junction. Some members are implicated in the immune response regulation in the tracheal system. They activate signaling pathways such as the Toll signaling pathway and a Tollo and JNK pathway, which are essential for various developmental and immune processes.
    source: "InterPro:IPR052444 abstract (LLM-generated, not curator-reviewed)"
