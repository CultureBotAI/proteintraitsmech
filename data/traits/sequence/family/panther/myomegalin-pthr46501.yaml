definitions:
  - kind: GENERAL
    text: >-
      MYOMEGALIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46501. and participate in regulation of supramolecular fiber organization, centrosome cycle, cellular component organization. and localise to cytoplasm, non-membrane-bounded organelle, microtubule organizing center.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of microtubule dynamics and cellular architecture. Members of this family function as scaffolding proteins that anchor key signaling molecules, particularly those involved in the cAMP-dependent pathway, to specific cellular structures like the Golgi apparatus and centrosomes. They play a crucial role in promoting microtubule assembly and are implicated in various cellular processes such as directed cell migration, mitotic spindle orientation, and cell-cycle progression. These proteins are capable of forming complexes with other proteins, such as AKAP9, CAMSAP2, EB1/MAPRE1, and CDK5RAP2, to facilitate the nucleation and extension of microtubules from the centrosome towards the cell periphery, which is essential for maintaining cell polarity and ensuring proper cell division.
    source: "InterPro:IPR052593 abstract (LLM-generated, not curator-reviewed)"
