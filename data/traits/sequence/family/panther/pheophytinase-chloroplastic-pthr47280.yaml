identifier: PANTHER:PTHR47280
label: "PHEOPHYTINASE, CHLOROPLASTIC"
definition: >-
  This entry represents a group of pheophytinases from plants, including PPH, a chloroplast-located and senescence-induced hydrolase widely distributed in algae and land plants. In Arabidopsis, PPH (also known as CRN1) specifically dephytylates the Mg-free chlorophyll pigment, pheophytin (phein), yielding pheophorbide. It plays a crucial role in Chlorophyll degradation during leaf senescence.
definition_source: "InterPro:IPR044211 abstract (PANTHER PTHR47280 is a member signature)"
