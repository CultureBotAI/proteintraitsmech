  - kind: GENERAL
    text: >-
      This family of proteins includes acyl-CoA N-acyltransferases involved in the biosynthesis of specific neurotoxins, such as verrucosidin, which is a methylated alpha-pyrone polyketide. These enzymes are responsible for the modification of the carbon backbone produced by polyketide synthases, contributing to the production of compounds that can inhibit oxidative phosphorylation in mitochondria, leading to neurological diseases. The activity of these proteins is typically associated with a gene cluster dedicated to the biosynthesis of the toxin.
