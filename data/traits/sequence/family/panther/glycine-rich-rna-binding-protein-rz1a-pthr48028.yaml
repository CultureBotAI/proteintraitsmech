  - kind: GENERAL
    text: >-
      This family of proteins includes factors involved in the regulation of RNA processing events, particularly pre-mRNA splicing. Members are characterized by their ability to bind RNA and sometimes DNA, often with a preference for single-stranded nucleic acids and specific purine-rich sequences. They play crucial roles in the assembly of spliceosomal complexes, interacting with both 5'- and 3'-splice sites and facilitating the ATP-dependent interactions of snRNPs with pre-mRNA. Some family members are also implicated in cellular responses to stress and may participate in RNA transcription or processing under such conditions. Additionally, certain proteins within this family are involved in cellular apoptosis pathways in response to specific treatments, such as cisplatin. The family also includes proteins that may contribute to the regulation of gene expression during development and in response to environmental stimuli, including pathogen attack and abiotic stresses.
    source: "InterPro:IPR051106 abstract (LLM-generated, not curator-reviewed)"
