identifier: PANTHER:PTHR43290
label: "MEVALONATE KINASE"
definition: >-
  Mevalonate kinase is well-characterised among eukaryotes, where it plays a role in the synthesis of isopentanyl pyrophosphate, a common intermediate for a number of pathways including cholesterol biosynthesis. It is also involved in mevalonate catabolism. Close homologues are found in archaea. Related bacterial proteins are also included in this entry.
