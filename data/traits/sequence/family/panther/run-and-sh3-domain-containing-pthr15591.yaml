identifier: PANTHER:PTHR15591
label: "RUN AND SH3 DOMAIN CONTAINING"
definition: >-
  This entry represents a group of proteins from animals, including AP-4 complex accessory subunit RUSC1/2. RUSC1, also called RUN and SH3 domain-containing protein 1, may acts as a signalling adapter that translocates to the nuclear envelope and regulates neurotrophin-induced neurite outgrowth. RUSC2, also called RUN and SH3 domain-containing protein 2, is a novel interacting molecule for the active GTP-bound conformation of Rab1. It may function as a link between the targeting of endoplasmic reticulum derived vesicles, triggered by the Rab1 GTPase and a signaling pathway regulated by molecules containing SH3 and/or poly-proline regions.
definition_source: "InterPro:IPR047343 abstract (PANTHER PTHR15591 is a member signature)"
