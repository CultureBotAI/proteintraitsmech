identifier: PANTHER:PTHR46771
label: DETERIN
definition: >-
  The Baculoviral IAP repeat-containing protein family is involved in various cellular processes, primarily acting as a key component of the chromosomal passenger complex (CPC), which is crucial for chromosome alignment, segregation during mitosis, and cytokinesis. Family members are multitasking proteins that promote cell proliferation and prevent apoptosis, associating with polymerized microtubules to organize the center spindle. They participate in spindle assembly, recruitment of CPC to centromeres, and serve as scaffolds for mitotic spindle formation. Some members are involved in vascular development, while others play a role in transcriptional regulation and maintaining mitochondrial integrity. They may also inhibit apoptosis by interacting with caspases and have potential roles in neoplasia.
