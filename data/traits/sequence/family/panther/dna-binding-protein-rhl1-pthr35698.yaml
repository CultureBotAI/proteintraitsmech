identifier: PANTHER:PTHR35698
label: "DNA-BINDING PROTEIN RHL1"
definition: >-
  RHL1 is a component of the DNA topoisomerase VI complex involved in chromatin organisation and progression of endoreduplication cycles. The protein binds DNA and is required for endoreduplication beyond 8C. RHL1 interacts with BIN4 and TOP6A and localises to the nucleus. Loss of RHL1 function results in plants with no hairs on primary roots and an extreme dwarf phenotype.
definition_source: "InterPro:IPR038859 abstract (PANTHER PTHR35698 is a member signature)"
