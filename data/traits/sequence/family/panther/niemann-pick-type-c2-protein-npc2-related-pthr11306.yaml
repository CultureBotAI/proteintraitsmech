identifier: PANTHER:PTHR11306
label: "NIEMANN PICK TYPE C2 PROTEIN NPC2-RELATED"
definition: >-
  Proteins in this family contain an MD-2-related lipid-recognition (ML) domain, which is implicated in lipid recognition, particularly in the recognition of pathogen related products. It has an immunoglobulin-like β-sandwich fold similar to that of E-set Ig domains. This domain is present in proteins from plants, animals and fungi, including the following proteins: NPC intracellular cholesterol transporter 2 (NPC2), which is known to bind cholesterol. Niemann-Pick disease type C2 is a fatal hereditary disease characterised by accumulation of low-density lipoprotein-derived cholesterol in lysosomes. Phosphatidylglycerol/phosphatidylinositol transfer protein (Npc2) from yeasts, which catalyses the intermembrane transfer of phosphatidylglycerol and phosphatidylinositol. House-dust mite allergen proteins such as Der f 2 from Dermatophagoides farinae and Der p 2 from Dermatophagoides pteronyssinus.
definition_source: "InterPro:IPR039670 abstract (PANTHER PTHR11306 is a member signature)"
