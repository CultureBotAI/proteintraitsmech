identifier: PANTHER:PTHR23059
label: "CYSTEINE AND HISTIDINE-RICH PROTEIN 1"
definition: >-
  Zinc finger TRAF-type-containing protein 1 (also known as cysteine and histidine-rich protein 1 (CYHR1)) is an uncharacterised protein containing a degenerate RING-type zinc finger and a TRAF-type zinc finger. It binds to, and might assist in the intracellular trafficking of, the soluble beta-galactoside-binding protein, galectin-3.
