identifier: PANTHER:PTHR41151
label: "PARTNER OF BURSICON"
definition: >-
  Bursicon is a neurohormone released at the end of the molting cycle, involved in the sclerotization (tanning) of the insect cuticle and wing spreading. Bursicon as a heterodimer made of two cystine knot polypeptides: burs-alpha and burs-beta. Bursicon is the natural agonist of the orphan G protein-coupled receptor DLGR2. Burs α-α and burs β-β homodimers are also formed; they act via an unknown receptor and influence expression of additional genes acting after the molt. Burs β-β and bursicon appear to regulate the expression of cuticular protein and chitin metabolizing related genes. This entry represents burs-beta.
