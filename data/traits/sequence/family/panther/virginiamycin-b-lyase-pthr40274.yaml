  - kind: GENERAL
    text: >-
      The Vgb family consists of enzymes known as Virginiamycin B lyases. These enzymes are responsible for inactivating type B streptogramin antibiotics. They achieve this by cleaving the lactone ring at the ester linkage, which results in the formation of a free phenylglycine carboxylate. Additionally, the threonyl moiety is converted into 2-amino-butenoic acid during this process. The action of the Vgb family members is crucial for conferring resistance to certain antibiotics, making them significant in the study of antibiotic resistance mechanisms.
