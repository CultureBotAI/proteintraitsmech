identifier: PANTHER:PTHR46913
label: "RING-H2 FINGER PROTEIN ATL16"
definition: >-
  This entry represents a group of plant RING-H2 finger proteins, including ATL1 and ATL16 from Arabidopsis. They are ubiquitin ligases that contain a RING-H2 domain. ATL1 plays a central role in regulating plant defense responses and programmed cell death. ATL16 is involved in carbon (C) and nitrogen nutrients (N) regulation and the defense response. This entry also includes ATL55 that localises to the plasma membrane lipid rafts to trigger the FB1-induced plant programmed cell death pathway.
