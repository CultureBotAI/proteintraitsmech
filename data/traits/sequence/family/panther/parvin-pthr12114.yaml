identifier: PANTHER:PTHR12114
label: PARVIN
definition: >-
  This entry include parvins from mammals and paralysed arrest at two-fold protein 6 (pat-6) from C. elegans. Parvins and pat-6 contain an actin-binding domain (ABD) that consists of two in tandem arranged calponin homology (CH) domains. The ABD domain enables parvins to recruit F-actin to focal adhesions and associate with stress fibres. Parvins bind to actin binding/regulatory proteins and co-localise with integrins. Therefore, they may be involved in integrin-mediated adhesion and actin-dependent processes such as cell shape regulation and cell migration. In humans, there are three parvins. Alpha-parvin (also known as actopaxin/CH-ILKBP) is ubiquitously expressed and is required for normal development of the embryonic cardiovascular system. Beta-parvin (also known as affixin) is enriched in heart and skeletal muscle. The expression of gamma-parvin (gamma-pv) is restricted to haematopoietic cells and plays a subtle role for blood cell homeostasis.
definition_source: "InterPro:IPR028433 abstract (PANTHER PTHR12114 is a member signature)"
