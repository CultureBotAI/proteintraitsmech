identifier: PANTHER:PTHR35602
label: "ESTERASE YQIA-RELATED"
definition: >-
  Despite being classed as uncharacterised proteins, the members of this family are almost certainly enzymes in that contain a domain distantly related to InterPro:IPR000073. One of the members of this family YqiA has been shown to be a esterase. Other members, which include the Escherichia coli (strain K12) YcfP protein, are uncharacterised.
