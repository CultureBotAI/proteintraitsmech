  - kind: GENERAL
    text: >-
      This family of proteins includes enzymes that belong to the metallo-beta-lactamase superfamily and are involved in the biosynthesis of cofactors. Specifically, they catalyze the condensation of 6-hydroxymethyl-7,8-dihydropterin pyrophosphate with 4-(beta-D-ribofuranosyl)-aminobenzene-5'-phosphate to form a precursor in the biosynthesis of tetrahydromethanopterin. Additionally, they can catalyze the formation of related compounds using different arylamine substrates. These enzymes are characterized by their ability to bind and utilize metal ions to facilitate catalysis.
    source: "InterPro:IPR052926 abstract (LLM-generated, not curator-reviewed)"
