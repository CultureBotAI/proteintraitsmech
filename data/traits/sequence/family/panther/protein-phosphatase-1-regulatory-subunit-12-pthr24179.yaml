  - kind: GENERAL
    text: >-
      PROTEIN PHOSPHATASE 1 REGULATORY SUBUNIT 12 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24179. PANTHER protein class: phosphatase modulator. Members are annotated with the molecular function phosphatase regulator activity, enzyme inhibitor activity, molecular function inhibitor activity. and localise to cytoplasm.
