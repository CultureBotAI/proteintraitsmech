    method: GENERATED
  - kind: GENERAL
    text: >-
      The protein family is involved in the regulation of protein phosphatase 1 (PP1) activity, which is central to various cellular processes. Members of this family mediate the binding to myosin and regulate myosin phosphatase activity, influencing muscle contraction and cell motility. Some members are involved in the dephosphorylation of key proteins such as PLK1, affecting cell cycle progression, and HIF1A, impacting cellular responses to hypoxia. Others contribute to endothelial cell barrier function, angiogenesis, and the PI3K/AKT signaling pathway. Additionally, the family includes proteins that modulate Notch and Wnt signaling pathways, playing roles in development and cell fate determination. Overall, the family members act as key regulators of various signaling cascades and cellular mechanisms through their interactions with and modulation of PP1 activity.
    source: "InterPro:IPR051226 abstract (LLM-generated, not curator-reviewed)"
