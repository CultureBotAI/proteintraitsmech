      PROTEIN PHOSPHATASE 1 REGULATORY SUBUNIT 12 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR24179. PANTHER protein class: phosphatase modulator. Members are annotated with the molecular function enzyme inhibitor activity, phosphatase regulator activity. Members localise to cytoplasm.
