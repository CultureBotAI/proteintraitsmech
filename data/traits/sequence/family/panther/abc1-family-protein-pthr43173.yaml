  - kind: GENERAL
    text: >-
      This family of proteins includes members that are involved in various cellular processes, primarily associated with mitochondrial function and structure. Some proteins within this family appear to play a crucial role in maintaining mitochondrial cristae formation and overall mitochondrial health. They may act in a kinase-independent manner to regulate key mitochondrial structural proteins, although their exact enzymatic activity remains unclear. Additionally, certain members are implicated in the degradation of cell wall material during cell separation, and others are involved in lipid homeostasis within mitochondria. There are also proteins in this family with potential roles in the biosynthesis of antibiotics and in plant immunity as effectors that suppress cell death.
