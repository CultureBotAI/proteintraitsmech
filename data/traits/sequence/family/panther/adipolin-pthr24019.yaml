identifier: PANTHER:PTHR24019
label: ADIPOLIN
definition: >-
  This family of proteins includes adipokines and iron-regulatory hormones with diverse roles in metabolism, iron homeostasis, and cellular signaling. Members are secreted by adipocytes and erythroblasts, influencing glucose metabolism in liver and adipose tissue, and regulating iron absorption and mobilization. They are involved in the activation of signaling pathways such as PI3K-Akt and MAP kinase, affecting processes like glucose uptake, lipid uptake, and suppression of gluconeogenesis. Some members also play roles in the suppression of apoptosis, inflammation, autophagy, and the differentiation of osteoblasts, with implications for bone resorption and cardiovascular health.
