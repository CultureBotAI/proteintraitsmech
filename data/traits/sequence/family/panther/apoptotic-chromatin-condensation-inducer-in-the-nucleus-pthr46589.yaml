  - kind: GENERAL
    text: >-
      APOPTOTIC CHROMATIN CONDENSATION INDUCER IN THE NUCLEUS — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46589. Members are annotated with the molecular function RNA binding, organic cyclic compound binding. and participate in cellular aromatic compound metabolic process, heterocycle metabolic process, macromolecule biosynthetic process. and localise to precatalytic spliceosome, protein-containing complex, nuclear protein-containing complex.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes components of the exon junction complex (EJC), which is involved in mRNA splicing and metabolism. Members of this family are implicated in the regulation of splicing, particularly in the modulation of apoptotic gene isoforms. They are known to bind RNA and are associated with the ASAP complex, which has roles in both splicing inhibition and the promotion of apoptosis. These proteins can induce chromatin condensation in response to apoptotic signals and have been shown to regulate the expression of specific cyclins in leukemia cells.
    source: "InterPro:IPR052793 abstract (LLM-generated, not curator-reviewed)"
