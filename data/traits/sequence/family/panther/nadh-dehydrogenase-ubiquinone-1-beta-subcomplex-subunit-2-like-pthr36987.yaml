identifier: PANTHER:PTHR36987
label: "NADH DEHYDROGENASE [UBIQUINONE] 1 BETA SUBCOMPLEX SUBUNIT 2-LIKE"
definition: >-
  This entry represents NADH dehydrogenase [ubiquinone] 1 beta subcomplex subunit 2 from plants and fungi. NADH dehydrogenase [ubiquinone] 1 beta subcomplex subunit 2 is an accessory subunit of the mitochondrial membrane respiratory chain NADH dehydrogenase (Complex I), that is believed not to be involved in catalysis. Complex I functions in the transfer of electrons from NADH to the respiratory chain. The immediate electron acceptor for the enzyme is believed to be ubiquinone.
