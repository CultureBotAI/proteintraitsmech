identifier: PANTHER:PTHR43523
label: "GLUCOSE-1-PHOSPHATE ADENYLYLTRANSFERASE-RELATED"
definition: >-
  This entry represents the GLGC in plants and bacteria. Glucose-1-phosphate adenylyltransferase (GLGC) catalyses the first committed and rate-limiting step in starch biosynthesis in plants and glycogen biosynthesis in bacteria. It is the enzymatic site for the regulation of storage polysaccharide accumulation in plants and bacteria. The enzyme is a homotetramer.
