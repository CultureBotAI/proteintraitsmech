identifier: PANTHER:PTHR23209
label: "A-KINASE ANCHOR PROTEIN 12"
definition: >-
  A-kinase anchor protein 12 (AKAP12) is an anchoring protein that mediates the subcellular compartmentation of protein kinase A (PKA) and protein kinase C (PKC). AKAP12 may play a tumor/angiogenesis suppressor role.
