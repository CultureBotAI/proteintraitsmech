identifier: PANTHER:PTHR46612
label: "XYLOSIDE XYLOSYLTRANSFERASE 1"
definition: >-
  XXYLT1 (xyloside xylosyltransferase 1) is a type II membrane protein located in the endoplasmic reticulum (ER). It is a retaining glycosyltransferase (GT) that regulates the Notch receptor activation by adding xylose to the Notch extracellular domain.
