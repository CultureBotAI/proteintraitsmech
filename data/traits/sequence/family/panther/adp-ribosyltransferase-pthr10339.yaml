identifier: PANTHER:PTHR10339
label: ADP-RIBOSYLTRANSFERASE
definition: >-
  This family of proteins includes enzymes with ADP-ribosyltransferase activity, which typically modify arginine residues on target proteins using NAD(+) as a substrate [[cite21901419],]. These modifications can regulate protein function and are involved in various cellular processes, including cell signaling and bacterial pathogenesis. Some members possess additional NAD(+) glycohydrolase activity. The family also includes toxins from pathogenic bacteria that interfere with host cell functions, often by ADP-ribosylating host proteins, which can lead to cell death or contribute to bacterial virulence.
