identifier: PANTHER:PTHR42963
label: "CHROMOSOME PARTITION PROTEIN MUKB"
definition: >-
  The MukB/SMC protein family is essential for chromosome condensation, segregation, and cell cycle progression. Members function as homodimers and are involved in negative DNA supercoiling, which helps organize and compact chromosomes. The family proteins may facilitate chromosome segregation by condensing DNA from both sides of a centrally located replisome during cell division. They feature a hinge domain that allows homodimerization, forming a V-shaped structure, and are characterized by large intramolecular coiled coil regions.
