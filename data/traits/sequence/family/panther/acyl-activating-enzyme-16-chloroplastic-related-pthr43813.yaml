label: "ACYL-ACTIVATING ENZYME 16, CHLOROPLASTIC-RELATED"
definition: >-
  ACYL-ACTIVATING ENZYME 16, CHLOROPLASTIC-RELATED — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR43813. PANTHER 19.0 records no annotations on the family itself; the following are shared by all 3 of its annotated subfamilies. Subfamilies are annotated with the molecular function ligase activity, forming carbon-sulfur bonds, ATP-dependent activity. Subfamilies participate in fatty acid biosynthetic process. Subfamilies localise to chloroplast, intracellular anatomical structure, cytoplasm.
