identifier: PANTHER:PTHR36464
label: "PROTEIN BEAN1"
definition: >-
  The function of BEAN1 (brain expressed, associated with Nedd4) is not clear. Mutations in the BEAN1 gene cause spinocerebellar ataxia type 31 (SCA31), an autosomal-dominant cerebellar ataxia showing a Purkinje cell (PC)-predominant neurodegeneration in humans.
