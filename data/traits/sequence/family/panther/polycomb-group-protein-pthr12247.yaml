definitions:
  - kind: GENERAL
    text: >-
      POLYCOMB GROUP PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR12247. PANTHER protein class: chromatin/chromatin-binding, or -regulatory protein. Members are annotated with the molecular function histone binding, chromatin binding. Members participate in negative regulation of DNA-templated transcription. Members localise to nucleus, intracellular anatomical structure.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes Polycomb group (PcG) components and related factors that are involved in chromatin remodeling and transcriptional repression. They play a crucial role in maintaining the repressive state of genes, including homeotic genes, throughout development. Members of this family are characterized by their ability to recognize and bind specific methylated lysine residues on histone proteins, acting as 'readers' of post-translational modifications. This binding can lead to chromatin compaction and gene silencing. Some members also participate in DNA damage repair by promoting homologous recombination. Additionally, they may be involved in cell proliferation, differentiation, and the regulation of ubiquitin-dependent protein degradation. The family includes proteins with MBT repeats, SAM domains, and other domains that contribute to their function in gene regulation and chromatin structure.
    source: "InterPro:IPR050548 abstract (LLM-generated, LLM-reviewed claude-sonnet-5, rejected on re-review as superfamily-level)"
    method: GENERATED
