identifier: PANTHER:PTHR33177
label: PUTATIVE-RELATED
definition: >-
  This family of proteins includes protein GL2-INTERACTING REPRESSOR 1/2 (GIR1/2) and their paralogue, protein salt-induced and EIN3/EIL1-dependent 1 (SIED1), which regulators of plant development and stress responses. GIR1/2 are involved in the modulation of root hair development and act as negative regulators in this process. They may function as adapter proteins, interacting with other proteins to control gene expression related to root hair formation. SIED1 is implicated in ethylene-dependent salt stress responses, where they play a role in reducing the accumulation of reactive oxygen species, thereby protecting the plant from oxidative damage.
definition_source: "InterPro:IPR055281 abstract (PANTHER PTHR33177 is a member signature)"
