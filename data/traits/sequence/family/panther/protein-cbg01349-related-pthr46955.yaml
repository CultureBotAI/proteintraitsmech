  - kind: GENERAL
    text: >-
      The NSUN4 family of proteins is involved in the biogenesis and assembly of mitochondrial ribosomes. Members of this family are 5-methylcytosine rRNA methyltransferases that play a crucial role in the maturation of the mitochondrial ribosome small subunit (SSU) by methylating 12S rRNA, as well as potentially methylating 16S rRNA of the large subunit (LSU). The methylation process is enhanced by the presence of MTERFD2/MTERF4, which also targets NSUN4 to the LSU. The family's function is critical for ensuring the proper assembly of SSU and LSU, which is a final step in ribosome biogenesis. Additionally, some members may methylate cytosine in rRNAs and tRNAs at multiple sites, which could influence the translation of specific codons. All family members belong to the class I-like SAM-binding methyltransferase superfamily within the RsmB/NOP family.
    source: "InterPro:IPR052322 abstract (LLM-generated, not curator-reviewed)"
