identifier: PANTHER:PTHR15462
label: "SERINE PROTEASE"
definition: >-
  The Glutamyl endopeptidase family comprises enzymes that cleave peptide bonds preferentially at the carboxyl-terminal side of aspartate and glutamate. They play a role in bacterial colonization and infection of human tissues by processing proteins like thiol protease SspB and fibronectin-binding proteins, which are crucial for adherence to host cells. Some family members can degrade host immunoglobulins, potentially protecting bacteria from the immune system. They may also contribute to the stability of secreted lipases. Certain enzymes within this family show specificity for glutamic acid residues and can hydrolyze human fibronectin and type 1 collagen. Activity of some members is regulated by inhibitors like diisopropyl fluorophosphate.
