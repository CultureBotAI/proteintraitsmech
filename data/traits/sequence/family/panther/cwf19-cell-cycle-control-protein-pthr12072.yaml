identifier: PANTHER:PTHR12072
label: "CWF19, CELL CYCLE CONTROL PROTEIN"
definition: >-
  This entry represents a group of Cwf19-like proteins, including CWF19L1/2 from humans and Drn1 from budding yeasts. Drn1 modulates turnover of branched RNAs by lariat-debranching enzyme Dbr1. Mutations of the CWF19L1 gene has been linked to spinocerebellar ataxia, autosomal recessive, 17 and autosomal recessive cerebellar ataxia.
