identifier: PANTHER:PTHR31837
label: "CYTOCHROME B-245 CHAPERONE 1"
definition: >-
  Cytochrome b-245 chaperone 1, also known as Eros in mice, is a transmembrane protein that may play a central role as a chaperone critical for expression of gp91phox and p22phox and hence for the cytochrome b558 heterodimer.
