    text: >-
      This family of proteins acts as defensive agents by recognizing specific blood group fucosylated oligosaccharides, including antigens A, B, H, and Lewis B-type. They are involved in the immune response and cell-cell recognition processes. Members of this family do not interact with Lewis A antigen and exhibit low affinity for monovalent haptens.
