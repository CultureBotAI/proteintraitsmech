identifier: PANTHER:PTHR30098
label: "LEUCYL/PHENYLALANYL-TRNA--PROTEIN TRANSFERASE"
definition: >-
  Leucyl/phenylalanyl-tRNA--protein transferase EC:2.3.2.6 transfers a Leu or Phe to the amino end of certain proteins to enable degradation. The N-terminal residue controls the biological half-life of many proteins via the N-end rule pathway.
