identifier: PANTHER:PTHR13405
label: "NUCLEAR PORE COMPLEX PROTEIN NUP133"
definition: >-
  This entry includes the nuclear pore complex proteins Nup133, Nup132, Nup131 and Nup15 (from Caenorhabditis elegans). Nup133 is a component of the Nup160 subcomplex, which consists of Nup160, Nup133, Nup107 and Nup96, and is important for mRNA export from the nucleus. Nup160 subcomplexes are localized to both sides of the NPC during interphase. Nup133 also localizes to kinetochores. Nup131 and Nup132 are components of the npc107-120 complex in Schizosaccharomyces pombe. This complex consists of nup85, nup107, nup120, nup131, nup132 and seh1 and is also required for mRNA export.
