  - kind: GENERAL
    text: >-
      This family of proteins includes calcium-permeable cation-selective channels that play a crucial role in plant immunity. They facilitate the increase of cytosolic calcium levels in root pericycle cells, which is essential for conferring resistance to a broad spectrum of clubroot diseases. These proteins are known to be activated in response to fungal pathogens, such as Plasmodiophora brassicae, and contribute to the induction of defense mechanisms in plants. In addition to calcium, these channels are permeable to sodium ions and potentially other cations, suggesting a versatile role in ion homeostasis and signaling.
    source: "InterPro:IPR053258 abstract (LLM-generated, not curator-reviewed)"
