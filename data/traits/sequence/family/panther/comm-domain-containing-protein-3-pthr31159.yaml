identifier: PANTHER:PTHR31159
label: "COMM DOMAIN-CONTAINING PROTEIN 3"
definition: >-
  COMMD3 is a member of the COMMD family defined by the presence of a conserved and unique motif termed the COMM (copper metabolism gene MURR1) domain, which functions as an interface for protein-protein interactions. COMMD3 modulates Na+ transport in epithelial cells by regulation of apical cell surface expression of amiloride-sensitive sodium channel (ENaC) subunits.
definition_source: "InterPro:IPR037355 abstract (PANTHER PTHR31159 is a member signature)"
