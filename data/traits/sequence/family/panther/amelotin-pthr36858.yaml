identifier: PANTHER:PTHR36858
label: AMELOTIN
definition: >-
  Amelotin (AMTN) is specifically expressed during the maturation stage of dental enamel formation. It plays a role in dental enamel formation by promoting hydroxyapatite mineralisation.
