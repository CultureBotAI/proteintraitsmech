identifier: PANTHER:PTHR23273
label: "REPLICATION FACTOR A 1, RFA1"
definition: >-
  REPLICATION FACTOR A 1, RFA1 — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR23273. PANTHER protein class: DNA metabolism protein. Members are annotated with the molecular function single-stranded telomeric DNA binding, damaged DNA binding. Members participate in telomere maintenance via telomerase, double-strand break repair via homologous recombination, nucleotide-excision repair. Members localise to nuclear lumen, replisome, non-membrane-bounded organelle.
