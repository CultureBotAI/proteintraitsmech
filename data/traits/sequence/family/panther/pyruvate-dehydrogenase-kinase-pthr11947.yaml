identifier: PANTHER:PTHR11947
label: "PYRUVATE DEHYDROGENASE KINASE"
definition: >-
  This entry includes [3-methyl-2-oxobutanoate dehydrogenase [lipoamide]] kinase (BCKDK) and [Pyruvate dehydrogenase (acetyl-transferring)] kinase (PDK). BCKDK is a serine/threonine-protein kinase component of macronutrients metabolism. It forms a functional kinase and phosphatase pair with PPM1K, serving as a metabolic regulatory node that coordinates branched-chain amino acids (BCAAs) with glucose and lipid metabolism via two distinct phosphoprotein targets: mitochondrial BCKDHA subunit of the branched-chain alpha-ketoacid dehydrogenase (BCKDH) complex and cytosolic ACLY, a lipogenic enzyme of Krebs cycle.
definition_source: "InterPro:IPR039028 abstract (PANTHER PTHR11947 is a member signature)"
