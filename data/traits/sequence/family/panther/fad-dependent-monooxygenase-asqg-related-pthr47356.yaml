identifier: PANTHER:PTHR47356
label: "FAD-DEPENDENT MONOOXYGENASE ASQG-RELATED"
definition: >-
  This FAD-dependent monooxygenase family consists of enzymes involved in the biosynthesis of various fungal secondary metabolites, including meroterpenoids, indole-diterpenes, and polyketides. These metabolites often exhibit bioactive properties such as mycotoxicity, immunosuppression, and inhibition of mammalian ion channels or enzymes. Family members catalyse critical oxidation steps, including epoxidation, hydroxylation, and oxidative rearrangements, which are essential for constructing complex molecular architectures and functional groups. The versatility of these enzymes allows for the generation of diverse metabolites through regio- and stereo-specific modifications, contributing to the metabolic richness of fungal species.
definition_source: "InterPro:IPR050562 abstract (PANTHER PTHR47356 is a member signature)"
