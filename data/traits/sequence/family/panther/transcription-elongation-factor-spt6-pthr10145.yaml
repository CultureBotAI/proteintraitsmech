identifier: PANTHER:PTHR10145
label: "TRANSCRIPTION ELONGATION FACTOR SPT6"
definition: >-
  Spt6 is an essential histone chaperone that mediates nucleosome reassembly during gene transcription. The N-terminal ~300 residues are highly acidic, predicted to be disordered, and are necessary for binding both nucleosomes and the transcription factor Spn1/IWS1. Spt6 associates with RNAPII via a tandem Src2 homology domain. Spt6-RNAPII association is required for efficient recruitment of the Ccr4-Not de-adenylation complex to transcribed genes for mRNA turnover. Spt6 has a key function in transcription elongation. In yeast, Spt6's interaction with phosphorylated tyrosine 1 at the C-terminal domain of RNAPII prevents pre-mature recruitment of termination factors to genes.
definition_source: "InterPro:IPR017072 abstract (PANTHER PTHR10145 is a member signature)"
