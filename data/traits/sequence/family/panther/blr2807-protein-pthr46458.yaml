  - kind: GENERAL
    text: >-
      This family of proteins includes members that are primarily involved in the transport and storage of oxygen. Some proteins in this family are known to bind heme groups, which facilitate the reversible binding of oxygen molecules. Certain members are also involved in redox signaling, electron transport, and may act as physiological sensors for oxygen. A subset of these proteins, known as neuroglobins, are involved in oxygen transport within the brain and exhibit hexacoordinate binding to an iron atom. These neuroglobins may also play a role in neuroprotection during oxidative stress by participating in anti-apoptotic activities. Other functions noted include nitrite reductase activity and the ability to bind and transport hydrosulfide, indicating a multifaceted role in cellular respiration and response to varying oxygen levels.
