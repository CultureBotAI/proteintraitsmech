    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins contains a thioredoxin domain and is involved in redox reactions, where it catalyzes the reversible oxidation of its active center dithiol to a disulfide and facilitates dithiol-disulfide exchange reactions. Members of this family inhibit an alternative triglyceride biosynthesis pathway, thus regulating triacylglycerol accumulation. They function as protein disulfide isomerases, aiding in the formation and reduction of disulfide bonds, particularly of transmembrane proteins at the endoplasmic reticulum membrane. They are also involved in the endoplasmic reticulum-associated degradation pathway, targeting folding-defective polypeptides. Additionally, these proteins play a role in the regulation of platelet aggregation, endoplasmic reticulum-mitochondria contact sites, and calcium flux between these organelles.
    source: "InterPro:IPR052454 abstract (LLM-generated, not curator-reviewed)"
