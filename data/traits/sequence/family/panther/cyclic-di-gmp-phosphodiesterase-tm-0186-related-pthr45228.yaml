identifier: PANTHER:PTHR45228
label: "CYCLIC DI-GMP PHOSPHODIESTERASE TM_0186-RELATED"
definition: >-
  This family of proteins includes cyclic di-GMP and 3'3'-cGAMP-specific phosphodiesterases. They are involved in the hydrolysis of cyclic dinucleotides, such as cyclic diguanylate (c-di-GMP) and 3'3'-cyclic GMP-AMP (3'3'-cGAMP), to linear nucleotides. These enzymes play key roles in bacterial signalling pathways, regulating processes such as motility, biofilm formation, and virulence. They act by modulating the levels of cyclic dinucleotides within the cell, which serve as secondary messengers. Some family members are regulated by metal ion binding or phosphorylation, which affects their catalytic activity. The proteins may contain specific domains, such as HD-GYP, that are crucial for their function and interaction with other proteins.
definition_source: "InterPro:IPR052020 abstract (PANTHER PTHR45228 is a member signature)"
