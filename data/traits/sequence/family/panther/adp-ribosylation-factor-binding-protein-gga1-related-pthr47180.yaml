identifier: PANTHER:PTHR47180
label: "ADP-RIBOSYLATION FACTOR-BINDING PROTEIN GGA1-RELATED"
definition: >-
  This family of proteins is involved in the regulation of membrane traffic, particularly through the trans-Golgi network. Members of this family are likely to interact with ADP-ribosylation factors, which are small GTP-binding proteins critical for vesicle formation and trafficking. The association with these factors suggests a role in the sorting of cargo proteins for transport to different destinations within the cell.
