identifier: PANTHER:PTHR46028
label: "KYNURENINE 3-MONOOXYGENASE"
definition: >-
  KYNURENINE 3-MONOOXYGENASE — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR46028. PANTHER protein class: oxygenase, oxidoreductase. Members are annotated with the molecular function catalytic activity, monooxygenase activity, oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen. Members participate in alpha-amino acid metabolic process, cellular aromatic compound metabolic process, organic cyclic compound metabolic process.
