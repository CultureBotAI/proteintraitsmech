  - kind: GENERAL
    text: >-
      This family of proteins includes receptors that are structurally similar to known receptor-like proteins (RLPs). RLPs typically function in signal transduction pathways and are involved in various biological processes, including development, immunity, and stress responses in plants. They are characterized by an extracellular domain that can bind specific ligands, a transmembrane region, and a short cytoplasmic tail. However, they lack the intrinsic kinase activity found in receptor-like kinases (RLKs). Instead, they may interact with other proteins to transduce signals within the cell.
