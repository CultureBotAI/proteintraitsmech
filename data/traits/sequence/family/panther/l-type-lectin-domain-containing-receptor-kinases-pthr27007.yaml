identifier: PANTHER:PTHR27007
label: "L-type Lectin-Domain Containing Receptor Kinases"
definition: >-
  The L-type lectin-domain containing receptor kinase family is involved in a variety of plant defense responses and developmental processes. Members of this family play key roles in resistance to pathogenic bacteria, fungi, and oomycetes, such as Pseudomonas syringae, Alternaria brassicicola, Phytophthora infestans, and Phytophthora capsici. Some proteins within the family are also implicated in the regulation of abscisic acid response during seed germination and in the negative regulation of salt tolerance. Additionally, certain members are essential for pollen development and male fertility, mediating processes like pollen exine assembly and aperture development. The family is characterized by an N-terminal leguminous lectin domain, which may be involved in ligand recognition and protein-protein interactions, and a C-terminal serine/threonine protein kinase domain, suggesting a role in signal transduction through phosphorylation. Some proteins are activated by autophosphorylation in response to stress conditions, while others may have catalytically inactive kinase domains.
