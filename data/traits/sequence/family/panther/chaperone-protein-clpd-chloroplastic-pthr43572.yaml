  - kind: GENERAL
    text: >-
      This family of proteins is involved in the regulation of plant growth and development processes, particularly in response to environmental signals such as strigolactones and karrikins. Members act as components of transcriptional corepressor complexes, repressing the signaling pathways that control various aspects of plant physiology including tiller development, seedling growth, and branching control. They also play roles in modulating reactive oxygen species levels, abscisic acid-dependent stomatal closure, photosynthesis, and ion homeostasis. The proteins contain EAR motifs, which are associated with active repression of target genes, and some have ATPase activity.
    source: "InterPro:IPR051650 abstract (LLM-generated, not curator-reviewed)"
