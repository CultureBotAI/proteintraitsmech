  - kind: GENERAL
    text: >-
      FORKHEAD BOX PROTEIN — a full-length protein family modelled by the PANTHER 19.0 profile HMM PTHR11829. PANTHER protein class: DNA-binding transcription factor, helix-turn-helix transcription factor, winged helix/forkhead transcription factor. Members are annotated with the molecular function RNA polymerase II cis-regulatory region sequence-specific DNA binding, cis-regulatory region sequence-specific DNA binding, double-stranded DNA binding. and participate in cell differentiation, cellular developmental process, anatomical structure morphogenesis.
    source: "PANTHER 19.0 (composed from the family name and its GO / protein-class annotations)"
    method: GENERATED
  - kind: GENERAL
    text: >-
      This family of proteins includes transcription factors that play key roles in various developmental processes, such as differentiation of hair follicles, pharyngeal arch development, and embryonic patterning. Members of this family are involved in the regulation of gene expression by binding to DNA consensus sequences and acting as either transcriptional activators or repressors. They are essential for the proper development and function of multiple tissues, including the liver, pancreas, lungs, and kidneys. Some proteins within this family are also implicated in the maintenance of cell viability and resistance to oxidative stress, as well as in the regulation of cell cycle and apoptosis. They are characterized by the presence of a forkhead box (FOX) domain, which is a conserved DNA-binding motif.
