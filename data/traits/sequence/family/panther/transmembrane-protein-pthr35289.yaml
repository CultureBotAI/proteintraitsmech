  - kind: GENERAL
    text: >-
      This family of proteins includes uncharacterized mitochondrial proteins from Arabidopsis thaliana. One member is similar to the universal ribosomal protein uS3, suggesting a role in mitochondrial ribosome function. Ribosomal protein uS3 is known to be involved in the initiation of protein synthesis and may have additional roles in RNA processing and repair. The exact functions of the other family members remain to be elucidated, but their mitochondrial localization implies a role in mitochondrial biogenesis, energy metabolism, or the regulation of mitochondrial gene expression.
