identifier: PANTHER:PTHR37344
label: "SMALL INTEGRAL MEMBRANE PROTEIN 5"
definition: >-
  This is a small family of proteins found in vertebrates, including the small integral membrane protein 5 (SMIM5) from human, whose function is not yet clear. This protein has been reported as a variant of the Cancer-Associated Small Integral Membrane Open reading frame 1 (CASIMO1), a small open reading frame (sORF)-encoded protein (also known as a microprotein). CASIMO1 controls cell proliferation and interacts with squalene epoxidase (SQLE) modulating lipid droplet formation.
definition_source: "InterPro:IPR047133 abstract (PANTHER PTHR37344 is a member signature)"
