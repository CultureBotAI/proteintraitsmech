identifier: PANTHER:PTHR45945
label: "REGULATOR OF G-PROTEIN SIGNALING LOCO"
definition: >-
  RGS (Regulator of G protein Signalling) proteins are multi-functional, GTPase-accelerating proteins that promote GTP hydrolysis by the alpha subunit of heterotrimeric G proteins, thereby inactivating the G protein and rapidly switching off G protein-coupled receptor signalling pathways. Upon activation by GPCRs, heterotrimeric G proteins exchange GDP for GTP, are released from the receptor, and dissociate into free, active GTP-bound alpha subunit and beta-gamma dimer, both of which activate downstream effectors. The response is terminated upon GTP hydrolysis by the alpha subunit, which can then bind the beta-gamma dimer and the receptor. RGS proteins markedly reduce the lifespan of GTP-bound alpha subunits by stabilising the G protein transition state. The human genome encode more than three dozen RGS domain-containing proteins with varied G-alpha substrate specificities, and are classified in eight different subfamilies: A or RZ; B or R4; C or R7; D or R12; E or RA; F or GEF; G or GRK (GPCR kinase) and H or SNX (sorting nexin). This entry represents the R12 RGS subfamily, which includes RGS10, RGS12 and RGS14 proteins, all of which are highly selective for G-alpha-i1 over G-alpha-q. This entry also includes regulator of G-protein signalling loco from Drosophila melanogaster, which is an RGS14 orthologue.
