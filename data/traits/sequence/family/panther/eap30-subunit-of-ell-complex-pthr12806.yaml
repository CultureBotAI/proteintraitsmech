identifier: PANTHER:PTHR12806
label: "EAP30 SUBUNIT OF ELL COMPLEX"
definition: >-
  Snf8 (also known as Vps22p/Eap30) is a subunit of ESCRT-II, a protein complex involved in driving protein sorting from endosomes to lysosomes. The multivesicular body (MVB) protein-sorting pathway targets transmembrane proteins either for degradation or for function in the vacuole/lysosomes. The signal for entry into this pathway is monoubiquitination of protein cargo, which results in incorporation of cargo into luminal vesicles at late endosomes. Another crucial player is phosphatidylinositol 3-phosphate (PtdINS(3)P), which is enriched on early endosomes and on the luminal vesicles of MVBs. ESCRT (endosomal sorting complex required for transport)-I, -II and -III complexes are critical for MVB budding and sorting of monoubiquitinated cargo into the luminal vesicles.
definition_source: "InterPro:IPR016689 abstract (PANTHER PTHR12806 is a member signature)"
