identifier: HAMAP:MF_01819
label: "Transcriptional regulator SlyA [slyA]"
definition: >-
  This entry represents transcriptional regulators SlyA. In Escherichia coli, SlyA activates expression of genes such as molecular chaperones (groL, groS, dnaK, grpE, and cbpA), proteins involved in acid resistance (hdeA, hdeB, and gadA), the starvation lipoprotein slp, virulence protein hlyE/clyA. Represses expression of genes involved in the histidine biosynthetic pathway such as hisA, hisB, hisD, hisF and hisG. Required for the activation of virulence genes.
