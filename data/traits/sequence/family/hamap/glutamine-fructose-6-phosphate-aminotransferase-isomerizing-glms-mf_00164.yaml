identifier: HAMAP:MF_00164
label: "Glutamine--fructose-6-phosphate aminotransferase [isomerizing] [glmS]"
definition: >-
  Glucosamine:fructose-6-phosphate aminotransferase (GFAT or GlmS, EC:2.6.1.16) catalyses the formation of glucosamine 6-phosphate and is the first and rate-limiting enzyme of the hexosamine biosynthetic pathway. The final product of the hexosamine pathway, UDP-N-acetyl glucosamine, is an active precursor of numerous macromolecules containing amino sugars. This family of sequences belong to the MEROPS peptidase family C44 (clan PB(C)), and are classified as non-peptidase homologues.
