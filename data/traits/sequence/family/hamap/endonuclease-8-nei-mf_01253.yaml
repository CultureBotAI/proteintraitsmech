identifier: HAMAP:MF_01253
label: "Endonuclease 8 [nei]"
definition: >-
  This entry represents the endonuclease 8 (also known as Nei) enzyme involved in base excision repair of DNA damaged by oxidation or by mutagenic agents. Endonuclease 8 acts as DNA glycosylase that recognises and removes damaged bases. The enzyme has a preference for oxidized pyrimidines, such as thymine glycol, 5,6-dihydrouraciland 5,6-dihydrothymine. It also has AP (apurinic/apyrimidinic) lyase activity and introduces nicks in the DNA strand.The enzyme binds 1 zinc ion per subunit and acts by cleaving the DNA backbone by beta-delta elimination to generate a single-strand-break at the site of the removed base with both 3'- and 5'-phosphates. The C-O-P bond 3' to the apurinic orapyrimidinic site in DNA which is broken by the beta-elimination reaction leaves a 3'-terminal unsaturated sugar and a product with a terminal 5'-phosphate. This enzyme belongs to the FPG family and contains 1 FPG-type zinc finger.
