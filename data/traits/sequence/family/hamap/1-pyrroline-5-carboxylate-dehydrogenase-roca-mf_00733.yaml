identifier: HAMAP:MF_00733
label: "1-pyrroline-5-carboxylate dehydrogenase [rocA]"
definition: >-
  This entry represents a group of 1-pyrroline-5-carboxylate dehydrogenases (RocA) specific to Bacillales, aldehyde dehydrogenases that catalyses the oxidation of glutamate semialdehyde to glutamate, utilizing NAD as the electron acceptor. These enzymes play important roles in cellular redox control, superoxide generation, and apoptosis.
