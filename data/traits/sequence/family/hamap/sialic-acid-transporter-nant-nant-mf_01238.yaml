identifier: HAMAP:MF_01238
label: "Sialic acid transporter NanT [nanT]"
definition: >-
  This entry represents sialic acid transporters. The sugar transporters belong to a family of membrane proteins responsible for the transport of various sugars in a wide range of prokaryotic and eukaryotic organisms. These integral membrane proteins are predicted to comprise twelve membrane spanning domains. It is likely that the transporters have evolved from an ancient protein present in living organisms before the divergence into prokaryotes and eukaryotes. In mammals, these proteins are expressed in a number of organs. Proteins transporting sugars and other substrates are related in this broader family.
