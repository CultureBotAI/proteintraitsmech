identifier: HAMAP:MF_00142
label: "Iron-sulfur cluster assembly protein CyaY [cyaY]"
definition: >-
  This entry represents Iron-sulfur cluster assembly protein CyaY and similar proteins from proteobacteria. CyaY, the bacterial homologous to eukaryotic protein Frataxin, is involved in iron-sulfur (Fe-S) cluster assembly. Partial Phylogenetic Profiling suggests that CyaY most likely functions as part of the ISC system for FeS cluster biosynthesis, and is supported by experimental data in some species.
