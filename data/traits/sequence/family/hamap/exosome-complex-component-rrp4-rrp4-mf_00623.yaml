identifier: HAMAP:MF_00623
label: "Exosome complex component Rrp4 [rrp4]"
definition: >-
  The archaeal exosome is a protein complex involved in the degradation and the posttranscriptional tailing of RNA. Rrp4 is a structural component of the exosome that confers poly(A) specificity.
