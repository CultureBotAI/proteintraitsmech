identifier: HAMAP:MF_00435
label: "Ketol-acid reductoisomerase (NADP(+)) [ilvC]"
definition: >-
  Ketol-acid reductoisomerase (KARI) or acetohydroxy acid isomeroreductase catalyses the conversion of acetohydroxy acids into dihydroxy valerates. This reaction is the second in the synthetic pathway of the essential branched side chain amino acids valine and isoleucine. The enzyme forms a tetramer of similar but non-identical chains, and requires magnesium as a cofactor. Most ketol-acid reductoisomerases prefer the NADPH cofactor to NADH, but NADH-utilizing enzymes has also been identified.
definition_source: "InterPro:IPR013023 abstract (HAMAP MF_00435 is a member signature)"
