identifier: HAMAP:MF_01122
label: "DNA/RNA-binding protein Alba [albA]"
definition: >-
  The DNA/RNA-binding protein Alba binds double-stranded DNA tightly but without sequence specificity. It binds rRNA and mRNA in vivo, and may play a role in maintaining the structural and functional stability of RNA, and, perhaps, ribosomes. It is distributed uniformly and abundantly on the chromosome. Alba has been shown to bind DNA and affect DNA supercoiling in a temperature dependent manner. It is regulated by acetylation (alba = acetylation lowers binding affinity) by the Sir2 protein. Alba is proposed to play a role in establishment or maintenance of chromatin architecture and thereby in transcription repression. For further information see.
definition_source: "InterPro:IPR013795 abstract (HAMAP MF_01122 is a member signature)"
