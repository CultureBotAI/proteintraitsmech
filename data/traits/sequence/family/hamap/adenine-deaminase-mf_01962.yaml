identifier: HAMAP:MF_01962
label: "Adenine deaminase"
definition: >-
  Adenine deaminase ( ) hydrolyses adenine to form hypoxanthine and ammonia. The enzyme is part of a large metal dependent hydrolase superfamily. It plays an important role in the purine salvage pathway and in nitrogen catabolism. This entry represents the type 2 adenine deaminase that is more related to the bacterial and eukaryotic adenosine deaminases than to Bacillus subtilis adenine deaminase and its bacterial homologues.
