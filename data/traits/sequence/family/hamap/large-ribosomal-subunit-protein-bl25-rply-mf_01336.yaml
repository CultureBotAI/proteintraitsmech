identifier: HAMAP:MF_01336
label: "Large ribosomal subunit protein bL25 [rplY]"
definition: >-
  This entry models the short-form of the ribosomal bL25 protein, previously known as L25. The long-form has homology to the general stress protein Ctc of Bacillus subtilis, a mesophile, and ribosomal protein TL5 of Thermus thermophilus, a thermophile. Ribosomal protein L25 of Escherichia coli and Haemophilus influenzae appear to be orthologous but consist only of the N-terminal half of Ctc and TL5. Both short (L25-like) and full-length (CTC-like) members of this family bind the E-loop of bacterial 5S rRNA.
definition_source: "InterPro:IPR020055 abstract (HAMAP MF_01336 is a member signature)"
