identifier: HAMAP:MF_00804
label: "Betaine aldehyde dehydrogenase [betB]"
definition: >-
  Under osmotic stress, betaine aldehyde dehydrogenase oxidises glycine betaine aldehyde into the osmoprotectant glycine betaine, via the second of two oxidation steps from exogenously supplied choline or betaine aldehyde. This choline-glycine betaine synthesis pathway can be found in Gram-positive and Gram-negative bacteria. In Escherichia coli, betaine aldehyde dehydrogenase (betB) is osmotically co-induced with choline dehydrogenase (betA) in the presence of choline. These dehydrogenases are located in a betaine gene cluster with the upstream choline transporter (betT) and transcriptional regulator (betI). Similar to E. coli, betaine synthesis in Staphylococcus xylosus is also influenced by osmotic stress and the presence of choline with genes localised in a functionally equivalent gene cluster. Organisation of the betaine gene cluster in Rhizobium meliloti (Sinorhizobium meliloti) and Bacillus subtilis differs from that of E. coli by the absence of upstream choline transporter and transcriptional regulator homologues. Additionally, B. subtilis co-expresses a type II alcohol dehydrogenase with betaine aldehyde dehydrogenase instead of choline dehydrogenase as in E. coli, S. xylosus, and S. meliloti. Betaine aldehyde dehydrogenase is a member of the aldehyde dehydrogenase family. BetB from P. aeruginosa catalyses the irreversible oxidation of betaine aldehyde to the corresponding acid, a compulsory step in the assimilation of carbon and nitrogen when bacteria are growing in choline or choline precursors and it can use NADP+ with similar efficiency to NAD+, a property that can be used by the bacterium to produce the NADPH needed to combat the oxidative stress imposed by the host defenses.
