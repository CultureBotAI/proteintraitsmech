identifier: HAMAP:MF_00999
label: "Sulfofructose kinase"
definition: >-
  Escherichia coli and other Enterobacteria can perform sulphoglycolysis in addition to standard glycolysis. In this pathway, sulphoquinovose (SQ) -a sulfonic acid derivative of glucose- is used as source of carbon and energy. Sulfofructose kinase phosphorylates 6-deoxy-6-sulfo-D-fructose (SF) to 6-deoxy-6-sulfo-D-fructose 1-phosphate (SFP). It is part of the sulphoquinovose degradative pathway.
