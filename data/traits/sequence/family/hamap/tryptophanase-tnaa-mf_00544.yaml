identifier: HAMAP:MF_00544
label: "Tryptophanase [tnaA]"
definition: >-
  Proteins in this entry belong to the beta-eliminating lyase family and are thought to act as tryptophanases ( ) (also known as L-tryptophan indole-lyases). The genes encoding these proteins are, as a rule, found with a tryptophanase leader peptide TnaC encoded upstream.
