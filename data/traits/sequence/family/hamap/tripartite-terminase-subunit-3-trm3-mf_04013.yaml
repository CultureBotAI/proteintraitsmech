identifier: HAMAP:MF_04013
label: "Tripartite terminase subunit 3 [TRM3]"
definition: >-
  This family includes proteins that are required for DNA packing in viruses of the Herpesviridae family. The tripartite terminase is a complex of three subunits, (TRM1, TRM2 and TRM3) that forms in the host cytoplasm. The complex moves to the host nucleus where it interacts with the capsid portal vertex, which forms a ring permitting genomic DNA to translocate to the viral capsule. Subunit TRM3 (also known as UL15) is an RNase H-like nuclease that cleaves concatenated viral DNA into unit length genomes.
definition_source: "InterPro:IPR033663 abstract (HAMAP MF_04013 is a member signature)"
