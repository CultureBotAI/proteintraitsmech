identifier: HAMAP:MF_01136
label: "Acetyl-CoA decarbonylase/synthase complex subunit gamma [cdhE]"
definition: >-
  This entry represents the ACDS gamma subunit in archaea. This group represents the gamma subunit of acetyl-CoA decarbonylase/synthase (ACDS), a complex catalysing the reversible cleavage of acetyl-CoA. Depending on the direction of the reaction this complex allows either growth on acetate as sole carbon and energy source, or autotrophic growth from carbon dioxide/carbon monoxide. The ACDS complex contains five subunits, among which beta possesses an Ni-Fe-S active-site metal cluster, the A-cluster, at which reaction with acetyl-CoA takes place, generating an acetyl-enzyme species poised for C-C bond cleavage. The ACDS complex is made up of alpha, epsilon, beta, gamma and delta chains with a probable stoichiometry of (alpha(2)epsilon(2))(4)-beta(8)-(gamma(1)delta(1))(8). Titration experiments indicate that two electrons are required for activation of the enzyme in the process of forming the enzyme-acetyl intermediate.
definition_source: "InterPro:IPR023427 abstract (HAMAP MF_01136 is a member signature)"
