identifier: HAMAP:MF_01431
label: "Pyrimidine-specific ribonucleoside hydrolase RihA [rihA]"
definition: >-
  The rihA gene encodes a ribonucleoside hydrolase that preferentially utilises cytidine and uridine. The k cat /K M for uridine is approximately 10 times higher than for cytidine, largely due to a lower K M value for uridine. There are two other nucleoside hydrolases with differing specificities encoded by the rihB and rihC genes.An rihA null mutant can not use cytidine as a source of pyrimidine and the rihA and rihC genes are subject to catabolite repression. A crystal structure of RihA bound to the reaction product D-ribose has been solved at 1.8A resolution.
