identifier: HAMAP:MF_00913
label: "Probable peptidoglycan glycosyltransferase FtsW [ftsW]"
definition: >-
  FtsW is an integral membrane protein with ten transmembrane segments. In general, it is one of two paralogues involved in peptidoglycan biosynthesis, the other being RodA, and is essential for cell division. In endospore-forming bacteria (e.g. Bacillus subtilis) three or more RodA/FtsW/SpoVE family paralogues are present. SpoVE acts in spore cortex formation and is dispensable for growth. FtsW belongs to the so called SEDS (shape, elongation, division and sporulation) family, which are thought to be peptidoglycan polymerases.
