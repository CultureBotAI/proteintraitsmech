identifier: HAMAP:MF_01915
label: "Lipopolysaccharide export system protein LptC [lptC]"
definition: >-
  LptC is involved in the translocation of lipopolysaccharide (LPS) from the inner membrane to the outer membrane in Gram-negative bacteria. It facilitates the transfer of LPS from the inner membrane to a periplasmic chaperone, LptA.
