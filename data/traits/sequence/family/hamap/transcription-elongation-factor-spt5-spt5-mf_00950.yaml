identifier: HAMAP:MF_00950
label: "Transcription elongation factor Spt5 [spt5]"
definition: >-
  Transcription elongation factor Spt5 is composed of a NusG N-terminal (NGN) domain and a KOW domain, similar to bacterial NusG. It forms heterodimer with Spt4 and stimulates transcription elongation. Its NGN domain closes the RNAP active centre cleft to lock nucleic acids and render the elongation complex stable and processive. Its KOW domain may interact with RNA and/or other factors. The structure of Spt4/5 complex has been solved.
