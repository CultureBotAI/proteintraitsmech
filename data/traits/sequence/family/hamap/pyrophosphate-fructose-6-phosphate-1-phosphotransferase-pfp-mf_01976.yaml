identifier: HAMAP:MF_01976
label: "Pyrophosphate--fructose 6-phosphate 1-phosphotransferase [pfp]"
definition: >-
  This entry includes pyrophosphate--fructose 6-phosphate 1-phosphotransferase from Amycolatopsis methanolica and ATP-dependent 6-phosphofructokinase 2 from Streptomyces coelicolor. They catalyzes the phosphorylation of D-fructose 6-phosphate, the first committing step of glycolysis.
