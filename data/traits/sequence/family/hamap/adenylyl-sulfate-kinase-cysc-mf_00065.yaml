identifier: HAMAP:MF_00065
label: "Adenylyl-sulfate kinase [cysC]"
definition: >-
  Adenylylsulphate kinase (EC:2.7.1.25) catalyses the phosphorylation of adenylylsulphate to 3'-phosphoadenylylsulphate. It is often found as a fusion protein with sulphate adenylyltransferase. Both enzymes are required for PAPS (phosphoadenosine-phosphosulphate) synthesis from inorganic sulphate.
