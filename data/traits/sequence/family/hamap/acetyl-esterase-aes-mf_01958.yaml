identifier: HAMAP:MF_01958
label: "Acetyl esterase [aes]"
definition: >-
  Proteins in this entry belong to the 'GDXG' family of lypolytic enzymes and are also known as Aes proteins. They have esterase activity against short chain (up to 8 carbon atoms) fatty esters and are able to hydrolyse triacetin and tributyrin but not triolein or cholesterol oleate. These proteins are involved in the downregulation of the transcriptional activator of the maltose regulon, MalT, in E. coli.
