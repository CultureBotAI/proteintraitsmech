identifier: HAMAP:MF_01838
label: "Trans-2-enoyl-CoA reductase [NADH] [fabV]"
definition: >-
  This entry represents trans-2-enoyl-CoA reductase which catalyses reduction of enoyl-CoA to acyl-CoA, an important step of fatty acid biosynthesis which is performed under anaerobiosis. This entry also includes triclosan-resistant enoyl-acyl carrier protein reductase, such as FabV from Pseudomonas aeruginosa and Aeromonas salmonicida.
