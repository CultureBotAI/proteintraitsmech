identifier: HAMAP:MF_02123
label: "F420-dependent glucose-6-phosphate dehydrogenase [fgd]"
definition: >-
  This family consists of the F420-dependent glucose-6-phosphate dehydrogenase of Mycobacterium and Nocardia. It shows homology to several other F420-dependent enzymes rather than to the NAD or NADP-dependent glucose-6-phosphate dehydrogenases.
