identifier: HAMAP:MF_01311
label: "Protein-disulfide oxidoreductase DsbI [dsbI]"
definition: >-
  This group of proteins belongs to the DsbI subfamily of the DsbB family. DsbI is required for disulfide bond formation in some proteins. It is part of a redox system composed of DsbI and DsbL that mediates formation of an essential disulfide bond in arylsulfate sulfotransferase AssT.
