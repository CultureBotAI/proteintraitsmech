identifier: HAMAP:MF_02023
label: "Dissimilatory sulfite reductase"
definition: >-
  This entry include a group of dissimilatory sulfite reductases from Proteobacteria, including SirA from Shewanella oneidensis and MccA from Wolinella succinogenes. They are respiratory sulfite reductases that catalyse the reduction of sulfite to sulfide in a single step, consuming six electrons in the process. MccA is an unconventional octahaem cytochrome c containing a special haem c group that is bound via two cysteine residues arranged in a unique CX(15)CH haem c binding motif.
