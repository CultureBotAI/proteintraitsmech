identifier: HAMAP:MF_01234
label: "N-acetylmannosamine kinase [nanK]"
definition: >-
  This entry represents the bacterial N-acetylmannosamine kinase subfamily of the ROK family. Proteins in this entry catalyse the phosphorylation of N-acetylmannosamine(ManNAc) to ManNAc-6-P. A family of bacterial proteins has been described which groups transcriptional repressors, sugar kinases and yet uncharacterised open reading frames. This family, known as ROK (Repressor, ORF, Kinase) includes the xylose operon repressor, xylR, from Bacillus subtilis, Lactobacillus pentosus and Staphylococcus xylosus; N-acetylglucosamine repressor, nagC, from Escherichia coli; glucokinase EC:2.7.1.2 from Streptomyces coelicolor; fructokinase EC:2.7.1.4 from Pediococcus pentosaceus, Streptococcus mutans and Zymomonas mobilis; allokinase EC:2.7.1.55 and mlc from E. coli; and E. coli hypothetical proteins yajF and yhcI and the corresponding Haemophilus influenzae proteins. The repressor proteins (xylR and nagC) from this family possess an N-terminal region not present in the sugar kinases and which contains an helix-turn-helix DNA-binding motif.
definition_source: "InterPro:IPR023945 abstract (HAMAP MF_01234 is a member signature)"
