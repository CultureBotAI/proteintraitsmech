identifier: HAMAP:MF_04109
label: Endolysin
definition: >-
  This family includes endolysin from bacteriophage lambda and its relatives. Endolysin is a lysozyme that hydrolyses the (1->4)-beta-glycosidic linkage between N-acetylmuramic acid (MurNAc) and N-acetylglucosamine (GlcNAc) residues in the bacterial cell wall peptidoglycan. Endolysin and the cell membrane pore-forming proteins holin and spanin act together to bring about host cell lysis and release of virus particles. This entry includes proteins from tailed bacteriophages and from prophages mainly from proteobacteria.
