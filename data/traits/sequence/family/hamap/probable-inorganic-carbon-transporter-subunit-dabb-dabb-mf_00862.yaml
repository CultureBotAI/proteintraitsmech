identifier: HAMAP:MF_00862
label: "Probable inorganic carbon transporter subunit DabB [dabB]"
definition: >-
  This entry represents the probable inorganic carbon transporter subunit DabB from Bacillus anthracis, part of an energy-coupled inorganic carbon pump. This group of bacterial proteins form a small clade among the members of InterPro:IPR001750 that are distinct from complex I subunits, which suggests cation transport but does not imply redox activity.
