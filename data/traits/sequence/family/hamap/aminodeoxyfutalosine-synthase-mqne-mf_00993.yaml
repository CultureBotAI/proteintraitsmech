identifier: HAMAP:MF_00993
label: "Aminodeoxyfutalosine synthase [mqnE]"
definition: >-
  Members of this protein family are aminofutalosine synthases (MqnE, EC:2.5.1.120 ) and are involved in menaquinone biosynthesis. The Thermus thermophilus family member, MqnE, has been experimentally characterised as a a radical SAM enzyme that catalyses the addition of the adenosyl radical to the double bond of 3-[(1 -carboxyvinyl)oxy]benzoic acid.
