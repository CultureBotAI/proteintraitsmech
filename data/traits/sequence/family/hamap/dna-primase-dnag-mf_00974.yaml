identifier: HAMAP:MF_00974
label: "DNA primase [dnaG]"
definition: >-
  DNA primase DnaG catalyses the synthesis of short RNA molecules used as primers for the DNA polymerase during DNA replication. The DNA primases of bacteria and bacteriophages are classified into one group, whereas the primases of eukaryotes and archaea belong to a second group. Bacterial primase DnaG works together with replicative helicase, DnaB, to unwind the DNA template and initiate thousands of regularly-spaced Okazaki fragments to promote fork progression in the lagging strand.
