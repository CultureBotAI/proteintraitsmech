identifier: HAMAP:MF_01418
label: "Agmatinase [speB]"
definition: >-
  This enzyme belongs to the arginase family and more specifically the agmatinase (agmatine ureohydrolase EC:3.5.3.11 ) subfamily. Agmatinase catalyses the hydrolysis of agmatine to putrescine and urea. Manganese is required as a cofactor in this reaction. Agmatinase may play important regulatory roles by modulating the cellular levels of agmatine, which is a metabolic intermediate in the biosynthesis of putrescine and higher polyamines.
