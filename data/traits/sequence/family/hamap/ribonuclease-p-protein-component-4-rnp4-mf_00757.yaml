identifier: HAMAP:MF_00757
label: "Ribonuclease P protein component 4 [rnp4]"
definition: >-
  This entry represents ribonuclease P (Rnp) subunit RNP4 (also known as Rpp21) mostly from archaea. In the hyperthermophilic archaeon Pyrococcus horikoshii OT3, RNase P is composed of the RNase P RNA (pRNA) and five proteins (PhoPop5, PhoRpp38, PhoRpp21, PhoRpp29, and PhoRpp30). Ribonuclease P (Rnp) is a ubiquitous ribozyme that catalyzes a Mg2 -dependent hydrolysis to remove the 5'-leader sequence of precursor tRNA (pre-tRNA) in all three domains of life. In bacteria, the catalytic RNA (typically ~120kDa) is aided by a small protein cofactor (~14kDa). Archaeal and eukaryote RNase P consist of a single RNA and archaeal RNase P has four or five proteins, while eukaryotic RNase P consists of 9 or 10 proteins. Eukaryotic and archaeal RNase P RNAs cooperatively function with protein subunits in catalysis.
definition_source: "InterPro:IPR016432 abstract (HAMAP MF_00757 is a member signature)"
