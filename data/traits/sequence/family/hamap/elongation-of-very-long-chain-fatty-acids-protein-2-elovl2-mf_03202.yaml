identifier: HAMAP:MF_03202
label: "Elongation of very long chain fatty acids protein 2 [ELOVL2]"
definition: >-
  Elongation of very long chain fatty acids protein 2 (ELOVL2, also known as very long chain fatty acid elongase 2) is a component of the the long-chain fatty acids elongation cycle. It is a transmembrane enzyme in the endoplasmic reticulum that adds two carbons per cycle to long- and very long-chain fatty acids acting on polyunsaturated acyl-CoA with the higher activity toward C20:4(n-6) acyl-CoA. It catalyzes the synthesis of polyunsaturated very long chain fatty acid (C20- and C22-PUFA), acting specifically toward polyunsaturated acyl-CoA with the higher activity toward C20:4(n-6) acyl-CoA.
definition_source: "InterPro:IPR033680 abstract (HAMAP MF_03202 is a member signature)"
