identifier: HAMAP:MF_01839
label: "Nucleoid occlusion factor SlmA [slmA]"
definition: >-
  This entry represents SlmA, which is a cell-division inhibitor required for nucleoid occlusion (NO) that contains 1 HTH TetR-type DNA-binding domain, and similar sequences from gammaproteobacteria. It participates in the proper positioning of the FtsZ/septal ring at midcell during cell division, functioning as a DNA-associated division inhibitor directly involved in preventing Z ring assembly on portions of the membrane surrounding the nucleoid.
