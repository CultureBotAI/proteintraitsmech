identifier: HAMAP:MF_00646
label: "Elongation factor protein EfpL [efpL]"
definition: >-
  This entry represents homologues of the translation factors elongation factor P (InterPro:IPR011768), which play a role in translation of XP(P)X-containing proteins and are involved in the detection of the cell's metabolic state via lysine acylation. Members of this family are found mainly in gammaproteobacteria, including Escherichia coli (EfpL, also known as YeiP) and Vibrio cholerae.
