identifier: HAMAP:MF_00038
label: "Phospho-N-acetylmuramoyl-pentapeptide-transferase [mraY]"
definition: >-
  Phospho-N-acetylmuramoyl-pentapeptide-transferase (EC:2.7.8.13) (MraY) is a bacterial enzyme responsible for the formation of the first lipid intermediate of the cell wall peptidoglycan synthesis. It catalyses the formation of undecaprenyl-pyrophosphoryl-N-acetylmuramoyl-pentapeptide from UDP-MurNAc-pentapeptide and undecaprenyl-phosphate.
