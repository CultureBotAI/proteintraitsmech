identifier: HAMAP:MF_00272
label: "Glycine cleavage system H protein [gcvH]"
definition: >-
  This is a family of glycine cleavage H-proteins, part of the glycine cleavage system (GCS) found in bacteria, archaea, and the mitochondria of eukaryotes. GCS is a multienzyme complex consisting of 4 different components (P-, H-, T- and L-proteins) which catalyzes the oxidative cleavage of glycine. The H-protein shuttles the methylamine group of glycine from the P-protein (glycine dehydrogenase) to the T-protein (aminomethyltransferase) via a lipoyl group, attached to a completely conserved lysine residue.
definition_source: "InterPro:IPR002930 abstract (HAMAP MF_00272 is a member signature)"
