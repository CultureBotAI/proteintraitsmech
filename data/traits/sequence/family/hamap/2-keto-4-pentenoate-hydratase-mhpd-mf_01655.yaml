identifier: HAMAP:MF_01655
label: "2-keto-4-pentenoate hydratase [mhpD]"
definition: >-
  2-keto-4-pentenoate hydratase catalyzes the conversion of 2-hydroxypentadienoic acid (enolic form of 2-oxopent-4-enoate) to 4-hydroxy-2-ketopentanoic acid. It uses divalent metal ions as cofactor, with optimum activity obtained with Mn2+.
