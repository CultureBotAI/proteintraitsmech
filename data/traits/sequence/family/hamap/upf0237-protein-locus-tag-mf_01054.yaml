identifier: HAMAP:MF_01054
label: "UPF0237 protein <locus_tag>"
definition: >-
  The proteins in this entry are functionally uncharacterised. They contain an ACT domain; ACT domains are linked to a wide range of metabolic enzymes that are regulated by amino acid concentration. The ACT domain is found in a variety of contexts and is proposed to be a conserved regulatory binding fold.
