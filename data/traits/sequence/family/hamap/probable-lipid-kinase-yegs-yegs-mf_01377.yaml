identifier: HAMAP:MF_01377
label: "Probable lipid kinase YegS [yegS]"
definition: >-
  Members of this protein family are designated YegS, an apparent lipid kinase family in the Proteobacteria. The crystal structure of YegS has been reported and been shown to be a lipid kinase with phosphatidylglycerol kinase activity. The crystal structure reveals a two-domain protein with significant structural similarity to a family of NAD kinases. The active site is located in the interdomain cleft formed by four conserved sequence motifs. Surprisingly, the structure reveals a novel metal binding site composed of residues conserved in most lipid kinases.
definition_source: "InterPro:IPR022433 abstract (HAMAP MF_01377 is a member signature)"
