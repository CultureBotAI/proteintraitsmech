identifier: HAMAP:MF_01936
label: "1,4-dihydroxy-2-naphthoyl-CoA hydrolase [menI]"
definition: >-
  MenI (also known as ydiI) is a thioesterase catalysing the hydrolysis of 1,4-dihydroxy-2-naphthoyl-CoA (DHNA-CoA) to 1,4-dihydroxy-2-naphthoate (DHNA). It also shows significant activity toward a wide range of acyl-CoA thioesters, and minimal activity toward benzoyl-holoEntB.
