identifier: HAMAP:MF_00825
label: "3-hydroxyanthranilate 3,4-dioxygenase [nbaC]"
definition: >-
  Members of this protein family, from both bacteria and eukaryotes, are the enzyme 3-hydroxyanthranilate 3,4-dioxygenase (EC:1.13.11.6). It is part of the kynurenine pathway for the degradation of tryptophan and the biosynthesis of nicotinic acid.The prokaryotic homologue is involved in the 2-nitrobenzoate degradation pathway. The enzyme acts on the tryptophan metabolite 3-hydroxyanthranilate and produces 2-amino-3-carboxymuconate semialdehyde, which can rearrange spontaneously to quinolinic acid and feed into nicotinamide biosynthesis, or undergo further enzymatic degradation.
definition_source: "InterPro:IPR010329 abstract (HAMAP MF_00825 is a member signature)"
