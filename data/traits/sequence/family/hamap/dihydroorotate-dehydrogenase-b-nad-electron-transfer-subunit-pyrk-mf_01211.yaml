identifier: HAMAP:MF_01211
label: "Dihydroorotate dehydrogenase B (NAD(+)), electron transfer subunit [pyrK]"
definition: >-
  Dihydroorotate dehydrogenase (EC:1.3.3.1) (DHOdehase) catalyzes the fourth step in the de novo biosynthesis of pyrimidine, the conversion of dihydroorotate into orotate. DHOdehase is a ubiquitous FAD flavoprotein. In bacteria (gene pyrD), DHOdease is located on the inner side of the cytosolic membrane. In some yeasts, such as in Saccharomyces cerevisiae (gene URA1, subfamily 2), it is a cytosolic protein while in other eukaryotes it is found in the mitochondria. This entry represents the electron transfer subunit of dihydroorotate dehydrogenase B (NAD(+)).
