identifier: HAMAP:MF_00181
label: "Probable cytosol aminopeptidase [pepA]"
definition: >-
  The majority of members of this family are zinc-dependent exopeptidases belonging to MEROPS peptidase family M17 (leucyl aminopeptidase, clan MF). This family excludes pepB aminopeptidases, which are also members of MEROPS family M17 (see InterPro:IPR008330).
