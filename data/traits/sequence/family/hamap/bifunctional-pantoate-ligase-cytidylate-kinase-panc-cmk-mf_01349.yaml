identifier: HAMAP:MF_01349
label: "Bifunctional pantoate ligase/cytidylate kinase [panC/cmk]"
definition: >-
  This entry represents a bifunctional pantoate ligase/cytidylate kinase resulting from a fusion of the individual enzymes. This fusion has so far only been found in cyanobacteria. Cytidylate kinase ( EC:2.7.4.14 ) catalyses the phosphorylation of cytidine 5-monophosphate (dCMP) to cytidine 5 -diphosphate (dCDP) in the presence of ATP or GTP. UMP and dCMP can also act as acceptors. D-Pantothenate is synthesized via four enzymes from ketoisovalerate, which is an intermediate of branched-chain amino acid synthesis. Pantoate-beta-alanine ligase, also know as pantothenate synthase, (PanC; EC:6.3.2.1 ) catalyzes the formation of pantothenate from pantoate and alanine in the pantothenate biosynthesis pathway. PanC belongs to a large superfamily of nucleotidyltransferases that includes ATP sulfurylase (ATPS), phosphopantetheine adenylyltransferase (PPAT), and the amino-acyl tRNA synthetases. The enzymes of this family are structurally similar and share a dinucleotide-binding domain.
definition_source: "InterPro:IPR024894 abstract (HAMAP MF_01349 is a member signature)"
