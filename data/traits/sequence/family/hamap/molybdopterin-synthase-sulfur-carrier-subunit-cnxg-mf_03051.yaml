identifier: HAMAP:MF_03051
label: "Molybdopterin synthase sulfur carrier subunit [cnxG]"
definition: >-
  MOCS2A is a the small subunit of the molybdopterin synthase complex that catalyses the conversion of precursor Z into molybdopterin by mediating the incorporation of 2 sulfur atoms into precursor Z to generate a dithiolene group. In the complex, MOCS2A serves as sulfur donor by being thiocarboxylated at its C terminus by UBA4. After interaction with MOCS2B, the sulfur is then transferred to precursor Z to form molybdopterin. This entry represents the Molybdopterin synthase sulfur carrier subunit from eukaryotes.
definition_source: "InterPro:IPR028887 abstract (HAMAP MF_03051 is a member signature)"
