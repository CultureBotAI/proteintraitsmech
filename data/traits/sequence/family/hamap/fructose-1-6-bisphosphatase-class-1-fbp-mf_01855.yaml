identifier: HAMAP:MF_01855
label: "Fructose-1,6-bisphosphatase class 1 [fbp]"
definition: >-
  This entry represents the fructose-1,6-bisphosphatase (FBPase) class 1 family. FBPase is a critical regulatory enzyme in gluconeogenesis that catalyses the removal of 1-phosphate from fructose 1,6-bis-phosphate to form fructose 6-phosphate. It is involved in many different metabolic pathways and found in most organisms. FBPase requires metal ions for catalysis (Mg 2+ and Mn 2+ being preferred) and the enzyme is potently inhibited by Li +. The fold of fructose-1,6-bisphosphatase was noted to be identical to that of inositol-1-phosphatase (IMPase). Inositol polyphosphate 1-phosphatase (IPPase), IMPase and FBPase share a sequence motif (Asp-Pro-Ile/Leu-Asp-Gly/Ser-Thr/Ser) which has been shown to bind metal ions and participate in catalysis. This motif is also found in the distantly-related fungal, bacterial and yeast IMPase homologues. It has been suggested that these proteins define an ancient structurally conserved family involved in diverse metabolic pathways, including inositol signalling, gluconeogenesis, sulphate assimilation and possibly quinone metabolism. This entry also includes sedoheptulose-1,7-bisphosphatase, which is a member of the FBPase class 1 family.
definition_source: "InterPro:IPR000146 abstract (HAMAP MF_01855 is a member signature)"
