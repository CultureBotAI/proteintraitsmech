identifier: HAMAP:MF_01184
label: "Xanthine phosphoribosyltransferase [xpt]"
definition: >-
  This entry represent a xanthine-specific phosphoribosyltransferase of Bacillus subtilis and closely related proteins from other species, mostly from other Gram-positive bacteria. The adjacent gene is a xanthine transporter; B. subtilis can import xanthine for the purine salvage pathway or for catabolism to obtain nitrogen.
