identifier: HAMAP:MF_01000
label: "Vitamin B12-binding protein [btuF]"
definition: >-
  This entry represents Vitamin B12-binding protein Escherichia coli (BtuF) and similar found in gammaproteobacteria. The vitamin B12-binding protein BtuF is part of the ABC transporter complex BtuCDF involved in vitamin B12 import. This protein binds vitamin B12 and delivers it to the periplasmic surface of BtuC. The ATP-Binding Cassette (ABC) superfamily forms one of the largest of all protein families with a diversity of physiological functions. Several studies have shown that there is a correlation between the functional characterisation and the phylogenetic classification of the ABC cassette. More than 50 subfamilies have been described based on a phylogenetic and functional classification; (for further information see http://www.tcdb.org/tcdb/index.php?tc=3.A.1).
definition_source: "InterPro:IPR023544 abstract (HAMAP MF_01000 is a member signature)"
