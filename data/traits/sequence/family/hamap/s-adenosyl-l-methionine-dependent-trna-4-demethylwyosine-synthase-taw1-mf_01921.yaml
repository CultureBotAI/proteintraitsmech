identifier: HAMAP:MF_01921
label: "S-adenosyl-L-methionine-dependent tRNA 4-demethylwyosine synthase [taw1]"
definition: >-
  Members of this protein family are the archaeal protein TYW1, a radical SAM protein that catalyses the second step in creating the wye-bases, wyosine and derivatives such as wybutosine, for tRNA base modification.
