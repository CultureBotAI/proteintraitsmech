identifier: HAMAP:MF_01061
label: "Replication restart protein DnaT [dnaT]"
definition: >-
  This entry represents Primosomal protein 1 (DnaT) and similar proteins from Proteobacteria. DnaT, a DnaB/C complex loader protein, is required for primosome-dependent normal DNA replication. It is part of the "PriA-PriB" pathway for primosome assembly and is involved in inducing stable DNA replication during SOS response. The N-terminal domain of DnaT is crucial for PriB binding and self-trimerization while the C-terminal domain of DnaT is the DNA-binding domain.
