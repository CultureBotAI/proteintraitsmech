identifier: HAMAP:MF_03011
label: "Eukaryotic translation initiation factor 3 subunit L [EIF3L]"
definition: >-
  Eukaryotic translation initiation factor 3 subunit L is a component of the eukaryotic translation initiation factor 3 (eIF-3) complex, which is involved in protein synthesis and, together with other initiation factors, stimulates binding of mRNA and methionyl-tRNAi to the 40S ribosome.
