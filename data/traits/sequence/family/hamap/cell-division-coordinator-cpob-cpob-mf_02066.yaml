identifier: HAMAP:MF_02066
label: "Cell division coordinator CpoB [cpoB]"
definition: >-
  CpoB coordinates the complexes involved in septal peptidoglycan synthesis (PBP1B-LpoB complex) and outer membrane constriction (Tol system). This coordination contributes to maintain the integrity of the cell envelope during division. CpoB localizes to the septum concurrent with PBP1B-LpoB and Tol at the onset of constriction and interacts with both complexes, regulating PBP1B activity in response to Tol energy state.
definition_source: "InterPro:IPR034706 abstract (HAMAP MF_02066 is a member signature)"
