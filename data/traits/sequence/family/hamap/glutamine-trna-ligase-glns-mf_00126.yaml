identifier: HAMAP:MF_00126
label: "Glutamine--tRNA ligase [glnS]"
definition: >-
  This entry represents bacterial glutamine-tRNA ligases. Glutamine-tRNA ligase (EC:6.1.1.18) is a class Ic aminoacyl-tRNA ligase and shows several similarities with glutamine-tRNA ligase concerning structure and catalytic properties. It is an alpha2 dimer. Glutamine-tRNA ligase is a relatively rare ligase, found in the cytosolic compartment of eukaryotes, in Escherichia coli and a number of other Gram-negative bacteria, and in Deinococcus radiodurans. In contrast, the pathway to Gln-tRNA in mitochondria, Archaea, Gram-positive bacteria, and a number of other lineages is by misacylation with Glu followed by transamidation to correct the aminoacylation to Gln. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 2'-hydroxyl of the tRNA, whereas class II synthetases preferentially use the 3'-hydroxyl site. Class I includes synthetases specific for arginine, cysteine, glutamic acid, glutamine, isoleucine, leucine, methionine, tyrosine, tryptophan, valine, and some lysine synthetases (non-eukaryotic). Cl
