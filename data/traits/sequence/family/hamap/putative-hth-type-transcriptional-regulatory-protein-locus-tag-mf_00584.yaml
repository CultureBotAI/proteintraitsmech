identifier: HAMAP:MF_00584
label: "Putative HTH-type transcriptional regulatory protein <locus_tag>"
definition: >-
  Archaebacterial Putative HTH-type transcriptional regulatory proteins, including MTH_967 from Methanothermobacter thermautotrophicus contain a cro/C1-type HTH domain. The cro/C1-type HTH domain is a DNA-binding, helix-turn-helix (HTH) domain of about 50-60 residues present in transcriptional regulators. The domain is named after the transcriptional repressors Cro and C1 of temperate bacteriophages 434 and lambda, respectively. Besides the bacteriophages, cro/C1-type regulators are present in prokaryotes and in eukaryotes.
definition_source: "InterPro:IPR020886 abstract (HAMAP MF_00584 is a member signature)"
