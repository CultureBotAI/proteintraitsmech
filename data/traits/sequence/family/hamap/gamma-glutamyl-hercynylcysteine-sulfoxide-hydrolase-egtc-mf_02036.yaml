identifier: HAMAP:MF_02036
label: "Gamma-glutamyl-hercynylcysteine sulfoxide hydrolase [egtC]"
definition: >-
  This entry represents gamma-glutamyl-hercynylcysteine sulfoxide hydrolase EgtC from Actinobacteria. EgtC catalyses the hydrolysis of the gamma-glutamyl amide bond of hercynyl-gamma-L-glutamyl-L-cysteine sulfoxide to produce hercynylcysteine sulfoxide, a step in the biosynthesis pathway of ergothioneine. Ergothioneine is a histidine-derived thiol that may protect against oxidative stress. The structure of EgtC has been revealed.
definition_source: "InterPro:IPR032889 abstract (HAMAP MF_02036 is a member signature)"
