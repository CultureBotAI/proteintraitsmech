identifier: HAMAP:MF_00381
label: "Integration host factor subunit beta [ihfB]"
definition: >-
  Integration host factor (IHF) is a heterodimeric protein consisting of alpha ( ) and beta subunits. IHF binds the minor groove of DNA in a sequence-specific manner to induce a large bend. This bending stabilises distinct DNA conformations that are required during several bacterial processes, such as recombination, transposition, replication and transcription.
