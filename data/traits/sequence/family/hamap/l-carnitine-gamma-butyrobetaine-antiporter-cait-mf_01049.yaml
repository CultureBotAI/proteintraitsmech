identifier: HAMAP:MF_01049
label: "L-carnitine/gamma-butyrobetaine antiporter [caiT]"
definition: >-
  CaiT is a membrane antiporter that catalyses the exchange of L-carnitine for gamma-butyrobetaine, which is the excreted end product of the carnitine pathway. CaiT belongs to a family known as BCCT (for Betaine / Carnitine / Choline Transporters), which are specific for compounds containing a quaternary nitrogen atom. The BCCT proteins contain 12 transmembrane regionsand are energised by proton symport. They contain a conserved region with four tryptophans in their central region. Many enterobacteria are able to convert carnitine, via crotonobetaine, to gamma-butyrobetaine in the presence of carbon and nitrogen sources under anaerobic conditions. In Escherichia coli the enzymes involved in this pathway are encoded by the caiTABCDE operon. The adjacent but divergent fixABCD operon also appears to be necessary for carnintine meatbolism. The Fix proteins are homologous to proteins found in known electron transport pathways.
definition_source: "InterPro:IPR023449 abstract (HAMAP MF_01049 is a member signature)"
