identifier: HAMAP:MF_01181
label: "Regulator of sigma D [rsd]"
definition: >-
  This family includes bacterial transcriptional regulators that are thought to act through an interaction with the conserved region 4 of the sigma 70 subunit of RNA polymerase. They are responsible for switching between sigma 70 to sigma S during the transition from exponential growth to stationary phase.
