identifier: HAMAP:MF_01518
label: "Adenine deaminase [ade]"
definition: >-
  Adenine deaminase (EC:3.5.4.2) hydrolyses adenine to form hypoxanthine and ammonia. The enzyme is part of a large metal dependent hydrolase superfamily. The adenine deaminase reaction is important for adenine utilization as a purine and also as a nitrogen source. It plays an important role in the purine salvage pathway and in nitrogen catabolism.
