identifier: HAMAP:MF_02103
label: "Lactate utilization protein B [lutB]"
definition: >-
  This entry represents lactate utilization protein B, which is involved in L-lactate degradation and allows cells to grow with lactate as the sole carbon source. It is thought to function as an electron transporter during oxidation of L-lactate.
