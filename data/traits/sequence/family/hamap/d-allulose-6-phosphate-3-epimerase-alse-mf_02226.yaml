identifier: HAMAP:MF_02226
label: "D-allulose-6-phosphate 3-epimerase [alsE]"
definition: >-
  This entry represents D-allulose-6-phosphate 3-epimerase from bacteria, including AlsE from Escherichia coli. AlsE catalyses the reversible epimerization of D-allulose 6-phosphate to D-fructose 6-phosphate. Its structure has been solved.
