identifier: HAMAP:MF_00411
label: "DNA-directed RNA polymerase subunit Rpo1C [rpo1C]"
definition: >-
  This family consists of the archaeal Rpo1C subunit (also known as A'') of the DNA-directed RNA polymerase. DNA-directed RNA polymerases, also known as DNA-dependent RNA polymerases, are responsible for the polymerisation of ribonucleotides into a sequence complementary to the template DNA. Eukaryotes have three different DNA-directed RNA polymerases (RNAPs), Pol I, II, and III, whereas Archaea and Bacteria have single enzymes. RNAPs are multisubunit enzymes. Archaeal RNAP is closely related to eukaryotic RNAP II, which consists of 12 subunits. Archaeal RNAP has an additional subunit, Rpo13, with no orthologue in the eukaryotic enzyme.
