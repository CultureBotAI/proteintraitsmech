identifier: HAMAP:MF_02050
label: "Fused isobutyryl-CoA mutase [icmF]"
definition: >-
  G-protein metallochaperones ensure fidelity during cofactor assembly for a variety of metalloproteins, including adenosylcobalamin (AdoCbl)-dependent methylmalonyl-CoA mutase. IcmF is a natural fusion protein of AdoCbl-dependent isobutyryl-CoA mutase and its corresponding G-protein chaperone. It exhibits both GTPase activity and AdoCbl-dependent isomerase activity, interconverting isobutyryl-CoA and n-butyryl-CoA. It can also interconvert pivalyl-CoA and isovaleryl-CoA, albeit with low efficiency, which has biotechnological potential. IcmF structure has been reported.
definition_source: "InterPro:IPR033669 abstract (HAMAP MF_02050 is a member signature)"
