identifier: HAMAP:MF_01075
label: "K(+)/H(+) antiporter NhaP2 [nhaP2]"
definition: >-
  This entry represents the NhaP2 family of bacterial K(+)/H(+) antiporters. They are thought to be involved in control of cell volumes under low osmotic conditions. Vc-NhaP2 from Vibrio cholerae functions as a specific K+/H+ antiporter while retaining the ability to exchange H+ for Na+ and bind (but not exchange with H+) Li+ in a competitive manner.
