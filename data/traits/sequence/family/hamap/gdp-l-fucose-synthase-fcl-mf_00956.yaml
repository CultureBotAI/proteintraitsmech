identifier: HAMAP:MF_00956
label: "GDP-L-fucose synthase [fcl]"
definition: >-
  GDP-L-fucose synthase is responsible for the last step of the major metabolic pathway resulting in GDP-L-fucose synthesis from GDP-D-mannose. It catalyses a combined epimerase and NADPH-dependent reductase reaction, converting GDP-4-keto-6-D-deoxymannose to GDP-L-fucose. Since several cell-surface antigens, including the leukocyte Lewis system and cell-surface antigens in pathogenic bacteria, depend on the availability of GDP-L-fucose for their expression, the enzyme is a potential target for therapy in pathological states depending on selectin-mediated cell-to-cell interactions. This entry also includes ColC from Yersinia pseudotuberculosis. ColC is a GDP-L-colitose synthase, which is a bifunctional enzyme catalysaing the C-5 epimerization of GDP-4-keto-3,6-dideoxy-D-mannose and the subsequent C-4 keto reduction of the resulting L-epimer to give GDP-L-colitose.
definition_source: "InterPro:IPR028614 abstract (HAMAP MF_00956 is a member signature)"
