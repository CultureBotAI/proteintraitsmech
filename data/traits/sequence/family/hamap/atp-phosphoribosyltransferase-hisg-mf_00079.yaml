identifier: HAMAP:MF_00079
label: "ATP phosphoribosyltransferase [hisG]"
definition: >-
  ATP phosphoribosyltransferase (ATP-PRT, EC:2.4.2.17) is the enzyme that catalyses the first step in the biosynthesis of histidine in bacteria, fungi and plants as shown below. It is a member of the larger phosphoribosyltransferase superfamily of enzymes which catalyse the condensation of 5-phospho-alpha-D-ribose 1-diphosphate with nitrogenous bases in the presence of divalent metal ions. ATP + 5-phospho-alpha-D-ribose 1-diphosphate = 1-(5-phospho-D-ribosyl)-ATP + diphosphate Histidine biosynthesis is an energetically expensive process and ATP-PRT activity is subject to control at several levels. Transcriptional regulation is based primarily on nutrient conditions and determines the amount of enzyme present in the cell, while feedback inhibition rapidly modulates activity in response to cellular conditions. The enzyme has been shown to be inhibited by 1-(5-phospho-D-ribosyl)-ATP, histidine, ppGpp (a signal associated with adverse environmental conditions) and ADP and AMP (which reflect the overall energy status of the cell). As this pathway of histidine biosynthesis is present only in prokaryotes, plants and fungi, this enzyme is a promising target for the development of novel antimicrobial compounds and herbicides. ATP-PRT come in two forms: a long form containing two catalytic domains and a C-terminal regulatory domain, and a short form in which the regulatory domain is missing. The long form is catalytically competent, but in organisms with the short form, a histidyl-tRNA synthetase paralogue, HisZ, is required for enzyme activity. The enzyme was initially thought to exist in equilibrium between an active dimeric form, an inactive hexameric form and higher aggregates. However, it has been shown later that this protein is a hexamer in equilibrium between an open and pr
