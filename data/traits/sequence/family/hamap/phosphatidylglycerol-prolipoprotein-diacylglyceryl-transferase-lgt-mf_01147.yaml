identifier: HAMAP:MF_01147
label: "Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase [lgt]"
definition: >-
  Phosphatidylglycerol--prolipoprotein diacylglyceryl transferase lgt is an integral membrane enzyme that catalyses the first reaction of the three-step post-translational lipid modification. It transfers the n-acyl diglyceride group onto what will become the N-terminal cysteine of membrane lipoproteins. This enzyme is an integral membrane protein.
