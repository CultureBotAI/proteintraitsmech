identifier: HAMAP:MF_04110
label: Endolysin
definition: >-
  This family includes endolysin, a lysozyme from bacteriophage T4 and its relatives. Endolysin is required for host cell lysis, and degrades the cross-links in the bacterial cell wall following on from pore formation in the cell membrane by holin and spanin. Endolysin specifically hydrolyses the (1->4)-beta-linkages between N-acetylmuramic acid and N-acetyl-D-glucosamine residues in the peptidoglycan and between N-acetyl-D-glucosamine residues in chitodextrins. Host cell lysis is required for released of virus particles from the cell. This entry also includes SAR-endolysins. Canonical phage lysozymes accumulate fully folded and enzymatically active in the cytoplasm. In contrast, SAR-endolysins are first secreted as enzymatically inactive enzymes anchored to the membrane by the N-terminal SAR domain 2. This functional regulation is essential to avoid premature lysis of the infected host.
definition_source: "InterPro:IPR034690 abstract (HAMAP MF_04110 is a member signature)"
