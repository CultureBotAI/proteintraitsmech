identifier: HAMAP:MF_02235
label: "N-succinylornithine carbamoyltransferase [argF']"
definition: >-
  This entry represents a group of N-succinylornithine carbamoyltransferases from bacteria, including ArgF' from Bacteroides fragilis. It catalyses the transfer of the carbamoyl group from carbamoyl phosphate to the δ-amino group of N2-succinyl-L-ornithine to produce N2-succinyl-L-citrulline. In B. fragilis it is essential for arginine biosynthesis. B. fragilis uses N-succinyl-l-ornithine rather than N-acetyl-l-ornithine for de novo arginine biosynthesis and therefore this pathway in Bacteroides is different from the canonical arginine biosynthetic pathway of most organisms.
definition_source: "InterPro:IPR043696 abstract (HAMAP MF_02235 is a member signature)"
