identifier: HAMAP:MF_03129
label: "Lipoyl synthase, chloroplastic [LIP1P]"
definition: >-
  Lipoyl synthase is an iron-sulphur protein. It is localised to mitochondria in yeast and Arabidopsis. It generates lipoic acid, a thiol antioxidant that is linked to a specific Lys as prosthetic group for the pyruvate and alpha-ketoglutarate dehydrogenase complexes and the glycine-cleavage system. This entry represents lipoyl synthase from plant chloroplasts.
