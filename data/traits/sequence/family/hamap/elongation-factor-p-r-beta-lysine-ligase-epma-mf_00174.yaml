identifier: HAMAP:MF_00174
label: "Elongation factor P--(R)-beta-lysine ligase [epmA]"
definition: >-
  This entry represents the elongation factor P--(R)-beta-lysine ligase (also known as EpmA). Together with EpmB, it is involved in the beta-lysylation step of the post-translational modification of translation elongation factor P (EF-P). It catalyses the ATP-dependent activation of (R)-beta-lysine produced by EpmB, forming a lysyl-adenylate, from which the beta-lysyl moiety is then transferred to the ε-amino group of a conserved specific lysine residue in EF-P. The protein may play a role in the modulation of virulence and drug resistance.
definition_source: "InterPro:IPR004525 abstract (HAMAP MF_00174 is a member signature)"
