identifier: HAMAP:MF_00969
label: "Transcription-repair-coupling factor [mfd]"
definition: >-
  The bacterial transcription-repair coupling factor (Mfd) binds to stalled transcription elongation complexes in vitro and catalyses their dissociation from template DNA in an ATP-dependent manner. A lesion in the template strand blocks the RNA polymerase complex (RNAP). The RNAP-DNA-RNA complex is specifically recognised by Mdf, which releases RNAP and the truncated transcript. Mfd displaces RNAP at the lesion site by pushing the polymerase forward, allowing the lesion to be accessed by repair proteins. Mfd contains superfamily II helicase motifs which are essential for the RNAP displacement activity of Mfd, but does not possess conventional strand-separating helicase activity.
definition_source: "InterPro:IPR004576 abstract (HAMAP MF_00969 is a member signature)"
