identifier: HAMAP:MF_04099
label: "Spike glycoprotein [S]"
definition: >-
  This entry represents the spike glycoprotein mostly from Betacoronavirus. It can be cleaved into three chains: spike protein S1, S2 and S2'. Spike protein S1 attaches the virion to the cell membrane by interacting with host receptor, initiating the infection. Spike protein S2 mediates fusion of the virion and cellular membranes by acting as a class I viral fusion protein. Spike protein S2' acts as a viral fusion peptide which is unmasked following S2 cleavage occurring upon virus endocytosis.
