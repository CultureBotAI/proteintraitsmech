identifier: HAMAP:MF_01960
label: "D-aminopeptidase [dap]"
definition: >-
  This entry represents D-aminopeptidase that hydrolyses N-terminal residues in D-amino acid-containing peptides ( ). D-aminopeptidase is a dimeric enzyme with each monomer being composed of three domains; domain B is connected to domain A, the catalytic domain, by an eight-residue sequence, and also interacts with both domains A and C via non-covalent bonds. Domain B probably functions in maintaining domain C in a good position to interact with the catalytic domain.
