identifier: HAMAP:MF_03148
label: "Inosine triphosphate pyrophosphatase [ITPA]"
definition: >-
  Inosine triphosphate pyrophosphatase hydrolyses the non-canonical purine nucleotides inosine triphosphate (ITP), deoxyinosine triphosphate (dITP) as well as 2'-deoxy-N-6-hydroxylaminopurine triposphate (dHAPTP) and xanthosine 5'-triphosphate (XTP) to their respective monophosphate derivatives. The enzyme does not distinguish between the deoxy- and ribose forms. It probably excludes non-canonical purines from RNA and DNA precursor pools, thus preventing their incorporation into RNA and DNA and avoiding chromosomal lesions. In yeast, it also hydrolyses 5-bromodeoxyuridine 5'-triphosphate (BrdUTP).
definition_source: "InterPro:IPR027502 abstract (HAMAP MF_03148 is a member signature)"
