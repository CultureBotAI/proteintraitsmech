identifier: HAMAP:MF_03069
label: "Protein kintoun [DNAAF2]"
definition: >-
  Kintoun (also known as ktu or dynein assembly factor 2, axonemal) is a cytoplasmic protein conserved from ciliated unicellular organisms to mammals. It is required for cytoplasmic pre-assembly of axonemal dynein arm complexes before intraflagellar transport loads them for the ciliary compartment. Its homologue in single-celled alga Chlamydomonas is known as PF13. A mutation in Ktu/PF13 has been identified in some patients with primary ciliary dyskinesia (PCD). In the absence of Ktu/PF13, both dynein arms (inner and outer) are missing or defective in the axoneme, leading to a loss of motility.
definition_source: "InterPro:IPR034727 abstract (HAMAP MF_03069 is a member signature)"
