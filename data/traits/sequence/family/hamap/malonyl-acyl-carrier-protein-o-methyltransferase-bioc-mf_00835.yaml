identifier: HAMAP:MF_00835
label: "Malonyl-[acyl-carrier protein] O-methyltransferase [bioC]"
definition: >-
  Malonyl-[acyl-carrier protein] O-methyltransferase BioC is a biotin synthesis protein that converts the free carboxyl group of a malonyl-thioester to its methyl ester by transfer of a methyl group from S-adenosyl-L-methionine (SAM). It allows to synthesize pimeloyl-ACP via by a modified fatty acid synthetic pathway.
