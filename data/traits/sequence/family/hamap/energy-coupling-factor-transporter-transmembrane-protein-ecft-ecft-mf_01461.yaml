identifier: HAMAP:MF_01461
label: "Energy-coupling factor transporter transmembrane protein EcfT [ecfT]"
definition: >-
  Energy-coupling factor (ECF) transporters consist of a substrate-specific component (known as the S component), and an energy-coupling module. The substrate-binding component is a small integral membrane protein which captures specific substrates and forms an active transporter in the presence of the energy-coupling AT module. The energy coupling module is composed of an ATPase typical of the ATP binding cassette (ABC) superfamily (A component) and a characteristic transmembrane protein (T component). Unlike the ABC transporters, an energy coupling module can be shared between multiple different substrate-binding components. This entry represents the transmembrane component from a number of ECF transporters. The function of this component is not known, but it contains two conserved motifs (I and II) that are important for transporter function. Motif I is essential for intramolecular signaling while motifs I and II together are essential for subunit assembly of modular ECF transporters
definition_source: "InterPro:IPR024919 abstract (HAMAP MF_01461 is a member signature)"
