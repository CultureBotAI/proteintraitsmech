identifier: HAMAP:MF_02228
label: "Sulfopropanediol 3-dehydrogenase [hpsN]"
definition: >-
  This entry represents sulfopropanediol 3-dehydrogenase from Proteobacteria, including HpsN from Cupriavidus pinatubonensis. HpsN catalyses the NAD-dependent oxidation of (R)-2,3-dihydroxypropane-1-sulfonate to (R)-3-sulfolactate.
