identifier: HAMAP:MF_01447
label: "Probable bifunctional tRNA threonylcarbamoyladenosine biosynthesis protein"
definition: >-
  This entry describes a probable bifunctional tRNA threonylcarbamoyladenosine biosynthesis protein. Its N-termanal domain is homologous to the Kae1/YgjD family, which is involved in tRNA threonylcarbamoyladenosine biosynthesis. Its C-terminal region contains a serine/threonine protein kinase domain (STYKS) and is homologous to Bud32. Kae1 and Bud32 are two components of the the KEOPS/EKC complex, which has been implicated in transcription, telomere maintenance and chromosome segregation. In this archaeal family, it seems that the Kae1 and Bud32 orthologues are fused.
definition_source: "InterPro:IPR009220 abstract (HAMAP MF_01447 is a member signature)"
