identifier: HAMAP:MF_01263
label: "CCA-adding enzyme [cca]"
definition: >-
  This family consists of CCA tRNA adenylyltransferases from the firmicutes. CCA tRNA nucleotidyltransferase, also known as CCA-adding enzyme, are responsible for the synthesis and repair of the 3' terminal CCA sequence of tRNA molecules. They are encoded by essential genes in almost all organisms and add the three ribonucleotides C, C, and A to the 3' end of tRNAs in sequential order.
