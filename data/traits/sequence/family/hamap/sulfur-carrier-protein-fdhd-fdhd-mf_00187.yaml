identifier: HAMAP:MF_00187
label: "Sulfur carrier protein FdhD [fdhD]"
definition: >-
  FdhD is a protein essential for the activity of formate dehydrogenases (FDHs), but it is not a component of membrane-bound formate dehydrogenase. In Escherichia coli, it has been shown to function as a sulfurtransferase between IscS to the molybdenum cofactor prior to its insertion into formate dehydrogenase. Sulfur transfer between IscS and FDH is a indispensable step for FDH activity.
