identifier: HAMAP:MF_01364_B
label: "Small ribosomal subunit protein uS14 [rpsZ]"
definition: >-
  This entry includes bacterial small ribosomal subunit protein uS14. In bacteria the gene coding for ribosomal protein S14 has been subject to horizontal gene transfer, subsequent differential gene loss and insertions/deletions near the N terminus. Different groups have been described according to this. This family represents the type Z, or zinc-binding S14 proteins. uS14 is one of the proteins from the small ribosomal subunit. In Escherichia coli, uS14 is known to be required for the assembly of 30S particles and may also be responsible for determining the conformation of 16S rRNA at the A site. It belongs to a family of ribosomal proteins that include bacterial, algal and plant chloroplast uS14, cyanelle uS14, archaebacteria Methanococcus vannielii uS14, as well as yeast mitochondrial MRP2, yeast RPS29A/B, and mammalian RPS29. Ribosomes are the particles that catalyse mRNA-directed protein synthesis in all organisms. The codons of the mRNA are exposed on the ribosome to allow tRNA binding. This leads to the incorporation of amino acids into the growing polypeptide chain in accordance with the genetic information. Incoming amino acid monomers enter the ribosomal A site in the form of aminoacyl-tRNAs complexed with elongation factor Tu (EF-Tu) and GTP. The growing polypeptide chain, situated in the P site as peptidyl-tRNA, is then transferred to aminoacyl-tRNA, and the new peptidyl-tRNA, extended by one residue, is translocated to the P site with the aid of the elongation factor G (EF-G) and GTP as the deacylated tRNA is released from the ribosome through one or more exit sites. About 2/3 of the mass of the ribosome consists of RNA and 1/3 consists of protein. The proteins are named in accordance with the subunit of the ribosome which they belong to: the small (S1 to S31
