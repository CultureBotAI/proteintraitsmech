identifier: HAMAP:MF_00100_B
label: "Translation initiation factor IF-2 [infB]"
definition: >-
  Initiation factor 2 (IF-2) (gene infB) is one of the three factors required for the initiation of protein biosynthesis in bacteria. IF-2 promotes the GTP-dependent binding of the initiator tRNA to the small subunit of the ribosome. IF-2 is a protein of about 70 to 95 Kd which contains a central GTP-binding domain flanked by a highly variable N-terminal domain and a more conserved C-terminal domain. Bacterial IF-2 is structurally and functionally related to eukaryotic mitochondrial IF-2 (IF-2(mt)) as well as to algal and plants chloroplast IF-2 (IF-2(chl)). Both IF-2(mt) and IF-2(chl) are encoded by nuclear genes and are produced as precursor proteins with a transit peptide. An exception are red algae where IF-2(chl) is encoded by the plastid genome. This model discriminates eubacterial (and mitochondrial) translation initiation factor 2 (IF-2), encoded by the infB gene in bacteria, from similar proteins in the Archaea and Eukaryotes. In the bacteria and in organelles, the initiator tRNA is charged with N-formyl-Met instead of Met. This translation factor acts in delivering the initator tRNA to the ribosome. It is one of a number of GTP-binding translation factors recognised by the pfam HMM GTP_EFTU.
