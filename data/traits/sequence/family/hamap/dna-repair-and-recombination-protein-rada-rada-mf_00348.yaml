identifier: HAMAP:MF_00348
label: "DNA repair and recombination protein RadA [radA]"
definition: >-
  This family consists exclusively of archaeal RadA protein, a homologue of bacterial RecA, eukaryotic RAD51 (InterPro:IPR011941), and archaeal RadB (InterPro:IPR011939). This protein is involved in DNA repair and in homologous recombination, it binds and assembles on single-stranded DNA to form a nucleoprotein filament. RadA hydrolyzes ATP in a ssDNA-dependent manner and promotes DNA strand exchange between homologous DNA molecules involved in DNA repair and recombination. The member from Pyrococcus horikoshii contains an intein.
