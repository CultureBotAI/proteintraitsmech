identifier: HAMAP:MF_01582
label: "Serine/threonine transporter SstT [sstT]"
definition: >-
  This entry represents the SstT family of serine/threonine transporters. It is involved in the import of serine and threonine into the cell, with the concomitant import of sodium (symport system).
