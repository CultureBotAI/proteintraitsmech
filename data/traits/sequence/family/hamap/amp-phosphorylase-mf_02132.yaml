identifier: HAMAP:MF_02132
label: "AMP phosphorylase"
definition: >-
  AMP phosphorylase is found in archaea, and only in those with a type III Rubisco enzyme. Most of the members previously were annotated as thymidine phosphorylase, or DeoA. The AMP metabolised by this enzyme may be produced by ADP-dependent sugar kinases.
