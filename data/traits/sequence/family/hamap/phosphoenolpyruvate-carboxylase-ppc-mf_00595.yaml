identifier: HAMAP:MF_00595
label: "Phosphoenolpyruvate carboxylase [ppc]"
definition: >-
  Phosphoenolpyruvate carboxylase (PEPCase), an enzyme found in all multicellular plants, catalyses the formation of oxaloacetate from phosphoenolpyruvate (PEP) and a hydrocarbonate ion. This reaction is harnessed by C4 plants to capture and concentrate carbon dioxide into the photosynthetic bundle sheath cells. It also plays a key role in the nitrogen fixation pathway in legume root nodules: here it functions in concert with glutamine, glutamate and asparagine synthetases and aspartate amido transferase, to synthesise aspartate and asparagine, the major nitrogen transport compounds in various amine-transporting plant species. This entry represents the family found primarily in bacteria and plants.
definition_source: "InterPro:IPR022805 abstract (HAMAP MF_00595 is a member signature)"
