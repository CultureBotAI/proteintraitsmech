identifier: HAMAP:MF_00583_B
label: "Putative ribose-phosphate pyrophosphokinase [prs]"
definition: >-
  This family consists of bacterial and some eukaryotic enzymes. The crystal structure of the PRPP synthetase from Bacillus subtilis has been determined; the functional form of the enzyme is an hexamer. Ribose-phosphate diphosphokinase, also known as ribose-phosphate pyrophosphokinase (RPPK), or phosphoribosyldiphosphate synthetase (EC:2.7.6.1), catalyses the transfer of an intact diphosphate (PP) group from ATP to ribose-5-phosphate (R-5-P), which results in the formation of AMP and 5-phospho-D-ribosyl--1-diphosphate (PRPP).
