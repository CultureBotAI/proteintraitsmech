identifier: HAMAP:MF_02037
label: "Histidine N-alpha-methyltransferase [egtD]"
definition: >-
  This entry represents histidine N-alpha-methyltransferase EgtD mostly from Actinobacteria. EgtD catalyses the SAM-dependent triple methylation of the alpha-amino group of histidine to form hercynine, a step in the biosynthesis pathway of ergothioneine. Ergothioneine is a histidine-derived thiol that may protect against oxidative stress.
