identifier: HAMAP:MF_01022
label: "Histidine biosynthesis bifunctional protein HisB [hisB]"
definition: >-
  This entry represents the histidine biosynthesis bifunctional protein HisB, which contains an N-terminal histidinol phosphate phosphatase (EC:3.1.3.15) and a C-terminal imidazoleglycerol-phosphate dehydratase (EC:4.2.1.19). HisB catalyses steps 6 and 8 of L-histidine biosynthesis. The N-terminal histidinol phosphate phosphatase domain folds into a single domain that has similarity to the haloacid dehalogenase (HAD) enzyme family, with a zinc ion stabilising the conformation of an extended loop.
