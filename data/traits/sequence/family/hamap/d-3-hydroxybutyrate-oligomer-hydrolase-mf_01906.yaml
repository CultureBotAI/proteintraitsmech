identifier: HAMAP:MF_01906
label: "D-(-)-3-hydroxybutyrate oligomer hydrolase"
definition: >-
  This entry represents a group of predicted D-(-)-3-hydroxybutyrate oligomer hydrolases (also known as 3HB-oligomer hydrolase), which function in the degradation of poly-3-hydroxybutyrate (PHB). These enzymes catalyse the hydrolysis of D(-)-3-hydroxybutyrate oligomers (3HB-oligomers) into 3HB-monomers.
