identifier: HAMAP:MF_01672
label: "Inosose dehydratase [iolE]"
definition: >-
  This enzyme catalyzes the dehydration of inosose (2-keto-myo-inositol, 2KMI or 2,4,6/3,5-pentahydroxycyclohexanone) to 3D-(3,5/4)-trihydroxycyclohexane-1,2-dione (D-2,3-diketo-4-deoxy-epi-inositol). It uses glutathione and cobalt or manganese as cofactors and belongs to the iolE/mocC family.
