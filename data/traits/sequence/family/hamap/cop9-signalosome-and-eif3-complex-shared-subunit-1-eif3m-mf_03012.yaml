identifier: HAMAP:MF_03012
label: "COP9/Signalosome and eIF3 complex-shared subunit 1 [EIF3M]"
definition: >-
  This entry represents the eukaryotic translation initiation factor 3 subunit M (eIF3m) and the COP9/Signalosome and eIF3 complex-shared subunit 1 (CIF-1) from roundworms. eIF3m is a component of the eukaryotic translation initiation factor 3 (eIF-3) complex, which is involved in protein synthesis and, together with other initiation factors, stimulates binding of mRNA and methionyl-tRNAi to the 40S ribosome.
