identifier: HAMAP:MF_01237
label: "N-acetylneuraminate lyase [nanA]"
definition: >-
  N-acetylneuraminate lyase (or N-Acetylneuraminic acid aldolase, NAL) catalyzes the cleavage of N-acetylneuraminic acid (sialic acid) to form pyruvate and N-acetyl-D-mannosamine. The enzyme plays an important role in the regulation of sialic acid metabolism in bacteria. It has a widespread application as biocatalyst for the synthesis of sialic acid and its derivatives. This enzyme has been shown to be quite specific for pyruvate as the donor, but flexible to a variety of D-and, to some extent, L-hexoses and pentoses as acceptor substrates. NAL is member of dihydrodipicolinate synthase family that comprises several pyruvate-dependent class I aldolases.
