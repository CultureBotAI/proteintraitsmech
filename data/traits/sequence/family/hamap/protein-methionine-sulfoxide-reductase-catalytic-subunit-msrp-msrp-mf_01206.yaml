identifier: HAMAP:MF_01206
label: "Protein-methionine-sulfoxide reductase catalytic subunit MsrP [msrP]"
definition: >-
  MsrPQ is an enzymatic system that repairs proteins containing methionine sulfoxide in the bacterial cell envelope. MsrP, a molybdo-enzyme, and MsrQ, a haem-binding membrane protein, are widely conserved throughout Gram-negative bacteria. MsrPQ uses electrons from the respiratory chain, which represents a novel mechanism to import reducing equivalents into the bacterial cell envelope. MsrPQ is essential for the maintenance of envelope integrity under bleach stress, rescuing periplasmic proteins from methionine oxidation, including the primary periplasmic chaperone SurA. MsrP have been shown to be able to reduce protein-bound methionine sulfoxide and be able to repair a wide range of periplasmic proteins in vitro.
