identifier: HAMAP:MF_02031
label: "Galactarate dehydratase (L-threo-forming) [garD]"
definition: >-
  This entry represents GarD, a galactarate dehydratase (L-threo-forming), from Enterobacteriaceae. It is involved in step 1 of the subpathway that synthesises D-glycerate from galactarate. It catalyses the dehydration of galactarate to form 5-dehydro-4-deoxy-D-glucarate.
