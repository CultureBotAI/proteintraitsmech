identifier: HAMAP:MF_01913
label: "3-sulfolactaldehyde reductase"
definition: >-
  This entry represents 3-sulfolactaldehyde (SLA) reductase from Enterobacteriaceae. It reduces 3-sulfolactaldehyde to 2,3-dihydroxypropane 1-sulfonate (DHPS). It is one of the core enzymes involved in the sulphoquinovose (SQ) metabolic process.
