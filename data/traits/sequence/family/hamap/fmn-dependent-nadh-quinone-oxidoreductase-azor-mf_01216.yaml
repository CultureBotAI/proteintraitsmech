identifier: HAMAP:MF_01216
label: "FMN dependent NADH:quinone oxidoreductase [azoR]"
definition: >-
  This entry represents FMN-dependent NADH:quinone oxidoreductases (also known as FMN-dependent NADH-azoreductases) which function as quinone reductases that provides resistance to thiol-specific stress caused by electrophilic quinones. These enzymes also exhibit azoreductase activity, catalysing the reductive cleavage of azo bond in aromatic azo compounds to the corresponding amines. They require NADH, as an electron donor for its activity. These enzymes are homodimers that binds one FMN molecule per subunit.
definition_source: "InterPro:IPR023048 abstract (HAMAP MF_01216 is a member signature)"
