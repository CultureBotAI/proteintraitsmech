identifier: HAMAP:MF_01933
label: "o-succinylbenzoate synthase [menC]"
definition: >-
  This family represents o-succinylbenzoate synthase MenC (also known as OSB synthase and N-succinylamino acid racemase NAAAR). MenC converts 2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate (SHCHC) to 2-succinylbenzoate (OSB) that also acts as a N-succinylamino acid racemase (NSAR/NAAAR) that catalyses the racemisation of various N-succinylamino acids, including N-succinyl-L-valine, N-succinyl-L-alanine, N-succinyl-L-methionine, N-succinyl-L-tyrosine, N-succinyl-L-serine, N-succinyl-L-isoleucine, N-succinyl-L-phenylalanine and N-succinyl-L-leucine.
