identifier: HAMAP:MF_02084
label: "[LysW]-aminoadipate semialdehyde/glutamate semialdehyde transaminase [lysJ]"
definition: >-
  Several bacteria and archaea utilize the amino group-carrier protein LysW for lysine biosynthesis, whereas the hyperthermophilic archaeon Sulfolobus utilizes LysW for the biosynthesis of both lysine and arginine. LysJ from Sulfolobus acts both as a [LysW]-aminoadipate semialdehyde transaminase and a [LysW]-glutamate semialdehyde transaminase, and is involved in the lysine and arginine biosynthetic pathways respectively. LysJ from Thermus thermophilus is thought to function only as a [LysW]-aminoadipate semialdehyde transaminase.
