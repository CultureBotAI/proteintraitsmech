identifier: HAMAP:MF_01335
label: "Cytochrome b6-f complex iron-sulfur subunit [petC]"
definition: >-
  This entry represents the Rieske FeS protein (encoded by the PetC gene) of the cytochrome b6f complex from plants and cyanobacteria. The Rieske subunit acts by binding plastoquinol anion, transferring an electron to the 2Fe-2S cluster, then releasing the electron to the cytochrome f haem iron. The 2Fe-2S cluster is bound in the highly conserved C-terminal region of the Rieske subunit. In plants, Rieske FeS is required for the successful assembly of the b6f complex and is essential for photosynthesis. The plant cytochrome b6f is located in the thylakoid membrane and functions in both linear and cyclic electron transport, providing ATP and NADPH for photosynthetic carbon fixation. The cytochrome b6f complex has eight different subunits, six being encoded in the chloroplast genome (PetA [cyt f], PetB [cyt b6], PetD, PetG, PetL, and PetN) and two in the nucleus (PetC [Rieske FeS] and PetM. The complex functions as a dimer.
definition_source: "InterPro:IPR023960 abstract (HAMAP MF_01335 is a member signature)"
