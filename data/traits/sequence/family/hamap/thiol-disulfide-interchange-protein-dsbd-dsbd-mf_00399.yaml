identifier: HAMAP:MF_00399
label: "Thiol:disulfide interchange protein DsbD [dsbD]"
definition: >-
  This entry represents the thiol:disulphide interchange protein, DsbD (also known as DipZ). These proteins are thought to facilitate the correct formation of disufide bonds in some periplasmic proteins, as well as for the assembly of the periplasmic c-type cytochromes. DsbD acts by transferring electrons from cytoplasmic thioredoxin to the periplasm. This transfer involves a cascade of disulfide bond formation and reduction steps.
