identifier: HAMAP:MF_01551
label: "Ribosomal RNA large subunit methyltransferase M [rlmM]"
definition: >-
  This entry represents the ribosomal RNA large subunit methyltransferase M (RlmM), previously known as YdgE. RlmM specifically catalyses the 2'-O-methylation of nucleotide C2498 in the peptidyl transferase loop of 23S rRNA.
