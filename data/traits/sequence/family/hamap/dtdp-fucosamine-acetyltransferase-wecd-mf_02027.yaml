identifier: HAMAP:MF_02027
label: "dTDP-fucosamine acetyltransferase [wecD]"
definition: >-
  This entry represents the WecD protein (also known as RffC), a TDP-fucosamine acetyltransferase involved in Enterobacterial common antigen (ECA) synthesis. ECA is a specific surface antigen (polysaccharide) shared by all members of the Enterobacteriaceae and is restricted to this family. ECA has been linked to the resistance of Salmonella enterica to bile salts, however, its function is unclear. WecD is also a member of the GNAT (the GCN5-related N-acetyltransferase) family.
