identifier: HAMAP:MF_01626
label: "Regulatory protein ViaA [viaA]"
definition: >-
  This entry contains ViaA (VWA domain protein interacting with AAA ATPase) proteins. They are a component of the RavA-ViaA chaperone complex, which may act on the membrane to optimise the function of some of the respiratory chains. ViaA stimulates the ATPase activity of RavA.
