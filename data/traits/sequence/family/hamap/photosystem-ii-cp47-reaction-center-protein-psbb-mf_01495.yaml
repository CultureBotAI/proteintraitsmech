identifier: HAMAP:MF_01495
label: "Photosystem II CP47 reaction center protein [psbB]"
definition: >-
  This entry contains the photosystem II P680 chlorophyll A apoprotein, PsbB. Photosystem II light-harvesting proteins are the intrinsic transmembrane antenna proteins CP43 (PsbC) and CP47 (PsbB) found in the reaction centre of PSII. These polypeptides bind to chlorophyll a and beta-carotene and pass the excitation energy on to the reaction centre. This family also includes the iron-stress induced chlorophyll-binding protein CP43 (IsiA), which evolved in cyanobacteria from a PSII protein to cope with light limitations and stress conditions.
definition_source: "InterPro:IPR017486 abstract (HAMAP MF_01495 is a member signature)"
