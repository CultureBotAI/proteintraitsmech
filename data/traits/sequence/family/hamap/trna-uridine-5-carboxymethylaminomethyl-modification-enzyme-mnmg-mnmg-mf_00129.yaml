identifier: HAMAP:MF_00129
label: "tRNA uridine 5-carboxymethylaminomethyl modification enzyme MnmG [mnmG]"
definition: >-
  tRNA uridine 5-carboxymethylaminomethyl modification enzyme MnmG (also known as GidA) is a tRNA modification enzyme found in bacteria and mitochondria. MnmG forms a complex with MnmE which is involved in the formation of methyluridine derivatives at the wobble uridine base in some tRNAs. Sequence variations in the human mitochondrial protein may influence the severity of aminoglycoside-induced deafness.
