identifier: HAMAP:MF_01563
label: "HTH-type transcriptional regulator UlaR [ulaR]"
definition: >-
  The HTH-type transcription regulator UlaR represses ulaG and the ulaABCDEF operon. Two UlaR binding sites have been identified in each promoter. Full activity requires simultaneous interaction of UlaR with both divergent promoters and seems to be dependent on repressor-mediated DNA loop formation, which is helped by the action of integration host factor.
