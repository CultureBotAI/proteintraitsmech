identifier: HAMAP:MF_01868
label: "Lipopolysaccharide core heptose(II)-phosphate phosphatase [ais]"
definition: >-
  This entry represents lipopolysaccharide core heptose(II)-phosphate phosphatase, which catalyzes the dephosphorylation of heptose(II) of the outer membrane lipopolysaccharide core. These proteins are related to cofactor-dependent phosphoglucomutases so distantly that the characteristic domain ( InterPro:IPR001345 ) is not detected. Nonetheless, the relationship has been shown by sequence analysis and molecular modelling, on the basis of which it is predicted that these proteins are phosphatases acting on large substrates, perhaps phosphoproteins. Sequence analysis also predicts that they are periplasmic, having a signal sequence and two pairs of Cys residues close enough to form disulphide bonds. Known properties of these proteins are rather disparate. AfrS is required for the transcriptional activation of AfrA, the major protein of AF/R1 pili in Escherichia coli RDEC-1. Ais proteins are aluminium-inducible proteins of unknown function.
