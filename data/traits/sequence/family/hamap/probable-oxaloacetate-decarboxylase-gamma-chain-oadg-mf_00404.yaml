identifier: HAMAP:MF_00404
label: "Probable oxaloacetate decarboxylase gamma chain [oadG]"
definition: >-
  Oxaloacetate decarboxylases (OAD) catalyse the formation of pyruvate and CO 2 from oxaloacetate which utilises the free energy derived from oxaloacetate decarboxylation for sodium transport across the cell membrane. They are formed of three subunits; the alpha, beta and gamma subunits. This entry represents the gamma chain of oxaloacetate decarboxylases, which interacts with the alpha and beta subunits and stabilizes the OAD complex.
