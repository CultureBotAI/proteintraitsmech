identifier: HAMAP:MF_01808
label: "Tyrosine recombinase XerC [xerC]"
definition: >-
  This entry represents a site-specific tyrosine recombinase, which acts by catalyzing the cutting and rejoining of the recombining DNA molecules. XerD binds cooperatively to specific DNA consensus sequences that are separated from XerC binding sites by a short central region, forming the heterotetrameric XerC-XerD complex that recombines DNA substrates. The complex is essential to convert dimers of the bacterial chromosome into monomers to permit their segregation at cell division. It also contributes to the segregational stability of plasmids. XerD forms a cyclic heterotetrameric complex composed of two molecules of XerC and two molecules of XerD, in which XerC interacts with XerD via its C-terminal region, XerD interacts with XerC via its C-terminal region and so on.
