identifier: HAMAP:MF_00328
label: "Guanylate kinase [gmk]"
definition: >-
  Guanylate kinase, also called GMP kinase, is essential for recycling GMP and indirectly, cGMP. This enzyme transfers a phosphate from ATP to GMP, yielding ADP and GDP. Guanylate kinase is a highly conserved monomer and is important for the activation of various antiviral drugs.
