identifier: HAMAP:MF_00832
label: "Putative carbamate hydrolase RutD [rutD]"
definition: >-
  RutD is encoded within the Rut operon which allows growth on pyrimidines as sole nitrogen source. The function of this protein is not known, but it is necessary for growth on pyrimidines, and cells lacking RutD produce much less of the Rut pathway intermediate malonic semialdehyde than normal. It is thought that RutD increases the rate of spontaneous hydrolysis of the toxic intermediate aminoacrylate to malonic semialdehyde.
