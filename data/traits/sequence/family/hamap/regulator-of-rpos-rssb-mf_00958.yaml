identifier: HAMAP:MF_00958
label: "Regulator of RpoS [rssB]"
definition: >-
  SigmaS (RpoS) is the master regulator of the general stress response in Escherichia coli. RssB regulates the turnover of RpoS by promoting its proteolysis in exponentially growing cells. RssB also has a second function in the control of mRNA polyadenylation and degradation.
