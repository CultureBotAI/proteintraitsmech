identifier: HAMAP:MF_03206
label: "Elongation of very long chain fatty acids protein 6 [ELOVL6]"
definition: >-
  Elongation of very long chain fatty acids protein 6 (ELOVL6, also known very long chain fatty acid elongase 6) is a membrane-bound enzyme located in the endoplasmic reticulum that is component of the long-chain fatty acids elongation cycle. ELOVL6 adds two carbons per cycle to long- and very long-chain fatty acids with a preference for 12, 14 and 16 carbons with higher activity toward C16:0 acyl-CoAs.
