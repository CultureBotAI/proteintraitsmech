identifier: HAMAP:MF_00737
label: "Formimidoylglutamase [hutG]"
definition: >-
  Formiminoglutamase (EC:3.5.3.8), the fourth enzyme of histidine degradation, is similar to arginases and agmatinases. It is often encoded near other enzymes of the histidine degredation pathway: histidine ammonia-lyase, urocanate hydratase, and imidazolonepropionase. It catalyses the reaction: N-formimidoyl-L-glutamate + H2O = L-glutamate + formamide.
