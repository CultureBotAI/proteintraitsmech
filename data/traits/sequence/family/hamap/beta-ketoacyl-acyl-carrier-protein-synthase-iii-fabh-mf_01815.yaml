identifier: HAMAP:MF_01815
label: "Beta-ketoacyl-[acyl-carrier-protein] synthase III [fabH]"
definition: >-
  Beta-ketoacyl-[acyl-carrier-protein] synthase III (FabH) generally initiates elongation in type II fatty acid synthase systems found in bacteria and plants. It is responsible for producing the multitude of fatty acid structures found in bacterial membranes. The two members of this subfamily from Bacillus subtilis differ from each other, and from FabH from Escherichia coli, in acyl group specificity. Active site residues include Cys112, His244 and Asn274 of Escherichia coli FabH. Cys-112 is the site of acyl group attachment.
