identifier: HAMAP:MF_01818
label: "Ribonuclease BN [rbn]"
definition: >-
  This entry includes ribonuclease Z (RNase Z) and its orthologues, such as RNase BN (also known as elaC) from E.coli. They are ribonucleases that have functions in tRNA-3' processing. RNase Z orthologues are present in all eukaryotes and archaea sequenced so far, and are widely distributed in bacteria. All tRNAs are synthesized as precursor molecules and their maturation to functional tRNAs requires several processing steps. First, the removal of the 5'-leader is catalysed by the endonucleolytic ribozyme RNase P. Second, the removal of the 3'-trailer sequences, which is either a single-step endonucleolytic process or a two-step process involving downstream cleavage by an endonuclease followed by exonucleolytic trimming to generate the mature 3'-end. The first evidence for the maturation of tRNA 3'-ends by a single endonucleolytic cleavage reaction came from eukaryotes. In these cases, the cleavage of the 3'-end is carried out by RNase Z. In most cases, RNase Z removes the 3'-trailer sequence by cleaving directly after the discriminator nucleotide. Interestingly, the CCA motif present in all mature tRNAs is a general anti-determinant for RNase Z activity. The activity of some RNase Z homologues found in bacterial and archaea have also been shown to be inhibited by the presence of a CCA motif.
definition_source: "InterPro:IPR013471 abstract (HAMAP MF_01818 is a member signature)"
