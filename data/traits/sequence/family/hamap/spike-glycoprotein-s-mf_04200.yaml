identifier: HAMAP:MF_04200
label: "Spike glycoprotein [S]"
definition: >-
  Coronovirus enter target cells through fusion of viral and cellular membranes mediated by the viral envelope glycoprotein S. Trimers of Coronovirus S glycoprotein constitute the typical viral spikes. The precursor S protein is processed by host cell furin or furin-like protease to yield the mature S1 and S2 proteins. This entry represents the spike glycoprotein from Alphacoronavirus.
