identifier: HAMAP:MF_00907
label: "Proofreading thioesterase EntH [entH]"
definition: >-
  EntH is required for optimal synthesis of enterobactin, a siderophore synthesised in response to iron limitation. EntH acts as a proofreading enzyme that prevents carrier protein EntB misacylation by hydrolysing the thioester bound existing between EntB and wrongly charged molecules.
