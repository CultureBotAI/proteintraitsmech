identifier: HAMAP:MF_00380
label: "Integration host factor subunit alpha [ihfA]"
definition: >-
  Integration host factor (IHF) is a heterodimeric protein consisting of alpha and beta (InterPro:IPR005685) subunits. IHF binds the minor groove of DNA in a sequence-specific manner to induce a large bend. This bending stabilises distinct DNA conformations that are required during several bacterial processes, such as recombination, transposition, replication and transcription. IHF is known to act as a transcription factor at many gene regulatory regions in E. coli. It is an essential cofactor in phage lambda site-specific recombination, having an architectural role during assembly of specialized nucleoprotein structures (snups). IHF is also involved in formation as well as maintenance of bacterial biofilms since it is found in complex with extracellular DNA (eDNA) within the extracellular polymeric substances (EPS) matrix of many biofilms.
