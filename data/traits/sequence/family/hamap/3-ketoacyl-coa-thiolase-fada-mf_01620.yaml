identifier: HAMAP:MF_01620
label: "3-ketoacyl-CoA thiolase [fadA]"
definition: >-
  This subunit of the FadBA complex has acetyl-CoA C-acyltransferase (EC:2.3.1.16) activity, and is also known as beta-ketothiolase and fatty oxidation complex, beta subunit. This protein is almost always located adjacent to FadB (InterPro:IPR012799). The FadBA complex is the major complex active for beta-oxidation of fatty acids in Escherichia coli.
