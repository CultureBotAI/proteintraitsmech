identifier: HAMAP:MF_01949
label: "O-acetyltransferase WecH [wecH]"
definition: >-
  WecH (also known as yiaH) is responsible for the incorporation of O-acetyl groups into the enterobacterial common antigen (ECA) trisaccharide repeat units. It catalyses the acetylation of both cyclic ECA (ECA(CYC)) and phosphoglyceride-linked ECA (ECA(PG)).
