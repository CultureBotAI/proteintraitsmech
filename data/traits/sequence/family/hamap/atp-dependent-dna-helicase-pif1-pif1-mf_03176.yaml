identifier: HAMAP:MF_03176
label: "ATP-dependent DNA helicase PIF1 [PIF1]"
definition: >-
  This entry includes a group of DNA helicases, including Pif1 and Rrm3 from budding yeasts and Pfh1 from fission yeast. Pif1 is a DNA helicase conserved from bacteria to humans. It suppresses both G-quadruplex-associated DNA damage and telomere lengthening. In budding yeast, it exists in two forms, nuclear form and mitochondrial form. Its nuclear form inhibits telomerase, while its mitochondrial form is involved in repair and recombination of mitochondrial DNA.
