identifier: HAMAP:MF_01330
label: "Protein Ycf2 [ycf2]"
definition: >-
  This family consists of chloroplast encoded Ycf2, which is around 2000 residues in length. Ycf2 is a component of the Ycf2-FtsHi complex which has been identified as chloroplast import motor. The Ycf2-FtsHi complex is composed of six distinct components. This heterohexameric assembly is organized in a counterclockwise order with components arranged as Ycf2, FtsHi5, FtsHi1, FtsHi2, FtsHi4, and FtsH12. A collaborative interplay between the Ycf2-FtsHi complex and the TIC (translocon at the inner chloroplast membrane) complex, contributes to the efficient translocation of preproteins into the chloroplasts.
