identifier: HAMAP:MF_01937
label: "1,4-dihydroxy-2-naphthoate octaprenyltransferase [menA]"
definition: >-
  This membrane-associated enzyme converts 1,4-dihydroxy-2-naphthoic acid (DHNA) to demethylmenaquinone (DMK), a step in menaquinone biosynthesis. A key reaction in the biosynthesis of menaquinone involves the conversion of the soluble bicyclic naphthalenoid compound 1, 4-dihydroxy-2-naphthoic acid (DHNA) to the membrane-bound demethylmenaquinone.
