identifier: HAMAP:MF_02231
label: "Ubiquinone biosynthesis accessory factor UbiT [ubiT]"
definition: >-
  This family represents the UbiT (also known as YhbT) protein. It is involved in the ubiquinone biosynthesis pathway alongside UbiU (YhbU), and UbiV (YhbV). UbiT contains an SCP2 domain InterPro:IPR003033 which binds the hydrophobic UQ biosynthetic intermediates and structures a multiprotein Ubi complex.
