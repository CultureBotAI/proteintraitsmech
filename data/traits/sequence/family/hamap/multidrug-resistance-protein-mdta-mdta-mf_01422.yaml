identifier: HAMAP:MF_01422
label: "Multidrug resistance protein MdtA [mdtA]"
definition: >-
  This entry represents the multidrug resistance protein MdtA. MdtA is one subunit of the MdtABC tripartite complex which is a RND-type drug exporter. The complex consists of MdtB/C, which form a transmembrane heteromultimer and MdtA which is a membrane fusion protein. The mdtABC complex confers resistance against novobiocin and deoxycholate.
