identifier: HAMAP:MF_01469
label: "Ribonuclease M5 [rnmV]"
definition: >-
  Ribonuclease M5 is required for correct processing of both the 5' and 3' ends of 5S rRNA precursor. It cleaves both sides of a double-stranded region yielding mature 5S rRNA in one step.
