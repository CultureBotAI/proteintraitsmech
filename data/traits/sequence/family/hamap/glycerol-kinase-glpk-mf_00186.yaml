identifier: HAMAP:MF_00186
label: "Glycerol kinase [glpK]"
definition: >-
  Glycerol kinase ( EC:2.7.1.30 ) is a bacterial sugar kinase which catalyses the Mg-ATP-dependent phosphorylation of glycerol to yield glycerol 3-phosphate. The enzyme from Escherichia coli is an allosteric regulatory enzyme whose activity is inhibited by fructose 1,6-bisphosphate (FBP) and the glucose-specific phosphocarrier of the phosphoenolpyruvate:glycose phosphotransferase system, IIA(Glc), structural studies suggest a nucleophilic in-line transfer mechanism for the ATP-dependent phosphorylation of glycerol by glycerol kinase.
definition_source: "InterPro:IPR005999 abstract (HAMAP MF_00186 is a member signature)"
