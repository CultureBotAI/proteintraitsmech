identifier: HAMAP:MF_01248
label: "Glycogen debranching enzyme [glgX]"
definition: >-
  O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. This entry represents the glycogen debranching enzyme GlgX found in Escherichia coli, as well as its equivalogs in other prokaryotic species. This enzyme encodes an isoamylase-type debranching enzyme with high specificity for hydrolysis of chains consisting of three or four glucose residues, and is classed as family 13 of glycosyl hydrolases. GlgX is not required for glycogen biosynthesis, but instead acts as a debranching enzyme for glycogen catabolism. This entry distinguishes GlgX from pullanases and other related proteins that also operate on alpha-1,6-glycosidic linkages. This entry only includes proteins predominantly from the Enterobacteriaceae family.
