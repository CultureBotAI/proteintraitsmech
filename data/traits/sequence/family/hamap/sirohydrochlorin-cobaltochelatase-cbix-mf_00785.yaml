identifier: HAMAP:MF_00785
label: "Sirohydrochlorin cobaltochelatase [cbiX]"
definition: >-
  This entry represents archaeal sirohydrochlorin cobaltochelatase. This enzyme chelates cobalt to the cobalamin precursor as part of the anaerobic pathway to cobalamin biosynthesis.
