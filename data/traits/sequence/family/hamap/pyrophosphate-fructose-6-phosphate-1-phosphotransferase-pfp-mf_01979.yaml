identifier: HAMAP:MF_01979
label: "Pyrophosphate--fructose 6-phosphate 1-phosphotransferase [pfp]"
definition: >-
  This entry represents the pyrophosphate-dependent phosphofructokinase, TM0289 type. It catalyses the phosphorylation of D-fructose 6-phosphate, the first committing step of glycolysis. It uses inorganic phosphate (PPi) as phosphoryl donor instead of ATP like common ATP-dependent phosphofructokinases (ATP-PFKs), which renders the reaction reversible, and can thus function both in glycolysis and gluconeogenesis.
definition_source: "InterPro:IPR011403 abstract (HAMAP MF_01979 is a member signature)"
