identifier: HAMAP:MF_02074
label: Renalase
definition: >-
  A bacterial form of renalase has been identified in Pseudomonas that has the same substrate specificity profile as human renalase, but with a marked preference for substrates derived from beta-NAD+. It catalyzes the oxidation of the 1,2-dihydro- and 1,6-dihydro- isomeric forms of beta-NAD(P) back to beta-NAD(P)+. This could serve to protect dehydrogenase enzymes from inhibition by these isomers.
