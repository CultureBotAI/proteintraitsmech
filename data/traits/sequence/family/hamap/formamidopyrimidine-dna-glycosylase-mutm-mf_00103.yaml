identifier: HAMAP:MF_00103
label: "Formamidopyrimidine-DNA glycosylase [mutM]"
definition: >-
  This entry represents formamidopyrimidine-DNA glycosylase proteins mostly found in bacteria. Formamidopyrimidine-DNA glycosylases (Fpg, MutM) are trifunctional DNA base excision repair enzymes that remove a wide range of oxidation-damaged bases (N-glycosylase activity; EC:3.2.2.23) and cleave both the 3'- and 5'-phosphodiester bonds of the resulting apurinic/apyrimidinic site (AP lyase activity; EC:4.2.99.18). Fpg has a preference for oxidised purines, excising oxidised purine bases such as 7,8-dihydro-8-oxoguanine (8-oxoG). Its AP (apurinic/apyrimidinic) lyase activity introduces nicks in the DNA strand, cleaving the DNA backbone by beta-delta elimination to generate a single-strand break at the site of the removed base with both 3'- and 5'-phosphates. Fpg is a monomer composed of 2 domains connected by a flexible hinge. The two DNA-binding motifs (a zinc finger and the helix-two-turns-helix motifs) suggest that the oxidised base is flipped out from double-stranded DNA in the binding mode and excised by a catalytic mechanism similar to that of bifunctional base excision repair enzymes. Fpg binds one ion of zinc at the C-terminal, which contains four conserved and essential cysteines.
definition_source: "InterPro:IPR020629 abstract (HAMAP MF_00103 is a member signature)"
