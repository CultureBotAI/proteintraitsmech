identifier: HAMAP:MF_01215
label: "Orotidine 5'-phosphate decarboxylase [pyrF]"
definition: >-
  Orotidine 5'-phosphate decarboxylase (OMPdecase) catalyses the last step in the de novo biosynthesis of pyrimidines, the decarboxylation of OMP into UMP. In higher eukaryotes OMPdecase is part, with orotate phosphoribosyltransferase, of a bifunctional enzyme, while the prokaryotic and fungal OMPdecases are monofunctional protein. This entry represents orotidine 5'-monophosphate decarboxylase type 2 - a distinct subfamily of the same enzyme represented by InterPro:IPR014732.
definition_source: "InterPro:IPR011995 abstract (HAMAP MF_01215 is a member signature)"
