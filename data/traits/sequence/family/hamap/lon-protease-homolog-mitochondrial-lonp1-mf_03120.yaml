identifier: HAMAP:MF_03120
label: "Lon protease homolog, mitochondrial [LONP1]"
definition: >-
  Lon protease is an ATP-dependent serine proteases that mediates the selective degradation of misfolded, unassembled or oxidatively damaged polypeptides as well as certain short-lived regulatory proteins. Proteins in this entry are the eukaryotic homologues of the Lon protease that localise at the mitochondrial matrix. They may also have a chaperone function in the assembly of inner membrane protein complexes. They may participate in the regulation of mitochondrial gene expression and in the maintenance of the integrity of the mitochondrial genome. In plants, they also localise at the chloroplast.
