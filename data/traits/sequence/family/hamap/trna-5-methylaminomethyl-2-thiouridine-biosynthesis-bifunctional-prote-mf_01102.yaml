  This entry represents the tRNA 5-methylaminomethyl-2-thiouridine biosynthesis bifunctional protein MnmC. It has FAD-dependent oxidoreductase and methytransferase activity ([ec:1.5.-.-] and [ec:2.1.1.-] respectively).
