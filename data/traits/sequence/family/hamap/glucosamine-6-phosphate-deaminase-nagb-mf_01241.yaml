identifier: HAMAP:MF_01241
label: "Glucosamine-6-phosphate deaminase [nagB]"
definition: >-
  Glucosamine-6-phosphate isomerase, aslo known as Glucosamine-6-phosphate deaminase (EC:3.5.99.6), catalyses the conversion of D-glucosamine 6-phosphate (GlcN6P) to D-fructose 6-phosphate and ammonium. This is the last step in the pathway for N-acetylglucosamine (GlcNAC) utilization in bacteria such as Escherichia coli (gene nagB) or in fungi such as Candida albicans (Yeast) (gene NAG1). The structure of this enzyme from E. coli (NagB) is described as a modified NAD-binding domain, and undergoes allosteric conformational changes that regulate its function. The reaction steps involve opening of the pyranose ring of the substrate and a sequence of general base-catalysed reactions to bring about isomerisation and deamination. This family also includes a closely related pair of proteins from Bacillus subtilis, one of which is uncharacterised but included as a member of the orthologous set.
definition_source: "InterPro:IPR004547 abstract (HAMAP MF_01241 is a member signature)"
