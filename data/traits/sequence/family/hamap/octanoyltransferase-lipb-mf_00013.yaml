identifier: HAMAP:MF_00013
label: "Octanoyltransferase [lipB]"
definition: >-
  Lipoate-protein ligase B (gene lipB), alternatively known as octanoyltransferase ( EC:2.3.1.181 ) is an enzyme that creates an amide linkage that joins the free carboxyl group of lipoic acid to the ε-amino group of a specific lysine residue in lipoate-dependent enzymes.
