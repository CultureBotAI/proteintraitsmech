identifier: HAMAP:MF_01093
label: "Tetrahydromethanopterin S-methyltransferase subunit A [mtrA]"
definition: >-
  Tetrahydromethanopterin S-methyltransferase is a complex that catalyses the formation of methyl-coenzyme M and tetrahydromethanopterin from coenzyme M and methyl-tetrahydromethanopterin in methanogenic archaea. It is a membrane-associated enzyme complex that uses the methyl-transfer reaction to drive a sodium-ion pump. The complex is composed of eight different subunits, MtrA-H. This entry describes subunit A (MtrA), which harbours a corrinoid as prosthetic group.
