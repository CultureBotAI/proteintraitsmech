identifier: HAMAP:MF_01011
label: "tRNA/tmRNA (uracil-C(5))-methyltransferase [trmA]"
definition: >-
  This family consists of methyltransferases. The family member from Escherichia coli has been shown to have dual-specificity, catalysing the formation of 5-methyluridine at position 54 (m5U54) in all tRNAs, and that of position 341 (m5U341) in tmRNA (transfer-mRNA). This enzyme is inhibited by adenosylhomocysteine.
