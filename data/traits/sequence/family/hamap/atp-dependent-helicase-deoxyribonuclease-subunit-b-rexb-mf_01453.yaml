identifier: HAMAP:MF_01453
label: "ATP-dependent helicase/deoxyribonuclease subunit B [rexB]"
definition: >-
  DNA repair is accomplished by several different systems in prokaryotes. Recombinational repair of double-stranded DNA breaks involves the RecBCD pathway in some lineages, and AddAB (also called RexAB) in other. The AddA is conserved between the firmicutes and the alphaproteobacteria, while its partner protein (RexB) is not. The partner may be designated AddB, as in Bacillus and in alphaproteobacteria, or RexB as in Streptococcus and Lactococcus. Note, however, that RexB proteins lack an N-terminal GxxGxGK[ST] ATP-binding motif found in Bacillus subtilis and related species, and this difference may be important. This entry represents RexB proteins as found in Streptococcus and Lactococcus.
definition_source: "InterPro:IPR014141 abstract (HAMAP MF_01453 is a member signature)"
