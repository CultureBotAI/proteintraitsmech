identifier: HAMAP:MF_01449
label: "HTH-type transcriptional regulator SgrR [sgrR]"
definition: >-
  This entry represents the transcriptional regulator SgrR, which contains 1 HTH MarR-type DNA-binding domain. SgrR activates the small RNA gene SgrS under glucose-phosphate stress conditions as well as YfdZ. It represses its own transcription under both stress and non-stress conditions. It also might act as a sensor of the intracellular accumulation of phosphoglucose by binding these molecules in its C-terminal solute-binding domain.
