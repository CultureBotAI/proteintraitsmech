identifier: HAMAP:MF_03184
label: "ATP-dependent 6-phosphofructokinase"
definition: >-
  Phosphofructokinase (PFK) catalyses the phosphorylation of fructose-6-phosphate to fructose-1,6-biphosphate, which then enters the Embden-Meyerhof pathway. PFK is a key regulatory enzyme in glycolysis. This entry represent eukaryotic type of ATP-dependent PFKs. They belong to the PFK domain superfamily of proteins, which also includes pyrophosphate (PPi)-dependent PFKs ( ) and bacterial ATP-dependent PFKs ( ). Unlike the bacterial PFKs, eukaryotic PFKs have a large N-terminal extension bearing an additional PFK domain. Proteins in this entry largely resemble group E PFKs. Classification of PFK proteins revealed that major functional specialization can occur by mutation in one single amino acid residue. Based on the energy phosphoryl donors, the PFKs can be divided into two groups: ATP dependent PFKs (ATP-PFK) and inorganic pyrophosphate dependent PFKs (PPi-PFK). The eukaryotic ATP-PFKs are twice the size of the prokaryotic ATP-PFKs and have arisen through gene duplication and fusion of the ancestral bacterial gene. Not surprisingly, eukaryotic ATP-PFK homodimers are essentially equivalent to prokaryotic homotetramers. The PPi-PFKs, unlike the majority of ATP-PFKs, are not monophyletic in origin. The ability to use ATP or PPi is suggested to be dependent on the presence of one invariant glycine residue; therefore it is not surprising that the ability to utilise PPi has arisen more than once, and some recent changes in the phosphoryl donor (ATP to PPi) can be seen in several bacterial PFKs from. It has been hypothesized that PPi-PFK may provide organisms niche-specific advantages, because the PPi phosphoryl donor allows both conservation of ATP and reaction reversibility; thus, it can function in both glycolysis and gluconeogenesis. It is likely that these enzymes evolved
