identifier: HAMAP:MF_01182
label: "Cytochrome c-552 [nrfA]"
definition: >-
  Members of this protein family represent cytochrome c552, a component of cytochrome c nitrite reductase, which is known more formally as nitrite reductase (cytochrome; ammonia-forming, ). Nitrite can be reduced by several enzymes: reduces nitrite all the way to ammonia, rather than to ammonium hydroxide (ammonia:ferricytochrome-c oxidoreductase), (ammonium-hydroxide:NAD(P)+ oxidoreductase), nitrite reductase (NO-forming) (nitric-oxide:ferricytochrome-c oxidoreductase). Some examples of occur in a seven gene system that enables formate-dependent nitrite reduction, but it can also be found in simpler contexts. All members of this protein family, however, do belong to the formate-dependent system of nitrite reduction.
definition_source: "InterPro:IPR017570 abstract (HAMAP MF_01182 is a member signature)"
