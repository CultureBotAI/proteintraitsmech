identifier: HAMAP:MF_03177
label: "ATP-dependent DNA helicase RRM3 [RRM3]"
definition: >-
  This entry represents ATP-dependent DNA helicase Rrm3 from budding yeasts. It is a 5' to 3' DNA replicative helicase recruited to paused replisomes to promote fork progression throughout nonhistone protein-DNA complexes, naturally occurring impediments that are encountered in each S phase where replication forks pauses. It shares protein sequence similarities with another DNA helicase, Pif1. However, their functions are different. Rrm3 promotes telomere replication, while Pif1 inhibits telomere replication. They also have opposite effects on replication fork progression in ribosomal DNA.
definition_source: "InterPro:IPR028880 abstract (HAMAP MF_03177 is a member signature)"
