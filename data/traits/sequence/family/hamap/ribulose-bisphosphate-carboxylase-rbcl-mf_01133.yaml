identifier: HAMAP:MF_01133
label: "Ribulose bisphosphate carboxylase [rbcL]"
definition: >-
  Type III ribulose bisphosphate carboxylase (RuBisCO) is composed of a large chain homodimer in a "head-to-tail" conformation. In contrast to type I RuBisCO, type III RuBisCO is composed solely of large subunits, or RuBisCO. These proteins act in a three-step pathway for conversion of the sugar moiety of AMP to two molecules of 3-phosphoglycerate. Many of these species in this entry use ADP-dependent sugar kinases, which form AMP, for glycolysis.
