identifier: HAMAP:MF_02249
label: "3-oxopimeloyl-[acyl-carrier-protein] synthase [bioZ]"
definition: >-
  This family includes 3-oxopimeloyl-[acyl-carrier-protein] synthase from bacteria, which is involved in the formation of the biotin precursor pimeloyl-ACP. This protein catalyses the condensation of glutaryl-CoA, an intermediate in lysine degradation, with malonyl-ACP to produce 3-oxopimeloyl-ACP.
