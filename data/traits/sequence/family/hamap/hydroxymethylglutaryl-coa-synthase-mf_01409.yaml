identifier: HAMAP:MF_01409
label: "Hydroxymethylglutaryl-CoA synthase"
definition: >-
  This entry represents Hydroxymethylglutaryl-CoA synthase and related prokaryotic proteins. These proteins show considerable similarity and identical active site residues to FabH, the beta-ketoacyl-acyl carrier protein synthase III of bacteria and plants. They catalyze the condensation of acetyl-CoA with acetoacetyl-CoA to form 3-hydroxy-3-methylglutaryl-CoA (HMG-CoA). These enzymes function in the mevalonate (MVA) pathway leading to isopentenyl diphosphate (IPP), a key precursor for the biosynthesis of isoprenoid compounds that are building blocks of archaeal membrane lipids. In Methanocaldococcus jannaschii (Methanococcus jannaschii) UniProtKB:Q58941, Cys-112 is the site of acyl group attachment and His-234 and Asn-237 are also active site residues by homology to FabH.
definition_source: "InterPro:IPR004656 abstract (HAMAP MF_01409 is a member signature)"
