identifier: HAMAP:MF_01910
label: "Probable ribonuclease FAU-1 [fau-1]"
definition: >-
  This entry represents the FAU-1 protein from archaea. In Pyrococcus furiosus, FAU-1 (P. furiosus AU-binding), is highly charged, heat-stable protein from that binds specifically to the AU-rich sequence in a loop region of RNA. FAU-1 consists of two domains, N- and C-terminal, and from a structure determined in FAU-1 from Pyrococcus furiosus, it forms a homo-trimer. The C-terminal domain forms the trimer and each N-terminal domain locates outside of the trimer core. A dinucleotide, pApUp, was bound to the N-terminal domain, indicating that it has the RNA-binding ability and resembles RNase E from Escherichia coli. FAU-1 has been shown to possess an RNase activity against precursor 5S rRNA derived from P. furiosus and T. kodakarensis in the order Thermococcales in vitro. In Haloferax volcanii, it has been described as a RNase that participates in the maturation of pre-16S rRNA and renamed to RNase W, comprising the first archaea-specific contributor to archaeal ribosome biogenesis.
