identifier: HAMAP:MF_00568
label: "Quinolinate synthase [nadA]"
definition: >-
  This entry represents a group of bacterial type 2 quinolinate synthetases (NadA). Quinolinate synthetase catalyses the second step of the de novo biosynthetic pathway of pyridine nucleotide formation. In particular, quinolinate synthetase is involved in the condensation of dihydroxyacetone phosphate and iminoaspartate to form quinolinic acid. This synthesis requires two enzymes, an FAD-containing "B protein" and an "A protein".
