identifier: HAMAP:MF_01292
label: "4-hydroxy-2-oxo-heptane-1,7-dioate aldolase [hpcH]"
definition: >-
  This entry represents the aldolase which performs the final step unique to the 4-hydroxyphenylacetic acid catabolism pathway in which 2,4-dihydroxyhept-2-ene-1,7-dioic acid is split into pyruvate and succinate-semialdehyde. The gene for this enzyme is generally found adjacent to other genes for this pathway. The reaction catalysed is: 4-hydroxy-2-ketoheptane-1,7-dioate = pyruvate+ succinate semialdehyde. This enzyme belongs to the hpcH/hpaI aldolase family and the proteins found in this entry are specific to the enterobacteriales.
definition_source: "InterPro:IPR023701 abstract (HAMAP MF_01292 is a member signature)"
