identifier: HAMAP:MF_00768
label: "HTH-type transcriptional regulator BetI [betI]"
definition: >-
  BetI is a DNA-binding transcriptional repressor of the bet (betaine) regulon which is related to TetR. Choline, through BetI, induces the expression of the betaine biosynthesis genes betA and betB by de-repression. The choline porter gene betT is also part of this regulon in Escherichia coli. Note that a different transcriptional regulator, ArcA, controls the expression of bet regulon genes in response to oxygen, as BetA is an oxygen-dependent enzyme.
