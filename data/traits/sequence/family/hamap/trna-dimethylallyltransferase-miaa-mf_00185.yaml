identifier: HAMAP:MF_00185
label: "tRNA dimethylallyltransferase [miaA]"
definition: >-
  This entry represents tRNA dimethylallyltransferase, also known as delta(2)-isopentenylpyrophosphate transferase, IPP transferral and 2-methylthio-N6-isopentyladenosine tRNA modification enzyme. This enzyme catalyses the first step in the modification of an adenosine near the anticodon to 2-methylthio-N6-isopentyladenosine. Plants have two classes of isopentenyltransferases (IPTs): ATP/ADP isopentenyltransferases (IPT1, 3, 4-8) and tRNA IPTs (IPT2 and 9). Both types are included in this family.
