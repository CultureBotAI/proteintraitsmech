identifier: HAMAP:MF_01298
label: "Arginine decarboxylase proenzyme"
definition: >-
  Arginine decarboxylase proenzyme specifically catalyses the decarboxylation of L-arginine to agmatine. Although this family evolved from an S-adenosylmethionine decarboxylase (AdoMetDC), it has no AdoMetDC activity.
