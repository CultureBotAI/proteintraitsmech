identifier: HAMAP:MF_01527_A
label: "GTP cyclohydrolase FolE2 [folE2]"
definition: >-
  This entry represents GTP cyclohydrolases belonging to family IV. In archaea, GTP cyclohydrolase MptA converts GTP to 7,8-dihydro-D-neopterin 2',3'-cyclic phosphate, the first intermediate in the biosynthesis of coenzyme methanopterin.
