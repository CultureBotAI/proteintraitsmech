identifier: HAMAP:MF_01540
label: "Sulfite reductase [NADPH] hemoprotein beta-component [cysI]"
definition: >-
  Sulphite reductase (NADPH) (EC:1.8.1.2) catalyses a six electron reduction of sulfite to sulfide in prokaryotic organisms and is required for the biosynthesis of L-cysteine from sulfate. It is a complex oligomeric enzyme composed of two different peptides with a subunit composition of α(8)-β(4). The alpha component, encoded by cysJ, is a flavoprotein containing both FMN and FAD, while the beta component, encoded by cysI, is a siroheme, iron-sulphur protein.
