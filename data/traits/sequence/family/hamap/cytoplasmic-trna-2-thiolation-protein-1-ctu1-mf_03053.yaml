identifier: HAMAP:MF_03053
label: "Cytoplasmic tRNA 2-thiolation protein 1 [CTU1]"
definition: >-
  Cytoplasmic tRNA 2-thiolation protein 1 (also known as Ncs6/Tuc1 in budding yeasts) is responsible for 2-thiolation of mcm5S2U at tRNA wobble positions of tRNA(Lys), tRNA(Glu) and tRNA(Gln). It directly binds tRNAs and probably acts by catalysing adenylation of tRNAs, an intermediate required for 2-thiolation. Its fission yeast homologue, Ctu1 forms a complex with Ctu2 (Ncs2/Tuc2 homologue) and serves as a putative enzyme for the formation of 2-thiouridine. This family also includes tRNA-5-methyluridine(54) 2-sulfurtransferase, which catalyses the 2-thiolation of 5-methyluridine residue at position 54 in the T loop of tRNAs, leading to 5-methyl-2-thiouridine.
