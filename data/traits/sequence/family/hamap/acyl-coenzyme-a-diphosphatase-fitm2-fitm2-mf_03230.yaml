identifier: HAMAP:MF_03230
label: "Acyl-coenzyme A diphosphatase FITM2 [FITM2]"
definition: >-
  This family includes FIT1 and FIT2 proteins. Fat storage-inducing transmembrane protein family (FIT/FITM, also known as Acyl-coenzyme A diphosphatase EC:3.6.1) plays an important role in lipid droplet accumulation. They are endoplasmic reticulum (ER) resident membrane proteins that induce lipid droplet accumulation in cell culture and when expressed in mouse liver; they hydrolyses fatty acyl-CoA to yield acyl-4'-phosphopantetheine and adenosine 3',5'-bisphosphate, with preference of unsaturated long-chain acyl-CoA substrates in the ER. The ability to store fat in the form of cytoplasmic triglyceride droplets is conserved from yeast to humans, important for maintaining ER structure and for lipid droplets (LDs) biogenesis, which are lipid storage organelles involved in maintaining lipid and energy homeostasis. The FIT family of proteins are not involved in triglyceride biosynthesis. In mammals there are two FIT proteins, FIT1, which is muscle specific and FIT2, which is expressed in most other tissues. Yeast has two FIT2 orthologues, called Scs3p and Yft2p but no FITM1. FIT1 and FIT2 proteins are six-transmembrane-domain containing proteins with both the N and C termini residing in the cytosol. FIT2 is the more ancient conserved homologue of the FIT family; this family of proteins do not share sequence similarity to known proteins or domains.
definition_source: "InterPro:IPR046401 abstract (HAMAP MF_03230 is a member signature)"
