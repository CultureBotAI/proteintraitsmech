identifier: HAMAP:MF_00390
label: "Sulfurtransferase TusD [tusD]"
definition: >-
  This entry includes TusD and DsrE proteins. The three proteins TusB, TusC, and TusD form a heterohexamer responsible for a sulphur relay reaction. In large numbers of proteobacterial species, this complex acts on a Cys-derived persulphide moiety, delivered by the cysteine desulphurase IscS to TusA, then to TusBCD. The activated sulphur group is then transferred to TusE (DsrC), then by MnmA (TrmU) for modification of an anticodon nucleotide in tRNAs for Glu, Lys, and Gln. The sulphur relay complex TusBCD is also found, under the designation DsrEFH, in phototrophic and chemotrophic sulphur bacteria, such as Chromatium vinosum or Chlorobium tepidum. In these organisms, it seems the primary purpose is related to sulphur flux, such as oxidation from sulphide to molecular sulphur to sulphate.
