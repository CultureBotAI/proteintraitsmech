identifier: HAMAP:MF_01019
label: "Histidine biosynthesis bifunctional protein HisIE [hisI]"
definition: >-
  The HisI and HisE functions, phosphoribosyl-AMP cyclohydrolase EC:3.5.4.19 and phosphoribosyl-ATP pyrophosphatase EC:3.6.1.31, are coded by a a single gene in E. coli and other bacteria. This entry represents bifunctional HisIE proteins. This entry also includes its plant homologues, such as HISN2 (At1g31860) from Arabidopsis.
