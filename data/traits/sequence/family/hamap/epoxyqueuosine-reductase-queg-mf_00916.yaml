identifier: HAMAP:MF_00916
label: "Epoxyqueuosine reductase [queG]"
definition: >-
  Proteins in this family are epoxyqueuosine reductases that catalyse the conversion of epoxyqueuosine (oQ) to queuosine (Q), which is a hypermodified base found in the wobble positions of tRNA(Asp), tRNA(Asn), tRNA(His) and tRNA(Tyr). These proteins contain the 4Fe-4S ferredoxins iron-sulphur binding domain.
