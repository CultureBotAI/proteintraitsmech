identifier: HAMAP:MF_02017
label: "Cytoskeleton protein RodZ [rodZ]"
definition: >-
  RodZ are cytoskeletal proteins that are involved in bacterial cell-shape control through regulation of the length of the long axis. They are transmembrane proteins, with a cytoplasmic N-terminal domain that includes a helix-turn-helix motif, and a large periplasmic C-terminal domain.
