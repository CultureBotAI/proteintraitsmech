identifier: HAMAP:MF_03043
label: "Queuine tRNA-ribosyltransferase accessory subunit 2 [QTRT2]"
definition: >-
  Queuine tRNA-ribosyltransferase accessory subunit 2 (Qtrt2 or QTRTD1) interacts with QTRT1 to form an active queuine tRNA-ribosyltransferase. It exchanges queuine for the guanine at the wobble position of tRNAs with GUN anticodons (tRNA-Asp, -Asn, -His and -Tyr), thereby forming the hypermodified nucleoside queuosine (Q) (7-(((4,5-cis-dihydroxy-2-cyclopenten-1-yl)amino)methyl)-7-deazaguanosine).
