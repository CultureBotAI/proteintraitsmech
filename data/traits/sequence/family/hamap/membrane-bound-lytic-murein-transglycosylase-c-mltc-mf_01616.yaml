identifier: HAMAP:MF_01616
label: "Membrane-bound lytic murein transglycosylase C [mltC]"
definition: >-
  Membrane-bound lytic murein transglycosylase C or murein hydrolase C is a murein-degrading enzyme that may play a role in the recycling of muropeptides during cell elongation and/or cell division.
