identifier: HAMAP:MF_00458
label: "Photosystem I P700 chlorophyll a apoprotein A1 [psaA]"
definition: >-
  This entry represents PsaA. Photosystem I is a membrane complex found in the chloroplasts of plants and cyanobacteria. It uses light energy to transfer electrons from plastocyanin to ferredoxin. The core proteins of photosystem I are PsaA and PsaB, homologous integral membrane proteins that form a heterodimer that binds the electron-donating chlorophyll dimer P700, as well as chlorophyll, phylloquinone, and 4FE-4S electron acceptors.
