identifier: HAMAP:MF_01653
label: "2,3-dihydroxyphenylpropionate/2,3-dihydroxicinnamic acid 1,2-dioxygenase [mhpB]"
definition: >-
  This entry represents 2,3-dihydroxyphenylpropionate/2,3-dihydroxicinnamic acid 1,2-dioxygenase. This enzyme catalyzes the non-heme iron(II)-dependent oxidative cleavage of 2,3-dihydroxyphenylpropionic acid and 2,3-dihydroxicinnamic acid into 2-hydroxy-6-ketononadienedioate and 2-hydroxy-6-ketononatrienedioate, respectively.
