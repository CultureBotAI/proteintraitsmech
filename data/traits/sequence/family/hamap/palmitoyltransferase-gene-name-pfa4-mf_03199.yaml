identifier: HAMAP:MF_03199
label: "Palmitoyltransferase <gene_name> [PFA4]"
definition: >-
  Palmitoyltransferase PFA4 mediates the reversible addition of palmitate to target proteins, allowing them to associate with membranes. Saccharomyces cerevisiae PFA4 has been shown to palmitoylate several amino acid permeases, and to palmitoylate chitin synthase CHS3, which is required for its proper export from the ER.
