identifier: HAMAP:MF_00078
label: "Phosphomevalonate dehydratase small subunit"
definition: >-
  This entry represents Phosphomevalonate dehydratase small subunit from Aeropyrum pernix (PMDh-S) and similar prokaryotic proteins. PMDh-S is a component of a hydro-lyase that catalyses the dehydration of mevalonate 5-phosphate (MVA5P) to form trans-anhydromevalonate 5-phosphate (tAHMP). It is involved in the archaeal mevalonate (MVA) pathway, which provides fundamental precursors for isoprenoid biosynthesis, such as isopentenyl diphosphate (IPP) and dimethylallyl diphosphate (DMAPP). Members of this family were previously annotated as aconitase X subunit 2, the swiveling domain subunit.
definition_source: "InterPro:IPR020794 abstract (HAMAP MF_00078 is a member signature)"
