identifier: HAMAP:MF_01228
label: "Methionine--tRNA ligase [metG]"
definition: >-
  Methionine-tRNA ligase (EC:6.1.1.10) is an alpha 2 dimer. In some species (archaea, eubacteria and eukaryotes) a coding sequence, similar to the C-terminal end of MetRS, is present as an independent gene which is a tRNA binding domain as a dimer. In eubacteria, MetRS can also be split in two sub-classes corresponding to the presence of one or two CXXC domains specific to zinc binding. The crystal structures of a number of methionine-tRNA ligases are known. This entry represents type 2 methionine-tRNA synthetase from eubacteria. Subfamily 2a links one zinc ion whereas subfamily 2b does not.
