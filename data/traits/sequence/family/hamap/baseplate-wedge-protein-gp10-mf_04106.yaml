identifier: HAMAP:MF_04106
label: "Baseplate wedge protein gp10"
definition: >-
  The members of this family are similar to gene product 10 (gp10) of bacteriophage T4. gp10 is a peripheral baseplate protein that is part of the tail fibre network. It functions as a molecular lever that rotates and extends the hinged short tail fibres to facilitate cell attachment.
