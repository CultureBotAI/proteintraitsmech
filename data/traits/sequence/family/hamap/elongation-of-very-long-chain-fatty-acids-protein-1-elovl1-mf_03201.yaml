identifier: HAMAP:MF_03201
label: "Elongation of very long chain fatty acids protein 1 [ELOVL1]"
definition: >-
  Elongation of very long chain fatty acids protein 1 (ELOVL1, very long chain fatty acid elongase 1) is a component of the the long-chain fatty acids elongation cycle. It is a transmembrane enzyme in the endoplasmic reticulum that catalyses the elongation of saturated and monounsaturated C22-C26-VLCFAs (very long-chain fatty acids). Mutations in this enzyme cause ichthyosis, acanthosis nigricans, hypomyelination, spastic paraplegia, high frequency deafness and optic atrophy.
