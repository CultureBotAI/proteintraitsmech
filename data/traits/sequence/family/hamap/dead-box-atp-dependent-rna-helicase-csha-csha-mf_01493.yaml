identifier: HAMAP:MF_01493
label: "DEAD-box ATP-dependent RNA helicase CshA [cshA]"
definition: >-
  DEAD-box ATP-dependent RNA helicase CshA is an enzyme that unwinds dsRNA in both 5'- and 3'-directions. It also has RNA-dependent ATPase activity and plays a role in ribosomal 50S subunit assembly.
