identifier: HAMAP:MF_00484
label: "Glycogen synthase [glgA]"
definition: >-
  This entry represents glycogen (GS) and starch synthases (SS) from bacteria and plants. GS and SS are involved in the elongation of the linear chains of glycogen and starch, respectively, by catalysing the transfer of the glucosyl moiety of the activated glucosyl donor (UDP-glucose or ADP-glucose, depending on the organism in question) to the nonreducing ends of a preexisting alpha(1 to 4) glucan primer.
