identifier: HAMAP:MF_01119
label: "UPF0294 protein YafD [yafD]"
definition: >-
  The proteins in this entry are functionally uncharacterised, but contain a single endonuclease/exonuclease/phosphatase domain. The family is represented by YafD, which has been reported to be similar to YadD, YjiP, YjiQ and YhgA,, though these are not found in this entry.
