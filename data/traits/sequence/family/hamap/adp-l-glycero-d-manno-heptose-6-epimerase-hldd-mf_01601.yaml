identifier: HAMAP:MF_01601
label: "ADP-L-glycero-D-manno-heptose-6-epimerase [hldD]"
definition: >-
  Lipopolysaccharides (LPS) are glycolipids that consitutes the outer monolayer of the outer membranes of most Gram-negative bacteria. They consist of lipid A (endotoxin) which anchors LPS to the outer membrane, a non-repeating core oligosachharide, and an immunogenic O-antigen repeat polymer, which is an oligosaccharide of 1-40 units that variesbetween different strains of bacteria. Although the O-antigen and most of the core domain are not necessary for growth in the lab, they appear to help bacteria resist environmental stresses including the complement system and antibiotics. This family consists of examples of ADP-L-glycero-D-mannoheptose-6-epimerase, an enzyme involved in biosynthesis of the inner core of LPS in Gram-negative bacteria. This enzyme is homologous to UDP-glucose 4-epimerase ( InterPro:IPR005886 ) and belongs to the NAD dependent epimerase/dehydratase family. It participates in the biosynthetic pathway leading to incorporation of heptose, a conserved sugar, into the core region of LPS, performing the NAD-dependent reaction shown below: ADP-D-glycero-D-manno-heptose = ADP-L-glycero-D-manno-heptose It is a homopentameric enzyme with each monomer composed of two domains: an N-terminal modified Rossman fold domain for NADP binding, and a C-terminal substrate binding domain. This subgroup has the canonical active site tetrad and NAD(P)-binding motif. Extended short-chain dehydrogenases/reductases (SDRs) are distinct from classical SDRs. In addition to the Rossmann fold (α/β folding pattern with a central β-sheet) core region typical of all SDRs, extended SDRs have a less conserved C-terminal extension of approximately 100 amino acids. Extended SDRs are a diverse collection of proteins, and include isomerases, epimerases, oxidoreductases, and lyases; they typ
