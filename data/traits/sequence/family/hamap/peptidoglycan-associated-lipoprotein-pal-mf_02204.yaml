identifier: HAMAP:MF_02204
label: "Peptidoglycan-associated lipoprotein [pal]"
definition: >-
  Peptidoglycan-associated lipoprotein (Pal or OprL) is part of the Tol-Pal system. The system appears to be involved both in the maintenance of outer membrane integrity and in outer membrane invagination during cell division. The Tol-Pal system is also required for polar localization of chemoreceptor clusters. Pal contains a hydrodrophobic lipoprotein signal sequence, a conserved N-terminal cleavage and modification site, a poorly conserved low-complexity region, together comprising about 65 amino acids, and a well-conserved C-terminal domain.
definition_source: "InterPro:IPR039001 abstract (HAMAP MF_02204 is a member signature)"
