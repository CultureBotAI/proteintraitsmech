identifier: HAMAP:MF_01882
label: "Propionate kinase [pduW]"
definition: >-
  PduW is a propionate kinase that is involved in the catabolism of both propionate and 1,2-propanediol during growth on these substrates. This protein restores growth to an eutQ deletion on ethanolamine and tetrathionate under anoxic conditions.
