identifier: HAMAP:MF_02238
label: "3-dehydroshikimate dehydratase"
definition: >-
  This entry represents a group of bacterial dehydratases, including QuiC1 from Pseudomonas putida. QuiC1 catalyses the conversion of 3-dehydroshikimate to protocatechuate (3,4-dihydroxybenzoate), a common intermediate of quinate and shikimate degradation pathways.
