identifier: HAMAP:MF_01930
label: "Phosphoribosylglycinamide formyltransferase [purN]"
definition: >-
  Phosphoribosylglycinamide formyltransferase, also known as GAR transformylase or GART, is an essential enzyme that catalyzes the third step in de novo purine biosynthesis. This enzyme uses formyl tetrahydrofolate as a formyl group donor to produce 5'-phosphoribosyl-N-formylglycinamide. In prokaryotes, GART is a single domain protein but in most eukaryotes GART (purN) resides in the C-terminal portion of a large multifunctional protein which also contains GAR synthetase (purD) and aminoimidazole ribonucleotide (AIR) synthetase (purM) activities.
