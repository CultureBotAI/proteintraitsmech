identifier: HAMAP:MF_01272
label: "Heme oxygenase (staphylobilin-producing) [isdG]"
definition: >-
  IsdG is a heme-degrading components of the Isd system in Gram-positive bacteria such as S. aureus. It may function as a heme-degrading monooxygenase. It allows pathogenic bacteria to utilise host heme as an iron source and enables the release of free iron through catalysis of oxidative degradation of the heme macrocyclic porphyrin ring in the presence of a suitable electron donor such as ascorbate or NADPH--cytochrome P450 reductase. It is important for protection of bacteria against heme-mediated toxicity.
