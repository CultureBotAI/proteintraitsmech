identifier: HAMAP:MF_00073
label: "Transcription antitermination protein NusB [nusB]"
definition: >-
  The NusB protein is involved in the regulation of rRNA biosynthesis by transcriptional antitermination. The antitermination proteins of Escherichia coli are recruited in the replication cycle of Bacteriophage lambda, where they play an important role in switching from the lysogenic to the lytic cycle. The solution structure indicates that the protein folds into an α/α-helical topology consisting of six helices; the arginine-rich N terminus appears to be disordered.
