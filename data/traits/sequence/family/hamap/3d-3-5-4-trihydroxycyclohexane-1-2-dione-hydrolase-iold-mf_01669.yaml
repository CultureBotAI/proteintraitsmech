identifier: HAMAP:MF_01669
label: "3D-(3,5/4)-trihydroxycyclohexane-1,2-dione hydrolase [iolD]"
definition: >-
  3D-(3,5/4)-trihydroxycyclohexane-1,2-dione hydrolase is involved in the cleavage of the C1-C2 bond of 3D-(3,5/4)-trihydroxycyclohexane-1,2-dione (THcHDO) to yield 5-deoxy-glucuronate (5DG). This entry consists of 3D-(3,5/4)-trihydroxycyclohexane-1,2-dione hydrolases from Gram-positive bacteria (Firmicutes).
