identifier: HAMAP:MF_01020
label: "Phosphoribosyl-ATP pyrophosphatase [hisE]"
definition: >-
  Phosphoribosyl-ATP pyrophosphatase, EC:3.6.1.31 catalyses the second step in the histidine biosynthetic pathway: 5-phosphoribosyl-ATP + H2O = 5-phosphoribosyl-AMP + PPi In E. coli, HisIE is encoded by the hisIE gene, which is formed by hisE gene fused to hisl. HisIE is a bifunctional enzyme responsible for the second and third steps of the histidine-biosynthesis pathway. Its N-terminal and C-terminal domains have phosphoribosyl-AMP cyclohydrolase (HisI) and phosphoribosyl-ATP pyrophosphohydrolase (HisE or PRATP-PH) activity, respectively. This family corresponds to the C-terminal domain of HisIE and includes many hisE gene encoding proteins, all of which show significant sequence similarity to Mycobacterium tuberculosis phosphoribosyl-ATP pyrophosphohydrolase (HisE or PRATP-PH). These proteins may be responsible for only the second step in the histidine-biosynthetic pathway, irreversibly hydrolyzing phosphoribosyl-ATP (PRATP) to phosphoribosyl-AMP (PRAMP) and pyrophosphate.
