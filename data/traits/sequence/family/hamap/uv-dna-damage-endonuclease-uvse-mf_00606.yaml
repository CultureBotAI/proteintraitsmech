identifier: HAMAP:MF_00606
label: "UV DNA damage endonuclease [uvsE]"
definition: >-
  Proteins in this entry are bacterial UV DNA damage endonucleases. They help the removal of UV-light damaged nucleotides. They can recognise pyrimidine dimers and cleave a phosphodiester bond immediately 5' to the lesion.
