identifier: HAMAP:MF_02125
label: "Ribosomal protein uL3 glutamine methyltransferase [prmB]"
definition: >-
  This entry represents Ribosomal protein uL3 glutamine methyltransferase from Escherichia coli (uL3 MTase) and similar sequences from proteobacteria. uL3 MTase, often annotated as PrmB, specifically methylates ribosomal protein uL3 on 'Gln-150'. It is closely related to HemK, the N(5)-glutamine methyltransferase for a critical residue in peptide release factors RF-1 and RF-2.
definition_source: "InterPro:IPR017127 abstract (HAMAP MF_02125 is a member signature)"
