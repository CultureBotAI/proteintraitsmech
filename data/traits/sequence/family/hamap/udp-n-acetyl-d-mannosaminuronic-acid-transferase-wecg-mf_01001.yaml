identifier: HAMAP:MF_01001
label: "UDP-N-acetyl-D-mannosaminuronic acid transferase [wecG]"
definition: >-
  This entry represents UDP-N-acetyl-D-mannosaminuronic acid transferases that belong to the glycosyltransferase 26 family. It has been proposed that these proteins catalyze the synthesis of Und-PP-GlcNAc-ManNAcA (Lipid II), the second lipid-linked intermediate involved in enterobacterial common antigen synthesis.
