identifier: HAMAP:MF_00125
label: "ATP phosphoribosyltransferase regulatory subunit [hisZ]"
definition: >-
  Proteins in this entry are mostly annotated as the ATP phosphoribosyltransferase regulatory subunit (HisZ). However, this entry also includes some histidine-tRNA ligases (HisS or HisRS), which is the paralogue of HisZ. Despite the significant sequential and structural similarity, HisRS and HisZ have different functions. HisRS is a class IIa aminoacyl-tRNA synthetase (ligase), while HisZ is a regulatory subunit of the hetero-octameric ATP phosphoribosyl transferase that regulate reactions initiating histidine biosynthesis.
definition_source: "InterPro:IPR004517 abstract (HAMAP MF_00125 is a member signature)"
