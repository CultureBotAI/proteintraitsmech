identifier: HAMAP:MF_01451
label: "ATP-dependent helicase/nuclease subunit A [addA]"
definition: >-
  AddAB, also called RexAB, substitutes for RecBCD in several bacterial lineages. These DNA recombination proteins act before synapse and are particularly important for DNA repair of double-stranded breaks by homologous recombination. The term AddAB is used broadly, with AddA homologues between the firmicutes and the alphaproteobacteria, while the partner AddB proteins show no strong homology across the two groups of species. The AddA/AddB heterodimer acts as both an ATP-dependent DNA helicase and an ATP-dependent, dual-direction single-stranded exonuclease. It recognises the chi site generating a DNA molecule suitable for the initiation of homologous recombination. This entry represents the ATP-dependent helicase/nuclease subunit A (AddA) which is required for chi fragment generation; this subunit has the helicase and 3' -> 5' nuclease activities.
definition_source: "InterPro:IPR014152 abstract (HAMAP MF_01451 is a member signature)"
