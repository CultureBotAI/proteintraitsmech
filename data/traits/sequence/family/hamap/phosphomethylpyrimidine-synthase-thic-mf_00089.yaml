identifier: HAMAP:MF_00089
label: "Phosphomethylpyrimidine synthase [thiC]"
definition: >-
  This entry includes phosphomethylpyrimidine synthases, including thiC from prokaryotes and AtTHIC from Arabidopsis. thiC is found within the thiamin biosynthesis operon and is involved in thiamin biosynthesis. ThiC catalyzes the synthesis of the hydroxymethylpyrimidine phosphate (HMP-P) moiety of thiamine from aminoimidazole ribotide (AIR) in a radical S-adenosyl-L-methionine (SAM)-dependent reaction. AtTHIC is involved in pyrimidine synthesis in the thiamine biosynthesis pathway of Arabidopsis. Heterologous expression of AtTHIC could functionally complement the thiC knock-out mutant of E. coli.
definition_source: "InterPro:IPR037509 abstract (HAMAP MF_00089 is a member signature)"
