identifier: HAMAP:MF_01647
label: "3-phenylpropionate-dihydrodiol/cinnamic acid-dihydrodiol dehydrogenase [hcaB]"
definition: >-
  The HcaB protein is a dehydrogenase which converts 3-phenylpropionate-dihydrodiol and cinnamic acid-dihydrodiol into 3-(2,3-dihydroxylphenyl)propanoic acid and 2,3-dihydroxicinnamic acid, respectively. This protein functions in the dioxygenolytic pathway for catabolism of phenylpropanoid compounds such as cinnamic acid and 3-phenylpropionic acid.
