identifier: HAMAP:MF_01668
label: "5-dehydro-2-deoxygluconokinase [iolC]"
definition: >-
  Bacterial 5-dehydro-2-deoxygluconokinase is responsible for catalysing the phosphorylation of 5-dehydro-2-deoxy-D-gluconate (2-deoxy-5-keto-D-gluconate or DKG) to 6-phospho-5-dehydro-2-deoxy-D-gluconate (DKGP), the fifth step in the inositol catabolic pathway. This entry consists of Gram-positive (Firmicutes) enzymes.
