identifier: HAMAP:MF_00615
label: "DNA-directed RNA polymerase subunit Rpo12 [rpo12]"
definition: >-
  This entry represents the archaeal RNA polymerase subunit P, also known as Rpo12 following the eukaryotic nomenclature. Archaeal subunit P is the homologue of eukaryotic subunit Rbp12. DNA-directed RNA polymerases, also known as DNA-dependent RNA polymerases, are responsible for the polymerisation of ribonucleotides into a sequence complementary to the template DNA. Eukaryotes have three different DNA-directed RNA polymerases (RNAPs), Pol I, II, and III, whereas Archaea and Bacteria have single enzymes. RNAPs are multisubunit enzymes. Archaeal RNAP is closely related to eukaryotic RNAP II, which consists of 12 subunits. Archaeal RNAP has an additional subunit, Rpo13, with no orthologue in the eukaryotic enzyme.
definition_source: "InterPro:IPR023464 abstract (HAMAP MF_00615 is a member signature)"
