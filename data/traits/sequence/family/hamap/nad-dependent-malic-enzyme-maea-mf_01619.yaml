identifier: HAMAP:MF_01619
label: "NAD-dependent malic enzyme [maeA]"
definition: >-
  Proteobacteria NAD-dependent malic enzymes use divalent metal cations as cofactor, with a preference for magnesium or manganese. They are non-competitively inhibited by high concentrations of NAD+ and L-malate, and activated by aspartate.
