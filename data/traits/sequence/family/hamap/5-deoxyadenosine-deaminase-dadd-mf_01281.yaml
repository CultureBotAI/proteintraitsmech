identifier: HAMAP:MF_01281
label: "5'-deoxyadenosine deaminase [dadD]"
definition: >-
  This protein family includes MtaD from Thermotoga maritima and a 5'-deoxyadenosine deaminase DadD from Methanocaldococcus jannaschii. MtaD protein has been shown to catalyse the deamination of 5-methylthioadenosine (MTA), S-adenosyl-L-homocysteine (SAH) and adenosine in vitro. DadD protein catalyses the deamination of 5'-deoxyadenosine into 5'-deoxyinosine and may play a role in recycling the radical S-adenosylmethionine enzyme reaction product 5'-deoxyadenosine. Conserved residues present in other members of this family strongly suggest that they have a similar function.
