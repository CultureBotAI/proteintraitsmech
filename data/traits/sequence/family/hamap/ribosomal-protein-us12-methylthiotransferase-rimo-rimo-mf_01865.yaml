identifier: HAMAP:MF_01865
label: "Ribosomal protein uS12 methylthiotransferase RimO [rimO]"
definition: >-
  In many bacterial species ribosmal protein uS12 is posttranslationally modified by the methylthiolation of the aspartate residue at position 88. The enzyme responsible for this modification is RimO, a radical S-adenoslymethionine protein.
