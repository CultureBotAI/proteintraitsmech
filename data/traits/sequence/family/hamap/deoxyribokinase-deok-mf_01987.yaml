identifier: HAMAP:MF_01987
label: "Deoxyribokinase [deoK]"
definition: >-
  This entry describes ribokinase enzyme. Ribokinase catalyses the first step in ribose catabolism. This phosphorylation of ribose to ribose-5-phosphate using ATP traps ribose within the cell after uptake and prepares the sugar for use in the synthesis of nucleotides and histidine, and for entry into the pentose phosphate pathway. The rbsK gene encoding ribokinase typically is found with ribose transport genes. This entry also includes bifunctional ribokinase/ribose-5-phosphate isomerase A from Lactobacillus sanfranciscensis and deoxyribokinases.
