identifier: HAMAP:MF_01699
label: "Pyrimidine monooxygenase RutA [rutA]"
definition: >-
  Pyrimidine monooxygenase RutA catalyzes the pyrimidine ring opening between N-3 and C-4 by an unusual flavin hydroperoxide-catalyzed mechanism to yield ureidoacrylate peracid. It cleaves pyrmidine rings directly by adding oxygen atoms, making a toxic ureidoacrylate peracid product which can be spontaneously reduced to ureidoacrylate.
