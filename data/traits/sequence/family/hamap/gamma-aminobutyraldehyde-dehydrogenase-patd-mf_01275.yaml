identifier: HAMAP:MF_01275
label: "Gamma-aminobutyraldehyde dehydrogenase [patD]"
definition: >-
  This entry represents gamma-aminobutyraldehyde dehydrogenase (PatD, EC:1.2.1.19) involved in the second step in one of two pathways for putrescine degradation. It catalyzes the oxidation 4-aminobutanal (gamma-aminobutyraldehyde) to 4-aminobutanoate (gamma-aminobutyrate or GABA). It also functions as a 5-aminopentanal dehydrogenase in a a L-lysine degradation pathway to succinate that proceeds via cadaverine, glutarate and L-2-hydroxyglutarate. It can also oxidize n-alkyl medium-chain aldehydes, but with a lower catalytic efficiency.
definition_source: "InterPro:IPR017749 abstract (HAMAP MF_01275 is a member signature)"
