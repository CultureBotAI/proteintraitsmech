identifier: HAMAP:MF_00712
label: "Probable glycine dehydrogenase (decarboxylating) subunit 1 [gcvPA]"
definition: >-
  This entry represents the probable glycine dehydrogenase (decarboxylating) subunit 1 from prokaryotes. The subunit composition of glycine cleavage system P-proteins have been classified into two types. Those from eukaryotes and some of the P-proteins from prokaryotes (e.g. Escherichia coli) are in the homodimeric form. The rest of those from prokaryotes are heterotetrameric, with two different subunits which, based on sequence similarities, correspond respectively to the N and C-terminal halves of the eukariotic-subunit.
definition_source: "InterPro:IPR023010 abstract (HAMAP MF_00712 is a member signature)"
