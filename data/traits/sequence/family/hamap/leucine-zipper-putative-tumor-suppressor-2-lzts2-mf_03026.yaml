identifier: HAMAP:MF_03026
label: "Leucine zipper putative tumor suppressor 2 [LZTS2]"
definition: >-
  Leucine zipper putative tumor suppressor 2 (LZTS2, also known as LAPSER1) interacts with p80 katanin and regulates katanin-mediated microtubule severing. It is localised to the centrosome and the midbody in mitotic cells. During prophase, LAPSER1/LZTS2 inhibits centrosomal gamma-tubulin accumulation, which results in retardation of mitotic entry. During interphase, LAPSER1/LZTS2 inhibits katanin, which results in prevention of cell motility. LAPSER1/LZTS2 also modulates beta-catenin signaling and localisation.
definition_source: "InterPro:IPR028597 abstract (HAMAP MF_03026 is a member signature)"
