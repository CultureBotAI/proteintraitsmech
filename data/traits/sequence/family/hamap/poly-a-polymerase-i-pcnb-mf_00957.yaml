identifier: HAMAP:MF_00957
label: "Poly(A) polymerase I [pcnB]"
definition: >-
  This entry describes poly(A) polymerase I (also known as PcnB and plasmid copy number protein). These enzymes sequentially add adenosine nucleotides to the 3' end of RNAs, targeting them for degradation by the cell. This was originally described for anti-sense RNAs, but was later demonstrated for mRNAs as well. Members of this family are predominantly found in the gamma- and beta-proteobacteria, with putative members in the Chlamydiacae and Spirochetes. This family has homology to tRNA nucleotidyltransferase.
