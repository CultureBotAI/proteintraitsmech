identifier: HAMAP:MF_00429
label: "Na(+)-translocating NADH-quinone reductase subunit E [nqrE]"
definition: >-
  This entry represents the Na(+)-translocating E subunit from NADH:ubiquinone oxidoreductase. NADH can be oxidized by the respiratory chain of bacteria via NADH:quinone oxidoreductases that belong to three distinct enzyme families: NDH-1, NDH-2, and NQR. The NQR-type enzymes are sodium-motive NADH:quinone oxidoreductases consisting of six subunits (NqrA-F) and several cofactors: FAD, 2 FMN, a 2Fe-2S cluster and riboflavin. The NADH:quinone oxidoreductase activity of these enzymes is stimulated by sodium ions and is coupled with pumping of Na+ but not H+. Subunits NqrA, NqrC and NqrF represent the three major subunits of the NQR complex, which are alpha, gamma and beta, respectively. Subunits NqrB, NqrD and NqrE are very hydrophobic polypeptides that were found to co-localise with the alpha subunit.
