identifier: HAMAP:MF_01525
label: "Carnitine operon protein CaiE [caiE]"
definition: >-
  The function of the CaiE protein is not known, but overexpression has been shown to stimulate the activity of CaiB and CaiD proteins. Many enterobacteria are able to convert carnitine, via crotonobetaine, to gamma-butyrobetaine in the presence of carbon and nitrogen sources under anaerobic conditions. In Escherichia coli the enzymes involved in this pathway are encoded by the caiTABCDE operon. The adjacent but divergent fixABCD operon also appears to be necessary for carnintine meatbolism. The Fix proteins are homologous to proteins found in known electron transport pathways.
