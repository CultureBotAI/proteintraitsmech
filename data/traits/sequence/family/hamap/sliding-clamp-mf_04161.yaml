identifier: HAMAP:MF_04161
label: "Sliding clamp"
definition: >-
  This family includes sliding clamp protein from Bacteriophage T4 (also known as gp45), which encircles the genomic DNA and links the DNA polymerase to the template to control the processivity of DNA synthesis. It is responsible for tethering the catalytic subunit of DNA polymerase to DNA during high-speed replication. The interaction with the sliding-clamp-loader opens the sliding clamp so that it can be loaded around the DNA template. During transcription, encircles the DNA and tethers host RNA polymerase (RNAP) to it.
definition_source: "InterPro:IPR046389 abstract (HAMAP MF_04161 is a member signature)"
