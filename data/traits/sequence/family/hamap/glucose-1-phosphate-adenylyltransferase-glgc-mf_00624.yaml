identifier: HAMAP:MF_00624
label: "Glucose-1-phosphate adenylyltransferase [glgC]"
definition: >-
  This entry represent glucose-1-phosphate adenylyltransferase, also called ADP-glucose pyrophosphorylase. In bacteria, both homomeric forms of GlgC and more active heterodimers of GlgC and GlgD have been described. This entry describes the GlgC subunit only.
