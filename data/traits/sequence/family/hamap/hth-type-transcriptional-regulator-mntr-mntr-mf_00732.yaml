identifier: HAMAP:MF_00732
label: "HTH-type transcriptional regulator MntR [mntR]"
definition: >-
  This entry contains the Bacillus subtilis YqhN (MntR), which encodes a metalloregulatory protein distantly related to the Corynebacterium diphtheriae diphtheria toxin repressor (DtxR). While DtxR mediates the iron-dependent repression of iron uptake, MntR encodes a manganese modulated regulator of manganese transport. MntR is the central regulator of manganese homeostasis. In the presence of manganese, it mediates repression of the manganese transporter MntH and under low manganese conditions, it activates the transcription of the mntABCD operon.
definition_source: "InterPro:IPR022897 abstract (HAMAP MF_00732 is a member signature)"
