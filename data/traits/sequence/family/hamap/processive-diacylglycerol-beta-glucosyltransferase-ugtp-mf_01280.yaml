identifier: HAMAP:MF_01280
label: "Processive diacylglycerol beta-glucosyltransferase [ugtP]"
definition: >-
  This entry represents a family of bacterial processive diacylglycerol glucosyltransferases. This enzyme is involved in the synthesis of bilayer and non-bilayer-forming membrane biolipids. It successively transfers up to three glycosyl residues to diacylglycerol, forming mono-, di- and triglycosyldiacylglycerol. Diglycosyldiacylglycerol is the predominant glycolipid found in Bacillales.
