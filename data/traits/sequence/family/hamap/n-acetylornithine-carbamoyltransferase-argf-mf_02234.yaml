identifier: HAMAP:MF_02234
label: "N-acetylornithine carbamoyltransferase [argF']"
definition: >-
  This entry represents a group of N-acetylornithine carbamoyltransferases mainly from Proteobacteria, including ArgF' from Xanthomonas campestris pv. campestris. ArgF' is invovled in an alternative arginine biosynthesis pathway. It catalyses the transfer of the carbamoyl group from carbamoyl phosphate to the δ-amino group of N2-acetyl-L-ornithine to produce N2-acetyl-L-citrulline.
definition_source: "InterPro:IPR043695 abstract (HAMAP MF_02234 is a member signature)"
