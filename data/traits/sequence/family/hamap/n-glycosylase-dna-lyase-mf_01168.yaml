identifier: HAMAP:MF_01168
label: "N-glycosylase/DNA lyase"
definition: >-
  Oxidative damage represents a major threat to genomic stability, as the major product of DNA oxidation, 8-oxoguanine (GO), frequently mispairs with adenine during replication. In order to prevent these mutagenic events, organisms have evolved GO-DNA glycosylases (or N-glycosylase/DNA lyases) that remove this oxidized base from DNA. GO is removed from DNA predominantly by the base excision repair (BER) pathway. This process is initiated by 8-oxoguanine-DNA glycosylases, which cleave the N-glycosidic bond between the aberrant base and the sugar-phosphate backbone to generate an apurinic (AP) site. Some DNA glycosylases possess also an intrinsic AP lyase activity, which cleaves the phosphodiester bond 3' from the AP site by beta- or beta, delta-elimination, leaving a 3'-terminal unsaturated sugar and a product with a terminal 5'-phosphate. This group represents archaeal GO-DNA glycosylases (AGOG). Pyrobaculum aerophilum PAE2237 has been shown to remove GO from single- and double-stranded substrates with great efficiency. It has both GO-DNA glycosylase and AP-lyase ( EC:4.2.99.18 ) activities. Archaeal GO-DNA glycosylases are not closely related to other DNA glycosylases. However, they share with the other HhH-GPD DNA glycosylase families the overall fold and the general active site architecture. AGOG possesses the principal hallmark of GO-DNA glycosylases: a helix-hairpin-helix motif and a glycine/proline-rich sequence followed by an absolutely conserved aspartate (HhH-GPD motif). It contains two α-helical subdomains, with the 8-oxoguanine binding site located in a cleft at their interface. AGOG belongs to a new class within the helix-hairpin-helix (HhH) superfamily of DNA repair enzymes. Its hairpin structure differs substantially from that of other proteins containing an
