identifier: HAMAP:MF_00472
label: "Ubiquinone biosynthesis O-methyltransferase [ubiG]"
definition: >-
  This entry represents an O-methyltransferase, which is believed to act at two points in the ubiquinone biosynthetic pathway in bacteria (UbiG) and mitochondria (COQ3). A separate methylase (MenG/UbiE) catalyses the single C-methylation step. The most commonly used names for genes in this family do not indicate whether this gene is an O-methyl, or C-methyl transferase.
