identifier: HAMAP:MF_00920
label: "Signal recognition particle receptor FtsY [ftsY]"
definition: >-
  FtsY is involved in targeting and insertion of nascent membrane proteins into the cytoplasmic membrane. It acts as a receptor for the complex formed by the signal recognition particle (SRP) and the ribosome-nascent chain (RNC). In E. coli, interaction with SRP-RNC leads to the transfer of the RNC complex to the Sec translocase for insertion into the membrane, the hydrolysis of GTP by both Ffh and FtsY, and the dissociation of the SRP-FtsY complex into the individual components.
