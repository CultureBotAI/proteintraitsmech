identifier: HAMAP:MF_02217
label: "tRNA 5-hydroxyuridine methyltransferase [trmR]"
definition: >-
  This entry includes tRNA 5-hydroxyuridine methyltransferase from bacteria, including TrmR from Bacillus subtilis. TrmR catalyses the methylation of 5-hydroxyuridine (ho5U) to form 5-methoxyuridine (mo5U) at position 34 in tRNAs.
