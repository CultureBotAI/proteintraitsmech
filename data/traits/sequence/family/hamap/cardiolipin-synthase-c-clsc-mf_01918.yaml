identifier: HAMAP:MF_01918
label: "Cardiolipin synthase C [clsC]"
definition: >-
  Cardiolipin (CL) synthases catalyse the reversible phosphatidyl group transfer from one phosphatidylglycerol molecule to another to form cardiolipin (diphosphatidylglycerol) and glycerol. In E. coli, three genes encoding CLs have been identified as clsA/B/C. This entry includes ClsC protein (also known as ymdC) from E. coli and other Enterobacteriaceae.
