identifier: HAMAP:MF_04031
label: "Deoxyuridine 5'-triphosphate nucleotidohydrolase [DUT]"
definition: >-
  This family of Herpesviridae deoxyuridine 5-triphosphate nucleotidohydrolases produces dUMP from dUTP, decreasing the intracellular concentration of dUTP to help avoid uracil incorporation into viral DNA.
