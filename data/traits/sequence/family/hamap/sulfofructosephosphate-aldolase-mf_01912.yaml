identifier: HAMAP:MF_01912
label: "Sulfofructosephosphate aldolase"
definition: >-
  This entry represents sulfofructosephosphate aldolase from Enterobacteriaceae. It cleaves 6-deoxy-6-sulfo-D-fructose 1-phosphate (SFP) to form dihydroxyacetone phosphate (DHAP) and 3-sulfolactaldehyde (SLA).
