identifier: HAMAP:MF_00805
label: "Citrate lyase acyl carrier protein [citD]"
definition: >-
  This group of sequences represent the acyl carrier protein (gamma subunit) of the holoenzyme citrate lyase (EC:4.1.3.6) composed of alpha (EC:2.8.3.10), beta (EC:4.1.3.34), and acyl carrier protein subunits in a stoichiometric relationship of 6:6:6. Citrate lyase is an enzyme which converts citrate to oxaloacetate. In bacteria, this reaction is involved in citrate fermentation. The acyl carrier protein covalently binds the coenzyme of citrate lyase. The set contains an experimentally characterised member from Leuconostoc mesenteroides. The sequences come from a wide range of Gram-positive bacteria. For Gram-negative bacteria, it appears that only sequences from the gamma proteobacteria are included.
