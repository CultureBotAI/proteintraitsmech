identifier: HAMAP:MF_04120
label: "Portal protein"
definition: >-
  Most bacterial viruses need the tail complex to inject their genomes inside the bacterial cytoplasm without disrupting the cellular integrity. The portal protein is part of the tail complex. BacteriophageT7 portal protein, also known as Gp8, serves as a connector in the tail complex.
