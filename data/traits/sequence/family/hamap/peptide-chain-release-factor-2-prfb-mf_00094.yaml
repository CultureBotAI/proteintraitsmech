identifier: HAMAP:MF_00094
label: "Peptide chain release factor 2 [prfB]"
definition: >-
  Peptide chain release factors (RFs) are required for the termination of protein biosynthesis. At present two classes of RFs can be distinguished. Class I RFs bind to ribosomes that have encountered a stop codon at their decoding site and induce release of the nascent polypeptide. Class II RFs are GTP-binding proteins that interact with class I RFs and enhance class I RF activity. In prokaryotes there are two class I RFs that act in a codon specific manner: RF-1 (gene prfA) mediates UAA and UAG-dependent termination while RF-2 (gene prfB), which is represented by this entry, mediates UAA and UGA-dependent termination. RF-1 and RF-2 are structurally and evolutionary related proteins which have been shown to be part of a larger family. This entry represents peptide chain release factor 2 (PrfB, RF-2). It also includes chloroplastic release factor PrfB, which is required for the proper translation and stability of UGA-containing transcripts in chloroplasts.
