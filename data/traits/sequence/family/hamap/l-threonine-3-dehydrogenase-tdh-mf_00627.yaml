identifier: HAMAP:MF_00627
label: "L-threonine 3-dehydrogenase [tdh]"
definition: >-
  L-threonine 3-dehydrogenase is a tetrameric, zinc-binding, NAD-dependent enzyme involved in threonine catabolism. It catalyses the conversion of L-threonine and NAD(+) to L-2-amino-3-oxobutanoate and NADH. In Escherichia coli His-90 modulates substrate specificity and is believed to be part of the active site. Closely related proteins include sorbitol dehydrogenase, xylitol dehydrogenase, and benzyl alcohol dehydrogenase. Eukaryotic examples of this enzyme have been demonstrated experimentally but are not detected by this entry.
