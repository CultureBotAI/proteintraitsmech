identifier: HAMAP:MF_02237
label: "tRNA (cytosine(72)-C(5))-methyltransferase"
definition: >-
  This entry represents a group of archaeal methyltransferases, including PH1991 from Pyrococcus horikoshii. PH1991 is a S-adenosyl-L-methionine-dependent methyltransferase that specifically methylates the C5 position of cytosine 72 in several tRNAs.
