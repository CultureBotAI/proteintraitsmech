identifier: HAMAP:MF_01381
label: "Endo-type membrane-bound lytic murein transglycosylase A [emtA]"
definition: >-
  This murein-degrading enzyme may play a role in the recycling of muropeptides during cell elongation and/or cell division. It catalsyses the endolytic cleavage of the (1->4)-beta-glycosidic linkage between N-acetylmuramic acid (MurNAc) and N-acetylglucosamine (GlcNAc) residues in peptidoglycan with concomitant formation of a 1,6-anhydrobond in the MurNAc residue. Enzymatic cleavage activity occurs preferentially at a distance of more than two disaccharide units from the ends of the glycan chain. The enzyme is also called peptidoglycan lytic endotransglycosylase and belongs to the transglycosylase slt family.
definition_source: "InterPro:IPR023946 abstract (HAMAP MF_01381 is a member signature)"
