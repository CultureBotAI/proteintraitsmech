identifier: HAMAP:MF_00931
label: "Aldehyde decarbonylase"
definition: >-
  This cyanobacterial family of fatty aldehyde decarbonylases acts on mainly C16 and C18 substrates to form hydrocarbons and carbon monoxide. Note that the corresponding EC number (EC:4.1.99.5) dating from 1989 refers to a nonorthologous Pisum sativum enzyme that acts on C18 and longer chains and attaches the overly narrow narrow name octadecanal decarbonylase.
