identifier: HAMAP:MF_00687
label: "4-deoxy-L-threo-5-hexosulose-uronate ketol-isomerase [kduI]"
definition: >-
  This family of bacterial proteins have been characterised as 4-deoxy-L-threo-5-hexosulose-uronate ketol-isomerase. It is coded for by kdul and is involved in the fourth step in pectin degradation. 4-deoxy-L-threo-5-hexosulose uronate = 3-deoxy-D-glycero-2,5-hexodiulosonate Although this enzyme is found in Escherichia coli, its role is uncertain since E. coli is not known to degrade the polysaccharides which are potential sources of 5-keto-4-deoxyuronate.
