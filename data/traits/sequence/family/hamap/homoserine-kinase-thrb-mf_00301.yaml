identifier: HAMAP:MF_00301
label: "Homoserine kinase [thrB]"
definition: >-
  This family is composed of unusual homoserine kinases, from a subset of bacteria, which have a protein kinase fold. These proteins do not bear any similarity to the GHMP family homoserine kinases (see InterPro:IPR000870 ) present in most bacteria and eukaryotes. Homoserine kinase catalyzes the transfer of the gamma-phosphoryl group from ATP to L-homoserine producing L-homoserine phosphate, an intermediate in the production of the amino acids threonine, methionine, and isoleucine. The Type II homoserine kinase subfamily is part of a larger superfamily that includes the catalytic domains of other kinases, such as the typical serine/threonine/tyrosine protein kinases (PKs), RIO kinases, actin-fragmin kinase (AFK), and phosphoinositide 3-kinase (PI3K).
definition_source: "InterPro:IPR005280 abstract (HAMAP MF_00301 is a member signature)"
