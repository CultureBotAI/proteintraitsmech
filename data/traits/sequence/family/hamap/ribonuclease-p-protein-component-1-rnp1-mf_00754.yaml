identifier: HAMAP:MF_00754
label: "Ribonuclease P protein component 1 [rnp1]"
definition: >-
  This entry represents RNP1 from archaea and its homologues from eukaryotes. Ribonuclease P (Rnp) is a ubiquitous ribozyme that catalyzes a Mg2 -dependent hydrolysis to remove the 5'-leader sequence of precursor tRNA (pre-tRNA) in all three domains of life. In bacteria, the catalytic RNA (typically ~120kDa) is aided by a small protein cofactor (~14kDa). Archaeal and eukaryote RNase P consist of a single RNA and archaeal RNase P has four or five proteins, while eukaryotic RNase P consists of 9 or 10 proteins. Eukaryotic and archaeal RNase P RNAs cooperatively function with protein subunits in catalysis.
definition_source: "InterPro:IPR023538 abstract (HAMAP MF_00754 is a member signature)"
