identifier: HAMAP:MF_01208
label: "Orotate phosphoribosyltransferase [pyrE]"
definition: >-
  Orotate phosphoribosyltransferase (OPRTase) is involved in the biosynthesis of pyrimidine nucleotides. In the pyrimidine synthesis pathway, OPRT catalyses the reversible phosphoribosyl transfer from 5'-phospho-alpha-D-ribose 1'-diphosphate (PRPP) to orotic acid (OA), forming pyrophosphate and orotidine 5'-monophosphate (OMP). The structures and properties of the OPRTases from different species have been described in several publications.
