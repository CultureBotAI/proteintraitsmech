identifier: HAMAP:MF_01080
label: "tRNA pseudouridine synthase B [truB]"
definition: >-
  This family represents TruB proteins found in the three domains of life which includes bacterial TruB, TruB1 from mammals and PUS4 from yeast. TruB is responsible for the pseudouridine residue present in the T loops of virtually all tRNAs. TruB recognises the preformed 3D structure of the T loop primarily through shape complementarity. It accesses its substrate uridyl residue by flipping out the nucleotide and disrupts the tertiary structure of tRNA. Saccharomyces cerevisiae tRNA pseudouridine synthase 4 (PUS4, also known as YNL292w), is the pseudouridine 55 synthase of both cytosolic and mitochondrial compartments, active at no other position on tRNA and the only enzyme active at that position in the species. It also catalyses the pseudouridylation of mRNAs with the consensus sequence 5'-GGUUCRA-3'. A distinct yeast protein centromere/microtubule-binding protein CBF5 (also known as YLR175w), is an rRNA pseudouridine synthase, and the archaeal set is much more similar to CBF5 than to PUS4 (see InterPro:IPR004802). It is unclear whether the archaeal proteins found by this model are tRNA pseudouridine 55 synthases like TruB, rRNA pseudouridine synthases like CBF5, or (as suggested by the absence of paralogs in the Archaea) both. CBF5 likely has additional, eukaryotic-specific functions. Pseudouridine synthases catalyse the isomerisation of uridine to pseudouridine (Psi) in a variety of RNA molecules, and may function as RNA chaperones. Pseudouridine is the most abundant modified nucleotide found in all cellular RNAs. There are four distinct families of pseudouridine synthases that share no global sequence similarity, but which do share the same fold of their catalytic domain(s) and uracil-binding site and are descended from a common molecular ancestor. The catalytic domai
