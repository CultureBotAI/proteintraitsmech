identifier: HAMAP:MF_00904
label: "Modulator protein MzrA [mzrA]"
definition: >-
  MzrA modulates the activity of the EnvZ/OmpR two-component regulatory system, probably by directly modulating EnvZ enzymatic activity and increasing stability of phosphorylated OmpR. EnvZ/OmpR mediates regulation of OmpF and OmpC, the two major pore-forming outer membrane proteins (OMPs).
