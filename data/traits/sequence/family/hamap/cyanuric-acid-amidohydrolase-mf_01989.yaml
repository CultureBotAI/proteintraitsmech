identifier: HAMAP:MF_01989
label: "Cyanuric acid amidohydrolase"
definition: >-
  Cyanuric acid hydrolases (AtzD) and barbiturases are homologous and found almost exclusively in bacteria. AtzD hydrolyses cyanuric acid to release carboxybiuret, which spontaneously decarboxylates to biuret. Barbiturase catalyses the ring-opening of barbituric acid to ureidomalonic acid. Although the AtzD/barbiturase family have previously been suggested to belong to the amidohydrolase superfamily, bioinformatics analysis and the lack of bound metals imply that this might not be the case.
