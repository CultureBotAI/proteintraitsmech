identifier: HAMAP:MF_01638
label: "Pyridoxine/pyridoxal/pyridoxamine kinase [pdxK]"
definition: >-
  This entry represents pyridoxal kinase PdxK (EC:2.7.1.35), which acts as a pyridoxine (PN)/ pyridoxal (PL)/ pyridoxamine (PM) kinase. PdxK is required for the synthesis of pyridoxal-5-phosphate from vitamin B6. Its structure has been revealed. Pyridoxal phosphate is the active form of vitamin B6 (pyridoxine or pyridoxal). Pyridoxal 5'-phosphate (PLP) is a versatile catalyst, acting as a coenzyme in a multitude of reactions, including decarboxylation, deamination and transamination. PLP-dependent enzymes are primarily involved in the biosynthesis of amino acids and amino acid-derived metabolites, but they are also found in the biosynthetic pathways of amino sugars and in the synthesis or catabolism of neurotransmitters; pyridoxal phosphate can also inhibit DNA polymerases and several steroid receptors. Inadequate levels of pyridoxal phosphate in the brain can cause neurological dysfunction, particularly epilepsy. PLP enzymes exist in their resting state as a Schiff base, the aldehyde group of PLP forming a linkage with the ε-amino group of an active site lysine residue on the enzyme. The α-amino group of the substrate displaces the lysine ε-amino group, in the process forming a new aldimine with the substrate. This aldimine is the common central intermediate for all PLP-catalysed reactions, enzymatic and non-enzymatic.
