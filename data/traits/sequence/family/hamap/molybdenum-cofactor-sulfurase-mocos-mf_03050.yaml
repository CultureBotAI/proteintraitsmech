identifier: HAMAP:MF_03050
label: "Molybdenum cofactor sulfurase [MOCOS]"
definition: >-
  Molybdenum cofactor sulfurase sulfurates the molybdenum cofactor (MoCo). Sulfation of molybdenum is essential for xanthine dehydrogenase (XDH) and aldehyde oxidase (ADO) enzymes in which molybdenum cofactor is liganded by one oxygen and one sulfur atom in active form. This entry also includes its plant homologue, LOS5/ABA3. In plants, the sulfurylated MoCo is a cofactor of ABA-aldehyde oxidase that functions in the last step of ABA biosynthesis.
definition_source: "InterPro:IPR028886 abstract (HAMAP MF_03050 is a member signature)"
