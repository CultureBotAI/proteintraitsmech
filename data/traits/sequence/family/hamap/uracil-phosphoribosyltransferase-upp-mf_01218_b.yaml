identifier: HAMAP:MF_01218_B
label: "Uracil phosphoribosyltransferase [upp]"
definition: >-
  The enzyme uracil phosphoribosyltransferase (UPRT, EC:2.4.2.9 ) catalyzes conversion of uracil to uridine 5'-monophosphate utilizing 5'-phosphoribosyl--1-pyrophosphate (PRPP). UMP + diphosphate = uracil + 5-phospho-alpha-D-ribose 1-diphosphate This entry contains uracil phosphoribosyltransferase mainly from bacteria.
