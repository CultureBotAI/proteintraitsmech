identifier: HAMAP:MF_00389
label: "Protein TusC [tusC]"
definition: >-
  This entry includes TusC protein. The three proteins TusB, TusC, and TusD form a heterohexamer responsible for a sulphur relay reaction. In large numbers of proteobacterial species, this complex acts on a Cys-derived persulphide moiety, delivered by the cysteine desulphurase IscS to TusA, then to TusBCD. The activated sulphur group is then transferred to TusE (DsrC), then by MnmA (TrmU) for modification of an anticodon nucleotide in tRNAs for Glu, Lys, and Gln.
definition_source: "InterPro:IPR037450 abstract (HAMAP MF_00389 is a member signature)"
