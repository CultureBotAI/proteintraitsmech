identifier: HAMAP:MF_00559
label: "Glyceraldehyde-3-phosphate dehydrogenase [gap]"
definition: >-
  This family describes the type II glyceraldehyde-3-phosphate dehydrogenases. These enzymes catalyse the interconversion of 1,3-diphosphoglycerate and glyceraldehyde-3-phosphate, a central step in glycolysis and gluconeogenesis. In archaea, either NAD or NADP may be utilised as the cofactor.
