identifier: HAMAP:MF_02013
label: "Cell division protein ZapA [zapA]"
definition: >-
  This entry represents the cell division protein ZapA. ZapA interacts with FtsZ, where FtsZ is part of a mid-cell cytokinetic structure termed the Z-ring that recruits a hierarchy of fission related proteins early in the bacterial cell cycle. ZapA drives the polymerisation and filament bundling of FtsZ, thereby contributing to the spatio-temporal tuning of the Z-ring. ZapA is recruited early at mid-cell but it is not essential for cell division. In sporulating cells, ZapA localizes near the cell poles. The proteins in this entry belongs to the ZapA Type 2 subfamily.
definition_source: "InterPro:IPR023688 abstract (HAMAP MF_02013 is a member signature)"
