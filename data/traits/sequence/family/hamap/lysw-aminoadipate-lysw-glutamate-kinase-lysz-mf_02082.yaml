identifier: HAMAP:MF_02082
label: "[LysW]-aminoadipate/[LysW]-glutamate kinase [lysZ]"
definition: >-
  LysZ has substantial amino acid sequence identity to E. coli N-acetylglutamate kinase ArgB, an enzyme in the biosynthetic pathway from glutamate to arginine. LysZ from Sulfolobus catalyzes both the phosphorylation of LysW-bound precursors AAA (alpha-aminoadipate) and glutamate, indicating that it functions in the biosynthesis of both lysine and arginine. On the other hand, Thermus thermophilus LysZ catalyzes the phosphorylation of LysW-gamma-alpha-aminoadipate exclusively, and does not phosphorylate N-acetyl-glutamate.
definition_source: "InterPro:IPR037529 abstract (HAMAP MF_02082 is a member signature)"
