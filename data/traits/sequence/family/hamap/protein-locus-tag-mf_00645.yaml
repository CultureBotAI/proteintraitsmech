identifier: HAMAP:MF_00645
label: "Protein <locus_tag>"
definition: >-
  This entry contains a group of prokaryotic proteins that share protein sequence similarity to eukaryotic Nuclear protein AMMECR1, including Protein PH0010 from Pyrococcus horikoshii. PH0010 consists of two distinct domains of different sizes: the large domain, which contains both the N- and C-terminal regions, consists of five α-helices and five β-strands that form an antiparallel β-sheet; the small domain consists of four α-helices and three β-strands that also form an antiparallel β-sheet [, InterPro:IPR023473].
definition_source: "InterPro:IPR023472 abstract (HAMAP MF_00645 is a member signature)"
