identifier: HAMAP:MF_00020
label: "Acetate kinase [ackA]"
definition: >-
  This entry represents proteins which transfer phosphate from ATP to a short chain aliphatic acid. For example, Acetate kinase catalyses the reaction ATP + acetate = ADP + acetyl phosphate and propionate kinase which utilizes propionate as substrate.
