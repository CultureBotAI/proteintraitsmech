identifier: HAMAP:MF_01644
label: "D-phenylhydantoinase [hyuA]"
definition: >-
  D-phenylhydantoinase catalyses the stereospecific hydrolysis of the cyclic amide bond of D-hydantoin derivatives with an aromatic side chains at the 5'-position. It has no activity on dihydropyrimidines. The physiological function of this enzyme is unknown.
