identifier: HAMAP:MF_01643
label: "Formate-dependent phosphoribosylglycinamide formyltransferase [purT]"
definition: >-
  The formation of isocyanate, a precursor of adenylate and guanylate, from 5-phosphoribosyl 1-pyrophosphate in the de novo purine biosynthesis pathway is basically composed of 10 steps of reactions. Formate-dependent phosphoribosylglycinamide formyltransferase (PurT, also known as phosphoribosylglycinamide formyltransferase 2) belongs to the ATP-grasp superfamily of enzymes and catalyses the third step in the de novo purine biosynthesis pathway, the formylation of glycinamide ribonucleotide that requires Mg2, ATP and formate.
