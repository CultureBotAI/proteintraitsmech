identifier: HAMAP:MF_01627
label: "Purine nucleoside phosphorylase DeoD-type [deoD]"
definition: >-
  Purine nucleoside phosphorylase, also called inosine phosphorylase (pnp), catalyses the cleavage of the glycosidic bond of ribo- and deoxyribonucleosides in the presence of orthophospate. It is specific for guanosine, inosine and adenosine and cleavage results in formation of their respective bases and ribose phosphate molecules. Together with adenosine deanimase,, purine nucleoside phophorylase is responsible for purine catabolism as part of the salvage pathway of nucleotides and nucleosides.
