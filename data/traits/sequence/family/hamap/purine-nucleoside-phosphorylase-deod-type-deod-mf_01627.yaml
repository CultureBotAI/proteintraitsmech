identifier: HAMAP:MF_01627
label: "Purine nucleoside phosphorylase DeoD-type [deoD]"
definition: >-
  Purine nucleoside phosphorylase EC:2.4.2.1, also called inosine phosphorylase (pnp), catalyses the cleavage of the glycosidic bond of ribo- and deoxyribonucleosides in the presence of orthophospate. It is specific for guanosine, inosine and adenosine and cleavage results in formation of their respective bases and ribose phosphate molecules. Together with adenosine deanimase, InterPro:IPR006330, purine nucleoside phophorylase is responsible for purine catabolism as part of the salvage pathway of nucleotides and nucleosides.
definition_source: "InterPro:IPR004402 abstract (HAMAP MF_01627 is a member signature)"
