identifier: HAMAP:MF_02043
label: "tRNA-dihydrouridine(16) synthase [dusC]"
definition: >-
  Dihydrouridine (D) is a highly conserved modified base found in tRNAs from all domains of life. D is formed by reduction of the carbon-carbon double bond at positions 5 and 6 of the uridine base by dihydrouridine synthases (Dus), and is mostly found in the D-loop of tRNAs for which it is named. This entry represents DusC, also known as tRNA-dihydrouridine(16) synthase, which is specific toward U16 of tRNA.
