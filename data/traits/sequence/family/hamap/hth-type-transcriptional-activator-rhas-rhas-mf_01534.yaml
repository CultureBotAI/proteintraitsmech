identifier: HAMAP:MF_01534
label: "HTH-type transcriptional activator RhaS [rhaS]"
definition: >-
  This entry represents the HTH transcriptional activator RhaS. It is responsible for activation of rhaBAD and rhaT operons and therefore is involved in the control of rhamnose metabolism.
