identifier: HAMAP:MF_02206
label: "3'-5' exonuclease DinG [dinG]"
definition: >-
  Canonical DinG is a bacterial helicase with 5'->3' polarity. In the bacilli and clostridia, the DinG helicase has become fused with an N-terminal exonuclease domain and lacks the FeS-binding domain essential for the helicase activity. Instead of being an helicase, the enzyme is a 3'->5' exonuclease acting on single-stranded DNA and RNA substrates. The inactive helicase domain seems to have a role in the control of the nuclease activity. By degrading rather than displacing RNA or DNA strands, exonuclease DinG may accomplish the same function as the canonical DinG helicase.
