identifier: HAMAP:MF_03212
label: "NADPH--cytochrome P450 reductase [POR]"
definition: >-
  This group represents the NADPH--cytochrome P450 reductase (CPR) from eukaryotes. CPR is required for electron transfer from NADP to cytochrome P450 in microsomes. It can also provide electron transfer to heme oxygenase and cytochrome B5. Interestingly, animals harbour a single CPR gene, while higher plants have multiple CPRs with as many as three in Populus tricocarpa and Oryza sativa. In comparison with other CPRs, plant CPRs often possess long N-terminal membrane-spanning domains.
definition_source: "InterPro:IPR023208 abstract (HAMAP MF_03212 is a member signature)"
