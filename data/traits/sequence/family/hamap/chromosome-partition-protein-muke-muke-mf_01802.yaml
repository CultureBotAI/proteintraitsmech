identifier: HAMAP:MF_01802
label: "Chromosome partition protein MukE [mukE]"
definition: >-
  MukE is involved in the segregation and condensation of prokaryotic chromosomes. MukE along with MukF (InterPro:IPR005582) interact with MukB (InterPro:IPR007406) in vivo forming a complex, which is required for chromosome condensation and segregation in Escherichia coli. The Muk complex appears to be similar to the SMC-ScpA-ScpB complex in other prokaryotes where MukB is the homologue of SMC. ScpA (InterPro:IPR003768) and ScpB (InterPro:IPR005234) have little sequence similarity to MukE or MukF, though they are predicted to be structurally similar, being predominantly α-helical with coiled coil regions.
definition_source: "InterPro:IPR007385 abstract (HAMAP MF_01802 is a member signature)"
