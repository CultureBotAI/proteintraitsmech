identifier: HAMAP:MF_03116
label: "Methylthioribulose-1-phosphate dehydratase [APIP]"
definition: >-
  Methylthioribulose-1-phosphate dehydratase catalyses the dehydration of methylthioribulose-1-phosphate (MTRu-1-P) into 2,3-diketo-5-methylthiopentyl-1-phosphate (DK-MTP-1-P). It functions in the methionine salvage pathway.
