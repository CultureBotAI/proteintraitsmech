identifier: HAMAP:MF_02061
label: "Thioredoxin/glutathione peroxidase BtuE [btuE]"
definition: >-
  Thioredoxin/glutathione peroxidase BtuE is a non-specific peroxidase that can use thioredoxin or glutathione as a reducing agent. In vitro, BtuE preferentially utilises thioredoxin A or C to decompose hydrogen peroxide as well as cumene, tert-butyl, and linoleic acid hydroperoxides. Thus, it has been suggested that lipid peroxides could be the real, physiological substrates of BtuE.
