identifier: HAMAP:MF_01257
label: "Phosphoenolpyruvate transferase [fbiA]"
definition: >-
  This entry includes 2-phospho-L-lactate transferase (CofD), which catalyses the transfer of the 2-phospholactate moiety from (2S)-lactyl-2-diphospho-5'-guanosine to 7,8-didemethyl-8-hydroxy-5-deazariboflavin (FO), and phosphoenolpyruvate transferase (FbiA) which catalyses the transfer of the phosphoenolpyruvate moiety from enoylpyruvoyl-2-diphospho-5'-guanosine (EPPG) to 7,8-didemethyl-8-hydroxy-5-deazariboflavin (FO) with the formation of dehydro coenzyme F420-0 and GMP. F420 is a hydride carrier, important for energy metabolism of methanogenic archaea, as well as for the biosynthesis of other natural products, like tetracycline in Streptomyces. F420 and some of its precursors are also utilized as cofactors for enzymes, like DNA photolyase in Mycobacterium tuberculosis. F420 is found in methanogens, Mycobacteria, and several other lineages. This enzyme is characterised so far in Methanocaldococcus jannaschii (Methanococcus jannaschii) but appears restricted to F420-containing species and is predicted to carry out the same function in these other species.
definition_source: "InterPro:IPR010115 abstract (HAMAP MF_01257 is a member signature)"
