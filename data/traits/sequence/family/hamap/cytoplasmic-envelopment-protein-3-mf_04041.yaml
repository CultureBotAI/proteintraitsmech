identifier: HAMAP:MF_04041
label: "Cytoplasmic envelopment protein 3"
definition: >-
  This entry includes cytoplasmic envelopment protein 3 (or pp28) from herpesviruses. The pp28 protein from human cytomegalovirus is encoded by the UL99 gene. Protein pp28 is myristylated and found in the tegument of the virus particle. Mutation studies have shown that pp28 is essential for the virus to acquire is final membrane. The pp28 protein can be detected in a vesicle budded off from the Golgi, where the virus acquires its outer membrane. In order to be correctly localized, pp28 forms a complex with UL94.
definition_source: "InterPro:IPR034705 abstract (HAMAP MF_04041 is a member signature)"
