identifier: HAMAP:MF_00470
label: "o-succinylbenzoate synthase [menC]"
definition: >-
  This entry describes the enzyme o-succinylbenzoic acid synthetase (MenC) that is involved in one of the steps of the menaquinone biosynthesis pathway. The biosynthesis of menaquinone has been studied most in Escherichia coli. 2-succinyl-6-hydroxy-2,4-cyclohexadiene-1-carboxylate (SHCHC) is dehydrated by MenC to give the aromatic compound O-succinylbenzoate (OSB). MenC, which is a member of the enolase superfamily and x-ray structure has been determined. Many of the common names of the proteins in this family are incorrectly described as O-succinylbenzoyl-CoA synthase. Members are restricted to bacteria.
definition_source: "InterPro:IPR010196 abstract (HAMAP MF_00470 is a member signature)"
