identifier: HAMAP:MF_01246
label: "Chitooligosaccharide deacetylase [chbG]"
definition: >-
  This entry represents chitooligosaccharide deacetylase ChbG (YdjC)-like proteins found in bacteria, including carbohydrate deacetylases from Firmicutes and chitooligosaccharide deacetylases from Enterobacteriaceae. ChbG is involved in the degradation of chitin.
