identifier: HAMAP:MF_00095
label: "Sugar fermentation stimulation protein A [sfsA]"
definition: >-
  This family contains sugar fermentation stimulation protein SfsA, which is probably a regulatory factor involved in maltose metabolism. SfsA has been shown to bind DNA and described as a nuclease, as it contains a well-conserved PDDEXK nuclease active site. The structure of SfsA has been solved (PDB:4dap, PDB:4dav)
