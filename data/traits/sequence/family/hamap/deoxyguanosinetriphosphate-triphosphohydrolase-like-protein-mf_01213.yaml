identifier: HAMAP:MF_01213
label: "Deoxyguanosinetriphosphate triphosphohydrolase-like protein"
definition: >-
  This entry represents a subgroup of dNTP triphosphohydrolases, classified as type 3 dNTPases. This entry includes PA3043 ( ) from Pseudomonas aeruginosa. It is a dNTP triphosphohydrolase that hydrolyzes multiple kinds of dNTP without an activator.
