identifier: HAMAP:MF_00478
label: "Ion-translocating oxidoreductase complex subunit E [rsxE]"
definition: >-
  The six-subunit complex RnfABCDGE in Rhodobacter capsulatus (Rhodopseudomonas capsulata) encodes a NADH oxidoreductase responsible for electron transport to nitrogenase, necessary for nitrogen fixation. A closely related complex in Escherichia coli, RsxABCDGE (Reducer of SoxR), reduces the 2Fe-2S-containing superoxide sensor SoxR, active as a transcription factor when oxidized. The Rnf complex is ferredoxin:NAD+ oxidoreductase that appears to pump different ions in different bacteria. In Clostridium ljungdahlii and Desulfovibrio alaskensis functions as a proton pump whose activity is important for growth, whereas in Acetobacterium woodii functions as a Na(+)-translocating electron transport chain. This family represents the subunit E of Rnf complexes.
definition_source: "InterPro:IPR010968 abstract (HAMAP MF_00478 is a member signature)"
