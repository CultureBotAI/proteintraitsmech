identifier: HAMAP:MF_01559
label: "L-lactate dehydrogenase [lldD]"
definition: >-
  This entry represents the bacterial L-lactate dehydrogenase, a member of the FMN-dependent alpha-hydroxy acid dehydrogenase family. It catalyses the oxidation of L-lactate to pyruvate. The lld operon was previously named lct.
