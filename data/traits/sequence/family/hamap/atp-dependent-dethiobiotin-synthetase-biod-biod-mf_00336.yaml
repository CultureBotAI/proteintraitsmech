identifier: HAMAP:MF_00336
label: "ATP-dependent dethiobiotin synthetase BioD [bioD]"
definition: >-
  BioD is involved in biotin biosynthesis and catalyses the reaction (CO2 + 7,8-diaminononanoate + ATP = dethiobiotin + phosphate + ADP). It binds ATP and requires magnesium as a co-factor. Proteins in this entry also include bifunctional proteins, such as BioCD from Bordetella avium, BioDA from Aspergillus nidulans, and BIO3-BIO1 protein from plants. They are also involved in the biotin biosynthesis.
