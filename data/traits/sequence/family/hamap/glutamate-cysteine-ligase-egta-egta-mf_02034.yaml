identifier: HAMAP:MF_02034
label: "Glutamate--cysteine ligase EgtA [egtA]"
definition: >-
  Members of this bacterial protein family, EgtA, resemble the glutamate--cysteine ligase of the two-step pathway for glutathione (GSH) biosynthesis, but instead are involved in the biosynthesis of the histidine-derived thiol, ergothioneine (EGT). Successful in vitro reconstitution of EGT biosynthesis using EgtBCDE and gamma-L-glutamyl-L-cysteine suggests that this enzyme is a bone fide glutamate--cysteine ligase.
definition_source: "InterPro:IPR017809 abstract (HAMAP MF_02034 is a member signature)"
