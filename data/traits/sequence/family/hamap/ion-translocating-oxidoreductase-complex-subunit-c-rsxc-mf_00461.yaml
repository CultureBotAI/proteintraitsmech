identifier: HAMAP:MF_00461
label: "Ion-translocating oxidoreductase complex subunit C [rsxC]"
definition: >-
  The six subunit complex RnfABCDGE in Rhodobacter capsulatus (Rhodopseudomonas capsulata) encodes an apparent NADH oxidoreductase responsible for electron transport to nitrogenase, necessary for nitrogen fixation. A closely related complex in Escherichia coli, RsxABCDGE (Reducer of SoxR), reduces the 2Fe-2S-containing superoxide sensor SoxR, active as a transcription factor when oxidized. This family of putative NADH oxidoreductase complexes exists in many of the same species as the related NQR, a Na(+)-translocating NADH-quinone reductase (InterPro:IPR003667), but is distinct. This entry describes the C subunit.
definition_source: "InterPro:IPR010208 abstract (HAMAP MF_00461 is a member signature)"
