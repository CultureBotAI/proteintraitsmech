identifier: HAMAP:MF_01017
label: "NAD(P)H dehydrogenase (quinone)"
definition: >-
  WrbA (tryptophan (W) repressor-binding protein) was discovered in Escherichia coli, where it was proposed to play a role in regulation of the tryptophan operon, which has been put in question since then. Instead, WrbA has been shown to have FMN-dependent NAD(P)H:quinone oxidoreductase activity. A role in quinone detoxification has been proposed, supported by evidence suggesting its involvement in oxidative defence and/or cell signalling.
