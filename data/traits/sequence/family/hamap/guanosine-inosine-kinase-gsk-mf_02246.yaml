identifier: HAMAP:MF_02246
label: "Guanosine-inosine kinase [gsk]"
definition: >-
  This entry represents guanosine-inosine kinase (IngK or Gsk) from Escherichia coli and similar proteins mostly found in gammaproteobacteria. IngK catalyses the phosphorylation of guanosine and inosine to GMP and IMP, respectively. However, it shows a strong preference for guanosine. This protein adopts a dimeric assembly, essential for its activity.
