identifier: HAMAP:MF_00684
label: "N(4)-acetylcytidine amidohydrolase"
definition: >-
  N(4)-acetylcytidine amidohydrolase catalyses the hydrolysis of N4-acetylcytidine (ac4C). It contains the human activating signal cointegrator homology (ASCH) domain with unknown function, although this domain has been suggested to be responsible for RNA binding during transcription activation, RNA processing and regulation of translation. This entry includes Escherichia coli protein YqfB, which is an amidohydrolase responsible for the catabolism of N4-acetylcytidine (ac4C) as well as other structurally different N4-acylated cytosines/cytidines. YqfB contains a unique Thr-Lys-Glu catalytic triad, and Arg acting as an oxyanion hole.
definition_source: "InterPro:IPR008314 abstract (HAMAP MF_00684 is a member signature)"
