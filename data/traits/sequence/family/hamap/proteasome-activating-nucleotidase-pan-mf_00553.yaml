identifier: HAMAP:MF_00553
label: "Proteasome-activating nucleotidase [pan]"
definition: >-
  Archaea mediate a form of post-translational modification of proteins termed sampylation that resembles ubiquitinylation. Proteasome-activating nucleotidase PAN1 from Haloferax volcanii has been shown to associate to sampylated proteins in proteasome-mediated proteolysis. AAA-ATPase PAN is responsible for recognizing, binding, unfolding and translocation of substrate proteins into the archaeal 20S proteasome core particle. It is essential for opening the gate of the 20S proteasome via an interaction with its C terminus, thereby allowing substrate entry and access to the site of proteolysis. Thus, the C termini of the proteasomal ATPase function like a 'key in a lock' to induce gate opening and therefore regulate proteolysis. The unfolding activity requires energy from ATP hydrolysis, whereas ATP binding alone promotes ATPase-20S proteasome association which triggers gate opening, and supports translocation of unfolded substrates. In addition to ATP, it is able to cleave other nucleotide triphosphates such as CTP, GTP and UTP, but hydrolysis of these other nucleotides is less effective in promoting proteolysis than ATP. Moreover, PAN by itself can function as a chaperone in vitro.
definition_source: "InterPro:IPR023501 abstract (HAMAP MF_00553 is a member signature)"
