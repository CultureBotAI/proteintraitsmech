identifier: HAMAP:MF_01286
label: "Digeranylgeranylglyceryl phosphate synthase"
definition: >-
  Digeranylgeranylglyceryl phosphate (DGGGP) synthase is a prenyltransferase involved in the synthesis of archaeal membrane ether-linked lipids. This enzyme catalyses the transfer of a geranylgeranyl group from geranylgeranyl diphosphate to (geranylgeranylglyceryl phosphate. DGGGP synthase has been found in almost all sequenced archaeal genomes, indicating its importance in membrane biosynthesis.
