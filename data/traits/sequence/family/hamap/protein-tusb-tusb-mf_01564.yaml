identifier: HAMAP:MF_01564
label: "Protein TusB [tusB]"
definition: >-
  This entry represents TusB, which is a part of a sulphur-relay system required for 2-thiolation of 5-methylaminomethyl-2-thiouridine (mnm(5)s(2)U) at tRNA wobble positions. TusB is part of a heterohexamer, formed by a dimer of trimers; the hexameric TusBCD complex contains 2 copies each of TusB, TusC and TusD. The TusBCD complex interacts with TusE.
