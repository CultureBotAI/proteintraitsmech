identifier: HAMAP:MF_01414
label: "Glutathione-regulated potassium-efflux system ancillary protein KefF [kefF]"
definition: >-
  KefF is a stabilising subunit of the KefC K(+) efflux system. It is required for full activity of KefC. KefF has oxidoreductase activity, and probably evolved from its function as an oxido-reductase to be a regulator of KefC. KefF belongs to the NAD(P)H dehydrogenase (quinone) family.
