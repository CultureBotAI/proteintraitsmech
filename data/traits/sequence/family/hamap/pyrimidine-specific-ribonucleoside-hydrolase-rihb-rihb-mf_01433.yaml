identifier: HAMAP:MF_01433
label: "Pyrimidine-specific ribonucleoside hydrolase RihB [rihB]"
definition: >-
  This entry represents the RihB ribonucleoside hydrolases, which are homologous to the RihA and RihC hydrolases. RihB hydrolyses cytidine and uridine to ribose and cytosine or uracil respectively; however in contrast to RihA, RihB displays a preference for cytidine.
