identifier: HAMAP:MF_00464
label: "S-adenosylmethionine decarboxylase proenzyme [speH]"
definition: >-
  Members of this protein family are the single chain precursor of the two chains of the mature S-adenosylmethionine decarboxylase as found in Methanocaldococcus jannaschii (Methanococcus jannaschii), Bacillus subtilis and a wide range of other species. S-adenosylmethionine decarboxylase catalyses the decarboxylation of S-adenosylmethionine to provide the aminopropyl moiety required for spermidine biosynthesis from putrescine.
