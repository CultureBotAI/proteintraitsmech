identifier: HAMAP:MF_01391
label: "Cytochrome c biogenesis protein CcsA [ccsA]"
definition: >-
  The CcsA protein family represents one of two essential proteins in system II c-type cytochrome biogenesis. Additional proteins tend to be part of the system but can often be replaced by chemical reductants such as dithiothreitol. These proteins are often named CcsB in Bordetella and some other bacteria, ResC in Bacillus (where there is additional N-terminal sequence), while chloroplast proteins are consistently named CcsA.
