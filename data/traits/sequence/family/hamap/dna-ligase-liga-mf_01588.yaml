identifier: HAMAP:MF_01588
label: "DNA ligase [ligA]"
definition: >-
  DNA ligase (polydeoxyribonucleotide synthase) is the enzyme that joins two DNA fragments by catalyzing the formation of an internucleotide ester bond between phosphate and deoxyribose. It is active during DNA replication, DNA repair and DNA recombination. There are two forms of DNA ligase: one requires ATP ( ), the other NAD ( ). This family is predominantly composed of NAD-dependent bacterial DNA ligases. They are proteins of about 75 to 85 kDa whose sequence is well conserved. They also show similarity to yicF, an Escherichia coli hypothetical protein of 63 kDa.
