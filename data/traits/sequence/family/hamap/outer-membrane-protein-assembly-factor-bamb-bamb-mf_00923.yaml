identifier: HAMAP:MF_00923
label: "Outer membrane protein assembly factor BamB [bamB]"
definition: >-
  Outer membrane protein (OMP) assembly factor BamB, also known as YfgL in Escherichia coli, is part of the outer membrane protein assembly Bam complex (composed of the outer membrane protein BamA, and four lipoproteins BamB, BamC, BamD and BamE), which is involved in assembly and insertion of β-barrel proteins into the outer membrane. Although BamB is not essential in E. coli, it serves an important function in the BAM complex, significantly increasing the folding efficiency of some OMPs in vivo and in vitro. It was suggested that BamB serves as a scaffolding protein in the Bam complex by optimally orienting the flexible periplasmic domain of BamA for interaction with other BAM components and chaperones.
