identifier: HAMAP:MF_02212
label: "Broad specificity amino-acid racemase"
definition: >-
  The short peptides that forms cross-links between glycan chains in the peptidoglycan polymer in bacterial cell walls require d-amino acids (DAA), being d-Alanine and d-Glutamate the most predominant ones. DAA are generated from the l-enantiomers by specific alanine and glutamate racemases. However, diverse bacteria can produce non-canonical DAA (NCDAA) components of the cell wall, that relies on periplasmic broad-spectrum racemases (Bsr) activity. Lysine racemase is another enzyme present in some organisms and catalyses the conversion of l-Lys to d-Lys but it also can use l-Arg as substrate. Together with Bsr they are classified as Group III racemases. These NCDAA are involved in different cellular processes including biofilm stability, sporulation and cell communication and allow pathogenic bacteria to adapt in adverse environments.
definition_source: "InterPro:IPR043698 abstract (HAMAP MF_02212 is a member signature)"
