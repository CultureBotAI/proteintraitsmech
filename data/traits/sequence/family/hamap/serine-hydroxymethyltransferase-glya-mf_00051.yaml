identifier: HAMAP:MF_00051
label: "Serine hydroxymethyltransferase [glyA]"
definition: >-
  This entry includes serine hydroxymethyltransferases and related uncharacterised proteins. Serine hydroxymethyltransferase catalyses the reversible interconversion of serine and glycine with tetrahydrofolate serving as the one-carbon carrier. This reaction serves as the major source of one-carbon groups required for the biosynthesis of purines, thymidylate, methionine, and other important biomolecules.
