identifier: HAMAP:MF_03163
label: "AdoMet-dependent rRNA methyltransferase <gene_name> [SPB1]"
definition: >-
  SPB1 is an adoMet-dependent rRNA methyltransferase required for proper assembly of pre-ribosomal particles during the biogenesis of the 60S ribosomal subunit. In Saccharomyces cerevisiae, it specifically methylates the guanosine in position 2922 of the 25S rRNA at the stage of 27S pre-rRNA maturation. It interacts with the snoRNA-associated proteins Nop1 and Nop58.
