identifier: HAMAP:MF_00820
label: "2,3-diketo-L-gulonate reductase [dlgD]"
definition: >-
  This entry represents a family of bacterial 2,3-diketo-L-gulonate reductases, which catalyse the reduction of 2,3-diketo-L-gulonate in the presence of NADH. The gene operon yiaK-S (of which yiaK encodes for the 2,3-diketo-L-gulonate reductase) is believed to encode proteins which are involved in the utilisation of rare sugars for growth. This enzyme relies on NAD-tartrate binding to produce a more open active site; the conformation of the free enzyme is incompatible with substrate binding.
definition_source: "InterPro:IPR023689 abstract (HAMAP MF_00820 is a member signature)"
