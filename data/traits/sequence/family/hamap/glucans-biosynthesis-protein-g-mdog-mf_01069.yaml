identifier: HAMAP:MF_01069
label: "Glucans biosynthesis protein G [mdoG]"
definition: >-
  Membrane-derived oligosaccharides (MDO) are members of a family of glucans found in the periplasmic space of Gram-negative bacteria. MdoG has been shown to be necessary for the synthesis of MDO, but its exact function is not known yet. This entry contains proteins that are involved in the biosynthesis of osmoregulated periplasmic glucans (OPGs). They belong to the opgD/opgG family.
