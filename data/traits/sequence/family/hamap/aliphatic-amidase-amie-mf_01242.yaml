identifier: HAMAP:MF_01242
label: "Aliphatic amidase [amiE]"
definition: >-
  These enzymes catalyzes the hydrolysis of short-chain aliphatic amides to their corresponding organic acids with release of ammonia. They also exhibit in vitro acyl transferase activity,transferring the acyl moiety of short-chain amides to hydroxylamine to form hydroxamates. Aliphatic amidases contain 1 CN hydrolase domain. This group of enzyme belongs to the nitrilase superfamily.
