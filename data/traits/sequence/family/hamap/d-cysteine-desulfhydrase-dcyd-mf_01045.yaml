identifier: HAMAP:MF_01045
label: "D-cysteine desulfhydrase [dcyD]"
definition: >-
  This entry represents a family of bacterial D-cysteine desulphydrases, which are responsible for the decomposition of D-cysteine, which is a powerful inhibitor of E. coli growth. D-cysteine is decomposed into pyruvate, H 2 S and NH 3, and restricts growth through inhibition of key amino acid biosynthethis.
