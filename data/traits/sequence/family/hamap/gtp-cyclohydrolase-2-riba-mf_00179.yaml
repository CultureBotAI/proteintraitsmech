identifier: HAMAP:MF_00179
label: "GTP cyclohydrolase-2 [ribA]"
definition: >-
  GTP cyclohydrolase II (also known as ribA) catalyses the first committed step in the biosynthesis of riboflavin (vitamin b2). The enzyme converts GTP to 2,5-diamino-6-beta-ribosyl-4(3H)-pyrimidinone 5'-phosphate (APy), formate and pyrophosphate, and requires magnesium as a cofactor. In numerous bacteria and in plants, GTP cyclohydrolase II occurs in the C-terminal of a bifunctional enzyme known as ribBA, which also comprises an N-terminal 3,4-dihydroxy-2-butanone 4-phosphate synthase (DHBP_synthase, also known as RibB) (InterPro:IPR000422). RibB catalyses the conversion of D-ribulose 5-phosphate to formate and 3,4-dihydroxy-2-butanone 4-phosphate. A paralogous protein is encoded in the genome of Streptomyces coelicolor, which converts GTP to 2-amino-5-formylamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate (FAPy), an activity that has otherwise been reported for unrelated GTP cyclohydrolases III.
definition_source: "InterPro:IPR000926 abstract (HAMAP MF_00179 is a member signature)"
