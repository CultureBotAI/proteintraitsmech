identifier: HAMAP:MF_04028
label: "Ribonucleoside-diphosphate reductase small subunit [RIR2]"
definition: >-
  The beta (small) subunit of ribonucleotide reductase (RNR) is a member of a broad superfamily of ferritin-like diiron-carboxylate proteins. This entry includes the ribonucleoside-diphosphate reductase small subunit from Herpesviruses.
