identifier: HAMAP:MF_00222
label: "Shikimate dehydrogenase (NADP(+)) [aroE]"
definition: >-
  This entry represents shikimate dehydrogenase ( ) and quinate/shikimate dehydrogenase ( ). The latter is the second shikimate dehydrogenase enzyme found in Escherichia coli and differs from ( ), in that it can use both quinate and shikimate as substrate and either NAD(+) or NADP(+) as acceptor.
