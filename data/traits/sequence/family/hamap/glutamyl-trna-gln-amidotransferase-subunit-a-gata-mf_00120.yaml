identifier: HAMAP:MF_00120
label: "Glutamyl-tRNA(Gln) amidotransferase subunit A [gatA]"
definition: >-
  In many species, Gln-tRNA ligase is missing. tRNA(Gln) is misacylated with Glu after which a heterotrimeric amidotransferase converts Glu to Gln. This group represents the amidase chain of the heterotrimer, encoded by the gatA gene called glutamyl-tRNA(Gln) amidotransferase, A subunit. This enzyme functions as an alternative to a direct Gln-tRNA synthetase (Gln-tRNA ligase) in mitochondria, chloroplasts, Gram-positive bacteria, cyanobacteria, and the Archaea. The archaea have an Asp-tRNA(Asn) amidotransferase instead of an Asp-tRNA ligase. In the archaea, a paralog of gatB is found, here designated gatB_rel, that is a candidate B subunit of the Asp-tRNA(Asn) amidotransferase. The gatA-encoded subunit may be shared by gatB and gatB_rel. Amidase signature (AS) enzymes are a large group of hydrolytic enzymes that contain a conserved stretch of approximately 130 amino acids known as the AS sequence. They are widespread, being found in both prokaryotes and eukaryotes. AS enzymes catalyse the hydrolysis of amide bonds (CO-NH2), although the family has diverged widely with regard to substrate specificity and function. Nonetheless, these enzymes maintain a core α/β/α structure, where the topologies of the N-and C-terminal halves are similar. AS enzymes characteristically have a highly conserved C-terminal region rich in serine and glycine residues, but devoid of aspartic acid and histidine residues, therefore they differ from classical serine hydrolases. These enzymes posses a unique, highly conserved Ser-Ser-Lys catalytic triad used for amide hydrolysis, although the catalytic mechanism for acyl-enzyme intermediate formation can differ between enzymes. Examples of AS enzymes include: Peptide amidase (Pam), which catalyses the hydrolysis of the C-terminal amide bond of peptides
