identifier: HAMAP:MF_00063
label: "Adenosine 5'-phosphosulfate reductase [cysH]"
definition: >-
  This entry represents a family of phosphoadenosine phosphosulphate (PAPS) reductases and adenosine 5'-phosphosulphate (APS) reductases involved in the assimilatory reduction of inorganic sulphate. The APS reductases can be distinguished from the PAPS reductases by the presence of two additional cysteine pairs thought to form an iron-sulphur cluster. This family also includes APS reductases from plants, such as APR1-3 from Arabidopsis.
definition_source: "InterPro:IPR004511 abstract (HAMAP MF_00063 is a member signature)"
