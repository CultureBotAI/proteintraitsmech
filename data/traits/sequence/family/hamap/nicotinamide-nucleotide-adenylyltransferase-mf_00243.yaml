identifier: HAMAP:MF_00243
label: "Nicotinamide-nucleotide adenylyltransferase"
definition: >-
  This family of archaeal proteins exhibits NAD salvage biosynthesis enzyme nicotinamide-nucleotide adenylyltransferase (EC:2.7.7.1) activity. In some cases, the enzyme was tested and found also to have the activity of nicotinate-nucleotide adenylyltransferase (EC:2.7.7.18), an enzyme of NAD de novo biosynthesis, although with a higher Km. In some archaeal species, a number of proteins which are uncharacterised with respect to activity, are also present.
