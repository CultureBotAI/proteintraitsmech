identifier: HAMAP:MF_01432
label: "Non-specific ribonucleoside hydrolase RihC [rihC]"
definition: >-
  This entry represents the RihC proteins, which are ribonucleoside hydrolases with a broad substrate specificity. RihC has decreasing activity in the order uridine >xanthosine >inosine >adenosine >cytidine >guanosine. There are two other ribonucleoside hydrolases present in Escherichia coli encoded by the rihA and rihB genes, which have different specificities.
