identifier: HAMAP:MF_00042
label: "Ribonuclease H [rnhA]"
definition: >-
  Ribonuclease H (RNase H) EC:3.1.26.4 recognises and cleaves the RNA strand of RNA-DNA heteroduplexes. RNases H are classified into two types. Type 1 RNases H include prokaryotic and eukaryotic RNases H1 and retroviral RNase H. Type 2 RNases H include prokaryotic and eukaryotic RNases H2 and bacterial RNase H3. In prokaryotes RNase H is involved in removing the RNA of RNA-DNA hybrids, particularly the primers of Okazaki fragments in lagging-strand DNA synthesis. This family consists of bacterial RNases HI and viral RNases H.
definition_source: "InterPro:IPR022892 abstract (HAMAP MF_00042 is a member signature)"
