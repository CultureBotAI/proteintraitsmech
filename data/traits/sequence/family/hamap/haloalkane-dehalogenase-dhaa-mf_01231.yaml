identifier: HAMAP:MF_01231
label: "Haloalkane dehalogenase [dhaA]"
definition: >-
  This entry represents the subfamily 2 haloalkane dehalogenases. Haloalkane dehalogenases catalyse the hydrolytic cleavage of carbon-halogen bonds in halogenated aliphatic compounds, leading to the formation of the corresponding primary alcohols, halide ions and protons. These enzymes can be divided into two subfamilies which differ in the amino acids and the topology of their catalytic triads. Subfamily 1 seems to have a preference for short-chain haloalkanes as substrates, whereas subfamily 2 seems to prefer long-chains.
