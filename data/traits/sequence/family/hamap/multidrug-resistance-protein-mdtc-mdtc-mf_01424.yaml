identifier: HAMAP:MF_01424
label: "Multidrug resistance protein MdtC [mdtC]"
definition: >-
  Multidrug resistance proteins are molecular pumps that participate in a low energy shock adaptive response in some bacteria. The MdtABC tripartite complex is composed of MdtA, MdtB and MdtC, and confers resistance against novobiocin and deoxycholate. The mdtABC operon is transcriptionally activated by BaeR and belongs to the AcrB/AcrD/AcrF family This entry represents MdtC which forms a heteromultimer with MdtB.
