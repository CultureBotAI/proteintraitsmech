identifier: HAMAP:MF_00110
label: "3-dehydroquinate synthase [aroB]"
definition: >-
  The 3-dehydroquinate synthase (DHQS) domain can exist in isolation or as a domain in the pentafunctional AROM polypeptide (UniProtKB:P07547). 3-dehydroquinate synthase catalyses the formation of dehydroquinate (DHQ) and orthophosphate from 3-deoxy-D-arabino heptulosonic 7 phosphate. This reaction is part of the shikimate pathway which is involved in the biosynthesis of aromatic amino acids. DHQS consists of an N-terminal Rossmann-fold domain and a C-terminal α-helical domain. The active site is located in a cleft between the two domains.
