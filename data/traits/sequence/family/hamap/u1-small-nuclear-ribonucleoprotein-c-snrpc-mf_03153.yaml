identifier: HAMAP:MF_03153
label: "U1 small nuclear ribonucleoprotein C [SNRPC]"
definition: >-
  This group represents U1 small nuclear ribonucleoprotein C. It is a component of the U1 snRNP, which is essential for recognition of the pre-mRNA 5' splice-site and the subsequent assembly of the spliceosome. U1-C is directly involved in initial 5' splice-site recognition for both constitutive and regulated alternative splicing. The interaction with the 5' splice-site seems to precede base-pairing between the pre-mRNA and the U1 snRNA.
definition_source: "InterPro:IPR017340 abstract (HAMAP MF_03153 is a member signature)"
