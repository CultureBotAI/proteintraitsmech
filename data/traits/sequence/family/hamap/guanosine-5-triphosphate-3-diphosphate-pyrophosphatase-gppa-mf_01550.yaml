identifier: HAMAP:MF_01550
label: "Guanosine-5'-triphosphate,3'-diphosphate pyrophosphatase [gppA]"
definition: >-
  Guanosine pentaphosphate (pppGpp) is a cytoplasmic signalling molecule which together with ppGpp controls the "stringent response", an adaptive process that allows bacteria to respond to amino acid starvation, resulting in the coordinated regulation of numerous cellular activities. Guanosine-5'-triphosphate,3'-diphosphate pyrophosphatase (GppA), also known as guanosine pentaphosphate phosphohydrolase, catalyses the conversion of pppGpp to ppGpp.
definition_source: "InterPro:IPR023709 abstract (HAMAP MF_01550 is a member signature)"
