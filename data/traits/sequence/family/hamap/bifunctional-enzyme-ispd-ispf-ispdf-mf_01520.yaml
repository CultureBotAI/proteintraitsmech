identifier: HAMAP:MF_01520
label: "Bifunctional enzyme IspD/IspF [ispDF]"
definition: >-
  This entry represents bifunctional enzyme that catalyses the formation of 4-diphosphocytidyl-2-C-methyl-D-erythritol from CTP and 2-C-methyl-D-erythritol 4-phosphate (MEP) (IspD), and converts 4-diphosphocytidyl-2-C-methyl-D-erythritol 2-phosphate into 2-C-methyl-D-erythritol 2,4-cyclodiphosphate (MECDP) and CMP (IspF).
definition_source: "InterPro:IPR026596 abstract (HAMAP MF_01520 is a member signature)"
