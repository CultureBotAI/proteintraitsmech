identifier: HAMAP:MF_00093
label: "Peptide chain release factor 1 [prfA]"
definition: >-
  This entry represents peptide chain release factor 1 (PrfA, RF-1), and excludes the related peptide chain release factor 2 (PrfB, RF-2). RF-1 helps recognise and terminate translation at UAA and UAG stop codons. This entry also includes chloroplast release factor APG3, which is an orthologue of E. coli RF1 and is essential for chloroplast development. APG3 could complement E. coli RF1 mutants, but not RF2 mutants, indicating that AP3 may function as RF1 in E. coli, showing specificity of stop codon recognition.
definition_source: "InterPro:IPR004373 abstract (HAMAP MF_00093 is a member signature)"
