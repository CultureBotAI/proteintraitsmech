identifier: HAMAP:MF_01486
label: "RecBCD enzyme subunit RecC [recC]"
definition: >-
  The exodeoxyribonuclease V enzyme or RecBCD enzyme is a multisubunit enzyme comprised of the proteins RecB ( InterPro:IPR004586 ), RecC (this family) and RecD ( InterPro:IPR006344 ). This enzyme plays an important role in homologous genetic recombination, repair of double strand DNA breaks resistance to UV irradiation and chemical DNA-damage. The enzyme ( EC:3.1.11.5 ) catalyses hydrolysis of single-stranded (ss) DNA or double-stranded (ds) DNA and unwinding of the ends of dsDNA. Its nuclease activity is controlled by Chi sites (5' G-C-T-G-G-T-G-G 3') in such a way that the enzyme produces a potent single-stranded DNA substrate for homologous pairing by RecA and single-stranded DNA binding proteins.
definition_source: "InterPro:IPR006697 abstract (HAMAP MF_01486 is a member signature)"
