identifier: HAMAP:MF_02098
label: "Carnitine monooxygenase reductase subunit"
definition: >-
  Two-component Rieske-type oxygenase/reductase contains CntA, a Rieske-type oxygenase protein, and CntB, a predicted reductase with a plant-type ferridoxin domain. CntAB is essential in carnitine degradation to trimethylamine (TMA). This entry represents CntB.
