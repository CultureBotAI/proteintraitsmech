identifier: HAMAP:MF_04085
label: "Nucleoprotein [N]"
definition: >-
  Arenaviridae are single stranded RNA viruses. The arenaviridae S RNAs that have been characterised include conserved terminal sequences, an ambisense arrangement of the coding regions for the precursor glycoprotein (GPC) and nucleocapsid (N) proteins and an intergenic region capable of forming a base-paired "hairpin" structure. The mature glycoproteins that result are G1 and G2 and the N protein. This family represents the nucleocapsid protein that encapsulates the viral ssRNA.
