identifier: HAMAP:MF_04150
label: "RNA ligase 2"
definition: >-
  This entry represents the RNA ligase 2 (Rnl2) mainly from phages such as bacteriophage T4. It repairs 3'-OH/5'-PO4 nicks in duplex RNA or RNA:DNA hybrid in which the broken 3'-OH strand is RNA. This process comprises three steps: in the first one, the RNA ligase reacts with ATP in the absence of nucleic acid to form a covalent ligase-AMP intermediate releasing pyrophosphate; in the second the ligase-AMP binds to the nicked duplex nucleic acid and transfers the adenylate to the 5'-PO4 terminus to form an adenylylated nicked intermediate and in the third step the RNA ligase directs the attack of the nick 3'-OH on the 5'-phosphoanhydride linkage, resulting in a repaired 3' - 5' phosphodiester and release of AMP.
definition_source: "InterPro:IPR044263 abstract (HAMAP MF_04150 is a member signature)"
