identifier: HAMAP:MF_00266
label: "tRNA(Phe) 7-((3-amino-3-carboxypropyl)-4-demethylwyosine(37)-N(4))-methyltransferase [taw3]"
definition: >-
  The presence of Wyosine derivatives, such as wybutosine (yW), at position 37 of tRNA(Phe) is characteristic of Eukaryotes and Archaea. Four of the five wybutosine biosynthetic enzymes from Eukaryotes have homologues in Archaea. Taw3 is the archaeal homologue of eukaryotic Tyw3, responsible for the methylation at N4 of 4-demethylwyosine (imG-14).
