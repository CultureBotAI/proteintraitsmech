identifier: HAMAP:MF_04100
label: "DNA-directed DNA polymerase"
definition: >-
  This entry represents a family of DNA-directed DNA polymerases. In bacteriophage T4, the enzyme has been shown to be part of a multienzyme complex required for the synthesis of DNA. The enzymes also posses exonuclease activity and are able to to proofread misincorporated nucleotides.
