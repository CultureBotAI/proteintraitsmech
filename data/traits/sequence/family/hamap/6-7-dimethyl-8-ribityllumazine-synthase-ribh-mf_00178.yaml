identifier: HAMAP:MF_00178
label: "6,7-dimethyl-8-ribityllumazine synthase [ribH]"
definition: >-
  Riboflavin is biosynthesized in plants, fungi and certain microorganisms; as animals lack the necessary enzymes to produce this vitamin, they acquire it from dietary sources. The penultimate step in the biosynthesis of riboflavin (vitamin B2) involves the condensation of 3,4-dihydroxy-2-butanone 4-phosphate with 5-amino-6-ribitylamino-2,4(1H,3H)-pyrimidinedione, which is catalyzed by 6,7-dimethyl-8-ribityllumazine synthase (lumazine synthase). The biosynthesis of one riboflavin molecule requires one molecule of GTP and two molecules of ribulose 5-phosphate as substrates. The final step in the biosynthesis of the vitamin involves the dismutation of 6,7-dimethyl-8-ribityllumazine catalyzed by riboflavin synthase (RS).
definition_source: "InterPro:IPR034964 abstract (HAMAP MF_00178 is a member signature)"
