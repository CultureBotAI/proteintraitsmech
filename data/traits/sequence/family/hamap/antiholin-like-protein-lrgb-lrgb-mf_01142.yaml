identifier: HAMAP:MF_01142
label: "Antiholin-like protein LrgB [lrgB]"
definition: >-
  Staphylococcus aureus lrgAB operon negatively regulates murein hydrolase activity and promotes tolerance to penicillin. LgrB inhibits the expression or activity of extracellular murein hydrolases by interacting, possibly with LrgA, with the holin-like proteins CidA and/or CidB.
