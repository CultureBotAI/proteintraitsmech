identifier: HAMAP:MF_01691
label: "2,3,4,5-tetrahydropyridine-2,6-dicarboxylate N-acetyltransferase [dapH]"
definition: >-
  This enzyme catalyses the transfer of an acetyl group from acetyl-CoA to tetrahydrodipicolinate and is part of the diaminopimelate pathway of lysine biosynthesis. An alternate name is tetrahydrodipicolinate N-acetyltransferase.
