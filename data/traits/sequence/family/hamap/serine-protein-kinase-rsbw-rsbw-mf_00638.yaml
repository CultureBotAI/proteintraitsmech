identifier: HAMAP:MF_00638
label: "Serine-protein kinase RsbW [rsbW]"
definition: >-
  This entry describes the serine-protein kinase RsbW also known as the anti-sigma B factor. Sigma B controls the general stress regulon in B subtilis and is activated by cell stresses such as stationary phase and heat shock. RsbW binds to sigma B and prevents formation of the transcription complex at the promoter. RsbV (anti-anti-sigma factor) binds to RsbW to inhibit association with sigma B, however RsbW can phosphorylate RsbV, causing disassociation of the RsbV/RsbW complex. Low ATP level or environmental stress causes the dephosphorylation of RsbV.
definition_source: "InterPro:IPR010193 abstract (HAMAP MF_00638 is a member signature)"
