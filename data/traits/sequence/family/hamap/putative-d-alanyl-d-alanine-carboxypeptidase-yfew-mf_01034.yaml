identifier: HAMAP:MF_01034
label: "Putative D-alanyl-D-alanine carboxypeptidase [yfeW]"
definition: >-
  This entry represents unassigned peptidases that belong to MEROPS peptidase family S12 (D-Ala-D-Ala carboxypeptidase B family, clan SE). Proteins in this entry include Bacillus subtilis YbbE, also known as AmiE, an amidase that hydrolyzes the N-acetylmuramyl-L-Ala bond of MurNAc peptides. This entry also includes YfeW (also known as pbp4B) from E. coli. YfeW has penicillin-binding capacity and a low DD-carboxypeptidase activity.
