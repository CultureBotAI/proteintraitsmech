identifier: HAMAP:MF_01492
label: "Ribonuclease J [rnj]"
definition: >-
  Archaeal ribonuclease J shares protein sequence similarity with bacterial RNase J. In Pyrococcus abyssi, ribonuclease J is an exoribonuclease with a 5' end dependence and a 5' to 3' directionality. It may be involved in RNA degradation. It also degrades ssNDA but not dsDNA.
