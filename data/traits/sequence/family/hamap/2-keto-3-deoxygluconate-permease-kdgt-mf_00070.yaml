identifier: HAMAP:MF_00070
label: "2-keto-3-deoxygluconate permease [kdgT]"
definition: >-
  This family includes the characterised 2-Keto-3-Deoxygluconate transporters from Bacillus subtilis and Erwinia chrysanthemi. There are homologues of this protein found in both Gram-positive and Gram-negative bacteria. In E. chrysanthemi, a phytopathogenic bacterium, degraded pectin products from plant cell walls are transported by 2-keto-3-deoxygluconate permease into the bacterial cell to provide a carbon and energy source. 2-keto-3-deoxygluconate permease can mediate the uptake of glucuronate with a low affinity.
definition_source: "InterPro:IPR004684 abstract (HAMAP MF_00070 is a member signature)"
