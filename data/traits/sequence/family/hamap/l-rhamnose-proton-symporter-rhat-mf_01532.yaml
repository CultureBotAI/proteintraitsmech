identifier: HAMAP:MF_01532
label: "L-rhamnose-proton symporter [rhaT]"
definition: >-
  These proteins are members of the L-Rhamnose Symporter (RhaT) family. This family includes two characterised members, both of which function as L-rhamnose:H+ symporters and have 10 GES predicted transmembrane domains.
