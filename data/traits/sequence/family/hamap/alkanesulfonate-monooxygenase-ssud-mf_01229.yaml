identifier: HAMAP:MF_01229
label: "Alkanesulfonate monooxygenase [ssuD]"
definition: >-
  This entry represents a distinct group of proteins within the wider luciferase-like family of monooxygenases, including SsuD from E.coli and MsuD from P.fluorescens which are closely related. They catalyse the desulphonation of aliphatic sulfonates in an FMN-dependent fashion. SsuD converts alkanesulfonates to the corresponding aldehyde and sulfite in which it catalyses the C-S bond cleavage of C2-C10 alkyl-substituted sulfonates, in addition to alkyl chains with bulkier chemical groups and larger buffer molecules, whereas MsuD is most active with a C1 sulfonate in the conversion of methanesulfonate to sulfite, completing the sulfur assimilation process during sulfate starvation.
definition_source: "InterPro:IPR019911 abstract (HAMAP MF_01229 is a member signature)"
