identifier: HAMAP:MF_00710
label: "Malonate decarboxylase acyl carrier protein [mdcC]"
definition: >-
  This family consists of the acyl carrier protein, also called the delta subunit, of malonate decarboxylase. This subunit has the same covalently bound prosthetic group, derived from and similar to coenzyme A, as does citrate lyase, although this protein and the acyl carrier protein of citrate lyase do not show significant sequence similarity. Both malonyl and acetyl groups are transferred to the prosthetic group for catalysis. This entry represents the malonate decarboxylate delta subunit. Malonate decarboxylase of Klebsiella pneumoniae consists of four different subunits and catalyses the conversion of malonate plus H + to acetate and CO2. The catalysis proceeds via acetyl and malonyl thioester residues with the phosphribosyl-dephospho-CoA prosthetic group of the acyl carrier protein (ACP) subunit. MdcC is the (apo) ACP subunit.
definition_source: "InterPro:IPR009662 abstract (HAMAP MF_00710 is a member signature)"
