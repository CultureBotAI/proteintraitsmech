identifier: HAMAP:MF_01036
label: "Exoribonuclease 2 [rnb]"
definition: >-
  This family consists of exoribonuclease II (RNase II), the product of the rnb gene, as found in a number of gamma proteobacteria. In Escherichia coli, it is one of eight different exoribonucleases. It is involved in mRNA degradation and tRNA precursor end processing.
