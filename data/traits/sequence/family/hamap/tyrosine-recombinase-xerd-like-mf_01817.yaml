identifier: HAMAP:MF_01817
label: "Tyrosine recombinase XerD-like"
definition: >-
  Phage integrases are enzymes that mediate unidirectional site-specific recombination between two DNA recognition sequences, the phage attachment site, attP, and the bacterial attachment site, attB. Integrases may be grouped into two major families, the tyrosine recombinases and the serine recombinases, based on their mode of catalysis. Tyrosine family integrases, such as Bacteriophage lambda integrase, utilise a catalytic tyrosine to mediate strand cleavage, tend to recognise longer attP sequences, and require other proteins encoded by the phage or the host bacteria. The recombinases Cre from phage P1, XerD from Escherichia coli and Flp from yeast are members of the tyrosine recombinase family, and have a two-domain motif resembling that of lambda integrase, as well as sharing a conserved binding mechanism. The structural fold of their catalytic core domains resemble that of Lambda integrase This entry contains XerD-like putative tyrosine recombinases from the Streptococcaceae family.
definition_source: "InterPro:IPR020876 abstract (HAMAP MF_01817 is a member signature)"
