identifier: HAMAP:MF_01816
label: "Tyrosine recombinase XerS [xerS]"
definition: >-
  This entry represents the site-specific tyrosine recombinase XerS, which is part of the broader 'phage' integrase family. It acts by catalyzing the cutting and rejoining of recombining DNA molecules. It is essential for converting dimers of the bacterial chromosome into monomers to permit their segregation at cell division.
