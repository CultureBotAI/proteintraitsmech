identifier: HAMAP:MF_00650
label: "Phosphoribosyl-dephospho-CoA transferase [mdcG]"
definition: >-
  Members of this protein family are the phosphoribosyl-dephospho-CoA transferase specific to the malonate decarboxylase system. This enzyme can also be designated holo-ACP synthase ( ). The corresponding component of the citrate lyase system, CitX, shows little or no sequence similarity to this family. Malonate decarboxylase, like citrate lyase, has a unique acyl carrier protein subunit with a prosthetic group derived from, and distinct from, coenzyme A.
