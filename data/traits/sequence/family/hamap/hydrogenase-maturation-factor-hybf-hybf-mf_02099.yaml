identifier: HAMAP:MF_02099
label: "Hydrogenase maturation factor HybF [hybF]"
definition: >-
  Bacterial membrane-bound nickel-dependent hydrogenases require a number of accessory proteins which are involved in their maturation. Escherichia coli has two accessory proteins that share protein sequence similarity, HypA and HybF. This entry represents HybF, which is involved in the maturation of isoenzymes 1 and 2.
