identifier: HAMAP:MF_02229
label: "5-deoxyribose 1-phosphate isomerase [drdI]"
definition: >-
  This entry represents 5-deoxyribose 1-phosphate isomerase from bacteria, including DrdI from Bacillus thuringiensis serovar kurstaki. DrdI catalyzes the isomerization of 5-deoxy-alpha-D-ribose 1-phosphate to 5-deoxy-D-ribulose 1-phosphate, as part of a 5-deoxyribose salvage pathway that recycles this toxic radical SAM enzyme by-product to mainstream metabolites.
definition_source: "InterPro:IPR043679 abstract (HAMAP MF_02229 is a member signature)"
