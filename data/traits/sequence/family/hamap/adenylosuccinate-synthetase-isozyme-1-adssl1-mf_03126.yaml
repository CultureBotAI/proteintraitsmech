identifier: HAMAP:MF_03126
label: "Adenylosuccinate synthetase isozyme 1 [ADSSL1]"
definition: >-
  This entry represents the adenylosuccinate synthetase isozyme 1 (AdSS1) (EC:6.3.4.4) from vertebrates. It is a component of the purine nucleotide cycle (PNC), which interconverts IMP and AMP to regulate the nucleotide levels in various tissues, and which contributes to glycolysis and ammoniagenesis. It catalyses the first committed step in the biosynthesis of AMP from IMP.
