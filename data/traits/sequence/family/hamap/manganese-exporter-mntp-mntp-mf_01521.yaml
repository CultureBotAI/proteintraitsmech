identifier: HAMAP:MF_01521
label: "Manganese exporter MntP [mntP]"
definition: >-
  This entry represents Manganese exporter MntP. Escherichia coli MntP (formerly YebN), is upregulated by manganese through transcriptional regulator MntR. It functions as a manganese exporter. It is involved in manganese homeostasis. It is important for reducing the concentration of manganese in the cell when manganese levels are high, thus reducing its toxicity.
