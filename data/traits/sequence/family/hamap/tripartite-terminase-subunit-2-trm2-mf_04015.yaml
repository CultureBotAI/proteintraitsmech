identifier: HAMAP:MF_04015
label: "Tripartite terminase subunit 2 [TRM2]"
definition: >-
  This is a family of Herpesvirus proteins including UL33 ( UniProtKB:P10217 ) and UL51 ( UniProtKB:P16792 ). These proteins constitute the T-terminase subunit of the tripartite terminase complex that assembles in the cytoplasm of infected cells and uses the host nuclear import machinery to enter the nucleus, where capsid assembly and genome-packaging occur.
