identifier: HAMAP:MF_03059
label: "Ribosome-releasing factor 2, mitochondrial [GFM2]"
definition: >-
  Bacterial translation elongation factor G (EF-G) catalyses translocation during peptide elongation and mediates ribosomal disassembly during ribosome recycling with the aid of the ribosomal recycling factor (RRF). Human mitochondria contains two EF-G homologues, EF-G1 and EF-G2. This entry represents EF-G2, also known as ribosome-releasing factor 2 (RRF2), which mediates ribosome recycling with human mitochondrial RRF, but lacks translocation activity. This entry also includes EFG2 homologues from other animals and fungi. Its budding yeast homologue, known as Mef2, is required for respiratory growth and is essential for mitochondrial genome maintenance.
definition_source: "InterPro:IPR030851 abstract (HAMAP MF_03059 is a member signature)"
