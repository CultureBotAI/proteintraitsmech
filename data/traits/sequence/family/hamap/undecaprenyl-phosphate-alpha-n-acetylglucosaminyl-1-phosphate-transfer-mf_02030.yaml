identifier: HAMAP:MF_02030
label: "Undecaprenyl-phosphate alpha-N-acetylglucosaminyl 1-phosphate transferase [wecA]"
definition: >-
  Members of this family are the WecA enzymes of enterobacterial common antigen (ECA) biosynthesis, undecaprenyl-phosphate alpha-N-acetylglucosaminyl 1-phosphatetransferase (EC:2.7.8.33). This family represents one narrow clade, and closely related sequences outside this clade may represent enzymes that catalyse the same specific reaction, but in the context of different pathways. A His-rich motif in a cytosolic loop of this integral membrane protein, shown to be critical to enzymatic activity for WecA is variously present or absent in the clade that includes Bacillus subtilis TagO teichoic acid biosynthesis enzyme, which may catalyse the same reaction as WecA. Aspartic acids residues have been shown to be important for catalytic activity and for binding a metal ion (Mg 2+ on Mn 2+).
definition_source: "InterPro:IPR012750 abstract (HAMAP MF_02030 is a member signature)"
