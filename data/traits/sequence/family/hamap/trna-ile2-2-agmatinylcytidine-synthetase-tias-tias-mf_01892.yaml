identifier: HAMAP:MF_01892
label: "tRNA(Ile2) 2-agmatinylcytidine synthetase TiaS [tiaS]"
definition: >-
  TiaS is an archaeal ATP-dependent agmatine transferase that catalyses the formation of 2-agmatinylcytidine (agm2C) at the wobble position (C34) of tRNA(Ile2). This modified base specifically recognises AUA codons.
