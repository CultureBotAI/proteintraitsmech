identifier: HAMAP:MF_01498
label: "DNA repair protein RadA [radA]"
definition: >-
  RadA/Sms is a highly conserved eubacterial protein that shares sequence similarity with both RecA strand transferase and lon protease. The RadA/Sms family are ATP-dependent proteases involved in both DNA repair and degradation of proteins, peptides, glycopeptides. They are classified in MEROPS peptidase family S16 (lon protease family, clan SJ). RadA/Sms is involved in recombination and recombinational repair, most likely involving the stabilisation or processing of branched DNA molecules or blocked replication forks and in the integration of exogenous DNA into the genome during bacterial genetic transformation.
