identifier: HAMAP:MF_01149
label: "Uncharacterized MFS-type transporter YcaD [ycaD]"
definition: >-
  Among the different families of transporter, only two occur ubiquitously in all classifications of organisms. These are the ATP-Binding Cassette (ABC) superfamily and the Major Facilitator Superfamily (MFS). The MFS transporters are single-polypeptide secondary carriers capable only of transporting small solutes in response to chemiosmotic ion gradients. This entry represents the uncharacterised major facilitator superfamily protein YcaD from enterobacteria.
