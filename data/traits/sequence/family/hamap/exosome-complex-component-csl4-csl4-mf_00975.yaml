identifier: HAMAP:MF_00975
label: "Exosome complex component Csl4 [csl4]"
definition: >-
  Csl4 is a non-catalytic component of the exosome, a complex involved in RNA processing and degradation. he exosome consists of Rrp4, Rrp41, Rrp42 and Csl4. The subunits Rrp41 and Rrp42 form a phosphorolytically active hexamer, with an RNA-binding cap on the top consisting of a homotrimer of either Rrp4 or Csl4. The presence of different proteins in the cap may enable interactions with different substrates. It has been shown that the archaeal DnaG protein needs Csl4 for binding to the exosome. DnaG is a poly(A)-binding protein and enhances the degradation of adenine-rich transcripts by the Csl4-exosome.
definition_source: "InterPro:IPR030850 abstract (HAMAP MF_00975 is a member signature)"
