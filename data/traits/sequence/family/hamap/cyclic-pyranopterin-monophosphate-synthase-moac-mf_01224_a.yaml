identifier: HAMAP:MF_01224_A
label: "Cyclic pyranopterin monophosphate synthase [moaC]"
definition: >-
  This entry contains probable cyclic pyranopterin monophosphate synthase accessory protein (also known as molybdenum cofactor biosynthesis protein C, or MoaC) from archaea. Members of this entry seem to be an outgroup of the eukaryotic and bacterial branch. Members of this MoaC family are involved in molybdenum cofactor (Moco) biosynthesis, an essential cofactor of a diverse group of redox enzymes. MoaC, a small hexameric protein, converts, together with MoaA, a guanosine derivative to the precursor Z by inserting the carbon-8 of the purine between the 2' and 3' ribose carbon atoms, which is the first of three phases of Moco biosynthesis.
definition_source: "InterPro:IPR023047 abstract (HAMAP MF_01224_A is a member signature)"
