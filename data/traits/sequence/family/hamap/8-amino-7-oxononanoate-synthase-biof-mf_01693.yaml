identifier: HAMAP:MF_01693
label: "8-amino-7-oxononanoate synthase [bioF]"
definition: >-
  8-amino-7-oxononanoate synthase (AONS) is a pyridoxal 5'-phosphate-dependent enzyme, which catalyses the decarboxylative condensation of L-alanine with pimeloyl-CoA to form 8(S)-amino-7-oxononanoate. This is the first committed step in biotin biosynthesis: 6-carboxyhexanoyl-CoA + L-alanine = 8-amino-7-oxononanoate + CoA + CO2 The enzyme is a symmetrical homodimer with a tertiary structure and active site organisation similar to, but distinct from, those of other PLP-dependent enzymes with known structures. AONS is a critical PLP-binding lysine at the end of a deep cleft that allows access to the pantothenate arm of pimeloyl-CoA. There is a cluster of positively charged residues at the entrance to this cleft, which forms a putative diphosphate binding site for CoA. Trifluoroalanine irreversibly inhibits this enzyme. This entry represents 8-amino-7-oxononanoate synthases from Proteobacteria.
