identifier: HAMAP:MF_00562
label: "D-aminoacyl-tRNA deacylase [dtdA]"
definition: >-
  D-aminoacyl-tRNA deacylases hydrolyse the ester bond between the polynucleotide and the D-amino acid, thereby preventing the accumulation of such mis-acylated and metabolically inactive tRNA molecules. Several aminoacyl-tRNA synthetases have the ability to transfer the D-isomer of their amino acid onto their cognate tRNA. This entry represents a group of archaeal D-aminoacyl-tRNA deacylases (also known as d-Tyr- tRNA(Tyr) deacylases) that shares homology with plant D-aminoacyl-tRNA deacylase, including GEK1 from Arabidopsis thaliana, a member of this group. The expression of plant D-aminoacyl-tRNA deacylase is capable of functionally compensating in E. coli for the absence of endogeneous d-Tyr- tRNA(Tyr) deacylase.
definition_source: "InterPro:IPR018033 abstract (HAMAP MF_00562 is a member signature)"
