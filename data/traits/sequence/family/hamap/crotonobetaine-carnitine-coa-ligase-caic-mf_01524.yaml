identifier: HAMAP:MF_01524
label: "Crotonobetaine/carnitine--CoA ligase [caiC]"
definition: >-
  One function of CaiC may be to catalyse the transfer of CoA to carnitine, generating the initial carnitinyl-CoA needed for the CaiB reaction cycle. The enzyme also possesses betaine:CoA ligase activity, and is involved in the synthesis of betainyl-CoAs. Many enterobacteria are able to convert carnitine, via crotonobetaine, to gamma-butyrobetaine in the presence of carbon and nitrogen sources under anaerobic conditions. In Escherichia coli the enzymes involved in this pathway are encoded by the caiTABCDE operon. The adjacent but divergent fixABCD operon also appears to be necessary for carnintine meatbolism. The Fix proteins are homologous to proteins found in known electron transport pathways.
