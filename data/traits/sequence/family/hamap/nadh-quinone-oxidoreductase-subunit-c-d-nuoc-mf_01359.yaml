identifier: HAMAP:MF_01359
label: "NADH-quinone oxidoreductase subunit C/D [nuoC]"
definition: >-
  This entry represents the NADH-quinone oxidoreductase subunit C and D fusion protein found in the Alpha-, Beta-, Gamma-and some Deltaproteobacteria. The CD subunit fusion protein found in the Aquificae, Bacteroidetes, some other Delta-and Epsilon proteobacteria is different enough that it seems to be another subfamily (see InterPro:IPR026662).
