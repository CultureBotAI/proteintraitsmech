identifier: HAMAP:MF_02236
label: "N-acetyl-L-citrulline deacetylase [argE']"
definition: >-
  This entry represents a group of proteins mainly from Proteobacteria, including ArgE' from Xanthomonas campestris pv. campestris. ArgE' is involved in arginine biosynthesis. It catalyses the deacetylation of N-acetyl-L-citrulline to produce L-citrulline. Interestingly, it Is also able to catalyse the deacetylation of N-acetylornithine in vitro, with almost equal velocity. However, this reaction may be not relevant in vivo since Xanthomonas does not possess the canonical argF gene and cannot convert ornithine to citrulline via ArgF'.
definition_source: "InterPro:IPR043697 abstract (HAMAP MF_02236 is a member signature)"
