identifier: HAMAP:MF_03220
label: "Succinate--CoA ligase [ADP-forming] subunit beta, mitochondrial [SUCLA2]"
definition: >-
  This entry includes the beta subunit of the mitochondrial, ATP-forming succinate--CoA ligase (SUCLA; EC:6.2.1.5) from eukaryotes. The ligase functions in the citric acid cycle (TCA), and is a heterodimer of an alpha and beta subunit. It couples the hydrolysis of succinyl-CoA to the synthesis of ATP which is the only substrate-level phosphorylation step in the TCA. The beta subunit provides nucleotide specificity of the enzyme and binds the substrate succinate, while the binding sites for coenzyme A and phosphate are found in the alpha subunit. GTP-forming succinate--CoA ligase has the same alpha subunit but a different beta subunit. Deficiency of SUCLA activity is associated with encephalomyopathy and mitochondrial DNA depletion.
definition_source: "InterPro:IPR034723 abstract (HAMAP MF_03220 is a member signature)"
