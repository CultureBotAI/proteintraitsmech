identifier: HAMAP:MF_00401
label: Peroxiredoxin
definition: >-
  Peroxiredoxins are thiol-dependent peroxidases that play an important role in antioxidant defence mechanisms by removing hydrogen peroxide. This group of peroxiredoxins is represented by peroxiredoxins from Pyrococcus horikoshii (PhPrx) and Aeropyrum pernix (ApPrx). They have a similar structure, though ApPrx has a C-terminal extension that PhPrx does not.
