identifier: HAMAP:MF_00926
label: "RNA polymerase-binding transcription factor DksA [dksA]"
definition: >-
  DksA (DnaK suppressor A) is originally named as a multicopy suppressor of temperature sensitivity of dnaKJ mutants. DksA is a transcription factor that acts by binding directly to the RNA polymerase (RNAP). It is required for negative regulation of rRNA expression and positive regulation of several amino acid biosynthesis promoters.
