identifier: HAMAP:MF_00844_B
label: "Rqc2 homolog RqcH [rqcH]"
definition: >-
  Ribosome-associated protein quality control (RQC) sense ribosome stalling during translation and mediate subunit recycling and nascent-chain proteolysis. Rqc2 is one of the eukaryotic sense factors of ribosomal obstruction and recruits the E3 ligase Ltn1/Listerin for ubiquitination and proteasome degradation. When this mechanism fails, it adds a poly-Alanine chain to promote its destruction. Bacterial and archaeal homologues, namely RqcH add a poly-Ala chain to the aberrant nascent chain in the large ribosome subunit and tag it for degradation. This entry represents the Rqc2 homologue (RqcH) from bacteria which is part of a process analogous and partial redundant to its canonical ssrA/tmRNA system.
