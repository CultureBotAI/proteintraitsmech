identifier: HAMAP:MF_00031
label: "Holliday junction branch migration complex subunit RuvA [ruvA]"
definition: >-
  In prokaryotes, RuvA, RuvB, and RuvC process the universal DNA intermediate of homologous recombination, termed Holliday junction. The tetrameric DNA helicase RuvA, known as Holliday junction branch migration complex subunit RuvA, specifically binds to the Holliday junction and facilitates the isomerization of the junction from the stacked folded configuration to the square-planar structure. In the RuvA tetramer, each subunit consists of three domains, I, II and III, where I and II form the major core that is responsible for Holliday junction binding and base pair rearrangements of Holliday junction executed at the crossover point, whereas domain III regulates branch migration through direct contact with RuvB.
definition_source: "InterPro:IPR000085 abstract (HAMAP MF_00031 is a member signature)"
