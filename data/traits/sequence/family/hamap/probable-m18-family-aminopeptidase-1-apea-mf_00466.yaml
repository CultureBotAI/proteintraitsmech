identifier: HAMAP:MF_00466
label: "Probable M18 family aminopeptidase 1 [apeA]"
definition: >-
  This group of metallopeptidases belong to the MEROPS peptidase family M18, (clan MH). The proteins have two catalytic zinc ions at the active site, bound by His/Asp, Asp, Glu, Asp/Glu and His. The catalysed reaction involves the release of an N-terminal aminoacid, usually neutral or hydrophobic, from a polypeptide. This entry represents aminopeptidase 1 from bacteria.
