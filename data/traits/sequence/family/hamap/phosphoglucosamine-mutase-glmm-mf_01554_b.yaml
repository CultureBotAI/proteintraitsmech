identifier: HAMAP:MF_01554_B
label: "Phosphoglucosamine mutase [glmM]"
definition: >-
  The alpha-D-phosphohexomutase superfamily is composed of four related enzymes, each of which catalyses a phosphoryl transfer on their sugar substrates: phosphoglucomutase (PGM), phosphoglucomutase/phosphomannomutase (PGM/PMM), phosphoglucosamine mutase (PNGM), and phosphoacetylglucosamine mutase (PAGM). PGM (EC:5.4.2.2) converts D-glucose 1-phosphate into D-glucose 6-phosphate, and participates in both the breakdown and synthesis of glucose. PGM/PMM (EC:5.4.2.2; EC:5.4.2.8) are primarily bacterial enzymes that use either glucose or mannose as substrate, participating in the biosynthesis of a variety of carbohydrates such as lipopolysaccharides and alginate. Both PNGM (EC:5.4.2.3) and PAGM (EC:5.4.2.10) are involved in the biosynthesis of UDP-N-acetylglucosamine. This family describes GlmM, phosphoglucosamine mutase, also designated MrsA and YhbF in Escherichia coli, UreC in Helicobacter pylori, and femR315 or FemD in Staphylococcus aureus. It converts glucosamine-6-phosphate to glucosamine-1-phosphate as part of the pathway toward UDP-N-acetylglucosamine for peptidoglycan and lipopolysaccharides. In order to be active, GlmM must be phosphorylated, which can occur via autophosphorylation or by the Ser/Thr kinase StkP. GlmM functions in a classical ping-pong bi-bi mechanism with glucosamine-1,6-diphosphate as an intermediate..
