identifier: HAMAP:MF_00664
label: "Phosphatidylserine decarboxylase proenzyme [psd]"
definition: >-
  This entry represents Phosphatidylserine decarboxylase proenzyme and similar sequences mainly found in prokaryotes. Phosphatidylserine decarboxylase (PSD, EC:4.1.1.65) is synthesised as a single chain precursor. Generation of the pyruvoyl active site from a Ser is coupled to cleavage of a Gly-Ser bond between the larger (beta) and smaller (alpha chains). This enzyme catalyses the formation of phosphatidylethanolamine (PtdEtn) from phosphatidylserine (PtdSer). It is an integral membrane protein. Phosphatidylserine decarboxylases (PSDs) have been classified in two types. Type I PSDs include enzymes of eukaryotic mitochondria and bacterial origin which contain the amino acid sequence LGST as a characteristic motif. Type II PSDs are found in the endomembrane system of eukaryotes and contain a typical GGST motif. These characteristic motifs are considered as autocatalytic cleavage sites where proenzymes are split into alpha and beta subunits.
definition_source: "InterPro:IPR033175 abstract (HAMAP MF_00664 is a member signature)"
