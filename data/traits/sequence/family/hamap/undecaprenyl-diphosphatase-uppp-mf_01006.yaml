identifier: HAMAP:MF_01006
label: "Undecaprenyl-diphosphatase [uppP]"
definition: >-
  This is a family of small, highly hydrophobic proteins. Over-expression of this protein in Escherichia coli is associated with bacitracin resistance, and the protein was originally proposed to be an undecaprenol kinase called bacA. BacA protein, however, does not show undecaprenol phosphokinase activity. It is now known to be an undecaprenyl pyrophosphate phosphatase (EC:3.6.1.27) and is renamed UppP. It is not the only protein associated with bacitracin resistance.
