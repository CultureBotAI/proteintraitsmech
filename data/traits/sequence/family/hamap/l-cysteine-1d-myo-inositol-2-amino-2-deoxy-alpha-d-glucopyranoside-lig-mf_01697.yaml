identifier: HAMAP:MF_01697
label: "L-cysteine:1D-myo-inositol 2-amino-2-deoxy-alpha-D-glucopyranoside ligase [mshC]"
definition: >-
  This entry represents MshC, a l-cysteine:1-D-myo-inosityl 2-amino-2-deoxy-alpha-D-glucopyranoside ligase enzyme that uses ATP to ligate a Cys residue to a mycothiol precursor molecule, in the second to last step in mycothiol biosynthesis. This enzyme shows considerable homology to Cys--tRNA ligases, and many proteins are wrongly annotated as such. Mycothiol is found in Mycobacterium tuberculosis, Corynebacterium glutamicum (Brevibacterium flavum), Streptomyces coelicolor, and various other members of the Actinobacteria. Mycothiol is an analog of glutathione.
definition_source: "InterPro:IPR017812 abstract (HAMAP MF_01697 is a member signature)"
