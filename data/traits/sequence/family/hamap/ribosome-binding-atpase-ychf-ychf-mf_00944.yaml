identifier: HAMAP:MF_00944
label: "Ribosome-binding ATPase YchF [ychF]"
definition: >-
  E. coli ribosome-binding ATPase YchF is an ATPase that binds to both the 70S ribosome and the 50S ribosomal subunit in a nucleotide-independent manner. The mammalian homologue of YchF has been termed OLA1, for Obg-like ATPase 1. These proteins bind and hydrolyse ATP more efficiently than GTP, therefore their name. ATPase activity is a general feature of the YchF subfamily of Obg-like GTPases.
