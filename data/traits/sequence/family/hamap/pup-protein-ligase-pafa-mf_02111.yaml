identifier: HAMAP:MF_02111
label: "Pup--protein ligase [pafA]"
definition: >-
  Pupylation is a novel protein modification system found in some bacteria. This entry represents a family of proteins involved in this system. Pup ligases, such as PafA, conjugate the prokaryotic ubiquitin-like protein Pup to lysine residues in target proteins, marking them for degradation by the proteasome. It has been suggested that proteins in this entry are related to gamma-glutamyl-cysteine synthetases.
