identifier: HAMAP:MF_02032
label: "2-hydroxy-3-oxopropionate reductase [garR]"
definition: >-
  These sequences represent 2-hydroxy-3-oxopropionate reductase (EC:1.1.1.60), also called tartronate semialdehyde reductase. It follows glyoxylate carboligase and precedes glycerate kinase in D-glycerate pathway of glyoxylate degradation. The eventual product, 3-phosphoglycerate, is an intermediate of glycolysis and is readily metabolized. Tartronic semialdehyde, the substrate of this enzyme, may also come from other pathways, such as D-glucarate catabolism.
definition_source: "InterPro:IPR006398 abstract (HAMAP MF_02032 is a member signature)"
