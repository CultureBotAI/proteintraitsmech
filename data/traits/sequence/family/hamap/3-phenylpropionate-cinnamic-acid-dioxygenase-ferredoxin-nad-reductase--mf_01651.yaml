identifier: HAMAP:MF_01651
label: "3-phenylpropionate/cinnamic acid dioxygenase ferredoxin--NAD(+) reductase component [hcaD]"
definition: >-
  This entry represents the ferredoxin reductase subunit of PP/CI dioxygenase. Phenylpropanoid compounds are widely available in natural environments, and they can originate from putrefaction of proteins in soil or as breakdown products of several constituents of plants, such as lignin, various oils, and resins. Microbial catabolism of phenylpropanoid compounds plays an important role not only in the natural degradative cycle of these aromatic molecules but also in their industrial applications such as wine making, aging, and storage. In particular, degradation of cinnamic acid (CI), 3-phenylpropionic acid (PP), and their hydroxylated derivatives has been reported in several bacteria, including Pseudomonas species, Arthrobacter species, Escherichia coli (strain K12), and Rhodococcus globerulus.
definition_source: "InterPro:IPR023744 abstract (HAMAP MF_01651 is a member signature)"
