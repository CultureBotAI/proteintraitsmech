identifier: HAMAP:MF_01652
label: "3-(3-hydroxy-phenyl)propionate/3-hydroxycinnamic acid hydroxylase [mhpA]"
definition: >-
  3-(3-hydroxy-phenyl)propionate/3-hydroxycinnamic acid hydroxylase catalyzes the insertion of one atom of molecular oxygen into position 2 of the phenyl ring of 3-(3-hydroxyphenyl)propionate (3-HPP) and hydroxycinnamic acid (3HCI).
