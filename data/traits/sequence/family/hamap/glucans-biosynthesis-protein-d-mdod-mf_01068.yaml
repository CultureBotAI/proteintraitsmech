identifier: HAMAP:MF_01068
label: "Glucans biosynthesis protein D [mdoD]"
definition: >-
  Membrane-derived oligosaccharides (MDO) are members of a family of glucans found in the periplasmic space of Gram-negative bacteria. MdoG has been shown to be necessary for the synthesis of MDO, but its exact function is not known yet. MdoD, an MdoG paralog, is a twin-arginine-dependent periplasmic protein that controls osmoregulated periplasmic glucan backbone structures; see also. This entry represents bacterial MdoD proteins. They are thought to be involved in the control of the structural glucose backbone of osmoregulated periplasmic glucans (OPGs).
