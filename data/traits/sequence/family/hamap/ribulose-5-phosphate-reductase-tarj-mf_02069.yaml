identifier: HAMAP:MF_02069
label: "Ribulose-5-phosphate reductase [tarJ]"
definition: >-
  TarJ is an NADPH-dependent alcohol dehydrogenase for the synthesis of ribitol 5-phosphate from ribulose 5-phosphate. Ribitol phosphate is a component of the cell wall teichoic acid in some bacteria, such as Streptococcus pneumoniae.
