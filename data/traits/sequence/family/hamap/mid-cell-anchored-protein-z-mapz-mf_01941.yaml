identifier: HAMAP:MF_01941
label: "Mid-cell-anchored protein Z [mapZ]"
definition: >-
  In Streptococcus pneumoniae, mid-cell-anchored protein Z (MapZ) forms ring structures at the cell equator and moves apart as the cell elongates, therefore behaving as a permanent beacon of division sites. During cell division, a new MapZ ring marks the future cell division site and positions tubulin-like protein FtsZ rings through direct interactions. MapZ is conserved amongst Streptococcaceae and most other Lactobacillales.
