identifier: HAMAP:MF_01434
label: "Monofunctional glycosyltransferase [mgt]"
definition: >-
  Proteins in this family are thought to be involved in cell wall peptidoglycan biosynthesis. In particular they are thought to be responsible for the elongation of the glycan strands using lipid-linked disaccharide-pentapeptide as the substrate.
