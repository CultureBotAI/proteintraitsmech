identifier: HAMAP:MF_00802
label: "Bifunctional glutamine synthetase adenylyltransferase/adenylyl-removing enzyme [glnE]"
definition: >-
  This entry represents GlnE family proteins. These proteins adenylate and deadenylate glutamate-ammonia ligases: ATP + {L-Glutamate:ammonia ligase (ADP-forming)} = Diphosphate + Adenylyl-{L-Glutamate:Ammonia ligase (ADP-forming)} The two activities are functionally the reverse of one another and must be controlled by the organism to prevent futile cycling.
