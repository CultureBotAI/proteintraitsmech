identifier: HAMAP:MF_00672
label: "UPF0761 membrane protein YihY [yihY]"
definition: >-
  This entry represents bacterial members of the uncharacterised protein family UPF0761. It includes the E. coli gene product of yihY, and was previously thought to be a family of tRNA-processing ribonuclease BN proteins. This has been shown to be incorrect.
