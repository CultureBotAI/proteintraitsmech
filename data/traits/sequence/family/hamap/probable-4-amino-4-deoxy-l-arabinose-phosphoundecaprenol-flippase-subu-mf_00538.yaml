identifier: HAMAP:MF_00538
label: "Probable 4-amino-4-deoxy-L-arabinose-phosphoundecaprenol flippase subunit ArnF [arnF]"
definition: >-
  This entry represents ArnF, which is a an integral membrane component of the ArnE/ArnF (heterodimer) undecaprenyl-phosphate-alpha-L-Ara4N flippase. This flippase translocates 4-amino-4-deoxy-L-arabinose-phosphoundecaprenol (alpha-L-Ara4N-phosphoundecaprenol) from the cytoplasmic to the periplasmic side of the inner membrane during lipopolysaccharide biosynthesis. ArnE and ArnF are membrane proteins with 4 transmembrane helices and belong to the drug/metabolite transporter (DMT) superfamily. Deletion of arnE or arnF results in restoration of polymyxin sensitivity in a polymyxin-resitant pmrAc strain and are defective for transfer of undecaprenyl-phosphate-alpha-L-Ara4N from the cytoplasmic face of the inner membrane to the periplasmic face and for attachment of L-Ara4N to lipid A. Both ArnE and ArnF are required for polymyxin resistance as expression from a plasmid of one cannot replace a deletion of the other.
definition_source: "InterPro:IPR022832 abstract (HAMAP MF_00538 is a member signature)"
