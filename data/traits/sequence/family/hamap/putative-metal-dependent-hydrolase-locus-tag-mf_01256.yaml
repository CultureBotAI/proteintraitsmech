identifier: HAMAP:MF_01256
label: "Putative metal-dependent hydrolase <locus_tag>"
definition: >-
  This entry is represented by YfiT, which is a 19kDa polypeptide from Bacillus subtilis, belonging to a small sequence family with members predominantly from Gram-positive bacteria. The crystal structure of YfiT in complex with Ni(2+) has been determined to a resolution of 1.7 A. YfiT exists as a dimer and binds Ni(2+) in a 1:1 stoichiometry. The protein has an unusual four-helix bundle topology and coordinates Ni(2+) in an octahedral geometry with three conserved histidines and three waters. Although there is no similarity in their overall structures, the coordination geometry of the metal and the residues that constitute the putative active site in YfiT are similar to those of metalloproteases such as thermolysin. YfiT may therefore function as a metal-dependent hydrolase.
definition_source: "InterPro:IPR023774 abstract (HAMAP MF_01256 is a member signature)"
