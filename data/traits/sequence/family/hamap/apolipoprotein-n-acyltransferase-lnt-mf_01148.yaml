identifier: HAMAP:MF_01148
label: "Apolipoprotein N-acyltransferase [lnt]"
definition: >-
  Apolipoprotein N-acyltransferase (Lnt) transfers the acyl group to lipoproteins and is involved in lipoprotein biosynthesis in Gram-negative bacteria. It is an integral membrane protein. In the last step of lipoprotein maturation, N-acylation by apolipoprotein N-acyltransferase of the plasma membrane is required for recognition of the outer membrane lipoproteins by the Lol system, which transports the lipoproteins from the plasma to the outer membrane. This is a reverse amidase (i.e. condensation) reaction.
definition_source: "InterPro:IPR004563 abstract (HAMAP MF_01148 is a member signature)"
