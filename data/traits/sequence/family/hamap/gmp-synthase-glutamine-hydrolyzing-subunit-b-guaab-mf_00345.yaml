identifier: HAMAP:MF_00345
label: "GMP synthase [glutamine-hydrolyzing] subunit B [guaAB]"
definition: >-
  This entry represents the GMP synthase subunit B. It catalyses the synthesis of GMP from XMP (xanthosine 5'-phosphate). The amidotransferase family of enzymes utilises the ammonia derived from the hydrolysis of glutamine for a subsequent chemical reaction catalyzed by the same enzyme. The ammonia intermediate does not dissociate into solution during the chemical transformations. GMP synthetase is a glutamine amidotransferase from the de novo purine biosynthetic pathway. The C-terminal domain is specific to the GMP synthases EC:6.3.5.2. In prokaryotes this domain mediates dimerisation. Eukaryotic GMP synthases are monomers. This domain in eukaryotes includes several large insertions that may form globular domains.
definition_source: "InterPro:IPR026598 abstract (HAMAP MF_00345 is a member signature)"
