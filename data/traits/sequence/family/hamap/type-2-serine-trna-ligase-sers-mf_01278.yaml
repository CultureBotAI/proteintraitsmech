identifier: HAMAP:MF_01278
label: "Type-2 serine--tRNA ligase [serS]"
definition: >-
  Serine-tRNA ligase (EC:6.1.1.11) exists as monomer and belongs to class IIa. The serine-tRNA ligases from a few of the archaea that belong to this group are different from the set of mutually more closely related serine-tRNA ligases from eubacteria, eukaryotes, and other archaea (InterPro:IPR002317). There are two distinct types of seryl-tRNA synthetase, as differentiated by primary sequence analysis, three-dimensional structure and substrate recognition mechanism: type 1 (InterPro:IPR002317) is found in the majority of organisms (prokaryotes, eukaryotes and archaea), whereas type 2 (this entry) is confined to some methanogenic archaea. Methanosarcina barkeri possesses two seryl-tRNA synthetases, one of each type. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 2'-hydroxyl of the tRNA, whereas class II synthetases preferentially use the 3'-hydroxyl site. Class I includes synthetases specific for arginine, cysteine, glutamic acid, glutamine, isoleucine, leucine, methionine, tyrosine, tryptophan
