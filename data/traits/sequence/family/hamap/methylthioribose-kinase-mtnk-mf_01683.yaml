identifier: HAMAP:MF_01683
label: "Methylthioribose kinase [mtnK]"
definition: >-
  Members of this family are 5-methylthioribose kinases (EC:2.7.1.100) that catalyse phosphorylation of 5-methylthioribose (MTR), a step in the recycling of methionine from 5'-methylthioadenosine, a co-product of polyamine biosynthesis. The preceding step of methylthioadenosine (MTA) hydrolysis to MTR is catalysed by 5'-methylthioadenosine/S-adenosylhomocysteine (MTA/AdoHcy) nucleosidase. Bacillus subtilis protein MtnK (formerly YkrT) and Klebsiella pneumoniae protein MtrK have been experimentally characterised. K. pneumoniae MtrK expression is regulated by methionine. As this enzyme is absent in mammals, it has been considered a target for rational drug design.
definition_source: "InterPro:IPR009212 abstract (HAMAP MF_01683 is a member signature)"
