identifier: HAMAP:MF_01545
label: "p-hydroxybenzoic acid efflux pump subunit AaeB [aaeB]"
definition: >-
  The para-hydroxybenzoic acid efflux pump's substrates are p-hydroxybenzoic acid (pHBA), 6-hydroxy-2-naphthoic and 2-hydroxycinnamate. It could function as a metabolic relief valve, allowing to eliminate certain compounds when they accumulate to high levels in the cell. Both AaeB and AaeA subunits are required for the function of the efflux system. This entry represents subunit AaeB.
