identifier: HAMAP:MF_01113
label: "DNA polymerase IV [dinB]"
definition: >-
  DNA polymerase IV is a poorly processive, error-prone DNA polymerase involved in untargeted mutagenesis. It copies undamaged DNA at stalled replication forks, which arise in vivo from mismatched or misaligned primer ends. These misaligned primers can be extended by polIV. It exhibits no 3'-5' exonuclease (proofreading) activity and may be involved in translesional synthesis.
