identifier: HAMAP:MF_02077
label: "Lipid II flippase Amj [amj]"
definition: >-
  This entry includes lipid II flippase Amj, which is required for bacterial cell wall synthesis. It transports lipid-linked peptidoglycan precursors from the inner to the outer surface of the cytoplasmic membrane.
