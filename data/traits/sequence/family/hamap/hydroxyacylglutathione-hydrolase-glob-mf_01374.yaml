identifier: HAMAP:MF_01374
label: "Hydroxyacylglutathione hydrolase [gloB]"
definition: >-
  This entry represents hydroxyacylglutathione hydrolase, a detoxification enzyme also known as glyoxalase II. It follows lactoylglutathione lyase, also known as glyoxalase I, and acts to remove the toxic metabolite methylglyoxal and related compounds. This protein belongs to the broader metallo-beta-lactamase family.
