identifier: HAMAP:MF_00817
label: "NADPH-dependent 7-cyano-7-deazaguanine reductase [queF]"
definition: >-
  This group represents QueF-like proteins, closely related to InterPro:IPR016856 (QueF/YkvM) but containing an additional N-terminal domain. They are predicted to function as NADPH-dependent nitrile oxidoreductase based on sequence similarity to InterPro:IPR016856, and to catalyse the NADPH-dependent reduction of 7-cyano-7-deazaguanineto7-aminomethyl-7-deazaguanine, a late step in the biosynthesis of queuosine, a 7-deazaguanine modified nucleoside found in tRNA(GUN) of bacteria and eukaryotes. Queuosine (Q) is an example of a highly modified nucleoside located in the anticodon wobble position 34 of tRNAs specific for Tyr, His, Asp, and Asn. With few exceptions (such as yeast and mycoplasma), it is widely distributed in most prokaryotic and eukaryotic phyla. Q is based on a very unusual 7-deazaguanosine core, which is further modified by addition of a cyclopentendiol ring. This group of proteins belongs to the T fold structural superfamily and is related to GTP cyclohydrolase FolE. QueF-like proteins form two groups, type I proteins exemplified by Bacillus subtilis YkvM (UniProtKB:O31678) and type II proteins exemplified by Escherichia coli YqcD (UniProtKB:Q46920). The type I proteins are comparable in size with bacterial and mammalian FolE, whereas the type II proteins are larger and are predicted to be comprised of two domains, similar to plant FolE. In members of this entry, the N-terminal domain has often been annotated as a membrane-spanning domain, but transmembrane prediction programs run on YqcD do not detect any transmembrane segments. Instead, the QueF motif can be easily detected in this domain, whereas the flanking and invariant cysteine and glutamate residues (Cys-190 and Glu-230 in E. coli YqcD) are only present in the C-terminal domain. The splitting of act
