identifier: HAMAP:MF_00014
label: "Ribosome maturation factor RimM [rimM]"
definition: >-
  This family consists of the bacterial protein RimM (YfjA, 21K), a 30S ribosomal subunit-binding protein implicated in 16S ribosomal RNA processing. It has been partially characterised in Escherichia coli, is found with other translation-associated genes such as trmD. It is broadly distributed among bacteria, including some minimal genomes such the aphid endosymbiont Buchnera aphidicola. This entry represents the full-length model. A member from Arabidopsis (plant) has additional N-terminal sequence likely to represent a chloroplast transit peptide.
definition_source: "InterPro:IPR011961 abstract (HAMAP MF_00014 is a member signature)"
