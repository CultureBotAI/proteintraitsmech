identifier: HAMAP:MF_00154
label: "Protoheme IX farnesyltransferase [cyoE]"
definition: >-
  This entry represents protoheme IX farnesyltransferase, also known as haem O synthase, an enzyme that creates an intermediate in the biosynthesis of haem A. This enzyme converts heme B (protoheme IX) to heme O by substitution of the vinyl group on carbon 2 of heme B porphyrin ring with a hydroxyethyl farnesyl side group. Prior to the description of its enzymatic function, this protein was often called a cytochrome o ubiquinol oxidase assembly factor.
definition_source: "InterPro:IPR006369 abstract (HAMAP MF_00154 is a member signature)"
