identifier: HAMAP:MF_01985
label: "Phenolic acid decarboxylase"
definition: >-
  This entry represents the phenolic acid decarboxylase subunit C from bacteria, including YclC (BsdC) from Bacillus subtilis. It is a involved in the decarboxylation and detoxification of phenolic derivatives under both aerobic and anaerobic conditions. It can catalyse the reversible decarboxylation of 4-hydroxybenzoate and vanillate and can also decarboxylate 3,4-dihydroxybenzoate.
