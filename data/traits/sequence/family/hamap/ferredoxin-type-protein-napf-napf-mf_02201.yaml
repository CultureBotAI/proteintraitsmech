identifier: HAMAP:MF_02201
label: "Ferredoxin-type protein NapF [napF]"
definition: >-
  Periplasmic nitrate reductase (NapABC enzyme) is responsible for nitrate dissimilation. NapF protein is the auxiliary protein of the Nap systems. It interacts with the catalytic subunit, NapA, and may be an accessory protein for NapA maturation.
