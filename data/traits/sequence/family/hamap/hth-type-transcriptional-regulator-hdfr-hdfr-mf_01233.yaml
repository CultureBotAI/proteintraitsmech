identifier: HAMAP:MF_01233
label: "HTH-type transcriptional regulator HdfR [hdfR]"
definition: >-
  The LysR-type transcriptional regulators (LTTRs) form one of the largest and most diverse families of bacterial regulators. These proteins are widely distributed and contribute to various aspects of bacterial metabolism and physiology. LTTRs are typically homotetramers, with each subunit consisting of an N-terminal DNA-binding domain InterPro:IPR000847 and a C-terminal effector-binding domain connected by a long helix InterPro:IPR005119 LTTRs generally function as dual-function repressor-activators, often negatively regulating their own expression while activating other genes. They respond to cellular signals by binding small-molecule ligands (effectors), which induce conformational changes altering DNA interactions and contact with RNA polymerase. Some well-studied members of the LysR family include: AmpR: regulator of β-lactamase expression CatM and CatR: involved in aromatic compound degradation CysB: regulator of cysteine biosynthesis MetR: methionine biosynthesis regulator NhaR: sodium/proton antiporter regulator The hdfR gene encodes a LysR family protein. HdfR is able to bind to the flhDC promoter, indicating that HdfR is a transcriptional regulator for the flagellar master operon. Furthermore, the expression of the hdfR gene was shown to be negatively regulated by H-NS.
