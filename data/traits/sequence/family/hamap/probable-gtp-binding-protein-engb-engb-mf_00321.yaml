identifier: HAMAP:MF_00321
label: "Probable GTP-binding protein EngB [engB]"
definition: >-
  This entry represents a family of GTPases associated with ribosome biogenesis, as typified by YsxC from Bacillus subtilis. This family is widely distributed among bacteria, being found in around eighty percent of currently sequenced bacterial genomes. The proteins are commonly annotated as EngB based on their homology to EngA, one of several other GTPases involved in ribosome biogenesis. Some eukaryotic proteins are included in this entry and probably represent organellar sequences.
