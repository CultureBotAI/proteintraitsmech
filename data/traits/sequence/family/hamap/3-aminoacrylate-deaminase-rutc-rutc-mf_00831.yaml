identifier: HAMAP:MF_00831
label: "3-aminoacrylate deaminase RutC [rutC]"
definition: >-
  RutC from E. coli is essential for growth on uracil as sole nitrogen source. Its function is not known, but it is thought to reduce aminoacrylate peracid to aminoacrylate.
