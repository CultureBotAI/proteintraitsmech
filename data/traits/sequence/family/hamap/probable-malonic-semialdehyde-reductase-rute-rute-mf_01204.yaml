identifier: HAMAP:MF_01204
label: "Probable malonic semialdehyde reductase RutE [rutE]"
definition: >-
  This entry represents the putative NADH dehydrogenase/NAD(P)H nitroreductase RutE family. RutE appears to be a malonic semialdehyde reductase in the Rut pathway for pyrimidine degradation.
