identifier: HAMAP:MF_00989
label: "L-ribulose-5-phosphate 4-epimerase [araD]"
definition: >-
  L-Ribulose-5-phosphate 4-epimerase AraD (EC:5.1.3.4) catalyzes the interconversion of L-ribulose 5-phosphate (L-Ru5P) and D-xylulose 5-phosphate (D-Xu5P). It is one of three enzymes in the AraBAD operon that allow bacteria to utilize arabinose as an energy source by converting it into an intermediate in the pentose phosphate pathway (D-Xu5P). AraD is present in Enterobacteriaceae.
