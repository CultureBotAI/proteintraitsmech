identifier: HAMAP:MF_01605
label: "6-phosphogluconolactonase [pgl]"
definition: >-
  This entry refers to the 6-phosphogluconolactonase YbhE type proteins found mainly in enterobacteriaceae organisms. 6-phosphogluconolactonases (6PGL) are cytosolic enzymes found in all organisms that catalyse the hydrolysis of 6-phosphogluconolactone to 6-phosphogluconic acid in the oxidative phase of the pentose phosphate pathway. Trypanosoma brucei and other characterised 6PGL proteins share an α/β hydrolase fold, with both parallel and anti-parallel β-sheets surrounded by eight α-helices. In Escherichia coli (strain K12), 6PGL (YbhE) is characterised by a 7-bladed β-propeller fold ( ).
definition_source: "InterPro:IPR022528 abstract (HAMAP MF_01605 is a member signature)"
