identifier: HAMAP:MF_01666
label: "Glyoxylate/hydroxypyruvate reductase A [ghrA]"
definition: >-
  This entry represents glyoxylate/hydroxypyruvate reductase A (GrhA) from Enterobacterales. They are implicated in NADPH-dependent reduction of glyoxylate and hydroxypyruvate into glycolate and glycerate, respectively.
