identifier: HAMAP:MF_00524
label: "Glucokinase [glk]"
definition: >-
  Glucokinases ( ) are found in invertebrates and microorganisms and are highly specific for glucose. These enzymes phosphorylate glucose using ATP as a donor to give glucose-6-phosphate and ADP.
