identifier: HAMAP:MF_00057
label: "8-amino-3,8-dideoxy-manno-octulosonate cytidylyltransferase [kdsB]"
definition: >-
  3-Deoxy-D-manno-octulosonate cytidylyltransferase ( EC:2.7.7.38 ) activates KDO, a required 8-carbon sugar, for incorporation into bacterial lipopolysaccharide in Gram-negative bacteria. It acts as a homodimer and catalyses the conversion of CTP and 3-deoxy-D-manno-octulosonate into CMP-3-deoxy-D-manno-octulosonate and pyrophosphate. KDO is an essential component of the lipopolysaccharide found in the outer surface of Gram-negative eubacteria. It is also a constituent of the capsular polysaccharides of some Gram-negative eubacteria. Its presence in the cell wall polysaccharides of green algae and plant were also discovered. However, they have not been found in yeast and animals. The absence of the enzyme in mammalian cells makes it an attractive target molecule for drug design. This family also includes 8-amino-3,8-dideoxy-manno-octulosonate cytidylyltransferase ( EC:2.7.7.90 ). This enzyme activates KDO8N, the 8-aminated form of KDO, for incorporation into bacterial lipopolysaccharide in the Shewanella genus. KDO8N is found exclusively in marine bacteria of the genus Shewanella.
