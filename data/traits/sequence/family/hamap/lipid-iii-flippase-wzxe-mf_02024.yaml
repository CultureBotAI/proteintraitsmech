identifier: HAMAP:MF_02024
label: "Lipid III flippase [wzxE]"
definition: >-
  This entry represents lipid III flippase WzxE from Proteobacteria. WzxE is involved in the Enterobacterial common antigen (ECA) biosynthesis, which is part of bacterial outer membrane biogenesis. ECA is a specific surface antigen (polysaccharide) shared by all members of the Enterobacteriaceae and is restricted to this family. WzxE mediates the transbilayer movement of Und-PP-GlcNAc-ManNAcA-Fuc4NAc (lipid III) from the inner to the outer leaflet of the cytoplasmic membrane during the assembly of ECA. It is required for the assembly of the phosphoglyceride-linked form of ECA (ECA(PG)) and the water-soluble cyclic form of ECA (ECA(CYC)).
definition_source: "InterPro:IPR032896 abstract (HAMAP MF_02024 is a member signature)"
