identifier: HAMAP:MF_00540
label: "Adenosine deaminase [add]"
definition: >-
  Adenosine deaminases ( ) are involved in purine metabolism. They are required for the breakdown of adenosine from food and for the turnover of nucleic acids in tissues. Adenosine deaminases convert adenosine to the related nucleoside inosine by the substitution of the amino group for a hydroxyl group. These enzymes are distantly related to AMP deaminases.
