identifier: HAMAP:MF_04201
label: "Membrane protein [M]"
definition: >-
  This family consists of various Alphacoronavirus matrix proteins which are transmembrane glycoproteins. M proteins play a critical role in protein-protein interactions (as well as protein-RNA interactions) since virus-like particle (VLP) formation in many coronavirus requires only the M and envelope (E) proteins for efficient virion assembly. The M protein or E1 glycoprotein is implicated in virus assembly. The E1 viral membrane protein is required for formation of the viral envelope and is transported via the Golgi complex.
