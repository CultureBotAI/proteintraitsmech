identifier: HAMAP:MF_00247
label: "Soluble pyridine nucleotide transhydrogenase [sthA]"
definition: >-
  This entry represents soluble pyridine nucleotide transhydrogenases mainly found in gammaproteobacteria. Its physiological role is the conversion of NADPH generated by peripheral catabolic pathways to NADH, which can be oxidized for energy generation, maintaining the homeostasis of these two redox cofactors.
