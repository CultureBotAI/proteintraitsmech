identifier: HAMAP:MF_02029
label: "UDP-N-acetyl-D-mannosamine dehydrogenase [wecC]"
definition: >-
  This entry represents UDP-N-acetyl-D-mannosamine dehydrogenase wecC (also known as RffD) from Enterobacteriaceae. WecC is involved in the Enterobacterial common antigen (ECA) biosynthesis, which is part of bacterial outer membrane biogenesis. ECA is a specific surface antigen (polysaccharide) shared by all members of the Enterobacteriaceae and is restricted to this family. It catalyses the four-electron oxidation of UDP-N-acetyl-D-mannosamine (UDP-ManNAc), reducing NAD+ and releasing UDP-N-acetylmannosaminuronic acid.
