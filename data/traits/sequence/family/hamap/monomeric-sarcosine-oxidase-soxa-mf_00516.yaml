identifier: HAMAP:MF_00516
label: "Monomeric sarcosine oxidase [soxA]"
definition: >-
  This set of sequences describe the alpha subunit of a family of known and putative heterotetrameric sarcosine oxidases. Five operons of such oxidases are found in Rhizobium loti (Mesorhizobium loti) and three in Agrobacterium tumefaciens, a high enough copy number to suggest that not all members share the same function. Sarcosine oxidase catalyzes the oxidative demethylation of sarcosine to glycine. The reaction converts tetrahydrofolate to 5,10-methylene-tetrahydrofolate.
definition_source: "InterPro:IPR006281 abstract (HAMAP MF_00516 is a member signature)"
