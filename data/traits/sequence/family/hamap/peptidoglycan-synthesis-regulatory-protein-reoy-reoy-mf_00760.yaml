identifier: HAMAP:MF_00760
label: "Peptidoglycan synthesis regulatory protein ReoY [reoY]"
definition: >-
  This family includes Peptidoglycan synthesis regulatory protein ReoY ( UniProtKB:Q8Y5Y2 ) which is involved in the PASTA kinase-mediated signalling pathway regulating peptidoglycan synthesis to maintain cell wall integrity. It modulates peptidoglycan (PG) synthesis pathway committed-step enzyme MurA. ReoY positively modulates ClpCP-dependent proteolysis of MurA, thereby regulating PG synthesis and inhibiting intrinsic cephalosporin resistance.
definition_source: "InterPro:IPR011188 abstract (HAMAP MF_00760 is a member signature)"
