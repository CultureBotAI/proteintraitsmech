identifier: HAMAP:MF_02014
label: "Cell division suppressor protein YneA [yneA]"
definition: >-
  The YneA protein is responsible for cell division suppression during the SOS response in Bacillus subtilis. Localization of the FtsZ protein to the cell division site was reduced in dinR-disrupted or yneA-expressing cells, further suggesting that the YneA protein suppresses cell division through the suppression of FtsZ ring formation. Interestingly, the B. subtilis YneA protein is structurally and phylogenetically unrelated to its functional counterpart in Escherichia coli, SulA (see InterPro:IPR004596).
