identifier: HAMAP:MF_00180
label: "3,4-dihydroxy-2-butanone 4-phosphate synthase [ribB]"
definition: >-
  3,4-dihydroxy-2-butanone 4-phosphate synthase ( ) (DHBP synthase) (RibB) catalyses the conversion of D-ribulose 5-phosphate to formate and 3,4-dihydroxy-2-butanone 4-phosphate, the latter serving as the biosynthetic precursor for the xylene ring of riboflavin. In Photobacterium leiognathi, the riboflavin synthesis genes ribB (DHBP synthase), ribE (riboflavin synthase), ribH (lumazone synthase) and ribA (GTP cyclohydrolase II) all reside in the lux operon. RibB is sometimes found as a bifunctional enzyme with GTP cyclohydrolase II that catalyses the first committed step in the biosynthesis of riboflavin ( ). No sequences with significant homology to DHBP synthase are found in the metazoa.
definition_source: "InterPro:IPR000422 abstract (HAMAP MF_00180 is a member signature)"
