identifier: HAMAP:MF_01266
label: "Probable L-ascorbate-6-phosphate lactonase UlaG [ulaG]"
definition: >-
  These proteins catalyse the hydrolysis of L-ascorbate-6-P into 3-keto-L-gulonate-6-P, which is essential for L-ascorbate utilization under anaerobic conditions. UlaG is a manganese-dependent l-ascorbate-6-P lactonase that catalyses the hydrolysis of L-ascorbate-6-phosphate to 3-keto-L-gulonate-6-phosphate superfamily.
