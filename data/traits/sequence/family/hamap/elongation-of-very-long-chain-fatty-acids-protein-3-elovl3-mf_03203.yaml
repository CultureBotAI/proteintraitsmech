identifier: HAMAP:MF_03203
label: "Elongation of very long chain fatty acids protein 3 [ELOVL3]"
definition: >-
  Elongation of very long chain fatty acids protein 3 (ELOVL3, also known as very long chain fatty acid elongase 3) is a component of the the long-chain fatty acids elongation cycle. It is a transmembrane enzyme in the endoplasmic reticulum that adds two carbons per cycle to long- and very long-chain fatty acids with a higher activity toward C18 acyl-CoAs, especially C18:0 acyl-CoAs.
