identifier: HAMAP:MF_00252
label: "Lysine--tRNA ligase [lysS]"
definition: >-
  This entry represents lysine-tRNA ligase class II. Lysine-tRNA synthesis is catalysed by two unrelated families of tRNA ligases: class-I or class-II. In eubacteria and eukaryota lysine-tRNA ligases belong to class II, the same family as aspartyl tRNA ligase. The lysine-tRNA ligase class Ic family is present in archaea and some eubacteria. Moreover in some eubacteria there is a gene X, which is similar to a part of lysine-tRNA ligase from class II. Lysine-tRNA ligase is duplicated in some species with, for example in Escherichia coli, as a constitutive gene (lysS) and an induced one (lysU). No residues are directly involved in catalysis, but a number of highly conserved amino acids and three metal ions coordinate the substrates and stabilise the pentavalent transition state. Lysine is activated by being attached to the alpha-phosphate of AMP before being transferred to the cognate tRNA. The refined crystal structures give "snapshots" of the active site corresponding to key steps in the aminoacylation reaction and provide the structural framework for understanding the mechanism of lysine activation. The active site of LysU is shaped to position the substrates for the nucleophilic attack of the lysine carboxylate on the ATP alpha-phosphate. No residues are directly involved in catalysis, but a number of highly conserved amino acids and three metal ions coordinate the substrates and stabilise the pentavalent transition state. A loop close to the catalytic pocket, disordered in the lysine-bound structure, becomes ordered upon adenine binding. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomer
