identifier: HAMAP:MF_00723
label: "Glutathione-dependent formaldehyde-activating enzyme [gfa]"
definition: >-
  This entry represents glutathione-dependent formaldehyde-activating enzyme, also known as S-(hydroxymethyl)glutathione synthase, an enzyme that converts glutathione and formaldehyde into S-(hydroxymethyl)glutathione. The reaction of glutathione and formaldehyde to form S-(hydroxymethyl)glutathione occurs naturally, but this enzyme speeds its formation in some species as part of a pathway of formaldehyde detoxification.
