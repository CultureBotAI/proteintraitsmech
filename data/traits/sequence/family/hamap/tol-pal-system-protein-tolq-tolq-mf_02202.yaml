identifier: HAMAP:MF_02202
label: "Tol-Pal system protein TolQ [tolQ]"
definition: >-
  TolQ is one of the essential components of the Tol-Pal system. Together with TolR, it harnesses proton motive force to energize TolA, which spans the periplasm to reach the complex of TolB and Pal at the outer member. The tol-pal system proves to be important for maintaining outer membrane integrity. Gene pairs similar to the TolQ and TolR gene pair often number several per genome, but this entry describes TolQ specifically, as found in tol-pal operons. A close homologue, excluded from this entry, is ExbB of the ExbB/ExbD/TonB protein complex, which powers transport of siderophores and vitamin B12 across the bacterial outer membrane. The Tol-Pal system is exploited by colicin and filamentous phage DNA to enter the cell. It is also implicated in pathogenesis in several bacterial species.
definition_source: "InterPro:IPR014163 abstract (HAMAP MF_02202 is a member signature)"
