identifier: HAMAP:MF_02221
label: "Carbamoyl-phosphate synthase"
definition: >-
  This entry includes carbamoyl-phosphate synthase (CPSase) from archaea, including MS-s from M. smithii. MS-s is homologous to the CPS.B subdomain of E. coli but is significantly smaller, 367 vs 513 residues, respectively. It synthesises carbamoyl phosphate from ATP, bicarbonate, and ammonia, and catalyses the same ATP-dependent partial reactions observed for full-length CPSases.
