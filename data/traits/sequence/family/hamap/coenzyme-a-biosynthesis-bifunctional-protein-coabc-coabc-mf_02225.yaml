identifier: HAMAP:MF_02225
label: "Coenzyme A biosynthesis bifunctional protein CoaBC [coaBC]"
definition: >-
  This entry represents a bifunctional enzyme CoaBC (gene name dfp) that catalyses the second and third steps (cysteine ligation, (EC:6.3.2.5), and decarboxylation, (EC:4.1.1.36)) in the biosynthesis of coenzyme A (CoA) from pantothenate in bacteria. This enzyme contains the FMN cofactor, but no FAD or pyruvoyl group. The amino-terminal region is responsible for the phosphopantothenoylcysteine decarboxylase activity. The protein product of the dfp gene in Escherichia coli was found to be able to restore a temperature-sensitive conditionally lethal mutation that resulted in a slow cessation of DNA synthesis. The protein encoded by dfp was then found to affect both DNA and pantothenate metabolism. Later, phosphopantothenate-cysteine ligase activity, which is involved in the biosynthesis of coenzyme A, was demonstrated in the same protein. Therefore this protein has been named bifunctional protein CoaBC.
definition_source: "InterPro:IPR005252 abstract (HAMAP MF_02225 is a member signature)"
