identifier: HAMAP:MF_03064
label: "Mitochondrial glycine transporter [SLC25A38]"
definition: >-
  This entry includes a group of mitochondrial glycine transporters, including Hem25 from budding yeasts and SLC25A38 from humans. They transport glycine into mitochondria for initiation of heme biosynthesis. Solute carrier family 25 member 38 (SLC25A38) belongs to the SLC25 family, whose members are inner mitochondrial membrane transporters promoting the exchange of one metabolite for another across the inner mitochondrial membrane. Mutations in the SLC25A38 gene cause nonsyndromic autosomal recessive congenital sideroblastic anemia.
