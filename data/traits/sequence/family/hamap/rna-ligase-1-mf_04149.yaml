identifier: HAMAP:MF_04149
label: "RNA ligase 1"
definition: >-
  Members of this family are phage proteins with ATP-dependent RNA ligase activity. Host defence to phage may include cleavage and inactivation of specific tRNA molecules; members of this family act to reverse this RNA damage. The enzyme is adenylated, transiently, on a Lys residue in a motif KXDGSL. The structure of T4 RNA ligase 1 ligase has been revealed.
