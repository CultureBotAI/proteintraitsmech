identifier: HAMAP:MF_00912
label: "Cell division protein DivIB [divIB]"
definition: >-
  DivIB is a cell division protein from Gram-positive bacteria, probably homologous to Escherichia coli FtsQ. DivIB interacts with FtsL, DivIC and PBP-2B. DivIB plays an essential role in division at high temperatures, maybe by protecting FtsL from degradation or by promoting formation of the FtsL-DivIC complex. It is also required for efficient sporulation at all temperatures.
