identifier: HAMAP:MF_01657
label: "Acetaldehyde dehydrogenase [mhpF]"
definition: >-
  The acetaldehyde dehydrogenase family ( ) of bacterial enzymes catalyse the formation of acetyl-CoA from acetaldehyde in the 3-hydroxyphenylpropinoate degradation pathway. It occurs as a late step in the meta-cleavage pathways of a variety of compounds, including catechol, biphenyl, toluene, salicylate. Members of this entry heterodimerise with members of to form a bifunctional aldolase-dehydrogenase. Members of this protein family are acetaldehyde dehydrogenase (acetylating),. This enzyme oxidizes acetaldehyde, using NAD(+), and attaches coenzyme A (CoA), yielding acetyl-CoA., etc.
