identifier: HAMAP:MF_01657
label: "Acetaldehyde dehydrogenase [mhpF]"
definition: >-
  The acetaldehyde dehydrogenase family (EC:1.2.1.10) of bacterial enzymes catalyse the formation of acetyl-CoA from acetaldehyde in the 3-hydroxyphenylpropinoate degradation pathway. It occurs as a late step in the meta-cleavage pathways of a variety of compounds, including catechol, biphenyl, toluene, salicylate. Members of this entry heterodimerise with members of InterPro:IPR000891 to form a bifunctional aldolase-dehydrogenase. Members of this protein family are acetaldehyde dehydrogenase (acetylating), EC:1.2.1.10. This enzyme oxidizes acetaldehyde, using NAD(+), and attaches coenzyme A (CoA), yielding acetyl-CoA., etc.
definition_source: "InterPro:IPR003361 abstract (HAMAP MF_01657 is a member signature)"
