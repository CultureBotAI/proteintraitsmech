identifier: HAMAP:MF_01195
label: "N-acetylneuraminate epimerase [nanM]"
definition: >-
  This entry represents N-acetylneuraminate epimerase from Escherichia coli (NanM, also known as YjhT) and similar proteobacterial proteins. NanM converts alpha-N-acetylneuranimic acid (Neu5Ac) to the beta-anomer, accelerating the equilibrium between the alpha- and beta-anomers. This enzyme probably facilitates sialidase-negative bacteria to compete sucessfully for limited amounts of extracellular Neu5Ac, which is likely taken up in the beta-anomer. In addition, the rapid removal of sialic acid from solution might be advantageous to the bacterium to damp down host responses. Besides, it forms linear aceneuramate during interconversion of Neu5Ac anomers. Some species carry what appears to be a cyclically permuted homologue of this protein.
definition_source: "InterPro:IPR019936 abstract (HAMAP MF_01195 is a member signature)"
