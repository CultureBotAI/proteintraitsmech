identifier: HAMAP:MF_01383
label: "Photosystem II D2 protein [psbD]"
definition: >-
  This family represents the D2 protein (PsbD), which forms the reaction core of PSII as a heterodimer with the D1 protein. The accumulation of D2 protein appears to be a key step in the assembly of the PSII reaction centre complex. In higher plants, the N-terminal residues of both proteins, which are exposed to the stromal surface, can be reversibly phosphorylated. The D1/D2 core binds to a number of cofactors, including: a 4-atom manganese cluster, which is located on the lumenal surface of the D1 and D2 proteins; two pheophytin molecules, only one of which is phytochemically active; non-haem iron; and two quinones, Qa (bound to D2) and Qb (bound to D1). Upon light excitation, an electron is transferred from the primary donor (chlorophyll a) via intermediate acceptor pheophytin to the primary quinone Qa, then to the secondary quinone Qb. At the oxidising side of PSII, a redox-active residue in the D1 protein reduces P680, the oxidised tyrosine then withdrawing electrons from a manganese cluster, which in turn withdraw electrons from water, leading to the splitting of water and the formation of molecular oxygen. PSII thus provides a source of electrons that can be used by photosystem I to produce the reducing power (NADPH) required to convert CO2 to glucose. Oxygenic photosynthesis uses two multi-subunit photosystems (I and II) located in the cell membranes of cyanobacteria and in the thylakoid membranes of chloroplasts in plants and algae. Photosystem II (PSII) has a P680 reaction centre containing chlorophyll 'a' that uses light energy to carry out the oxidation (splitting) of water molecules, and to produce ATP via a proton pump. Photosystem I (PSI) has a P700 reaction centre containing chlorophyll that takes the electron and associated hydrogen donated from PSII to r
