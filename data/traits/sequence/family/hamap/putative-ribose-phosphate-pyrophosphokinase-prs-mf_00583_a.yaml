identifier: HAMAP:MF_00583_A
label: "Putative ribose-phosphate pyrophosphokinase [prs]"
definition: >-
  This family consists of archaeal enzymes. PRPP from Methanocaldococcus jannaschii differ from previously characterised bacterial PRPP synthases by its tetrameric quaternary structure and the simultaneous phosphate ion-activation and lack of allosteric inhibition, and constitute a novel class of PRPP synthases. Ribose-phosphate diphosphokinase, also known as ribose-phosphate pyrophosphokinase (RPPK), or phosphoribosyldiphosphate synthetase ( ), catalyses the transfer of an intact diphosphate (PP) group from ATP to ribose-5-phosphate (R-5-P), which results in the formation of AMP and 5-phospho-D-ribosyl--1-diphosphate (PRPP).
definition_source: "InterPro:IPR037514 abstract (HAMAP MF_00583_A is a member signature)"
