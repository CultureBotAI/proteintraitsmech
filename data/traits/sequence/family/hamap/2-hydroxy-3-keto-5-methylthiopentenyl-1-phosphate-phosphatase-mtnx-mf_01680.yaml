identifier: HAMAP:MF_01680
label: "2-hydroxy-3-keto-5-methylthiopentenyl-1-phosphate phosphatase [mtnX]"
definition: >-
  This entry represents 2-hydroxy-3-keto-5-methylthiopentenyl-1-phosphate phosphatase, MtnX, which is involved in methionine salvage and belongs to the HAD-superfamily hydrolases, subfamily IB. This enzyme is found in Bacillus subtilis and related species, paired with MtnW (InterPro:IPR017717). In most species that recycle methionine from methylthioadenosine, the single protein MtnC replaces the MtnW/MtnX pair. In B. subtilis, mtnX was first known as ykrX.
