identifier: HAMAP:MF_03117
label: "Enolase-phosphatase E1 [ENOPH1]"
definition: >-
  This entry represents the enolase-phosphatase E1 (ENOPH1, also known as MASA) from eukaryotes. ENOPH1 is a bifunctional enzyme that promotes the conversion of 2,3-diketo-5-methylthio-1-phosphopentane to 1,2-dihydroxy-3-keto-5-methylthiopentene anion (an aci-reductone) in the methionine salvage pathway. Besides its function as a phosphatase, it possesses enolase activity that cannot be classified as typical enzymatic enolisation. It's structure has been resolved.
