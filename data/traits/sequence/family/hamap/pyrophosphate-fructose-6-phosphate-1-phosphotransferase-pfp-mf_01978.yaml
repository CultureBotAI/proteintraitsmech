identifier: HAMAP:MF_01978
label: "Pyrophosphate--fructose 6-phosphate 1-phosphotransferase [pfp]"
definition: >-
  This entry represents pyrophosphate--fructose 6-phosphate 1-phosphotransferase, initially described as XF0274 type. It catalyses the phosphorylation of D-fructose 6-phosphate, the first committing step of glycolysis.
