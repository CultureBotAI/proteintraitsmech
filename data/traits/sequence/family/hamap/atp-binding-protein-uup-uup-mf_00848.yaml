identifier: HAMAP:MF_00848
label: "ATP-binding protein Uup [uup]"
definition: >-
  Uup is an ATP-binding cassette (ABC) protein of the F type (ABCF). It has ATPase activity and possesses two nucleotide binding domains which comprise Walker A/B motifs connected by a linker and a coiled-coil C-terminal domain. It binds double-stranded DNA with no sequence specificity. The Uup ATPase activity functions cooperatively thus the inactivation of one site suppresses all ATP hydrolytic activity. It is implicated in precise excision of transposons. It bind to branched DNAs and is involved in resolution of branched DNA intermediates that result from template switching in post replication gaps.It may also be involved in the 50S ribosome subunit assembly due to its genetic interaction with translational GTPase BipA.
