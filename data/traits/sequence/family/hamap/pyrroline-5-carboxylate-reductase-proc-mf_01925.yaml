identifier: HAMAP:MF_01925
label: "Pyrroline-5-carboxylate reductase [proC]"
definition: >-
  Pyrroline-5-carboxylate reductase (P5CR) (EC:1.5.1.2) is the enzyme that catalyses the terminal step in the biosynthesis of proline from glutamate, the NAD(P) dependent oxidation of 1-pyrroline-5-carboxylate into proline. This enzyme is also able to convert delta-1-piperideine-6-carboxylate (P6C) into pipecolic acid; this activity is part of pathway for the biosynthesis of the cyclic tetrapeptide apicidin F in the fungus Fusarium fujikuroi. This entry also includes the pyrroline-5-carboxylate reductase ucsG from Acremonium sp., which is part of the gene cluster that mediates the biosynthesis of UCS1025A, a member of the pyrrolizidinone family that is a strong telomerase inhibitor and displays potent antibacterial and antitumor properties. This entry also includes Delta-1-pyrroline-5-carboxylate reductase kk1I, part of the gene cluster that mediates the biosynthesis of KK-1, a novel cyclic depsipeptide with 10 residues which is a promising active compound with high activity against many plant pathogens, especially Botrytis cinerea.
definition_source: "InterPro:IPR000304 abstract (HAMAP MF_01925 is a member signature)"
