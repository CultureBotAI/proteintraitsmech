identifier: HAMAP:MF_00973
label: "Gluconeogenesis factor"
definition: >-
  In Bacillus subtilis the gluconeogenesis factor is required for morphogenesis under gluconeogenic growth conditions. It is required for the correct localisation of penicillin-binding protein PBP1, and hence for displaying a normal rod shape.
