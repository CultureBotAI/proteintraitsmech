identifier: HAMAP:MF_01917
label: "Cardiolipin synthase B [clsB]"
definition: >-
  Cardiolipin (CL) synthases catalyse the reversible phosphatidyl group transfer from one phosphatidylglycerol molecule to another to form cardiolipin (diphosphatidylglycerol) and glycerol. In E. coli, three genes encoding CLs have been identified as clsA/B/C. This entry includes ClsB (also known as ybhO) from E. coli and other Proteobacteria.
