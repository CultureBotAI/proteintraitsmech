identifier: HAMAP:MF_00350
label: "DNA repair and recombination protein RadB [radB]"
definition: >-
  The RadB family of archaeal proteins is involved in DNA repair and in homologous recombination. The proteins contain a conserved triplet of residues (Lys-His-Arg) at their C terminus that is crucial for DNA binding. RadB does not catalyse strand exchange and does not turn over ATP efficiently. It has been shown to inhibit Holliday junction resolution by Hjc in the absence of ATP, but has little effect when ATP is present.
