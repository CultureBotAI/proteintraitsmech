identifier: HAMAP:MF_01831
label: "Cysteine desulfurase [sufS]"
definition: >-
  Cysteine desulfurases are pyridoxal-phosphate enzymes which catalyse the removal of sulphur from L-cysteine to form L-alanine and elemental sulphur. These enzymes have been shown to play an important role in the biosynthesis of iron-sulphur clusters, thionucleosides in tRNA, thiamine, biotin, lipoate and molydopterin. This entry represents a subfamily of NifS-related cysteine desulfurases that are often involved in iron-sulphur cluster formation, which is needed for nitrogen fixation and other vital functions. Many of these enzymes, in addition to cysteine desulfurase activity, also show selenocysteine lyase activity where L-selenocysteine is converted to L-alanine and selenide. Some of these enzymes are much more specific for selenocysteine than cysteine and are thus believed to function in selenium metabolism rather than sulphur metabolism. Structural studies of the Escherichia coli and Synechocystis enzymes indicate that they are homodimers which show a similar fold to other members of the alpha family of pyridoxal-phosphate enzymes.
