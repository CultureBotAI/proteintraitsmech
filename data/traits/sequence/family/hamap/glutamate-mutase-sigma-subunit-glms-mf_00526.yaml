identifier: HAMAP:MF_00526
label: "Glutamate mutase sigma subunit [glmS]"
definition: >-
  This entry represents the sigma subunit (GlmS) of glutamate mutase, a cobalamin-dependent enzyme that catalyses the first step in a pathway of glutamate fermentation. It catalyses the carbon skeleton rearrangement of L-glutamate to L-threo-3-methylaspartate ((2S,3S)-3-methylaspartate). The rearrangement reaction is initiated by the extraction of a hydrogen from the protein-bound substrate by a 5'-desoxyadenosyl radical, which is generated by the homolytic cleavage of the organometallic bond of the cofactor B12. The enzyme consists of an heterotetramer of 2 epsilon subunits (GlmE) and 2 sigma subunits (GlmS).
definition_source: "InterPro:IPR006394 abstract (HAMAP MF_00526 is a member signature)"
