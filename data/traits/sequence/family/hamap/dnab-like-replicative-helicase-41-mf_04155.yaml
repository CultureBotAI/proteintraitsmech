identifier: HAMAP:MF_04155
label: "DnaB-like replicative helicase [41]"
definition: >-
  This entry represents DnaB-like replicative helicase (also known as gp41) from Bacteriophage T4, an ATP-dependent DNA helicase essential for viral DNA replication and recombination. This protein moves 5'->3' on the lagging strand template, unwinding the DNA duplex ahead of the leading strand polymerase at the replication fork and generating ssDNA for both leading and lagging strand synthesis. It interacts with the primase, which allows the primase to initiate lagging strand synthesis and fully activates the helicase. This helicase is loaded by the helicase assembly factor on replication forks that begin at discrete replication origin sequences, as well as on forks that are created during recombination.
definition_source: "InterPro:IPR046393 abstract (HAMAP MF_04155 is a member signature)"
