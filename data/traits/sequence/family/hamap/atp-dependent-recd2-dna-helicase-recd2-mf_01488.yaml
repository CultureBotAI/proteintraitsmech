identifier: HAMAP:MF_01488
label: "ATP-dependent RecD2 DNA helicase [recD2]"
definition: >-
  These sequences represent a family similar to RecD from the RecBCD enzyme InterPro:IPR006344. Members of this family, however, are not found in a context of RecB and RecC and are longer by about 200 amino acids at the amino end. In Deinococcus radiodurans RecD2 is a DNA helicase with 5'-3' polarity and low processivity. Chlamydia muridarum has both a member of this family and a RecD.
definition_source: "InterPro:IPR006345 abstract (HAMAP MF_01488 is a member signature)"
