identifier: HAMAP:MF_01969
label: "Kynurenine formamidase [kynB]"
definition: >-
  One of several pathways of tryptophan degradation is as follows: Tryptophan 2,3-dioxygenase (EC:1.13.11.11) uses 02 to convert Trp to L-formylkynurenine. Kynurenine formamidase (EC:3.5.1.9) hydrolyses the product to L-kynurenine and formate. Kynureninase (EC:3.7.1.3) hydrolyses L-kynurenine to anthranilate plus alanine. Members of this entry are predicted bacterial metal-dependent hydrolases. All are supported as kynurenine formamidase (EC:3.5.1.9) by an operon structure in which kynureninase and/or tryptophan 2,3-dioxygenase genes are adjacent. The members from Bacillus cereus, Pseudomonas aeruginosa and Ralstonia metallidurans (strain CH34) have been characterised. An example from Pseudomonas fluorescens is given the gene symbol qbsH instead of kynB because of its role in quinolobactin biosynthesis, which begins with tryptophan. All members of this family should be kynurenine formamidase (EC:3.5.1.9). Synonym(s): Arylformamidase, N-formylkynurenine formamidase
