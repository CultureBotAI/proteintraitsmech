identifier: HAMAP:MF_02115
label: "FAD synthase [ribL]"
definition: >-
  FAD synthases convert flavin mononucleotide (FMN) to flavin adenine dinucleotide (FAD) by the addition of the AMP portion of ATP. RibL is, currently, the only identified archaeal FAD synthase. This protein is not related to the eukarytoic or bacterial enzymes and contains no known motifs for FMN or FAD binding, suggesting that it contains a novel flavin binding site. Unlike most other FAD synthases, RibL does not catalyse the reverse reaction to produce FMN and ATP from FAD.
definition_source: "InterPro:IPR024902 abstract (HAMAP MF_02115 is a member signature)"
