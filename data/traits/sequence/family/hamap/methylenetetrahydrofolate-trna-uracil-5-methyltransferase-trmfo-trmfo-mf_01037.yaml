identifier: HAMAP:MF_01037
label: "Methylenetetrahydrofolate--tRNA-(uracil-5-)-methyltransferase TrmFO [trmFO]"
definition: >-
  Proteins in this entry catalyse the folate-dependent formation of 5-methyl-uridine at position 54 (M-5-U54) in all tRNAs. They are closely related to GidA (glucose-inhibited division protein A, also known as MnmG), a protein involved in tRNA modification in bacteria and mitochondria.
