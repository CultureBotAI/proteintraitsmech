identifier: HAMAP:MF_00497_B
label: "Glycerol-1-phosphate dehydrogenase [NAD(P)+] [egsA]"
definition: >-
  Glycerol-1-phosphate dehydrogenase is found primarily as a Zn 2+ -dependent form in archaea (see InterPro:IPR023002); however a Ni 2+ -dependent form has been found in Gram-positive bacteria.
