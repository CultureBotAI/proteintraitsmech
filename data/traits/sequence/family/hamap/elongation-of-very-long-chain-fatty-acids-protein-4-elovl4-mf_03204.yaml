identifier: HAMAP:MF_03204
label: "Elongation of very long chain fatty acids protein 4 [ELOVL4]"
definition: >-
  Elongation of very long chain fatty acids protein 4 (ELOVL4, also known as very long chain fatty acid elongase 4) is a component of the the long-chain fatty acids elongation cycle. It is a transmembrane enzyme in the endoplasmic reticulum that adds two carbons per cycle to long- and very long-chain fatty acids with a preference for elongating C24:0 and C26:0 acyl-CoAs.
