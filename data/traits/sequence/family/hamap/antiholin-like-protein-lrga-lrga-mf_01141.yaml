identifier: HAMAP:MF_01141
label: "Antiholin-like protein LrgA [lrgA]"
definition: >-
  This entry contains bacterial antiholin-like LrgA proteins, which have been shown to modulate murein hydrolase activity. Together with holin-like CidA, LrgA function to control cell death and lysis during biofilm development.
