identifier: HAMAP:MF_00987
label: "L-fuculose phosphate aldolase [fucA]"
definition: >-
  L-fuculose phosphate aldolase converts L-fuculose 1-phosphate to glycerone phosphate + (S)-lactaldehyde. The structure of the class II zinc-ion dependent L-fuculose-1-phosphate aldolase from Escherichia coli has been established at 1.92 A resolution. The homo-tetrameric enzyme has a molecular mass of 4 x 24kDa and follows C(4) symmetry. The four catalytic centres are located in deep clefts at the interfaces of adjacent subunits. The zinc ion is coordinated by three histidines and one glutamate in an almost tetrahedral arrangement. In contrast to numerous other catalytically competent zinc ions, there is no water molecule in the ligand sphere. Sequence homology searches revealed a significant similarity to the bacterial L-ribulose-5-phosphate 4-epimerase,. This entry also includes 5-methylthioribulose-1-phosphate/5-deoxyribulose-1-phosphate aldolase which uses 5-methylthioribulose-1-phosphate or 5-deoxyribulose-1-phosphate to produce acetaldehyde and dihydroxyacetone phosphate, with 10-fold greater catalytic efficiency compared to FucA. This enzyme participates in the bifunctional DHAP-shunt salvage pathway for SAM by-products.
