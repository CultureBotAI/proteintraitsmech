identifier: HAMAP:MF_01165
label: "Undecaprenyl phosphate-alpha-4-amino-4-deoxy-L-arabinose arabinosyl transferase [arnT]"
definition: >-
  This entry represents the bacterial undecaprenyl phosphate-alpha-4-amino-4-deoxy-L-arabinose arabinosyl transferases. This family of proteins are a subset of the glycosyltransferase 39 family and are responsible for the transfer of the L-Ara4N moiety of the glycolipid undecaprenyl phosphate-alpha-L-Ara4N to lipid A. The modified arabinose is attached to lipid A and is required for resistance to polymyxin and cationic antimicrobial peptides.
definition_source: "InterPro:IPR022839 abstract (HAMAP MF_01165 is a member signature)"
