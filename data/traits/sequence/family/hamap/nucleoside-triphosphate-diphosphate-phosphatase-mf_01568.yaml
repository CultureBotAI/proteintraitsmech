identifier: HAMAP:MF_01568
label: "Nucleoside triphosphate/diphosphate phosphatase"
definition: >-
  This entry represents Nucleoside triphosphate/diphosphate phosphatase from Staphylococcus aureus (SA1684, UniProtKB:Q7A4T2) and similar sequences predominantly found in firmicutes. This protein, which shows nucleoside phosphatase activity towards nucleoside triphosphates and nucleoside diphosphates, has a significant effect on the proliferation of S. aureus colonies and the killing ability of the host. Members of this family contain the domain (InterPro:IPR007295).
