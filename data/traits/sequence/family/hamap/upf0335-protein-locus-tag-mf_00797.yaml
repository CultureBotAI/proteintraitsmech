identifier: HAMAP:MF_00797
label: "UPF0335 protein <locus_tag>"
definition: >-
  GapR is a nucleoid-associated protein (NAP) critical for cellular function in Caulobacter crescentus (also known as Caulobacter vibrioides). Loss of GapR causes severe defects in growth, cell division, DNA replication, and chromosome segregation. This is a DNA-binding protein which has mainly an α-helical secondary structure. In the absence of DNA, GapR is a dimer, with each monomer folded into two extended α-helices, while in the presence of DNA, GapR forms a tetramer, with the C-terminal α-helix of each monomer reorganised into two shorter helices, which allows GapR to encircle the DNA. This entry represents GapR-like from Caulobacter and similar proteins predominantly found in Alphaproteobacteria.
