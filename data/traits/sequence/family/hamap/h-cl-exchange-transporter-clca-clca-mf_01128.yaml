identifier: HAMAP:MF_01128
label: "H(+)/Cl(-) exchange transporter ClcA [clcA]"
definition: >-
  This entry represents a proton-coupled chloride transporter, which functions as an antiport system and exchanges two chloride ions for one proton. It probably acts as an electrical shunt for an outwardly-directed proton pump that is linked to amino acid decarboxylation, as part of the extreme acid resistance (XAR) response.
