identifier: HAMAP:MF_03106
label: "Sulfate adenylyltransferase [MET3]"
definition: >-
  Sulfate adenylyltransferase ( EC:2.7.7.4 ) catalyses the first intracellular reaction of sulfate assimilation, forming adenosine-5'-phosphosulfate (APS) from inorganic sulfate and ATP. It plays an important role in sulfate activation as a component of the biosynthesis pathway of sulfur-containing amino acids. It is often found as a fusion protein with adenylylsulphate kinase.
