identifier: HAMAP:MF_00943
label: "Maleate isomerase [maiA]"
definition: >-
  Maleate isomerase catalyses the conversion of maleate to fumarate. In Pseudomonas putida, maleate isomerase (maiA or nicE) is involved in the aerobic nicotinate degradation pathway.
