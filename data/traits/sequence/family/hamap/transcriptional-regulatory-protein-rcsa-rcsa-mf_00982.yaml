identifier: HAMAP:MF_00982
label: "Transcriptional regulatory protein RcsA [rcsA]"
definition: >-
  RcsA is a component of the Rcs phosphorelay signaling system. Pathways regulated by the Rcs system include maintenance of cell wall integrity, cell division, motility, and virulence. The pathway involves a histidine kinase (RcsC), a response regulator (RcsB), a phospho-transfer protein (RcsD), a signal transductor (RcsF) and the auxiliary activator protein (RcsA). The response regulator RcsB associates with an unstable protein RcsA to bind to an RcsAB box in the promoter region of several genes, though not all genes require RcsA. RcsA and RcsB regulate the polysialic and colanic acids metabolism in Escherichia coli.
definition_source: "InterPro:IPR030866 abstract (HAMAP MF_00982 is a member signature)"
