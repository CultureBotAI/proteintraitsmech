identifier: HAMAP:MF_02071
label: "Endolytic peptidoglycan transglycosylase RlpA [rlpA]"
definition: >-
  Rare lipoprotein A (RlpA) is an outer membrane protein that localises to the septal ring and scattered foci along the lateral wall in Escherichia coli. In Pseudomonas aeruginosa, RlpA is a lytic transglycosylase with preference for naked glycan strands that is needed for efficient separation of daughter cells and maintenance of rod shape.
