identifier: HAMAP:MF_01173
label: "Succinylornithine transaminase [astC]"
definition: >-
  Succinylornithine transaminase catalyzes the transamination of N(2)-succinylornithine and alpha-ketoglutarate into N(2)-succinylglutamate semialdehyde and glutamate. It can also act as an acetylornithine aminotransferase.
