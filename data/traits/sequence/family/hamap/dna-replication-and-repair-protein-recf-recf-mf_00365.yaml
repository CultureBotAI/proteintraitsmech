identifier: HAMAP:MF_00365
label: "DNA replication and repair protein RecF [recF]"
definition: >-
  RecF belongs to the AAA+ superfamily of ATPases. All proteins in this family, including recF, are DNA binding proteins that assist the filamentation of RecA onto DNA for the initiation of recombination or recombinational repair. RecF is involved in DNA metabolism and is required for recombinational DNA repair and for induction of the SOS response. The AAA+ superfamily of ATPases is found in all kingdoms of living organisms where they participate in diverse cellular processes including membrane fusion, proteolysis and DNA replication. Although the terms AAA+ and AAA are often used loosely and interchangeably, the classical AAA family members are distinguished by their possession of the SRH region in the AAA module. Many AAA+ proteins are involved in similar processes to those of AAA proteins (facilitation of protein folding and unfolding, assembly or disassembly of proteins complexes, protein transport and degradation), but others function in replication, recombination, repair and transcription. For a review see.
