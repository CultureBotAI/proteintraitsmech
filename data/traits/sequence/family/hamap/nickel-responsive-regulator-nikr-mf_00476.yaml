identifier: HAMAP:MF_00476
label: "Nickel-responsive regulator [nikR]"
definition: >-
  NikR is the transcriptional repressor of the nickel-specific transport system nikABCDE. NikR is a protein of the ribbon-helix-helix family of transcription factors and is active in the presence of excessive concentrations of intracellular nickel.
