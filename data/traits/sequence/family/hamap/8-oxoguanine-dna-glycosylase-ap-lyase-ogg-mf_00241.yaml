identifier: HAMAP:MF_00241
label: "8-oxoguanine DNA glycosylase/AP lyase [ogg]"
definition: >-
  This entry represents bifunctional, thermostable 8-oxoguanine DNA glycosylase/DNA lyase enzymes (OGG or OG glycosylases), which are involved in base excision repair of DNA damaged by oxidation or by mutagenic agents. Most damage to bases in DNA is repaired by the base excision repair pathway. These enzymes have both DNA glycosylase activity ( ) and AP lyase activity ( ). OGG1 enzymes are active only towards the removal of 8-oxoguanine.
