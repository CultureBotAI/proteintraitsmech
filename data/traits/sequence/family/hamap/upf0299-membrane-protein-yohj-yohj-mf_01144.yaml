identifier: HAMAP:MF_01144
label: "UPF0299 membrane protein YohJ [yohJ]"
definition: >-
  This family, UPF0299, is represented by YohJ, an inner membrane protein with four predicted transmembrane domains; the C terminus is located in the periplasm. The proteins in this entry are functionally uncharacterised.
