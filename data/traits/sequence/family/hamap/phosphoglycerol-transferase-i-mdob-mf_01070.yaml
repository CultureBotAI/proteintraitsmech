identifier: HAMAP:MF_01070
label: "Phosphoglycerol transferase I [mdoB]"
definition: >-
  Phosphoglycerol transferase I (OpgB) transfers a phosphoglycerol residue from phosphatidylglycerol to the membrane-bound nascent glucan backbones for the biosynthesis of osmoregulated periplasmic glucan (OPG). Members of this protein family are found in Proteobacteria.
