identifier: HAMAP:MF_01098
label: "Tetrahydromethanopterin S-methyltransferase subunit E [mtrE]"
definition: >-
  This model describes N5-methyltetrahydromethanopterin: coenzyme M methyltransferase subunit E in methanogenic archaea. This methyltranferase is a membrane-associated enzyme complex that uses methyl-transfer reaction to drive sodium-ion pump. 5-methyl-5,6,7,8-tetrahydromethanopterin + 2-mercaptoethanesulphonate = 5,6,7,8-tetrahydromethanopterin + 2-(methylthio)ethanesulphonate. Archaea have evolved energy-yielding pathways marked by one-carbon biochemistry featuring novel cofactors and enzymes. This transferase (encoded by subunit A) is involved in the transfer of 'methyl' group from N5-methyltetrahydromethanopterin to coenzyme M. In an accompanying reaction, methane is produced by two-electron reduction of methyl-coenzyme M by another enzyme, methyl-coenzyme M reductase.
definition_source: "InterPro:IPR005780 abstract (HAMAP MF_01098 is a member signature)"
