identifier: HAMAP:MF_04148
label: "Terminase, large subunit"
definition: >-
  This family includes the terminase large subunit from Salmonella phage P22, an ATPase required for viral DNA translocation into empty capsids and it also acts as an endonuclease that cuts the viral genome to initiate and to end a packaging reaction. Many DNA viruses package their genomes in a reaction catalysed by a powerful DNA-packaging motor, a complex that consists of a dodecameric portal protein and a terminase that converts ATP hydrolysis into linear translation of DNA. The terminase is formed by a small subunit, which binds to packaging initiation sites to prepare for genome packaging, and a large subunit which has ATPase activity and binds directly to the portal protein. The small subunit is essential for binding to DNA and also activates the large subunit ATPase activity.
definition_source: "InterPro:IPR044265 abstract (HAMAP MF_04148 is a member signature)"
