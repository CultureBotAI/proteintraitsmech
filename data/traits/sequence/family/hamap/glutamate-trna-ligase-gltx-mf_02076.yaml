identifier: HAMAP:MF_02076
label: "Glutamate--tRNA ligase [gltX]"
definition: >-
  This entry are mostly eukaryotic cytosolic and archaeal forms of the glutamyl-tRNA synthetase. The glutamyl-tRNA synthetases of the eukaryotic cytosol and of the Archaea are more similar to glutaminyl-tRNA synthetases than to bacterial glutamyl-tRNA synthetases. In many species, the charging of tRNA (gln) proceeds first through misacylation with Glu and then transamidation. For this reason, glutamyl-tRNA synthetases, including all known archaeal enzymes may act on both tRNA (gln) and tRNA (glu). Glutamate-tRNA ligase (also known as glutamyl-tRNA synthetase; EC:6.1.1.17 ) is a class I aminoacyl-tRNA synthetase. This enzyme shares similarities with glutaminyl-tRNA synthetase in terms of structure and catalytic properties. Glutamyl-tRNA synthetase (GluRS) and glutaminyl-tRNA synthetase (GlnRS) are grouped in the GlxRS subclass because of the shared evolutionary pathway of their catalytic domains. The catalytic domain of Glx subfamily is believed to be more ancient, having evolved from a common GluRS ancestor that contained only the catalytic domain. Anticodon binding domains of extant bacterial and eukaryotic/archeal GlxRS appeared independently at a later stage, with the anticodon-binding domain of bacterial GlnRS being acquired by an unique horizontal gene transfer event from the eukaryotic kingdom. Bacterial GluRS are divided into two groups -discriminatory GluRS (D-GluRS) and non-discriminatory GluRS (ND-GluRS). While D-GluRS exclusively catalyses the transfer of Glu to tRNA(Glu), the ND-GluRS can also glutamylate tRNA(Gln) forming Glu-tRNAGln. The misacylated product is then transformed to Gln-tRNA(Gln) by an enzyme known as glutamyl-tRNA(Gln) amidotransferase. The bacterial GluRS structure consists of four domains. The N-terminal half (domains 1 and 2) contains the '
