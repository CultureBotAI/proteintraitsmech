identifier: HAMAP:MF_03183
label: "Endonuclease III-like protein 1 [NTHL1]"
definition: >-
  This entry includes human endonuclease III-like protein 1 (NTH1) and its homologues from animals, yeasts and plants. NTH1 is a bifunctional DNA N-glycosylase with associated apurinic/apyrimidinic (AP) lyase function that catalyses the first step in base excision repair (BER), the primary pathway for the repair of oxidative DNA damage. In budding yeasts it is also known as Ntg1, which has an a paralogue, Ntg2. Yeast Ntg1 creates a double-strand break at mtDNA origins that stimulates replication in response to oxidative stress.
