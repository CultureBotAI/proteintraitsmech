identifier: HAMAP:MF_00977
label: "3'-5' exoribonuclease"
definition: >-
  This entry represents 3'-5' exoribonucleases found in Mycobacterium tuberculosis and other Actinobacteria. This exonuclease cleaves single-stranded 3' overhangs of double-stranded RNA, but has no activity with 5' overhangs and negligible endonuclease activity. Structurally, these enzymes are similar to DEDD family of nucleases. They form stable homodimers and each monomer in these dimers adopts a compact α/β fold in which a central four-stranded β-sheet is surrounded by α-helices.
definition_source: "InterPro:IPR030853 abstract (HAMAP MF_00977 is a member signature)"
