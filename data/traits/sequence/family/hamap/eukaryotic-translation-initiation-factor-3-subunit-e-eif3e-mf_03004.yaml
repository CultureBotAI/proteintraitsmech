identifier: HAMAP:MF_03004
label: "Eukaryotic translation initiation factor 3 subunit E [EIF3E]"
definition: >-
  Eukaryotic translation initiation factor 3 subunit E (eIF3e) is a component of the eukaryotic translation initiation factor 3 (eIF-3) complex, which is involved in protein synthesis and, together with other initiation factors, stimulates binding of mRNA and methionyl-tRNAi to the 40S ribosome. In humans, eIF3e is required for nonsense-mediated mRNA decay.
