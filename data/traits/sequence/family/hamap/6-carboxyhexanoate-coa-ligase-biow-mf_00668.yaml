identifier: HAMAP:MF_00668
label: "6-carboxyhexanoate--CoA ligase [bioW]"
definition: >-
  This family contains the enzyme 6-carboxyhexanoate-CoA ligase EC:6.2.1.14. This enzyme is involved in the first step of biotin synthesis, where it converts pimelate into pimeloyl-CoA. The enzyme requires magnesium as a cofactor and forms a homodimer. This enzyme sometimes can be found as part of a bifunctional protein with 8-amino-7-oxononanoate synthase.
