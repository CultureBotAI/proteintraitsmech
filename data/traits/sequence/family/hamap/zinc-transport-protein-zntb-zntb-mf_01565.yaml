identifier: HAMAP:MF_01565
label: "Zinc transport protein ZntB [zntB]"
definition: >-
  ZntB is integral membrane protein consisting largely of two independent domains. The first 266 amino acids form a large, highly charged domain within the cytoplasm, while the remaining 61 residues form a small membrane domain containing two membrane-spanning segments. ZntB mediates efflux of zinc ions.
