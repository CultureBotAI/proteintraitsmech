identifier: HAMAP:MF_01811
label: "Membrane protein insertase YidC [yidC]"
definition: >-
  This family includes membrane insertase YidC, YidC1 (also called MisCB), and YidC2 (also called MisCA). Members in this family are required for the insertion of integral membrane proteins into the membrane. They may also be involved in protein secretion processes. Besides having the membrane insertase function, Bacillus MisCA is essential for sporulation by activating sigma factor SpoIIIG/SigG after engulfment is completed in the prespore, maybe by acting on SpoIIIAE. It has an overlapping, although partly distinct, function compared to YqjG(MisCB).
