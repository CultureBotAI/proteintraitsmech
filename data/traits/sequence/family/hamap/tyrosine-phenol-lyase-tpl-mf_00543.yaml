identifier: HAMAP:MF_00543
label: "Tyrosine phenol-lyase [tpl]"
definition: >-
  Tyrosine phenol-lyases (EC:4.1.99.2) (beta-tyrosinase), are pyridoxal-phosphate enzymes which are closely related to tryptophanase (EC:4.1.99.1) (see InterPro:IPR013441). Both belong to the beta-eliminating lyase family.
