identifier: HAMAP:MF_01624
label: "Arsenate reductase [arsC]"
definition: >-
  This family describes the well-studied thioredoxin-dependent arsenate reductase of Staphylococcus aureus plasmid pI258 and other mechanistically similar arsenate reductases. The mechanism involves an intramolecular disulphide bond cascade, and aligned members of this family have four absolutely conserved Cys residues. This group of arsenate reductases belongs to the low-molecular weight protein-tyrosine phosphatase family, as does a group of glutathione/glutaredoxin type arsenate reductases ( ). At least two other, non-homologous groups of arsenate reductases involved in arsenical resistance are also known. This enzyme reduces arsenate to arsenite, which may be more toxic but which is more easily exported.
definition_source: "InterPro:IPR014064 abstract (HAMAP MF_01624 is a member signature)"
