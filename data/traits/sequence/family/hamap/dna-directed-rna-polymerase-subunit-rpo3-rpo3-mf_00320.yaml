identifier: HAMAP:MF_00320
label: "DNA-directed RNA polymerase subunit Rpo3 [rpo3]"
definition: >-
  DNA-directed RNA polymerases, also known as DNA-dependent RNA polymerases, are responsible for the polymerisation of ribonucleotides into a sequence complementary to the template DNA. Eukaryotes have three different DNA-directed RNA polymerases (RNAPs), Pol I, II, and III, whereas Archaea and Bacteria have single enzymes. RNAPs are multisubunit enzymes. Archaeal RNAP is closely related to eukaryotic RNAP II, which consists of 12 subunits. Archaeal RNAP has an additional subunit, Rpo13, with no orthologue in the eukaryotic enzyme. This entry includes the Rpo3 subunit (also known as subunit D) from archaeal RNAP, Rpb3 subunit from eukaryotic RNAPII and RPAC1 (also known as AC40) subunit from RNAPI/III. These subunits are involved in the assembly of RNAPs.
definition_source: "InterPro:IPR022842 abstract (HAMAP MF_00320 is a member signature)"
