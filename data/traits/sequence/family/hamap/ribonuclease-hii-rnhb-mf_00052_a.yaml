identifier: HAMAP:MF_00052_A
label: "Ribonuclease HII [rnhB]"
definition: >-
  Ribonuclease HII is an endonuclease that specifically degrades the RNA of RNA-DNA hybrids via cleavage of the 5'-phosphomonoester. This entry contains proteins restricted to the archaea.
