identifier: HAMAP:MF_01557
label: "Tagatose-6-phosphate kinase [lacC]"
definition: >-
  Tagatose-6-phosphate kinase ( EC:2.7.1.144 ) is part of the tagatose-6-phosphate pathway of lactose degradation. The enzyme catalyses the following reaction: ATP + D-tagatose 6-phosphate = ADP + D-tagatose 1,6-bisphosphate The genes coding for the enzymes of the tagatose 6-phosphate pathway have been found to be part of the lac operon, together with the genes coding for the lactose-phosphotransferase system and the phospho-beta-galactosidase in Lactococcus lactis, Staphlococcus aureus, and Streptococcus mutans.
