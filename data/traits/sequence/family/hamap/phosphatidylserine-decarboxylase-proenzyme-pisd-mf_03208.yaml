identifier: HAMAP:MF_03208
label: "Phosphatidylserine decarboxylase proenzyme [PISD]"
definition: >-
  A non-mitochondrial type I phosphatidylserine decarboxylase has been identified in Plasmodium falciparum. This entry represents the eukaryotic type 1 subfamily. PSD plays a pivotal role in the synthesis of phospholipid by the mitochondria. The substrate phosphatidylserine is synthesised extramitochondrially and must be translocated to the mitochondria prior to decarboxylation. Phosphatidylserine decarboxylases EC:4.1.1.65 is responsible for conversion of phosphatidylserine to phosphatidylethanolamine and plays a central role in the biosynthesis of aminophospholipids. Phosphatidylserine decarboxylases (PSDs) have been classified in two types. Type I PSDs include enzymes of eukaryotic mitochondria and bacterial origin which contain the amino acid sequence LGST as a characteristic motif. Type II PSDs are found in the endomembrane system of eukaryotes and contain a typical GGST motif. These characteristic motifs are considered as autocatalytic cleavage sites where proenzymes are split into alpha and beta subunits.
definition_source: "InterPro:IPR033661 abstract (HAMAP MF_03208 is a member signature)"
