identifier: HAMAP:MF_01158
label: "DnaA regulatory inactivator Hda [hda]"
definition: >-
  This entry represents the Hda (Homologous to DnaA) proteins, which are about half the length of DnaA and homologous over the entire length of Hda. In Escherichia coli, the initiation of DNA replication requires DnaA bound to ATP rather than ADP; Hda helps facilitate the conversion of DnaA-ATP to DnaA-ADP, thus inhibiting the inititation of DNA replication. This entry represents Hda proteins from Enterobacteriaceae.
