identifier: HAMAP:MF_01628
label: "Thymidine phosphorylase [deoA]"
definition: >-
  Thymidine phosphorylase (alternate name: pyrimidine phosphorylase) EC:2.4.2.4 is involved, in Escherichia coli and other Proteobacteria, in (deoxy)nucleotide degradation. It is often encoded in an operon together with a deoxyribose-phosphate aldolase, a phosphopentomutase and a purine nucleoside phosphorylase. In many other lineages, the corresponding enzyme is designated pyrimidine-nucleoside phosphorylase (EC:2.4.2.2); the naming convention here follows standard literature practice.
