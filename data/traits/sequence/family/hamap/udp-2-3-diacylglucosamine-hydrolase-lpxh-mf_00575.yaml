identifier: HAMAP:MF_00575
label: "UDP-2,3-diacylglucosamine hydrolase [lpxH]"
definition: >-
  This entry represents LpxH, or UDP-2,3-diacylglucosamine hydrolase (or diphosphatase), which is an essential enzyme in Escherichia coli that catalyses the fourth step in lipid A biosynthesis. This reaction involves pyrophosphate bond hydrolysis of the precursor UDP-2,3-diacylglucosamine to yield 2,3-diacylglucosamine 1-phosphate and UMP. Several Gram-negative bacteria have homologues of LpxH and/or LpxH2, while others have only distant orthologues of LpxH or LpxH2, or lack these enzymes altogether.
