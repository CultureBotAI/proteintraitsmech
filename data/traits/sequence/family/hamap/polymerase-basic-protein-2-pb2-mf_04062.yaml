identifier: HAMAP:MF_04062
label: "Polymerase basic protein 2 [PB2]"
definition: >-
  Orthomyxoviridae RNA polymerase with the subunit composition of PB1-PB2-PA is a unique multifunctional enzyme with the activities of both synthesis and cleavage of RNA and is involved in both transcription and replication of the RNA genome. Transcription is initiated by using capped RNA fragments, which are generated after cleavage of host cell mRNA by the RNA polymerase-associated capped RNA endonuclease. The PB2 subunit has cap-binding and cap-dependent endonuclease activities. It appears that two separate sequences, one N-(242-282) and the other C-terminal (538-577) proximal segments of the PB2 subunit, constitute the RNA cap-binding site of the Influenza virus RNA polymerase.
definition_source: "InterPro:IPR001591 abstract (HAMAP MF_04062 is a member signature)"
