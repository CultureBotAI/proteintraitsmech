identifier: HAMAP:MF_00614
label: "Flap endonuclease 1 [fen]"
definition: >-
  This entry represents an endonuclease that cleaves the 5'-overhanging flap structure that is generated by displacement synthesis when DNA polymerase encounters the 5'-end of a downstream Okazaki fragment. It has 5'-endo-/exonuclease and 5'-pseudo-Y-endonuclease activities and cleaves the junction between single and double-stranded regions of flap DNA.
