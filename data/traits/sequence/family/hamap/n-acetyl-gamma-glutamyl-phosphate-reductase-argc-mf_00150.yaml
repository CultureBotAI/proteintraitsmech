identifier: HAMAP:MF_00150
label: "N-acetyl-gamma-glutamyl-phosphate reductase [argC]"
definition: >-
  This entry represents the more common of two related families of N-acetyl-gamma-glutamyl-phosphate reductase, an enzyme catalyzing the third step or Arg biosynthesis from Glu. The two families differ by phylogeny, similarity clustering, and the gap architecture in a multiple sequence alignment. Bacterial members of this family tend to be found within Arg biosynthesis operons. This family also includes LysY (LysW-L-2-aminoadipate/LysW-L-glutamate phosphate reductase), which is involved in both the arginine and lysine biosynthetic pathways. Several bacteria and archaea utilize the amino group-carrier protein, LysW, for lysine biosynthesis from alpha-aminoadipate (AAA). In some cases, such as Sulfolobus, LysW is also used to protect the amino group of glutamate in arginine biosynthesis. After LysW modification, AAA and glutamate are converted to lysine and ornithine, respectively, by a single set of enzymes with dual functions. LysY is the third enzyme in lysine biosynthesis from AAA. LysY shows high sequence identity and functional similarities with ArgC, and they are considered to have evolved from a common ancestor. N-acetyl-gamma-glutamyl-phosphate reductase (EC:1.2.1.38) (AGPR, NAGSA dehydrogenase) is the enzyme that catalyses the third step in the biosynthesis of arginine from glutamate, the NADP-dependent reduction of N-acetyl-5-glutamyl phosphate into N-acetylglutamate 5-semialdehyde. In bacteria it is a monofunctional protein of 35 to 38kDa (gene argC), while in fungi it is part of a bifunctional mitochondrial enzyme (gene ARG5,6, arg11 or arg-6) which contains a N-terminal acetylglutamate kinase (EC:2.7.2.8) domain and a C-terminal AGPR domain. In the Escherichia coli enzyme, a cysteine has been shown to be implicated in the catalytic activity, and the region aro
