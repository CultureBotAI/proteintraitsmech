identifier: HAMAP:MF_00994
label: "Lipopolysaccharide assembly protein B [lapB]"
definition: >-
  Lipopolysaccharide assembly protein B (LapB), together with LapA, is involved in assembling lipopolysaccharide. E. coli LapB, also known as YciM, has been shown to act by altering LpxC, an enzyme that catalyses the first committed step of lipid A biosynthesis.
