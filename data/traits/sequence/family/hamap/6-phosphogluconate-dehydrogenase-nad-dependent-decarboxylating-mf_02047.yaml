identifier: HAMAP:MF_02047
label: "6-phosphogluconate dehydrogenase, NAD(+)-dependent, decarboxylating"
definition: >-
  This entry represents 6-phosphogluconate dehydrogenase (6PGDH) from archaea. Proteins in this entry share protein sequence similarity with B. subtilis YqeC, which is a truncated 6PGD that possesses a NAD+-dependent activity.
