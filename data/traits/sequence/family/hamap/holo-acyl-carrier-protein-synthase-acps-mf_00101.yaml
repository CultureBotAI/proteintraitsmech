identifier: HAMAP:MF_00101
label: "Holo-[acyl-carrier-protein] synthase [acpS]"
definition: >-
  Holo-acyl carrier protein synthase (ACPS) transfers the 4'-phosphopantetheine (4'-PP) moiety from coenzyme A (CoA) to Ser-36 of acyl carrier protein (ACP) in Escherichia coli. This post-translational modification renders holo-ACP capable of acyl group activation via thioesterification of the cysteamine thiol of 4'-PP. In eukaryotes such as the yeast Neosartorya fumigata, ACPS is mitochondrial. In fatty acid synthase subunit alpha from fungi, this entry represents the C-terminal of the multidomain protein.
definition_source: "InterPro:IPR002582 abstract (HAMAP MF_00101 is a member signature)"
