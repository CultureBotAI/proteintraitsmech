identifier: HAMAP:MF_00208
label: "UDP-N-acetylmuramoyl-L-alanyl-D-glutamate--2,6-diaminopimelate ligase [murE]"
definition: >-
  This entry represents DP-N-acetylmuramoylalanyl-D-glutamate-2,6-diaminopimelate ligases (MurE; EC:6.3.2.13 ). An exception is found with Staphylococcus aureus, in which diaminopimelate is replaced by lysine in the peptidoglycan and MurE is ( EC:6.3.2.7 ). The Mycobacteria, part of the closest neighbouring branch outside of the low-GC Gram-positive bacteria, use diaminopimelate. The bacterial cell wall provides strength and rigidity to counteract internal osmotic pressure, and protection against the environment. The peptidoglycan layer gives the cell wall its strength, and helps maintain the overall shape of the cell. The basic peptidoglycan structure of both Gram-positive and Gram-negative bacteria is comprised of a sheet of glycan chains connected by short cross-linking polypeptides. Biosynthesis of peptidoglycan is a multi-step (11-12 steps) process comprising three main stages: (1) formation of UDP-N-acetylmuramic acid (UDPMurNAc) from N-acetylglucosamine (GlcNAc). (2) addition of a short polypeptide chain to the UDPMurNAc. (3) addition of a second GlcNAc to the disaccharide-pentapeptide building block and transport of this unit through the cytoplasmic membrane and incorporation into the growing peptidoglycan layer. Stage two involves four key Mur ligase enzymes: MurC ( EC:6.3.2.8 ), MurD ( EC:6.3.2.9 ), MurE ( EC:6.3.2.13 ) and MurF ( EC:6.3.2.10 ). These four Mur ligases are responsible for the successive additions of L-alanine, D-glutamate, meso-diaminopimelate or L-lysine, and D-alanyl-D-alanine to UDP-N-acetylmuramic acid. All four Mur ligases are topologically similar to one another, even though they display low sequence identity. They are each composed of three domains: an N-terminal Rossmann-fold domain responsible for binding the UDPMurNAc substrate; a centr
