identifier: HAMAP:MF_02247
label: "Carboxylic acid reductase [car]"
definition: >-
  This entry represents Carboxylic acid reductase (CAR) from Mycobacterium marinum and similar proteins from Actinobacteria. This enzyme catalyses the ATP- and NADPH-dependent reduction of carboxylic acids to the corresponding aldehydes. It shows an adenylation domain linked via a peptidyl carrier protein (PCP) to a reductase termination domain.
