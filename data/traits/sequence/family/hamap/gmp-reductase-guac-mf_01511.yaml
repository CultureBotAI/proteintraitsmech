identifier: HAMAP:MF_01511
label: "GMP reductase [guaC]"
definition: >-
  Guanosine monophosphate reductase ( EC:1.7.1.7 ) catalyses the irreversible and NADPH-dependent reductive deamination of GMP into IMP. NADPH + guanosine 5-phosphate = NADP+ + inosine 5-phosphate + NH3 It converts nucleobase, nucleoside and nucleotide derivatives of G to A nucleotides, and maintains intracellular balance of A and G nucleotides. A deep split separates two families of GMP reductase. This family is found in a variety of bacterial lineages. The other type ( InterPro:IPR005993 ) is found in eukaryotic and some proteobacterial lineages.
definition_source: "InterPro:IPR005994 abstract (HAMAP MF_01511 is a member signature)"
