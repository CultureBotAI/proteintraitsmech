identifier: HAMAP:MF_01671
label: "Inositol 2-dehydrogenase/D-chiro-inositol 3-dehydrogenase [iolG]"
definition: >-
  Inositol 2-dehydrogenase catalyses the oxidation of myo-inositol (MI) to 2-keto-myo-inositol (2KMI or 2-inosose). In firmicutes (Gram-positive bacteria), the enzyme also shows D-chiro-inositol 3-dehydrogenase activity and is involved in the oxidation of D-chiro-inositol (DCI) to 1-keto-D-chiro-inositol (1KDCI).
