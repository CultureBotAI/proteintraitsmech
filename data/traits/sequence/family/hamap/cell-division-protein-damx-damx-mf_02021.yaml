identifier: HAMAP:MF_02021
label: "Cell division protein DamX [damX]"
definition: >-
  This entry represents the cell division protein DamX from Enterobacteriaceae. DamX is an inner membrane protein that contributes to the cell constriction process during bacterial cytokinesis. It contains a C-terminal SPOR domain that may act as autonomous septal targeting determinant. DamX localises to the septal ring, but it is non-essential for cell division, and it inhibits cell division when overproduced. It has been suggested that it may contribute to cell envelope biogenesis or integrity in other ways distinct from its role in cell division.
definition_source: "InterPro:IPR032899 abstract (HAMAP MF_02021 is a member signature)"
