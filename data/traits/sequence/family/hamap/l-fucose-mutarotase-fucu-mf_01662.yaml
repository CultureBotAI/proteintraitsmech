identifier: HAMAP:MF_01662
label: "L-fucose mutarotase [fucU]"
definition: >-
  FucU is a component of the fucose operon and is a L-fucose mutarotase, involved in the anomeric conversion of L-fucose. It also exhibits a pyranase activity for D-ribose.
