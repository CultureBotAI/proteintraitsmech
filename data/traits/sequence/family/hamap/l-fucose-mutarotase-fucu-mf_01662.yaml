identifier: HAMAP:MF_01662
label: "L-fucose mutarotase [fucU]"
definition: >-
  FucU is a component of the fucose operon and is a L-fucose mutarotase EC:5.1.3.n2, involved in the anomeric conversion of L-fucose. It also exhibits a pyranase activity for D-ribose.
