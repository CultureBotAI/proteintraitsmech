identifier: HAMAP:MF_01947
label: "N(4)-bis(aminopropyl)spermidine synthase [bpsA]"
definition: >-
  BpsA synthesizes N(4)-bis(aminopropyl)spermidine from spermidine via N(4)-aminopropylspermidine. It is involved in the biosynthesis of branched-chain polyamines, which support the growth of thermophiles under high-temperature conditions.
