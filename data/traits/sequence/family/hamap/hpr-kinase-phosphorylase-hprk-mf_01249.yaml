identifier: HAMAP:MF_01249
label: "HPr kinase/phosphorylase [hprK]"
definition: >-
  This entry represents the bifunctional HPr serine kinase/phosphorylase (HprK/P). It catalyses the phosphorylation of a specific serine residue in HPr, a phosphocarrier protein of the phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS). It also catalyses thedephosphorylation of seryl-phosphorylated HPr (P-Ser-HPr). The two antagonistic activities of HprK/P are regulated by several intracellular metabolites, which change their concentration in response to the absence or presence of rapidly metabolisable carbon sources (glucose, fructose, etc.) in the growth medium. HprK/P is the sensor in a multicomponent phosphorelay system that controls catabolite repression, sugar transport and carbon metabolism in Gram-positive bacteria.
definition_source: "InterPro:IPR003755 abstract (HAMAP MF_01249 is a member signature)"
