identifier: HAMAP:MF_00046
label: "UDP-N-acetylmuramate--L-alanine ligase [murC]"
definition: >-
  This entry represents UDP-N-acetylmuramate-alanine ligase (MurC). MurC is an essential, cytoplasmic peptidoglycan biosynthetic enzyme, catalyzes the ATP-dependent ligation of L-alanine (Ala) and UDP-N-acetylmuramic acid (UNAM) to form UDP-N-acetylmuramyl-L-alanine (UNAM-Ala). The enzyme is a nonribosomal peptide ligase which utilises ATP to form an amide bond between L-alanine and UNAM.1 Mechanistic studies on the Escherichia coli MurC enzyme using oxygen isotope analyses demonstrated that the enzyme-catalyzed reaction proceeds through an acyl phosphate UNAM intermediate prior to L-alanine addition. The bacterial cell wall provides strength and rigidity to counteract internal osmotic pressure, and protection against the environment. The peptidoglycan layer gives the cell wall its strength, and helps maintain the overall shape of the cell. The basic peptidoglycan structure of both Gram-positive and Gram-negative bacteria is comprised of a sheet of glycan chains connected by short cross-linking polypeptides. Biosynthesis of peptidoglycan is a multi-step (11-12 steps) process comprising three main stages: (1) formation of UDP-N-acetylmuramic acid (UDPMurNAc) from N-acetylglucosamine (GlcNAc). (2) addition of a short polypeptide chain to the UDPMurNAc. (3) addition of a second GlcNAc to the disaccharide-pentapeptide building block and transport of this unit through the cytoplasmic membrane and incorporation into the growing peptidoglycan layer. Stage two involves four key Mur ligase enzymes: MurC ( ), MurD ( ), MurE ( ) and MurF ( ). These four Mur ligases are responsible for the successive additions of L-alanine, D-glutamate, meso-diaminopimelate or L-lysine, and D-alanyl-D-alanine to UDP-N-acetylmuramic acid. All four Mur ligases are topologically similar to one another,
