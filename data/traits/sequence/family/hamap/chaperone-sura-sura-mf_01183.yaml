identifier: HAMAP:MF_01183
label: "Chaperone SurA [surA]"
definition: >-
  SurA in Escherichia coli is a periplasmic peptidyl-prolyl isomerase which is necessary for the proper folding of outer membrane proteins (OMP) including OmpA, OmpF and LamB. There are at least two pathways for periplasmic chaperone activity, one involving Skp and DegP, and another involving SurA. It has been proposed that the SurA pathway is the primary pathway for assembly of OMPs, while the DegP/Skp pathway is important for rescuing proteins that fall off of the SurA pathway. However recent proteonomic studies show that only 8 of 23 identified β-barrel proteins were negatively affected in a surA knockout mutant. The decreased OMP included FadL, FecA, LptD, FhuA, OmpX as well as the major OMP OmpA, OmpF and LamB.
