identifier: HAMAP:MF_00244
label: "Probable nicotinate-nucleotide adenylyltransferase [nadD]"
definition: >-
  This family contains the adenylyltransferases for nicotinamide-nucleotide and for the deamido form, nicotinate nucleotide found predominantly in bacteria and fungi. Nicotinamide-nucleotide adenylyltransferase (NMNAT, EC:2.7.7.1) synthesizes NAD by the salvage pathway, while nicotinate-nucleotide adenylyltransferase (NaMN-ATase, EC:2.7.7.18) synthesizes the immediate precursor of NAD by the de novo pathway.
