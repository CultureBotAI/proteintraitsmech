identifier: HAMAP:MF_00276
label: "Potassium-transporting ATPase KdpC subunit [kdpC]"
definition: >-
  Kdp is a high affinity ATP-driven K+ transport system in Escherichia coli. It is a membrane complex (KdpFABC) composed of four subunits, KdpA, KdpB, KdpC and KdpF, although KdpF is not present in some species. It maintains intracellular homeostasis, cell shape and turgor under potassium-limiting conditions. KdpA is the K+-transporting subunit of this complex, while KdpB is a P-type ATPase that provides the energy for K+ transport. Both subunits are joined by KdpC, a probable catalytic chaperone and KdpF, that may stabilize the complex. KdpC and KdpF have single transmembrane helices and no known homologues outside of Kdp. This family represents the KdpC subunit from KdpFABC complex.
definition_source: "InterPro:IPR003820 abstract (HAMAP MF_00276 is a member signature)"
