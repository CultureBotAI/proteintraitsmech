identifier: HAMAP:MF_01687
label: "Beta-galactosidase [lacZ]"
definition: >-
  O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. This entry represents enzymes responsible for hydrolysis of terminal non-reducing beta-D-galactose residues in beta-D-galactosides. This group of enzymes belongs to the glycosyl hydrolase 2 family.
