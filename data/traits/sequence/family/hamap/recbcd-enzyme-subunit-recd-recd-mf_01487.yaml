identifier: HAMAP:MF_01487
label: "RecBCD enzyme subunit RecD [recD]"
definition: >-
  Exodeoxyribonuclease V or RecBCD is an heterotrimeric enzyme comprised of the proteins RecB, RecC and RecD. RecBCD is a helicase/nuclease that prepares dsDNA breaks (DSB) for recombinational DNA repair. Subunit RecD is a DNA helicase with 5' --> 3' polarity, whereas the RecB subunit possesses a 3' --> 5' DNA helicase activity. This points to a bipolar translocation model for RecBCD in which the two DNA helicases are travelling with opposite polarities, but in the same direction, on each strand of the antiparallel DNA duplex.
