identifier: HAMAP:MF_01042
label: "Ribosome rescue factor SmrB [smrB]"
definition: >-
  This entry represents the Ribosome rescue factor SmrB from Escherichia coli and related proteins mainly from gammaproteobacteria. SmrB acts as a ribosome collision sensor. It detects stalled/collided disomes (pairs of ribosomes where the leading ribosome is stalled and a second ribosome has collided with it) and cleaves mRNA at the 5' end of the stalled ribosome. The cleaved mRNA becomes available for tmRNA ligation, leading to ribosomal subunit dissociation and rescue of stalled ribosomes.
definition_source: "InterPro:IPR022990 abstract (HAMAP MF_01042 is a member signature)"
