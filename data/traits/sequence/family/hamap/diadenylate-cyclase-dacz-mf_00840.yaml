identifier: HAMAP:MF_00840
label: "Diadenylate cyclase [dacZ]"
definition: >-
  Diadenylate cyclase (DAC, also known as diadenylyl cyclase and cyclic-di-AMP synthase) catalyses the condensation of 2 ATP molecules into cyclic di-AMP (c-di-AMP), a putative second messenger in bacteria and archaea. DAC proteins contain a DisA_N domain, first identified as a DAC domain in the T. maritima protein DisA. This entry refers to the DacZ subfamily of DACs.
