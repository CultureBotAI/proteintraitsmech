identifier: HAMAP:MF_00834
label: "Adenosylmethionine-8-amino-7-oxononanoate aminotransferase [bioA]"
definition: >-
  BioA is an adenosylmethionine-8-amino-7-oxononanoate aminotransferase that functions in biotin synthesis. It utilises S-adenosyl-L-methionine (SAM) to transaminate the biotin precursor 7-keto-8-aminopelargonic acid and form the next intermediate in the pathway, 7, 8-diaminopelargonic acid. It is currently the only aminotransferase that is known to use SAM as an amino donor. The Bacillus subtilis enzyme, which is included in this entry, uses lysine rather than SAM as the amino donor.
