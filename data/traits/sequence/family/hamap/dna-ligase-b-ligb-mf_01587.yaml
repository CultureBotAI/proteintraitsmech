identifier: HAMAP:MF_01587
label: "DNA ligase B [ligB]"
definition: >-
  DNA ligase B, a protein that is is highly conserved throughout the Enterobacteriaceae family, is an NAD(+)-dependent enzyme that catalyses the sealing of 5' phosphate and 3' hydroxyl termini at nicks in duplex DNA by means of three sequential nucleotidyl transfer reactions. Unlike DNA ligase A, it is not essential under normal laboratory growth conditions but is related to specific DNA damaging agents and antibiotics,.
