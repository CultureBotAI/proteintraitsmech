identifier: HAMAP:MF_02016
label: "Membrane-bound lytic murein transglycosylase F [mltF]"
definition: >-
  This entry represents membrane-bound lytic murein transglycosylase F (MltF). In Escherichia coli, MltF function as an lytic transglycosylases; it degrades peptidoglycan producing 1,6-anhydromuramoyl residues in the process.
