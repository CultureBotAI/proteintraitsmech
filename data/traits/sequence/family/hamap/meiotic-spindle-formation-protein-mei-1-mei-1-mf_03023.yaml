identifier: HAMAP:MF_03023
label: "Meiotic spindle formation protein mei-1 [mei-1]"
definition: >-
  Katanin is an ATP-dependent microtubule severing protein composed of 60kDa (katanin-p60) and 80kDa (katanin-p80) subunits encoded by KATNA1 and KATNB1 genes, respectively. Katanin-p60 has the enzymatic activity for microtubule severing, while katanin-p80 possesses multiple functions such as targeting katanin-p60 to the centrosome, augmenting microtubule severing by katanin-p60, and even suppressing microtubule severing.
