identifier: HAMAP:MF_00619
label: "Small ribosomal subunit protein cS23 [ycf65]"
definition: >-
  This entry describes probable ribosomal proteins or ribosome-associated proteins mostly found in cyanobacteria and some species from red and green algae. In cyanobacteria, the small ribosomal subunit protein cS23 is named Ycf65. In red algae, the gene encoding this protein is Ycf65. Plastid-specific ribosomal proteins may mediate the effects of nuclear factors on plastid translation. The acidic PSRPs are thought to contribute to protein-protein interactions in the 30S subunit, and are not thought to bind RNA.
