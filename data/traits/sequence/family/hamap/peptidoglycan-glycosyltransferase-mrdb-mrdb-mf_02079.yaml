identifier: HAMAP:MF_02079
label: "Peptidoglycan glycosyltransferase MrdB [mrdB]"
definition: >-
  Treponema pallidum RodA and Escherichia coli MrdB are probable peptidoglycan polymerases that are essential for cell wall elongation. RodA is a member of the FtsW/RodA/SpoVE family. It is found only in species with rod (or spiral) shapes. RodA is required for the maintenance of the rod cell shape and is essential for the elongation of the lateral wall of the cell. In Escherichai coli, the rodA and pbpA genes occur in the same operon, and RodA is required for the expression of the enzymatic activity of the penicillin-binding protein 2 (PbpA).
