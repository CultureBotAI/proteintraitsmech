identifier: HAMAP:MF_01472
label: "UDP-N-acetylglucosamine--peptide N-acetylglucosaminyltransferase GtfA subunit [gtfA]"
definition: >-
  Glycosyltransferase GtfA is an N-acetylglucosaminyl transferase that is part of the accessory SecA2/SecY2 system specifically required to export serine-rich repeat cell wall proteins usually encoded upstream in the same operon.
