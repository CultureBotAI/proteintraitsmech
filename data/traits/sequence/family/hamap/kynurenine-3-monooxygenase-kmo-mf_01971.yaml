identifier: HAMAP:MF_01971
label: "Kynurenine 3-monooxygenase [kmo]"
definition: >-
  Kynurenine 3-monooxygenase (also known as kynurenine 3-hydroxylase) catalyses the hydroxylation of L-kynurenine (L-Kyn) to form 3-hydroxy-L-kynurenine (L-3OHKyn). It has a key role in tryptophan catabolism and is required for synthesis of quinolinic acid, a neurotoxic NMDA (N-methyl-D-aspartate) receptor antagonist.
