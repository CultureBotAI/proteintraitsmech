identifier: HAMAP:MF_03193
label: "Ubiquinone biosynthesis monooxygenase COQ6, mitochondrial [COQ6]"
definition: >-
  Ubiquinone (Q) functions as an electron carrier in the respiratory chain in mitochondria. Q biosynthesis involves a series of enzymatic steps, which are catalysed by the enzymes COQ1-COQ8 in Saccharomyces cerevisiae (Baker's yeast). COQ6, or ubiquinone biosynthesis monooxygenase, is a flavin-dependent enzyme localised to the matrix side of the inner mitochondrial membrane that is required for one or more steps in Q biosynthesis. In mammals and yeast, this enzyme is responsible for the C5-ring hydroxylation during ubiquinone biosynthesis, catalysing the hydroxylation of 3-hexaprenyl-4-hydroxybenzoic acid (HHB) to 3-hexaprenyl-4,5-dihydroxybenzoic acid (DHHB).
