identifier: HAMAP:MF_01821
label: "RNA polymerase-associated protein RapA [rapA]"
definition: >-
  RNA polymerase-associated protein RapA is a transcription regulator that activates transcription by stimulating RNA polymerase (RNAP) recycling. This stimulation occurs in cases of stress conditions such as supercoiled DNA or high salt concentrations. The protein probably acts by releasing the RNAP, when it is trapped or immobilized on tightly supercoiled DNA however, it does not activate transcription on linear DNA. RapA is probably not involved in DNA repair. The protein has a higher affinity for the core RNAP than for the holoenzyme and its ATPase activity is stimulated by binding to RNAP. RapA belongs to the SNF2/RAD54 helicase family and contains 1 helicase ATP-binding domain.
