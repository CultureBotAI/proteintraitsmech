identifier: HAMAP:MF_00025
label: "DNA-directed RNA polymerase subunit Rpo5 [rpo5]"
definition: >-
  Eukaryotic Rpb5 (POLR2E in mammals) is a common component of RNA polymerases I, II and III. Archaeal Rpo5 (also known as subunit H) is a homologue of Rpb5. Rpb5 has a bipartite structure consisting of a unique N-terminal region, plus a C-terminal region that is structurally homologous to Rpo5. DNA-directed RNA polymerases EC:2.7.7.6 (also known as DNA-dependent RNA polymerases) are responsible for the polymerisation of ribonucleotides into a sequence complementary to the template DNA. In eukaryotes, there are three different forms of DNA-directed RNA polymerases transcribing different sets of genes. Most RNA polymerases are multimeric enzymes and are composed of a variable number of subunits. The core RNA polymerase complex consists of five subunits (two alpha, one beta, one beta-prime and one omega) and is sufficient for transcription elongation and termination but is unable to initiate transcription. Transcription initiation from promoter elements requires a sixth, dissociable subunit called a sigma factor, which reversibly associates with the core RNA polymerase complex to form a holoenzyme. The core RNA polymerase complex forms a "crab claw"-like structure with an internal channel running along the full length. The key functional sites of the enzyme, as defined by mutational and cross-linking analysis, are located on the inner wall of this channel. RNA synthesis follows after the attachment of RNA polymerase to a specific site, the promoter, on the template DNA strand. The RNA synthesis process continues until a termination sequence is reached. The RNA product, which is synthesised in the 5' to 3' direction, is known as the primary transcript. Eukaryotic nuclei contain three distinct types of RNA polymerases that differ in the RNA they synthesise: RNA polymerase I: 
