identifier: HAMAP:MF_01427
label: "3'-5' exoribonuclease YhaM [yhaM]"
definition: >-
  Exoribonucleases are enzymes that degrade RNA by removing terminal nucleotides from either the 5' end or 3' end of various RNA. This entry represents YhaM, which shows 3'-5' exoribonuclease activity.
