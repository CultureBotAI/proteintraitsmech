identifier: HAMAP:MF_01583
label: "Threonine/serine transporter TdcC [tdcC]"
definition: >-
  This entry represents the threonine/serine transporter TdcC. It is involved in the import of threonine and serine into the cell, with the concomitant import of a proton (symport system). TdcC is a multi-pass membrane protein.
