identifier: HAMAP:MF_04154
label: "DNA helicase/primase [4]"
definition: >-
  This entry is represented by bacteriophage T7 DNA helicase/primase (also known as Gp4), an ATP-dependent DNA helicase and primase that is essential for viral DNA replication and recombination. Primase activity synthesizes short RNA primers at the sequence 5'-GTC-3' on the lagging strand that the polymerase elongates using dNTPs and providing the primase is still present. The characteristics of the protein distribution suggest prophage matches in addition to the phage matches.
definition_source: "InterPro:IPR046394 abstract (HAMAP MF_04154 is a member signature)"
