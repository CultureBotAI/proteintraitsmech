identifier: HAMAP:MF_04131
label: "Outer capsid glycoprotein VP7"
definition: >-
  Glycoprotein VP7, also known as outer shell glycoprotein, is a serotype-specific antigen, and is the major neutralisation antigen. It is found in the dsRNA rotaviruses.
