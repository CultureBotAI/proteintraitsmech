identifier: HAMAP:MF_00561
label: "ADP-specific phosphofructokinase [pfkC]"
definition: >-
  Phosphofructokinase is a key enzyme of glycolysis. The phosphate group donor for different subtypes of phosphofructokinase can be ATP, ADP, or pyrophosphate. This family consists of ADP-dependent phosphofructokinases found in archaea. Members are more similar to ADP-dependent glucokinases (excluded from this family) than to other phosphofructokinases.
