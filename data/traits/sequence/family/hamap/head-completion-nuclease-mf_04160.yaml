identifier: HAMAP:MF_04160
label: "Head completion nuclease"
definition: >-
  This entry represents the head completion endonuclease (also known as gp4 and gp50), which plays an essential role in the head-tail joining step of T4-like phages during phage morphogenesis. It has both exo- and endonuclease activity.
