identifier: HAMAP:MF_00855
label: "RuBisCO chaperone RbcX [rbcX]"
definition: >-
  This entry represents RuBisCO chaperone RbcX and similar proteins from cyanobacteria. RbcX is an RbcL-specific chaperone. All known RbcX proteins exist as homodimers (RbcX2). The central cleft of this homodimer binds the C-terminal of a RbcL monomer, stabilizing it, and the peripheral region of RbcX2 binds a second RbcL monomer, which allows the RbcL homodimers to be in the correct orientation. It is also required for assembly of the RbcL8 core, acting downstream of the major chaperonin (GroEL-GroES), has a transient dynamic interaction with RbcL and is eventually displaced by RbcS.
definition_source: "InterPro:IPR046381 abstract (HAMAP MF_00855 is a member signature)"
