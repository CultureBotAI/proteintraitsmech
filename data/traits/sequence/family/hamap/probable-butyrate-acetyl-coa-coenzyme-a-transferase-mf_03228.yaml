identifier: HAMAP:MF_03228
label: "Probable butyrate:acetyl-CoA coenzyme A-transferase"
definition: >-
  This enzyme represents one of at least two mechanisms for reclaiming CoA from butyryl-CoA at the end of butyrate biosynthesis (an important process performed by some colonic bacteria), namely transfer of CoA to acetate. An alternate mechanism transfers the butyrate onto inorganic phosphate, after which butyrate kinase transfers the phosphate onto ADP, creating ATP. This entry also includes butyrate CoA-transferase from Syntrophomonas wolfei, involved in the syntrophic growth of this organism on butyrate in cooperation with methanogens or an appropriate hydrogen-scavenging bacterium.
definition_source: "InterPro:IPR023990 abstract (HAMAP MF_03228 is a member signature)"
