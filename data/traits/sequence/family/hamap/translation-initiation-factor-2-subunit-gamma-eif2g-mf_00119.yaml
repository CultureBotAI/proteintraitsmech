identifier: HAMAP:MF_00119
label: "Translation initiation factor 2 subunit gamma [eif2g]"
definition: >-
  This entry represents the gamma subunit of archaeal translation initiation factor 2, it is found in all known archaea. eIF-2 functions in the early steps of protein synthesis by forming a ternary complex with GTP and initiator tRNA.
