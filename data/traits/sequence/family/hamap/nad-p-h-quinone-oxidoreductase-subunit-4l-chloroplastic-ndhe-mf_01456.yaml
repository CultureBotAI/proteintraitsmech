identifier: HAMAP:MF_01456
label: "NAD(P)H-quinone oxidoreductase subunit 4L, chloroplastic [ndhE]"
definition: >-
  This entry represents NADH:ubiquinone oxidoreductase, chain 4L, as well as NADH-quinone oxidoreductase ( ). In eukaryotes, these enzymes are usually found in either mitochondria or chloroplasts as part of the respiratory-chain NADH dehydrogenase (also known as complex I or NADH-ubiquinone oxidoreductase), an oligomeric enzymatic complex. However, they are also found in bacteria and archaea where they are annotated as NuoK subunit.
