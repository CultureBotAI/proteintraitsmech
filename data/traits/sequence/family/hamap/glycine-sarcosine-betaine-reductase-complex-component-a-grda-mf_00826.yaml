identifier: HAMAP:MF_00826
label: "Glycine/sarcosine/betaine reductase complex component A [grdA]"
definition: >-
  Found in clostridia, this protein contains one active site selenocysteine and catalyses the reductive deamination of glycine, which is coupled to the esterification of orthophosphate resulting in the formation of ATP. A member of this family may also exist in Treponema denticola.
