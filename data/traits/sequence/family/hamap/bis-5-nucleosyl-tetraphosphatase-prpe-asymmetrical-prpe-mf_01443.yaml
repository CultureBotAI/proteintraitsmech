identifier: HAMAP:MF_01443
label: "Bis(5'-nucleosyl)-tetraphosphatase PrpE [asymmetrical] [prpE]"
definition: >-
  Bis(5'-nucleosyl)-tetraphosphatase (PrpE) asymmetrically hydrolyses Ap4p to yield AMP and ATP, but does not hydrolyse Ap2a or Ap6A. It also has an ATPase activity. In Bacillus subtilis, it has been shown to dephosphorylate phosphotyrosine but not phosphoserine or phosphothreonine from phosphorylated peptides. It is also involved in spore germination by controlling expression of genes coding for GerA and GerK receptors.
