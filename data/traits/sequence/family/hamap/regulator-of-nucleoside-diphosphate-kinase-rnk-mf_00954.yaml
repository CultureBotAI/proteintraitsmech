identifier: HAMAP:MF_00954
label: "Regulator of nucleoside diphosphate kinase [rnk]"
definition: >-
  Regulator of nucleoside diphosphate kinase (Rnk) is a RNA polymerase-interacting protein that shares high sequence similarity with the C-terminal domains of the Gre factors (GreA and GreB) and the Thermus/Deinococcus anti-Gre factor Gfh1. Rnk has been shown to regulate the levels of the nucleoside diphosphate kinase Ndk. It also has been shown to compete with the Gre factors for binding to RNA polymerase, and may therefore have a role as an anti-Gre factor.
definition_source: "InterPro:IPR028625 abstract (HAMAP MF_00954 is a member signature)"
