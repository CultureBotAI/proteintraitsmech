identifier: HAMAP:MF_01573
label: "Pyrrolysine--tRNA ligase [pylS]"
definition: >-
  PylS is the archaeal enzyme responsible for charging the pyrrolysine tRNA, PylT, by ligating a free molecule of pyrrolysine. Pyrrolysine is encoded at an in-frame UAG (amber) at least in several corrinoid-dependent methyltransferases of the archaeal genera Methanosarcina and Methanococcoides, e.g. trimethylamine methyltransferase.
