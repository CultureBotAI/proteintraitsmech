identifier: HAMAP:MF_01189
label: "Purine ribonucleoside efflux pump NepI [nepI]"
definition: >-
  This entry represents the nucleoside efflux permease-inosine (NepI) subfamily of the MSF superfamily. These proteins are nucleoside efflux pumps and are involved in the efflux of purine ribonucleosides, such as guanosine, adenosine and especially inosine. Among the different families of transporter, only two occur ubiquitously in all classifications of organisms. These are the ATP-Binding Cassette (ABC) superfamily and the Major Facilitator Superfamily (MFS). The MFS transporters are single-polypeptide secondary carriers capable only of transporting small solutes in response to chemiosmotic ion gradients.
definition_source: "InterPro:IPR023680 abstract (HAMAP MF_01189 is a member signature)"
