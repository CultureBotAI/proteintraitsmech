identifier: HAMAP:MF_00098
label: "Methionine--tRNA ligase [metG]"
definition: >-
  Methionine-tRNA ligase ( ) is an alpha 2 dimer. In some species (archaea, eubacteria and eukaryotes) a coding sequence, similar to the C-terminal end of MetRS, is present as an independent gene which is a tRNA binding domain as a dimer. In eubacteria, MetRS can also be split in two sub-classes corresponding to the presence of one or two CXXC domains specific to zinc binding. The crystal structures of a number of methionine-tRNA ligases are known. This entry represents type 1 methionine-tRNA ligase, found in eubacteria, archaea and eukaryotes. This entry also includes Hydroxylysine--glutamate ligase / hydrazine synthase PyrN, which is responsible for the hydrazine bond formation (N-N linkage) in the biosynthetic pathway of the antiviral antibiotic pyrazomycin (also known as pyrazofurin). It catalyses the ATP-dependent condensation of N6-hydroxy-L-lysine with L-glutamate, leading to 1-L-glutamo-2-N6-L-lysinohydrazine, via rearrangement of an unstable ester intermediate.
