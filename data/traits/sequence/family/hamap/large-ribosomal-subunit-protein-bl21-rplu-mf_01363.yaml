identifier: HAMAP:MF_01363
label: "Large ribosomal subunit protein bL21 [rplU]"
definition: >-
  This entry represents the Large ribosomal subunit protein bL21 found in bacteria and eukaryotic organelles such as chloroplast and mitochondria. In Escherichia coli, bL21 is known to bind to the 23S rRNA in the presence of bL20. It belongs to a family of ribosomal proteins which, on the basis of sequence similarities, groups: Bacterial bL21 (old name L21). Marchantia polymorpha, chloroplast bL21 (old name L21). Dictyostelium discoideum, mitochondrial bL21m (old name L21). Plant, chloroplast bL21c (old name L21, nuclear-encoded) and mitochondrial bL21m (old name L21). Bacterial bL21 is a protein of about 100 amino-acid residues, the mature form of the spinach chloroplast L21 has 200 residues.
definition_source: "InterPro:IPR001787 abstract (HAMAP MF_01363 is a member signature)"
