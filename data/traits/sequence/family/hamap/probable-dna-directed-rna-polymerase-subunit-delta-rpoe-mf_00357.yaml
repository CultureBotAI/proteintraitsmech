identifier: HAMAP:MF_00357
label: "Probable DNA-directed RNA polymerase subunit delta [rpoE]"
definition: >-
  This entry includes DNA-directed RNA polymerase subunit delta from Bacillus subtilis. The delta protein is a dispensable subunit of Bacillus subtilis RNA polymerase (RNAP) that has major effects on the biochemical properties of the purified enzyme. In the presence of delta, RNAP displays an increased specificity of transcription, a decreased affinity for nucleic acids, and an increased efficiency of RNA synthesis because of enhanced recycling. The delta protein, contains two distinct regions, an ordered N-terminal domain and a glutamate and aspartate residue-rich C-terminal region, unordered and flexible. It participates in both the initiation and recycling phases of transcription and also in the adaptation to changes in the environment.
definition_source: "InterPro:IPR029757 abstract (HAMAP MF_00357 is a member signature)"
