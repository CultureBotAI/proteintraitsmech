identifier: HAMAP:MF_00836
label: "Ribose 1,5-bisphosphate phosphokinase PhnN [phnN]"
definition: >-
  Many bacteria can use organophosphonates as a source of phosphate by cleaving the carbon-phosphorus bond with a multi-enzyme pathway collectively called carbon-phosphorus lyase. PhnN is part of this pathway and catalyses the phosphorylation of ribose 1,5-bisphosphate to 5-phospho-D-ribosyl alpha-1-diphosphate (PRPP). This family also includes some bifunctional ribose 1,5-bisphosphokinase-thymidine phosphorylases.
