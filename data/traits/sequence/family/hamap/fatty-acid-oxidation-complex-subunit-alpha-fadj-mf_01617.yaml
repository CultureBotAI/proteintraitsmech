identifier: HAMAP:MF_01617
label: "Fatty acid oxidation complex subunit alpha [fadJ]"
definition: >-
  Members of this family represent the alpha subunit of the multifunctional enzyme complex of the fatty acid degradation cycle, which plays a minor role in aerobic beta-oxidation of fatty acids. The FadJI complex is necessary for anaerobic growth on short-chain acids with nitrate as an electron acceptor. Activities include: enoyl-CoA hydratase (EC:4.2.1.17), 3-hydroxyacyl-CoA dehydrogenase (EC:1.1.1.35), and 3-hydroxybutyryl-CoA epimerase (EC:5.1.2.3). Dehydrogenase activity results in the conversion of NADH to NAD +. A representative is the Escherichia coli FadJ protein (also named YfcX) (UniProtKB:P77399). This entry excludes FadB of InterPro:IPR012799.
definition_source: "InterPro:IPR012802 abstract (HAMAP MF_01617 is a member signature)"
