identifier: HAMAP:MF_01482
label: "Mycothiol S-conjugate amidase [mca]"
definition: >-
  Mycobacterium tuberculosis, Corynebacterium glutamicum (Brevibacterium flavum), and related species use the thiol mycothiol in place of glutathione. This enzyme, homologous to the (dispensable) MshB enzyme of mycothiol biosynthesis, is described as an amidase that acts on conjugates to mycothiol, and functions as a detoxification enzyme.
