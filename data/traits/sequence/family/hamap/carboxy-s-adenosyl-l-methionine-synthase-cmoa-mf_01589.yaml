identifier: HAMAP:MF_01589
label: "Carboxy-S-adenosyl-L-methionine synthase [cmoA]"
definition: >-
  This family represents the carboxy-S-adenosyl-L-methionine synthase CmoA. CmoA and CmoB are important components of the cmo5U biosynthetic pathway. These enzymes are involved in the conversion of 5-methoxyuridine (mo5U) to uridine-5-oxyacetic acid (cmo5U) at the wobble position (34) of tRNA. Uridine-5-oxyacetic acid at tRNA position 34 is apparently necessary for the efficient decoding of G-ending Pro, Ala, and Val codons in these organisms. cmo5U modification requires the previously unknown metabolite carboxy-S-adenosine-L-methionine (Cx-SAM), which is generated by CmoA through conversion of prephenate and SAM to yield Cx-SAM and phenylpyruvate.
definition_source: "InterPro:IPR005271 abstract (HAMAP MF_01589 is a member signature)"
