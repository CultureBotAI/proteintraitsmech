identifier: HAMAP:MF_01002
label: "TDP-N-acetylfucosamine:lipid II N-acetylfucosaminyltransferase [wecF]"
definition: >-
  TDP-N-acetylfucosamine:lipid II N-acetylfucosaminyltransferase catalyses the synthesis of Fuc4NAc-ManNAcA-GlcNAc-PP-Und (lipid III) as part of the biosynthetic pathway of enterobacterial common antigen (ECA), a polysaccharide comprised of the trisaccharide repeat unit Fuc4NAc-ManNAcA-GlcNAc.
