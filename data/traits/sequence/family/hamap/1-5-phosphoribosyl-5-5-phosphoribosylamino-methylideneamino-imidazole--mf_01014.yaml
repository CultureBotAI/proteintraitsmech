identifier: HAMAP:MF_01014
label: "1-(5-phosphoribosyl)-5-[(5-phosphoribosylamino)methylideneamino] imidazole-4-carboxamide isomerase [hisA]"
definition: >-
  This protein family consists of HisA, phosphoribosylformimino-5-aminoimidazole carboxamide ribotide isomerase, also known as 1-(5-phosphoribosyl)-5-(5-phosphoribosylamino methylideneamino) imidazole-4-carboxamide isomerase (EC:5.3.1.16), the enzyme catalyzing the fourth step in histidine biosynthesis. It is closely related to the enzyme HisF for the sixth step. Examples of this enzyme in Actinobacteria have been found to be bifunctional, also possessing phosphoribosylanthranilate isomerase activity.
definition_source: "InterPro:IPR023016 abstract (HAMAP MF_01014 is a member signature)"
