identifier: HAMAP:MF_01205
label: "O-acetyl-ADP-ribose deacetylase [ymdB]"
definition: >-
  O-acetyl-ADP-ribose deacetylase deacetylates O-acetyl-ADP ribose and down-regulates ribonuclease 3 (RNase III) activity. It acts by interacting directly with the region of the ribonuclease that is required for dimerisation/activation.
