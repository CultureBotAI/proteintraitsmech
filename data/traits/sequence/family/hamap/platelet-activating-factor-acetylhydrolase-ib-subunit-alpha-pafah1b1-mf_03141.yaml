identifier: HAMAP:MF_03141
label: "Platelet-activating factor acetylhydrolase IB subunit alpha [PAFAH1B1]"
definition: >-
  This entry represents Lissencephaly-1 (LIS1) and homologues. LIS1 is required for nuclear migration in fungi, cell cycle progression in mammals, and the formation of a folded cerebral cortex in humans. They appear to regulate the mechanical behaviour of cytoplasmic dynein, the primary minus-end-directed microtubule motor. Proteins in this entry include: Platelet-activating factor acetylhydrolase IB subunit alpha, also known as Lissencephaly-1 protein. Nuclear distribution protein PAC1 from budding yeasts. Fungal nuclear distribution protein nudF. Mutations in the LIS1 gene cause Lissencephaly-1, a classical lissencephaly characterised by agyria or pachygyria and disorganization of the clear neuronal lamination of normal six-layered cortex.
definition_source: "InterPro:IPR017252 abstract (HAMAP MF_03141 is a member signature)"
