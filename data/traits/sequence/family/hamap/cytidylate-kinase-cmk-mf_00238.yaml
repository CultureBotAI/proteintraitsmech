identifier: HAMAP:MF_00238
label: "Cytidylate kinase [cmk]"
definition: >-
  Cytidylate kinase ( EC:2.7.4.14 ) catalyses the phosphorylation of cytidine 5-monophosphate (dCMP) to cytidine 5 -diphosphate (dCDP) in the presence of ATP or GTP. UMP and dCMP can also act as acceptors.
