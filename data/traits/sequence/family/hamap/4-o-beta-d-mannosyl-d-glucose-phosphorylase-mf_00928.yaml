identifier: HAMAP:MF_00928
label: "4-O-beta-D-mannosyl-D-glucose phosphorylase"
definition: >-
  4-O-beta-D-mannosyl-D-glucose phosphorylase converts 4-O-beta-D-mannopyranosyl-D-glucopyranose (Man-Glc) to mannose 1-phosphate (Man1P) and glucose. It is involved in a mannan catabolic pathway which feeds into glycolysis.
