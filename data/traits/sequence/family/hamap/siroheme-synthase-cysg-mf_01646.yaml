identifier: HAMAP:MF_01646
label: "Siroheme synthase [cysG]"
definition: >-
  Sirohaem synthase (CysG), a multifunctional enzyme of the sirohaem and cobalamin (vitamin B12) biosynthesis pathways, represents a fusion between uroporphyrin-III C-methyltransferase (SUMT) and precorrin-2 oxidase/chelatase. Therefore, in some bacteria, all four reactions of sirohaem biosynthesis are catalysed by one multifunctional enzyme, sirohaem synthase. Sirohaem and cobalamin are related macrocyclic structures derived from uroporphyrinogen III by C-methylation of the tetrapyrrole framework. All biologically important modified tetrapyrroles (including also haem and chlorophyll) share a common biosynthetic pathway up to the synthesis of the first macrocyclic intermediate, uroporphyrinogen III. Then, SUMT (corresponding to the C-terminal (CysGA) domain of CysG () catalyses C-methylation of uroporphyrinogen III ( ). It transfers two methyl groups from S-adenosyl-L-methionine to the C-2 and C-7 atoms of uroporphyrinogen III to yield precorrin-2 via the intermediate formation of precorrin-1. SUMT is the first enzyme committed to the biosynthesis of either sirohaem or cobalamin rather than haem, and precorrin-2 is the last common intermediate in the biosynthesis of corrinoids such as cobalamin, sirohaem and coenzyme F430. SUMT belongs to the domain superfamily of tetrapyrrole (corrin/porphyrin) methylases ( ), which includes methylases that use S-AdoMet in the methylation of diverse substrates. In sirohaem biosynthesis, the next two steps are beta-NAD( + )-dependent dehydrogenation of precorrin-2 to generate sirohydrochlorin followed by ferrochelation to yield sirohaem. Both of these steps are performed by precorrin-2 oxidase/ferrochelatase. In sirohaem synthase CysG, it corresponds to the N-terminal (CysGB) domain. Ferrochelation can also be performed by CbiK ( ) or by
