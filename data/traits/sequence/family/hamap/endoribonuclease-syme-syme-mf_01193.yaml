identifier: HAMAP:MF_01193
label: "Endoribonuclease SymE [symE]"
definition: >-
  SymE (SOS-induced yjiW gene with similarity to MazE) belongs to type I toxin-antitoxin systems, and it is an SOS-induced toxin. It inhibits cell growth, decreases protein synthesis and increases RNA degradation. It may play a role in the recycling of RNAs damaged under SOS response-inducing conditions. Its translation is repressed by the antisense RNA SymR, which acts as an antitoxin.
