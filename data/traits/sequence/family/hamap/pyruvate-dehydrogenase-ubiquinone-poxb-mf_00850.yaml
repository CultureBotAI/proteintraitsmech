identifier: HAMAP:MF_00850
label: "Pyruvate dehydrogenase [ubiquinone] [poxB]"
definition: >-
  This entry represents a group of pyruvate dehydrogenases, including PoxB from Escherichia coli. PoxB is a peripheral membrane protein catalysing the oxidative decarboxylation of the central metabolite pyruvate to CO(2) and acetate.
