identifier: HAMAP:MF_00635
label: "Probable deoxyuridine 5'-triphosphate nucleotidohydrolase [dut]"
definition: >-
  The essential enzyme deoxyuridine triphosphate nucleotidohydrolase (dUTPase) (EC:3.6.1.23) is specific for dUTP and is critical for the fidelity of DNA replication and repair. dUTPase hydrolyzes dUTP to dUMP and pyrophosphate, simultaneously reducing dUTP levels and providing the dUMP for dTTP biosynthesis. dUTPase decreases the intracellular concentration of dUTP so that uracil cannot be incorporated into DNA. This entry represents archaeal dUTPases.
definition_source: "InterPro:IPR023537 abstract (HAMAP MF_00635 is a member signature)"
