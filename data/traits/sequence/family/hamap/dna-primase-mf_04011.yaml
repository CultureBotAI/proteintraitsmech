identifier: HAMAP:MF_04011
label: "DNA primase"
definition: >-
  DNA primase (UL70) is the essential primase component of the helicase/primase complex which unwinds the DNA at replication forks and generates single-stranded DNA for both leading and lagging strand synthesis. The helicase/primase is a complex of UL70, UL102 (a component with no known function) and UL105 (the helicase). The primase initiates primer synthesis and thereby produces large amount of short RNA primers on the lagging strand that the polymerase elongates using dNTPs. UL70 activity relies upon two aspartic acid residues.
definition_source: "InterPro:IPR033685 abstract (HAMAP MF_04011 is a member signature)"
