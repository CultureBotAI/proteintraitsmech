identifier: HAMAP:MF_00027
label: "Hydrogenobyrinate a,c-diamide synthase [cobB]"
definition: >-
  This family describes cobyrinic acid a,c-diamide synthase CbiA protein of cobalamin biosynthesis. It is responsible for the amidation of cobyrinic acid to cobyrinic acid a,c-diamide via the intermediate formation of cobyrinic acid c-monoamide or hydrogenobrynic acid. NH(2) groups are provided by glutamine and one molecule of ATP hydrogenolyzed for each amidation. This entry also includes the hydrogenobyrinate a,c-diamide synthase CobB that catalyzes the ATP-dependent amidation of the two carboxylate groups at positions a and c of hydrogenobyrinate, using either L-glutamine or ammonia as the nitrogen source.
definition_source: "InterPro:IPR004484 abstract (HAMAP MF_00027 is a member signature)"
