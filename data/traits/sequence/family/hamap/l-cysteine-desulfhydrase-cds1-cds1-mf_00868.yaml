identifier: HAMAP:MF_00868
label: "L-cysteine desulfhydrase Cds1 [cds1]"
definition: >-
  This entry represents a group of proteins from proteobacteria and actinomycetes, including L-cysteine desulfhydrase Cds1 from Mycobacterium tuberculosis. Cds1 is a cysteine desulfhydrase that generates hydrogen sulfide, H2S, which modulates the balance between respiration and glycolysis, and also contributes to redox homeostasis in this organism. Members of this protein family have a PALP domain (InterPro:IPR001926).
