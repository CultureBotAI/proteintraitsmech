identifier: HAMAP:MF_01516
label: "Malate dehydrogenase [mdh]"
definition: >-
  This enzyme catalyzes the reversible oxidation of malate to oxaloacetate. It exist as a homodimer and belongs to the LDH/MDH superfamily, specifically to the MDH type 1 family.
