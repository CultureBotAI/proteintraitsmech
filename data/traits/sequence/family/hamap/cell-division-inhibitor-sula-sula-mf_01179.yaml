identifier: HAMAP:MF_01179
label: "Cell division inhibitor SulA [sulA]"
definition: >-
  This entry represents a group of proteins specific to enterobacterales, including Cell division inhibitor SulA from Escherichia coli, a cell division inhibitor induced by the SOS response. This protein interacts with FtsZ to halt cell division. SulA proteins, like FtsZ, differ greatly by lineage, with SulA from Pseudomonas showing a different architecture.
