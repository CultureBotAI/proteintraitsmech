identifier: HAMAP:MF_00298
label: "RNA pyrophosphohydrolase [rppH]"
definition: >-
  This entry represents an RNA pyrophosphohydrolase belonging to the nudix hydrolase family, RppH subfamily which includes RppH from bacteria and NUD25-27 from plants. RppH accelerates the degradation of transcripts by removing pyrophosphate from the 5'-end of triphosphorylated RNA, leading to a more labile monophosphorylated state that can stimulate subsequent ribonuclease cleavage. NUD25-27 mediate the hydrolysis of some nucleoside diphosphate derivatives. They can use diadenosine 5',5'''-P1P5 pentaphosphate (Ap5A) as substrates.
definition_source: "InterPro:IPR022927 abstract (HAMAP MF_00298 is a member signature)"
