identifier: HAMAP:MF_00504
label: "Peptidase B [pepB]"
definition: >-
  This family represents the peptidase B group of leucyl aminopeptidases, which are restricted to the gammaproteobacteria. They contain a C-terminal aminopeptidase catalytic domain and an N-terminal domain of unknown function. They are zinc-dependent exopeptidases (EC:3.4.11.1) and belong to MEROPS peptidase family M17 (leucyl aminopeptidase family, clan MF). They selectively release N-terminal amino acid residues from polypeptides and proteins and are involved in the processing, catabolism and degradation of intracellular proteins. Leucyl aminopeptidase forms a homohexamer containing two trimers stacked on top of one another. Each monomer binds two zinc ions. The zinc-binding and catalytic sites are located within the C-terminal catalytic domain. The same catalytic aminopeptidase domain is found in the other M17 peptidases InterPro:IPR011356. These two groups of aminopeptidases differ by their N-terminal domains. The N-terminal domain in members of InterPro:IPR011356 has been implicated in DNA binding and it is not associated with members of this family which have a different N-terminal domain and therefore are not expected to bind DNA or be involved in transcriptional regulation. In addition, there are related proteins with the same catalytic domain and unique N-terminal sequences unrelated to any of the two N-terminal domains discussed above. For additional information please see. Over 70 metallopeptidase families have been identified to date. In these enzymes a divalent cation, which is usually zinc but may be cobalt, manganese or copper, activates the water molecule. The metal ion is held in place by amino acid ligands, usually three in number. In some families of co-catalytic metallopeptidases, two metal ions are observed in crystal structures ligated by five amino 
