identifier: HAMAP:MF_00734
label: "Tagatose 1,6-diphosphate aldolase [lacD]"
definition: >-
  Proteins from this entry are from Gram-positive bacteria and belong to the aldolase lacD family. Tagatose 1,6-diphosphate aldolase is a class I aldolase. It catalyses the reversible cleavage of four diastereoisomers (fructose 1,6-bisphosphate (FBP), psicose 1,6-bisphosphate, sorbose 1,6-bisphosphate, and tagatose 1,6-bisphosphate) to dihydroxyacetone phosphate (DHAP) and d-glyceraldehyde 3-phosphate with high catalytic efficiency. Aldolases play important roles in essential metabolic pathways, such as gluconeogenesis and glycolysis. They are classified with respect to their catalytic mechanism into two classes: class I adolases are are characterised by formation of covalent Schiff base intermediates, while class II aldolases are metallodependent enzymes and use a divalent transition metal ion to polarize the substrate ketose.
definition_source: "InterPro:IPR005927 abstract (HAMAP MF_00734 is a member signature)"
