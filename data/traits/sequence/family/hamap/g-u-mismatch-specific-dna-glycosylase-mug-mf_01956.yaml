identifier: HAMAP:MF_01956
label: "G/U mismatch-specific DNA glycosylase [mug]"
definition: >-
  This family represents the bacterial G/U mismatch-specific DNA glycosylase MUG. G:U mismatches resulting from deamination of cytosine are the most common pro-mutagenic lesions occurring in DNA. Uracil is removed in a base-excision repair pathway by uracil DNA-glycosylase (UDG), which excises uracil from both single- and double-stranded DNA. The uracil DNA glycosylase family 2 consists of thymine DNA glycosylase (TDG) from eukaryotes and mismatch-specific uracil DNA glycosylase (MUG) from prokaryotes. Thymine DNA glycosylases (TDG) in eukaryotic organisms are known for their double-stranded glycosylase activity on guanine/uracil (G/U) base pairs. In human TDG removes uracil and thymine from G:U and G:T mismatches in double-stranded DNA. In E. coli MUG is highly specific to G:U mismatches but also repairs G:T mismatches at high enzyme concentration. Structural studies of E. coli MUG reveal its structural homology to UDG despite low sequence identity. It has a specific uracil-binding pocket located in a DNA-binding groove and this specificity is likely the result of a multistep lesion recognition process.
