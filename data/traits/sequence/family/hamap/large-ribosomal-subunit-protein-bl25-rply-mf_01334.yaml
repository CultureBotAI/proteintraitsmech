identifier: HAMAP:MF_01334
label: "Large ribosomal subunit protein bL25 [rplY]"
definition: >-
  This entry represents the full-length form of ribosomal protein bL25 (previously known as L25), such as ribosomal protein TL5 of Thermus thermophilus. It has homology to the general stress protein Ctc of Bacillus subtilis, which has now been localised to ribosomes and can be viewed as the long form, or Ctc form, of L25. Ribosomal protein L25 of Escherichia coli and Haemophilus influenzae appear to be orthologous, but consist only of the N-terminal half of Ctc and TL5. Both short (L25-like) and full-length (CTC-like) forms of L15 bind the E-loop of bacterial 5S rRNA. This entry also represents L25 proteins in mitochondria and plastids from eukaryotes.
definition_source: "InterPro:IPR001021 abstract (HAMAP MF_01334 is a member signature)"
