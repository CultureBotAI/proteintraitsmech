identifier: HAMAP:MF_01405
label: "dITP/XTP pyrophosphatase"
definition: >-
  This entry represents a family of nucleoside-triphosphatases that hydrolyse non-standard nucleotides such as deoxyinosine triphosphate (dITP) and xanthosine triphosphate (XTP). It has been suggested that they may function as part of a preemptive DNA repair system by excluding non-standard purines from DNA precursor pool, thus preventing their incorporation into DNA and avoiding chromosomal lesions.
