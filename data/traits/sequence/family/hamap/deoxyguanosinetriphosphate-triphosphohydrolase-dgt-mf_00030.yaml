identifier: HAMAP:MF_00030
label: "Deoxyguanosinetriphosphate triphosphohydrolase [dgt]"
definition: >-
  This entry represents a subgroup of dNTP triphosphohydrolases mostly from gamma-proteobacteria. Proteins in this entry include dGTPase from E. coli and PA1124 (UniProtKB:Q9I4L1) from Pseudomonas aeruginosa. They are triphosphohydrolases that have a preference for dGTP.
