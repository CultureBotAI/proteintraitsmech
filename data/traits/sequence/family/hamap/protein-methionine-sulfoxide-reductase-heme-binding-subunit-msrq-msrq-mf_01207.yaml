identifier: HAMAP:MF_01207
label: "Protein-methionine-sulfoxide reductase heme-binding subunit MsrQ [msrQ]"
definition: >-
  MsrPQ is an enzymatic system that repairs proteins containing methionine sulfoxide in the bacterial cell envelope. MsrP, a molybdo-enzyme, and MsrQ, a haem-binding membrane protein, are widely conserved throughout Gram-negative bacteria. MsrPQ uses electrons from the respiratory chain, which represents a novel mechanism to import reducing equivalents into the bacterial cell envelope. MsrPQ is essential for the maintenance of envelope integrity under bleach stress, rescuing periplasmic proteins from methionine oxidation, including the primary periplasmic chaperone SurA. This family represents MsrQ. This family also includes magnetosome protein MamZ, which despite its similarity of sequence to MsrQ, has been shown not to genetically interact with MsrP. Rather it has been proposed to be involved in balancing the redox state of iron within the magnetosome compartment.
definition_source: "InterPro:IPR022837 abstract (HAMAP MF_01207 is a member signature)"
