identifier: HAMAP:MF_00922
label: "Outer membrane protein assembly factor BamD [bamD]"
definition: >-
  Outer membrane protein assembly factor BamD, also known as YfiO in Escherichia coli, is part of the outer membrane protein assembly Bam complex (composed of the outer membrane protein BamA, and four lipoproteins BamB, BamC, BamD and BamE), which is involved in assembly and insertion of β-barrel proteins into the outer membrane. In E. coli, the N-terminal of BamD may interact with various proteins as a chaperone to assist in the folding and insertion of proteins into the outer membrane. The C-terminal region of BamD may serve as the link between BamA, BamC and BamE.
