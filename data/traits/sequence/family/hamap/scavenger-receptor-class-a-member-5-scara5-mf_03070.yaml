identifier: HAMAP:MF_03070
label: "Scavenger receptor class A member 5 [SCARA5]"
definition: >-
  Scara5 is a ferritin receptor that mediates non-transferrin iron delivery. It binds serum ferritin and then stimulates its endocytosis from the cell surface. It was identified as a cell type-specific alternatively mechanism of iron traffic during organogenesis. It has been classified as belonging to class A scavenger receptors.
