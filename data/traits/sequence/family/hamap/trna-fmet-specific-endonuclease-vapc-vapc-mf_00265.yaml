identifier: HAMAP:MF_00265
label: "tRNA(fMet)-specific endonuclease VapC [vapC]"
definition: >-
  This entry represents VapC family of proteins, which are toxic components of a toxin-antitoxin (TA) module. VapC family members are ribonucleases but are unable to degrade ds- or ss-DNA. Several bacterial VapC proteins have been shown to be tRNA (fMet)-specific endonucleases.
