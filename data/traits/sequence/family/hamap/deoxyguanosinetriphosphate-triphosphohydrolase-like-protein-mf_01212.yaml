identifier: HAMAP:MF_01212
label: "Deoxyguanosinetriphosphate triphosphohydrolase-like protein"
definition: >-
  This entry represents a subgroup of dNTP triphosphohydrolases, classified as type 2 dNTPases. Proteins in this entry includes TTHA0412 ( UniProtKB:Q5SL81 ) from Thermus thermophilus HB8. It hydrolyzes multiple kinds of dNTP upon activation by binding of an activator. Its dNTP triphosphohydrolase activity is stimulated by dATP and dTTP.
