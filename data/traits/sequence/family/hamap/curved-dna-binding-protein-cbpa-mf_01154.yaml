identifier: HAMAP:MF_01154
label: "Curved DNA-binding protein [cbpA]"
definition: >-
  This entry represents DNA-binding proteins that preferentially recognise a curved DNA sequence. It is probably a functional analog of DnaJ; displaying overlapping activities with DnaJ, but functions under different conditions, probably acting as a molecular chaperone in an adaptive response to environmental stresses other than heatshock. these proteins lack autonomous chaperone activity and bind native substrates and targets them for recognition by DnaK. Their activity is inhibited by the binding of CbpM.
