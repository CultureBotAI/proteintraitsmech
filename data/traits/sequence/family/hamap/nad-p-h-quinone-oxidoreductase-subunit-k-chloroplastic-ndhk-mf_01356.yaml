identifier: HAMAP:MF_01356
label: "NAD(P)H-quinone oxidoreductase subunit K, chloroplastic [ndhK]"
definition: >-
  Among the many polypeptide subunits that make up complex I, there is one with a molecular weight of 20kDa (in mammals), which is a component of the iron-sulphur (IP) fragment of the enzyme. It seems to bind a 4Fe-4S iron-sulphur cluster. The 20kDa subunit has been found to be nuclear encoded, as a precursor form with a transit peptide in mammals, and in Neurospora crassa. It is mitochondrial encoded in Paramecium (gene psbG) and chloroplast encoded in various higher plants (gene ndhK or psbG).
definition_source: "InterPro:IPR006138 abstract (HAMAP MF_01356 is a member signature)"
