identifier: HAMAP:MF_00215
label: "Pantothenate kinase [coaA]"
definition: >-
  Pantothenate kinase (EC:2.7.1.33) catalyses the rate-limiting step in the biosynthesis of coenzyme A, the conversion of pantothenate to D-4'-phosphopantothenate in the presence of ATP. It is very well conserved from Escherichia coli to Bacillus subtilis, but differs considerably from known eukaryotic forms, described in a separate family. It has been shown to be a homodimer in E. coli and is regulated by feedback inhibition by CoA and its thioesters.
