identifier: HAMAP:MF_01513
label: "Aromatic amino acid aminotransferase [pat]"
definition: >-
  Proteins in this family belong to the class-II pyridoxal-phosphate-dependent aminotransferase family. They catalyse the conversion of aromatic amino acids and 2-oxoglutarate into corresponding aromatic oxo acids and L-glutamate. ArAT from Mycobacterium tuberculosis has a high activity with phenylalanine, and lower activity with tyrosine and tryptophan.
