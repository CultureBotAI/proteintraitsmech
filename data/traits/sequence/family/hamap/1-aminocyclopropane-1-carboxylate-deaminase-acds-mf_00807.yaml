identifier: HAMAP:MF_00807
label: "1-aminocyclopropane-1-carboxylate deaminase [acdS]"
definition: >-
  1-aminocyclopropane-1-carboxylate deaminase (EC:3.5.99.7) is a pyridoxal phosphate-dependent enzyme which degrades 1-aminocyclopropane-1-carboxylate to ammonia and alpha-ketoglutarate. Some plant growth-promoting rhizobacteria can produce 1-aminocyclopropane-1-carboxylate deaminase to enhance plant growth. This entry only contains bacterial enzymes.
