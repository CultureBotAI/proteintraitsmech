identifier: HAMAP:MF_00729
label: "Fructose-bisphosphate aldolase class 1 [fda]"
definition: >-
  Fructose-bisphosphate aldolase (EC:4.1.2.13) is a glycolytic enzyme that catalyses the reversible aldol cleavage or condensation of fructose-1,6-bisphosphate into dihydroxyacetone-phosphate and glyceraldehyde 3-phosphate. There are two classes of fructose-bisphosphate aldolases with different catalytic mechanisms: class I enzymes do not require a metal ion, and are characterised by the formation of a Schiff base intermediate between a highly conserved active site lysine and a substrate carbonyl group, while the class II enzymes require an active-site divalent metal ion. This entry represents class I enzymes from Gram-positive and some Gram-negative bacteria.
definition_source: "InterPro:IPR023014 abstract (HAMAP MF_00729 is a member signature)"
