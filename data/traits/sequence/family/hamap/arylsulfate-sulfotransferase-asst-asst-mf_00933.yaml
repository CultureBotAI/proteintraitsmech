identifier: HAMAP:MF_00933
label: "Arylsulfate sulfotransferase AssT [assT]"
definition: >-
  Arylsulfate sulfotransferase AssT catalyses the transfer of sulfuryl groups between phenolic compounds. AssT genes are present in different organisms, including mammals and a wide spectrum of microbial genomes. This entry represents AssT from Enterobacteria.
