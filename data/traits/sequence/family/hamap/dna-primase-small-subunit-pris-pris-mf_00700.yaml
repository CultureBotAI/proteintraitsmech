identifier: HAMAP:MF_00700
label: "DNA primase small subunit PriS [priS]"
definition: >-
  This family represents sequences of the DNA primase small subunit PriS from archaea. DNA primase synthesises the RNA primers for the Okazaki fragments in lagging strand DNA synthesis. DNA primase is a heterodimer of large and small subunits.
