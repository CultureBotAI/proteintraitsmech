identifier: HAMAP:MF_03103
label: "Maintenance of mitochondrial morphology protein 1 [MMM1]"
definition: >-
  Maintenance of mitochondrial morphology protein 1 (Mmm1) is a component of the ERMES/MDM complex (composed of MMM1, MDM10, MDM12 and MDM34), which serves as a molecular tether to connect the endoplasmic reticulum and mitochondria. The MDM12-MMM1 subcomplex functions in biogenesis of all outer membrane β-barrel proteins, and acts in a late step after the SAM (sorting and assembly machinery) complex. The MDM10-MDM12-MMM1 subcomplex further acts in the TOM40 (translocase of outer membrane 40)-specific pathway after the action of the MDM12-MMM1 complex.
definition_source: "InterPro:IPR027537 abstract (HAMAP MF_03103 is a member signature)"
