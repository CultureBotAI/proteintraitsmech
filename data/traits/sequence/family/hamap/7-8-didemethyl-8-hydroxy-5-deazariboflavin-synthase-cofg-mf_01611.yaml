identifier: HAMAP:MF_01611
label: "7,8-didemethyl-8-hydroxy-5-deazariboflavin synthase [cofG]"
definition: >-
  This entry represents either a subunit (CofG/subunit 1) or the N-terminal domain of a bifunctional protein that completes the synthesis of 7,8-didemethyl-8-hydroxy-5-deazariboflavin, or FO. FO is the chromophore of coenzyme F(420), involved in methanogenesis in methanogenic archaea but found in certain other lineages as well. The chromophore also occurs as a cofactor in DNA photolyases in Cyanobacteria.
definition_source: "InterPro:IPR019939 abstract (HAMAP MF_01611 is a member signature)"
