identifier: HAMAP:MF_01896
label: "DNA gyrase inhibitor [sbmC]"
definition: >-
  DNA gyrase, a type II topoisomerase, negatively supercoils DNA and is essential for the survival of bacterial cells. This entry represents DNA gyrase inhibitor from Escherichia coli (SmbC) and similar sequences from enterobacterales. SmbC, also known as GyrI, is a protein which inhibits the supercoiling activity of DNA gyrase. The mechanism of this inhibition is not known, but it occurs either before or during DNA binding by the gyrase. GyrI protects cells from the double-strand DNA breaks produced by gyrase inhibitors, such as quinolones, that act by trapping the gyrase-DNA covalent complex. It does not appear to protect against inhibitors that target ATPase activity. GyrI has also been shown to protect cells against alkylating agents that act independently of DNA gyrase, suggesting a more general role in protecting cells against DNA damage.
