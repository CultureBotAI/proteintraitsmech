identifier: HAMAP:MF_01934
label: "1,4-dihydroxy-2-naphthoyl-CoA synthase [menB]"
definition: >-
  This entry represents an enzyme, naphthoate synthase EC:4.1.3.36, MenB or dihydroxynaphthoic acid synthetase, which is involved in the fifth step of the menaquinone biosynthesis pathway. Menaquinone (vitamin K2), is an essential quinone used in electron-transfer pathways serving as the major electron carrier during anaerobic growth. In the bacterium, the biosynthetic pathway in bacteria typically comprises 6-7 steps. Together with o-succinylbenzoate-CoA ligase (menE InterPro:IPR010192), MenB takes 2-succinylbenzoate and converts it into 1,4-di-hydroxy-2-naphthoic acid (DHNA). The conversion of o-succinylbenzoate-CoA ligase to DHNA is mediated by the enzyme DHNA synthase, which is encoded by menB. The protein structure of naphthoate synthase has been expressed in Escherichia coli, purified and crystallised, and found to have fold characteristics of the crotonase family of enzymes, which is notable for the presence of several highly flexible regions around the active site. The C-terminal region of the protein may play a critical role both in completion of the binding pocket and in stabilisation of the hexamer, suggesting a link between oligomerisation and catalytic activity.
definition_source: "InterPro:IPR010198 abstract (HAMAP MF_01934 is a member signature)"
