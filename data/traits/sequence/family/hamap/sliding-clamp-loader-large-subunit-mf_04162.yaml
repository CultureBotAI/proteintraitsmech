identifier: HAMAP:MF_04162
label: "Sliding-clamp-loader large subunit"
definition: >-
  This family includes the sliding-clamp-loader large subunit (also known as gp44) from Bacteriophage T4. It forms the sliding-clamp-loader together with the small subunit and functions as an ATPase enzyme. The clamp loader holds the clamp in an open conformation and places it onto the DNA. ATP hydrolysis triggers the detachment of the sliding clamp from the sliding-clamp-loader, freeing the sliding clamp to track along DNA.
definition_source: "InterPro:IPR046388 abstract (HAMAP MF_04162 is a member signature)"
