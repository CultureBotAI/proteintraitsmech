identifier: HAMAP:MF_04044
label: "Large tegument protein deneddylase"
definition: >-
  All herpesviruses contain a Ubiquitin (Ub)-specific cysteine protease (USP) domain embedded within their large tegument protein. The herpesvirus tegument ubiquitin (Ub)-specific protease (htUSP) domain of ~200 amino acids adopts an α-β-α sandwich fold that features a central catalytic cleft, ideally suited to accommodate the C-terminal stretch of Ub. The catalytic triad Cys-His-Asp is strictly conserved, along with a putative oxyanion hole-forming Gln residue. The htUSP domain is a member of peptidase family C76 of clan CA. BPLF1, the Epstein-Barr-virus-encoded member of this protease family, is a deneddylase that regulates virus production by modulating the activity of cullin-RING ligases. Homologues encoded by other herpesviruses share the deneddylase activity.
definition_source: "InterPro:IPR034702 abstract (HAMAP MF_04044 is a member signature)"
