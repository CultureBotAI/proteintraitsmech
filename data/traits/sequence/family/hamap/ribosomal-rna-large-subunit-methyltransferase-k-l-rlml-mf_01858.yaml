identifier: HAMAP:MF_01858
label: "Ribosomal RNA large subunit methyltransferase K/L [rlmL]"
definition: >-
  This entry represents bacterial Ribosomal RNA large subunit methyltransferase K/L, which specifically methylates the guanine in position 2445 (m2G2445) and the guanine in position 2069 (m7G2069) of 23S rRNA. The methylation occurs before assembly of 23S rRNA into 50S subunits.
