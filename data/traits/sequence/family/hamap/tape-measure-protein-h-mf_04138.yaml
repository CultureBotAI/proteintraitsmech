identifier: HAMAP:MF_04138
label: "Tape measure protein [H]"
definition: >-
  This entry represents tape measure proteins (TMPs) found in Bacteriophage lambda and related phages. TMP is important for assembly of phage tails and involved in tail length determination. It serves as a ruler that controls the length of tail and is ejected from the tail prior to the DNA during DNA injection. Mutated forms of TMP cause tail fibres to be shortened. This protein is also found in bacteria, suggesting prophage matches also occur.
