identifier: HAMAP:MF_00463
label: "Ion-translocating oxidoreductase complex subunit B [rsxB]"
definition: >-
  The six subunit complex RnfABCDGE in Rhodobacter capsulatus (Rhodopseudomonas capsulata) encodes an apparent NADH oxidoreductase responsible for electron transport to nitrogenase, necessary for nitrogen fixation. A closely related complex in Escherichia coli, RsxABCDGE (Reducer of SoxR), reduces the 2Fe-2S-containing superoxide sensor SoxR, active as a transcription factor when oxidised. This family of putative NADH oxidoreductase complexes exists in many of the same species as the related NQR, a Na(+)-translocating NADH-quinone reductase, but is distinct. This entry describes the B subunit.
definition_source: "InterPro:IPR010207 abstract (HAMAP MF_00463 is a member signature)"
