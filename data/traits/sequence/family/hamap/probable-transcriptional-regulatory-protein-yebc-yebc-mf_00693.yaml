identifier: HAMAP:MF_00693
label: "Probable transcriptional regulatory protein YebC [yebC]"
definition: >-
  This is a family of transcriptional regulators. In mammals, TACO1 ( UniProtKB:Q9BSH4 ) activates the transcription of mitochondrially-encoded cytochrome c oxidase (COX1). Defects in TACO1 are a cause of Leigh syndrome (LS). LS is a severe neurological disorder characterised by bilaterally symmetrical necrotic lesions in subcortical brain regions that is commonly associated with systemic cytochrome c oxidase (COX) deficiency. In Pseudomonas aeruginosa, a member of this family, PmpR, is involved in regulation of the quinolone signal (PQS) system and of pyocyanine production. It negatively regulates the quorum-sensing response regulator pqsR of the PQS system by binding to its promoter region.
definition_source: "InterPro:IPR002876 abstract (HAMAP MF_00693 is a member signature)"
