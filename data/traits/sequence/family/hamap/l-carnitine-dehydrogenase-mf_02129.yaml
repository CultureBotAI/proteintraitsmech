identifier: HAMAP:MF_02129
label: "L-carnitine dehydrogenase"
definition: >-
  L-carnitine dehydrogenase catalyses the NAD+-dependent oxidation of L-carnitine to 3-dehydrocarnitine. Its substrates are L-carnitine and NAD+ but not D,L-3-hydroxybutyrate, L-lactate, ethanol, L-malate, and D,L-isocitrate. This enzyme is involved in a L-carnitine degradation pathway that allows bacteria (such as P.aeruginosa, Xanthomonas translucens and Rhizobium sp. YS-240) to grow on L-carnitine as the sole source of carbon and nitrogen. This entry also includes L-carnitine dehydrogenase/betainyl-CoA thioesterase, a multifuntional enzyme that catalyses the NAD+-dependent oxidation of L-carnitine to 3-dehydrocarnitine and the cleavage of betainyl-CoA (N,N,N-trimethylglycyl-CoA) into glycine betaine and coenzyme A.
definition_source: "InterPro:IPR026578 abstract (HAMAP MF_02129 is a member signature)"
