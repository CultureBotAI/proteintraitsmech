identifier: HAMAP:MF_01287
label: "Digeranylgeranylglycerophospholipid reductase"
definition: >-
  This entry represents a family of archaeal geranylgeranyl glycerophospholipid reductases. They are responsible for the reduction of 2,3-digeranylgeranylglycerophospholipids into 2,3-diphytanylglycerophospholipids during the biosynthesis of archaeal membrane lipids. They are also able to catalyse the reduction of 2,3-di-O-geranylgeranylglyceryl phosphate analogues such as 2,3-di-O-phytyl-sn-glyceryl phosphate, 3-O-(2,3-di-O-phytyl-sn-glycero-phospho)-sn-glycerol and 2,3-di-O-phytyl-sn-glycero-phosphoethanolamine.
definition_source: "InterPro:IPR023590 abstract (HAMAP MF_01287 is a member signature)"
