identifier: HAMAP:MF_03182
label: "PAN2-PAN3 deadenylation complex catalytic subunit PAN2 [PAN2]"
definition: >-
  Pan2 is a catalytic subunit of the poly(A)-nuclease (PAN) deadenylation complex, one of the two eukaryotic poly(A) nuclease complexes (Ccr4-Caf1 and Pan2-Pan3) involved in mRNA decay. Pan2 is involved in the initial stage of deadenylation of mRNA, which is required for poly(A) tail shortening. Regulation of mRNA decay rates in eukaryotic cells affects gene expression. The Pan2-Pan3 complex shortens cytoplasmic mRNA 3' polyA tails to regulate mRNA stability. In the complex Pan2 provides the catalytic activity, whereas Pan3 mediates Pan2 recruitment to mRNA targets.
