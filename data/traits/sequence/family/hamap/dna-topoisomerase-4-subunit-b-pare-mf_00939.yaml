identifier: HAMAP:MF_00939
label: "DNA topoisomerase 4 subunit B [parE]"
definition: >-
  This entry represents subunit B (parE) of topoisomerase IV from Firmicutes and Mollicutes. Topoisomerase IV primarily decatenates DNA and relaxes positive supercoils, which is important in bacteria, where the circular chromosome becomes catenated, or linked, during replication. Topoisomerase IV consists of two polypeptide subunits, parC (subunit A), which is homologous to gyrA of topoisomerase II, and parE (subunit B), which is homologous to gyrB of topoisomerase II.
