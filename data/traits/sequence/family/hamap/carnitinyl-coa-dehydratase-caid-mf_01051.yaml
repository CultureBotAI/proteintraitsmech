identifier: HAMAP:MF_01051
label: "Carnitinyl-CoA dehydratase [caiD]"
definition: >-
  The CaiD protein is a carnitinyl-CoA dehydratase enzyme which, together with carnitine-CoA transferase enzyme CaiB, is responsible for the transfomation of L-carnitine to crotonobetaine. Many enterobacteria are able to convert carnitine, via crotonobetaine, to gamma-butyrobetaine in the presence of carbon and nitrogen sources under anaerobic conditions. In Escherichia coli the enzymes involved in this pathway are encoded by the caiTABCDE operon. The adjacent but divergent fixABCD operon also appears to be necessary for carnintine meatbolism. The Fix proteins are homologous to proteins found in known electron transport pathways.
definition_source: "InterPro:IPR022852 abstract (HAMAP MF_01051 is a member signature)"
