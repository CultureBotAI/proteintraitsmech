identifier: HAMAP:MF_00339
label: "ATP-dependent 6-phosphofructokinase [pfkA]"
definition: >-
  6-phosphofructokinase ( ), a key regulatory enzyme in glycolysis, catalyses the addition of phosphate from ATP to fructose 6-phosphate to give fructose 1,6-bisphosphate. This represents a key control step in glycolysis. This entry contains bacterial ATP-dependent 6-phosphofructokinases, which lack a β-hairpin loop present in family members. contains members that are ATP-dependent as well as members that are pyrophosphate-dependent. represents the pyrophosphate-dependent phosphofructokinase, diphosphate--fructose-6-phosphate 1-phosphotransferase ( ).
