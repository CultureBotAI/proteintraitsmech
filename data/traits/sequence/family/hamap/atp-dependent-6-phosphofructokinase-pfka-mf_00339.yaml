identifier: HAMAP:MF_00339
label: "ATP-dependent 6-phosphofructokinase [pfkA]"
definition: >-
  6-phosphofructokinase (EC:2.7.1.11), a key regulatory enzyme in glycolysis, catalyses the addition of phosphate from ATP to fructose 6-phosphate to give fructose 1,6-bisphosphate. This represents a key control step in glycolysis. This entry contains bacterial ATP-dependent 6-phosphofructokinases, which lack a β-hairpin loop present in InterPro:IPR012829 family members. InterPro:IPR012829 contains members that are ATP-dependent as well as members that are pyrophosphate-dependent. InterPro:IPR011183 represents the pyrophosphate-dependent phosphofructokinase, diphosphate--fructose-6-phosphate 1-phosphotransferase (EC:2.7.1.90).
