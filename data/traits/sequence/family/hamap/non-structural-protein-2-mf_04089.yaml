identifier: HAMAP:MF_04089
label: "Non-structural protein 2"
definition: >-
  Rotavirus non-structural protein 2 (NSP2) is a basic protein which possesses RNA-binding activity and is essential for genome replication. It may also be important for viral RNA packaging.
