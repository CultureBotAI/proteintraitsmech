identifier: HAMAP:MF_01107
label: "Acetylornithine/succinyldiaminopimelate aminotransferase [argD]"
definition: >-
  This family of proteins, for which ornithine aminotransferases form an outgroup, consists mostly of proteins designated acetylornithine aminotransferase. However, the two very closely related members from Escherichia coli are assigned different enzymatic activities. One is acetylornithine aminotransferase (EC:2.6.1.11), ArgD, an enzyme of arginine biosynthesis, while another is succinylornithine aminotransferase, an enzyme of the arginine succinyltransferase pathway, an ammonia-generating pathway of arginine catabolism. Members of this family may also act on ornithine, like ornithine aminotransferase (EC:2.6.1.13) and on succinyldiaminopimelate, like N-succinyldiaminopmelate-aminotransferase (EC:2.6.1.17, DapC, an enzyme of lysine biosynthesis).
definition_source: "InterPro:IPR004636 abstract (HAMAP MF_01107 is a member signature)"
