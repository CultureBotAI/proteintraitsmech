identifier: HAMAP:MF_02010
label: "Anti-adapter protein IraD [iraD]"
definition: >-
  This entry represents the bacterial anti-adapter protein IraD (inhibitor of RssB after DNA damage) family. It inhibits RpoS proteolysis by regulating RssB activity, thereby increasing the stability of the sigma stress factor RpoS during oxidative stress. Its effect on RpoS stability is due to its interaction with RssB, which probably blocks the interaction of RssB with RpoS, and the consequent delivery of the RssB-RpoS complex to the ClpXP protein degradation pathway which inhibits RpoS proteolysis by regulating RssB adaptor activity.
definition_source: "InterPro:IPR023776 abstract (HAMAP MF_02010 is a member signature)"
