identifier: HAMAP:MF_00869
label: "Fusexin 1 [fsx1]"
definition: >-
  This entry represents a small group of archaeal proteins, including Fusexin 1 from Haloferax sp. (Fsx1), which exhibits fusogenic activity and mediates cell-cell fusion in mammalian cells (bilateral fusion).
