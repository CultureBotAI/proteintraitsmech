identifier: HAMAP:MF_00356
label: "DNA polymerase III PolC-type [polC]"
definition: >-
  These are the polypeptide chains of DNA polymerase III. Full-length homologues of this protein are found mainly in Gram-positive lineages, including the Mycoplasmas. This protein is designated alpha chain and given the gene symbol polC, but is not a full-length homologue of other polC genes. The N-terminal region of about 200 amino acids is rich in low-complexity sequence and poorly alignable.
