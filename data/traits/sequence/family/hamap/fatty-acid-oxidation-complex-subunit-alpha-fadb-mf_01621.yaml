identifier: HAMAP:MF_01621
label: "Fatty acid oxidation complex subunit alpha [fadB]"
definition: >-
  Members of this family represent the alpha subunit of the multifunctional enzyme complex of the fatty acid degradation cycle. Activities include: enoyl-CoA hydratase ( ), dodecenoyl-CoA delta-isomerase activity ( ), 3-hydroxyacyl-CoA dehydrogenase ( ) and 3-hydroxybutyryl-CoA epimerase ( ). A representative is Escherichia coli FadB ( ). This entry excludes the FadJ family represented by.
