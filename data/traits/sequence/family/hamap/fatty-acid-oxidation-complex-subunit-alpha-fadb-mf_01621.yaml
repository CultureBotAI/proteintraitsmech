identifier: HAMAP:MF_01621
label: "Fatty acid oxidation complex subunit alpha [fadB]"
definition: >-
  Members of this family represent the alpha subunit of the multifunctional enzyme complex of the fatty acid degradation cycle. Activities include: enoyl-CoA hydratase (EC:4.2.1.17), dodecenoyl-CoA delta-isomerase activity (EC:5.3.3.8), 3-hydroxyacyl-CoA dehydrogenase (EC:1.1.1.35) and 3-hydroxybutyryl-CoA epimerase (EC:5.1.2.3). A representative is Escherichia coli FadB (UniProtKB:P21177). This entry excludes the FadJ family represented by UniProtKB:P77399.
definition_source: "InterPro:IPR012799 abstract (HAMAP MF_01621 is a member signature)"
