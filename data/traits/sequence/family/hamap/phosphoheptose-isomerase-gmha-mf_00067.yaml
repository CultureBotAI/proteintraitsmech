identifier: HAMAP:MF_00067
label: "Phosphoheptose isomerase [gmhA]"
definition: >-
  Phosphoheptose isomerase is involved in lipopolysaccharide biosynthesis, more specifically in the synthesis of glyceromannoheptose 7-phosphate. It may also have a role in the virulence of Haemophilus ducreyi. In Salmonella typhimurium, phosphoheptose isomerase is the first enzyme in the biosynthesis of aldoheptose.
