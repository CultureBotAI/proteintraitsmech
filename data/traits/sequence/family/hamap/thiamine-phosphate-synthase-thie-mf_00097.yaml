identifier: HAMAP:MF_00097
label: "Thiamine-phosphate synthase [thiE]"
definition: >-
  Thiamine phosphate synthase (TPS), also known as thiamin phosphate pyrophosphorylase (TMP-PPase), catalyzes the substitution of the pyrophosphate of 2-methyl-4-amino-5- hydroxymethylpyrimidine pyrophosphate by 4-methyl-5- (beta-hydroxyethyl)thiazole phosphate to yield thiamine phosphate in the thiamine biosynthesis pathway. This family includes the thiamine-phosphate pyrophosphorylase, ThiE, of a number of bacteria, and N-terminal domains of bifunctional thiamine proteins of Saccharomyces cerevisiae and Schizosaccharomyces pombe, in which the C-terminal domain corresponds to the bacterial hydroxyethylthiazole kinase ThiM. The plant enzyme is also bifunctional.
definition_source: "InterPro:IPR034291 abstract (HAMAP MF_00097 is a member signature)"
