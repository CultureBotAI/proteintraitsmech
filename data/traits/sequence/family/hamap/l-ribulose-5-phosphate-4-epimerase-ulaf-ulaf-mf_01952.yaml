identifier: HAMAP:MF_01952
label: "L-ribulose-5-phosphate 4-epimerase UlaF [ulaF]"
definition: >-
  This entry represents the UlaF proteins. The ulaABCDEF operon encodes an L-ascorbate phosphotransferase transport system (UlaABC, formerly designated SgaTBA)responsible for the uptake and phosphorylation of L-ascorbate. The ulaDEF genes encode three enzymes that catalyze the anaerobic conversion of the phosphorylated, hydrolytic product of L-ascorbate, 3-keto-L-gulonate-6-phosphate, to D-xylulose-5-phosphate, which is subsequently metabolized by the pentose phosphate pathway. UlaD catalyzes a β-keto acid decarboxylation reaction to produce L-xylulose-5-phosphate, which undergoes successive epimerization reactions with UlaE (L-xylulose-5-phosphate 3-epimerase) and UlaF (L-ribulose-5-phosphate 4-epimerase), yielding D-xylulose-5-phosphate, an intermediate in the pentose phosphate pathway.
definition_source: "InterPro:IPR023499 abstract (HAMAP MF_01952 is a member signature)"
