identifier: HAMAP:MF_01114
label: "Regulatory protein RecX [recX]"
definition: >-
  RecX is a putative bacterial regulatory protein. The gene encoding RecX is found downstream of recA, and it is suggested that the RecX protein might be regulator of RecA activity by interaction with the RecA protein or filament.
