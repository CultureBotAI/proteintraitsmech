identifier: HAMAP:MF_00997
label: "Beta-barrel assembly-enhancing protease [bepA]"
definition: >-
  Beta-barrel assembly-enhancing protease (BepA) functions both as a chaperone and a metalloprotease. BepA enhances biogenesis of LptD, an essential outer membrane protein (OMP) involved in OM transport and assembly of lipopolysaccharide, and is responsible for the degradation of incorrectly folded LptD. It also interacts with components of the β-barrel assembly machinery (BAM) complex. These observations indicate that BepA maintains the integrity of the outer membrane both by promoting assembly of OMPs and by proteolytically eliminating misfolded OMPs.
definition_source: "InterPro:IPR030873 abstract (HAMAP MF_00997 is a member signature)"
