identifier: HAMAP:MF_01111
label: "UPF0200 protein <locus_tag>"
definition: >-
  The archaeal proteins in this entry are functionally uncharacterised, but belong to the P-loop containing nucleoside triphosphate hydrolases superfamily. Sequence analysis suggests that they may be archaeal dephospho-CoA kinase homologues.
