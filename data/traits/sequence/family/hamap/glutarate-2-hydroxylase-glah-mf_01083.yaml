identifier: HAMAP:MF_01083
label: "Glutarate 2-hydroxylase [glaH]"
definition: >-
  GlaH (also known as CsiD) acts as an alpha-ketoglutarate-dependent dioxygenase catalyzing hydroxylation of glutarate (GA) to L-2-hydroxyglutarate (L2HG) in the stationary phase of E.coli. It functions in a L-lysine degradation pathway that proceeds via cadaverine, glutarate and L-2-hydroxyglutarate. Other dicarboxylic acids (oxalate, malonate, succinate, adipate, and pimelate) are not substrates for this enzyme.
