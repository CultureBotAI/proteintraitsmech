identifier: HAMAP:MF_01218_A
label: "Uracil phosphoribosyltransferase [upp]"
definition: >-
  The enzyme uracil phosphoribosyltransferase (UPRT, ) catalyzes conversion of uracil to uridine 5'-monophosphate utilizing 5'-phosphoribosyl--1-pyrophosphate (PRPP). UMP + diphosphate = uracil + 5-phospho-alpha-D-ribose 1-diphosphate This entry includes uracil phosphoribosyltransferase from archaea. In archaea this enzyme is activated by GTP and inhibited by CTP.
