identifier: HAMAP:MF_01895
label: "Ribonuclease R [rnr]"
definition: >-
  Ribonuclease R (RNaseR) is a 3'-5' exoribonuclease that releases 5'-nucleoside monophosphates and is involved in maturation of structured RNAs. It is one of the eight exoribonucleases reported in Escherichia coli and is broadly distributed throughout the bacteria. In E. coli, double mutants of this protein and polynucleotide phosphorylase are not viable. RNaseR also exhibits helicase activity that appears to be independent of its RNase activity.
