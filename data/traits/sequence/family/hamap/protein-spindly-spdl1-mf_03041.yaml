identifier: HAMAP:MF_03041
label: "Protein Spindly [SPDL1]"
definition: >-
  Protein Spindly is required for the localisation of dynein and dynactin to the mitotic kintochore. It is required for silencing the spindle assembly checkpoint. It localises to microtubule plus ends in interphase and to kinetochores during mitosis. The localisation of human Spindly (hSpindly) to kinetochore-microtubules is controlled by the Rod/Zw10/Zwilch (RZZ) complex and Aurora B.
