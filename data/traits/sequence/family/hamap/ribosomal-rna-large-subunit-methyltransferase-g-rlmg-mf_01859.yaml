identifier: HAMAP:MF_01859
label: "Ribosomal RNA large subunit methyltransferase G [rlmG]"
definition: >-
  This entry represents rRNA (guanine-N(2)-)-methyltransferase G (RlmG; EC:2.1.1.174). RlmG is a specific S-adenosylmethionine (AdoMet)-dependent methyltransferase responsible for N2-methylation of guanine at position 1835 (m2G1835) in 23S rRNA. The modified G1835 is located on the 50S subunit side of the intersubunit bridge B2, a functionally important region of the ribosome. This methylation enhances the association of ribosomal subunits and provides a significant advantage to bacteria under osmotic and oxidative stress conditions. RlmG contains two homologous domains arranged in tandem.
definition_source: "InterPro:IPR017237 abstract (HAMAP MF_01859 is a member signature)"
