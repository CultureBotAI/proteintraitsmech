identifier: HAMAP:MF_00830
label: "Ureidoacrylate amidohydrolase RutB [rutB]"
definition: >-
  This entry represents the RutB subfamily of isochorismatases, which are peroxyureidoacrylate/ureidoacrylate amidohydrolases. They are encoded in operons responsible for the import and catabolism of pyrimidines, particularly uracil.
