identifier: HAMAP:MF_01258
label: "Coenzyme F420:L-glutamate ligase [cofE]"
definition: >-
  This entry contains coenzyme F420:L-glutamate ligase (also known as F420-0:gamma-glutamyl ligase) from archaea. It catalyses the GTP-dependent successive addition of multiple gamma-linked L-glutamates to the L-lactyl phosphodiester of 7,8-didemethyl-8-hydroxy-5-deazariboflavin (F420-0) to form polyglutamated F420 derivatives.
