identifier: HAMAP:MF_02242
label: "Archaetidylinositol phosphate synthase"
definition: >-
  This entry represents a group of archaetidylinositol phosphate synthases (AIP synthases), including MTH1691 from Methanothermobacter thermautotrophicus. AIP synthase catalyses the formation of archaetidylinositol phosphate (AIP) from CDP-archaeol (CDP-ArOH or CDP-2,3-bis-(O-phytanyl)-sn-glycerol) and 1L-myo-inositol 1-phosphate (IP or 1D-myo-inositol 3-phosphate).
