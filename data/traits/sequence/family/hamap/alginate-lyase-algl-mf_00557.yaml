identifier: HAMAP:MF_00557
label: "Alginate lyase [algL]"
definition: >-
  This entry represents alginate lyase or poly (beta-D-mannuronate) lyase. It depolymerises alginate by cleaving the beta-1,4 glycosidic bond. Alginate is a family of 1-4-linked copolymers of beta-D-mannuronic acid (M) and alpha-L-guluronic acid (G). It is produced by brown algae and by some bacteria belonging to the genera Azotobacter and Pseudomonas. Alginate lyases catalyse the depolymerisation of alginates by beta -elimination, generating a molecule containing 4-deoxy-L-erythro-hex-4-enepyranosyluronate at the nonreducing end. Two subfamilies of alginate lyase exist: the poly(beta-D-mannuronate) lyase, EC:4.2.2.3, and the poly(alpha-L-guluronate) lyase, EC:4.2.2.11.
