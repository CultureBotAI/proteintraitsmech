identifier: HAMAP:MF_00214
label: "3-dehydroquinate dehydratase [aroD]"
definition: >-
  3-dehydroquinate dehydratase ( EC:4.2.1.10 ), or dehydroquinase, catalyzes the conversion of 3-dehydroquinate into 3-dehydroshikimate. It is the third step in the shikimate pathway for the biosynthesis of aromatic amino acids from chorismate. Two classes of dehydroquinases exist, known as types I and II. The best studied type I enzyme is from Escherichia coli (gene aroD) and related bacteria where it is a homodimeric protein. In fungi, dehydroquinase is part of a multifunctional enzyme which catalyses five consecutive steps in the shikimate pathway. A histidine is involved in the catalytic mechanism. This entry represents the 3-dehydroquinate dehydratase, type I, either as a monofunctional protein or as a domain of a larger, multifunctional protein.
