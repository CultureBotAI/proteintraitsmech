identifier: HAMAP:MF_03154
label: "Acireductone dioxygenase [ADI1]"
definition: >-
  Acireductone dioxygenase (ARD/MTND, also known as 1,2-dihydroxy-3-keto-5-methylthiopentene dioxygenase EC:1.13.11.54) is an eukaryotic enzyme that catalyses the formation of formate and 2-keto-4-methylthiobutyrate (KMTB) from 1,2-dihydroxy-3-keto-5-methylthiopentene (DHK-MTPene). It shows significant homology to the bacterial acireductone dioxygenase (ARD), which is an enzyme in the methionine salvage pathway (MTA cycle)]. MTCBP-1 is necessary for hepatitis C virus replication in an otherwise non-permissive cell line. MTCBP-1 interacts and inhibits the activity of membrane-type 1 matrix metalloproteinase (MT1-MMP/MMP-14) in promoting tumor cell migration and invasion. MTCBP-1 contains the cupin sequence motif and belongs to the Cupin superfamily composed of proteins with diverse functions.
