identifier: HAMAP:MF_02020
label: "UDP-N-acetylmuramate--L-alanyl-gamma-D-glutamyl-meso-2,6-diaminoheptandioate ligase [mpl]"
definition: >-
  The tripeptide L-ananyl-gamma-D-glutamyl-meso-diaminopimelic acid is efficiently re-cycled during the formation of bacterial cell wall murein. Murein peptide ligase (also known as UDP-N-acetylmuramate:L-alanyl-gamma-D-glutamyl-meso-diaminopimelate ligase) is an essential enzyme in this process which links the tripeptide to UDP-N-acetylmuramate.
