identifier: HAMAP:MF_01558
label: "Cytidine deaminase [cdd]"
definition: >-
  This family represents the homodimeric form of cytidine deaminase, a zinc metalloprotein. Cytidine deaminase scavenges exogenous and endogenous cytidine and 2'-deoxycytidine for UMP synthesis. This entry contains predominantly bacterial proteins.
