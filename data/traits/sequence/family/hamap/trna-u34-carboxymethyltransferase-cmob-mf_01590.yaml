identifier: HAMAP:MF_01590
label: "tRNA U34 carboxymethyltransferase [cmoB]"
definition: >-
  This family represents tRNA U34 carboxymethyltransferase CmoB. CmoA and CmoB are important components of the cmo5U biosynthetic pathway. These enzymes are involved in the conversion of 5-hydroxyuridine (ho5U) to uridine-5-oxyacetic acid (cmo5U) at the wobble position (34) of tRNA. Uridine-5-oxyacetic acid at tRNA position 34 is apparently necessary for the efficient decoding of G-ending Pro, Ala, and Val codons in these organisms. cmo5U modification requires the previously unknown metabolite carboxy-S-adenosine-L-methionine (Cx-SAM), which is generated by CmoA. CmoB catalyzes carboxymethyl transfer from Cx-SAM to ho5U, converting ho5U into cmo5U at the wobble position of multiple tRNAs in Gram-negative bacteria.
definition_source: "InterPro:IPR010017 abstract (HAMAP MF_01590 is a member signature)"
