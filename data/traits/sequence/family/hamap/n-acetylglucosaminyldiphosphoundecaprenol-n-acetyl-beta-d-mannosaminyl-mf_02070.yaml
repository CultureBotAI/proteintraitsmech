identifier: HAMAP:MF_02070
label: "N-acetylglucosaminyldiphosphoundecaprenol N-acetyl-beta-D-mannosaminyltransferase"
definition: >-
  TagA/TarA catalyzes the conversion of GlcNAc-PP-undecaprenol into ManNAc-GlcNAc-PP-undecaprenol. The tarA gene is part of an operon involved in the synthesis of the teichoic acid poly(glycerol phosphate).
