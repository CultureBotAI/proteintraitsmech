identifier: HAMAP:MF_00426
label: "Na(+)-translocating NADH-quinone reductase subunit B [nqrB]"
definition: >-
  This entry represents the NqrB subunit of the six-protein (NqrA to NqrF), membrane-associated Na(+)-pumping NADH-quinone reductase of a number of marine and pathogenic Gram-negative bacteria. The Nqr complex catalyses the reduction of ubiquinone-1 to ubiquinol by two successive reactions, coupled with the transport of sodium ions from the cytoplasm to the periplasm. NqrA to NqrE are probably involved in the second step, the conversion of ubisemiquinone to ubiquinol. Both the NqrB and NqrC subunits contain a FMN cofactor that is covalently attached by a phosphate group to a threonine residue.
