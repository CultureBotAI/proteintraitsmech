identifier: HAMAP:MF_01046
label: "Protein/nucleic acid deglycase HchA [hchA]"
definition: >-
  Escherichia coli Hsp31, the hchA gene product, has been reported to function as a chaperone that plays an important role in protecting cells from severe heat shock and starvation, as well as in acid resistance of stationary-phase cells. It has also been reported to function as a glutathione-independent glyoxalase and to display an aminopeptidase activity specific against peptide substrates with alanine or basic amino acids (lysine, arginine) at N terminus. More recent studies suggest that Hsp31 is likely to function as a protein deglycase that repairs proteins and nucleic acids from glycation by methylglyoxal and glyoxal.
definition_source: "InterPro:IPR017283 abstract (HAMAP MF_01046 is a member signature)"
