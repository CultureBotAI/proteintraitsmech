identifier: HAMAP:MF_01025
label: "2-isopropylmalate synthase [leuA]"
definition: >-
  The branched-chain amino acids are synthesised by a common pathway that leads from pyruvate and alpha-ketobutyrate to valine and isoleucine, and a branch that leads from the immediate precursor of valine, alpha-ketoisovalerate, to leucine. This pathway operates in archaea, bacteria, fungi and plants, but not mammals, making the enzymes suitable targets for the development of novel antibiotics and herbicides. Isopropylmalate synthase is the enzyme responsible for the the first committed step in the leucine branch of this biosynthetic pathway, the conversion of alpha-ketoisovalerate to alpha-isopropylmalate. It is either dimeric or tetrameric, depending on the organism, with a monomer molecular mass of 60-70kDa, a dependence on divalent metal ions for activity, and an alkaline pH optimum. Like many other biosynthetic enzymes it is subject to feedback inhibition by the end product of the pathway, leucine.
