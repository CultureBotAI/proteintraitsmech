identifier: HAMAP:MF_02091
label: "Uncharacterized MFS-type transporter YfcJ [yfcJ]"
definition: >-
  This is a family of uncharacterised MFS-type transporters. YfcJ is a sugar efflux transporter candidate. Deletion of yfcJ was found to increase intracellular arabinose concentrations.
