identifier: HAMAP:MF_01328_A
label: "Large ribosomal subunit protein uL4 [rplD]"
definition: >-
  This entry represents the large ribosomal subunit protein uL4 found in archaea. One of the primary rRNA binding proteins, this protein initially binds near the 5'-end of the 23S rRNA. It is important during the early stages of 50S assembly. It makes multiple contacts with different domains of the 23S rRNA in the assembled 50S subunit and ribosome. Structurally well characterised protein.
