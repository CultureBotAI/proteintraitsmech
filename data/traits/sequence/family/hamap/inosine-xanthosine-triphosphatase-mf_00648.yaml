identifier: HAMAP:MF_00648
label: "Inosine/xanthosine triphosphatase"
definition: >-
  This is a family of prokaryotic phosphatases that hydrolyse non-canonical purine nucleotides such as XTP and ITP to their respective diphosphate derivatives. They probably exclude non-canonical purines from DNA precursor pool, thus preventing their incorporation into DNA and avoiding chromosomal lesions. ITP is the best substrate, followed by XTP, GDP or dITP. Proteins in this entry include YjjX from E. coli. YjjX hydrolyzes non-canonical purine nucleotides such as XTP and ITP to their respective diphosphate derivatives. However, it is not active on dATP and dGTP, and exhibits no phosphatase activity toward pyrimidines (CTP, TTP, UTP, dCTP, and dTTP).
definition_source: "InterPro:IPR002786 abstract (HAMAP MF_00648 is a member signature)"
