identifier: HAMAP:MF_00066
label: "Sulfate adenylyltransferase [sat]"
definition: >-
  ATP-sulfurylase catalyses a key reaction in the global sulfur cycle by reversibly converting inorganic sulfate with ATP to adenosine 5'-phosphosulfate (APS) and pyrophosphate (PPi). This entry consists of sulphate adenylyltransferase or ATP-sulfurylase (EC:2.7.7.4), mainly from prokaryotes. It also includes ATP-sulfurylase from the enteric protozoan parasite Entamoeba, which is closest to Synechocystis and Bacillus subtilis ATP-sulfurylases. In higher eukaryotes, APS kinase is N-terminally fused to ATP-sulfurylase.
