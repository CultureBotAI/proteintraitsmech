identifier: HAMAP:MF_01267
label: "3-keto-L-gulonate-6-phosphate decarboxylase UlaD [ulaD]"
definition: >-
  3-keto-L-gulonate 6-phosphate decarboxylase (KGPDC) ( EC:4.1.1.85 ) is encoded by the ulaD gene in Escherichia coli. The enzyme catalyses the decarboxylation of 3-keto-L-gulonate-6-phosphate into L-xylulose-5-phosphate, and may be involved in anaerobic L-ascorbate utilisation. KGPDC is a homodimer of (β/α)8-barrels, with the active sites located at the dimer interface.
