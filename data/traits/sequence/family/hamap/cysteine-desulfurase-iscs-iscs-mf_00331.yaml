identifier: HAMAP:MF_00331
label: "Cysteine desulfurase IscS [iscS]"
definition: >-
  This entry represents cysteine deusulfurase (IscS), one of several cysteine desulfurases from a larger protein family designated (misleadingly, in this case) class V aminotransferases. IscS is one of at least 6 enzymes characteristic of the IscSUA-hscAB-fsx system of iron-sulphur cluster assembly. In M. tuberculosis this enzyme is associated with oxidative stress defence.
