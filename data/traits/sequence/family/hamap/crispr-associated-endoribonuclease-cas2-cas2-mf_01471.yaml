identifier: HAMAP:MF_01471
label: "CRISPR-associated endoribonuclease Cas2 [cas2]"
definition: >-
  This entry represents members of the family of Cas2, one of the first four protein families found to mark prokaryotic genomes that contain multiple CRISPR (Clustered Regularly Interspaced Short Palindromic Repeats) elements. CRISPR systems protect against invasive nucleic acid sequences, including phage. Cas2 proteins have been characterised as either endoribonuclease (for ssRNA) or endodeoxyribonuclease (for dsDNA), depending on the system to which the Cas2 belongs. CRISPR is an acronym for Clustered Regularly Interspaced Short Palindromic Repeats. The cas genes usually are found near the repeats. It's worth noting that there is a distinct branch of the Cas2 family InterPro:IPR010152 showing a very low level of sequence identity.
definition_source: "InterPro:IPR021127 abstract (HAMAP MF_01471 is a member signature)"
