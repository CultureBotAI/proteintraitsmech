identifier: HAMAP:MF_00679
label: "Chaperone protein HscA [hscA]"
definition: >-
  This entry represents the HscA chaperone protein from the SUF system. HscA (or Hsc66) is a specialised bacterial Hsp70-class molecular chaperone that participates in the assembly of iron-sulphur cluster proteins. HscA resembles DnaK, but belongs to a separate clade. HscA interacts with IscU, which is believed to serve as a template for Fe-S cluster formation. The HscA-IscU interaction is facilitated by the J-type co-chaperone protein HscB (or Hsc20), which binds to both HscA and IscU, bringing them into contact with each other. HscA recognises a conserved LPPVK sequence motif at positions 99-103 of IscU. Iron-sulphur (FeS) clusters are important cofactors for numerous proteins involved in electron transfer, in redox and non-redox catalysis, in gene regulation, and as sensors of oxygen and iron. These functions depend on the various FeS cluster prosthetic groups, the most common being [2Fe-2S] and [4Fe-4S]. FeS cluster assembly is a complex process involving the mobilisation of Fe and S atoms from storage sources, their assembly into [Fe-S] form, their transport to specific cellular locations, and their transfer to recipient apoproteins. So far in bacteria, three FeS assembly machineries have been identified that are capable of synthesising all types of [Fe-S] clusters: ISC (iron-sulphur cluster), SUF (sulphur assimilation), and NIF (nitrogen fixation) systems. The ISC system is conserved in eubacteria and eukaryotes (mitochondria) and has broad specificity, targeting general FeS proteins. It is encoded by the isc operon (iscRSUA-hscBA-fdx-iscX). IscS is a cysteine desulphurase, which obtains S from cysteine (converting it to alanine) and serves as a S donor for FeS cluster assembly. IscU and IscA act as scaffolds to accept S and Fe atoms, assembling clusters and transfe
