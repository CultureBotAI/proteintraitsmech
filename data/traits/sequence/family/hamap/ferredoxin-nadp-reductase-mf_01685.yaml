identifier: HAMAP:MF_01685
label: "Ferredoxin--NADP reductase"
definition: >-
  The function of ferredoxin--NADP reductase is to mediate the following reaction: 2 reduced ferredoxin + NADP(+) + H(+) = 2 oxidized ferredoxin + NADPH. Although all ferredoxin-NADP+ reductases (FNRs) catalyze the same reaction, they belong to two unrelated families of proteins: the plant-type and the glutathione reductase-type of FNRs. This entry represents the second type.
