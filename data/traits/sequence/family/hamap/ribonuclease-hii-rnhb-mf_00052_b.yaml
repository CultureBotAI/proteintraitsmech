identifier: HAMAP:MF_00052_B
label: "Ribonuclease HII [rnhB]"
definition: >-
  Ribonuclease HII is involved in the degradation of the ribonucleotide moiety on RNA-DNA hybrid molecules carrying out endonucleolytic cleavage to 5'-phospo-monoester. This entry is specific for ribonuclease HII. Several bacteria, such as Bacillus subtilis, have two different type II RNases H, RNases HII and HIII; double deletion of these leads to cellular lethality. It appears that type I and type II RNases H also have overlapping functions in cells, as over-expression of Escherichia coli RNase HII can complement an RNase HI deletion phenotype. In Leishmania mitochondria, of the four distinct RNase H genes (H1, HIIA, HIIB, HIIC), HIIC is essential for the survival of the parasite and thus can be a potential target for anti-leishmanial chemotherapy. Ribonuclease H (RNase H) is classified into two families, type I (prokaryotic RNase HI, eukaryotic RNase H1 and viral RNase H) and type II (prokaryotic RNase HII and HIII, and eukaryotic RNase H2). RNase H endonucleolytically hydrolyzes an RNA strand when it is annealed to a complementary DNA strand in the presence of divalent cations, in DNA replication and repair.
definition_source: "InterPro:IPR022898 abstract (HAMAP MF_00052_B is a member signature)"
