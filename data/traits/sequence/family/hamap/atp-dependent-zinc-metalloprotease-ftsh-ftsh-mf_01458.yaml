identifier: HAMAP:MF_01458
label: "ATP-dependent zinc metalloprotease FtsH [ftsH]"
definition: >-
  This entry represents the ATP-dependent zinc metalloprotease FtsH family. AAA proteases are ATP-dependent metallopeptidases present in eubacteria as well as in organelles of bacterial origin, i.e., mitochondria and chloroplasts. The AAA proteases are also known as FtsH, referring to the Escherichia coli enzyme (Filamentous temperature sensitive H). Most bacteria have a single gene encoding FtsH, three genes are present in yeast and humans, while 12 orthologs have been found in the genome of plants. E. coil FtsH is a membrane-anchored ATP-dependent protease that degrades misfolded or misassembled membrane proteins as well as a subset of cytoplasmic regulatory proteins. FtsH is a 647-residue protein of 70kDa, with two putative transmembrane segments towards its N terminus which anchor the protein to the membrane, giving rise to a periplasmic domain of 70 residues and a cytoplasmic segment of 520 residues containing the ATPase and protease domains. The main function of organellar AAA/FtsH proteases is selective degradation of non-assembled, incompletely assembled and/or damaged membrane-anchored proteins. Additional functions of the AAA/FtsH proteases that are not directly connected with protein quality control are processing of pre-proteins, dislocation of membrane proteins or degradation of regulatory proteins.
