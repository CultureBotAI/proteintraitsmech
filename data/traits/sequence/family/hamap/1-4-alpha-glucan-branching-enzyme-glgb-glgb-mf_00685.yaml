identifier: HAMAP:MF_00685
label: "1,4-alpha-glucan branching enzyme GlgB [glgB]"
definition: >-
  This entry represents the glycogen branching enzyme, GlgB, which is responsible for the transfer of chains of approximately seven alpha(1,4)-linked glucosyl residues to other similar chains (in new alpha-(1,6) linkages) in the biosynthesis of glycogen. The branching enzyme is responsible for the degree of alpha(1,6) branch linkages found in polysaccharides.
