identifier: HAMAP:MF_02055
label: "Tyrosine recombinase XerA [xerA]"
definition: >-
  XerA is a site-specific tyrosine recombinase found in archaea. It displays the canonical two-domain structure of tyrosine-recombinases (with the two-domains folded as a C-shaped clamp) and assembles as an apo-dimer. XerA is most likely used for chromosome dimer resolution in archaea, and it thought to bind to the dif site.
