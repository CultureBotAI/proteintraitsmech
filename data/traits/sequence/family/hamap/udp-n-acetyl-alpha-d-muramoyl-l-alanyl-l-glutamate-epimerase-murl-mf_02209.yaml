identifier: HAMAP:MF_02209
label: "UDP-N-acetyl-alpha-D-muramoyl-L-alanyl-L-glutamate epimerase [murL]"
definition: >-
  This entry represents UDP-N-acetyl-alpha-D-muramoyl-L-alanyl-L-glutamate epimerase (MurL) that catalyses the epimerisation of the terminal L-glutamate in UDP-N-acetyl-alpha-D-muramoyl-L-alanyl-L-glutamate. It is present in microorganisms that lack orthologues of Glu racemase or d-Glu aminotransferase, such as Xanthomonas oryzae, and allow the biosynthesis of d-Glu together with MurD2, via an alternative pathway during the peptidoglycan biosynthesis.
definition_source: "InterPro:IPR043689 abstract (HAMAP MF_02209 is a member signature)"
