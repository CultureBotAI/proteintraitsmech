identifier: HAMAP:MF_00558
label: "Succinate--CoA ligase [ADP-forming] subunit beta [sucC]"
definition: >-
  This entry represents a group of different enzymes that share a similar catalytic mechanism which involves the phosphorylation by ATP (or GTP) of a specific histidine residue in the active site. These enzymes are: Succinate--CoA ligase (GDP-forming ( EC:6.2.1.4 ) is a mitochondrial enzyme that catalyses the substrate level phosphorylation step of the tricarboxylic acid cycle: the formation of succinyl-CoA from succinate with a concomitant hydrolysis of GTP to GDP and phosphate. This enzyme is a dimer composed of an alpha and a beta subunits; Succinate--CoA ligase (ADP-forming) ( EC:6.2.1.5 ) is a bacterial enzyme that during aerobic metabolism functions in the citric acid cycle, coupling the hydrolysis of succinyl-CoA to the synthesis of ATP. It can also function in the other direction for anabolic purposes. This enzyme is a tetramer composed of two alpha and two beta subunits; Malate--CoA ligase ( EC:6.2.1.9 ) (malyl-CoA synthetase), is a bacterial enzyme that forms malyl-CoA from malate and CoA with the concomitant hydrolysis of ATP to ADP and phosphate. Malate-CoA ligase is composed of two different subunits. ADP-forming sulfoacetate-CoA ligase, subunit SauC and SqwK, that catalyse the CoA- and ATP-dependent conversion of sulfoacetate to sulfoacetyl-CoA and ADP.
definition_source: "InterPro:IPR005809 abstract (HAMAP MF_00558 is a member signature)"
