identifier: HAMAP:MF_01535
label: "Rhamnulokinase [rhaB]"
definition: >-
  Rhamnulokinase ( EC:2.7.1.5 ) is an enzyme that catalyses the second step in rhamnose catabolism. It catalyses the ATP-dependent phosphorylation of L-rhamnulose to produce L-rhamnulose-1-phosphate and ADP. Rhamnulokinase exists as a monomer composed of two large domains. The ATP binding site is located in the cleft between the two domains. The presence of divalent Mg2+ or Mn2+ is required for catalysis.
