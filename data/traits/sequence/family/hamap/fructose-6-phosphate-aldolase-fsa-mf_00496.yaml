identifier: HAMAP:MF_00496
label: "Fructose-6-phosphate aldolase [fsa]"
definition: >-
  Fructose-6-phosphate aldolases were originally thought to be transaldolases or transaldolase-related proteins. Instead, they perform a novel reaction, the cleavage or formation of fructose 6-phosphate. They belong to the class I aldolase family.
