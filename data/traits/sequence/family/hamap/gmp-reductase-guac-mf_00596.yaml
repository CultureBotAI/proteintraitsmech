identifier: HAMAP:MF_00596
label: "GMP reductase [guaC]"
definition: >-
  GMP (guanosine monophosphate) reductase catalyses the irreversible and NADPH-dependent reductive deamination of GMP into IMP. NADPH + guanosine 5-phosphate = NADP+ + inosine 5-phosphate + NH3 It converts nucleobase, nucleoside and nucleotide derivatives of G to A nucleotides, and maintains intracellular balance of A and G nucleotides. A deep split separates two families of GMP reductase. This family includes both eukaryotic and some proteobacterial sequences.
definition_source: "InterPro:IPR005993 abstract (HAMAP MF_00596 is a member signature)"
