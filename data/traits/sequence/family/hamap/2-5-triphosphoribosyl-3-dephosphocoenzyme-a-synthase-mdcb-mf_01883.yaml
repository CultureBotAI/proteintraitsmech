identifier: HAMAP:MF_01883
label: "2-(5''-triphosphoribosyl)-3'-dephosphocoenzyme-A synthase [mdcB]"
definition: >-
  Triphosphoribosyl-dephospho-CoA synthase (MdcB; ( ) acts in cofactor biosynthesis, preparing the coenzyme A derivative that becomes attached to the malonate decarboxylase acyl carrier protein (or delta subunit). The closely related protein CitG of citrate lyase produces the same molecule, but the two families are nonetheless readily separated.
