identifier: HAMAP:MF_03121
label: "Lon protease homolog 2, peroxisomal [LONP2]"
definition: >-
  This entry represents the peroxisomal lon protease homologue 2 (LON2) from eukaryotes. LON2 is an ATP-dependent serine protease that mediates the selective degradation of misfolded and unassembled polypeptides in the peroxisomal matrix. It is necessary for type 2 peroxisome targeting signal (PTS2)-containing protein processing and facilitates peroxisome matrix protein import.
