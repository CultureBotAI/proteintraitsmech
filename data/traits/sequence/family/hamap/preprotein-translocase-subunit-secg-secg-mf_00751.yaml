identifier: HAMAP:MF_00751
label: "Preprotein translocase subunit SecG [secG]"
definition: >-
  SecG is an homologue of Sec61 subunit beta, a component of the Sec61/SecYEG protein secretory system. It is involved in protein export. The function of this subunit is unknown, but it may be involved in stabilisation of the trimeric complex.
