identifier: HAMAP:MF_00492
label: "Transaldolase [tal]"
definition: >-
  Transaldolase (EC:2.2.1.2) catalyses the reversible transfer of a three-carbon ketol unit from sedoheptulose 7-phosphate to glyceraldehyde 3-phosphate to form erythrose 4-phosphate and fructose 6-phosphate. This enzyme, together with transketolase, provides a link between the glycolytic and pentose-phosphate pathways. Transaldolase is an enzyme of about 34kDa whose sequence has been well conserved throughout evolution. A lysine has been implicated in the catalytic mechanism of the enzyme; it acts as a nucleophilic group that attacks the carbonyl group of fructose-6-phosphate. This entry represents trasnaldolase type 1, which is found in bacteria, metazoa and fungi. The enzyme is found in the non-oxidative branch of the pentose phosphate pathway and forms a dimer in solution.
