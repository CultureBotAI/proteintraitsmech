identifier: HAMAP:MF_03025
label: "Katanin p60 ATPase-containing subunit A-like 2 [KATNAL2]"
definition: >-
  Katanin exists as a heterodimer of a 60kDa AAA-domain-containing catalytic subunit (p60) and an 80kDa targeting and regulatory subunit (p80). Katanin homologues have been identified throughout the animal kingdom and in plants. Katanin p60 ATPase-containing subunit A-like 2 (KATNAL2) severs microtubules in vitro in an ATP-dependent manner.
