identifier: HAMAP:MF_00520
label: "Ribulokinase [araB]"
definition: >-
  L-ribulokinase ( EC:2.7.1.16 ) catalyses the MgATP-dependent phosphorylation of L(or D)-ribulose to produce L(or D)-ribulose 5-phosphate and ADP, which is the second step in arabinose catabolism: ATP + L/D-ribulose = ADP + L/D-ribulose 5-phosphate These proteins can also phosphorylates a variety of other sugar substrates including ribitol and arabitol.
