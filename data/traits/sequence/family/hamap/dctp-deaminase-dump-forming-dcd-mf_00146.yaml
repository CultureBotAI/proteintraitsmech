identifier: HAMAP:MF_00146
label: "dCTP deaminase, dUMP-forming [dcd]"
definition: >-
  Deoxycytidine triphosphate deaminase (dCTP deaminase) is an enzyme involved in nucleotide metabolism. It catalyses the formation of dUTP (deoxyuridine (5'-)triphosphate), which in turn is degraded by dUTPase (dUTP diphosphatase) to produce dUMP (deoxyuridine monophosphate). dUMP is the immediate precursor of thymidine nucleotides. Members of this family include the Escherichia coli monofunctional deoxycytidine triphosphate deaminase (dCTP deaminase) and a Methanocaldococcus jannaschii (Methanococcus jannaschii) bifunctional dCTP deaminase ( EC:3.5.4.13 )/dUTP diphosphatase ( EC:3.6.1.23 ).
definition_source: "InterPro:IPR011962 abstract (HAMAP MF_00146 is a member signature)"
