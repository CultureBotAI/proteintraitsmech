identifier: HAMAP:MF_01834
label: "tRNA-splicing endonuclease [endA]"
definition: >-
  tRNA-splicing endonucleases (EC:3.1.27.9) catalyse the endonucleolytic cleavage of pre tRNA at the 5' and 3' splice sites to release the intron and produces two half tRNA molecules bearing 5' hydroxyl and 2', 3'-cyclic phosphate termini. The genes encoding these proteins are homologous in eukaryotes and archea. The eukaryotic tRNA-splicing endonucleases are heterotetrameric while the archaeal endonucleases can be split into homodimeric and homotetrameric subgroups. This group represents the archaeal long tRNA-splicing endonucleases subfamily.
