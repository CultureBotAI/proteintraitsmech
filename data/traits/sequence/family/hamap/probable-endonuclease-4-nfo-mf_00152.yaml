identifier: HAMAP:MF_00152
label: "Probable endonuclease 4 [nfo]"
definition: >-
  AP endonucleases can be classified into two families based on sequence similarity. This family contains members of AP endonuclease family 2. Family 2 groups the enzymes listed below. Bacterial endonuclease IV ( EC:3.1.21.2 ). Mycobacterium leprae probable endonuclease. Saccharomyces cerevisiae (Baker's yeast) apurinic endonuclease Apn1 ( EC:4.2.99.18 ). Caenorhabditis elegans hypothetical protein APN-1 or T05H10.2. Apn1 and endonuclease IV have been shown to be transition metalloproteins that bind three zinc ions. The metal-binding sites have been determined from the 3D-structure of Escherichia coli endonuclease IV, which shows an α/β-barrel fold similar to that of other divalent metal-dependent TIM barrel enzymes, such as xylose isomerase.
definition_source: "InterPro:IPR001719 abstract (HAMAP MF_00152 is a member signature)"
