identifier: HAMAP:MF_00845
label: "Flavin-dependent monooxygenase"
definition: >-
  The flavin-dependent monooxygenase TetX inactivates all known tetracyclines, as it interacts with the part of the molecule required for its action. It catalyses a monooxygenation step in which it hydroxylates carbon 11a from tetracyclins and allows further breakdown, non-enzymatically, to inactivate them. This enzyme is present in numerous pathogens of clinical importance, and confers tetracycline resistance to all generations of this antibiotic.
