identifier: HAMAP:MF_00347
label: "Polyphosphate kinase [ppk]"
definition: >-
  Polyphosphate kinase (Ppk) (EC:2.7.4.1) catalyzes the formation of polyphosphate from ATP, with chain lengths of up to a thousand or more orthophosphate molecules. It is a membrane protein and goes through an intermediate stage during the reaction where it is autophosphorylated with a phosphate group covalently linked to a basic amino acid residue through an N-P bond.
