identifier: HAMAP:MF_00735
label: "Ribosomal protein L11 methyltransferase [prmA]"
definition: >-
  Ribosomal protein L11 methyltransferase (PrmA) (EC:2.1.1) is required for the methylation of ribosomal protein L11. It forms a bifunctional operon in Escherichia coli with panF (pantothenate transport). In E. coli, it trimethylates the N-terminal alpha-amino group and the ε-amino groups of Lys3 and Lys39. In Arabidopsis is targeted to both mitochondria and chloroplasts. Structures comparison with the E. coli enzyme revealed that they share similar product specificity but display a difference in substrate site specificity.
definition_source: "InterPro:IPR004498 abstract (HAMAP MF_00735 is a member signature)"
