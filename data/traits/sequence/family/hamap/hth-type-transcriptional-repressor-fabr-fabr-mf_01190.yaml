identifier: HAMAP:MF_01190
label: "HTH-type transcriptional repressor FabR [fabR]"
definition: >-
  This entry is represented by the transcriptional repressor FabR found in Gammaproteobacteria. Members of this family contain one HTH TetR-type DNA-binding domain. FabR represses the transcription of FabB, which is involved in unsaturated fatty acid (UFA) biosynthesis. By controlling UFA production, FabR directly influences the physical properties of the membrane bilayer.
