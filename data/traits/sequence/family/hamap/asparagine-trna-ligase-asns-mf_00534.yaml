identifier: HAMAP:MF_00534
label: "Asparagine--tRNA ligase [asnS]"
definition: >-
  Asparagine tRNA ligase ( EC:6.1.1.22 ) is an alpha2 dimer that belongs to class IIb. There is a striking similarity between asparagine-tRNA ligases and archaeal/eukaryotic type aspartyl-tRNA ligases ( InterPro:IPR004523 ) and a striking divergence of bacterial type aspartyl-tRNA ligases ( InterPro:IPR004524 ). This family, AsnS, represents asparagine-tRNA ligases from the three domains of life. Some species lack this enzyme and charge tRNA(asn) by misacylation with Asp, followed by transamidation of Asp to Asn. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 2'-hydroxyl of the tRNA, whereas class II synthetases preferentially use the 3'-hydroxyl site. Class I includes synthetases specific for arginine, cysteine, glutamic acid, glutamine, isoleucine, leucine, methionine, tyrosine, tryptophan, valine, and some lysine synthetases (non-eukaryotic). Class II includes those specific for alanine, asparagine, aspartic acid, glycine, histidine, phenylalanine, proline, serine, threonine, and some lysine
definition_source: "InterPro:IPR004522 abstract (HAMAP MF_00534 is a member signature)"
