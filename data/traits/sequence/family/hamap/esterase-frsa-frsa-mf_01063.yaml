identifier: HAMAP:MF_01063
label: "Esterase FrsA [frsA]"
definition: >-
  Fermentation-respiration switch protein (FrsA) is an esterase containing the α/β-hydrolase fold.. In Vibrio vulnificus, FrsA catalyses the hydrolysis of p-nitrophenyl alkanoate esters to produce p-nitrophenol and pNPA (C2).
