identifier: HAMAP:MF_00990
label: "L-2-hydroxyglutarate dehydrogenase [lhgD]"
definition: >-
  This family of L-2-hydroxyglutarate dehydrogenase includes lhgD from E. coli, which catalyzes the dehydrogenation of L-2-hydroxyglutarate (L2HG) to alpha-ketoglutarate and couples to the respiratory chain by feeding electrons from the reaction into the membrane quinone pool.
