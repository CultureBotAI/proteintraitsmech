identifier: HAMAP:MF_00960
label: "2-amino-3,7-dideoxy-D-threo-hept-6-ulosonate synthase [aroA']"
definition: >-
  This entry represents a family of enzymes related to fructose-bisphosphate aldolase. This enzyme catalyses a transaldol reaction between 6-deoxy-5-ketofructose 1-phosphate (DKFP) and L-aspartate semialdehyde (ASA) with an elimination of hydroxypyruvaldehyde phosphate to yield 2-amino-3,7-dideoxy-D-threo-hept-6-ulosonic acid (ADH). It plays a key role in an alternative pathway of the biosynthesis of 3-dehydroquinate (DHQ), which is involved in the canonical pathway for the biosynthesis of aromatic amino acids. It can also catalyse the cleavage of fructose-1,6-bisphosphate (FBP) to glyceraldehyde-3-phosphate (GAP) and dihydroxyacetone phosphate (DHAP).
definition_source: "InterPro:IPR010210 abstract (HAMAP MF_00960 is a member signature)"
