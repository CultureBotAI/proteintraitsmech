identifier: HAMAP:MF_01224_B
label: "Cyclic pyranopterin monophosphate synthase [moaC]"
definition: >-
  This entry represents molybdenum cofactor biosynthesis C (MoaC) proteins from bacteria and eukaryotes. Members of this family are involved in molybdenum cofactor (Moco) biosynthesis, an essential cofactor of a diverse group of redox enzymes. MoaC is a small hexameric protein that converts, together with MoaA, a guanosine derivative to the precursor Z by inserting the carbon-8 of the purine between the 2' and 3' ribose carbon atoms, which is the first of three phases of Moco biosynthesis.
