identifier: HAMAP:MF_00640
label: "Deoxyhypusine synthase-like protein"
definition: >-
  The entry represents a number of deoxyhypusine synthase-like proteins found in bacteria. The function of these proteins is not known. Eukaryotic initiation factor 5A (eIF-5A), now considered to be an elongation factor (see InterPro:IPR001884 ), contains an unusual amino acid, hypusine [N epsilon-(4-aminobutyl-2-hydroxy)lysine]. The first step in the post-translational formation of hypusine is catalysed by the enzyme deoxyhypusine synthase (DS, EC:2.5.1.46 ). The enzyme catalyses the following reaction: Spermidine + [eIF-5A]-lysine = 1,3-diaminopropane + [eIF-5A]-deoxyhypusine The modified version of eIF-5A, and DS, are required for eukaryotic cell proliferation. The structure is known for this enzyme in complex with its NAD + cofactor.
