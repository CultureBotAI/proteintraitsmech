identifier: HAMAP:MF_00199
label: "Bis(5'-nucleosyl)-tetraphosphatase, symmetrical [apaH]"
definition: >-
  This protein family represents Bis(5'-nucleosyl)-tetraphosphatase, symmetrical (ApaH, also known as Ap4A hydrolase) from Escherichia coli and similar proteins predominantly found in Proteobacteria. This enzyme hydrolyses diadenosine 5',5"'-P1,P4-tetraphosphate (Ap4A), a regulatory metabolite of stress conditions, to yield ADP.
