identifier: HAMAP:MF_00144
label: "tRNA-specific 2-thiouridylase MnmA [mnmA]"
definition: >-
  This family represents tRNA-specific 2-thiouridylase MnmA (sometimes called tRNA(5-methylaminomethyl-2-thiouridine)-methyltransferase), which is involved in the biosynthesis of the modified nucleoside 5-methylaminomethyl-2-thiouridine (mnm5s2U) present in the wobble position of some tRNAs. This family of enzyme only presents in bacteria and eukaryote. The archaeal counterpart of this enzyme performs same function, but is completely unrelated in sequence.
