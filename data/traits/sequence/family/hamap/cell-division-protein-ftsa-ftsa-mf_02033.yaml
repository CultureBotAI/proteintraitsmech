identifier: HAMAP:MF_02033
label: "Cell division protein FtsA [ftsA]"
definition: >-
  FtsA is essential for bacterial cell division, and co-localizes to the septal ring with FtsZ. It has been suggested that the interaction of FtsA-FtsZ has arisen through coevolution in different bacterial strains.
