identifier: HAMAP:MF_00906
label: "Cell division protein ZapC [zapC]"
definition: >-
  ZapC (Z-associated protein C) contributes to the efficiency of the cell division process by in maintaining FtsZ ring stability during cell division. It consists of a N-terminal α/β domain which contains a pocket, termed the N-domain pocket, lined with residues important for ZapC function as an FtsZ bundler and a C-terminal domain which contains an additional pocket (C-domain pocket), with a hydrophobic centre surrounded by conserved basic residues, critical for FtsZ binding.
