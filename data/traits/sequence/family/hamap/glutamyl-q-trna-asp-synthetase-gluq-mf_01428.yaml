identifier: HAMAP:MF_01428
label: "Glutamyl-Q tRNA(Asp) synthetase [gluQ]"
definition: >-
  This protein resembles a shortened glutamyl-tRNA ligase, but its purpose is to modify tRNA(Asp) at a queuosine position in the anticodon rather than to charge a tRNA with its cognate amino acid. It catalyses the tRNA-independent activation of glutamate in presence of ATP and the subsequent transfer of glutamate onto the tRNA(Asp). In Escherichia coli, the glutamylated tRNA(Asp) might be involved in ribosomal protein biosynthesis, as it interacts with the elongation factor EF-Tu. Comparison of the three-dimensional structure of Glu-Q-RS with that of GluRS, both with a unique zinc-binding site, shows that a restricted number of residues determine the distinct catalytic properties of amino acid recognition and activation in both enzymes. Members of this protein family are found in bacteria.
