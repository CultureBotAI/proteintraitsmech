identifier: HAMAP:MF_01867
label: "Putative cysteine ligase BshC [bshC]"
definition: >-
  Members of this protein family include BshC, which is an enzyme required for bacillithiol biosynthesis and described as a cysteine-adding enzyme. Bacillithiol is a low-molecular-weight thiol, an analog of glutathione and mycothiol, and is found largely in the Firmicutes.
