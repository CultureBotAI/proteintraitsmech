identifier: HAMAP:MF_01908
label: "Cyclic 2,3-diphosphoglycerate synthetase [cpgS]"
definition: >-
  CpgS is a low molecular weight compound that accumulates to high levels in some hyperthermophilic methanogens, suggesting that it may play a thermoadaptive role. The full-length enzyme catalyses the formation of cyclic 2,3-diphosphoglycerate from 2,3- bisphosphoglycerate and ATP EC:6.5.1.9. It has also been shown to protect proteins from heat denaturation in vitro. CpgS functions as a homodimer and may be involved in osmotic balance and thermoadaptation in hyperthermophilic organisms.
definition_source: "InterPro:IPR016557 abstract (HAMAP MF_01908 is a member signature)"
