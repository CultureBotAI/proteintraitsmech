identifier: HAMAP:MF_03063
label: "Elongation factor G, chloroplastic"
definition: >-
  Bacterial translation elongation factor G (EF-G) catalyses translocation during peptide elongation and mediates ribosomal disassembly during ribosome recycling with the aid of the ribosomal recycling factor (RRF). This entry represents plant plastid EF-G (also known as SCO1), which displays a 59% homology to prokaryotic EF-G proteins. It is a chloroplast-localised elongation factor involved in protein synthesis in plastids. In Arabidopsis, the mutations in sco1 affect the chloroplast mRNA translation that does not only influence chlorophyll accumulation during chloroplast formation in cotyledons, but also other developmental processes such as germination and flowering.
definition_source: "InterPro:IPR030848 abstract (HAMAP MF_03063 is a member signature)"
