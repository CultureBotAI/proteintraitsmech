identifier: HAMAP:MF_01202
label: "D-amino acid dehydrogenase [dadA]"
definition: >-
  DadA is a dehydrogenase catalysing the deamination of D-amino acids yielding corresponding 2-oxo acids and hydrogen. D-Amino acids control growth phase-dependent cell wall remodelling and rigger biofilm disassembly.
