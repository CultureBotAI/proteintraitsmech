identifier: HAMAP:MF_00044
label: "Aspartate--tRNA(Asp/Asn) ligase [aspS]"
definition: >-
  Aspartate tRNA ligase (also known as Aspartyl-tRNA synthetase, AspRS) is an alpha2 dimer that belongs to class IIb. Structural analysis combined with mutagenesis and enzymology data on the yeast enzyme point to a tRNA binding process that starts by a recognition event between the tRNA anticodon loop and the ligase anticodon binding module. In some species, this enzyme aminoacylates tRNA for both Asp and Asn; Asp-tRNA(asn) is subsequently transamidated to Asn-tRNA(asn). This family represents aspartate-tRNA ligases from mostly bacteria and eukaryotic mitochondria.
definition_source: "InterPro:IPR004524 abstract (HAMAP MF_00044 is a member signature)"
