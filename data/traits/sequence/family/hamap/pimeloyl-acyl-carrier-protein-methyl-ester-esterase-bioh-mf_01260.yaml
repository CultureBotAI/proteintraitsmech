identifier: HAMAP:MF_01260
label: "Pimeloyl-[acyl-carrier protein] methyl ester esterase [bioH]"
definition: >-
  This CoA-binding enzyme is required for the production of pimeloyl-coenzyme A, the substrate of the BioF protein early in the biosynthesis of biotin. Its exact function is unknown, but it has been shown to possess carboxylesterase activity with a preference for short acyl chain substrates. This enzyme belongs to the alpha/beta hydrolase fold family. Members of this family are restricted to the Proteobacteria.
