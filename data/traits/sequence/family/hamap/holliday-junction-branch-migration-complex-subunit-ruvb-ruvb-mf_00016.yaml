identifier: HAMAP:MF_00016
label: "Holliday junction branch migration complex subunit RuvB [ruvB]"
definition: >-
  This entry represents Holliday junction branch migration complex subunit RuvB, which as part of a complex with RuvA homologues serve as a 5'-3' Holliday junction helicase. RuvA specifically binds Holliday junctions as a sandwich of two tetramers and maintains the configuration of the junction. It forms a complex with two hexameric rings of RuvB, the subunit that contains helicase activity. The complex drives ATP-dependent branch migration of the Holliday junction recombination intermediate. The endonuclease RuvC resolves junctions.
definition_source: "InterPro:IPR004605 abstract (HAMAP MF_00016 is a member signature)"
