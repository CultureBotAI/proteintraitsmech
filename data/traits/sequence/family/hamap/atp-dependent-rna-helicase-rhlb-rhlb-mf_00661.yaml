identifier: HAMAP:MF_00661
label: "ATP-dependent RNA helicase RhlB [rhlB]"
definition: >-
  This entry represents the RhiB type of ATP-dependent RNA helicases. They contain a DEAD box domain. They are responsible for ATP-dependent unwinding of double-stranded RNA as part of the RNA degradosome.
