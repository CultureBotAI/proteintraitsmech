identifier: HAMAP:MF_03172
label: "UMP-CMP kinase [CMPK1]"
definition: >-
  This entry represents the UMP-CMP kinase subfamily of the adenylate kinase family. UMP-CMP kinase catalyses the phosphorylation of pyrimidine nucleoside monophosphates at the expense of ATP and is involved in de novo pyrimidine nucleotide biosynthesis. In budding yeast, it is also known as Ura6.
