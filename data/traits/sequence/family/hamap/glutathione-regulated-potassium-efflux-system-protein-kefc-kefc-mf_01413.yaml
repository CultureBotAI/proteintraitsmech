identifier: HAMAP:MF_01413
label: "Glutathione-regulated potassium-efflux system protein KefC [kefC]"
definition: >-
  The kefC gene encodes a potassium-efflux system that is regulated by glutathione metabolites. Full activation of KefC also requires a soluble regulatory protein, KefF. KefC belongs to the monovalent cation:proton antiporter 2(CPA2) transporter family TC 2.A.37 (http://www.tcdb.org/search/result.php?tc=2.A.37).
