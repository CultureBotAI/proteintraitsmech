identifier: HAMAP:MF_04140
label: "Flap endonuclease"
definition: >-
  Flap endonucleases (FENs) catalyse the exonucleolytic hydrolysis of blunt-ended duplex DNA substrates and the endonucleolytic cleavage of 5'-bifurcated nucleic acids at the junction formed between single and double-stranded DNA. This entry represents a group of flap endonucleases from Caudovirales, including D15 from Escherichia phage T5. D15 catalyzes both the 5'-exonucleolytic and structure-specific endonucleolytic hydrolysis of DNA branched nucleic acid molecules and probably plays a role in viral genome replication. The structure of D15 from the T5 phage reveals a central 6-strand β-sheet with a cluster of α-helices on either side.
