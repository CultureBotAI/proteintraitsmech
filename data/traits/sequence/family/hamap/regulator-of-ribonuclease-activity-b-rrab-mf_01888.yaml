identifier: HAMAP:MF_01888
label: "Regulator of ribonuclease activity B [rraB]"
definition: >-
  Regulator of ribonuclease activity B (RraB) globally modulates RNA abundance by binding to RNase E (Rne) and regulating its endonucleolytic activity. It can modulate Rne action in a substrate-dependent manner by altering the composition of the degradosome.
