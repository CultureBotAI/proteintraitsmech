identifier: HAMAP:MF_00513
label: "HTH-type transcriptional regulator ArgP [argP]"
definition: >-
  This entry represents HTH-type transcriptional regulator ArgP from Gammaproteobacteria. ArgP (formally known as IciA) is a positive regulator of argK. It is a negative autoregulator in presence of arginine. It competes with DnaA for oriC iteron (13-mer) binding. It activates dnaA and nrd transcription. It has been demonstrated to be part of the pho regulon. ArgP mutants convey canavanine (an L-arginine structural homologue) sensitivity. ArgP also affects lysine biosynthesis in E. coli through regulating dapB Gene.
definition_source: "InterPro:IPR023490 abstract (HAMAP MF_00513 is a member signature)"
