identifier: HAMAP:MF_00335
label: "Ribonuclease Y [rny]"
definition: >-
  Ribonuclease Y is an endoribonuclease that initiates mRNA decay. The member from Bacillus subtilis, YmdA, has been shown to be involved in turnover of yitJ riboswitch. It also has been shown in Staphylococcus aureus that it catalyses the hydrolysis of both 2',3'-cyclic AMP and 2',3'-cyclic GMP into 3'-AMP and 3'-GMP, respectively, at the 3'-terminal of RNA.
