identifier: HAMAP:MF_01637
label: "Fe/S biogenesis protein NfuA [nfuA]"
definition: >-
  This entry represents Fe/S biogenesis protein NfuA from gammaproteobacteria. This protein is involved in iron-sulphur cluster biogenesis under severe conditions such as iron starvation or oxidative stress. It binds a 4Fe-4S cluster and can transfer this cluster to apoproteins, thereby intervening in the maturation of Fe/S proteins. NfuA could also act as a scaffold/chaperone for damaged Fe/S proteins. An older study designated this protein GntY and suggested a role for it and for the product of an adjacent gene, based on complementation studies, in gluconate utilization.
definition_source: "InterPro:IPR017726 abstract (HAMAP MF_01637 is a member signature)"
