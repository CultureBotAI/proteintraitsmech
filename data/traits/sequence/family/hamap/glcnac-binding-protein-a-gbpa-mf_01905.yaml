identifier: HAMAP:MF_01905
label: "GlcNAc-binding protein A [gbpA]"
definition: >-
  This entry represents the N-acetylglucosamine-binding protein A (GbpA) of various pathogenic bacteria, including Vibrio cholerae, which is the etiologic agent of cholera in humans. GbpA binds to chitin and specifically to the chitin monomer N-acetylglucosamine (GlcNAc), a sugar residue that is also found on the surface of epithelial cells. Intestinal colonization of V. cholerae occurs in a stepwise fashion, initiating with attachment to the small intestinal epithelium. This attachment is followed by expression of the toxin co-regulated pilus, microcolony formation, and cholera toxin production.
definition_source: "InterPro:IPR020879 abstract (HAMAP MF_01905 is a member signature)"
