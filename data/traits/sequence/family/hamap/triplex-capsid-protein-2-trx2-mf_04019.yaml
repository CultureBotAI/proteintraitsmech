identifier: HAMAP:MF_04019
label: "Triplex capsid protein 2 [TRX2]"
definition: >-
  This family consist of various capsid proteins from members of the Herpesviridae. The capsid protein 2 (formerly known as VP23) in Human herpesvirus 1 (HHV-1) (Human herpes simplex virus 1) forms a triplex together with VP19C these fit between and link together adjacent capsomers as formed by VP5 and VP26. VP3 along with the scaffolding proteins helps to form normal capsids by defining the curvature of the shell and size of the particle.
