identifier: HAMAP:MF_00229
label: "Histidine ammonia-lyase [hutH]"
definition: >-
  Histidine ammonia-lyase deaminates histidine to urocanic acid, the first step in histidine degradation. It is closely related to the plant enzyme phenylalanine ammonia-lyase but is absent in plants and viruses. This enzyme contains a unique cofactor called 4-methylidene-imidazole-5-one group (MIO), which is produced autocatalytically by a cyclisation and dehydration of the three amino-acid residues alanine, serine and glycine, for its chain folding.
definition_source: "InterPro:IPR005921 abstract (HAMAP MF_00229 is a member signature)"
