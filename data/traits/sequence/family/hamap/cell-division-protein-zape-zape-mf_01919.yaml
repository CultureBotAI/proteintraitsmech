identifier: HAMAP:MF_01919
label: "Cell division protein ZapE [zapE]"
definition: >-
  ZapE is a cell division protein found in Gram-negative bacteria. The bacterial cell division process relies on the assembly, positioning, and constriction of FtsZ ring (the so-called Z-ring), a ring-like network that marks the future site of the septum of bacterial cell division [,. ZapE is a Z-ring associated protein required for cell division under low-oxygen conditions suggesting that ZapE is a stress-regulated cell division protein. It is an ATPase that appears at the constricting Z-ring late in cell division. It reduces the stability of FtsZ polymers in the presence of ATP in vitro.
