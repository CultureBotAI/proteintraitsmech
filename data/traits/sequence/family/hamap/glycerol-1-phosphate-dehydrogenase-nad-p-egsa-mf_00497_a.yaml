identifier: HAMAP:MF_00497_A
label: "Glycerol-1-phosphate dehydrogenase [NAD(P)+] [egsA]"
definition: >-
  This entry represents archaeal glycerol-1-phosphate dehydrogenase EC:1.1.1.261. Glycerol-1-phosphate dehydrogenase is responsible for the formation of the archaeal-specific glycerophosphate backbone of phospholipids, G-1-P, from glycerone phosphate, using either NADH or NADPH as a coenzyme, and is primarily Zn 2+ -dependent in archaea. This is the key step in the in biosynthesis of archaeal enantiomeric phospholipids. One characteristic feature of archaea is that their cellular membrane has an ether linkage between the glycerol backbone and the hydrocarbon residues. The polar lipids of the members of Archaea consist of di- and tetraethers of glycerol with isoprenoid alcohols bound at the sn-2 and sn-3 positions of the glycerol moiety. The archaeal polar lipids have the enantiomeric configuration of a glycerophosphate backbone [sn- glycerol-1-phosphate (G-1-P)]. that is the mirror image structure of the bacterial or eukaryal counterpart [sn-glycerol- 3-phosphate (G-3-P)]. The absolute stereochemistry of the glycerol moiety in all archaeal polar lipids is opposite to that of glycerol ester lipids in bacteria and eukarya. This protein family is only found in Archaea.
