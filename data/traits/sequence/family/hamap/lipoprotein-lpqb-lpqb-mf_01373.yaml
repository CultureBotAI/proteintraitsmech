identifier: HAMAP:MF_01373
label: "Lipoprotein LpqB [lpqB]"
definition: >-
  LpqB may modulate activity of the MtrAB system in controlling homeostasis of the cell wall and cell division. It partially restores antibiotic resistance to M.smegmatis in which this gene has been disrupted.
