identifier: HAMAP:MF_02081
label: "Peptidoglycan D,D-transpeptidase MrdA [mrdA]"
definition: >-
  This entry represents penicillin-binding protein 2 (PBP-2, also known as peptidoglycan D,D-transpeptidase MrdA), a protein whose gene (designated either pbpA or mrdA) is generally found next to the gene for RodA, a protein required for the rod (bacillus) shape in many bacteria. PBP-2 acts as a transpeptidase for cell elongation, hence it is involved in formation of the rod shape.
