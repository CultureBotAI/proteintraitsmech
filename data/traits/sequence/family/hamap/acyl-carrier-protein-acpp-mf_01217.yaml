identifier: HAMAP:MF_01217
label: "Acyl carrier protein [acpP]"
definition: >-
  There are two types of fatty acid synthase systems. The type I system is found in metazoans and is carried out by a multifunctional polypeptide with multiple active sites. In contrast, the type II system found in bacteria and plants consists of a set of discrete monofunctional proteins, each encoded by a separate gene. ACP1 is central to both of these pathways because it functions to ferry the pathway intermediates between active site centres or enzymes. ACPs are also critical to the function of other metabolic pathways such as polyketide synthases.
