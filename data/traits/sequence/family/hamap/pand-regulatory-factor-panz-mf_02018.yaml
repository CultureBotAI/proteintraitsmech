identifier: HAMAP:MF_02018
label: "PanD regulatory factor [panZ]"
definition: >-
  This entry represents PanD maturation factor PanZ (also known as PanM or YhhK) from Enterobacteriaceae. PanD is a l-aspartate alpha-decarboxylase involved in pantothenate biosynthesis. It is synthesised as pro-PanD, which undergoes auto-proteolytic cleavage to generate active PanD. PanM binds to and activates PanD by stabilising pro-PanD in an autocleavage-prone conformation. PanM acts as an acetyl-CoA sensor that can trigger the maturation of pro-PanD, but lacks acetyltransferase activity. The regulation of PanD by PanZ allows enterobacterial species to closely regulate production of beta-alanine and hence pantothenate in response to metabolic demand.
definition_source: "InterPro:IPR032900 abstract (HAMAP MF_02018 is a member signature)"
