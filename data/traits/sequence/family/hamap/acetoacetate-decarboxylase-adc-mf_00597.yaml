identifier: HAMAP:MF_00597
label: "Acetoacetate decarboxylase [adc]"
definition: >-
  This entry represents bacterial acetoacetate decarboxylases. Acetoacetate decarboxylase (ADC) is involved in solventogenesis in certain bacteria, which occurs at the end of the exponential growth phase when there is a metabolic switch from classical sugar fermentation with the production of acetate and butyrate to the re-internalisation and oxidation of these acids to acetate and butanol. In Clostridium, SpoOA controls the switch from acid to solvent production. A SpoAO-binding motif occurs in the gene encoding ADC.
