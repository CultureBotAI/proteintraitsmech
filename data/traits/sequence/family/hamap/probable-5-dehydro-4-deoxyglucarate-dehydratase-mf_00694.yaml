identifier: HAMAP:MF_00694
label: "Probable 5-dehydro-4-deoxyglucarate dehydratase"
definition: >-
  5-dehydro-4-deoxyglucarate dehydratase (also called 5-keto-4-deoxy-glucarate dehydratase or KDGDH), is a member of the same family as dihydrodipicolinate synthase (DHDPS). 5-dehydro-4-deoxyglucarate dehydratase is involved in glucarate metabolism, where it catalyses the dehydration and decarboxylation of 5-dehydro-4-deoxy-D-glucarate to 2,5-dioxopentanoate. In certain species of Enterobacteriaceae 5-dehydro-4-deoxy-D-glucarate is degraded to pyruvate and glycerate, instead of to 2,5-dioxopentanoate.
