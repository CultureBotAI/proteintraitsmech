identifier: HAMAP:MF_01464_A
label: "Protein-export membrane protein SecF [secF]"
definition: >-
  This family consists of various archaeal SecF proteins. They show a high degree of structural and functional similarity to their bacterial homologues, despite the different composition of their translocation machineries. Secretion across the inner membrane in some Gram-negative bacteria occurs via the preprotein translocase pathway. Proteins are produced in the cytoplasm as precursors, and require a chaperone subunit to direct them to the translocase component. From there, the mature proteins are either targeted to the outer membrane, or remain as periplasmic proteins. The translocase protein subunits are encoded on the bacterial chromosome.
