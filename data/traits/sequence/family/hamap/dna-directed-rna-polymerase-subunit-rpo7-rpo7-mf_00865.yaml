identifier: HAMAP:MF_00865
label: "DNA-directed RNA polymerase subunit Rpo7 [rpo7]"
definition: >-
  This family represents archaeal DNA-directed RNA polymerase subunit Rpo7 (previously known as RNA polymerase subunits RpoE). These RNA polymerases catalyse the transcription of DNA into RNA using the four ribonucleoside triphosphates as substrates. Rpo7 shows a two-domain structure with two potential RNA binding motifs. Rpo7 forms a stalk with Rpo4 that extends from the main structure, as seen in the resolved structure of UniProtKB:Q5JIY4 from Thermococcus kodakarensis.
