identifier: HAMAP:MF_00839
label: "Ribosome hibernation promoting factor [hpf]"
definition: >-
  Bacteria dimerize pairs of 70S ribosomes into inactive 100S ribosomes during the stationary phase and when exposed to certain stresses, a process that is called ribosome hibernation. Hibernating ribosomes are formed by the activity of one or more highly conserved proteins. In Gammaproteobacteria two proteins are involved in this process, ribosome modulation factor (RMF) and hibernation promoting factor (HPF), while most Gram-positive bacteria produce a single, longer HPF protein. This family includes the long form of the HPF proteins and the functional homologue PSRP1, a ribosome-binding factor from chloroplasts.
definition_source: "InterPro:IPR034694 abstract (HAMAP MF_00839 is a member signature)"
