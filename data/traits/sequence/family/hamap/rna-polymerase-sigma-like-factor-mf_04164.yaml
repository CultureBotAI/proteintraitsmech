identifier: HAMAP:MF_04164
label: "RNA polymerase sigma-like factor"
definition: >-
  This family represents the Bacteriophage T4 RNA polymerase sigma-like factor (also known as gp55) which plays a role in the transcription of the viral late genes. It recognises late promoters and confers the ability to form a catalytically competent RNA polymerase (RNAP)-promoter open complex. It associates with host RNAP core and, thus, replaces the host sigma-70/rpoD subunit in the complex. Gp55 may also play a role in DNA packaging by interacting with the terminase subunit gp17.
definition_source: "InterPro:IPR046386 abstract (HAMAP MF_04164 is a member signature)"
