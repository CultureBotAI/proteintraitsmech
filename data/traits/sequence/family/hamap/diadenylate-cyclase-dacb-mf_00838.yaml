identifier: HAMAP:MF_00838
label: "Diadenylate cyclase [dacB]"
definition: >-
  Diadenylate cyclase catalyses the condensation of 2 ATP molecules into cyclic di-AMP (c-di-AMP), a signaling compound secreted into the host's cytosol by bacterial pathogens, such as Listeria monocytogenes. This compound triggers the cytosolic surveillance pathway (CSP), a host pathway of innate immunity. Apart from a role in the establishment of bacterial infection, c-di-AMP seems to be involved in coordinating bacterial growth, cell wall stability, and responses to stress. This family includes the sporulation-specific diadenylate cyclase CdaS from Bacillus. CdaS contains an N-terminal domain that consists of two α-helices and a C-terminal catalytically active diadenylate cyclase (DAC) domain. The cyclic di-AMP formed by CdaS is required for efficient germination.
definition_source: "InterPro:IPR034693 abstract (HAMAP MF_00838 is a member signature)"
