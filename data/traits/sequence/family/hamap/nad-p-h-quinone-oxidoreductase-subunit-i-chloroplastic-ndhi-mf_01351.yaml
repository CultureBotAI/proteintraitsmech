identifier: HAMAP:MF_01351
label: "NAD(P)H-quinone oxidoreductase subunit I, chloroplastic [ndhI]"
definition: >-
  This entry represents the I subunit (one of 14 subunits, A to N) of the NADH-quinone oxidoreductase complex I (EC:1.6.5.11) which generally couples NADH and ubiquinone oxidation/reduction in bacteria and mammalian mitochondria, but may act on NADPH and/or plastoquinone in cyanobacteria and plant chloroplasts. This family does not contain 'I' subunits from the closely related F420H2 dehydrogenase and formate hydrogenlyase complexes.
