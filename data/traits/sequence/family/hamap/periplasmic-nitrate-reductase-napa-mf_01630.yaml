identifier: HAMAP:MF_01630
label: "Periplasmic nitrate reductase [napA]"
definition: >-
  This entry represents the large subunit of a family of nitrate reductases found in proteobacteria which are localised to the periplasm. This subunit binds molybdopterin and contains a twin-arginine motif at the N terminus. The protein associates with NapB, a soluble haem-containing protein and NapC, a membrane-bound cytochrome c. The periplasmic nitrate reductases are not involved in the assimilation of nitrogen, and are not directly involved in the formation of electrochemical gradients (i.e. respiration) either. Rather, the purpose of this enzyme is either dissimilatory (i.e. to dispose of excess reductive equivalents) or indirectly respiratory by virtue of the consumption of electrons derived from NADH via the proton translocating NADH dehydrogenase. The enzymes from Ralstonia eutropha (Alcaligenes eutrophus) and Paracoccus pantotrophus (Thiosphaera pantotropha) have been characterised. In Escherichia coli (as well as other organisms) this gene is part of a large nitrate reduction operon (napFDAGHBC).
definition_source: "InterPro:IPR010051 abstract (HAMAP MF_01630 is a member signature)"
