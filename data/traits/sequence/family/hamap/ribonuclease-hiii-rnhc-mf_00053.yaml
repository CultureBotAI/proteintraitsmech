identifier: HAMAP:MF_00053
label: "Ribonuclease HIII [rnhC]"
definition: >-
  This family describes bacterial RNase HIII. Ribonuclease HIII EC:3.1.26 cleaves RNA from DNA-RNA hybrids. It catalyses endonucleolytic cleavage to 5'-phospho-monoesters. Two types of ribonuclease H in Bacillus subtilis, RNase HII (rnhB) and RNase HIII (rnhC), are both known experimentally and are quite similar to each other. The only RNase H homologue in the Mycoplasmas resembles rnhC. Archaeal forms resemble HII more closely than HIII.
