identifier: HAMAP:MF_01684
label: "5'-methylthioadenosine/S-adenosylhomocysteine nucleosidase [mtnN]"
definition: >-
  This entry represents the enzyme 5'-methylthioadenosine/S-adenosylhomocysteine nucleosidase (MTA/SAH nucleosidase) (EC:3.2.2.9) which acts on its two substrates at the same active site. This enzyme is involved in the recycling of the components of S-adenosylmethionine after it has donated one of its two non-ribose sulphur ligands to an acceptor. In the case of 5'-methylthioadenosine this represents the first step of the methionine salvage pathway in bacteria. This enzyme is essential for bacterial metabolism, while is absent in mammals, showing potential for antibiotic design.
