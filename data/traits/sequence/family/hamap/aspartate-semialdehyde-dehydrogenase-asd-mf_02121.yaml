identifier: HAMAP:MF_02121
label: "Aspartate-semialdehyde dehydrogenase [asd]"
definition: >-
  This entry represents the entire asparate-semialdehyde dehydrogenase family. Aspartate-semialdehyde dehydrogenase (EC:1.2.1.11), the second enzyme in the aspartate pathway, converts aspartyl phosphate to aspartate-semialdehyde, the branch point intermediate between the lysine and threonine/methionine pathways. Based on sequence alignments, the aspartate-semialdehyde dehydrogenase family appears to have at least three distinct subfamilies. Most studies have been performed on enzymes isolated from Gram-negative bacteria. The N-terminal domain forms the active site and NADP-binding pocket, while C-terminal domain is primarily involved in hydrophobic intersubunit contacts. The catalytic mechanism involves the formation of a covalent thioester acyl-enzyme intermediate mediated through nucleophilic attack by an active site cysteine residue on the substrate aspartyl phosphate. Release of inorganic phosphate is followed by hydride transfer from NADPH to yield the product. The recently described archaeal structure suggests that the two subgroups of aspartate semi-aldehyde dehydrogenase share similar structures and have an identical catalytic mechanism, despite their relatively low sequence identity. Unlike the bacterial enzymes, the archaeal enzyme utilised both NAD and NADP as cofactor. Bacteria, plants and fungi metabolise aspartic acid to produce four amino acids -lysine, threonine, methionine and isoleucine -in a series of reactions known as the aspartate pathway. Additionally, several important metabolic intermediates are produced by these reactions, such as diaminopimelic acid, an essential component of bacterial cell wall biosynthesis, and dipicolinic acid, which is involved in sporulation in Gram-positive bacteria. Members of the animal kingdom do not posses this pathway
