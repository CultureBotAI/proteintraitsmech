identifier: HAMAP:MF_01150
label: "Chaperone protein TorD [torD]"
definition: >-
  The TorD protein, after which this family is named, is involved in the maturation of the the trimethylamine N-oxide reductase TorA in Escherichia coli. TorA is a molybdenum-containing enzyme which requires the the insertion of a bis(molybdopterin guanine dinucleotide) molybdenum (bis(MGD)Mo) cofactor in its catalytic site to be active and translocated to the periplasm. TorD acts as a chaperone, binding to apoTorA and promoting efficient incorporation of the cofactor into the protein.
