identifier: HAMAP:MF_01491
label: "Ribonuclease J [rnj]"
definition: >-
  This entry represents bacterial ribonuclease J. There are two paralogues in Bacillus subtilis, RNase J1 and J2 (RnjA and RnjB). J1 forms a complex with J2, and this complex has both endonuclease and 5'-3' exonuclease activity, playing a role in both rRNA and mRNA stability and degradation. Both J1 and the J1/J2 complex have robust 5'-to-3' exoribonuclease activity in vitro, however, J2 has at least two orders of magnitude weaker exonuclease activity.
