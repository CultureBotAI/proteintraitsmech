identifier: HAMAP:MF_01192
label: "Flap endonuclease Xni [xni]"
definition: >-
  This entry contains the bacterial flap endonuclease Xni (also known as YgdG), which was previously identified as a 3'-5' exonuclease and named exonuclease IX (ExoIX). Xni was subsequently found to possess flap endonuclease activity, but not exonuclease activity.
