identifier: HAMAP:MF_00487
label: "Malate dehydrogenase [mdh]"
definition: >-
  This entry contains bacterial and archaeal malate dehydrogenases, which convert malate into oxaloacetate in the citric acid cycle. The critical residues which discriminate malate dehydrogenase from lactate dehydrogenase have been characterised, and have been used to determine members of this group.
