identifier: HAMAP:MF_01841
label: "Agmatine deiminase [aguA]"
definition: >-
  Agmatine deiminase (EC:3.5.3.12) catalyses the conversion of agmatine into N-carbamoylputrescine. This enzyme usually functions as part of polyamine biosynthesis, though in some bacterial species, such as Enterococcus faecalis, it can also function in the generation of ATP from agmatine. The E. faecalis enzyme is a homotetramer where each monomer adopts a similar fold to that of the arginine deiminase catalytic domain, a five-bladed fan-like structure where the repeating unit is formed from three β sheets and an α helix. This entry represents known and putative agmatine deiminases from bacteria and plants. Related deiminases not in this entry include the peptidyl-arginine deiminase (EC:3.5.3.15) as found in Porphyromonas gingivalis.
