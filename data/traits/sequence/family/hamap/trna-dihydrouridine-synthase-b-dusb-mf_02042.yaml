identifier: HAMAP:MF_02042
label: "tRNA-dihydrouridine synthase B [dusB]"
definition: >-
  Dihydrouridine (D) is a highly conserved modified base found in tRNAs from all domains of life. D is formed by reduction of the carbon-carbon double bond at positions 5 and 6 of the uridine base by dihydrouridine synthases (Dus), and is mostly found in the D-loop of tRNAs for which it is named. This entry represents DusB, also known as tRNA-dihydrouridine synthase B, which catalyses the synthesis of 5,6-dihydrouridine (D) via the reduction of the C5-C6 double bond in target uridines.
definition_source: "InterPro:IPR032887 abstract (HAMAP MF_02042 is a member signature)"
