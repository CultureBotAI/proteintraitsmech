identifier: HAMAP:MF_01262
label: "CCA-adding enzyme [cca]"
definition: >-
  This family predominantly consists of bacterial versions of tRNA adenylyltransferases. tRNA nuceotidyltransferases are responsible for the synthesis or repair of the 3' terminal CCA sequence of tRNA molecules. They are encoded by essential genes in almost all organisms and add the three ribonucleotides C, C, and A to the 3' end of tRNAs in sequential order. Most members of this family contain an additional metal dependent phosphohydrolase domain (HD). Although the precise functional role of this domain is undetermined, the demonstration in Escherichia coli of 2',3'-cyclic phosphodiesterase, 2'-nucleotidase, and phosphatase activities has led to the suggestion that it is involved in the repair of the CCA terminus. For additional information please see.
definition_source: "InterPro:IPR012006 abstract (HAMAP MF_01262 is a member signature)"
