identifier: HAMAP:MF_03223
label: "Protein N-terminal and lysine N-methyltransferase EFM7 [EFM7]"
definition: >-
  This entry includes N-terminal and lysine N-methyltransferase EFM7 that trimethylates the N-terminal glycine of elongation factor 1-alpha (TEF1 and TEF2) and then the adjacent lysine. It may be involved in rDNA silencing and in lifespan determination.
