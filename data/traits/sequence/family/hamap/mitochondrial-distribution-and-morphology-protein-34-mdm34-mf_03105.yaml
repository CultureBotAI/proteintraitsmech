identifier: HAMAP:MF_03105
label: "Mitochondrial distribution and morphology protein 34 [MDM34]"
definition: >-
  MDM34 is a component of the ERMES/MDM complex, which serves as a molecular tether to connect the endoplasmic reticulum and mitochondria. MDM34 is required for the interaction of the ER-resident membrane protein MMM1 and the outer mitochondrial membrane-resident β-barrel protein MDM10.
