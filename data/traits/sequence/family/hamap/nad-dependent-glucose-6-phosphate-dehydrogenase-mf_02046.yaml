identifier: HAMAP:MF_02046
label: "NAD-dependent glucose-6-phosphate dehydrogenase"
definition: >-
  This entry represents NAD-dependent glucose-6-phosphate dehydrogenase (Glc6PDH, encoded by zwf for zwischenferment) from archaea. Haloferax volcanii Glc6PDH is involved in the oxidative pentose phosphate pathway (OPPP). It catalyses the NAD-dependent oxidation of glucose 6-phosphate (Glc6P) to 6-phosphogluconolactone. It is a homodimeric enzyme of 32kDa subunits, catalysing the NAD+ specific oxidation of Glc6P. Interestingly, it is not related to the classical Glc6PDH of the OPPP in bacteria and eukarya.
definition_source: "InterPro:IPR032884 abstract (HAMAP MF_02046 is a member signature)"
