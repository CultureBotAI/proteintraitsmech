identifier: HAMAP:MF_02068
label: "Ribitol-5-phosphate cytidylyltransferase [tarI]"
definition: >-
  Ribitol-5-phosphate cytidylyltransferase (TarI) is required for the synthesis of activated ribitol via the wall teichoic acid biosynthesis pathway. The enzyme catalyzes the transfer of the cytidylyl group of CTP to D-ribitol 5-phosphate to form CDP-ribitol.
