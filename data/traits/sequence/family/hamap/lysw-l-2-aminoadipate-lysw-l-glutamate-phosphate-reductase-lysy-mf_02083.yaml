identifier: HAMAP:MF_02083
label: "[LysW]-L-2-aminoadipate/[LysW]-L-glutamate phosphate reductase [lysY]"
definition: >-
  Several bacteria and archaea utilize the amino group-carrier protein LysW for lysine biosynthesis, whereas the hyperthermophilic archaeon Sulfolobus utilizes LysW for the biosynthesis of both lysine and arginine. LysY is the third enzyme involved in LysW-mediated lysine biosynthesis from alpha-aminoadipat(AAA). During lysine biosynthesis, an isopeptide bond is formed between LysW and alpha-aminoadipate (AAA). The resulting LysW-gamma-AAA is phosphorylated by LysZ to form LysW-gamma-AAA phosphate, and is subsequently reduced to LysW-gamma-aminoadipic semialdehyde (LysW-gamma-AASA) by LysY. In Sulfolobus, LysY functions both as a [LysW]-L-2-aminoadipate phosphate reductase and a [LysW]-L-glutamate phosphate reductase.
