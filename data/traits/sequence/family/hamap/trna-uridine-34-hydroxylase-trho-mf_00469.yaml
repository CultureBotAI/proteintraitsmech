identifier: HAMAP:MF_00469
label: "tRNA uridine(34) hydroxylase [trhO]"
definition: >-
  TrhO (also known as YceA in E. coli) catalyses oxygen-dependent 5-hydroxyuridine (ho5U) modification at position 34 in tRNAs, the first step in 5-carboxymethoxyuridine (cmo5U) biosynthesis. This entry also includes uncharacterised proteins from archaea and plants.
