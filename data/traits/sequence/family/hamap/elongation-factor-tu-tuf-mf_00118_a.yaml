identifier: HAMAP:MF_00118_A
label: "Elongation factor Tu [tuf]"
definition: >-
  Translation elongation factors are responsible for two main processes during protein synthesis on the ribosome. EF1A (or EF-Tu) is responsible for the selection and binding of the cognate aminoacyl-tRNA to the A-site (acceptor site) of the ribosome. EF2 (or EF-G) is responsible for the translocation of the peptidyl-tRNA from the A-site to the P-site (peptidyl-tRNA site) of the ribosome, thereby freeing the A-site for the next aminoacyl-tRNA to bind. Elongation factors are responsible for achieving accuracy of translation and both EF1A and EF2 are remarkably conserved throughout evolution. EF-Tu (also known as EF-1alpha or EF1A) is a G-protein. It forms a ternary complex of EF-Tu (EF1A)-GTP-aminoacyltRNA. The binding of aminoacyl-tRNA stimulates GTP hydrolysis by EF-Tu (EF1A), causing a conformational change in EF-Tu (EF1A) that causes EF-Tu (EF1A)-GDP to detach from the ribosome, leaving the aminoacyl-tRNA attached at the A-site. Only the cognate aminoacyl-tRNA can induce the required conformational change in EF-Tu (EF1A) through its tight anticodon-codon binding. EF-Tu (EF1A)-GDP is returned to its active state, EF-Tu (EF1A)-GTP, through the action of another elongation factor, EF1B (also known as EF-Ts or EF-1beta/gamma/delta). This entry represents EF1A proteins from in eukaryotic (eEF1alpha) and archaeal (aEF1alpha) organisms, these proteins being more closely related to one another than to EF1A (or EF-Tu) from bacteria (InterPro:IPR004541). Archaeal EF1-alpha is not only involved in translation elongation. It interacts with Pelota, a mRNA surveillance protein involved in no-go mRNA decay and non-stop mRNA decay; and with RF1, a tRNA-mimicking protein which recognises stop codons and catalyses polypeptide-chain release. Through these interactions archaeal EF1-alpha 
