identifier: HAMAP:MF_04165
label: "Late transcription coactivator"
definition: >-
  This family of proteins is found in myovirus and includes the late transcription coactivator (also known as gp33) from Bacteriophage T4. It is a late-transcription coactivator which interacts with the host RNA polymerase forming a part of the initiation complex. It activates transcription at late promoters when the sliding clamp is present. It is able to bind to both the host RNA polymerase (RNAP) and the upstream dsDNA.
definition_source: "InterPro:IPR046384 abstract (HAMAP MF_04165 is a member signature)"
