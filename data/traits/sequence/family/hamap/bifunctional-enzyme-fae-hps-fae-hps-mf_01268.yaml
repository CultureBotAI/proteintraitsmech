identifier: HAMAP:MF_01268
label: "Bifunctional enzyme Fae/Hps [fae-hps]"
definition: >-
  This bifunctional enzyme catalyses the condensation of formaldehyde with tetrahydromethanopterin (H4MPT) to 5,10-methylenetetrahydromethanopterin and the formation of ribulose-5-phosphate and formaldehyde from 3-hexulose-6-phosphate. Formaldehyde activating enzyme (Fae) was first discovered in methylotrophic bacteria, where it is involved in the oxidation of methanol to CO2 and in formaldehyde detoxification. The genome of Methanosarcina barkeri contains both the faeA gene as well as a second gene, faeB-hpsB, which is shown to code for a 42kDa protein with both Fae activity and hexulose-6-phosphate synthase (Hps) activity. Members of this family are specific to archaea.
definition_source: "InterPro:IPR020868 abstract (HAMAP MF_01268 is a member signature)"
