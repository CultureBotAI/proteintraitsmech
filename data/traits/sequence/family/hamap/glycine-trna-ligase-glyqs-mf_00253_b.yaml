identifier: HAMAP:MF_00253_B
label: "Glycine--tRNA ligase [glyQS]"
definition: >-
  This entry represents bacterial Glycine-tRNA ligases (also known as Glycyl-tRNA synthetase). In eubacteria, glycine-tRNA ligase ( ) is an alpha2/beta2 tetramer composed of 2 different subunits. In some eubacteria, in archaea and eukaryotes, glycine-tRNA ligase is an alpha2 dimer, this family. It belongs to class IIc and is one of the most complex ligases. What is most interesting is the lack of similarity between the two types: divergence at the sequence level is so great that it is impossible to infer descent from common genes. The alpha (see ) and beta subunits (see ) also lack significant sequence similarity. However, they are translated from a single mRNA, and a single chain glycine-tRNA ligase from Chlamydia trachomatis has been found to have significant similarity with both domains, suggesting divergence from a single polypeptide chain. The sequence and crystal structure of the homodimeric glycine-tRNA ligase from Thermus thermophilus, shows that each monomer consists of an active site strongly resembling that of the aspartyl and seryl enzymes, a C-terminal anticodon recognition domain of 100 residues and a third domain unusually inserted between motifs 1 and 2 almost certainly interacting with the acceptor arm of tRNA(Gly). The C-terminal domain has a novel five-stranded parallel-antiparallel β-sheet structure with three surrounding helices. The active site residues most probably responsible for substrate recognition, in particular in the Gly binding pocket, can be identified by inference from aspartyl-tRNA ligase due to the conserved nature of the class II active site. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These
