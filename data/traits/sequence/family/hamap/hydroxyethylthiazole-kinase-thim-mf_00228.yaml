identifier: HAMAP:MF_00228
label: "Hydroxyethylthiazole kinase [thiM]"
definition: >-
  Most microorganisms and plants can synthesise thiamin de novo. In this de novo pathway, the thiazole and pyrimidine moieties of thiamin are made separately and coupled together to form thiamin phosphate. For the thiazole moiety, 4-methyl-5-(2-hydroxyethyl)thiazole (THZ), the key salvage step is phosphorylation to give 4-methyl-5-(2-phosphonooxyethyl)thiazole (THZ-P). The enzyme hydoxyethylthiazole kinase ( EC:2.7.1.50 ) is responsible for this step. Hydoxyethylthiazole kinase is encoded by thiM in Escherichia coli and other bacteria, and by the C-terminal region of bifunctional proteins in some cases, such as Saccharomyces cerevisiae, in which the N-terminal domain corresponds to the bacterial thiamine-phosphate pyrophosphorylase ( EC:2.5.1.3 ), ThiE. ThiM constitutes a potential target for pro-drug compounds for antibacterial drug development. The Arabidopsis and maize genomes encode homologues of ThiM.
definition_source: "InterPro:IPR000417 abstract (HAMAP MF_00228 is a member signature)"
