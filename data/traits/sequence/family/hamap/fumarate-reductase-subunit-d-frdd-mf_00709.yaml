identifier: HAMAP:MF_00709
label: "Fumarate reductase subunit D [frdD]"
definition: >-
  Fumarate reductase is a membrane-bound flavoenzyme consisting of four subunits. Subunits A and B comprise the membrane-extrinsic catalytic domain and C and D link the catalytic centres to the electron-transport chain. This family consists of the 13kDa hydrophobic subunit D. This component may be required to anchor the catalytic components of the fumarate reductase complex to the cytoplasmic membrane.
