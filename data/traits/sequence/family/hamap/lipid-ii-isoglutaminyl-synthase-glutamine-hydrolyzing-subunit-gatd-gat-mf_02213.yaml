identifier: HAMAP:MF_02213
label: "Lipid II isoglutaminyl synthase (glutamine-hydrolyzing) subunit GatD [gatD]"
definition: >-
  Amidated peptidoglycan of Gram-positive bacteria is essential for peptidoglycan (PG) cross-linking, playing an important role in homeostasis, antibiotic resistance and cell survival. The bi-enzymatic complex MurT-GatD catalyses the amidation process in PG stem peptides, in which GatD is the glutamine amidotransferase member. GatD metabolises glutamine and provides ammonia to MurT, the ligase that catalises the convertion of D-glutamate residue in Lipid II to D-isoglutamine. Sequence analysis of this subunit from S. aureus is similar to the catalytic domain in CobB/CobQ-like glutamine amidotransferases (GatD) (enzymes involved in cobalamin biosynthesis), being grouped in a new sub-family of glutamine amidotransferases.
definition_source: "InterPro:IPR043702 abstract (HAMAP MF_02213 is a member signature)"
