identifier: HAMAP:MF_00554
label: "Ribosomal RNA small subunit methyltransferase Nep1 [nep1]"
definition: >-
  NEP1 (nucleolar essential protein 1), also named EMG1 (essential for mitotic growth 1), is involved in ribosomal biogenesis. It seems to play a role in a methylation reaction in pre-rRNA processing.
