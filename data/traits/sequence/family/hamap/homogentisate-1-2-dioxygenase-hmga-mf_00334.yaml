identifier: HAMAP:MF_00334
label: "Homogentisate 1,2-dioxygenase [hmgA]"
definition: >-
  This entry represents bacterial homogentisate 1,2-dioxygenase. This enzyme mediates the conversion of homogentisate to maleylacetoacetate; a step in the catabolism of both tyrosine and phenylalanine.
