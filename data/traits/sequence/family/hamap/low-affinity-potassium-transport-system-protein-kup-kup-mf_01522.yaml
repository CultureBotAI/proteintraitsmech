identifier: HAMAP:MF_01522
label: "Low affinity potassium transport system protein Kup [kup]"
definition: >-
  This entry represents potassium transport Kup system proteins. These proteins are involved in the uptake of K+ ions under hyper-osmotic stress and likely operate as K+:H+ symporters. Kup proteins are composed of two domains--an integral membrane domain that has 12 putative trans-membrane sections and a hydrophilic C-terminal domain.
