identifier: HAMAP:MF_02090
label: "Glutamine-dependent NAD(+) synthetase [nadE]"
definition: >-
  This group represents the glutamine-dependent NAD(+) synthetases with the GAT domain from archaea, bacteria to humans. NAD+ is involved electron transport and redox reactions and in DNA ligation and protein ADP-ribosylation. In yeast and most other organisms, NAD is generated through the de novo pathway and the salvage pathway. In the de novo pathway, quinolinic acid is converted to nicotinic acid mononucleotide (NaMN). In the salvage pathway, NaMN is generated by recycling of nicotinamide. Both pathways converge on NaMN, which is then converted into deamido-NAD+. Subsequently, deamido-NAD+ is converted to NAD+ by NAD+ synthetase. NAD+ synthetase has been extensively studied in bacteria. It is encoded by nadE gene in E. coli and by outB gene in B. subtilis. However, these enzymes are ammonia-dependent (containing an ammonia-utilising domain) and are not included in this entry. The pokaryotic proteins in this family, such as that from Mycobacterium tuberculosis, contain a nitrilase-related domain, are glutamine-dependent and are included in this entry.
definition_source: "InterPro:IPR014445 abstract (HAMAP MF_02090 is a member signature)"
