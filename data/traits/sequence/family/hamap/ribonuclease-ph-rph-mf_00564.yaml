identifier: HAMAP:MF_00564
label: "Ribonuclease PH [rph]"
definition: >-
  Prokaryotic ribonuclease PH (EC:2.7.7.56) (RNase PH) is a phosphorolytic exoribonuclease that participates in tRNA maturation by removing nucleotide residues following the -CCA terminus of tRNA. It also has synthetic activity, adding nucleotides to the ends of RNA molecules by using nucleoside diphosphates as substrates. RNase PH forms a homohexameric ring. Interestingly, E. coli MG1655 and W3110 strains contains the rph-1 allele, encoding a truncated catalytically inactive RNase PH protein. These truncated proteins are also included in this entry.
definition_source: "InterPro:IPR002381 abstract (HAMAP MF_00564 is a member signature)"
