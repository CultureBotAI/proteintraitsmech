identifier: HAMAP:MF_00929
label: "Cellobiose 2-epimerase"
definition: >-
  Cellobiose 2-epimerase catalyses the reversible epimerization of cellobiose to 4-O-beta-D-glucopyranosyl-D-mannose (Glc-Man). It can also epimerize cellotriose to Glc-Glc-Man, cellotetraose to Glc-Glc-Glc-Man, lactose to epilactose, and mannobiose to 4-O-beta-D-mannopyranosyl-D-glucopyranose (Man-Glc). It may function as a mannobiose 2-epimerase in vivo and be involved in a mannan catabolic pathway which feeds into glycolysis.
definition_source: "InterPro:IPR028584 abstract (HAMAP MF_00929 is a member signature)"
