identifier: HAMAP:MF_00935
label: "Alanine dehydrogenase [ala]"
definition: >-
  Alanine dehydrogenase (AlaDH) catalyses the NAD+-dependent oxidative deamination of L-alanine to pyruvate, and the reverse reaction, the reductive amination of pyruvate. This entry represents the alanine dehydrogenase from archaea and some bacteria, which shows no significant amino acid sequence homology with previously known bacterial AlaDHs, but instead belongs to the ornithine cyclodeaminase-mu-crystallin family of enzymes.
