identifier: HAMAP:MF_01457
label: "Flagellar brake protein YcgR [ycgR]"
definition: >-
  This entry represents YcgR a member of the T3SS. It acts as a flagellar brake, regulating swimming and swarming in a bis-(3'-5') cyclic diguanylic acid (c-di-GMP)-dependent manner. Increasing levels of c-di-GMP lead to decreased motility. YcgR binds 1 c-di-GMP dimer per subunit. YcgR is composed of two domains: an N-terminal domain of unknown function and a C-terminal PilZ domain. The PilZ domain binds c-di-GMP in vitro with an affinity that is high enough to allow it to respond to small changes in intracellular c-di-GMP levels. This domain organisation is conserved in a large number of proteobacteria. Therefore, the function of YcgR in motility control is likely to be conserved.
