identifier: HAMAP:MF_01175
label: "tRNA-modifying protein YgfZ [ygfZ]"
definition: >-
  YgfZ is a folate-binding protein involved in regulating the level of ATP-dnaA and in the modification of some tRNAs. It is probably a key factor in regulatory networks that act via tRNA modification, such as initiation of chromosomal replication.
