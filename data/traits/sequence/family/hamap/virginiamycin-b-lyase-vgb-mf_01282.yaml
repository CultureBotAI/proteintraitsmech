identifier: HAMAP:MF_01282
label: "Virginiamycin B lyase [vgb]"
definition: >-
  Streptogramins consist of a mixture of two components: cyclic polyunsaturated macrolactones (group A) and cyclic hexadepsipeptides (group B). The latter are cyclized through an ester bond between the hydroxyl group of an N-terminal threonine and the C-terminal carboxyl. Inactivation of the B streptogramins (e.g., virginiamycin) can occur by linearization of the cyclic depsipeptide (lactone ring) by enzymes such as Vgb from Staphylococcus aureus. The molecular mechanism of streptogramin B inactivation by S. aureus Vgb and orthologues from Bordetella pertussis and Streptomyces coelicolor has been demonstrated to involve elimination rather than hydrolysis. Vgb is a member of a large group of streptogramin B lyases that are present not only in resistant clinical isolates but also in the chromosomes of many bacteria. Members of this group contain one or more copies of NHL repeats.
