identifier: HAMAP:MF_00675
label: "Uronate isomerase [uxaC]"
definition: >-
  Uronate isomerase (also known as glucuronate isomerase) catalyses the reaction D-glucuronate to D-fructuronate and also converts D-galacturonate to D-tagaturonate.
