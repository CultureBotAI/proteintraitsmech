identifier: HAMAP:MF_04061
label: "Preterminal protein [PTP]"
definition: >-
  The adenovirus terminal protein precursor or preterminal protein (pTP) functions as a primer for the initiation of virus DNA replication. It forms a heterodimer with Ad DNA polymerase (pol). pTP is processed at two sites by the virus-encoded protease to yield mature terminal protein (TP) via an intermediate (iTP).
