identifier: HAMAP:MF_01209
label: "Carbamoyl phosphate synthase small chain [carA]"
definition: >-
  Carbamoyl phosphate synthase (CPSase) is a heterodimeric enzyme composed of a small and a large subunit (with the exception of CPSase III, see below). CPSase catalyses the synthesis of carbamoyl phosphate from biocarbonate, ATP and glutamine or ammonia, and represents the first committed step in pyrimidine and arginine biosynthesis in prokaryotes and eukaryotes, and in the urea cycle in most terrestrial vertebrates. This entry represents the small subunit of the glutamine-dependent form (EC:6.3.5.5) of carbamoyl phosphate synthase. The small subunit catalyses the hydrolysis of glutamine to ammonia, which in turn used by the large chain to synthesize carbamoyl phosphate. The C-terminal domain of the small subunit of CPSase has glutamine amidotransferase activity.
definition_source: "InterPro:IPR006274 abstract (HAMAP MF_01209 is a member signature)"
