identifier: HAMAP:MF_00471
label: "Regulator of ribonuclease activity A [rraA]"
definition: >-
  The regulator of ribonuclease activity A (RraA) family includes a number of closely related sequences from bacteria and plants. The Escherichia coli member has been characterised, and its crystal structure determined. It acts as a regulator of the endonuclease RNase E (see ) by binding to it and inhibiting RNA processing. This entry represents the the gammaproteobacterial members of the RraA family.
