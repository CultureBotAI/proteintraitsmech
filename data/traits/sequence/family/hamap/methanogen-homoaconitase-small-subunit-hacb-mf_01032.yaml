identifier: HAMAP:MF_01032
label: "Methanogen homoaconitase small subunit [hacB]"
definition: >-
  This entry is most closely related to the 3-isopropylmalate dehydratase. It includes methanogen homoaconitase small subunit HacB from Methanocaldococcus jannaschii, 3-isopropylmalate dehydratase small subunit LeuD from Salmonella typhimurium, 2,3-dimethylmalate dehydratase small subunit DmdB from Eubacterium barkeri and AM-toxin AMT8, an aconitase, from Alternaria alternata.
