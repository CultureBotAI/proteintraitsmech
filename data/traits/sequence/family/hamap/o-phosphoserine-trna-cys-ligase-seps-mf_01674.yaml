identifier: HAMAP:MF_01674
label: "O-phosphoserine--tRNA(Cys) ligase [sepS]"
definition: >-
  This entry represents archaeal phenylalanyl-tRNA ligase alpha chains. It was shown to act in a proposed pathway of tRNA(Cys) indirect aminoacylation, resulting in Cys biosynthesis from O-phosphoserine, in certain archaea. It charges tRNA(Cys) with O-phosphoserine. The pscS gene product converts the phosphoserine to Cys.
