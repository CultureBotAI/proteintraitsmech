identifier: HAMAP:MF_01290
label: "2-keto-3-deoxy-L-rhamnonate aldolase [rhmA]"
definition: >-
  This entry represents a family of bacterial 2-keto-3-deoxy-L-rhamnonate aldolases. They are responsible for reversible retro-aldol cleavage of 2-keto-3-deoxy-L-rhamnonate (KDR) to pyruvate and lactaldehyde.
