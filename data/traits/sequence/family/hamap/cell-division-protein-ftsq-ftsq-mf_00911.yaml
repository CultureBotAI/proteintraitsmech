identifier: HAMAP:MF_00911
label: "Cell division protein FtsQ [ftsQ]"
definition: >-
  FtsQ is an essential cell division protein. It may link together the upstream cell division proteins, which are predominantly cytoplasmic, with the downstream cell division proteins, which are predominantly periplasmic. FtsQ may control the correct divisome assembly.
