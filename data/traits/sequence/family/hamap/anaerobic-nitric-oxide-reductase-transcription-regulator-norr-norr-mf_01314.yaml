identifier: HAMAP:MF_01314
label: "Anaerobic nitric oxide reductase transcription regulator NorR [norR]"
definition: >-
  These proteins are required for the expression of anaerobic nitric oxide(NO) reductase. They act as transcriptional activators for at least the norVW operon. NorR requires activation by sigma-54.
