identifier: HAMAP:MF_01403
label: "Probable phosphoketolase"
definition: >-
  Phosphoketolases (PK) are key enzymes of the pentose phosphate pathway of heterofermentative and facultative homofermentative lactic acid bacteria and of the D-fructose 6-phosphate shunt of bifidobacteria. PK activity has been sporadically reported in other microorganisms including eukaryotic yeasts.Proteins in this entry are probable phosphoketolases belonging to the XFP family and are thought to require thiamine pyrophosphate as a cofactor.
