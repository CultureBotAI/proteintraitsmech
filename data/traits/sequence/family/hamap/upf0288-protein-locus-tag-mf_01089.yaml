identifier: HAMAP:MF_01089
label: "UPF0288 protein <locus_tag>"
definition: >-
  Members of this protein family are only found in archaeal methanogens. The functions of proteins in this family are unknown, but their role is likely one essential to methanogenesis. More recent work showed that member protein MA3997 from Methanosarcina acetivorans C2A co-purified with affinity-purified methyl-coenzyme M reductase.
