identifier: HAMAP:MF_03038
label: "Cytosolic Fe-S cluster assembly factor NUBP1 [NUBP1]"
definition: >-
  This entry represents the cytosolic Fe-S cluster assembly factor NUBP1/Nbp35 from eukaryotes. Members in this family are P loop NTPases that are involved in cytosolic iron-sulfur cluster assembly.
