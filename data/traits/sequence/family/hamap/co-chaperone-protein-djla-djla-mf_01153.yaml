identifier: HAMAP:MF_01153
label: "Co-chaperone protein DjlA [djlA]"
definition: >-
  DjlA is a regulatory DnaK co-chaperone involved in the induction of the wcaABCDE operon for colanic acid polysaccharide capsule synthesis. The protein functions as a homodimer and is localised to the inner membrane as a single-pass type III membrane protein. DjlA interacts directly with DnaK and activates the RcsB/RcsC phosphotransfer signalling pathway.
