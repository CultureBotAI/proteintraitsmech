identifier: HAMAP:MF_01293
label: "D-tagatose-1,6-bisphosphate aldolase subunit KbaY [kbaY]"
definition: >-
  Escherichia coli and other enteric bacteria contain two closely related D-tagatose 1,6-bisphosphate (TagBP)-specific aldolases - KbaYZ (also known as AgaYZ) and GatYZ. Unlike other class II aldolases, which are homodimeric enzymes, KbaYZ and GatYZ are heterodimers, and are comprised of subunits KbaY/GatY and GatY/GatZ. The KbaY/GatY subunits alone are sufficient to show aldolase activity and contain most or all of the residues that have been identified as essential for substrate/product recognition and catalysis in class II aldolases. However, subunits GatZ/KbaZ are required for full activity and for good in vivo and in vitro stability. This entry represents D-tagatose-1,6-bisphosphate aldolase catalytic subunit KbaY.
