identifier: HAMAP:MF_00310
label: "A-type ATP synthase subunit B [atpB]"
definition: >-
  This entry represents the beta regulatory subunit of V-type ATP synthase, known as subunit B in eukaryota. Transmembrane ATPases are membrane-bound enzyme complexes/ion transporters that use ATP hydrolysis to drive the transport of protons across a membrane. Some transmembrane ATPases also work in reverse, harnessing the energy from a proton gradient, using the flux of ions across the membrane via the ATPase proton channel to drive the synthesis of ATP. A-type ATPases (archaeal-type ATPases) and V-ATPases, all included in this entry, are thought to have evolved from common ancestral genes.
