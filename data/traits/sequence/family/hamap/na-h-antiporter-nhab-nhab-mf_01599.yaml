identifier: HAMAP:MF_01599
label: "Na(+)/H(+) antiporter NhaB [nhaB]"
definition: >-
  The Escherichia coli NhaB Na+:H+ Antiporter (NhaB) protein has 12 predicted TMS, and catalyses sodium/proton exchange. Unlike NhaA, InterPro:IPR004670, this activity is not pH dependent.
