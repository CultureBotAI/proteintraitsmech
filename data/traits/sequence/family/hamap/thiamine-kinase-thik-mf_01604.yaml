identifier: HAMAP:MF_01604
label: "Thiamine kinase [thiK]"
definition: >-
  Members of this family are the ycfN gene product of Escherichia coli, now identified as the salvage enzyme thiamine kinase (ThiK), and additional proteobacterial homologues taken to be orthologs with equivalent function.
