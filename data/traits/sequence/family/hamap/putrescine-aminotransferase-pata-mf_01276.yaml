identifier: HAMAP:MF_01276
label: "Putrescine aminotransferase [patA]"
definition: >-
  This entry represents putrescine aminotransferase ( EC:2.6.1.82 ) as found in Escherichia coli, Erwinia carotovora subsp. atroseptica (Pectobacterium atrosepticum), and closely related species. Putrescine aminotransferase catalyzes the aminotransferase reaction from putrescine to 2-oxoglutarate, leading to glutamate and 4-aminobutanal, which spontaneously cyclizes to form 1-pyrroline. This pyridoxal phosphate enzyme, as characterised in E. coli, can also act on cadaverine and, more weakly, spermidine.
