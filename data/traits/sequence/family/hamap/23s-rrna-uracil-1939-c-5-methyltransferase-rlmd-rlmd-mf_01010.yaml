identifier: HAMAP:MF_01010
label: "23S rRNA (uracil(1939)-C(5))-methyltransferase RlmD [rlmD]"
definition: >-
  This family represents the RlmD (also known as rumA / ygcA) RNA uridine methyltransferase. In E. coli, methyltransferases are responsible for converting uridine to thymidine in rRNA and tRNAs. Among them, TrmA is responsible for tRNA U54 methylation. RlmD (assigned as YgcA previously) was first identified as a methyltransferase through its homology to the TrmA family. RlmD was then found acting as a methyltransferase on the 23S RNA for the conserved U1939.
definition_source: "InterPro:IPR001566 abstract (HAMAP MF_01010 is a member signature)"
