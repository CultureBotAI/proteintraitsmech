identifier: HAMAP:MF_01197
label: "Cell division protein SepF [sepF]"
definition: >-
  This entry represents a cell division protein, designated SepF, which is conserved in Gram-positive bacteria. SepF accumulates at the cell division site in an FtsZ-dependent manner and is required for proper septum formation. Mutants are viable but the formation of the septum is much slower and occurs with a very abnormal morphology.
