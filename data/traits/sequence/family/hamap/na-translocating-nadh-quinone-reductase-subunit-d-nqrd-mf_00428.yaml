identifier: HAMAP:MF_00428
label: "Na(+)-translocating NADH-quinone reductase subunit D [nqrD]"
definition: >-
  Na(+)-translocating NADH-quinone reductase (NQR) functions as a primary Na(+) pump in the respiratory chain of Gram-negative marine and halophilic bacteria. The NQR complex reduces ubiquinone-1 to ubiquinol by two successive reactions, which involve the co-factor FAD. The NQR complex is composed of six subunits, this entry representing subunit D (NqrD).
