identifier: HAMAP:MF_00092
label: "Endonuclease MutS2 [mutS2]"
definition: >-
  This entry represents endonuclease MutS2. MutS2 is a paralogue of MutS and is not involved in DNA mismatch repair but in the suppression of homologous recombination. It may therefore have a key role in the control of bacterial genetic diversity. The MutS family of proteins is named after the Salmonella typhimurium MutS protein involved in mismatch repair. Homologues of MutS have been found in many species including eukaryotes (MSH 1, 2, 3, 4, 5, and 6 proteins), archaea and bacteria, and together these proteins have been grouped into the MutS family. Although many of these proteins have similar activities to the E. coli MutS, there is significant diversity of function among the MutS family members. Inter-species homologues may have arisen through frequent ancient horizontal gene transfer of MutS (and MutL) from bacteria to archaea and eukaryotes via endosymbiotic ancestors of mitochondria and chloroplasts.
