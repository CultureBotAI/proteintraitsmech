identifier: HAMAP:MF_02101
label: "1,4-dihydroxy-2-naphthoyl-CoA hydrolase"
definition: >-
  This entry contains 1,4-dihydroxy-2-naphthoyl-CoA hydrolase, which catalyzes the hydrolysis of 1,4-dihydroxy-2-naphthoyl-CoA (DHNA-CoA) to 1,4-dihydroxy-2-naphthoate (DHNA), a reaction involved in phylloquinone (vitamin K1) biosynthesis.
