identifier: HAMAP:MF_03224
label: "Cyanide hydratase"
definition: >-
  Fungal cyanide hydratases (CHTs) belong to the nitrilase family and catalyze the hydration of cyanide to formamide. They differ from bacterial cyanide dihydratases in their reaction products (formamide vs. formic acid and ammonia, respectively). Some CHTs can also transform nitriles, but less efficiently. These enzymes hold promise for applications in the bioremediation of cyanide wastes.
