identifier: HAMAP:MF_03170
label: "Adenylate kinase 4, mitochondrial [AK4]"
definition: >-
  Adenylate kinases (AKs) are nucleoside monophosphate kinases, which catalyse the phosphorylation of AMP by using ATP or GTP as phosphate donors. In humans, nine different AK isoenzymes have been identified (AK1-9). This entry represents AK4 (also known as adenylate kinase 3-like). Despite its homology with other AKs, AK4 shows no enzymatic activity in vitro. AK4 is expressed predominantly in kidney and weakly in liver, heart and brain. It is localised in the mitochondrial matrix. It contains an unusual feature of an N-terminal mitochondrial import sequence that remains uncleaved after import into the mitochondria.
definition_source: "InterPro:IPR028585 abstract (HAMAP MF_03170 is a member signature)"
