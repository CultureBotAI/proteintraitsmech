identifier: HAMAP:MF_01654
label: "2-hydroxy-6-oxononadienedioate/2-hydroxy-6-oxononatrienedioate hydrolase [mhpC]"
definition: >-
  2-hydroxy-6-oxononadienedioate/2-hydroxy-6-oxononatrienedioate hydrolase catalyzes the cleavage of the C5-C6 bond of 2-hydroxy-6-oxononadienedioate and 2-hydroxy-6-oxononatrienedioate, a dienol ring fission product of the bacterial meta-cleavage pathway for degradation of phenylpropionic acid. The purified enzyme is a dimeric protein requiring no cofactors for catalytic activity.
