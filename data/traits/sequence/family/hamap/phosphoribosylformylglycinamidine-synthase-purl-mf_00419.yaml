identifier: HAMAP:MF_00419
label: "Phosphoribosylformylglycinamidine synthase [purL]"
definition: >-
  This entry represents a single-molecule form of phosphoribosylformylglycinamidine synthase, also called FGAM synthase, an enzyme of purine de novo biosynthesis. This form is known as large PurL and is found mostly in eukaryotes and proteobacteria. In Bacillus subtilis PurL (FGAM synthase II), PurQ (FGAM synthase I) and PurS, of unknown function, perform the equivalent function.
