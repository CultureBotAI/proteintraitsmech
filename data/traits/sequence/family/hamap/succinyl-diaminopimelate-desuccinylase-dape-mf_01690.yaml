identifier: HAMAP:MF_01690
label: "Succinyl-diaminopimelate desuccinylase [dapE]"
definition: >-
  This entry represents succinyl-diaminopimelate desuccinylase from proteobacteria (DapE, EC:3.5.1.18), which hydrolyses N-succinyl-L,L-diaminopimelic acid to L,L-diaminopimelic acid (L,L-DAP). L,L-DAP is required for the bacterial synthesis of lysine and meso-diaminopimelic acid. It has been shown that DapE is essential for cell growth and proliferation. DapEs have been purified from Escherichia coli and Haemophilus influenzae, while the genes that encode for DapEs have been sequenced from several bacterial sources such as Corynebacterium glutamicum, Helicobacter pylori, Neisseria meningitidis and Mycobacterium tuberculosis. DapE is a small, dimeric enzyme that requires two zinc atoms per molecule for full enzymatic activity. All of the amino acids that function as metal binding ligands are strictly conserved in DapE.
