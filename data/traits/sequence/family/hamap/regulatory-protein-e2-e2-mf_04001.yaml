identifier: HAMAP:MF_04001
label: "Regulatory protein E2 [E2]"
definition: >-
  Regulatory protein E2 exists as a homodimer and interacts with a homodimer of E1 to improve the specificity of the DNA binding of E1. Once the complex is bound to DNA, E2 is released. E2 also binds to the E2RE response element (5'-ACCNNNNNNGGT-3'), which is present in multiple copies in the viral genome. Binding of E2 to this element either activates or represses transcription.
