identifier: HAMAP:MF_00156
label: "3-methyl-2-oxobutanoate hydroxymethyltransferase [panB]"
definition: >-
  The panB gene from Escherichia coli encodes the first enzyme of the pantothenate biosynthesis pathway, ketopantoate hydroxymethyltransferase (KPHMT) EC:2.1.2.11. Fungal ketopantoate hydroxymethyltransferase is essential for the biosynthesis of coenzyme A, while the pathway intermediate 4'-phosphopantetheine is required for penicillin production.
