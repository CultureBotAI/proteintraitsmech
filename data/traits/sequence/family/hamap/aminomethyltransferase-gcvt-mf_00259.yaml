identifier: HAMAP:MF_00259
label: "Aminomethyltransferase [gcvT]"
definition: >-
  This entry represents GcvT from bacteria. The glycine cleavage multienzyme complex (GCV) catalyses the catabolism of glycine in eukaryotes. GCVT (aminomethyltransferase, EC:2.1.2.10) is a folate-dependent enzyme that catalyses the release of ammonia and the transfer of the methylene carbon unit (C1 unit) to tetrahydrofolate (H4folate) from the aminomethyl intermediate attached to the lipoate cofactor of H-protein. GCV is found in bacteria and the mitochondria of eukaryotes. Mutations in the human GCVT gene are known to cause nonketotic hyperglycinemia.
definition_source: "InterPro:IPR022903 abstract (HAMAP MF_00259 is a member signature)"
