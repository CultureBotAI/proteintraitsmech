identifier: HAMAP:MF_01446
label: "tRNA N6-adenosine threonylcarbamoyltransferase [kae1]"
definition: >-
  The KEOPS/EKC complex is a tRNA modification complex involved in the biosynthesis of N6-threonylcarbamoyladenosine (t6A), a universally conserved tRNA modification found on ANN-codon recognizing tRNAs. In archaea and eukaryotes, KEOPS is composed of Kae1, a highly conserved protein present in bacteria, archaea and eukaryotes, kinase PRPK/Bud32, and three additional polypeptides (Pcc1, Cgi121, and Gon7). The first characterised member of the Kae1/TsaD family was annotated as Gcp for O-sialoglycoprotein endopeptidase, but this activity could not be confirmed. Later, its homologue, Kae1 from Pyrococcus abyssi, has been shown to have DNA-binding properties and apurinic-endonuclease activity. Members of this family have since been studied in yeast, archaea and bacteria resulting in sometimes conflicting data, several proposed functions and annotations but no definitive characterisation. For instance, some members have been linked to DNA maintenance in bacteria and mitochondria and transcription regulation and telomere homeostasis in eukaryotes, but their function remained unclear. Recent research indicates that this family is involved in the biosynthesis of N6-threonylcarbamoyl adenosine, a universal modification found at position 37 of tRNAs that read codons beginning with adenine.
definition_source: "InterPro:IPR034680 abstract (HAMAP MF_01446 is a member signature)"
