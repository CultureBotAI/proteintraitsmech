identifier: HAMAP:MF_00296
label: "Homoserine O-acetyltransferase [metXA]"
definition: >-
  Homoserine acetyltransferase (homoserine transacetylase) catalyses the first step unique to methionine biosynthesis, converting L-homoserine to O-acetyl-L-homoserine using acetyl-CoA as an acetyl group donor. This enzyme regulates homoserine in a number of biosynthetic pathways, making it vital to cell growth and viability. The biosynthesis of methionine in particular has been shown to be susceptible to small-molecule inhibition in fungi and is consequently a good candidate for antifungal agents. This family also includes serine O-acetyltransferases, involved in cysteine biosynthesis, and deacetylcephalosporin C acetyltransferase CefG, closely related to homoserine O-acetyltransferase and involved in cephalosporin biosynthesis. Acetyltransferase efuC from the fungus Hormonema carpetanum also belongs to this group. It plays a role in the biosynthesis of enfumafungin, a glycosylated fernene-type triterpenoid with potent antifungal activity.
