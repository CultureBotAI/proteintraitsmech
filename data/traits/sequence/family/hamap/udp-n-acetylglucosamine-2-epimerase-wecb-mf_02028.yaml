identifier: HAMAP:MF_02028
label: "UDP-N-acetylglucosamine 2-epimerase [wecB]"
definition: >-
  This entry represents UDP-N-acetylglucosamine 2-epimerase WecB (also known as RffE) from Enterobacteriaceae. WecB is involved in the Enterobacterial common antigen (ECA) biosynthesis, which is part of bacterial outer membrane biogenesis. ECA is a specific surface antigen (polysaccharide) shared by all members of the Enterobacteriaceae and is restricted to this family. It catalyses the reversible epimerization at C-2 of UDP-N-acetylglucosamine (UDP-GlcNAc) and thereby provides bacteria with UDP-N-acetylmannosamine (UDP-ManNAc), the activated donor of ManNAc residues.
definition_source: "InterPro:IPR032892 abstract (HAMAP MF_02028 is a member signature)"
