identifier: HAMAP:MF_03187
label: "EEF1A lysine methyltransferase 1 [EEF1AKMT1]"
definition: >-
  Budding yeast Efm5 is a S-adenosylmethionine-dependent lysine methyltransferase involved in the trimethylation of eEF1A at lysine 79. This entry also includes N(6)-adenine-specific DNA methyltransferase 2 (also known as N6MT2 and EEF1A lysine methyltransferase 1) from mammals.
