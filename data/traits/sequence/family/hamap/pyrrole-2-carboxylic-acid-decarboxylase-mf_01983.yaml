identifier: HAMAP:MF_01983
label: "Pyrrole-2-carboxylic acid decarboxylase"
definition: >-
  This entry includes ferulic acid decarboxylase 1 (Fdc1) from fungi and bacterial pyrrole-2-carboxylic acid decarboxylase HudA (also known as UbiD-like decarboxylase and ferulic acid decarboxylase-like protein). HudA catalyses the prenyl-FMN-dependent decarboxylation of pyrrole-2-carboxylate (P2C) and it can also catalyse the carboxylation of pyrrole in the presence of elevated concentrations of CO2 or bicarbonate. It attenuates the virulence of P.aeruginosa in a Drosophila model when overexpressed. Budding yeast Fdc1 catalyses the reversible decarboxylation of aromatic carboxylic acids like ferulic acid, p-coumaric acid or cinnamic acid, producing the corresponding vinyl derivatives (4-vinylphenol, 4-vinylguaiacol, and styrene respectively) which play the role of aroma metabolites. Fdc1 is not essential for ubiquinone synthesis.
