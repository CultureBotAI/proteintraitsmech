identifier: HAMAP:MF_01057
label: "tRNA (guanine-N(7)-)-methyltransferase [trmB]"
definition: >-
  This entry represents tRNA (guanine-N-7) methyltransferase (EC:2.1.1.33) mainly from bacteria, which catalyses the formation of N(7)-methylguanine at position 46 (m7G46) in tRNA. Capping of the pre-mRNA 5' end by addition a monomethylated guanosine cap (m(7)G) is an essential and the earliest modification in the biogenesis of mRNA. The reaction is catalysed by three enzymes: triphosphatase, guanylyltransferase, and tRNA (guanine-N-7) methyltransferase. This entry includes Bacillus subtilis TrmB, which contains a unique variant of the Rossmann-fold methyltransferase (RFM) structure, with the N-terminal helix folded on the opposite site of the catalytic domain. This entry also includes the bifunctional methyltransferase RFTRM from Rickettsia, in which this activity is found at the C-terminal.
definition_source: "InterPro:IPR055361 abstract (HAMAP MF_01057 is a member signature)"
