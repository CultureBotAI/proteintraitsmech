identifier: HAMAP:MF_01846
label: "Nucleoside triphosphatase NudI [nudI]"
definition: >-
  This entry represents a family of Nudix hydrolases that catalyse the hydrolysis of nucleoside triphosphates, with a preference for pyrimidine deoxynucleoside triphosphates (dUTP, dTTP and dCTP).
