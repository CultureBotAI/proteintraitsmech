identifier: HAMAP:MF_00951
label: "Transcription antitermination protein RfaH [rfaH]"
definition: >-
  This entry represents the transcription antitermination protein, RfaH. This protein is most closely related to the transcriptional termination/antitermination protein NusG (InterPro:IPR001062) and contains the KOW motif (InterPro:IPR005824). This protein appears to be limited to the proteobacteria. In Escherichia coli, it enhances distal genes transcription elongation in a specialised subset of operons that encode extracytoplasmic components. RfaH is recruited into a multi-component RNA polymerase complex by the ops element, which is a short conserved DNA sequence located downstream of the main promoter of these operons. Once bound, RfaH suppresses pausing and inhibits Rho-dependent and intrinsic termination at a subset of sites. Termination signals are bypassed, which allows complete synthesis of long RNA chains. Enhances expression of several operons involved in synthesis of lipopolysaccharides, exopolysaccharides, hemolysin, and sex factor. Also negatively controls expression and surface presentation of AG43 and possibly another AG43-independent factor that mediates cell-cell interactions and biofilm formation.
