identifier: HAMAP:MF_02214
label: "Lipid II isoglutaminyl synthase (glutamine-hydrolyzing) subunit MurT [murT]"
definition: >-
  Amidated peptidoglycan of Gram-positive bacteria is essential for peptidoglycan (PG) cross-linking, playing an important role in homeostasis, antibiotic resistance and cell survival. The bi-enzymatic complex MurT-GatD catalyses the amidation process in PG stem peptides, in which MurT is the ligase that catalyzes the ATP-dependent conversion of D-glutamate to D-isoglutamine using the ammonia provided by GatD, resulting in the amidation of the α-carboxyl group of the D-isoglutamate residue in Lipid II. MurT has sequence similarity to substrate-binding domains in Mur ligases.
definition_source: "InterPro:IPR043703 abstract (HAMAP MF_02214 is a member signature)"
