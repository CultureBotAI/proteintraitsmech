identifier: HAMAP:MF_00941
label: "GDP-mannose mannosyl hydrolase [gmm]"
definition: >-
  GDP-mannose mannosyl hydrolase (GDPMH, Gmm) from Escherichia coli hydrolyses both GDP-mannose and GDP-glucose. GDPMH is a member of the Nudix family of enzymes, but unlike other Nudix enzymes GDPMH catalyses the hydrolysis of nucleoside diphosphate derivatives by nucleophilic substitution at carbon, rather than at phosphorus. Thus, these enzymes are sugar nucleotide hydrolases rather than pyrophosphatases. GDPMH could participate in the regulation of cell wall biosynthesis by influencing the concentration of GDP-mannose or GDP-glucose in the cell and might also be involved in the biosynthesis of the slime polysaccharide colanic acid.
definition_source: "InterPro:IPR028613 abstract (HAMAP MF_00941 is a member signature)"
