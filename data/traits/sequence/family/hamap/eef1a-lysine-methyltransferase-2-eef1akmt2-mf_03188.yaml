identifier: HAMAP:MF_03188
label: "EEF1A lysine methyltransferase 2 [EEF1AKMT2]"
definition: >-
  Saccharomyces cerevisiae Efm4 (also known as See1) is a lysine methyltransferase that dimethylates eukaryotic elongation factor 1A (eEF1A1) at lysine residues. It may also play a role in intracellular transport. This entry also includes methyltransferase-like protein 10 (METTL10; EEF1A lysine methyltransferase 2) from fish and mammals, which catalyzes the trimethylation of EEF1A at 'Lys-318'.
