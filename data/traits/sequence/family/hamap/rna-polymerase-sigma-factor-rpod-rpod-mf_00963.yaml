identifier: HAMAP:MF_00963
label: "RNA polymerase sigma factor RpoD [rpoD]"
definition: >-
  Sigma factors are initiation factors that promote the attachment of RNA polymerase to specific initiation sites and are then released. Sigma factor RpoD, sometimes known as SigA, is the primary sigma factor during exponential growth.
