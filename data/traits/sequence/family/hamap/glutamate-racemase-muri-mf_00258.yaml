identifier: HAMAP:MF_00258
label: "Glutamate racemase [murI]"
definition: >-
  Glutamate racemase (EC:5.1.1.3) provides the (R)-glutamic acid required for cell wall biosynthesis. It converts L-glutamate to D-glutamate during peptidoglycan biosynthesis. The most closely related proteins differing in function are aspartate racemases.
