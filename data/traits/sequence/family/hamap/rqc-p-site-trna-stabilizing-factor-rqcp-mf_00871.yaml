identifier: HAMAP:MF_00871
label: "RQC P-site tRNA stabilizing factor [rqcP]"
definition: >-
  This entry represents the RQC P-site tRNA stabilizing factor (RqcP) found mainly in bacteria. RqcP is a component of the ribosome quality control system, a ribosome-associated complex that mediates the extraction of incompletely synthesised nascent chains from stalled ribosomes and their subsequent degradation. RqcP is associated with the translocation-like movement of the peptidyl-tRNA from the A-site into the P-site. In Bacillus subtilis, polyalanine tailing is catalysed by the NEMF family protein RqcH, in cooperation with RqcP and both are necessary and sufficient for processivity.
definition_source: "InterPro:IPR025490 abstract (HAMAP MF_00871 is a member signature)"
