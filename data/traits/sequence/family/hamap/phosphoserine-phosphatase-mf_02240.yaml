identifier: HAMAP:MF_02240
label: "Phosphoserine phosphatase"
definition: >-
  This entry represents a group of bacterial phosphatases, including YsaA from Bacillus subtilis. YsaA is a functional equivalent of E. coli SerB, which catalyses the last step of the phosphorylated serine biosynthetic pathway.
