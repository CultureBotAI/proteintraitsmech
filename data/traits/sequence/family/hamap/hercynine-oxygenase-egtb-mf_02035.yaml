identifier: HAMAP:MF_02035
label: "Hercynine oxygenase [egtB]"
definition: >-
  This entry represents hercynine oxygenase EgtB from Actinobacteria. Hercynine oxygenase (EgtB) catalyses the oxidative sulfurisation of hercynine (Nα,Nα,Nα-trimethyl-L-histidine) to hercynyl-γ-L-glutamyl-L-cysteine sulfoxide, an intermediate step in the ergothioneine biosynthesis pathway. The enzyme is specific for its substrates: it cannot utilise cysteine, N-acetylcysteine or glutathione in place of γ-glutamylcysteine, and histidine is a poor sulfur acceptor compared to hercynine.
