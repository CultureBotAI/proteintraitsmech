identifier: HAMAP:MF_01609
label: "Glutamate--cysteine ligase [gshA]"
definition: >-
  This entry represents a family of proteins that are thought to function as carboxylate-amine ligases. One protein (UniProtKB:P77213) shows weak glutamate--cysteine ligase activity, but the low catalytic rate casts doubt on whether L-cysteine is the actual biological substrate. Glutamate--cysteine ligase is the first of two enzymes in glutathione biosynthesis. Species in this entry, however, are generally not believed to make glutathione, so their function is unknown.
