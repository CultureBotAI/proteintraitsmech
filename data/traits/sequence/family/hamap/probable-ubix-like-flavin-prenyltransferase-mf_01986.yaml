identifier: HAMAP:MF_01986
label: "Probable UbiX-like flavin prenyltransferase"
definition: >-
  This entry represents a group of putative UbiX-like flavin prenyltransferase from bacteria, including YclB (BsdB) from Bacillus subtilis and EcdB (Pad1) from Escherichia coli. They are involved in the decarboxylation and detoxification of phenolic derivatives under both aerobic and anaerobic conditions.
