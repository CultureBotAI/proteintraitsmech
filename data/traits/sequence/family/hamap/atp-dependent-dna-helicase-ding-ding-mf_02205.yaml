identifier: HAMAP:MF_02205
label: "ATP-dependent DNA helicase DinG [dinG]"
definition: >-
  DinG is a DNA damage-inducible protein that functions as a helicase which translocates on single-stranded DNA (ssDNA) in the 5'-3' direction. The ATP-dependent DNA helicase activity of DinG requires divalent cations (Mg2+, Ca2+, and Mn2+) but is not observed in the presence of Zn2+.
