identifier: HAMAP:MF_00647
label: "Phosphopantetheine adenylyltransferase [coaD]"
definition: >-
  This entry contains phosphopantetheine adenyltransferases, primarily of the archaeal type. They are responsible for the ATP-dependent conversion of pantetheine 4'-phosphate to 3'-dephospho-CoA.
