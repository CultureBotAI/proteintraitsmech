identifier: HAMAP:MF_03071
label: "Chromodomain-helicase-DNA-binding protein 8 [CHD8]"
definition: >-
  This entry includes chromodomain-helicase-DNA-binding protein 8 (CHD8) from animals. CHD8 regulates transcription. It acts as a repressor in several pathways: repressing transcription by remodeling chromatin structure (binding to histone H3 di- and trimethylated on Lys4) and recruiting histone H1 to target genes; suppressing p53/TP53-mediated apoptosis by recruiting histone H1 and preventing p53/TP53 transactivation activity; and a negative regulator of Wnt signaling pathway, regulating beta-catenin activity. By interacting with CTCF, it is involved in epigenetic remodeling. CHD8 can also act as a transcription activator, participating in efficient U6 RNA polymerase III transcription by interacting with ZNF143. Gene knockout is embryonically lethal. CHD8 has been linked to autism spectrum disorder (ASD).
definition_source: "InterPro:IPR034724 abstract (HAMAP MF_03071 is a member signature)"
