identifier: HAMAP:MF_00590
label: "GTP-dependent dephospho-CoA kinase"
definition: >-
  Dephospho-coenzyme A kinase (DPCK) catalyzes the ATP-dependent phosphorylation of dephospho-CoA, the final step in coenzyme A (CoA) biosynthesis. This entry represents a group of DPCKs, including TK1697 from T. kodakarensis.
