identifier: HAMAP:MF_01893
label: "tRNA pseudouridine synthase Pus10 [pus10]"
definition: >-
  This entry represents the Pus 10 family of tRNA pseudouridine synthases. Family members are responsible for the synthesis of pseudouridine from uracil-54 and uracil-55 in the psi GC loop of transfer RNAs. The family appears to be distinct from the five commonly identified families of Psi synthases. These proteins are found in archaea.
