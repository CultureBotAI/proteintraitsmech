identifier: HAMAP:MF_00637
label: "Anti-sigma F factor [spoIIAB]"
definition: >-
  This entry describes the SpoIIAB anti-sigma F factor. Sigma F regulates spore development in B subtilis. SpoIIAB binds to sigma F, preventing formation of the transcription complex at the promoter. SpoIIAA (anti-anti-sigma F factor) binds to SpoIIAB to inhibit association with sigma F, however SpoIIAB can phosphorylate SpoIIAA, causing disassociation of the SpoIIAA/B complex. The SpoIIE phosphatase dephosphorylates SpoIIAA.
definition_source: "InterPro:IPR010194 abstract (HAMAP MF_00637 is a member signature)"
