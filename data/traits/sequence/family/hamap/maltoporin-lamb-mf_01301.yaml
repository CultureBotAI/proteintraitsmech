identifier: HAMAP:MF_01301
label: "Maltoporin [lamB]"
definition: >-
  Maltoporin (LamB) is involved in the transport of maltose and maltodextrins. It forms homotrimers composing three 18-stranded antiparallel β-barrels, containing three independent channels.
