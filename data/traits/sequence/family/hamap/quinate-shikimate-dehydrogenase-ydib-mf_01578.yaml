identifier: HAMAP:MF_01578
label: "Quinate/shikimate dehydrogenase [ydiB]"
definition: >-
  This entry represents a group of bifunctional enzymes EC:1.1.1.282, quinate/shikimate dehydrogenase. This is the second shikimate dehydrogenase enzyme found in Escherichia coli and differs from EC:1.1.1.25 (InterPro:IPR011342), in that it can use both quinate and shikimate as substrate and either NAD(+) or NADP(+) as acceptor.
