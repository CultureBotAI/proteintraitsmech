identifier: HAMAP:MF_01174
label: "N-succinylglutamate 5-semialdehyde dehydrogenase [astD]"
definition: >-
  Succinylglutamic-semialdehyde dehydrogenase (or succinylglutamic semialdehyde dehydrogenase (SGSD, E. coli AstD, EC=1.2.1.71)) is the fourth enzyme in the arginine succinyltransferase (AST) pathway for arginine catabolism, and catalyzes the NAD+-dependent reduction of succinylglutamate semialdehyde into succinylglutamate. This pathway converts the carbon skeleton of arginine into glutamate, with the concomitant production of ammonia and conversion of succinyl-CoA into succinate and CoA.
