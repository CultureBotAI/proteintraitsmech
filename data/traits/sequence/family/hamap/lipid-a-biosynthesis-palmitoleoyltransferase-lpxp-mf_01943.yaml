identifier: HAMAP:MF_01943
label: "Lipid A biosynthesis palmitoleoyltransferase [lpxP]"
definition: >-
  LpxP catalyses the transfer of palmitoleate from palmitoleoyl-acyl carrier protein (ACP) to Kdo(2)-lipid IV(A) to form Kdo(2)-(palmitoleoyl)-lipid IV(A). It is required for the biosynthesis of a distinct molecular species of lipid A, which is present only in cells grown at low temperatures.
