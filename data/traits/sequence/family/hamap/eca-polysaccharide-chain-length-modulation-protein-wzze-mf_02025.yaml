identifier: HAMAP:MF_02025
label: "ECA polysaccharide chain length modulation protein [wzzE]"
definition: >-
  This entry represents ECA polysaccharide chain length modulation protein WzzE from Enterobacteriaceae. WzzE is involved in the Enterobacterial common antigen (ECA) biosynthesis, which is part of bacterial outer membrane biogenesis. ECA is a specific surface antigen (polysaccharide) shared by all members of the Enterobacteriaceae and is restricted to this family. WzzE modulates the polysaccharide chain length of enterobacterial common antigen. It is required for the assembly of the phosphoglyceride-linked form of ECA (ECA(PG)) and the water-soluble cyclic form of ECA (ECA(CYC)).
definition_source: "InterPro:IPR032895 abstract (HAMAP MF_02025 is a member signature)"
