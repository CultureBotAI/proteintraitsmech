identifier: HAMAP:MF_04136
label: SAR-endolysin
definition: >-
  Endolysin is a lysozyme that hydrolyses the (1->4)-beta-glycosidic linkage between N-acetylmuramic acid (MurNAc) and N-acetylglucosamine (GlcNAc) residues in the bacterial cell wall peptidoglycan. Endolysin and the cell membrane pore-forming proteins holin and spanin act together to bring about host cell lysis and release of virus particles. This family includes SAR-endolysins (signal-anchor-release endolysins) from bacteriophages and prophage lysozymes mostly from Proteobacteria. Unlike T4 E phage lysozyme, the endolysin R21 from Enterobacteria phage P21 has an N-terminal SAR (signal-arrest-release) domain that anchors the endolysin to the membrane in an inactive form, which act to prevent premature lysis of the infected bacterium. The dsDNA phages of eubacteria use endolysins or muralytic enzymes in conjunction with hollin, a small membrane protein, to degrade the peptidoglycan found in bacterial cell walls. Similarly, prophage lysozymes containing the SAR domain facilitate the biosynthesis of its cell wall heteropolymer peptidoglycan and cell division in bacteria. These enzymes cleave the glycosidic beta 1,4-bonds between the N-acetylmuramic acid and the N-acetylglucosamine of the peptidoglycan.
