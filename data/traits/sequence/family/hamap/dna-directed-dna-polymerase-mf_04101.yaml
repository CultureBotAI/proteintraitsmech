identifier: HAMAP:MF_04101
label: "DNA-directed DNA polymerase"
definition: >-
  This entry includes the DNA-directed DNA polymerase from bacteriophage T7 and its relatives. The polymerase has two activities, DNA synthesis (polymerase) and an exonucleolytic activity that degrades single-stranded DNA in the 3'-5' direction. The polymerase binds to host thioredoxin which increases the rate of dNTP incorporation, and binds to DNA helicase gp4 to co-ordinate nucleotide polymerization with unwinding of the DNA.
