identifier: HAMAP:MF_01252
label: "Flavohemoprotein [hmp]"
definition: >-
  This entry represents flavohemoproteins, which have multiple enzymatic activities and consist of three distinct domains - an N-terminal heme- and oxygen-binding domain (globin domain) followed by an oxidoreductase FAD-binding domain and a NAD-binding reductase domain. They function as nitric oxide dioxygenases and a ferrisiderophore reductase whereby the complexed Fe+3 iron of siderophores are reduced to Fe+2 and released. They are involved in the inducible response to nitrosative stress, as their nitric oxide dioxygenase ability is used in aerobic NO detoxification, a reaction which utilises O2 and NAD(P)H to convert NO to nitrate and therefore offers protection from various noxious nitrogen compounds.
definition_source: "InterPro:IPR023950 abstract (HAMAP MF_01252 is a member signature)"
