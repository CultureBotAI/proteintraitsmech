identifier: HAMAP:MF_01602
label: "Lipoate-protein ligase A [lplA]"
definition: >-
  Lipoate-protein ligase A catalyzes both the ATP-dependent activation of exogenously supplied lipoate to lipoyl-AMP and the transfer of the activated lipoyl onto the lipoyl domains of lipoate-dependent enzymes. It is also able to catalyze very poorly the transfer of lipoyl and octanoyl moiety from their acyl carrier protein.
