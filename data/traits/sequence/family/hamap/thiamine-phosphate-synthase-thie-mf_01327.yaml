identifier: HAMAP:MF_01327
label: "Thiamine-phosphate synthase [thiE]"
definition: >-
  This group represents a predicted thiamine-phosphate synthase from cyanobacteria and bacteria. Thiamine phosphate synthase (TPS) catalyzes the substitution of the pyrophosphate of 2-methyl-4-amino-5- hydroxymethylpyrimidine pyrophosphate by 4-methyl-5- (beta-hydroxyethyl)thiazole phosphate to yield thiamine phosphate in the thiamine biosynthesis pathway.
