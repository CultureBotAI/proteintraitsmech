identifier: HAMAP:MF_01177
label: "HTH-type transcriptional repressor NsrR [nsrR]"
definition: >-
  The HTH-type transcriptional repressor NsrR is a nitric oxide-sensitive repressor of genes involved in protecting the cell against nitrosative stress, such as ytfE, hmpA and ygbA. It may require iron for activity. NsrR does not regulate its own transcription.
