identifier: HAMAP:MF_01636
label: "3-octaprenyl-4-hydroxybenzoate carboxy-lyase [ubiD]"
definition: >-
  3-octaprenyl-4-hydroxybenzoate carboxy-lyase (also known as UbiD) catalyses the decarboxylation of 3-octaprenyl-4-hydroxy benzoate to 2-octaprenylphenol. It is involved in ubiquinone biosynthesis.
