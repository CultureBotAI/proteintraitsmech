identifier: HAMAP:MF_00182
label: "Methionyl-tRNA formyltransferase [fmt]"
definition: >-
  Methionyl-tRNA formyltransferase (EC:2.1.2.9) transfers a formyl group onto the amino terminus of the acyl moiety of the methionyl aminoacyl-tRNA. The formyl group appears to play a dual role in the initiator identity of N-formylmethionyl-tRNA by promoting its recognition by IF2 and by impairing its binding to EFTU-GTP.
definition_source: "InterPro:IPR005794 abstract (HAMAP MF_00182 is a member signature)"
