identifier: HAMAP:MF_01916
label: "Cardiolipin synthase"
definition: >-
  This entry represents cardiolipin synthases (Cls) mostly from Firmicutes. Cardiolipin (CL) synthases catalyse the reversible phosphatidyl group transfer from one phosphatidylglycerol molecule to another to form cardiolipin (diphosphatidylglycerol) and glycerol. Bacillus subtilis has three genes (clsA, ywjE and ywiE) for CL synthase; the main role in CL synthesis being played by clsA. This entry includes ClsA and YwiE proteins from Bacillus subtilis.
