identifier: HAMAP:MF_01200_B
label: "Orotidine 5'-phosphate decarboxylase [pyrF]"
definition: >-
  This entry represents orotidine 5'-phosphate decarboxylases (OMPdecases) found in bacteria. Orotidine 5'-phosphate decarboxylase (OMPdecase) (EC:4.1.1.23) catalyses the last step in the de novo biosynthesis of pyrimidines, the decarboxylation of OMP into UMP. In higher eukaryotes OMPdecase is part, with orotate phosphoribosyltransferase, of a bifunctional enzyme, while the prokaryotic and fungal OMPdecases are monofunctional proteins. Some parts of the sequence of OMPdecase are well conserved across species. The best conserved region is located in the N-terminal half of OMPdecases and is centred around a lysine residue which is essential for the catalytic function of the enzyme. OMPdecases adopt classical TIM-barrel fold with an active site located at one side of the barrel.
