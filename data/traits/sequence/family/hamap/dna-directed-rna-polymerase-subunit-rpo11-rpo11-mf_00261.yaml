identifier: HAMAP:MF_00261
label: "DNA-directed RNA polymerase subunit Rpo11 [rpo11]"
definition: >-
  DNA-directed RNA polymerases, also known as DNA-dependent RNA polymerases, are responsible for the polymerisation of ribonucleotides into a sequence complementary to the template DNA. Eukaryotes have three different DNA-directed RNA polymerases (RNAPs), Pol I, II, and III, whereas Archaea and Bacteria have single enzymes. RNAPs are multisubunit enzymes. Archaeal RNAP is closely related to eukaryotic RNAP II, which consists of 12 subunits. Archaeal RNAP has an additional subunit, Rpo13, with no orthologue in the eukaryotic enzyme. This entry represents a family of small subunits of RNAP of about 13 to 16kDa that are found in all three types of eukaryotic polymerases and in archaeal polymerase which are highly conserved and includes the archaeal DNA-dependent RNA polymerase subunit Rpo11 (also known as subunit L) and the eukaryotic RPB11/RPC19 RNA polymerase subunits. The name Rpo11 is based on eukaryotic terminology. The structure has been solved in conjunction with the D subunit.
definition_source: "InterPro:IPR022905 abstract (HAMAP MF_00261 is a member signature)"
