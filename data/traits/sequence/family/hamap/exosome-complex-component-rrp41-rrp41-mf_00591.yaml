identifier: HAMAP:MF_00591
label: "Exosome complex component Rrp41 [rrp41]"
definition: >-
  Rrp41 is a major subunit of the exosome, helping form the catalytic core. Rrp41 is a member of the RNase PH family, named after the bacterial ribonuclease PH, a 3'-5' exoribonuclease. Structurally all members of this family form hexameric rings (trimers of dimers). In archaea, the ring is formed by three Rrp41:Rrp42 dimers. The central chamber within the ring contains three phosphorolytic active sites located in an Rrp41 pocket at the interface between Rrp42 and Rrp41. The ring is capped by three copies of Rrp4 and/or Csl4 which contain putative RNA interaction domains. The archaeal exosome is a protein complex involved in the degradation and the posttranscriptional tailing of RNA. It degrades single-stranded RNA (ssRNA) in the 3'-5' direction, but also can catalyze the reverse reaction of adding nucleoside diphosphates to the 3'-end of RNA which has been shown to lead to the formation of poly-A-rich tails on RNA.
