identifier: HAMAP:MF_01634
label: "tRNA-guanine(15) transglycosylase [tgtA]"
definition: >-
  This tRNA-guanine transglycosylase (tgt) from archaea differs from the tgt of E. coli and other Bacteria in the site of action and the modification that results. It exchanges 7-cyano-7-deazaguanine (preQ0) with guanine at position 15 of archaeal tRNA; this nucleotide is subsequently converted to archaeosine, found exclusively in the Archaea. This enzyme from Haloferax volcanii has been purified, characterised, and partially sequenced and is the basis for identifying this family. In contrast, bacterial tgt catalyzes the exchange of preQ0 or preQ1 for the guanine base at position 34; this nucleotide is subsequently modified to queuosine. Archeoglobus fulgidus has both enzymes, while some other Archaea have just this one.
