identifier: HAMAP:MF_01645
label: "Allantoinase [allB]"
definition: >-
  This entry represents bacterial allantoinase, which catalyses the conversion of allantoin (5-ureidohydantoin) to allantoic acid by hydrolytic cleavage of the five-member hydantoin ring. The proteins in this family are all in the vicinity of other genes involved in the processes of xanthine/urate/allantoin catabolism.
