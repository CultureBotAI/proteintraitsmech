identifier: HAMAP:MF_01982
label: "2-phytyl-1,4-naphtoquinone methyltransferase [menG]"
definition: >-
  Phylloquinone (vitamin K(1)) is synthesised in cyanobacteria and in chloroplasts of plants, where it serves as electron carrier of photosystem I. This entry represents 2-phytyl-1,4-naphtoquinone methyltransferase MenG, which is required for the last step of phylloquinone synthesis.
