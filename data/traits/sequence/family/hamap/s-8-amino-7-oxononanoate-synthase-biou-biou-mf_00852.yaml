identifier: HAMAP:MF_00852
label: "(S)-8-amino-7-oxononanoate synthase BioU [bioU]"
definition: >-
  This entry represents a group of proteins from cyanobacteria and archaea, including BioU from Synechocystis sp. BioU is involved in biotin biosynthesis. It is a suicide enzyme that loses the Lys124 amino group after a single round of reaction. It catalyses the formation of (S)-8-amino-7-oxononanoate (DAN-carbamic acid) from (7R,8S)-8-amino-7-(carboxyamino)nonanoate (DAN), a function equivalent to the canonical BioA reaction and the first half-reaction of BioD.
definition_source: "InterPro:IPR044262 abstract (HAMAP MF_00852 is a member signature)"
