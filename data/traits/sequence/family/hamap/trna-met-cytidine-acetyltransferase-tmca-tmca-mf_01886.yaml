identifier: HAMAP:MF_01886
label: "tRNA(Met) cytidine acetyltransferase TmcA [tmcA]"
definition: >-
  TmcA catalyses the formation of N(4)-acetylcytidine (ac4C) at the wobble position of tRNA(Met), by using acetyl-CoA as an acetyl donor and either ATP or GTP. This modification is thought to ensure precise recognition of the AUG codon by strengthening C-G base-pair interaction and also prevent misrecognition of the near cognate AUA codon. Structurally, TmcA consists of an RNA helicase module fused with a GCN5-related N-acetyltransferase (GNAT) fold. It has been prososed that an RNA helicase motor driven by ATP hydrolysis is used to deliver the wobble base to the active centre of the GNAT domain.
