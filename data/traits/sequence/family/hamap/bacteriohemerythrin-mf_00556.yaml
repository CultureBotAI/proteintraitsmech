identifier: HAMAP:MF_00556
label: Bacteriohemerythrin
definition: >-
  Hemerythrin is an oxygen-binding protein. It may be involved in a storage mechanism or delivery to oxygen-requiring enzymes. The oxygen-binding site contains two iron atoms. This entry represents hemerythrin-like proteins from bacteria and archaea.
