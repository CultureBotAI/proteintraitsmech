identifier: HAMAP:MF_03134
label: "Probable alanine--tRNA ligase, chloroplastic"
definition: >-
  Alanine-tRNA ligase catalyses the attachment of alanine to tRNA(Ala) in a two-step reaction: alanine is first activated by ATP to form Ala-AMP and then transferred to the acceptor end of tRNA(Ala). It also edits incorrectly charged tRNA(Ala) via its editing domain. This entry consists of probable alanine-tRNA ligases from plants.
