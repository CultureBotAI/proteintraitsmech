identifier: HAMAP:MF_00007
label: "DNA primase DnaG [dnaG]"
definition: >-
  Archaeal DnaG proteins contain a central TOPRIM domain, which is characteristic for topoisomerases and primases. DnaG from Sulfolobus solfataricus has been shown to exhibit primase activity, catalysing the synthesis of short RNA molecules used as primers for DNA polymerase during DNA replication. The protein has been linked to the RNA exosome complex, having been shown to be a poly(A)-binding protein in S. solfataricus that forms part of the heteromeric, RNA-binding cap of the exosome.
