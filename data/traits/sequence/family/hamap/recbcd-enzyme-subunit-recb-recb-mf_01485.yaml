identifier: HAMAP:MF_01485
label: "RecBCD enzyme subunit RecB [recB]"
definition: >-
  Exodeoxyribonuclease V, or RecBCD holoenzyme, ( ) is a multifunctional nuclease with potent ATP-dependent exodeoxyribonuclease activity. Ejection of RecD, as occurs at chi recombinational hotspots, cripples exonuclease activity in favor of recombinagenic helicase activity. All proteins in this family for which functions are known are DNA-DNA helicases that are used as part of an exonuclease-helicase complex (made up of RecBCD homologues) that function to generate substrates for the initiation of recombination and recombinational repair. The complex catalyses exonucleolytic cleavage in either the 5' to 3' or 3' to 5' direction to yield 5-phosphooligonucleotides in the presence of ATP. This is the beta subunit.
