identifier: HAMAP:MF_01375
label: "Phosphonoacetaldehyde hydrolase [phnX]"
definition: >-
  Phosphonoacetaldehyde hydrolase or phosphonatase catalyses the cleavage of the carbon-phosphorous bond of a phosphonate. This enzyme is a member of the Haloacid Dehalogenase (HAD) superfamily of aspartate-nucleophile hydrolases, and contains a modified version of the conserved catalytic motifs of that superfamily. The first motif is usually DxDx(T/V); here it is DxAxT. In the third motif the normally conserved lysine is instead an arginine. Additionally, the enzyme from Bacillus cereus contains a unique conserved catalytic lysine which is involved in the binding and activation of the substrate through the formation of a Schiff base. The substrate of this enzyme is the product of 2-aminoethylphosphonate (AEP) transaminase, phosphonoacetaldehyde. This degradation pathway for AEP may be related to its toxic properties which are utilised by microorganisms as a chemical warfare agent.
definition_source: "InterPro:IPR006323 abstract (HAMAP MF_01375 is a member signature)"
