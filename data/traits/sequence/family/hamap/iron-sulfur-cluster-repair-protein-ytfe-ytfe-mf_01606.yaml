identifier: HAMAP:MF_01606
label: "Iron-sulfur cluster repair protein YtfE [ytfE]"
definition: >-
  YtfE was is also known as regulator of cell morphogenesis and NO signaling because it is involved in anaerobic NO protection. It is part of a family of di-iron proteins involved in the repair of iron-sulphur clusters.
