identifier: HAMAP:MF_00776
label: "Glyoxylate reductase [gyaR]"
definition: >-
  The GyaR family of glyoxylate reductases catalyses the NADH-linked reduction of glyoxylate to glycolate. This family is found in hyperthermophilic archaea, where it is thought to play an important role in the glyoxylate and 3-hydroxypropionic acid cycles. Structurally, GyaR is similar to other NADH-linked dehydrogenases. The enzyme's thermostability appears to be due to the presence of aromatic clusters and the fact that it has more ion pairs and a relatively lower hydrophobic accessible surface area than mesophilic enzymes.
definition_source: "InterPro:IPR023519 abstract (HAMAP MF_00776 is a member signature)"
