identifier: HAMAP:MF_00295
label: "Homoserine O-succinyltransferase [metAS]"
definition: >-
  Homoserine O-succinyltransferase (HST) also known as homoserine O-transsuccinylase (HTS), catalyses the first step in the biosynthesis of methionine: Succinyl-CoA + L-homoserine = CoA + O-succinyl-L-homoserine The activation of homoserine through succinylation of homoserine in some bacteria, such as Escherichia coli and Bacillus cereus, is carried out by homoserine O-succinyltransferase (HTS; EC:2.3.1.46 ), while other bacteria, such as Haemophilus influenzae, Pseudomonas aeruginosa, and Mycobacterium tuberculosis, acetylate homoserine via homoserine O-acetyltransferase (HTA; EC:2.3.1.31 ). This family also includes serine acetyltransferase CysE ( EC:2.3.1.30 ) from Lactobacillus casei, which catalyses the formation of O-acetyl serine from L-serine and acetyl-CoA, and is involved in cysteine biosynthesis.
definition_source: "InterPro:IPR033752 abstract (HAMAP MF_00295 is a member signature)"
