identifier: HAMAP:MF_03107
label: "Very-long-chain 3-oxoacyl-CoA reductase"
definition: >-
  Very-long-chain 3-oxoacyl-CoA reductase ( ) is a component of the microsomal membrane bound fatty acid elongation system, which produces the 26-carbon very long-chain fatty acids (VLCFA) from palmitate. It catalyses the reduction of the 3-ketoacyl-CoA intermediate that is formed in each cycle of fatty acid elongation. VLCFAs serve as precursors for ceramide and sphingolipids.
