identifier: HAMAP:MF_03037
label: "Probable cytosolic iron-sulfur protein assembly protein CIAO1 [CIAO1]"
definition: >-
  Proteins in this entry are probable cytosolic iron-sulfur (FeS) protein assembly proteins from eukaryotes, including Cia1 from Saccharomyces cerevisiae and CIAO1 from humans. CIA1 from Arabidopsis is an essential component of the cytosolic iron-sulfur [FeS] protein assembly (CIA) machinery; it is required for the maturation of extramitochondrial Fe/S proteins. [Fe-S] clusters are ubiquitous and evolutionary ancient prosthetic groups that are required to sustain fundamental life processes. They can be used as part of catalytic centres for chemical sensing, stabilise protein structure and determine protein function.
definition_source: "InterPro:IPR028608 abstract (HAMAP MF_03037 is a member signature)"
