identifier: HAMAP:MF_00288
label: "Methionine synthase [metE]"
definition: >-
  This entry represents methionine synthase MetE from Archaea. It catalyses the formation of methionine from methylcobalamin and homocysteine and belongs the vitamin-B12 (cobalamin) independent methionine synthase family.
