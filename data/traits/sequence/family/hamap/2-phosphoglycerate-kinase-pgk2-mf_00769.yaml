identifier: HAMAP:MF_00769
label: "2-phosphoglycerate kinase [pgk2]"
definition: >-
  Analysis of the metabolome of a number of methanogenic archaea revealed that they produced a number of unusual compounds of low molecular weight, one of which was cyclic 2,3-diphosphoglycerate (cDPG). This has been found to occur in several methanogens in high concentrations of up to 1 Molar. The highest intracellular concentrations of cDPG were detected in the hyperthermophilic methanogens Methanothermus fervidus (optimal growth temperature, 83 degrees C) and Methanopyrus kandleri (optimal growth temperature, 98 degrees C). Additionally, the intracellular concentration of cDPG increases with temperature up to the optimal growth temperature in M. fervidus. It has been proposed that cDPG is either used an energy store and/or is involved in the process of thermoadaption.
definition_source: "InterPro:IPR020872 abstract (HAMAP MF_00769 is a member signature)"
