identifier: HAMAP:MF_00006
label: "Argininosuccinate lyase [argH]"
definition: >-
  Argininosuccinate lyase (ASL or ASAL, EC:4.3.2.1) participates in arginine synthesis in all organisms catalysing the reversible breakdown of argininosuccinate to arginine and fumarate. The reaction is also part of the urea cycle. The crystal structures of ASLs from several species have been studied, in particular the duck delta1 and delta2 eye lens crystallins, which are inactive and active homologues of ASL, respectively. ASL is a member of the Lyase class I family, these proteins are active as tetramers. The four active sites of the homotetrameric enzyme are each formed by residues from three different subunits. In humans, mutations in ASAL result in the autosomal recessive disorder argininosuccinic aciduria. This entry represents argininosuccinate lyase and includes avian delta crystallins whose biological role is to provide the optically clear cellular protein of the eye lens.
definition_source: "InterPro:IPR009049 abstract (HAMAP MF_00006 is a member signature)"
