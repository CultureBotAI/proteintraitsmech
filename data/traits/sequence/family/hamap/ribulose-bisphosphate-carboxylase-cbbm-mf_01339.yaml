identifier: HAMAP:MF_01339
label: "Ribulose bisphosphate carboxylase [cbbM]"
definition: >-
  Ribulose bisphosphate carboxylase (RuBisCO) catalyses the initial step in Calvin's reductive pentose phosphate cycle in plants as well as purple and green bacteria. It catalyzes the primary CO2 fixation step. Rubisco is activated by carbamylation of an active site lysine, stabilized by a divalent cation, which then catalyzes the proton abstraction from the substrate ribulose 1,5 bisphosphate (RuBP) and leads to the formation of two molecules of 3-phosphoglycerate. Members of the Rubisco family can be divided into 4 subgroups, form I-IV, which differ in their taxonomic distribution and subunit composition. A number of subtle interactions near the active site and the carboxyl terminus account for functional differences between the different forms of Rubiscos found in nature. Form II Rubiscos contain only large subunits and are found in some photosynthetic proteobacteria, chemoautotrophic bacteria, and certain dinoflagellate algae.
