identifier: HAMAP:MF_00853
label: "Protoporphyrinogen IX dehydrogenase [quinone] [hemG]"
definition: >-
  Protoporphyrinogen oxidase (PPO) catalyses the six-electron oxidation of protoporphyrinogen IX to the fully conjugated protoporphyrin IX. HemG is a membrane-localized protein and a menadione-dependent flavodoxin with protoporphyrinogen oxidase activity. In E. coli HemG abstracts six electrons from its substrate and transfers them via ubiquinone, cytochrome bo(3) (Cyo) and cytochrome bd (Cyd) oxidase to oxygen. Under anaerobic conditions electrons are transferred via menaquinone, fumarate (Frd) and nitrate reductase (Nar). Cyo, Cyd and Nar contribute to the proton motive force that drives ATP formation.
definition_source: "InterPro:IPR044264 abstract (HAMAP MF_00853 is a member signature)"
