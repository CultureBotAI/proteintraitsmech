identifier: HAMAP:MF_00309
label: "A-type ATP synthase subunit A [atpA]"
definition: >-
  This entry represents the catalytic subunit alpha of V-type ATP synthase, which is known as subunit A in eukaryotes. In bacteria and archaea it produces ATP from ADP in the presence of a proton gradient across the membrane. Transmembrane ATPases are membrane-bound enzyme complexes/ion transporters that use ATP hydrolysis to drive the transport of protons across a membrane. Some transmembrane ATPases also work in reverse, harnessing the energy from a proton gradient, using the flux of ions across the membrane via the ATPase proton channel to drive the synthesis of ATP. A-type ATPases (archaeal-type ATPases) and V-ATPases, all included in this entry, are thought to have evolved from common ancestral genes.
definition_source: "InterPro:IPR022878 abstract (HAMAP MF_00309 is a member signature)"
