identifier: HAMAP:MF_01468
label: "Mini-ribonuclease 3 [mrnC]"
definition: >-
  This family consists of the mini-ribonuclease 3 (mini-3) and mini-3 like proteins. Mini-3 is involved in correct processing of both the 5' and 3' ends of 23S rRNA precursor. It processes 30S rRNA precursor transcript even in absence of ribonuclease 3 (Rnc); Rnc processes 30S rRNA into smaller rRNA precursors. Mini-3 like proteins in this entry strongly resemble the Mini-3 enzyme, but are missing a highly conserved, possibly catalytically important site at position 72.
definition_source: "InterPro:IPR008226 abstract (HAMAP MF_01468 is a member signature)"
