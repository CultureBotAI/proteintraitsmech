identifier: HAMAP:MF_00870
label: "Transcription termination factor FttA [fttA]"
definition: >-
  This entry represents the Factor that terminates transcription in archaea (FttA), also known as archaeal Cleavage and Polyadenylation Specificity Factor 1 (aCPSF1), and similar sequences mainly found in archaea. FttA is a homologue of eukaryotic CPSF73 (Cleavage and Polyadenylation Specificity Factor 73 kDa subunit) and INTS11 (Integrator Complex Subunit 11). FttA has been characterised as a ribonuclease essential for transcription termination to ensure programmed transcriptome and optimal growth and physiology. It associates with archaeal RNA polymerase (RNAP) and cleaves the transcript at the 3'-end, downstream of the uridine-rich sequences recognised by its N-terminal KH-domain, a characteristic RNA binding domain. FttA from various archaeal species, including Pyrococcus abyssi and Thermococcus kodakarensis, is included in this family. FttA is a single-stranded endoribonuclease (endoRNase) with a preference for cleavage at CA dinucleotides and 5'-3' exoribonuclease (exoRNase) activity on 5'-monophosphorylated RNA.
