identifier: HAMAP:MF_01348
label: "Photosystem II assembly lipoprotein Ycf48 [ycf48]"
definition: >-
  This entry represents a family of proteins predominantly found in the thylakoid membrane of plant chloroplasts and cyanobacteria, including Photosystem II assembly lipoprotein Ycf48 from Synechocystis sp. and Photosystem II stability/assembly factor HCF136, chloroplastic from Arabidopsis thaliana. The photosynthesis system II (PSII) is a multi-subunit pigment-protein complex responsible for water oxidation during oxygenic photosynthesis. Its assembly is regulated by PSII assembly factors including Ycf48/Hcf136, Psb27 and Psb28. Ycf48/Hcf136 contains the BNR repeats and can be found predominantly in the thylakoid membrane. Ycf48/Hcf136 is required for assembly and repair of an early intermediate in PSII assembly that includes D2 (psbD) and cytochrome b559. This entry also includes some Ycf48-like proteins that may not affect PSII activity.
