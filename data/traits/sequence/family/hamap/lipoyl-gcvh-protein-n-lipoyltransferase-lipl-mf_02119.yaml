identifier: HAMAP:MF_02119
label: "Lipoyl-[GcvH]:protein N-lipoyltransferase [lipL]"
definition: >-
  Lipoic acid is an organosulphur compound that is an essential coenzyme in several multienzyme complexes, including pyruvate dehydrogenase, 2-oxoglutarate dehydrogenase and the glycine cleavage system. Many Gram-positive bacteria, such as Bacillus subtilis, require three proteins for lipoic acid cofactor biosynthesis: LipJ, LipL and LipM. LipM is a lipoate:protein ligase that transfers an octanoyl moiety from acyl-carrier protein to the GcvH protein of the glycine cleavage system. LipL, an octanoyltransferase, then transfers this moiety from GcvH to other enzyme complexes. LipA inserts the sulphur group to form the active lipoate cofactor. This entry represents the LipL component of this system. It includes Lipoyl-[GcvH]:protein N-lipoyltransferase from Listeria monocytogenes serovar 1/2a (EC:2.3.1.200) and Octanoyl-[GcvH]:protein N-octanoyltransferase (EC:2.3.1.204) from Bacillus subtilis.
