identifier: HAMAP:MF_01869
label: "Probable 4-amino-4-deoxy-L-arabinose-phosphoundecaprenol flippase subunit ArnE [arnE]"
definition: >-
  This entry represents ArnE, which is an integral membrane component of the ArnE/ArnF (heterodimer) undecaprenyl-phosphate-alpha-L-Ara4N flippase. The ArnE/ArnF undecaprenyl-phosphate-alpha-L-Ara4N flippase is responsible for transporting undecaprenyl-phosphate-alpha-L-Ara4N from the cytoplasmic face of the inner membrane to the periplasmic face of the inner membrane. ArnE and ArnF are both predicted to be integral membrane proteins with 4 transmembrane helices and belong to the drug/metabolite transporter (DMT) superfamily. Deletion of arnE or arnF results in restoration of polymyxin sensitivity in a polymyxin-resitant pmrAc strain and are defective for transfer of undecaprenyl-phosphate-alpha-L-Ara4N from the cytoplasmic face of the inner membrane to the periplasmic face and for attachment of L-Ara4N to lipid A. Both ArnE and ArnF are required for polymyxin resistance as expression from a plasmid of one cannot replace a deletion of the other.
definition_source: "InterPro:IPR022883 abstract (HAMAP MF_01869 is a member signature)"
