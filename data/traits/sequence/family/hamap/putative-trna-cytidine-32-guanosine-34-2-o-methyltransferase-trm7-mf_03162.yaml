identifier: HAMAP:MF_03162
label: "Putative tRNA (cytidine(32)/guanosine(34)-2'-O)-methyltransferase [TRM7]"
definition: >-
  This entry represents the tRNA (cytidine(32)/guanosine(34)-2'-O)-methyltransferases, including Trm7 from Saccharomyces cerevisiae. Trm7 methylates the 2'-O-ribose of nucleotides at positions 32 and 34 of the tRNA anticodon loop of tRNA(Phe), tRNA(Trp) and tRNA(Leu(UAA)). It requires Trm732 for methylation of the cytidine at position 32 and Rtt10/Trm734 for methylation of the nucleotides at position 34 in substrate tRNAs. This entry also includes FTSJ1 from human. FTSJ1 is a homologue of yeast Trm7 and may play a role in the regulation of translation. Mutations in FTSJ1 cause the mental retardation, X-linked 44 (MRX44), which is a disorder characterised by significantly below average general intellectual functioning associated with impairments in adaptive behaviour and manifested during the developmental period.
definition_source: "InterPro:IPR028590 abstract (HAMAP MF_03162 is a member signature)"
