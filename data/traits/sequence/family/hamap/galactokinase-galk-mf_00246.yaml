identifier: HAMAP:MF_00246
label: "Galactokinase [galK]"
definition: >-
  Galactokinase catalyses the first reaction in the galactose metabolism pathway, the ATP-dependent phosphorylation of galactose, yielding galactose-1-phosphate. Deficiency in this enzyme results in the disease galactosemia, which is responsible for the formation of cataracts in newborn babies, and is possibly responsible for presenile cataracts in adults. In yeast, the GAL3 gene product is required for the GAL4-mediated induction of other enzymes involved in galactose metabolism. The induction of GAL1 production then reinforces this process, increasing the expression of other galactose-inducible genes. GAL3 has been shown to be similar to the GAL1 protein. This entry represents bacterial-type galactokinases.
definition_source: "InterPro:IPR022963 abstract (HAMAP MF_00246 is a member signature)"
