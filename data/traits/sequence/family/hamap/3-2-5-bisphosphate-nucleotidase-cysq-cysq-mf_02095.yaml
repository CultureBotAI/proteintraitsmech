identifier: HAMAP:MF_02095
label: "3'(2'),5'-bisphosphate nucleotidase CysQ [cysQ]"
definition: >-
  This entry represents CysQ, a 3'-nucleotidase that converts adenosine-3',5'-bisphosphate (PAP) to AMP. It may also convert adenosine 3'-phosphate 5'-phosphosulfate (PAPS) to adenosine 5'-phosphosulfate (APS). CysQ contains a conserved sequence motif, D(X)n EE(X)nDP(I/L)D(S/G/A)T(X)nWD(X)11GG, required for metal ion coordination. It has been found to be inhibited by lithium and calcium in vitro and is a main target of lithium toxicity in vivo.
