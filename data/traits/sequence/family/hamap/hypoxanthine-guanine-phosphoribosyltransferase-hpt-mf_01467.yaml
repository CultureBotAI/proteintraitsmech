identifier: HAMAP:MF_01467
label: "Hypoxanthine/guanine phosphoribosyltransferase [hpt]"
definition: >-
  This entry consists of the hypoxanthine/guanine phosphoribosyltransferase (HPRT) and HPRT-like proteins. HPRT catalyses a salvage reaction resulting in the formation of IMP that is energically less costly than de novo synthesis. HPRT-like proteins may catalyse a purine salvage reaction, the substrate is unknown.
