identifier: HAMAP:MF_01023
label: "Histidinol-phosphate aminotransferase [hisC]"
definition: >-
  The histidinol phosphate aminotransferase family consists of class I pyridoxal-5'-phosphate (PLP)-dependent enzymes that catalyze a step of L-histidine biosynthesis. These proteins are highly specific enzymes in the sense that no other aminotransferases are known to be capable of utilizing imidazoleacetol phosphate, with deletions leading to auxotrophy. A subgroup of these enzymes have broader substrate specificity and are capable of using aromatic amino acid substrates in vitro and in vivo
definition_source: "InterPro:IPR005861 abstract (HAMAP MF_01023 is a member signature)"
