identifier: HAMAP:MF_01285
label: "Riboflavin kinase [ribK]"
definition: >-
  Riboflavin is converted into catalytically active cofactors (FAD and FMN) by the actions of riboflavin kinase, which converts it into FMN, and FAD synthetase, which adenylates FMN to FAD. Bacteria utilize a single bifunctional enzyme containing the ATP-dependent riboflavin kinase and the FMN adenylyltransferase domains. In contrast, two individual and structurally distinct enzymes, cytidine triphosphate (CTP)-dependent riboflavin kinase (RibK) and FAD synthetase (RibL), catalyze the last two steps of the pathway in archaea. This entry represents RibK.
definition_source: "InterPro:IPR023470 abstract (HAMAP MF_01285 is a member signature)"
