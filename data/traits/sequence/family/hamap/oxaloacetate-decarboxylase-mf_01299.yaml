identifier: HAMAP:MF_01299
label: "Oxaloacetate decarboxylase"
definition: >-
  This entry describes a class of bacterial oxaloacetate decarboxylases from the PEP mutase/isocitrate lyase superfamily. The enzyme plays a role in the maintenance of cellular concentrations of bicarbonate and pyruvate.
