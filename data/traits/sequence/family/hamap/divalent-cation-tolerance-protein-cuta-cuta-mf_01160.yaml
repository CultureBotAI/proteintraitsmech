identifier: HAMAP:MF_01160
label: "Divalent-cation tolerance protein CutA [cutA]"
definition: >-
  This entry represents CutA, which is involved in resistance toward heavy metals. It binds 1 copper ion per subunit. Similar sequences to CutA are found in several genomes. The metal binding sites are not conserved in many of the family members and their is currently unknown.
