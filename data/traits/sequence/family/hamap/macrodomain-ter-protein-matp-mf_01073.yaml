identifier: HAMAP:MF_01073
label: "Macrodomain Ter protein [matP]"
definition: >-
  This entry contains MatP (YcbG), which is a component of the MatP/MatS site-specific system that organises the Ter macrodomain (MD) in Escherichia coli (strain K12) and related enterobacteria during replication of the chromosome. In E. coli there are 23 matS sequences, located in the Ter region which is centred on dif. The matS consensus is a palindromic sequence 5'-GTGAC[AG][CT]GTCAC, which is the recognition sequence for MatP. MatP binds to the matS sequences; and is critical for Ter MD formation. Inactivation of matP causes severe defects in chromosome segregation and cell division revealing its role as a major organiser of the Ter MD. Many bacteria have circular genomes that are large in comparison to their cellular dimensions; this imposes the necessity for compaction of the chromosome during cellular growth, replication, transcription, and segregation. Compaction of chromosomes results in the formation of structures called nucleoids. Nucleoids can be generated by a number of different processes: they include unrestrained DNA supercoiling, formation of a chromatin-like structure through the interaction of DNA binding proteins, condensation by structural maintenance of chromosomes (SMC)-like proteins, and macromolecular crowding. Chromosome replication and segregation are intimately linked and tightly controlled to ensure that daughter cells each receive a complete copy of the genome. Chromosomes have replication origin (Ori) and termination (Ter) regions that are diametrically opposed. During the process of chromosome replication and cell division the Ori and Ter regions form two macrodomains (MDs), the Ori MD is centred on migS, a 25 bp sequence, that acts as the cis-acting site for the bipolar positioning of oriC. The Ter MD is centred on dif (deletion-induced fi
