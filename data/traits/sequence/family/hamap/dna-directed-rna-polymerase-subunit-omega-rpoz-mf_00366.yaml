identifier: HAMAP:MF_00366
label: "DNA-directed RNA polymerase subunit omega [rpoZ]"
definition: >-
  Bacterial DNA-dependent RNA polymerase (RNAP) has the core composition of α(2)-β-β'-omega, where omega is the smallest of the subunits. The omega subunit is required to promote RNAP assembly by acting like a chaperone to maintain beta' in the correct conformation and to recruit it to the α(2)β subassembly to form a functional core enzyme.
