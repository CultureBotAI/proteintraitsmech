identifier: HAMAP:MF_04021
label: "Small capsomere-interacting protein [SCP]"
definition: >-
  This is a family of herpes-type viral small capsid proteins, including UL48A (small capsomere-interacting protein or SCP) from human cytomegalovirus. By analogy with SCP from human herpesvirus 1, SCP forms a complex with the major capsid protein in the cytoplasm which is translocated to the nucleus. SCP decorates the outer surface of the capsid shell during capsid assembly, forming a layer between the capsid and the tegument.
