identifier: HAMAP:MF_00217
label: "Mevalonate kinase [mvk]"
definition: >-
  Mevalonate kinase (EC:2.7.1.36) is well-characterised among the Eukaryotes, where it plays a role in the synthesis of isopentanyl pyrophosphate, a common intermediate for a number of pathways including cholesterol biosynthesis. It is also involved in mevalonate catabolism. Close homologues are found in the Archaea. A bacterial example is found in the Borrelia burgdorferi (Lyme disease spirochete), but is not necessarily the same biosynthetic enzyme. This entry represents archaeal mevalonate kinases. The function of this enzyme is to catalyse the following reaction: ATP + (R)-mevalonate = ADP + (R)-5-phosphomevalonate
definition_source: "InterPro:IPR022937 abstract (HAMAP MF_00217 is a member signature)"
