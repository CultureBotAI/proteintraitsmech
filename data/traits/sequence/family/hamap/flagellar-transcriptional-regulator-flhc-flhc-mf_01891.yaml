identifier: HAMAP:MF_01891
label: "Flagellar transcriptional regulator FlhC [flhC]"
definition: >-
  This family consists of several bacterial flagellar transcriptional activator (FlhC) proteins. FlhC combines with FlhD to form a regulatory complex in Escherichia coli, this complex has been shown to be a global regulator involved in many cellular processes as well as a flagellar transcriptional activator.
