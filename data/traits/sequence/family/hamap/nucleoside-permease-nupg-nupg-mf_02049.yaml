identifier: HAMAP:MF_02049
label: "Nucleoside permease NupG [nupG]"
definition: >-
  Nucleoside permease NupG is a member of the nucleoside:H+ symporter (NHS) family. NupG can transport a wide range of nucleosides and deoxynucleosides. It can also transport xanthosine, but with a very low affinity.
