identifier: HAMAP:MF_04057
label: "Packaging protein 1 [IVa2]"
definition: >-
  Packaging protein 1 (also known as IVa2) is a component of the packaging machinery which encapsidates the viral DNA into preformed capsids and transcriptional activator of the viral major late promoter (MLP). It binds, along with packaging proteins 2 and 3, to the specific packaging sequence on the left end of viral genomic DNA and displays ATPase activity thereby providing the power stroke of the packaging machinery.
