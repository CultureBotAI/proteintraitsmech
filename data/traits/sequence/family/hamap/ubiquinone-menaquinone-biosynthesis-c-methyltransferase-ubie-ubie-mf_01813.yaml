identifier: HAMAP:MF_01813
label: "Ubiquinone/menaquinone biosynthesis C-methyltransferase UbiE [ubiE]"
definition: >-
  This entry represents a family of methyltransferases involved in the biosynthesis of menaquinone and ubiqinone. Some members such as the UbiE enzyme from E. coli are believed to act in both pathways, while others may act in only the menaquinone pathway. These methyltransferases are members of the UbiE/CoQ family of methyltransferases which also contains ubiquinone methyltransferases and other methyltransferases. Members of this clade include a wide distribution of bacteria and eukaryotes, but no archaea. An outgroup for this clade is provided by the phosphatidylethanolamine methyltransferase (EC:2.1.1.17) from Rhodobacter sphaeroides. Note that a number of non-orthologous genes which are members of InterPro:IPR005493 have been erroneously annotated as MenG methyltransferases.
definition_source: "InterPro:IPR004033 abstract (HAMAP MF_01813 is a member signature)"
