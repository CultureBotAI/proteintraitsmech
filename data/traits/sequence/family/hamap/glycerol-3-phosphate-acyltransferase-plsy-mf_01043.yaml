identifier: HAMAP:MF_01043
label: "Glycerol-3-phosphate acyltransferase [plsY]"
definition: >-
  PlsY is a glycerol-3-phosphate acyltransferase (GPAT) (EC:2.3.1.275) that catalyses the transfer of an acyl group from acyl-ACP to glycerol-3-phosphate to form lysophosphatidic acid (LPA). During this process, PlsY utilises a novel acyl-donor, acyl-phosphate produced by PlsX. In some bacteria, the PlsX/Y system plays a major part at the initial stage of glycerolipid synthesis. However, in E. coli, the other GPAT, PlsB (described in InterPro:IPR028354) is also involved in this process.
definition_source: "InterPro:IPR003811 abstract (HAMAP MF_01043 is a member signature)"
