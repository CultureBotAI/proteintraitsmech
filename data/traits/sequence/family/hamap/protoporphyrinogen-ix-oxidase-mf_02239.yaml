identifier: HAMAP:MF_02239
label: "Protoporphyrinogen IX oxidase"
definition: >-
  This entry includes HemJ ( UniProtKB:P72793 ) from Synechocystis sp. (strain PCC 6803 / Kazusa). It is essential for protoporphyrinogen IX oxidase activity and is functionally coupled with coproporphyrinogen III oxidase.
