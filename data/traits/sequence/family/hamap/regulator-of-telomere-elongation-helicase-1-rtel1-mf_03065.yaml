identifier: HAMAP:MF_03065
label: "Regulator of telomere elongation helicase 1 [RTEL1]"
definition: >-
  Regulator of telomere elongation helicase 1 (Rtel1) is the animal functional analogue of yeast Srs2, which is a DNA helicase and DNA-dependent ATPase involved in DNA repair and checkpoint recovery. Rtel1 is an essential DNA helicase that disassembles a variety of DNA secondary structures to facilitate DNA replication, repair, and recombination processes, and to maintain both telomeric and genomic stability. It is recruited by Trf2 to telomeres in S phase to promote T-Loop unwinding. It is also required for the export and the correct cytoplasmic trafficking of the small nuclear (sn) RNA pre-U2, a component of the major spliceosome complex. Human Rtel1 is implicated in the etiology of Dyskeratosis congenital (DC, is an inherited bone marrow failure and cancer predisposition syndrome). Point mutations in its helicase domains, and truncations which result in loss of its C terminus have been discovered in DC families. It acts as anti-recombinase and antagonises homologous recombination by promoting the disassembly of D loop recombination intermediates in a reaction dependent upon ATP hydrolysis. Rtel1 is also a candidate gene influencing glioma susceptibility.
