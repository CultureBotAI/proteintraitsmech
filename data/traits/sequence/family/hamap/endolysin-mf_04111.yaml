identifier: HAMAP:MF_04111
label: Endolysin
definition: >-
  This family includes endolysin, a bacteriophage T7 protein which has amidase activity and is able to degrade host peptidoglycans. It is important for release of virus particles from the infected bacterial cell and acts together with holin and spanin to bring about cell lysis. Endolysin hydrolyzes the link between N-acetylmuramoyl residues and L-amino acid residues in certain cell-wall glycopeptides. Endolysin also inhibits the viral RNA polymerase and plays an important role in the switch between viral transcription and genome replication.
definition_source: "InterPro:IPR034689 abstract (HAMAP MF_04111 is a member signature)"
