identifier: HAMAP:MF_02085
label: "UTP--glucose-1-phosphate uridylyltransferase [cugP]"
definition: >-
  UDP-glucose pyrophosphorylases catalyze the formation of UDP-glucose from UTP and glucose 1-phosphate. CugP is a UDP-glucose pyrophosphorylase found in cyanobacteria. It has a central role as the substrate supplier for galactolipid synthesis. Galactolipids are major constituents of the photosynthetic thylakoid membrane and important for photosynthetic activity.
