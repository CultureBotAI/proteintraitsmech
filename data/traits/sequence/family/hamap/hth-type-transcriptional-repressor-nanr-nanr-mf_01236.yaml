identifier: HAMAP:MF_01236
label: "HTH-type transcriptional repressor NanR [nanR]"
definition: >-
  The nan operon encodes a group of proteins that are involved in sialic acid utilisation. Expression of the operon appears to be subject to negative control by the transcriptional repressor, NanR. Sialic acid may induce the nan operon by binding to this repressor. NanR possesses an N-terminal DNA binding domain, containing a helix-turn-helix (HTH) motif, and a C-terminal domain that may be involved in ligand binding.
