identifier: HAMAP:MF_01676
label: "Alkyl hydroperoxide reductase AhpD [ahpD]"
definition: >-
  Alkyl hydroperoxide reductase AhpD catalyse the reduction of peroxides to their corresponding alcohols via oxidation of cysteine residues. In these alkylhydroperoxidases, the cysteines are located in a conserved -CXXC- motif located towards the C terminus. In Mycobacterium tuberculosis, two non-homologous alkylhydroperoxidases, AhpD and AhpC, are found in the same operon. This entry represents AhpD, which is a component of alkyl-hydroperoxide reductase participating in defense against ROS and ROS produced by host immune cells.
