identifier: HAMAP:MF_01812
label: "N-acetyltransferase Eis [eis]"
definition: >-
  Eis (enhanced intracellular survival) from Mycobacterium has been identified as a secretory protein that is released into the host cell to modulate inflammatory responses. It is an acetyltransferase of the GCN5-related family of N-acetyltransferases that initiates suppression of host immune responses by acetylation of DUSP16/MKP-7. This family also includes other putative N-acetyltransferases from Actinobacteria as yet uncharacterised.
