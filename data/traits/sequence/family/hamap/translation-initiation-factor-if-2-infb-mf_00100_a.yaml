identifier: HAMAP:MF_00100_A
label: "Translation initiation factor IF-2 [infB]"
definition: >-
  This entry represents the Probable translation initiation factor IF-2 mostly found in archaea (aIF-2). In archaea, at least four initiation factors are required for the initiation of protein biosynthesis: aIF-1, aIF-1A, aIF-2, and aIF-5B. aIF-2 promotes the GTP-dependent binding of the initiator tRNA to the small subunit of the ribosome. This GTPase is a is a heterotrimer formed by three subunits.
