identifier: HAMAP:MF_00846
label: "Ribosome protection protein VmlR [vmlR]"
definition: >-
  Some antibiotics bind to the large ribosomal subunit at the peptidyl-transferase centre (PTC) or adjacent to it, in the ribosomal exit tunnel. Gram-positive bacteria have antibiotic resistance (ARE) ATP-binding cassette (ABC) proteins of the F type (ABCF) that provide them resistance to that kind of antibiotics. These proteins are also found in some Gram-negative bacteria. VmlR is a ribosomal protection protein that confers resistance to lincomycin (Lnc), the streptogramin A (SA) antibiotic virginiamycin M (VgM) and the pleuromutilin antibiotic tiamulin. It is an ABCF protein that binds to the E site of the antibiotic-stalled ribosomes inducing conformational changes in the P-site, and allows the dissociation of the antibiotic from its PTC binding site.
