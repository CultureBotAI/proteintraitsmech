identifier: HAMAP:MF_01610
label: "Probable L-tyrosine/L-aspartate decarboxylase [mfnA]"
definition: >-
  Members of this protein family are the archaeal form of decarboxylases. This entry includes TK1814 from Thermococcus kodakarensis. TK1814 functions as an aspartate 1-decarboxylase (ADC) and may be responsible for beta-alanine biosynthesis.
