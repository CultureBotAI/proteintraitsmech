identifier: HAMAP:MF_02075
label: "Aspartate--tRNA(Asp) ligase [aspS]"
definition: >-
  Aspartyl tRNA synthetase is an alpha2 dimer that belongs to class IIb. Structural analysis combined with mutagenesis and enzymology data on the yeast enzyme point to a tRNA binding process that starts by a recognition event between the tRNA anticodon loop and the synthetase anticodon binding module. This family represents a group of aspartyl-tRNA synthetases from the eukaryotic cytosol, from archaea and from some bacteria. In some species, this enzyme aminoacylates tRNA for both Asp and Asn; Asp-tRNA (asn) is subsequently transamidated to Asn-tRNA (asn).
definition_source: "InterPro:IPR004523 abstract (HAMAP MF_02075 is a member signature)"
