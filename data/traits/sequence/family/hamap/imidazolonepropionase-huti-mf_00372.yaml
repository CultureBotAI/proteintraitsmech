identifier: HAMAP:MF_00372
label: "Imidazolonepropionase [hutI]"
definition: >-
  Imidazolonepropionase catalyses the third step in histidine degradation. It hydrolyses the carbon-nitrogen bonds in 4-imidazolone-5-propionic acid to yield N-formimino-l-glutamic acid. The enzyme contains two domains, a TIM (triose-phosphate isomerase) barrel domain with two insertions and a small β-sandwich domain. It has been conserved from bacteria to eukaryotes. In bacteria, the enzyme is part of histidine utilisation (hut) operon.
