identifier: HAMAP:MF_01494
label: "DEAD-box ATP-dependent RNA helicase CshB [cshB]"
definition: >-
  DEAD-box RNA helicases play important roles in remodelling RNA molecules and in facilitating a variety of RNA-protein interactions. CshB is a DEAD-box RNA helicase involved in cold tolerance, motility, and tolerance to heat, alkali and oxidative stress. It may work in conjunction with the cold shock proteins to ensure proper initiation of transcription at low and optimal temperatures.
