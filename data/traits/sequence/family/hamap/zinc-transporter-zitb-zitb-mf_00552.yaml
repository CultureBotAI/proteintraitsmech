identifier: HAMAP:MF_00552
label: "Zinc transporter ZitB [zitB]"
definition: >-
  This entry is represented by ZitB, which is involved in zinc efflux across the cytoplasmic membrane, thus reducing zinc accumulation in the cytoplasm and rendering bacteria more resistant to zinc. It may contribute to zinc homeostasis at low concentrations of zinc, whereas ZntA is required for growth at more toxic concentrations. ZitB is potentially capable of transporting not only zinc but also cadmium, nickel and copper.
