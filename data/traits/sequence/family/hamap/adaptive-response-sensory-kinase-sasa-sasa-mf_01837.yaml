identifier: HAMAP:MF_01837
label: "Adaptive-response sensory-kinase SasA [sasA]"
definition: >-
  This entry represents the adaptive-response sensory-kinase SasA family, a member of the two-component regulatory system SasA/RpaA involved in genome-wide circadian gene expression. This family of proteins participate in the kaiABC clock protein complex, which constitutes the main circadian regulator in cyanobacteria, via its interaction with kaiC. It is required for robustness of the circadian rhythm of gene expression and involved in clock output. The kaiABC complex has a core comprising a kaiC homohexamer, a kaiB dimer and two kaiA dimers. KaiC enhances the autophosphorylation activity of SasA, which then transfers its phosphate group to RpaA to activate it. Proteins in this entry contain a histidine kinase domain.
definition_source: "InterPro:IPR023527 abstract (HAMAP MF_01837 is a member signature)"
