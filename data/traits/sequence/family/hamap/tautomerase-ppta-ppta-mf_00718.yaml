identifier: HAMAP:MF_00718
label: "Tautomerase PptA [pptA]"
definition: >-
  This entry represents tautomerase PptA (EC:5.3.2), a 4-oxalocrotonate tautomerase homologue found in bacteria such as Escherichia coli (in which it is also known as YdcE). It functions as a homodimer. Tautomerase PptA can use enol isomers of phenylpyruvate, 2-hydroxy-2,4-pentadienoate and (p-hydroxyphenyl)pyruvate as substrates. It is inhibited by (E)-2-fluoro-p-hydroxycinnamate.
