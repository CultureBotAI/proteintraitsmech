identifier: HAMAP:MF_01586
label: "Probable [Fe-S]-dependent transcriptional repressor [feoC]"
definition: >-
  Bacteria commonly utilise a unique type of transporter, called Feo, to specifically acquire the ferrous (Fe2+) form of iron from their environment. Enterobacterial Feo systems are composed of three proteins: FeoA, a small, soluble SH3-domain protein probably located in the cytosol; FeoB, a large protein which likely functions as the Fe2+ permease; and FeoC, a small protein apparently functioning as an [Fe-S]-dependent transcriptional repressor of the feoABC operon. This entry represents the FeoC protein.
definition_source: "InterPro:IPR023732 abstract (HAMAP MF_01586 is a member signature)"
