identifier: HAMAP:MF_02241
label: "Phosphatidylinositol phosphate synthase"
definition: >-
  This group of phosphotransferases are mainly from Actinobacteria, including PgsA1 from Mycobacterium. PgsA1 catalyses the conjugation of the 1'-hydroxyl group of D-myo-inositol-3-phosphate (also named L-myo-inositol-1-phosphate) with a lipid tail of cytidine diphosphate diacylglycerol (CDP-DAG), forming phosphatidylinositol phosphate (PIP) and CMP.
