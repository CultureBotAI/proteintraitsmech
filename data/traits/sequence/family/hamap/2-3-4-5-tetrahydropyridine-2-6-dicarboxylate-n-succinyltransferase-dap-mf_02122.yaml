identifier: HAMAP:MF_02122
label: "2,3,4,5-tetrahydropyridine-2,6-dicarboxylate N-succinyltransferase [dapD]"
definition: >-
  This entry represents 2,3,4,5-tetrahydropyridine-2,6-dicarboxylate N-succinyltransferases that belong to the type 2 tetrahydrodipicolinate N-succinyltransferase family. This enzyme catalyses the conversion of the cyclic tetrahydrodipicolinate (THDP) into the acyclic N-succinyl-L-2-amino-6-oxopimelate using succinyl-CoA.
