identifier: HAMAP:MF_04055
label: "DNA polymerase [POL]"
definition: >-
  This entry represents a group of DNA-directed DNA polymerases from Adenovirus. They belong to the distinct subclass of the polalpha family of DNA pols that employs the precursor terminal protein (pTP) as primer.
