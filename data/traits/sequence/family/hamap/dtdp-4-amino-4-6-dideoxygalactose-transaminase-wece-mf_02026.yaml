identifier: HAMAP:MF_02026
label: "dTDP-4-amino-4,6-dideoxygalactose transaminase [wecE]"
definition: >-
  This entry represents dTDP-4-amino-4,6-dideoxygalactose transaminase WecE (also known as RffA) from Enterobacteriaceae. WecE is involved in the Enterobacterial common antigen (ECA) biosynthesis, which is part of bacterial outer membrane biogenesis. ECA is a specific surface antigen (polysaccharide) shared by all members of the Enterobacteriaceae and is restricted to this family. It catalyses the synthesis of dTDP-4-amino-4,6-dideoxy-D-galactose (dTDP-Fuc4N) from dTDP-4-keto-6-deoxy-D-glucose (dTDP-D-Glc4O) and L-glutamate.
