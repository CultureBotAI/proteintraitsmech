identifier: HAMAP:MF_01135
label: "Acetyl-CoA decarbonylase/synthase complex subunit delta [cdhD]"
definition: >-
  This is the small subunit of the ACDS complex that catalyses the reversible cleavage of acetyl-CoA, allowing growth on acetate as sole source of carbon and energy. ACDS complex is a heterodimer which catalyses the reaction CO + H2O + Acceptor = CO2 + Reduced acceptor and is involved in the synthesis of acetyl-CoA from CO2 and H2. This subunit probably maintains the overall quaternary structure of the ACDS complex.
