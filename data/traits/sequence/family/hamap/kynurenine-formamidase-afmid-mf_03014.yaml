identifier: HAMAP:MF_03014
label: "Kynurenine formamidase [AFMID]"
definition: >-
  Kynurenine formamidase ( ) catalyses the hydrolysis of N-formyl-L-kynurenine to L-kynurenine, the second step in the kynurenine pathway of tryptophan degradation. It is required for elimination of toxic metabolites.
