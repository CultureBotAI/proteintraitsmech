identifier: HAMAP:MF_00061
label: "Putative 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase [ispE]"
definition: >-
  4-diphosphocytidyl-2C-methyl-D-erythritol kinase is a member of the family of GHMP kinases that were previously designated as conserved hypothetical protein YchB or as isopentenyl monophosphate kinase. In Solanum lycopersicum (Tomato) (Lycopersicon esculentum) and Escherichia coli the protein has been indentified as 4-diphosphocytidyl-2C-methyl-D-erythritol kinase, an enzyme of the deoxyxylulose phosphate pathway of terpenoid biosynthesis. This enzyme is involved in the non-mevalonate pathway for isoprenoid biosynthesis and in it is essential for for chloroplast development.
definition_source: "InterPro:IPR004424 abstract (HAMAP MF_00061 is a member signature)"
