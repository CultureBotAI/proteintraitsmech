identifier: HAMAP:MF_00136
label: "S-adenosylmethionine synthase [mat]"
definition: >-
  A highly diverged class of S-adenosylmethionine synthetases have been identified in the archaea. S-adenosylmethionine is the primary alkylating agent in all known organisms. ATP:L-methionine S-adenosyltransferase (MAT) catalyses the only known biosynthetic route to this central metabolite. Although the amino acid sequence of MAT is strongly conserved among bacteria and eukarya (see InterPro:IPR002133) no homologues had been recognised in the completed genome sequences of any archaea. The identification of a second major class of MAT emphasises the long evolutionary history of the archaeal lineage and the structural diversity found even in crucial metabolic enzymes. Three bacterial genomes encode both the archaeal and eukaryotic/bacterial types of MAT.
definition_source: "InterPro:IPR002795 abstract (HAMAP MF_00136 is a member signature)"
