identifier: HAMAP:MF_02124
label: "Alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase [glgE]"
definition: >-
  Alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase (GlgE) uses maltose 1-phosphate (M1P) as the sugar donor to elongate linear or branched alpha-(1->4)-glucans. It is involved in a branched alpha-glucan biosynthetic pathway from trehalose, together with TreS, Pep2 and GlgB.
