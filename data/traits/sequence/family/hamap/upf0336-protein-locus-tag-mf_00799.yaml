identifier: HAMAP:MF_00799
label: "UPF0336 protein <locus_tag>"
definition: >-
  This protein family includes HadA from Mycobacterium tuberculosis (Rv0636, UniProtKB:P9WFK1 ), HadA from Mycolicibacterium smegmatis (MSMEG_1340, UniProtKB:A0QS40 ) and other bacterial proteins from the UPF0336 family. HadA is a component of the beta-hydroxyacyl-ACP dehydratase HadAB complex. It adopts a hotdog fold with a central β-sheet, which is twisted to form a concave cavity at the centre where a long α-helix is embedded, and some additional α-helices.
