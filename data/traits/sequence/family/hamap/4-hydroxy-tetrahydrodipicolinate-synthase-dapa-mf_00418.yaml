identifier: HAMAP:MF_00418
label: "4-hydroxy-tetrahydrodipicolinate synthase [dapA]"
definition: >-
  4-hydroxy-tetrahydrodipicolinate synthase dapA is a homotetrameric enzyme of lysine biosynthesis. It catalyses the condensation of (S)-aspartate-beta-semialdehyde [(S)-ASA] and pyruvate to 4-hydroxy-tetrahydrodipicolinate (HTPA). E. coli has several paralogs closely related to dihydrodipicoline synthase, as well as the more distant N-acetylneuraminate lyase.
