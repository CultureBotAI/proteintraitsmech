identifier: HAMAP:MF_01214
label: "Transcriptional regulator GfcR [gfcR]"
definition: >-
  This entry represents Transcriptional regulator GfcR and related proteins from archaea. They share protein sequence similarity to the PyrE protein (Orotate phosphoribosyltransferase) from Salmonella typhimurium. GfcR is a DNA-binding transcriptional regulator that functions as a regulator of central sugar catabolic pathways. It acts by binding directly to the promoter region of the regulated genes. In the presence of D-glucose, activates expression of the gene encoding the gluconate dehydratase (gad), which is involved in D-glucose catabolism while In the presence of D-fructose, activates expression of the genes encoding the PTS system EIIC component (ptfC) and the fructose-1,6-bisphosphate aldolase (fba), which are involved in D-fructose uptake and degradation
definition_source: "InterPro:IPR022854 abstract (HAMAP MF_01214 is a member signature)"
