identifier: HAMAP:MF_00747
label: "Isocitrate dehydrogenase kinase/phosphatase [aceK]"
definition: >-
  This family consists of several bacterial isocitrate dehydrogenase kinase/phosphatase (ICDH kinase/phosphatase) proteins. The enzyme has no activating compound but is specific for its substrate. It is a bifunctional enzyme that catalyses the reversible phosphorylation of isocitrate dehydrogenase (IDH, ) on a seryl residue. It consequently belongs to the serine/threonine protein kinase family, and it acts in the Krebs cycle. The catalytic activities of ICDH kinase/phosphatase constitute a moiety conserved cycle, require ATP, and exhibit 'zero-order ultrasensitivity'.
definition_source: "InterPro:IPR010452 abstract (HAMAP MF_00747 is a member signature)"
