identifier: HAMAP:MF_03101
label: "Deoxyhypusine hydroxylase [DOHH]"
definition: >-
  Deoxyhypusine hydroxylase ( ) catalyses the hydroxylation of the N(6)-(4-aminobutyl)-L-lysine intermediate to form hypusine, an essential post-translational modification only found in mature eIF-5A factor. In Drosophila melanogaster, it is essential for organismal viability and plays a role in a wide number of important processes such as cell growth and proliferation, and regulates induction of autophagy and protein synthesis.
