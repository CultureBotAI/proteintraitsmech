identifier: HAMAP:MF_00699
label: "Probable Brix domain-containing ribosomal biogenesis protein"
definition: >-
  This entry represents archaeal sequences containing a single Brix domain. The sequences have two unique characteristics: (1) the Brix domain charged regions are totally absent at the N-terminal and are reduced in number to about 10 residues at the C-terminal; and (2) the C-terminal part of the Brix domain itself is minimal. Biological data for some proteins in this family suggest a role in ribosome biogenesis and rRNA binding.
definition_source: "InterPro:IPR023548 abstract (HAMAP MF_00699 is a member signature)"
