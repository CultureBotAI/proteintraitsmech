identifier: HAMAP:MF_01938
label: "2-carboxy-1,4-naphthoquinone phytyltransferase [menA]"
definition: >-
  This entry represents 2-carboxy-1,4-naphthoquinone phytyltransferase from plants and cyanobacteria. It catalyses the conversion of 1,4-dihydroxy-2-naphthoate (DHNA) to demethylphylloquinone.
