identifier: HAMAP:MF_01555
label: "Galactose-6-phosphate isomerase subunit LacA [lacA]"
definition: >-
  Galactose-6-phosphate isomerase ( ) is a heteromultimeric protein consisting of subunits LacA and LacB, and catalyses the conversion of D-galactose 6-phosphate to D-tagatose and 6-phosphate in the tagatose 6-phosphate pathway of lactose catabolism. Galactose-6-phosphate isomerase is induced by galactose or lactose. This entry represents the LacA subunit.
