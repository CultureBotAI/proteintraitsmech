identifier: HAMAP:MF_02210
label: "[Ribosomal protein bS18]-alanine N-acetyltransferase [rimI]"
definition: >-
  This entry represents RimI, a GCN5-related N-acetyltransferase (GNAT) also known as [Ribosomal protein bS18]-alanine N-acetyltransferase which catalyses the acetylation of the N-terminal alanine of ribosomal protein bS18. RimI can also acetylate an N-epsilon-lysine on different proteins which constitutes one of the most abundant and important post-translational modifications. This suggests that RimI has N-alpha-amino acid and N-epsilon-lysine acetylation activity, but the substrate specificity of this enzyme is still unclear.
definition_source: "InterPro:IPR043690 abstract (HAMAP MF_02210 is a member signature)"
