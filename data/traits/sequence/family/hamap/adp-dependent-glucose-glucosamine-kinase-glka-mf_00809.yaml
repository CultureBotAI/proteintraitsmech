identifier: HAMAP:MF_00809
label: "ADP-dependent glucose/glucosamine kinase [glkA]"
definition: >-
  This entry comprises ADP-dependent glucokinases from hyperthermophilic archaea. The enzyme catalyses the phosphorylation of D-glucose to D-glucose 6-phosphate and glucosamine to glucosamine 6-phosphate using ADP as the phosphate donor.
