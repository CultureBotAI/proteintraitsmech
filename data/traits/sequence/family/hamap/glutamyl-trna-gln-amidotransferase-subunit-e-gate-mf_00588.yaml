identifier: HAMAP:MF_00588
label: "Glutamyl-tRNA(Gln) amidotransferase subunit E [gatE]"
definition: >-
  Glutamyl-tRNA(Gln) amidotransferase, subunit E (GatE) is found only in the Archaea. It is part of a heterodimer, with GatD (InterPro:IPR011878), that acts as an amidotransferase on misacylated Glu-tRNA(Gln) to produce Gln-tRNA(Gln). The reaction takes place in the presence of glutamine and ATP through an activated gamma-phospho-Glu-tRNA(Gln). The GatDE system is specific for glutamate and does not act on aspartate. This function is carried out in bacteria by the GatABC system, which acts both on Asp-tRNA(Asn) and Glu-tRNA(Gln). GatABC orthologues also exist in some archaea, where it coexist with GatDE (GatE being paralogous to GatB); while other archaea only posses GatED and use an asparaginyl-tRNA synthetase to produce Asn-tRNA by direct acylation of the tRNA. The crystal structure of GatED showed tRNA(Gln) recognition by indirect readout based on shape complementarity.
definition_source: "InterPro:IPR004414 abstract (HAMAP MF_00588 is a member signature)"
