identifier: HAMAP:MF_00681
label: "(5-formylfuran-3-yl)methyl phosphate synthase [mfnB]"
definition: >-
  This entry represents the (5-formylfuran-3-yl)methyl phosphate synthase (also known as 4-HFC-P synthase or MfnB), which has a classical TIM-barrel structure whose biological unit is a homohexamer. It is involved in the production of methanofuran. MfnB from Methanocaldococcus jannaschii catalyzed at least 10 separate chemical reactions in converting two molecules of glyceraldehyde-3-P (GA-3-P) to 4-(hydroxymethyl)-2-furancarboxaldehyde-P (4-HFC-P), the first discrete intermediate in the biosynthetic pathway to the furan moiety of the coenzyme methanofuran.
definition_source: "InterPro:IPR035081 abstract (HAMAP MF_00681 is a member signature)"
