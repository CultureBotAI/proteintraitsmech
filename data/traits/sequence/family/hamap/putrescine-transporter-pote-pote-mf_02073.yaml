identifier: HAMAP:MF_02073
label: "Putrescine transporter PotE [potE]"
definition: >-
  Members of this protein family are putrescine-ornithine antiporters. They work together with an enzyme that decarboxylates ornithine to putrescine. This two-gene system has the net effect of removing a protein from the cytosol, providing transient resistance to acid conditions. They can function not only as a putrescine-ornithine antiporters to excrete putrescine but also as a putrescine uptake proteins.
