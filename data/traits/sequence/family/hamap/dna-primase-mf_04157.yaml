identifier: HAMAP:MF_04157
label: "DNA primase"
definition: >-
  This family includes the DNA primase form bacteriophage T4, which synthesizes short RNA primers on the lagging strand that the polymerase elongates using dNTPs. It recognises two trinucleotide sequences 5'-GTT-3' and 5'-GCT-3' in vitro, but uses only the first as the priming site in vivo.
