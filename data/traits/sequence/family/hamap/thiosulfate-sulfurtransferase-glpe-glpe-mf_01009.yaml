identifier: HAMAP:MF_01009
label: "Thiosulfate sulfurtransferase GlpE [glpE]"
definition: >-
  This entry represents the GlpE cytoplasmic bacterial family of rhodanese thiosulphate sulphurtransferases. They are responsible for the transfer of sulphur from thiosulphate to thiophilic acceptors. The related periplasmic thiosulphate sulphurtransferases, PspE, are responsible for a much greater proportion of rhodanese activity.
