identifier: HAMAP:MF_01462
label: "Cobalt transport protein CbiM [cbiM]"
definition: >-
  Cobalamin (vitamin B12) is a structurally complex cofactor, consisting of a modified tetrapyrrole with a centrally chelated cobalt. Cobalamin is usually found in one of two biologically active forms: methylcobalamin and adocobalamin. Most prokaryotes, as well as animals, have cobalamin-dependent enzymes, whereas plants and fungi do not appear to use it. In bacteria and archaea, these include methionine synthase, ribonucleotide reductase, glutamate and methylmalonyl-CoA mutases, ethanolamine ammonia lyase, and diol dehydratase. In mammals, cobalamin is obtained through the diet, and is required for methionine synthase and methylmalonyl-CoA mutase. This entry represents the integral membrane protein CbiM, which forms part of the energy-coupling factor (ECF) transporter complex CbiMNOQ that is involved in cobalt import, and plays a role in the cobalamin synthesis pathway.
