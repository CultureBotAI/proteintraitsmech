identifier: HAMAP:MF_01099
label: "Tetrahydromethanopterin S-methyltransferase subunit F [mtrF]"
definition: >-
  This group represents a tetrahydromethanopterin S-methyltransferase, subunit F which forms part of a complex that catalyzes the formation of methyl-coenzyme M and tetrahydromethanopterin from coenzyme M and methyl-tetrahydromethanopterin. This is an energy-conserving, sodium-ion translocating step. The complex is composed of 8 subunits; mtrA, mtrB, mtrC, mtrD, mtrE, mtrF, mtrG and mtrH and plays a role in methanogenesis from carbon dioxide.
definition_source: "InterPro:IPR011307 abstract (HAMAP MF_01099 is a member signature)"
