identifier: HAMAP:MF_01698
label: "Mycothiol acetyltransferase [mshD]"
definition: >-
  Low-molecular weight thiols play an essential role in the metabolism of organsism as coenzymes and cofactors that facilitate important biochemical processes in conjunction with proteins. The predominant low-molecular weight thiol in the actinomycetes is mycothiol, which is involved in the maintenance of cellualar redox state, detoxification of electrophiles and resistance to antimicrobials. The pathway of mycothiol biosynthesis is therefore a potential target for the development of new drugs to treat pathogenic actinomycetes such as Mycobacterium tuberculosis. This entry represents the MshD protein catalysing the final step of mycothiol biosynthesis, the acetylation of the cysteinyl amine in cysteine-glucosamine-inositol (Cys-GlcN-Ins). MshD is a monomeric enzyme consisting of two tandemly-repeated domains which each adopt the GCN5-related N-acetyltransferase (GNAT) fold.
definition_source: "InterPro:IPR017813 abstract (HAMAP MF_01698 is a member signature)"
