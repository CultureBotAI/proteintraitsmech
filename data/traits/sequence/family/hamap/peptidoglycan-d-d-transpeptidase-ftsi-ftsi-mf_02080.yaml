identifier: HAMAP:MF_02080
label: "Peptidoglycan D,D-transpeptidase FtsI [ftsI]"
definition: >-
  In addition to the cytoplasmic proteins FtsZ and FtsA, a number of integral membrane proteins are required for cell division. Among these, FtsI, also called penicillin-binding protein 3 (PBP3), is involved in septum formation. FtsI is responsible for the synthesis of septal peptidoglycan and is also required for FtsN localization to the septum.
