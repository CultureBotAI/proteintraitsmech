identifier: HAMAP:MF_01629
label: "Pyridoxine/pyridoxamine 5'-phosphate oxidase [pdxH]"
definition: >-
  Pyridoxamine 5'-phosphate oxidase (EC:1.4.3.5) is an enzyme that is involved in the de novo synthesis of pyridoxine (vitamin B6) and pyridoxal phosphate. It oxidizes pyridoxamine-5-P (PMP) and pyridoxine-5-P (PNP) to pyridoxal-5-P. The enzyme requires the presence of flavin mononucleotide (FMN) as a cofactor, although there is some evidence that coenzyme F420 may perform this role in some species. The sequences of the enzyme from bacterial (genes pdxH or fprA) and fungal (gene PDX3) sources show that this protein has been highly conserved throughout evolution. PdxH is evolutionary related to one of the enzymes in the phenazine biosynthesis protein pathway, phzD (also known as phzG).
