identifier: HAMAP:MF_01438
label: "DNA integrity scanning protein DisA [disA]"
definition: >-
  DNA integrity scanning protein (DisA) participates in a DNA-damage check-point that is active prior to asymmetric division when DNA is damaged. DisA forms globular foci that rapidly scan along the chromosomes during sporulation, searching for lesions. When a lesion is present, disA pauses at the lesion site. This triggers a cellular response that culminates in a temporary block in sporulation initiation.
