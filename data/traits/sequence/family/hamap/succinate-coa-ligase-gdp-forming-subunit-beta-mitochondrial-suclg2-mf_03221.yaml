identifier: HAMAP:MF_03221
label: "Succinate--CoA ligase [GDP-forming] subunit beta, mitochondrial [SUCLG2]"
definition: >-
  This entry includes the beta subunit of the mitochondrial, GTP-forming succinate--CoA ligase (SUCLG; EC:6.2.1.4) from eukaryotes. The ligase functions in the citric acid cycle (TCA), and is a heterodimer of an alpha and beta subunit. It couples the hydrolysis of succinyl-CoA to the synthesis of GTP which is the only substrate-level phosphorylation step in the TCA. The beta subunit provides nucleotide specificity of the enzyme and binds the substrate succinate, while the binding sites for coenzyme A and phosphate are found in the alpha subunit. ATP-forming succinate--CoA ligase has the same alpha subunit but a different beta subunit.
definition_source: "InterPro:IPR034722 abstract (HAMAP MF_03221 is a member signature)"
