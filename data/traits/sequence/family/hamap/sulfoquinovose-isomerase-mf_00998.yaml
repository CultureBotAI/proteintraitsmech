identifier: HAMAP:MF_00998
label: "Sulfoquinovose isomerase"
definition: >-
  Escherichia coli and other Enterobacteria can perform sulphoglycolysis in addition to standard glycolysis. In this pathway, sulphoquinovose (SQ) -a sulfonic acid derivative of glucose- is used as source of carbon and energy. Sulfoquinovose isomerase is an enzyme of the sulfoquinovose (SQ) degradative pathway. It catalyses the isomerisation of SQ to 6-deoxy-6-sulfo-D-fructose (SF).
