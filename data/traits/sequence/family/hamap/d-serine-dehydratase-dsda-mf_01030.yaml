identifier: HAMAP:MF_01030
label: "D-serine dehydratase [dsdA]"
definition: >-
  This family consists of D-serine ammonia-lyases, pyridoxal-phosphate enzymes that convert D-serine to pyruvate and NH3. These enzyme are also called D-serine dehydratase and D-serine deaminase and was previously designated EC:4.2.1.14. It is homologous to an enzyme that acts on threonine and may itself act weakly on threonine.
