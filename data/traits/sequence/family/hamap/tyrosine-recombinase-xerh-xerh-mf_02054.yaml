identifier: HAMAP:MF_02054
label: "Tyrosine recombinase XerH [xerH]"
definition: >-
  Bacteria with circular chromosomes generally contain site-specific tyrosine Xer recombinases that act at cognate dif sites near where replication terminates and resolve chromosome dimers to free monomers. Helicobacter pylori, Campylobacter and other members of H. pylori's epsilon subgroup of Gram-negative proteobacteria seem to contain just a single Xer recombinase, XerH. XerH, FtsK and an intact difH sequence are required for site-specific recombination at difH sites in H. pylori.
definition_source: "InterPro:IPR033683 abstract (HAMAP MF_02054 is a member signature)"
