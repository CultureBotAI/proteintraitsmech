identifier: HAMAP:MF_00004
label: "Adenine phosphoribosyltransferase [apt]"
definition: >-
  Adenine phosphoribosyltransferase (APRTase, EC:2.4.2.7) is a widely distributed enzyme, and its deficiency in humans causes the accumulation of 2,8-dihydroxyadenine. It is the sole catalyst for adenine recycling in most eukaryotes. AMP + diphosphate = adenine + 5-phospho-alpha-D-ribose 1-diphosphate
