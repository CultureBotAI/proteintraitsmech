identifier: HAMAP:MF_00393
label: "Glycerol-3-phosphate acyltransferase [plsB]"
definition: >-
  This entry represents glycerol-3-phosphate acyltransferase (GPAT, also known as glycerol-3-phosphate O-acyltransferase) ( EC:2.3.1.15 ), which is involved in CDP-diacylglycerol biosynthesis. This entry includes PlsB from E-coli. In many bacteria, PlsB is not found, and appears to be replaced by a two enzyme system for 1-acyl-glycerol-3-phosphate biosynthesis, the PlsX/Y system InterPro:IPR003811. In humans, there are two isoforms of GPAT, one located in the mitochondrial outer membrane and the other in the endoplasmic reticulum. This entry includes the mitochondrial isoform, GPAT1.
definition_source: "InterPro:IPR028354 abstract (HAMAP MF_00393 is a member signature)"
