identifier: HAMAP:MF_01021
label: "Phosphoribosyl-AMP cyclohydrolase [hisI]"
definition: >-
  This entry represents phosphoribosyl-AMP cyclohydrolase (PRA-CH, ) which catalyses hydrolysis of phosphoribosyl-AMP, the third step in the histidine biosynthetic pathway. It also includes a number of histidine biosynthesis bifunctional proteins.
