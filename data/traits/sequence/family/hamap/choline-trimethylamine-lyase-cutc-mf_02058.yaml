identifier: HAMAP:MF_02058
label: "Choline trimethylamine-lyase [cutC]"
definition: >-
  Members of this family, homologues to pyruvate formate-lyases and benzylsuccinate synthases, are glycine radical enzymes that appear to act as choline TMA-lyase, that is, to perform a C-N bond cleavage turning choline into trimethylamine (TMA) plus acetaldehyde. The gene symbol is cutC, for choline utilisation. The activase, CutD, is a radical SAM enzyme.
definition_source: "InterPro:IPR030897 abstract (HAMAP MF_02058 is a member signature)"
