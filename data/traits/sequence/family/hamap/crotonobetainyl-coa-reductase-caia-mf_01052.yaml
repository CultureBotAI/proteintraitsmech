identifier: HAMAP:MF_01052
label: "Crotonobetainyl-CoA reductase [caiA]"
definition: >-
  The CaiA protein catalyses the irreversible reduction of crotonobetainyl-CoA to gamma-butyrobetainyl-CoA. Many enterobacteria are able to convert carnitine, via crotonobetaine, to gamma-butyrobetaine in the presence of carbon and nitrogen sources under anaerobic conditions. In Escherichia coli the enzymes involved in this pathway are encoded by the caiTABCDE operon. The adjacent but divergent fixABCD operon also appears to be necessary for carnintine meatbolism. The Fix proteins are homologous to proteins found in known electron transport pathways.
