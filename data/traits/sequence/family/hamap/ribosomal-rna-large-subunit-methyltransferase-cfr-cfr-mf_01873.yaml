identifier: HAMAP:MF_01873
label: "Ribosomal RNA large subunit methyltransferase Cfr [cfr]"
definition: >-
  This entry represents the Cfr subfamily of RlmN methyltransferases. Ribosomal RNA large subunit methyltransferase Cfr specifically methylates position 8 of adenine 2503 in 23S rRNA. It can also methylate position 2 of A2503 after the primary methylation is complete, to form 2,8-dimethyladenosine. Cfr confers antibiotic resistance in bacteria. The antibiotic resistance is provided by methylation at the 8 position and is independent of methylation at the 2 position of A2503.
definition_source: "InterPro:IPR022881 abstract (HAMAP MF_01873 is a member signature)"
