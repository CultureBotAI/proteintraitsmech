identifier: HAMAP:MF_02041
label: "tRNA-dihydrouridine(20/20a) synthase [dusA]"
definition: >-
  Dihydrouridine (D) is a highly conserved modified base found in tRNAs from all domains of life. D is formed by reduction of the carbon-carbon double bond at positions 5 and 6 of the uridine base by dihydrouridine synthases (Dus), and is mostly found in the D-loop of tRNAs for which it is named. This entry represents DusA (also known as tRNA-dihydrouridine(20/20a) synthase), which specifically modifies U20 and U20a in tRNAs.
