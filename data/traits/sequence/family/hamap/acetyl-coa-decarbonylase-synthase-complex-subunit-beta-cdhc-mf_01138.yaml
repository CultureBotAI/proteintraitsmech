identifier: HAMAP:MF_01138
label: "Acetyl-CoA decarbonylase/synthase complex subunit beta [cdhC]"
definition: >-
  The carbon monoxide dehydrogenase alpha subunit (EC:1.2.7.4) catalyses the interconversion of CO and CO2 and the synthesis of acteyl-coA from the methylated corrinoid/iron sulphur protein, CO and CoA. The ACDS complex is made up of alpha, epsilon, beta, gamma and delta chains with a probable stoichiometry of (alpha(2)epsilon (2))(4)-beta(8)-(gamma(1)delta(1)). This entry represents part of the complex that catalyses the reversible cleavage of acetyl-CoA, allowing growth on acetate as sole source of carbon and energy in archaea. Acetyl-CoA + [acetyl-CoAdecarbonylase/synthase complex beta subunit] = CoA + acetyl-[acetyl-CoA decarbonylase/synthase complex beta subunit].
