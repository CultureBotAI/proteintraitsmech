identifier: HAMAP:MF_00440
label: "Transcriptional repressor NrdR [nrdR]"
definition: >-
  Ribonucleotide reductases (RNRs) are essential enzymes which catalyse the reduction of ribonucleotides to their respective deoxyribonucleotides, thus providing the precursors necessary for DNA synthesis. Proteins in this entry are orthologues of the novel transcriptional regulator NrdR (UniProtKB:O86848) from Streptomyces coelicolor. This protein negatively regulates the expression of the RNR genes in this organism. NrdR, like all proteins in this entry, contains an ATP-cone domain which may regulate DNA-binding activity by sensing deoxyribonucleotides, though since this domain resembles the allosteric effector region of some RNRs it has also been suggested that it may allow NrdR to directly modulate the activity of some reductases, in addition to its function as a transcriptional regulator. NrdR-type proteins have been detected in a large number of bacterial genomes. They are encoded only once in any particular genome and are usually clustered near RNR genes or genes involved in chromosome replication. Currently, only a single archaeon Natronomonas pharaonis (strain DSM 2160/ATCC 35678) has been shown to encode one of these proteins.
definition_source: "InterPro:IPR003796 abstract (HAMAP MF_00440 is a member signature)"
