identifier: HAMAP:MF_02086
label: "4-hydroxythreonine-4-phosphate dehydrogenase [pdxA]"
definition: >-
  PdxA is an NAD+-dependent 4-hydroxythreonine 4-phosphate dehydrogenase (EC:1.1.1.262) active in pyridoxal phosphate biosynthesis. This family consists of putative 4-hydroxy-L-threonine phosphate dehydrogenases from Epsilonproteobacteria. PdxA from Campylobacter jejuni has been shown to play an important role in the PLP (vitamin B6, pyridoxal-5'-phosphate) dependent regulation of flagellar motility, thereby altering host colonization.
