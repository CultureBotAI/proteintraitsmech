identifier: HAMAP:MF_01981
label: "ATP-dependent 6-phosphofructokinase [pfkA]"
definition: >-
  Phosphofructokinase (PFK) catalyses the phosphorylation of fructose-6-phosphate to fructose-1,6-biphosphate, which then enters the Embden-Meyerhof pathway. PFK is a key regulatory enzyme in glycolysis. This family consists of a group of plant and bacterial pyrophosphate-dependent phosphofructokinases related to TP0108 from Treponema. The bacterial versions are non-allosteric dimers, while the plant versions are allosteric heterotetramers. They belong to the PFK domain superfamily of proteins, which also includes prokaryotic (InterPro:IPR012003) and eukaryotic ATP-dependent PFKs (InterPro:IPR009161). The membership of this group largely resembles group B1 PFKs.
definition_source: "InterPro:IPR012004 abstract (HAMAP MF_01981 is a member signature)"
