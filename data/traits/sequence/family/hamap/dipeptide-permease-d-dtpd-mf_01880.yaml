identifier: HAMAP:MF_01880
label: "Dipeptide permease D [dtpD]"
definition: >-
  This entry represents a family of probable proton-dependent permeases that transport dipeptides. The transport of peptides into cells is a well-documented biological phenomenon which is accomplished by specific, energy-dependent transporters found in a number of organisms as diverse as bacteria and humans. The amino acid/peptide transporter family of proteins is distinct from the ABC-type peptide transporters and was uncovered by sequence analysis of a number of recently discovered peptide transport proteins. This family consists of bacterial proton-dependent oligopeptide transporters, although they are found in yeast, plants and animals. They function by proton symport in a 1:1 stoichiometry, which is variable in different species. Structurally, these transporters present a conserved architecture consisting of 14 transmembrane α-helices with N-terminal and C-terminal six-helix bundles connected by two transmembrane α-helices (HA and HB).
definition_source: "InterPro:IPR023777 abstract (HAMAP MF_01880 is a member signature)"
