identifier: HAMAP:MF_00981
label: "Transcriptional regulatory protein RcsB [rcsB]"
definition: >-
  RcsB, together with RcsC and RcsD, is a component of the Rcs signaling system. RcsC functions as a membrane-associated protein kinase that phosphorylates RcsD in response to environmental signals. The phosphoryl group is then transferred to the response regulator RcsB, which binds to regulatory DNA regions. RcsB can function as a homodimer or form a heterodimer with the auxiliary activator RcsA. The system regulates expression of numerous genes, including genes involved in colanic acid capsule synthesis, biofilm formation, and growth. It is also involved, with GadE, in controlling glutamate-dependent acid resistance and, with BglJ, in derepression of the cryptic bgl operon.
