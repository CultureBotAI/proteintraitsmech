identifier: HAMAP:MF_00592
label: "Deoxyribose-phosphate aldolase [deoC]"
definition: >-
  Deoxyribose-phosphate aldolase is a widely distributed enzyme, which catalyses the following reversible reaction: 2-deoxy-D-ribose 5-phosphate = D-glyceraldehyde 3-phosphate + acetaldehyde While the physiological role of this enzyme remains unknown in eukaryotes, in prokaroytes it is thought to function in the catabolism of deoxyribonucleotides. In all studied structures, the deoxyribose-phophate aldolase subunits adopt the classical eight-bladed TIM barrel fold. The oligomerisation state of the enzyme appears to depend on the living temperature of the organism - the Escherichia coli enzyme (UniProtKB:P0A6L0) is a homodimer, while the enzymes from the thermophilic microorganisms Thermus thermophilus and Aeropyrum pernix (UniProtKB:Q9Y948) are homotetramers. The degree of oligomerisation does not, however, appear to affect catalysis. This entry represents deoxyribose-phosphate aldolase from Proteobacteria.
definition_source: "InterPro:IPR023649 abstract (HAMAP MF_00592 is a member signature)"
