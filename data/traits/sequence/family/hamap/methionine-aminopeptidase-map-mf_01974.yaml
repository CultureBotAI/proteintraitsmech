identifier: HAMAP:MF_01974
label: "Methionine aminopeptidase [map]"
definition: >-
  This group of metallopeptidases belong to MEROPS peptidase family M24 (clan MG), subfamily M24A. Methionine aminopeptidase ( ) (MAP) catalyses the hydrolytic cleavage of the N-terminal methionine from newly synthesised polypeptides if the penultimate amino acid is small, with different tolerance to Val and Thr at this position. All MAP studied to date are monomeric proteins that require cobalt ions for activity. Two subfamilies of MAP enzymes are known to exist. While being evolutionary related, they only share a limited amount of sequence similarity, mostly clustered around the residues shown to be involved in cobalt-binding in Escherichia coli MAP. Subfamily 1 consists of enzymes from prokaryotes as well as eukaryotic MAP-1, while the second group ( ) is made up of archaeal MAP and eukaryotic MAP-2.
