identifier: HAMAP:MF_01464_B
label: "Protein-export membrane protein SecF [secF]"
definition: >-
  This entry rerpesents the SecF protein found in bacteria. Secretion across the inner membrane in some Gram-negative bacteria occurs via the preprotein translocase pathway. Proteins are produced in the cytoplasm as precursors, and require a chaperone subunit to direct them to the translocase component. From there, the mature proteins are either targeted to the outer membrane, or remain as periplasmic proteins. The translocase protein subunits are encoded on the bacterial chromosome.
