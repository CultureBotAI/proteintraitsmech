identifier: HAMAP:MF_03151
label: "Glutamyl-tRNA(Gln) amidotransferase subunit F, mitochondrial [GTF1]"
definition: >-
  GatFAB is a trimeric tRNA-dependent amidotransferase (AdT) that allows the formation of correctly charged Gln-tRNA(Gln) through the transamidation of misacylated Glu-tRNA(Gln) in the mitochondria. The reaction takes place in the presence of glutamine and ATP through an activated gamma-phospho-Glu-tRNA(Gln). GatF is an essential subunit of the yeast tRNA-dependent amidotransferase.
