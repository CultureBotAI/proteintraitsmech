identifier: HAMAP:MF_03207
label: "Elongation of very long chain fatty acids protein 7 [ELOVL7]"
definition: >-
  Elongation of very long chain fatty acids protein 7 (ELOVL7, also known as Very long chain fatty acid elongase 7) is an enzyme of the long-chain fatty acid elongation cycle. It is a transmembrane protein found in the endoplasmic reticulum with the active site within one of the transmembrane regions. ELOVL7 adds two carbons per cycle to the chains of long and very long fatty acids with higher activity towards C18 acyl-CoAs. ELOVL7 has been implicated in prostate cancer growth and the gene is regulated by the androgen pathway through SREBP1.
definition_source: "InterPro:IPR033670 abstract (HAMAP MF_03207 is a member signature)"
