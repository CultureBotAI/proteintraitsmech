identifier: HAMAP:MF_01273
label: "Type II pantothenate kinase [coaW]"
definition: >-
  Pantothenate kinase (PanK or CoaA) catalyses the first step of the universal five step coenzyme A (CoA) biosynthesis pathway. Three distinct types of pantothenate kinase enzymes have been identified: type I PanK enzymes are typified by the E. coli CoaA protein; type II enzymes are primarily found in eukaryotic organisms; whilst type III enzymes have a wider phylogenic distribution and are not feedback inhibited by CoA. This entry represents PanK type II family members from bacteria, which may have originated from the eukaryotic form by lateral transfer.
