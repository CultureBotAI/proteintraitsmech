identifier: HAMAP:MF_00696
label: "Fatty acid metabolism regulator protein [fadR]"
definition: >-
  Members of this entry are transcriptional regulators of fatty acid metabolism (FadR), including both biosynthesis and beta-oxidation reactions, which are found exclusively in a subset of Gamma proteobacteria with strictly one copy per genome. Proteins have an N-terminal DNA-binding domain and a less well conserved C-terminal long chain acyl-CoA-binding domain. FadR when expressed in Escherichia coli shows differences in regulatory response and fatty acid binding profiles. All members of this entry are expected to have the same function.
definition_source: "InterPro:IPR014178 abstract (HAMAP MF_00696 is a member signature)"
