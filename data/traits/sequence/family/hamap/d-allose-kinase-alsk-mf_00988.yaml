identifier: HAMAP:MF_00988
label: "D-allose kinase [alsK]"
definition: >-
  D-allose kinase AlsK catalyses the phosphorylation of D-allose to D-allose 6-phosphate. It also possesses weak phosphoryl transfer activity toward the alternate substrate d-glucose in vitro.
