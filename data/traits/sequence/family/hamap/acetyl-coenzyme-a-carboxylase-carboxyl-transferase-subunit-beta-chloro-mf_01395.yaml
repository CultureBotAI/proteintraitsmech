identifier: HAMAP:MF_01395
label: "Acetyl-coenzyme A carboxylase carboxyl transferase subunit beta, chloroplastic [accD]"
definition: >-
  Fatty acid synthesis involves a set of reactions, starting with carboxylation of acetyl-CoA to malonyl-CoA. This is an irreversible reaction, catalysed by the acetyl-CoA carboxylase complex ( ); a heterohexamer of biotin carboxyl carrier protein, biotin carboxylase and two non-identical carboxyl transferase subunits (alpha and beta) in a 2:2 association. The reaction involves two steps: Biotin carrier protein + ATP + HCO 3 - = Carboxybiotin carrier protein + ADP + P i Carboxybiotin carrier protein + Acetyl-CoA = Malonyl-CoA + Biotin carrier protein In the first step, biotin carboxylase catalyses the carboxylation of the carrier protein to form an intermediate. Next, the transcarboxylase complex transfers the carboxyl group from the intermediate to acetyl-CoA forming malonyl-CoA.
