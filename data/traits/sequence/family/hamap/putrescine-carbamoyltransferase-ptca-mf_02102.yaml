identifier: HAMAP:MF_02102
label: "Putrescine carbamoyltransferase [ptcA]"
definition: >-
  Many bacterial species are capable of utilising agmatine (a decarboxylated derivative of arginine) as an energy source via the agamtine deiminase pathway. Agmatine deiminase converts agmatine to carbamoyl putrescine, which is subsequently phosphorylised to carbamoyl phosphate and putrescine by putrescine carbamoyltransferase. The carbamoyl phosphate is used to generate ATP by phosphorylating ADP, while the putrescine is exchanged with extracellular agmatine by an agmatine/putrescine antiporter. This entry represents the putrescine carbamoyltransferase from this pathway. It is closely related to the ornithine carbamoyltransferase involved in the analogous arginine utilisation pahtway.
