identifier: HAMAP:MF_01800
label: "Chromosome partition protein MukB [mukB]"
definition: >-
  MukB is a 170kDa protein that is involved in ATP-dependent chromosome partitioning during cell division in Escherichia coli. Its domain structure is reminiscent of the eukaryotic motor proteins kinesin and myosin. MukB, like SMC (structural maintenance of chromosomes) proteins with which it shares function, has a dimeric structure and similar domain architecture. It is a filamentous protein with globular domains at the ends, and also having DNA binding and nucleotide binding abilitiesIt forms a homodimer with a rod-and-hinge structure with a pair of large, C-terminal globular domains at one end and a pair of small, N-terminal globular domains at the other. The N-terminal domain carries a putative Walker A nucleotide-binding region and the C-terminal domain has been shown to bind to DNA.
definition_source: "InterPro:IPR012090 abstract (HAMAP MF_01800 is a member signature)"
