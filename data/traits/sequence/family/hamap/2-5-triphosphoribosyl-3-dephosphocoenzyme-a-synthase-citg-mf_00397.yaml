identifier: HAMAP:MF_00397
label: "2-(5''-triphosphoribosyl)-3'-dephosphocoenzyme-A synthase [citG]"
definition: >-
  Triphosphoribosyl-dephospho-CoA is transferred to, and becomes the prosthetic group of, the respective acyl carrier protein subunits of both citrate lyase and malonate decarboxylase. Members of this protein family are triphosphoribosyl-dephospho-CoA synthases specifically from citrate lyase systems. CitG sometimes occurs as a fusion protein with CitX. CitX transfers the prosthetic group 2'-(5''-triphosphoribosyl)-3'-dephospho-CoA to the citrate lyase gamma chain, an acyl carrier protein.
