identifier: HAMAP:MF_00195
label: "GTPase Der [der]"
definition: >-
  This group represents GTPase Der, also known as GTP-binding protein EngA. In Escherichia coli, EngA is involved in ribosome stability and/or biogenesis, as well as cell viability. In Salmonella typhimurium however, EngA binds with higher affinity to GDP than GTP.
