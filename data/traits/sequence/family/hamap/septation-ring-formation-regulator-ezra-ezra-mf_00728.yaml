identifier: HAMAP:MF_00728
label: "Septation ring formation regulator EzrA [ezrA]"
definition: >-
  During the bacterial cell cycle, the tubulin-like cell-division protein FtsZ polymerises into a ring structure that establishes the location of the nascent division site. EzrA modulates the frequency and position of FtsZ ring formation.
