identifier: HAMAP:MF_00782
label: "Glutathione biosynthesis bifunctional protein GshAB [gshAB]"
definition: >-
  This entry represents a family with an N-terminal region similar to proteobacterial glutamate-cysteine ligase (gamma-glutamylcysteine synthetase). The C-terminal region is homologous to cyanophycin synthetase of cyanobacteria, and to D-alanine-D-alanine ligases. Cyanophycin is a storage molecule composed of arginine, aspartic acid, and some glutamic acid. Members of this family are found in Listeria and Enterococcus, Gram-positive lineages in which glutathione is produced, and in proteobacterium Pasteurella multocida.
definition_source: "InterPro:IPR006335 abstract (HAMAP MF_00782 is a member signature)"
