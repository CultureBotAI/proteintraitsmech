identifier: HAMAP:MF_01380
label: "Iron-sulfur cluster insertion protein ErpA [erpA]"
definition: >-
  This entry represents the ErpA component of the ISC system for iron-sulphur cluster assembly. ErpA is required in Escherichia coli for the delivery of iron-sulphur clusters to the hydrogen-oxidising [NiFe]-hydrogenases. This entry is limited to proteobacteria. A-type assembly protein (ATAP) is a conserved and essential member of the ISC, SUF, and NIF systems and plays an indispensable role in the FeS cluster assembly and the transfer process. The ATAP family consists of several subfamilies: Prokaryotic ISC system: IscA Eukaryotic ISC system: ISCA1, ISCA2 SUF system: SufA NIF system: HesB (IscAnif) Additional proteins: ErpA, cpIscA ATAPs are characterised by a conserved motif, Cys-Xn-Cys-X-Cys, by which ATAPs can bind transiently to Fe-S clusters, presumably using the three Cys residues in this motif, and transfer the FeS cluster to apoproteins. ErpA may interact with ISC and SUF. It binds to Fe-S clusters and transfers them to apo-IspG, which is involved in quinone biosynthesis among many other cell components. It is essential for bacterial growth under aerobic conditions. cpIscA is a SufA-like ATAP that was transferred from cyanobacteria to plants through endosymbiosis events and now is only harboured by plant plastids. Iron-sulphur (FeS) clusters are important cofactors for numerous proteins involved in electron transfer, in redox and non-redox catalysis, in gene regulation, and as sensors of oxygen and iron. These functions depend on the various FeS cluster prosthetic groups, the most common being [2Fe-2S] and [4Fe-4S]. FeS cluster assembly is a complex process involving the mobilisation of Fe and S atoms from storage sources, their assembly into [Fe-S] form, their transport to specific cellular locations, and their transfer to recipient apoproteins. So far in bacter
