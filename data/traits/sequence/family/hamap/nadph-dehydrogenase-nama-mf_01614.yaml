identifier: HAMAP:MF_01614
label: "NADPH dehydrogenase [namA]"
definition: >-
  This NADPH dehydrogenase catalyzes the reduction of the double bond of an array of alpha, beta-unsaturated aldehydes and ketones. It also reduces the nitro group of nitroester and nitroaromatic compounds and it could have a role in detoxification processes. This entry includes a subgroup of NADPH dehydrogenases mostly from Bacillales.
