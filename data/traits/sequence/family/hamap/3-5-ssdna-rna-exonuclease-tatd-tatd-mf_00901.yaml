identifier: HAMAP:MF_00901
label: "3'-5' ssDNA/RNA exonuclease TatD [tatD]"
definition: >-
  TatD is a Mg(2+)-dependent 3'-5' exonuclease that not only degrades chromosomal DNA during apoptosis but also processes single-stranded DNA during DNA repair. In E. coli TatD is encoded by a operon that encodes Tat proteins, including TatA, TatB, and TatC, for protein transport via the Tat (Twin-Arginine Translocation) pathway. However, TatD is not involved in the protein export in the Tat pathway.
