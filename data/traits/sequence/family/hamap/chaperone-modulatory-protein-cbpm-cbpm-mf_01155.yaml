identifier: HAMAP:MF_01155
label: "Chaperone modulatory protein CbpM [cbpM]"
definition: >-
  This entry represents Chaperone modulatory protein CbpM from Escherichia coli and similar proteins from Gammaproteobacteria. CbpM (named after "CbpA modulator", ) interacts with the N-terminal J-domain of CbpA, forms a stable complex and specifically inhibits its activity. Together with CbpA, it modulates the activity of the DnaK chaperone system. It does not inhibit the co-chaperone activity of DnaJ. The crystal structure of CbpM shows similarity to members of the MerR family of transcriptional regulators.
definition_source: "InterPro:IPR022835 abstract (HAMAP MF_01155 is a member signature)"
