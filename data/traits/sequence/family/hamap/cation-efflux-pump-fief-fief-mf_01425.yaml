identifier: HAMAP:MF_01425
label: "Cation-efflux pump FieF [fieF]"
definition: >-
  The ferrous iron efflux (FieF) proteins are members of the cation diffusion facilitator (CDF) family of membrane-bound transporters. These are divalent metal cation transporters that, in addition to their involvement in iron detoxification in Escherichia coli, FieF proteins are also able to transport Zn2 and Cd2 in a proton-dependent manner.
