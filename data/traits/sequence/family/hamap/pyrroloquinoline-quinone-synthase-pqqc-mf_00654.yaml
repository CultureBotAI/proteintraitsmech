identifier: HAMAP:MF_00654
label: "Pyrroloquinoline-quinone synthase [pqqC]"
definition: >-
  This entry describes the coenzyme PQQ (pyrrolo-quinoline-quinone) biosynthesis protein PqqC. Pyrroloquinoline quinone (PQQ) is the prosthetic group of several bacterial enzymes, including methanol dehydrogenase of methylotrophs and the glucose dehydrogenase of a number of bacteria. PQQC is an oxidase whose reaction involves a ring closure and eight-electron oxidation of its substrate (AHQQ) to produce PQQ. This entry does not include related proteins likely to be functionally distinct from PqqC, such as homologues found in the Chlamydias.
definition_source: "InterPro:IPR011845 abstract (HAMAP MF_00654 is a member signature)"
