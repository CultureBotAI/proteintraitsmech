identifier: HAMAP:MF_01877
label: "Ribosomal RNA small subunit methyltransferase I [rsmI]"
definition: >-
  Ribosomal RNA small subunit methyltransferase I (RsmI) is an S-adenosyl-L-methionine-dependent methyltransferase that catalyses the 2-O-methylation of the ribose of cytidine 1402 (C1402) in 16S rRNA. It may play a role in fine-tuning the shape and functions of the P-site to increase the translation fidelity. In vitro, active on the assembled 30S subunit, but not naked 16S rRNA or 70S ribosomes.
