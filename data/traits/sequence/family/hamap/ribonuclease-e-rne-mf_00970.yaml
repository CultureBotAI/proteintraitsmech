identifier: HAMAP:MF_00970
label: "Ribonuclease E [rne]"
definition: >-
  Ribonuclease E (RNase E) is an endoribonuclease that plays a central role in RNA processing and decay. It is required for the maturation of 5S and 16S rRNAs, and the majority of tRNAs. It is also involved in the degradation of most mRNAs. It is a major subunit of the eubacterial degradosome - a large multiprotein complex involved in RNA processing and degradation in E. coli and other proteobacteria. It is required to initiate rRNA degradation during both starvation and quality control; acts after RNase PH (rph) exonucleolytically digests the 3'-end of the 16S rRNA. Degradation of 16S rRNA leads to 23S rRNA degradation. RNase E is a multidomain protein containing an amino-terminal catalytic domain, a central RNA-binding domain, and carboxy-terminal binding sites for the other major components of the RNA degradosome.
definition_source: "InterPro:IPR028878 abstract (HAMAP MF_00970 is a member signature)"
