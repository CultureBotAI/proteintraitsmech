identifier: HAMAP:MF_00445
label: "NAD(P)H-quinone oxidoreductase subunit 2, chloroplastic [ndhB]"
definition: >-
  This entry describes the 14th (based on Escherichia coli) structural gene, N, of bacterial and chloroplast energy-transducing NADH (or NADPH) dehydrogenases ( EC:1.6.99.5 ). This entry does not describe any subunit of the mitochondrial complex I (for which the subunit composition is very different), nor NADH dehydrogenases that are not coupled to ion transport. For chloroplast members, the name NADH-plastoquinone oxidoreductase is used for the complex and this protein is designated as subunit 2 or B. This entry also includes a subunit of a related complex in the archaeal methanogen, Methanosarcina mazei (Methanosarcina frisia), in which F420H2 replaces NADH and 2-hydroxyphenazine replaces the quinone.
definition_source: "InterPro:IPR010096 abstract (HAMAP MF_00445 is a member signature)"
