identifier: HAMAP:MF_01402_B
label: "2,3-bisphosphoglycerate-independent phosphoglycerate mutase [apgM]"
definition: >-
  This family represents 2,3-bisphosphoglycerate-independent phosphoglycerate mutase from baceria and archaea. 2,3-bisphosphoglycerate-independent phosphoglycerate mutase is a metalloenzyme found particularly in archaea and some eubacteria. It is responsble for the interconversion of 2-phosphoglycerate and 3-phosphoglycerate. It is distantly related to the iPGAM ( InterPro:IPR005995 ) characteristic of plants and many eubacteria. The common active site and metal-binding residues of the phosphatase domain are easily identified, but the putative phosphotransferase domain is highly diverged. These proteins are unrelated to the cofactor-dependent PGAM. Activity has been demonstrated for proteins from Methanocaldococcus jannaschii (Methanococcus jannaschii), Pyrococcus furiosus, and Sulfolobus solfataricus. These proteins were initially misidentified as phosphonopyruvate decarboxylase.
