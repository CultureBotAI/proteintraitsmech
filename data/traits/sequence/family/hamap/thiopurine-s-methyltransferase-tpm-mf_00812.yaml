identifier: HAMAP:MF_00812
label: "Thiopurine S-methyltransferase [tpm]"
definition: >-
  This family consists of thiopurine S-methyltransferase proteins from both eukaryotes and prokaryotes. Thiopurine S-methyltransferase (TPMT) is a cytosolic enzyme that catalyses S-methylation of aromatic and heterocyclic sulphydryl compounds, including anticancer and immunosuppressive thiopurines. Thiopurine is commonly used to suppress the immune system in the case of autoimmune disease, inflammatory bowel disease and to prevent transplanted organ rejection. Thiopurine drugs can be toxic to cells but their effect can be mediated by the incorporation of thioguanine nucleotides into DNA.
