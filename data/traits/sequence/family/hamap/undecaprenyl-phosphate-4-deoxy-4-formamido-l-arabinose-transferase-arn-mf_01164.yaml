identifier: HAMAP:MF_01164
label: "Undecaprenyl-phosphate 4-deoxy-4-formamido-L-arabinose transferase [arnC]"
definition: >-
  This entry represents the bacterial undecaprenyl-phosphate 4-deoxy-4-formamido-L-arabinose transferase family. This enzymes catalyse the transfer of 4-deoxy-4-formamido-L-arabinose from UDP to undecaprenyl phosphate. The modified arabinose is attached to lipid A and is required for resistance to polymyxin and cationic antimicrobial peptides.
definition_source: "InterPro:IPR022857 abstract (HAMAP MF_01164 is a member signature)"
