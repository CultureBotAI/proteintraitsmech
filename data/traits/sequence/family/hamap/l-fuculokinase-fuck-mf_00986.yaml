identifier: HAMAP:MF_00986
label: "L-fuculokinase [fucK]"
definition: >-
  Proteins in this entry are L-fuculokinases including the Escherichia coli enzyme UniProtKB:P11553. They catalyse the second step in fucose catabolism and belong to the FGGY family of carbohydrate kinases. These enzymes are encoded by the kinase (K) gene of the fucose (fuc) operon.
