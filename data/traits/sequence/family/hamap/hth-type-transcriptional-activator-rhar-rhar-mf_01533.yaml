identifier: HAMAP:MF_01533
label: "HTH-type transcriptional activator RhaR [rhaR]"
definition: >-
  RhaR activates expression of the rhaSR operon in response to L-rhamnose. It is one of numerous bacterial transcription regulatory proteins that bind DNA via a helix-turn-helix (HTH) motif.
