identifier: Pfam:PF10178
label: Proteasome assembly chaperone 3
definition: >-
  Proteasome assembly chaperone 3 (PSMG3) promotes assembly of the 20S proteasome. It may cooperate with PSMG1-PSMG2 heterodimers to orchestrate the correct assembly of proteasomes.
