label: Mpp10 protein
definition: >-
  Mpp10 (M phase phosphoprotein 10) is a component of the 60-80S U3 small nucleolar ribonucleoprotein (U3 snoRNP) required for three cleavage events that generate the mature 18S rRNA from the pre-rRNA.
