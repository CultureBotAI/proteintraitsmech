identifier: Pfam:PF12389
label: Camelysin metallo-endopeptidase
definition: >-
  Camelysin is a novel surface metallopeptidase from Bacillus cereus. Camelysin prefers cleavage sites in front of aliphatic and hydrophilic amino acid residues (-OH, -SO3H, amido group), and requires zinc for activity. This entry also includes TasA, a major biofilm matrix component from Bacillus subtilis.
