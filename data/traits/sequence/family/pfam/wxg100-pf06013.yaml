identifier: Pfam:PF06013
label: Proteins of 100 residues with WXG
definition: >-
  Members of this protein family include secretion targets for type main variants of type VII secretion systems (T7SS), one found in the Actinobacteria, one found in the Firmicutes. Members of this family usually are ~100 amino acids in length but occasionally have long C-terminal extension. The best characterised member of this family is ESAT-6. This is a small protein that appears to be of fundamental importance in virulence and protective immunity in Mycobacterium tuberculosis. Homologues have been detected in other Gram-positive bacterial species. It may represent a novel secretion system potentially driven by the InterPro:IPR002543 domains in the YukA-like proteins.
