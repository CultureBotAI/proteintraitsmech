identifier: Pfam:PF04938
label: Survival motor neuron (SMN) interacting protein 1 (SIP1)
definition: >-
  This entry represents a domain of approximately 70 residues found almost exclusively in spiders (Araneae), particularly in the families Araneidae and Nephilidae. The domain is found in one to three copies per protein. Some family members occur in proteins that also contain a GEMIN2/SIP1 domain (Pfam:PF04938). The function of this domain remains to be determined.
