identifier: Pfam:PF05474
label: Semenogelin
definition: >-
  This family consists of several mammalian secreted seminal proteins including semenogelin I and II. Freshly ejaculated Homo sapiens semen has the appearance of a loose gel in which the predominant structural protein components are the seminal vesicle secreted semenogelins (Sg).
