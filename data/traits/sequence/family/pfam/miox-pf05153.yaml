identifier: Pfam:PF05153
label: Myo-inositol oxygenase
definition: >-
  Inositol oxygenase (EC:1.13.99.1) is involved in the biosynthesis of UDP-glucuronic acid (UDP-GlcA), providing nucleotide sugars for cell-wall polymers. It may be also involved in plant ascorbate biosynthesis.
