identifier: Pfam:PF07456
label: Heptaprenyl diphosphate synthase component I
definition: >-
  This family contains component I of bacterial heptaprenyl diphosphate synthase (EC:2.5.1.30) (approximately 170 residues long). This is one of the two dissociable subunits that form the enzyme, both of which are required for the catalysis of the biosynthesis of the side chain of menaquinone-7.
