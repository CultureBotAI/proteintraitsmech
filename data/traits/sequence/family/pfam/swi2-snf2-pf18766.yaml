identifier: Pfam:PF18766
label: SWI2/SNF2 ATPase
definition: >-
  This domain is found in uncharacterised proteins from prokaryotes. It is usually found associated with Pfam:PF04851, Pfam:PF00271 and Pfam:PF18766. It is predicted to fold into array of α-helices.
