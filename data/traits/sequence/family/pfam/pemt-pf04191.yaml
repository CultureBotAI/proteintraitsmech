identifier: Pfam:PF04191
label: 'Phospholipid methyltransferase '
definition: >-
  This entry includes Saccharomyces cerevisiae phospholipid methyltransferase EC:2.1.1.16, which has a broad substrate specificity of unsaturated phospholipids, and related enzymes such as methanethiol S-methyltransferase (EC:2.1.1.334), which catalyses the methylation of methanethiol to yield dimethylsulphide (a volatile compound important in climate regulation).
