identifier: Pfam:PF14876
label: Respiratory growth transcriptional regulator
definition: >-
  This is a family of transcriptional regulators that may interact with transcription factors to mediate the transition from fermentative to glycerol-based respiratory growth. They localise to both the nucleus and mitochondrion.
