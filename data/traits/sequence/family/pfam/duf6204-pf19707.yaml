identifier: Pfam:PF19707
label: Family of unknown function (DUF6204)
definition: >-
  This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0001070) is described by MIBiG as an example of the NRP (non-ribosomal peptide) and polyketide biosynthetic classes. It includes a member from the kirromycin biosynthetic gene cluster from Streptomyces collinus Tu 365. This family appears to be predominantly found in Actinobacteria.
