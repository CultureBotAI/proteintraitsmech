identifier: Pfam:PF12384
label: Ty3 transposon peptidase
definition: >-
  Ty3 is a gypsy-type, retrovirus-like, element found in the budding yeast. The Ty3 aspartyl protease is required for processing of the viral polyprotein into its mature species. This domain is predicted to adopt structure similar to InterPro:IPR021109.
