identifier: Pfam:PF01056
label: Myc amino-terminal region
definition: >-
  The class III basic helix-turn-helix (bHLH) transcription factors have proliferative and apoptotic roles and are characterised by the presence of a leucine zipper adjacent to the bHLH domain. The myc oncogene gene was first discovered in small-cell lung cancer cell lines where it is found to be deregulated. Although the biochemical function of the gene product is unknown, as a nuclear protein with a short half-life it may play a direct or indirect role in controlling gene expression. Myc forms a heterodimer with Max, and this complex regulates cell growth through direct activation of genes involved in cell replication. This entry represents the N-terminal domain found adjacent to the basic helix-loop-helix (bHLH) region (InterPro:IPR011598).
