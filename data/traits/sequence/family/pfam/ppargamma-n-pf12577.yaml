identifier: Pfam:PF12577
label: PPAR gamma N-terminal region
definition: >-
  This domain is found in eukaryotes, and is typically between 42 and 65 amino acids in length. It is found N-terminal to Pfam:PF00104 and Pfam:PF00105. There are two completely conserved residues (D and Y) that may be functionally important. Peroxisome proliferator-activated receptors (PPAR) are nuclear hormone receptors that control the expression of genes involved in lipid homeostasis in mammals.
