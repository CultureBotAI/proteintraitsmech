identifier: Pfam:PF01991
label: ATP synthase (E/31 kDa) subunit
definition: >-
  This entry represents subunit E from V-ATPases and A-ATPase/synthases. Subunit E appears to form a tight interaction with subunit G, which together may act as stators to prevent certain subunits from rotating with the central rotary element, much in the same way as the F0 complex subunit B does in F-ATPases. In addition to its key role in stator structure, subunit E appears to have a role in mediating interactions with putative regulatory subunits. Transmembrane ATPases are membrane-bound enzyme complexes/ion transporters that use ATP hydrolysis to drive the transport of protons across a membrane. Some transmembrane ATPases also work in reverse, harnessing the energy from a proton gradient, using the flux of ions across the membrane via the ATPase proton channel to drive the synthesis of ATP. The V-ATPases (or V1V0-ATPase) and A-ATPases (or A1A0-ATPase) are each composed of two linked complexes: the V1 or A1 complex contains the catalytic core that hydrolyses/synthesizes ATP, and the V0 or A0 complex that forms the membrane-spanning pore. The V-ATPase folding, localisation, and stability is made possible through the formation of a luminal glycan coat by the glycolipids and the glycosylated V0 subunits. The V- and A-ATPases both contain rotary motors, one that drives proton translocation across the membrane and one that drives ATP synthesis/hydrolysis. The V- and A-ATPases more closely resemble one another in subunit structure than they do the F-ATPases, although the function of A-ATPases is closer to that of F-ATPases. A-type ATPases (archaeal-type ATPases) and V-ATPases, all included in this entry, are thought to have evolved from common ancestral genes.
