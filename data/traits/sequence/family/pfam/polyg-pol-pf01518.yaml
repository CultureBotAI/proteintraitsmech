identifier: Pfam:PF01518
label: Sigma NS protein
definition: >-
  Reovirus nonstructural protein sigma NS exhibits a ssRNA-binding activity and is thought to be involved in assembling the reovirus mRNAs for genome replication and virion morphogenesis. Various studies have been carried out to localize the RNA-binding site. They suggest that the first 11 amino acids of sigma NS, which are predicted to form an amphipathic α-helix, are important for both ssRNA binding and formation of complexes larger than 7-9 S. A number of other studies have attempted to identify and characterise the RNA-binding activities of sigma NS. A study of the Avian orthoreovirus sigma NS protein suggests that it binds to single-stranded RNA in a nucleotide sequence non-specific manner and is functionally similar to its counterpart specified by mammalian reovirus.
