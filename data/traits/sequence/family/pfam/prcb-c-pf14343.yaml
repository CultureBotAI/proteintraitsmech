identifier: Pfam:PF14343
label: PrcB C-terminal
definition: >-
  This domain is found at the C terminus of Treponema denticola PrcB (UniProtKB:B8YNY4). PrcB interacts with the PrtP protease (dentilisin) and is required for the stability of the protease complex. Dentilisin has been suggested to be an important virulence factor of T. denticola with a role in epithelial cell layer penetration.
