identifier: Pfam:PF11202
label: Tellurite-like stress resistance cysteine protease StiP
definition: >-
  This entry represents the N-terminal domain of Cysteine protease StiP from Acinetobacter baylyi, which may play a role in regulating cell morphology in response to stressful conditions which likely cause oxidative damage. StiP has been shown to posses cysteine protease activity. This domain is also found centrally located in several uncharacterised proteins including UniProtKB:M3C5N2 from Streptomyces mobaraensis. Most members of this family have a C-terminal RNA binding PELOTA domain (InterPro:IPR028157). These genes are found in the biosynthetic operon associated with the Ter stress response.
