identifier: Pfam:PF23510
label: Apicomplexa microprotein
definition: >-
  This domain covers the whole length of uncharacterised microproteins encoded by small open reading frames (smORFs) from apicomplexa, including UniProtKB:A7AQF6 from the parasite Babesia bovis, and is found at the N-terminal end of longer uncharacterised proteins from related species.
