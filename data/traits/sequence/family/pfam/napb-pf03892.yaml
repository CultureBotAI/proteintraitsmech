identifier: Pfam:PF03892
label: Nitrate reductase cytochrome c-type subunit (NapB)
definition: >-
  The napB gene encodes a dihaem cytochrome c, the small subunit of a heterodimeric periplasmic nitrate reductase. The NapB protein is essential in transferring electrons to the large catalytic subunit NapA, which subsequently reduces nitrate to nitrite..
