identifier: Pfam:PF15337
label: Vascular protein family Vasculin-like 1
definition: >-
  Vasculin (also known as GC-rich promoter-binding protein, GPBP) functions as a GC-rich promoter-specific transcription factor. This protein also binds RNA, which may mediate different RNA-dependent cellular processes.
