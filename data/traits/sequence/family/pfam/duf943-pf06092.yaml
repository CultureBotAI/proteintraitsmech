identifier: Pfam:PF06092
label: Enterobacterial putative membrane protein (DUF943)
definition: >-
  This family consists of several hypothetical membrane proteins mainly from Enterobacteria. Recently, it was proposed that members of this family along with members of [InterPro:IPR017483] should be recognised as a putative toxin-antitoxin pair in which [InterPro:IPR017483] is a homologue of Colicin M and [InterPro:IPR010351] acts as its cognate immunity protein.
