identifier: Pfam:PF02349
label: Major surface glycoprotein
definition: >-
  The immunogenic major surface antigen (MSG) also termed glycoprotein A (gpA) is involved in the immunopathogenesis of Pneumocystis carinii. MSG from all P. carinii has conserved secondary structure, as well as function.
