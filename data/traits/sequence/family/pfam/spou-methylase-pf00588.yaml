identifier: Pfam:PF00588
label: SpoU rRNA Methylase family
definition: >-
  This domain is found in bacteria and is about 60 amino acids in length. It is found in association with Pfam:PF00588. This domain has a conserved LFE sequence motif. Some members of the Pfam family SpoU_methylase, Pfam:PF00588, carry this very distinctive sequence at their extreme C terminus. The exact function of this domain is not known.
