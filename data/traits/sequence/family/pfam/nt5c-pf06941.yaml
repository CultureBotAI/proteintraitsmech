label: 5' nucleotidase, deoxy (Pyrimidine), cytosolic type C protein (NT5C)
definition: >-
  This family consists of several 5' nucleotidase, deoxy (Pyrimidine), and cytosolic type C (NT5C) proteins. 5'(3')-deoxyribonucleotidase is a ubiquitous enzyme in mammalian cells whose physiological function is not known.
