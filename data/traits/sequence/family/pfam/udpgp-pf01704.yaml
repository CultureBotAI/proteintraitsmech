  This family contains UTP--glucose-1-phosphate uridylyltransferases ( ), UDP-sugar pyrophosphorylases ( ), UDP-N-acetylglucosamine pyrophosphorylases ( ) and UDP-N-acetylhexosamine pyrophosphorylases, all of which catalyse the transfer of an uridylyl group.
