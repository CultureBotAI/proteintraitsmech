identifier: Pfam:PF17158
label: Membrane-associated sensor, integral membrane domain
definition: >-
  MASE4 (Membrane-Associated SEnsor) is an integral membrane sensor domain found in various GGDEF domain proteins, including a functional diguanylate cyclase DgcT (YcdT) and the enzymatically inactive CdgI (YeaI) of Escherichia coli. In the Shiga toxin-producing enteroaggregative E. coli O104:H4, which caused the outbreak of the haemolytic uraemic syndrome in Germany in 2011, MASE4-containing diguanylate cyclase DgcX (UniProtKB:B7LBD9) was highly expressed, ensuring strong biofilm formation.
