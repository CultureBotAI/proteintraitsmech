label: Protein of unknown function (DUF1684)
definition: >-
  The sequences featured in this family are found in hypothetical archaeal and bacterial proteins of unknown function. The region in question is approximately 200 amino acids long. It adopts a β-barrel fold (PDB:2LOK) that has some similarity to Core-binding factor subunit beta (PDB:1H9D).
