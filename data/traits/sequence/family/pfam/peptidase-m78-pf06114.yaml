identifier: Pfam:PF06114
label: IrrE N-terminal-like domain
definition: >-
  This entry represents a small C-terminal helical domain of approximately 40 residues found in bacterial ImmA/IrrE family metallopeptidases. This domain is located C-terminal to the Peptidase_M78 catalytic domain (Pfam:PF06114). The function of this domain remains to be determined.
