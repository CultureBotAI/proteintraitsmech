label: Phosphoinositide 3-kinase gamma adapter protein p101 subunit
definition: >-
  Phosphoinositide 3-kinase regulatory subunit5/6 are regulatory subunits of the PI3K gamma complex. Class I PI3Ks are dual-specific lipid and protein kinases involved in numerous intracellular signaling pathways.
