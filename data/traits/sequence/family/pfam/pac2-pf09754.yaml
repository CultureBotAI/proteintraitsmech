identifier: Pfam:PF09754
label: PAC2 family
definition: >-
  This domain is found in uncharacterised plant proteins. It is predicted to fold into a α/β structure with a central mixed β-sheet and α-helices packed on both sides. The predicted structure has a topological similarity to PACT family domains members of Pfam:PF09754.
