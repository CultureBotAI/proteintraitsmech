identifier: Pfam:PF12822
label: ECF transporter, substrate-specific component
definition: >-
  Energy-coupling factor (ECF) transporters consist of a substrate-specific component (known as the S component), and an energy-coupling module. The substrate-binding component is a small integral membrane protein which captures specific substrates and forms an active transporter in the presence of the energy-coupling AT module. The energy coupling module is composed of an ATPase typical of the ATP binding cassette (ABC) superfamily (A component) and a characteristic transmembrane protein (T component). Unlike the ABC transporters, an energy coupling module can be shared between multiple different substrate-binding components. This entry represents the substrate-specific component from a number of different ECF transporters.
