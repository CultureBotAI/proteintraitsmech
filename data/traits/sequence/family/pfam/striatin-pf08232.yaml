identifier: Pfam:PF08232
label: Striatin family
definition: >-
  This domain is associated with the N terminus of striatin. Striatin is an intracellular protein which has a caveolin-binding motif, a coiled-coil structure, a calmodulin-binding site, and a WD (InterPro:IPR001680) repeat domain. It acts as a scaffold protein and is involved in signalling pathways.
