identifier: Pfam:PF26302
label: YhzF protein
definition: >-
  This entry represents a family of small integral membrane proteins found in bacilli. The protein is composed of two transmembrane α-helices. There is some weak evidence from structure predictions that these proteins might form a homodimeric complex.
