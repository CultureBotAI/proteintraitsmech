identifier: Pfam:PF03534
label: Salmonella virulence plasmid 65kDa B protein
definition: >-
  Salmonella typhimurium contains a 90kb plasmid that is associated with virulence. This plasmid encodes at least 6 genes needed by the bacterium for invading host macrophages during infection. These include the 70kDa mkaA protein, a recognised virulence factor, and more recently described, four spv genes under the control of a regulator. The spv genes are induced under carbon-poor conditions at a stationary phase of growth, and their expression is under the control of both the spvR regulator, and the katF locus in Salmonella. It has been proposed that individual spv proteins may be required at different time points during infection. SpvB is a 65kDa protein that has been localised to the bacterial cytoplasm. Its expression peaks during early stationary phase, but declines as the latent phase of the infection is reached, suggesting a role in initiating virulence.
