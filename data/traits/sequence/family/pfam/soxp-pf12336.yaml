identifier: Pfam:PF12336
label: SOX transcription factor
definition: >-
  This entry represents a group of eukaryotic transcription factors known as SOX. Proteins in this family usually contain the high mobility group box domain (InterPro:IPR009071). They are regulators of cell fate decisions during development.
