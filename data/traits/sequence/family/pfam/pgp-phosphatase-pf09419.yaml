identifier: Pfam:PF09419
label: Mitochondrial PGP phosphatase
definition: >-
  Mitochondrial phosphatidylglycerophosphatase (PGP phosphatase) (EC:3.1.3.27) dephosphorylates phosphatidylglycerolphosphate to generate phosphatidylglycerol in cardiolipin biosynthesis. Cardiolipin is a unique dimeric phosphoglycerolipid predominantly present in mitochondrial membranes. The inverted phosphatase motif includes the highly conserved DKD triad. In Saccharomyces cerevisiae, Gep4 is required for the stability of respiratory chain supercomplexes and for growth at elevated temperature, in presence of ethidium bromide or in absence of prohibitins. Chloroplastic phosphatidylglycerophosphate phosphatase is involved in the biosynthesis of phosphatidylglycerol (PG), a phosphoglycerolipid present in chloroplastic thylakoid membranes and has a photosynthetic function.
