identifier: Pfam:PF27663
label: Spore coat putative kinase YutH
definition: >-
  This entry represents YutH, Spore coat protein S and Sporte coat protein I. YutH, is found only in the family Bacillaceae, part of the endospore-forming group within the Firmicutes. YutH has been shown to be involved in spore coat assmebly.
