identifier: Pfam:PF03248
label: Rer1 family
definition: >-
  RER1 family proteins are involved in the retrieval of some endoplasmic reticulum membrane proteins from the early golgi compartment. The C terminus of yeast Rer1p interacts with a coatomer complex.
