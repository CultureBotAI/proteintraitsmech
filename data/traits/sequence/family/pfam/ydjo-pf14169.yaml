identifier: Pfam:PF14169
label: Cold-inducible protein YdjO
definition: >-
  This family includes the B. subtilis YdjO protein (UniProtKB:O34759), which is functionally uncharacterised. Note - this is not a homologue of E. coli YdjO (UniProtKB:P76210). B. subtilis YdjO is cold-inducible. Its expression is induced by the extracytoplasmic function sigma factor sigma-W.
