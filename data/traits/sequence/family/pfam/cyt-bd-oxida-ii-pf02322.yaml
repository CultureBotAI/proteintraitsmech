identifier: Pfam:PF02322
label: Cytochrome bd terminal oxidase subunit II
definition: >-
  These proteins are cytochrome bd type terminal oxidases that catalyse quinol dependent, Na+ independent oxygen uptake. Members of this family are integral membrane proteins and contain a protoheame IX centre B558. Cytochrome bd may play an important role in microaerobic nitrogen fixation in the enteric bacterium Klebsiella pneumoniae, where it is expressed under all conditions that permit diazotrophy.
