identifier: Pfam:PF02565
label: Recombination protein O C terminal
definition: >-
  The damage avoidance-tolerance pathway(s) requires functional recA, recF, recO, and recR genes, suggesting the mechanism to be daughter strand gap repair. The ruvABC genes or the recG gene is also required. The RecG pathway appears to be more active than the RuvABC pathway. RecO may contain a mononucleotide-binding fold.
