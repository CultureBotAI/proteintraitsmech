identifier: Pfam:PF06588
label: Muskelin N-terminus
definition: >-
  This entry represents the N-terminal region of muskelin and is found in conjunction with several InterPro:IPR006652 repeats. Muskelin is an intracellular, kelch repeat protein that is needed in cell-spreading responses to the matrix adhesion molecule, thrombospondin-1.
