identifier: Pfam:PF15499
label: Ubiquitin-specific peptidase-like, SUMO isopeptidase
definition: >-
  Peptidase C98 is a small family of SUMO - small ubiquitin-related modifier - isopeptidases found in eukaryotes. Reversible attachment of SUMO is an essential protein modification in all eukaryotic cells. SUMO-specific isopeptidase USPL1 neither binds nor cleaves ubiquitin, but is a potent SUMO isopeptidase. The invariant residues required for SUMO binding and cleavage, in UniProtKB:Q5W0Q7 are Cys-236, His-456 and Asp-472, all of which are fully conserved in the family. Member proteins are low-abundance proteins that colocalise with coilin in Cajal bodies. Peptidase C98 depletion does not affect global sumoylation, but causes striking coilin mis-localisation and impairs cell proliferation, functions that are not dependent on the catalytic activity. Thus, Peptidase C98 represents a third type of SUMO protease, with essential functions in Cajal body biology. This entry represents the catalytic domain.
