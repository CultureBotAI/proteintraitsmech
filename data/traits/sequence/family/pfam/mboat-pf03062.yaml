identifier: Pfam:PF03062
label: MBOAT, membrane-bound O-acyltransferase family
definition: >-
  The MBOAT (membrane bound O-acyl transferase) family of membrane proteins contains a variety of acyltransferase enzymes. A conserved histidine has been suggested to be the active site residue. The structure of MBOAT has been revealed. This family includes Diacylglycerol O-acyltransferase 1 (DGAT1) and Lysophospholipid acyltransferase 7 (MBOAT7) from humans. DGAT1 catalyses the terminal and only committed step in triacylglycerol synthesis by using diacylglycerol and fatty acyl CoA as substrates. It also functions as the major acyl-CoA retinol acyltransferase (ARAT) in the skin, where it acts to maintain retinoid homeostasis and prevent retinoid toxicity leading to skin and hair disorders. MBOAT7 participates in the regulation of triglyceride metabolism through the phosphatidylinositol acyl-chain remodeling regulation.
