identifier: Pfam:PF06180
label: Cobalt chelatase (CbiK)
definition: >-
  This group, typified by Salmonella typhimurium CbiK, contains anaerobic cobalt chelatases that act in the anaerobic cobalamin biosynthesis pathway. Cobalamin (vitamin B12) can be complexed with metal via ATP-dependent reactions (aerobic pathway) (e.g., in Pseudomonas denitrificans) or via ATP-independent reactions (anaerobic pathway) (e.g., in S. typhimurium). The corresponding cobalt chelatases are not homologous. This group belongs to the class of ATP-independent, single-subunit chelatases that also includes distantly related protoporphyrin IX (PPIX) ferrochelatase (HemH) (Class II chelatases). The structure of S. typhimurium CbiK shows that it has a remarkably similar topology to Bacillus subtilis ferrochelatase despite only weak sequence conservation. Both enzymes contain a histidine residue identified as the metal ion ligand, but CbiK contains a second histidine in place of the glutamic acid residue identified as a general base in PPIX ferrochelatase. Site-directed mutagenesis has confirmed a role for this histidine and a nearby glutamic acid in cobalt binding, modulating metal ion specificity as well as catalytic efficiency. It should be noted that CysG and Met8p, which are multifunctional proteins associated with siroheme biosynthesis, include chelatase activity and can therefore be considered as the third class of chelatases. As with the class II chelatases, they do not require ATP for activity. However, they are not structurally similar to HemH or CbiK, and it is likely that they have arisen by the acquisition of a chelatase function within a dehydrogenase catalytic framework.
