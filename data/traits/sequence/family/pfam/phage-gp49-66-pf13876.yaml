identifier: Pfam:PF13876
label: Phage protein (N4 Gp49/phage Sf6 gene 66) family
definition: >-
  This family of phage proteins is functionally uncharacterised. The family includes bacteriophage Sf6 gene 66 (UniProtKB:Q716B1) as well as phage N4 GP49 protein (UniProtKB:A0MZD7). Proteins in this family are typically between 87 and 154 amino acids in length. There is a conserved NGF sequence motif.
