identifier: Pfam:PF12016
label: Stonin 2
definition: >-
  Stonin 2 is involved in clathrin mediated endocytosis. It binds to Eps15 by its highly conserved NPF motif. The complex formed has been shown to directly associate with the clathrin adaptor complex AP-2, and to localize to clathrin-coated pits (CCPs). In addition, stonin2 was recently identified as a specific sorting adaptor for synaptotagmin, and may thus regulate synaptic vesicle recycling. This entry represents the N-terminal domain of stonin-2. It is found in association with Pfam:PF00928.
