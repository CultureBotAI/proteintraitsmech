identifier: Pfam:PF21790
label: Putative 8-oxoguanine DNA glycosylase OGG-like protein
definition: >-
  This entry represents an uncharacterised family of bacterial proteins that are structurally similar to 8-oxoguanine DNA glycosylase enzymes. These proteins are involved in DNA repair of the base excision repair pathway.
