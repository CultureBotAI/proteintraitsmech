identifier: Pfam:PF12621
label: Extracellular tail, of 10TM putative phosphate transporter
definition: >-
  This domain is found in plants and fungi. It represents the C-terminal extracellular domain of the putative phosphate transporter, PHM7. The three N-terminal TMS are found in family RSN1_TM, InterPro:IPR003864; the cytoplssmic domain is InterPro:IPR027815, and the remaining 7TM region is in InterPro:IPR003864.
