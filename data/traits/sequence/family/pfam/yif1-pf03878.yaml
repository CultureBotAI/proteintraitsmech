identifier: Pfam:PF03878
label: YIF1
definition: >-
  Yif1 (Yip1 interacting factor) is an integral membrane protein required for membrane fusion of ER derived vesicles. It also plays a role in the biogenesis of ER derived COPII transport vesicles.
