label: Asr1405/Asl0597-like
definition: >-
  This family appears to be restricted to nitrogen-fixing cyanobacteria. Asr1405 from Nostoc sp. (UniProtKB:Q8YX13) was shown to be induced by nitrogen limitation, while its paralogue Asl0597 (UniProtKB:Q8YZ82) was not.
