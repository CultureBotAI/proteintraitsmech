identifier: Pfam:PF08687
label: Apx/Shroom domain ASD2
definition: >-
  This entry represents the ASD2 motif of the Shroom proteins. The Shroom family is a small group of related proteins that are defined by sequence similarity and in most cases by some link to the actin cytoskeleton. The Shroom (Shrm) protein family is found only in animals. Proteins of this family are predicted to be utilised in multiple morphogenic and developmental processes across animal phyla to regulate cells shape or intracellular architecture in an actin and myosin-dependent manner. The Shrm family consists of: Shrm1 (formerly Apx), first found in Xenopus. Human Shroom1 links a membrane bound protein to the actin cytoskeleton.; Shrm2 (formerly Apxl), a protein involved in the morphogenesis, maintenance, and/or function of vascular endothelial cells.; Shrm3 (formerly Shroom), a protein necessary for neural tube closure in vertebrate development as deficiency in Shrm results in spina bifida. Shrm3 is also conserved in some invertebrates, as orthologues can be found in sea urchins.; Shrm4, a regulator of cyto-skeletal architecture that may play an important role in vertebrate development. It is implicated in X-linked mental retardation in humans.; This protein family is based on the conservation of a specific arrangement of an N-terminal PDZ domain, a centrally positioned sequence motif termed ASD1 (Apx/Shrm Domain 1) and a C-terminal motif termed ASD2. Shrm2 and Shrm3 contain all three domains, while Shrm4 contains the PDZ and ASD2 domains, but lacks a discernible ASD1 element. To date, the ASD1 and ASD2 elements have only been found in Shrm-related proteins and do not appear in combination with other conserved domains. ASD1 is required for targeting actin, while ASD2 is capable of eliciting an actomyosin based constriction event. ASD2 is the most highly conserved s…
