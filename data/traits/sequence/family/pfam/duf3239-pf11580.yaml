identifier: Pfam:PF11580
label: Protein of unknown function (DUF3239)
definition: >-
  This entry represents a protein family related to Pfam:PF11580 (DUF3239). The family is found in Cyanobacteria (Oscillatoriales, Nostocales, Chroococcales) and in photosynthetic eukaryotes including Chlorophyta (green algae) and Stramenopiles (Ochrophyta). The presence in eukaryotic algae likely reflects plastid-encoded or plastid-targeted proteins derived from the cyanobacterial endosymbiont ancestor. The function of this family remains to be determined.
