identifier: Pfam:PF02361
label: Cobalt transport protein
definition: >-
  ECF (energy-coupling factor) transporters are a subgroup of ABC (ATP-binding cassette) transporters involved in the uptake of vitamins and micronutrients in prokaryotes. ECF transporters are protein complexes consisting of a conserved module (two peripheral ATPases, known as the A and A' components, and the integral membrane protein EcfT) and a non-conserved integral membrane protein responsible for substrate specificity (S-component). ECF transporters comprise a subgroup of ATP-binding cassette (ABC) transporters that do not make use of water-soluble substrate binding proteins or domains, but instead employ integral membrane proteins for substrate binding, the S component, in contrast to classical ABC importers. This entry represents the transmembrane component (T component) of the ECF-type transporter, a transmembrane protein important for vitamin uptake in prokaryotes. The T component links the S component to the ATP-binding subcomplex.
