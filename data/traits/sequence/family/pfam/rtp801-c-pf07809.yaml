identifier: Pfam:PF07809
label: RTP801 C-terminal region
definition: >-
  RTP801, also known as REDD1, is the protein product of a hypoxia-inducible factor 1 (HIF-1)- responsive gene and is thought to be involved in various cellular processes. Both RTP801 and RTP801-like (REDD2) work downstream of AKT and upstream of TSC2 to inhibit mTOR, a serine/threonine kinase that plays an essential role in cell growth control. Two members of this family expressed by Drosophila melanogaster, Scylla (UniProtKB:Q9NHN4) and Charybde (UniProtKB:Q9NHN5), are designated as Hox targets.
