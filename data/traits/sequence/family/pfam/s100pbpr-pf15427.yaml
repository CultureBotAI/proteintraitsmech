identifier: Pfam:PF15427
label: S100P-binding protein
definition: >-
  S100P-binding protein (S100PBP) interacts with S100P. S100P is a member of the S100 family of calcium-binding proteins and there have been several recent reports of its overexpression in pancreatic ductal adenocarcinoma (PDAC).
