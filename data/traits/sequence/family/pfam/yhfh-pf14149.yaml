identifier: Pfam:PF14149
label: YhfH-like protein
definition: >-
  The YhfH-like protein family includes the Bacillus subtilis YhfH protein UniProtKB:O07606, which is functionally uncharacterised. Its expression is repressed by the Spx paralogue MgsR, which regulates genes involved in stress response.
