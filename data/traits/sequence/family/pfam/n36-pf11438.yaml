identifier: Pfam:PF11438
label: 36-mer N-terminal peptide of the N protein (N36)
definition: >-
  Antitermination proteins positively regulate expression of bacteriophage early and late gene operons. Bacterial host RNA polymerase is modified by these antitermination proteins to a terminator-resistant form that transcribes through termination sites that would otherwise prevent expression of the regulated genes. Enterobacteria phage lambda antitermination protein N is essential for the expression of two phage early operons which are critical for phage development. This entry represents the RNA-binding arginine-rich motif (also known as N36) which forms a complex with boxB RNA by binding tightly to the major groove of the boxB hairpin via hydrophobic and electrostatic interactions forming a bent α helix.
