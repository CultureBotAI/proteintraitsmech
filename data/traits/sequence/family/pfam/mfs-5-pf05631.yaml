identifier: Pfam:PF05631
label: Sugar-tranasporters, 12 TM
definition: >-
  This entry represents a group of molybdate-anion transporters, including MFSD5 (also known as hsMOT2) from humans and molybdate transporter (CrMOT2, ) from Chlamydomonas. They mediate high-affinity intracellular uptake of the rare oligo-element molybdenum.
