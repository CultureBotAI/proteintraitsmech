identifier: Pfam:PF01944
label: Stage II sporulation protein M
definition: >-
  This entry represents a group of predicted integral membrane proteins, including Stage II sporulation protein M (spoIIM) from Bacillus subtilis (UniProtKB:P37873). SpoIIM is on e of four stage II sporulation proteins that is necessary for the forespore inside the mother-cell to be properly internalised through the breakdown of peptidoglycans trapped between the membranes of the septum separating the forespore and the mother-cell. The four proteins working in sequence are SpoIIB, SpoIIM, SpoIIP and SpoIID. D, M and P are in a complex with each other and the complex assembles in a hierarchical manner such that M, which serves as a membrane anchor, recruits P to the septum and P, in turn, recruits D to the septum.
