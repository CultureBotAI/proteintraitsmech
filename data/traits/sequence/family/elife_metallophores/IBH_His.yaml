identifier: proteintraitsmech:ELIFE109154_IBH_His
label: Interface-associated metallophore histidine beta-hydroxylase family
definition: Protein sequence family recognized by the IBH_His profile of the bacterial NRP metallophore
  detection system. This interface-associated Fe(II)- and 2-oxoglutarate-dependent hydroxylase subtype
  installs a beta-hydroxyl group on histidine in nonribosomal peptide metallophore biosynthesis,
  generating a potential chelating residue.
