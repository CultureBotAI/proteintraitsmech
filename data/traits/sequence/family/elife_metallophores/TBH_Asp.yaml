identifier: proteintraitsmech:ELIFE109154_TBH_Asp
label: T-E-associated metallophore aspartate beta-hydroxylase family
definition: Protein sequence family recognized by the TBH_Asp profile of the bacterial NRP metallophore
  detection system. This subtype comprises Fe(II)- and 2-oxoglutarate-dependent aspartate beta-hydroxylases
  associated with NRPS thiolation-epimerization modules in the biosynthesis of beta-hydroxyaspartate
  chelating residues. Membership identifies the hydroxylase subtype rather than a metal preference
  of the final metabolite.
