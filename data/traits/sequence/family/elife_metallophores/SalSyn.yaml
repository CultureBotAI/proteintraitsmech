identifier: proteintraitsmech:ELIFE109154_SalSyn
label: Metallophore-associated bifunctional salicylate synthase family
definition: Protein sequence family recognized by the SalSyn profile of the bacterial NRP metallophore
  detection system. Members include bifunctional salicylate synthases that convert chorismate to
  salicylate through an isochorismate intermediate. This route is an alternative to a separate isochorismate
  pyruvate-lyase.
