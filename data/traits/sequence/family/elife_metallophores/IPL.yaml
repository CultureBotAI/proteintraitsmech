identifier: proteintraitsmech:ELIFE109154_IPL
label: Metallophore-associated isochorismate pyruvate-lyase family
definition: Protein sequence family recognized by the IPL profile of the bacterial NRP metallophore
  detection system. Members include isochorismate pyruvate-lyases that generate salicylate from isochorismate
  as one route to phenolic metallophore precursors. This corrects the abbreviated isopyruvate lyase
  label in the source model table using the article's pathway description.
