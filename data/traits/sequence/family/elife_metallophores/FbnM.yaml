identifier: proteintraitsmech:ELIFE109154_FbnM
label: FbnM-type Dmaq biosynthesis peroxidase subunit family
definition: Protein sequence family recognized by the FbnM profile of the bacterial NRP metallophore
  detection system. Members include the FbnM component of the FbnL-FbnM heme peroxidase initiating
  Dmaq biosynthesis through L-tyrosine hydroxylation to L-DOPA. The two subunit profiles jointly
  identify the pathway; this family is not equivalent to the small-molecule chelator.
