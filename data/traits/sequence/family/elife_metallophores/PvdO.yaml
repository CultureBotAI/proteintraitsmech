identifier: proteintraitsmech:ELIFE109154_PvdO
label: Pyoverdine chromophore maturation oxidoreductase family
definition: Protein sequence family recognized by the PvdO profile of the bacterial NRP metallophore
  detection system. Members include oxidoreductases involved in maturation of the fluorescent pyoverdine
  chromophore. The detection rule accepts PvdO independently of PvdP to accommodate dispersed biosynthetic
  loci and also captures related azotobactin chromophore biosynthesis.
