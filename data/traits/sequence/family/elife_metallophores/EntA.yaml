identifier: proteintraitsmech:ELIFE109154_EntA
label: EntA-type catechol biosynthesis dehydrogenase family
definition: Protein sequence family recognized by the EntA profile of the bacterial NRP metallophore
  detection system. Members include dehydrogenases that oxidize 2,3-dihydro-2,3-dihydroxybenzoate
  during catechol precursor biosynthesis. The cluster rule requires EntC together with EntA to distinguish
  this pathway from the related 3-hydroxyanthranilate pathway.
