identifier: proteintraitsmech:ELIFE109154_VbsL
label: Vicibactin acyl-hydroxyornithine epimerase family
definition: Protein sequence family recognized by the VbsL profile of the bacterial NRP metallophore
  detection system. Members include pyridoxal-phosphate-dependent epimerases acting on acylated hydroxyornithine
  during vicibactin biosynthesis. VbsL serves as an alternative pathway marker because the vicibactin
  ornithine hydroxylase VbsO could not be distinguished by a sufficiently specific monooxygenase
  profile in this study.
