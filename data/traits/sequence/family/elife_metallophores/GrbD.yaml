identifier: proteintraitsmech:ELIFE109154_GrbD
label: GrbD-type graminine biosynthesis protein family
definition: Protein sequence family recognized by the GrbD profile of the bacterial NRP metallophore
  detection system. Members include proteins implicated with GrbE in forming the diazeniumdiolate-containing
  amino acid graminine from arginine. The detection rule requires both GrbD and GrbE; the study does
  not resolve a complete catalytic mechanism for these proteins.
