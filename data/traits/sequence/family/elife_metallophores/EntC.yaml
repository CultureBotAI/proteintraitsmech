identifier: proteintraitsmech:ELIFE109154_EntC
label: EntC-type catechol biosynthesis isochorismate synthase family
definition: Protein sequence family recognized by the EntC profile of the bacterial NRP metallophore
  detection system. Members include isochorismate synthases supplying the chorismate-derived precursor
  for 2,3-dihydroxybenzoate biosynthesis. EntA and EntC must co-occur in the cluster rule; an isolated
  match does not establish catechol metallophore production.
