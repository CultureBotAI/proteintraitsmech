identifier: proteintraitsmech:ELIFE109154_PvdP
label: Pyoverdine chromophore maturation tyrosinase family
definition: Protein sequence family recognized by the PvdP profile of the bacterial NRP metallophore
  detection system. Members include tyrosinases involved in maturation of the fluorescent metal-chelating
  pyoverdine chromophore. PvdP and PvdO are independent detection markers because their genes may
  occupy separate loci; the profiles also capture related azotobactin pathways.
