identifier: proteintraitsmech:ELIFE109154_Lys_monoox
label: Mycobactin-type lysine N6-monooxygenase family
definition: Protein sequence family designated Lys_monoox in the bacterial NRP metallophore detection
  system, represented by the source lysine monooxygenase alignment. Members include mycobactin-type
  flavin-dependent lysine N6-monooxygenases supplying N-hydroxylysine for hydroxamate formation.
  The deposited model table gives a threshold, but its referenced Lys_monoox.hmm is absent from this
  release.
