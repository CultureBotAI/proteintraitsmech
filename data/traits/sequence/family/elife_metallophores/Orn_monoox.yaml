identifier: proteintraitsmech:ELIFE109154_Orn_monoox
label: Metallophore-associated ornithine N5-monooxygenase family
definition: Protein sequence family recognized by the Orn_monoox profile of the bacterial NRP metallophore
  detection system. Members include flavin-dependent ornithine N5-monooxygenases supplying N-hydroxyornithine
  for hydroxamate biosynthesis. Related chemistry also supplies non-metallophore products, so the
  cluster rule excludes nearby KtzT and MetRS-like hits; the profile alone is not specific evidence
  of metallophore production.
