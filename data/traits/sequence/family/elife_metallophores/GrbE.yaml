identifier: proteintraitsmech:ELIFE109154_GrbE
label: GrbE-type graminine biosynthesis protein family
definition: Protein sequence family recognized by the GrbE profile of the bacterial NRP metallophore
  detection system. Members include proteins implicated with GrbD in graminine diazeniumdiolate formation
  from arginine. The two profiles form a joint pathway marker, and neither an isolated sequence match
  nor the pathway assignment specifies the final metallophore's preferred metal.
