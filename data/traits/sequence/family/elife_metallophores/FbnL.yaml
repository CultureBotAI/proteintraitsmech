identifier: proteintraitsmech:ELIFE109154_FbnL
label: FbnL-type Dmaq biosynthesis peroxidase subunit family
definition: Protein sequence family recognized by the FbnL profile of the bacterial NRP metallophore
  detection system. Members include the FbnL component of a two-protein heme peroxidase that initiates
  biosynthesis of the Dmaq quinoline chelator by oxidizing L-tyrosine to L-DOPA. The partner FbnM
  is also required by the cluster detection rule; FbnL alone is not the complete enzyme.
