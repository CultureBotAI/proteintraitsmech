identifier: proteintraitsmech:ELIFE109154_VibH_like
label: VibH-like metallophore standalone condensation enzyme family
definition: Protein sequence family recognized by the VibH_like profile of the bacterial NRP metallophore
  detection system. Members include standalone condensation enzymes that attach 2,3-dihydroxybenzoyl
  groups to diamines or polyamines. This assembly marker can trigger detection without colocated
  chelator precursor biosynthesis genes and does not itself synthesize catechol.
