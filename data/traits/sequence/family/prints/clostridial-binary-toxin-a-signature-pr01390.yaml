identifier: PRINTS:PR01390
label: "Clostridial binary toxin A signature"
definition: >-
  A large group of bacterial exotoxins are referred to as "A/B toxins", essentially because they are formed from two subunits. The "A" subunit possesses enzyme activity, and is transferred to the host cell following a conformational change in the membrane-bound transport "B" subunit. Clostridial species are one of the major causes of food poisoning/gastro-intestinal illnesses. They are Gram-positive, spore-forming rods that occur naturally in the soil. Included in the family are: Clostridium botulinum, which produces one of the most potent toxins in existence; Clostridium tetani, causative agent of tetanus; and Clostridium perfringens, commonly found in wound infections and diarrhoea cases.
definition_source: "InterPro:IPR016013 abstract (PRINTS PR01390 is a member signature)"
