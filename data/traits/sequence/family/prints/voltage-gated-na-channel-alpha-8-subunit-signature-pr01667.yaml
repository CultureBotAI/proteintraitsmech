identifier: PRINTS:PR01667
label: "Voltage-gated Na+ channel alpha 8 subunit signature"
definition: >-
  Voltage-dependent sodium channels are transmembrane (TM) proteins responsible for the depolarising phase of the action potential in most electrically excitable cells. They may exist in 3 states: the resting state, where the channel is closed; the activated state, where the channel is open; and the inactivated state, where the channel is closed and refractory to opening. Several different structurally and functionally distinct isoforms are found in mammals, coded for by a multigene family, these being responsible for the different types of sodium ion currents found in excitable tissues. There are nine pore-forming alpha subunit of voltage-gated sodium channels consisting of four membrane-embedded homologous domains (I-IV), each consisting of six α-helical segments (S1-S6), three cytoplasmic loops connecting the domains, and a cytoplasmic C-terminal tail. The S6 segments of the four domains form the inner surface of the pore, while the S4 segments bear clusters of basic residues that constitute the channel's voltage sensors. Sodium channel protein type 8 subunit alpha (SCN8A) encodes the voltage-gated Na+ channel alpha 8 subunit and is strongly expressed in Purkinje cells. Sodium currents are known to generate the rising phase and the prolonged plateau phase of cerebellar purkinje cell action potentials. Experiments in mice with mutated SCN8A subunits suggest its involvement in the persistent sodium current responsible for the prolonged plateau phase. SCN8A is abundantly expressed throughout the CNS and in the spinal cord. Mutations in this protein have been related to a number of neurological disorders, including paralysis, ataxia and dystonia. This entry represents a conserved region found towards the N terminus of the protein, which defines the alpha 8 subunits and dis
