identifier: PRINTS:PR00147
label: "DNA photolyase signature"
definition: >-
  This entry represents the class1 cryptochrome/DNA photolyase family. Its members include cryptochromes, DNA photolyases and cryptochrome-DASH (Cry-DASH). The Cry-DASH family members have been shown to act as photolyases with high degree of specificity for cyclobutane pyrimidine dimers in ssDNA. This protein family also includes class3 Deoxyribodipyrimidine photo-lyase from Agrobacterium fabrum. The cryptochrome and photolyase families consist of structurally related flavin adenine dinucleotide (FAD) proteins that use the absorption of blue light to accomplish different tasks. The photolyasess use the blue light for light-driven electron transfer to repair UV-damaged DNA, while the cryptochromes are blue-light photoreceptors involved in the circadian clock for plants and animals. On the basis of the primary structure, the cryptochrome/DNA photolyase family can be grouped into two classes. The first class contains cryptochromes and DNA photolyases from eubacteria, archaea, fungi, animals and plants. The second class contains DNA photolyases from prokaryotes, plants and animals. Phylogenetically, the groups are further divided into the class I to class III cyclobutane pyrimidine dimer (CPD) photolyases, plant cryptochromes (CRYs), DASH CRYs, as wells as animal type I and II CRYs.
definition_source: "InterPro:IPR002081 abstract (PRINTS PR00147 is a member signature)"
