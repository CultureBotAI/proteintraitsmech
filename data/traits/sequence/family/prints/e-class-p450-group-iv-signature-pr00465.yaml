identifier: PRINTS:PR00465
label: "E-class P450 group IV signature"
definition: >-
  This entry represents class E cytochrome P450 proteins that fall into sequence cluster group IV. Group IV comprises the CYP7 (cholesterol 7-alpha-hydroxylase) and CYP51 (lanosterol 14-alpha-demethylase) families, which show significant sequence similarity even though there is no apparent functional resemblance. The CYP8 (prostacyclin synthase) family also falls into this group, and shows high sequence similarity to CYP7 members. Proteins required in the biosynthesis of fungal mycotoxins are also included: cytochrome P450 monooxygenases gloO and gloP from Glarea lozoyensis are required for synthesis of lipohexapeptides of the echinocandin family that prevent fungal cell wall formation by non-competitive inhibition of beta-1,3-glucan synthase. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and fatty acids. In bacteria, they are important for several metabolic processes, such as the biosynthesis of antibiotic erythromycin in Saccharopolyspora erythraea (Streptomyces erythraeus). Cytochrome P450 enzymes use haem to oxidise their substrates, using protons derived from NADH or NADPH to split the oxygen so a single atom can be added to a substrate. They also require electrons, which they receive from
