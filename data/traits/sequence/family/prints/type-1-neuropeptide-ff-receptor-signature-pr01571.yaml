identifier: PRINTS:PR01571
label: "Type 1 neuropeptide FF receptor signature"
definition: >-
  Neuropeptide FF receptors belong to a family of neuropeptides containing an RF-amide motif at their C terminus which have a high affinity for the pain modulatory peptide neuropeptide NPFF (NPFF). Neuropeptide FF (NPFF) receptors have two subtypes, neuropeptide FF receptor type 1 (NPFF1) and neuropeptide FF receptor type 2 (NPFF2), they are members of rhodopsin G protein-coupled receptor family. The neuropeptide FF is found at high concentrations in the posterior pituitary, spinal cord, hypothalamus and medulla and is believed to be involved in pain modulation, opioid tolerance, cardiovascular regulation, memory and neuroendocrine regulation. Comparing the distribution of NPFF1 and NPFF2 receptors in different species reveals important species differences. The NPFF1 receptor is broadly distributed in the central nervous system with the highest levels found in the limbic system and the hypothalamus, is thought to participate in neuroendocrine functions. Whereas as the NPFF2 receptor is present in high density, particularly in mammals in the superficial layers of the spinal cord where it is involved in nociception and modulation of opioid functions, consistent with a potential role of NPFF in the modulation of sensory inputs, like pain responses. This entry represents NPFF1 receptor, which is expressed at highest levels in the hypothalamus, with moderate expression in the thalamus, midbrain, medulla oblongata, testis and eye. NPFF1 receptor has been found to regulate adenylyl cyclase in some recombinant cell lines. It also couples with Gi protein to inhibit adenylyl cyclase (AC), and reduces the activities of cAMP-dependent protein kinase (PKA) and mitogen-activated protein kinase (MAPK) signaling cascade.
