identifier: PRINTS:PR00924
label: "Alphaherpesvirus alkaline exonuclease signature"
definition: >-
  This entry includes an alkaline nuclease (product of the UL98 gene) from herpesviruses. The nuclease acts as both an endo-and an exonuclease, and accepts both single-and double-stranded DNA as substrates. DNA is digested in the 5'->3' direction to produce 5'-monophosphate nucleosides. The nuclease activity results in the production of mature packaged unit-length linear progeny viral DNA molecules by processing non linear or branched viral DNA intermediates. This entry also includes Shutoff alkaline exonuclease.
definition_source: "InterPro:IPR001616 abstract (PRINTS PR00924 is a member signature)"
