identifier: PRINTS:PR01033
label: "Phytochrome signature"
definition: >-
  Phytochromes are a class of photoreceptor found in plants, bacteria and fungi, which are used to detect light. In plants, phytochromes mediate physiological and developmental responses to changes in red and far-red light conditions. The protein undergoes reversible photochemical conversion between a biologically-inactive red light-absorbing form and the active far-red light-absorbing form. Phytochrome is a dimer of identical 124kDa subunits, each of which contains a linear tetrapyrrole chromophore, covalently-attached via a Cys residue. In Arabidopsis thaliana, there are genes for at least five phytochrome proteins. These photoreceptors control such responses as germination, stem elongation, flowering, gene expression, and chloroplast and leaf development. It is not yet known which red light responses are controlled by which phytochrome species, or whether the different phytochromes have overlapping functions. Synechocystis sp. (strain PCC 6803) hypothetical protein slr0473 contains a domain similar to that of plants phytochrome and seems also to bind a chromophore.
