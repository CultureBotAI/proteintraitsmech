identifier: PRINTS:PR01707
label: "Rickettsia 56kDa type-specific antigen protein signature"
definition: >-
  There are several antigenic variants in Rickettsia tsutsugamushi, and a type-specific antigen (TSA) of 56-kilodaltons located on the rickettsial surface is responsible for the variation. TSA proteins are probably integral membrane proteins.
