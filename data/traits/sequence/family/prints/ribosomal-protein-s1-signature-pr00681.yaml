identifier: PRINTS:PR00681
label: "Ribosomal protein S1 signature"
definition: >-
  This entry includes small ribosomal subunit protein bS1 (RPS1) and related proteins, such as 4-hydroxy-3-methylbut-2-enyl diphosphate reductase (IspH) and general stress protein 13 (YugI) from Bacillus subtilis, which has an S1 domain and a conserved RNA binding surface. The bacterial RPS1 consists of 4-6 tandem S1 domains. In some bacteria, the tandem S1 array is located C-terminal to a 4-hydroxy-3-methylbut-2-enyl diphosphate reductase (HMBPP reductase) domain. While RPS1 is found primarily in bacteria, proteins with tandem RPS1-like domains have been identified in plants and humans, however these lack the N-terminal HMBPP reductase domain.
definition_source: "InterPro:IPR035104 abstract (PRINTS PR00681 is a member signature)"
