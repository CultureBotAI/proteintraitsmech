identifier: PRINTS:PR01266
label: "Alpha-class glutathione S-transferase signature"
definition: >-
  Glutathione S-transferases (GSTs) are soluble proteins with typical molecular masses of around 50kDa, each composed of two polypeptide subunits. GSTs catalyse the transfer of the tripeptide glutathione (gamma-glutamyl-cysteinyl-glycine; GSH) to a co-substrate (R-X) containing a reactive electrophillic centre to form a polar S-glutathionylated reaction product (R-SG). Each soluble GST is a dimer of approximately 26kDa subunits, typically forming a hydrophobic 50kDa protein with an isoelectric point in the pH range 4-5. The ability to form heterodimers greatly increases the diversity of the GSTs, but the functional significance of this mixing and matching of subunits has yet to be determined. Each GST subunit of the protein dimer contains an independent catalytic site composed of two components. The first is a binding site specific for GSH or a closely related homologue (the G site) formed from a conserved group of amino-acid residues in the amino-terminal domain of the polypeptide. The second component is a site that binds the hydrophobic substrate (the H site), which is much more structurally variable and is formed from residues in the carboxy-terminal domain. Between the two domains is a short variable linker region of 5-10 residues. The GST proteins have evolved by gene duplication to perform a range of functional roles. GSTs also have non-catalytic roles, binding flavonoid natural products in the cytosol prior to their deposition in the vacuole. Recent studies have also implicated GSTs as components of ultraviolet-inducible cell signalling pathways and as potential regulators of apoptosis. The mammalian GSTs active in drug metabolism are now classified into the alpha, mu and pi classes. Additional classes of GSTs have been identified in animals that do not have major
