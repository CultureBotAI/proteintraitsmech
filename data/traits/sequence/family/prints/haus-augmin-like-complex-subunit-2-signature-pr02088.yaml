identifier: PRINTS:PR02088
label: "HAUS augmin-like complex subunit 2 signature"
definition: >-
  Assembly of a robust microtubule-based mitotic spindle is essential for accurate segregation of chromosomes to progeny. Spindle assembly relies on the concerted action of centrosomes, spindle microtubules, molecular motors and non-motor spindle proteins. A number of novel regulators of spindle assembly have been identified: one of these is HAUS, an 8-subunit protein complex that shares similarity with Drosophila Augmin. HAUS augmin-like complex subunit 2 is a component of the HAUS augmin-like complex, which localises to the centrosomes and interacts with the gamma-tubulin ring complex (gamma-TuRC). The interaction between augmin and gamm-TuRC is important for spindle microtubule generation and affects the mitotic progression and cytokinesis. HAUS2 may also increase the tension between spindle and kinetochore allowing for chromosome segregation during mitosis.
definition_source: "InterPro:IPR026242 abstract (PRINTS PR02088 is a member signature)"
