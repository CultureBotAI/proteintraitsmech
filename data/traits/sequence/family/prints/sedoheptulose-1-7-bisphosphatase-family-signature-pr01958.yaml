identifier: PRINTS:PR01958
label: "Sedoheptulose-1,7-bisphosphatase family signature"
definition: >-
  This entry represents sedoheptulose-1,7-bisphosphatase. Sedoheptulose- 1,7-bisphosphate is involved in carbohydrate biosynthesis, catalysing the production of sedoheptulose 7-phosphate and phosphate from sedoheptulose- 1,7-bisphosphate and water. The enzyme shares a high degree of similarity with fructose-1,6-bisphosphatases, but it does not contain the regulatory motif present in the latter. This entry also includes a group of fructose-1,6-bisphosphatases with a higher degree of similarity to sedoheptulose-1,7-bisphosphatase than to other fructose-1,6-bisphosphatases.
