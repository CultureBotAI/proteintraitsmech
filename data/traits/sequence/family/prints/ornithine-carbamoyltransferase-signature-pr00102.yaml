identifier: PRINTS:PR00102
label: "Ornithine carbamoyltransferase signature"
definition: >-
  The ornithine carbamoyltransferases are a family of enzymes that catalyse the production of citrulline from carbamoyl-phosphate and ornithine. This reaction is part of the arginine biosynthetic pathway, and in some organisms the reaction is also part of the arginine deaminase pathway. In most prokaryotes, and some lower eukaryotes, the enzyme is found in the cytoplasm, but in higher eukaryotes, such as mammals, the enzyme is found in the mitochondrial matrix and functions as part of the urea cycle. In most organisms analysed to date, the enzyme has been shown to consist of a trimer of identical or nonidentical subunits. Extensive similarity has been found within the ornithine carbamoyltransferase family, some of the conserved areas being important in catalysis. The C-terminal region of these enzymes contains a highly conserved Cys residue (in a His-Cys-Lys-Pro motif) implicated in ornithine binding. Putrescine carbamoyltransferase converts carbamoyl putrescine to carbamoyl phosphate and putrescine as part of the agamtine deiminase pathway. It is closely related the the ornithine carbamoyltransferases that function in the arginine deiminase pathway.
