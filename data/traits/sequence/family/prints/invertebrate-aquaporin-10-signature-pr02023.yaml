identifier: PRINTS:PR02023
label: "Invertebrate aquaporin-10 signature"
definition: >-
  Aquaporin channels facilitate the transport of water, glycerol, and other small solutes across cell membranes. Eight canonical aquaporin-encoding genes (aqp) are present in the genome of Caenorhabditis elegans. This entry represents a putative aquaporin-10 protein from C. elegans and other invertebrates. It is orthologous to human aqp-11 and aqp-12.
