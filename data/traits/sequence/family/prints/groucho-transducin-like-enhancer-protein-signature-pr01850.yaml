identifier: PRINTS:PR01850
label: "Groucho/transducin-like enhancer protein signature"
definition: >-
  The Groucho (Gro)/transducin-like enhancers (TLE) are a family of evolutionarily conserved corepressor proteins that play a critical role in diverse developmental and cellular pathways, including lateral inhibition, segmentation, sex determination, dorsal/ventral pattern formation, terminal pattern formation, and eye development.
