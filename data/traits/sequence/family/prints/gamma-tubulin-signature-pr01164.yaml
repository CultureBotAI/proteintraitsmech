identifier: PRINTS:PR01164
label: "Gamma-tubulin signature"
definition: >-
  Gamma-tubulins constitute a ubiquitous and highly-conserved subfamily of the tubulin family. Gamma is a low abundance protein present within the cells in both various types of microtubule-organizing centers and cytoplasmic protein complexes. The protein recruits the alpha/beta-tubulin dimers that form the minus ends of microtubules and is found at microtubule organising centres (MTOC) such as the spindle poles or the centrosome, suggesting that it is involved in the microtubule nucleation. It exists in two main protein complexes: gamma-tubulin ring complexes (gamma-TuRCs) and the the gamma-tubulin small complex (gamma-TuSC).
definition_source: "InterPro:IPR002454 abstract (PRINTS PR01164 is a member signature)"
