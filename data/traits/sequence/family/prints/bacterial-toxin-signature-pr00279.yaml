identifier: PRINTS:PR00279
label: "Bacterial toxin signature"
definition: >-
  Staphylococcal enterotoxins and streptococcal pyrogenic exotoxins belong to a family of related toxins that share the ability to bind to the major histocompatibility complex proteins of their hosts. A more distant relative of the family is the Staphylococcus aureus toxic shock syndrome toxin, which shares only a low level of sequence similarity with this group.
