identifier: PRINTS:PR01337
label: "Type III secretion system outer membrane G protein family signature"
definition: >-
  Secretion of virulence factors in Gram-negative bacteria involves transportation of the protein across two membranes to reach the cell exterior. There have been four secretion systems described in animal enteropathogens such as Salmonella and Yersinia, with further sequence similarities in plant pathogens like Ralstonia and Erwinia. The type III secretion system is of great interest, as it is used to transport virulence factors from the pathogen directly into the host cell and is only triggered when the bacterium comes into close contact with the host. The protein subunits of the system are very similar to those of bacterial flagellar biosynthesis. However, while the latter forms a ring structure to allow secretion of flagellin and is an integral part of the flagellum itself, type III subunits in the outer membrane translocate secreted proteins through a channel-like structure. The structure core of this system consists of the needle complex, a continuous channel formed by the highly oligomerized inner and outer membrane hollow rings and a polymerized helical needle filament which spans through and projects into the infected host cell. This family aids in the structural assembly of the invasion complex. Another characteristic of this family is its ability to form a channel through the outer bacterial membrane, allowing secretion to take place. Members include the Salmonella InvG and SpiA gene, the Shigella MxiD, and the Yersinia Kim5 and YscC proteins. Plant pathogen members include the Hypersensitivity Response (HR) genes of Burkholderia and Erwinia.
