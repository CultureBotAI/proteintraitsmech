identifier: PRINTS:PR00632
label: "Sonic hedgehog protein signature"
definition: >-
  Hedgehog proteins are a family of secreted signal molecules required for embryonic cell differentiation. They are synthesised as inactive precursors with an N-terminal signalling domain linked to a C-terminal autoprocessing domain. The three-dimensional structure of the autolytic domain of the hedgehog protein of shows similarity with the β-strand core of intein splicing domains. It has hence been termed the hint (Hedgehog/Intein) domain. The activated hedgehog protein is involved in segment polarity and cell to cell communication, and plays important roles in both early embryogenesis and metamorphosis. The protein is expressed in embryo stripes, and in several groups of cells belonging to the foregut, hindgut and various other unidentified tissues. Maximum expression is seen in embryos 6-12 hours after fertilisation, and in pupae 1-24 hours after puparium formation.
definition_source: "InterPro:IPR001657 abstract (PRINTS PR00632 is a member signature)"
