identifier: PRINTS:PR00488
label: "Five-lipoxygenase activating protein signature"
definition: >-
  5-lipoxygenase-activating protein (FLAP) is an integral membrane protein found in cells that produce leukotrienes, the biologically active metabolites of arachidonic acid that have been implicated in a variety of inflammatory responses, including asthma, arthritis and psoriasis. FLAP appears to activatate 5-lipoxygenase (5LOX) by facilitating its binding to membranes. It binds arachidonic acid, and may play a role in its transfer to 5LOX. The protein has been shown to bind to MK-886, a compound that blocks leukotriene biosynthesis.
definition_source: "InterPro:IPR001446 abstract (PRINTS PR00488 is a member signature)"
