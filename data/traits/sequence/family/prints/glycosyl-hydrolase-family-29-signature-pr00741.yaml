identifier: PRINTS:PR00741
label: "Glycosyl hydrolase family 29 signature"
definition: >-
  O-Glycosyl hydrolases family 29 ( ) encompasses alpha-L-fucosidases ( ), which is a lysosomal enzyme responsible for hydrolysing the alpha-1,6-linked fucose joined to the reducing-end N-acetylglucosamine of the carbohydrate moieties of glycoproteins. Alpha-L-fucosidase is responsible for hydrolysing the alpha-1,6-linked fucose joined to the reducing-end N-acetylglucosamine of the carbohydrate moieties of glycoproteins. Fucosylated glycoconjugates are involved in numerous biological events, making alpha-l-fucosidases, the enzymes responsible for their processing, critically important. Deficiency in alpha-l-fucosidase activity is associated with fucosidosis, a lysosomal storage disorder characterised by rapid neurodegeneration, resulting in severe mental and motor deterioration. The enzyme is a hexamer and displays a two-domain fold, composed of a catalytic (β/α)(8)-like domain and a C-terminal β-sandwich domain. Drosophila melanogaster spermatozoa contains an alpha-l-fucosidase that might be involved in fertilisation by interacting with alpha-l-fucose residues on the micropyle of the eggshell. In human sperm, membrane-associated alpha-l-fucosidase is stable for extended periods of time, which is made possible by membrane domains and compartmentalisation. These help preserve protein integrity. This entry represents a subgroup of alpha-L-fucosidases found in metazoa, fungi and bacteria.
