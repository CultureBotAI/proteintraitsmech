identifier: PRINTS:PR00795
label: "Ryanodine receptor signature"
definition: >-
  Ryanodine receptors are involved in communication between transverse-tubules and the sarcoplamic reticulum of cardiac and skeletal muscle. The proteins function as a Ca 2+ -release channels following depolarisation of transverse-tubules. The function is modulated by Ca 2+, Mg2+, ATP and calmodulin. Deficiency in the ryanodine receptor may be the cause of malignant hyperthermia (MH) and of central core disease of muscle (CCD). MH is an autosomal dominant disorder of skeletal muscle and is a principal cause of death due to anaesthesia. Calcium release activity of the receptors resides in the C-terminal region of the protein, the remaining part of the molecule forming a 'foot' structure that spans the junctional gap between the sarcoplamic reticulum and the transverse-tubule. The foot structure may interact with the cytoplasmic region of the dihydropyridine receptor. Analysis of the sequence reveals 10 potential transmembrane (TM) regions in the C-terminal fifth of the molecule and 2 further potential TM regions nearer to the centre. These may contribute to the formation of the Ca 2+ conducting pore. The rest of the sequence is hydrophilic, and presumably constitutes the cytoplasmic domain of the protein.
definition_source: "InterPro:IPR013333 abstract (PRINTS PR00795 is a member signature)"
