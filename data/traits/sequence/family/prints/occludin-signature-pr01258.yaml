identifier: PRINTS:PR01258
label: "Occludin signature"
definition: >-
  Occludin was the first molecular component of the tight junction to be identified. These are specialised membrane domains that form intercellular contacts between epithelial cells and create a regulated barrier to the paracellular movement of water, solutes and immune cells. They also provide a second type of barrier that contributes to cell polarity by restricting the lateral diffusion of lipids and proteins within cell membranes. Occludin is an ~65kDa type II integral membrane protein, which has been shown to have four transmembrane (TM) domains, two extracellular loops and cytoplasmic N- and C-termini. The extracellular loops are chemically quite distinctive, particularly the first, which has an unusually high content of tyrosine and glycine residues (~65%) that alternate along the sequence. Gene knockout experiments have suggested occludin is an accessory, rather than principal, structural component of tight junctions, since occludin-deficient cells are still able to form tight junctions when cultured in vitro.
definition_source: "InterPro:IPR002958 abstract (PRINTS PR01258 is a member signature)"
