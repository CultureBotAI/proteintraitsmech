identifier: PRINTS:PR00940
label: "Cation-transporting P-type ATPase A signature"
definition: >-
  P-ATPases (also known as E1-E2 ATPases) (EC:7.2.2.6) are found in bacteria and in a number of eukaryotic plasma membranes and organelles. P-ATPases function to transport a variety of different compounds, including ions and phospholipids, across a membrane using ATP hydrolysis for energy. There are many different classes of P-ATPases, which transport specific types of ion: H +, Na +, K +, Mg 2+, Ca 2+, Ag + and Ag 2+, Zn 2+, Co 2+, Pb 2+, Ni 2+, Cd 2+, Cu + and Cu 2+. P-ATPases can be composed of one or two polypeptides, and can usually assume two main conformations called E1 and E2. This entry represents cation-transporting P-type ATPase A (CtpA) and B (CtpB), which are bacterial proteins that belong to the IB subfamily of P-type ATPases. CtpA has been identified as a copper-exporting P-type ATPase.
definition_source: "InterPro:IPR000579 abstract (PRINTS PR00940 is a member signature)"
