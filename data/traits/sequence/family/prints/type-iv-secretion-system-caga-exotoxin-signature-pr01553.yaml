identifier: PRINTS:PR01553
label: "Type IV secretion system CagA exotoxin signature"
definition: >-
  Helicobacter pylori makes use of a type IV secretion system similar in mechanism to the conjugation machine of Agrobacterium tumefaciens. These machines secrete three different types of substrate: DNA conjugation intermediates, as in A. tumefaciens; multimeric proteins such as the pertussis toxin of Bordetella pertussis; and the CagA protein of H. pylori. CagA has been linked to the more severe forms of gastric ulcers and duodenal cancers. Both CagA and the secretion system apparatus are encoded in the large pathogenicity island, termed cag, possessed by the malignant disease-causing type I bacterial strains. The CagA exotoxin is encoded in the last portion of the island, and mutants lacking the gene fail to induce IL-8 secretion, and to activate NF-kappa-B in vivo. CagA is believed to have a similar function to EPEC type III secreted effectors; both are tyrosine-phosphorylated once translocated into the target cell, and allow engulfment by the host via rearrangement of the actin cytoskeleton.
definition_source: "InterPro:IPR004355 abstract (PRINTS PR01553 is a member signature)"
