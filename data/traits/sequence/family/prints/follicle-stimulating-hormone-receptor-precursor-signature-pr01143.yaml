identifier: PRINTS:PR01143
label: "Follicle stimulating hormone receptor precursor signature"
definition: >-
  Glycoprotein hormone receptors are members the rhodopsin-like G-protein coupled receptor (GPCR) family. They function as receptors for the pituitary hormones thyrotropin (TSH receptor), follitropin (FSH receptor) and lutropin (LH receptor). In mammals the LH receptor is also the receptor for the placental hormone, human chorionic gonadotropin (hCG), so is denominated as a lutropin-choriogonadotropic hormone receptor (LHCG receptor). The receptors share close sequence similarity, and are characterised by large extracellular domains believed to be involved in hormone binding via leucine-rich repeats (LRR). In females, the follicle-stimulating hormone acts on the ovaries, promoting development of follicles and is the principal hormone regulating secretion of oestrogens. In males, it is responsible for the integrity of the seminiferous tubules and acts on Sertoli cells to support gametogenesis. FSH is used clinically to treat infertility in females and for some types of spermatogenesis in males. The follicle-stimulating hormone receptor (FSH receptor or FSHR), which this entry represents, is a transmembrane receptor that interacts with the follicle-stimulating hormone. The activation of the FSH receptor is necessary for the hormonal functioning of FSH. The receptor is found in ovary and testis, and its predominant effector pathway being via activation of adenylyl cyclase through G proteins.
