identifier: PRINTS:PR00066
label: "Xeroderma pigmentosum group G protein signature"
definition: >-
  This entry represents XPG (ERCC-5, also known as Rad2 in budding yeast, AtRAD2 or UVH3 in Arabidopsis and Rad13 in fission yeast), a single-stranded structure-specific DNA endonuclease, which cleaves single-stranded DNA during nucleotide excision repair to excise damaged DNA. It makes the 3' incision in DNA nucleotide excision repair (NER); it binds and bends DNA repair bubble substrate and breaks base stacking at the single-strand/double-strand DNA junction of the DNA bubble. XPG is required for DNA replication fork maintenance and preservation of genomic stability. It is involved in homologous recombination repair (HRR) induced by DNA replication stress by recruiting RAD51, BRCA2, and PALB2 to the damaged DNA site. During HRR, binds to the replication fork with high specificity and stabilizes it and upstream of HRR, it promotes the release of BRCA1 from DNA. In Saccharomyces cerevisiae, Rad2 forms the Nucleotide Excision Repair Factor 3 (NEF3) complex with a subset of subunits of the transcription factor TFIIH. Besides DNA damage repair, it is also required for efficient transcription.
