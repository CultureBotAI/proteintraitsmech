identifier: PRINTS:PR01410
label: "Cytochrome c-type biogenesis protein signature"
definition: >-
  Within mitochondria and bacteria, a family of related proteins is involved in the assembly of periplasmic c-type cytochromes: these include CycK, CcmF, NrfE and CcbS. These proteins may play a role in guidance of apocytochromes and haem groups for their covalent linkage by the cytochrome-c-haem lyase. Members of the family are probably integral membrane proteins, with up to 16 predicted transmembrane (TM) helices.
definition_source: "InterPro:IPR003567 abstract (PRINTS PR01410 is a member signature)"
