identifier: PRINTS:PR00600
label: "Protein phosphatase PP2A 55kDa regulatory subunit signature"
definition: >-
  Protein phosphatase 2A (PP2A) is a serine/threonine phosphatase implicated in many cellular processes, including the regulation of metabolic enzymes and proteins involved in signal transduction. PP2A is a trimer composed of a 36kDa catalytic subunit, a 65kDa regulatory subunit (subunit A) and a variable third subunit (subunit B). Subunits B can be classified into three subfamilies, the R2/B/PR55/B55, the R3/B''/PR72/PR130/PR59 and the R5/B'/B56 families.
