identifier: PRINTS:PR01122
label: "Flavin-containing monooxygenase (FMO) 2 signature"
definition: >-
  Flavin-containing monooxygenases (FMOs) constitute a family of xenobiotic- metabolising enzymes. Using an NADPH cofactor and FAD prosthetic group, these microsomal proteins catalyse the oxygenation of nucleophilic nitrogen, sulphur, phosphorous and selenium atoms in a range of structurally diverse compounds. Five mammalian forms of FMO are now known and have been designated FMO1-FMO5. Cavia porcellus (Guinea pig) and Oryctolagus cuniculus (Rabbit) both express two variants of 'lung' FMO, observed as three distinct phenotypes based on mobility differences in SDS-PAGE. The coding regions of the guinea pig variants differ at only two positions, both of which result in amino acid substitutions. Similarly, the nucleotide and amino acid sequences of the rabbit variants differ at only two positions. The amino sequence contains putative FAD- (GxGxxG) and NADP + - binding (GxGxxA) sites, a 'FATGY' motif that has also been observed in a range of siderphore biosynthetic enzymes, and a C-terminal hydrophobic segment that is believed to anchor the monooxygenase to the microsomal membrane. The activities of the enzymes are characteristic of the lung FMO, and the mobilities of the expressed enzymes are the same as those observed for the variants present in guinea pig pulmonary microsomal preparations. Both rabbit and guinea pig lung FMO are associated with a single gene. Rabbit lung FMO exists in tight association with the calcium-binding protein, calreticulin. It is thought that complexation of calreticulin with rabbit lung FMO could account for some of the unusual physical properties of this FMO enzyme form.
