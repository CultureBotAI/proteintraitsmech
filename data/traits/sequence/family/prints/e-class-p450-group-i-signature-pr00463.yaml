identifier: PRINTS:PR00463
label: "E-class P450 group I signature"
definition: >-
  This entry represents class E cytochrome P450 proteins that fall into sequence cluster group I. Group I is richest in members, consisting of cytochrome P450 families CYP1, CYP2, CYP17, CYP21 and CYP71. The members of the first four families are of vertebrate origin, while those from CYP71 are derived from plants. CYP1 and CYP2 enzymes mainly metabolise exogenous substrates, whereas CYP17 and CYP21 are involved in metabolism of endogenous physiologically-active compounds. In the fungus Gibberella, P450 (FUS8) is a component in the biosynthetic pathway for the mycotoxin fusarin C. FUS8 oxidizes carbon C-20 of the intermediate 20-hydroxy-fusarin to form the penultimate intermediate carboxy-fusarin C. This entry also includes cytochromes P450 (Noroxomaritidine synthases and p-coumarate 3-hydroxylase) that catalyse an intramolecular para-para' C-C phenol coupling of 4'-O-methylnorbelladine in alkaloids biosynthesis, during the biosynthesis of phenylpropanoids and Amaryllidaceae alkaloids including haemanthamine- and crinamine-type alkaloids, promising anticancer agents. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and fatty acids. In bacteria, they are important for several metabolic processes, su
