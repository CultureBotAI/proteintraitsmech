identifier: PRINTS:PR00690
label: "Adhesin family signature"
definition: >-
  The Streptococcus pneumoniae psaA gene encodes a protein with significant similarity to previously-reported Streptococcal proteins, SsaB (80% similarity) and FimA (92.3% similarity), from Streptococcus sanguis and Streptococcus parasanguis. These homologues are associated with bacterial adhesion. PsaA is part of the ATP-binding cassette (ABC) transport system PsaABC involved in manganese import. It binds manganese with high affinity and specificity and delivers it to the membrane permease for translocation into the cytoplasm. PsaA also acts as an adhesin which is involved on adherence to extracellular matrix being an important factor in pathogenesis and infection. The SsaB protein has a putative hydrophobic 19-amino-acid signal sequence yielding a 32,620-Mr secreted protein. SsaB is hydrophilic and appears not to have a hydrophobic membrane anchor in its C-terminal region. A high degree of similarity exists between S. sanguis ssaB and type 1 fimbrial genes. Comparison of the gene products reveals close similarity of the two proteins. It is thought that ssaB adhesion may play a role in oral colonisation by binding either to a receptor on saliva or to a receptor on Actinomyces. This family includes adhesins and related periplasmic binding proteins.
