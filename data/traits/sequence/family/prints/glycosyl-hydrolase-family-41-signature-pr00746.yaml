identifier: PRINTS:PR00746
label: "Glycosyl hydrolase family 41 signature"
definition: >-
  O-Glycosyl hydrolases ( EC:3.2.1. ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Family 41 encompasses cytokinin-beta-glucosidases. These enzymes hydrolyse cytokinin glucosides, liberating free cytokinins and contribute to root- inducing activity.
definition_source: "InterPro:IPR006065 abstract (PRINTS PR00746 is a member signature)"
