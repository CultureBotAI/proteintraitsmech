identifier: PRINTS:PR01753
label: "Streptococcus streptokinase protein signature"
definition: >-
  Streptokinase (SK) can be found in several species of Streptococci. It can bind not only plasminogen, but also host fibrinogen. This close interaction with the human fibrinolytic system allows the microbe to acquire unregulatable cell-surface enzymatic activity, promoting further spread from the site of infection. The complexes formed between streptococcal cells, streptokinase, plasminogen and fibrinogen can lyse fibrin clots in the host. Streptokinase has been used to treat acute myocardial infarction.
definition_source: "InterPro:IPR008124 abstract (PRINTS PR01753 is a member signature)"
