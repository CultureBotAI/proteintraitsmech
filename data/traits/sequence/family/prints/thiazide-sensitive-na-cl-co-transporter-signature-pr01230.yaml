identifier: PRINTS:PR01230
label: "Thiazide-sensitive Na-Cl co-transporter signature"
definition: >-
  Solute carrier family 12 member 3 (Slc12a3) is also known as Tsc (thiazide-sensitive Na-Cl co-transporter). Tsc is a large integral membrane protein (~1000 amino acids) that mediates the coupled transport of Na + and Cl - in an electrically silent manner. In the mammalian kidney, it is the dominant mechanism mediating Cl - absorption in the early distal tubule, and here it is the target of the widely-used thiazide class of diuretic drugs. It is also known to be present in the urinary bladder of the winter flounder (Pseudopleuronectes americanus), from where the gene encoding it was initially cloned. Hydrophobicity analysis predicts the Na-Cl co-transporter to have 12 transmembrane (TM) domains and comparisons with other cloned ion co-transporters reveals that a superfamily of electroneutral cation-chloride co-transporters exists, which includes the K-Cl co-transporters (InterPro:IPR000076) and the Na-K-Cl co-transporters (InterPro:IPR002443). All share a similar predicted membrane topology in a central hydrophobic domain, together with hydrophilic N- and C-termini that are likely cytoplasmic. Mutations in the thiazide-sensitive Na-Cl co-transporter have been found that give rise to Gitelman's variant of Bartter's syndrome, an inherited kidney disease characterised by hypokalaemic alkalosis.
definition_source: "InterPro:IPR002948 abstract (PRINTS PR01230 is a member signature)"
