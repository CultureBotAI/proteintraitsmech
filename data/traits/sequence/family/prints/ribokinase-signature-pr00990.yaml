identifier: PRINTS:PR00990
label: "Ribokinase signature"
definition: >-
  Ribokinases participate in the first step of ribose metabolism, and are members of the superfamily of carbohydrate kinases. Ribokinases phosphorylate ribose to ribose-5-phosphate in the presence of ATP and magnesium: ATP + D-Ribose = ADP + D-Ribose-5-Phosphate The phosphorylated sugar may then enter the pentose phosphate pathway. There are indications that the phosphorylated sugar may also be used in the synthesis of amino acids (histidine and tryptophan). Further, links to mammalian adenosine kinase have been identified, through sequence similarity, suggesting possible homology. This family also includes fructokinases. Fructokinase may be involved in a sugar-sensing pathway in plants. Other proteins included in this entry are: cytidine kinase from Thermococcus kodakarensis, Sulfofructose kinase from Escherichia coli, Pseudouridine kinase from Arabidopsis thaliana, deoxyribokinase and MJ0406 ( ) from Methanocaldococcus jannaschii. MJ0406 was previously annotated as a 6-phosphofructokinases (PFK), but has since been characterised as a functional nucleoside kinase.
definition_source: "InterPro:IPR002139 abstract (PRINTS PR00990 is a member signature)"
