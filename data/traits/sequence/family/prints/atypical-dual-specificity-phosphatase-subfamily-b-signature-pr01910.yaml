identifier: PRINTS:PR01910
label: "Atypical dual specificity phosphatase subfamily B signature"
definition: >-
  Dual specificity phosphatases (DUSPs) are members of the superfamily of protein tyrosine phosphatases. They remove the phosphate group from both phospho-tyrosine and phospho-serine/threonine residues. They are structurally similar to tyrosine-specific phosphatases but with a shallower active site cleft and a distinctive active site signature motif, HCxxGxxR. They are characterised as VHR- or Cdc25-like. In general, DUSPs are classified into the following subgroups: Slingshot phosphatases Phosphatase of regenerating liver (PRL) Cdc14 phosphatases Phosphatase and tensin homologue deleted on chromosome 10 (PTEN)-like and myotubularin phosphatases Mitogen-activated protein kinase phosphatases (MKPs) Atypical DUSPs The atypical DUSPs share a high degree of similarity with the MKP subgroup, but lack the N-terminal regulatory domain, which provides the substrate specificity towards the MAP kinases. These atypical-DUSPs form a heterogeneous group and have in common the presence of a single catalytic PTP domain. VHR was the first characterised member of this subfamily; its crystal structure is known. The function of many atypical DUSPs remains unknown, although some have been related to regulation of MAP kinase pathways. VHR has also been related to the control of cell-senescence. This entry also includes DUSP1 which does not belong to the atypical DUSP family.
