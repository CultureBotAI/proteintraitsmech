identifier: PRINTS:PR00131
label: "Glycosyl hydrolase family 1 signature"
definition: >-
  O-Glycosyl hydrolases ( EC:3.2.1. ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 1 CAZy:GH1 comprises enzymes with a number of known activities; beta-glucosidase ( EC:3.2.1.21 ); beta-galactosidase ( EC:3.2.1.23 ); 6-phospho-beta-galactosidase ( EC:3.2.1.85 ); 6-phospho-beta-glucosidase ( EC:3.2.1.86 ); lactase-phlorizin hydrolase ( EC:3.2.1.62 ), ( EC:3.2.1.108 ); beta-mannosidase ( EC:3.2.1.25 ); myrosinase ( EC:3.2.1.147 ).
definition_source: "InterPro:IPR001360 abstract (PRINTS PR00131 is a member signature)"
