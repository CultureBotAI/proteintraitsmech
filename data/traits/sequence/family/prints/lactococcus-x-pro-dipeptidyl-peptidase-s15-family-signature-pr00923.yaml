identifier: PRINTS:PR00923
label: "Lactococcus X-Pro dipeptidyl-peptidase (S15) family signature"
definition: >-
  Proteolytic enzymes that exploit serine in their catalytic activity are ubiquitous, being found in viruses, bacteria and eukaryotes. They include a wide range of peptidase activity, including exopeptidase, endopeptidase, oligopeptidase and omega-peptidase activity. Many families of serine protease have been identified, these being grouped into clans on the basis of structural similarity and other functional evidence. Structures are known for members of the clans and the structures indicate that some appear to be totally unrelated, suggesting different evolutionary origins for the serine peptidases. Not withstanding their different evolutionary origins, there are similarities in the reaction mechanisms of several peptidases. Chymotrypsin, subtilisin and carboxypeptidase C have a catalytic triad of serine, aspartate and histidine in common: serine acts as a nucleophile, aspartate as an electrophile, and histidine as a base. The geometric orientations of the catalytic residues are similar between families, despite different protein folds. The linear arrangements of the catalytic residues commonly reflect clan relationships. For example the catalytic triad in the chymotrypsin clan (PA) is ordered HDS, but is ordered DHS in the subtilisin clan (SB) and SDH in the carboxypeptidase clan (SC). This family of sequences are serine peptidases belonging to MEROPS peptidase family S15 (clan SC). The type example is X-Pro dipeptidyl-peptidase of Lactococcus lactis. These proteins, which have similar specificity to mammalian dipeptidyl-peptidase IV, cleave Xaa-Pro releasing N-terminal dipeptides. The penultimate residue must be proline. In L. lactis the proteins exist as cytoplasmic homodimers.
