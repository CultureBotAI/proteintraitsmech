identifier: PRINTS:PR02005
label: "Insulin-like growth factor I signature"
definition: >-
  The IGFs, or somatomedins, play a key role in pre-adolescent mammalian growth. IGFI expression is regulated by growth hormone and mediates post-natal growth. Defects in IGF1 are the cause of insulin-like growth factor I deficiency (IGF1 deficiency), an autosomal recessive disorder characterised by growth retardation, sensorineural deafness and mental retardation. The insulin/IGF/relaxin superfamily is an ancient family of functionally diverse proteins. The 3D structures of a number of family members have been determined. The fold comprises two polypeptide chains (A and B) linked by two disulphide bonds: all share a conserved arrangement of four cysteines in their A chain, the first of which is linked by a disulfide bond to the third, while the second and fourth are linked by interchain disulfide bonds to cysteines in the B chain. This family includes: Insulin and insulin-like proteins Relaxin and prorelaxin Insect prothoracicotropic hormone (bombyxin) Insulin-like growth factors (IGF1 and IGF2) Mammalian Leydig cell-specific insulin-like peptide (gene INSL3) Invertebrates insulin-related peptides (IRPs)
