identifier: PRINTS:PR02001
label: "GCR1-cAMP receptor family signature"
definition: >-
  Heterotrimeric G protein-mediated signalling via activated 7-transmembrane (7TM) serpentine receptors is well known in a range of organisms, but evidence for the existence of this pathway in plants has been elusive. Over the years, however, evidence that G proteins are involved in signal transduction in plants has been accumulating, leading several researchers to seek plant 7TM receptors. The first tangible evidence for a plant 7TM receptor came through an analysis of the expresssed sequence tag database, dbEST. This revealed an Arabidopsis thaliana gene (GCR1) that encodes a protein with 7 predicted TM domains, and other features characteristic of known 7TM receptors. The amino acid sequence of GCR1, however, is unusual in that it shows similarity to receptors from three different 7TM families, sharing greatest levels of similarity with the Dictyostelium cAMP receptors. It has been suggested that the cAMP receptors coordinate aggregation of individual cells into a multicellular organism, and regulate the expression of a large number of developmentally-regulated genes.
definition_source: "InterPro:IPR022343 abstract (PRINTS PR02001 is a member signature)"
