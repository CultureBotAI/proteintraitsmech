identifier: PRINTS:PR00084
label: "Mannitol dehydrogenase signature"
definition: >-
  Mannitol dehydrogenases catalyse the NAD-dependent reduction of mannitol-1-phosphates as part of the phosphoenolpyruvate-dependent phosphotransferase system (PTS). The PTS facilitates the vectorial translocation of metabolisable carbohydrates to form the corresponding sugar phosphates, which are then converted to glycolytic intermediates. Mannitol 2-dehydrogenase catalyses the NAD-dependent reduction of mannitol to fructose. Several dehydrogenases have been shown to be evolutionary related, including mannitol-1-phosphate 5-dehydrogenase ( EC:1.1.1.17 ) (gene mtlD), mannitol 2-dehydrogenase ( EC:1.1.1.67 ) (gene mtlK); mannonate oxidoreductase ( EC:1.1.1.57 ) (fructuronate reductase) (gene uxuB); Escherichia coli hypothetical proteins ydfI and yeiQ; and yeast hypothetical protein YEL070w.
definition_source: "InterPro:IPR000669 abstract (PRINTS PR00084 is a member signature)"
