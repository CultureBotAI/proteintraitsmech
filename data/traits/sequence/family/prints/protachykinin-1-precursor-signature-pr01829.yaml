identifier: PRINTS:PR01829
label: "Protachykinin 1 precursor signature"
definition: >-
  Tachykinins are a group of biologically active peptides which excite neurons, evoke behavioral responses, are potent vasodilatators, and contract (directly or indirectly) many smooth muscles. This family includes the precursors that are enzymatically converted to their mature forms. Tachykinins are from ten to twelve residues long.
