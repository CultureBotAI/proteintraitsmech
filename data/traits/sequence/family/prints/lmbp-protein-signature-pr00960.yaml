identifier: PRINTS:PR00960
label: "LmbP protein signature"
definition: >-
  This entry includes D-glycero-alpha-D-manno-heptose 7-phosphate kinase (HddA) from Mycobacterium tuberculosis and its orthologue L-fucokinase/L-fucose-1-P guanylyltransferase (FKP) from Bacteroides fragilis. HddA catalyses the phosphorylation of D-glycero-alpha-D-manno-heptose 7-phosphate at the C-1 position to form D-glycero-alpha-D-manno-heptose 1,7-bisphosphate. FKP is a bifunctional enzyme involved in the salvage pathway of GDP-fucose synthesis. It catalyses two successive reactions, the ATP-dependent phosphorylation of L-fucose to L-fucose 1-phosphate, and its guanylylation to GDP-L-fucose. GDP-fucose is an important fucose donor in the process of fucosylated oligosaccharides formation.
definition_source: "InterPro:IPR001174 abstract (PRINTS PR00960 is a member signature)"
