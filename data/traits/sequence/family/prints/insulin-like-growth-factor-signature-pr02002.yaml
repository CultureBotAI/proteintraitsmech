identifier: PRINTS:PR02002
label: "Insulin-like growth factor signature"
definition: >-
  This entry represents insulin-like growth factors, IGF-1/2, found in animals. IGF-1 and IGF-2 are peptide hormones structurally similar to insulin and play essential roles in growth and development. Both IGFs bind to IGF receptors, primarily IGF-1R, activating intracellular signaling pathways that regulate cell survival, differentiation, and protein synthesis. IGF levels are influenced by age, nutrition, and hormonal regulation, contributing to tissue maintenance and metabolic processes throughout life. The insulin/IGF/relaxin superfamily is an ancient family of functionally diverse proteins. The 3D structures of a number of family members have been determined. The fold comprises two polypeptide chains (A and B) linked by two disulphide bonds: all share a conserved arrangement of four cysteines in their A chain, the first of which is linked by a disulfide bond to the third, while the second and fourth are linked by interchain disulfide bonds to cysteines in the B chain. This family includes: Insulin and insulin-like proteins Relaxin and prorelaxin Insect prothoracicotropic hormone (bombyxin) Insulin-like growth factors (IGF1 and IGF2) Mammalian Leydig cell-specific insulin-like peptide (gene INSL3) Invertebrates insulin-related peptides (IRPs)
