identifier: PRINTS:PR01738
label: "RNA binding motif protein 8 family signature"
definition: >-
  RNA-binding motif protein 8 (RBM8), also termed binder of OVCA1-1 (BOV-1) or RNA-binding protein Y14, is one of the components of the exon-exon junction complex (EJC). It has two isoforms, RBM8A and RBM8B, both of which are identical except that RBM8B is 16 amino acids shorter at its N terminus. Three-dimensional modelling of the RBM8 RRM domain indicates that the sequences fold into an RNA-binding domain, forming a hydrophobic core between a β-sheet and two helices. The human RBM8A protein is ubiquitously expressed; the protein is localised predominantly in the cell nucleus and diffused throughout the cytoplasm. It preferentially associates with mRNAs produced by splicing, including both nuclear mRNAs and newly exported cytoplasmic mRNAs. Evidence suggests the protein remains associated with spliced mRNAs as a tag to indicate the position of spliced introns. Human RBM8A protein specifically binds to MAGOH, the human homologue of Drosophila mago nashi, a protein required for normal germ plasm development in the Drosophila embryo; a similar association occurs with the Drosophila RBM8 protein, Tsunagi.
definition_source: "InterPro:IPR008111 abstract (PRINTS PR01738 is a member signature)"
