identifier: PRINTS:PR00815
label: "Pi haemoglobin signature"
definition: >-
  This entry represents the pi-haemoglobin subunit, which is the counterpart of the alpha chain in the major early embryonic hemoglobin P. Pi is expressed during development only in the primitive erythrocyte lineage and not in the definitive lineage in chicken. In vertebrates, hemoglobins (Hb) function to transport oxygen in blood plasma. Hb binds oxygen in the reduced [Fe(II)] state. Hb is composed of four globins in a tetrahedral arrangement, typically two alpha and two beta globins, where each monomer binds a heme group. The alpha and beta subunits are highly similar in sequence, but differ structurally in that the beta subunit contains an α-helix (the D helix) that is missing in the alpha subunit. There is at least one heme-site ligand on each of the alpha and beta subunits. The imidazole ring of the 'proximal' His residue provides the fifth heme iron ligand; the other axial heme iron position remains essentially free for oxygen coordination. The binding of oxygen and carbon dioxide is associated with a variation of the heme iron coordination. Oxygen binding results in a transition from high-spin to low-spin iron, with accompanying changes in the Fe-N bond lengths and coordination geometry. In Hb, these subtle changes lead to the well-known cooperative effect of oxygen binding, which involves a relaxed (R) state when oxygen is bound and a tense (T) state upon oxygen release. The alpha or beta subunits are substituted in embryo and foetal Hb with subunits that have higher oxygen affinity (gamma, delta, epsilon, pi or zeta subunits). There are at least three types of human embryonic Hb (zeta2epsilon2, alpha2epsilon2, zeta2gamma2) and two foetal Hb (alpha2gamma2, alpha2delta2). It has been hypothesised that the embryonic alpha-hemoglobin family diverged considerably earl
