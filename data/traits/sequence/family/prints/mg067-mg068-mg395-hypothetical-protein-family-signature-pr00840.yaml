identifier: PRINTS:PR00840
label: "MG067/MG068/MG395 hypothetical protein family signature"
definition: >-
  Mycoplasma genitalium has the smallest known genome of any free-living organism. Its complete genome sequence has been determined by whole genome random sequencing and assembly. Only 470 putative coding regions were identified, including genes for DNA replication, transcription and translation, DNA repair, cellular transport and energy metabolism. One family of hypothetical proteins, which includes products of the MG067/MG068/MG395 genes, has been shown to have homologues of similarly unknown function in Mycoplasma pneumoniae.
definition_source: "InterPro:IPR022381 abstract (PRINTS PR00840 is a member signature)"
