identifier: PRINTS:PR00425
label: "Bradykinin receptor signature"
definition: >-
  Bradykinins are a family of short, structurally similar peptides that activate sensory fibres, contract venous smooth muscle, stimulate release of cytokines, induce connective tissue proliferation and mediate endothelium-dependent vasodilation. Bradykinin antagonists are used in the treatment of inflammation, asthma, mild pain and endotoxic shock. Bradykinin receptors are members of the seven transmembrane, rhodopsin-like G-protein coupled receptor family and are widespread in peripheral tissues. There are two bradykinins receptor subtypes: B1 and B2. It has also been proposed there could be further subtypes of the bradykinin receptor, including a tracheal B3 receptor but these, as yet have not been confirmed. This entry represents the bradykinin receptor family.
definition_source: "InterPro:IPR000496 abstract (PRINTS PR00425 is a member signature)"
