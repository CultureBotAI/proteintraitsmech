identifier: PRINTS:PR01782
label: "Mycobacterial cell entry (MCE) protein signature"
definition: >-
  The members of this family represent the protein products of all 24 genes associated with the four mammalian cell entry operons of Mycobacterium tuberculosis and their homologues in other Actinomycetales, including Lipoprotein LprN from M.tuberculosis. LprN stimulates the host (mouse) immune response. Previously sensitised mice infected with this bacteria have an exacerbated disease response, suggesting this lipoprotein may down-regulate the host's immune response. Mycobacterial species are usually slender, curved rods with a unique cell wall of complex waxes and glycolipids. They are resistant to acids, alkalis and dehydration, and are very slow to grow in vitro. The human pathogenic Mycobacteria (Mycobacterium tuberculosis and Mycobacterium leprae) are becoming resistant to conventional treatments and, together with HIV-related diseases, are fast posing a global health threat. An essential requirement, particularly of M. tuberculosis, is to gain entrance to, and to resist, the hostile intra-cellular environment of epithelial cells. The genome of M. tuberculosis contains four mammalian cell entry (mce) operons, which are widely distributed in both pathogenic and non-pathogenic mycobacteria suggesting that the presence of these putative virulence genes is not an indicator for the pathogenicity of the bacilli. At the 5' end of the transcriptional unit are two genes that have evolved from a tandem duplication, and whose products resemble YrbE, a conserved hypothetical protein found in Escherichia coli, Haemophilus influenzae and Porphyra purpurea. All of the YrbE proteins, including the eight from M. tuberculosis, are probable integral membrane proteins with six TM α helices. The next six genes in each operon, the mce genes, are related, their products ranging in size fro
