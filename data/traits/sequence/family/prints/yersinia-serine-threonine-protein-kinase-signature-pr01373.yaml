identifier: PRINTS:PR01373
label: "Yersinia serine/threonine protein kinase signature"
definition: >-
  YpkA is a serine/threonine kinase secreted by Yersinia spp. via the type III secretion system. The type III secretion system is found in Gram-negative animal enteropathogens such as Salmonella and Yersinia, as well as plant pathogens including Ralstonia and Erwinia, and is used to transport virulence factors directly into host cells upon close contact with the bacterium. Unlike the structurally related flagellar biosynthesis system, type III secretion translocates proteins through a channel-like structure in the outer membrane, and notably, the secreted effectors lack a conventional secretion signal. YpkA causes autophosphorylation of host cell components and has been suggested to interfere with signal transduction in the target cell, although the precise targets remain unknown.
