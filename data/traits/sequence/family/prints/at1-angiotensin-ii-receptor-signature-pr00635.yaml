identifier: PRINTS:PR00635
label: "AT1 angiotensin II receptor signature"
definition: >-
  Angiotensin II is a blood-borne hormone produced in the circulation, it is also formed in many tissues such as the brain, kidney, heart, and blood vessels, where angiotensin II functions as a paracrine and autocrine hormone. The known actions of angiotensin II are mediated through two angiotensin receptor subtypes, Angiotensin II receptor 1 and angiotensin II receptor 2, which are members of the seven transmembrane rhodopsin-like G-protein coupled receptor family. These subtypes are important in the renin-angiotensin system, as they are responsible for the signal transduction of the vasoconstricting stimulus of the main effector hormone, angiotensin II. They also stimulate increased fluid intake and regulate the neuroendocrine system. This entry represents the angiotensin II receptor type 1 (AT1) receptor, it is the major subtype of the angiotensin family and are found in blood vessels, other smooth muscles e.g., the uterus and bladder, and endocrine glands. It is also present in the kidney, liver and on presynaptic nerve terminals, where they potentiate release of noradrenaline. The AT1 receptor mediates the major cardiovascular effects of angiotensin II, which include vasoconstriction and aldosterone secretion. It is an important effector controlling blood pressure and volume in the cardiovascular system. Angiotensin II receptor antagonists are drugs indicated for hypertension, diabetic nephropathy and congestive heart failure. The signal transduction mechanisms of AT1 receptor depends on at least five different effectors: phospholipase C, voltage-dependent Ca2+ channels, phospholipase D, phospholipase A2 and adenylate cyclase. It has also been demonstrated that AT1 stimulates the phosphorylation of several tyrosine-containing proteins such as mitogen-activated protei
