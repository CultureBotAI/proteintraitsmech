identifier: PRINTS:PR00896
label: "Vasopressin receptor signature"
definition: >-
  Vasopressin and oxytocin are members of the neurohypophyseal hormone family found in all mammalian species. They are present in high levels in the posterior pituitary. Vasopressin has an essential role in the control of the water content of the body, acting in the kidney to increase water and sodium absorption. In higher concentrations, vasopressin stimulates contraction of vascular smooth muscle, stimulates glycogen breakdown in the liver, induces platelet activation, and evokes release of corticotrophin from the anterior pituitary. Vasopressin and its analogues are used clinically to treat diabetes insipidus. Oxytocin stimulates contraction of uterine smooth muscle, and stimulates milk secretion in response to suckling by inducing contraction of myoepithelial cells in the mammary gland. Clinically, it is used to induce labour and promote lactation. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. The term clan can be used to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include rhodopsin-like GPCRs (Class A, GPCRA), secretin-like GPCRs (Class B, GPCRB), metabotropic glutamate receptor family (Class C, GPCRC), fungal mating pheromone receptors (Class D, GPCRD), cAMP receptors (Class E, GPCRE) and frizzled/smoothened (Class F, GPCRF). GPCRs are major drug targets, and are consequently the subject of considerable research interest. It has been
