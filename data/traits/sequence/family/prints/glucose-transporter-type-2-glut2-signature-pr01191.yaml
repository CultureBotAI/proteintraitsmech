identifier: PRINTS:PR01191
label: "Glucose transporter type 2 (GLUT2) signature"
definition: >-
  The ability to transport glucose across the plasma membrane is a feature common to nearly all cells, from simple bacteria through to highly specialised mammalian neurones. Facilitative sugar transport is mediated by members of the GLUT transporter family, which form an aqueous pore across the membrane through which sugars can move in a passive (i.e., energy-independent) manner; in consequence, they can only transport sugars down their concentration gradient. The GLUT family of glycosylated transmembrane proteins are predicted to span the membrane 12 times with both amino-and carboxyl-termini located in the cytosol. On the basis of sequence homology and structural similarity, three subclasses of sugar transporters have been defined: Class I (GLUTs 1-4) are glucose transporters; Class II (GLUTs 5, 7, 9 and 11) are fructose transporters; and Class III (GLUTs 6, 8, 10, 12 and HMIT1) are structurally atypical members of the GLUT family, which are poorly defined at present, indeed GLUT6 may only be a pseudo-gene. The confirmed isoforms are expressed in a tissue and cell-specific manner, and exhibit distinct kinetic and regulatory properties, presumably reflecting their specific functional roles. They belong to a much larger 'major facilitator superfamily' of 12 TM transporters that are involved in the transport of a variety of hexoses and other carbon compounds, and include: bacterial sugar-proton symporters (H + /xylose and H + /arabinose); bacterial transporters of carboxylic acids and antibiotics; and sugar transporters in various yeast, protozoa and higher plants. Nevertheless, amino acid identity within the superfamily may be as low as ~25%. Besides the 12 presumed TM domains, the most characteristic structural feature of the superfamily is a five residue motif (RXGRR, w
