identifier: PRINTS:PR01613
label: "Escherichia coli P pili tip fibrillum PapF protein signature"
definition: >-
  The Gram-negative pathogen Escherichia coli causes several common bacterial illnesses in humans, including diarrhoea, neonatal meningitis, and urinary tract infections. Attachment to host tissues is essential for successful invasion, requiring interaction between a bacterial adhesive protein and its target receptor. Fimbrial adapter PapF is typically supported on a larger structure composed of heteropolymeric fibres. Pyelonephritogenic E. coli invade the uroepithelium by expressing between 100 and 300 pili on their cell surface, which are macromolecular structures that mediate binding to a digalactoside receptor in the urinary tract. P pili, or fimbriae, are approximately 68 Angstroms in diameter and 1 micron in length, the bulk of which comprises a fibre composed of the main structural protein PapA. At its tip, the pilus is terminated by a fibrillum consisting of repeating units of the PapE protein, topped by the adhesins PapF and PapG, both required for receptor binding. The tip fibrillum is anchored to the main PapA fibre by the PapK pilus-adaptor protein, while PapH, an outer membrane protein, anchors the entire rod within the bacterial envelope. A cytoplasmic chaperone, PapD, assists in assembling the monomers of the macromolecule in the membrane. In addition to its role in virulence and binding of uropathogenic E. coli, PapF functions as an adaptor protein joining the distal end of the tip fibrillum to the main PapG adherence factor. By providing a complementary binding surface for both PapE and PapG, PapF enables rapid completion of pilus assembly. This entry also includes minor fimbrial protein PrsF.
