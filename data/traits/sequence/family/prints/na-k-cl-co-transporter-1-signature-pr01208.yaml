identifier: PRINTS:PR01208
label: "Na-K-Cl co-transporter 1 signature"
definition: >-
  The K+Cl- cotransporters (KCCs) constitute a branch of the electroneutral cation-coupled chloride cotransporter family SLC12 (Solute carrier family 12). The other branch of the SLC12 family is composed of the Na+-coupled chloride cotransporters, generally called N(K)CCs, that following the driving force imposed by the Na+:K+:ATPase translocate ions from the outside to the inside of the cell, thus having similar important roles as the KCCs in many physiological aspects, but in the opposite direction. The Na-K-Cl co-transporters are a family of integral membrane proteins that are ubiquitously expressed in animal tissues, serving a variety of functions. In cells of Cl - absorptive and Cl - secretory epithelia, Na-K-Cl co-transport serves as the major Cl - entry pathway, and functions in concert with other membrane ion channels and pumps to carry out net transepithelial movement of salt. This vectorial transport of Cl - across epithelia is involved in the reabsorption of salt in the vertebrate kidney (which is crucial for urinary concentration), and in the secretion of salt in such tissues as the mammalian intestine and trachea. In addition, Na-K-Cl co-transport is known to play a role in cell volume regulation in most mammalian cell types. The proteins mediate the coupled, electroneutral transport of sodium, potassium and chloride ions across the plasma membrane of cells (with a stoichiometry of 1:1:2, respectively). Co-transport of all three ions is obligatory, since absence of one is sufficient to prevent ion movement. Their transport activity does not alter the cell's membrane potential, thus the driving force for the transport is determined solely by the chemical gradients of the three transported ions; hence, under normal physiological conditions, the direction will b
