identifier: PRINTS:PR02053
label: "BRISC complex subunit Abro1 signature"
definition: >-
  This entry represents the Abraxas 2 protein. Members of protein family FAM175 include the BRCA1-A complex subunit Abraxas 1, BRISC complex subunit Abraxas 2 or Abro1 (Abraxas brother protein 1), and uncharacterised plant proteins. It is thought that BRCA1-A complex subunit Abraxas acts as a central scaffold protein responsible for assembling the various components of the BRCA1-A complex, and mediates recruitment of BRCA1. Similarly, Abro1 probably acts as a scaffold facilitating assembly of the various components of BRISC - the protein does not interact with BRCA1, but binds polyubiquitin. The primary sequences of these proteins contain an MPN-like domain.
definition_source: "InterPro:IPR023240 abstract (PRINTS PR02053 is a member signature)"
