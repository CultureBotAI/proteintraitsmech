identifier: PRINTS:PR01404
label: "DATP pyrophosphohydrolase signature"
definition: >-
  Dihydroneopterin triphosphate diphosphatase is a Nudix domain containing enzyme involved in folate biosynthesis. It catalyses the hydrolysis of dihydroneopterin triphosphate to dihydroneopterin monophosphate and pyrophosphate. It can also hydrolyse nucleoside triphosphates with a preference for dATP.
