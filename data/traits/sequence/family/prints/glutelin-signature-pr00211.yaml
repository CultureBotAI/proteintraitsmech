identifier: PRINTS:PR00211
label: "Glutelin signature"
definition: >-
  Glutelins are major storage proteins that aggregate in protein bodies in the endosperm of Zea mays (Maize). They comprise the second largest protein fraction in Maize endosperm (zeins being the largest), and show sequence similarities to other cereal storage proteins, such as gliadins, glutenins, hordeins, etc. Glutelins have a well-defined structure, including an N-terminal region containing varying numbers of repeats of the sequence PPPHVL; a Gln rich region that can be separated into 2 domains; and a Cys rich C-terminal domain that shows some regions of internal similarity. Glutelins have been shown to exhibit structural similarity to other cereal storage proteins, including a beta-reverse turn region which forms a loose helix-like domain.
definition_source: "InterPro:IPR000480 abstract (PRINTS PR00211 is a member signature)"
