identifier: PRINTS:PR00838
label: "Venom allergen 5 signature"
definition: >-
  Allergies are hypersensitivity reactions of the immune system to specific substances called allergens (such as pollen, stings, drugs, or food) that, in most people, result in no symptoms. A nomenclature system has been established for antigens (allergens) that cause IgE-mediated atopic allergies in humans [WHO/IUIS Allergen Nomenclature Subcommittee King T.P., Hoffmann D., Loewenstein H., Marsh D.G., Platts-Mills T.A.E., Thomas W. Bull. World Health Organ. 72:797-806(1994)]. This nomenclature system is defined by a designation that is composed of the first three letters of the genus; a space; the first letter of the species name; a space and an arabic number. In the event that two species names have identical designations, they are discriminated from one another by adding one or more letters (as necessary) to each species designation. The allergens in this family include allergens with the following designations: Dol m 5, Pol d 5, Pol e 5, Pol f 5, Sol i 3, Sol r 3, Ves c 5,Ves f 5, Ves g 5, Ves m 5, Ves p 5, Ves s 5, Ves v 5, Ves vi 5 and Vesp m 5. Venom allergen 5 (Ves 5) is a major allergen of vespid wasp venom. Regions of conservation have been identified that are shared both by a family of proteins from human, mouse and rat testis, and by a class of pathogenesis-related proteins from Nicotiana tabacum (Common tobacco) and Solanum lycopersicum (Tomato) (Lycopersicon esculentum) leaves. Ves 5 also shares similarity with the Solenopsis invicta (Red imported fire ant) 3 allergen.
