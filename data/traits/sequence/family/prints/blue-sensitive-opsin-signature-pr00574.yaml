identifier: PRINTS:PR00574
label: "Blue-sensitive opsin signature"
definition: >-
  Opsins are the photoreceptors of animal retinas: vertebrate rhodopsin is found in rod cells and mediates scotopic vision; red, green and blue opsins are found in cone cells and mediate photopic vision. Blue-sensitive opsin has an absorption maximum at 420nm. The ratio of blue cones to rods is ~1:200. Deficiency in blue opsin results in tritanopia colour blindness.
definition_source: "InterPro:IPR001521 abstract (PRINTS PR00574 is a member signature)"
