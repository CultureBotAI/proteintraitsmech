identifier: PRINTS:PR00483
label: "Bacterial acid phosphatase class A signature"
definition: >-
  This group represents nonspecific acid phosphatases, class A. Non-specific acid phosphatases are bacterial enzymes that catalyse the dephosphorylation of orthophosphoric monoesters to alcohol and phosphate, in addition to being able to catalyse transphosphorylation. As their name suggests, they show broad specificity, being able to phosphorylate a wide range of hydroxy compounds. During active catalysis, an activated phospho-enzyme intermediate is formed that is able to transfer its phosphate group to water, glucose or inosine. Nonspecific acid phosphatases share a conserved active site with mammalian glucose-6-phosphatases (G6Pase).
definition_source: "InterPro:IPR001011 abstract (PRINTS PR00483 is a member signature)"
