identifier: PRINTS:PR00738
label: "Glycosyl hydrolase family 20 signature"
definition: >-
  This entry represents beta-hexosaminidase. There are 3 forms of beta-hexosaminidase: hexosaminidase A is a trimer, with one alpha, one beta-A and one beta-B chain; hexosaminidase B is a tetramer of two beta-A and two beta-B chains; and hexosaminidase S is a homodimer of alpha chains. The two beta chains are derived from the cleavage of a precursor. Glycoside hydrolase family 20 (CAZy:GH20) comprises enzymes with several known activities; beta-hexosaminidase (EC:3.2.1.52); lacto-N-biosidase (EC:3.2.1.140); beta-1,6-N-acetylglucosaminidase); and beta-6-SO3-N-acetylglucosaminidase. Carbonyl oxygen of the C-2 acetamido group of the substrate acts as the catalytic nucleophile/base in this family of enzymes.
definition_source: "InterPro:IPR025705 abstract (PRINTS PR00738 is a member signature)"
