identifier: PRINTS:PR01289
label: "Peroxisome proliferator-activated receptor alpha signature"
definition: >-
  Peroxisome proliferator-activated receptors (PPAR) are ligand-activated transcription factors that belong to the nuclear hormone receptor superfamily. Three subtypes of this receptor have been discovered: PPAR alpha, beta and gamma. They control a variety of target genes involved in lipid homeostasis, diabetes and cancer. PPAR-alpha is a regulator of lipid metabolism. It modulates the activities of all three fatty acid oxidation systems, namely mitochondrial and peroxisomal beta-oxidation and microsomal omega-oxidation. Oleoylethanolamide (OEA), a naturally occurring lipid that regulates feeding and body weight, has been shown to bind with high affinity to PPAR-alpha. Steroid or nuclear hormone receptors (NRs) constitute an important superfamily of transcription regulators that are involved in widely diverse physiological functions, including control of embryonic development, cell differentiation and homeostasis. Members of the superfamily include the steroid hormone receptors and receptors for thyroid hormone, retinoids, 1,25-dihydroxy-vitamin D3 and a variety of other ligands. The proteins function as dimeric molecules in nuclei to regulate the transcription of target genes in a ligand-responsive manner. In addition to C-terminal ligand-binding domains, these nuclear receptors contain a highly-conserved, N-terminal zinc-finger that mediates specific binding to target DNA sequences, termed ligand-responsive elements. In the absence of ligand, steroid hormone receptors are thought to be weakly associated with nuclear components; hormone binding greatly increases receptor affinity. NRs are extremely important in medical research, a large number of them being implicated in diseases such as cancer, diabetes, hormone resistance syndromes, etc. While several NRs act as ligan
