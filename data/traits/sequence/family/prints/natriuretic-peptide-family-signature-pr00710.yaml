identifier: PRINTS:PR00710
label: "Natriuretic peptide family signature"
definition: >-
  Atrial natriuretic peptides (ANPs) are vertebrate hormones that play an important role in the control of cardiovascular homeostatis, and sodium and water balance in general. There are different NPs that vary in length but share a common core. All are processed from a single precursor. A disulphide bond resident in the C-terminal section is required for full activity of atriopeptins. The family of NPs includes structurally-related peptides that elicit similar pharmacological spectra. Amongst these are brain natriuretic peptide (BNP); C-type natriuretic peptide (CNP); ventricular natriuretic peptide (VNP); and green mamba natriuretic peptide (DNP).
definition_source: "InterPro:IPR000663 abstract (PRINTS PR00710 is a member signature)"
