identifier: PRINTS:PR01420
label: "Galanin 3 receptor signature"
definition: >-
  Galanin is involved in a variety of physiological mechanisms and disease states, from appetite and neuroregeneration to seizures and pain. The actions of galanin are mediated through interaction with specific membrane receptors. Three receptor subtypes have been identified; Galanin receptor 1 (GALR1), Galanin receptor 2 (GALR2) and Galanin receptor 3 (GAL3), all of which are rhodopsin-like GPCRs. They differ from one another in terms of their expression patterns, affinity for various peptide analogues and G protein-coupling specificity. In signaling, all can act via the Gi/o class, whilst GAL2 also has Gq/11 as a major signaling route. This entry represents galanin receptor 3 subtype, which is expressed abundantly in the periphery and at lower levels in the CNS. In the brain, the highest levels have been found in the hypothalamus and pituitary. Expression has also been detected in peripheral tissues, including the pancreas, liver, kidney, stomach, adrenal gland, lung and spleen.
definition_source: "InterPro:IPR003908 abstract (PRINTS PR01420 is a member signature)"
