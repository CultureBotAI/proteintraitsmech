identifier: PRINTS:PR02079
label: "Probable serine/threonine-protein kinase GDT family signature"
definition: >-
  The life-cycle of Dictyostelium consists of two distinct phases: growth and development. The control of the growth-differentiation transition (GDT) is not fully understood, and only a handful of genes involved in the process have been elucidated. Amongst these is a family containing at least 9 closely related genes, of which gdt1 and gdt2 were the first members to be identified. It is thought that the different family members may control similar cellular processes, but respond to different environmental cues. The gdt1 and gdt2 gene products, GDT1 and GDT2, are similar in many ways, but there are important differences. GDT1 is a 175kDa protein with 4 putative transmembrane (TM) domains. The C-terminal amino acid sequence shares some similarity with the catalytic domain of protein kinases; while this domain is well conserved in GDT2, it is thought to be non-functional in GDT1. Similar observations have been made for other family members: hence, for example, GDT3 and GDT4 encode complete well conserved kinase domains, and are therefore probably functional; conversely, GDT6 and GDT8 appear to encode proteins with degenerate protein kinase domains; and the C-terminal sequence of GDT5 seems unrelated to protein kinases, while GDT7 appears to be truncated, and stops before the protein kinase domain.
definition_source: "InterPro:IPR026237 abstract (PRINTS PR02079 is a member signature)"
