identifier: PRINTS:PR00051
label: "Bacterial chromosomal replication initiator (DNAA) signature"
definition: >-
  The bacterial DnaA protein plays an important role in initiating and regulating chromosomal replication. DnaA is an ATP- and DNA-binding protein. It binds specifically to 9 bp nucleotide repeats known as dnaA boxes which are found in the chromosome origin of replication (oriC). DnaA contains two conserved regions: the first is located in the N-terminal half and corresponds to the ATP-binding domain, the second is located in the C-terminal half and could be involved in DNA-binding. The protein may also bind the RNA polymerase beta subunit, the dnaB and dnaZ proteins, and the groE gene products (chaperonins). This entry represents the chromosomal replication control initiator DnaA, as well as the DnaA homologue Hda, which is also involved in chromosomal replication control.
