identifier: PRINTS:PR00575
label: "Red/green-sensitive opsin signature"
definition: >-
  Opsins are the photoreceptors of animal retinas. Vertebrate rhodopsin is found in rod cells and mediates scotopic vision; red, green and blue opsins are found in cone cells and mediate photopic vision. Red-sensitive opsin has an absorption maximum at 560nm; its deficiency results in protanopia colour blindness. Green-sensitive opsin has an absorption maximum at 530nm; its deficiency results in deuteranopia colour blindness. The ratio of green and red cones to rods is ~1:30.
definition_source: "InterPro:IPR000378 abstract (PRINTS PR00575 is a member signature)"
