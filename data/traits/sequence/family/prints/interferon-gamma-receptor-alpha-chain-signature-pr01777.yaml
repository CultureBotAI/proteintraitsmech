identifier: PRINTS:PR01777
label: "Interferon-gamma receptor alpha chain signature"
definition: >-
  Interferon (INF)-gamma is a dimeric glycoprotein produced by activated T cells and natural killer cells. Although originally isolated based on its antiviral activity, INF-gamma also displays powerful anti-proliferative and immuno-modulatory activities, which are essential for developing appropriate cellular defences against a variety of infectious agents. The first step in eliciting these responses is the specific high affinity interaction of INF-gamma with its cell-surface receptor (INF-gammaRalpha); the complex then interacts with at least one of a family of additional species-specific accessory factors (AF-1 or INF-gammabeta), which convey different cellular responses. One such response is the association and phosphorylation of two protein tyrosine kinases (Jak-1 and Jak-2), which in turn stimulate nuclear transcription activators. The human INF-gammaR, is a member of the hematopoietic cytokine receptor superfamily. It is expressed in a membrane-bound form in many cell types, and is over-expressed in tumour cells. It comprises an extracellular portion of 229 residues, a single transmembrane region, and a cytoplasmic domain of 221 residues. As with other members of its superfamily, the cytokine-binding sites are formed by a small set of closely-spaced surface loops that extend from a β-sheet core, much like antigen-binding sites on antibodies. The extracellular INF-gammaR monomer comprises two domains (domain D1 from residue 14-102, and domain D2 from residue 114-221), each resembling an Ig fold with fibronectin type III topology. This entry refers to the interferon gamma receptor alpha subunit, also known as interferon gamma receptor 1.
