identifier: PRINTS:PR01931
label: "Interleukin-16 signature"
definition: >-
  This entry represents human interleukin-16 (IL-16) and similar sequences mainly found in mammals and aves. Interleukins (IL) are a group of cytokines that play an important role in the immune system. They modulate inflammation and immunity by regulating growth, mobility and differentiation of lymphoid and other cells. Interleukin-16 (IL-16, also known as Pro-interleukin-16 or Lymphocyte chemoattractant factor) is a proinflammatory cytokine that signals via CD4, inducing chemotactic and immunomodulatory responses of CD4+ lymphocytes, monocytes and eosinophils. The cytokine has been implicated in the exacerbation of a number of infectious, immune-mediated and autoimmune inflammatory disorders, including atopic dermatitis, irritable bowel syndrome, systemic lupus erythematosus, neurodegenerative disorders, and viral infections.
definition_source: "InterPro:IPR020450 abstract (PRINTS PR01931 is a member signature)"
