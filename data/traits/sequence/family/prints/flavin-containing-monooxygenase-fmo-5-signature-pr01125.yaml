identifier: PRINTS:PR01125
label: "Flavin-containing monooxygenase (FMO) 5 signature"
definition: >-
  Flavin-containing monooxygenases (FMOs) constitute a family of xenobiotic-metabolising enzymes. Using an NADPH cofactor and FAD prosthetic group, these microsomal proteins catalyse the oxygenation of nucleophilic nitrogen, sulphur, phosphorous and selenium atoms in a range of structurally diverse compounds. Five mammalian forms of FMO are now known and have been designated FMO1-FMO5. The deduced amino acid sequence of human FM05 includes the putative FAD-(GxGxxG) and NADP + pyrophosphate-binding (GxGxxA) sites characteristic of mammalian FMOs, a 'FATGY' motif that has also been observed in a range of siderphore biosynthetic enzymes, and a C-terminal hydrophobic segment that is believed to anchor the monooxygenase to the microsomal membrane. Human and guinea pig FMO5, like other FMOs, are encoded by multiple transcripts. FMO5 has been identified in livers of adult humans, rabbits and guinea pigs, and foetal livers of humans. Neither the human nor guinea pig enzyme effectively catalyse the metabolism of methimazole, a general FMO substrate; however, both are active with n-octylamine. The responses to detergent, ions and elevated temperature are all similar to those observed in rabbit FMO5, suggesting that these properties are species- independent and that this form of FMO is not readily classified as a drug- metabolising enzyme.
