identifier: PRINTS:PR00764
label: "Complement C9 signature"
definition: >-
  Complement component C9 is a multi-domain protein that contains an N-terminal type-1 TSP domain, an LDL-receptor class A repeat, a number of potential transmembrane (TM) regions and a C-terminal EGF-like domain. Hydropathy analysis of the sequence indicates the N-terminal half of C9 to be predominantly hydrophilic in character, while the C-terminal section is more hydrophobic. The amphipathic organisation of the primary structure is consistent with the known potential of polymerised C9 to penetrate lipid bilayers, causing the formation of transmembrane channels
definition_source: "InterPro:IPR001862 abstract (PRINTS PR00764 is a member signature)"
