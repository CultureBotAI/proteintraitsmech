identifier: PRINTS:PR01055
label: "Metabotropic glutamate receptor 5 signature"
definition: >-
  The mRNA for GRM5 is widespread in the brain, with a unique distribution; it is found in high levels in the striatum, cerebral cortex, hippocampus and olfactory bulb. GRM5 activates the phosphoinositide pathway. It plays an important role in the regulation of synaptic plasticity and the modulation of the neural network activity. Like GRM1 [InterPro:IPR001256], it is a potential therapeutic target for several diseases with a similar structure to this seen in the entire GPCR superfamily. The metabotropic glutamate receptors are functionally and pharmacologically distinct from the ionotropic glutamate receptors. They are coupled to G-proteins and stimulate the inositol phosphate/Ca 2+ intracellular signalling pathway. At least eight sub-types of metabotropic receptor (GRM1-8) have been identified in cloning studies. The sub-types differ in their agonist pharmacology and signal transduction pathways. GPCR family 3 receptors (also known as family C) are structurally similar to other GPCRs, but do not show any significant sequence similarity and thus represent a distinct group. Structurally they are composed of four elements; an N-terminal signal sequence; a large hydrophilic extracellular agonist-binding region containing several conserved cysteine residues which could be involved in disulphide bonds; a shorter region containing seven transmembrane domains; and a C-terminal cytoplasmic domain of variable length. Family 3 members include the metabotropic glutamate receptors, the extracellular calcium-sensing receptors, the gamma-amino-butyric acid (GABA) type B receptors, and the vomeronasal type-2 receptors. As these receptors regulate many important physiological processes they are potentially promising targets for drug development. G protein-coupled receptors (GPCRs) const
