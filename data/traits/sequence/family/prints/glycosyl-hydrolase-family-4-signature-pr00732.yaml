identifier: PRINTS:PR00732
label: "Glycosyl hydrolase family 4 signature"
definition: >-
  O-Glycosyl hydrolases ( EC:3.2.1. ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 4 ( CAZy:GH4 ) is a protein family that comprises enzymes with several known activities; 6-phospho-beta-glucosidase ( EC:3.2.1.86 ); 6-phospho-alpha-glucosidase ( EC:3.2.1.122 ); alpha-galactosidase ( EC:3.2.1.22 ). These enzymes require both NAD(H) and divalent metal (such asMn2+, Fe2+, Co2+, or Ni2+) for its activity.
definition_source: "InterPro:IPR001088 abstract (PRINTS PR00732 is a member signature)"
