identifier: PRINTS:PR00813
label: "Bacterial general secretion pathway protein G signature"
definition: >-
  The general (type II) secretion pathway (GSP) within Gram-negative bacteria is a signal sequence-dependent process responsible for protein export, including virulence factors. The process has two stages, exoproteins are first translocated across the inner membrane by the general signal-dependent export pathway (GEP), and then across the outer membrane by a species-specific accessory mechanism. One of the proteins involved in the GSP is termed general secretion pathway protein G (GSPG). This protein shares several sequence similarities with bacterial fimbrial protein, or pilin, the major structural protein of pili. Pili are polar flexible filamentous adhesions ~2500 nm in length, and diameter ~5.4 nm. Fimbrial and GSPG proteins share the following characteristics; a methylated, hydrophobic N-terminal residue; a hydrophobic leader peptide of 5-10 residues, terminating with glycine; glutamate as the fifth residue of the mature sequence; and a highly hydrophobic N-terminal. This system is homologous to the type IV pilus biogenesis and includes different proteins, termed psudopilins, which are structurally homologous to the type IV pilins.
definition_source: "InterPro:IPR000983 abstract (PRINTS PR00813 is a member signature)"
