identifier: PRINTS:PR01957
label: "CYP2F P450 family signature"
definition: >-
  P450 enzymes constitute a superfamily of haem-thiolate proteins, widely distributed in bacteria, fungi, plants and animals. The enzymes are involved in metabolism of a plethora of both exogenous and endogenous compounds. Usually, they act as terminal oxidases in multi-component electron-transfer chains, called P450-containing monooxygenase systems. On the basis of sequence similarity, all P450s can be categorised into 2 main classes, the so-called B- and E-classes: P450 proteins of prokaryotic 3-component systems and fungal P450nor (CYP55) belong to the B-class; all other known P450s from distinct systems are of the E-class. E-class P450s may be further divided into 5 subclasses (groups) according to protein sequence similarities. The data suggest that divergence of the P450 superfamily into B- and E-classes, and further divergence into stable P450 groups within the E-class, must be very ancient and had occurred before the appearance of eukaryotes. Given the rapid increase in numbers of P450s, Nelson introduced the concept of a higher-order classification of P450 families into clans based on sequence similarity. This is similar to the previous grouping into B- and E-classes; both classifications are still used. According to Nelsons system, clan 2 contains the CYP2 plus CYP1, 17, 18, 21 and 71 families, and corresponds to the E-class group I proteins. Members of the first 4 families are of vertebrate origin, while those from CYP71 derive from plants. CYP1 and CYP2 enzymes mainly metabolise exogenous substrates, whereas CYP17 and CYP21 are involved in metabolism of endogenous physiologically-active compounds.
definition_source: "InterPro:IPR020469 abstract (PRINTS PR01957 is a member signature)"
