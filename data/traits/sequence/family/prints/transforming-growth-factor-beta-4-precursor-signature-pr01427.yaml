identifier: PRINTS:PR01427
label: "Transforming growth factor beta 4 precursor signature"
definition: >-
  Examples of lateral asymmetry are often found in vertebrates (e.g., the heart being on the left side), but the molecular mechanisms governing establishment of left-right (L-R) handedness are unknown. It is now thought that the gene lefty, a member of the transforming growth factor-beta family, may encode a morphogen for L-R determination. Lefty protein, which contains the cysteine-knot motif characteristic of this superfamily, is expressed in the left half of gastrulating mouse embryos. This asymmetric expression is transient and occurs just before the first sign of lateral asymmetry appears]. Thus lefty may be involved in establishing L-R asymmetry in the organ systems of mammals. Abnormal endometrial bleeding is a common manifestation of gynaecological diseases. A human gene, termed endometrial bleeding associated factor (ebaf), which is expressed strongly in endometrium, has been shown to be associated with abnormal endometrial bleeding. The predicted protein product of ebaf shares similarity with members of TGF-beta superfamily. Thus ebaf is a novel member of the TGF-beta superfamily and an endometrial tissue factor whose expression is associated with normal menstrual and abnormal endometrial bleeding.
definition_source: "InterPro:IPR003942 abstract (PRINTS PR01427 is a member signature)"
