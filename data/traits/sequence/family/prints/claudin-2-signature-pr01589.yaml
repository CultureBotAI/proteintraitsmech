identifier: PRINTS:PR01589
label: "Claudin-2 signature"
definition: >-
  Claudins form the paracellular tight junction seal in epithelial tissues. In humans, 24 claudins (claudin 1-24) have been identified. Their ability to polymerise and form strands is affected by the cell types. They can also form heteropolymers with each other within and between tight junction strands. Most of the claudins (claudin-12 being the exception) have a C-terminal PDZ-binding motif that can interact with other PDZ domain proteins, such as scaffolding protein, ZO-1, -2 and -3. They also interact with non-tight junction proteins, such as cell adhesion proteins EpCam and tetraspanins and the signaling proteins, ephrin A and B and their receptors, EphA and EphB. Claudin-2 was initially isolated as a peptide fragment from TJ-enriched junctional cell fractions. Following sequencing and similarity searching it was cloned and expressed in cells, where it was shown to concentrate at TJs. Human and mouse isoforms have been identified. Claudin-2 shares ~22-46% overall similarity with other claudin family members at the amino acid level, displaying highest similarity to claudin-14.
