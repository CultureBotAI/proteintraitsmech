identifier: PRINTS:PR01317
label: "Glial cell line-derived neurotrophic factor receptor alpha 1 signature"
definition: >-
  Glial cell line-derived neurotrophic factor (GDNF) and its related factors neurturin (NTN), artemin (ART) and persephin (PSP), are members of the GDNF family of neurotrophic factors. They form a sub-group in the transforming growth factor-beta (TGF-beta) superfamily. These factors are involved in the promotion of neurone survival, exerting their effects through specific receptors. The GDNF family receptors (GFRs) are glycosyl-phosphatidylinositol-linked, cell surface receptors. Four receptor subtypes, termed GFRalpha-1 to 4, are currently recognised. Homologues for the GFRalpha-1 receptor subtype have been cloned from mammalian and avian tissue. The receptor is activated by GDNF, although there is evidence it can also bind neurturin, the principal ligand for GFRalpha-2. Activation of GFRalpha-1 triggers its interaction with the membrane-bound receptor kinase Ret. This induces Ret homo-dimerisation, triggering a cascade of intracellular signalling events such as the activation of the Ras-mitogen-activated protein kinase (MAPK), phosphoinositol-3-kinase (PI3K), Jun N-terminal kinase (JNK) and phospholipase C gamma (PLC gamma) dependent pathways.
definition_source: "InterPro:IPR003503 abstract (PRINTS PR01317 is a member signature)"
