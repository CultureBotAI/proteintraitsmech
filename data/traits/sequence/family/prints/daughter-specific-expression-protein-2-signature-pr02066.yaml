identifier: PRINTS:PR02066
label: "Daughter-specific expression protein 2 signature"
definition: >-
  In Saccharomyces cerevisiae, daughter-specific genetic programs induce distinct fates for mother and daughter cells. Some daughter-specific gene products have been shown to contribute to cell separation by degrading the cell wall. A group of these genes (including ENG1, SCW11, DSE1 and DSE2) are regulated by the transcription factor Ace2p. More specifically, the DSE2 gene has been shown to encode a secreted protein with sequence similarity to glucanases. It is believed that this protein contributes to the degradation of the cell wall from the daughter side, causing daughter cells to separate from mother cells.
definition_source: "InterPro:IPR026225 abstract (PRINTS PR02066 is a member signature)"
