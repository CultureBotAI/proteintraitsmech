identifier: PRINTS:PR00933
label: "B-lytic metalloendopeptidase (M23) signature"
definition: >-
  Over 70 metallopeptidase families have been identified to date. In these enzymes a divalent cation, which is usually zinc but may be cobalt, manganese or copper, activates the water molecule. The metal ion is held in place by amino acid ligands, usually three in number. In some families of co-catalytic metallopeptidases, two metal ions are observed in crystal structures ligated by five amino acids, with one amino acid ligating both metal ions. The known metal ligands are His, Glu, Asp or Lys. At least one other residue is required for catalysis, which may play an electrophilic role. Many metalloproteases contain an HEXXH motif, which has been shown in crystallographic studies to form part of the metal-binding site. The HEXXH motif is relatively common but can be more stringently defined for metalloproteases as 'abXHEbbHbc', where 'a' is most often valine or threonine and forms part of the S1' subsite in thermolysin and neprilysin, 'b' is an uncharged residue, and 'c' a hydrophobic residue. Proline is never found in this site, possibly because it would break the helical structure adopted by this motif in metalloproteases. B-lytic endopeptidases are bacterial metallopeptidases that belong to MEROPS peptidase family M23 (clan M-), subfamily M23A. Cleavage is specific for glycine bonds, especially in -Gly-Gly Xaa sequences (Xaa is any aliphatic hydrophobic residue). They lyse the cell walls of Gram-positive bacteria in which the peptidoglycan cross-links contain glycine residues. The enzymes contain zinc, but the exact position of the metal-binding ligands is uncertain. On the basis of similarity with D-Ala-D-Ala-carboxypeptidase, it has been suggested that a conserved His-X-His motif (where X is any amino acid) forms part of the binding site. The enzyme from Achromobacter
