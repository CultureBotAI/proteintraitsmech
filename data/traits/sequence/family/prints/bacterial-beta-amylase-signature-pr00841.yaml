identifier: PRINTS:PR00841
label: "Bacterial beta-amylase signature"
definition: >-
  This entry represents bacterial beta-amylases, which belong to the glycoside hydrolase family 14 ( EC:3.2.1.2, CAZy:GH14 ). Beta-amylases hydrolyse 1,4-alpha-glycosidic linkages in starch-type polysaccharide substrates, removing successive maltose units from the non-reducing ends of the chains. These enzymes consists of two domains: the N-terminal catalytic domain and the C-terminal SBD (starch-binding domain). The catalytic domain folds into a (β/α)8-barrel fold and is very similar to that of plant enzymes. The SBD, only present in microbial enzymes, consists of two 4-stranded antiparallel β-sheets, which are classified as carbohydrate-binding module 20 (CBM20). O-Glycosyl hydrolases ( EC:3.2.1. ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
