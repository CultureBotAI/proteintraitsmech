identifier: PRINTS:PR01890
label: "Neuropeptide W precursor signature"
definition: >-
  Two closely related neuropeptide precursors, which share no significant sequence similarity with other known neuropeptides, have recently been identified and named preproneuropeptide B and preproneuropeptide W. In humans, each precursor contains a signal sequence and two dibasic cleavage sites. Alternative cleavage of these sites results in long (29 or 30 amino acid) and short (23 amino acid) forms of the resultant neuropeptides. Murine, rat and bovine versions of preproneuropeptide B, however, contain only the second cleavage site, resulting in only the long form of neuropeptide B. Neuropeptide W has a more limited distribution in the brain than neuropeptide B and is found at highest levels in the substantia nigra, suggesting an involvement in locomotor control. In the periphery, neuropeptide W is more widespread than neuropeptide B. Like neuropeptide B, it is expressed at high levels in testis, ovary, uterus, placenta, spleen, lymph nodes and peripheral blood leukocytes, indicating potential roles in the reproductive and immune systems. In addition, however, neuropeptide W has been found at high levels in the liver, stomach and trachea. Intracerebroventricular administration of neuropeptide W in rats has been reported to produce an acute increase in food intake and to stimulate prolactin release. This entry represents the neuropeptide W precursor.
