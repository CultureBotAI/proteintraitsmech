identifier: PRINTS:PR01244
label: "Peropsin signature"
definition: >-
  Peropsin is a visual pigment-like protein found in ocular tissues. The protein has been localised to the apical face of the retinal pigment epithelium (RPE), most prominently to the microvilli that surround the photoreceptor outer segments. It is believed that peropsin may play a role in RPE physiology, either by detecting light directly, or by monitoring the concentration of retinoids or other photoreceptor-derived compounds.
