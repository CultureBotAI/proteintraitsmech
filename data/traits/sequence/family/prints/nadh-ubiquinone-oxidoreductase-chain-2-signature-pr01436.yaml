identifier: PRINTS:PR01436
label: "NADH-ubiquinone oxidoreductase chain 2 signature"
definition: >-
  This entry represents subunit 2 (ND2 or chain 2) from NADH:ubiquinone oxidoreductase (complex I). Defects in the ND2 gene are one of the causes of Leber's hereditary optic neuropathy, a maternally inherited disease resulting in acute bilateral blindness due to retinal degeneration, predominantly in young men. Cardiac conduction defects and neurological defects have also been described, resulting in optic nerve degeneration and cardiac dysrhythmia. The clinical manifestations of this disease are thought to be the product of an overall decrease in mitochondrial energy production, rather than the result of a defect in a specific mitochondrial enzyme. Further research has shown that a point mutation in ND2 is a potential risk factor for Alzheimer's disease.
definition_source: "InterPro:IPR003917 abstract (PRINTS PR01436 is a member signature)"
