identifier: PRINTS:PR01803
label: "Trypanosome sialidase signature"
definition: >-
  Trypanosoma cruzi is a kinetoplastid protozoan parasite of humans and other animals, the causative agent of Chagas disease. It is transmitted via an insect vector, and exists as an intracellular form, the amastigote, or as a trypomastigote form in the blood after infection. In the human host, chronic infection by T. cruzi affects the nervous system and heart, leading to various neurological disorders, damage to the heart muscle and eventually death. The parasite expresses a variety of virulence factors in order to successfully invade the mammalian or insect host. One of these is unique to the genus Trypanosoma, a sialic acid-metabolising enzyme, dubbed "trans-sialidase", classified as a member of glycosyl hydrolase family 33. The protein catalyses the transfer of host cell sialic acids to acceptor receptors on the protozoan cell membrane, allowing the parasite to evade the immune response and enter the cell undetected. It also acts as the major 85kDa surface antigen of T. cruzi, and exhibits neuraminidase activity similar to that of some pathogenic viruses. Research into the gene has revealed a massive diversity in the expression of this surface antigen/sialidase. The variation in its amino acid sequences begs the question why such a successful parasite should need so many different versions of the same virulence factor. In addition to Trypanosoma spp., this entry also matches a number of bacterial sialidases.
definition_source: "InterPro:IPR008377 abstract (PRINTS PR01803 is a member signature)"
