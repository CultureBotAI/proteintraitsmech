identifier: PRINTS:PR00354
label: "7Fe ferredoxin signature"
definition: >-
  Ferredoxins are iron-sulphur proteins that mediate electron transfer in a range of metabolic reactions. The proteins fall into several subgroups according to the nature of their iron-sulphur cluster(s). The 7Fe ferredoxins contain both 4Fe-4S and 3Fe-4S centres. The 4Fe-4S domain is similar to those found in other bacterial-type ferredoxins. The 3D structure of the 7Fe ferredoxin from Azotobacter vinelandii has been determined to 1.9 A resolution. The fold belongs to the α + β class, with 3 helices and 4 strands forming a barrel-like structure, and an extruded loop containing 3 of the 4 cysteinyl residues of the iron-sulphur cluster.
definition_source: "InterPro:IPR000813 abstract (PRINTS PR00354 is a member signature)"
