identifier: PRINTS:PR01344
label: "Salmonella/Shigella invasion protein E (InvE) signature"
definition: >-
  Secretion of virulence factors in Gram-negative bacteria involves transportation of the protein across two membranes to reach the cell exterior. There have been four secretion systems described in sequence similarities in plant pathogens like Ralstonia and Erwinia. The type III secretion system is of great interest, as it is used to transport virulence factors from the pathogen directly into the host cell and is only triggered when the bacterium comes into close contact with the host. The protein subunits of the system are very similar to those of bacterial flagellar biosynthesis. However, while the latter forms a ring structure to allow secretion of flagellin and is an integral part of the flagellum itself, type III subunits in the outer membrane translocate secreted proteins through a channel-like structure. The Salmonella/Shigella invasion protein E gene (InvE) is one such type III secretion protein subunit, and is localised to the outer membrane of the SPI I pathogenicity island, and is involved in the surface presentation. This entry also includes the type III secretion system protein MxiC from Shigella flexneri.
definition_source: "InterPro:IPR003520 abstract (PRINTS PR01344 is a member signature)"
