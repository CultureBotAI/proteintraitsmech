identifier: PRINTS:PR01521
label: "Orexin receptor type 1 signature"
definition: >-
  The neuropeptide hormone orexin stimulates appetite and food consumption, and is found in the hypothalamus, which has been shown to be the 'feeding centre' and plays a central role in the integrated control of feeding and energy homeostasis. It also has a prominent role in promoting wakefulness. The orexin receptor (also referred to as the hypocretin receptor) is a rhodopsin-like G protein-coupled receptor that binds orexin. There are two subtypes; orexin receptor 1 (OX1) and orexin receptor 2 (OX2). This entry represents Orexin/Hypocretin receptor type 1 (OX1R), which is found many in mammalian tissues and mostly expressed in the hypothalamus. This protein has a moderately selective excitatory receptor for orexin-A and, with a lower affinity, for orexin-B neuropeptide. In response to orexin-A binding, it triggers an increase in cytoplasmic Ca2+ levels. OX1 receptor signaling in sleep/wake regulation is not as well defined as for the OX2 receptor, but it has been implicated in feeding, water intake, spatial learning and reward pathways.
