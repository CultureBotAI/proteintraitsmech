identifier: PRINTS:PR01169
label: "Ceratitis capitata alcohol dehydrogenase signature"
definition: >-
  The short-chain dehydrogenases/reductases family (SDR) is a very large family of enzymes, most of which are known to be NAD- or NADP-dependent oxidoreductases. As the first member of this family to be characterised was Drosophila alcohol dehydrogenase, this family used to be called 'insect-type', or 'short-chain' alcohol dehydrogenases. Most members of this family are proteins of about 250 to 300 amino acid residues. Most dehydrogenases possess at least two domains, the first binding the coenzyme, often NAD, and the second binding the substrate. This latter domain determines the substrate specificity and contains amino acids involved in catalysis. Little sequence similarity has been found in the coenzyme binding domain although there is a large degree of structural similarity, and it has therefore been suggested that the structure of dehydrogenases has arisen through gene fusion of a common ancestral coenzyme nucleotide sequence with various substrate specific domains. Insect ADH is very different from yeast and mammalian ADHs. The enzyme from Drosophila lebanonensis (Fruit fly) has been characterised by protein analysis and was found to have a 254-residue protein chain with an acetyl-blocked N-terminal Met. Comparisons with the enzyme from other species reveals that they have diverged considerably. The structural variation within Drosophila is about as large as that for mammalian zinc-containing alcohol dehydrogenase. The crystal structure of the apo form of D. lebanonensis ADH has been solved to 1.9A resolution. Three structural features characterise the active site architecture: (i) a deep cavity, covered by a flexible 33-residue loop and an 11-residue C-terminal tail of the neighbouring subunit, whose hydrophobic surface is likely to increase the specificity of the
