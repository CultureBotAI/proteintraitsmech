identifier: PRINTS:PR01207
label: "Na-K-Cl co-transporter family signature"
definition: >-
  The Na-K-Cl co-transporters are a family of integral membrane proteins that are ubiquitously expressed in animal tissues, serving a variety of functions. In cells of Cl - absorptive and Cl - secretory epithelia, Na-K-Cl co-transport serves as the major Cl - entry pathway, and functions in concert with other membrane ion channels and pumps to carry out net transepithelial movement of salt. This vectorial transport of Cl - across epithelia is involved in the reabsorption of salt in the vertebrate kidney (which is crucial for urinary concentration), and in the secretion of salt in such tissues as the mammalian intestine and trachea. In addition, Na-K-Cl co-transport is known to play a role in cell volume regulation in most mammalian cell types. The proteins mediate the coupled, electroneutral transport of sodium, potassium and chloride ions across the plasma membrane of cells (with a stoichiometry of 1:1:2, respectively). Co-transport of all three ions is obligatory, since absence of one is sufficient to prevent ion movement. Their transport activity does not alter the cell's membrane potential, thus the driving force for the transport is determined solely by the chemical gradients of the three transported ions; hence, under normal physiological conditions, the direction will be inward. Recent molecular studies have identified two distinct isoforms: one from Cl - secretory epithelia, NKCC1 (SLC12A2); and another, NKCC2 (SLC12A1), found specifically in the diluting segment of the vertebrate kidney, a Cl - absorptive epithelium. They show lowish amino acid sequence identity (~58%); nevertheless, they have rather similar hydropathy profiles, with hydrophilic N- and C-termini, flanking a central hydrophobic domain. Their N-termini show considerable variation, unlike the centra
