identifier: PRINTS:PR01272
label: "Acetoin utilisation ACUC protein signature"
definition: >-
  Acetoin utilisation proteins (ACUC) are found in eubacteria and acetylpolyamine amidohydrolases APHAs occur in archaeal bacteria, eubacteria, and some eukaryotic organisms. HDAs may have evolved at least twice from APHAs, the more recent gene duplication event resembling APHAs more closely. Disrupting the expression of ACUC results in diminished growth of bacteria on acetoin and butanediol. Acetoin is a bacterial fermentation product that can be converted to acetate via the butanediol cycle in the absence of other carbon sources; its degradation is believed to be caused by deacetylation mediated by ACUC. Histone deacetylases (HDACs) EC:3.5.1.98 are a class of enzymes that remove acetyl groups from N(6)-acetyl-lysine residues on histones. This process plays a critical role in transcription regulation, as HDACs facilitate tighter wrapping of DNA around histones. DNA expression is regulated in part by the balance between acetylation and deacetylation. The reaction catalyzed by HDACs is the reverse of EC:2.3.1.48, which transfers acetyl groups to histones. In general, HDACs suppress gene expression because the removal of acetyl groups from the ε-amino group of lysine side chains at the N-terminal of histones restores the positive charge of lysine residues. This stabilization strengthens histone-DNA interactions and prevents transcription factors from binding to promoter elements. HDACs, along with acetoin utilization proteins and acetylpolyamine amidohydrolases, belong to an ancient protein superfamily. HDAC can be divided by different classes: Class I: Includes HDAC1, HDAC2, HDAC3, and HDAC8. Generally nuclear and involved in transcriptional repression. Class II: Includes HDAC4, HDAC5, HDAC6, HDAC7, HDAC9, and HDAC10. Can shuttle between the nucleus and cytoplasm and are i
