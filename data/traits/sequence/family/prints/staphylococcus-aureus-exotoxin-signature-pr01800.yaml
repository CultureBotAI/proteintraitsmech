identifier: PRINTS:PR01800
label: "Staphylococcus aureus exotoxin signature"
definition: >-
  Staphylococcus aureus is a well-characterised and specialised prokaryotic human pathogen, expressing a variety of virulence factors to enable successful infection of the host. Symptoms usually manifest in cases of food poisoning, pyrogenic fever and toxic shock syndrome, and can prove lethal in immunocompromised patients. Of all the exotoxins secreted from the bacterial cell, superantigens and hemolysins are amongst the most studied. A novel gene cluster encoding several new superantigen exotoxin-like virulence factors has been isolated from S. aureus. Although the gene products elicit classic symptoms of pyrogenic fever and food poisoning in susceptible animal models, their overall similarity to sequences of known superantigens and hemolysins is limited. However, they do share regions of higher similarity in several key functional domains, leading these moieties to be termed Staphylococcal Exotoxin-like Enterotoxins (SETs), 15 of which have so far been isolated from pathogenic strains. The crystal structure of S. aureus Set3 enterotoxin has been resolved to 1.9A by means of X-ray crystallography. It reveals the two-fold structure characteristic of the superantigen superfamily: an N-terminal OB fold and a C-terminal β-grasp domain, joined by an N-terminal α-helix. However, it differs significantly in several places. β-strands 6 and 7 protrude from the molecular surface in the β-grasp domain, unlike the usually smooth surface of other superantigens. Also, there appears to be a large, saddle-shaped positively-charged surface capable of binding negatively-charged molecules, such as DNA.
