identifier: PRINTS:PR00129
label: "Cutinase signature"
definition: >-
  Aerial plant organs are protected by a cuticle composed of an insoluble polymeric structural compound, cutin, which is a polyester composed of hydroxy and hydroxyepoxy fatty acids. Plant pathogenic fungi produce extracellular degradative enzymes that play an important role in pathogenesis. They include cutinase, which hydrolyses cutin, facilitating fungus penetration through the cuticle. Inhibition of the enzyme can prevent fungal infection through intact cuticles. Cutin monomers released from the cuticle by small amounts of cutinase on fungal spore surfaces can greatly increase the amount of cutinase secreted by the spore, the mechanism for which process is as yet unknown. Cutinase is a serine esterase containing the classical Ser, His, Asp triad of serine hydrolases. The protein belongs to the α-β class, with a central β-sheet of 5 parallel strands covered by 5 helices on either side of the sheet. The active site cleft is partly covered by 2 thin bridges formed by amino acid side chains, by contrast with the hydrophobic lid possessed by other lipases. The protein also contains 2 disulphide bridges, which are essential for activity, their cleavage resulting in complete loss of enzymatic activity.
definition_source: "InterPro:IPR011150 abstract (PRINTS PR00129 is a member signature)"
