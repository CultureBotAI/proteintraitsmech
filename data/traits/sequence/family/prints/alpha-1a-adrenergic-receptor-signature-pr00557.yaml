identifier: PRINTS:PR00557
label: "Alpha-1A adrenergic receptor signature"
definition: >-
  The adrenoceptors (or adrenergic receptors) are rhodopsin-like G protein-coupled receptors that are targets of the catecholamines, especially norepinephrine (noradrenaline) and epinephrine (adrenaline). Many cells possess these receptors, and the binding of a catecholamine to the receptor will generally stimulate the sympathetic nervous system, effect blood pressure, myocardial contractile rate and force, airway reactivity, and a variety of metabolic and central nervous system functions. The clinical uses of adrenergic compounds are vast. Agonists and antagonists interacting with adrenoceptors have proved useful in the treatment of a variety of diseases, including hypertension, angina pectoris, congestive heart failure, asthma, depression, benign prostatic hypertrophy, and glaucoma. These drugs are also useful in several other therapeutic situations including shock, premature labour and opioid withdrawal, and as adjuncts to general anaesthetics. There are three classes of adrenoceptors, based on their sequence similarity, receptor pharmacology and signalling mechanisms. These three classes are alpha 1 (a Gq coupled receptor), alpha 2 (a Gi coupled receptor) and beta (a Gs coupled receptor), and each can be further divided into subtypes. The different subtypes can coexist in some tissues, but one subtype normally predominates. Alpha 1 adrenoceptors have the following subtypes: 1A, 1B and 1D. They are found in both the central and peripheral nervous system. In the CNS, they are found mostly postsynaptically and have an excitatory function. Peripherally, they are responsible for contraction and are situated on vascular and non-vascular smooth muscle and veins. In the liver, they cause hepatic glycogenolysis and potassium release. Alpha 1 adrenoceptors are coupled to Gq/11,
