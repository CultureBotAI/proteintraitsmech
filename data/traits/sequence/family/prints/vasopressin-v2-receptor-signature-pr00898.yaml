identifier: PRINTS:PR00898
label: "Vasopressin V2 receptor signature"
definition: >-
  The V2 receptor is found in high levels in the osmoregulatory epithelia of the terminal urinary tract, where it stimulates water reabsorption. It is also present in lower levels in the endothelium and blood vessels of some species, where it induces vasodilation. In the CNS, binding sites are found in the subiculum, with lower levels in caudate-putamen and islands of Calleja. The receptor is involved in an effector pathway that forms cAMP through activation of G proteins. Vasopressin and oxytocin are members of the neurohypophyseal hormone family found in all mammalian species. They are present at high levels in the posterior pituitary. Vasopressin has an essential role in the control of the water content of the body, acting in the kidney to increase water and sodium absorption. In higher concentrations, vasopressin stimulates contraction of vascular smooth muscle, stimulates glycogen breakdown in the liver, induces platelet activation, and evokes release of corticotrophin from the anterior pituitary. Vasopressin and its analogues are used clinically to treat diabetes insipidus. The rhodopsin-like GPCRs (GPCRA) represent a widespread protein family that includes hormone, neurotransmitter and light receptors, all of which transduce extracellular signals through interaction with guanine nucleotide-binding (G) proteins. Although their activating ligands vary widely in structure and character, the amino acid sequences of the receptors are very similar and are believed to adopt a common structural framework comprising 7 transmembrane (TM) helices. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level,
