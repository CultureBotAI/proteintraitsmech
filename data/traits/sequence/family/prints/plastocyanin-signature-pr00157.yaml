identifier: PRINTS:PR00157
label: "Plastocyanin signature"
definition: >-
  Blue or 'type-1' copper proteins are small proteins which bind a single copper atom and which are characterised by an intense electronic absorption band near 600 nm. The most well known members of this class of proteins are the plant chloroplastic plastocyanins, and the distantly related bacterial azurins, which exchange electrons with cytochrome c551. Plastocyanin participates in electron transfer between the cytochrome b6f complex and photosystem I. Many cyanobacteria and eukaryotic algae can synthesise both plastocyanin and its functional analog cytochrome c6, depending on bioavailabilities of copper and iron, respectively. Plastocyanin participates in electron transfer between P700 and the cytochrome b/f complex in photosystem I.
definition_source: "InterPro:IPR002387 abstract (PRINTS PR00157 is a member signature)"
