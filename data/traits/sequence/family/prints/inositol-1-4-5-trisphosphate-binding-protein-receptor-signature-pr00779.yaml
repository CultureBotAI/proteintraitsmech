identifier: PRINTS:PR00779
label: "Inositol 1,4,5-trisphosphate-binding protein receptor signature"
definition: >-
  The inositol 1,4,5-trisphosphate (IP3)3 receptors (IP3R) are tetrameric intracellular Ca2 release channels on the endoplasmic membrane that are activated by the ligand IP3. The mammalian IP3R family consists of three isoforms (IP3R1, IP3R2, and IP3R3). They form homotetrameric or heterotetrameric channels. They contain three functional domains: an N-terminal IP3-binding domain, a channel-forming domain localized to the C terminus, and a regulatory/coupling domain connecting these two domains. This entry also includes Inositol 1,4,5-trisphosphate receptor-like protein A (iplA) which is the only gene known in the Dicyostelium genome that shares homology with IP3-receptors of higher eukaryotes and its gene product exerts a crucial role in the control of basal [Ca2+]i and of agonist induced Ca2+-fluxes.
definition_source: "InterPro:IPR000493 abstract (PRINTS PR00779 is a member signature)"
