identifier: PRINTS:PR01423
label: "Transforming growth factor beta precursor signature"
definition: >-
  The transforming growth factors-beta constitute a family of multi-functional cytokines that regulate cell growth and differentiation. Many cells synthesise TGF-beta, and essentially all have specific receptors for this peptide. TGF-beta regulates the actions of many other peptide growth factors and determines a positive or negative direction of their effects.
