identifier: PRINTS:PR00255
label: "Natriuretic peptide receptor signature"
definition: >-
  This entry includes the natriuretic peptide receptors (ANP-A, ANP-B and ANP-C) from animals and guanylate cyclases 2G (GUC2G) from rodents. GUC2G is closely related to the natriuretic peptide receptors, but all ligands known to activate other receptors failed to stimulate its enzymic activity. Natriuretic peptides are hormones involved in the regulation of fluid and electrolyte homeostasis. These hormones stimulate the intracellular production of cyclic GMP as a second messenger. They belong to a family that includes extracellular ligand binding domains of a wide range of receptors. Three peptide receptors are known, two of which express quanylate cyclase activity (GC-A or ANP-A, and GC-B or ANP-B), while the third (ANP-C) is probably responsible for the clearance of atrial natriuretic peptide (ANP) from the circulation and does not play a role in signal transduction. GC-A and GC-B are plasma membrane-bound proteins that share the following topology: an N-terminal extracellular domain which acts as the ligand binding region, then a transmembrane domain followed by a large cytoplasmic C-terminal region that can be subdivided into two domains: a protein kinase-like domain that appears important for proper signalling and a guanylate cyclase catalytic domain. The topology of ANP-C is different: like GC-A and -B it possesses an extracellular ligand-binding region and a transmembrane domain, but its cytoplasmic domain is very short.
definition_source: "InterPro:IPR001170 abstract (PRINTS PR00255 is a member signature)"
