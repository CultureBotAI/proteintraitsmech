identifier: PRINTS:PR01221
label: "Rodent urinary protein signature"
definition: >-
  Rodent urinary proteins (mouse major urinary proteins or MUPs and rat alpha-2u globulins) are the major protein components of rodent urine and transport pheromones. Rodent urine contains an unusually large amount of protein. The major site of MUP synthesis is the liver; the protein is secreted by the liver into serum, where it circulates at relatively low levels before being rapidly filtered by the kidney and excreted. The sex-dependent expression of MUP (adult male mice secrete 5-20 times as much MUP as do females) and its ability to bind a number of odorant molecules is consistent with the suggestion that MUP acts as a pheromone transporter; the protein may be excreted into the urine carrying a bound pheromone, which is released as the urine dries and the protein denatures. The crystal structure of MUP has been solved and is known to be a member of the lipocalin family. Alpha-2u-globulin, a close homologue of MUP, accounts for 30-50% of total excreted protein in adult male rat urine. As its electrophoretic mobility is similar to that of serum a2 globulin, it was named 'alpha-2u-globulin', the subscript 'u' denoting its origin in urine. Alpha-2u-globulin is secreted into the plasma by a number of tissues, where it circulates before filtration through the kidney; between 20 and 50% is reabsorbed by the proximal tubule of the nephron, the rest being excreted. Although the exact physiological role of alpha-2u-globulin is unclear, there is circumstantial evidence that it functions in pheromone transport. This is consistent with its observed binding properties, its close similarity with MUP and the known properties of male rat urine. Some of the proteins in this family are allergens. Allergies are hypersensitivity reactions of the immune system to specific substances called
