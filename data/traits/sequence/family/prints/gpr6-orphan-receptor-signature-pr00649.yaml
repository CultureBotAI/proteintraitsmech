identifier: PRINTS:PR00649
label: "GPR6 orphan receptor signature"
definition: >-
  G protein-coupled receptor 12 (GPR12) was initially isolated from a rat pituitary library, and is found in discrete regions of the brain, pituitary and testis, but is absent in other tissues. Three human homologues (GPR12, GPR6 and GPR3) have also been isolated. The 3 genes have been localised to human chromosomal regions 13q12, 6q21 and 1p34.3-p36.1 respectively. This entry represents G protein-coupled receptor 6, which is an orphaned receptor, no endogenous ligand having yet been identified.
definition_source: "InterPro:IPR001151 abstract (PRINTS PR00649 is a member signature)"
