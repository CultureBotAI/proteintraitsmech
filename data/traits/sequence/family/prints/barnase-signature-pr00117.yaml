identifier: PRINTS:PR00117
label: "Barnase signature"
definition: >-
  Barnase is the extracellular ribonuclease of Bacillus amyloliquefaciens, and barstar its specific intracellular inhibitor. Expression of barstar is necessary to counter the lethal effect of expressed active barnase. Barnase hydrolyses phosphodiester bonds in RNA, poly- and oligo-ribonucleotides, resulting in 3'-nucleoside monophosphates via 2',3'-cyclo-phospate intermediates. It is a small single-chain protein that has neither disulphide bonds nor non-peptide components. The NMR structure contains 2 α-helices and a 5-stranded anti-parallel β-sheet. The protein core is formed by the packing of the first α-helix onto the β-sheet.
definition_source: "InterPro:IPR001887 abstract (PRINTS PR00117 is a member signature)"
