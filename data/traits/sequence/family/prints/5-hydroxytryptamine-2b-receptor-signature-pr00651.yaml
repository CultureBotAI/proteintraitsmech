identifier: PRINTS:PR00651
label: "5-hydroxytryptamine 2B receptor signature"
definition: >-
  5-hydroxytryptamine (5-HT) or serotonin, is a neurotransmitter that it is primarily found in the gastrointestinal (GI) tract, platelets, and in the central nervous system (CNS). It is implicated in a vast array of physiological and pathophysiological pathways. Receptors for 5-HT mediate both excitatory and inhibitory neurotransmission, and modulate the release of many neurotransmitters including glutamate, GABA, dopamine, epinephrine/norepinephrine, and acetylcholine, as well as many hormones, including oxytocin, prolactin, vasopressin and cortisol. In the CNS, 5-HT receptors can influence various neurological processes, such as aggression, anxiety and appetite and, as a, result are the target of a variety of pharmaceutical drugs, including many antidepressants, antipsychotics and anorectics. The 5-HT receptors are grouped into a number of distinct subtypes, classified according to their antagonist susceptibilities and their affinities for 5-HT. With the exception of the 5-HT3 receptor, which is a ligand-gated ion channel, all 5-HT receptors are members of the rhodopsin-like G protein-coupled receptor family, and they activate an intracellular second messenger cascade to produce their responses. The 5-HT2 receptors mediate many of the central and peripheral physiologic functions of 5-hydroxytryptamine. The original 5HT2 receptor (now renamed as the 5-HT2A receptor) was initially classified according to its ability to display micromolar affinity for 5-HT, to be labelled with [3H]spiperone and by its susceptibility to 5-HT antagonists. At least 3 members of the 5HT2 receptor subfamily exist (5-HT2A, 5-HT2B, 5-HT2C), all of which share a high degree of sequence similarity and couple to Gq/G11 to stimulate the phosphoinositide pathway and elevate cytosolic calcium. Cardiova
