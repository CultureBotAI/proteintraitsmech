identifier: PRINTS:PR01139
label: "Gap junction beta-2 protein (Cx26) signature"
definition: >-
  Gap junction beta-2 protein (also called connexin26, or Cx26) is a connexin of 226 amino acid residues that is often found together with Cx32 in epithelial tissues. In rodents, it seems essential for normal embryonic development; mice lacking Cx26 die in utero at about embryonic day 11. Absence of Cx26 impairs transplacental movement of glucose, thus impairing embryonic development. In humans, spontaneously-occurring mutations in the gene encoding Cx26 have been found to be associated with a quite different disorder, non-syndromic neurosensory autosomal recessive deafness, the most common form of inherited hearing loss. Consistent with a role in auditory transduction, Cx26 is the predominant connexin isoform expressed in the organ of Corti of the cochlea. Here, it may be involved in maintaining the ionic balance of the endolymph, by providing a pathway for ions necessary to maintain this potassium-rich fluid. Two sets of nomenclature have been used to identify the connexins. The first, and most commonly used, classifies the connexin molecules according to molecular weight, such as connexin43 (abbreviated to Cx43), indicating a connexin of molecular weight close to 43kDa. However, studies have revealed cases where clear functional homologues exist across species that have quite different molecular masses; therefore, an alternative nomenclature was proposed based on evolutionary considerations, which divides the family into two major subclasses, alpha and beta, each with a number of members. Due to their ubiquity and overlapping tissue distributions, it has proved difficult to elucidate the functions of individual connexin isoforms. To circumvent this problem, particular connexin-encoding genes have been subjected to targeted-disruption in mice, and the phenotype of the r
