identifier: PRINTS:PR00246
label: "Somatostatin receptor signature"
definition: >-
  Somatostatin (SST), also known as somatotropin release-inhibiting factor (SRIF), is a hypothalamic hormone, a pancreatic hormone, and a central and peripheral neurotransmitter. Somatostatin has a wide distribution throughout the central nervous system (CNS) as well as in peripheral tissues, for example in the pituitary, pancreas and stomach. The various actions of somatostatin are mediated by a family of rhodopsin-like G protein-coupled receptors, which comprise of five distinct subtypes: Somatostatin receptor 1 (SSTR1), Somatostatin receptor 2 (SSTR2), Somatostatin receptor 3 (SSTR3), Somatostatin receptor 4 (SSTR4) and Somatostatin receptor 5 (SSTR5). These subtypes are widely expressed in many tissues, and frequently multiple subtypes coexist in the same cell. The somatostatin receptor subtypes also share common signalling pathways, such as the inhibition of adenylyl cyclase, activation of phosphotyrosine phosphatase (PTP), and modulation of mitogen-activated protein kinase (MAPK) through G protein-dependent mechanisms. Some of the subtypes are also coupled to inward rectifying K+ channels (SSTR2, SSTR3, SSTR4, SSTR5), to voltage-dependent Ca2+ channels (SSTR1, SSTR2), to an Na+/H+ exchanger (SSTR1), AMPA/kainate glutamate channels (SSTR1, SSTR2), phospholipase C (SSTR2, SSTR5), and phospholipase A2 (SSTR4). This entry represents the somatostatin family.
