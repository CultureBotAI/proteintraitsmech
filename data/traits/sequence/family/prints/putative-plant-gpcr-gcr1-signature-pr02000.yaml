identifier: PRINTS:PR02000
label: "Putative plant GPCR, GCR1, signature"
definition: >-
  Heterotrimeric G protein-mediated signalling via activated 7-transmembrane (7TM) serpentine receptors is well known in a range of organisms, but evidence for the existence of this pathway in plants has been elusive. Over the years, however, evidence that G proteins are involved in signal transduction in plants has been accumulating, leading several researchers to seek plant 7TM receptors. The first tangible evidence for a plant 7TM receptor came through an analysis of the expresssed sequence tag database, dbEST. This revealed an Arabidopsis thaliana gene (GCR1) that encodes a protein with 7 predicted TM domains, and other features characteristic of known 7TM receptors. The amino acid sequence of GCR1, however, is unusual in that it shows similarity to receptors from three different 7TM families, sharing greatest levels of similarity with the Dictyostelium cAMP receptors.
definition_source: "InterPro:IPR022340 abstract (PRINTS PR02000 is a member signature)"
