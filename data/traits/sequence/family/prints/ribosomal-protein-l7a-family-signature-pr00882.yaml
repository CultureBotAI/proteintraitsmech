identifier: PRINTS:PR00882
label: "Ribosomal protein L7A family signature"
definition: >-
  This family includes the large ribosomal subunit protein eL8 from human, which was formerly known as L7a, and its homologues. The human gene resembles other mammalian ribosomal protein genes so far, as it contains a short first exon, a short 5' untranslated leader and its transcriptional start sites at C residues embedded in a poly-pyrimidine tract. The sequence of a gene for ribosomal protein eL8 (also known as L4) of Saccharomyces cerevisiae (Baker's yeast) unlike most of its other ribosomal protein genes, has no intron. The single open reading frame is highly similar to mammalian ribosomal protein eL8. Ribosomes are the particles that catalyse mRNA-directed protein synthesis in all organisms. The codons of the mRNA are exposed on the ribosome to allow tRNA binding. This leads to the incorporation of amino acids into the growing polypeptide chain in accordance with the genetic information. Incoming amino acid monomers enter the ribosomal A site in the form of aminoacyl-tRNAs complexed with elongation factor Tu (EF-Tu) and GTP. The growing polypeptide chain, situated in the P site as peptidyl-tRNA, is then transferred to aminoacyl-tRNA, and the new peptidyl-tRNA, extended by one residue, is translocated to the P site with the aid of the elongation factor G (EF-G) and GTP as the deacylated tRNA is released from the ribosome through one or more exit sites. About 2/3 of the mass of the ribosome consists of RNA and 1/3 consists of protein. The proteins are named in accordance with the subunit of the ribosome which they belong to: the small (S1 to S31) and the large (L1 to L44). Usually they decorate the rRNA cores of the subunits. Many ribosomal proteins, particularly those of the large subunit, are composed of a globular, surfaced-exposed domain with long finger-like proj
