identifier: PRINTS:PR01572
label: "Type 2 neuropeptide FF receptor signature"
definition: >-
  This entry represents NPFF2, which is expressed at high levels in the thymus and placenta, with moderate levels in the pituitary, spleen, testis and brain. Low levels were detected in the spinal cord, pancreas, small intestine, uterus, stomach, lung, heart and skeletal muscle. No expression was detected in liver or kidney. The NPFF2 receptor has been found to regulate adenylyl cyclase in some recombinant cell lines. In acutely dissociated neurons, the NPFF2 receptors specifically counteract N-type Ca2+ channel inhibition by opioids. In SH-SY5Y neuroblastoma cells stably expressing human NPFF receptors, NPFF agonists also reduce the inhibitory effect of mu-opioid and delta-opioid receptor activation on an N-type Ca2+ channel. These regulations could be due in part to receptor heteromerisation since NPFF2 receptors have been shown to physically interact with mu-opiod receptors] and induce their trans-phosphorylations. Neuropeptide FF receptors belong to a family of neuropeptides containing an RF-amide motif at their C terminus which have a high affinity for the pain modulatory peptide neuropeptide NPFF (NPFF). Neuropeptide FF (NPFF) receptors have two subtypes, neuropeptide FF receptor type 1 (NPFF1) and neuropeptide FF receptor type 2 (NPFF2), they are members of rhodopsin G protein-coupled receptor family. The neuropeptide FF is found at high concentrations in the posterior pituitary, spinal cord, hypothalamus and medulla and is believed to be involved in pain modulation, opioid tolerance, cardiovascular regulation, memory and neuroendocrine regulation. Comparing the distribution of NPFF1 and NPFF2 receptors in different species reveals important species differences. The NPFF1 receptor is broadly distributed in the central nervous system with the highest levels found in
