identifier: PRINTS:PR01593
label: "Salmonella type III secretion SopE effector protein signature"
definition: >-
  The type III secretion system (T3SS) of Gram-negative bacteria transports virulence factors directly from the pathogen into the host cell, and is triggered only upon close contact between bacterium and host. Notably, effector proteins secreted via the T3SS lack conventional secretion signals, a property that distinguishes them from most other secreted proteins. Salmonella spp. secrete an effector protein, SopE, exemplified by UniProtKB:O52623, that is responsible for stimulating reorganisation of the host cell actin cytoskeleton and membrane ruffling. SopE acts as a guanine nucleotide exchange factor (GEF) targeting Rho-GTPases such as Cdc42 and Rac. To restore normal host cell architecture, a second effector, the tyrosine phosphatase SptP, rapidly reverses the cytoskeletal changes induced by SopE.
definition_source: "InterPro:IPR005414 abstract (PRINTS PR01593 is a member signature)"
