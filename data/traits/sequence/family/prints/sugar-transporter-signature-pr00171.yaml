identifier: PRINTS:PR00171
label: "Sugar transporter signature"
definition: >-
  This family includes sugar transporters and the myo-inositol transporters. The sugar transporters belong to a superfamily of membrane proteins responsible for the binding and transport of various carbohydrates, organic alcohols, and acids in a wide range of prokaryotic and eukaryotic organisms. These integral membrane proteins are predicted to comprise twelve membrane spanning domains. It is likely that the transporters have evolved from an ancient protein present in living organisms before the divergence into prokaryotes and eukaryotes. In mammals, these proteins are expressed in a number of organs.
definition_source: "InterPro:IPR003663 abstract (PRINTS PR00171 is a member signature)"
