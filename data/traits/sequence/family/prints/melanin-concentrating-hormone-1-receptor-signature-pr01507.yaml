identifier: PRINTS:PR01507
label: "Melanin-concentrating hormone 1 receptor signature"
definition: >-
  Melanin-concentrating hormone (MCH) is a cyclic peptide originally identified in teleost fish. In fish, MCH is released from the pituitary and causes lightening of skin pigment cells through pigment aggregation. In mammals, MCH is predominantly expressed in the hypothalamus, and functions as a neurotransmitter in the control of a range of functions. A major role of MCH is thought to be in the regulation of feeding: injection of MCH into rat brains stimulates feeding; expression of MCH is upregulated in the hypothalamus of obese and fasting mice; and mice lacking MCH are lean and eat less. MCH and alpha melanocyte-stimulating hormone (alpha-MSH) have antagonistic effects on a number of physiological functions. Alpha-MSH darkens pigmentation in fish and reduces feeding in mammals, whereas MCH increases feeding. MCH receptor 1 (MCHR1, previously known as SLC1) is a class I GPCR. Expression of the receptor has been found at highest levels in the brain, with moderate levels in the eye and skeletal muscle, and lower levels in the tongue and pituitary. In the brain, the receptor is expressed extensively in the hippocampus, olfactory regions and medial nucleus accumbens, a distribution that corresponds to connections between MCH-containing neurons and areas of the brain involved in taste and olfaction. The receptor is also found in parts of the hypothalamus, such as the ventromedial nucleus, that are known to regulate feeding and metabolism. The MCH receptor is expressed at moderate levels in the substantia nigra, ventral tegmental area and amygdala, suggesting that MCH may modulate the dopaminergic system. Expression has also been found in the locus coeruleus, indicating a possible role in the control of noradrenaline responses, including vigilance, attention, memory and sleep
