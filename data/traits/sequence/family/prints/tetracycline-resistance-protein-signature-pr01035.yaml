identifier: PRINTS:PR01035
label: "Tetracycline resistance protein signature"
definition: >-
  This entry represents Tetracycline resistance protein, class A from Escherichia coli (TetA), Multidrug resistance protein MdtG from Escherichia coli, Quinolone resistance protein NorA from Staphylococcus aureus and similar sequences found in all cellular organisms. Members of this family belong to major facilitator superfamily (MFS), the largest and most diverse superfamily of secondary active transporters. The tetracycline resistance protein Tet(A) is a tetracycline efflux protein that functions as a metal-tetracycline/H+ antiporter. This is an energy-dependent process that decreases the accumulation of the antibiotic in whole cells. Tet(A) is encoded by the transposon Tn10, and is an integral membrane protein with twelve potential transmembrane domains. Site-directed mutagenesis studies have shown that a negative charge at position 66 is essential for tetracycline transport, and that the region that includes the dipeptide plays an important role in metal-tetracycline transport; it perhaps acts as a gate that opens on the charge-charge interaction between Asp66 and the metal-tetracycline. The histidine at position 257 plays an essential role in H+ translocation. Multidrug resistance protein MdtG is found in enterobacteria and confers resistance to fosfomycin and deoxycholate.
definition_source: "InterPro:IPR001958 abstract (PRINTS PR01035 is a member signature)"
