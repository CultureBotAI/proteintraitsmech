identifier: PRINTS:PR01198
label: "Betaine transporter signature"
definition: >-
  Neurotransmitter transport systems are integral to the release, re-uptake and recycling of neurotransmitters at synapses. High affinity transport proteins found in the plasma membrane of presynaptic nerve terminals and glial cells are responsible for the removal from the extracellular space of released-transmitters, thereby terminating their actions. Plasma membrane neurotransmitter transporters fall into two structurally and mechanistically distinct families. The majority of the transporters constitute an extensive family of homologous proteins that derive energy from the co-transport of Na + and Cl -, in order to transport neurotransmitter molecules into the cell against their concentration gradient. The family has a common structure of 12 presumed transmembrane helices and includes carriers for gamma-aminobutyric acid (GABA), noradrenaline/adrenaline, dopamine, serotonin, proline, glycine, choline, betaine and taurine. They are structurally distinct from the second more-restricted family of plasma membrane transporters, which are responsible for excitatory amino acid transport. The latter couple glutamate and aspartate uptake to the cotransport of Na + and the counter-transport of K +, with no apparent dependence on Cl -. In addition, both of these transporter families are distinct from the vesicular neurotransmitter transporters. Cells regulate their volume and adapt to alterations in the tonicity of their local environment by adjusting their solute content accordingly. Resultant water movements rapidly establish osmotic balance. Solutes utilised in this manner are referred to as osmolytes and include: glycerophosphorylcholine, betaine, myo-inositol, sorbitol and taurine. Cell membrane transporters for betaine and taurine have been cloned, and by sequence similarity
