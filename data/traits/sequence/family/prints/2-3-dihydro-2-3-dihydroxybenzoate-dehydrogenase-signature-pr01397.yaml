identifier: PRINTS:PR01397
label: "2,3-dihydro-2,3-dihydroxybenzoate dehydrogenase signature"
definition: >-
  The absence of free iron molecules in the surrounding environment triggers transcription of gene clusters that encode both siderophore-synthesis enzymes, and receptors that recognise iron-bound siderophores. Classic examples are the enterobactin/enterochelin clusters found in Escherichia coli and Salmonella, although similar moieties in other pathogens have been identified. The enzymic machinery that produces vibrionectin in Vibrio cholerae is such a homologue. EntA, a 2,3-dihydro-2,3-dihydroxybenzoate dehydrogenase enzyme, is the third enzyme in the biosynthesis of 2,3-dihydroxybenzoic acid (DHB) from chorismate in Escherichia coli. It converts isochorismate to DHB, used for the synthesis of iron chelator enterobactin. Bacillus subtilis possesses similar genes involved in siderophore biosynthesis. Deletion studies involving EntA-mutants have shown that it is essential for virulence.
definition_source: "InterPro:IPR003560 abstract (PRINTS PR01397 is a member signature)"
