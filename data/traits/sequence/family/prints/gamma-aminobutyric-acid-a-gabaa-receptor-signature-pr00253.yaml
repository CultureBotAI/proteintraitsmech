identifier: PRINTS:PR00253
label: "Gamma-aminobutyric acid A (GABAA) receptor signature"
definition: >-
  Gamma-aminobutyric acid type A (GABAA) receptors are members of the neurotransmitter ligand-gated ion channels: they mediate neuronal inhibition on binding GABA. The effects of GABA on GABAA receptors are modulated by a range of therapeutically important drugs, including barbiturates, anaesthetics and benzodiazepines (BZs). The BZs are a diverse range of compounds, including widely prescribed drugs, such as librium and valium, and their interaction with GABAA receptors provides the most potent pharmacological means of distinguishing different GABAA receptor subtypes. GABAA receptors are pentameric membrane proteins that operate GABA-gated chloride channels. Eight types of receptor subunit have been cloned, with multiple subtypes within some classes: alpha 1-6, beta 1-4, gamma 1-4, delta, epsilon, pi, rho 1-3 and theta. Subunits are typically 50-60kDa in size and comprise a long N-terminal extracellular domain, containing a putative signal peptide and a disulphide-bonded β structural loop; 4 putative transmembrane (TM) domains; and a large cytoplasmic loop connecting the third and fourth TM domains. Amongst family members, the large cytoplasmic loop displays the most divergence in terms of primary structure, the TM domains showing the highest level of sequence conservation. Most GABAA receptors contain one type of alpha and beta subunit, and a single gamma polypeptide in a ratio of 2:2:1, though in some cases other subunits such as epsilon or delta may replace gamma. The BZ binding site is located at the interface of adjacent alpha and gamma subunits; therefore, the type of alpha and gamma subunits present is instrumental in determining BZ selectivity and sensitivity. Receptors can be categorised into 3 groups based on their alpha subunit content and, hence, sensitivity
