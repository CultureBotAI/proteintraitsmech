identifier: PRINTS:PR00105
label: "Cytosine-specific DNA methyltransferase signature"
definition: >-
  C-5 cytosine-specific DNA methylases ( ) (C5 Mtase) are enzymes that specifically methylate the C-5 carbon of cytosines in DNA to produce C5-methylcytosine. In mammalian cells, cytosine-specific methyltransferases methylate certain CpG sequences, which are believed to modulate gene expression and cell differentiation. In bacteria, these enzymes are a component of restriction-modification systems and serve as valuable tools for the manipulation of DNA. The structure of HhaI methyltransferase (M.HhaI) has been resolved to 2.5 A: the molecule folds into 2 domains - a larger catalytic domain containing catalytic and cofactor binding sites, and a smaller DNA recognition domain. This entry also includes tRNA (cytosine(38)-C(5))-methyltransferase ( ), also known as DNMT2 (DNA (cytosine-5)-methyltransferase-like protein 2), that specifically methylates cytosine 38 in the anticodon loop of tRNA (Asp).
definition_source: "InterPro:IPR001525 abstract (PRINTS PR00105 is a member signature)"
