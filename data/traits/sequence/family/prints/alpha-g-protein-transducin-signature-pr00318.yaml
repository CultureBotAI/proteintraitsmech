identifier: PRINTS:PR00318
label: "Alpha G protein (transducin) signature"
definition: >-
  This family consists of the G protein alpha subunit, which acts as a weak GTPase. G protein classes are defined based on the sequence and function of their alpha subunits, which in mammals fall into four main categories: G alpha-S ( InterPro:IPR000367 ), G alpha-Q ( InterPro:IPR000654 ), G alpha-I ( InterPro:IPR001408 ) and G alpha-12 ( InterPro:IPR000469 ); there are also fungal ( InterPro:IPR002975 ) and plant classes ( InterPro:IPR002976 ) of alpha subunits. Many alpha subunits are substrates for ADP-ribosylation by cholera or pertussis toxins. They are often N-terminally acylated, usually with myristate and/or palmitoylate, and these fatty acid modifications are probably important for membrane association and high-affinity interactions with other proteins. Guanine nucleotide binding proteins (G-proteins) are membrane-associated, heterotrimeric proteins composed of three subunits: alpha ( InterPro:IPR001019 ), beta ( InterPro:IPR001632 ) and gamma ( InterPro:IPR001770 ). G proteins and their receptors (GPCRs) form one of the most prevalent signalling systems in mammalian cells, regulating systems as diverse as sensory perception, cell growth and hormonal regulation. At the cell surface, the binding of ligands such as hormones and neurotransmitters to a GPCR activates the receptor by causing a conformational change, which in turn activates the bound G protein on the intracellular-side of the membrane. The activated receptor promotes the exchange of bound GDP for GTP on the G protein alpha subunit. GTP binding changes the conformation of switch regions within the alpha subunit, which allows the bound trimeric G protein (inactive) to be released from the receptor, and to dissociate into active alpha subunit (GTP-bound) and beta/gamma dimer. The alpha subunit and the bet
