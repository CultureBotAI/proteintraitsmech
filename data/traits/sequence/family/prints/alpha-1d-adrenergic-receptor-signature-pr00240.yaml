identifier: PRINTS:PR00240
label: "Alpha-1D adrenergic receptor signature"
definition: >-
  This entry represents alpha 1D adrenoceptor, whose pharmacological profile closely resembles that of the alpha 1A adrenoceptor. It appears to be widely distributed in the rat, with high levels in peripheral tissues, such as the vas deferens and in the CNS, mainly the hippocampus, cerebral cortex and brainstem. Alpha 1D adrenoceptor is the predominant alpha 1 subtype in the human aorta, but has the lowest expression of the three subtypes in other arteries and veins. However, it shows high expression in blood vessels of human prostate and bladder. Alpha 1D adrenoceptor has been shown to couple to phospholipase A2 and cause the activation of this enzyme through a pertussis toxin-sensitive pathway in CHO cells. The adrenoceptors (or adrenergic receptors) are rhodopsin-like G protein-coupled receptors that are targets of the catecholamines, especially norepinephrine (noradrenaline) and epinephrine (adrenaline). Many cells possess these receptors, and the binding of a catecholamine to the receptor will generally stimulate the sympathetic nervous system, effect blood pressure, myocardial contractile rate and force, airway reactivity, and a variety of metabolic and central nervous system functions. The clinical uses of adrenergic compounds are vast. Agonists and antagonists interacting with adrenoceptors have proved useful in the treatment of a variety of diseases, including hypertension, angina pectoris, congestive heart failure, asthma, depression, benign prostatic hypertrophy, and glaucoma. These drugs are also useful in several other therapeutic situations including shock, premature labour and opioid withdrawal, and as adjuncts to general anaesthetics. There are three classes of adrenoceptors, based on their sequence similarity, receptor pharmacology and signalling mechanis
