identifier: PRINTS:PR01391
label: "Binary toxin B family signature"
definition: >-
  This entry represents the protective antigen (PA) of Bacillus anthracis which forms the "B" component of the anthrax exotoxin. PA mediates attachment to host cells by binding the receptors ANTXR1 and ANTXR2. PA associated with LF forms the lethal toxin (LeTx), which causes death when injected, whilst PA associated with EF forms the edema toxin (EdTx), which produces edema. PA also induces immunity to anthrax infection. Following host cell surface attachment, PA is cleaved by FURIN to generate the mature PA-63 form, which oligomerizes into ring-shaped pre-pore complexes that associate with EF and LF. These toxin-loaded complexes are endocytosed in a clathrin-dependent process, after which the low pH of the endosome triggers a conformational change from the pre-pore to pore state. Once active, the pore mediates unfolding of EF and LF, allowing their translocation into the host cytosol. A large group of bacterial exotoxins are referred to as "A/B toxins", essentially because they are formed from two subunits. The "A" subunit possesses enzyme activity, and is transferred to the host cell following a conformational change in the membrane-bound transport "B" subunit. Clostridial species are one of the major causes of food poisoning/gastro-intestinal illnesses. They are Gram-positive, spore-forming rods that occur naturally in the soil. Among the toxins produced by certain Clostridium spp. are the binary exotoxins. These proteins consist of two independent polypeptides, which correspond to the A/B subunit moieties. The enzyme component (A) enters the cell through endosomes produced by the oligomeric binding/translocation protein (B), and prevents actin polymerisation through ADP-ribosylation of monomeric G-actin. Members of the "B" binary toxin family also include the Bacillus
