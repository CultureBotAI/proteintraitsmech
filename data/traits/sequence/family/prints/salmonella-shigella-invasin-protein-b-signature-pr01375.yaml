identifier: PRINTS:PR01375
label: "Salmonella/Shigella invasin protein B signature"
definition: >-
  Secretion of virulence factors in Gram-negative bacteria involves transportation of the protein across two membranes to reach the cell exterior. There have been four secretion systems described in animal enteropathogens, such as Salmonella and Yersinia, with further sequence similarities in plant pathogens like Ralstonia and Erwinia. The type III secretion system is of great interest, as it is used to transport virulence factors from the pathogen directly into the host cell and is only triggered when the bacterium comes into close contact with the host. The protein subunits of the system are very similar to those of bacterial flagellar biosynthesis. However, while the latter forms a ring structure to allow secretion of flagellin and is an integral part of the flagellum itself, type III subunits in the outer membrane translocate secreted proteins through a channel-like structure. Exotoxins secreted by the type III system do not possess a secretion signal, and are considered unique for this reason. Certain proteobactria, including Salmonella and Shigella spp., secrete invasin protein B, which is required for internalisation of the bacterium within the host cell. Induction of apoptosis is then carried out, by the binding of IL-1 converting enzyme to the exotoxin. This entry represents invasin protein B from various proteobacteria, including: SipB (also known as SPI-1 type 3 secretion system translocon protein SctE) from Salmonella sp., which is required for entry into the host cell through presentation or delivery of SipC at the host cell plasma membrane. Along with SipC, SipB is necessary for the transfer of other effector proteins into the host cell. It induces macrophage apoptosis either by binding and activating the proapoptotic enzyme caspase-1 (caspase-1 dependent),
