identifier: PRINTS:PR01816
label: "Beta-site APP cleaving enzyme 1 (BACE1) signature"
definition: >-
  The beta-site APP cleaving enzyme-1 (BACE1), also known as Aspartyl protease 2 and memapsin-2, mediates one of the two proteolytic cleavages of beta-amyloid precursor protein (APP) to yield the amyloid β-peptide (Abeta), a key pathogenic agent in Alzheimer's disease (AD). Axonal and Schwann cell BACE1 is also required for remyelination of injured nerves. BACE1 inhibitor drugs have been evaluated for AD treatment. BACE1 is (EC:3.4.23.46) and MEROPS identifier A01.004.
