identifier: PRINTS:PR00925
label: "Nonhistone chromosomal protein HMG17 family signature"
definition: >-
  This entry represents the HMGN family, whose members promote chromatin unfolding, enhance access to nucleosomes, and modulate transcription from chromatin templates. HMGNs are expressed only in vertebrates. The high mobility group (HMG) proteins are the most abundant and ubiquitous nonhistone chromosomal proteins. They bind to DNA and to nucleosomes and are involved in the regulation of DNA-dependent processes such as transcription, replication, recombination, and DNA repair. They can be grouped into three families: HMGB (HMG 1/2), HMGN (HMG 14/17) and HMGA (HMG I/Y). The characteristic domains are: AT-hook for the HMGA family, the HMG Box for the HMGB family, and the nucleosome-binding domain (NBD) for the members of the HMGN family.
definition_source: "InterPro:IPR000079 abstract (PRINTS PR00925 is a member signature)"
