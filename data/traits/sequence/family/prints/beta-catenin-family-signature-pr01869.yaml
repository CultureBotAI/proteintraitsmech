identifier: PRINTS:PR01869
label: "Beta-catenin family signature"
definition: >-
  Three different forms of catenin (designated alpha, beta and gamma) comprise the cytoplasmic domain of the cadherin cell-cell adhesion complex. Beta-catenin forms a cadherin/beta-catenin/alphaE-catenin complex that can tether the tripartite adhesion complex and regulate actin dynamics. This entry represents the beta catenins and homologues, plakoglobin and the Drosophila Armadillo protein, which are implicated in cell adhesion and Wnt signalling. Originally identified as downstream elements (armadillo phenotype) of the Wnt signalling pathway (wingless phenotype). The beta-catenin structure has been determined. Beta catenin family proteins contain several ARM repeats, sequences of approximately 50 amino acids involved in protein-protein interactions. Each repeat consists of three helices, with helix 1 and 3 antiparallel to each other and perpendicular to helix 2. A conserved glycine residue allows the sharp turn between helices 1 and 2.
definition_source: "InterPro:IPR013284 abstract (PRINTS PR01869 is a member signature)"
