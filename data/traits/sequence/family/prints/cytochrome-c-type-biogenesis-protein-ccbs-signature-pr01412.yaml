identifier: PRINTS:PR01412
label: "Cytochrome c-type biogenesis protein CcbS signature"
definition: >-
  Analysis of a transcribed region in the mitochondrial genome from members of the genus Oenothera, revealed an open reading frame (ORF) that is also conserved in Daucus carota (Carrot). Extensive RNA editing (46 C to U transitions) alters the Oenothera bertiana mRNA sequence, yielding a sequence with high similarity to the homologous gene product in Marchantia polymorpha (Liverwort). The deduced polypeptides share significant similarity with the ccl1-encoded protein involved in cytochrome c biogenesis in the photosynthetic bacterium Rhodobacter capsulatus. A highly conserved domain is also found in plastid ORFs, suggesting that these bacterial, chloroplast and mitochondrial genes encode polypeptides with analogous functions in assembly and maturation of cytochromes c.
definition_source: "InterPro:IPR003569 abstract (PRINTS PR01412 is a member signature)"
