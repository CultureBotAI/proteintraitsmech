identifier: PRINTS:PR00810
label: "Bacterial general secretion pathway protein C signature"
definition: >-
  GspC is part of the type 2 secretion systems (T2SSs). GspC interacts with GspD. It is an inner membrane protein consisting of a short N-terminal cytoplasmic sequence and an α-helical transmembrane segment, followed by two periplasmic domains: a so-called homology region (HR) and a C-terminal PDZ domain. The type II secretion system (T2SS) is one of several extracellular secretion systems in gram-negative bacteria. It delivers toxins and a range of hydrolytic enzymes including proteases, lipases and carbohydrate-active enzymes to the cell surface or extracellular space. T2SS systems are composed of 11 to 15 different proteins, which are generally called GspA to GspO and GspS. The T2SS spans the two bacterial membranes and ensures secretion of folded proteins across the outer membrane pore formed by GspD. The inner membrane complex contains GspC, GspL, GspM, and GspF. The cytoplasmic domains of GspL and GspF interact with an ATPase, GspE. GspE is thought to energize the formation of a short pseudopilus by several pilin-like proteins, GspG to GspK. GspD has been shown to interact with the inner membrane component GspC.
