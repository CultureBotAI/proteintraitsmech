identifier: PRINTS:PR00300
label: "ATP-dependent Clp protease ATP-binding subunit signature"
definition: >-
  This family belongs to the AAA+ (ATPase associated with diverse cellular activities) superfamily. Most of these proteins of this family (ClpA, ClpC, ClpD, ClpE, ClpX, HslU) are involved in proteolysis and associate with a separate proteolytic subunit (ClpP, HslV) to form the active protease. ClpB is not involved in proteolysis but rather acts in collaboration with the DnaK (Hsp70) chaperone system to disassemble and refold large protein aggregates. A group of ATP-binding proteins that includes the regulatory subunit of the ATP-dependent protease clpA; heat shock proteins clpB, 104 and 78; and chloroplast proteins CD4a (ClpC) and CD4b belong to this family. The proteins are thought to protect cells from stress by controlling the aggregation and denaturation of vital cellular structures. They vary in size, but share a domain which contains an ATP-binding site. These signatures which span the ATP binding region also identify the bacterial DNA polymerase III subunit tau (EC:2.7.7.7), ATP-dependent protease La (EC:3.4.21.53) and the mitochondrial lon protease homologue (EC:3.4.21), both of which belong to MEROPS peptidase family S16. This entry also includes Mitochondrial disaggregase from vertebrates, which despite its gene name (CLPB), this protein differs in domain structure from bacterial ClpB. Bacterial ClpB contains two AAA modules, one in the N-terminal part of the protein and one in the C-terminal part, separated by a coiled coil, while vertebrate CLPB contains a single C-terminal AAA region and an N-terminal ANK repeat region which is absent from bacterial ClpB. Clp proteins are modular ATP-dependent chaperones and proteases that typically contain distinct domains essential for their function. Most Clp proteins have an N-terminal domain that often determines substra
