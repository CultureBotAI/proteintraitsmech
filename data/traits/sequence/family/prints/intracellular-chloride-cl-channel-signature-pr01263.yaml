identifier: PRINTS:PR01263
label: "Intracellular chloride (Cl-) channel signature"
definition: >-
  The chloride intracellular channel (CLIC) family represent a subgroup of the glutathione-S-transferase (GSTs) superfamily. CLIC proteins can exist as both soluble globular proteins and integral membrane proteins with ion channel function. Membrane insertion seems to be redox-regulated and has a strong pH dependence. CLIC proteins are enigmatic as they do not fit the patterns of other, well-characterised ion channel proteins that show clear and often multiple TM domains. They share a conserved C-terminal CLIC module, with several members containing additional, unrelated N-terminal domains. CLIC proteins are highly conserved in vertebrates, which usually possess six distinct paralogues (CLIC1-CLIC6). They are multifunctional proteins and participate in a wide variety of signaling activities.
definition_source: "InterPro:IPR002946 abstract (PRINTS PR01263 is a member signature)"
