identifier: PRINTS:PR00222
label: "Cucumovirus coat protein signature"
definition: >-
  Cucumoviruses are tripartite RNA plant viruses believed to share a close evolutionary relationship with Brome mosaic virus (BMV). The cucumoviruses include: Cucumber mosaic virus, Peanut stunt virus (PSV) and Tomato aspermy virus (TAV). The viral coat proteins show a high degree of sequence similarity.
