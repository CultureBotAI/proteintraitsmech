identifier: PRINTS:PR01875
label: "Eight-Twenty-One (ETO) family signature"
definition: >-
  This entry represents the CBFA2T family, whose members include CBFA2T1/2/3. They are transcriptional corepressors which facilitate transcriptional repression via its association with DNA-binding transcription factors and recruitment of other corepressors and histone-modifying enzymes.
