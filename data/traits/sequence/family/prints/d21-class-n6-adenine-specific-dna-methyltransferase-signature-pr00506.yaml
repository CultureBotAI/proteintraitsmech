identifier: PRINTS:PR00506
label: "D21 class N6 adenine-specific DNA methyltransferase signature"
definition: >-
  This protein family includes SAM-dependent beta subtype DNA methyltransferases that methylate exocyclic nitrogens and form either N4-methylcytosine (N4-MTases) or N6-methyladenine (N6-MTases), including Type III restriction-modification enzyme EcoPI Mod subunit from Escherichia phage P1, a component of the beta subtype methylase that binds the system-specific DNA recognition site 5'-AGACC-3' and methylates A-3 of only 1 strand.
definition_source: "InterPro:IPR002295 abstract (PRINTS PR00506 is a member signature)"
