identifier: PRINTS:PR00938
label: "Brachyury protein family signature"
definition: >-
  The T-box gene family is an ancient group of putative transcription factors that appear to play a critical role in the development of all animal species. These genes were uncovered on the basis of similarity to the DNA binding domain of murine Brachyury (T) gene product, which similarity is the defining feature of the family. The Brachyury gene is named for its phenotype, which was identified 70 years ago as a mutant mouse strain with a short blunted tail. The gene, and its paralogues, have become a well-studied model for the family, and hence much of what is known about the T-box family is derived from the murine Brachyury gene. Consistent with its nuclear location, Brachyury protein has a sequence-specific DNA-binding activity and can act as a transcriptional regulator. Homozygous mutants for the gene undergo extensive developmental anomalies, thus rendering the mutation lethal. The postulated role of Brachyury is as a transcription factor, regulating the specification and differentiation of posterior mesoderm during gastrulation in a dose-dependent manner. Common features shared by T-box family members are, DNA-binding and transcriptional regulatory activity, a role in development and conserved expression patterns, most of the known genes in all species being expressed in mesoderm of mesoderm precursors. Members of the T-box family contain a domain of about 170 to 190 amino acids known as the T-box domain and which probably binds DNA.
definition_source: "InterPro:IPR002070 abstract (PRINTS PR00938 is a member signature)"
