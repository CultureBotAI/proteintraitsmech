identifier: PRINTS:PR02026
label: "YtrC/YtrD probable ABC transporter permease signature"
definition: >-
  The genome of Bacillus subtilis, a well-characterised Gram-positive bacterium, encodes 4,100 protein-coding genes.Within the genome, six ytr genes form a single operon, ytrABCDEF, which may play a role in acetoin utilisation during stationary phase and sporulation, and is believed to encode a putative ATP-binding cassette (ABC) transport system.It has been suggested that YtrC and YtrD, which are highly hydrophobic proteins, may form a channel through the cell membrane: YtrC is predicted to contain nine TM segments and YtrD only eight.
definition_source: "InterPro:IPR023264 abstract (PRINTS PR02026 is a member signature)"
