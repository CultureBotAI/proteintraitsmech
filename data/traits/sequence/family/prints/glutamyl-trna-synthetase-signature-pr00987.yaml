identifier: PRINTS:PR00987
label: "Glutamyl-tRNA synthetase signature"
definition: >-
  Glutamate-tRNA ligase (also known as glutamyl-tRNA synthetase; ) is a class I aminoacyl-tRNA synthetase. This enzyme shares similarities with glutaminyl-tRNA synthetase in terms of structure and catalytic properties. Glutamyl-tRNA synthetase (GluRS) and glutaminyl-tRNA synthetase (GlnRS) are grouped in the GlxRS subclass because of the shared evolutionary pathway of their catalytic domains. The catalytic domain of Glx subfamily is believed to be more ancient, having evolved from a common GluRS ancestor that contained only the catalytic domain. Anticodon binding domains of extant bacterial and eukaryotic/archeal GlxRS appeared independently at a later stage, with the anticodon-binding domain of bacterial GlnRS being acquired by an unique horizontal gene transfer event from the eukaryotic kingdom. Bacterial GluRS are divided into two groups -discriminatory GluRS (D-GluRS) and non-discriminatory GluRS (ND-GluRS). While D-GluRS exclusively catalyses the transfer of Glu to tRNA(Glu), the ND-GluRS can also glutamylate tRNA(Gln) forming Glu-tRNAGln. The misacylated product is then transformed to Gln-tRNA(Gln) by an enzyme known as glutamyl-tRNA(Gln) amidotransferase. The bacterial GluRS structure consists of four domains. The N-terminal half (domains 1 and 2) contains the 'Rossman fold' typical for class I aminoacyl-tRNA synthetases and resembles the corresponding part of GlnRS, whereas the C-terminal half exhibits a GluRS-specific structural features. Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided i
