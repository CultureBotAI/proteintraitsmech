identifier: PRINTS:PR01424
label: "Transforming growth factor beta 1 precursor signature"
definition: >-
  The transforming growth factors-beta constitute a family of multi-functional cytokines that regulate cell growth and differentiation. Many cells synthesise TGF-beta, and essentially all have specific receptors for this peptide. TGF-beta regulates the actions of many other peptide growth factors and determines a positive or negative direction of their effects. The solution structure of human TGF-beta 1 was determined using multinuclear magnetic resonance spectroscopy with hybrid distance geometry/simulated annealing. The structure shows a high degree of similarity to that of TGF-beta 2, but with notable differences in structure and flexibility. Examination of TGF-beta 1 mRNA levels in adult murine tissues indicates that expression is predominant in spleen, lung and placenta. TGF-beta 1 is believed to play important roles in pathologic processes.
