identifier: PRINTS:PR00652
label: "5-hydroxytryptamine 7 receptor signature"
definition: >-
  5-hydroxytryptamine (5-HT) or serotonin, is a neurotransmitter that it is primarily found in the gastrointestinal (GI) tract, platelets, and in the central nervous system (CNS). It is implicated in a vast array of physiological and pathophysiological pathways. Receptors for 5-HT mediate both excitatory and inhibitory neurotransmission, and modulate the release of many neurotransmitters including glutamate, GABA, dopamine, epinephrine/norepinephrine, and acetylcholine, as well as many hormones, including oxytocin, prolactin, vasopressin and cortisol. In the CNS, 5-HT receptors can influence various neurological processes, such as aggression, anxiety and appetite and, as a, result are the target of a variety of pharmaceutical drugs, including many antidepressants, antipsychotics and anorectics. The 5-HT receptors are grouped into a number of distinct subtypes, classified according to their antagonist susceptibilities and their affinities for 5-HT. With the exception of the 5-HT3 receptor, which is a ligand-gated ion channel, all 5-HT receptors are members of the rhodopsin-like G protein-coupled receptor family, and they activate an intracellular second messenger cascade to produce their responses. The 5-HT7 receptor has been shown to positively modulate cAMP formation and activate the mitogen-activated protein kinase, ERK, in primary neuronal cultures. The receptor is expressed in a variety of human tissues, particularly in the brain, the gastrointestinal tract, and in various blood vessels. It has an extensive vascular distribution and is responsible for the prominent, persistent vasodilator response to 5-HT7 in anaesthetised animals. 5-HT7 receptors are involved in thermoregulation circadian rhythm, learning and memory, and sleep. This receptor has been a drug developme
