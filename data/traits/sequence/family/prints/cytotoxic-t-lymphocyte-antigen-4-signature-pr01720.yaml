identifier: PRINTS:PR01720
label: "Cytotoxic T-lymphocyte antigen 4 signature"
definition: >-
  T cell-dependent immune processes require cell-surface interactions that mediate the initiation, modulation and the ultimate course of the response. The specificity of T cell recognition is determined by the engagement of the T cell receptor (TCR) on T cells with cognate peptide-MHC complexes presented by antigen presenting cells (APCs). Additional signals are required to sustain and enhance T cell activity, the most important of which is provided by the engagement of CD28 on T cells with its ligands B7-1 (CD80) and B7-2 (CD86). By contrast, the interaction of B7 isoforms with cytotoxic T lymphocyte-associated molecule-4 CTLA-4, a CD28 homologue receptor on T cells (31% identity), provides inhibitory signals required for down-regulation of the response, while it may also prevent T cell activation by weak TCR signals. Unlike CD28, which is not expressed on resting T cells, CTLA-4 is not detected on the cell surface until 24 hours after activation. In fact, T cell activation leads to both increased CTLA4 gene expression and trafficking of CTLA4 protein to the cell surface. In addition, CTLA-4 exhibits an affinity for the B7 isoforms that is 10 to 100 times that for CD28. Covalent dimerisation of CTLA4 is required for its high binding avidity, but each monomeric subunit also contains a binding site for CD80 and CD86. It is likely that CTLA-4 directly competes with CD28 for binding B7 and also directs the assembly of inhibitory signalling complexes that lead to quiescence or anergy. Thus the balance between the opposing signals elicited by CD28 and CTLA-4 is central to the regulation of T cell responsiveness and homeostasis. One mechanism by which CTLA-4 may perform this function is by regulating cell-cycle progression; by contrast with CD28, which down-regulates the cell-c
