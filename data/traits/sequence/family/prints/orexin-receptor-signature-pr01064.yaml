identifier: PRINTS:PR01064
label: "Orexin receptor signature"
definition: >-
  The neuropeptide hormone orexin stimulates appetite and food consumption, and is found in the hypothalamus, which has been shown to be the 'feeding centre' and plays a central role in the integrated control of feeding and energy homeostasis. It also has a prominent role in promoting wakefulness. The orexin receptor (also referred to as the hypocretin receptor) is a rhodopsin-like G protein-coupled receptor that binds orexin. There are two subtypes; orexin receptor 1 (OX1) and orexin receptor 2 (OX2). This entry represents the orexin receptor family.
