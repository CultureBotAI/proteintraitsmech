identifier: PRINTS:PR01581
label: "Kv3.1 voltage-gated K+ channel signature"
definition: >-
  The Kv family can be divided into several subfamilies on the basis of sequence similarity and function. Four of these subfamilies, Kv1 (Shaker), Kv2 (Shab), Kv3 (Shaw) and Kv4 (Shal), consist of pore-forming alpha subunits that associate with different types of beta subunit. Each alpha subunit comprises six hydrophobic TM domains with a P-domain between the fifth and sixth, which partially resides in the membrane. The fourth TM domain has positively charged residues at every third residue and acts as a voltage sensor, which triggers the conformational change that opens the channel pore in response to a displacement in membrane potential. More recently, 4 new electrically-silent alpha subunits have been cloned: Kv5 (KCNF), Kv6 (KCNG), Kv8 and Kv9 (KCNS). These subunits do not themselves possess any functional activity, but appear to form heteromeric channels with Kv2 subunits, and thus modulate Shab channel activity. When highly expressed, they inhibit channel activity, but at lower levels show more specific modulatory actions. A voltage-dependent potassium channel gene designated Shaw was initially isolated from Drosophila melanogaster (Fruit fly). Subsequently, several vetebrate potassium channels with similar amino acid sequences were found and, together with the D. melanogaster channel, now constitute the Kv3 family. These channels are thought to play a role in shortening of action potential durations and modulating pre-synaptic neurotransmitter release. In mammals, the family consists of 4 genes (Kv3.1, Kv3.2, Kv3.3 and Kv3.4). Each gene product has its own subcellular location and function. Kv3.1 channels have slow-rising delayed rectifier-type outward currents that inactivate slowly. They play a role in the fast action potential repolarisation abundant in rapidly
