identifier: PRINTS:PR02062
label: "78 kDa centrosomal protein signature"
definition: >-
  The 78kDa centrosomal proteins are thought to aid the centrosome structure by helping to form microtubules, although this has yet to be been fully confirmed. Their sequences are believed to contain 3 leucine-rich (LRR) repeats, and a potential coiled-coil region towards the C terminus, but the functionality conferred on the proteins by the possession of these domains is currently unknown.
