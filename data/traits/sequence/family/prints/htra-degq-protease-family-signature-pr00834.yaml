identifier: PRINTS:PR00834
label: "HtrA/DegQ protease family signature"
definition: >-
  This group of serine peptidases and non-peptidase homologues belong to the MEROPS peptidase family S1, subfamily S1C (protease Do subfamily, clan PS(S)). A type example is the protease Do from Escherichia coli. This entry also includes the membrane transporter protein MamO and the magnetosome formation protease MamE. MamO promotes magnetite nucleation/formation and activates the MamE protease. MamE is required for correct localization of proteins to the magnetosome while the protease activity is required for maturation of small magnetite crystals into larger, functional ones.
definition_source: "InterPro:IPR001940 abstract (PRINTS PR00834 is a member signature)"
