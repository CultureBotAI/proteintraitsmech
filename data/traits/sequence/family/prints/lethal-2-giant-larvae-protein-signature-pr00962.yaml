identifier: PRINTS:PR00962
label: "Lethal(2) giant larvae protein signature"
definition: >-
  The lethal(2)giant larvae protein (Lgl) of Drosophila is essential for polarised epithelia development, for cell polarity associated with asymmetric cell division of neuroblasts during development and for oocyte polarity formation. As a result of alternative splicing Lgl has two isoforms that differ in their C-terminal region, isoform p78 which has an essential role in control of cell proliferation and differentiation during development as well as in controlling membrane trafficking underlying axonal growth and acts as a tumour suppressor; and isoform p127 which has an accessory function in cell proliferation control and differentiation during development. These proteins, and their homologues, contain conserved functional domains such as homo-oligomerization domains, a cluster of phosphorylation sites and at least two WD-40 repeats, which suggests that these proteins have closely related functions.
definition_source: "InterPro:IPR000664 abstract (PRINTS PR00962 is a member signature)"
