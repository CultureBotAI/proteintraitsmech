identifier: PRINTS:PR01881
label: "Limb-bud-and-heart protein signature"
definition: >-
  LBH (limb-bud and heart) protein may act as a transcriptional activator in mitogen-activated protein kinase signalling pathway to mediate cellular functions. It has been shown to regulate cardiac gene expression by modulating the combinatorial activities of key cardiac transcription factors, as well as their individual functions in cardiogenesis in mice.
