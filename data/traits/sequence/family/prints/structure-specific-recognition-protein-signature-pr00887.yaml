identifier: PRINTS:PR00887
label: "Structure-specific recognition protein signature"
definition: >-
  FACT (facilitates chromatin transactions) is a general chromatin factor that acts to reorganise nucleosomes. It is a complex that consists of several subunits. This entry represents the FACT complex subunits POB3, which is present in yeast, and the related SSRP1, found in higher eukaryotes. SSRP1 binds specifically to DNA modified with the anti-cancer drug cisplatin. It contains a high mobility group (HMG) box domain ( InterPro:IPR009071 ) that probably constitutes the structure recognition element for cisplatin-modified DNA, the probable recognition motif being the local duplex unwinding and bending that occurs on formation of intra-strand cross-links.
definition_source: "InterPro:IPR000969 abstract (PRINTS PR00887 is a member signature)"
