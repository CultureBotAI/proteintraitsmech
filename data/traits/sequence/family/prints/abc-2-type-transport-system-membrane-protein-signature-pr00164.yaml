identifier: PRINTS:PR00164
label: "ABC-2 type transport system membrane protein signature"
definition: >-
  This entry includes a varied group of ABC2-type transporters from bacteria and archaea, including Nodulation protein J (NodJ), Doxorubicin resistance ABC transporter permease protein DrrB, Daunorubicin resistance ABC transporter permease protein DrrB1-3, among others. NodJ is part of the NodIJ complex involved in the export of the nodulation factors, the bacterial signal molecules that induce symbiosis and subsequent nodulation induction. DrrB from Mycobacterium tuberculosis is part of the DrrABC complex, involved in doxorubicin resistance. DrrB1-3 are part of the ABC transporter complexes DrrA1B1, DrrA2B2 and DrrA3B3, respectively, which are involved in daunorubicin efflux. They confer self-resistance to daunorubicin, an antibiotic produced by S.coeruleorubidus. ABC transporters belong to the ATP-Binding Cassette (ABC) superfamily which uses the hydrolysis of ATP to energise diverse biological import and export systems. ABC transporters are minimally constituted of two conserved regions: a highly conserved ATP binding cassette (ABC) and a less conserved transmembrane domain (TMD). These regions can be found on the same protein (mostly in eukaryotes and bacterial exporters) or on two different ones (mostly bacterial importers). But in a subgroup of exporters, the transmembrane region is encoded by a separated polypeptide, the ABC-2 type transport system integral membrane protein. The molecular size of this transmembrane protein is around 30kDa. It is thought to contain six transmembrane regions, it either form homooligomeric channels or associate with another type of transmembrane protein to form heteroligomers. The function of the integral inner-membrane protein is to translocate the substrate across the membrane and seems to play an important role in substrate recogni
