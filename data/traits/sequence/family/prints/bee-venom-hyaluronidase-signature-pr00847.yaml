identifier: PRINTS:PR00847
label: "Bee venom hyaluronidase signature"
definition: >-
  Family 56 ( ) encompasses a group of hyaluronidases ( ) that includes venom hyaluronidases and mammalian sperm surface proteins (PH-20). The venom of Apis mellifera (honeybee) contains several biologically-active peptides and two enzymes, one of which is a hyaluronidase. The amino acid sequence of bee venom hyaluronidase contains 349 amino acids, and includes four cysteines and a number of potential glycosylation sites. The sequence shows a high degree of similarity to PH-20, a membrane protein of mammalian sperm involved in sperm-egg adhesion, supporting the view that hyaluronidases play a role in fertilisation. This entry also includes a Tabanus yao protein, Tab y 2.0101, which can cause allergic reactions in humans. O-Glycosyl hydrolases ( ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website.
