identifier: PRINTS:PR00334
label: "HMW kininogen signature"
definition: >-
  The kininogens are multidomain proteins, belonging to the Type 3 cystatin family. It contains three tandemly repeated type 2-like cystatin domains of which only the second and third (D2 and D3) exhibit cysteine peptidase inhibitory activity, and which belong to MEROPS inhibitor family I25B.
