identifier: PRINTS:PR01839
label: "DNA repair protein Rad23 signature"
definition: >-
  All proteins in this family for which functions are known are components of a multiprotein complex used for targeting nucleotide excision repair to specific parts of the genome. Rad23 contains a ubiquitin-like domain that interacts with catalytically active proteasomes and two ubiquitin (Ub)-associated (UBA) sequences that bind Ub. Rad23 interacts with ubiquitinated cellular proteins through the synergistic action of its UBA domains. In humans, Rad23 complexes with the XPC protein.
