identifier: PRINTS:PR00456
label: "Ribosomal protein P2 signature"
definition: >-
  This entry represents a family of eukaryotic ribosomal proteins P1/P2. Eukaryotic ribosomal P proteins have been classified according to their similarity to the mammalian P0, P1 and P2 proteins, all of which share a similar primary structure: an apparently globular N-terminal domain (which includes the protein core); an Ala-rich hinge region; and a highly-acidic Glu/Asp-rich C-terminal domain - this contains the ribosomal P consensus sequence EESDDDMGFGLFD, which protrudes from the ribosomal stalk. The C-terminal regions of Trypanosoma cruzi P proteins are strongly immunogenic in Chagas disease. All 3 forms of the protein show the ability to generate autoimmune responses, but their antigenic properties differ as a result of discrepancies in their C-terminal sequences. The main linear epitope of the T. cruzi P1 and P2 proteins has been mapped to the 13-residue C-terminal sequence (R-13) EEEDDDMGFGLFD. This is identical to the eukaryotic P consensus, but has Ser substituted by Glu, yielding a more hydrophilic sequence, which is critical in determining the immunological reactivity of the T. cruzi R-13 epitope in Chagas disease.
definition_source: "InterPro:IPR001859 abstract (PRINTS PR00456 is a member signature)"
