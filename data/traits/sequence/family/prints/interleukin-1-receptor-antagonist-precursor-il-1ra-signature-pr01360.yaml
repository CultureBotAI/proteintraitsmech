identifier: PRINTS:PR01360
label: "Interleukin-1 receptor antagonist precursor IL-1RA signature"
definition: >-
  This entry represents IL-1RA and Interleukin-36 cytokines. Interleukin-1 receptor antagonist (IL-1RA) binds to the IL-1 receptor, blocking the effects of Interleukin-1 alpha and interleukin-1 beta (IL-1A and IL-1B), whilst eliciting no response of its own. From sequence comparisons, it seems to have arisen by gene duplication before IL-1 diverged into IL-1A and IL-1B, as it has features of both. It seems likely to have the same fold as IL-1A and IL-1B. IL-1A and IL-1B are cytokines that participate in the regulation of immune responses, inflammatory reactions, and hematopoiesis. Interleukin-36 cytokines constitute a novel cluster of cytokines with structural and functional similarities to IL-1. Previously designated as interleukin-1 family members 5 - 10 (IL-1F5 to IL-1F10), they have recently been reclassified according to an updated cytokine nomenclature scheme. Family members include: interleukin-36 alpha, beta and gamma (previously IL-1F6, IL-1F8 and IL-1F9, respectively), which are pro-inflammatory and signal through IL-1Rrp2 and IL-1RAcP. interleukin-36 receptor antagonist (previously IL-1F5), which binds IL-1Rrp2, acting as an antagonist for interleukins signalling via this route. interleukin-37 (IL-1F7), which exerts anti-inflammatory actions by suppressing production of pro-inflammatory cytokines. IL-1F10, whose function is unknown.
