identifier: PRINTS:PR00969
label: "Pili chaperone signature"
definition: >-
  This entry represents pili assembly chaperone proteins, including Chaperone protein FimC, HifB, PsaB and related sequences. Most Gram-negative bacteria possess a supramolecular structure - the pili - on their surface, which mediates attachment to specific receptors. Many interactive subunits are required to assemble pili, but their assembly only takes place after translocation across the cytoplasmic membrane. Periplasmic chaperones assist pili assembly by binding to the subunits, thereby preventing premature aggregation. Pili chaperones are structurally, and possibly evolutionarily, related to the immunoglobulin superfamily: they contain two globular domains, with a topology identical to an immunoglobulin fold. FimC is required for the biogenesis of type 1 fimbriae and also binds and interacts with FimH.
definition_source: "InterPro:IPR001829 abstract (PRINTS PR00969 is a member signature)"
