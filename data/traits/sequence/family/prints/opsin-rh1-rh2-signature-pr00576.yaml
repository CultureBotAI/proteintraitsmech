identifier: PRINTS:PR00576
label: "Opsin RH1/RH2 signature"
definition: >-
  By contrast with vertebrate rhodopsin, which is found in rod cells, insect photoreceptors are found in the ommatidia that comprise the compound eyes. Each Drosophila eye has 800 ommatidia, each of which contains 8 photoreceptor cells (designated R1-R8): R1-R6 are outer cells, while R7 and R8 are inner cells. Opsins RH1 and RH2 have absorption maxima at 480nm and 420nm respectively.
definition_source: "InterPro:IPR001735 abstract (PRINTS PR00576 is a member signature)"
