identifier: PRINTS:PR01663
label: "Mini-chromosome maintenance (MCM) protein 7 signature"
definition: >-
  The MCM2-7 complex consists of six closely related proteins that are highly conserved throughout the eukaryotic kingdom. In eukaryotes, Mcm7 is a component of the MCM2-7 complex (MCM complex), which consists of six sequence-related AAA + type ATPases/helicases that form a hetero-hexameric ring. MCM2-7 complex is part of the pre-replication complex (pre-RC). In G1 phase, inactive MCM2-7 complex is loaded onto origins of DNA replication. During G1-S phase, MCM2-7 complex is activated to unwind the double stranded DNA and plays an important role in DNA replication forks elongation. The components of the MCM2-7 complex are: DNA replication licensing factor MCM2, DNA replication licensing factor MCM3, DNA replication licensing factor MCM4, DNA replication licensing factor MCM5, DNA replication licensing factor MCM6, DNA replication licensing factor MCM7, The human MCM7 gene has been localised to chromosome 7q21.3-q22.1. Increased expression of Mcm7 RNA and protein in MYCN-amplified neuroblastoma tumour and cell lines has been reported. Furthermore, The Mcm7 protein has been shown to form complexes with the retinoblastoma protein. These findings suggest Mcm7- directed DNA replication contributes to neoplastic transformation.
