identifier: PRINTS:PR00790
label: "Peptidyl-glycine alpha-amidating monooxygenase signature"
definition: >-
  In vertebrates, peptidylglycine alpha-amidating monooxygenase (PAM) is a multifunctional protein found in secretory granules. The protein contains two enzymes, peptidylglycine alpha-hydroxylating monooxygenase (PHM) and peptidyl-alpha-hydroxyglycine alpha-amidating lyase (PAL), that act sequentially to catalyse the alpha-amidation of neuroendocrine peptides: peptidylglycine + ascorbate + O 2 = peptidyl-(2-hydroxyglycine) + dehydroascorbate + H 2 O The product is unstable and dismutates to glyoxylate and the corresponding desglycine peptide amide. The first step of the reaction is catalysed by peptidylglycine alpha-hydroxylating monooxygenase (PHM), and is dependent on copper, ascorbate and molecular oxygen; peptidyl-alpha-hydroxyglycine alpha-amidating lyase (PAL) catalyses the second step of the reaction.
definition_source: "InterPro:IPR000720 abstract (PRINTS PR00790 is a member signature)"
