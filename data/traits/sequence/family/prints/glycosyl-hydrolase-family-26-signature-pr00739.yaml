identifier: PRINTS:PR00739
label: "Glycosyl hydrolase family 26 signature"
definition: >-
  O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 26 CAZy:GH26 encompasses mainly mannan endo-1,4-beta-mannosidases (EC:3.2.1.78) and also beta-1,3-xylanases. Mannan endo-1,4-beta-mannosidase hydrolyses mannan and galactomannan, but displays little activity towards other plant cell wall polysaccharides. The enzyme randomly hydrolyses 1,4-beta-D-linkages in mannans, galacto-mannans, glucomannans and galactoglucomannans.
definition_source: "InterPro:IPR000805 abstract (PRINTS PR00739 is a member signature)"
