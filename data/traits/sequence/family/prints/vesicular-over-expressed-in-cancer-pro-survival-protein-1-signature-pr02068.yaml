identifier: PRINTS:PR02068
label: "Vesicular, over-expressed in cancer, pro-survival protein 1 signature"
definition: >-
  Ectopic expression of vesicular, over-expressed in cancer, pro-survival protein 1, VOPP1 (also known as WW domain binding protein VOPP1) increases NF-kappaB transcriptional activity. This is achieved by promoting nuclear translocation and DNA binding of NF-kappaB. Ecop-induced NF-kappaB activation confers cellular resistance to apoptotic challenge. It is believed that ECop is a key regulator of NF-kappaB signalling, and that high-level, amplification-mediated ECop expression, such as occurs in tumours with amplified EGFR, may contribute to resistance to apoptosis.
definition_source: "InterPro:IPR026229 abstract (PRINTS PR02068 is a member signature)"
