identifier: PRINTS:PR00540
label: "Muscarinic M3 receptor signature"
definition: >-
  Muscarinic acetylcholine receptors are members of rhodopsin-like G-protein coupled receptor family. They play several important roles; they mediate many of the effects of acetylcholine in the central and peripheral nervous system and modulate a variety of physiological functions, such as airway, eye and intestinal smooth muscle contraction, heart rate and glandular secretions. The receptors have a widespread tissue distribution and are a major drug target in human disease. They may be effective therapeutic targets in Alzheimer's disease, schizophrenia, Parkinson's disease and chronic obstructive pulmonary disease. Muscarinic acetylcholine M3 receptors are located in smooth muscles, endocrine glands, exocrine glands, lungs, pancreas and the brain. They are found in high levels in neuronal cells of the CNS, their distribution largely overlapping with that of M1 and M4 receptor subtypes. The primary role of M3 muscarinic receptors is contraction of smooth muscle, particularly of airway, ileum, iris and bladder. The receptors are also expressed on pancreatic beta-cells and in areas of the brain where they influence insulin secretion, indicating that M3 receptors might be an important target for understanding the mechanisms of type 2 diabetes mellitus. M3 receptors are also involved in exocrine secretion, particularly of saliva.
