identifier: PRINTS:PR01733
label: "Mycoplasma P48 major surface lipoprotein signature"
definition: >-
  Mycoplasma species are unique amongst bacteria in having very small genomes and lacking cell walls, and are wholly dependent on their host for survival, be it in a symbiotic or pathogenic lifestyle. Some virulent species can quickly adapt to new environments, and utilise a number of cell surface moieties to attach to target cells. Although the most common form of Mycoplasma pathogenesis is respiratory infection, some strains have also been implicated in bacterial vaginosis and rheumatoid arthritis. An outer membrane lipoprotein, designated P48 on account of its 48kDa molecular weight, was purified from Mycoplasma agalactiae. It was found to be a potent differentiation/activation factor of human monocytes, and possesses both immunomodulatory and haematopoietic differentiation activities. This is believed to aid the bacterium by recruiting human blood cells to the point of infection, and altering them to allow intracellular invasion by Mycoplasma. Similar species also use the P48 lipoprotein to invade host cells of sheep and cattle, causing contagious agalactia. Recently, recombinant studies on the Mycoplasma agalactiaeP48 major surface protein have shown that changing key elements at the genetic level decreases the immunomodulatory effects of the gene product. This may lead to a novel vaccine for Mycoplasma infections.
definition_source: "InterPro:IPR008107 abstract (PRINTS PR01733 is a member signature)"
