identifier: PRINTS:PR01552
label: "DNA topoisomerase VI subunit A (TOP6A) signature"
definition: >-
  This entry represents subunit A of topoisomerase VI, a type IIB topoisomerase found predominantly in archaea, but also in a few eukayotes, such as the plant Arabidopsis thaliana. This enzyme assembles as a heterotetramer, consisting of two A subunits required for DNA cleavage and two B subunits required for ATP hydrolysis. The B subunit is structurally similar to the ATPase domain of type IIA topoisomerases, but the A subunit is distinct, and instead shares homology with the Spo11 protein that mediates double-strand DNA breaks during meiotic recombination in eukaryotes. The core of subunit A is a dimer, with a deep groove in which the DNA molecule is thought to bind, with the monomers separating during DNA transport. Therefore, though related to type IIA topoisomerases, topoisomerase VI may have a distinctive mechanism of action. DNA topoisomerases regulate the number of topological links between two DNA strands (i.e. change the number of superhelical turns) by catalysing transient single-or double-strand breaks, crossing the strands through one another, then resealing the breaks. These enzymes have several functions: to remove DNA supercoils during transcription and DNA replication; for strand breakage during recombination; for chromosome condensation; and to disentangle intertwined DNA during mitosis. DNA topoisomerases are divided into two classes: type I enzymes (; topoisomerases I, III and V) break single-strand DNA, and type II enzymes (; topoisomerases II, IV and VI) break double-strand DNA. Type II topoisomerases are ATP-dependent enzymes, and can be subdivided according to their structure and reaction mechanisms: type IIA (topoisomerase II or gyrase, and topoisomerase IV) and type IIB (topoisomerase VI). These enzymes are responsible for relaxing supercoiled DN
