identifier: PRINTS:PR00508
label: "S21 class N4 adenine-specific DNA methyltransferase signature"
definition: >-
  Site-specific DNA-methyltransferase, N-6 adenine-specific DNA methylase ( ) and cytosine-N4-specific ( ) are enzymes that specifically methylate the amino group at the C-4 position of cytosines and the N-6 position of adenine in DNA. In prokaryotes, the major role of DNA methylation is to protect host DNA against degradation by restriction enzymes. There are two major classes of DNA methyltransferase that differ in the nature of the modifications they effect. The members of one class (C-MTases) methylate a ring carbon and form C5-methylcytosine and members of the second class (N-MTases) methylate exocyclic nitrogens and form either N4-methylcytosine (N4-MTases) or N6-methyladenine (N6-MTases). Both classes utilise the cofactor S-adenosyl-L-methionine (SAM) as the methyl donor and are active as monomeric enzymes. These proteins show three domains, two of them are conserved across multiple kingdoms (SAM binding and the catalytic domain).
definition_source: "InterPro:IPR001091 abstract (PRINTS PR00508 is a member signature)"
