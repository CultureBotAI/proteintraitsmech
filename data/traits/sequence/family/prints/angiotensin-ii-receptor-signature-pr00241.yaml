identifier: PRINTS:PR00241
label: "Angiotensin II receptor signature"
definition: >-
  Angiotensin II is a blood-borne hormone produced in the circulation, it is also formed in many tissues such as the brain, kidney, heart, and blood vessels, where angiotensin II functions as a paracrine and autocrine hormone. The known actions of angiotensin II are mediated through two angiotensin receptor subtypes, Angiotensin II receptor 1 and angiotensin II receptor 2, which are members of the seven transmembrane rhodopsin-like G-protein coupled receptor family. These subtypes are important in the renin-angiotensin system, as they are responsible for the signal transduction of the vasoconstricting stimulus of the main effector hormone, angiotensin II. They also stimulate increased fluid intake and regulate the neuroendocrine system. This entry represents the angiotensin II receptor family. It also includes the relaxin-3 receptor 2, also known as GPCR142, and the apelin receptor from lower vertebrates.
definition_source: "InterPro:IPR000248 abstract (PRINTS PR00241 is a member signature)"
