identifier: PRINTS:PR00964
label: "Movement protein signature"
definition: >-
  The movement protein of tobamoviruses is necessary for the initial cell-to-cell movement during the early stages of a viral infection. This movement is active, and involves the interaction of the movement protein with the plasmodesmata. The movement protein possesses the ability to bind to RNA to achieve its role. The N terminus contains two particularly well-conserved regions, substitutions in one of these results in temperature-sensitive cell-to-cell movement. The C terminus contains three sub-regions characterised by the distributions of charged amino acid residues.
definition_source: "InterPro:IPR001022 abstract (PRINTS PR00964 is a member signature)"
