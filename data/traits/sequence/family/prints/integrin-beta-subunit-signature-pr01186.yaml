identifier: PRINTS:PR01186
label: "Integrin beta subunit signature"
definition: >-
  This entry represents the family of integrin beta subunit proteins and integrin beta-like proteins. It also includes integrin beta-pat-3 (pat-3) from Caenorhabditis elegans. Integrin alpha ina-1/beta pat-3 are receptors for laminin. Pat-3 is required for muscle development and maintenance and plays a role in axon regeneration after injury. Integrin beta subunits consist of an extracellular domain with a head region, a stalk/leg section, a transmembrane domain, and a cytoplasmic tail. The head region contains a β-I-like domain inserted into a hybrid domain, connected to a plexin-semaphorin-integrin (PSI) [InterPro:IPR033760]. C-terminal to the PSI domain is an A-domain, which has been predicted to adopt a Rossmann fold similar to that of the alpha subunit, but with additional loops between the second and third β strands. This domain is referred to as VWA [InterPro:IPR002369]. Many VWA domains bind metal ions via a noncontiguous sequence motif called metal ion-dependent adhesion site (MIDAS). This is followed by a β-subunit stalk/leg section that contains four cysteine-rich integrin epidermal growth factor-like (I-EGF) modules [InterPro:IPR040622], [InterPro:IPR057073], InterPro:IPR013111]. Finally, this is followed by the β-ankle TM domain [InterPro:IPR012896] and a cytoplasmic tail [InterPro:IPR014836]. Integrins are the major metazoan receptors for cell adhesion to extracellular matrix proteins and, in vertebrates, also play important roles in certain cell-cell adhesions, make transmembrane connections to the cytoskeleton, and activate many intracellular signalling pathways. An integrin receptor is a heterodimer composed of alpha and beta subunits. Each subunit crosses the membrane once, with most of the polypeptide residing in the extracellular space, and has two shor
