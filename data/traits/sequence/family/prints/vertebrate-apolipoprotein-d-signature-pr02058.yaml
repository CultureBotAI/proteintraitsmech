identifier: PRINTS:PR02058
label: "Vertebrate apolipoprotein D signature"
definition: >-
  Apolipoprotein D is a member of the lipocalin family with a high degree of sequence conservation from insects to mammals. It is a small, soluble carrier protein of lipophilic molecules mostly expressed in neurons and glial cells within the central and peripheral nervous system. It may have a role in anti-aging mechanism.
