identifier: PRINTS:PR01996
label: "Phage major tail protein 1 family signature"
definition: >-
  Gene transfer agents belong to a group of unusual genetic exchange elements. GTAs are unusual in the sense they have the structure of a small tailed phage, which do not possess typical phage traits such as host cell lysis and infectious transmission of the GTA genes. In the Rhodobacter capsulatus GTA the GTA particles contain random 4.5 kb DNA fragments of the R.capsulatus genome. These DNA fragments can be transmitted to other cells where allelic conversion may occur via homologous recombination. This entry is represented by ORFg9 (RCAP_rcc01691) of the Gene Transfer Agent (GTA) of Rhodobacter capsulatus [see Fig.1, in]. ORFg9 has sequence homology to the major tail protein of bacteriophage TP901-1 (lactococcus phage TP901-1).
definition_source: "InterPro:IPR022344 abstract (PRINTS PR01996 is a member signature)"
