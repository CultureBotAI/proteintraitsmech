identifier: PRINTS:PR01673
label: "Glycine receptor alpha subunit signature"
definition: >-
  Glycine is a major inhibitory neurotransmitter (NT) in the adult vertebrate central nervous system (CNS). Glycinergic synapses have a well-established role in the processing of motor and sensory information that controls movement, vision and audition. This action of glycine is mediated through its interaction with the glycine receptor (GlyR): an intrinsic chloride channel is opened in response to agonist binding. The subsequent influx of anions prevents membrane depolarisation and neuronal firing induced by excitatory NTs. Strychnine acts as a competitive antagonist of glycine binding, thereby reducing the activity of inhibitory neurones. Poisoning with strychnine is characterised by over-excitation, muscle spasms and convulsions. Whilst glycine is the principal physiological agonist at GlyRs, taurine and beta-alanine also behave as agonists. Compounds that modulate GlyR activity include zinc, some alcohols and anaesthetics, picrotoxin, cocaine and some anticonvulsants. GlyRs were thought for some time to be localised exclusively in the brain stem and spinal cord, but have since been found to be expressed more widely, including the cochlear nuclei, cerebellar cortex and forebrain. GlyRs belong to the ligand-gated ion channel family, which also includes the inhibitory gamma-aminobutyric acid type A (GABAA) and excitatory nicotinic acetylcholine (nACh) and serotonin type 3 (5-HT3) receptors. Affinity-purified GlyR was found to contain two glycosylated membrane proteins of 48kDa and 56kDa, corresponding to alpha and beta subunits, respectively. Four genes encoding alpha subunits have been identified (GLRA1 to 4), together with a single beta polypeptide (GLRB). The heterogeneity of alpha subunits is further increased by alternative exon splicing, yielding two isoforms of GL
