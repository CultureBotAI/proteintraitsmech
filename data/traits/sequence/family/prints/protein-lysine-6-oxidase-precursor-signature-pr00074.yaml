identifier: PRINTS:PR00074
label: "Protein-lysine 6-oxidase precursor signature"
definition: >-
  Lysyl oxidase ( EC:1.4.3.13 ) (LOX) is an extracellular copper-dependent enzyme that catalyses the oxidative deamination of peptidyl lysine residues in precursors of various collagens and elastins, yielding alpha-aminoadipic-delta-semialdehyde. The deaminated lysines are then able to form semialdehyde cross-links, resulting in the formation of insoluble collagen and elastin fibres in the extracellular matrix. The active site of LOX resides towards the C terminus: this region also binds a single copper atom in an octahedral coordination complex involving at least 3 His residues. Four histidine residues are clustered in a central region of the enzyme. This region is thought to be involved in cooper-binding and is called the 'copper-talon'.
definition_source: "InterPro:IPR001695 abstract (PRINTS PR00074 is a member signature)"
