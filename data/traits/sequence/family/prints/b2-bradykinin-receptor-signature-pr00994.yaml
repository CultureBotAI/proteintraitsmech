identifier: PRINTS:PR00994
label: "B2 bradykinin receptor signature"
definition: >-
  Bradykinins are a family of short, structurally similar peptides that activate sensory fibres, contract venous smooth muscle, stimulate release of cytokines, induce connective tissue proliferation and mediate endothelium-dependent vasodilation. Bradykinin antagonists are used in the treatment of inflammation, asthma, mild pain and endotoxic shock. Bradykinin receptors are members of the seven transmembrane, rhodopsin-like G-protein coupled receptor family and are widespread in peripheral tissues. There are two bradykinins receptor subtypes: B1 and B2. It has also been proposed there could be further subtypes of the bradykinin receptor, including a tracheal B3 receptor but these, as yet have not been confirmed. This entry represents bradykinin receptor B2, which is the predominant subtype and is ubiquitously and constitutively expressed in healthy tissues. The B2 receptor mediates slow contraction of various smooth muscles including veins, intestine, uterus, trachea and lung, inducing endothelium-dependent relaxation of arteries and arterioles, and stimulates natriuresis/diuresis in kidney. Both B1 and B2 receptors are involved in the induction and maintenance of cytokine-induced hyperalgesia, but B2 receptor to a lesser extent. The B2 receptor couples to Gq and Gi, Gq stimulates phospholipase C to increase intracellular free calcium and Gi inhibits adenylate cyclase. Furthermore, the receptor stimulates the mitogen-activated protein kinase pathways. The B2 receptor also forms a complex with angiotensin converting enzyme (ACE), and this is thought to play a role in cross-talk between the renin-angiotensin system (RAS) and the kinin-kallikrein system (KKS).
