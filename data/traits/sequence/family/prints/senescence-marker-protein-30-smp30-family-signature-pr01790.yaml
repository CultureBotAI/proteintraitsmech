identifier: PRINTS:PR01790
label: "Senescence marker protein-30 (SMP30) family signature"
definition: >-
  This entry represents members of the SMP-30/CGR1 family which act as lactonases such as regucalcin. Regucalcin (RGN) is a gluconolactonase ( EC:3.1.1.17 ), converting D-glucono-1,5-lactone to D-gluconate, but also hydrolyses other carbohydrate lactones. This enzyme is required for the penultimate step in vitamin C biosynthesis. From its crystal structure, regucalcin has a six-bladed β-propeller fold, and binds a single metal ion (either Ca 2+ or Zn 2+ )). Homologues with similar catalytic activity have been isolated and characterised from bacteria. There are other bacterial homologues. L-arabinolactonase ( EC:3.1.1.15 ), from Azospirillum brasilense, converts L-arabino-gamma-lactone to L-arabonate, allowing the bacterium utilise L-arabinose as a sole carbon source; lactonase drp35 from Staphylococcus species acts as a lactonase on dihydrocoumarin or 2-coumaranone. A homologue from the squid Loligo vulgari can act as a diisopropyl-fluorophosphatase ( EC:3.1.8.2 ), but its physiological substrate is unknown. Regucalcin, also known as senesence marker protein-30 (SMP30), was discovered in 1978 as a Ca 2+ binding protein that does not contain EF-hand motifs, suggesting a novel class of Ca 2+ binding protein. It is primarily localised to the liver and kidney cortex of animals. Expression of its mRNA in the liver and renal cortex of rats is stimulated by an increase in cellular Ca 2+ levels. Regucalin, as a regulatory protein of Ca 2+, has a pivotal role in the control of many cell functions. The protein has a reversible effect on Ca 2+ -induced activation and inhibition of many enzymes in both the liver and renal cortex cells. It has also been shown to inhibit various protein kinases (including Ca 2+ /calmodulin-dependent protein kinase, protein kinase C and tyrosine kinase)
