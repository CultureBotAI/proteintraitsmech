identifier: PRINTS:PR00474
label: "Glutamate 5-kinase family signature"
definition: >-
  Glutamate 5-kinase ( EC:2.7.2.11 ) catalyses the first step in the biosynthesis of proline, the ATP-dependent phosphorylation of glutamate to glutamate 5-phosphate. This entry also includes N-acetylglutamate kinase ( EC:2.7.2.8 ), which catalyses the phosphorylation of N-acetylglutamate to N-acetylglutamate-5P in the pathway for arginine biosynthesis.
