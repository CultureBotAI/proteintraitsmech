identifier: PRINTS:PR01363
label: "Viral protein D9 signature"
definition: >-
  The complete DNA sequence of the genome of Vaccinia virus has been determined. 198 "major" protein-coding regions and 65 overlapping "minor" regions have been identified, with a total of 263 potential genes. The genes are compactly organised along the genome, with few noncoding regions. The function of the majority of proteins encoded by these open reading frames is so far undetermined. This entry represents a family of proteins from poxvirus, including the D9 protein from Vaccinia virus (also known as mRNA-decapping protein OPG121), a decapping Nudix enzyme that accelerates viral and cellular mRNA turnover to eliminate competing host mRNAs and allow stage-specific synthesis of viral proteins, being critical for poxvirus pathogenicity. Acceleration of the turnover of cellular transcripts may even promote the shutoff of host protein synthesis. This enzyme shows a domain organization in which a three-helix bundle is inserted into the catalytic Nudix domain.
definition_source: "InterPro:IPR003300 abstract (PRINTS PR01363 is a member signature)"
