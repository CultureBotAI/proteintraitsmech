identifier: PRINTS:PR01059
label: "5-hydroxytryptamine 4 receptor signature"
definition: >-
  5-hydroxytryptamine (5-HT) or serotonin, is a neurotransmitter that it is primarily found in the gastrointestinal (GI) tract, platelets, and in the central nervous system (CNS). It is implicated in a vast array of physiological and pathophysiological pathways. Receptors for 5-HT mediate both excitatory and inhibitory neurotransmission, and modulate the release of many neurotransmitters including glutamate, GABA, dopamine, epinephrine/norepinephrine, and acetylcholine, as well as many hormones, including oxytocin, prolactin, vasopressin and cortisol. In the CNS, 5-HT receptors can influence various neurological processes, such as aggression, anxiety and appetite and, as a, result are the target of a variety of pharmaceutical drugs, including many antidepressants, antipsychotics and anorectics. The 5-HT receptors are grouped into a number of distinct subtypes, classified according to their antagonist susceptibilities and their affinities for 5-HT. With the exception of the 5-HT3 receptor, which is a ligand-gated ion channel, all 5-HT receptors are members of the rhodopsin-like G protein-coupled receptor family, and they activate an intracellular second messenger cascade to produce their responses. The 5-HT4 receptor functions in both the peripheral and central nervous system, and is involved in modulating the release of various neurotransmitters. In addition to adenylyl cyclase stimulation, direct coupling to potassium channels and voltage sensitive calcium channels have been proposed as postreceptor events. The 5HT4 receptor is located in neurons in the CNS, with highest levels in colliculus and hippocampus, it has not been found in the cerebellum. In the CNS, the receptor enhances synaptic transmission, and they may also play a role in learning, memory and appetite. In
