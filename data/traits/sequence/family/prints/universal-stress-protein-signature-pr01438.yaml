identifier: PRINTS:PR01438
label: "Universal stress protein signature"
definition: >-
  Transcriptional induction of the uspA gene of Escherichia coli occurs when conditions cause growth arrest; cells deficient in UspA survive poorly in stationary phase. The product of uspA has been shown to be a cytoplasmic serine and threonine phosphoprotein. Members of the Usp family are predicted to be related to the MADS-box proteins and bind to DNA. Some members of the family contain 2 copies of the domain. This entry includes five E. coli Usp paralogues: uspA, uspC, uspD, uspF and uspG.
definition_source: "InterPro:IPR006015 abstract (PRINTS PR01438 is a member signature)"
