identifier: PRINTS:PR01661
label: "Mini-chromosome maintenance (MCM) protein 5 signature"
definition: >-
  The MCM2-7 complex consists of six closely related proteins that are highly conserved throughout the eukaryotic kingdom. In eukaryotes, Mcm5 is a component of the MCM2-7 complex (MCM complex), which consists of six sequence-related AAA + type ATPases/helicases that form a hetero-hexameric ring. MCM2-7 complex is part of the pre-replication complex (pre-RC). In G1 phase, inactive MCM2-7 complex is loaded onto origins of DNA replication. During G1-S phase, MCM2-7 complex is activated to unwind the double stranded DNA and plays an important role in DNA replication forks elongation. The components of the MCM2-7 complex are: DNA replication licensing factor MCM2, InterPro:IPR008045 DNA replication licensing factor MCM3, InterPro:IPR008046 DNA replication licensing factor MCM4, InterPro:IPR008047 DNA replication licensing factor MCM5, InterPro:IPR008048 DNA replication licensing factor MCM6, InterPro:IPR008049 DNA replication licensing factor MCM7, InterPro:IPR008050
definition_source: "InterPro:IPR008048 abstract (PRINTS PR01661 is a member signature)"
