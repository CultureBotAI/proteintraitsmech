identifier: PRINTS:PR01260
label: "Na+/Ca2+ exchanger isoform 1 signature"
definition: >-
  Na + /Ca 2+ exchange proteins are involved in maintaining Ca 2+ homeostasis in a wide variety of cell types. They are found in both the plasma membrane and intracellular organellar membranes, where they exchange Na + for Ca 2+ in an electrogenic manner. When located in the plasma membrane, they generally utilise the transmembrane (TM) Na + concentration gradient in order to extrude Ca 2+ from cells. Three mammalian isoforms have been cloned to date (NCX1-3), which consist of 920-970 amino acid residues that are predicted to possess 11 or 12 TM domains. Interestingly, they possess a short motif (~30 residues) that is similar to the Na + /K + -ATPase, although its function is unknown. NCX1 is the principal Na + /Ca 2+ exchanger of cardiac myocytes, where it is thought to play an important role in excitation-contraction coupling. It is also found in a variety of other tissues, suggesting it serves as a housekeeping protein, maintaining low cytosolic Ca 2+ concentration. Alternatively spliced variants of NCX1 have been identified, expression of which is cell type-specific. Sequence analysis reveals two sets of tandem repeats are found within the NCX1 protein sequence, which are usually referred to as alpha and beta. The alpha repeats are thought to be involved in the ion binding and translocation reactions of the exchanger, and the first beta repeat may be part of a regulatory site that responds to Ca 2+ concentration.
