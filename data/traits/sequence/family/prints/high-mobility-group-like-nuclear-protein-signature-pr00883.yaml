identifier: PRINTS:PR00883
label: "High mobility group-like nuclear protein signature"
definition: >-
  This entry represents H/ACA ribonucleoprotein complex subunit NHP2 and similar proteins from eukaryotes, including NHP2-like protein 1 from mammals (SNU13 homologue) and 13 kDa ribonucleoprotein-associated protein (SNU13) from yeast. Nhp2 is part of a complex which catalyses pseudouridylation of rRNA and is required for rRNA biogenesis. This involves the isomerisation of uridine such that the ribose is subsequently attached to C5, instead of the normal N1. Pseudouridine ("psi") residues may serve to stabilise the conformation of rRNAs. Nph2 associates non-specifically with RNA secondary structures instead of directly binding to an specific RNA motif. This protein seem to have evolved from the archaeal ribosomal L7Ae protein family. H/ACA ribonucleoprotein particles (RNPs) are a family of RNA pseudouridine synthases that specify modification sites through guide RNAs. The function of these H/ACA RNPs is essential for biogenesis of the ribosome, splicing of precursor mRNAs (pre-mRNAs), maintenance of telomeres and probably for additional cellular processes. All H/ACA RNPs contain a specific RNA component (snoRNA or scaRNA) and at least four proteins common to all such particles: Cbf5, Gar1, Nhp2 and Nop10. These proteins are highly conserved from yeast to mammals and homologues are also present in archaea. The H/ACA protein complex contains a stable core composed of Cbf5 and Nop10, to which Gar1 and Nhp2 subsequently bind.
