identifier: PRINTS:PR00006
label: "Cofilin/destrin family signature"
definition: >-
  Actin depolymerization factor/cofilin-like domains (ADF domains) are present in a family of essential eukaryotic actin regulatory proteins. These proteins enhance the turnover rate of actin, and interact with actin monomers (G-actin) as well as actin filaments (F-actin), typically with a preference for ADP-G-actin subunits. The basic function of cofilin is to promote disassembly of aged actin filaments. Vertebrates have three isoforms of cofilin: cofilin-1 (Cfl1, non-muscle cofilin), cofilin-2 (muscle cofilin), and ADF (destrin). The modes of action of ADF/cofilins highly depend on their concentration. When ADF/cofilins are present in low concentrations they prefer to sever the actin filaments and promote the depolymerization of the pointed end of the filament. At high concentrations they can increase the polymerization by nucleating new actin filaments.
definition_source: "InterPro:IPR017904 abstract (PRINTS PR00006 is a member signature)"
