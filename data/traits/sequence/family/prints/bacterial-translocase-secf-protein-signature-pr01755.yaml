identifier: PRINTS:PR01755
label: "Bacterial translocase SecF protein signature"
definition: >-
  Secretion across the inner membrane in some Gram-negative bacteria occurs via the preprotein translocase pathway. Proteins are produced in the cytoplasm as precursors, and require a chaperone subunit to direct them to the translocase component. From there, the mature proteins are either targeted to the outer membrane, or remain as periplasmic proteins. The translocase protein subunits are encoded on the bacterial chromosome. This entry represents bacterial SecD and SecF protein export membrane proteins. It is found in association with SecD and SecF proteins are part of the multimeric protein export complex comprising SecA, D, E, F, G, Y, and YajC. SecD and SecF are required to maintain a proton motive force.
definition_source: "InterPro:IPR022645 abstract (PRINTS PR01755 is a member signature)"
