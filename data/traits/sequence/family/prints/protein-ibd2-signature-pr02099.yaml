identifier: PRINTS:PR02099
label: "Protein IBD2 signature"
definition: >-
  During mitosis, genomic integrity is maintained by the proper coordination of mitotic events through the spindle checkpoint. The bifurcated spindle checkpoint blocks cell-cycle progression at metaphase by monitoring unattached kinetochores, and inhibits mitotic exit in response to the incorrect orientation of the mitotic spindle. Bfa1p is a budding yeast spindle checkpoint regulator in the Bub2p checkpoint pathway for proper mitotic exit. A Bfa1p interacting protein, termed Ibd2p, has been identified in the budding yeast Saccharomyces cerevisiae. IBD2 (Inhibition of Bud Division 2) is not an essential gene. However, over-expression of Ibd2p has been shown to induce mitotic arrest, with increased levels of Clb2p in wild type and mad2Delta, but not in deletion mutants of BUB2 and BFA1. Overall, it is thought likely that IBD2 encodes a novel component of the BUB2-dependent spindle checkpoint pathway that functions upstream of BUB2 and BFA1. Members of this protein family are mainly found in saccharomycetales.
