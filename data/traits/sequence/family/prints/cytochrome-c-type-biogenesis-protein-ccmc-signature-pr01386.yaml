identifier: PRINTS:PR01386
label: "Cytochrome c-type biogenesis protein CcmC signature"
definition: >-
  Within mitochondria and bacteria, a family of related proteins is involved in the assembly of periplasmic c-type cytochromes: these include CycK, CcmF, NrfE and CcbS. These proteins may play a role in guidance of apocytochromes and haem groups for their covalent linkage by the cytochrome-c-haem lyase. Members of the family are probably integral membrane proteins, with up to 16 predicted transmembrane (TM) helices. The gene products of the hel and ccl loci have been shown to be required specifically for the biogenesis of c-type cytochromes in the Gram-negative photosynthetic bacterium Rhodobacter capsulatus. Genetic and molecular analyses show that the hel locus contains at least 4 genes, helA, helB, helC and orf52. HelA is similar to the ABC transporters and helA, helB, and helC are proposed to encode an export complex. It is believed that the hel-encoded proteins are required for the export of haem to the periplasm, where it is subsequently ligated to the c-type apocytochromes. However, while CcmB and CcmC have the potential to interact with CcmA, the 3 gene products probably associating to form a complex with (CcmA)2-CcmB-CcmC stoichiometry, the substrate for the putative CcmABC-transporter is probably neither haem nor c-type apocytochromes. Hydropathy analysis suggests the presence of 6 TM domains.
