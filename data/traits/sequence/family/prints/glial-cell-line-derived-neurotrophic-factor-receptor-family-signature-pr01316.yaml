identifier: PRINTS:PR01316
label: "Glial cell line-derived neurotrophic factor receptor family signature"
definition: >-
  Glial cell line-derived neurotrophic factor (GDNF) and its related factors neurturin (NTN), artemin (ART) and persephin (PSP), are members of the GDNF family of neurotrophic factors. They form a sub-group in the transforming growth factor-beta (TGF-beta) superfamily. These factors are involved in the promotion of neurone survival, exerting their effects through specific receptors. The GDNF family receptors (GFRs) are glycosyl-phosphatidylinositol-linked, cell surface receptors. Four receptor subtypes, termed GFRalpha-1 to 4, are currently recognised. GFRalpha-1 and 2 are activated by GDNF and NTN respectively, although some degree of ligand promiscuity is thought to occur. Homologues for these receptor subtypes have been cloned from mammalian and avian tissue. The principal ligand for GFRalpha-3 is artemin. This receptor subtype is currently described only in mammals. GFRalpha-4 is activated by persephin and has so far only been found in chicken. This entry is general for types 1 to 3. Activation of GFR family members triggers their interaction with the membrane-bound receptor kinase Ret. This induces Ret homo-dimerisation, triggering a cascade of intracellular signalling events such as the activation of the Ras-mitogen-activated protein kinase (MAPK), phosphoinositol-3-kinase (PI3K), Jun N-terminal kinase (JNK) and phospholipase C gamma (PLC gamma) dependent pathways.
