identifier: PRINTS:PR01940
label: "Neurotrophic tyrosine kinase receptor type 1 signature"
definition: >-
  Neurotrophins are a family of secreted proteins that regulate development, maintenance and function of vertebrate nervous systems. They act via two different classes of receptor: p75NTR (a member of the TNF receptor superfamily), and neurotrophic tyrosine kinase receptors (NTRKs) - also known as tropomyosin-related kinases (Trks). NTRK1 (also termed TrkA) is a high-affinity receptor for nerve growth factor (NGF). The receptor is expressed in the dorsal root ganglia, trigeminal ganglia and sympathetic neurons of the peripheral nervous system, and in basal forebrain cholinergic neurons. It is also expressed in peripheral sites, such as scalp skin. Whereas p75NTR activation by NGF induces apoptosis, NTRK1 mediates the growth factor's cell survival-promoting effects.
