identifier: PRINTS:PR00566
label: "Dopamine 1B receptor signature"
definition: >-
  Dopamine receptors are members of the rhodopsin-like G-protein coupled receptor family and are prominent in the vertebrate central nervous system (CNS). Dysfunction of dopaminergic neurotransmission in the CNS has been implicated in a variety of neuropsychiatric disorders, including social phobia, Tourette's syndrome, Parkinson's disease, schizophrenia, neuroleptic malignant syndrome, attention-deficit hyperactivity disorder (ADHD) and drug and alcohol dependence. As a result, dopamine receptors are common drug targets; antipsychotics are often dopamine receptor antagonists while psychostimulants are typically indirect agonists of dopamine receptors. There are at least five different known subtypes of dopamine receptors designated D1, D2, D3, D4 and D5. They are distinguished by their G-protein coupling, ligand specificity, anatomical distribution and physiological effects. Dopamine receptors are divided into two further subfamilies. The D1-like family consists of D1 and D5 receptors, which couple to Gs and mediate excitatory neurotransmission. The D2-like family, meanwhile, consists of D2, D3 and D4 receptors, which couple to Gi/Go and mediate inhibitory neurotransmission. Although dopamine receptors are widely distributed in the brain, they are found in different locations that have different receptor type densities, presumably reflecting different functional roles. D1 and D2 receptor subtypes are found at 10-100 times the levels of the D3, D4, D5 subtypes. This entry represents the dopamine D5 receptors (also known as D1B). They are found in greatest abundance in the caudate-putamen, nucleus accumbens and olfactory tubercle, with lower levels in the frontal cortex, habenula, amygdala, hypothalamus and thalamus. In the periphery, binding sites are found in the kidney,
