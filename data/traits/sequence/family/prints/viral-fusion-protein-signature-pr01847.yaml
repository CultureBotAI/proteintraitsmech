identifier: PRINTS:PR01847
label: "Viral fusion protein signature"
definition: >-
  This is a family of viral fusion proteins from the Chordopoxvirinae. A 14kDa Vaccinia virus protein has been demonstrated to function as a viral fusion protein mediating cell fusion at endosmomal (low) pH. The protein, found in the envelope fraction of the virions, is required for fusing the outermost of the two golgi-derived membranes enveloping the virus with the plasma membrane, and its subsequent release extracellularly. The N-terminal proximal region is essential for its fusion ability.
definition_source: "InterPro:IPR003436 abstract (PRINTS PR01847 is a member signature)"
