identifier: PRINTS:PR00784
label: "Mitochondrial brown fat uncoupling protein signature"
definition: >-
  This family includes mitochondrial carrier proteins that transport a broad variety of substrates and, therefore, they are involved in different metabolic pathways such as the TCA cycle, lipid metabolism, nucleotides metabolism and energy transfer. Some examples of this group are the uncoupling proteins (UCPs). This family also includes peroxisomal proteins like PMP34. Mitochondrial brown fat uncoupling protein 1 from chordates (UCP1) is responsible for thermogenic respiration, a specialised capacity of brown adipose tissue to the regulation of energy balance. It regulates the production of reactive oxygen species/ROS by mitochondria. A variety of substrate carrier proteins involved in energy transfer are found in the inner mitochondrial membrane or are integral to the membranes of other eukaryotic organelles such as the peroxisome. Such proteins include: ADP/ATP carrier protein (ADP/ATP translocase) 2-oxoglutarate/malate carrier protein Phosphate carrier protein Tricarboxylate transport protein (or citrate transport protein) Graves disease carrier protein Yeast mitochondrial proteins MRS3 and MRS4 Yeast mitochondrial FAD carrier protein And many others These mitochondrial carrier proteins share a tripartite structure, consisting of up to three tandem repeats of a domain approximately 100 residues in length. Each domain contains two transmembrane (TM) regions, resulting in a total of six TM domains. Sequence analysis has shown that the TM regions and their adjacent hydrophilic loops are more highly conserved than other parts of the protein, with five of the six TM domains followed by the conserved motif (D/E)-Hy(K/R), where Hy denotes a hydrophobic residue. Structurally, these domains contain six α-helices that form a compact transmembrane unit. This structure exhibits a
