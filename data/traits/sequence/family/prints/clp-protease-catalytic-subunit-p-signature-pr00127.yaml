identifier: PRINTS:PR00127
label: "Clp protease catalytic subunit P signature"
definition: >-
  Clp is an ATP-dependent protease that cleaves a number of proteins, such as casein and albumin and is a member of peptidase family S14. It exists as a heterodimer of ATP-binding regulatory A and catalytic P subunits, both of which are required for effective levels of protease activity in the presence of ATP, although the P subunit alone does possess some catalytic activity. This entry represents the P subunit. Proteases highly similar to ClpP have been found to be encoded in the genome of bacteria, metazoa, some viruses and in the chloroplast of plants, but seems to be absent in archaea, mollicutes and some fungi.
definition_source: "InterPro:IPR001907 abstract (PRINTS PR00127 is a member signature)"
