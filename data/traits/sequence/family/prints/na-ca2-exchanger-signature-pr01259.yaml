identifier: PRINTS:PR01259
label: "Na+/Ca2+ exchanger signature"
definition: >-
  Na + /Ca 2+ exchange proteins are involved in maintaining Ca 2+ homeostasis in a wide variety of cell types. They are found in both the plasma membrane and intracellular organellar membranes, where they exchange Na + for Ca 2+ in an electrogenic manner. When located in the plasma membrane, they generally utilise the transmembrane (TM) Na + concentration gradient in order to extrude Ca 2+ from cells. Three mammalian isoforms have been cloned to date (NCX1-3), which consist of 920-970 amino acid residues that are predicted to possess 11 or 12 TM domains. Interestingly, they possess a short motif (~30 residues) that is similar to the Na + /K + -ATPase, although its function is unknown. NCX1 has been found to be predominantly expressed in the heart, where it plays an important role in excitation-contraction coupling, but it is also abundant in a variety of other tissues. NCX2 and NCX3 transcripts have been detected in the brain and skeletal muscle. Homologous Na + /Ca 2+ exchange proteins have also been found in Caenorhabditis elegans, Drosophila melanogaster (known as Calx) and Loligo opalescens (California market squid).
definition_source: "InterPro:IPR004836 abstract (PRINTS PR01259 is a member signature)"
