identifier: PRINTS:PR01740
label: "Septin 2 signature"
definition: >-
  Septin 2, also termed NEDD5, was originally cloned in mice. Orthologues from several other species have also been identified. Micro-injection of cells with an anti-septin 2 antibody blocks cytokinesis, giving rise to binucleated cells. Septins were first discovered in budding yeast as a major component of bud neck filaments during cell septation. Later, its homologues were identified in nearly all eukaryotes, including humans. They are all GTP-binding proteins that are involved in diverse cellular functions, including cell cycle progression, vesicle trafficking, cytokinesis, cell migration, membrane dynamics, and chromosome segregation. Similar to cytoskeleton components such as actins and tubulins, they can assemble into filaments and bundles. However, unlike actin filaments and microtubules, septin filaments are not polar, similarly to intermediate filaments. The number of septin genes per organism is variable: S. cerevisiae has seven and humans have 13 (SEPT1-12 and SEPT14; SEPT13 is a pseudogene now called SEPT7P2). All septins can form heteromeric complexes, which associate to form higher-order structures, including filaments, rings and cage-like formations.
definition_source: "InterPro:IPR008113 abstract (PRINTS PR01740 is a member signature)"
