identifier: PRINTS:PR00928
label: "Graves disease carrier protein signature"
definition: >-
  This family includes a variety of substrate carrier proteins that are involved in energy transfer are found in the inner mitochondrial membrane. Such proteins include: ADP, ATP carrier protein (ADP/ATP translocase); 2-oxoglutarate/malate carrier protein; phosphate carrier protein; tricarboxylate transport protein (or citrate transport protein); Solute carrier family 25 member 16 (SLC25A16, also known as Graves disease carrier protein, GDC); yeast mitochondrial proteins MRS3 and MRS4; yeast mitochondrial FAD carrier protein; and many others. GDC, which belongs to the mitochondrial metabolite carrier family, is required for the accumulation of coenzyme A in the mitochondrial matrix. The protein is recognised by IgG from patients with active Graves disease. It is an integral membrane protein thought to reside in the inner mitochondrial membrane. The predicted amino acid sequence of 348 residues comprises three similar domains.
definition_source: "InterPro:IPR002167 abstract (PRINTS PR00928 is a member signature)"
