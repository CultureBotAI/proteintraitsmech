identifier: PRINTS:PR01273
label: "Invertebrate colouration protein signature"
definition: >-
  The lipocalins are a diverse, interesting, yet poorly understood family of proteins composed, in the main, of extracellular ligand-binding proteins displaying high specificity for small hydrophobic molecules. Functions of these proteins include transport of nutrients, control of cell regulation, pheromone transport, cryptic colouration, and the enzymatic synthesis of prostaglandins. The crystal structures of several lipocalins have been solved and show a novel 8-stranded anti-parallel β-barrel fold well conserved within the family. Sequence similarity within the family is at a much lower level and would seem to be restricted to conserved disulphides and 3 motifs, which form a juxtaposed cluster that may act as a common cell surface receptor site. By contrast, at the more variable end of the fold are found an internal ligand binding site and a putative surface for the formation of macromolecular complexes. The anti-parallel β-barrel fold is also exploited by the fatty acid-binding proteins, which function similarly by binding small hydrophobic molecules. Similarity at the sequence level, however, is less obvious, being confined to a single short N-terminal motif. A number of lipocalins act in invertebrate colouration and are represented in this entry. These include: bilin binding protein from the cabbage white butterfly (Pieris brassicae), the closely related protein insecticyanin from Manduca sexta (Tobacco hawkmoth) and the lobster protein crustacyanin. Like other members of the family, they bind small molecules, and gain their colourant properties from interaction with their ligands.
