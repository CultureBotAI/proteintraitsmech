identifier: PRINTS:PR01911
label: "Plant and fungal dual specificity phosphatase signature"
definition: >-
  This entry represent a group of atypical dual-specificity phosphatases from plant and fungi. Proteins in this entry include Siw14 and related proteins. Siw14 is a inositol pyrophosphate phosphatase that modulates inositol pyrophosphate metabolism by dephosphorylating the IP7isoform 5PP-IP5to IP6. This entry also includes DSP1/2/3/4/5 from Arabidopsis. All DSPs tested (AtPFA-DSP1, -2, -3, and -5) displayed phosphatase activity toward PI(3,5)P2, with AtPFA-DSP2 showing a higher activity.
definition_source: "InterPro:IPR020428 abstract (PRINTS PR01911 is a member signature)"
