identifier: PRINTS:PR01873
label: "Cytochrome c oxidase subunit IV signature"
definition: >-
  Cytochrome c oxidase (COX) subunit IV is a mitochondrial inner membrane protein that forms part of the 13-subunit COX complex, the terminal oxidase in the mitochondrial electron transport chain. The enzyme catalyses the reaction: 4 ferrocytochrome c + O(2) = 4 ferricytochrome c + 2 H(2)O This polypeptide belongs to a wider family of proteins that includes the Dictyostelium discoideum (Slime mold) COX VI and the Saccharomyces cerevisiae (Baker's yeast) protein YGX6. The 3D structure of the whole bovine heart cytochrome c oxidase has been determined to 2.8A resolution by means of X-ray crystallography. The structure reveals 13 different subunits, five phosphatidyl ethanolamines, three phosphatidyl glycerols, two cholates, two haems A, and a number of copper, magnesium and zinc ions. A hydrogen-bonded system, including a propionate of haem A, part of the peptide backbone, and an imidazole ligand of CuA, may provide an electron transfer pathway between CuA and haem A.
