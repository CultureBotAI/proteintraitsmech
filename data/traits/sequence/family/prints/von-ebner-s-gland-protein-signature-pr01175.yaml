identifier: PRINTS:PR01175
label: "Von Ebner's gland protein signature"
definition: >-
  Von Ebner's gland protein (VEGP), a protein highly expressed by the small acinar von Ebner's salivary glands of the tongue, but not in the secretory duct, undertakes the selective binding of sapid chemicals and their transport to taste receptors in salivary secretions. VEGP can help to clear the bitter-tasting compound denatonium benzoate in vivo, suggesting a possible clearance function in taste reception, although it fails to bind other bitter compounds. VEGP is also secreted by the lachrymal gland into tear fluid, where, historically, it has been called tear prealbumin. Together with lysozyme and lactoferrin, VEGP forms 70-80% of total tear protein, although diseases affecting the lachrymal gland decrease this. Tear VEGP has been suggested to enhance the bactericial activity of lysozyme and to have an anti-microbial function, perhaps through transported compounds with anti-bacterial properties. VEGP has been shown to bind retinol, and can be co-extracted with fatty acids, particularly stearate and palmitate, phospholipids, glycolipids and fatty alcohols (including cholesterol). VEGP may act as a transporter of lipids, synthesised in the dorsal, or meibomian, glands of the eyelid, to the thin film they form at the tear-fluid/air interface. Recently, two lipocalins, specifically expressed in the posterior and vomeronasal glands of the mouse nasal septum, have been identified and were suggested to act in the chemoreception of, as yet-unidentified, small lipophilic pheromones. One of these proteins was immunolocalised on the vomeronasal sensory epithelium, the site of primary pheromone reception, and the immunoreactivity was greatest during periods when contact between animals plays an important role in modulating behaviour. Canis familiaris (dog) allergen 1 (Can f1) is
definition_source: "InterPro:IPR002450 abstract (PRINTS PR01175 is a member signature)"
