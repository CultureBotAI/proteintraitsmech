identifier: PRINTS:PR00805
label: "Alpha-catenin signature"
definition: >-
  Catenins associate with the cytoplasmic domains of a variety of cadherins producing a complex that links to the actin filament network. This association appears to be indispensable for tight cell-cell adhesion. Dysfunction of the complex causes dissociation of cancer cells from primary tumours, possibly contributing to cancer invasion and metastasis. Three different forms of catenin (designated alpha, beta and gamma) comprise the cytoplasmic domain of the cadherin cell-cell adhesion complex. Alpha-catenins are evolutionarily related to vinculin. In vertebrates two isoforms of alpha-catenin coexist, alphaE- and alphaN- catenins (or Catenin alpha-1 and -2), encoded by two separate genes. AlphaE-catenin forms a cadherin/beta-catenin/alphaE-catenin complex that can tether the tripartite adhesion complex and regulate actin dynamics.
definition_source: "InterPro:IPR001033 abstract (PRINTS PR00805 is a member signature)"
