identifier: PRINTS:PR00811
label: "Bacterial general secretion pathway protein D signature"
definition: >-
  The general (type II) secretion pathway (Gsp) within Gram-negative bacteria is a signal sequence-dependent process responsible for protein export. The process has two stages: exoproteins are first translocated across the inner membrane by the general signal-dependent export pathway (GEP), and then across the outer membrane by a species-specific accessory mechanism. A number of proteins are involved in the Gsp; one of these is known as protein D (GspD protein), the most probable location of which is the outer membrane. This suggests that protein D constitutes the apparatus of the accessory mechanism, and is thus involved in transporting exoproteins from the periplasm, across the outer membrane, to the extracellular environment. This entry represents GspD and close homologues, including the type IV pilus outer membrane secretin PilQ. It also includes virion export protein, which is thought to form a channel across the host outer membrane for the purposes of extruding the bacteriophage.
