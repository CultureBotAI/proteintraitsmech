identifier: PRINTS:PR01172
label: "Beta-lactoglobulin signature"
definition: >-
  Beta-lactoglobulin (Blg) is the major protein component of milk from a wide range of species but not human. Glycodelin or PP14 protein is the human equivalent of Blg and is secreted into the endometrium. Blg binds a wide variety of hydrophobic ligands but its function remains unknown. The crystal structure of Blg has been solved, confirming membership of the lipocalin protein family. This entry also includes human glycodelin. It has four glycoforms, namely glycodelin-S, -A, -F and -C have been identified in reproductive tissues that differ in glycosylation and biological activity. Glycodelin-A has contraceptive and immunosuppressive activities. Glycodelin-C stimulates binding of spermatozoa to the zona pellucida. Glycodelin-F inhibits spermatozoa-zona pellucida binding and significantly suppresses progesterone-induced acrosome reaction of spermatozoa. Glycodelin-S in seminal plasma maintains the uncapacitated state of human spermatozoa. The lipocalins are a diverse, interesting, yet poorly understood family of proteins composed, in the main, of extracellular ligand-binding proteins displaying high specificity for small hydrophobic molecules. Functions of these proteins include transport of nutrients, control of cell regulation, pheromone transport, cryptic colouration and the enzymatic synthesis of prostaglandins. The crystal structures of several lipocalins have been solved and show a novel 8-stranded anti-parallel β-barrel fold well conserved within the family. Sequence similarity within the family is at a much lower level and would seem to be restricted to conserved disulphides and 3 motifs, which form a juxtaposed cluster that may act as a common cell surface receptor site. By contrast, at the more variable end of the fold are found an internal ligand binding site a
