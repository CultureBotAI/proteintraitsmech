identifier: PRINTS:PR01463
label: "EAG/ELK/ERG potassium channel family signature"
definition: >-
  The first EAG K+ channel was identified in Drosophila melanogaster (Fruit fly), following a screening for mutations giving rise to behavioural abnormalities. Disruption of the Eag gene caused an ether-induced, leg-shaking behaviour. Subsequent studies have revealed a conserved multi-gene family of EAG-like K+ channels, which are present in human and many other species. Based on the varying functional properties of the channels, the family has been divided into 3 subfamilies: EAG, ELK and ERG. Interestingly, Caenorhabditis elegans appears to lack the ELK type. Potassium channels are the most diverse group of the ion channel family. They are important in shaping the action potential, and in neuronal excitability and plasticity. The potassium channel family is composed of several functionally distinct isoforms, which can be broadly separated into 2 groups: the practically non-inactivating 'delayed' group and the rapidly inactivating 'transient' group. These are all highly similar proteins, with only small amino acid changes causing the diversity of the voltage-dependent gating mechanism, channel conductance and toxin binding properties. Each type of K + channel is activated by different signals and conditions depending on their type of regulation: some open in response to depolarisation of the plasma membrane; others in response to hyperpolarisation or an increase in intracellular calcium concentration; some can be regulated by binding of a transmitter, together with intracellular kinases; while others are regulated by GTP-binding proteins or other second messengers. In eukaryotic cells, K + channels are involved in neural signalling and generation of the cardiac rhythm, act as effectors in signal transduction pathways involving G protein-coupled receptors (GPCRs) and may
definition_source: "InterPro:IPR003938 abstract (PRINTS PR01463 is a member signature)"
