identifier: PRINTS:PR01003
label: "Flagellar assembly protein FliH signature"
definition: >-
  Many flagellar proteins are exported by a flagellum-specific export pathway. Attempts have been made to characterise the apparatus responsible for this process, by designing assays to screen for mutants with export defects. Experiments involving filament removal from temperature-sensitive flagellar mutants of Salmonella typhimurium have shown that, while most mutants were able to regrow filaments, flhA, fliH, fliI and fliN mutants showed no or greatly reduced regrowth. This suggests that the corresponding gene products are involved in the process of flagellum-specific export. The sequence of fliH has been deduced and shown to encode a protein of molecular mass of 25,782 Da.
definition_source: "InterPro:IPR000563 abstract (PRINTS PR01003 is a member signature)"
