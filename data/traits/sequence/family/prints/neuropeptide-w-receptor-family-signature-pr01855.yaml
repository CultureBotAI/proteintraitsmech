identifier: PRINTS:PR01855
label: "Neuropeptide W receptor family signature"
definition: >-
  Two closely related neuropeptide precursors, which share no significant sequence similarity with other known neuropeptides, have recently been identified neuropeptide B and neuropeptide W. Neuropeptide B is expressed in both the central nervous system (CNS) and in the periphery. In the CNS, highest levels of the peptide are found in the substantia nigra and hypothalamus, suggesting a possible role in locomotor control and the release of pituitary hormones. In the periphery, the peptide is most abundant in testis, ovary, uterus, placenta, spleen, lymph nodes and peripheral blood leukocytes, indicating potential roles in the reproductive and immune systems. Neuropeptide W has a more limited distribution in the brain than neuropeptide B and is found at highest levels in the substantial nigra, also suggesting an involvement in locomotor control. In the periphery, neuropeptide W is more widespread than neuropeptide B. In addition to the reproductive and immune tissues in which neuropeptide B is expressed, neuropeptide W has been found at high levels in the liver, stomach and trachea. Administration of neuropeptide W in rats has been reported to produce an acute increase in food intake and to stimulate prolactin release. Two rhodopsin-like G protein-coupled receptors, neuropeptide B/W receptor 1 (also known as GPR7) and neuropeptide B/W receptor 2 (also known as GPR8) have recently been identified as receptors for these neuropeptides. Neuropeptide B/W receptor 1 is expressed at highest levels in the hippocampus, amygdala, trachea and in lung carcinoma and at moderate levels in foetal brain, pituitary and prostate whereas Neuropeptide B/W receptor 2 is most highly expressed in the caudate nucleus, hippocampus and amygdala, and moderately expressed in the adult brain, thalamus,
