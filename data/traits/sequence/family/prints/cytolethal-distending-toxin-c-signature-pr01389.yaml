identifier: PRINTS:PR01389
label: "Cytolethal distending toxin C signature"
definition: >-
  Cytolethal distending toxin (CDT) is produced by Escherichia coli, Haemophilus spp. and Campylobacter spp. and causes distension and death in certain cell lines. The toxin comprises three subunits, A, B and C, of approximately 27.7, 29.5 and 19.9 kDa respectively. CDT blocks the cell cycle at the G2 stage through inactivation of the cyclin-dependent kinase Cdk1, without induction of DNA breaks, leading to multipolar abortive mitosis and micronucleation associated with centrosomal amplification. The roles of each subunit remain unclear, though they are thought to have separate roles in pathogenicity. This entry represents the C subunit.
definition_source: "InterPro:IPR003559 abstract (PRINTS PR01389 is a member signature)"
