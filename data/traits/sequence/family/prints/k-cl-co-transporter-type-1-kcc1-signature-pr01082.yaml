identifier: PRINTS:PR01082
label: "K-Cl co-transporter type 1 (KCC1) signature"
definition: >-
  The K-Cl co-transporter (KCC) mediates the coupled movement of K + and Cl - ions across the plasma membrane of many animal cells. This transport is involved in the regulatory volume decrease in response to cell swelling in red blood cells, and has been proposed to play a role in the vectorial movement of Cl - across kidney epithelia. The transport process involves one for one electroneutral movement of K + together with Cl -, and, in all known mammalian cells, the net movement is outward. Four isoforms of KCC have been identified: KCC1, KCC2, KCC3, and KCC4. They are predicted to have 12 transmembrane (TM) regions in a central hydrophobic domain, together with hydrophilic N- and C-termini that are likely cytoplasmic. Comparison of their sequences with those of other ion-tranporting membrane proteins reveals that they are part of a new superfamily of cation-chloride co-transporters, which includes the Na-Cl and Na-K-2Cl co-transporters. KCC1 and KCC3 are widely expressed in human tissues, while KCC2 is are expressed only in brain neurones, making it likely that this is the isoform responsible for maintaining low Cl - concentration in neurones. KCC1, also known as solute carrier family 12 member 4 (SLC12A4), is widely expressed in human tissues, and when heterologously expressed, possesses the functional characteristics of the well-studied red blood cell K-Cl co-transporter, including stimulation by both swelling and N-ethylmaleimide. Several splice variants have also been identified. Proteins in this entry are predominantly found in chordates.
