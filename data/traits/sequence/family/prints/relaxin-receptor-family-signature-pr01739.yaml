identifier: PRINTS:PR01739
label: "Relaxin receptor family signature"
definition: >-
  Insulin is found in many animals, and is involved in the regulation of normal glucose homeostasis. It also has other specific physiological effects, such as increasing the permeability of cells to monosaccharides, amino acids and fatty acids, and accelerating glycolysis and glycogen synthesis in the liver. Insulin exerts its effects by interaction with a cell-surface receptor, which may also result in the promotion of cell growth. Relaxin has diverse actions in the reproductive tract and in other tissues during pregnancy. Although binding sites for relaxin have been found in reproductive tissue, the nature of the receptor was previously unknown. Recently, two orphan GPCRs, LGR7 and LGR8, have been identified as receptors for the hormone. These two receptors contain large extracellular N-termini with leucine-rich repeat regions, and are structurally similar to the gonadotropin and thyrotropin receptors. LGR7 is expressed in the brain, kidney, testis, placenta, uterus, ovary, adrenal gland, prostate, skin and heart, while LGR8 is expressed mainly in the brain, kidney, muscle, testis, thyroid, uterus, peripheral blood cells and bone marrow. Upon binding to LGR7 or 8, relaxin stimulates a dose-dependent increase in cyclic AMP production, indicating coupling of the receptors to G proteins.
