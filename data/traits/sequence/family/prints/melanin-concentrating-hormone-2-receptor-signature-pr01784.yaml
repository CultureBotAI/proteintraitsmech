identifier: PRINTS:PR01784
label: "Melanin-concentrating hormone 2 receptor signature"
definition: >-
  This entry represents a group of proteins from vertebrates, including human Melanin-concentrating hormone receptor 2 (MCHR2 or MCH2). Melanin-concentrating hormone (MCH) is a cyclic peptide originally identified in teleost fish. In fish, MCH is released from the pituitary and causes lightening of skin pigment cells through pigment aggregation. In mammals, MCH is predominantly expressed in the hypothalamus, and functions as a neurotransmitter in the control of a range of functions. A major role of MCH is thought to be in the regulation of feeding: injection of MCH into rat brains stimulates feeding; expression of MCH is upregulated in the hypothalamus of obese and fasting mice; and mice lacking MCH are lean and eat less. MCH and alpha melanocyte-stimulating hormone (alpha-MSH) have antagonistic effects on a number of physiological functions. Alpha-MSH darkens pigmentation in fish and reduces feeding in mammals, whereas MCH increases feeding. Two G protein-coupled receptors, MCH1 and MCH2, have recently been identified as receptors for the melanin-concentrating hormone. The rhodopsin-like GPCRs (GPCRA) represent a widespread protein family that includes hormone, neurotransmitter and light receptors, all of which transduce extracellular signals through interaction with guanine nucleotide-binding (G) proteins. Although their activating ligands vary widely in structure and character, the amino acid sequences of the receptors are very similar and are believed to adopt a common structural framework comprising 7 transmembrane (TM) helices. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level, on the ba
