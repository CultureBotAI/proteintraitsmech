identifier: PRINTS:PR01046
label: "Prolyl-tRNA synthetase signature"
definition: >-
  Proline-tRNA ligase (also known as Prolyl-tRNA synthetase) belongs to class IIa aminoacyl-tRNA synthetases. Prolyl-tRNA synthetase ( EC:6.1.1.15 ) exists in two forms, which are loosely related. The first form is present in the majority of eubacteria species. The second one, present in some eubacteria, is essentially present in archaea and eukaryota. The enzyme from Escherichia coli contains all three of the conserved consensus motifs characteristic of class II aminoacyl-tRNA synthetases. The complex between Thermus thermophilus prolyl-tRNA synthetase (ProRSTT) and its cognate tRNA has been crystallized using two different isoacceptors of tRNA(Pro). Aminoacyl-tRNA synthetases (also known as aminoacyl-tRNA ligases) catalyse the attachment of amino acids to their cognate transfer RNA molecules through a highly specific two-step reaction. These enzymes vary widely in size and oligomeric state, and share limited sequence homology. The 20 aminoacyl-tRNA synthetases are divided into two classes. Class I synthetases contain a characteristic Rossmann fold catalytic domain and are predominantly monomeric. Class II synthetases feature an antiparallel β-sheet fold flanked by α-helices and are mostly dimeric or multimeric, with at least three conserved regions. Despite these structural differences, both classes share a conserved α-helical structure involved in tRNA binding. The two classes also differ in their catalytic mechanisms: class I synthetases couple the aminoacyl group to the 2'-hydroxyl of the tRNA, whereas class II synthetases preferentially use the 3'-hydroxyl site. Class I includes synthetases specific for arginine, cysteine, glutamic acid, glutamine, isoleucine, leucine, methionine, tyrosine, tryptophan, valine, and some lysine synthetases (non-eukaryotic). Class II i
