identifier: PRINTS:PR01247
label: "Rec1 exonuclease signature"
definition: >-
  Rec1 of Ustilago maydis is a homologue of S. pombe Rad1 and S. cerevisiae Rad17 proteins. It plays a key role in regulating the genetic system of the fungus. Rec1 mutants are very sensitive to UV light - mutation leads to a complex phenotype with alterations in DNA repair, recombination, mutagenesis, meiosis and cell division. The predicted product of the REC1 gene is a polypeptide of 522 amino acid residues with molecular mass 57 kD. The protein shows 3'--5' exonuclease activity, but only in cells over-expressing Rec1. While it is distinguishable from the major bacterial nucleases, the protein has certain enzymatic features in common with epsilon, the proof-reading exonuclease subunit of Escherichia coli DNA polymerase III holoenzyme.
