identifier: PRINTS:PR01468
label: "Staphylococcal bi-component toxin signature"
definition: >-
  Many virulence mechanisms are employed by Staphylococci to induce pathogenesis: these can include polysaccharide capsules and exotoxins. Examples of the latter are bi-component toxins, which involve the synergistic combination of an "S" and an "F" component. These undergo conformational changes in their protein structure and form oligomeric pores in the target cell membrane upon recognition of certain host receptors. The main cells targeted are polymorphonuclear cells, monocytes, erythrocytes and macrophages. Examples of this protein family include: leucocidin, gamma-hemolysin and alpha-hemolysin.
definition_source: "InterPro:IPR003963 abstract (PRINTS PR01468 is a member signature)"
