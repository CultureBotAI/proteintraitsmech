identifier: PRINTS:PR00089
label: "Bacterial luciferase signature"
definition: >-
  The enzyme responsible for bioluminescence in motile Gram-negative luminous bacteria is bacterial luciferase ( EC:1.14.14.3 ), which catalyses the oxidation of reduced riboflavin phosphate (FMNH2) and a long chain fatty aldehyde with the emission of blue green light (490 nm). Luciferase is a heterodimeric enzyme composed of an alpha subunit (gene luxA) and a beta subunit (gene luxB). The two subunits appear to have arisen by gene duplication. The bioluminescence operon of some species of Photobacterium encodes a protein known as the non-fluorescent flavoprotein (NFP) (gene luxF). NFP, whose function is not yet known, contains an unusual non-covalently bound flavin. It is evolutionary related to the luxA/luxB subunits.
