identifier: PRINTS:PR01900
label: "YidC translocation/secretion protein signature"
definition: >-
  This entry includes membrane insertase YidC from bacteria, ALBINO3-like proteins from plants, and mitochondrial membrane insertase OXA1 and cytochrome c oxidase assembly protein COX18 from eukaryotes. They are a group of evolutionarily conserved proteins that function in membrane protein integration and protein complex stabilisation. They share a conserved region composed of five transmembrane regions. YidC is required for the insertion of integral membrane proteins into the membrane. It may also be involved in protein secretion processes. YidC from Gram-negative bacteria contains an extra transmembrane segment (TM1) at the N-terminal and a large periplasmic domain, located between TM1 and TM2, that adopts a β-super sandwich fold that is found in sugar-binding proteins such as galactose mutarotase. The well-characterised YidC protein from Escherichia coli and its close homologues contain a large N-terminal periplasmic domain (InterPro:IPR028053). This protein interacts with SecYEG protein-conducting channel and the accessory proteins SecDF-YajC to form the bacterial holo-translocon (HTL). COX18 is a mitochondrial membrane insertase required for the translocation of the C-terminal of cytochrome c oxidase subunit II (MT-CO2/COX2) across the mitochondrial inner membrane. It plays a role in MT-CO2/COX2 maturation following the COX20-mediated stabilisation of newly synthesised MT-CO2/COX2 protein and before the action of the metallochaperones SCO1/2. OXA1 is a mitochondrial inner membrane insertase that mediates the insertion of both mitochondrion-encoded precursors and nuclear-encoded proteins from the matrix into the inner membrane. It links mitoribosomes with the inner membrane. Plant ALBINO3-like proteins are required for the insertion of some light harvesting chlorophyl
