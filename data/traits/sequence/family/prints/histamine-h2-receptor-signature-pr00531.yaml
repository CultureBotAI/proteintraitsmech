identifier: PRINTS:PR00531
label: "Histamine H2 receptor signature"
definition: >-
  Histamine plays an important role in a variety of pathophysiological conditions. In allergic conditions, histamine is released from basophils and mast cells and is responsible for symptoms of allergic conditions of the skin and airways. In the gastric mucosa, gastric induced histamine release stimulates parietal cells to secrete gastric acid. In the central nervous system (CNS), histamine is synthesized in specific neurons that are localized in the posterior hypothalamus. These neurons are involved in a variety of important physiological functions, including the regulation of the sleep-wake cycle, cardiovascular control, regulation of the hypothalamic pituitary adrenal-axis, learning and memory. Histamine exerts its biological effects by binding to and activating four distinct separate rhodopsin-like G protein-coupled receptors-histamine H1 receptor, histamine H2 receptor, histamine H3 receptor, and histamine H4 receptor. Each of the histamine receptors produce a functional response, but their mechanism differs. The H1 receptor couples to Gq/11 stimulating phospholipase C, whereas the H2 receptor interacts with Gs to activate adenylyl cyclase. The H3 and H4 receptors couple to Gi proteins to inhibit adenylyl cyclase, and to stimulate MAPK in the case of the H3 receptor. This entry represents the histamine H2 receptor (also known as HH2R). It is located in parietal cells found in the stomach and in the heart and has a limited distribution in vascular smooth muscle and cells of the immune system. H2 receptors primarily stimulate gastric acid secretion and vasodilation, H2 antagonists are therefore used in the clinical treatment of peptic ulceration and asthma. Activation of the H2 receptor results in physiological responses, including stimulation of suppressor T cells, de
