identifier: PRINTS:PR01686
label: "CYP2D P450 family signature"
definition: >-
  This entry represents the CYP2D family from group I, class E, cytochrome P450 proteins, as well as other CYP2 family proteins. The CYP2 family comprises 15 subfamilies (A-H, J-N, P and Q). The first five (A-E) are present in mammalian liver, but in differing amounts and with different inducibilities. These five subfamilies show varied substrate specificities, with some degree of overlap. CYP2D6 metabolises several classes of therapeutic drugs, endogenous neurochemicals and toxins, and can be detected in liver, intestine and kidney. CYP2D6 is non-inducible, and genomic defects in CYP2D6 that inhibit or induce activity can have serious effects with respect to drug efficacy and clearance. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and fatty acids. In bacteria, they are important for several metabolic processes, such as the biosynthesis of antibiotic erythromycin in Saccharopolyspora erythraea (Streptomyces erythraeus). Cytochrome P450 enzymes use haem to oxidise their substrates, using protons derived from NADH or NADPH to split the oxygen so a single atom can be added to a substrate. They also require electrons, which they receive from a variety of redox partners. In certain cases, cytochrome
