identifier: PRINTS:PR01209
label: "Na-K-Cl co-transporter 2 signature"
definition: >-
  Solute carrier family 12 member 1 (SLC12A1 or NKCC2) is an apical absorptive Na-K-Cl co-transporter isoform. In contrast to the wide tissue distribution of NKCC1, expression of the NKCC2 isoform is restricted to the vertebrate kidney, where it is involved in urinary concentration. Subsequent studies revealed that three variants exist, differing by 31 amino acids, which are generated by alternatively splicing. They show differential distributions within the kidney, suggesting they may subserve varying functions. Mutations in the gene encoding the renal-specific isoform of the Na-K-Cl co-transporter (NKCC2) give rise to Bartter's Syndrome Type 1, an inherited kidney disease characterised by hypokalaemia, metabolic alkalosis, salt-wasting and hypotension. The Na-K-Cl co-transporters are a family of integral membrane proteins that are ubiquitously expressed in animal tissues, serving a variety of functions. In cells of Cl - absorptive and Cl - secretory epithelia, Na-K-Cl co-transport serves as the major Cl - entry pathway, and functions in concert with other membrane ion channels and pumps to carry out net transepithelial movement of salt. This vectorial transport of Cl - across epithelia is involved in the reabsorption of salt in the vertebrate kidney (which is crucial for urinary concentration), and in the secretion of salt in such tissues as the mammalian intestine and trachea. In addition, Na-K-Cl co-transport is known to play a role in cell volume regulation in most mammalian cell types. The proteins mediate the coupled, electroneutral transport of sodium, potassium and chloride ions across the plasma membrane of cells (with a stoichiometry of 1:1:2, respectively). Co-transport of all three ions is obligatory, since absence of one is sufficient to prevent ion movement
