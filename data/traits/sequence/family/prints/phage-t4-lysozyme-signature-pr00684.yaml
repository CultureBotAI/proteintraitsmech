identifier: PRINTS:PR00684
label: "Phage T4 lysozyme signature"
definition: >-
  O-Glycosyl hydrolases ( ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 24 ( ) comprises enzymes with only one known activity; lysozyme ( ). T4 lysozyme helps to release mature phage particles from the cell wall by breaking down the peptidoglycan. The enzyme hydrolyses the 1,4-beta linkages between N-acetyl-D-glucosamine and N-acetylmuramic acid in peptidoglycan heteropolymers of prokaryotic cell walls. The T4 lysozyme structure contains 2 domains, the interface between which forms the active-site cleft. The N terminus of the 2 domains undergoes a 'hinge-bending' motion about an axis passing through the molecular waist. This mobility is thought to be important in allowing access of substrates to the enzyme active site.
definition_source: "InterPro:IPR001165 abstract (PRINTS PR00684 is a member signature)"
