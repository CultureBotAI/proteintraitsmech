identifier: PRINTS:PR01851
label: "Cystic fibrosis transmembrane conductance regulator signature"
definition: >-
  The ABC transporter family is a group of membrane proteins that use the hydrolysis of ATP to power the translocation of a wide variety of substrates across cellular membranes. ABC transporters minimally consist of two conserved regions: a highly conserved nucleotide-binding domain (NBD) and a less conserved transmembrane domain (TMD). Eukaryotic ABC proteins are usually organised either as full transporters (containing two NBDs and two TMDs), or as half transporters (containing one NBD and one TMD), that have to form homo- or heterodimers in order to constitute a functional protein. Cystic fibrosis transmembrane conductance regulator (CFTR, also known as ABCC7) is an eukaryotic protein belonging to the ABC-C subfamily of the ABC transporter family. CFTR protein is a chloride ion channel controlled by phosphorylation. It has a major role in electrolyte and fluid secretion. CFTR is important in the determination of fluid flow, ion concentration and transepithelial salt transport. Dysfunction of the CFTR channel causes the life-threatening disease, cystic fibrosis, in which trans-epithelial ion transport is disrupted. Defective phosphorylation has been seen to be a cause for this altered activity.
