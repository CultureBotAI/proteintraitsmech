identifier: PRINTS:PR00758
label: "Arsenical pump membrane protein signature"
definition: >-
  Arsenic is a toxic metalloid whose trivalent and pentavalent ions inhibit a variety of biochemical processes. Operons that encode arsenic resistance have been found in multicopy plasmids from both Gram-positive and Gram-negative bacteria. The resistance mechanism is encoded from a single operon, which houses an anion pump. The pump has two polypeptide components: a catalytic subunit (the ArsA protein), which functions as an oxyanion-stimulated ATPase; and an arsenite export component (the ArsB protein), which is associated with the inner membrane. The ArsA and ArsB proteins are thought to form a membrane complex that functions as an anion-translocating ATPase. The ArsB protein is distinguished by its overall hydrophobic character, in keeping with its role as a membrane-associated channel. Sequence analysis reveals the presence of 13 putative transmembrane (TM) regions.
