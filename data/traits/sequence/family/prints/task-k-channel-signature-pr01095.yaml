identifier: PRINTS:PR01095
label: "TASK K+ channel signature"
definition: >-
  2P-domain channels influence the resting membrane potential and as a result can control cell excitability. In addition, they pass K+ in response to changes in membrane potential, and are also tightly regulated by molecular oxygen, GABA (gamma-aminobutyric acid), noradrenaline and serotonin. The first member of this family (TOK1), cloned from Saccharomyces cerevisiae, is predicted to have eight potential transmembrane (TM) helices. However, subsequently-cloned two P-domain family members from Drosophila and mammalian species are predicted to have only four TM segments. They are usually referred to as TWIK-related channels (Tandem of P-domains in a Weakly Inward rectifying K+ channel). Functional characterisation of these channels has revealed a diversity of properties in that they may show inward or outward rectification, their activity may be modulated in different directions by protein phosphorylation, and their sensitivity to changes in intracellular or extracellular pH varies. Despite these disparate properties, they are all thought to share the same topology of four TM segments, including two P-domains. That TWIK-related K+ channels all produce instantaneous and non-inactivating K+ currents, which do not display a voltage-dependent activation threshold, suggests that they are background (leak) K+ channels involved in the generation and modulation of the resting membrane potential in various cell types. Further studies have revealed that they may be found in many species, including: plants, invertebrates and mammals. TASK is a member of the TWIK-related (two P-domain) K + channel family identified in human tissues. It is widely distributed, being particularly abundant in the pancreas and placenta, but it is also found in the brain, heart, lung and kidney. Its amino a
