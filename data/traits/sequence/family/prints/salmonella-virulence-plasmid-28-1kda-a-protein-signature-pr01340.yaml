identifier: PRINTS:PR01340
label: "Salmonella virulence plasmid 28.1kDa A protein signature"
definition: >-
  Salmonella typhimurium contains a 90kb plasmid that is associated with virulence. This plasmid encodes at least 6 genes needed by the bacterium for invading host macrophages during infection. These include the 70kDa mkaA protein, a recognised virulence factor, and more recently described, four spv genes under the control of a regulator. Deletion studies on the virulence plasmid have shown that an open reading frame encoding a 28kDa protein was needed for successful invasion of the host. This protein, designated mkfA, VRP4 or VirA by different groups, is utilised by the microbe upon entry into macrophages, although the exact mechanism is unclear.
definition_source: "InterPro:IPR003518 abstract (PRINTS PR01340 is a member signature)"
