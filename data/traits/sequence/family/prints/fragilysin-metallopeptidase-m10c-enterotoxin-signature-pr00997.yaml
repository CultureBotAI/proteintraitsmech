identifier: PRINTS:PR00997
label: "Fragilysin metallopeptidase (M10C) enterotoxin signature"
definition: >-
  Fragilysin is a metalloprotease toxin which is cytopathic to intestinal epithelial cells and induces fluid secretion and tissue damage in ligated intestinal loops. It hydrolyses gelatin, azocoll, actin, tropomyosin, and fibrinogen and causes diarrhoea. This entry is found in Bacteroidales.
