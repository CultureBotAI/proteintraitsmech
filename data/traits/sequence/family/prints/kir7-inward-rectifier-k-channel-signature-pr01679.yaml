identifier: PRINTS:PR01679
label: "Kir7 inward rectifier K+ channel signature"
definition: >-
  Inward rectifier potassium channels are characterised by a greater tendency to allow potassium to flow into the cell rather than out of it. Their voltage dependence is regulated by the concentration of extracellular potassium; as external potassium is raised, the voltage range of the channel opening shifts to more positive voltages. The inward rectification is mainly due to the blockage of outward current by internal magnesium. Inward rectifier potassium channel 13 (KCNJ13) has a very low single channel conductance, low sensitivity to block by external barium and cesium, and no dependence of its inward rectification properties on the internal blocking particle magnesium.
definition_source: "InterPro:IPR008062 abstract (PRINTS PR01679 is a member signature)"
