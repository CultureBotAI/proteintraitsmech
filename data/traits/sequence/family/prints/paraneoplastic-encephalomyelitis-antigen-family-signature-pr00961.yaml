identifier: PRINTS:PR00961
label: "Paraneoplastic encephalomyelitis antigen family signature"
definition: >-
  Many eukaryotic proteins that are either known or thought to bind single-stranded RNA contain one or more copies of a putative RNA-binding domain of about 90 amino acids. This region has been found in, for example, heterogeneous nuclear ribonucleoproteins, small nuclear ribonucleoproteins, pre-RNA and mRNA associated proteins, Drosophila sex determination and elav proteins, human paraneoplastic encephalomyelitis antigen HuD, and many others. The structure of an RNA-binding domain of Drosophila Sex-lethal (Sxl) protein has been determined using multi-dimensional hetero-nuclear NMR. Sxl contains two RNP consensus-type RNA-binding domains (RBDs) - the determined structure represents the second of these (RBD-2). The calculated intermediate-resolution family of structures exhibits the β-α-β/β-α-β tertiary fold found in other RBD-containing proteins.
definition_source: "InterPro:IPR002343 abstract (PRINTS PR00961 is a member signature)"
