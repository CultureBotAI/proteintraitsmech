identifier: PRINTS:PR00484
label: "Pheromone/general odorant binding protein signature"
definition: >-
  Pheromone binding proteins (PBPs) are abundant, secreted antennal proteins present in olfactory sensilla. They lie in the lymph that surrounds the dendrites of olfactory receptor neurons. The olfactory receptors of terrestrial animals exist in an aqueous environment, yet detect odorants that are primarily hydrophobic. The aqueous solubility of hydrophobic odorants is thought to be greatly enhanced via odorant binding proteins which exist in the extracellular fluid surrounding the odorant receptors. This family is composed of pheromone binding proteins (PBP), which are male-specific and associate with pheromone-sensitive neurons and general-odorant binding proteins (GOBP). GOBPs have been found in moth antennae, and share a high level of sequence similarity with the PBPs. They are believed to carry odorants rather than pheromones. This family is distinct from the vertebrate odorant-binding proteins (OBPs).
