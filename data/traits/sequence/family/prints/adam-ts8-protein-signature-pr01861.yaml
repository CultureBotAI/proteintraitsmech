identifier: PRINTS:PR01861
label: "ADAM-TS8 protein signature"
definition: >-
  This entry contains members of the ADAM-TS8 family of metallopeptidases that belong to MEROPS peptidase family M12, subfamily M12B: adamalysin (clan MA). Proteolysis of the extracellular matrix plays a critical role in establishing tissue architecture during development and in tissue degradation in diseases such as cancer, arthritis, Alzheimer's disease and a variety of inflammatory conditions. The proteolytic enzymes responsible for this process are members of diverse protease families, including the secreted zinc metalloproteases (MPs). Recently, a new MP family, ADAM-TS (a disintegrin-like and metalloprotease domain with thrombospondin type I modules) has been identified. The family consists of at least 20 members that share a high degree of sequence similarity and conserved domain organisation. The defining domains of the ADAM-TS family are (from N- to C-termini) a pre-pro metalloprotease domain of the reprolysin type, a snake venom disintegrin-like domain, a thrombospondin type-I (TS) module, a cysteine-rich region, and a cysteine-free (spacer) domain. Domain organisation following the spacer domain C terminus shows some variability in certain ADAM-TS members, principally in the number of additional TS domains. Members of the ADAM-TS family have been implicated in a range of diseases. ADAM-TS1, for example, is reported to be involved in inflammation and cancer cachexia, whilst recessively inherited ADAM-TS2 mutations cause Ehlers-Danlos syndrome type VIIC, a disorder characterised clinically by severe skin fragility. ADAM-TS4 is an aggrecanase involved in arthritic destruction of cartilage. ADAM-TS8, also termed METH2, was identified by searching expressed sequence tag databases for sequences that contained TS modules. In vitro studies have shown recombinant ADAM-T
