identifier: PRINTS:PR01066
label: P2Y4PRNOCPTR
definition: >-
  There are three distinct families of extracellular receptors for purine and pyrimidine nucleotides, known as P1, P2X and P2Y purinoceptors. These receptors induce a wide variety of biological effects and are involved in many different cellular functions. P2X receptors are ligand-gated ion channels, whereas P1 and P2Y receptors are rhodopsin-like G protein-coupled receptors. The families also differ by their method of activation: P1 receptors are preferentially activated by adenosine, P2X via ATP, whereas the P2Y receptors, in addition to being activated by ATP, are activated by different adenine and/or uridine nucleoside di- and triphosphates (ADP, UDP, UTP, UDP and UDP-glucose). The P2Y purinoceptors currently consist of eleven subtypes: P2Y1, P2Y2, P2Y3 P2Y4, P2Y6, P2Y8, P2Y10, P2Y11, P2Y12, P2Y13 and P2Y14. P2Y3 has, as yet, only been found in birds, whilst the rest have been cloned in humans. The gaps in P2Y receptor numbering are due to the reclassification of some receptors that were initially associated with to the P2Y family. These include P2Y5 (now known as lysophosphatidic acid receptor 6), P2Y7 (now leukotriene B4 receptor) and P2Y9 (lysophosphatidic acid receptor 4). This entry represents P2Y4 receptor, which is expressed in the placenta, the lung, vascular smooth muscle and enteric glial cells. The receptor can couple to both Gi and Gq/11. In cells stably expressing the receptor, UTP has been shown to stimulate the formation of inositol phosphates with maximal effect, while ATP behaves as a partial agonist, and ADP is almost inactive. In guinea pig gallbladder smooth muscle cells, P2Y4 activation is followed by phospholipase A2 and COX-1 stimulation. In human HaCaT keratinocytes, UTP acting on the P2Y4 receptor stimulates ERK1/2 phosphorylation, which in tu
