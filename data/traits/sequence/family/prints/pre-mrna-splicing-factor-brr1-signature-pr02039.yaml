identifier: PRINTS:PR02039
label: "Pre-mRNA-splicing factor BRR1 signature"
definition: >-
  PRE-mRNA splicing is catalysed by the spliceosome, a large dynamic complex composed of five small nuclear RNAs (snRNAs) and more than 80 proteins. Brr1 (Bad Response to Refrigeration protein 1) is a component of spliceosomal snRNPs. Brr1 is a nuclear protein involved in mRNA splicing and required for snRNA accumulation and snRNP biogenesis. It interacts with histone protein HTA1 and associates with the spliceosome during snRNA and snRNP production.
definition_source: "InterPro:IPR023251 abstract (PRINTS PR02039 is a member signature)"
