identifier: PRINTS:PR00885
label: "Bacterial general secretion pathway protein H signature"
definition: >-
  This entry includes type II secretion system protein H and closely related proteins. The proteins of the type II secretion system (T2SS) are named Gsp in general and Eps in V. cholerae. EpsH is a GspH homologue and one of the minor pseudopilin components of the T2SS. This protein has been structurally characterised. It adopts an α/β structure, in which a hydrophobic helix is cradled by a pair of four-stranded antiparallel β-sheets. The type II secretion system (T2SS) is one of several extracellular secretion systems in gram-negative bacteria. It delivers toxins and a range of hydrolytic enzymes including proteases, lipases and carbohydrate-active enzymes to the cell surface or extracellular space. T2SS systems are composed of 11 to 15 different proteins, which are generally called GspA to GspO and GspS. The T2SS spans the two bacterial membranes and ensures secretion of folded proteins across the outer membrane pore formed by GspD. The inner membrane complex contains GspC, GspL, GspM, and GspF. The cytoplasmic domains of GspL and GspF interact with an ATPase, GspE. GspE is thought to energize the formation of a short pseudopilus by several pilin-like proteins, GspG to GspK. GspD has been shown to interact with the inner membrane component GspC.
