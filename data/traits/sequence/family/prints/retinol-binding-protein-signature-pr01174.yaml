identifier: PRINTS:PR01174
label: "Retinol binding protein signature"
definition: >-
  Proteins in this family include plasma retinol binding protein (pRBP) and purpurin. They mediate retinol transport in blood plasma. Binding to RBP allows the hydrophobic vitamin to circulate in blood, but retinol dissociates from the protein prior to entering target cells. Retinol circulates in the plasma without significant loss because it is bound to pRBP. This protein is synthesized primarily in the liver, where it requires the binding of retinol to trigger its secretion. In mammals, pRBP binds to transthyretin in the plasma, preventing the loss of pRBP through glomerular filtration. It has been suggested that a surface cell receptor would recognise the retinol-pRBP-transthyretin complex and, in that way, retinol would be delivered into the cell. However, such a protein remains to be identified. In fish, no transthyretin homologue has been found, though fish pRBP is capable of binding mammalian transthyretin. In Cyprinus carpio, pRBP is N-glycosylated and it has been suggested that pRBP filtration through kidney glomeruli may be reduced by a glycosylation-dependent increase in the molecular size and negative charge of the protein, since kidney filtration of anionic proteins is less than half that of neutral protein of the same size. The role of pRBP in retinol transport enables it to fulfill a number of physiological functions:1) it facilitates the transfer of insoluble retinol between tissues, principally transport from storage sites in the liver to peripheral tissues, 2) pRBP protects bound retinol from oxidation and tissues from the indiscriminate distribution of such a biologically active molecule, 3) the synthesis of pRBP regulates retinol release from the liver and mediates the specificity of its uptake by target cells, and 4) pRBP is believed to have an import
