identifier: PRINTS:PR01196
label: "GAT-2 GABA neurotransmitter transporter signature"
definition: >-
  Neurotransmitter transport systems are integral to the release, re-uptake and recycling of neurotransmitters at synapses. High affinity transport proteins found in the plasma membrane of presynaptic nerve terminals and glial cells are responsible for the removal from the extracellular space of released-transmitters, thereby terminating their actions. Plasma membrane neurotransmitter transporters fall into two structurally and mechanistically distinct families. The majority of the transporters constitute an extensive family of homologous proteins that derive energy from the co-transport of Na + and Cl -, in order to transport neurotransmitter molecules into the cell against their concentration gradient. The family has a common structure of 12 presumed transmembrane helices and includes carriers for gamma-aminobutyric acid (GABA), noradrenaline/adrenaline, dopamine, serotonin, proline, glycine, choline, betaine and taurine. They are structurally distinct from the second more-restricted family of plasma membrane transporters, which are responsible for excitatory amino acid transport. The latter couple glutamate and aspartate uptake to the cotransport of Na + and the counter-transport of K +, with no apparent dependence on Cl -. In addition, both of these transporter families are distinct from the vesicular neurotransmitter transporters. GABA is the major inhibitory transmitter in the mammalian brain, and is widely distributed throughout the nervous system. Molecular cloning studies have resulted in the cloning of three Na + and Cl - -coupled GABA transporters (known as GAT-1, GAT-2, GAT-3) and a betaine/GABA transporter (BGT-1). Each transporter shows varying affinities for GABA, different substrate and blocker pharmacologies, and different tissue localisation. GAT-2 prote
