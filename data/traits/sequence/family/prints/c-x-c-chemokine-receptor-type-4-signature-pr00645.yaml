identifier: PRINTS:PR00645
label: "C-X-C chemokine receptor type 4 signature"
definition: >-
  CXC chemokine receptor 4 (CXCR4), also known as fusin, which is a specific receptor for a CXCL12 (or SDF1). CXCR4 has a wide cellular distribution, with expression on most immature and mature hematopoietic cell types. In addition, CXCR4 can also be found on vascular endothelial cells and neuronal/nerve cells. Upon binding to CXCR4, CXCL12 causes mobilisation of intracellular calcium and chemotaxis. CXCL12 is known to be important in hematopoietic stem cell homing to the bone marrow and in hematopoietic stem cell quiescence. CXCR4 has a rather broad activity, and has been linked to cardiac, cerebellar gastric vasculature development and to hematopoiesis.
definition_source: "InterPro:IPR001277 abstract (PRINTS PR00645 is a member signature)"
