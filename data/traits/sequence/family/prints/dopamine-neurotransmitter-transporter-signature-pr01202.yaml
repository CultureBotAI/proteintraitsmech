identifier: PRINTS:PR01202
label: "Dopamine neurotransmitter transporter signature"
definition: >-
  Neurotransmitter transport systems are integral to the release, re-uptake and recycling of neurotransmitters at synapses. High affinity transport proteins found in the plasma membrane of presynaptic nerve terminals and glial cells are responsible for the removal from the extracellular space of released-transmitters, thereby terminating their actions. Plasma membrane neurotransmitter transporters fall into two structurally and mechanistically distinct families. The majority of the transporters constitute an extensive family of homologous proteins that derive energy from the co-transport of Na + and Cl -, in order to transport neurotransmitter molecules into the cell against their concentration gradient. The family has a common structure of 12 presumed transmembrane helices and includes carriers for gamma-aminobutyric acid (GABA), noradrenaline/adrenaline, dopamine, serotonin, proline, glycine, choline, betaine and taurine. They are structurally distinct from the second more-restricted family of plasma membrane transporters, which are responsible for excitatory amino acid transport. The latter couple glutamate and aspartate uptake to the cotransport of Na + and the counter-transport of K +, with no apparent dependence on Cl -. In addition, both of these transporter families are distinct from the vesicular neurotransmitter transporters. In the mammalian brain, the dopamine system is thought to be involved in the control of locomotion, cognition and endocrine function. The dopamine transporter is critical for the removal of dopamine from the extracellular space, following its release, and is the principal site of action for psycho-stimulant drugs, such as cocaine and amphetamines, which inhibit the transporter's activity. A single form of dopamine transporter (containing ~6
