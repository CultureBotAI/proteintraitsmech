identifier: PRINTS:PR01743
label: "Single-strand DNA-binding protein signature"
definition: >-
  The sequence-specific single-strand DNA-binding protein (SSDP) family is thought to be involved in transciption regulation. SSDP specifically binds single-stranded pyrimidine-rich mirror repeat elements commonly found in promoter regions, and is believed to regulate alpha-2(I) collagen. It has been identified as a target for unbalanced translocations and deletions in acute myelogenous leukemia cells, implying a role as a tumour suppressor gene. It is expressed in spleen, lymph node, peripheral blood, bone marrow, thymus and foetal liver. Family members have been identified in chicken, human, rat, mouse and Drosophila. SSDP from Drosophila interacts with LIM-domain binding protein Chi. As a complex, these proteins mediate transcription of developmental control genes via remote enhancers. The highest sequence identity is observed in the first 100 N-terminal residues, which contains a tryptophan-rich region in its centre. The C terminus is more variable, with glycine/ proline-rich low complexity regions.
