identifier: PRINTS:PR01688
label: "CYP2J P450 family signature"
definition: >-
  This entry represents the CYP2J family from group I, class E, cytochrome P450 proteins, as well as other CYP2 family proteins. The CYP2 family comprises 15 subfamilies (A-H, J-N, P and Q). The first five (A-E) are present in mammalian liver, but in differing amounts and with different inducibilities. These five subfamilies show varied substrate specificities, with some degree of overlap. Several CYP2J isoforms have been reported, including rabbit CYP2J1; human CYP2J2, the only member of the human CYP2J subfamily known for its role as arachidonic acid epoxygenase and antihistamine drugs are also substrates of it; rat CYP2J3 and CYP2J4; mouse CYP2J5, CYP2J6, CYP2J7, CYP2J8 and CYP2J9; and rat CYP2J10. Both rat CYP2J3 and human CYP2J2 catalyse vitamin D 25-hydroxylase, but with distinct preferences: rat for vitamin D3 and human for vitamin D2. Rat CYP2J4 is expressed in the intestine, where it is active towards all-trans and 9-cis-retinal, producing the corresponding retinoic acids. Mouse CYP2J5 is abundant in the kidney, where it is active in the metabolism of arachidonic acid to epoxyeicosatrienoic acids, and may be influenced by sex hormones. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and f
