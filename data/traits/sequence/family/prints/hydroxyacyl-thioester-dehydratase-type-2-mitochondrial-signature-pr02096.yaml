identifier: PRINTS:PR02096
label: "Hydroxyacyl-thioester dehydratase type 2 (mitochondrial) signature"
definition: >-
  Htd2 is a mitochondrial 3-hydroxyacyl-thioester dehydratase involved in fatty acid biosynthesis. It is required for respiratory growth and for normal mitochondrial morphology.
