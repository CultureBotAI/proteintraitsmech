identifier: PRINTS:PR01218
label: "Pistil-specific extensin-like signature"
definition: >-
  Extensins are plant cell-wall proteins; they can account for up to 20% of the dry weight of the cell wall. They are highly-glycosylated, possibly reflecting their interactions with cell-wall carbohydrates. Amongst their functions is cell wall strengthening in response to mechanical stress (e.g., during attack by pests, plant-bending in the wind, etc.). By contrast with extensin genes, pistil-specific extensin-like genes are not induced under stress conditions. Gene expression is organ-specific and temporally regulated during pistil development. After pollination, transcript levels of pistil-specific extensin-like genes change relative to levels in unpollinated pistils. The protein sequence is characterised by multiple tandem ser-pro-pro-pro-pro pentapeptide repeats.
definition_source: "InterPro:IPR003882 abstract (PRINTS PR01218 is a member signature)"
