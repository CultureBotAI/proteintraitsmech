identifier: PRINTS:PR00665
label: "Oxytocin receptor signature"
definition: >-
  Vasopressin and oxytocin are members of the neurohypophyseal hormone family found in all mammalian species. They are present in high levels in the posterior pituitary. Oxytocin stimulates contraction of uterine smooth muscle, and stimulates milk secretion in response to suckling by inducing contraction of myoepithelial cells in the mammary gland. Clinically, it is used to induce labour and promote lactation. Oxytocin receptors are found in uterine smooth muscle, myoepithelial cells in the mammary gland, and in the pituitary. Activation of phosphoinositide metabolism is effected via a pertussis-toxin-insensitive G-protein, probably of the Gq/G11 class. The rhodopsin-like GPCRs (GPCRA) represent a widespread protein family that includes hormone, neurotransmitter and light receptors, all of which transduce extracellular signals through interaction with guanine nucleotide-binding (G) proteins. Although their activating ligands vary widely in structure and character, the amino acid sequences of the receptors are very similar and are believed to adopt a common structural framework comprising 7 transmembrane (TM) helices. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. The term clan can be used to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include rhodopsin-like GPCRs (Class A, GPCRA), secretin-like GPCRs (Class B, GPCRB), metabotropic glutamate
