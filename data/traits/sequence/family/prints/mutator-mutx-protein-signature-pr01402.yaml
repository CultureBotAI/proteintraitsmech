identifier: PRINTS:PR01402
label: "Mutator MutX protein signature"
definition: >-
  Like MutT ( InterPro:IPR003561 ), MutX protein hydrolyses all canonical nucleoside triphosphates at different rates, with a preference for dGTP, yielding nucleoside monophosphates and inorganic pyrophosphate. Despite the similarity in enzymatic activity, the two proteins have distinct primary and quaternary structures. Their sequences share only a small region of similarity (the MutT domain), and under the same conditions in which MutT exists as a monomer in solution, MutX behaves as a trimer.
definition_source: "InterPro:IPR003562 abstract (PRINTS PR01402 is a member signature)"
