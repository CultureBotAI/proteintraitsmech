identifier: PRINTS:PR01110
label: "C-C chemokine receptor type 5 signature"
definition: >-
  CC chemokine receptor 5 (CCR5) is found on the surface of white blood cells, such as macrophages, T cells and dendritic cells, and expressed in lymphoid organs. Transfected cells expressing CCR5 receptor bind CCL5 (RANTES), CCL4 (MIP-1beta) and CCL3 (MIP-1alpha), and generate inositol phosphates in response to these chemokines. The same combination of chemokines has been shown to potently inhibit human immunodeficiency virus replication in human peripheral blood leukocytes. CCR5 is the major coreceptor for HIV-1 entry into target cells and is thought to be a suitable therapeutic target for HIV-1 blockade. Chemokines (chemotactic cytokines) are a family of chemoattractant molecules. They attract leukocytes to areas of inflammation and lesions, and play a key role in leukocyte activation. Originally defined as host defense proteins, chemokines are now known to play a much broader biological role. They have a wide range of effects in many different cell types beyond the immune system, including, for example, various cells of the central nervous system, and endothelial cells, where they may act as either angiogenic or angiostatic factors. The chemokine family is divided into four classes based on the number and spacing of their conserved cysteines: 2 Cys residues may be adjacent (the CC family); separated by an intervening residue (the CXC family); have only one of the first two Cys residues (C chemokines); or contain both cysteines, separated by three intervening residues (CX3C chemokines). Chemokines exert their effects by binding to rhodopsin-like G protein-coupled receptors on the surface of cells. Following interaction with their specific chemokine ligands, chemokine receptors trigger a flux in intracellular calcium ions, which cause a cellular response, including the
