identifier: PRINTS:PR01277
label: "Nucleoside-specific channel-forming protein Tsx signature"
definition: >-
  The tsx gene of Escherichia coli encodes an outer membrane protein, Tsx, which constitutes the receptor for colicin K and Bacteriophage T6, and functions as a substrate-specific channel for nucleosides and deoxy- nucleosides. The protein contains 294 amino acids, the first 22 of which are characteristic of a bacterial signal sequence peptide. The putative mature form of Tsx contains 272 residues with a calculated Mr of 31418. The Tsx sequence shows an even distribution of charged residues and lacks extensive hydrophobic stretches. Tsx shows no significant similarities to the channel-forming proteins OmpC, OmpF, PhoE and LamB from the E. coli outer membrane.
definition_source: "InterPro:IPR003055 abstract (PRINTS PR01277 is a member signature)"
