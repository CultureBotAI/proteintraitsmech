identifier: PRINTS:PR01223
label: "Bride of sevenless protein signature"
definition: >-
  During development of the Drosophila retina, the bride of sevenless (boss) gene is required in photoreceptor neuron R8 for the development of photoreceptor neuron R7, suggesting that boss encodes or regulates an R7-specific inductive cue. The induction of R8 photoreceptor neuron neighbouring cells to assume an R7 cell fate is believed to be mediated by a direct interaction of boss with sevenless. An alternative model has been proposed in which the boss protein functions as a receptor, based on a (superficial) similarity to the G-protein-coupled family of membrane receptors. The boss gene encodes a protein of 896 amino acids with a putative N-terminal signal sequence, a large N-terminal extra-cellular domain, seven transmembrane (TM) segments and a C-terminal cytoplasmic tail. The boss protein from Drosophila virilis (Fruit fly) shares a high level of amino acid identity with the Drosophila melanogaster (Fruit fly) homologue, with highest levels of similarity in the TM domains.
definition_source: "InterPro:IPR002956 abstract (PRINTS PR01223 is a member signature)"
