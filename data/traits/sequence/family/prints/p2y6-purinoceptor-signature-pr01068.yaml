identifier: PRINTS:PR01068
label: "P2Y6 purinoceptor signature"
definition: >-
  There are three distinct families of extracellular receptors for purine and pyrimidine nucleotides, known as P1, P2X and P2Y purinoceptors. These receptors induce a wide variety of biological effects and are involved in many different cellular functions. P2X receptors are ligand-gated ion channels, whereas P1 and P2Y receptors are rhodopsin-like G protein-coupled receptors. The families also differ by their method of activation: P1 receptors are preferentially activated by adenosine, P2X via ATP, whereas the P2Y receptors, in addition to being activated by ATP, are activated by different adenine and/or uridine nucleoside di- and triphosphates (ADP, UDP, UTP, UDP and UDP-glucose). The P2Y purinoceptors currently consist of eleven subtypes: P2Y1, P2Y2, P2Y3 P2Y4, P2Y6, P2Y8, P2Y10, P2Y11, P2Y12, P2Y13 and P2Y14. P2Y3 has, as yet, only been found in birds, whilst the rest have been cloned in humans. The gaps in P2Y receptor numbering are due to the reclassification of some receptors that were initially associated with to the P2Y family. These include P2Y5 (now known as lysophosphatidic acid receptor 6), P2Y7 (now leukotriene B4 receptor) and P2Y9 (lysophosphatidic acid receptor 4). This entry represents P2Y6 receptor. The receptor displays pharmacological characteristics distinct from any other P2Y receptor subtype, having a preference for uridine nucleotides, with UDP being 100-fold more potent than UTP. It associates weakly with ADP, but it is not responsive to ATP. P2Y6 is abundantly expressed in various tissues, including the spleen, placenta, kidney, adipose, bone, lung, heart, brain and skeletal muscle. In mouse bone marrow-derived mast cells and in the human cell line LAD2, P2Y6 receptors cooperate with cysteinyl leukotriene receptor 1 to promote cell survival and c
