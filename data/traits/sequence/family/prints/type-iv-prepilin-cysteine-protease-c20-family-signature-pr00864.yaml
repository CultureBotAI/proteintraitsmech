identifier: PRINTS:PR00864
label: "Type IV prepilin cysteine protease (C20) family signature"
definition: >-
  Cysteine protease activity is dependent on an active dyad of cysteine and histidine, the order and spacing of these residues varying in the 20 or so known families. Cysteine proteases have been grouped into two clans (CA and CB). Families C1, C2 and C10 are loosely termed papain-like and belong to clan CA; five cysteine proteases belong to clan CB; other families have not been assigned to clans. Nearly half of all cysteine proteases are found exclusively in viruses. The order of catalytic cysteine and histidine residues within the primary structure differs between the families and is an indication of convergent evolution. Bacteria produce a number of protein precursors that undergo post- translational methylation and proteolysis prior to secretion as active proteins. Type IV prepilin leader peptidases, which belong to the C20 family of cysteine proteases, are enzymes that mediate this type of post- translational modification. Type IV pilin is a protein found on the surface of Pseudomonas aeruginosa, Neisseria gonorrhoeae and other Gram-negative pathogens. Pilin subunits attach the infecting organism to the surface of host epithelial cells. They are synthesised as prepilin subunits, which differ from mature pilin by virtue of containing a 6-8 residue leader peptide consisting of charged amino acids. Mature type IV pilins also contain a methylated N-terminal phenylalanine residue.
