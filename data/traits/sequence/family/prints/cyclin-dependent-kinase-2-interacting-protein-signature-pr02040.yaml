identifier: PRINTS:PR02040
label: "Cyclin-dependent kinase 2-interacting protein signature"
definition: >-
  Cyclin-dependent kinase 2-interacting protein (CINP) is a component of the active cyclin E/Cdk2 and cyclin A/Cdk2 complexes. It is phopshorylated by Cdc7, but not by Cdk2. CINP has also been shown to bind to chromatin in a replication-dependent manner, and to associate with Origin Recognition Complex-2 (ORC2)-containing complexes and minichromosome maintenance/DNA replication licensing complex, MCM. It has been proposed that CINP is part of the Cdc7-dependent mechanism of origin firing, and constitutes a physical link between Cdk2 and Cdc7 complexes at the origins.
definition_source: "InterPro:IPR023250 abstract (PRINTS PR02040 is a member signature)"
