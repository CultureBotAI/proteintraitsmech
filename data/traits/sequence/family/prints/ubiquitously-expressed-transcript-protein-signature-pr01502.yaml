identifier: PRINTS:PR01502
label: "Ubiquitously expressed transcript protein signature"
definition: >-
  Ubiquitously expressed transcript protein UXT is involved in gene transcription regulation. It acts in concert with the corepressor URI1 to regulate androgen receptor transcription (AR). It is an AR N terminus-associated coactivator which may play a role in facilitating receptor-induced transcriptional activation.
