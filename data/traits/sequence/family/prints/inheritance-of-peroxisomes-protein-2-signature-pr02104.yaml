identifier: PRINTS:PR02104
label: "Inheritance of peroxisomes protein 2 signature"
definition: >-
  Faithful inheritance of organelles by daughter cells is essential to retain the benefits afforded to eukaryotic cells by compartmentalisation of biochemical functions. In Saccharomyces cerevisiae, the class V myosin, Myo2p, is involved in transporting different organelles, including the peroxisome, along actin cables to the bud. Inp2p has been identified as the peroxisome-specific receptor for Myo2p. Cells lacking Inp2p fail to partition peroxisomes to the bud, although they are unaffected in the inheritance of other organelles. Inp2p is a peroxisomal membrane protein, interacting directly with the globular tail of Myo2p. Cells that over-produce Inp2p often transfer their entire populations of peroxisomes to buds. Levels of Inp2p oscillate with the cell cycle. Organelle-specific receptors like Inp2p illustrate how a single motor can move different organelles in distinct and specific patterns. Inp2p is the first peroxisomal protein implicated in the vectorial movement of peroxisomes.
