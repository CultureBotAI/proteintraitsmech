identifier: PRINTS:PR01852
label: "Streptococcal non-M secreted SibA protein signature"
definition: >-
  This entry represents a family of proteins from bacteria and some lower eukaryotes, including Peptidoglycan hydrolase PcsB from Streptococcus pneumoniae. PcsB is required for the maintenance of normal growth and cellular morphology and is involved in the splitting of the septum during cell division. This protein is organised into three regions: an α-helical coiled coil (CC) domain, an alanine-rich linker region and a globular catalytic CHAP domain (InterPro:IPR007921) with an α+β papain-like amidase fold. At present, Streptococci are amongst the most medically important bacterial species, causing a variety of diseases across a wide range of age groups. They are non-motile, Gram-positive cocci that are facultative or obligate anaerobes, and occur in pairs or chains. These microbes can be separated into groups according to their serological specificity, group A Streptococci (GAS) being amongst the most virulent and showing the most antibiotic resistance.
definition_source: "InterPro:IPR009148 abstract (PRINTS PR01852 is a member signature)"
