identifier: PRINTS:PR00562
label: "Beta-2 adrenergic receptor signature"
definition: >-
  This entry represents the beta 2 receptor; it mediates relaxation of smooth muscle including vascular beds, bronchus, intestine and uterus. Beta 2 adrenoceptors, also mediate glycogenlysis and glucogenesis in the liver, regulate cell metabolism in skeletal muscle and inhibit the activity of leukocytes and other blood cells. The receptors are found in the heart, where they are involved in increased cardiac output, although to a lesser extent than beta 1 adrenoceptor. The receptors are located presynaptically in nerves, where they facilitate neurotransmitter release, and in the brain, where they regulate a variety of physiological processes. The adrenoceptors (or adrenergic receptors) are rhodopsin-like G protein-coupled receptors that are targets of the catecholamines, especially norepinephrine (noradrenaline) and epinephrine (adrenaline). Many cells possess these receptors, and the binding of a catecholamine to the receptor will generally stimulate the sympathetic nervous system, effect blood pressure, myocardial contractile rate and force, airway reactivity, and a variety of metabolic and central nervous system functions. The clinical uses of adrenergic compounds are vast. Agonists and antagonists interacting with adrenoceptors have proved useful in the treatment of a variety of diseases, including hypertension, angina pectoris, congestive heart failure, asthma, depression, benign prostatic hypertrophy, and glaucoma. These drugs are also useful in several other therapeutic situations including shock, premature labour and opioid withdrawal, and as adjuncts to general anaesthetics. There are three classes of adrenoceptors, based on their sequence similarity, receptor pharmacology and signalling mechanisms. These three classes are alpha 1 (a Gq coupled receptor), alpha 2
