identifier: PRINTS:PR00352
label: "3Fe-4S ferredoxin signature"
definition: >-
  In a few bacterial P450-containing systems, the transfer of electrons from flavoprotein reductase to P450 is mediated by 3Fe-4S ferredoxins. Despite functional similarity of such ferredoxins to the adrenodoxin family, they do not share sequence similarity but seem to be similar to some mono-[4Fe-4S] cluster ferredoxins but lack the fourth cysteine residue conserved in 4Fe-4S sequences. It has been shown experimentally that the 4Fe-4S cluster of related ferredoxins from archaebacteria easily converts to a 3Fe-4S cluster.
definition_source: "InterPro:IPR001080 abstract (PRINTS PR00352 is a member signature)"
