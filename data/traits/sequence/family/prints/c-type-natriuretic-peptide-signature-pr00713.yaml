identifier: PRINTS:PR00713
label: "C-type natriuretic peptide signature"
definition: >-
  Atrial natriuretic peptides (ANPs) are vertebrate hormones that play an important role in the control of cardiovascular homeostatis, and sodium and water balance in general. There are different NPs that vary in length but share a common core. All are processed from a single precursor. A disulphide bond resident in the C-terminal section is required for full activity of atriopeptins. The family of NPs includes structurally-related peptides that elicit similar pharmacological spectra. Amongst these are brain natriuretic peptide (BNP); C-type natriuretic peptide (CNP); ventricular natriuretic peptide (VNP); and Dendroaspis angusticeps (Eastern green mamba) natriuretic peptide (DNP). C-type natriuretic peptide has vasorelaxant and cGMP-stimulating activities.
definition_source: "InterPro:IPR002406 abstract (PRINTS PR00713 is a member signature)"
