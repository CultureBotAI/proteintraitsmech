identifier: PRINTS:PR00820
label: "CbxX/CfqX protein signature"
definition: >-
  Proteins in this family are now designated CbbX. Some previously were CfxQ (carbon fixation Q). Its gene is often found immmediately downstream of the Rubisco large and small chain genes, and it is suggested to be necessary for Rubisco expression. CbbX has been shown to be necessary for photoautotrophic growth. The Cfx genes in Ralstonia eutropha (Alcaligenes eutrophus) encode a number of Calvin cycle enzymes. The observed sizes of two of the gene products, CfxX and CfxY, are 35kDa and 27kDa respectively. No functions could be assigned to CfxX and CfxY. These proteins show a high degree of similarity to the Bacillus subtilis stage V sporulation protein K.
definition_source: "InterPro:IPR000470 abstract (PRINTS PR00820 is a member signature)"
