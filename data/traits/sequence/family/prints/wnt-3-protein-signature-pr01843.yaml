identifier: PRINTS:PR01843
label: "Wnt-3 protein signature"
definition: >-
  This entry represents the family of proto-oncogene Wnt-3 and related proteins. Wnt-3, also called proto-oncogene Int-4, functions in the canonical Wnt signaling pathway that results in activation of transcription factors of the TCF/LEF family. The Wnt-3 gene was first identified in mouse in 1987, where it was found to be expressed during embryogenesis and in adult brain. It is required for normal embryonic development, and especially for limb development. Wnt-3a functions in the canonical Wnt signaling pathway and plays crucial roles in both proliferation and differentiation processes in several types of stem cells. Wnt3a stimulates the migration and invasion of trophoblasts and induce the survival, proliferation, and migration of human embryonic kidney (HEK) 293 cells. It also up-regulates genes implicated in melanocyte differentiation and increases the expression and nuclear localization of the transcriptional co-activator with PDZ-binding motif (TAZ), a transcriptional modulator involved in activating osteoblastic differentiation. Wnt-3 structure consists of a N-terminal helical domain, a linker region and an elongated disulfide-rich C-terminal domain and very closely resembles the structure of Wnt-8. Wnt proteins constitute a large family of secreted molecules that are involved in intercellular signalling during development. The name derives from the first 2 members of the family to be discovered: int-1 (mouse) and wingless (Drosophila). It is now recognised that Wnt signalling controls many cell fate decisions in a variety of different organisms, including mammals. Wnt signalling has been implicated in tumourigenesis, early mesodermal patterning of the embryo, morphogenesis of the brain and kidneys, regulation of mammary gland proliferation and Alzheimer's disease.
