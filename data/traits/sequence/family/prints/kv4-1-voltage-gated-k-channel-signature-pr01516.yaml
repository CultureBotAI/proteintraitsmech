identifier: PRINTS:PR01516
label: "Kv4.1 voltage-gated K+ channel signature"
definition: >-
  The Kv family can be divided into several subfamilies on the basis of sequence similarity and function. Four of these subfamilies, Kv1 (Shaker), Kv2 (Shab), Kv3 (Shaw) and Kv4 (Shal), consist of pore-forming alpha subunits that associate with different types of beta subunit. Each alpha subunit comprises six hydrophobic TM domains with a P-domain between the fifth and sixth, which partially resides in the membrane. The fourth TM domain has positively charged residues at every third residue and acts as a voltage sensor, which triggers the conformational change that opens the channel pore in response to a displacement in membrane potential. More recently, 4 new electrically-silent alpha subunits have been cloned: Kv5 (KCNF), Kv6 (KCNG), Kv8 and Kv9 (KCNS). These subunits do not themselves possess any functional activity, but appear to form heteromeric channels with Kv2 subunits, and thus modulate Shab channel activity. When highly expressed, they inhibit channel activity, but at lower levels show more specific modulatory actions. The Shal potassium channel was found in Drosophila melanogaster (Fruit fly). Several vertebrate potassium channels with similar amino acid sequences were subsequently found and, together with the D. melanogaster Shal channel, now constitute the Kv4 family. These channels are the primary subunits contributing to transient, voltage-dependent potassium currents in the nervous system (A currents) and the heart (transient outward current), and are inhibited by free fatty acids. This family can be further divided into 3 subfamilies, designated Kv4.1(KCND1), Kv4.2(KCND2) and Kv4.3(KCND3). Kv4.1 channels are expressed in the heart, brain, liver, kidney and pancreas. Association with specific subunits increases their surface expression. Essential to their
