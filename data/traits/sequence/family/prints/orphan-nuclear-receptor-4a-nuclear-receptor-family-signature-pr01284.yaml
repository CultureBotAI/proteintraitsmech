identifier: PRINTS:PR01284
label: "Orphan nuclear receptor (4A nuclear receptor) family signature"
definition: >-
  This family groups members of the steroid receptor superfamily, the nuclear receptor subfamily 4 group A members 1-3 (NR4A1-3) also known as NGFI-B/Nur77, Nurr1 (Nur-related factor 1) and NOR-1 (neuron derived orphan receptor), respectively. The NR4A3/NOR-1 binds to the B1a response-element, which has been identified as the target sequence of the Nur77 family, suggesting that three members of the Nur77 family may transactivate common target gene(s) at different situations. Ewing's sarcoma is characterised by chromosomal translocations that involve the NOR protein. NR4A2/Nurr1 is a transcriptional regulator important for the differentiation and maintenance of meso-diencephalic dopaminergic (mdDA) neurons during development. Steroid or nuclear hormone receptors (NRs) constitute an important superfamily of transcription regulators that are involved in widely diverse physiological functions, including control of embryonic development, cell differentiation and homeostasis. Members of the superfamily include the steroid hormone receptors and receptors for thyroid hormone, retinoids, 1,25-dihydroxy-vitamin D3 and a variety of other ligands. The proteins function as dimeric molecules in nuclei to regulate the transcription of target genes in a ligand-responsive manner. In addition to C-terminal ligand-binding domains, these nuclear receptors contain a highly-conserved, N-terminal zinc-finger that mediates specific binding to target DNA sequences, termed ligand-responsive elements. In the absence of ligand, steroid hormone receptors are thought to be weakly associated with nuclear components; hormone binding greatly increases receptor affinity. NRs are extremely important in medical research, a large number of them being implicated in diseases such as cancer, diabetes, hormone r
