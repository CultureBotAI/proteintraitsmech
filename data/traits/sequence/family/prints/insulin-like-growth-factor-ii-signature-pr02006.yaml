identifier: PRINTS:PR02006
label: "Insulin-like growth factor II signature"
definition: >-
  The IGFs, or somatomedins, play a key role in pre-adolescent mammalian growth. IGF2 appears to be induced by placental lactogen and is thought to play a role in foetal development. The insulin/IGF/relaxin superfamily is an ancient family of functionally diverse proteins. The 3D structures of a number of family members have been determined. The fold comprises two polypeptide chains (A and B) linked by two disulphide bonds: all share a conserved arrangement of four cysteines in their A chain, the first of which is linked by a disulfide bond to the third, while the second and fourth are linked by interchain disulfide bonds to cysteines in the B chain. This family includes: Insulin and insulin-like proteins Relaxin and prorelaxin Insect prothoracicotropic hormone (bombyxin) Insulin-like growth factors (IGF1 and IGF2) Mammalian Leydig cell-specific insulin-like peptide (gene INSL3) Invertebrates insulin-related peptides (IRPs)
definition_source: "InterPro:IPR022334 abstract (PRINTS PR02006 is a member signature)"
