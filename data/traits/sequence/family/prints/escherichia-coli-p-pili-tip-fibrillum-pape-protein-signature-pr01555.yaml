identifier: PRINTS:PR01555
label: "Escherichia coli P pili tip fibrillum papE protein signature"
definition: >-
  Pyelonephritogenic Escherichia coli invades the uroepithelium by expressing between 100 and 300 P pili (fimbriae) on the cell surface, which mediate binding to a digalactoside receptor in the urinary tract. P pili are approximately 68 Angstrom in diameter and 1 micron in length, the bulk of which is a fibre composed of the main structural protein PapA. At its tip, the pilus is terminated by a fibrillum consisting of repeating units of the PapE protein, topped by the adhesins PapF and PapG, both of which are required for receptor binding. The tip fibrillum is anchored to the main PapA fibre by the PapK pilus-adaptor protein, whilst PapH anchors the entire rod in the bacterial envelope. Assembly of the pilus monomers in the membrane is assisted by the cytoplasmic chaperone PapD. PapE can vary its structure and antigenic properties according to the serotype strain, allowing evasion of host immune responses. Both PapA and PapE have been shown to automatically self-assemble into pilus rods and tip fibrillae respectively once released from the PapD chaperone.
definition_source: "InterPro:IPR004086 abstract (PRINTS PR01555 is a member signature)"
