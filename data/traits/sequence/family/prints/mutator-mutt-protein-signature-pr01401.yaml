identifier: PRINTS:PR01401
label: "Mutator MutT protein signature"
definition: >-
  MutT is a small bacterial protein (~12-15kDa) involved in the GO system. MutT is known as a mutator gene because mutations in the gene specifically increase the rate of AT:GC tranversions. MutT is a 7,8-dihydro-8-oxoguanine triphosphatase converting 8-oxoguanine triphosphatase to the monophosphate with high efficiency. It acts both on 8-oxoGTP as well as 8-oxodGTP. It also can convert, less efficiently, the GDP and dGDP forms to the monophosphates. Consequently it reduces the availability of 8-oxoGTP and the rate of mutation. It was suggested that MutT may ensure transcriptional fidelity, removing 8-oxo-GTP from the ribonucleotide triphosphate pool, however, due to the lower efficiency of RNA polymerase 8-oxo-GTP incorporation, MutT is probably not a major contributor to transcriptional fidelity [. A short conserved N-terminal region of mutT (designated the MutT domain) is also found in a variety of other prokaryotic, viral, and eukaryotic proteins. Recently, the generic name `NUDIX hydrolases' (NUcleoside DIphosphate linked to some other moiety X) has been coined for this domain family. The solution structure of the MutT enzyme has been solved by NMR. The structure is globular and compact, and contains a five-stranded mixed β-sheet. The parallel portion of the sheet is sandwiched between two α-helices, forming an α+β fold.
