identifier: PRINTS:PR01128
label: "EMR1 hormone receptor signature"
definition: >-
  Human epidermal growth factor (EGF)-like module containing mucin-like hormone receptor 1 (EMR1) is a surface receptor of unknown function that belongs to the EGF-seven-transmembrane (EGF-TM7) family of G-protein coupled receptors. Human EMR1 has been reported to be expressed exclusively on eosinophils. It is the the human homologue of F4/80, a monoclonal antibody that recognises a Mus musculus (Mouse) macrophage-restricted cell surface glycoprotein that has been extensively used to characterise macrophage populations in a wide range of immunological studies. Little is known about its possible role in macrophage differentiation and function. The sequence of the F4/80 protein is similar to two protein superfamilies: the N-terminal region contains seven epidermal growth factor (EGF)-like domains, while the C-terminal region contains seven hydrophobic regions whose signature is consistent with membership of the secretin-like superfamily of GPCRs. The EGF and GPCR domains are separated from each other by a serine/threonine-rich domain, a feature reminiscent of mucin-like, single-span, integral membrane glycoproteins with adhesive properties. This family also comprises EMR3, a marker for mature granulocytes, and EMR4. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. The term clan can be used to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include r
