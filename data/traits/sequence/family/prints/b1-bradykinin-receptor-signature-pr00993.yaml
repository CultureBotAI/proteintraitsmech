identifier: PRINTS:PR00993
label: "B1 bradykinin receptor signature"
definition: >-
  Bradykinins are a family of short, structurally similar peptides that activate sensory fibres, contract venous smooth muscle, stimulate release of cytokines, induce connective tissue proliferation and mediate endothelium-dependent vasodilation. Bradykinin antagonists are used in the treatment of inflammation, asthma, mild pain and endotoxic shock. Bradykinin receptors are members of the seven transmembrane, rhodopsin-like G-protein coupled receptor family and are widespread in peripheral tissues. There are two bradykinins receptor subtypes: B1 and B2. It has also been proposed there could be further subtypes of the bradykinin receptor, including a tracheal B3 receptor but these, as yet have not been confirmed. This entry represents bradykinin receptor B1, which has limited distribution in the periphery, and has not been described in the CNS, unlike the bradykinin receptor B2, which is the predominant subtype. Both B1 and B2 receptors are involved in the induction and maintenance of cytokine-induced hyperalgesia. However B1 receptors appear to play a more important role in the development of mechanical hyperalgesia. The B1 receptor is synthesized de novo following tissue injury and receptor binding leads to an increase in the cytosolic calcium ion concentration, ultimately resulting in chronic and acute inflammatory responses. In the majority of tissues, bradykinin induces activation of phosphoinositide metabolism via a pertussis-toxin-insensitive G-protein of the Gq/G11 class. It has also been reported to inhibit adenylyl cyclase and raises levels of cyclic guanosine monophosphate (cGMP) and open ion channels. B1 receptor also stimulates phospholipase A2 (PLA2).
