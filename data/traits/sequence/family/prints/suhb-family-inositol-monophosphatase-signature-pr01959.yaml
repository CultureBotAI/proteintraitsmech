identifier: PRINTS:PR01959
label: "SuhB family inositol monophosphatase signature"
definition: >-
  This entry represents a group of inositol monophosphatases (IMPases) mainly from bacteria. E. coli SuhB is part of the rRNA transcription anti-termination complex (rrnTAC) that prevents rho-dependent termination. The rrnTAC consists of Nus factors A, B, E and G, ribosomal protein S4 and inositol mono-phosphatase SuhB. SuhB directly binds a C-terminal acidic repeat domain of NusA and contacts at least one other region in NusA as well as the nut-like RNA signal element. It thereby facilitates entry of the NusB/E dimer into an rrnTAC. E. coli SuhB has D,L-inositol-1-monophosphatase and beta-glycerophosphatase activity. However, E.coli makes very low amounts of myo-inositol-containing phospholipids, so the catalytic necessity for this enzyme is low. Inositol polyphosphate 1-phosphatase (1PTASE) and inositol monophosphatase (MPTASE) are enzymes of the inositol signalling pathway that share similar enzymatic activity. Both enzymes exhibit an absolute requirement for metal ions (Mg2+ is preferred), and both are uncompetitively inhibited by submillimolar concentrations of Li+. Their amino acid sequences contain a number of conserved motifs, which are also shared by several other proteins related to MPTASE (including products of fungal QaX and qutG, bacterial suhB and cysQ, and yeast hal2). Structural analysis of these proteins has revealed a common core of 155 residues: the core comprises 5 α-helices and 11 β-strands, and includes residues essential for metal binding and catalysis. While the core has been conserved, presumably to impart catalytic function, the loops and regions of structure outside the core have evolved unique regulatory domains. An interesting property of the enzymes of this family is their sensitivity to Li+ at levels achieved in patients undergoing therapy f
