identifier: PRINTS:PR01398
label: "Isochorismatase signature"
definition: >-
  This entry includes a group of isochorismatase, including EntB from E. coli, PhzD from Pseudomonas fluorescens and VibB from Vibrio cholerae serotype O1. EntB is involved in the second stage of enterobactin biosynthesis. It has a molecular weight of 35kDa, and is believed to possess bifunctional activity. Deletion studies involving EntB- mutants have shown that it is essential for virulence. PhzD is involved in the biosynthesis of the antibiotic phenazine, a nitrogen-containing heterocyclic molecule having important roles in virulence, competition and biological control.
definition_source: "InterPro:IPR016291 abstract (PRINTS PR01398 is a member signature)"
