identifier: PRINTS:PR01007
label: "Flagellar hook-length control protein signature"
definition: >-
  FliK controls the length of the flagellar hook. It detects when the flagellar hook substructure has reached its optimal length. Then, it terminates hook export and assembly and transmits a signal to begin filament export, the final stage in flagellar biosynthesis. The exact mechanism of how FliK achieves this is not known. FliK is a two-domain protein with the central portion of the sequence acting as a hinge or connector between the two.
definition_source: "InterPro:IPR001635 abstract (PRINTS PR01007 is a member signature)"
