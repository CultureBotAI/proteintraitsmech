identifier: PRINTS:PR00807
label: "Pollen allergen Amb family signature"
definition: >-
  Pectate lyase is an enzyme involved in the maceration and soft rotting of plant tissue. Pectate lyase is responsible for the eliminative cleavage of pectate, yielding oligosaccharides with 4-deoxy-alpha-D-mann-4-enuronosyl groups at their non-reducing ends. The protein is maximally expressed late in pollen development. It has been suggested that the pollen expression of pectate lyase genes might relate to a requirement for pectin degradation during pollen tube growth. Some of the proteins in this family are allergens. Allergies are hypersensitivity reactions of the immune system to specific substances called allergens (such as pollen, stings, drugs, or food) that, in most people, result in no symptoms. A nomenclature system has been established for antigens (allergens) that cause IgE-mediated atopic allergies in humans [WHO/IUIS Allergen Nomenclature Subcommittee King T.P., Hoffmann D., Loewenstein H., Marsh D.G., Platts-Mills T.A.E., Thomas W. Bull. World Health Organ. 72:797-806(1994)]. This nomenclature system is defined by a designation that is composed of the first three letters of the genus; a space; the first letter of the species name; a space and an arabic number. In the event that two species names have identical designations, they are discriminated from one another by adding one or more letters (as necessary) to each species designation. The allergens in this family include allergens with the following designations: Amb a 1, Amb a 2, Amb a 3, Cha o 1, Cup a 1, Cry j 1, Jun a 1. Two of the major allergens in the pollen of short ragweed (Ambrosia artemisiifolia) are Amb aI and Amb aII. The primary structure of Amb aII has been deduced and has been shown to share ~65% sequence identity with the Amb alpha I multigene family of allergens. Members of the Amb aI/aII
