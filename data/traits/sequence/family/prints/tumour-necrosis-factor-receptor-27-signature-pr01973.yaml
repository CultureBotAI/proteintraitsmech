identifier: PRINTS:PR01973
label: "Tumour necrosis factor receptor 27 signature"
definition: >-
  TNF receptor 27 (also known as ectodysplasin A2 receptor (EDA2R) and ectodysplasin receptor, x-linked (XEDAR)) is highly expressed during embryogenesis, and has been implicated in the development of ectodermal appendages, such as hair follicles, teeth and sweat glands. Although it lacks a death domain, the receptor can nevertheless induce cell death via activation of caspase 8, and may play a role in the induction of apoptosis during embryonic development and adult life. The tumour necrosis factor (TNF) receptor (TNFR) superfamily comprises more than 20 type-I transmembrane proteins. Family members are defined based on similarity in their extracellular domain - a region that contains many cysteine residues arranged in a specific repetitive pattern. The cysteines allow formation of an extended rod-like structure, responsible for ligand binding. Upon receptor activation, different intracellular signalling complexes are assembled for different members of the TNFR superfamily, depending on their intracellular domains and sequences. Activation of TNFRs can therefore induce a range of disparate effects, including cell proliferation, differentiation, survival, or apoptotic cell death, depending upon the receptor involved.
definition_source: "InterPro:IPR022319 abstract (PRINTS PR01973 is a member signature)"
