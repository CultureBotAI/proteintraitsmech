identifier: PRINTS:PR02103
label: "Inheritance of peroxisomes protein 1 signature"
definition: >-
  Inp1 is a peroxisomal membrane protein that binds Pex25p, Pex30p, and Vps1p, all of which are involved in controlling peroxisome division. The levels of Inp1p vary with the cell cycle, and Inp1 acts as a factor that retains peroxisomes in cells and controls peroxisome division. Inp1p promotes the retention of peroxisomes in mother cells and buds of budding yeast by attaching peroxisomes to as-yet-unidentified cortical structures.
