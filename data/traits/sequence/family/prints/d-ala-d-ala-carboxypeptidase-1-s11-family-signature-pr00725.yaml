identifier: PRINTS:PR00725
label: "D-Ala-D-Ala carboxypeptidase 1 (S11) family signature"
definition: >-
  This group of serine peptidases belong to MEROPS peptidase family S11 (D-Ala-D-Ala carboxypeptidase A family, clan SE). The protein fold of the peptidase domain for members of this family resembles that of D-Ala-D-Ala-carboxypeptidase B, the type example for clan SE. Proteolytic enzymes that exploit serine in their catalytic activity are ubiquitous, being found in viruses, bacteria and eukaryotes. They include a wide range of peptidase activity, including exopeptidase, endo-peptidase, oligopeptidase and omega-peptidase activity. Over 20 families (denoted S1 - S27) of serine protease have been identified, these being grouped into 6 clans (SA, SB, SC, SE, SF and SG) on the basis of structural similarity and other functional evidence. Structures are known for four of the clans (SA, SB, SC and SE): these appear to be totally unrelated, suggesting at least four evolutionary origins of serine peptidases and possibly many more. Not with standing their different evolutionary origins, there are similarities in the reaction mechanisms of several peptidases. Chymotrypsin, subtilisin and carboxypeptidase C clans have a catalytic triad of serine, aspartate and histidine in common: serine acts as a nucleophile, aspartate as an electrophile, and histidine as a base. The geometric orientations of the catalytic residues are similar between families, despite different protein folds. The linear arrangements of the catalytic residues commonly reflect clan relationships. For example the catalytic triad in the chymotrypsin clan (SA) is ordered HDS, but is ordered DHS in the subtilisin clan (SB) and SDH in the carboxypeptidase clan (SC). Bacterial cell walls are complex structures containing amino acids and amino sugars, with alternating chains of N-acetylglucosamine and N-acetyl-muramic acid
