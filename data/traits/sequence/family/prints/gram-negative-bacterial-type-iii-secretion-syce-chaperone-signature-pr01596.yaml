identifier: PRINTS:PR01596
label: "Gram-negative bacterial type III secretion SycE chaperone signature"
definition: >-
  The type III secretion system of Gram-negative bacteria is used to transport virulence factors from the pathogen directly into the host cell and is only triggered when the bacterium comes into close contact with the host. Effector proteins secreted by the type III system do not possess a secretion signal, and are considered unique because of this. Yersinia spp. secrete an effector protein called YopE through the type III needle. This acts as a Rho GTPase-activating protein that disrupts the host cell actin cytoskeleton, and is regulated by a chaperone protein called SycE/YerA. In the absence of the SycE chaperone, YopE is not transported through the needle and remains in the bacterial cytoplasm, so suggesting a crucial role for this moiety.
definition_source: "InterPro:IPR005416 abstract (PRINTS PR01596 is a member signature)"
