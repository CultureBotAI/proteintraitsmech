identifier: PRINTS:PR01453
label: "Epithelial membrane protein (EMP/PMP22/LMIP) family signature"
definition: >-
  Several vertebrate small integral membrane glycoproteins are evolutionary related, including eye lens specific membrane protein 20 (MP20 or MP19); epithelial membrane protein-1 (EMP-1), which is also known as tumor-associated membrane protein (TMP) or as squamous cell-specific protein Cl-20; epithelial membrane protein-2 (EMP-2), which is also known as XMP; epithelial membrane protein-3 (EMP-3), also known as YMP; and peripheral myelin protein 22 (PMP-22), which is expressed in many tissues but mainly by Schwann cells as a component of myelin of the peripheral nervous system (PNS). PMP-22 probably plays a role both in myelinization and in cell proliferation. Mutations affecting PMP-22 are associated with hereditary motor and sensory neuropathies such as Charcot-Marie-Tooth disease type 1A (CMT-1A) in human or the trembler phenotype in mice. The proteins of this family are about 160 to 173 amino acid residues in size, and contain four transmembrane segments. PMP-22, EMP-1, -2 and -3 are highly similar, while MP20 is more distantly related.
