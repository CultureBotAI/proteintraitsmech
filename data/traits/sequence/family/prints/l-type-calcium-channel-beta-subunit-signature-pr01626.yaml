identifier: PRINTS:PR01626
label: "L-type calcium channel beta subunit signature"
definition: >-
  This entry represents the beta subunits found in L-type voltage-gated calcium channels. Co-expression of beta subunit mRNA with alpha-1 subunit mRNA in xenopus oocytes produces increased calcium currents, which are accompanied by a shift in the voltage-dependence of activation to more negative membrane potentials. Conversely, microinjection of antisense oligonucleotides to beta subunit mRNA produces decreased calcium currents and shifts voltage-dependent activation to more positive membrane potentials. There are four distinct beta subunits: beta-1, beta-2, beta-3 and beta-4; and the magnitude of the shift in the voltage-dependence of activation of change to membrane potentials varies with the particular subtype. Ca2+ ions are unique in that they not only carry charge but they are also the most widely used of diffusible second messengers. Voltage-dependent Ca2+ channels (VDCC) are a family of molecules that allow cells to couple electrical activity to intracellular Ca2+ signalling. The opening and closing of these channels by depolarizing stimuli, such as action potentials, allows Ca2+ ions to enter neurons down a steep electrochemical gradient, producing transient intracellular Ca2+ signals. Many of the processes that occur in neurons, including transmitter release, gene transcription and metabolism are controlled by Ca2+ influx occurring simultaneously at different cellular locales. The pore is formed by the alpha-1 subunit which incorporates the conduction pore, the voltage sensor and gating apparatus, and the known sites of channel regulation by second messengers, drugs, and toxins. The activity of this pore is modulated by four tightly-coupled subunits: an intracellular beta subunit; a transmembrane gamma subunit; and a disulphide-linked complex of alpha-2 and delta
