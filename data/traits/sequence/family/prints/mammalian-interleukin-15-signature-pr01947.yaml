identifier: PRINTS:PR01947
label: "Mammalian interleukin-15 signature"
definition: >-
  Interleukins (IL) are a group of cytokines that play an important role in the immune system. They modulate inflammation and immunity by regulating growth, mobility and differentiation of lymphoid and other cells. Interleukin-15 (IL-15) has a variety of biological functions, including stimulation and maintenance of cellular immune responses. It is required for division of CD8+ T cells of memory phenotype - a process that is increased by inhibition of IL-2. The numbers of CD8+ memory T cells in animals may, therefore, be controlled by a balance between IL-15 and -2. This entry represents interleukin-15 found in mammals.
definition_source: "InterPro:IPR020466 abstract (PRINTS PR01947 is a member signature)"
