identifier: PRINTS:PR02003
label: "Bombyxin signature"
definition: >-
  Bombyxin is a brain peptide responsible for activation of prothoracic glands to produce ecdysone in insects. When cleaved, bombyxins produce both subunits of the biologically active heterodimer. Several molecular species of bombyxin have now been identified in Bombyx, Agrius and Samia moth species. Both bombyxin and insulin contain six cysteine residues with identical distributions and are predicted to have similar tertiary structures, especially in their core regions. They are not functionally equivalent. However, the similarity to insulin has prompted speculation that it may play a role in the regulation of growth, and it has been shown to act as a growth factor for wing imaginal discs and midgut stem cells in some lepidopteran species. The insulin/IGF/relaxin superfamily is an ancient family of functionally diverse proteins. The 3D structures of a number of family members have been determined. The fold comprises two polypeptide chains (A and B) linked by two disulphide bonds: all share a conserved arrangement of four cysteines in their A chain, the first of which is linked by a disulfide bond to the third, while the second and fourth are linked by interchain disulfide bonds to cysteines in the B chain. This family includes: Insulin and insulin-like proteins Relaxin and prorelaxin Insect prothoracicotropic hormone (bombyxin) Insulin-like growth factors (IGF1 and IGF2) Mammalian Leydig cell-specific insulin-like peptide (gene INSL3) Invertebrates insulin-related peptides (IRPs)
