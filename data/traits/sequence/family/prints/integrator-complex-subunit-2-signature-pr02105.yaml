identifier: PRINTS:PR02105
label: "Integrator complex subunit 2 signature"
definition: >-
  The C-terminal domain (CTD) of RNA polymerase II (RNAPII) is an essential component of transcriptional regulation and RNA processing of protein-coding genes. CTD is implicated in the transcription and processing of RNAPII-mediated small nuclear RNAs (snRNAs), but the identity of the complex (or complexes) that associates with the CTD and mediates the processing of snRNAs has been elusive. An RNA polymerase II complex termed the Integrator, which contains at least 12 novel subunits and core RNAPII subunits has been identified. Two of the Integrator subunits share similarity with subunits of the cleavage and polyadenylation specificity factor (CPSF) complex. Integrator has been shown to be recruited to the U1 and U2 snRNA genes, and to mediate the snRNAs' 3' end processing. The Integrator complex is evolutionarily conserved in metazoans, and directly interacts with the C-terminal domain of the RNA polymerase II largest subunit.
definition_source: "InterPro:IPR026236 abstract (PRINTS PR02105 is a member signature)"
