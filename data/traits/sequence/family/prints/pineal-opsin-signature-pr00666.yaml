identifier: PRINTS:PR00666
label: "Pineal opsin signature"
definition: >-
  Recently, a non-visual opsin (designated P-opsin or pinopsin) has been isolated from Gallus gallus (Chicken) pineal gland. Environmental light signals reset the phase of the endogenous circadian pacemaker that controls the rhythmic production of melatonin via this protein. Sharing ~45% identity with retinal opsins, pinopsin is thought to have diverged early in opsin evolution. The protein is maximally sensitive to light of wavelength ~500nm and produces a slow, prolonged photo-transduction response consistent with the non-visual function of pineal photo-reception.
definition_source: "InterPro:IPR002206 abstract (PRINTS PR00666 is a member signature)"
