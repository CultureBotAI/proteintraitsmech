identifier: PRINTS:PR01756
label: "Yersinia outer membrane adhesin signature"
definition: >-
  The genus Yersinia contains just three species: Yersinia enterocolitica, Yersinia pestis, and Yersinia pseudotuberculosis. Although the three use different routes to infect their host, each targets the lymphoid tissue for invasion, and all have developed specific systems to evade host immune cells. PYV, a major virulence plasmid common to all members of this family, harbours the genes necessary for type III secretion in the host and the exotoxins translocated by them.
