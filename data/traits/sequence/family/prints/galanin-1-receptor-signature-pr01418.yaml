identifier: PRINTS:PR01418
label: "Galanin 1 receptor signature"
definition: >-
  Galanin is involved in a variety of physiological mechanisms and disease states, from appetite and neuroregeneration to seizures and pain. The actions of galanin are mediated through interaction with specific membrane receptors. Three receptor subtypes have been identified; Galanin receptor 1 (GALR1), Galanin receptor 2 (GALR2) and Galanin receptor 3 (GAL3), all of which are rhodopsin-like GPCRs. They differ from one another in terms of their expression patterns, affinity for various peptide analogues and G protein-coupling specificity. In signaling, all can act via the Gi/o class, whilst GAL2 also has Gq/11 as a major signaling route. This entry represents the galanin receptor 1 subtype, which is expressed at significant levels in regions of the brain and spinal cord including the hypothalamus, amygdala, hippocampus, thalamus and brainstem. It has also been detected throughout the length of the human gastro-intestinal tract. Galanin receptor 1 reduces the concentration of cAMP, opens G protein-coupled, inwardly rectifying K+ channels, and stimulates MAP kinase activity in a manner that is sensitive to pertussis toxin.
definition_source: "InterPro:IPR003906 abstract (PRINTS PR01418 is a member signature)"
