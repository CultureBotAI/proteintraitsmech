identifier: PRINTS:PR01236
label: "Tumour necrosis factor beta (lymphotoxin-alpha) signature"
definition: >-
  Cytokines can be grouped into a family on the basis of sequence, functional and structural similarities. Tumor necrosis factor (TNF) (also known as TNF-alpha or cachectin) is a monocyte-derived cytotoxin that has been implicated in tumour regression, septic shock and cachexia. The protein is synthesised as a prohormone with an unusually long and atypical signal sequence, which is absent from the mature secreted cytokine. A short hydrophobic stretch of amino acids serves to anchor the prohormone in lipid bilayers. Both the mature protein and a partially-processed form of the hormone are secreted after cleavage of the propeptide. There are a number of different families of TNF, but all these cytokines seem to form homotrimeric (or heterotrimeric in the case of LT-alpha/beta) complexes that are recognised by their specific receptors. Lymphotoxin-alpha (LT-alpha or TNF-beta) and lymphotoxin-beta (LT-beta) are related cytokines produced by lymphocytes. The proteins are cytotoxic for a wide range of tumour cells in vitro and in vivo. The structure of TNF-beta has been determined to 1.9 A using X-ray crystallography and phase determination via molecular replacement using TNF-alpha. Like TNF-alpha, lymphotoxin folds to form a 'jellyroll' β-sheet sandwich. Three-fold related LT subunits form a trimer primarily stabilised by hydrophobic interactions. A cluster of 6 basic residues around the 3-fold axis is thought to account for the acid lability of the trimer. Although the structural cores of TNF-alpha and LT are similar, insertions and deletions relative to TNF-alpha occur in loops at the 'top' of the LT trimer, significantly altering the local structure. The sites of two mutations (Asp-50 and Tyr-108) that abolish the cytotoxicity of LT are contained within poorly-ordered loops
