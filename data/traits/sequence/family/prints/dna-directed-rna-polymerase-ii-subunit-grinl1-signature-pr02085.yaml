identifier: PRINTS:PR02085
label: "DNA-directed RNA polymerase II subunit GRINL1 signature"
definition: >-
  GRINL1, also known as Gdown1, is a component of the Pol II (G) complex form of RNA polymerase II (Pol II). Pol II synthesizes mRNA precursors and many functional non-coding RNAs and is the central component of the basal RNA polymerase II transcription machinery. Gdown1 associates with Pol II, in competition with TFIIF, during the early stage of transcript elongation, where it facilitates the pausing for promoter-dependent pol II complexes. Pausing during the earliest stage of transcript elongation by Pil II is an universal control point in metazoan gene expression. Gdown1 is a negative regulator of transcriptional activation; this repression is relieved by the Mediator complex, which restores Pol II(G) activator-dependent transcription to a level equivalent to that of Pol II.
definition_source: "InterPro:IPR026213 abstract (PRINTS PR02085 is a member signature)"
