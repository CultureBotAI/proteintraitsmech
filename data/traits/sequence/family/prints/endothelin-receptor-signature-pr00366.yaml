identifier: PRINTS:PR00366
label: "Endothelin receptor signature"
definition: >-
  Endothelins are able to activate a number of signal transduction processes including phospholipase A2, phospholipase C and phospholipase D, as well as cytosolic protein kinase activation. The play an important role in the regulation of the cardiovascular system and are the most potent vasoconstrictors identified, stimulating cardiac contraction, regulating the release of vasoactive substances, and stimulating mitogenesis in blood vessels. As a result, endothelins are implicated in a number of vascular diseases, including the heart, general circulation and brain. Endothelins stimulate the contraction in almost all other smooth muscles (e.g., uterus, bronchus, vas deferens, stomach) and stimulate secretion in several tissues e.g., kidney, liver and adrenals. Endothelins have also been implicated in a variety of pathophysiological conditions associated with stress including hypertension, myocardial infarction, subarachnoid haemorrhage and renal failure. Two endothelin receptor subtypes have been isolated and identified, endothelin A receptor(ETA) and endothelin B receptor (ETB), and are members of the seven transmembrane rhodopsin-like G-protein coupled receptor family (GPCRA) which stimulate multiple effectors via several types of G protein. ETA and ETB receptors are both widely distributed, ETA receptors are mainly located on vascular smooth muscle cells, whereas ETB receptors are present on endothelial cells lining the vessel wall. Endothelin receptors have also been found in the brain, e.g. cerebral cortex, cerebellum and glial cells. ETA receptors are considered to be the primary vasoconstrictor and growth-promoting receptor, and the binding of endothelin to ETA increases vasoconstriction (contraction of the blood vessel walls) and the retention of sodium, leading to
