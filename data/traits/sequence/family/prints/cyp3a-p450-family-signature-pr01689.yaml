identifier: PRINTS:PR01689
label: "CYP3A P450 family signature"
definition: >-
  CYP3A family of enzymes is predominantly (but not exclusively) expressed in the liver and intestine, being the most abundant CYPP450 subfamily in the liver. This family is of major importance in mammals (especially human) for detoxification of xenobiotics (drug-metabolizing enzymes). They are embedded in the endoplasmic reticulum, where they can catalyse a wide variety of biochemical reactions including hydroxylation, N-demethylation, O-dealkylation, S-oxidation, deamination, or epoxidation of substrates. They oxidize a variety of structurally unrelated compounds including steroids, fatty acids, and xenobiotics (including over 50% of therapeutic drugs). In human there are several isoforms, for instance, CYP3A4, 3A5, 3A7, and 3A3. Both genetic and environmental factors such as diet (especially grapefruit and St John's wort) can affect CYP3A activity, which can alter the efficacy and clearance of drugs. In addition, CYP3A may play a role in breast and prostate carcinogenesis through its role in controlling the level of se hormones drugs. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and fatty acids. In bacteria, they are important for several metabolic processes, such as the biosynthesis of anti
