identifier: PRINTS:PR00889
label: "Calponin signature"
definition: >-
  Calponin is a smooth muscle-specific, actin-, tropomyosin- and calmodulin-binding protein believed to be involved in regulation or modulation of contraction. Interaction of the protein with actin inhibits actomyosin MgATPase activity. Multiple isoforms are found in smooth muscle. Calponin is a basic protein of ~34kDa. The protein contains three repeats of a well-conserved 26-residue domain (see InterPro:IPR000557). This entry also includes LIM and calponin homology domains-containing protein 1 (LIMCH1), which contains a LIM zinc-binding domain and a CH (calponin-homology) domain.
definition_source: "InterPro:IPR001997 abstract (PRINTS PR00889 is a member signature)"
