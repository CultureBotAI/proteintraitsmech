identifier: PRINTS:PR01692
label: "Lipocalin-1 interacting membrane receptor signature"
definition: >-
  Beyond its interaction with Lipocalin-1 (Lcn-1), the precise physiological function of lipocalin-1 interacting membrane receptor (LIMR) is unknown. LIMR can mediate the internalization of Lcn-1 in cultured cells, suggesting a role in cell signaling. It could be involved in the detoxification of the ligands bound to Lcn-1, either transferring the ligand into the cell, or acting as a detoxification protein itself. A member of this family in Drosophila, protein Lilipod, has been shown to have an important role in modulating bone morphogenetic protein (BMP) signaling.
definition_source: "InterPro:IPR008075 abstract (PRINTS PR01692 is a member signature)"
