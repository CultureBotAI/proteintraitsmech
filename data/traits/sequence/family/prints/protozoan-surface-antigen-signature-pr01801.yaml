identifier: PRINTS:PR01801
label: "Protozoan surface antigen signature"
definition: >-
  Apicomplexan protozoan parasites like Toxoplasma gondii utilise a variety of secretory and antigenic proteins to invade a host and gain access to the intracellular environment. Most of these proteins belong to the SAG1 family, a group of molecules sharing sequence and structural similarity with the immunodominant surface antigen of T. gondii SAG1 (or P30).
