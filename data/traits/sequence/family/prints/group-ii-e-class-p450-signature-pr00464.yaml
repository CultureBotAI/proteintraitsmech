identifier: PRINTS:PR00464
label: "Group II E-class P450 signature"
definition: >-
  This entry represents class E cytochrome P450 proteins that fall into sequence cluster group II. Group II enzymes are distributed widely in life, i.e., in bacteria (family CYP102), cyanobacteria (CYP110), fungi (CYP52, CYP53 and CYP56), insects (CYP4 and CYP6) and mammals (CYP3, CYP4 and CYP5). Many group II enzymes catalyse hydroxylation of linear chains, such as alkanes (CYP52), alcohols and fatty acids (CYP4, CYP5, CYP102); Aspergillus niger CYP53 carries out para-hydroxylation of benzoate; yeast CYP56 is possibly involved in oxidation of tyrosine residues; insect CYP6 metabolises a wide range of toxic compounds; and members of the CYP3 family are omnivorous. Cytochrome P450 enzymes are a superfamily of haem-containing mono-oxygenases that are found in all kingdoms of life, and which show extraordinary diversity in their reaction chemistry. In mammals, these proteins are found primarily in microsomes of hepatocytes and other cell types, where they oxidise steroids, fatty acids and xenobiotics, and are important for the detoxification and clearance of various compounds, as well as for hormone synthesis and breakdown, cholesterol synthesis and vitamin D metabolism. In plants, these proteins are important for the biosynthesis of several compounds such as hormones, defensive compounds and fatty acids. In bacteria, they are important for several metabolic processes, such as the biosynthesis of antibiotic erythromycin in Saccharopolyspora erythraea (Streptomyces erythraeus). Cytochrome P450 enzymes use haem to oxidise their substrates, using protons derived from NADH or NADPH to split the oxygen so a single atom can be added to a substrate. They also require electrons, which they receive from a variety of redox partners. In certain cases, cytochrome P450 can be fused to it
