identifier: PRINTS:PR01319
label: "Glial cell line-derived neurotrophic factor receptor alpha 3 signature"
definition: >-
  Glial cell line-derived neurotrophic factor (GDNF) and its related factors neurturin (NTN), artemin (ART) and persephin (PSP), are members of the GDNF family of neurotrophic factors. They form a sub-group in the transforming growth factor-beta (TGF-beta) superfamily. These factors are involved in the promotion of neurone survival, exerting their effects through specific receptors. The GDNF family receptors (GFRs) are glycosyl-phosphatidylinositol-linked, cell surface receptors. Four receptor subtypes, termed GFRalpha-1 to 4, are currently recognised. GFRalpha-3 has been cloned from mammalian tissue. It represents the least conserved member of the GFR family in terms of amino acid sequence, and is activated by artemin. Activation of GFR family members triggers their interaction with the membrane-bound receptor kinase Ret. This induces Ret homo-dimerisation, triggering a cascade of intracellular signalling events such as the activation of the Ras-mitogen-activated protein kinase (MAPK), phosphoinositol-3-kinase (PI3K), Jun N-terminal kinase (JNK) and phospholipase C gamma (PLC gamma) dependent pathways.
