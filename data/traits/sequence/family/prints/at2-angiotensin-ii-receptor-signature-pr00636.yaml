identifier: PRINTS:PR00636
label: "AT2 angiotensin II receptor signature"
definition: >-
  Angiotensin II is a blood-borne hormone produced in the circulation, it is also formed in many tissues such as the brain, kidney, heart, and blood vessels, where angiotensin II functions as a paracrine and autocrine hormone. The known actions of angiotensin II are mediated through two angiotensin receptor subtypes, Angiotensin II receptor 1 and angiotensin II receptor 2, which are members of the seven transmembrane rhodopsin-like G-protein coupled receptor family. These subtypes are important in the renin-angiotensin system, as they are responsible for the signal transduction of the vasoconstricting stimulus of the main effector hormone, angiotensin II. They also stimulate increased fluid intake and regulate the neuroendocrine system. This entry represents angiotensin II receptor type 2 (AT2), which plays an important role in the CNS and cardiovascular functions mediated by the renin-angiotensin system. The AT2 receptor is highly expressed in various foetal tissues, with lower levels in the brain and reproductive tissues. It appears to be up-regulated after vascular injury, myocardial infarction, cardiac failure or wound healing. Depending on the tissue type, activation of the AT2 receptor also appears to stimulate intracellular mechanisms involving Tyr and Ser/Thr phosphatases, which leads to the inactivation of the AT1 and growth factor activated kinases. However, when inducing cell differentiation, the AT2 receptor can also stimulate MAP kinases Erk1/Erk2. As a consequence, there is an inactivation of MAP kinase, promotion of apoptosis, repolarization trough opening of delayed-rectifier K+ channels and calcium and voltage activated potassium channel, closing of T -type Ca2+ channels and vasodilation. Through its phosphatase activity, the AT2 receptor regulates the NF
