identifier: PRINTS:PR00585
label: "Prostanoid EP3 receptor type 3 signature"
definition: >-
  EP3 receptors mediate contraction in a wide range of smooth muscles, including gastrointestinal and uterine. They also inhibit neurotransmitter release in central and autonomic nerves through a presynaptic action, and inhibit secretion in glandular tissues (e.g., acid secretion from gastric mucosa, and sodium and water reabsorption in the kidney). mRNA is found in high levels in the kidney and uterus, and in lower levels in the brain, thymus, lung, heart, stomach and spleen. The receptors activate adenylate cyclase via an uncharacterised G-protein, probably of the Gi/Go class. Sequence analysis shows the EP3 receptors to fall into distinct classes, based on their N- and C-terminal and loop signatures. For convenience, we have designated these classes types 1 to 3. Prostanoids (prostaglandins (PG) and thromboxanes (TX)) mediate a wide variety of actions and play important physiological roles in the cardiovascular and immune systems, and in pain sensation in peripheral systems. PGI2 and TXA2 have opposing actions, involving regulation of the interaction of platelets with the vascular endothelium, while PGE2, PGI2 and PGD2 are powerful vasodilators and potentiate the action of various autocoids to induce plasma extravasation and pain sensation. To date, evidence for at least 5 classes of prostanoid receptor has been obtained. However, identification of subtypes and their distribution is hampered by expression of more than one receptor within a tissue, coupled with poor selectivity of available agonists and antagonists. The rhodopsin-like GPCRs (GPCRA) represent a widespread protein family that includes hormone, neurotransmitter and light receptors, all of which transduce extracellular signals through interaction with guanine nucleotide-binding (G) proteins. Although their
