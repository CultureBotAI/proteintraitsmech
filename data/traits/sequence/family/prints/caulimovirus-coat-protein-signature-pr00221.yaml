identifier: PRINTS:PR00221
label: "Caulimovirus coat protein signature"
definition: >-
  Caulimoviruses are encapsidated plant viruses that contain circular double-stranded DNA. Members of the group include Cauliflower mosaic virus, Carnation etched ring virus (CERV), Figwort mosaic virus and Soybean chlorotic mottle virus. The viral coat proteins are quite similar, containing a fairly hydrophilic N-terminal region and a highly-basic C-terminal domain, which may be involved in DNA-binding. The sequences contain the motif CxxCxxxHxxxC, which is similarly found in the nucleic acid binding protein of retroviruses.
definition_source: "InterPro:IPR001988 abstract (PRINTS PR00221 is a member signature)"
