identifier: PRINTS:PR01773
label: "P38 MAP kinase signature"
definition: >-
  This entry represents MAP kinases including HOG1, MAP 14/13/12 and similar MAP kinases. Hog1 is the key element in the high osmolarity glycerol (HOG) pathway and is activated upon hyperosmotic stress. Activated Hog1 accumulates in the nucleus and regulates stress-induced transcription. The HOG pathway is mediated by two transmembrane osmosensors, Sln1 and Sho1. Mitogen-activated protein (MAP) kinases are integral components of kinase cascades, in which at least three protein kinases act sequentially to ultimately activate the MAP kinase itself. Activation occurs via dual phosphorylation on conserved threonine and tyrosine residues within a TXY motif. The MAP kinase family is involved in numerous cellular processes, including proliferation, differentiation, migration, transformation, and programmed cell death. These kinases are typically activated by a variety of extracellular stimuli, such as pro-inflammatory cytokines and physical stress. Once activated, MAP kinases phosphorylate a wide array of substrates, including transcription factors, cytoskeletal components, and regulators of apoptosis, translation, and other signalling pathways. They play a central role in signal transduction mechanisms, notably the MAPK/ERK cascade, influencing key cellular functions such as growth, adhesion, survival, and differentiation. In addition to their roles in transcriptional regulation, MAP kinases also participate in the modulation of endosomal dynamics, including lysosome processing, endosome cycling, and Golgi apparatus fragmentation during mitosis.
definition_source: "InterPro:IPR008352 abstract (PRINTS PR01773 is a member signature)"
