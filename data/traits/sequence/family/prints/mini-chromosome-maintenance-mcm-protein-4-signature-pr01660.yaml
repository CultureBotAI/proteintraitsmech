identifier: PRINTS:PR01660
label: "Mini-chromosome maintenance (MCM) protein 4 signature"
definition: >-
  The MCM2-7 complex consists of six closely related proteins that are highly conserved throughout the eukaryotic kingdom. In eukaryotes, Mcm3 is a component of the MCM2-7 complex (MCM complex), which consists of six sequence-related AAA + type ATPases/helicases that form a hetero-hexameric ring. MCM2-7 complex is part of the pre-replication complex (pre-RC). In G1 phase, inactive MCM2-7 complex is loaded onto origins of DNA replication. During G1-S phase, MCM2-7 complex is activated to unwind the double stranded DNA and plays an important role in DNA replication forks elongation. The components of the MCM2-7 complex are: DNA replication licensing factor MCM2, InterPro:IPR008045 DNA replication licensing factor MCM3, InterPro:IPR008046 DNA replication licensing factor MCM4, InterPro:IPR008047 DNA replication licensing factor MCM5, InterPro:IPR008048 DNA replication licensing factor MCM6, InterPro:IPR008049 DNA replication licensing factor MCM7, InterPro:IPR008050 Mcm4 is thought to play a pivotal role in ensuring DNA replication occurs only once per cell cycle. Phosphorylation of Mcm4 dramatically reduces its affinity for chromatin - it has been proposed that this cell cycle-dependent phosphorylation is the mechanism that inactivates the MCM complex from late S phase through mitosis, thus preventing illegitimate DNA replication during that period of the cell cycle.
