identifier: PRINTS:PR01441
label: "Cellulose synthase subunit C signature"
definition: >-
  An operon encoding 4 proteins required for bacterial cellulose biosynthesis (bcs) in Acetobacter xylinus (Gluconacetobacter xylinus) has been isolated via genetic complementation with strains lacking cellulose synthase activity. Nucleotide sequence analysis showed the cellulose synthase operon to consist of 4 genes, designated bcsA, bcsB, bcsC and bcsD, all of which are required for maximal bacterial cellulose synthesis in A. xylinum. The calculated molecular mass of the protein encoded by bcsC is 141.0kDa. The function of BcsC is unknown. The sequence shares a high degree of similarity with Escherichia coli YhjL.
definition_source: "InterPro:IPR003921 abstract (PRINTS PR01441 is a member signature)"
