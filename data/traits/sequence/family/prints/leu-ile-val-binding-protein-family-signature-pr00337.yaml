identifier: PRINTS:PR00337
label: "Leu/Ile/Val-binding protein family signature"
definition: >-
  Leu/Ile/Val/Thr- and Leu-binding proteins, which share a high degree of sequence similarity, are components of the leucine-specific transport system. This is one of two periplasmic binding protein-dependent systems in the high-affinity transport of branched-chain amino acids in bacteria. A much weaker sequence relationship has been reported between the periplasmic binding proteins and the aliphatic amidase expression-regulating protein, AmiC. On this basis, it has been suggested that AmiC may be capable of adopting a similar 3D fold.
definition_source: "InterPro:IPR000709 abstract (PRINTS PR00337 is a member signature)"
