identifier: PRINTS:PR00043
label: "Jun transcription factor signature"
definition: >-
  The transcription factor activator protein (AP)-1 consists of Jun (c-Jun, JunB, and JunD), Fos (c-Fos, FosB, Fra1, and Fra2), ATF (ATFa, ATF-2 and ATF-3) and JDP (JDP-1 and JDP-2) family members. They are basic leucine zipper transcription factors that play a central role in regulating gene transcription in various biological processes. This entry includes Jun and ATF family members.
