identifier: PRINTS:PR00995
label: "36kDa capillovirus serine protease (S35) signature"
definition: >-
  ORF2 of the capilloviruses (trichoviruses) contain a serine peptidase signature which belongs to the MEROPS peptidase family S35 (clan PA(S)). In a number of capilloviruses that have been sequenced to date ORF2 has been identified as the putative movement protein, though it also contains the consensus sequence Gly-Asp-Ser-Gly common to the active site of a number of serine proteases. This family also contains proteins classified as non-peptidase homologues which have either been found experimentally to be without peptidase activity, or lack amino acid residues that are believed to be essential for the catalytic activity of peptidases in the family. Capilloviruses infect a number of different plant species, and can be detected by the presence of virions in leaf sap.
definition_source: "InterPro:IPR001815 abstract (PRINTS PR00995 is a member signature)"
