identifier: PRINTS:PR01704
label: "Fungal allergen ribonucleotoxin signature"
definition: >-
  The fungal ribotoxins are a family of highly specific ribonucleases that inactivate the ribosome by cleavage of the 23-28S RNA of the large ribosomal subunit at a single phosphodiester bond. Cleavage abolishes the capacity of ribosomes to carry out protein synthesis by inhibiting elongation factor 1- dependent binding of aminoacyl-tRNA and GTP-dependent binding of elongation factor 2 to ribosomes. Mitogillin-like ribotoxins are among the most potent inhibitors of translation so far identified, and they have been investigated as potential anti-tumour agents, or components of immunotoxins. Members of this family include ribonuclease mitogillin, ribonuclease alpha-sarcin and ribonuclease clavin precursor proteins.
definition_source: "InterPro:IPR004025 abstract (PRINTS PR01704 is a member signature)"
