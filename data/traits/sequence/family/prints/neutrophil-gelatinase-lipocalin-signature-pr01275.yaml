identifier: PRINTS:PR01275
label: "Neutrophil gelatinase lipocalin signature"
definition: >-
  Murine neutrophil gelatinase-associated lipocalin precursor (NGAL) exhibits a 7-10-fold increase in expression in cultured mouse kidney cells infected by Simian virus 40 (SV40) or other viruses. NGAL has been identified as a major secretory product of lipopolysaccharide-stimulated cultured mouse macrophages, suggesting that the protein might function in defence against infection. Recently, NGAL has been shown to be identical to SIP24, a previously identified secretory product of quiescent mouse fibroblasts induced by serum, dexamethasone, basic fibroblast growth factor, and phorbol ester. Mouse plasma levels of NGAL rise as a result of increased expression levels in the liver, in response to intramuscular turpentine injection. Tumour necrosis factor can regulate NGAL expression in cultured liver cells. These findings indicate that NGAL is a positive acute phase protein and may possess immunosuppressive or anti-inflammatory properties, possibly linked to its regulation of neutrophil gelatinase or other plasma protein. The uterus is also a major site of NGAL synthesis, especially at parturition, when expression increases significantly, suggesting a physiological role for the protein in uterine secretions.
definition_source: "InterPro:IPR003087 abstract (PRINTS PR01275 is a member signature)"
