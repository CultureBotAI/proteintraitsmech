identifier: PRINTS:PR01999
label: "Lactococcal phage major tail protein signature"
definition: >-
  This entry represents the lactococcal proteins from the MTP2 family. Two major structural proteins from the lactococcal temperate bacteriophage TP901-1 have been sequenced: the Major Head Protein (MHP) and the Major Tail Protein (MTP). Homologues of the major tail protein have since been found in Staphylococcus, Streptococcus and Lactobacillus phages. The sequences are fairly short, typically ~150-200 amino acid residues in length, and are well conserved. This family of proteins (designated here phage MTP 2) has its own distinct sequence signature that distinguishes it from the MTP 1 family (see MTP1FAMILY InterPro:IPR022344).
definition_source: "InterPro:IPR022363 abstract (PRINTS PR01999 is a member signature)"
