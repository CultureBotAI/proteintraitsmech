identifier: PRINTS:PR01052
label: "Metabotropic glutamate receptor 2 signature"
definition: >-
  The mRNA for GRM2 is widespread in the brain, with a unique distribution; it is found in high levels in neurons in olfactory bulb, cerebral cortex, cerebellum Golgi cells, and dentate gyrus granule cells. GRM2 inhibits adenylyl cyclase through a pertussis-toxin-sensitive G-protein, probably of the Gi/Go class; the receptor has also been reported to cause a weak stimulation of phosphoinositide metabolism. It may mediate suppression of neurotransmission or may be involved in synaptogenesis or synaptic stabilization. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. The term clan can be used to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include rhodopsin-like GPCRs (Class A, GPCRA), secretin-like GPCRs (Class B, GPCRB), metabotropic glutamate receptor family (Class C, GPCRC), fungal mating pheromone receptors (Class D, GPCRD), cAMP receptors (Class E, GPCRE) and frizzled/smoothened (Class F, GPCRF). GPCRs are major drug targets, and are consequently the subject of considerable research interest. It has been reported that the repertoire of GPCRs for endogenous ligands consists of approximately 400 receptors in humans and mice. Most GPCRs are identified on the basis of their DNA sequences, rather than the ligand they bind, those that are unmatched to known natural ligands are designated by as orphan GPCRs, or unclassified GPCRs. GPCR family 3 rec
