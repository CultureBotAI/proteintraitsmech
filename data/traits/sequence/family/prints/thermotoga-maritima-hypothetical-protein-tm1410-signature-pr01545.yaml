identifier: PRINTS:PR01545
label: "Thermotoga maritima hypothetical protein TM1410 signature"
definition: >-
  Eighty-one archaeal-like genes, ranging in size from 4-20kb, are clustered in 15 regions of the Thermotoga maritima genome. Conservation of gene order between T. maritima and Archaea in many of these regions suggests that lateral gene transfer may have occurred between thermophilic Eubacteria and Archaea.
