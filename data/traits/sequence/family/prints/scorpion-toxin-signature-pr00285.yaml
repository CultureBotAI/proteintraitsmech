identifier: PRINTS:PR00285
label: "Scorpion toxin signature"
definition: >-
  Scorpion toxins, which may be mammal or insect specific, bind to sodium channels, inhibiting the inactivation of activated channels and blocking neuronal transmission. The complete covalent structure of the toxins has been deduced: it comprises around 66 amino acid residues and is cross-linked by four disulphide bridges. An anti-epilepsy peptide isolated from scorpion venom shows similarity to both scorpion neurotoxins and anti-insect toxins. This entry contains alpha toxins as well as beta-insect depressant toxins, and other toxins. Alpha toxins are highly toxic both to mammals and insects. Depressant insect beta-toxins cause a transient contraction paralysis followed by a slow flaccid paralysis. They bind voltage-independently at site-4 of sodium channels and block action potentials, primarily by depolarising the axonal membrane and suppressing the sodium current. This depressant toxin is active only on insects. It is found in a relatively small amount in the venom. Beta toxins from Centruroides tecomanus also bind voltage-independently at site-4 of sodium channels (Nav) and shift the voltage of activation toward more negative potentials thereby affecting sodium channel activation and promoting spontaneous and repetitive firing and are possibly lethal to mice, freshwater shrimp and crickets.
definition_source: "InterPro:IPR018218 abstract (PRINTS PR00285 is a member signature)"
