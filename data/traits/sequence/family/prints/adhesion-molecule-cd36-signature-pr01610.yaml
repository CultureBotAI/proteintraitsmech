identifier: PRINTS:PR01610
label: "Adhesion molecule CD36 signature"
definition: >-
  This entry includes platelet glycoprotein 4 (CD36) and scavenger receptor class B member 1 (SCARB1, also known as CD36 antigen-like 1) from humans, and sensory neuron membrane protein 1 (SNMP1) from flies. CD36 is a a scavenger receptor important for lipoprotein binding and uptake of cholesterol and lipids in vertebrates.
