identifier: PRINTS:PR01988
label: "Putative bacilysin exporter bacE signature"
definition: >-
  The so-called putative bacilysin exporter, bacE, part of the bacilysin biosynthesis operon, has been shown to be involved in self-protection to bacilysin by permitting efflux of this antibiotic.
