identifier: PRINTS:PR01388
label: "Cytolethal distending toxin B signature"
definition: >-
  Cytolethal distending toxin (CDT) is a secreted protein toxin produced by a number of Gram-negative disease-causing bacteria. CDT causes cell cycle arrest and eventual cell death in eukaryotic cells, as a result of chromosomal DNA damage caused by the catalytic, DNase I-like, CdtB subunit. Bacterial CDTs are generally comprised of three subunits, CdtA, -B and -C. CdtB is translocated into the host cell, where it acts as a genotoxin. CdtA and CdtC are needed for cell surface binding and cellular entry, and it is likely that they remain associated with the membrane, when CdtB is internalized. CdtB enters the target nucleus via nuclear translocation signal domain(s).
definition_source: "InterPro:IPR003539 abstract (PRINTS PR01388 is a member signature)"
