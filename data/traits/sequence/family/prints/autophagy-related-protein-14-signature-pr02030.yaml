identifier: PRINTS:PR02030
label: "Autophagy-related protein 14 signature"
definition: >-
  Macroautophagy is a bulk degradation process induced by starvation in eukaryotic cells. In yeast, 15 autophagy (Apg) proteins coordinate the formation of autophagosomes. Apg14p and Vps30p/Apg6p, components of an autophagy-specific phosphatidylinositol 3-kinase complex, together with Apg9p and Apg16p, are required for localisation of Apg5p and Aut7p to a pre-autophagosome structure that functions in autophageosome formation. Mutations in the Saccharomyces cerevisiae APG14 gene have been shown to cause defects in autophagy.
definition_source: "InterPro:IPR023261 abstract (PRINTS PR02030 is a member signature)"
