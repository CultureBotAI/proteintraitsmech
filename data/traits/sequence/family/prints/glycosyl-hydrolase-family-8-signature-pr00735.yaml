identifier: PRINTS:PR00735
label: "Glycosyl hydrolase family 8 signature"
definition: >-
  O-Glycosyl hydrolases (EC:3.2.1.) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 8 CAZy:GH8 comprises enzymes with several known activities; endoglucanase (EC:3.2.1.4); lichenase (EC:3.2.1.73); chitosanase (EC:3.2.1.132). These enzymes were formerly known as cellulase family D.
definition_source: "InterPro:IPR002037 abstract (PRINTS PR00735 is a member signature)"
