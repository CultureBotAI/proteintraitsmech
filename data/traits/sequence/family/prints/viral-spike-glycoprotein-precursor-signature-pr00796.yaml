identifier: PRINTS:PR00796
label: "Viral spike glycoprotein precursor signature"
definition: >-
  This entry represents the glycoproteins of infectious haematopoietic necrosis virus and similar sequences. They are responsible for forming spikes on the surface of the virion. The glycoprotein mediates binding of the virus to susceptible host cells and induces uptake of the virus by the cell. The interaction between the internal components of the virion and the portion of the glycoprotein exposed on the cytoplasmic face of the plasma membrane probably directs envelopment and virus budding.
definition_source: "InterPro:IPR002417 abstract (PRINTS PR00796 is a member signature)"
