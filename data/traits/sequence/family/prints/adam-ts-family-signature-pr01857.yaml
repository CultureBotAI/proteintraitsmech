identifier: PRINTS:PR01857
label: "ADAM-TS family signature"
definition: >-
  This entry includes ADAM-TS and ADAM-TS-like proteins, which are closely related to the ADAM family (A Disintegrin and Metalloproteinase). ADAM-TS proteases are zinc metalloendopeptidases, most of whose substrates are extracellular matrix (ECM) components, whereas ADAM-TS-like proteins lack a metalloprotease domain, reside in the ECM and have regulatory roles. Examples of ADAM-TS-like proteins are papilin and punctin. Proteolysis of the extracellular matrix plays a critical role in establishing tissue architecture during development and in tissue degradation in diseases such as cancer, arthritis, Alzheimer's disease and a variety of inflammatory conditions. The proteolytic enzymes responsible for this process are members of diverse protease families, including the secreted zinc metalloproteases (MPs). ADAM-TS (A Disintegrin and Metalloproteinase with Thrombospondin Motifs) is closely related to the ADAM family (A Disintegrin and Metalloproteinase) and is a subfamily of the MP family, consists of at least 20 members sharing a high degree of sequence similarity and conserved domain organisation. The defining domains of the ADAM-TS family are (from N- to C-termini) a pre-pro metalloprotease domain of the reprolysin type, a snake venom disintegrin-like domain, a thrombospondin type-I (TS) module, a cysteine-rich region, and a cysteine-free (spacer) domain. Domain organisation following the spacer domain C terminus shows some variability in certain ADAM-TS members, principally in the number of additional TS domains. These enzymes have a wide-spectrum role in vascular biology and cardiovascular pathophysiology. Members of the ADAM-TS family have been implicated in a range of diseases. For instance, members of this family have been found to participate directly in processes in
