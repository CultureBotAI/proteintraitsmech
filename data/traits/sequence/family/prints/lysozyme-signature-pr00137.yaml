identifier: PRINTS:PR00137
label: "Lysozyme signature"
definition: >-
  O-Glycosyl hydrolases ( ) are a widespread group of enzymes that hydrolyse the glycosidic bond between two or more carbohydrates, or between a carbohydrate and a non-carbohydrate moiety. A classification system for glycosyl hydrolases, based on sequence similarity, has led to the definition of 85 different families. This classification is available on the CAZy (CArbohydrate-Active EnZymes) website. Glycoside hydrolase family 22 comprises enzymes with two known activities; lysozyme type C ( ) and alpha-lactalbumins. Asp and/or the carbonyl oxygen of the C-2 acetamido group of the substrate acts as the catalytic nucleophile/base. Lysozyme is a muramidase that hydrolyses beta-1,4-links between N-acetyl- muramic acid and N-acetyl-D-glucosamine in the peptidoglycan of bacterial cell walls, thus helping to fight invading bacteria. In this capacity, the enzyme is found in tears and saliva, but it has also been recruited for a digestive role in the true stomach (abomasum) of ruminants and colobine monkeys: here it probably degrades the cell walls of bacteria passing from the foregut, allowing the breakdown products to be digested by other stomach enzymes. The stomach form of lysozyme is endowed with special physiochemical properties that allow it to function in an acidic and protease-rich environment. Lysozyme C is similar to alpha-lactalbumin in terms of primary sequence and structure, and both have probably evolved from a common ancestral protein. There is, however, no similarity in function, lactalbumin being involved in the formation of lactose and is essential for milk production. Another significant difference between the two enzymes is that while all lactalbumins have the ability to bind calcium, this property is restricted to only a few lysozymes. From human testis cDNA
