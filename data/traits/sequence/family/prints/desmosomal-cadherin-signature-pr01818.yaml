identifier: PRINTS:PR01818
label: "Desmosomal cadherin signature"
definition: >-
  Cadherins, first discovered in mouse teratocarcinoma cells, are structurally and functionally similar molecules that take part in selective calcium-dependent adhesion interactions between cell surfaces. There are a number of different isoforms distributed in a tissue-specific manner in a wide variety of organisms. Cells containing different cadherins tend to segregate in vitro, while those that contain the same cadherins tend to preferentially aggregate together. This observation is linked to the finding that cadherin expression causes morphological changes involving the positional segregation of cells into layers, suggesting they may play an important role in the sorting of different cell types during morphogenesis, histogenesis and regeneration. They may also be involved in the regulation of tight and gap junctions, and in the control of intercellular spacing. Structurally, cadherins comprise a number of domains: these include a signal sequence; a propeptide of ~130 residues; an extracellular domain of ~600 residues; a single transmembrane (TM) domain; and a well-conserved C-terminal cytoplasmic domain of ~150 residues. The extracellular domain can be subdivided into 5 parts, 4 of which are repeats of ~110 residues, and the fifth contains 4 conserved cysteines. The calcium-binding region of cadherins is thought to be located in the extracellular domain. Desmosomes are localised junctions that hold cells tightly together, common in tissues subject to mechanical strain (e.g., epithelia). Desmosomal cadherins are TM protein components of desmosomes (for review, see ), whose extracellular cadherin repeats are responsible for adhesion and whose intracellular regions interact with intermediate filaments via desmosomal plaque proteins plakoglobin, plakobilin and desmoplakin.
