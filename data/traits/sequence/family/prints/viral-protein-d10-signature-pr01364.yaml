identifier: PRINTS:PR01364
label: "Viral protein D10 signature"
definition: >-
  The complete DNA sequence of the genome of Vaccinia virus has been determined. 198 "major" protein-coding regions and 65 overlapping "minor" regions have been identified, with a total of 263 potential genes. The genes are compactly organised along the genome, with few noncoding regions. The function of the majority of proteins encoded by these open reading frames is so far undetermined. The DNA sequence of the Fowlpox virus genome corresponding to the vaccinia virus D6-A1 region has been deduced. Translation of the sequence reveals fowlpox virus gene homologues corresponding to the D6, D7, D9, D10, D11, D12, D13 and A1 genes of vaccinia virus. Insertion of a gene cartridge comprising the vaccinia virus p7.5 promoter and the lacZ gene into the fowlpox virus D8, D9 and D10 genes was carried out in vitro, followed by recombination into fowlpox virus. No stable insertion mutants were obtained for D10, suggesting that this gene probably encodes a function essential to virus replication. D10 (also known as mRNA-decapping protein OPG122), like the D9 protein, contains an evolutionarily conserved MutT domain core, which is a characteristic of the NUDIX hydrolase family.
definition_source: "InterPro:IPR003301 abstract (PRINTS PR01364 is a member signature)"
