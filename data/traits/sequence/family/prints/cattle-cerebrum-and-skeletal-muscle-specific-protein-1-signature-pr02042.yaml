identifier: PRINTS:PR02042
label: "Cattle cerebrum and skeletal muscle-specific protein 1 signature"
definition: >-
  This family represents the ubiquinol-cytochrome-c reductase complex assembly factor 4 (UQCC4) from vertebrates, a family of proteins that was discovered in a screen of Bos taurus placental ESTs. The B. taurus member of this family was named cattle cerebrum and skeletal muscle-specific transcript 1 (CCSMST1), hence the alternative name of the family. UQCC4 is required for the assembly and stability of the mitochondrial ubiquinol-cytochrome c reductase complex (complex III (CIII) or cytochrome b-c1 complex), a multisubunit transmembrane complex that is part of the mitochondrial electron transport chain (ETC) which drives oxidative phosphorylation.
definition_source: "InterPro:IPR023248 abstract (PRINTS PR02042 is a member signature)"
