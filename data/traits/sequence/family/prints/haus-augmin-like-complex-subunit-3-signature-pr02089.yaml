identifier: PRINTS:PR02089
label: "HAUS augmin-like complex subunit 3 signature"
definition: >-
  HAUS augmin-like complex subunit 3 (HAUS3) contributes to mitotic spindle assembly, maintenance of centrosome integrity and completion of cytokinesis as part of the HAUS augmin-like complex. AUGMIN subunit3 (AUG3) is a plant homologue of HAUS3.
