identifier: PRINTS:PR01772
label: "JNK MAP kinase signature"
definition: >-
  MAP (Mitogen Activated Protein) kinases participate in kinase cascades, whereby at least 3 protein kinases act in series, culminating in activation of MAP kinase. MAP kinases are activated by dual phosphorylation on both tyrosine and threonine residues of a conserved TXY motif. JNK (Jun N-terminal Kinase), also known as Stress Activated Protein Kinase (SAPK), belongs to the family of MAP kinases. JNKs are activated by cytokines, certain ligands for GPCRs, agents that interfere with DNA and protein synthesis, and to some extent by growth factors, serum and transforming agents. Three genes have been identified in humans: JNK1, JNK2 and JNK3. Knockouts of these genes have revealed that JNK1 and/or JNK2 must have a role in both apoptosis and the immune response. This entry represents the JNK MAP kinases. In addition, it matches mitogen-activated protein kinase 5 from rice ( UniProtKB:Q10N20 ), which is also induced in response to stress, and JNK-like MAP kinase KGB-1 from Caenorhabditis elegans.
