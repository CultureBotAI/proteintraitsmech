identifier: PRINTS:PR00828
label: "Formin signature"
definition: >-
  Formins (formin homology proteins) proteins play a crucial role in the reorganisation of the actin cytoskeleton and associate with the fast-growing end (barbed end) of actin filaments. This entry represents the formin homologues from animals (and some fungi), including protein cappuccino from Drosophila melanogaster and formins from human and mouse. Protein cappuccino acts as an actin nucleation factor and promotes assembly of actin filaments together with spir. It may play a role in intracellular vesicle transport along actin fibres, providing a novel link between actin cytoskeleton dynamics and intracellular transport.
definition_source: "InterPro:IPR001265 abstract (PRINTS PR00828 is a member signature)"
