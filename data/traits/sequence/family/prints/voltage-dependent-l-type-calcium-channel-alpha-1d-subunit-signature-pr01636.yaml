identifier: PRINTS:PR01636
label: "Voltage-dependent L-type calcium channel alpha-1D subunit signature"
definition: >-
  This entry represents the alpha-1D subunits of the Voltage-dependent calcium channel, L-type (LVDCC), which allow cells to slowly inactivate voltage-gated Ca2+ influx to weak depolarisations. This property allows them to participate in important physiological functions, such as tonic neurotransmitter release in cochlear inner hair cells. In addition, these properties make them ideally suited to contribute to subthreshold Ca2+ signalling, for example in hippocampal pyramidal cells. Mutations in this channel have been associated with autism spectrum disorders and epilepsy. Ca2+ ions are unique in that they not only carry charge but they are also the most widely used of diffusible second messengers. Voltage-dependent Ca2+ channels (VDCC) are a family of molecules that allow cells to couple electrical activity to intracellular Ca2+ signalling. The opening and closing of these channels by depolarizing stimuli, such as action potentials, allows Ca2+ ions to enter neurons down a steep electrochemical gradient, producing transient intracellular Ca2+ signals. Many of the processes that occur in neurons, including transmitter release, gene transcription and metabolism are controlled by Ca2+ influx occurring simultaneously at different cellular locales. The pore is formed by the alpha-1 subunit which incorporates the conduction pore, the voltage sensor and gating apparatus, and the known sites of channel regulation by second messengers, drugs, and toxins. The activity of this pore is modulated by four tightly-coupled subunits: an intracellular beta subunit; a transmembrane gamma subunit; and a disulphide-linked complex of alpha-2 and delta subunits, which are proteolytically cleaved from the same gene product. Properties of the protein including gating voltage-dependence, G protei
