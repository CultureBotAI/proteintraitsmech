identifier: PRINTS:PR01179
label: "Ornithine/diaminopimelate/arginine (ODA) decarboxylase family signature"
definition: >-
  Pyridoxal-dependent decarboxylases acting on ornithine, lysine, arginine and related substrates can be classified into two different families on the basis of sequence similarities. Members of this family while most probably evolutionary related, do not share extensive regions of sequence similarities. PLP-dependent decarboxylases exhibit two different structural folds, Fold I and Fold III. This family belong to the Fold III group which proceed with retention of configuration at the site of decarboxylation, with the exception of diaminopimelate decarboxylase (DAPDC) and D-ornithine/D-lysine decarboxylase (DOKDC) from Salmonella enterica serovar typhimurium, that are known as stereoinverting decarboxylases. The proteins contain a conserved lysine residue which is known, in mouse ODC, to be the site of attachment of the pyridoxal-phosphate group and it is thought to be responsible for protonation of the product, thus resulting in the retention of configuration for decarboxylation of l-amino acids and inversion for decarboxylation of d-amino acids. The proteins also contain a stretch of three consecutive glycine residues and has been proposed to be part of a substrate-binding region. These enzymes are collectively known as group IV decarboxylases, and include ornithine and arginine decarboxylases, and diaminopimelate decarboxylase (DAP).
definition_source: "InterPro:IPR000183 abstract (PRINTS PR01179 is a member signature)"
