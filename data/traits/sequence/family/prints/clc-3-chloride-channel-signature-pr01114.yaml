identifier: PRINTS:PR01114
label: "CLC-3 chloride channel signature"
definition: >-
  CLC-3/ClC3 is a member of the CLC family initially cloned from rat kidney and localised to chromosome 4 in humans; the human isoform contains 762 amino acid residues. Together with CLC-4 and CLC-5, it forms a distinct branch of the CLC gene family, the three members showing ~80% residue identity. CLC-3is an outwardly-rectifying electrogenic H+/Cl-exchanger which mediates the exchange of chloride ions against protons. Chloride channels (CLCs) constitute an evolutionarily well-conserved family of voltage-gated channels that are structurally unrelated to the other known voltage-gated channels. They are found in organisms ranging from bacteria to yeasts and plants, and also to animals. Their functions in higher animals likely include the regulation of cell volume, control of electrical excitability and trans-epithelial transport. Some members are plasma membrane Cl channels, while others are Cl/H exchangers. The first member of the family (CLC-0) was expression-cloned from the electric organ of Torpedo marmorata, and subsequently nine CLC-like proteins have been cloned from mammals. They are thought to function as multimers of two or more identical or homologous subunits, and they have varying tissue distributions and functional properties. To date, CLC-0, CLC-1, CLC-2, CLC-4 and CLC-5 have been demonstrated to form functional Cl-channels; whether the remaining isoforms do so is either contested or unproven. One possible explanation for the difficulty in expressing activatable Cl-channels is that some of the isoforms may function as Cl-channels of intracellular compartments, rather than of the plasma membrane. However, they are all thought to have a similar transmembrane (TM) topology, initial hydropathy analysis suggesting 13 hydrophobic stretches long enough to form putat
