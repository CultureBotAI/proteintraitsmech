identifier: PRINTS:PR00478
label: "Phosphoribulokinase family signature"
definition: >-
  Phosphoribulokinase (PRK) EC:2.7.1.19 catalyses the ATP-dependent phosphorylation of ribulose-5-phosphate to ribulose-1,5-phosphate, a key step in the pentose phosphate pathway where carbon dioxide is assimilated by autotrophic organisms. In general, plant enzymes are light-activated by the thioredoxin/ferredoxin system, while those from photosynthetic bacteria are regulated by a system that has an absolute requirement for NADH. Thioredoxin/ferredoxin regulation is mediated by the reversible oxidation/reduction of sulphydryl and disulphide groups. In the spinach enzyme (UniProtKB:P09559) the participating residues are Cys-16 and Cys-55. Sequence analysis shows the first of these cysteines to be present in the ATP-binding site; neither is found in the bacterial sequences.
definition_source: "InterPro:IPR006082 abstract (PRINTS PR00478 is a member signature)"
