identifier: PRINTS:PR01206
label: "Orphan neurotransmitter transporter signature"
definition: >-
  Solute carrier 6 (SLC6) transporters are part of the neurotransmitter:sodium symporters family. This entry represents a group of neutral amino acid SLC6 transporters that includes B0AT1 (SLC6A19), B0AT3 (SLC6A18), B0AT2 (SLC6A15), NTT4/XT1 (SLC6A17) and XTRP3/XT3 (SLC6A20). B0AT1 (SLC6A19) catalyzes the secondary active transport of neutral amino acids across the apical membrane in the small intestine and kidney, whereas B0AT3 (SLC6A18) is found only in the kidney. Human B0AT3 is an inactive protein, which explains the absence of glycinuria in humans with homozygous nonsense mutations in B0AT3. Mouse B0AT3 requires collectrin both for trafficking of the transporter to the cell surface and for the catalytic activity.
definition_source: "InterPro:IPR002438 abstract (PRINTS PR01206 is a member signature)"
