identifier: PRINTS:PR01286
label: "Orphan nuclear receptor NOR1 signature"
definition: >-
  Human Nuclear receptor subfamily 4 group A member 3 (also known as NOR-1) mRNA has been detected in adult heart and skeletal muscle, as well as in foetal brain, indicating that its expression is not restricted to events that occur during neural development; it plays a role in the regulation of proliferation, survival and differentiation of many different cell types and also in metabolism and inflammation. It mediates proliferation of vascular smooth muscle, myeloid progenitor cell and type B pancreatic cells; promotes mitogen-induced vascular smooth muscle cell proliferation through transactivation of SKP2 promoter by binding a NBRE site. It is a transcriptional activator that binds to regulatory elements in promoter regions in a cell- and response element (target)-specific manner and induces gene expression by binding as monomers to the NR4A1 response element (NBRE) 5'-AAAAGGTCA-3' site and as homodimers to the Nur response element (NurRE) site in the promoter of their regulated target genes. It has been shown that in a skeletal myxoid chondrosarcoma, the EWS gene becomes fused to NR4A3. The chimaeric EWS-NOR gene encodes a EWS-NOR fusion protein in which the C-terminal RNA-binding domain of EWS is replaced by the entire NOR protein, comprising a long N-terminal domain, a central DNA binding domain and a C-terminal ligand-binding/dimerisation domain. Steroid or nuclear hormone receptors (NRs) constitute an important superfamily of transcription regulators that are involved in widely diverse physiological functions, including control of embryonic development, cell differentiation and homeostasis. Members of the superfamily include the steroid hormone receptors and receptors for thyroid hormone, retinoids, 1,25-dihydroxy-vitamin D3 and a variety of other ligands. The pro
