identifier: PRINTS:PR01690
label: "TASK-5 K+ channel signature"
definition: >-
  TASK is a member of the TWIK-related (two P-domain) K + channel family identified in human tissues. It is widely distributed, being particularly abundant in the pancreas and placenta, but it is also found in the brain, heart, lung and kidney. Its amino acid identity to TWIK-1 and TREK-1 is rather low, being about 25-28%. However, it is thought to share the same topology of four TM segments, with two P-domains. TASK is very sensitive to variations in extracellular pH in the physiological range, changing from fully-open to closed in approximately 0.5 pH units around pH 7.4. Thus, it may well be a biological sensor of external pH variations. TASK-5 is expressed in the pancreas, liver, kidney, lung, ovary, testis and heart. It requires another as yet unidentified partner subunit to form functional channels in the plasma membrane, or it may form a channel in an intracellular organelle.
definition_source: "InterPro:IPR008073 abstract (PRINTS PR01690 is a member signature)"
