identifier: PRINTS:PR01285
label: "Orphan nuclear receptor HMR signature"
definition: >-
  This entry includes nuclear receptor subfamily 4 group A member 1 (NR4A1, also known as NUR77 and HMR-type), an early response protein and orphan member of the steroid hormone receptor superfamily. It binds the NGFI-B response element (NBRE) 5'-AAAGGTCA-3'. It is expressed in the lung, brain and superior cervical ganglia, and high levels are also seen in adrenal tissue. While members of this superfamily typically bind DNA as dimers, NGFI-B binds as a monomer. A domain separate from the NGFI-B zinc fingers (the so-called A box) has been identified and is required for recognition of two adenine-thymidine base pairs at the 5' end of the NGFI-B DNA binding element. This receptor participates in energy homeostasis by sequestrating the kinase STK11 in the nucleus, thereby attenuating cytoplasmic AMPK activation and it regulates the inflammatory response in macrophages by regulating metabolic adaptations during inflammation, including repressing the transcription of genes involved in the citric acid cycle (TCA). NR4A1 inhibits NF-kappa-B signaling by binding to low-affinity NF-kappa-B binding sites, such as at the IL2 promoter. Steroid or nuclear hormone receptors (NRs) constitute an important superfamily of transcription regulators that are involved in widely diverse physiological functions, including control of embryonic development, cell differentiation and homeostasis. Members of the superfamily include the steroid hormone receptors and receptors for thyroid hormone, retinoids, 1,25-dihydroxy-vitamin D3 and a variety of other ligands. The proteins function as dimeric molecules in nuclei to regulate the transcription of target genes in a ligand-responsive manner. In addition to C-terminal ligand-binding domains, these nuclear receptors contain a highly-conserved, N-terminal
