identifier: PRINTS:PR00496
label: "Napin signature"
definition: >-
  This entry represents a group of plant seed storage proteins, including Napin, 2S seed storage protein and Conglutin. Napins are low-molecular weight, basic storage proteins synthesised in rape-seed embryos during seed maturation. Sequence comparisons have revealed that Napin belongs to a diverse protein family, which includes major allergens, trypsin inhibitors and natural anti-fungal proteins. Napin comprises 2 polypeptide chains (MW 9000 and 4000) held together by disulphide bonds. The protein is initially synthesised as a precursor of 178 residues, which is proteolytically cleaved to generate mature Napin chains, with 86 and 29 residues respectively. Some of the proteins in this family are allergens, with cores that are very resistant to proteolytic digestion and to elevated temperatures of up to 100 degrees C. Allergies are hypersensitivity reactions of the immune system to specific substances called allergens (such as pollen, stings, drugs, or food) that, in most people, result in no symptoms. A nomenclature system has been established for antigens (allergens) that cause IgE-mediated atopic allergies in humans [WHO/IUIS Allergen Nomenclature Subcommittee King T.P., Hoffmann D., Loewenstein H., Marsh D.G., Platts-Mills T.A.E., Thomas W. Bull. World Health Organ. 72:797-806(1994)]. This nomenclature system is defined by a designation that is composed of the first three letters of the genus; a space; the first letter of the species name; a space and an arabic number. In the event that two species names have identical designations, they are discriminated from one another by adding one or more letters (as necessary) to each species designation.
