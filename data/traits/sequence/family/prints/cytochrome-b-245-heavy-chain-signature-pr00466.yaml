identifier: PRINTS:PR00466
label: "Cytochrome B-245 heavy chain signature"
definition: >-
  Phagocytes form the first line of defence against invasion by micro-organisms. Engulfing of bacteria by neutrophils during phagocytosis is accompanied by a respiratory burst. Defects in phagocytosis involving the lack of a respiratory burst give rise to chronic granulomatous disease (CGD). Proteins in this entry are calcium-dependent NADPH oxidases that generates superoxide, including NADPH oxidase 1-4 from animals (also known as Cytochrome b-245 heavy chain) and Respiratory burst oxidase homologue proteins from plants. NADPH oxidase 2 is the catalytic subunit of the phagocyte NADPH oxidase complex that mediates the transfer of electrons from cytosolic NADPH to O2 to produce the superoxide anion.
definition_source: "InterPro:IPR000778 abstract (PRINTS PR00466 is a member signature)"
