identifier: PRINTS:PR01774
label: "Exfoliative toxin signature"
definition: >-
  This group of serine peptidases belong to MEROPS peptidase family S1, subfamily S1B (clan PA(S)). The type example is glutamyl endopeptidase I of Staphylococcus aureus, a well-characterised and specialised human pathogen expressing a variety of virulence factors to enable successful infection of the host. Symptoms usually manifest in cases of food poisoning, pyrogenic fever and toxic shock syndrome, and can prove lethal in immunocompromised victims. Of all the exotoxins secreted from the bacterial cell, superantigens and hemolysins are amongst the most studied.
definition_source: "InterPro:IPR008353 abstract (PRINTS PR01774 is a member signature)"
