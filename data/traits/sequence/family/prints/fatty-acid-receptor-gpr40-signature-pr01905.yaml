identifier: PRINTS:PR01905
label: "Fatty acid receptor GPR40 signature"
definition: >-
  G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions (including various autocrine, paracrine and endocrine processes). They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. We use the term clan to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include the rhodopsin-like GPCRs, the secretin-like GPCRs, the cAMP receptors, the fungal mating pheromone receptors, and the metabotropic glutamate receptor family. The rhodopsin-like GPCRs themselves represent a widespread protein family that includes hormone, neurotransmitter and light receptors, all of which transduce extracellular signals through interaction with guanine nucleotide-binding (G) proteins. Although their activating ligands vary widely in structure and character, the amino acid sequences of the receptors are very similar and are believed to adopt a common structural framework comprising 7 transmembrane (TM) helices. A cluster of four intronless GPCR genes, sharing significant sequence similarity with one another, have been identified on human chromosome 19q13.1, downstream from the CD22 gene. The receptors have been named GPR40, GPR41, GPR42 and GPR43. The GPR42 protein sequence shares more than 98% amino acid identity with GPR41 and is located on a possible polymorphic insert. GPR40 has recently been shown to bind long-chain free fatty acids, molecules that have a role in various cellular processes, including regulation of insulin secretion. Expression of GPR40 is restricted to the pancreas, with high level
