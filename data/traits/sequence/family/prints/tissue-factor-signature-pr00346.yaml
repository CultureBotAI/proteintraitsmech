identifier: PRINTS:PR00346
label: "Tissue factor signature"
definition: >-
  Tissue factor (TF, also known as thromboplastin) is an integral membrane glycoprotein that initiates blood coagulation by forming a complex with circulating factor VII (FVII) or VIIa (FVIIa), which it comes in contact with following damage to blood vessel walls. Calcium forms the bridge between TF and FVII, the resultant TF/FVII undergoing auto-cleavage to produce activated TF/FVIIa. This activation sets off an extracellular cascade involving sequential serine protease activations, where TF/FVIIa converts FIX to FIXa, followed by a series of reactions to finally produce fibrin, leading to fibrin deposition and the activation of platelets to form clots.
definition_source: "InterPro:IPR001187 abstract (PRINTS PR00346 is a member signature)"
