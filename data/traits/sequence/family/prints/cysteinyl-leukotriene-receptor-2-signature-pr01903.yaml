identifier: PRINTS:PR01903
label: "Cysteinyl leukotriene receptor 2 signature"
definition: >-
  G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions (including various autocrine, para-crine and endocrine processes). They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. We use the term clan to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include the rhodopsin-like GPCRs, the secretin-like GPCRs, the cAMP receptors, the fungal mating pheromone receptors, and the metabotropic glutamate receptor family. The rhodopsin-like GPCRs themselves represent a widespread protein family that includes hormone, neurotransmitter and light receptors, all of which transduce extracellular signals through interaction with guanine nucleotide-binding (G) proteins. Although their activating ligands vary widely in structure and character, the amino acid sequences of the receptors are very similar and are believed to adopt a common structural framework comprising 7 transmembrane (TM) helices. Leukotrienes (LT) are potent lipid mediators derived from arachidonic acid metabolism. They can be divided into two classes based on the presence or absence of a cysteinyl group. Leukotriene B4 (LTB4) does not contain such a group, whereas LTC4, LTD4, LTE4 and LTF4 are cysteinyl leukotrienes. Cysteinyl leukotrienes (CysLTs), previously known as the "slow reacting substance of anaphylaxis", are produced predominantly by myeloid cells associated with inflammatory responses. They are the most potent bronchoconstrictors known and also have pro-inflammatory effects, making them important mediators in
