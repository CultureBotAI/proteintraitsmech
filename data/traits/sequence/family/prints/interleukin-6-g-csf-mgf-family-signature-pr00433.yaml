identifier: PRINTS:PR00433
label: "Interleukin-6/G-CSF/MGF family signature"
definition: >-
  Interleukin-6 (IL6), also refered to as B-cell stimulatory factor-2 (BSF-2) and interferon beta-2, is a cytokine involved in a wide variety of biological functions. It plays an essential role in the final differentiation of B-cells into IG-secreting cells, as well as inducing myeloma/plasmacytoma growth, nerve cell differentiation and, in hepatocytes, acute phase reactants. A number of other cytokines may be grouped with IL6 on the basis of sequence similarity: these include granulocyte colony-stimulating factor (GCSF) and myelomonocytic growth factor (MGF). GCSF acts in hematopoiesis by affecting the production, differentiation and function of 2 related white cell groups in the blood. MGF also acts in hematopoiesis, stimulating proliferation and colony formation of normal and transformed avian cells of the myeloid lineage.
definition_source: "InterPro:IPR030474 abstract (PRINTS PR00433 is a member signature)"
