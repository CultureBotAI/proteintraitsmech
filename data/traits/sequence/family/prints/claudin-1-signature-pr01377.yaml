identifier: PRINTS:PR01377
label: "Claudin-1 signature"
definition: >-
  Claudins form the paracellular tight junction seal in epithelial tissues. In humans, 24 claudins (claudin 1-24) have been identified. Their ability to polymerise and form strands is affected by the cell types. They can also form heteropolymers with each other within and between tight junction strands. Most of the claudins (claudin-12 being the exception) have a C-terminal PDZ-binding motif that can interact with other PDZ domain proteins, such as scaffolding protein, ZO-1, -2 and -3. They also interact with non-tight junction proteins, such as cell adhesion proteins EpCam and tetraspanins and the signaling proteins, ephrin A and B and their receptors, EphA and EphB. Claudin-1 was the first member of the claudin family to be identified as a tight junction component. The human isoform of claudin-1 was originally termed senescence-associated epithelial membrane protein 1 (SEMP1), but has since been reclassified.
