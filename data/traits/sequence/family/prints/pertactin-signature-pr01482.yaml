identifier: PRINTS:PR01482
label: "Pertactin signature"
definition: >-
  Pertactin (PRN) is an autotransporter protein produced by all members of the Bordetella bronchiseptica cluster. It functions as an adhesin and that an RGD motif located in the centre of the passenger domain is important for this function.
