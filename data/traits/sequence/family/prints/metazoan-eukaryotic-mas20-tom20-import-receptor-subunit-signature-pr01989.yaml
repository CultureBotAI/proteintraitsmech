identifier: PRINTS:PR01989
label: "Metazoan eukaryotic MAS20 (TOM20) import receptor subunit signature"
definition: >-
  Virtually all mitochondrial precursors are imported via the same mechanism: precursors first bind to receptors on the mitochondrial surface, then insert into the translocation channel in the outer membrane. Many outer-membrane proteins participate in the early stages of import, 4 of which (MAS20, MAS22, MAS37 and MAS70) are components of the receptor. MAS20, which forms a subcomplex with MAS22, seems to interact with most or all mitochondrial precursors, suggesting that the protein binds directly to mitochondrial targeting sequences. The MAS37 and MAS70 components also form a subcomplex, the 2 subcomplexes possibly binding via their trans-membrane (TM) regions -the TM region of MAS70 promotes oligomerisation of attatched protein domains and shares sequence similarity with the TM region of MAS20.
definition_source: "InterPro:IPR022422 abstract (PRINTS PR01989 is a member signature)"
