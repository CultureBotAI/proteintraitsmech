identifier: PRINTS:PR00161
label: "Nickel-dependent hydrogenase/B-type cytochrome signature"
definition: >-
  Bacterial membrane-bound nickel-dependent hydrogenases seem to be associated with a b-type cytochrome involved in electron transfer from hydrogen to oxygen. This cytochrome is a protein of about 28kDa that seems to have four transmembrane regions, which include several histidine residues that may be involved in coordination of the haem iron group. The gene coding for this cytochrome is adjacent to that coding for the large subunit of the hydrogenase. It has been assigned a variety of names in different species: hupC, hyaC, hydC or hoxZ. Every genome which contains a member of this family posesses a Ni/Fe hydrogenase according to Genome Properties ( ), and most are gene clustered with other hydrogenase components. Some Ni/Fe hydrogenase-containing species lack a member of this family but contain other CytB homologues, which may substitute for it.
definition_source: "InterPro:IPR000516 abstract (PRINTS PR00161 is a member signature)"
