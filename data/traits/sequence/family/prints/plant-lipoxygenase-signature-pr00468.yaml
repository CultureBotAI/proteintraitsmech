identifier: PRINTS:PR00468
label: "Plant lipoxygenase signature"
definition: >-
  Lipoxygenases ([ec:1.13.11.-]) are a class of iron-containing dioxygenases which catalyses the hydroperoxidation of lipids, containing a cis,cis-1,4-pentadiene structure. They are common in plants where they may be involved in a number of diverse aspects of plant physiology including growth and development, pest resistance, and senescence or responses to wounding. Lipoxygenases can be classified as 9- and 13-lipoxygenases, according to the position of oxygen incorporation in linoleic acid and linolenic acid, the most important substrates for LOX catalysis in plants. There are six A. thaliana lipoxygenases identified: AtLOX1-6, among which AtLOX-1 and AtLOX-5 are 9S-lipoxygenases, and AtLOX-2, AtLOX-3, AtLOX-4 and AtLOX-6 are 13S-lipoxygenases.
