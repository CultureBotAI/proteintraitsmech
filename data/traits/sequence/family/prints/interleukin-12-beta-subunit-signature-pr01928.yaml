identifier: PRINTS:PR01928
label: "Interleukin-12 beta subunit signature"
definition: >-
  This entry represents Interleukin-12 beta. Interleukins are a group of cytokines that have important roles in cell growth, differentiation, and motility, and in the functioning of the immune system. Interleukin-12 (also known as natural killer cell stimulatory factor, and cytotoxic lymphocyte maturation factor) is a 75kDa heterodimer composed of two genetically unrelated subunits - an alpha chain (p35 subunit) and a beta chain (p40 subunit). Production of the cytokine plays an important role in the generation of cell-mediated immunity against many infectious pathogens. The interluekin-12 beta chain also associates with interleukin-23 alpha to form interleukin-23, a proinflammatory cytokine that is overexpressed in and around tumour tissues, where it induces local inflammation and promotes tumour development.
definition_source: "InterPro:IPR015528 abstract (PRINTS PR01928 is a member signature)"
