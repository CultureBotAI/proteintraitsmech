identifier: PRINTS:PR01356
label: "Anti-sense to fibroblast growth factor protein GFG signature"
definition: >-
  This entry represents several nudix hydrolases, including nudix hydrolase 2, 5, 6, 7, 8 and 10. Nudix hydrolases are ubiquitous proteins that hydrolyse a wide range of organic pyrophosphates, including nucleoside di- and triphosphates, dinucleoside and diphosphoinositol polyphosphates, nucleotide sugars and RNA caps, with varying degrees of substrate specificity. Nudix hydrolase 7 is an Acyl-CoA diphosphatase involved in regulating peroxisomal coenzyme A homeostasis.
definition_source: "InterPro:IPR003293 abstract (PRINTS PR01356 is a member signature)"
