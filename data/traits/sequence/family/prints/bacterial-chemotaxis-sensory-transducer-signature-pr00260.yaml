identifier: PRINTS:PR00260
label: "Bacterial chemotaxis sensory transducer signature"
definition: >-
  Methyl-accepting chemotaxis proteins (MCPs) are a family of bacterial receptors that mediate chemotaxis to diverse signals, responding to changes in the concentration of attractants and repellents in the environment by altering swimming behaviour. Environmental diversity gives rise to diversity in bacterial signalling receptors, and consequently there are many genes encoding MCPs. For example, there are four well-characterised MCPs found in Escherichia coli: Tar (taxis towards aspartate and maltose, away from nickel and cobalt), Tsr (taxis towards serine, away from leucine, indole and weak acids), Trg (taxis towards galactose and ribose) and Tap (taxis towards dipeptides). This entry contains several methyl-accepting chemotaxis proteins, as well as related prokaryotic signalling receptors. All these proteins are composed of the same structural domains as found in classical MCPs.
definition_source: "InterPro:IPR004090 abstract (PRINTS PR00260 is a member signature)"
