identifier: PRINTS:PR00076
label: "6-phosphogluconate dehydrogenase signature"
definition: >-
  This entry represents prokaryotic and eukaryotic 6PGD and a truncated prokaryotic 6PGD that lacks of a central region of about 140 residues, such as yqeC from Bacillus subtilis. Bacillus subtilis contains three classes of 6-phosphogluconate dehydrogenases (6PGD), including Gnd (YqjI), GntZ and YqeC. All of them are included in this entry. YgjiI is NADP+ dependent, while GntZ and YqeC are NAD+-dependent.
definition_source: "InterPro:IPR006183 abstract (PRINTS PR00076 is a member signature)"
