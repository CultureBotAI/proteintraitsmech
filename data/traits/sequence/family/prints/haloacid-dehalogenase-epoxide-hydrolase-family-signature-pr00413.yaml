identifier: PRINTS:PR00413
label: "Haloacid dehalogenase/epoxide hydrolase family signature"
definition: >-
  The Haloacid Dehalogenase (HAD) superfamily is defined by the presence of three short catalytic motifs. The subfamilies are defined based on the location and the observed or predicted fold of a so-called capping domain, or the absence of such a domain. Subfamily I consists of sequences in which the capping domain is found in between the first and second catalytic motifs. Subfamily II consists of sequences in which the capping domain is found between the second and third motifs. Subfamily III sequences have no capping domain in either of these positions. The Subfamily IA and IB capping domains are predicted by PSI-PRED to consist of an α-helical bundle. Subfamily IA and IB are separated based on an apparent phylogenetic bifurcation. Of the three motifs defining the HAD superfamily, the third has three variant forms: (1) hhhhsDxxx(x)D, (2) hhhhssxxx(x)D and (3) hhhhDDxxx(x)s where _s_ refers to a small amino acid and _h_ to a hydrophobic one. All three of these variants are found in subfamily IA. NOTE: Three variant models were created by TIGRFAMs with some overlap among them to cover subfamily IA. This serves the purpose of eliminating the overlap with models of more distantly related HAD subfamilies caused by an overly broad single model.
definition_source: "InterPro:IPR006439 abstract (PRINTS PR00413 is a member signature)"
