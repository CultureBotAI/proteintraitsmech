identifier: PRINTS:PR01237
label: "Tumour necrosis factor c (lymphotoxin-beta) signature"
definition: >-
  Cytokines can be grouped into a family on the basis of sequence, functional and structural similarities. Tumor necrosis factor (TNF) (also known as TNF-alpha or cachectin) is a monocyte-derived cytotoxin that has been implicated in tumour regression, septic shock and cachexia. The protein is synthesised as a prohormone with an unusually long and atypical signal sequence, which is absent from the mature secreted cytokine. A short hydrophobic stretch of amino acids serves to anchor the prohormone in lipid bilayers. Both the mature protein and a partially-processed form of the hormone are secreted after cleavage of the propeptide. There are a number of different families of TNF, but all these cytokines seem to form homotrimeric (or heterotrimeric in the case of LT-alpha/beta) complexes that are recognised by their specific receptors. Lymphotoxin-alpha (LT-alpha or TNF-beta) and lymphotoxin-beta (LT-beta) are related cytokines produced by lymphocytes. The proteins are cytotoxic for a wide range of tumour cells in vitro and in vivo. This entry represents Tumour necrosis factor C (TNFC or LT-beta). The gene is found next to the TNF-LT locus in the major histocompatibility complex (MHC), a region of the MHC with possible linkage to autoimmune disease. It is possible that a surface LT-alpha/LT-beta complex may have a specific role in immune regulation distinct from the functions ascribed to TNF.
definition_source: "InterPro:IPR002961 abstract (PRINTS PR01237 is a member signature)"
