identifier: PRINTS:PR01241
label: "Fungal G protein alpha subunit signature"
definition: >-
  This family consists of the fungal class of G-protein alpha subunits. In Saccharomyces cerevisiae, two GTP-binding alpha subunits of the heterotrimeric G protein have been identified, Gpa1 and Gpa2. Gpa1 interacts with yeast pheromone receptors (Ste2 or Ste3) that initiate the signalling response leading to mating between haploid a and alpha cells. The exchange of GDP for GTP on Gpa1 alters its interaction with the G protein beta subunit Ste4, leading to dissociation of the G protein beta-gamma dimer Ste4-Ste18. The dissociated subunits activate the downstream pheromone signalling MAP kinase cascade that induce changes necessary to produce mating-competent cells. Gpa2 interacts with Gpr1, a GPCR which has signalling role in response to nutrients. The sequence identity between different fungal alpha subunits is relatively low and is equivalent to the level of similarity observed between mammalian alpha subtypes. The GTP-binding and hydrolysis regions, however, show remarkable conservation. Guanine nucleotide binding proteins (G-proteins) are membrane-associated, heterotrimeric proteins composed of three subunits: alpha ( InterPro:IPR001019 ), beta ( InterPro:IPR001632 ) and gamma ( InterPro:IPR001770 ). G proteins and their receptors (GPCRs) form one of the most prevalent signalling systems in mammalian cells, regulating systems as diverse as sensory perception, cell growth and hormonal regulation. At the cell surface, the binding of ligands such as hormones and neurotransmitters to a GPCR activates the receptor by causing a conformational change, which in turn activates the bound G protein on the intracellular-side of the membrane. The activated receptor promotes the exchange of bound GDP for GTP on the G protein alpha subunit. GTP binding changes the conformation of sw
