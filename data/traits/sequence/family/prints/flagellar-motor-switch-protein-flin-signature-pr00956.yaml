identifier: PRINTS:PR00956
label: "Flagellar motor switch protein FliN signature"
definition: >-
  The flagellar motor switch in Escherichia coli and Salmonella typhimurium regulates the direction of flagellar rotation and hence controls swimming behaviour. The switch is a complex apparatus that responds to signals transduced by the chemotaxis sensory signalling system during chemotactic behaviour. The switch complex comprises at least three proteins - FliG, FliM and FliN. It has been shown that FliG interacts with FliM, FliM interacts with itself, and FliM interacts with FliN. The proteins are not particularly hydrophobic and may be peripheral to the membrane, possibly mounted on the basal body M ring. This entry represents the flagellar motor switch proteins FliN and FliY, and proteins related with type III secretion system such as hrcQb and SsaQ. Members of this group of proteins are mainly found in bacteria.
