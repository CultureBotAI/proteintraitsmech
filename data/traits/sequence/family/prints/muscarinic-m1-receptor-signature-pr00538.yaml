identifier: PRINTS:PR00538
label: "Muscarinic M1 receptor signature"
definition: >-
  Muscarinic acetylcholine receptors are members of rhodopsin-like G-protein coupled receptor family. They play several important roles; they mediate many of the effects of acetylcholine in the central and peripheral nervous system and modulate a variety of physiological functions, such as airway, eye and intestinal smooth muscle contraction, heart rate and glandular secretions. The receptors have a widespread tissue distribution and are a major drug target in human disease. They may be effective therapeutic targets in Alzheimer's disease, schizophrenia, Parkinson's disease and chronic obstructive pulmonary disease. Muscarinic acetylcholine receptor M1 it is common in exocrine glands and the CNS, being is particularly abundant in the cerebal cortex and hippocampus. The receptors have also been also found on esophageal smooth muscle and bladder tissue. Their distribution largely overlaps with that of M3 and M4 receptors. M1 receptors are involved in mediating higher cognitive processes, such as learning and memory. They also play a role in regulation of locomotor activity and in salivation.
definition_source: "InterPro:IPR002228 abstract (PRINTS PR00538 is a member signature)"
