identifier: PRINTS:PR01990
label: "H-2 class II histocompatibility antigen gamma chain (CD74 antigen) signature"
definition: >-
  The CD74 antigen (also known as H-2 class II histocompatibility antigen gamma chain, MHC class II-associated invariant chain, Ia antigen-associated invariant chain, or Ii) plays a key role in MHC class II antigen processing: it stabilises peptide-free class II alpha/beta heterodimers in a nonameric (α-β-gamma)3 complex after their synthesis, and directs transport of the complex from the endoplasmic reticulum to compartments where peptide loading of class II takes place.
definition_source: "InterPro:IPR022339 abstract (PRINTS PR01990 is a member signature)"
