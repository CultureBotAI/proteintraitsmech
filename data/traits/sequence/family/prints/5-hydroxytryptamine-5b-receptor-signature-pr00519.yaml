identifier: PRINTS:PR00519
label: "5-hydroxytryptamine 5B receptor signature"
definition: >-
  5-hydroxytryptamine (5-HT) or serotonin, is a neurotransmitter that it is primarily found in the gastrointestinal (GI) tract, platelets, and in the central nervous system (CNS). It is implicated in a vast array of physiological and pathophysiological pathways. Receptors for 5-HT mediate both excitatory and inhibitory neurotransmission, and modulate the release of many neurotransmitters including glutamate, GABA, dopamine, epinephrine/norepinephrine, and acetylcholine, as well as many hormones, including oxytocin, prolactin, vasopressin and cortisol. In the CNS, 5-HT receptors can influence various neurological processes, such as aggression, anxiety and appetite and, as a, result are the target of a variety of pharmaceutical drugs, including many antidepressants, antipsychotics and anorectics. The 5-HT receptors are grouped into a number of distinct subtypes, classified according to their antagonist susceptibilities and their affinities for 5-HT. With the exception of the 5-HT3 receptor, which is a ligand-gated ion channel, all 5-HT receptors are members of the rhodopsin-like G protein-coupled receptor family, and they activate an intracellular second messenger cascade to produce their responses. This entry represents the 5-HT5B receptor. As yet it has only been experimentally characterised in rodents, but not in humans. The 5HT5B protein has a structure consistent with GPCRs, however, the human 5-HT5B gene does not encode a functional protein, because its coding sequence is interrupted by stop codons. It is believed that the function of the 5HT5B receptor has been replaced in humans by some other subclass of 5-HT receptor. In the CNS, it is found in the habenula, hippocampus and inferior olivary of rat brains. Known agonists for 5-HT5B include ergotamine and LSD, and kn
