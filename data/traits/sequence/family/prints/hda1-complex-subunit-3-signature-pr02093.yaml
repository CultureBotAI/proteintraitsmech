identifier: PRINTS:PR02093
label: "HDA1 complex subunit 3 signature"
definition: >-
  HDA3 is required for activity of HDA1 histone deacetylase complex. It can form heterodimer with HDA2. At least one HDA1 homodimer and one HDA2/HDA3 heterodimer are needed to form the HDA1 histone deacetylase complex. The HDA1 histone deacetylase complex is responsible for the deacetylation of lysine residues on the N-terminal part of the core histones (H2A, H2B, H3 and H4). Histone deacetylation gives a tag for epigenetic repression and plays an important role in transcriptional regulation, cell cycle progression and developmental events.
