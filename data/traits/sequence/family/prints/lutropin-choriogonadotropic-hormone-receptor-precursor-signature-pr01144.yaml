identifier: PRINTS:PR01144
label: "Lutropin-choriogonadotropic hormone receptor precursor signature"
definition: >-
  Glycoprotein hormone receptors are members the rhodopsin-like G-protein coupled receptor (GPCR) family. They function as receptors for the pituitary hormones thyrotropin (TSH receptor), follitropin (FSH receptor) and lutropin (LH receptor). In mammals the LH receptor is also the receptor for the placental hormone, human chorionic gonadotropin (hCG), so is denominated as a lutropin-choriogonadotropic hormone receptor (LHCG receptor). The receptors share close sequence similarity, and are characterised by large extracellular domains believed to be involved in hormone binding via leucine-rich repeats (LRR). The beta subunits of the luteinizing hormone and human chorionic gonadotropin are closely related in sequence and elicit their biological actions via the same receptor. LH is released from the anterior pituitary under the influence of gonadotrophin-releasing hormone and progesterones. hCG is released by the placenta during pregnancy. In females, LH stimulates ovulation and is the major hormone involved in the regulation of progesterone secretion by the corpus luteum. In males, it stimulates Leydig cells to secrete androgens, particularly testosterone. This entry represents lutropin-choriogonadotropic hormone receptor (LCGR), also known as luteinizing hormone-choriogonadotropin receptor (LHCGR), or luteinizing hormone receptor (LH receptor). It is a transmembrane receptor found predominantly in organs invloved in reproductive biology such as the ovary and testis. The receptor interacts with both luteinizing hormone and human chorionic gonadotropins and represents a G protein-coupled receptor, rhodopsin-type (GPCRA). Its activation is necessary for the hormonal functioning during reproduction and activates adenylyl cyclase through G proteins.
