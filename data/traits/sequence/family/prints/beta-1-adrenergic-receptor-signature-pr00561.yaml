identifier: PRINTS:PR00561
label: "Beta-1 adrenergic receptor signature"
definition: >-
  The adrenoceptors (or adrenergic receptors) are rhodopsin-like G protein-coupled receptors that are targets of the catecholamines, especially norepinephrine (noradrenaline) and epinephrine (adrenaline). Many cells possess these receptors, and the binding of a catecholamine to the receptor will generally stimulate the sympathetic nervous system, effect blood pressure, myocardial contractile rate and force, airway reactivity, and a variety of metabolic and central nervous system functions. The clinical uses of adrenergic compounds are vast. Agonists and antagonists interacting with adrenoceptors have proved useful in the treatment of a variety of diseases, including hypertension, angina pectoris, congestive heart failure, asthma, depression, benign prostatic hypertrophy, and glaucoma. These drugs are also useful in several other therapeutic situations including shock, premature labour and opioid withdrawal, and as adjuncts to general anaesthetics. There are three classes of adrenoceptors, based on their sequence similarity, receptor pharmacology and signalling mechanisms. These three classes are alpha 1 (a Gq coupled receptor), alpha 2 (a Gi coupled receptor) and beta (a Gs coupled receptor), and each can be further divided into subtypes. The different subtypes can coexist in some tissues, but one subtype normally predominates. There are three subtypes of beta adrenoceptors (beta 1-3), the division is mainly based on their affinities to adrenergic agonists and antagonists. All three subtypes act in the main by activating a Gs protein, activating adenylate cyclase activity. The beta 2 subtype also couples to Gi/o protein. Beta adrenoceptor selective agonists (beta blockers) are used in the treatment of asthma, angina, cardiac conditions and have proven useful in the treatm
