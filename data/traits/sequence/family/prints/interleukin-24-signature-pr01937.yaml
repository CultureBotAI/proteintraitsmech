identifier: PRINTS:PR01937
label: "Interleukin-24 signature"
definition: >-
  Interleukins (IL) are a group of cytokines that play an important role in the immune system. They modulate inflammation and immunity by regulating growth, mobility and differentiation of lymphoid and other cells. Interleukin-24 (IL-24, also known as melanoma differentiation-associated gene-7) belongs to the family of IL-10-related cytokines, which includes IL-10, -19, -20, -22, -24 and -26. It has been proposed, based on the expression pattern of IL-24 and its receptors, that the cytokine may play a role in epidermal functions, such as wound healing. IL-24 has also been shown to possess cancer-specific apoptosis-inducing activity, and has therefore been suggested as a potential anti-cancer agent. This entry represents interleukin-24.
definition_source: "InterPro:IPR020444 abstract (PRINTS PR01937 is a member signature)"
