identifier: PRINTS:PR00888
label: "Smooth muscle protein/calponin family signature"
definition: >-
  Calponin is a smooth muscle-specific, actin-, tropomyosin- and calmodulin-binding protein believed to be involved in regulation or modulation of contraction; interaction of the protein with actin inhibits actomyosin MgATPase activity. Multiple isoforms are found in smooth muscle. Calponin is a basic protein of ~34 Kd. The protein contains three repeats of a well-conserved 26-residue domain (see InterPro:IPR000557 ).
definition_source: "InterPro:IPR003096 abstract (PRINTS PR00888 is a member signature)"
