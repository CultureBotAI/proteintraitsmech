identifier: PRINTS:PR00158
label: "Rusticyanin signature"
definition: >-
  Rusticyanin is a blue copper protein, described in an obligate acidophilic chemolithoautroph, Acidithiobacillus ferrooxidans, as an electron transfer protein. It can constitute up to 5 percent of protein in cells grown on Fe(II) and is thought to be part of an electron chain for Fe(II) oxidation, with two c-type cytochromes, an aa3-type cytochrome oxidase, and 02 as terminal electron acceptor. It is rather closely related to sulfocyanin ( InterPro:IPR010532 ).
definition_source: "InterPro:IPR001243 abstract (PRINTS PR00158 is a member signature)"
