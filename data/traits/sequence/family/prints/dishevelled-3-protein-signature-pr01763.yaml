identifier: PRINTS:PR01763
label: "Dishevelled-3 protein signature"
definition: >-
  Dishevelled (Dsh) proteins possess three conserved domains: an amino-terminal DIX domain, a central PDZ and a carboxyl-terminal DEP domain. They acts downstream of Fz receptors in the Wnt signalling pathway, which controls a variety of developmental and homeostatic events. Dishevelled-3 (DVL-3) may play a role in the signal transduction pathway mediated by multiple Wnt genes.
