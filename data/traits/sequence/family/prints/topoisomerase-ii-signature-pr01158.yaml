identifier: PRINTS:PR01158
label: "Topoisomerase II signature"
definition: >-
  This entry represents DNA topoisomerase II enzymes from eukaryotes and viruses. Topoisomerase II primarily functions in introducing negative supercoils into DNA, and is of particular importance during the segregation of chromosomes during mitosis. In eukaryotes and viruses, this enzyme occurs as a single polypeptide, with the N-terminal portion (homologous to subunit B of bacterial topoisomerase II, or gyraseB) responsible for ATPase activity and the C-terminal portion (homologous to subunit A of bacterial topoisomerase II, or gyraseA) responsible for the breaking-rejoining function through its capacity to form protein-DNA bridges. In mammals, there are at least two isozymes of this enzyme, topoisomerases II-alpha and II-beta, which are similar in structure and catalytic properties. The alpha isoform is involved in chromosome condensation and segregation. DNA topoisomerases regulate the number of topological links between two DNA strands (i.e. change the number of superhelical turns) by catalysing transient single-or double-strand breaks, crossing the strands through one another, then resealing the breaks. These enzymes have several functions: to remove DNA supercoils during transcription and DNA replication; for strand breakage during recombination; for chromosome condensation; and to disentangle intertwined DNA during mitosis. DNA topoisomerases are divided into two classes: type I enzymes (; topoisomerases I, III and V) break single-strand DNA, and type II enzymes (; topoisomerases II, IV and VI) break double-strand DNA. Type II topoisomerases are ATP-dependent enzymes, and can be subdivided according to their structure and reaction mechanisms: type IIA (topoisomerase II or gyrase, and topoisomerase IV) and type IIB (topoisomerase VI). These enzymes are responsible f
