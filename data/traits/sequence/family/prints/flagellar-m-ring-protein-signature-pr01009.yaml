identifier: PRINTS:PR01009
label: "Flagellar M-ring protein signature"
definition: >-
  This family corresponds to the FliF protein. FliF is the major protein of the M-ring in bacterial flagellar basal body. The basal body consists of four rings (L,P,S and M) surrounding the flagellar rod, which is believed to transmit motor rotation to the filament. The M ring is integral to the inner membrane of the cell, and may be connected to the rod via the S (supramembrane) ring, which lies just distal to it. The L and P rings reside in the outer membrane and periplasmic space, respectively. FliF lacks a signal peptide and is predicted to have considerable α-helical structure, including an N-terminal sequence that is likely to be membrane-spanning. Overall, however, FliF has a relatively hydrophilic sequence, with a high charge density, especially towards its C terminus.
definition_source: "InterPro:IPR000067 abstract (PRINTS PR01009 is a member signature)"
