identifier: PRINTS:PR01700
label: "CD34 antigen signature"
definition: >-
  The CD34 group of monoclonal antibodies recognises CD34 (also termed CD34 antigen), a 105-120kDa cell surface glycoprotein, which is selectively expressed by human myeloid and lymphoid progenitor cells, including the haemopoietic stem cell. The protein is also expressed on vascular endothelial cells. Here, it is concentrated on the surface of the inter-digitating processes, suggesting a possible involvement in cell interactions or adhesion, by mediating the attachment of stem cells to the bone marrow extracellular matrix, or directly to stromal cells. The restricted pattern of expression of CD34 in haemopoiesis suggests that it may have a significant function in the earliest stages of blood cell differentiation in the bone marrow. CD34 is a phosphoprotein shown to be activated by protein kinase C (PKC) in a developmental stage-specific manner. Analysis of the human CD34 sequence reveals that the protein appears to be a type I transmembrane (TM) molecule. The predicted internal portion of the protein appears to retain basic amino acid residues adjacent to Ser residues, presenting at least two potential target sites for PKC phosphorylation. In addition, there are two other consensus motifs that correspond to potential target sites for Ca+/calmodulin-dependent kinase and/or protease activated kinase I. The protein is not strongly similar to other known proteins, but some weak similarities do exist: e.g., to the S+T region (a region rich in potential O-linked carbohydrate attachment sites), the TM domain and cytoplasmic domain of cell surface proteins such as leukosialin, a major sialoglyco-protein of rat and human leukocytes; to the N-terminal glycosylated region of CD45 (the leukocyte common antigen); and to groups of interrelated proteins involved in cell adhesion or the
