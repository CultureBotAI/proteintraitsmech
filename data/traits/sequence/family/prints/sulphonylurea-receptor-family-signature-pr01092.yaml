identifier: PRINTS:PR01092
label: "Sulphonylurea receptor family signature"
definition: >-
  This entry represents the ATP-binding cassette sub-family C member 8 and 9 (ABCC8/9, also known as sulfonylurea receptors SUR1/2), a subunit of the beta cell potassium channel (KATP) that associates with certain K + channel inward rectifier subunits to form ATP-sensitive K + channels (KATP channels). These are a family of K + channels that are inhibited by intracellular ATP, which can couple metabolic state to cell excitability. Their presence on pancreatic islet beta cells allows the cells to function as metabolic sensors, regulating insulin release in relation to glucose metabolism. Furthermore, SUR is the site of action for the sulfonylurea oral hypoglycemic agents that are used widely for the treatment of non-insulin dependent diabetes mellitus. When these agents bind to the sulfonylurea receptor, they reduce KATP channel activity, stimulating insulin release. SUR1/2 are ABC transporter-like proteins that belong to the ABC transporter family. These proteins are encoded by two closely related genes, of which the second form has three splice variants. They contain 13-17 transmembrane (TM) domains, with two adenosine nucleotide binding sites nestled in between two nucleotide binding domains (NBDs). SUR1 has been described as an ADP sensor. Mutations in SUR genes have been characterised; these can result in truncations of the second predicted nucleotide binding fold, leading to persistent hyperinsulinemic hypoglycemia of infancy, a rare familial disorder characterised by excessive, unregulated insulin secretion.
