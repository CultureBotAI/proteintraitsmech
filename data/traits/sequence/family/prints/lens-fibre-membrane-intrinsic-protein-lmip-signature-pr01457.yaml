identifier: PRINTS:PR01457
label: "Lens fibre membrane intrinsic protein (LMIP) signature"
definition: >-
  The epithelial membrane proteins (EMP-1, -2 and -3), peripheral myelin protein 22 (PMP22), and lens fibre membrane intrinsic protein (LMIP) comprise a protein family on the basis of sequence and structural similarities. Each family member is a small hydrophobic membrane glycoprotein, ~160-170 amino acids in length, and shares a common predicted transmembrane (TM) topology of 4 TM domains, with intracellular N- and C-termini. LMIP, previously termed MP17, MP18, MP19 and MP20, is expressed at extremely high levels in the mammalian eye lens, where it is localised to the thicker (16-17nm) cell membrane junctions. Although its function has not been elucidated, it has been shown to co-localise with connexin-46, suggesting that it may be involved in the organisation of junctional plaques. A role for LMIP in signal transduction has also been proposed, as it is phosphorylated by cAMP-dependent kinase and binds calmodulin.
