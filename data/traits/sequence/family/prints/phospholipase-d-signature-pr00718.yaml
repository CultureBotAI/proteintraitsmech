identifier: PRINTS:PR00718
label: "Phospholipase D signature"
definition: >-
  Phosphatidylinositol-glycan-specific phospholipase D is an extracellular amphiphilic glycoprotein. It hydrolyses the inositol phosphate linkage in proteins anchored by phosphatidylinositol glycans, releasing these proteins from the membrane. The enzyme catalyses the reaction: glycoprotein phosphatidylinositol + H 2 O = phosphatidate + glycoprotein inositol
