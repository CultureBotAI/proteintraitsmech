identifier: PRINTS:PR00539
label: "Muscarinic M2 receptor signature"
definition: >-
  Muscarinic acetylcholine receptors are members of rhodopsin-like G-protein coupled receptor family. They play several important roles; they mediate many of the effects of acetylcholine in the central and peripheral nervous system and modulate a variety of physiological functions, such as airway, eye and intestinal smooth muscle contraction, heart rate and glandular secretions. The receptors have a widespread tissue distribution and are a major drug target in human disease. They may be effective therapeutic targets in Alzheimer's disease, schizophrenia, Parkinson's disease and chronic obstructive pulmonary disease. Muscarinic acetylcholine receptor M2 is highly expressed in the heart and has a profound role in the control of myocyte contraction. The release of acetylcholine from vagal parasympathetic neurones reduces the heart beating frequency by acting almost exclusively at M2 muscarinic receptors. The M2 receptor is found at much lower levels in the CNS, where it has limited distribution. It is co-expressed with the M3 muscarinic receptors in smooth muscle and it appears to play a much smaller role in the smooth muscle contractile response. M2 receptors are also expressed in the thermo-regulatory centres of the hypothalamus and are likely to be involved in the regulation of body temperature.
