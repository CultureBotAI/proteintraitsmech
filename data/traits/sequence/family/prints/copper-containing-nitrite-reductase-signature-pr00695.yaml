identifier: PRINTS:PR00695
label: "Copper containing nitrite reductase signature"
definition: >-
  These enzymes are involved in nitrate assimilation in the denitrification pathway. The 3D structure of the copper-containing nitrite reductase (NIR) from Achromobacter cycloclastes has been determined to 2.3A resolution. The enzyme is a trimer, each monomer of which contains two Greek key β-barrel domains (similar to that of plastocyanin) and houses two copper sites. The two copper atoms in the monomer comprise a type I copper site (Cu-I: two His, one Cys and one Met ligand) that plays a crucial role for electron transfer from pseudoazurin to the type II copper site (Cu-II: three His and one solvent ligand), the catalytic centre of NIR for the reduction of nitrite. The Cu-II site lies at the bottom of a 12A deep solvent channel and is the site to which the substrate (NO2-) binds.
definition_source: "InterPro:IPR001287 abstract (PRINTS PR00695 is a member signature)"
