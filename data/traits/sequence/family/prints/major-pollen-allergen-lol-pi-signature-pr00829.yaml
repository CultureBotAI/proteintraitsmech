identifier: PRINTS:PR00829
label: "Major pollen allergen Lol pI signature"
definition: >-
  Grass pollens are a major cause of type I allergy. Lol pI, the major rye grass (Lolium perenne) allergen, is a 240-amino acid protein. Analysis of the amino acid sequence has revealed a determinant within the Lol pI molecule that is recognised by human leukocyte antigen class II-restricted T cells obtained from patients allergic to rye grass pollen.
