identifier: PRINTS:PR01556
label: "Type IV secretion system CagX conjugation protein signature"
definition: >-
  Helicobacter pylori makes use of a type IV secretion system similar in mechanism to the conjugation machine of Agrobacterium tumefaciens. These machines secrete three different types of substrate: DNA conjugation intermediates, as in A. tumefaciens; multimeric proteins such as the pertussis toxin of Bordetella pertussis; and the CagA protein of H. pylori. CagA has been linked to the more severe forms of gastric ulcers and duodenal cancers. Both CagA and the secretion system apparatus are encoded in the large pathogenicity island, termed cag, possessed by the malignant disease-causing type I bacterial strains. CagX is found on this pathogenicity island; mutants lacking the gene fail to induce pathogenicity in an infected mouse model. CagX is thought to play a role in the process of conjugation.
definition_source: "InterPro:IPR004357 abstract (PRINTS PR01556 is a member signature)"
