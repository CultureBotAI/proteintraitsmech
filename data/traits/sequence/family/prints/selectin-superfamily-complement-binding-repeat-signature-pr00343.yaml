identifier: PRINTS:PR00343
label: "Selectin superfamily complement-binding repeat signature"
definition: >-
  Animal lectins display a wide variety of architectures. They are classified according to the carbohydrate-recognition domain (CRD) of which there are two main types, S-type and C-type. C-type lectins InterPro:IPR001304 display a wide range of specificities. They require Ca 2+ for their activity. They are found predominantly but not exclusively in vertebrates. They can be classified into a number of subgroups based on their function and structure: Endocytic lectins -Membrane-bound receptors that mediate endocytosis of glycoproteins Collectins -Represented by the soluble mannose-binding proteins of mammalian serum and liver Selectins -Membrane-bound proteins involved in inflammation. There are three main divisions, CD62E, CD62 L and CD62P. CD62E (also called E-selectin, ELAM-1 or LECAM-2), CD62L (also called L-selectin, LAM-1, LECAM-1, Leu-8, MEL-14 or TQ-1) and CD62P (also called P-selectin, granule membrane protein-140, GMP-140 or platelet activation dependent granule-external membrane protein, PADGEM) belong to this group. CD62E mediates leukocyte rolling on activated endothelium at inflammatory sites and may also support tumor cell adhesion during hematogenous metastasis, and play a role in angiogenesis. CD62L mediates lymphocyte homing to high endothelial venules of peripheral lymphoid tissue and leukocyte rolling on activated endothelium at inflammatory sites. Interaction of CD62P with PSGL-1 mediates tethering and rolling of leukocytes on the surface of activated endothelial cells, the first step in leukocyte extravasation and migration towards inflammations. CD62P mediates rolling of platelets on endothelial cells and CD62P-mediated interactions are also involved in platelet-mediated delivery of lymphocytes to high endothelial venules. Members of the selectin supe
