identifier: PRINTS:PR01876
label: "Myeloid transforming gene on chromosome 8 (MTG8) protein signature"
definition: >-
  Protein CBFA2T1 is a transcriptional corepressor which facilitates transcriptional repression via its association with DNA-binding transcription factors and recruitment of other corepressors and histone-modifying enzymes. It can repress the expression of MMP7 in a ZBTB33-dependent manner and can repress transactivation mediated by TCF12.
