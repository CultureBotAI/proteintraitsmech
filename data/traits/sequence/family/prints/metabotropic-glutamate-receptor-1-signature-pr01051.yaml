identifier: PRINTS:PR01051
label: "Metabotropic glutamate receptor 1 signature"
definition: >-
  The mRNA for GRM1 is widespread in the brain and is abundant in neuronal cells in hippocampal dentate gyrus and CA2-3 regions, cerebellum Purkinje cells, olfactory bulb and thalamic nuclei. GRM1 activates the phosphoinositide pathway. It is thought to participate in the central action of glutamate in the CNS, such as long-term potentiation in the hippocampus and long-term depression in the cerebellum. Like GRM5 [ InterPro:IPR000202 ], it is a potential therapeutic target for several diseases. Crystallisation of its seven transmembrane domain shows a similar structure to this seen in the entire GPCR protein family. G protein-coupled receptors (GPCRs) constitute a vast protein family that encompasses a wide range of functions, including various autocrine, paracrine and endocrine processes. They show considerable diversity at the sequence level, on the basis of which they can be separated into distinct groups. The term clan can be used to describe the GPCRs, as they embrace a group of families for which there are indications of evolutionary relationship, but between which there is no statistically significant similarity in sequence. The currently known clan members include rhodopsin-like GPCRs (Class A, GPCRA), secretin-like GPCRs (Class B, GPCRB), metabotropic glutamate receptor family (Class C, GPCRC), fungal mating pheromone receptors (Class D, GPCRD), cAMP receptors (Class E, GPCRE) and frizzled/smoothened (Class F, GPCRF). GPCRs are major drug targets, and are consequently the subject of considerable research interest. It has been reported that the repertoire of GPCRs for endogenous ligands consists of approximately 400 receptors in humans and mice. Most GPCRs are identified on the basis of their DNA sequences, rather than the ligand they bind, those that are unmatche
