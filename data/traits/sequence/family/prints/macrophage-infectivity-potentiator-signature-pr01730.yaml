identifier: PRINTS:PR01730
label: "Macrophage infectivity potentiator signature"
definition: >-
  Legionella pneumophila, the causative agent of Legionnaire's disease, is a facultative intracellular microbe that commonly infects human lung monocytes and macrophages and causes pneumonia. It is water-borne and highly virulent, relying on several specific pathogenic factors to invade and infect the alveolar tissue. However, once grown to stationary phase in culture, the pathogen spontaneously converts to an avirulent state.
