identifier: PRINTS:PR00736
label: "Glycosyl hydrolase family 15 signature"
definition: >-
  This entry represents glucoamylase (GA), also known as glucan 1,4-alpha-glucosidase, which belongs to family 15 (CAZy:GH15) in the classification of glycosyl hydrolases. GA catalyses the release of D-glucose from the non-reducing ends of starch and other oligo- or polysaccharides. Studies of fungal GA have indicated 3 closely-clustered acidic residues that play a role in the catalytic mechanism. This region is also conserved in a recently sequenced bacterial GA. The 3D structure of the pseudo-tetrasaccharide acarbose complexed with glucoamylase II(471) from Aspergillus awamori var. X100 has been determined to 2.4A resolution. The protein belongs to the mainly-α class, and contains 19 helices and 9 strands.
definition_source: "InterPro:IPR000165 abstract (PRINTS PR00736 is a member signature)"
