identifier: PRINTS:PR01201
label: "Noradrenaline neurotransmitter transporter signature"
definition: >-
  Neurotransmitter transport systems are integral to the release, re-uptake and recycling of neurotransmitters at synapses. High affinity transport proteins found in the plasma membrane of presynaptic nerve terminals and glial cells are responsible for the removal from the extracellular space of released-transmitters, thereby terminating their actions. Plasma membrane neurotransmitter transporters fall into two structurally and mechanistically distinct families. The majority of the transporters constitute an extensive family of homologous proteins that derive energy from the co-transport of Na + and Cl -, in order to transport neurotransmitter molecules into the cell against their concentration gradient. The family has a common structure of 12 presumed transmembrane helices and includes carriers for gamma-aminobutyric acid (GABA), noradrenaline/adrenaline, dopamine, serotonin, proline, glycine, choline, betaine and taurine. They are structurally distinct from the second more-restricted family of plasma membrane transporters, which are responsible for excitatory amino acid transport. The latter couple glutamate and aspartate uptake to the cotransport of Na + and the counter-transport of K +, with no apparent dependence on Cl -. In addition, both of these transporter families are distinct from the vesicular neurotransmitter transporters. The human noradrenaline transporter is the primary target for widely-used tricyclic antidepressant drugs, such as desipramine. Cloning studies have revealed a single noradrenaline transporter isoform. The cDNA sequence predicts a protein of ~617 amino acids, with 12-13 highly hydrophobic regions, as would be expected for a member of the Na + and Cl - -coupled neurotransmitter superfamily. In humans, this protein has been related to generali
