identifier: PRINTS:PR01942
label: "Neurotrophic tyrosine kinase receptor type 3 signature"
definition: >-
  Neurotrophins are a family of secreted proteins that regulate development, maintenance and function of vertebrate nervous systems. They act via two different classes of receptor: p75NTR (a member of the TNF receptor superfamily), and neurotrophic tyrosine kinase receptors (NTRKs) - also known as tropomyosin-related kinases (Trks). NTRK3 (also termed TrkC) is a high-affinity receptor for neurotrophin-3 (NT-3). The receptor is widely expressed in the developing nervous system, and is also found in many non-neuronal tissues. In addition to roles in peripheral nerve cell myelination, mediating the inhibitory effects of NT-3 on this process.
