identifier: PRINTS:PR02076
label: "Protein FYV8 signature"
definition: >-
  Little is known about protein Fyv8 (also known as function required for yeast viability protein 8); however, it seems that the Fyv8 gene is needed for survival upon exposure to K1 killer toxin. It also may be involved in the resistance to unfolded protein response (UPR)-inducing agents.
