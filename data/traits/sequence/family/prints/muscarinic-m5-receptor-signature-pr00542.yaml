identifier: PRINTS:PR00542
label: "Muscarinic M5 receptor signature"
definition: >-
  Muscarinic acetylcholine receptors are members of rhodopsin-like G-protein coupled receptor family. They play several important roles; they mediate many of the effects of acetylcholine in the central and peripheral nervous system and modulate a variety of physiological functions, such as airway, eye and intestinal smooth muscle contraction, heart rate and glandular secretions. The receptors have a widespread tissue distribution and are a major drug target in human disease. They may be effective therapeutic targets in Alzheimer's disease, schizophrenia, Parkinson's disease and chronic obstructive pulmonary disease. The muscarinic acetylcholine M5 receptor is primarily found in the CNS, but is also found in esophageal smooth muscle and in the heart. Binding of acetylcholine to the receptor triggers a number of cellular responses, such as adenylate cyclase inhibition, phosphoinositide degradation, and potassium channel modulation. The receptor has been shown to stimulate gastric acid secretion.
definition_source: "InterPro:IPR000502 abstract (PRINTS PR00542 is a member signature)"
