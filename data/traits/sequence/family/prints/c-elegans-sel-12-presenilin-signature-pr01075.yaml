identifier: PRINTS:PR01075
label: "C.elegans Sel-12 (presenilin) signature"
definition: >-
  This entry includes a group of aspartic peptidases belong to MEROPS peptidase family A22 (presenilin family, clan AD), subfamily A22A (the type example is human presenilin 1) from nematodes. Presenilins are polytopic transmembrane (TM) proteins, mutations in which are associated with the occurrence of early-onset familial Alzheimer's disease, a rare form of the disease that results from a single-gene mutation. They are also thought to be involved in control of Notch signalling, apoptotic signal transduction, or processing of selected proteins, such as the beta-amyloid precursor protein (beta-APP). Presenilin homologues have been identified in species that do not have an Alzheimer's disease correlate suggests that they may have functions unrelated to the disease, homologues having been identified in mouse, Drosophila melanogaster, Caenorhabditis elegans (presenilin sel-12) and other members of the eukarya. In C.elegans, it provides the major presenilin function compared to hop-1 and spe-4. It is required cell-autonomously for correct neurite connectivity of the AIY cholinergic interneurons and their correct functioning in thermotaxis and also for mesodermal patterning of muscle function. Presenilin sel-12 promotes basement membrane gap formation during tissue remodeling. Aspartic peptidases, also known as aspartyl proteases ([ec:3.4.23.-]), are widely distributed proteolytic enzymes known to exist in vertebrates, fungi, plants, protozoa, bacteria, archaea, retroviruses and some plant viruses. All known aspartic peptidases are endopeptidases. A water molecule, activated by two aspartic acid residues, acts as the nucleophile in catalysis. Aspartic peptidases can be grouped into five clans, each of which shows a unique structural fold. Peptidases in clan AA are either bilob
