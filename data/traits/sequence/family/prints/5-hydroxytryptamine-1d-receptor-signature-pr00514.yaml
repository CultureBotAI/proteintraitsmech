identifier: PRINTS:PR00514
label: "5-hydroxytryptamine 1D receptor signature"
definition: >-
  5-hydroxytryptamine (5-HT) or serotonin, is a neurotransmitter that it is primarily found in the gastrointestinal (GI) tract, platelets, and in the central nervous system (CNS). It is implicated in a vast array of physiological and pathophysiological pathways. Receptors for 5-HT mediate both excitatory and inhibitory neurotransmission, and modulate the release of many neurotransmitters including glutamate, GABA, dopamine, epinephrine/norepinephrine, and acetylcholine, as well as many hormones, including oxytocin, prolactin, vasopressin and cortisol. In the CNS, 5-HT receptors can influence various neurological processes, such as aggression, anxiety and appetite and, as a, result are the target of a variety of pharmaceutical drugs, including many antidepressants, antipsychotics and anorectics. The 5-HT receptors are grouped into a number of distinct subtypes, classified according to their antagonist susceptibilities and their affinities for 5-HT. With the exception of the 5-HT3 receptor, which is a ligand-gated ion channel, all 5-HT receptors are members of the rhodopsin-like G protein-coupled receptor family, and they activate an intracellular second messenger cascade to produce their responses. The 5-HT1 receptors are a subfamily of 5-HT receptors that were originally classified according to their inhibition of adenylyl cyclase, degree of sequence similarity and their overlapping pharmacological specificities. The subfamily is comprised of five different receptors 5-HT1A, 5-HT1B, 5-HT1D, 5-HT1E, 5-HT1F, and they can couple to Gi/Go and mediate inhibitory neurotransmission, although signalling via other transduction systems are known. One of the 5-HT1 receptors, the 5-HT1E receptor, is yet to achieve receptor status from the International Union of Basic and Clinical Pha
