identifier: PRINTS:PR00523
label: "Cannabinoid receptor type 2 signature"
definition: >-
  Cannabinoid receptors are a class of cell membrane receptors that belong to the rhodopsin-like G-protein coupled receptor (GPCR) family. Typical of G protein-coupled receptors, cannabinoid receptors contain seven transmembrane spanning domains. Cannabinoid receptors are activated by three major groups of ligands: endocannabinoids, such as N-arachidonoylethanolamine and 2-arachidonoyl glycerol (produced by the mammalian body), plant cannabinoids, such as tetrahydrocannabinol (produced by the plant Cannabis sativa) and synthetic cannabinoids, such as HU-210. Currently, two known cannabinoid receptor subtypes have been identified, CB1 receptor and CB2 receptor, and are phylogenetically restricted to the chordate branch of the animal kingdom. The International Union of Basic and Clinical Pharmacology (IUPHAR) has identified five pharmacological targets that could be used to find new cannabinoid receptors or channels, which has resulted in a number of cannabinoid receptors being considered. TRP vanilloid 1, which is thought to function as an ionotropic cannabinoid receptor, and some deorphanised GPCRs: GPR18, GPR55, GPR119. However, according to the criteria, no channel, non-CB1/CB2 established receptor or deorphanised receptor can currently be classified fully as a novel cannabinoid receptor. This entry represents cannabinoid receptor 2 (CB2), which is found primarily in immune tissue, specifically T cells of the immune system, on macrophages and B cells, and in hematopoietic cells. The CB2 receptor is closely related to CB1 receptor exhibiting 68% homology. The CB2 receptor has been shown to bind cannabinoid and aminoalkylindole compounds and to signal a response through the inhibition of adenylate cyclase. The principal endogenous ligand for the CB2 receptor is 2-arachido
