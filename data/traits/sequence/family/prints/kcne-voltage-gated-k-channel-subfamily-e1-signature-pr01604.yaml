identifier: PRINTS:PR01604
label: "KCNE voltage-gated K+ channel subfamily E1 signature"
definition: >-
  KCNE1 (Potassium voltage-gated channel subfamily E member 1, also known as Mink) subunits associate with KCNQ1 alpha subunits to form channels that are responsible for the IkS currents that determine the duration of the action potential in cardiac muscle. Mutations in both of the genes encoding these subunits cause an inherited disorder that increases the risk of death from cardiac arrhythmia (long QT syndrome type 1) and Jervell and Lange-Nielsen syndrome, associated with congenital deafness. Two types of beta subunit (KCNE and KCNAB) are presently known to associate with voltage-gated alpha subunits (Kv, KCNQ and eag-like). However, not all combinations of alpha and beta subunits are possible. The KCNE family of K+ channel subunits are membrane glycoproteins that possess a single transmembrane (TM) domain. They share no structural relationship with the alpha subunit proteins, which possess pore forming domains. The subunits appear to have a regulatory function, modulating the kinetics and voltage dependence of the alpha subunits of voltage-dependent K+ channels. KCNE subunits are formed from short polypeptides of ~130 amino acids, and are divided into five subfamilies: KCNE1 (MinK/IsK), KCNE2 (MiRP1), KCNE3 (MiRP2), KCNE4 (MiRP3) and KCNE1L (AMMECR2). Potassium channels are the most diverse group of the ion channel family. They are important in shaping the action potential, and in neuronal excitability and plasticity. The potassium channel family is composed of several functionally distinct isoforms, which can be broadly separated into 2 groups: the practically non-inactivating 'delayed' group and the rapidly inactivating 'transient' group. These are all highly similar proteins, with only small amino acid changes causing the diversity of the voltage-dependent gating m
