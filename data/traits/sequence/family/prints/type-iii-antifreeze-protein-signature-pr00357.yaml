identifier: PRINTS:PR00357
label: "Type III antifreeze protein signature"
definition: >-
  Marine teleosts from polar oceans can be protected from freezing in icy sea-water by serum antifreeze proteins (AFPs) or glycoproteins (AFGPs): these function by binding to, and preventing the growth of, ice crystals within the fish. Despite functional similarity, the proteins are structurally diverse and include glycosylated and at least 3 non-glycosylated forms: the AFGP of notothenioids and cods are polymers of a tripeptide repeat, Ala-Ala-Thr, with a disaccharide attached to the threonine residue; type I AFPs are Ala-rich, α-helical peptides found in flounder and sculpin; type II AFPs of sea-raven, smelt and herring are Cys-rich proteins; and type III AFPs, found in eelpouts, are rich in β-structure. As well as antifreeze proteins, entry also includes N-acetylneuraminate-9-phosphate synthase from human and mouse (NANS/SIAS, formerly known sialic acid synthase) covering the C-terminal region. The function of this domain in SIAS is not known, but it may be involved in sugar binding. NANS/SIAS catalyses the condensation of phosphoenolpyruvate (PEP) and N-acetylmannosamine 6-phosphate (ManNAc-6-P) to synthesize N-acetylneuraminate-9-phosphate (Neu5Ac-9-P). It is required for brain and skeletal development.
definition_source: "InterPro:IPR006013 abstract (PRINTS PR00357 is a member signature)"
