identifier: PRINTS:PR01163
label: "Beta-tubulin signature"
definition: >-
  Microtubules are polymers of tubulin, a dimer of two 55kDa subunits, designated alpha and beta. Within the microtubule lattice, α-β heterodimers associate in a head-to-tail fashion, giving rise to microtubule polarity. Fluorescent labelling studies have suggested that tubulin is oriented in microtubules with beta-tubulin toward the plus end. For maximal rate and extent of polymerisation into microtubules, tubulin requires GTP. Two molecules of GTP are bound at different sites, termed N and E. At the E (Exchangeable) site, GTP is hydrolysed during incorporation into the microtubule. Close to the E site is an invariant region rich in glycine residues, which is found in both chains and is thought to control access of the nucleotide to its binding site. Most species, excepting simple eukaryotes, express a variety of closely related alpha- and beta-isotypes. A third family member, gamma tubulin, has also been identified in a number of species. British type familial amyloidosis is an autosomal dominant disease characterised by progressive dementia, spastic paralysis and ataxia. Amyloid deposits from the brain tissue of an individual who died with this disease have been characterised. Trypsin digestion and subsequent N-terminal sequence analysis yielded a number of short sequences, all of which are tryptic fragments of the C-termini of human alpha- and beta-tubulin. Consistent with the definition of amyloid, synthetic peptides based on the sequences of these fragments formed fibrils in vitro, suggesting that the C-termini of both alpha- and beta-tubulin are closely associated with the amyloid deposits of this type of amyloidosis. This entry represents beta tubulin.
