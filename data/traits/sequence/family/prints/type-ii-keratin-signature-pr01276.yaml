identifier: PRINTS:PR01276
label: "Type II keratin signature"
definition: >-
  Intermediate filaments (IF) are proteins which are primordial components of the cytoskeleton and the nuclear envelope. They generally form filamentous structures 8 to 14 nm wide. Type II keratins are the basic or neutral courterparts to the acidic type I keratins. Each type II keratin forms a heterodimer with a specific acidic keratin, and the heterodimers are organised into tetramers and then into chains. Type II keratins consist of head-, rod- and tail-like structures, the rod being constructed from three linked coils: 1A, 1B and 2. The head and tail structures of the type 2 keratins are highly variable low-complexity regions. This protein family also includes Intermediate filament protein ON3 from Carassius auratus (Goldfish), one of the non-neuronal predominant intermediate filament proteins of the visual pathway.
definition_source: "InterPro:IPR003054 abstract (PRINTS PR01276 is a member signature)"
