identifier: PRINTS:PR00325
label: "Germin signature"
definition: >-
  Germins (also known as Oxalate oxidases) and germin-like proteins are a family of hexameric ubiquitous plant glycoproteins. They are not restricted to germinating grains as initially sought and thereof called 'germins', but they exist in all organs and developmental stages. All are at least partly associated with the extracellular matrix. A wide range of function has been uncovered for germins and germin-like proteins: some act as oxalate oxidases (EC:1.2.3.4) or as superoxide dismutase (EC:1.15.1.1), while others seem to be structural proteins or receptors for auxins or proteins. Germin catalyses the manganese-dependent oxidative decarboxylation of oxalate to carbon dioxide and hydrogen peroxide (H2O2). It is widespread in fungi and various plant tissues and may play a role in plant signaling and defense. Germins and germin-like proteins are highly similar to slime mold spherulins 1a and 1b which are proteins that accumulate specifically during spherulation, a process induced by various forms of environmental stress which leads to encystment and dormancy.
