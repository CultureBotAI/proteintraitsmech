identifier: PRINTS:PR00663
label: "Galanin receptor signature"
definition: >-
  Galanin is involved in a variety of physiological mechanisms and disease states, from appetite and neuroregeneration to seizures and pain. The actions of galanin are mediated through interaction with specific membrane receptors. Three receptor subtypes have been identified; Galanin receptor 1 (GALR1), Galanin receptor 2 (GALR2) and Galanin receptor 3 (GAL3), all of which are rhodopsin-like GPCRs. They differ from one another in terms of their expression patterns, affinity for various peptide analogues and G protein-coupling specificity. In signaling, all can act via the Gi/o class, whilst GAL2 also has Gq/11 as a major signaling route. This entry represents the galanin receptor family, it also includes an insect allatostatin receptor, which is similar to mammalian galanin receptors.
definition_source: "InterPro:IPR000405 abstract (PRINTS PR00663 is a member signature)"
