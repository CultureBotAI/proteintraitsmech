identifier: PRINTS:PR01934
label: "Interleukin-19 signature"
definition: >-
  Interleukins (IL) are a group of cytokines that play an important role in the immune system. They modulate inflammation and immunity by regulating growth, mobility and differentiation of lymphoid and other cells. This entry represents interleukin-19.
