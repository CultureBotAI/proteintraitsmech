identifier: PRINTS:PR01779
label: "Lantibiotic leader peptide processing protein signature"
definition: >-
  Lantibiotic genes reside on the bacterial chromosome, where they cluster with genes that adapt and secrete them to the extracellular space. Many of these so-called 'pathogenicity islands' have been characterised, including the epidermin (epi) cluster in Staphylococcus epidermis, and the nisin (nis) cluster in Lactococcus lactis. The gene encoding the lantibiotic is flanked by 3 regulatory genes: 2 that are usually involved in a 2-component regulatory system, and another that cleaves the signal peptide from the precursor to produce the mature lantibiotic. This protein (usually designated with a "P" suffix - nisP, mutP, etc.) is highly conserved amongst pathogenic species, and is essential for virulence and survival of the bacterium against competitors in the host. A novel pathogenicity island in resistant Enterococcus faecalis has been sequenced. In addition to the lantibiotic Cyl gene cluster, this revealed a novel set of virulence factors involved in vancomycin resistance and pathogenicity.
definition_source: "InterPro:IPR008357 abstract (PRINTS PR01779 is a member signature)"
