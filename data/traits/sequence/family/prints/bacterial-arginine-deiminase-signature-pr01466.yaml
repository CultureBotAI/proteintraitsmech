identifier: PRINTS:PR01466
label: "Bacterial arginine deiminase signature"
definition: >-
  This is a family of arginine deiminases,. These enzymes catalyse the conversion of arginine + H2O to citrulline + NH3. The family member from Streptococcus pyogenes has been characterised as an antitumour protein.
