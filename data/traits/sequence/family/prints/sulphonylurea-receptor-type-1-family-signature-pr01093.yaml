identifier: PRINTS:PR01093
label: "Sulphonylurea receptor type 1 family signature"
definition: >-
  ATP-binding cassette subfamily C member 8 (ABCC8, also known as the sulphonylurea receptor SUR1) is a member of the ABC transporter family. ABCC8 is comprised of three transmembrane helical bundles, TMD0, TMD1 and TMD2. It also contains two cytosolic nucleotide binding domains (NBDs) located between TMD1 and TMD2 and in the cytoplasmic C-terminal domain, respectively. It is a regulator of the potassium ATP channel. Its NBD domains control channel activity through their interaction with cytosolic nucleotides.
definition_source: "InterPro:IPR000844 abstract (PRINTS PR01093 is a member signature)"
