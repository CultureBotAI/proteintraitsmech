identifier: PRINTS:PR01413
label: "Cytochrome c-type biogenesis protein NrfE signature"
definition: >-
  Within mitochondria and bacteria, a family of related proteins is involved in the assembly of periplasmic c-type cytochromes: these include CycK, CcmF, NrfE and CcbS. These proteins may play a role in guidance of apocytochromes and haem groups for their covalent linkage by the cytochrome-c-haem lyase. Members of the family are probably integral membrane proteins, with up to 16 predicted transmembrane (TM) helices. A seven-gene operon, designated nrf, has been shown to be essential for formate-dependent nitrite reduction to ammonia by enteric bacteria. Expression of lac fused to nrfA, nrfE or nrfG is regulated by oxygen repression, FNR-dependent anaerobic induction, nitrite induction and nitrate repression during anaerobic growth. NrfE is a hydrophobic, integral membrane protein that shares a high degree of similarity with the CdI1 protein of Rhodobacter capsulatus implicated in the assembly of periplasmic c-type cytochromes. Hydropathy analysis reveals up to 16 putative TM domains.
definition_source: "InterPro:IPR003570 abstract (PRINTS PR01413 is a member signature)"
