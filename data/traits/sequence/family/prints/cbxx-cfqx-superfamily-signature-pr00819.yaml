identifier: PRINTS:PR00819
label: "CbxX/CfqX superfamily signature"
definition: >-
  The Cfx genes in Ralstonia eutropha (Alcaligenes eutrophus) encode a number of Calvin cycle enzymes. The observed sizes of two of the gene products, CfxX and CfxY, are 35kDa and 27kDa respectively. No functions could be assigned to CfxX and CfxY, but CfxQ is required for the expression of rubisco. These proteins show a high degree of similarity to the Bacillus subtilis stage V sporulation protein K.
definition_source: "InterPro:IPR000641 abstract (PRINTS PR00819 is a member signature)"
