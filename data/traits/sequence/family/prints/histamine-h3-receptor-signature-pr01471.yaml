identifier: PRINTS:PR01471
label: "Histamine H3 receptor signature"
definition: >-
  This entry represents the histamine H3 receptor (also known as HH3R), which functions as presynaptic autoreceptor on histamine-containing neurones. The H3 receptor is expressed abundantly in the CNS, with highest levels found in the thalamus, caudate nucleus, cortex, hypothalamus, hippocampus and olfactory tubercle. The diverse expression of H3 receptors throughout the cortex indicates an ability to modulate a large number of neurotransmitters such as acetylcholine, dopamine, GABA, norepinephrine and serotonin in the peripheral and CNS. However, H3 receptor distribution in the periphery is quite specific - low levels have been detected in the human small intestine, testis and prostate, but not in a number of other tissues tested, including the lung and spleen. There has been some evidence of expression in the heart and brain. Histamine plays an important role in a variety of pathophysiological conditions. In allergic conditions, histamine is released from basophils and mast cells and is responsible for symptoms of allergic conditions of the skin and airways. In the gastric mucosa, gastric induced histamine release stimulates parietal cells to secrete gastric acid. In the central nervous system (CNS), histamine is synthesized in specific neurons that are localized in the posterior hypothalamus. These neurons are involved in a variety of important physiological functions, including the regulation of the sleep-wake cycle, cardiovascular control, regulation of the hypothalamic pituitary adrenal-axis, learning and memory. Histamine exerts its biological effects by binding to and activating four distinct separate rhodopsin-like G protein-coupled receptors-histamine H1 receptor, histamine H2 receptor, histamine H3 receptor, and histamine H4 receptor. Each of the histamine rece
