identifier: PRINTS:PR00282
label: "Snake cytotoxin signature"
definition: >-
  Snake toxins belong to a family of proteins which groups short and long neurotoxins, cytotoxins and short toxins, as well as a other miscellanous venom peptides. Cytotoxins (CTs) are small (~60 amino acids) proteins, which are abundant in the venom of the snakes of the Elapidae family. The cytotoxic properties of CTs are mediated by their interaction with the cell membrane. Mu-elapitoxin-Na1a is a highly selective and potent inhibitor of inhibitor of the hNav1.8/SCN10A channel and acts reversibly. In rodent models it has a potent analgesic effect and displayed no evident cytotoxicity and cardiotoxicity or obvious adverse responses being a promising analgesic to manage pain. This family consists mainly of cytotoxins from the Naja genus of snakes (cobras).
definition_source: "InterPro:IPR003572 abstract (PRINTS PR00282 is a member signature)"
