identifier: PRINTS:PR00825
label: "Vespid venom allergen phospholipase A1 signature"
definition: >-
  The two principal allergenic proteins in vespid venoms are antigen 5s and phospholipases. The complete amino acid sequences of the venom phospholipase A1 from the yellow jacket, Vespula maculifrons, and the more acidic isoenzyme from the white faced hornet, Dolichovespula maculata, have been determined. The proteins, which contain approximately 300 amino acid residues, show no sequence similarity to other known phospholipases, but do have some similarity to mammalian lipases (~40% identity over 123 residues). Experimental evidence suggests that these phospholipases have weak lipase activity. This type of phospholipase allergens can also be found in other arthropods.
definition_source: "InterPro:IPR002334 abstract (PRINTS PR00825 is a member signature)"
