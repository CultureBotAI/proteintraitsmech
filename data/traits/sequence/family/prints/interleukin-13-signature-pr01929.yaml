identifier: PRINTS:PR01929
label: "Interleukin-13 signature"
definition: >-
  This entry represents interleukin-13 (IL-13), it is a pleiotropic cytokine which may be important in the regulation of the inflammatory and immune responses. IL-13 inhibits inflammatory cytokine production and synergises with IL-2 in regulating interferon-gamma synthesis. The sequences of IL-4 and IL-13 are distantly related.
