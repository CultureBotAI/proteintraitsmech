identifier: PRINTS:PR01212
label: "Alpha-synuclein signature"
definition: >-
  Synucleins are small, soluble proteins expressed primarily in neural tissue and in certain tumours. The family includes three known proteins: alpha-synuclein, beta-synuclein, and gamma-synuclein. All synucleins have in common a highly conserved α-helical lipid-binding motif with similarity to the class-A2 lipid-binding domains of the exchangeable apolipoproteins. Synuclein family members are not found outside vertebrates, although they have some conserved structural similarity with plant 'late-embryo-abundant' proteins. The alpha- and beta-synuclein proteins are found primarily in brain tissue, where they are seen mainly in presynaptic terminals. The gamma-synuclein protein is found primarily in the peripheral nervous system and retina, but its expression in breast tumors is a marker for tumor progression. Normal cellular functions have not been determined for any of the synuclein proteins, although some data suggest a role in the regulation of membrane stability and/or turnover. Mutations in alpha-synuclein are associated with rare familial cases of early-onset Parkinson's disease, and the protein accumulates abnormally in Parkinson's disease, Alzheimer's disease, and several other neurodegenerative illnesses. This entry represents alpha-synuclein, which regulates synaptic vesicle trafficking and subsequent neurotransmitter release. It also acts as a molecular chaperone in its multimeric membrane-bound state, assisting in the folding of SNAREs. Synelfin from the zebra finch is a homologue of the human alpha-synuclein and may serve a novel function critical to the regulation of vertebrate neural plasticity. It is regulated during the critical period for song learning.
