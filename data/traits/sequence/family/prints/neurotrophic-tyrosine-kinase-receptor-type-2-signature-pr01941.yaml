identifier: PRINTS:PR01941
label: "Neurotrophic tyrosine kinase receptor type 2 signature"
definition: >-
  Neurotrophins are a family of secreted proteins that regulate development, maintenance and function of vertebrate nervous systems. They act via two different classes of receptor: p75NTR (a member of the TNF receptor superfamily), and neurotrophic tyrosine kinase receptors (NTRKs) - also known as tropomyosin-related kinases (Trks). This entry represents NTRK2 (also termed TrkB) is a high-affinity receptor for brain-derived neurotrophic factor (BDNF) and neurotrophin (NT-4). It is broadly expressed in the nervous system, and is also found in some non neural tissues. The receptor is involved in synaptogenesis and neuronal development. It plays a crucial role in learning and memory.
