identifier: PRINTS:PR02109
label: "Mas-related G protein-coupled receptor A signature"
definition: >-
  This entry represents mas-related G protein-coupled receptor A, it is found in rodents and is expressed only in specific subsets of sensory neurons that are known to detect painful stimuli. The receptor is coupled to the Galpha (q/11) signalling pathway, and potently activated by members of the rf-amide(npff/npaf) neuropeptide family. Stimulation by rf-amide agonists results in a dose-dependent release of free cytoplasmic Ca2+. Members of the mas-related receptor family (also known as oncogene-like MAS and mas-related G-protein coupled receptor MRG) have been implicated in the development, regulation and function of nociceptive neurons, specifically in the modulation of pain. Most members are orphaned, with no endogeneous ligand identified. Of the human mas-related GPCRs, four (MRGPRD, MRGPRE, MRGPRF and MRGPRG) are also found in rodents, whereas MRGPRX1, MRGPRX2, MRGPRX3 and MRGPRX4 are found exclusively in primates. Certain rodent MRGs have been reported to respond to adenine and to RF-amide peptides, including neuropeptide FF, but the relevance of these findings to man is unclear. MRGs are expressed predominantly in small diameter sensory neurons of the dorsal root ganglia, where there is emerging evidence that they may be mediators of histamine-independent itch.
definition_source: "InterPro:IPR026233 abstract (PRINTS PR02109 is a member signature)"
