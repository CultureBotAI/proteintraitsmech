  DNA (cytosine-5-)-methyltransferase (dcm) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00675 (superfamily); catalyses DNA (cytosine-5-)-methyltransferase; associated with DNA (cytosine-5-)-methyltransferase activity, DNA modification.
