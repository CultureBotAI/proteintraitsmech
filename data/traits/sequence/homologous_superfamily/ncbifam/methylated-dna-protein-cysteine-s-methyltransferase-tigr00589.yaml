identifier: NCBIfam:TIGR00589
label: "methylated-DNA--[protein]-cysteine S-methyltransferase"
definition: >-
  methylated-DNA--[protein]-cysteine S-methyltransferase — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00589 (superfamily); catalyses methylated-DNA--[protein]-cysteine S-methyltransferase; associated with methylated-DNA-[protein]-cysteine S-methyltransferase activity, DNA repair.
