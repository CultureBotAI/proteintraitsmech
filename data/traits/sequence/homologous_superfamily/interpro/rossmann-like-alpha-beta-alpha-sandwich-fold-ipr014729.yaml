identifier: InterPro:IPR014729
label: "Rossmann-like alpha/beta/alpha sandwich fold"
definition: >-
  This superfamily represents domains related by a common ancestor that have a Rossmann-like, 3-layer, α/β/α sandwich fold. Protein families in which the domain is found include: Nucleotidylyl transferases ( EC:2.7.7 ) such as cytidylyltransferases, adenylyltransferases. Class I aminoacyl-tRNA synthetases (catalytic domain), such as tyrosyl-tRNA synthetase ( EC:6.1.1.1 ) and glutaminyl-tRNA synthetase ( EC:6.1.1.18 ). Pantothenate synthetases ( EC:6.3.2.1 ). ATP sulphurylase (central domain) N-type ATP pyrophosphatases, such as beta-lactam synthetase ( EC:6.3.3.4 ) and GMP synthase ( EC:6.3.5.2 ). PP-loop ATPases such as the cell cycle protein MesJ (N-terminal domain). Phosphoadenylyl sulphate (PAPS) reductase Electron transfer flavoprotein (ETFP) subunits, such as the N-terminal domains of the alpha and beta subunits. Universal stress protein A (UspA). Cryptochrome and DNA photolyase.
