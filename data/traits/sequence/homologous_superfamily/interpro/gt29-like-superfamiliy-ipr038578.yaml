identifier: InterPro:IPR038578
label: "GT29-like superfamiliy"
definition: >-
  Glycosyltransferase family 29 (CAZy:GT29) comprises enzymes with a number of known activities; sialyltransferase (EC:2.4.99), beta-galactosamide alpha-2,6-sialyltransferase (EC:2.4.99.1), alpha-N-acetylgalactosaminide alpha-2,6-sialyltransferase (EC:2.4.99.3), beta-galactoside alpha-2,3-sialyltransferase (EC:2.4.99.4), N-acetyllactosaminide alpha-2,3-sialyltransferase (EC:2.4.99.6), alpha-N-acetyl-neuraminide alpha-2,8-sialyltransferase (EC:2.4.99.8); lactosylceramide alpha-2,3-sialyltransferase (EC:2.4.99.9). These enzymes use a nucleotide monophosphosugar as the donor (CMP-NeuA) instead of a nucleotide diphosphosugar.
definition_source: InterPro
