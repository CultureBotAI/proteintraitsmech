identifier: InterPro:IPR016039
label: Thiolase-like
definition: >-
  This superfamily represents a structural domain with a thiolase-like 3-layer α/β/α topology. This domain usually occurs in two similar copies that are related by a pseudo-dyad, and which arose through duplication. The proteins in this entry can be split into two groups: those related to thiolase, and those related to chalcone synthase. The thiolase-like enzymes include: Thiolase, where the topology of each domain is similar to the first domain of phosphoglucomutase Beta-ketoacyl-ACP synthases types I (EC:2.3.1.41), II (EC:2.3.1.179) and III (EC:2.3.1.180) Actinorhodin polyketide beta-ketoacyl synthases 1 and 2 Fatty oxidation complex beta subunit (3-ketoacyl-CoA thiolase; EC:2.3.1.16) The chalcone synthase-like enzymes include: Chalcone synthase (EC:2.3.1.74) Ketoacyl-ACP synthase III (FabH; EC:2.3.1.180) Polyketide synthases 3-hydroxy-3-methylglutaryl CoA synthase (EC:2.3.3.10) Dihydropinosylvin synthase
