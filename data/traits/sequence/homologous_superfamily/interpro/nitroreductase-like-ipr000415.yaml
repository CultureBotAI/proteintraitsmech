identifier: InterPro:IPR000415
label: Nitroreductase-like
definition: >-
  This domain superfamily is characteristic of nitroreductase enzymes and related oxidoreductases. Members of this family utilise FMN as a cofactor and are often found to be homodimers. Possible characteristics include Oxygen-insensitive NAD(P)H nitroreductase (FMN-dependent nitroreductase) (Dihydropteridine reductase) (EC:1.5.1.34) and NADH dehydrogenase (EC:7.1.1.2). A number of the proteins are described as oxidoreductases. They are primarily found in bacterial lineages, though a number of eukaryotic homologues have been identified: Caenorhabditis elegans UniProtKB:P34273, Drosophila melanogaster (Fruit fly) UniProtKB:Q8T3Q0 UniProtKB:Q9VTE7, Mus musculus (Mouse) UniProtKB:Q9DCX8 and Homo sapiens (Human) UniProtKB:O75989. This protein is not found in photosynthetic eukaryotes. The sequences containing this entry in photosynthetic organisms are possible false positives.
definition_source: InterPro
trait_axis: SEQUENCE
trait_category: SEQ_HOMOLOGOUS_SUPERFAMILY
term_kind: CLASS
