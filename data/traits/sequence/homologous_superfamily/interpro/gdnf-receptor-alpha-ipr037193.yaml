identifier: InterPro:IPR037193
label: "GDNF receptor alpha"
definition: >-
  Glial cell line-derived neurotrophic factor (GDNF) and neurturin (NTN) receptors are potent survival factors for sympathetic, sensory and central nervous system neurons. GDNF and neurturin promote neuronal survival by signalling through similar multicomponent receptors that consist of a common receptor tyrosine kinase and a member of a GPI-linked family of receptors that determines ligand specificity. Structurally, GDNF is composed of five helices with an irregular disulfide-linked array. It is topologically similar to the fungal elicitin fold ( SUPERFAMILY:48646 ).
