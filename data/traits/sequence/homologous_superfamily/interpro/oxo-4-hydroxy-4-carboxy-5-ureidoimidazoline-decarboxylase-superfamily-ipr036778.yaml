identifier: InterPro:IPR036778
label: "Oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline decarboxylase superfamily"
definition: >-
  The proteins in this entry are OHCU decarboxylase, an enzyme of the purine catabolism that catalyses the conversion of OHCU into S(+)-allantoin; it is the third step of the conversion of uric acid (a purine derivative) to allantoin. Step one is catalysed by urate oxidase (InterPro:IPR002042) and step two is catalysed by hydroxyisourate hydrolase (InterPro:IPR000895).
