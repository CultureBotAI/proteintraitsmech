identifier: InterPro:IPR016176
label: Cobalamin (vitamin B12)-dependent enzyme, catalytic
definition: >-
  This superfamily represents a structural domain with a TIM β/α barrel fold found in cobalamin (vitamin B12)-dependent enzymes, including: N-terminal coenzyme A-binding domain of both the alpha and beta subunits of methylmalonyl-CoA mutase (EC:5.4.99.2) (only the alpha subunit is active). The large subunit of glutamate mutase (EC:5.4.99.1). The alpha subunit of diol dehydratase (EC:4.2.1.28). The large subunit of glycerol dehydratase (EC:4.2.1.30). The alpha subunit of D-lysine 5,6-aminomutase (EC:5.4.3.4).
