identifier: InterPro:IPR036965
label: Terpene synthase, N-terminal domain superfamily
definition: >-
  Sequences containing this domain belong to the terpene synthase family. It has been suggested that this gene family be designated tps (for terpene synthase). Sequence comparisons reveal similarities between the monoterpene (C 10 ) synthases, sesquiterpene (C 15 ) synthases and the diterpene (C 20 ) synthases. It has been split into six subgroups on the basis of phylogeny, called Tpsa-Tpsf. Tpsa includes vetispiridiene synthase UniProtKB:Q39978, 5-epi- aristolochene synthase, UniProtKB:Q40577 and (+)-delta-cadinene synthase UniProtKB:P93665. Tpsb includes (-)-limonene synthase, UniProtKB:Q40322. Tpsc includes copalyl diphosphate synthase (kaurene synthase A), UniProtKB:O04408. Tpsd includes taxadiene synthase, UniProtKB:Q41594, pinene synthase, UniProtKB:O24475 and myrcene synthase, UniProtKB:O24474. Tpse includes ent-kaurene synthase B UniProtKB:Q39548. Tpsf includes linalool synthase UniProtKB:Q9ZPN5. In the fungus Phaeosphaeria sp. (strain L487) the synthesis of ent-kaurene from geranylgeranyl diphosphate is promoted by a single bifunctional protein.
