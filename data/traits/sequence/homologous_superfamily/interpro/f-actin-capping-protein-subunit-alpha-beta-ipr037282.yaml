identifier: InterPro:IPR037282
label: "F-actin-capping protein subunit alpha/beta"
definition: >-
  The F-actin capping protein binds in a calcium-independent manner to the fast growing ends of actin filaments (barbed end) thereby blocking the exchange of subunits at these ends. Unlike gelsolin and severin this protein does not sever actin filaments. The F-actin capping protein is a heterodimer composed of two unrelated subunits: alpha (InterPro:IPR002189) and beta (InterPro:IPR001698). Neither of the subunits shows sequence similarity to other filament-capping proteins. This entry represents the alpha and beta subunits of the F-actin-capping protein. The alpha subunit (CAPZA) is a protein of about 268 to 286 amino acid residues and the beta subunit (CAPZB) is about 280 amino acid residues. Their sequences are well conserved in eukaryotic species. In Drosophila mutations in the alpha and beta subunits cause actin accumulation and subsequent retinal degeneration. In humans CAPZA and CAPZB are part of the WASH complex that controls the fission of endosomes.
