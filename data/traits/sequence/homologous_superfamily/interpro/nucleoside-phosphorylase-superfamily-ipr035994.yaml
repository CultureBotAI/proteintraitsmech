identifier: InterPro:IPR035994
label: Nucleoside phosphorylase superfamily
definition: >-
  Phosphorylases with this domain include: Purine nucleoside phosphorylase ( EC:2.4.2.1 ) (PNP) from most bacteria (gene deoD), which catalyses the cleavage of guanosine or inosine to respective bases and sugar-1-phosphate molecules. Uridine phosphorylase ( EC:2.4.2.3 ) (UdRPase) from bacteria (gene udp) and mammals, which catalyses the cleavage of uridine into uracil and ribose-1-phosphate, the products of the reaction are used either as carbon and energy sources or in the rescue of pyrimidine bases for nucleotide synthesis. 5'-methylthioadenosine phosphorylase ( EC:2.4.2.28 ) (MTA phosphorylase) from Sulfolobus solfataricus. Purine nucleoside phosphorylase ( EC:2.4.2.1 ) (PNP) from mammals as well as from some bacteria (gene deoD). This enzyme catalyzes the cleavage of guanosine or inosine to respective bases and sugar-1-phosphate molecules. 5'-methylthioadenosine phosphorylase ( EC:2.4.2.28 ) (MTA phosphorylase) from eukaryotes.
