identifier: InterPro:IPR037064
label: Formiminotransferase, N-terminal subdomain superfamily
definition: >-
  The formiminotransferase (FT) domain of formiminotransferase-cyclodeaminase (FTCD) forms a homodimer, with each protomer being comprised of two subdomains. The formiminotransferase domain has an N-terminal subdomain that is made up of a six-stranded mixed β-pleated sheet and five α helices, which are arranged on the external surface of the β sheet. This, in turn, faces the β-sheet of the C-terminal subdomain to form a double β-sheet layer. The two subdomains are separated by a short linker sequence, which is not thought to be any more flexible than the remainder of the molecule. The substrate is predicted to form a number of contacts with residues found in both the N-terminal and C-terminal subdomains. This entry represents the N-terminal subdomain superfamily of the formiminotransferase.
