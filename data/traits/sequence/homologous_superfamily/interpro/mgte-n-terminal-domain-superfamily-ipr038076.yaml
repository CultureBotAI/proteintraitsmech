identifier: InterPro:IPR038076
label: "MgtE, N-terminal domain superfamily"
definition: >-
  The Mg2+ transporter MgtE is an homodimeric transporter consisting of two cytosolic domains, the N-terminal domain and the CBS domain, and a C-terminal transmembrane domain with five membrane-spanning helices per monomer. This domain is found at the N terminus of eubacterial magnesium transporters of the MgtE family InterPro:IPR006667. This domain is an intracellular domain that has an α-helical structure. The crystal structure of the MgtE transporter shows two of 5 magnesium ions are in the interface between the N domain and the CBS domains. In the absence of magnesium there is a large shift between the N and CBS domains.
