identifier: InterPro:IPR011013
label: Galactose mutarotase-like domain superfamily
definition: >-
  Proteins with this domain belong to the galactose mutarotase-like structural superfamily. The domain has a distorted supersandwich structure consisting of 18 strands in two sheets, and probably functions to bind carbohydrates in enzymes that act on sugars. Domains with this structure occur in several protein families, including galactose mutarotase ( EC:5.1.3.3 ); domain 5 of beta-galactosidase ( EC:3.2.1.23 ); domain 2 of Isomaltosyltransferase ( EC:2.4.1.387 ); the central domain of hyaluronate lyase-like enzymes, such as chondroitinase AC ( EC:4.2.2.5 ), xanthan lyase ( EC:4.2.2.12 ), chrondroitin ABC lyase I, and hyaluronate lyase ( EC:4.2.2.1 ) itself; the N-terminal domain of lactobacillus maltose phosphorylase ( EC:2.4.1.8 ), 6-glucosyltransferase ( EC:2.4.1.24 ) and bacterial glucoamylase ( EC:3.2.1.3 ); the C-terminal domain of eukaryotic alpha-mannosidase ( EC:3.2.1.24 ) and archaeon 4-alpha-glucanotransferase ( EC:2.4.1.25 ).
