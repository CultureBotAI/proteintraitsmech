identifier: InterPro:IPR049282
label: "BVU_3817-like, N-terminal domain superfamily"
definition: >-
  This domain is found at the N-terminal of BVU_3817 from Phocaeicola vulgatus (UniProtKB:A6L6W4) and similar proteins mostly from bacteroidetes. This domain adopts a β-barrel with SH3 topology and is usually found associated with InterPro:IPR049281. Its function is unknown.
