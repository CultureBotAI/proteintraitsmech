identifier: InterPro:IPR038266
label: "NapC/NirT cytochrome c superfamily"
definition: >-
  This entry represents the NapC/NirT-type cytochrome c superfamily. Some members, such as NapC and NirT, bind four haem groups, while others, such as TorC, bind five haems.
