identifier: InterPro:IPR016193
label: "Cytidine deaminase-like"
definition: >-
  This superfamily represents a structural domain with a core fold consisting of α-β(2)-(α-β)2 that folds into three layers (α/β/α); some members may contain an extra C-terminal strand. This domain is found in several types of proteins, including: Cytidine deaminase (EC:3.5.4.5), including both mono-domain enzymes and two-domain enzymes that arose through a duplication and which contain extra helices in the N-terminal domain. Deoxycytidylate (dCMP) deaminase (EC:3.5.4.12). Guranine deaminase GuaD (EC:3.5.4.3). Cytosine deaminase (EC:3.5.4.1). AICAR transformylase domain (EC:2.1.2.3) of the bifunctional purine biosynthesis enzyme ATIC; this protein consists of two domains of this fold with extra secondary structures within and in between the two core motifs. Hypothetical protein TM1506 from Thermotoga maritima also contains a domain of this structure.
