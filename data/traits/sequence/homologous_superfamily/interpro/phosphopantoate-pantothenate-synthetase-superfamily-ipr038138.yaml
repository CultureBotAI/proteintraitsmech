identifier: InterPro:IPR038138
label: "Phosphopantoate/pantothenate synthetase superfamily"
definition: >-
  Proteins in this superfamily include pantothenate synthetase (EC:6.3.2.n5) from Methanosarcina mazei and 4-phosphopantoate--beta-alanine ligase, also known as phosphopantothenate synthetase, (EC:6.3.2.36) from Pyrococcus kodakaraensis. Pantothenate synthetase catalyses the condensation of pantoate with beta-alanine in an ATP-dependent and ADP-producing reaction. 4-phosphopantoate--beta-alanine ligase catalyses the conversion of (R)-4-phosphopantoate and beta-alanine to 4'-phosphopantothenate in the CoA biosynthesis pathway. It cannot use (R)-pantoate as substrate and thus does not display pantothenate synthetase (PS) activity.
