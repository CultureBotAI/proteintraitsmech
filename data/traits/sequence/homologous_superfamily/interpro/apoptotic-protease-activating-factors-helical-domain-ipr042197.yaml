identifier: InterPro:IPR042197
label: "Apoptotic protease-activating factors, helical domain"
definition: >-
  This superfamily represents helical domains that are present in apoptotic protease-activating factors (apaf) proteins. On a higher level these proteins are associated with disease resistance in plants {].
