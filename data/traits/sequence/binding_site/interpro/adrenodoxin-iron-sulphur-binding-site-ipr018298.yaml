identifier: InterPro:IPR018298
label: Adrenodoxin, iron-sulphur binding site
definition: >-
  Adrenodoxin, putidaredoxin and terpredoxin are soluble 2Fe-2S iron-sulphur proteins that act as single electron carriers. They are a subgroup of the ferredoxin family of iron-sulphur proteins. In mitochondrial monooxygenase systems, adrenodoxin transfers an electron from NADPH:adrenodoxin reductase to membrane-bound P450. In bacteria, putidaredoxin and terpredoxin serve as electron carriers between corresponding NADH-dependent ferredoxin reductases and soluble P450. The exact functions of other members of this family are not known. In these proteins, four cysteine residues bind the iron-sulphur cluster. The patterns in this entry identifies three of these cysteines, which are involved in Fe-S binding.
