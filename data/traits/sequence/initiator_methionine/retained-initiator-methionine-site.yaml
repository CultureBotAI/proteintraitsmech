causal_graphs:
  - graph_id: CG_INIT_METHIONINE_RETAINED
    title: "Steric exclusion of bulky penultimate residues from methionyl-aminopeptidase retains N-terminal Met1"
    description: "When translation initiation incorporates Met1 upstream of a penultimate residue with a long or bulky side chain (Arg, Asn, Asp, Gln, Glu, His, Ile, Leu, Lys, Met, Phe, Trp, or Tyr), steric hindrance in the S1' pocket negatively regulates methionyl-aminopeptidase activity, preserving Met1 on the mature protein."
    nodes:
      - node_id: "CHEBI:16811"
        label: L-methionine
        node_type: RESIDUE
        grounding: "CHEBI:16811"
        description: "N-terminal Met1 position adjacent to a bulky or charged penultimate P1' residue whose side chain sterically blocks the methionyl-aminopeptidase S1' pocket"
      - node_id: "GO:0004239"
        label: "initiator methionyl aminopeptidase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004239"
        description: "Catalytic activity of methionyl-aminopeptidase (MAP, EC 3.4.11.18) toward nascent N-terminal methionine substrates"
      - node_id: "GO:0006413"
        label: "translational initiation"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0006413"
        description: "Incorporation and retention of the N-terminal initiator methionine at position 1 of the mature polypeptide"
    edges:
      - subject: "GO:0006413"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "CHEBI:16811"
        description: "Translational initiation incorporates the N-terminal methionine residue at position 1 of the nascent polypeptide."
        evidence:
          - reference: PMID:2682640
            snippet: "In a significant fraction of the Escherichia coli cytosolic proteins, the N-terminal methionine residue incorporated during the translation initiation step is excised. The N-terminal methionine excision is catalyzed by methionyl-aminopeptidase (MAP)."
            notes: "Translation initiation incorporates N-terminal Met1 (PMID:2682640). (ECO:0000269)"
      - subject: "CHEBI:16811"
        predicate: "negatively regulates"
        predicate_id: RO:0002212
        object: "GO:0004239"
        description: "Bulky penultimate side chains decrease methionyl-aminopeptidase catalytic efficiency to zero, preventing Met1 excision."
        evidence:
          - reference: PMID:2682640
            snippet: "From our results, methionine excision catalyzed by MAP is shown to obey the following rule: the catalytic efficiency of MAP, and therefore the extent of cleavage, decreases in parallel with the increasing of the maximal side-chain length of the amino acid in the penultimate position."
            notes: "Large penultimate side chains inhibit MAP cleavage (PMID:2682640). (ECO:0000269)"
evidence:
  - reference: PMID:2682640
    notes: "Increasing maximal side-chain length of the penultimate amino acid abolishes methionyl-aminopeptidase cleavage, resulting in N-terminal methionine retention."
