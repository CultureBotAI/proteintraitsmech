identifier: proteintraitsmech:INIT_METHIONINE_RETAINED
label: "retained N-terminal initiator methionine site"
definition: >-
  An N-terminal initiator methionine position (Met1) that is sterically protected from methionyl-aminopeptidase (MetAP / MAP) cleavage because the penultimate residue (P1', position 2) possesses a bulky, branched, or charged side chain (Arg, Asn, Asp, Gln, Glu, His, Ile, Leu, Lys, Met, Phe, Trp, or Tyr) that exceeds the steric exclusion radius of the MetAP S1' specificity pocket, retaining Met1 as the permanent N-terminal residue of the mature polypeptide.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_INITIATOR_METHIONINE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "uncleaved initiator methionine site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "MetAP-resistant N-terminal Met1 site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "N-terminal methionine retention motif"
    synonym_type: RELATED_SYNONYM
xrefs:
