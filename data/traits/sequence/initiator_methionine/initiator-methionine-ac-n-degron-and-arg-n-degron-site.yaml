identifier: proteintraitsmech:INIT_METHIONINE_N_DEGRON
label: "initiator-methionine N-degron recognition site"
definition: >-
  A retained N-terminal initiator methionine site that functions as a conditional proteolytic degradation signal (N-degron) in the ubiquitin-dependent N-end rule pathway, either after co-translational N-alpha-acetylation (Ac/N-degron recognized by Doa10/MARCH6 when unshielded by partner subunits) or when retained unmodified ahead of a bulky hydrophobic penultimate residue (MPhi Arg/N-degron recognized by UBR-family E3 ubiquitin ligases).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_INITIATOR_METHIONINE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:INIT_METHIONINE_RETAINED
synonyms:
  - synonym_text: "Ac/N-degron initiator methionine site"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "MPhi/N-degron retained Met1 site"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "N-end rule initiator methionine degradation signal"
    synonym_type: EXACT_SYNONYM
xrefs:
