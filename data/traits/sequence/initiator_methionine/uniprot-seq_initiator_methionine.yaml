identifier: proteintraitsmech:UNIPROT_FT_SEQ_INITIATOR_METHIONINE
label: cleaved initiator methionine
definition: >-
  The N-terminal translation-initiating methionine residue (Met1) that is co-translationally or post-translationally excised by methionine aminopeptidase (MetAP) when the penultimate residue (P1') has a small side-chain radius of gyration.
