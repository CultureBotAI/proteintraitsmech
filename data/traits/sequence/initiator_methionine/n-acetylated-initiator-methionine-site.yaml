    synonym_type: EXACT_SYNONYM
  - synonym_text: "Nt-acetylated initiator methionine"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "Ac-Met1 N-terminal modification site"
    synonym_type: RELATED_SYNONYM
