identifier: proteintraitsmech:INIT_METHIONINE_ACETYLATED
label: "N-alpha-acetylated initiator methionine site"
definition: >-
  A retained N-terminal initiator methionine position (Met1) that is co- or post-translationally acetylated on its alpha-amino group by N-terminal acetyltransferase complexes (primarily NatB on Met-Asp/Glu/Asn/Gln N-termini and NatC/NatE/NatF on Met-Leu/Ile/Phe/Trp/Tyr/Lys/Met N-termini) to form N-acetyl-L-methionine (MOD:00058), regulating protein folding, complex assembly, subcellular targeting, and Ac/N-degron-mediated turnover.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_INITIATOR_METHIONINE
term_kind: CLASS
mapping_status: SEEDED
