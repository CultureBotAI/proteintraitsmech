identifier: proteintraitsmech:INIT_METHIONINE_M1_LINEAR_UBIQUITINATED
label: "M1-linked linear-ubiquitin acceptor initiator methionine site"
definition: >-
  A retained, unacetylated N-terminal initiator L-methionine residue (Met1) whose free alpha-amino group serves as the nucleophilic acceptor for peptide-bond condensation with the C-terminal Gly76 carboxylate of a donor ubiquitin, catalyzed specifically by the LUBAC (HOIL-1L/HOIP/SHARPIN) linear ubiquitin chain assembly complex to generate head-to-tail (M1-linked) linear polyubiquitin scaffolds.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_INITIATOR_METHIONINE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:INIT_METHIONINE_RETAINED
synonyms:
  - synonym_text: "Met1 linear ubiquitination acceptor site"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "head-to-tail M1-ubiquitin linkage initiator methionine"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "TermiNator / EMBOSS fuzzpro bulky penultimate-residue N-terminal methionine retention scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0422
    tool: "biotools:emboss"
    evidence_code: ECO:0000255
    reference: PMID:2682640
    recipe: "fuzzpro -sequence {input} -pattern '^M[RNDQEHLKMFPWYI]' -outfile {output}"
