identifier: proteintraitsmech:INIT_METHIONINE_NON_AUG_DECODED
label: "non-AUG start-codon-decoded initiator methionine site"
definition: >-
  An N-terminal initiator residue site translated from a near-cognate non-AUG initiation codon (such as CUG, GUG, UUG, or ACG) that is decoded by initiator Met-tRNAi during canonical or stress-regulated translation initiation to insert an N-terminal L-methionine residue, often generating N-terminally extended or regulatory protein isoforms.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_INITIATOR_METHIONINE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_INITIATOR_METHIONINE
synonyms:
  - synonym_text: "near-cognate start codon initiator methionine"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "CUG/GUG/UUG-initiated N-terminal methionine site"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "non-canonical start codon initiator Met"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "N-terminal initiator methionine sequence motif and start-site context scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0239
    tool: "biotools:emboss"
    evidence_code: ECO:0000255
    reference: PMID:28982758
    recipe: "fuzzpro -sequence {input} -pattern '^M[ACDEFGHIKLMNPQRSTVWY]' -outfile {output}"
causal_graphs:
