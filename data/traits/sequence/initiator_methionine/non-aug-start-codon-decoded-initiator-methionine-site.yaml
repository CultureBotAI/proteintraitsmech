    title: "Near-cognate non-AUG translation initiation incorporates N-terminal methionine to generate regulated protein isoforms"
    description: "Translational initiation (GO:0006413) at near-cognate non-AUG start codons utilizes initiator L-methionine (CHEBI:16811) to drive N-terminal protein processing (GO:0016485) and produce distinct mature protein regions (SO:0000419) with regulated cellular functions."
    nodes:
