    title: "RGG/RG low-complexity motif mediation of methylation-regulated nucleic-acid and protein complex assembly"
    description: "Positively charged arginine-glycine (RGG/RG) repeat tracts mediate nucleic-acid and partner-protein binding that is modulated by protein arginine methylation to control ribonucleoprotein complex assembly and cellular RNA processing."
    nodes:
      - node_id: "PATO:0002195"
        label: "positive charge"
