identifier: proteintraitsmech:LOWCOMP_RGG_RG_RNA_BINDING_BOX_REGION
label: "RGG/RG-rich low-complexity RNA-binding region"
definition: >-
  A low-complexity sequence region enriched in degenerate Arg-Gly-Gly (RGG) and Arg-Gly (RG) repeats (canonical tri-RGG or di-RGG/RG boxes with interspersed aromatic residues) that mediates multivalent RNA and protein interactions, biomolecular condensate assembly, and arginine-methylation-regulated ribonucleoprotein remodeling.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_LOW_COMPLEXITY
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:LOWCOMP_REGION
synonyms:
  - synonym_text: "RGG box"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "GAR glycine-arginine-rich domain"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "RGG/RG repeat low-complexity motif"
    synonym_type: RELATED_SYNONYM
sequence_pattern: "(?:RGG|RG){3,}"
detection_methods:
  - name: "SEG / fLPS low-complexity sequence segmentation"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0234
    tool: "biotools:flps"
    evidence_code: ECO:0000362
    reference: PMID:28851299
    recipe: "fLPS -t 1e-5 {input} > {output}"
  - name: "fLPS2 compositional bias binomial P-value scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0234
    tool: "biotools:flps"
    evidence_code: ECO:0007669
    reference: PMID:28851299
    recipe: "fLPS -t 1e-5 -c default {input} > {output}"
