identifier: proteintraitsmech:LOWCOMP_CRYPTIC_REPEAT_REGION
label: "cryptic short-periodicity low-complexity region"
definition: >-
  A low-complexity region composed of degenerate di-, tri-, or tetrapeptide repeats (such as RG/RGG, YG/SYGQ, FG, or KSPEA motifs) that lacks strict tandem repeat regularity yet maintains strongly reduced sequence entropy.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_LOW_COMPLEXITY
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:LOWCOMP_REGION
synonyms:
  - synonym_text: "cryptic repeat LCR"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "quasi-repetitive low-complexity region"
    synonym_type: EXACT_SYNONYM
detection_methods:
  - name: "SEG / fLPS low-complexity sequence segmentation"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0234
    tool: "biotools:flps"
    evidence_code: ECO:0000362
    reference: PMID:28851299
    recipe: "fLPS -t 1e-5 {input} > {output}"
evidence:
  - reference: PMID:28851299
    notes: "fLPS characterizes both single-residue and multi-residue cryptic compositional biases."
