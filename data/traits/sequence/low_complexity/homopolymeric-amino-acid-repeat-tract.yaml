identifier: proteintraitsmech:LOWCOMP_HOMOREPEAT_TRACT
label: "homopolymeric amino-acid repeat tract"
definition: >-
  A single-amino-acid tandem homorepeat run (typically >= 5 consecutive identical residues, such as polyQ, polyA, polyH, or polyP) forming an extreme low-entropy tract within a protein sequence.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_LOW_COMPLEXITY
term_kind: CLASS
mapping_status: SEEDED
