synonyms:
  - synonym_text: "amino acid homorepeat"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "homopolymeric tract"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "single-residue repeat run"
    synonym_type: EXACT_SYNONYM
xrefs:
