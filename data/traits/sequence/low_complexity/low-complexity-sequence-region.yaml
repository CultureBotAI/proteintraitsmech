identifier: proteintraitsmech:LOWCOMP_REGION
label: "low-complexity sequence region"
definition: >-
  A contiguous protein sequence segment whose amino-acid Shannon entropy is significantly below the proteome background distribution, dominated by one or a few residue types (as detected by SEG or fLPS segmentation).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_LOW_COMPLEXITY
term_kind: CLASS
mapping_status: SEEDED
