identifier: proteintraitsmech:MATURE_CHAIN_BIOACTIVE_PEPTIDE
label: "proteolytically excised bioactive antimicrobial/effector peptide chain"
definition: >-
  A short mature bioactive C-terminal or internal peptide chain (SO:0000419) liberated from an inactive holoprotein precursor (such as a cathelicidin, defensin, or ribosomally synthesized bacteriocin proprotein) by granule or extracellular endoproteases (including proteinase 3, neutrophil elastase, or leader peptidases) to unmask membrane-active antimicrobial or host-defense activity.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_MATURE_CHAIN
term_kind: CLASS
mapping_status: SEEDED
