causal_graphs:
  - graph_id: CG_MATURE_CHAIN_BIOACTIVE_PEPTIDE
    title: "Proteolytic liberation of C-terminal bioactive antimicrobial peptide chain from holoprotein precursor"
    description: "Granule or extracellular endopeptidase activity (GO:0004175, such as neutrophil elastase or proteinase 3) drives antimicrobial peptide biosynthesis (GO:0002777) by cleaving the N-terminal pro-domain from the inactive holoprotein to release the mature bioactive peptide chain (SO:0000419), which mediates antimicrobial humoral defense (GO:0061844)."
    nodes:
      - node_id: "GO:0004175"
        label: "endopeptidase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004175"
        description: "Serine endoprotease activity (such as neutrophil elastase or proteinase 3) cleaving the inactive holoprotein precursor"
      - node_id: "GO:0002777"
        label: "antimicrobial peptide biosynthetic process"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0002777"
        description: "Proteolytic cleavage of an inactive holoprotein precursor (such as a cathelicidin or bacteriocin proprotein) to release the active C-terminal peptide"
      - node_id: "SO:0000419"
        label: mature_protein_region
        node_type: DOMAIN
        grounding: "SO:0000419"
        description: "Mature bioactive antimicrobial or effector peptide chain (SO:0000419) liberated from its proprotein precursor"
      - node_id: "GO:0061844"
        label: "antimicrobial humoral immune response mediated by antimicrobial peptide"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0061844"
        description: "Direct antimicrobial defense mediated by the mature excised peptide"
    edges:
      - subject: "GO:0004175"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0002777"
        description: "Granule serine endoproteases such as neutrophil elastase or proteinase 3 cleave inactive cathelicidin holoproteins to initiate active antimicrobial peptide generation."
        evidence:
          - reference: PMID:11389039
            snippet: "Bovine and porcine cathelicidins are cleaved by elastase from the azurophil granules to yield the active antimicrobial peptides."
            notes: "Elastase endopeptidase activity cleaves cathelicidin holoproteins (PMID:11389039). (ECO:0000269)"
      - subject: "GO:0002777"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "SO:0000419"
        description: "Proteolytic processing of human cathelicidin hCAP-18 by proteinase 3 after exocytosis liberates the active C-terminal LL-37 antimicrobial peptide chain."
        evidence:
          - reference: PMID:11389039
            snippet: "Of the 3 known serine proteases from azurophil granules, proteinase 3 was solely responsible for cleavage of hCAP-18 after exocytosis."
            notes: "Proteinase 3 cleavage of hCAP-18 holoprotein yields active antimicrobial peptide (PMID:11389039). (ECO:0000269)"
      - subject: "SO:0000419"
        predicate: "involved in"
        predicate_id: RO:0002331
        object: "GO:0061844"
        description: "Once cleaved from the holoprotein precursor, the mature C-terminal peptide chain executes antimicrobial defense."
        evidence:
          - reference: PMID:11389039
            snippet: "Cathelicidins are a family of antimicrobial proteins found in the peroxidase-negative granules of neutrophils. The known biologic functions reside in the C-terminus, which must be cleaved from the holoprotein to become active."
            notes: "Biological antimicrobial activity resides in the cleaved C-terminal peptide chain (PMID:11389039). (ECO:0000269)"
evidence:
- reference: PMID:11134217
  notes: Cathelicidins are synthesized as inactive holoproteins whose C-terminal antimicrobial peptide
    chain must be proteolytically cleaved by elastase or proteinase 3 to become active.
- reference: PMID:11389039
  notes: Cathelicidins are synthesized as inactive holoproteins whose C-terminal antimicrobial peptide
    chain must be proteolytically cleaved by elastase or proteinase 3 to become active.
