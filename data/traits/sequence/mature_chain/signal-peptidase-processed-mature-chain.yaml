identifier: proteintraitsmech:MATURE_CHAIN_SECRETED
label: "signal-peptidase-processed mature polypeptide chain"
definition: >-
  A mature functional polypeptide chain (SO:0000419) generated by endoproteolytic cleavage of an N-terminal secretory signal peptide or bacterial lipoprotein leader peptide by type I/II/III signal peptidase during or immediately following translocation across the endoplasmic reticulum, bacterial cytoplasmic, or archaeal plasma membrane.
