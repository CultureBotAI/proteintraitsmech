identifier: proteintraitsmech:MATURE_CHAIN_SORTASE_CELL_WALL_ANCHORED
label: "sortase-cleaved cell-wall-anchored mature polypeptide chain"
definition: >-
  A mature surface-displayed polypeptide chain of Gram-positive bacteria generated when a cysteine transpeptidase sortase (such as SrtA) cleaves the C-terminal cell-wall sorting signal between the threonine and glycine residues of a conserved LPXTG motif and forms an amide bond linking the C-terminal threonine carboxyl group to the peptidoglycan cross-bridge.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_MATURE_CHAIN
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_MATURE_CHAIN
synonyms:
  - synonym_text: "LPXTG-cleaved sortase-anchored mature chain"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "peptidoglycan-tethered Gram-positive surface mature chain"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "SrtA-processed mature surface protein chain"
    synonym_type: NARROW_SYNONYM
sequence_pattern: "LP[ACDEFGHIKLMNPQRSTVWY]TG"
detection_methods:
  - name: "EMBOSS fuzzpro scan for C-terminal LPXTG sortase cleavage motif"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0239
    tool: "biotools:emboss"
    evidence_code: ECO:0000255
    reference: PMID:10427003
    recipe: "fuzzpro -sequence {input} -pattern 'LPXTG' -outfile {output}"
