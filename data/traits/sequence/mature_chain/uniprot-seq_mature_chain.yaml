identifier: proteintraitsmech:UNIPROT_FT_SEQ_MATURE_CHAIN
label: released active peptide
definition: >-
  A released, biologically active polypeptide chain or mature peptide hormone, neuropeptide, or antimicrobial peptide excised from a larger precursor polyprotein by site-specific endopeptidase and exopeptidase processing.
