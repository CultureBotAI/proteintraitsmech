identifier: proteintraitsmech:MATURE_CHAIN_BACKBONE_CYCLIZED
label: "head-to-tail backbone-cyclized mature polypeptide chain"
definition: >-
  A mature ribosomally synthesized polypeptide chain whose N-terminal alpha-amino group and C-terminal alpha-carboxylate are post-translationally ligated via a native amide bond into a seamless circular backbone lacking free termini (as in plant cyclotides, PawS-derived sunflower trypsin inhibitor SFTI-1, mammalian theta-defensins, and circular bacteriocins), catalyzed by asparaginyl endopeptidase (AEP / legumain / butelase-1) transpeptidation or PCY1 macrocyclase.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_MATURE_CHAIN
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_MATURE_CHAIN
synonyms:
  - synonym_text: "N-to-C macrocyclized mature polypeptide chain"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "circular backbone mature peptide chain"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "cyclotide/circulin-type cyclic mature chain"
    synonym_type: NARROW_SYNONYM
