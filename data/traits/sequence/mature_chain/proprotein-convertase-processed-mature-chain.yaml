identifier: proteintraitsmech:MATURE_CHAIN_PROPROTEIN_CLEAVED
label: "proprotein-convertase-processed mature polypeptide chain"
definition: >-
  A mature bioactive polypeptide or peptide hormone/neuropeptide chain (SO:0000419) excised from a larger proprotein, prohormone, or polyprotein precursor by site-specific endopeptidases (such as subtilisin/kexin-like proprotein convertases or secretory-vesicle cathepsin L) at monobasic or dibasic cleavage motifs within the secretory pathway.
