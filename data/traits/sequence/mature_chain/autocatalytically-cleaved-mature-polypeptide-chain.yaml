identifier: proteintraitsmech:MATURE_CHAIN_AUTOCATALYTIC_CLEAVED
label: "autocatalytically cleaved mature polypeptide chain"
definition: >-
  A mature polypeptide chain generated by intramolecular cis-autoproteolytic cleavage of a precursor zymogen without an external protease, typically via an N->O or N->S acyl rearrangement catalyzed by an internal threonine, serine, or cysteine residue that becomes the catalytic N-terminal nucleophile (as in Ntn-hydrolases such as proteasome beta subunits, penicillin acylase, glycosylasparaginase, and GPCR autoproteolysis-inducing GAIN domains).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_MATURE_CHAIN
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
