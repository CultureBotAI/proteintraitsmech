synonyms:
  - synonym_text: "Ntn-hydrolase autoproteolytically processed mature chain"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "cis-autoproteolytic mature polypeptide subunit"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "self-cleaved N-terminal nucleophile mature chain"
    synonym_type: RELATED_SYNONYM
