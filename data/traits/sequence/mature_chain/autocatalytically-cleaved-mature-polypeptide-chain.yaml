causal_graphs:
  - graph_id: CG_MATURE_CHAIN_AUTOCATALYTIC_CLEAVED
    title: "Intramolecular cis-autoproteolytic cleavage liberates a mature polypeptide chain bearing a catalytic N-terminal nucleophile"
    description: "In N-terminal nucleophile (Ntn) hydrolases and related autoproteolytic zymogens, the folded precursor catalyzes intramolecular proteolysis at the peptide bond preceding an internal Thr, Ser, or Cys residue, liberating a mature polypeptide chain whose newly exposed N-terminal residue serves as the active-site nucleophile."
    nodes:
      - node_id: "GO:0006508"
        label: proteolysis
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0006508"
        description: "Intramolecular cis-autoproteolytic cleavage of the scissile peptide bond preceding the catalytic nucleophile."
      - node_id: "SO:0000419"
        label: mature_protein_region
        node_type: DOMAIN
        grounding: "SO:0000419"
        description: "Processed mature polypeptide chain carrying a newly liberated N-terminal Thr, Ser, or Cys nucleophile."
      - node_id: "GO:0051604"
        label: "protein maturation"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0051604"
        description: "Conversion of the inactive single-chain zymogen precursor into the mature active enzyme subunit."
      - node_id: "GO:0003824"
        label: "catalytic activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003824"
        description: "Active-site nucleophilic catalysis enabled by the free alpha-amino group and side chain of the N-terminal residue of the mature chain."
    edges:
      - subject: "GO:0006508"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "SO:0000419"
        description: "Intramolecular autocatalytic proteolysis cleaves the precursor to yield the mature polypeptide chain."
        evidence:
          - reference: PMID:7477383
            snippet: "This fold provides both the capacity for nucleophilic attack and the possibility of autocatalytic processing."
            notes: "Brannigan et al. 1995 establish that the Ntn-hydrolase fold directs autocatalytic processing to generate the mature N-terminal nucleophile chain. (ECO:0000269)"
      - subject: "SO:0000419"
        predicate: "involved in"
        predicate_id: RO:0002331
        object: "GO:0051604"
        description: "Formation of the autocatalytically cleaved mature chain completes zymogen protein maturation."
        evidence:
          - reference: PMID:7477383
            snippet: "Here we show that all three enzymes share an unusual fold in which the nucleophile and other catalytic groups occupy equivalent sites."
            notes: "Self-activation via autocatalytic processing matures the amidohydrolase precursor. (ECO:0000269)"
      - subject: "SO:0000419"
        predicate: enables
        predicate_id: RO:0002327
        object: "GO:0003824"
        description: "The newly exposed N-terminal Cys, Ser, or Thr residue of the mature polypeptide chain acts as the catalytic nucleophile."
        evidence:
          - reference: PMID:7477383
            snippet: "These enzymes use the side chain of the amino-terminal residue, incorporated in a beta-sheet, as the nucleophile in the catalytic attack at the carbonyl carbon."
            notes: "The amino-terminal residue liberated by autocatalytic processing directly catalyzes nucleophilic attack at the substrate carbonyl carbon. (ECO:0000269)"
evidence:
  - reference: PMID:7477383
    notes: "N-terminal nucleophile (Ntn) hydrolases share a beta-sandwich fold that catalyzes intramolecular autocatalytic processing of an inactive precursor to liberate a mature chain with a catalytic N-terminal Thr, Ser, or Cys nucleophile."
