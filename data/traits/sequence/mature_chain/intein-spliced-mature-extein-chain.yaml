identifier: proteintraitsmech:MATURE_CHAIN_INTEIN_SPLICED
label: "intein-spliced mature extein polypeptide chain"
definition: >-
  A contiguous mature host polypeptide chain (SO:0000419) formed post-translationally by autocatalytic protein splicing (GO:0016539), in which an internal intervening polypeptide (intein) catalyzes its own excision from flanking N-extein and C-extein segments coupled to native peptide-bond ligation of the exteins.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_MATURE_CHAIN
term_kind: CLASS
