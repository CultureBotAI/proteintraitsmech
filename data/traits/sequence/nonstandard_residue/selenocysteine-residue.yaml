identifier: proteintraitsmech:NONSTD_SELENOCYSTEINE
label: "selenocysteine residue"
definition: >-
  Presence of the genetically encoded 21st amino acid L-selenocysteine (Sec, U), cotranslationally inserted at an in-frame UGA codon via a selenocysteine insertion sequence (SECIS) stem-loop RNA element, SelB/EEFSEC elongation factor, and tRNA(Sec).
