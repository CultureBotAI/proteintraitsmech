        predicate_id: RO:0000056
        object: "GO:0001514"
        description: "The SECIS RNA stem-loop participates in SelB/EEFSEC recruitment for UGA recoding."
        evidence:
          - reference: PMID:41997725
            snippet: "Translation of UGA as selenocysteine relies heavily on the presence of a specific messenger RNA (mRNA) sequence found in the transcript."
            notes: "mRNA SECIS sequence required for UGA translation as selenocysteine (PMID:41997725). (ECO:0000305)"
      - subject: "SO:0000885"
        predicate: "participates in"
        predicate_id: RO:0000056
