identifier: proteintraitsmech:NONSTD_SELENOCYSTEINE
label: "selenocysteine residue"
definition: >-
  Presence of the genetically encoded 21st amino acid L-selenocysteine (Sec, U), cotranslationally inserted at an in-frame UGA codon via a selenocysteine insertion sequence (SECIS) stem-loop RNA element, SelB/EEFSEC elongation factor, and tRNA(Sec).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "Sec residue"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "selenocysteine incorporation site"
    synonym_type: RELATED_SYNONYM
  - synonym_text: "21st amino acid residue"
    synonym_type: RELATED_SYNONYM
xrefs:
  - SO:0001455
  - MOD:00031
  - CHEBI:30000
detection_methods:
  - name: "SecMarker / Infernal SECIS + TGA selenoprotein prediction"
    method_type: HMM_PROFILE
    edam_operation: EDAM:operation_0415
    tool: "https://secmarker.crg.es/"
    evidence_code: ECO:0000255
    reference: PMID:28192430
    recipe: "cmsearch --cpu 4 --tblout {output} RF00031.cm {input}"
causal_graphs:
  - graph_id: secis_selenocysteine_incorporation
    title: "SECIS-directed cotranslational selenocysteine incorporation at UGA"
    description: "A cis-acting SECIS stem-loop RNA element (SO:1001274) recruits the selenocysteine-specific elongation factor SelB/EEFSEC and Sec-tRNA(Sec) to recode an in-frame UGA codon (SO:0000885) during selenocysteine incorporation (GO:0001514), cotranslationally inserting L-selenocysteine (CHEBI:16633 / MOD:00031) into the nascent selenoprotein."
    nodes:
      - node_id: "SO:1001274"
        label: SECIS_element
        node_type: NUCLEIC_ACID
        grounding: "SO:1001274"
        description: "Selenocysteine insertion sequence stem-loop RNA element in the selenoprotein mRNA."
      - node_id: "SO:0000885"
        label: stop_codon_redefined_as_selenocysteine
        node_type: NUCLEIC_ACID
        grounding: "SO:0000885"
        description: "In-frame UGA stop codon recoded for L-selenocysteine insertion."
      - node_id: "GO:0001514"
        label: "selenocysteine incorporation"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0001514"
        description: "SelB/EEFSEC-mediated translational recoding and Sec-tRNA(Sec) delivery."
      - node_id: "CHEBI:16633"
        label: L-selenocysteine
        node_type: CHEMICAL
        grounding: "CHEBI:16633"
        description: "21st amino acid precursor delivered on Sec-tRNA(Sec) to the ribosomal A-site."
      - node_id: "MOD:00031"
        label: "L-selenocysteine residue"
        node_type: RESIDUE
        grounding: "MOD:00031"
        description: "Cotranslationally incorporated L-selenocysteine residue in the polypeptide chain."
    edges:
