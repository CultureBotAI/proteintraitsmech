        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:32814"
        description: "Pyrrolysyl-tRNA synthetase utilizes L-pyrrolysine as aminoacyl substrate."
        evidence:
          - reference: PMID:12029132
            snippet: "Here we report the crystal structure of the Methanosarcina barkeri monomethylamine methyltransferase (MtmB) to 1.55 A resolution, which reveals the UAG-encoded residue to be a lysine in amide-linkage to a (4R,5R)-4-substituted-pyrroline-5-carboxylate, which we name pyrrolysine."
            notes: "Pyrrolysine charging and UAG insertion (PMID:12029132). (ECO:0000269)"
