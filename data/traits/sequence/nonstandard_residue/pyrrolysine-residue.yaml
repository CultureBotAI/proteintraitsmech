evidence:
  - reference: PMID:41997725
    notes: "Pyrrolysine is synthesized as a free amino acid, charged onto tRNAPyl by pyrrolysyl-tRNA synthetase, and inserted cotranslationally at UAG codons."
  - reference: PMID:12029131
    notes: "Pyrrolysine is the 22nd genetically encoded natural amino acid, encoded by the UAG amber codon via pylS aminoacyl-tRNA synthetase and pylT tRNA(CUA)."
