            snippet: "Charging a tRNA(CUA) with lysine is a likely first step in translating UAG amber codons as pyrrolysine in certain methanogens."
            notes: "tRNA(CUA) charging positively regulates UAG translation as pyrrolysine (PMID:12029131). (ECO:0000269)"
      - subject: "SO:0000884"
