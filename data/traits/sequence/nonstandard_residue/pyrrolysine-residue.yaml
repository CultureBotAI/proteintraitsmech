identifier: proteintraitsmech:NONSTD_PYRROLYSINE
label: "pyrrolysine residue"
definition: >-
  Presence of the genetically encoded 22nd amino acid L-pyrrolysine (Pyl, O), a 4-methylpyrroline-5-carboxylate-linked lysine derivative cotranslationally inserted at an in-frame UAG amber codon by pyrrolysyl-tRNA synthetase (PylRS) and tRNA(Pyl) in methylotrophic archaea and bacteria.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "Pyl residue"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "pyrrolysine incorporation site"
    synonym_type: RELATED_SYNONYM
  - synonym_text: "22nd amino acid residue"
    synonym_type: RELATED_SYNONYM
xrefs:
  - SO:0001456
  - MOD:01187
  - CHEBI:21860
detection_methods:
  - name: "HMMER PylRS/tRNA(Pyl) & in-frame UAG pyrrolysine detection"
    method_type: HMM_PROFILE
    edam_operation: EDAM:operation_0300
    tool: "biotools:hmmer3"
    evidence_code: ECO:0000259
    reference: PMID:42848426
    recipe: "hmmsearch --cut_ga --domtblout {output} PylB_PylC_PylD.hmm {input}"
causal_graphs:
  - graph_id: pyrrolysine_uag_incorporation
    title: "PylRS/tRNA(Pyl)-mediated cotranslational pyrrolysine incorporation at UAG"
    description: "Pyrrolysyl-tRNA synthetase activity (GO:0043767 / EC:6.1.1.26) charges tRNA(Pyl) with L-pyrrolysine (CHEBI:21860) for pyrrolysine incorporation (GO:0030631) at an in-frame UAG amber codon (SO:0000884), inserting an L-pyrrolysine residue (MOD:01187) that imparts catalytic functionality."
    nodes:
      - node_id: "GO:0043767"
