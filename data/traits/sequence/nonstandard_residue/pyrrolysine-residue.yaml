      - node_id: "CHEBI:21860"
        label: L-pyrrolysine
        node_type: CHEMICAL
        grounding: "CHEBI:21860"
        description: "Biosynthesized 22nd amino acid substrate (PylB/PylC/PylD pathway product)."
      - node_id: "SO:0000884"
