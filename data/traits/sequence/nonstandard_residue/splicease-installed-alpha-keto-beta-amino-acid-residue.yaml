        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0036211"
        description: "Radical S-adenosylmethionine splicease catalysis positively regulates post-translational backbone splicing in bacteria."
        evidence:
          - reference: PMID:29449488
            snippet: "The transformation is widespread in bacteria and is catalyzed by an enzyme belonging to a previously uncharacterized radical S-adenosylmethionine family."
            notes: "Morinaka et al. (2018) Science 359:779-782 (PMID:29449488) characterize bacterial radical-SAM spliceases. (ECO:0000269)"
      - subject: "GO:0036211"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:83228"
        description: "Splicease-mediated backbone splicing excises tyramine from precursor L-alpha-amino acid residues via C-C bond cleavage."
        evidence:
