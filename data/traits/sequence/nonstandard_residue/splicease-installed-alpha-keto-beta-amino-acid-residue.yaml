identifier: proteintraitsmech:NONSTD_ALPHA_KETO_BETA_AMINO_ACID_RESIDUE
label: "splicease-installed alpha-keto-beta-amino acid residue"
definition: >-
  A nonstandard backbone-extended alpha-keto-beta-amino acid residue installed post-translationally in ribosomally translated bacterial proteins by radical S-adenosylmethionine (rSAM) spliceases (PlpXY), which catalyze noncanonical protein splicing via backbone C-C bond cleavage and net excision of a tyramine equivalent from a conserved Xaa-Tyr motif.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "PlpXY splicease beta-amino acid residue"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "ribosomally translated alpha-keto-beta-amino acid residue"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "tyramine-excised ketoamide backbone residue"
    synonym_type: RELATED_SYNONYM
detection_methods:
  - name: "HMMER profile search for PlpX/PlpY radical-SAM splicease and spliceotide precursor families"
    method_type: HMM_PROFILE
    edam_operation: EDAM:operation_0300
    tool: "biotools:hmmer3"
    evidence_code: ECO:0000259
    reference: PMID:29449488
    recipe: "hmmsearch --cut_ga --domtblout {output} TIGR04517_PlpX_splicease.hmm {input}"
causal_graphs:
