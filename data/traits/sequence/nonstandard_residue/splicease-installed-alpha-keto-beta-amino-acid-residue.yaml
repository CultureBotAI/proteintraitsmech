    title: "Radical-SAM splicease tyramine excision converts standard alpha-amino acid backbone units into alpha-keto-beta-amino acid residues"
    description: "Radical S-adenosylmethionine splicease catalytic activity (GO:0003824) positively regulates noncanonical post-translational splicing (GO:0036211) of precursor L-alpha-amino acid residues (CHEBI:83228) via C-C bond cleavage and net tyramine excision, generating an alpha-keto-beta-amino-acid-containing mature protein region (SO:0000419)."
    nodes:
      - node_id: "GO:0003824"
