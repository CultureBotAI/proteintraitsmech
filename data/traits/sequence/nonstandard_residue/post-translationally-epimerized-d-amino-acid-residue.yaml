identifier: proteintraitsmech:NONSTD_D_AMINO_ACID_RESIDUE
label: "post-translationally epimerized D-amino acid residue"
definition: >-
  Presence of a D-configured alpha-amino acid residue generated in situ from an L-amino acid residue within a ribosomally translated polypeptide by a peptide aminoacyl-L/D-epimerase or radical-SAM epimerase.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
synonyms:
  - synonym_text: "ribosomally incorporated D-amino acid residue"
    synonym_type: RELATED_SYNONYM
  - synonym_text: "epimerized D-residue"
    synonym_type: EXACT_SYNONYM
xrefs:
  - MOD:00664
  - CHEBI:142417
detection_methods:
  - name: "Radical-SAM epimerase / post-translational D-residue HMM scan"
    method_type: HMM_PROFILE
    edam_operation: EDAM:operation_0300
    tool: "biotools:hmmer3"
    evidence_code: ECO:0000259
    reference: PMID:29779654
    recipe: "hmmsearch --cut_ga --domtblout {output} PoyD_YydG_epimerase.hmm {input}"
causal_graphs:
  - graph_id: radical_sam_peptide_epimerization
    title: "Radical-SAM peptide epimerase C-alpha stereoinversion of L- to D-amino acid residues"
    description: "A radical-SAM peptide aminoacyl-L/D-epimerase (GO:0016855) abstracts the alpha-carbon hydrogen atom from a ribosomally translated L-alpha-amino acid residue (CHEBI:83228) during protein modification process (GO:0036211) and stereoselectively donates a hydrogen atom to the opposite face, generating an in-chain D-alpha-amino acid residue (CHEBI:142417)."
    nodes:
      - node_id: "GO:0016855"
        label: "racemase and epimerase activity, acting on amino acids and derivatives"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0016855"
        description: "Radical-SAM peptide epimerase (PoyD/YydG family) or peptide L/D-isomerase activity."
      - node_id: "CHEBI:83228"
        label: "L-alpha-amino acid residue"
        node_type: RESIDUE
        grounding: "CHEBI:83228"
        description: "Ribosomally incorporated L-configured alpha-amino acid residue substrate."
      - node_id: "GO:0036211"
        label: "protein modification process"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0036211"
        description: "Post-translational C-alpha radical abstraction and stereoinversion."
      - node_id: "CHEBI:142417"
        label: "D-alpha-amino acid residue"
        node_type: RESIDUE
        grounding: "CHEBI:142417"
        description: "Post-translationally epimerized D-configured residue in the mature polypeptide."
    edges:
      - subject: "GO:0016855"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0036211"
        description: "Peptide epimerase catalyzes post-translational C-alpha stereoinversion."
        evidence:
          - reference: PMID:30521081
            snippet: "Post-translational modifying enzymes from the S-adenosyl-l-methionine (AdoMet) radical superfamily garner attention due to their ability to accomplish challenging biochemical reactions. Among them, a family of AdoMet radical epimerases catalyze irreversible l- to d-amino acid transformations of diverse residues, including 18 sites in the complex sponge-derived polytheonamide toxins."
            notes: "Radical-SAM peptide epimerase activity (PMID:30521081). (ECO:0000269)"
      - subject: "GO:0036211"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:83228"
        description: "Ribosomally translated L-alpha-amino acid residue serves as substrate for C-alpha H-abstraction."
        evidence:
          - reference: PMID:30521081
            snippet: "Among them, a family of AdoMet radical epimerases catalyze irreversible l- to d-amino acid transformations of diverse residues, including 18 sites in the complex sponge-derived polytheonamide toxins."
            notes: "L-alpha-amino acid residue substrate (PMID:30521081). (ECO:0000269)"
      - subject: "GO:0036211"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "CHEBI:142417"
        description: "Back-face hydrogen atom transfer generates an epimerized D-alpha-amino acid residue."
        evidence:
          - reference: PMID:30521081
            snippet: "Introduction of d-amino acids can drastically alter the stability, structure, and activity of peptides; thus, epimerases offer opportunities in peptide bioengineering."
            notes: "Epimerized D-alpha-amino acid residue product (PMID:30521081). (ECO:0000269)"
evidence:
  - reference: PMID:30521081
    notes: "AdoMet radical epimerases catalyze irreversible L- to D-amino acid transformations in ribosomally synthesized peptides."
