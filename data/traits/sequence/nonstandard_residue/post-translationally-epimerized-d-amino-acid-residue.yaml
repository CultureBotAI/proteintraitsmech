identifier: proteintraitsmech:NONSTD_D_AMINO_ACID_RESIDUE
label: "post-translationally epimerized D-amino acid residue"
definition: >-
  Presence of a D-configured alpha-amino acid residue generated in situ from an L-amino acid residue within a ribosomally translated polypeptide by a peptide aminoacyl-L/D-epimerase or radical-SAM epimerase.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_NON_STD
synonyms:
  - synonym_text: "ribosomally incorporated D-amino acid residue"
    synonym_type: RELATED_SYNONYM
  - synonym_text: "epimerized D-residue"
    synonym_type: EXACT_SYNONYM
xrefs:
  - MOD:00412
detection_methods:
  - name: "Radical-SAM epimerase / post-translational D-residue HMM scan"
    method_type: HMM_PROFILE
    edam_operation: EDAM:operation_0300
    tool: "biotools:hmmer3"
    evidence_code: ECO:0000259
    reference: PMID:23064350
    recipe: "hmmsearch --cut_ga --domtblout {output} PoyD_YydG_epimerase.hmm {input}"
evidence:
  - reference: PMID:23064350
    notes: "Irreversible radical-SAM epimerization introduces multiple D-amino acid residues into proteusin peptides."
