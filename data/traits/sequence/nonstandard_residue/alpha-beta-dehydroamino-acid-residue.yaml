  - synonym_text: "2,3-didehydroalanine residue"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "2,3-didehydrobutyrine residue"
    synonym_type: NARROW_SYNONYM
  - synonym_text: "Dha/Dhb nonstandard residue"
    synonym_type: EXACT_SYNONYM
