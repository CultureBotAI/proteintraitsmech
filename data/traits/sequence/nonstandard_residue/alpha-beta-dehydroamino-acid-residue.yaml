identifier: proteintraitsmech:NONSTD_DEHYDROAMINO_ACID_RESIDUE
label: "alpha,beta-dehydroamino acid residue (Dha/Dhb)"
definition: >-
  A post-translationally dehydrated nonstandard amino acid residue (2,3-didehydroalanine, Dha, or (Z)-2,3-didehydrobutyrine, Dhb) installed in ribosomally synthesized and post-translationally modified peptides (RiPPs) such as lanthipeptides and thiopeptides by enzymatic elimination of water from precursor L-serine or L-threonine residues, serving as an electrophilic Michael acceptor for macrocyclization or conferring conformational rigidity and proteolytic resistance.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
