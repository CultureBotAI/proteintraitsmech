identifier: proteintraitsmech:NONSTD_N_FORMYLMETHIONINE
label: "N-formylmethionine initiator residue"
definition: >-
  Presence of an N-terminal N-formyl-L-methionine (fMet) initiator residue retained on a bacterial, mitochondrial, or plastid polypeptide when peptide deformylase (PDF) processing is bypassed or incomplete.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_INITIATOR_METHIONINE
synonyms:
  - synonym_text: "fMet initiator residue"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "retained N-formylmethionine"
    synonym_type: EXACT_SYNONYM
xrefs:
  - MOD:00030
  - CHEBI:16552
detection_methods:
  - name: "N-terminal initiator fMet / deformylase motif scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0239
    tool: "biotools:emboss"
    evidence_code: ECO:0000255
    reference: PMID:42079159
    recipe: "fuzzpro -sequence {input} -pattern '^M[ACDEFGHIKLMNPQRSTVWY]' -outfile {output}"
causal_graphs:
  - graph_id: fmet_initiation_deformylase_bypass
    title: "Methionyl-tRNA formyltransferase initiation and peptide deformylase bypass"
    description: "Methionyl-tRNA formyltransferase activity (GO:0004479 / EC:2.1.2.9) generates N-formyl-L-methionine (CHEBI:16552) on initiator tRNA(fMet) for prokaryotic and organellar translational initiation (GO:0006413); when formylmethionine deformylase activity (GO:0008463 / EC:3.5.1.88) is bypassed or reduced, the N-formyl-L-methionine residue (MOD:00030) is retained at the mature N-terminus."
    nodes:
      - node_id: "GO:0004479"
        label: "methionyl-tRNA formyltransferase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004479"
        description: "Fmt enzyme activity (EC:2.1.2.9) formylating initiator Met-tRNA(fMet)."
      - node_id: "CHEBI:16552"
        label: N-formyl-L-methionine
        node_type: CHEMICAL
        grounding: "CHEBI:16552"
        description: "Formylated initiator amino acid precursor."
      - node_id: "GO:0006413"
        label: "translational initiation"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0006413"
        description: "Ribosomal translation initiation incorporating N-terminal fMet."
      - node_id: "GO:0008463"
        label: "formylmethionine deformylase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0008463"
        description: "PDF hydrolase activity (EC:3.5.1.88) that removes the N-formyl group from nascent peptides."
      - node_id: "MOD:00030"
        label: "N-formyl-L-methionine residue"
        node_type: RESIDUE
        grounding: "MOD:00030"
        description: "Retained N-terminal N-formyl-L-methionine residue on the polypeptide."
    edges:
      - subject: "GO:0004479"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "CHEBI:16552"
        description: "Methionyl-tRNA formyltransferase produces N-formyl-L-methionine on initiator tRNA."
        evidence:
          - reference: PMID:12101237
            snippet: "Expression of active MTF, but not of an inactive mutant, leads to formylation of methionine attached to the yeast cytoplasmic initiator tRNA to the extent of about 70%."
            notes: "Formylation of initiator Met-tRNA by methionyl-tRNA formyltransferase (PMID:12101237). (ECO:0000269)"
      - subject: "GO:0006413"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "CHEBI:16552"
        description: "Translational initiation uses N-formyl-L-methionine as the initiator amino acid."
        evidence:
          - reference: PMID:18718933
            snippet: "Because protein synthesis begins with N-formylmethionine in plant endosymbiotic organelles, removal of the formyl group by peptide deformylase (PDF) is essential to allowing the excision of the first methionine."
            notes: "Translational initiation with fMet (PMID:18718933). (ECO:0000269)"
      - subject: "GO:0006413"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "MOD:00030"
        description: "Translational initiation in eubacteria, mitochondria, and chloroplasts deposits an N-formyl-L-methionine residue at the N-terminus of the nascent polypeptide."
        evidence:
          - reference: PMID:12101237
            snippet: "Protein synthesis in eukaryotic cytoplasm and in archaebacteria is initiated with methionine, whereas, that in eubacteria and in eukaryotic organelles, such as mitochondria and chloroplasts, is initiated with formylmethionine."
            notes: "Nascent N-terminal fMet residue in eubacteria and organelles (PMID:12101237). (ECO:0000269)"
      - subject: "GO:0008463"
        predicate: "has input"
        predicate_id: RO:0002233
        object: "MOD:00030"
        description: "Polypeptide deformylase acts on the N-terminal N-formyl-L-methionine residue of a polypeptide unless absent or inactive."
        evidence:
          - reference: PMID:12101237
            snippet: "Coexpression of the E. coli polypeptide deformylase (DEF), which removes the formyl group from the N-terminal formylmethionine in a polypeptide, rescues the slow-growth phenotype, whereas, coexpression of an inactive mutant of DEF does not."
            notes: "Polypeptide deformylase removes the formyl group from N-terminal formylmethionine (PMID:12101237). (ECO:0000269)"
evidence:
  - reference: PMID:42079159
    notes: "Peptide deformylase (PDF, EC:3.5.1.88) removes the formyl group from N-formylmethionine (fMet) on nascent peptides."
  - reference: PMID:12101237
    notes: "Methionyl-tRNA formyltransferase (MTF) formylates methionine attached to initiator tRNA for translation initiation in eubacteria and organelles."
