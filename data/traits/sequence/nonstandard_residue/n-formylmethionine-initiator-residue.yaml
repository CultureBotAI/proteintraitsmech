identifier: proteintraitsmech:NONSTD_N_FORMYLMETHIONINE
label: "N-formylmethionine initiator residue"
definition: >-
  Presence of an N-terminal N-formyl-L-methionine (fMet) initiator residue retained on a bacterial, mitochondrial, or plastid polypeptide when peptide deformylase (PDF) processing is bypassed or incomplete.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_NONSTANDARD_RESIDUE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_INITIATOR_METHIONINE
synonyms:
  - synonym_text: "fMet initiator residue"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "retained N-formylmethionine"
    synonym_type: EXACT_SYNONYM
xrefs:
  - MOD:00060
  - CHEBI:16714
detection_methods:
  - name: "N-terminal initiator fMet / deformylase motif scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0239
    tool: "biotools:emboss"
    evidence_code: ECO:0000255
    reference: PMID:16336047
    recipe: "fuzzpro -sequence {input} -pattern '^M[ACDEFGHIKLMNPQRSTVWY]' -outfile {output}"
causal_graphs:
  - graph_id: fmet_initiation_deformylase_bypass
    title: "Methionyl-tRNA formyltransferase initiation and peptide deformylase bypass"
    description: "Methionyl-tRNA formyltransferase activity (GO:0004479 / EC:2.1.2.9) generates N-formyl-L-methionine (CHEBI:16714) on initiator tRNA(fMet) for prokaryotic and organellar translational initiation (GO:0006413); when formylmethionine deformylase activity (GO:0008463 / EC:3.5.1.88) is sterically or kinetically bypassed, the N-formyl-L-methionine residue (MOD:00060) is retained at the mature N-terminus."
    nodes:
      - node_id: "GO:0004479"
        label: "methionyl-tRNA formyltransferase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004479"
        description: "Fmt enzyme activity (EC:2.1.2.9) formylating initiator Met-tRNA(fMet)."
      - node_id: "CHEBI:16714"
        label: N-formyl-L-methionine
        node_type: CHEMICAL
        grounding: "CHEBI:16714"
        description: "Formylated initiator amino acid precursor."
      - node_id: "GO:0006413"
        label: "translational initiation"
