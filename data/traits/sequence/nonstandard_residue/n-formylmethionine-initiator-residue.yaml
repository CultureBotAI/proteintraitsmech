        evidence:
          - reference: PMID:16336047
            snippet: "In bacteria, protein synthesis starts with a formylated methionine (fMet), which is co-translationally removed by peptide deformylase (PDF) in most cases."
            notes: "Formylated initiator methionine synthesis (PMID:16336047). (ECO:0000269)"
      - subject: "CHEBI:16714"
