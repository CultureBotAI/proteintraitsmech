identifier: InterPro:IPR024225
label: Cyclic-AMP phosphodiesterase class-II, conserved site
definition: >-
  Cyclic-AMP phosphodiesterase (EC:3.1.4.17) (PDE) catalyses the hydrolysis of cAMP to the corresponding nucleoside 5' monophosphate. On the basis of sequence similarity, most PDEs can be grouped together, but some enzymes lie apart from the main family and represent a second distinct class that includes PDEs from Dictyostelium and yeast. In the central part of these enzymes there is a highly conserved site which contains three histidines. This entry represents that conserved site.
