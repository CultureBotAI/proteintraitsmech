identifier: InterPro:IPR001018
label: Beta-lactamase, class-B, conserved site
definition: >-
  Synonym(s): Penicillinase, Cephalosporinase Beta-lactamases (EC:3.5.2.6) are enzymes which catalyse the hydrolysis of an amide bond in the beta-lactam ring of antibiotics belonging to the penicillin/cephalosporin family. The class B enzymes are zinc containing proteins whilst class A, C and D enzymes are serine hydrolases. Class B beta-lactamases have been described in several Gram-negative bacterial species; they seem to share the characteristic of being able to hydrolyse carbapenem compounds, new beta-lactam antibiotics of great therapeutic potential. The conserved regions in the sequence of known class B beta-lactamases are centred on residues known to be involved in binding the zinc ion essential for the enzymes catalytic activity.
