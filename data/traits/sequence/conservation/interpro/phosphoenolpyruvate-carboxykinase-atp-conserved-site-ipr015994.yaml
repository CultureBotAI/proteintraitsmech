identifier: InterPro:IPR015994
label: Phosphoenolpyruvate carboxykinase (ATP), conserved site
definition: >-
  Phosphoenolpyruvate carboxykinase (ATP) ( EC:4.1.1.49 ) (PEPCK) catalyses the formation of phosphoenolpyruvate by decarboxylation of oxaloacetate while hydrolysing ATP, a rate limiting step in gluconeogenesis (the biosynthesis of glucose).
