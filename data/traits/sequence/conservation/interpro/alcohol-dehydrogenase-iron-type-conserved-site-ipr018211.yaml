identifier: InterPro:IPR018211
label: Alcohol dehydrogenase, iron-type, conserved site
definition: >-
  Alcohol dehydrogenase (EC:1.1.1.1) (ADH) catalyses the reversible oxidation of ethanol to acetaldehyde with the concomitant reduction of NAD. Currently three, structurally and catalytically, different types of alcohol dehydrogenases are known: Zinc-containing 'long-chain' alcohol dehydrogenases. Insect-type, or 'short-chain' alcohol dehydrogenases. Iron-containing alcohol dehydrogenases. Iron-containing ADH's have been found in yeast (gene ADH4), as well as in Zymomonas mobilis (gene adhB). These two iron-containing ADH's are closely related to the following enzymes: Escherichia coli lactaldehyde reductase (also known as propanediol oxidoreductase) (EC:1.1.1.77) (gene fucO), an enzyme involved in the metabolism of fucose and which also seems to contain ferrous ion(s). Clostridium acetobutylicum NADPH- and NADH-dependent butanol dehydrogenases (EC:1.1.1) (genes adh1, bdhA and bdhB), an enzyme which has activity using butanol and ethanol as substrates. E. coli aldehyde-alcohol dehydrogenase (AdhE), an iron-dependent enzyme which harbor three different activities: alcohol dehydrogenase, acetaldehyde dehydrogenase (acetylating) (EC:1.2.1.10) and pyruvate-formate-lyase deactivase. Bacterial glycerol dehydrogenase (EC:1.1.1.6) (gene gldA or dhaD). Clostridium kluyveri NAD-dependent 4-hydroxybutyrate dehydrogenase (4hbd) (EC:1.1.1.61). Citrobacter freundii and Klebsiella pneumoniae 1,3-propanediol dehydrogenase (EC:1.1.1.202) (gene dhaT). Bacillus methanolicus NAD-dependent methanol dehydrogenase (EC:1.1.1.244). E. coli and Salmonella typhimurium ethanolamine utilization protein eutG. E. coli hypothetical protein yiaY.
