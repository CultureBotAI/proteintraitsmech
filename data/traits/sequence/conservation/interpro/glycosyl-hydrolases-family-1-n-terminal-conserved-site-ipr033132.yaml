identifier: InterPro:IPR033132
label: "Glycosyl hydrolases family 1, N-terminal conserved site"
definition: >-
  This entry represents a conserved site at the N-terminal in Glycosyl hydrolases family 1 proteins. Glycoside hydrolase family 1 ( CAZy:GH1 ) comprises enzymes with a number of known activities; beta-glucosidase ( EC:3.2.1.21 ); beta-galactosidase ( EC:3.2.1.23 ); 6-phospho-beta-galactosidase ( EC:3.2.1.85 ); 6-phospho-beta-glucosidase ( EC:3.2.1.86 ); lactase-phlorizin hydrolase ( EC:3.2.1.62 )/( EC:3.2.1.108 ); beta-mannosidase ( EC:3.2.1.25 ); myrosinase ( EC:3.2.1.147 ).
