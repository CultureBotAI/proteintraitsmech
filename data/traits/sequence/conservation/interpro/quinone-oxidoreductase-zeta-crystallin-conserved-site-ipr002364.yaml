identifier: InterPro:IPR002364
label: Quinone oxidoreductase/zeta-crystallin, conserved site
definition: >-
  This entry represents a conserved region that includes a histidine residue which is the second ligand of the catalytic zinc atom. NADP-dependent quinone oxidoreductases (EC:1.6.5.5) are part of the zinc-containing alcohol dehydrogenase family of enzymes. The NADP-dependent quinone oxidoreductase (EC:1.6.5.5) is found in bacteria (gene qor), in yeast and in mammals where, in some species such as rodents, it has been recruited as an eye lens protein and is known as zeta-crystallin. The sequence of quinone oxidoreductase is distantly related to that other zinc-containing alcohol dehydrogenases and it lacks the zinc-ligand residues. The Torpedo fish and mammalian synaptic vesicle membrane protein vat-1 is related to qor.
