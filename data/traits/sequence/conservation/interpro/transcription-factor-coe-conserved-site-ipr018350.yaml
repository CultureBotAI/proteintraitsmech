identifier: InterPro:IPR018350
label: "Transcription factor COE, conserved site"
definition: >-
  The independent cloning of rodent EBF/Olf-1 and Drosophila melanogaster Collier has defined a family of transcription factors, the Collier or COE family. COE proteins have various functions in different organisms.
