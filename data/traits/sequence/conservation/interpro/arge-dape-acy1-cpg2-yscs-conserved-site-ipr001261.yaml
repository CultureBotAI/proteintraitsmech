identifier: InterPro:IPR001261
label: "ArgE/DapE/ACY1/CPG2/YscS, conserved site"
definition: >-
  This group contains metallopeptidases belonging to MEROPS peptidase family M20 (clan MH), subfamilies M20A and M20B; many are classified as unassigned peptidases or non-peptidase homologues. In addition to the metallopeptidases this group of sequences contain a variety of other protein families from the archaea, bacteria and eukaryota that hydrolyse substrates that share a common structure and are dependent on cobalt or zinc for their activity. They include: glutamate acetyltransferase ( EC:2.3.1.35 ) acetylornithine deacetylase (argE) ( EC:3.5.1.16 ) leucoanthocyanidin dioxygenase succinyldiaminopimelate desuccinylase (dapE) ( EC:3.5.1.18 ) aminoacylase-1 (ACY1), carboxypeptidase G2 (CPG2) ( EC:3.4.17.11 ) vacuolar carboxypeptidase S (yscS) ( EC:3.4.17.4 ) peptidase T ( EC:3.4.11 ) Xaa-His dipeptidase ( EC:3.4.13.3 ).
