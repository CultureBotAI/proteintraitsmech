identifier: InterPro:IPR015875
label: IMP dehydrogenase / GMP reductase, conserved site
definition: >-
  Synonym(s): Inosine-5'-monophosphate dehydrogenase, Inosinic acid dehydrogenase; Synonym(s): Guanosine 5'-monophosphate oxidoreductase This entry contains two related enzymes: IMP dehydrogenase and GMP reductase. These enzymes adopt a TIM barrel structure. IMP dehydrogenase (EC:1.1.1.205) (IMPDH) catalyses the rate-limiting reaction of de novo GTP biosynthesis, the NAD-dependent reduction of IMP into XMP. Inosine 5-phosphate + NAD++ H2O = xanthosine 5-phosphate + NADH IMP dehydrogenase is associated with cell proliferation and is a possible target for cancer chemotherapy. Mammalian and bacterial IMPDHs are tetramers of identical chains. There are two IMP dehydrogenase isozymes in humans. IMP dehydrogenase nearly always contains a long insertion that has two CBS domains within it. GMP reductase (EC:1.7.1.7) catalyses the irreversible and NADPH-dependent reductive deamination of GMP into IMP. NADPH + guanosine 5-phosphate = NADP++ inosine 5-phosphate + NH3 It converts nucleobase, nucleoside and nucleotide derivatives of G to A nucleotides, and maintains intracellular balance of A and G nucleotides.
