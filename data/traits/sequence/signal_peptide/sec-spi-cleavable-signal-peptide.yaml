identifier: proteintraitsmech:SIGNAL_PEPTIDE_SEC_SPI
label: "Sec/SPI cleavable secretory signal peptide"
definition: >-
  Canonical tripartite N-terminal secretory signal peptide (positively charged n-region, hydrophobic h-region, and polar c-region with an Ala-X-Ala motif) translocated across the SecYEG/Sec61 channel and cleaved by signal peptidase I (LepB/SPase I).
