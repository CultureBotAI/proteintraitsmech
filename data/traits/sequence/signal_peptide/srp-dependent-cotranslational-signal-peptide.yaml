identifier: proteintraitsmech:SIGNAL_PEPTIDE_SRP_COTRANSLATIONAL
label: "SRP-dependent cotranslational secretory signal peptide"
definition: >-
  An N-terminal secretory or membrane-targeting signal peptide featuring a highly hydrophobic core (h-region) that is recognized as it emerges from the ribosomal exit tunnel by the ribonucleoprotein Signal Recognition Particle (SRP), arresting or coupling translation to SRP-receptor-mediated delivery of the ribosome-nascent chain complex to the SecYEG/Sec61 translocon for co-translational translocation.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
