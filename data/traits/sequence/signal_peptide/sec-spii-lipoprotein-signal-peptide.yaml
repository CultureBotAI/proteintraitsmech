identifier: proteintraitsmech:SIGNAL_PEPTIDE_SEC_SPII
label: "Sec/SPII lipoprotein signal peptide (lipobox)"
definition: >-
  Prokaryotic N-terminal secretory signal peptide bearing a conserved C-terminal lipobox motif ([LVI][ASTVI][GAS]C) whose invariant +1 cysteine is S-diacylglyceryl modified by Lgt prior to cleavage by lipoprotein signal peptidase II (LspA).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_SIGNAL_PEPTIDE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_SIGNAL_PEPTIDE
synonyms:
  - synonym_text: "Sec/SPII signal peptide"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "bacterial lipoprotein lipobox signal peptide"
    synonym_type: EXACT_SYNONYM
sequence_pattern: "[LVI][ASTVI][GAS]C"
detection_methods:
  - name: "SignalP 6.0 Sec/Tat SPI/SPII/SPIII signal peptide & cleavage predictor"
    method_type: ML_PREDICTOR
    edam_operation: EDAM:operation_0418
    tool: "biotools:signalp"
    evidence_code: ECO:0000255
    reference: PMID:34980915
    recipe: "signalp6 --fastafile {input} --output_dir {output} --format txt --organism other"
causal_graphs:
  - graph_id: sec_spii_lipobox_diacylglyceryl_cleavage
    title: "Sec translocation, Lgt lipobox S-diacylglycerylation, and LspA signal peptidase II cleavage"
    description: "A lipobox signal_peptide (SO:0000418) participates in protein transport by the Sec complex (GO:0043952), after which Lgt catalyzes protein lipidation (GO:0006497) of the invariant +1 cysteine to S-diacylglycerol-L-cysteine (MOD:00116), enabling LspA endopeptidase activity (GO:0004175) upstream of the lipidated cysteine."
    nodes:
      - node_id: "SO:0000418"
        label: signal_peptide
        node_type: MOTIF
        grounding: "SO:0000418"
        description: "Sec/SPII lipoprotein signal peptide carrying the C-terminal [LVI][ASTVI][GAS]C lipobox."
      - node_id: "GO:0043952"
        label: "protein transport by the Sec complex"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0043952"
        description: "SecYEG translocation of the prolipoprotein precursor."
      - node_id: "GO:0006497"
        label: "protein lipidation"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0006497"
        description: "Lgt-catalyzed S-diacylglyceryl transfer onto the lipobox +1 cysteine."
      - node_id: "GO:0004175"
        label: "endopeptidase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004175"
        description: "Lipoprotein signal peptidase II (LspA / SPase II, EC:3.4.23.36) cleavage upstream of +1 Cys."
      - node_id: "MOD:00116"
        label: S-diacylglycerol-L-cysteine
        node_type: PTM
        grounding: "MOD:00116"
        description: "Mature N-terminal S-diacylglyceryl-modified cysteine membrane anchor."
    edges:
      - subject: "SO:0000418"
        predicate: "participates in"
        predicate_id: RO:0000056
        object: "GO:0043952"
        description: "The Sec/SPII leader directs the prolipoprotein across the Sec translocon."
        evidence:
          - reference: PMID:34980915
            snippet: "Signal peptides (SPs) are short amino acid sequences that control protein secretion and translocation in all living organisms."
            notes: "Sec export of Sec/SPII prolipoproteins (PMID:34980915). (ECO:0000305)"
      - subject: "GO:0043952"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0006497"
        description: "Sec translocation presents the lipobox cysteine to prolipoprotein diacylglyceryl transferase (Lgt)."
        evidence:
          - reference: PMID:20572939
            snippet: "Lipoproteins are a distinct class of bacterial membrane proteins that are translocated across the cytoplasmic membrane primarily by the Sec general secretory pathway and then lipidated on a conserved cysteine by the enzyme lipoprotein diacylglycerol transferase (Lgt)."
            notes: "Sec translocation precedes Lgt-catalyzed diacylglyceryl modification of the conserved lipobox cysteine (PMID:20572939). (ECO:0000269)"
      - subject: "GO:0006497"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0004175"
        description: "S-diacylglyceryl modification of the +1 cysteine is required for LspA (SPase II) cleavage."
        evidence:
          - reference: PMID:26912896
            snippet: "Posttranslational processing requires a signal peptidase II (LspA) that removes the signal peptide."
            notes: "SPase II (LspA) removes the signal peptide from the diacylglyceryl-modified prolipoprotein (PMID:26912896). (ECO:0000269)"
      - subject: "GO:0004175"
        predicate: "has output"
        predicate_id: RO:0002234
        object: "MOD:00116"
        description: "SPase II cleavage exposes S-diacylglycerol-L-cysteine as the new N-terminal residue."
        evidence:
          - reference: PMID:20572939
            snippet: "The signal peptide is cleaved by lipoprotein signal peptidase (Lsp) to leave the lipid-modified cysteine at the N-terminus of the mature lipoprotein."
            notes: "Lsp cleavage exposes the lipid-modified cysteine at the mature N-terminus (PMID:20572939). (ECO:0000269)"
evidence:
- reference: PMID:34980915
  notes: SignalP 6.0 predicts all five types of signal peptides and cleavage sites across organisms.
- reference: PMID:42050317
  notes: Nascent bacterial lipoproteins are sequentially modified by Lgt, cleaved by LspA (signal peptidase
    II), and N-acylated.
- reference: PMID:20572939
  notes: Bacterial lipoproteins are translocated across the cytoplasmic membrane primarily by the Sec
    pathway, lipidated on a conserved cysteine by lipoprotein diacylglycerol transferase (Lgt), and cleaved
    by lipoprotein signal peptidase (Lsp).
- reference: PMID:26912896
  notes: Posttranslational processing of bacterial lipoproteins requires signal peptidase II (LspA) to
    remove the signal peptide from the diacylglyceryl-modified prolipoprotein.
