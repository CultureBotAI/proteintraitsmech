identifier: proteintraitsmech:SIGNAL_PEPTIDE_SEC_SPII
label: "Sec/SPII lipoprotein signal peptide (lipobox)"
definition: >-
  Prokaryotic N-terminal secretory signal peptide bearing a conserved C-terminal lipobox motif ([LVI][ASTVI][GAS]C) whose invariant +1 cysteine is S-diacylglyceryl modified by Lgt prior to cleavage by lipoprotein signal peptidase II (LspA).
