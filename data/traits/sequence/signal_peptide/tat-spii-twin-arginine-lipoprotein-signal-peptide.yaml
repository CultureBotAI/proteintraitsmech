identifier: proteintraitsmech:SIGNAL_PEPTIDE_TAT_SPII
label: "Tat/SPII twin-arginine lipoprotein signal peptide"
definition: >-
  Prokaryotic N-terminal signal peptide combining an n-region twin-arginine (RR) motif for folded export via the Tat translocon with a c-region lipobox cysteine processed by lipoprotein signal peptidase II (LspA).
