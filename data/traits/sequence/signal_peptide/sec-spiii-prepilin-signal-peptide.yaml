        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004175"
        description: "Type IV prepilin peptidase (PilD / SPase III, EC:3.4.23.43) cleavage at the cytoplasmic face."
      - node_id: "GO:0051604"
