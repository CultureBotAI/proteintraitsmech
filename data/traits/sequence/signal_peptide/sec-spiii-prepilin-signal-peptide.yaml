        evidence:
          - reference: PMID:34980915
            snippet: "Signal peptides (SPs) are short amino acid sequences that control protein secretion and translocation in all living organisms."
            notes: "Sec insertion of Sec/SPIII prepilins (PMID:34980915). (ECO:0000305)"
      - subject: "GO:0043952"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0004175"
        description: "Membrane insertion positions the prepilin leader peptide on the cytoplasmic side for PilD (SPase III) endopeptidase cleavage."
        evidence:
          - reference: PMID:9224881
            snippet: "It is responsible for endopeptidic cleavage of the unique leader peptides that characterize type-IV pilin precursors, as well as proteins with homologous leader sequences that are essential components of the general secretion pathway found in a variety of Gram-negative pathogens."
            notes: "Endopeptidic cleavage of type-IV prepilin leader peptides by PilD / SPase III (PMID:9224881). (ECO:0000305)"
