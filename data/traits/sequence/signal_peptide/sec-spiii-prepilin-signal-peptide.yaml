identifier: proteintraitsmech:SIGNAL_PEPTIDE_SEC_SPIII
label: "Sec/SPIII type IV prepilin signal peptide"
definition: >-
  Short basic N-terminal leader peptide of bacterial type IV pilins, pseudopilins, and archaeal archaellins, cleaved between a conserved glycine (-1) and a hydrophobic helix (+1 Phe/Met) by prepilin peptidase (PilD / SPase III).
