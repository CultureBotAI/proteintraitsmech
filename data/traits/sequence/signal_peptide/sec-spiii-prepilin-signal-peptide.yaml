    description: "A short basic prepilin signal_peptide (SO:0000418) participates in inner-membrane insertion via protein transport by the Sec complex (GO:0043952), where prepilin peptidase (PilD / SPase III) endopeptidase activity (GO:0004175) cleaves after the conserved -1 glycine to drive pilin protein maturation (GO:0051604)."
