identifier: proteintraitsmech:SIGNAL_PEPTIDE_SEC_SPII_LOL_AVOIDANCE
label: "Lol-avoidance inner-membrane lipoprotein signal peptide (SPase II, +2 Asp)"
definition: >-
  A Gram-negative bacterial Sec/SPII lipoprotein signal peptide and N-terminal sorting determinant carrying a conserved lipobox ([LVI][ASTVI][GAS]C) immediately followed by an aspartate residue at position +2 of the mature triacylated chain (the +2 rule / Lol-avoidance motif) that prevents recognition by the LolCDE ABC transporter and retains the mature lipoprotein anchored to the periplasmic leaflet of the inner (cytoplasmic) membrane.
