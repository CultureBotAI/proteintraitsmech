identifier: proteintraitsmech:UNIPROT_FT_SEQ_SIGNAL_PEPTIDE
label: signal peptide
definition: >-
  An N-terminal secretory signal peptide (typically 15-30 residues with a positively charged n-region, a hydrophobic h-region, and a polar c-region carrying a small neutral residue at -3/-1) that targets nascent polypeptides to the Sec or Tat translocation machinery and is cleaved by signal peptidase during or immediately after membrane translocation.
definition_source: UniProtKB feature type
trait_axis: SEQUENCE
trait_category: SEQ_SIGNAL_PEPTIDE
term_kind: CLASS
mapping_status: SEEDED
