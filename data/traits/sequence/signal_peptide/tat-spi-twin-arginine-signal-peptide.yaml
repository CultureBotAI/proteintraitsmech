identifier: proteintraitsmech:SIGNAL_PEPTIDE_TAT_SPI
label: "Tat/SPI twin-arginine signal peptide"
definition: >-
  N-terminal signal peptide containing a conserved twin-arginine motif ([ST]RRxFLK) in its n/h boundary that directs folded, cofactor-bound proteins across the twin-arginine translocation (TatABC) pathway and is cleaved by signal peptidase I.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_SIGNAL_PEPTIDE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:UNIPROT_FT_SEQ_SIGNAL_PEPTIDE
synonyms:
  - synonym_text: "Tat/SPI signal peptide"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "twin-arginine translocation signal peptide"
    synonym_type: EXACT_SYNONYM
sequence_pattern: "[ST]RR[A-Z][FLV][LK]"
detection_methods:
  - name: "SignalP 6.0 Sec/Tat SPI/SPII/SPIII signal peptide & cleavage predictor"
    method_type: ML_PREDICTOR
    edam_operation: EDAM:operation_0418
    tool: "biotools:signalp"
    evidence_code: ECO:0000255
    reference: PMID:34980915
    recipe: "signalp6 --fastafile {input} --output_dir {output} --format txt --organism other"
causal_graphs:
  - graph_id: tat_spi_folded_export_and_cleavage
    title: "Twin-arginine (TatABC) folded protein translocation and signal peptidase I cleavage"
    description: "A twin-arginine signal_peptide (SO:0000418) participates in protein transport by the Tat complex (GO:0043953) of folded proteins, followed by signal peptidase I endopeptidase activity (GO:0004175) to complete protein secretion (GO:0009306)."
    nodes:
      - node_id: "SO:0000418"
        label: signal_peptide
        node_type: MOTIF
        grounding: "SO:0000418"
        description: "Tat/SPI leader peptide containing the [ST]RRxFLK twin-arginine motif."
      - node_id: "GO:0043953"
        label: "protein transport by the Tat complex"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0043953"
        description: "Export of folded proteins across the membrane by the TatABC translocase."
      - node_id: "GO:0004175"
        label: "endopeptidase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004175"
        description: "Signal peptidase I (LepB / SPase I) cleavage at the c-region AxA site."
      - node_id: "GO:0009306"
        label: "protein secretion"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0009306"
        description: "Release of the mature folded cofactor-containing protein."
    edges:
      - subject: "SO:0000418"
        predicate: "participates in"
        predicate_id: RO:0000056
        object: "GO:0043953"
        description: "The twin-arginine motif targets folded preproteins to the Tat translocase."
        evidence:
          - reference: PMID:34122494
            snippet: "We developed a set of in-house expression vectors for transient transformation of Nicotiana benthamiana leaves that target a VHH-Fc to the thylakoid lumen via either secretory (Sec) or twin-arginine translocation (Tat) import pathways."
            notes: "Twin-arginine targeting to Tat translocon (PMID:34122494). (ECO:0000305)"
      - subject: "GO:0043953"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0004175"
        description: "Tat translocation exports the folded preprotein across the cytoplasmic membrane to expose the cleavage site to signal peptidase I."
        evidence:
          - reference: PMID:22683878
            snippet: "The twin-arginine translocation (Tat) protein export system is present in the cytoplasmic membranes of most bacteria and archaea and has the highly unusual property of transporting fully folded proteins."
            notes: "Tat export of folded proteins across the cytoplasmic membrane (PMID:22683878). (ECO:0000305)"
      - subject: "GO:0004175"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0009306"
        description: "SPase I cleavage releases the mature folded protein into the periplasm or extracellular space."
        evidence:
          - reference: PMID:24333859
            snippet: "Type I signal peptidase is the enzyme responsible for cleaving off the amino-terminal signal peptide from proteins that are secreted across the bacterial cytoplasmic membrane."
            notes: "SPase I cleavage releases the mature Tat-exported protein (PMID:24333859). (ECO:0000305)"
evidence:
  - reference: PMID:34980915
    notes: "Prediction of Tat/SPI twin-arginine signal peptides with SignalP 6.0."
  - reference: PMID:34122494
    notes: "Secretory (Sec) and twin-arginine translocation (Tat) signal peptides direct protein export across membranes."
  - reference: PMID:22683878
    notes: "The twin-arginine translocation (Tat) protein export system in bacteria and archaea transports fully folded proteins across the cytoplasmic membrane."
  - reference: PMID:24333859
    notes: "Type I signal peptidase cleaves off the amino-terminal signal peptide from proteins secreted across the bacterial cytoplasmic membrane."
