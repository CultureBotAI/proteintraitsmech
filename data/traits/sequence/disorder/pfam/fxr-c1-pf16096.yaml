identifier: Pfam:PF16096
label: 'Fragile X-related 1 protein C-terminal region 2 '
definition: >-
  This is a small highly conserved region of the C terminus of Fragile X-related proteins 1 and 2, FRX1, FRX2. The domain is immediately C-terminal to the core C- terminal region, InterPro:IPR022034, and contains at least one block of RGG repeats that bind to G-quartet sequences in a wide variety of mRNAs.
