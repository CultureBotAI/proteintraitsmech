label: T-box domain profile
definition: >-
  T-box domain signatures and profile. A number of eukaryotic DNA-binding proteins contain a domain of about 170 to 190 amino acids known as the T-box domain and which probably binds DNA. The T-box has first been found in the mice T locus (Brachyury) protein, a transcription factor involved in mesoderm differentiation. It has since been found in the following proteins:
