identifier: PROSITE:PS51126
label: Dilute domain profile
definition: >-
  Dilute domain profile. The myosin superfamily consists of at least 15 distinct classes of presumed actin-based molecular motors. All members of the superfamily share a similar motor domain and a tail portion which is diagnostic of the class.
