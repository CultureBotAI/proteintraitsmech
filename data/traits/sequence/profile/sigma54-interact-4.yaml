identifier: PROSITE:PS50045
label: Sigma-54 interaction domain profile
definition: >-
  Sigma-54 interaction domain signatures and profile. Some bacterial regulatory proteins activate the expression of genes from promoters recognized by core RNA polymerase associated with the alternative sigma-54 factor. These have a conserved domain of about 230 residues involved in the ATP-dependent interaction with sigma-54. This domain has been found in the proteins listed below:
