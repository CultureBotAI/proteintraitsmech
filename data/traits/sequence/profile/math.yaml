identifier: PROSITE:PS50144
label: MATH/TRAF domain profile
definition: >-
  MATH/TRAF domain profile. Although apparently functionally unrelated, intracellular TRAFs and extracellular meprins share a conserved region of about 180 residues, the meprin and TRAF homology (MATH) domain.
