label: Zinc finger C2HC/C3H-type profile
definition: >-
  Zinc finger C2HC/C3H-type profile. The C2HC/C3H-type zinc finger has first been identified in four copies in Zfp474, a protein exclusively found in testis and ovary and thought to function as a germ cell specific transcription factor that plays important roles in spermatid differentiation and oocyte development. It is also found in:
