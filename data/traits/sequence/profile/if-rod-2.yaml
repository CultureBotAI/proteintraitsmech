identifier: PROSITE:PS51842
label: Intermediate filament (IF) rod domain profile
definition: >-
  Intermediate filament (IF) rod domain signature and profile. Intermediate filaments (IF) are proteins which are primordial components of the cytoskeleton and the nuclear envelope. They generally form filamentous structures 8 to 14 nm wide. IF proteins are members of a very large multigene family of proteins which has been subdivided in six types:
