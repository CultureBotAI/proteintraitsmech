label: Carbon-nitrogen hydrolase domain profile
definition: >-
  Carbon-nitrogen hydrolase domain profile. The carbon-nitrogen hydrolase domain is an around 265-residue domain found in numerous enzymes involved in the reduction of organic nitrogen compounds and ammonia production. Based on their sequence similarity and on the reactions they catalyze, these enzymes can be classified into functionally distinct groups including:
