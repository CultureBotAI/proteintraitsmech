identifier: proteintraitsmech:PROPEPTIDE_GPI_C_TERMINAL
label: "GPI-anchor C-terminal transamidase-cleaved propeptide"
definition: >-
  A transient C-terminal propeptide extension (spanning the polar spacer downstream of the omega cleavage site and a C-terminal hydrophobic tail) on precursor proteins destined for glycosylphosphatidylinositol (GPI) anchoring that is recognized and cleaved at the omega residue in the endoplasmic reticulum lumen by the heteropentameric GPI-anchor transamidase complex (PIGK/GPAA1/PIGT/PIGS/PIGU, GO:0003923) concomitant with amide-bond transfer of the mature C-terminus onto a preassembled GPI glycolipid anchor.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_PROPEPTIDE
term_kind: CLASS
mapping_status: SEEDED
