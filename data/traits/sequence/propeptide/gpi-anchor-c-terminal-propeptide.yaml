    title: "GPI-anchor transamidase cleavage of C-terminal propeptide and GPI attachment"
    description: "The C-terminal GPI propeptide extension (SO:0001062) positions the precursor omega site in the catalytic cleft of the PIGK subunit within the GPI-anchor transamidase complex (GO:0003923), which cleaves off the C-terminal propeptide and catalyzes attachment of the GPI anchor to the protein (GO:0016255), driving endoplasmic-reticulum protein maturation (GO:0051604)."
    nodes:
      - node_id: "SO:0001062"
        label: propeptide
        node_type: MOTIF
        grounding: "SO:0001062"
        description: "Transient C-terminal hydrophobic propeptide downstream of the omega site cleaved during GPI transamidation"
      - node_id: "GO:0003923"
        label: "GPI-anchor transamidase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0003923"
        description: "Catalytic activity of the GPI transamidase complex (PIGK Cys206-His164-Asn58 triad) cleaving the omega-site peptide bond and transferring the GPI anchor"
      - node_id: "GO:0016255"
        label: "attachment of GPI anchor to protein"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0016255"
        description: "Endoplasmic-reticulum covalent replacement of the C-terminal propeptide with a preassembled GPI glycolipid anchor"
      - node_id: "GO:0051604"
        label: "protein maturation"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0051604"
        description: "Maturation of GPI-anchored precursor proteins in the endoplasmic reticulum prior to cell-surface transport"
    edges:
      - subject: "SO:0001062"
        predicate: "participates in"
        predicate_id: RO:0000056
        object: "GO:0003923"
        description: "The C-terminal propeptide participates as the cleavage/transfer substrate at the PIGK Cys206-His164-Asn58 catalytic triad of GPI transamidase."
        evidence:
          - reference: PMID:35165458
            snippet: "The PIGK subunit functions as the catalytic component, in which we identified a C206-H164-N58 triad that is critical for the transamination reaction."
            notes: "PIGK Cys206-His164-Asn58 catalytic triad drives the GPI transamidation cleavage/transfer reaction (PMID:35165458). (ECO:0000269)"
      - subject: "GO:0003923"
        predicate: "positively regulates"
        predicate_id: RO:0002213
        object: "GO:0016255"
        description: "GPI-anchor transamidase cleavage of the C-terminal propeptide catalyzes covalent attachment of the GPI anchor in the ER."
        evidence:
          - reference: PMID:35165458
            snippet: "Attaching GPI to the protein in the endoplasmic reticulum (ER) is catalyzed by the transmembrane GPI transamidase (GPIT) complex, which is essential for maturation of the GPI-anchored proteins."
            notes: "GPIT complex catalyzes GPI attachment in the ER (PMID:35165458). (ECO:0000269)"
      - subject: "GO:0016255"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0051604"
        description: "Covalent GPI-anchor attachment in the ER tethers matured GPI-anchored proteins to the cell surface."
        evidence:
          - reference: PMID:35165458
            snippet: "Glycosylphosphatidylinositol (GPI) molecules are complex glycophospholipids and serve as membrane anchors for tethering many proteins to the cell surface."
            notes: "GPI anchoring tethers matured proteins to the cell surface (PMID:35165458). (ECO:0000269)"
evidence:
  - reference: PMID:35165458
    notes: "Attachment of GPI anchors to precursor proteins in the ER is catalyzed by the five-subunit transmembrane GPI transamidase (GPIT) complex via the PIGK Cys206-His164-Asn58 catalytic triad."
