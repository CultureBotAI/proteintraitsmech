    synonym_type: EXACT_SYNONYM
  - synonym_text: "omega-site C-terminal propeptide"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "GPI-T cleaved C-terminal peptide"
    synonym_type: RELATED_SYNONYM
