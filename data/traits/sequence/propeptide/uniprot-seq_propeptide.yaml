identifier: proteintraitsmech:UNIPROT_FT_SEQ_PROPEPTIDE
label: propeptide
definition: >-
  A transient propeptide / pro-region (N-terminal, C-terminal, or internal) that suppresses premature enzymatic or hormonal activity, assists folding as an intramolecular chaperone, or provides an enzyme-docking exosite, and is proteolytically removed during proprotein maturation or zymogen activation.
