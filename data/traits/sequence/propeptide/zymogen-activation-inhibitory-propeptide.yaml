identifier: proteintraitsmech:PROPEPTIDE_ZYMOGEN_ACTIVATION
label: "zymogen-activation autoinhibitory propeptide"
definition: >-
  Cleavable propeptide segment of an enzyme precursor (zymogen) that sterically blocks or distorts the catalytic cleft (e.g. via a cysteine-switch or activation peptide) until proteolytic removal triggers irreversible enzyme activation.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_PROPEPTIDE
term_kind: CLASS
mapping_status: SEEDED
