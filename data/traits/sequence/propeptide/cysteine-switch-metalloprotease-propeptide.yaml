identifier: proteintraitsmech:PROPEPTIDE_CYSTEINE_SWITCH_METALLOPROTEASE
label: "cysteine-switch latency-maintaining metalloprotease propeptide"
definition: >-
  An N-terminal inhibitory propeptide domain of matrix metalloproteinases (MMPs) and related metzincin metalloproteases that harbors a conserved cysteine-switch motif (consensus PRCGXPD) whose thiol side chain coordinates the catalytic zinc(2+) ion as a fourth ligand to exclude water and maintain zymogen latency until proteolytic cleavage or conformational perturbation dissociates the Cys-Zn(2+) bond.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
