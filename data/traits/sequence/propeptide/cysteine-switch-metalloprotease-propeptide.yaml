    description: "The N-terminal propeptide (SO:0001062) positions a conserved L-cysteine residue (CHEBI:29950) that participates in intramolecular active-site metal ion binding (GO:0046872) to block the catalytic zinc ion, whereas dissociation of this cysteine-zinc complex is causally upstream of zymogen activation (GO:0031638)."
