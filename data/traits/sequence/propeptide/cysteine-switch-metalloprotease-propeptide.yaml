            snippet: "Latent HFC can be activated by multiple means, all of which effect the dissociation of the cysteine residue from the complex."
            notes: "Dissociation of the Cys-Zn complex switches the zymogen to the active state. (ECO:0000269)"
evidence:
  - reference: PMID:2164689
    notes: "Matrix metalloproteinase propeptides maintain zymogen latency via a conserved cysteine residue that coordinates the catalytic zinc ion until dissociation triggers activation."
