    description: "An intramolecular-chaperone propeptide (SO:0001062) participates in protein folding (GO:0006457) of the cognate protease domain, which then undergoes rate-limiting endopeptidase activity (GO:0004175) cleavage and IMC degradation during zymogen activation (GO:0031638)."
