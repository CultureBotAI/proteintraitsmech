        evidence:
          - reference: PMID:33569954
            snippet: "Subtilisin is produced as a precursor that requires its N-terminal propeptide to act as an IMC to chaperone the folding of its subtilisin domain."
            notes: "Intramolecular chaperone role in protein folding (PMID:33569954). (ECO:0000269)"
      - subject: "GO:0006457"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0004175"
        description: "During precursor folding, the peptide bond between the IMC and subtilisin domain is cleaved."
        evidence:
          - reference: PMID:33569954
            snippet: "During the precursor folding, the cleavage of the peptide bond between the IMC and the subtilisin domain is the most important and rate-limiting step, which leads to the structural reorganization of the subtilisin domain and IMC's degradation."
            notes: "Precursor folding enables rate-limiting IMC cleavage (PMID:33569954). (ECO:0000269)"
      - subject: "GO:0004175"
