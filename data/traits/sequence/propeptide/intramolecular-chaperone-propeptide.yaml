identifier: proteintraitsmech:PROPEPTIDE_INTRAMOLECULAR_CHAPERONE
label: "intramolecular-chaperone propeptide"
definition: >-
  Cleavable propeptide domain (exemplified by subtilisin, alpha-lytic protease, and carboxypeptidase Y pro-regions) that lowers the kinetic folding barrier of the mature catalytic domain and is subsequently degraded after autocatalytic cleavage.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
