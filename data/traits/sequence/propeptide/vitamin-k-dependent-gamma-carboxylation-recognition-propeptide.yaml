identifier: proteintraitsmech:PROPEPTIDE_VKD_GLA_RECOGNITION
label: "vitamin K-dependent gamma-carboxylation recognition propeptide"
definition: >-
  A cleavable N-terminal propeptide (typically residues -18 to -1, carrying conserved Phe-16 and Ala-10 recognition determinants) in vitamin K-dependent coagulation and calcification precursor proteins (such as Factor IX, Factor X, prothrombin, Protein C, and osteocalcin) that functions as an obligate exosite docking motif for vitamin K-dependent gamma-glutamyl carboxylase (GGCX, GO:0008488) in the endoplasmic reticulum, directing processive gamma-carboxylation of downstream glutamate residues into L-gamma-carboxyglutamic acid (Gla, MOD:00041) prior to propeptide excision in the trans-Golgi.
