identifier: proteintraitsmech:PROPEPTIDE_ANTIMICROBIAL_PEPTIDE_ANIONIC_SHIELD
label: "anionic charge-neutralizing antimicrobial propeptide"
definition: >-
  An acidic (Asp/Glu-enriched, net negatively charged) N-terminal propeptide domain of cationic antimicrobial peptide precursors (such as mammalian alpha-defensins, human neutrophil peptides HNP-1..3, Paneth-cell HD5, and cathelicidins) that intramolecularly neutralizes the polycationic mature peptide domain during biosynthesis and vesicular trafficking to prevent autocytotoxicity and assist folding until proteolytic excision in storage granules or upon secretion.
