identifier: proteintraitsmech:COMPBIAS_SERINE_THREONINE_RICH_REGION
label: "serine/threonine-rich region"
definition: >-
  A compositionally biased hydroxyl-rich sequence region enriched in L-serine and/or L-threonine residues (including mucin-like PTS domains and SR-protein RS domains), frequently serving as a dense substrate for O-glycosylation or multisite phosphorylation.
