identifier: proteintraitsmech:COMPBIAS_CYSTEINE_RICH_REGION
label: "cysteine-rich region"
definition: >-
  A compositionally biased protein region enriched in L-cysteine residues that supports high-density disulfide crosslinking (as in keratins, defensins, and extracellular matrix modules) or polynuclear metal-thiolate cluster coordination (as in metallothioneins).
