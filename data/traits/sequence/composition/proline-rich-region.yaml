identifier: proteintraitsmech:COMPBIAS_PROLINE_RICH_REGION
label: "proline-rich region"
definition: >-
  A compositionally biased protein segment enriched in L-proline residues that favors extended polyproline II (PPII) left-handed helical conformations and serves as a recognition scaffold for SH3, WW, EVH1, and profilin domains.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
