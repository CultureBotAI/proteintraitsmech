identifier: proteintraitsmech:COMPBIAS_POLYGLUTAMINE_TRACT
label: "polyglutamine tract"
definition: >-
  A glutamine-biased homopolymeric sequence region (typically >= 8 consecutive or near-consecutive Gln residues) that modulates transcriptional coactivator interactions and, above pathogenic length thresholds, nucleates cross-beta amyloid aggregation.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_COMPOSITION
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:LOWCOMP_HOMOREPEAT_TRACT
synonyms:
  - synonym_text: "polyQ tract"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "poly-Gln region"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "glutamine-rich homorepeat"
    synonym_type: RELATED_SYNONYM
sequence_pattern: "Q{8,}"
detection_methods:
  - name: "fLPS2 compositional bias binomial P-value scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0234
    tool: "biotools:flps"
    evidence_code: ECO:0007669
    reference: PMID:28851299
    recipe: "fLPS -t 1e-5 -c default {input} > {output}"
evidence:
  - reference: PMID:22510761
    notes: "Polyglutamine tracts are among the most prevalent functional and pathogenic homorepeats in eukaryotes."
