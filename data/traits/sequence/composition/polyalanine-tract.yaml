identifier: proteintraitsmech:COMPBIAS_POLYALANINE_TRACT
label: "polyalanine tract"
definition: >-
  An alanine-biased homopolymeric sequence tract (typically >= 7 consecutive Ala residues) common in transcription factors and RNA-binding proteins, where it forms alpha-helical spacers and can misfold upon tract expansion.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_COMPOSITION
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
  - proteintraitsmech:LOWCOMP_HOMOREPEAT_TRACT
synonyms:
  - synonym_text: "polyA tract"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "poly-Ala region"
    synonym_type: EXACT_SYNONYM
sequence_pattern: "A{7,}"
detection_methods:
  - name: "fLPS2 compositional bias binomial P-value scan"
    method_type: SEQUENCE_PATTERN
    edam_operation: EDAM:operation_0234
    tool: "biotools:flps"
    evidence_code: ECO:0007669
    reference: PMID:28851299
    recipe: "fLPS -t 1e-5 -c default {input} > {output}"
evidence:
  - reference: PMID:15520409
    notes: "Polyalanine tract expansions in transcription factors cause developmental disorders via misfolding."
