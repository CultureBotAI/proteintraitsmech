identifier: proteintraitsmech:COMPBIAS_GLYCINE_RICH_REGION
label: "glycine-rich region"
definition: >-
  A compositionally biased protein region enriched in achiral glycine residues (including GGG, GGX, and RGG/YG tracts) that imparts high backbone conformational entropy, flexible linker dynamics, or beta-sheet/fibril packing.
