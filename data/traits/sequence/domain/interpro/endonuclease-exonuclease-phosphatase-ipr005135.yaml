identifier: InterPro:IPR005135
label: Endonuclease/exonuclease/phosphatase
definition: >-
  This domain is found in a large number of proteins including magnesium dependent endonucleases and phosphatases involved in intracellular signalling. Proteins this domain is found in include: AP endonuclease proteins ( EC:4.2.99.18 ), DNase I proteins ( EC:3.1.21.1 ), Synaptojanin an inositol-1,4,5-trisphosphate phosphatase ( EC:3.1.3.56 ) and Sphingomyelinase ( EC:3.1.4.12 ).
