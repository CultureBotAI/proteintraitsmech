definition: >-
  This domain is found in the putative secreted protein BF4250 from Bacteroides fragilis ( UniProtKB:Q5L7M9 ) and similar bacterial functionally uncharacterised proteins. It adopts a β-sandwich with a greek key topology PDB:3OWR. This domain seems to be related to InterPro:IPR032186.
