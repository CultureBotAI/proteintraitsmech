identifier: InterPro:IPR037621
label: "Liprin-alpha, SAM domain 2"
definition: >-
  This entry represents the SAM (sterile alpha motif) domain repeat 2 of liprin-alpha. Liprin-alpha proteins contain three copies (repeats) of the SAM domain, which is a protein-protein interaction domain. They may form heterodimers with liprin-beta proteins through their SAM domains. They participate in mammary gland development and in axon guidance; in particular, liprin-alpha is involved in formation of the presynaptic active zone.
