identifier: InterPro:IPR002469
label: Dipeptidylpeptidase IV, N-terminal domain
definition: >-
  This domain defines serine peptidases belonging to MEROPS peptidase family S9 (clan SC), subfamily S9B (dipeptidyl-peptidase IV). The protein fold of the peptidase domain for members of this family resembles that of serine carboxypeptidase D, the type example of clan SC. This domain is an alignment of the region to the N-terminal side of the active site, which is found in InterPro:IPR001375. Dipeptidyl-peptidase IV (EC:3.4.14.5) is also called adenosine deaminase-binding protein (ADA-binding protein) or CD26. The exopeptidase cleaves off N-terminal X-Pro or X-Ala dipeptides from polypeptides (dipeptidyl peptidase IV activity). It serves as the costimulatory molecule in T cell activation and is an associated marker of autoimmune diseases, adenosine deaminase-deficiency and HIV pathogenesis.
