identifier: InterPro:IPR026937
label: "Strawberry notch, helicase C domain"
definition: >-
  Strawberry notch proteins carry DExD/H-box groups and Helicase_C domains. These proteins promote the expression of diverse targets, potentially through interactions with transcriptional activator or repressor complexes.
