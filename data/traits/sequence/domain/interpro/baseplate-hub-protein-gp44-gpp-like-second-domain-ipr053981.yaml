identifier: InterPro:IPR053981
label: "Baseplate hub protein gp44/GpP-like, second domain"
definition: >-
  This domain is found in baseplate hub protein gp44 from Escherichia phage Mu, GpP from Shewanella oneidensis ( UniProtKB:Q8EDP4 ) and similar proteins found in tailed bacteriophages and bacterial prophages. This domain is located C-terminal to InterPro:IPR049354 and N-terminal to InterPro:IPR053982.
