identifier: InterPro:IPR057450
label: "BRINP, EGF domain"
definition: >-
  This predicted EGF domain is found in BMP/retinoic acid-inducible neural-specific proteins (BRINP) 1, 2 and 3. This domain is often found between and . BRINP proteins are involved in neurogenesis and brain development. These proteins play a role in inhibiting neuronal cell proliferation by negatively regulating cell cycle progression, particularly by suppressing the G1/S transition in postmitotic neurons. This regulation is essential for proper brain development and the functioning of GABAergic neurons. Additionally, certain BRINP proteins have been implicated in promoting the proliferation, migration, and invasion of pituitary gonadotrope cells when overexpressed, suggesting a potential role in pituitary tumour development. BRINP proteins are also characterised by their responsiveness to BMP and retinoic acid, which are key signalling molecules in neural-specific pathways.
