label: "Granulysin domain"
definition: >-
  This domain is found in human Granulysin (GNLY) and related sequences. GNLY is an antimicrobial protein that kills intracellular pathogens. This domain shows an all-α configuration. It is found in association with InterPro:IPR008138.
