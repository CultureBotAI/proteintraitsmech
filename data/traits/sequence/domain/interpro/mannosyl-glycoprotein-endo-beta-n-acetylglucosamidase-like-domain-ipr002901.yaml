identifier: InterPro:IPR002901
label: Mannosyl-glycoprotein endo-beta-N-acetylglucosamidase-like domain
definition: >-
  This domain is found in many different proteins including mannosyl-glycoprotein endo-beta-N-acetylglucosamidase (EC:3.2.1.96). It is also found in flagellar protein J (UniProtKB:P75942), which has been shown to hydrolyse peptidoglycan.
