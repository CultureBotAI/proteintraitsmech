identifier: InterPro:IPR021930
label: Heparan sulphate-N-deacetylase, deacetylase domain
definition: >-
  This domain is found in heparan sulphate N-deacetylase enzymes. It is often found associated with . This entry represents the deacetylase domain which has a fold closely related to the CE domain of Agd3 from A. fumigatus.
