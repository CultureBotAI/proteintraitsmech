identifier: InterPro:IPR037452
label: Tyrosine-protein kinase Fer, F-BAR domain
definition: >-
  Fer ( EC:2.7.10.2 ) is a tyrosine-protein kinase that acts downstream of cell surface receptors for growth factors and plays a role in the regulation of the actin cytoskeleton, microtubule assembly, lamellipodia formation, cell adhesion, cell migration and chemotaxis. In non-small cell lung cancer cells, Fer kinase expression has been linked to cell invasion and tumour metastasis. It also acts downstream of EGFR (EGF receptor) to promote activation of NF-kappa-B and cell proliferation. This entry represents the F-BAR domain of Fer. F-BAR domains are dimerization modules that bind and bend membranes and are found in proteins involved in membrane dynamics and actin reorganization.
