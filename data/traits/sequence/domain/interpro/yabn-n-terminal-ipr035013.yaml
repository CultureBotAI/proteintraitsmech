identifier: InterPro:IPR035013
label: "YabN, N-terminal"
definition: >-
  Bacillus subtilis YabN is a fusion of an N-terminal TP-methylase and a C-terminal MazG-type nucleotide pyrophosphohydrolase domain. MazG-like NTP-PPases have been implicated in house-cleaning functions such as degrading abnormal (d)NTPs. TP-methylases use S-AdoMet (S-adenosyl-L-methionine or SAM) in the methylation of diverse substrates. Most members catalyze various methylation steps in cobalamin (vitamin B12) biosynthesis, other members like Diphthine synthase and Ribosomal RNA small subunit methyltransferase I (RsmI) act on other substrates ( InterPro:IPR000878 ). The specific function of YabN's TP-methylase domain is not known.
