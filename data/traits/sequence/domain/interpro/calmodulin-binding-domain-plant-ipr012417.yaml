identifier: InterPro:IPR012417
label: Calmodulin-binding domain, plant
definition: >-
  This domain is found repeated in a number of plant calmodulin-binding proteins (such as UniProtKB:Q8W235, UniProtKB:Q84ZT8 and UniProtKB:Q8H6X1 ). It is thought to represent a calmodulin-binding domain. Binding of the proteins to calmodulin depends on the presence of calcium ions. Proteins containing this domain are thought to be involved in various processes, such as plant defence responses and stolonisation or tuberization.
