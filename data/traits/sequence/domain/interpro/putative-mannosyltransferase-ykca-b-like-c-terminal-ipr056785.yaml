identifier: InterPro:IPR056785
label: "Putative mannosyltransferase YkcA/B-like, C-terminal"
definition: >-
  This domain is found at the C-terminal end of the putative mannosyltransferases YkcA and YkcB from Bacillus subtilis and similar sequences. This domain is predicted to adopt an α-β configuration. It is usually found associated with InterPro:IPR038731.
