identifier: InterPro:IPR011112
label: Rho termination factor-like, N-terminal
definition: >-
  The Rho termination factor disengages newly transcribed RNA from its DNA template at certain, specific transcripts. It is thought that two copies of Rho bind to RNA and that Rho functions as a hexamer of protomers. This domain is found to the N terminus of the RNA binding domain (InterPro:IPR011113).
