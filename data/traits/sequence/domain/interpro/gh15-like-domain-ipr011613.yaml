identifier: InterPro:IPR011613
label: "GH15-like domain"
definition: >-
  This entry represents a domain found in glycoside hydrolase family 15 members and in phosphorylase b kinase regulatory chains alpha and beta. Glycoside hydrolase family 15 CAZy:GH15 comprises enzymes with several known activities; glucoamylase (EC:3.2.1.3); alpha-glucosidase (EC:3.2.1.20); glucodextranase (EC:3.2.1.70).
