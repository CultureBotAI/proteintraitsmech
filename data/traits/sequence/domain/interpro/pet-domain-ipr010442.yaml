identifier: InterPro:IPR010442
label: PET domain
definition: >-
  The PET domain is a ~110 amino acid motif in the N-terminal part of LIM domain proteins. The domain was described in Drosophila proteins involved in cell differentiation and is named after Prickle, Espinas and Testin. PET domain proteins contain about three zinc-binding LIM domains (see InterPro:IPR001781) and are found among metazoans. The PET domain has been suggested to play a role in protein-protein interactions with proteins involved in planar polarity signalling or organisation of the cytoskeleton. Some proteins known to contain a PET domain: Mammalian testin protein (UniProtKB:Q9UGI8), which may function as a tumour suppressor. Mammalian LIM domain only protein 6 (LMO6/Prickle3, UniProtKB:O43900). Fruit fly prickle (UniProtKB:A1Z6W3) and espinas (UniProtKB:Q9U1I1) proteins encoded by the tissue polarity gene prickle (pk), involved in the control of orientation of bristles and hairs. Mammalian prickle-like proteins 1 (UniProtKB:Q96MT3) and 2 (UniProtKB:Q7Z3G6).
