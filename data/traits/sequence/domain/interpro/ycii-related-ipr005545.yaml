identifier: InterPro:IPR005545
label: YCII-related
definition: >-
  The majority of proteins in this group contain a single copy of this domain, though it is also found as a repeat. A strongly conserved histidine and a aspartate suggest that the domain has an enzymatic function. This entry also covers what was previously known as the DGPF domain (COG3795), named after the most conserved motif in the alignment. Although its function is unknown it is found fused to a sigma-70 factor family domain in UniProtKB:Q9A8M4, suggesting that this domain may plays a role in transcription initiation.
