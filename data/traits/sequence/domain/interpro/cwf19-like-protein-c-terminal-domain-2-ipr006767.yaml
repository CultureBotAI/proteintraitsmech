identifier: InterPro:IPR006767
label: "Cwf19-like protein, C-terminal domain-2"
definition: >-
  This group of sequences contain a conserved C-terminal domain which is found in the Schizosaccharomyces pombe (Fission yeast) protein Cwf19 ( UniProtKB:Q09909 ) and its homologues. Cwf19 is part of the Cdc5p complex involved in mRNA splicing. CWF19-like protein DRN1 from Saccharomyces cerevisiae ( UniProtKB:P53255 ) is involved branched RNA metabolism, modulating the turnover of lariat-intron pre-mRNAs by the lariat-debranching enzyme DBR1 ( UniProtKB:P53255 ). This domain is found in association with InterPro:IPR006768, which is generally N-terminal and adjacent to this domain, and contain evolutionarily conserved cysteine and histidine residues in an arrangement similar to the CCCH-class of zinc fingers.
