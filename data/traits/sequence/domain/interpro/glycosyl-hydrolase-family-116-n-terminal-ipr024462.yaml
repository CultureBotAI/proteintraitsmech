identifier: InterPro:IPR024462
label: "Glycosyl-hydrolase family 116, N-terminal"
definition: >-
  This entry represents the N-terminal domain found in the CAZyme GH116 family members, which presently includes enzymes with beta-glucosidase ( EC:3.2.1.21 ), beta-xylosidase ( EC:3.2.1.37 ), and glucocerebrosidase ( EC:3.2.1.45 ) activity. The N-terminal is thought to be the luminal domain while the C-terminal is the cytosolic domain. Proteins containing this domain include animal non-lysosomal glucosylceramidase GBA2, which catalyse the conversion of glucosylceramide to free glucose and ceramide. GBA2 is involved in sphingomyelin generation and prevention of glycolipid accumulation and may also catalyse the hydrolysis of bile acid 3-O-glucosides, however, the relevance of such activity is unclear in vivo. Mutations in the human protein cause motor-neurone defects in hereditary spastic paraplegia.
