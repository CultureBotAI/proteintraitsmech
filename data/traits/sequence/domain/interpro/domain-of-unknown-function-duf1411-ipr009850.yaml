identifier: InterPro:IPR009850
label: "Domain of unknown function DUF1411"
definition: >-
  This domain is sometimes repeated within some eukaryotic Babesia proteins of unknown function, including UniProtKB:Q17116 from B.bovis. It covers almost the full length of the protein in sequences from the archaeal Sulfolobus, such as UniProtKB:F0NKV9.
