identifier: InterPro:IPR005161
label: "Ku70/Ku80, N-terminal alpha/beta"
definition: >-
  The Ku heterodimer (composed of Ku70 UniProtKB:P12956 and Ku80 UniProtKB:P13010 ) contributes to genomic integrity through its ability to bind DNA double-strand breaks and facilitate repair by the non-homologous end-joining pathway. This is the N-terminal α/β domain. This domain only makes a small contribution to the dimer interface. The domain comprises a six stranded β sheet of the Rossman fold.
