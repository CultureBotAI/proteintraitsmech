identifier: InterPro:IPR010526
label: Sodium ion transport-associated domain
definition: >-
  This entry represents a domain specific to animal sodium channels or their subunits, many of which are voltage-gated. Members very often also contain between one and four copies of and, less often, one copy of . This domain shows a helical structure.
