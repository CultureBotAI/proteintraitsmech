label: "Domain of unknown function DUF7348"
definition: >-
  This domain is found N-terminal in a group of uncharacterised archaeal proteins. In some proteins, this domain precedes Pfam:PF18069 and Pfam:PF18009. It is predicted to fold into a globular α/β structure.
