identifier: InterPro:IPR012904
label: 8-oxoguanine DNA glycosylase, N-terminal
definition: >-
  The presence of 8-oxoguanine residues in DNA can give rise to G-C to T-A transversion mutations. This enzyme is found in archaeal, bacterial and eukaryotic species, and is specifically responsible for the process which leads to the removal of 8-oxoguanine residues. It has DNA glycosylase activity ( EC:3.2.2.23 ) and DNA lyase activity ( EC:4.2.99.18 ). The region featured in this family is the N-terminal domain, which is organised into a single copy of a TBP-like fold. The domain contributes residues to the 8-oxoguanine binding pocket.
