identifier: InterPro:IPR022616
label: Glycosyl hydrolase, family 4, C-terminal
definition: >-
  Glycoside hydrolase family 4 ( CAZy:GH4 ) is a protein family that comprises enzymes with several known activities; 6-phospho-beta-glucosidase ( EC:3.2.1.86 ); 6-phospho-alpha-glucosidase ( EC:3.2.1.122 ); alpha-galactosidase ( EC:3.2.1.22 ). These enzymes require both NAD(H) and divalent metal (such asMn2+, Fe2+, Co2+, or Ni2+) for its activity. This domain is found primarily in bacterial family 4 glycosyl hydrolases. It is found in the C terminus.
