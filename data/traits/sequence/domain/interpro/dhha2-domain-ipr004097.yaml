identifier: InterPro:IPR004097
label: DHHA2 domain
definition: >-
  This domain is called DHHA2 since it is often associated with the DHH domain ( InterPro:IPR001667 ) and is diagnostic of DHH subfamily 2 members. The domain is about 120 residues long and contains a conserved DXK motif at its amino terminus. It is present in inorganic pyrophosphatases and in exopolyphosphatase of Saccharomyces cerevisiae.
