identifier: InterPro:IPR061513
label: "Domain of unknown function DUF8443"
definition: >-
  This entry represents a conserved domain found at the C terminus of S41 family carboxyl-terminal processing peptidases in members of the phylum Bacteroidota. The domain is approximately 85-90 amino acids in length and is located immediately downstream of the Peptidase_S41 catalytic domain ( Pfam:PF03572 ). S41 family peptidases are serine proteases involved in C-terminal processing of proteins, including the removal of C-terminal extensions from penicillin-binding proteins and other substrates. This C-terminal domain is found exclusively in Bacteroidota, particularly in the classes Bacteroidia, Flavobacteriia, Cytophagia and Sphingobacteriia, suggesting it may confer phylum-specific functionality or substrate specificity. The domain architecture of these proteins typically consists of an N-terminal CtpB_N-like domain ( Pfam:PF22694 ), one or more PDZ domains ( Pfam:PF00595, Pfam:PF13180, Pfam:PF17820 ), the catalytic Peptidase_S41 domain, and this C-terminal domain. The function of this domain remains to be determined.
