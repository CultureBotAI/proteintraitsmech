identifier: InterPro:IPR048644
label: "Isoamylase, C-terminal"
definition: >-
  Isoamylase from Pseudomonas amyloderamosa hydrolyses alpha-1,6-glucosidic linkages of amylopectin and glycogen. It consists of three domains: the N-terminal ( InterPro:IPR004193 ), the catalytic domain ( InterPro:IPR006047 ) and the C-terminal all-β domain, presented in this entry ( UniProtKB:P10342, PDB:1BF2 ).
