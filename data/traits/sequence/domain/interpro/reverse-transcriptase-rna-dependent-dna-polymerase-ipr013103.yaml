identifier: InterPro:IPR013103
label: "Reverse transcriptase, RNA-dependent DNA polymerase"
definition: >-
  A reverse transcriptase gene is usually indicative of a mobile element such as a retrotransposon or retrovirus. Reverse transcriptases occur in a variety of mobile elements, including retrotransposons, retroviruses, group II introns, bacterial msDNAs, hepadnaviruses, and caulimoviruses. This entry includes reverse transcriptases not recognised by InterPro:IPR000477.
