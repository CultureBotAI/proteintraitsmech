identifier: InterPro:IPR033709
label: Isoleucyl tRNA synthetase type 2, anticodon-binding domain
definition: >-
  This domain is found in isoleucyl tRNA synthetases (IleRS), which belong to the class Ia aminoacyl tRNA synthetases. It lies C-terminal to the catalytic core domain, and recognises and specifically binds to the tRNA anticodon. It is found in bacterial, archaeal, and eukaryotic IleRS proteins. IleRS catalyses the transfer of isoleucine to the 3'-end of its tRNA.
