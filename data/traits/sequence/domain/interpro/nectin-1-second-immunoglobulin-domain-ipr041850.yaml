identifier: InterPro:IPR041850
label: "Nectin-1, second immunoglobulin domain"
definition: >-
  This entry represents the second immunoglobulin (Ig) domain of nectin-1 (also known as poliovirus receptor related protein 1, PRR1, PVRL1 or CD111). Nectin-1 belongs to the nectin family comprised of four transmembrane glycoproteins (nectins-1 through -4). Nectins are synaptic cell adhesion molecules (CAMs) which facilitate adhesion and signaling at various intracellular junctions. Nectins form homophilic cis-dimers, followed by homophilic and heterophilic trans-dimers involved in cell-cell adhesion. In addition nectins heterophilically trans-interact with other CAMs such as nectin-like molecules (Necls), nectin-1 for example, has been shown to trans-interact with Necl-1. Nectins also interact with various other proteins, including the actin filament (F-actin)-binding protein, afadin. Mutation in the human nectin-1 gene is associated with cleft lip/palate ectodermal dysplasia syndrome (CLPED1). Nectin-1 is a major receptor for herpes simplex virus through interaction with the viral envelope glycoprotein D.
