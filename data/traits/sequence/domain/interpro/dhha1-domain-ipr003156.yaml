identifier: InterPro:IPR003156
label: DHHA1 domain
definition: >-
  This domain is often found adjacent to the DHH domain ( InterPro:IPR001667 ), and is called DHHA1 for DHH associated domain. DHHA1 is diagnostic of DHH subfamily 1 members. This domain is also found in alanyl tRNA synthetase (e.g., UniProtKB:P00957 ), suggesting that it may have an RNA binding function. The domain is about 60 residues long and contains a conserved GG motif.
