identifier: InterPro:IPR003781
label: CoA-binding
definition: >-
  This domain has a Rossmann fold and is found in a number of proteins including bacterial Redox-sensing transcriptional repressor Rex, succinyl CoA synthetases, malate and ATP-citrate ligases.
