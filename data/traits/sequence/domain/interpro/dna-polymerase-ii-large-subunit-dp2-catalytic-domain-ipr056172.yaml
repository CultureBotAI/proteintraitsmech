identifier: InterPro:IPR056172
label: "DNA polymerase II large subunit DP2, catalytic domain"
definition: >-
  This entry represents the catalytic domain of DNA polymerase II large subunit from Pyrococcus abyssi (PolC) and similar sequences mainly found in archaea. This domain is found between InterPro:IPR056171 and InterPro:IPR054475; it shows a six-stranded double-psi β-barrel (DPBB).
