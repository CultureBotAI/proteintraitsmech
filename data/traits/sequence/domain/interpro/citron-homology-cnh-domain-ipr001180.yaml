identifier: InterPro:IPR001180
label: "Citron homology (CNH) domain"
definition: >-
  Based on sequence similarities a domain of homology has been identified in the following proteins: Citron and Citron kinase. These two proteins interact with the GTP-bound forms of the small GTPases Rho and Rac but not with Cdc42. Myotonic dystrophy kinase-related Cdc42-binding kinase (MRCKalpha). This serine/threonine kinase interacts with the GTP-bound form of the small GTPase Cdc42 and to a lesser extent with that of Rac. NCK Interacting Kinase (NIK), a serine/threonine protein kinase. ROM-1 and ROM-2, from yeast. These proteins are GDP/GTP exchange proteins (GEPs) for the small GTP binding protein Rho1. This domain, called the citron homology domain (CNH), is often found after cysteine rich and pleckstrin homology (PH) domains at the C-terminal end of a group of eukaryotic proteins. It is thought to act as a regulatory domain and could be involved in macromolecular interactions. Its structure has been solved in Rho guanyl nucleotide exchange factor (Rom2) from Neosartorya fumigata (Aspergillus fumigatus, UniProtKB:Q4WUI2 ), where it shows a canonical β-propeller fold containing seven blades connected by small loops and arranged in a circular fashion.
