identifier: InterPro:IPR010940
label: Magnesium-protoporphyrin IX methyltransferase, C-terminal
definition: >-
  This entry represents the C terminus (approximately 100 residues) of bacterial and eukaryotic magnesium-protoporphyrin IX methyltransferase (EC:2.1.1.11). This converts magnesium-protoporphyrin IX to magnesium-protoporphyrin IX metylester using S-adenosyl-L-methionine as a cofactor.
