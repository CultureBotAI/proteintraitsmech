identifier: InterPro:IPR045509
label: "HD-associated domain"
definition: >-
  This entry represents a domain that is found C-terminal to the HD domain found in the EF1143 protein (UniProtKB:Q836G9) and O67745_AQUAE (UniProtKB:O67745). According to the Aravind-Koonin classification of HD-domain proteins, proteins containing this domain belong to cluster 1.
