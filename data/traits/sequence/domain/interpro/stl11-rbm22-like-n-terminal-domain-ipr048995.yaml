identifier: InterPro:IPR048995
label: "STL11/RBM22-like, N-terminal domain"
definition: >-
  This entry represents the N-terminal domain of STL11 from yeast and its homologues, such as RBM22 from human (UniProtKB:Q9NW64). This domain comprises a FYVE/PHD-type zinc finger (PDB:5MQF). Members of this entry are involved in pre-mRNA splicing.
