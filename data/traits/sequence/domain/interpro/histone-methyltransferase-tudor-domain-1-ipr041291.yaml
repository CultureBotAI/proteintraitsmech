identifier: InterPro:IPR041291
label: "Histone methyltransferase, Tudor domain 1"
definition: >-
  This is the first TUDOR domain found in SETDB1 enzymes ( EC:2.1.1.43 ) from animals, also known as Eggless in Drosophila. In Drosophila, SetdB1 (Egg) is important for oogenesis and the silencing of chromosome 4. SET domain, bifurcated 1 (SETDB1) is a histone methyltransferase (HMT) that methylates lysine 9 on histone H3 (H3K9). The enzymatic activity of SETDB1, in association with MBD1-containing chromatin-associated factor 1 (MCAF1), converts H3K9me2 to H3K9me3 and represses subsequent transcription. SETDB1 is amplified in cancers such as melanoma and lung cancer, and increased expression of SETDB1 promotes tumorigenesis in a zebrafish melanoma model. In addition, SETDB1 is required for endogenous retrovirus silencing during early embryogenesis, inhibition of adipocyte differentiation, and differentiation of mesenchymal cells into osteoblasts. The tandem Tudor domains in the N-terminal region are involved in protein-protein interactions.
