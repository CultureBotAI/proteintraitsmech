identifier: InterPro:IPR015048
label: "Domain of unknown function DUF1899"
definition: >-
  Coronins are evoluntionarily conserved proteins, mainly involved in actin cytoskeleton organisation. Typically Coronins contain a DUF1899 domain, a series of WD40 repeats, a DUF1900 domain and a C-terminal coiled-coil domain.
