identifier: InterPro:IPR021792
label: Beta-fructofuranosidase, N-terminal domain
definition: >-
  This entry represents the N-terminal domain of beta-fructofuranosidase (also known as vacuolar invertase) ( EC:3.2.1.26 ), which is involved in the hydrolysis of terminal non-reducing beta-D-fructofuranoside residues in beta-D-fructofuranosides.
