identifier: InterPro:IPR063993
label: "Arginine N-succinyltransferase beta subunit, C-terminal domain"
definition: >-
  This entry represents the C-terminal β barrel domain of Arginine N-succinyltransferase EC:2.3.1.109 which catalyses the transfer of succinyl-CoA to arginine to produce succinyl-arginine. This is the first step in arginine catabolism by the arginine succinyltransferase pathway.
