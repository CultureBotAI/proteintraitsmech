identifier: InterPro:IPR021993
label: "Putative metal-binding domain of cation transport ATPase"
definition: >-
  This domain is found in bacteria, and is approximately 90 amino acids in length. It is found associated with Pfam:PF00403, Pfam:PF00122, Pfam:PF00702. The cysteine-rich nature and composition suggest this might be a cation-binding domain; most members are annotated as being cation transport ATPases.
