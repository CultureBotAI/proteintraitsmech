identifier: InterPro:IPR010930
label: "Flagellar basal-body/hook protein, C-terminal domain"
definition: >-
  This functionally uncharacterised domain is found in the C terminus of flagellar basal-body rod and flagellar hook proteins in which InterPro:IPR001444 is often present at the extreme N terminus.
