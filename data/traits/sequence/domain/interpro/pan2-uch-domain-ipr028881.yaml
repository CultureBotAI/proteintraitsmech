identifier: InterPro:IPR028881
label: "PAN2, UCH domain"
definition: >-
  The poly(A)-specific nuclease (PAN) is a deadenylating enzyme involved in cytoplasmic mRNA turnover and consists of two subunits, PAN2 and PAN3, which form a conserved complex acting in the initial trimming of poly(A) tails, a process followed by the processive action of CCR4-NOT complex. PAN2 is the catalytic subunit and has two independent structural units, the N-terminal assembly unit which engages in a bipartite interaction with PAN3 dimers and the C-terminal catalytic unit. The C-terminal unit contains the ubiquitin C-terminal hydrolase (UCH) domain, represented in this entry, and a RNase domain of the DEDD superfamily ( InterPro:IPR013520 ).
