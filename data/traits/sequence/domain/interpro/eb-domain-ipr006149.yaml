identifier: InterPro:IPR006149
label: "EB domain"
definition: >-
  The EB domain has no known function. It is found in several Caenorhabditis sp. and Drosophila sp. proteins. The domain contains 8 conserved cysteines that probably form four disulphide bridges and is found associated with kunitz domains InterPro:IPR002223.
