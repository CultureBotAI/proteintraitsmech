identifier: InterPro:IPR053952
label: "K+ potassium transporter, C-terminal domain"
definition: >-
  This is a family of K+ potassium transporters that are conserved across phyla, including bacterial (KUP) UniProtKB:P30016, yeast (HAK) UniProtKB:P50505, and plant (AtKT) UniProtKB:O22397. This entry represents the C-terminal non-membrane domain.
