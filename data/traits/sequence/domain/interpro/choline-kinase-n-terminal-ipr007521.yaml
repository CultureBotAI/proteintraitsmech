identifier: InterPro:IPR007521
label: Choline kinase, N-terminal
definition: >-
  This domain is found N-terminal to choline/ethanolamine kinase regions in some plant and fungal choline kinase enzymes ( EC:2.7.1.32 ). This region is only found in some members of the choline kinase family, and is therefore unlikely to contribute to catalysis.
