identifier: InterPro:IPR035875
label: "BMX, SH2 domain"
definition: >-
  Cytoplasmic tyrosine-protein kinase BMX (bone marrow tyrosine kinase gene on chromosome X, also known as ETK) is a non-receptor tyrosine kinase ( EC:2.7.10.2 ). It plays central but diverse modulator roles in various signalling processes involved in the regulation of actin reorganisation, cell migration, cell proliferation and survival, cell adhesion, and apoptosis. It has a role in inflammation, cardiovascular disease, and cancer. It is activated downstream of phosphatidylinositol-3 kinase (PI3K) and the kinase Src. This entry represents the SH2 domain of BMX.
