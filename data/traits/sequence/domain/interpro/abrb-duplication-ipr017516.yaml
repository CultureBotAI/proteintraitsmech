identifier: InterPro:IPR017516
label: "AbrB duplication"
definition: >-
  The entry describes a hydrophobic sequence region that is duplicated to form the AbrB protein of Escherichia coli (not to be confused with a Bacillus subtilis protein with the same gene symbol). In some species, notably the Cyanobacteria and Thermus thermophilus, proteins consist of a single copy rather than two copies. The member from Pseudomonas putida, PP_1415 ( UniProtKB:Q88N03 ), was suggested to be an ammonia monooxygenase characteristic of heterotrophic nitrifiers, based on an experimental indication of such activity in the organism and a glimmer of local sequence similarity between parts of the P. putida protein and an instance of the AmoA protein ( UniProtKB:Q04507 ) from Nitrosomonas europaea; we do not believe the sequence similarity to be meaningful. The member from E. coli (b0715, ybgN) appears to be the largely uncharacterised AbrB (aidB regulator) protein of E. coli, although we did not manage to trace the origin of association of the article to the sequence.
