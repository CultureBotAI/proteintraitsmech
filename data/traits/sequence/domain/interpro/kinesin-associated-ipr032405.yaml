identifier: InterPro:IPR032405
label: Kinesin-associated
definition: >-
  This short domain is found in some kinesin-like proteins (KIF1, KIF13, KIF14). It is found between the motor domain and the forkhead-associated (FHA) domain. Its function is unknown.
