label: DUF3108-like
definition: >-
  This is a domain found in uncharacterised proteins from Parabacteroides distasonis (UniProtKB:A6LGE3), Bacteroides fragilis (UniProtKB:Q5LD59) and other bacteria. It adopts a β-barrel fold of the YmcC-like type (PDB:4FVS).
