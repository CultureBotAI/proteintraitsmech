identifier: InterPro:IPR057527
label: "HVO_A0261-like, N-terminal domain"
definition: >-
  This entry represents the N-terminal HTH domain of a group of sequences mostly from archaea, such as HVO_A0261 (UniProtKB:D4GQU0) from H. volcanii. This domain is associated to InterPro:IPR013561. This entry also includes some bacterial sequences.
