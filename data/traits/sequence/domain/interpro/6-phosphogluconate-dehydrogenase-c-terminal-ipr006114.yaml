identifier: InterPro:IPR006114
label: 6-phosphogluconate dehydrogenase, C-terminal
definition: >-
  6-Phosphogluconate dehydrogenase (EC:1.1.1.44) (6PGD) is an oxidative carboxylase that catalyses the decarboxylating reduction of 6-phosphogluconate into ribulose 5-phosphate in the presence of NADP. This reaction is a component of the hexose mono-phosphate shunt and pentose phosphate pathways (PPP). Prokaryotic and eukaryotic 6PGD are proteins of about 470 amino acids whose sequences are highly conserved. The protein is a homodimer in which the monomers act independently: each contains a large, mainly α-helical domain and a smaller β-α-β domain, containing a mixed parallel and anti-parallel 6-stranded β sheet. NADP is bound in a cleft in the small domain, the substrate binding in an adjacent pocket.
