identifier: InterPro:IPR049769
label: "Protein ovarian tumor locus, ovarian tumor domain"
definition: >-
  This entry represents the OTU (ovarian tumor) domain of a group of proteins mainly found in arthropods, including Protein ovarian tumor locus from Drosophila melanogaster (OTU) which is essential for female fertility, germ cell division and differentiation.
