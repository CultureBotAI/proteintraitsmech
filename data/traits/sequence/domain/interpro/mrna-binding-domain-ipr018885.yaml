identifier: InterPro:IPR018885
label: "mRNA-binding domain"
definition: >-
  This conserved domain is found in fungal proteins and appears to be involved in RNA-processing. It binds to poly-adenylated RNA, interacts genetically with mRNA 3'-end processing factors, co-purifies with the nuclear cap-binding protein Cbp20p, and is found in complexes containing other translation factors, such as EIF4G as in UniProtKB:P39935 and UniProtKB:P39936.
