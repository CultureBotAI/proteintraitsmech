identifier: InterPro:IPR049514
label: "Filamentation induced by cAMP protein Fic-like, C-terminal domain"
definition: >-
  This domain is found at the C-terminal of Filamentation induced by cAMP protein Fic ( UniProtKB:Q30YF5 ) from Oleidesulfovibrio alaskensis and similar bacterial sequences. This domain adopts a winged helix structure ( PDB:4rgl ). It is often found associated with InterPro:IPR003812. This domain is also found in some archaeal sequences.
