label: G patch domain-containing protein, N-terminal
definition: >-
  This domain is found at the N-terminal of several eukaryotic RNA processing proteins, including Arabidopsis TGH, which is involved in microRNA (miRNA) and small interfering RNA (siRNA) biogenesis.
