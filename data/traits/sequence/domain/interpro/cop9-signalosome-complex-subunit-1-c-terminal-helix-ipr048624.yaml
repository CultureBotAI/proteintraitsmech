label: "COP9 signalosome complex subunit 1, C-terminal helix"
definition: >-
  This is the C-terminal helix from COP9 signalosome complex subunit 1 from higher eukaryotes, an essential component of the COP9 signalosome complex (CSN), which involved in various cellular and developmental processes.
