identifier: InterPro:IPR014853
label: "VWF/SSPO/Zonadhesin-like, cysteine-rich domain"
definition: >-
  The proteins in this entry contained a domain rich in positionally conserved cysteine residues. Most proteins contains 7 or 8 cysteine residues. The domain is found in disease-related proteins including von Willebrand factor, Alpha tectorin, Zonadhesin and Mucin. It is often found on proteins containing InterPro:IPR001846 and InterPro:IPR002919.
