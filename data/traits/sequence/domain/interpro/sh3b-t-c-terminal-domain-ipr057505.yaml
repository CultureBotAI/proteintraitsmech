identifier: InterPro:IPR057505
label: "SH3b, T C-terminal domain"
definition: >-
  This domain is found twice towards the C-terminal end of the staphylococcal phage protein UniProtKB:I6T7G5 (IPLA5_0029) and in similar peptidoglycan-degrading enzymes mainly from bacteriophages. This domain, found associated with InterPro:IPR002502 and InterPro:IPR007921 in some members of this group, is involved in the binding of ligands at the bacterial surface.
