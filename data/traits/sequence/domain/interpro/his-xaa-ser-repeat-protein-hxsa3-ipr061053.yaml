identifier: InterPro:IPR061053
label: "His-Xaa-Ser repeat protein HxsA3"
definition: >-
  This entry represents an alternate form of the His-Xaa-Ser repeat protein HxsA, represented by InterPro:IPR023928. These proteins, for example UniProtKB:A0A9D1WSY3 contain a conserved N-terminal region, followed by the His-Xaa-Ser repeat region. The C-terminal region is highly variable.
