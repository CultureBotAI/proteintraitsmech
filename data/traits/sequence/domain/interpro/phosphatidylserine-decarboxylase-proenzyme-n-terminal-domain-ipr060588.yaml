identifier: InterPro:IPR060588
label: "Phosphatidylserine decarboxylase proenzyme, N-terminal domain"
definition: >-
  This entry represents a domain that covers the N-terminal in phosphatidylserine decarboxylase proenzyme (PSD) from alpha, beta and gammaproteobacteria. This domain also covers the entire length of PSD in Azotobacter vinelandii (UniProtKB:Q44558]) which is smaller compared to other PSD proteins. This domain contains an all helical fold. PSD plays a pivotal role in the synthesis of phospholipid by the mitochondria. The substrate phosphatidylserine is synthesised extramitochondrially and must be translocated to the mitochondria prior to decarboxylation. Phosphatidylserine decarboxylases EC:4.1.1.65 is responsible for conversion of phosphatidylserine to phosphatidylethanolamine and plays a central role in the biosynthesis of aminophospholipids.
