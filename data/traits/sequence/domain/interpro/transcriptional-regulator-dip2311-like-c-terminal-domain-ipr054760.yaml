identifier: InterPro:IPR054760
label: "Transcriptional regulator DIP2311-like, C-terminal domain"
definition: >-
  This domain is found at the C-terminal of transcriptional regulator DIP2311 from Corynebacterium diphtheriae (UniProtKB:Q6NEG3) and similar bacterial sequences. This domain, which shows a winged helix fold, is normally found associated to InterPro:IPR007421.
