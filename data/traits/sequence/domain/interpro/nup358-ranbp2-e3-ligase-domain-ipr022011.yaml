identifier: InterPro:IPR022011
label: "Nup358/RanBP2 E3 ligase domain"
definition: >-
  This domain family is found in eukaryotes, and is approximately 60 amino acids in length. The family is found in association with Pfam:PF00638, Pfam:PF00641, Pfam:PF00160. There are two conserved sequence motifs: TFFC and EDF. Nup358/RanBP2 is a nucleoporin involved in ubiquitination of many different protein targets from various cellular pathways. It complexes with Ubc9, SUMO-1 and RanGAP1 to perform this function. This is the ligase domain which binds to Ubc9.
