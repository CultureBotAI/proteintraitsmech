identifier: InterPro:IPR032781
label: "ABC-transporter extension domain"
definition: >-
  In E.coli four ABC-F proteins have been characterised: EttA, YbiT, YheS, and Uup. EttA was shown to interact with the ribosome ( InterPro:IPR022374 ). YbiT, YheS, and Uup have also been shown to bind to the ribosome. This domain is an extension of some members of InterPro:IPR003439 and other ABC-transporter families. It is not responsible for ribosome binding, but it is used by proteins which bind to the ribosome to stabilise the interaction.
