identifier: InterPro:IPR055827
label: "Domain of unknown function DUF7403"
definition: >-
  This entry represents a domain of unknown function found in some PRiA4b ORF-3-like proteins from bacteria, such as UniProtKB:A0A1I7K0M5. This domain may adopt an all-helical fold and is generally found alongside the PriA4_ORF3 ( InterPro:IPR012912 ) domain.
