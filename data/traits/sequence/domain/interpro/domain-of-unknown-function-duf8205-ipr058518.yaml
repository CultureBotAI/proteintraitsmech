label: "Domain of unknown function DUF8205"
definition: >-
  This domain is found in uncharacterised fungal proteins. It is probably distantly related to CcmS and Pfam:PF26617 and it is predicted to adopt topologically similar structure. It is found frequently in combination with InterPro:IPR002893 and in multiple copies.
