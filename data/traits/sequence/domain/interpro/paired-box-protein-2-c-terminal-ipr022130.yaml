identifier: InterPro:IPR022130
label: "Paired-box protein 2 C-terminal"
definition: >-
  This domain is found in the C terminus of the paired-box protein 2, which is a transcription factor involved in embryonic development and organogenesis. It is approximately 110 amino acids in length and is found in association with Pfam:PF00292.
