identifier: InterPro:IPR012983
label: PHR
definition: >-
  This domain is called PHR as it was originally found in the E3 ubiquitin-protein ligase proteins PAM ( UniProtKB:O75592 ), highwire ( UniProtKB:Q9NB71 ) and RPM-1 ( UniProtKB:Q17551 ). PHR proteins are conserved, large multi-domain E3 ubiquitin ligases with modular architecture. PHR proteins presynaptically control synaptic growth and axon guidance and postsynaptically regulate endocytosis of glutamate receptors. Dysfunction of neuronal ubiquitin-mediated proteasomal degradation is implicated in various neurodegenerative diseases. PHR proteins are characterised by the presence of two PHR domains near the N terminus, which are essential for proper localisation and function. The domain has a β-sandwich fold composed of 11 anti-parallel β-strands. The C-terminal region of the protein BTBD1 includes the PHR domain and is known to interact with Topoisomerase I, an enzyme which relaxes DNA supercoils.
