identifier: InterPro:IPR007077
label: "TfoX, C-terminal"
definition: >-
  This domain is found in a number of bacterial proteins including the TfoX gene product of Haemophilus influenzae. TfoX may play a key role in the development of genetic competence by regulating the expression of late competence-specific genes. This family corresponds to the C-terminal presumed domain of TfoX. The domain is found in association with the N-terminal domain in some, but not all members of this group, suggesting this is an autonomous and functionally unrelated domain. For example it is found associated with UniProtKB:Q9JZR1 in InterPro:IPR002125.
