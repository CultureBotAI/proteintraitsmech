identifier: InterPro:IPR062944
label: "Baseplate assembly protein-like, N-terminal domain, phage"
definition: >-
  This entry represents an N-terminal domain of approximately 130 residues found in putative phage baseplate assembly proteins. According to STRING, proteins containing this domain are functionally associated with other phage structural proteins including Phage_base_V (InterPro:IPR006531), Phage_sheath_1C (InterPro:IPR020287), Phage_T4_gp19 (InterPro:IPR010667), and eCIS_core (InterPro:IPR025295). This domain is found in bacteria, predominantly Actinomycetota (especially Streptomyces) and Pseudomonadota. The function of this domain remains to be determined.
