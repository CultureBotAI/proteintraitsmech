identifier: InterPro:IPR058980
label: "Glycosyltransferase, N-terminal domain"
definition: >-
  This domain is found at the N-terminal end of glycosyltransferase sequences from plants. This domain is often found associated with InterPro:IPR002213 and shows a five stranded β-sheet with α-helices on both sides.
