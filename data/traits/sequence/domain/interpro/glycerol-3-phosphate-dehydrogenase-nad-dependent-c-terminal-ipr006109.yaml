identifier: InterPro:IPR006109
label: Glycerol-3-phosphate dehydrogenase, NAD-dependent, C-terminal
definition: >-
  NAD-dependent glycerol-3-phosphate dehydrogenase ( EC:1.1.1.8 ) (GPD) catalyzes the reversible reduction of dihydroxyacetone phosphate to glycerol-3-phosphate. It is a cytoplasmic protein, active as a homodimer, each monomer containing an N-terminal NAD binding site. In insects, it acts in conjunction with a mitochondrial alpha-glycerophosphate oxidase in the alpha-glycerophosphate cycle, which is essential for the production of energy used in insect flight.
