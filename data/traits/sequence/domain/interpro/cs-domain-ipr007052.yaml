identifier: InterPro:IPR007052
label: "CS domain"
definition: >-
  The bipartite CS domain, which was named after CHORD-containing proteins and SGT1, is a ~100-residue protein-protein interaction module. The CS domain can be found in stand-alone form, as well as fused with other domains, such as CHORD ( InterPro:IPR007051 ), SGS ( InterPro:IPR007699 ), TPR ( InterPro:IPR019734 ), cytochrome b5 ( InterPro:IPR001199 ) or b5 reductase, in multidomain proteins. The CS domain has a compact antiparallel β-sandwich fold consisting of seven β-strands. Some proteins known to contain a CS domain are listed below: Eukaryotic proteins of the SGT1 family. Eukaryotic Rar1, related to pathogenic resistance in plants, and to development in animals. Eukaryotic nuclear movement protein nudC. Eukaryotic proteins of the p23/wos2 family, which act as co-chaperone. Animal b5+b5R flavo-hemo cytochrome NAD(P)H oxydoreductase type B. Mammalian integrin beta-1-binding protein 2 (melusin).
