identifier: InterPro:IPR022247
label: Casein kinase 1 gamma C-terminal
definition: >-
  This domain family is found in eukaryotes, and is typically between 54 and 99 amino acids in length. The family is found in association with Pfam:PF00069. CK1gamma is a membrane-bound member of the CK1 family. Gain-of-function and loss-of-function experiments show that CK1gamma is both necessary and sufficient to transduce LRP6 signalling in vertebrates and Drosophila cells.
