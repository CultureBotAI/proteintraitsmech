identifier: InterPro:IPR057885
label: "VWDE-like, Ig-like domain"
definition: >-
  This predicted immunoglobulin (Ig) domain is found in VWDE and similar sequences. This domain is often found associated with InterPro:IPR001846 and InterPro:IPR057774. von Willebrand factor D and EGF domain-containing protein (WWDE) is predicted to enable signalling receptor binding activity and to be active in the cell surface and extracellular region.
