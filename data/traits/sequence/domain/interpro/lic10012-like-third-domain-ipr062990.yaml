identifier: InterPro:IPR062990
label: "LIC10012-like, third domain"
definition: >-
  This entry represents a group of uncharacterised proteins from Leptospira, including LIC10012 UniProtKB:Q72WC5 from Leptospira interrogans. Members of this family of putative surface-exposed proteins are found broadly throughout the genus Leptospira, and appear to have a VWA (von Willebrand factor type A) domain ( Pfam:PF29976 ), associated with InterPro:IPR058181 at the N-terminal, and an OB fold-like domain at the C-terminal ( InterPro:IPR062989 ). This entry represents a small α/β domain adjacent to the vWA domain.
