identifier: InterPro:IPR034526
label: "PSF, NOPS domain"
definition: >-
  This entry represents the NOPS domain and the C-terminal coiled-coil region of PSF (also known as SFPQ). The C-terminal coiled-coil region functions in mediating DBHS dimerization, while some surface-exposed basic residues within the NOPS domain may be involved in nucleic acid binding. PSF is a member of the DBHS (Drosophila behavior human splicing) family. It participates in a wide range of gene regulatory processes and cellular response pathways. It has been shown to affect the alternative splicing of CD45 and Tau and regulate the 3' polyadenylation of mRNAs. It is often localised in the paraspeckles and may be involved in the nuclear retention of mRNAs. It is involved in translation and transcription. It can bind directly to DSBs and play a role in DNA repair. PSF can also be utilized as an essential host factor for viral RNA multiplication and replication. In addition to the common DHBS core, which encompasses RRM1 and RRM2, the protein-protein interaction NOPS domain and the coiled-coil domain, PSF features additional domains, such as a RGG motif and a proline-rich region in its N terminus. DBHS (Drosophila behavior human splicing) family are characterised by a core domain arrangement consisting of tandem RNA recognition motifs (RRMs), a conserved intervening sequence referred to as a NONA/ParaSpeckle (NOPS) domain, and a ~100 amino acid coiled-coil domain. Its members include p54nrb (also known as NONO), PTB-associated splicing factor/splicing factor proline-glutamine rich (PSF or SFPQ) and PSPC1 (paraspeckle protein component 1). They are found in the nucleoplasm and can be triggered by binding to local high concentrations of various nucleic acids to form microscopically visible nuclear bodies, paraspeckles or large complexes such as DNA repair foci. They may al…
