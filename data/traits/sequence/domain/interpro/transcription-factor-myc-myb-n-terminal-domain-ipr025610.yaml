identifier: InterPro:IPR025610
label: "Transcription factor MYC/MYB, N-terminal domain"
definition: >-
  This is the N-terminal region of a family of MYB and MYC transcription factors. The DNA-binding HLH domain is further downstream, Pfam:PF00010. Members of the MYB and MYC family regulate the biosynthesis of phenylpropanoids in several plant species.
