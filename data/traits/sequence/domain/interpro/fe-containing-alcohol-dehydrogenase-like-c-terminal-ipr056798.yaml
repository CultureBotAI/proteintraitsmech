identifier: InterPro:IPR056798
label: "Fe-containing alcohol dehydrogenase-like, C-terminal"
definition: >-
  This domain is found C-terminal in iron-containing alcohol dehydrogenases from all cellular organisms, mainly bacteria. It is usually found associated with InterPro:IPR015590 and InterPro:IPR001670. It folds into an array of α-helices.
