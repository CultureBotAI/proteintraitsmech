identifier: InterPro:IPR062406
label: "YjiT, fourth domain"
definition: >-
  This entry represents the fourth domain of the uncharacterised protein YjiT. It follows the N-terminal domain (InterPro:IPR060465), the second domain (InterPro:IPR060050) and the third domain (InterPro:IPR062346). In the E. coli K12 YjiT protein, this domain is located near the C terminus due to truncation of the gene. Full-length orthologues contain up to ten structural domains. The family is found in gammaproteobacteria. The function of this protein and domain remains to be determined.
