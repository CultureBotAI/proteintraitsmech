identifier: InterPro:IPR048025
label: "RING finger protein 24, RING finger, H2 subclass"
definition: >-
  This entry represents a RING finger domain present in the RNF24, an intrinsic membrane protein localised in the Golgi apparatus. RNF24 specifically interacts with the ankyrin-repeats domains (ARDs) of TRPC1, -3, -4, -5, -6, and -7, and affects TRPC intracellular trafficking without affecting their activity. RNF24 contains an N-terminal transmembrane domain and a C-terminal C3H2C3-type RING-H2 finger.
