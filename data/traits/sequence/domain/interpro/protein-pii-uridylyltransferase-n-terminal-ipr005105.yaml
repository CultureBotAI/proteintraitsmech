identifier: InterPro:IPR005105
label: Protein-PII uridylyltransferase, N-terminal
definition: >-
  This domain is found associated with an N-terminal cyclic nucleotide-binding domain ( InterPro:IPR000595 ) and two CBS domains ( InterPro:IPR000644 ). This domain, normally represents the C-terminal region, is uncharacterised; however, it seems to be similar to the nucleotidyltransferase domain ( InterPro:IPR002934 ), conserving the DXD motif, which strongly suggests that proteins containing this domain are also nucleotidyltransferases.
