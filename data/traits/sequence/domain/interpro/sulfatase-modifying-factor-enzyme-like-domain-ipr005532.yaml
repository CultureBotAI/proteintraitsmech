label: "Sulfatase-modifying factor enzyme-like domain"
definition: >-
  This domain is found in sulfatase-modifying factors (SUMFs) and Chlamydia serine/threonine-protein kinase pkn1. It is also found in iron(II)-dependent oxidoreductase from Mycobacterium.
