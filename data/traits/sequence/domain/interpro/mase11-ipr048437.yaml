identifier: InterPro:IPR048437
label: MASE11
definition: >-
  This entry represents the membrane-associated sensor domain 11 (MASE11), a predicted transmembrane domain that has been found in association with HD-GYP (InterPro:IPR037522), PAS (InterPro:IPR000014), GAF (InterPro:IPR003018), GGDEF (InterPro:IPR000160) and EAL (InterPro:IPR001633) domains. It is also present in sensor histidine kinases with various domain architectures.
