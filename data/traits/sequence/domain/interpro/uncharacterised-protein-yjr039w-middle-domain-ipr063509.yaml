identifier: InterPro:IPR063509
label: "Uncharacterised protein YJR039W, middle domain"
definition: >-
  This entry represents the middle domain of the uncharacterised protein YJR039W from Saccharomyces cerevisiae. The function of this domain remains to be determined. YJR039W has been detected in the mitochondrion by high-throughput studies. It contains a N-terminal represented by InterPro:IPR062671, a middle domain represented by InterPro:IPR063509 and a C-terminal represented by InterPro:IPR062614.
