identifier: InterPro:IPR054115
label: "Magnesium and cobalt efflux protein CorC, N-terminal domain"
definition: >-
  This entry represents a pair of helices found at the N-terminal of some CBS domain proteins. A pair of these regions dimerise to form a four helical bundle. Proteins in this family have this region followed by two CBS domains and a Transporter-associated domain (InterPro:IPR005170).
