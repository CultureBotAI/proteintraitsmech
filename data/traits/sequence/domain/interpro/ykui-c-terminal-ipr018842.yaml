identifier: InterPro:IPR018842
label: "YkuI, C-terminal"
definition: >-
  In most cases this highly conserved region of the YkuI protein lies immediately downstream of the EAL (diguanylate cyclase/phosphodiesterase) domain InterPro:IPR001633 so that together they form a monomer which dimerises for its enzymatic action. This region contains three α helices and five β strands and forms C-terminal half of the structure.
