identifier: InterPro:IPR054154
label: "Peroxisomal membrane protein PEX14, central, plants"
definition: >-
  This domain is centrally located in Peroxisomal membrane protein PEX14 from Arabidopsis thaliana and similar plant sequences. PEX14 is a component of the PEX13-PEX14 docking complex, a translocon channel that specifically mediates the import of peroxisomal cargo proteins bound to PEX5 receptor. It is often found C-terminal to InterPro:IPR006785 and is predicted to adopt an all-α helical configuration.
