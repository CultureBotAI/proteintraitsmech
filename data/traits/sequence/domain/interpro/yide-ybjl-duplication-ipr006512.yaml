identifier: InterPro:IPR006512
label: "YidE/YbjL duplication"
definition: >-
  These sequences contain a domain that is duplicated in HI0035 of Haemophilus influenzae, in YidE and YbjL of Escherichia coli, and in a number of other putative transporters. Member proteins may have 0, 1, or 2 copies of the TrkA-C potassium uptake domain (InterPro:IPR006037) between the duplications. The duplication appears distantly related to both the N- and the C-terminal domains the sodium/hydrogen exchanger family domain (InterPro:IPR006153). The domain contains several apparent transmembrane regions and is proposed here to act in transport.
