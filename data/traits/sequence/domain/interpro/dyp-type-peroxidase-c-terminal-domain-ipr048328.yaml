identifier: InterPro:IPR048328
label: "Dyp-type peroxidase, C-terminal domain"
definition: >-
  Dyp-type (dye-decolorizing) peroxidases are a family of heme proteins found in a wide range of bacteria and fungi. They have a wide substrate specificity and lack homology to most other peroxidases, with the ability to function well under much lower pH conditions compared with the other plant peroxidases. They consist of two domains that adopt a ferredoxin-like fold, connected by a loop. This entry represents the C-terminal domain, which possess a large hydrophobic cavity for heme binding.
