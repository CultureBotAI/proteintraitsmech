identifier: InterPro:IPR009232
label: EB-1 binding
definition: >-
  This region at the C terminus of the APC proteins binds the microtubule-associating protein EB-1. At the C terminus of the alignment is also a PDZ-binding domain. A short motif in the middle of the region appears to be found in the APC2 proteins (e.g. UniProtKB:O95996).
