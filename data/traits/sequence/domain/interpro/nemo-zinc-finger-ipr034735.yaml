identifier: InterPro:IPR034735
label: NEMO, Zinc finger
definition: >-
  This entry represents the C-terminal CCHC-type Zinc Finger (ZF) domain of NEMO. This domain can also be found in other regulators of NF-kappaB, such as Optineurin and ABIN2.
