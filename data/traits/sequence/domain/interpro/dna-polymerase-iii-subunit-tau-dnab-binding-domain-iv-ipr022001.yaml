identifier: InterPro:IPR022001
label: "DNA polymerase III subunit tau, DnaB-binding domain IV"
definition: >-
  This domain found in bacterial proteins, and is approximately 80 amino acids in length. It is found in association with Pfam:PF00004. domains I-III are shared between the tau and the gamma subunits, while most of the DnaB-binding domain IV and all of the alpha-interacting domain V are unique to tau.
