identifier: InterPro:IPR013524
label: Runt domain
definition: >-
  The AML1 gene is rearranged by the t(8;21) translocation in acute myeloid leukemia. The gene is highly similar to the Drosophila melanogaster segmentation gene runt and to the mouse transcription factor PEBP2 alpha subunit gene. The region of shared similarity, known as the Runt domain, is responsible for DNA-binding and protein-protein interaction. In addition to the highly-conserved Runt domain, the AML-1 gene product carries a putative ATP-binding site (GRSGRGKS), and has a C-terminal region rich in proline and serine residues. The protein (known as acute myeloid leukemia 1 protein, oncogene AML-1, core-binding factor (CBF), alpha-B subunit, etc.) binds to the core site, 5'-pygpyggt-3', of a number of enhancers and promoters.
