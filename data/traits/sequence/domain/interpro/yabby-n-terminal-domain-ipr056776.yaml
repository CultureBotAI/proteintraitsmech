identifier: InterPro:IPR056776
label: "YABBY, N-terminal domain"
definition: >-
  YABBY proteins are a group of plant-specific transcription involved in the specification of abaxial polarity in lateral organs. This entry represents the N-terminal domain, which is found associated with InterPro:IPR056775.
