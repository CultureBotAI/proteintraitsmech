identifier: InterPro:IPR001763
label: "Rhodanese-like domain"
definition: >-
  Rhodanese, a sulphurtransferase involved in cyanide detoxification (see InterPro:IPR001307) shares evolutionary relationship with a large family of proteins, including Cdc25 phosphatase catalytic domain. non-catalytic domains of eukaryotic dual-specificity MAPK-phosphatases. non-catalytic domains of yeast PTP-type MAPK-phosphatases. non-catalytic domains of yeast Ubp4, Ubp5, Ubp7. non-catalytic domains of mammalian Ubp-Y. Drosophila heat shock protein HSP-67BB. several bacterial cold-shock and phage shock proteins. plant senescence associated proteins. catalytic and non-catalytic domains of rhodanese (see InterPro:IPR001307). Rhodanese has an internal duplication. This domain is found as a single copy in other proteins, including phosphatases and ubiquitin C-terminal hydrolases.
