identifier: InterPro:IPR015411
label: "Replication factor Mcm10, C-terminal"
definition: >-
  This entry represents a domain found in the C-terminal region of the Mcm10 protein, which is a eukaryotic DNA replication factor that regulates the stability and chromatin association of DNA polymerase alpha.
