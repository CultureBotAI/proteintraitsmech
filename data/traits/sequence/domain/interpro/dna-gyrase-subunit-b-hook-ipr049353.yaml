identifier: InterPro:IPR049353
label: "DNA gyrase subunit B, hook"
definition: >-
  This entry represents the N-terminal section of the 'Toprim hook' as described in, which is localised between the Toprim (InterPro:IPR006171) and the insert (InterPro:IPR041423) domains. The C-terminal section of the hook is included in (InterPro:IPR002288). The hook is flexible towards the Toprim domain. Proteins in this group are found mainly in proteobacteria.
