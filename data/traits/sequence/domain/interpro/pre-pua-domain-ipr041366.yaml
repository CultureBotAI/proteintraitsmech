label: "Pre-PUA domain"
definition: >-
  This Pre-PUA-like domain is found before the PUA domain ( InterPro:IPR002478 ) in a wide variety of proteins including eukaryotic translation initiation factor 2D ( UniProtKB:Q61211 ), where it is found at the N terminus.
