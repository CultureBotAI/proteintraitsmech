label: tRNA mnm(5)s(2)U biosynthesis bifunctional protein MnmC, N-terminal
definition: >-
  This entry represents the N-terminal region, called MnmC2, of the tRNA 5-methylaminomethyl-2-thiouridine biosynthesis bifunctional protein MnmC, or of a standalone protein that performs the same methyltransferase function, in partnership with an FAD-dependent protein, or C-terminal region, called MNMC1 (InterPro:IPR017610).
