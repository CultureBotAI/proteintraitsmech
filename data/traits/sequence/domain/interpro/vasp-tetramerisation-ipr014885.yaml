identifier: InterPro:IPR014885
label: "VASP tetramerisation"
definition: >-
  Vasodilator-stimulated phosphoprotein (VASP) is an actin cytoskeletal regulatory protein. This region corresponds to the tetramerisation domain which forms a right handed α helical coiled coil structure.
