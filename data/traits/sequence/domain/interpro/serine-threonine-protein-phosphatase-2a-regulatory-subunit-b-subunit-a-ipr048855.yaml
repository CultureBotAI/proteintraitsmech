identifier: InterPro:IPR048855
label: "Serine/threonine-protein phosphatase 2A regulatory subunit B'' subunit alpha/beta/delta, EF-hand"
definition: >-
  This is a EF-hand domain found in Serine/threonine-protein phosphatase 2A regulatory subunit B'' subunit alpha/beta/delta (P2R3A/B/D) and similar animal proteins. This proteins may modulate substrate selectivity and catalytic activity.
