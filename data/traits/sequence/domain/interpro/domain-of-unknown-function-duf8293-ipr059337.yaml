label: "Domain of unknown function DUF8293"
definition: >-
  This domain is found in uncharacterised bacterial proteins. It is predicted to fold into an α-helical structure and it is frequently found in combination with Pfam:PF09977 and and Pfam:PF13400 which are likely involved in pilus biogenesis.
