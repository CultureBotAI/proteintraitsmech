identifier: InterPro:IPR011516
label: "Shugoshin, N-terminal coiled-coil domain"
definition: >-
  This entry represents the N-terminal domain of Shugoshin (Sgo1) kinetochore-attachment proteins. Shugoshin has this conserved coiled-coil N-terminal domain and a highly conserved C-terminal basic region ( InterPro:IPR011515 ). Shugoshin is a crucial target of Bub1 kinase that plays a central role in chromosome cohesion during mitosis and meiosis divisions by preventing premature dissociation of cohesin complex from centromeres after prophase, when most of cohesin complex dissociates from chromosomes arms. Shugoshin is thought to act by protecting Rec8 and Rad21 at the centromeres from separase degradation during anaphase I (during meiosis) so that sister chromatids remain tethered. Shugoshin also acts as a spindle checkpoint component required for sensing tension between sister chromatids during mitosis, its degradation when they separate preventing cell cycle arrest and chromosome loss in anaphase, a time when sister chromatids are no longer under tension. Human shugoshin is diffusible and mediates kinetochore-driven formation of kinetochore-microtubules during bipolar spindle assembly. Further, the primary role of shugoshin is to ensure bipolar attachment of kinetochores, and its role in protecting cohesion has co-developed to facilitate this process.
