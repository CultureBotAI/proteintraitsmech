identifier: InterPro:IPR047486
label: "Diacylglycerol kinase iota, first protein kinase C conserved region 1"
definition: >-
  This entry represents the first protein kinase C conserved region 1 (C1 domain) of DAG kinase iota and similar proteins from vertebrates. The C1 domain is a cysteine-rich zinc binding domain that does not bind DNA nor possess structural similarity to conventional zinc finger domains; it contains two separate Zn2-binding sites. Diacylglycerol (DAG) kinase (EC:2.7.1.107) is a lipid kinase that phosphorylates diacylglycerol to form phosphatidic acid. DAG kinase iota, also called diglyceride kinase iota (DGK-iota), or DGKI, is a homologue of Drosophila DGK2, RdgA. It may have important cellular functions in the retina and brain. It is classified as a type IV DAG kinase (DGK), containing myristoylated alanine-rich protein kinase C substrate (MARCKS), PDZ-binding, and ankyrin domains, in addition to C1 and catalytic domains that are present in all DGKs. The MARCKS domain regulates the nuclear localizations of type IV DGKs while the PDZ-binding and ankyrin domains regulate interactions with several proteins. DAG kinase iota contains two copies of the C1 domain.
