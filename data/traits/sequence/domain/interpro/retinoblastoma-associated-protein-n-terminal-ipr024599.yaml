identifier: InterPro:IPR024599
label: "Retinoblastoma-associated protein, N-terminal"
definition: >-
  This domain is found in N-terminal of the retinoblastoma-associated protein. It is found in association with InterPro:IPR002720 and InterPro:IPR002719. This domain is typically between 124 to 150 amino acids in length and has a single completely conserved residue W that may be functionally important.
