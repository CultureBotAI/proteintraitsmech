identifier: InterPro:IPR058859
label: "R-PTP-O-like, Fn3 domain"
definition: >-
  This fibronectin type-III (Fn3) domain is found in human Receptor-type tyrosine-protein phosphatase O (R-PTP-O), which possesses tyrosine phosphatase activity. R-PTP-O is a long protein predicted to have five tandem Fn3 domains InterPro:IPR003961 connected to another two through an unstructured loop in the N-terminal region. This domain is found associated to InterPro:IPR000242.
