identifier: InterPro:IPR018222
label: "Nuclear transport factor 2, eukaryote"
definition: >-
  Ran (InterPro:IPR002041) is an evolutionary conserved member of the Ras superfamily of small GTPases that regulates all receptor-mediated transport between the nucleus and the cytoplasm. Import receptors bind their cargos in the cytoplasm where the concentration of RanGTP is low and release their cargos in the nucleus where the concentration of RanGTP is high. Export receptors respond to Ran GTP in the opposite manner.
