identifier: InterPro:IPR002346
label: Molybdopterin dehydrogenase, FAD-binding
definition: >-
  Oxidoreductases, that also bind molybdopterin, have essentially no similarity outside this common domain. They include aldehyde oxidase ( EC:1.2.3.1 ), that converts an aldehyde and water to an acid and hydrogen peroxide, and xanthine dehydrogenase ( EC:1.1.1.204 ), that converts xanthine to urate. These enzymes require molybdopterin and FAD as cofactors and have and two 2FE-2S clusters. Another enzyme that contains this domain is the Pseudomonas thermocarboxydovorans carbon monoxide oxygenase and nicotine dehydrogenase involved in the degradation of nicotine.
