identifier: InterPro:IPR028086
label: "Folliculin-interacting protein, C-terminal domain"
definition: >-
  This is the C terminus of folliculin-interacting proteins, which may have a role in energy and/or nutrient sensing. This region is responsible for binding to folliculin.
