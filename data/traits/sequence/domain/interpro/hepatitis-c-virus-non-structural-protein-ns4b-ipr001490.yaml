identifier: InterPro:IPR001490
label: Hepatitis C virus, Non-structural protein NS4b
definition: >-
  The genome polyprotein contains: caspid protein C, envelope glycoproteins E1 and E2, protein P7, nonstructural protein NS2, protease/helicase NS3, nonstructural proteins NS4A and NS4B (this family), NS5A and NS5B. The small proteins NS2A, NS2B, NS4A and NS4B are hydrophobic, suggesting a possible membrane-related function. It is known that NS4B interacts with NS4A and NS3 to form a large replicase complex to direct the viral RNA replication. NS3 and NS5 may also play a role in the viral RNA replication.
