identifier: InterPro:IPR006019
label: Phosphotyrosine interaction domain, Shc-like
definition: >-
  Shc proteins contain an SH2 domain and a phosphotyrosine interaction (PI) domain. These domains facilitate interaction with various activated tyrosine-phosphorylated receptors, including those of growth factors, insulin, cytokines and lymphocytes. The PI domain comprises 165 residues, 4 of which (Arg67, Arg175, Ser151 and Lys169 ) are responsible for binding phosphotyrosine on a `IIENPQYFSDA'(NPxPY) peptide. The PI domain has a similar structure to the insulin receptor substrate-1 PTB domain, a 7-stranded β-sandwich, capped by a C-terminal helix. However, the PI domain contains an additional short N-terminal helix and a large insertion between strands 1 and 2, which forms a helix and 2 long connecting loops. The substrate peptide fits into a surface cleft formed from the C-terminal helix and strand 5.
