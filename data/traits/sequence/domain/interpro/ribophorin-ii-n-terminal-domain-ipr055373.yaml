identifier: InterPro:IPR055373
label: "Ribophorin II, N-terminal domain"
definition: >-
  This entry represents the N-terminal domain of eukaryotic Ribophorin II (RPN2, also known as dolichyl-diphosphooligosaccharide--protein glycosyltransferase subunit 2) proteins, which forms an α/α6 structure. The mammalian oligosaccharyltransferase (OST) is a protein complex that effects the cotranslational N-glycosylation of newly synthesised polypeptides, and is composed of the following proteins: ribophorins I and II (RI and RII), OST48, and Dadl, N33/IAP, OST4, STT3.
