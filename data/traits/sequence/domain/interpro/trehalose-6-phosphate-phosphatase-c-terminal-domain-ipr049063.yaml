identifier: InterPro:IPR049063
label: "Trehalose-6-phosphate phosphatase, C-terminal domain"
definition: >-
  This entry represents the catalytic C-terminal domain of trehalose-6-phosphate phosphatase (TPP) from nematodes such as Caenorhabditis elegans and Brugia malayi. TPP catalyses the hydrolysis of trehalose 6-phosphate to trehalose and phosphate, preventing the accumulation of toxic levels of trehalose 6-phosphate. This domain adopts a C2B-type HAD phosphatase fold ( PDB:4OFZ ). In C. elegans, TPP is essential for survival due to the toxic effect(s) of the accumulation of trehalose 6-phosphate. This domain is also found in a number of bacterial TPPs.
