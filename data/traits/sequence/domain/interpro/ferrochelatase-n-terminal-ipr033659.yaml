identifier: InterPro:IPR033659
label: "Ferrochelatase, N-terminal"
definition: >-
  Ferrochelatase is the terminal enzyme of the heme biosynthetic pathway. It catalyzes the insertion of ferrous iron into the protoporphyrin IX ring yielding protoheme. This enzyme is ubiquitous in nature and widely distributed in bacteria and eukaryotes. Recently, some archaeal members have been identified. The oligomeric state of these enzymes varies depending on the presence of a dimerization motif at the C terminus. In eukaryotic cells, it binds to the mitochondrial inner membrane with its active site on the matrix side of the membrane. The X-ray structure of Bacillus subtilis and human ferrochelatase have been solved. The human enzyme exists as a homodimer. Each subunit contains one [2Fe-2S] cluster. The monomer is folded into two similar domains, each with a four-stranded parallel β-sheet flanked by an α-helix in a β-α-β motif that is reminiscent of the fold found in the periplasmic binding proteins. The topological similarity between the domains suggests that they have arisen from a gene duplication event. However, significant differences exist between the two domains, including an N-terminal section (residues 80-130) that forms part of the active site pocket, and a C-terminal extension (residues 390-423) that is involved in coordination of the [2Fe-2S] cluster and in stabilisation of the homodimer. This entry represents the N-terminal domain of ferrochelatase.
