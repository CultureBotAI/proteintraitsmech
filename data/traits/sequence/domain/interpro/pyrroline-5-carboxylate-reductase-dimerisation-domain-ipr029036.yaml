identifier: InterPro:IPR029036
label: "Pyrroline-5-carboxylate reductase, dimerisation domain"
definition: >-
  Pyrroline-5-carboxylate reductase consists of two domains, an N-terminal catalytic domain and a C-terminal dimerisation domain. This entry represents the dimerisation domain.
