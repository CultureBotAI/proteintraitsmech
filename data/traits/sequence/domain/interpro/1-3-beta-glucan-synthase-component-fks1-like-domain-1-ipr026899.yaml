identifier: InterPro:IPR026899
label: "1,3-beta-glucan synthase component FKS1-like, domain-1"
definition: >-
  This domain is likely to be the 'Class I' region just N-terminal to the first set of transmembrane helices that is involved in 1,3-beta-glucan synthesis itself. This entry also includes callose synthases from plants.
