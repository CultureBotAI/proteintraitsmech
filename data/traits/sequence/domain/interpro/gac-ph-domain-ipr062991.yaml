identifier: InterPro:IPR062991
label: "GAC, PH domain"
definition: >-
  This PH domain is found in the glideosome-associated connector (GAC) protein. This PH domain contains conserved lipid-binding residues, which are exposed to solvent PDB:8BT6, suggesting a role in membrane recognition/interactions. GAC is a giant armadillo-repeat protein, essential for parasite motility and conserved across Apicomplexa including UniProtKB:A0A151HKA5 from Toxoplasma gondii. It connects actin filaments to the plasma membrane via interactions with phosphatidic acid and membrane-spanning adhesins. GAC contains a PH domain represented by InterPro:IPR062991 and ARM regions represented by InterPro:IPR063749.
