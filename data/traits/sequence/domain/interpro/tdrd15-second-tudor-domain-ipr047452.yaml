identifier: InterPro:IPR047452
label: "TDRD15, second Tudor domain"
definition: >-
  This entry represents the second Tudor domain of human TDRD15 and similar sequences mainly found in vertebrates. The Tudor domain binds to proteins with dimethylated arginine or lysine residues, and may also bind methylated histone tails to facilitate protein-protein interactions. TDRD15 is an uncharacterised Tudor domain-containing protein that contains seven Tudor domains.
