identifier: InterPro:IPR057940
label: "Tri-helical domain"
definition: >-
  This domain is found in a group of uncharacterised fungal proteins, including UniProtKB:A2QTR8 from Aspergillus niger. This domain, which is often found C-terminal to InterPro:IPR025676, is predicted to adopt a tri-helical configuration.
