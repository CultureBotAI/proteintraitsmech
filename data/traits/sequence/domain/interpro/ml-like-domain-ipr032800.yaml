identifier: InterPro:IPR032800
label: "ML-like domain"
definition: >-
  This domain is distantly similar to MD-2-related lipid-recognition domain ( InterPro:IPR003172 ) and conserves its pattern of conserved cysteines. This suggests that this domain may be involved in lipid binding. Proteins containing this domain include flavin carrier protein 1/2 from budding yeasts and TRP-like ion channel pkd2 from fission yeasts.
