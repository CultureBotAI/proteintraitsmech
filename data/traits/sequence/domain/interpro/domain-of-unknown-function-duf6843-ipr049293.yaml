label: "Domain of unknown function DUF6843"
definition: >-
  This domain is found in the putative lipoprotein BA_2398 from Bacillus anthracis (UniProtKB:A0A6L8PAP6) and similar proteins from bacteria, predominantly firmicutes and bacteroidetes. It folds into an open β-barrel packed on one side with α-helix (PDB:4O4A).
