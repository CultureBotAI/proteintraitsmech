identifier: InterPro:IPR025137
label: "Bacteriophage N4 adsorption protein A, C-terminal"
definition: >-
  The function of this domain is unknown, but it is found at the C terminus of bacteriophage N4 adsorption protein A (NfrA) in association with an N-terminal region of Tetratricopeptide (TPR) repeats InterPro:IPR019734. NfrA serves as the phage receptor. NfrA allows N4 phage attachment by binding to the viral non-contractile sheath protein.
