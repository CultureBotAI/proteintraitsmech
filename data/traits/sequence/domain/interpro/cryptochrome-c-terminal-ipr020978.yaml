identifier: InterPro:IPR020978
label: "Cryptochrome C-terminal"
definition: >-
  Cryptochromes are blue/ultraviolet-A light sensing photoreceptors involved in regulating various growth and developmental responses in plants. Cryptochromes are inactive monomers in the dark but change its conformation to homooligomers upon photon absoption. This entry represents the C-terminal end of Cryptochrome proteins from plants, which is typically between 113 and 125 amino acids in length. The domain is found in association with Pfam:PF03441 and Pfam:PF00875. In Arabidopsis, a conformational change in the C-terminal domain is required for activity. The domain is know to interact with the protein COP1.
