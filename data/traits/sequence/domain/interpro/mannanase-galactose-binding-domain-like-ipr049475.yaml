label: "Mannanase, galactose-binding domain-like"
definition: >-
  This is a galactose-binding domain-like found at the C-terminal of alkaline mannanases, such as UniProtKB:Q4W8M3 from Bacillus sp. JAMB-602 and related bacterial sequences which belong to the Glycoside Hydrolase Family 5 ( InterPro:IPR001547 ).
