identifier: InterPro:IPR064004
label: "GerT, C-terminal domain"
definition: >-
  This entry represents the C-terminal domain of Spore germination protein GerT, a protein involved in spore germination. This domain can be found next to InterPro:IPR059985 or by its own in bacterial proteins annotated as molecular chaperones. This domain also contains a similar fold to InterPro:IPR008978.
