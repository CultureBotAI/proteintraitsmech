identifier: InterPro:IPR062912
label: "DNA polymerase III alpha subunit, C-terminal domain"
definition: >-
  This entry represents a C-terminal domain of approximately 74 residues found in DNA polymerase III alpha subunits from Bacteroidota species. The domain is located C-terminal to the PHP domain (InterPro:IPR004013), DNA polymerase III alpha domain (InterPro:IPR011708), DNA polymerase III fingers domain (InterPro:IPR040982) and HHH domain (InterPro:IPR029460). DNA polymerase III is the main replicative enzyme in bacteria. The specific function of this C-terminal domain remains to be determined.
