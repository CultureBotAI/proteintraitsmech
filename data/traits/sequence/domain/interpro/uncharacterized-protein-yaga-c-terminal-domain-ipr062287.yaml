identifier: InterPro:IPR062287
label: "Uncharacterized protein YagA, C-terminal domain"
definition: >-
  This entry represents a C-terminal domain found in IS481 family transposases from Pseudomonadota (Alpha-, Beta- and Gammaproteobacteria). These transposases contain an N-terminal helix-turn-helix DNA-binding domain (Pfam:PF13565), followed by an integrase catalytic core domain (InterPro:IPR001584), an RNase H-like domain (InterPro:IPR001584), and this C-terminal domain. The E. coli protein YagA is a member of this family. The specific function of this C-terminal domain remains to be determined.
