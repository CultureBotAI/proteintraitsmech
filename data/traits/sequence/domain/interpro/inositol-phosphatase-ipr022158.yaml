identifier: InterPro:IPR022158
label: "Inositol phosphatase"
definition: >-
  This domain is found in eukaryotes, and is approximately 120 amino acids in length. It is often found in association with Pfam:PF02383. It is found in hSac2, which functions as an inositol polyphosphate 5-phosphatase.
