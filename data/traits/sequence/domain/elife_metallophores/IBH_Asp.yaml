identifier: proteintraitsmech:ELIFE109154_IBH_Asp
label: Interface-associated metallophore aspartate beta-hydroxylase domain
definition: Protein sequence domain recognized by the IBH_Asp profile of the bacterial NRP metallophore
  detection system. The profile identifies an interface-associated Fe(II)- and 2-oxoglutarate-dependent
  aspartate beta-hydroxylase subtype, including domains embedded in larger NRPS proteins. The cluster
  rule excludes the competing SBH_Asp subtype associated with non-metallophore phytotoxins.
