identifier: proteintraitsmech:ELIFE109154_Cy_tandem
label: Metallophore-associated tandem-system heterocyclization domain
definition: Protein sequence domain recognized by the Cy_tandem profile of the bacterial NRP metallophore
  detection system. The profile derives from heterocyclization domains in tandem systems associated
  with catecholic or phenolic metallophore assembly and Ser, Thr, or Cys cyclization. A match denotes
  one domain subtype, not proof of two tandem domains or of a complete biosynthetic pathway.
