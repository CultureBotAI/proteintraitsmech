identifier: proteintraitsmech:ELIFE109154_CyanoBH_Asp1
label: Putative cyanobacterial metallophore aspartate beta-hydroxylase domain 1
definition: Protein sequence domain recognized by the CyanoBH_Asp1 profile of the bacterial NRP metallophore
  detection system. The study tentatively assigns this cyanobacterial hydroxylase clade, including
  NRPS-embedded domains, to beta-hydroxyaspartate formation in cyanochelin-related pathways. The
  functional assignment is a prediction supported by phylogeny and cluster context; it is not an
  experimental characterization of every member.
