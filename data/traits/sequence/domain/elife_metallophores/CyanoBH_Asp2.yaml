identifier: proteintraitsmech:ELIFE109154_CyanoBH_Asp2
label: Putative cyanobacterial metallophore aspartate beta-hydroxylase domain 2
definition: Protein sequence domain recognized by the CyanoBH_Asp2 profile of the bacterial NRP metallophore
  detection system. The study tentatively assigns this cyanobacterial hydroxylase clade to beta-hydroxyaspartate
  formation in cyanochelin-related pathways. The assignment relies on phylogeny and biosynthetic
  context and does not establish experimental activity for individual members. Although the model
  table labels this subtype standalone, the deposited seed identifiers also refer to larger fusion
  proteins; the domain representation preserves that observed scope.
