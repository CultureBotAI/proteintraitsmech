identifier: PRINTS:PR00726
label: "Repressor LexA serine protease (S24) family signature"
definition: >-
  This signature defines serine peptidases belong to MEROPS peptidase family S24 (LexA family, clan SF). They include: LexA, the repressor of genes in the cellular SOS response to DNA damage MucA and the related UmuD proteins, which are lesion-bypass DNA polymerases, induced in response to mitogenic DNA damage RumA a plasmid encoded homologue of UmuD RuvA, which is a component of the RuvABC resolvasome that catalyses the resolution of Holliday junctions that arise during genetic recombination and DNA repair The LexA, UmuD and MucD proteins interact with RecA, which activates self cleavage either derepressing transcription in the case of LexA or activating the lesion-bypass polymerase in the case of UmuD and MucA. UmuD'2, is the homodimeric component of DNA pol V, which is produced from UmuD by RecA-facilitated self-cleavage. The first 24 N-terminal residues of UmuD are removed; UmuD'2 is a DNA lesion bypass polymerase. MucA, like UmuD, is a plasmid encoded a DNA polymerase (pol RI) which is converted into the active lesion-bypass polymerase by a self-cleavage reaction involving RecA. This group of proteins also contains proteins classified as non-peptidase homologues as they either have been found experimentally to be without peptidase activity, or lack amino acid residues that are believed to be essential for catalytic activity.
definition_source: "InterPro:IPR006197 abstract (PRINTS PR00726 is a member signature)"
