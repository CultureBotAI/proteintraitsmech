identifier: NCBIfam:TIGR00401
label: "peptide-methionine (S)-S-oxide reductase MsrA"
definition: >-
  peptide-methionine (S)-S-oxide reductase MsrA — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00401 (equivalog_domain); catalyses peptide-methionine (S)-S-oxide reductase; associated with response to oxidative stress, peptide-methionine (S)-S-oxide reductase activity, protein repair, L-methionine (S)-S-oxide reductase activity.
