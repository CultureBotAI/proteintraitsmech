identifier: NCBIfam:TIGR00336
label: "orotate phosphoribosyltransferase"
definition: >-
  orotate phosphoribosyltransferase (pyrE) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00336 (equivalog_domain); catalyses orotate phosphoribosyltransferase; associated with orotate phosphoribosyltransferase activity, pyrimidine ribonucleotide biosynthetic process.
