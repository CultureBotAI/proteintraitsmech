label: "cob(I)yrinic acid a,c-diamide adenosyltransferase"
definition: >-
  cob(I)yrinic acid a,c-diamide adenosyltransferase — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00636 (equivalog_domain); catalyses corrinoid adenosyltransferase; associated with corrinoid adenosyltransferase activity, cobalamin biosynthetic process.
