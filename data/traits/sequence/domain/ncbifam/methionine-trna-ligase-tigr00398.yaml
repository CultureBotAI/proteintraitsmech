  methionine--tRNA ligase (metG) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00398 (equivalog_domain); catalyses methionine--tRNA ligase; associated with nucleotide binding, methionine-tRNA ligase activity, ATP binding, methionyl-tRNA aminoacylation.
