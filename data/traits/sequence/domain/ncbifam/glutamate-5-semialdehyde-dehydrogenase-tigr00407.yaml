  glutamate-5-semialdehyde dehydrogenase (proA) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00407 (equivalog_domain); catalyses glutamate-5-semialdehyde dehydrogenase; associated with glutamate-5-semialdehyde dehydrogenase activity, L-proline biosynthetic process.
