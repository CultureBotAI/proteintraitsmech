identifier: NCBIfam:TIGR01198
label: 6-phosphogluconolactonase
definition: >-
  6-phosphogluconolactonase (pgl) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR01198 (equivalog_domain); catalyses 6-phosphogluconolactonase; associated with carbohydrate metabolic process, pentose-phosphate shunt, 6-phosphogluconolactonase activity.
