identifier: NCBIfam:TIGR00097
label: "bifunctional hydroxymethylpyrimidine kinase/phosphomethylpyrimidine kinase"
definition: >-
  bifunctional hydroxymethylpyrimidine kinase/phosphomethylpyrimidine kinase (thiD) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00097 (equivalog_domain); catalyses hydroxymethylpyrimidine kinase, phosphooxymethylpyrimidine kinase; associated with hydroxymethylpyrimidine kinase activity, phosphomethylpyrimidine kinase activity, thiamine biosynthetic process.
