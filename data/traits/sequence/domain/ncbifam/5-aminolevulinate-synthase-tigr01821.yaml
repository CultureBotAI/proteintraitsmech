label: "5-aminolevulinate synthase"
definition: >-
  5-aminolevulinate synthase (hemA) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR01821 (equivalog_domain); catalyses 5-aminolevulinate synthase; associated with 5-aminolevulinate synthase activity, pyridoxal phosphate binding, tetrapyrrole biosynthetic process.
