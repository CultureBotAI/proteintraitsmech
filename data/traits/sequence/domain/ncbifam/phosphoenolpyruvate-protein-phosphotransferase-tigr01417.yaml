  phosphoenolpyruvate--protein phosphotransferase (ptsP) — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR01417 (equivalog_domain); catalyses phosphoenolpyruvate--protein phosphotransferase; associated with phosphoenolpyruvate-protein phosphotransferase activity, phosphoenolpyruvate-dependent sugar phosphotransferase system.
