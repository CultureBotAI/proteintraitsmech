  tRNA uracil 4-sulfurtransferase ThiI — a protein domain modelled by the NCBIfam sequence-profile HMM TIGR00342 (equivalog_domain); catalyses tRNA uracil 4-sulfurtransferase; associated with tRNA modification, thiamine biosynthetic process, tRNA-uracil-4 sulfurtransferase activity.
