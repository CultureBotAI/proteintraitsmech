evidence:
  - reference: "PMID:16984901"
    snippet: "The human ABCC subfamily contains 12 full transporters, including nine MRPs (MRP1-6/ABCC1-6 and MRP7-9/ABCC10-12), CFTR (ABCC7), and SUR1/SUR2 (ABCC8/9)"
    notes: "Deeley et al. (2006, Physiol Rev 86:849-899) and UniProtKB:O15439 (ABCC4/MRP4) establish that MRP7 is ABCC10 (whereas ABCC7 is the CFTR chloride channel) and that MRP9/ABCC12 has not been shown to act as a broad tumor multidrug resistance efflux pump."
