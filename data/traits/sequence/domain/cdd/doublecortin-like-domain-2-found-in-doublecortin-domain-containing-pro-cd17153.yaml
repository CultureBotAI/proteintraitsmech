identifier: CDD:cd17153
label: DCX2_DCDC2B
definition: >-
  Doublecortin-like domain 2 found in doublecortin domain-containing protein 2B (DCDC2B). DCDC2B is a member of the doublecortin (DCX) family closely related to its paralog DCDC2, a microtubule-associated protein (MAP) with stable double tandem DCX repeats of a ubiquitin-like tertiary fold. Microtubules are key components of cytoskeleton that are involved in cell movement, shape determination, division and transport. In the paralogous DCDC2 gene, human genetic variation is associated with reading disability (dyslexia), attention deficit hyperactivity disorder (ADHD), and difficulties in mathematics. DCDC2 protein interacts with many of the same cytoskeleton related proteins that other members of the DCX family interact with
