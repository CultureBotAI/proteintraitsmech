identifier: CDD:cd20528
label: CYCLIN_CCNJ-like_rpt1
definition: >-
  first cyclin box found in cyclin-J (CCNJ) family. The CCNJ family includes two cyclins, CCNJ and CCNJ-like. CCNJ may regulate the cell cycle or transcription. Members of this family contain two cyclin boxes. This model corresponds to the first one. The cyclin box is a protein binding domain
