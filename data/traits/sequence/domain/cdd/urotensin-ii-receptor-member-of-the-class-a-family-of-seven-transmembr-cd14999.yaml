identifier: CDD:cd14999
label: 7tmA_UII-R
definition: >-
  urotensin-II receptor, member of the class A family of seven-transmembrane G protein-coupled receptors. The urotensin-II receptor (UTS2R, also known as UII-R or GPR14; distinct from the orexin/hypocretin receptors HCRTR1/HCRTR2 in CDD:cd15208) is a member of the class A rhodopsin-like G-protein coupled receptors, which binds the peptide hormone urotensin-II. Urotensin II (UII) is a vasoactive somatostatin-like or cortistatin-like peptide hormone. However, despite the apparent structural similarity to these peptide hormones, they are not homologous to UII. Urotensin II was first identified in fish spinal cord, but later found in humans and other mammals. In fish, UII is secreted at the back part of the spinal cord, in a neurosecretory centre called uroneurapophysa, and is involved in the regulation of the renal and cardiovascular systems. In mammalian isolated arterial preparations such as rat thoracic aorta, urotensin-II acts as a potent experimental vasoconstrictor, with vascular responses varying by species and vessel bed. The urotensin II receptor is a rhodopsin-like G-protein coupled receptor, which binds urotensin-II. The receptor was previously known as GPR14, or sensory epithelial neuropeptide-like receptor (SENR). The UII receptor is expressed in the CNS (cerebellum and spinal cord), skeletal muscle, pancreas, heart, endothelium and vascular smooth muscle. It is involved in the pathophysiological control of cardiovascular function and may also influence CNS and endocrine functions. Binding of urotensin II to the receptor leads to activation of phospholipase C, through coupling to G(q/11) family proteins. The resulting increase in intracellular calcium may cause the contraction of vascular smooth muscle
