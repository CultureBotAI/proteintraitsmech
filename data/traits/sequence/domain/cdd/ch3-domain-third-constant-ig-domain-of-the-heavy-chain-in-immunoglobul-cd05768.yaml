identifier: CDD:cd05768
label: IgC1_CH3_IgAGD_CH4_IgAEM
definition: >-
  CH3 domain (third constant Ig domain of the heavy chain) in immunoglobulin heavy alpha, gamma, and delta chains, and CH4 domain (fourth constant Ig domain of the heavy chain) in immunoglobulin heavy alpha, epsilon, and mu chains; member of the C1-set of Ig superfamily (IgSF) domains. The members here are composed of the third and fourth immunoglobulin constant domain (IgC) of alpha, delta, gamma and alpha, epsilon, and mu heavy chains, respectively. This domain is found on the Fc fragment. The basic structure of Ig molecules is a tetramer of two light chains and two heavy chains linked by disulfide bonds. There are two types of light chains: kappa and lambda; each is composed of a constant domain and a variable domain. There are five types of heavy chains: alpha, delta, epsilon, gamma, and mu, all consisting of a variable domain (VH) with three (alpha, delta and gamma) or four (epsilon and mu) constant domains (CH1 to CH4). Ig molecules are modular proteins, in which the variable and constant domains have clear, conserved sequence patterns
