label: TFP_LU_ECD_Ly6L
definition: >-
  extracellular domain (ECD) found in lymphocyte antigen 6L (Ly-6L) and similar proteins. Ly-6L (also called lymphocyte antigen 6 complex locus protein L) contains an extracellular domain (ECD) which belongs to Ly-6 antigen/uPA receptor-like (LU) superfamily and exhibits a snake toxin-like fold (also known as three-finger toxin/3FTx fold or three-fingered protein/TFP domain fold)
