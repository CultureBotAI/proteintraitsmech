identifier: CDD:cd17151
label: DCX1_DCDC2C
definition: >-
  Doublecortin-like domain 1 found in doublecortin domain-containing protein 2C (DCDC2C). DCDC2C is a member of the doublecortin (DCX) family closely related to its paralog DCDC2, a microtubule-associated protein (MAP) with stable double tandem DCX repeats of ubiquitin-like tertiary fold. Microtubules are key components of the cytoskeleton that are involved in cell movement, shape determination, division and transport. In the paralogous DCDC2 gene, human genetic variation is associated with reading disability (dyslexia), attention deficit hyperactivity disorder (ADHD), and difficulties in mathematics. DCDC2 protein interacts with many of the same cytoskeleton related proteins that other members of the DCX family interact with
