identifier: CDD:cd23591
label: TFP_LU_ECD_Crim
definition: >-
  extracellular domain (ECD) found in Drosophila melanogaster protein crimpled and similar proteins. Crimpled (Crim) is a member of the Drosophila Ly6 superfamily. It is required for septate junction (SJ) formation and function in a tissue-autonomous manner. Crimpled contains an extracellular domain (ECD), which belongs to Ly-6 antigen/uPA receptor-like (LU) superfamily and exhibits a snake toxin-like fold (also known as three-finger toxin/3FTx fold or three-fingered protein/TFP domain fold)
