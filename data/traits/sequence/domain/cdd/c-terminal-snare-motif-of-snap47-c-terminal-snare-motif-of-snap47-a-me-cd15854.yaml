identifier: CDD:cd15854
label: SNARE_SNAP47C
definition: >-
  C-terminal SNARE motif of SNAP47. C-terminal SNARE motif of SNAP47, a member of the Qb/Qc subfamily of SNARE (soluble N-ethylmaleimide-sensitive factor attachment protein receptor) proteins. The exact function of SNAP47 is unknown. Qb/Qc SNAREs consist of 2 coiled-coil helices (called SNARE motifs, one belonging to the Qb subgroup and one belonging to the Qc subgroup), which mediate the interactions with other SNARE proteins, and lack a transmembrane domain; like SNAP29 and unlike SNAP25 and SNAP23, SNAP47 also lacks palmitoylated membrane-anchoring cysteines and associates with membranes through protein-protein interactions. In general, the SNARE complex mediates membrane fusion, important for trafficking of newly synthesized proteins, recycling of pre-existing proteins and organelle formation. SNARE proteins are classified into four groups, Qa-, Qb-, Qc- and R-SNAREs, depending on whether the residue in the hydrophilic center layer of the four-helical bundle is a glutamine (Q) or arginine (R). Qa-, as well as Qb- and Qc-SNAREs, are localized to target organelle membranes, while R-SNARE is localized to vesicle membranes. They form unique complexes consisting of one member of each subgroup, that mediate fusion between a specific type of vesicles and their target organelle. Their SNARE motifs form twisted and parallel heterotetrameric helix bundles. Other members of the Qb/Qc SNAREs are SNAP23, SNAP25, SNAP29 and SEC9
