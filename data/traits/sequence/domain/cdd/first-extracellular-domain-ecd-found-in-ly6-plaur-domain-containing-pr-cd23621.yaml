identifier: CDD:cd23621
label: TFP_LU_ECD_LYPD4_rpt1
definition: >-
  first extracellular domain (ECD) found in Ly6/PLAUR domain-containing protein 4 (LYPD4) and similar proteins. LYPD4 is an acrosome protein expressed specifically in mammalian testes and sperm. It plays an essential role in mammalian fertilization. LYPD4 contains two extracellular domains (ECDs) that belong to Ly-6 antigen/uPA receptor-like (LU) superfamily and exhibits a snake toxin-like fold (also known as three-finger toxin/3FTx fold or three-fingered protein/TFP domain fold). This model corresponds to the first ECD
