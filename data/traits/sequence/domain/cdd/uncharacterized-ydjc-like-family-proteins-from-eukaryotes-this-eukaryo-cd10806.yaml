identifier: CDD:cd10806
label: YdjC_like_2
definition: >-
  uncharacterized YdjC-like family proteins from eukaryotes. This eukaryotic subfamily contains hypothetical and uncharacterized proteins, and belongs to the YdjC-like family of uncharacterized proteins. The YdjC-family is represented by an uncharacterised protein YdjC (also known as ChbG) encoded by the chb (N,N'-diacetylchitobiose, also called [GlcNAc]2) or cel operon in Escherichia coli, which encodes enzymes involved in growth on an N,N'-diacetylchitobiose carbon source. The molecular function of this subfamily is unclear
