evidence:
  - reference: "PMID:9759094"
    snippet: "Four parallel alpha-helices... SNAP-25 contributes two helices (Sn1 and Sn2) connected by a palmitoylated linker and lacks a transmembrane anchor"
    notes: "Sutton et al. (1998, Nature 395:347-353) and UniProtKB:P60880 (SNAP25) establish that Qbc-SNAREs (SNAP25, SNAP23, SNAP29, SNAP47, Sec9) contribute both Qb and Qc SNARE motifs and lack a transmembrane domain, with SNAP25 anchored to membranes via S-palmitoylated cysteine residues in its inter-motif linker."
