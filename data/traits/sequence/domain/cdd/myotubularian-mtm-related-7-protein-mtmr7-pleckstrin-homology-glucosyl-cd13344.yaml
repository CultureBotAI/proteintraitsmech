evidence:
  - reference: "PMID:11956206"
    snippet: "MTMR7 specifically dephosphorylates PtdIns(3)P and Ins(1,3)P2 and interacts with MTMR9"
    notes: "Mochizuki & Majerus (2003, J Biol Chem 278:21856-21863) characterize MTMR7 (UniProtKB:Q9Y216) as a 3-phosphatase acting on PtdIns3P and Ins(1,3)P2 in complex with MTMR9, correcting the pasted MTMR6 sentence in the upstream CDD description."
  - reference: "PMID:14690594"
    snippet: "The PH-GRAM domain of myotubularin binds phosphoinositides"
    notes: "Begley et al. (2003, Mol Cell 12:1391-1402) and Tsujita et al. (2004, J Biol Chem 279:13817-13824, PMID:14722085) establish phosphoinositide binding by myotubularin PH-GRAM domains, resolving the internal contradiction in the trailing upstream sentence."
