identifier: CDD:cd13344
label: PH-GRAM_MTMR7
definition: >-
  Myotubularin (MTM) related 7 protein (MTMR7) Pleckstrin Homology-Glucosyltransferases, Rab-like GTPase activators and Myotubularins (PH-GRAM) domain. MTMR7 is a member of the myotubularin dual specificity protein phosphatase gene family. MTMR7 dephosphorylates phosphatidylinositol 3-phosphate (PtdIns3P) and inositol 1,3-bisphosphate (Ins(1,3)P2) and forms a functional heterodimer with the catalytically inactive myotubularin MTMR9 (whereas the closely related subgroup member MTMR6 hydrolyzes PtdIns3P and PtdIns(3,5)P2). MTMR7 contains a N-terminal PH-GRAM domain, a Rac-induced recruitment domain (RID) domain, an active PTP domain, a SET-interaction domain, and a C-terminal coiled-coil region. Myotubularin-related proteins are a subfamily of protein tyrosine phosphatases (PTPs) that dephosphorylate D3-phosphorylated inositol lipids. Mutations in this family cause the human neuromuscular disorders myotubular myopathy and type 4B Charcot-Marie-Tooth syndrome. 6 of the 13 MTMRs (MTMRs 5, 9-13) contain naturally occurring substitutions of residues required for catalysis by PTP family enzymes. Although these proteins are predicted to be enzymatically inactive, they are thought to function as antagonists of endogenous phosphatase activity or interaction modules. Most MTMRs contain a N-terminal PH-GRAM domain, a Rac-induced recruitment domain (RID) domain, a PTP domain (which may be active or inactive), a SET-interaction domain, and a C-terminal coiled-coil region. In addition some members contain DENN domain N-terminal to the PH-GRAM domain and FYVE, PDZ, and PH domains C-terminal to the coiled-coil region. The GRAM domain, found in myotubularins, glucosyltransferases, and other putative membrane-associated proteins, is part of a larger motif with a pleckstrin homology (PH) domain fold. The PH domain family possesses multiple functions including the ability to bind phosphoinositides via its beta1/beta2, beta3/beta4, and beta6/beta7 connecting loops and to other proteins. In myotubularins, the PH-GRAM domain mediates phosphoinositide binding and membrane localization
