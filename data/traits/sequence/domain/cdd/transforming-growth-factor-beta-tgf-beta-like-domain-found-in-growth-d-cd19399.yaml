label: TGF_beta_GDF5
definition: >-
  transforming growth factor beta (TGF-beta) like domain found in growth/differentiation factor 5 (GDF5) and similar proteins. GDF5, also termed bone morphogenetic protein 14 (BMP-14), or cartilage-derived morphogenetic protein 1 (CDMP-1), or lipopolysaccharide-associated protein 4 (LAP-4), or LPS-associated protein 4, or radotermin, is a growth factor involved in bone and cartilage formation
