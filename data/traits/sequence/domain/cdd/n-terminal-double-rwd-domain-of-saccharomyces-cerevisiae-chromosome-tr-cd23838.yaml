identifier: CDD:cd23838
label: DRWD-N_ScCTF19
definition: >-
  N-terminal double-RWD domain of Saccharomyces cerevisiae chromosome transmission fidelity 19 (CTF19) and related proteins. CTF19, also called inner kinetochore subunit CTF19, CENP-P homolog, chromosome transmission fidelity protein 19, constitutive centromere-associated network protein CTF19, or minichromosome maintenance protein 18, is a component of the kinetochore, a multiprotein complex that assembles on centromeric DNA and attaches chromosomes to spindle microtubules, mediating chromosome segregation and sister chromatid segregation during meiosis and mitosis. ScCTF19 contains two RWD domains, also known as a double-RWD domain, DRWD, which is involved in interactions with other kinetochore proteins. The model corresponds to the N-terminal double-RWD domain (DRWD-N)
