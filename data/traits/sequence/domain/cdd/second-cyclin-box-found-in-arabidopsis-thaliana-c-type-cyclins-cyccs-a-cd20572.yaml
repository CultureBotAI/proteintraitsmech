identifier: CDD:cd20572
label: CYCLIN_AtCycC_rpt2
definition: >-
  second cyclin box found in Arabidopsis thaliana C-type cyclins (CycCs) and similar proteins. CycCs are the cognate cyclin partners of cyclin-dependent kinase CDK8. They may be involved in cell cycle control. CycCs contain two cyclin boxes. This model corresponds to the second one. The cyclin box is a protein binding domain
