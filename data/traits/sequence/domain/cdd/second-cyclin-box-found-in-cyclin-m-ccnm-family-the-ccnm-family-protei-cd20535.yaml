evidence:
  - reference: "PMID:23912459"
    snippet: "Cyclin M (FAM58A) interacts with CDK10 and forms an active protein kinase complex"
    notes: "Guen et al. (2013, Nat Genet 45:1038-1042) and UniProtKB:Q8N1B3 (CCNQ/FAM58A, HGNC:28434) establish that cyclin-Q (formerly called cyclin-M/FAM58A) is the CDK10-activating cyclin containing two cyclin boxes, unrelated to the CNNM1-4 (ACDP1-4) ancient conserved domain magnesium transporter family (CDD:cd04590)."
