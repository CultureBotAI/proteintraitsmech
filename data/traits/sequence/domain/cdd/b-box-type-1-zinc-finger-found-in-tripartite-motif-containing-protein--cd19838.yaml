identifier: CDD:cd19838
label: Bbox1_TRIM8_C-V
definition: >-
  B-box-type 1 zinc finger found in tripartite motif-containing protein 8 (TRIM8) and similar proteins. TRIM8, also known as glioblastoma-expressed RING finger protein (GERP) or RING finger protein 27 (RNF27), is a probable E3 ubiquitin-protein ligase that may promote proteasomal degradation of suppressor of cytokine signaling 1 (SOCS1) and further regulate interferon-gamma signaling. It functions as a new p53 modulator that stabilizes p53, impairing its association with MDM2 and inducing the reduction of cell proliferation. TRIM8 deficit dramatically impairs p53 stabilization and activation in response to chemotherapeutic drugs. TRIM8 also modulates tumor necrosis factor-alpha (TNFalpha) and interleukin-1beta (IL-1beta)-triggered nuclear factor-kappaB (NF-kappa B) activation by targeting transforming growth factor beta (TGFbeta) activated kinase 1 (TAK1) for K63-linked polyubiquitination. Moreover, TRIM8 modulates translocation of phosphorylated STAT3 into the nucleus through interaction with Hsp90beta and consequently regulates transcription of Nanog in embryonic stem cells. It also interacts with protein inhibitor of activated STAT3 (PIAS3), which inhibits IL-6-dependent activation of STAT3. TRIM8 belongs to the C-V subclass of nuclear TRIM (tripartite motif) family of proteins that are defined by their N-terminal RBCC (RING, Bbox, and coiled coil) domains, including three consecutive zinc-binding domains, a RING finger, Bbox1 and Bbox2, and a coiled coil domain, as well as an uncharacterized region positioned C-terminal to the RBCC domain. The coiled coil domain is required for homodimerization and the region immediately C-terminal to the RING motif is sufficient to mediate the interaction with SOCS1. The type 1 B-box (Bbox1) zinc finger is characterized by a C6H2 zinc-binding consensus motif
