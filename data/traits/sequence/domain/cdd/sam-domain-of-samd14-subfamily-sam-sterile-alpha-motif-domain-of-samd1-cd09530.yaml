identifier: CDD:cd09530
label: SAM_Samd14
definition: >-
  SAM domain of Samd14 subfamily. SAM (sterile alpha motif) domain of the SAMD15 (formerly FAM15A; distinct from human SAMD14 in CDD:cd09512) subfamily is a putative protein-protein interaction domain. SAM is widespread domain in proteins involved in signal transduction and regulation. In many cases SAM mediates homodimerization/oligomerization. The exact function of proteins belonging to this subfamily is unknown
