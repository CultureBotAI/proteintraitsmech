identifier: CDD:cd07692
label: IgC1_CD3_epsilon
definition: >-
  Immunoglobulin (Ig)-like domain of Cluster of Differentiation (CD) 3 epsilon chain; member of the C1-set of IgSF domains. The members here are composed of the immunoglobulin (Ig)-like domain of Cluster of Differentiation (CD) 3 epsilon chain. CD3 is a T cell surface receptor that is associated with alpha/beta T cell receptors (TCRs). The CD3 complex consists of one gamma, one delta, two epsilon, and two zeta chains. The CD3 subunits form heterodimers as gamma/epsilon, delta/epsilon, and zeta/zeta. The gamma, delta, and epsilon chains each contain an extracellular Ig domain, whereas the extracellular domains of the zeta chains are very small and have unknown structure. The CD3 domain participates in intracellular signaling once the TCR has bound an MHC/antigen complex
