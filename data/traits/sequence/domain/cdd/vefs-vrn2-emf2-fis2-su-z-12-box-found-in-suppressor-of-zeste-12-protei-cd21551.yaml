evidence:
  - reference: "PMID:15225548"
    snippet: "SUZ12 is essential for the activity of the Polycomb repressive complex 2 (PRC2), which methylates lysine 27 of histone H3"
    notes: "Pasini et al. (2004, EMBO J 23:4061-4071) and UniProtKB:Q15022 (SUZ12) establish that PRC2 (EZH2-EED-SUZ12) is a histone H3 Lys-27 (H3K27) methyltransferase complex rather than a direct H3K9 methyltransferase."
