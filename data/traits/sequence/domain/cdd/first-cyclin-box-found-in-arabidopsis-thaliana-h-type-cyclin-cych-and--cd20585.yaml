identifier: CDD:cd20585
label: CYCLIN_AcCycH_rpt1
definition: >-
  first cyclin box found in Arabidopsis thaliana H-type cyclin (CycH) and similar proteins. CycH associates with and activates the cyclin-dependent kinases, CDK-2 and CDK-3. CycH contains two cyclin boxes. This model corresponds to the first one. The cyclin box is a protein binding domain
