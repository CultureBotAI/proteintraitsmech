identifier: CDD:cd20534
label: CYCLIN_CCNM_CCNQ_rpt1
definition: >-
  first cyclin box found in cyclin-M (CCNM) family. Cyclin-M (CCNM), officially designated cyclin-Q (CCNQ, formerly FAM58A; distinct from the CNNM1-4/ACDP magnesium transporter family in CDD:cd04590), is the CDK10-activating cyclin that associates with CDK10 to promote its protein kinase activity. Members of this family contain two cyclin boxes. This model corresponds to the first one. The cyclin box is a protein binding domain
