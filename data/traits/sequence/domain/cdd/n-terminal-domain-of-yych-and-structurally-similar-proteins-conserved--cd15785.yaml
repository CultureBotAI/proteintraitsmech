identifier: CDD:cd15785
label: YycH_N_like
definition: >-
  N-terminal domain of YycH and structurally similar proteins conserved in Firmicutes. These protein domains appear to be members of a somewhat larger structural family conserved in Firmicutes, including the N-terminal domain of YycH. YycH plays a role in signal transduction and is found immediately downstream of the essential histidine kinase YycG. YycG forms a two-component system together with its cognate response regulator YycF. YycH functions as a modulator of YycG activity, possibly by interacting with YchI. All three molecules (YchG, YchH, and YchI) have been characterized as membrane proteins, and they may be able to form homodimers
