identifier: CDD:cd20563
label: CYCLIN_CCNA1_rpt2
definition: >-
  second cyclin box found in cyclin-A1 (CCNA1) and similar proteins. CCNA1 may primarily function in the control of the germline meiotic cell cycle and additionally in the control of mitotic cell cycle in some somatic cells. CCNA1 contains two cyclin boxes. This model corresponds to the second one. The cyclin box is a protein binding domain
