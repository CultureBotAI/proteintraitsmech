label: HFD_Aq328-like_rpt2
definition: >-
  second histone-fold domain found in Aquifex Aeolicus protein Aq328 and similar proteins. This subfamily includes a group of uncharacterized DUF931 family proteins similar to Aquifex Aeolicus protein Aq328 and Thermus Thermophilus protein TTHA1479. Aq328 is possibly a DNA-binding protein that is involved in DNA packaging. The function of TTHA1479 remains unclear. All members contain two cross-shaped antiparallel histone-fold domains. The model corresponds to the second repeat
