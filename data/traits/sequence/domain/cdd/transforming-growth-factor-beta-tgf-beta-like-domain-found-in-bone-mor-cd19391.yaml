  transforming growth factor beta (TGF-beta) like domain found in bone morphogenetic protein 4 (BMP-4) and similar proteins. BMP-4, also termed BMP-2B, induces cartilage and bone formation. It also acts in mesoderm induction, tooth development, limb formation and fracture repair
