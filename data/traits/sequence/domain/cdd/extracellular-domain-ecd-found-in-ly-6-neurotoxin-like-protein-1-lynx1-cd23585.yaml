identifier: CDD:cd23585
label: TFP_LU_ECD_LYNX1
definition: >-
  extracellular domain (ECD) found in Ly-6/neurotoxin-like protein 1 (LYNX1) and similar protein. LYNX1 (also called testicular tissue protein Li 112) is an endogenous prototoxin that acts in different tissues through interaction to nicotinic acetylcholine receptors (nAChRs). It prevents plasticity in the primary visual cortex late in life. LYNX1 contains an extracellular domain (ECD) that belongs to Ly-6 antigen/uPA receptor-like (LU) superfamily and exhibits a snake toxin-like fold (also known as three-finger toxin/3FTx fold or three-fingered protein/TFP domain fold)
