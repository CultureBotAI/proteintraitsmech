label: GPN2
definition: >-
  GPN-loop GTPase 2. GPN-loop GTPase 2 (GPN2) is a small GTPase required for proper localization of RNA polymerase II and III (RNAPII and RNAPIII). It forms heterodimers with GPN1 or GPN3
