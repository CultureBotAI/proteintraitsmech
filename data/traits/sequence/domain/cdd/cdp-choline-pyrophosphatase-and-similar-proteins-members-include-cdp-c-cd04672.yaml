identifier: CDD:cd04672
label: NUDIX_CDP-Chase_like
definition: >-
  CDP-Choline Pyrophosphatase and similar proteins. Members include: CDP-Choline Pyrophosphatase, ADP-ribose pyrophosphatase, and UDP-X diphosphatase. CDP-choline pyrophosphatase catalyzes the hydrolysis of CDP-choline to produce CMP and phosphocholine. ADP-ribose pyrophosphatase catalyzes the hydrolysis of ADP-ribose to AMP and ribose-5-P. UDP-X diphosphatase hydrolyzes UDP-N-acetylmuramic acid and UDP-N-acetylmuramoyl-L-alanine. Members of the NUDIX hydrolase superfamily catalyze the hydrolysis of NUcleoside DIphosphates linked to other moieties, X. Enzymes belonging to this superfamily require a divalent cation, such as Mg2+ or Mn2+, for their activity and contain a highly conserved 23-residue NUDIX motif (GX5EX7REUXEEXGU, where U = I, L or V), which functions as a metal binding and catalytic site. Substrates of NUDIX hydrolases include intact and oxidatively damaged nucleoside triphosphates, dinucleoside polyphosphates, nucleotide-sugars and dinucleotide enzymes. These substrates are metabolites or cell signaling molecules that require regulation during different stages of the cell cycle or during periods of stress. In general, the role of the NUDIX hydrolase is to sanitize the nucleotide pools and to maintain cell viability, thereby serving as surveillance & "house-cleaning" enzymes. Substrate specificity is used to define families within the superfamily. Differences in substrate specificity are determined by the N-terminal extension or by residues in variable loop regions. Mechanistically, substrate hydrolysis occurs by a nucleophilic substitution reaction, with variation in the numbers and roles of divalent cations required
