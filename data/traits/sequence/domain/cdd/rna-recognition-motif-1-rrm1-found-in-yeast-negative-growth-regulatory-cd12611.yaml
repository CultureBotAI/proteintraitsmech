identifier: CDD:cd12611
label: RRM1_NGR1_NAM8_like
definition: >-
  RNA recognition motif 1 (RRM1) found in yeast negative growth regulatory protein NGR1, yeast protein NAM8 and similar proteins. This subgroup corresponds to the RRM1 of NGR1 and NAM8. NGR1, also termed RNA-binding protein RBP1, is a putative glucose-repressible protein that binds both, RNA and single-stranded DNA (ssDNA), in yeast. It may function in regulating cell growth in early log phase, possibly through its participation in RNA metabolism. NGR1 contains two RNA recognition motifs (RRMs), also termed RBDs (RNA binding domains) or RNPs (ribonucleoprotein domains), two of which are followed by a glutamine-rich stretch that may be involved in transcriptional activity. In addition, NGR1 has an asparagine-rich region near the carboxyl terminus which also harbors a methionine-rich region. The subgroup also includes NAM8, a putative RNA-binding protein that acts as a suppressor of mitochondrial splicing deficiencies when overexpressed in yeast. It may be a non-essential component of the mitochondrial splicing machinery. Like NGR1, NAM8 contains two RRMs
