identifier: Pfam:PF12142
label: Polyphenol oxidase middle domain
definition: >-
  This domain is found in bacteria and eukaryotes and is approximately 50 amino acids in length. It is found in association with Pfam:PF00264 and Pfam:PF12143. Most members are annotated as being polyphenol oxidases, and many are from plants or plastids. There is a conserved DWL sequence motif.
