identifier: Pfam:PF22229
label: CofB C-terminal domain
definition: >-
  CofB is a minor pilin involved in type IV pili assembly. It consists of a pilin domain at the N-terminal (InterPro:IPR048688), followed by a β-repeat hinge-like domain (InterPro:IPR053971) and a C-terminal β-sheet-rich domain, similar to H-type lectins. This entry represents the C-terminal domain which is required for CofB to initiate pilus assembly.
