identifier: Pfam:PF20968
label: MASE8
definition: >-
  This entry represents the membrane-associated sensor domain MASE8, which is found in association with GGDEF domain (InterPro:IPR000160), histidine sensor kinases and adenylate cyclase output domain (InterPro:IPR001054). This domain is widespread among various classes of proteobacteria and is also found in other phyla.
