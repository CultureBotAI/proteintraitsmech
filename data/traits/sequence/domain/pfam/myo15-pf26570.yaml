identifier: Pfam:PF26570
label: Unconventional myosin-XV-like domain
definition: >-
  This domain is found in human Unconventional myosin-XV (MYO15) and similar animal proteins. Mutations in MYO15 are associated with human deafness. This domain is often found associated with InterPro:IPR001609.
