identifier: Pfam:PF26160
label: YqzN/YkzM domain
definition: >-
  This entry represents a small domain found in two B. subtilis proteins, YqzN and YkzM. This domain shows some structural similarity to members of the UBA domain superfamily. The function of these proteins is unknown.
