identifier: Pfam:PF04411
label: PD-(D/E)XK nuclease superfamily
definition: >-
  This domain has been identified as a member of the PD-(D/E)XK nuclease superfamily through transitive meta profile searches. The domain has two additional β-strands inserted to the core fold after the first core α-helix. It has been speculated that it could function as s methylation-dependent restriction. The domain has two additional β-strands inserted into the core fold after the first core α-helix. The PD-(D/E)XK signature is clearly conserved corresponding to an invariant PD (motif II) and DAK (motif III) motifs. There is also a conserved glutamic acid in motif I that is most likely to be involved in metal ion binding. The second core α-helix contains an invariant MHXYRD motif. It has been speculated that it could function as s methylation-dependent restriction enzyme.
