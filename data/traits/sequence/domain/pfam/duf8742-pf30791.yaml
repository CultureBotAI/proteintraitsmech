identifier: Pfam:PF30791
label: Domain of unknown function (DUF8742)
definition: >-
  This entry represents an N-terminal SH3-like barrel domain of approximately 60 residues. The domain is found at the N terminus of DEAD/DEAH box helicases, preceding ResIII (Pfam:PF04851), SNF2-rel_dom (Pfam:PF00176), DEAD (Pfam:PF00270), Helicase_C (Pfam:PF00271) and NOV_C (Pfam:PF13020) domains. This family is found in bacteria, predominantly Actinomycetota and Pseudomonadota. The function of this domain remains to be determined.
