identifier: Pfam:PF08276
label: PAN-like domain
definition: >-
  Plasma kallikrein (EC:3.4.21.34) and coagulation factor XI (EC:3.4.21.27) are two related plasma serine proteases activated by factor XIIA and which share the same domain topology: an N-terminal region that contains four tandem repeats of about 90 amino acids and a C-terminal catalytic domain. The 90 amino-acid repeated domain contains 6 conserved cysteines. It has been shown that three disulfide bonds link the first and sixth, second and fifth, and third and fourth cysteines. The domain can be drawn in the shape of an apple and has been accordingly called the 'apple domain'. The apple domains of plasma prekallikrein are known to mediate its binding to high molecular weight kininogen, the apple domains of factor XI bind to factor XIIa, platelets, kininogen, factor IX and heparin. The apple domains display some sequence similarity with the N domain of plasminogen/hepatocyte growth factor (HGF) and to some nematode and protozoan proteins. They all belong to the same domain superfamily that have been called the PAN module. The N domain of hepatocyte growth factor binds to the c-Met receptor and to the heparin molecule. The structure of the PAN module of HGF has been solved. It contains a characteristic hairpin-loop structure stabilised by two disulfide bridges, Cys-1 and 6 are not conserved in HGF PAN modules. Apart from the cysteines, there are a number of other conserved positions in the apple domain. This entry represents the PAN domain of the plasma kalllikrein/coagulation factor XI subgroup proteins.
