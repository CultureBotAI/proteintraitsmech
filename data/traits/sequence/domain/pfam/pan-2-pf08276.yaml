identifier: Pfam:PF08276
label: PAN-like domain
definition: >-
  This domain family is found in eukaryotes, and is approximately 40 amino acids in length. The family is found in association with Pfam:PF00954, Pfam:PF01453, Pfam:PF00069, Pfam:PF08276. There is a conserved ELPL sequence motif.
