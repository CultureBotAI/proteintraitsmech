identifier: Pfam:PF10638
label: 'Spindle body associated protein C-terminus  '
definition: >-
  This C-terminal domain of spindle-body-associated protein Sfi1 has an important role to play in the bridge-splitting during bi-polar spindle assembly, and this separation event possibly requires interaction with integral components of the nuclear envelope, such as the Mps2-Bbp1 complex. Centrally to this domain is a region carrying centrin-binding repeats with repeating units containing tryptophan, InterPro:IPR013665.
