identifier: Pfam:PF04879
label: Molybdopterin oxidoreductase Fe4S4 domain
definition: >-
  The molybdopterin oxidoreductase 4Fe-4S domain is found in a number of reductase/dehydrogenase families, which include the periplasmic nitrate reductase precursor and the formate dehydrogenase alpha chain. The following proteins contain this domain and belong to the molybdenium (Mo) or tungsten (W) containing enzyme family, the Mo/W bis-MGD (molybdopterin-guanine-dinucleotide) oxydoreductases: Escherichia coli respiratory nitrate reductase (EC:1.7.99.4). Escherichia coli anaerobic dimethyl sulfoxide reductase (DMSO reductase). Escherichia coli biotin sulfoxide reductases (genes bisC and bisZ). Methanobacterium formicicum formate dehydrogenase (EC:1.2.1.2). Escherichia coli formate dehydrogenases -H (gene fdhF), -N (gene fdnG) and -O (gene fdoG). Wolinella succinogenes polysulfide reductase chain. Salmonella typhimurium thiosulfate reductase (gene phsA). Escherichia coli trimethylamine-N-oxide reductase (EC:1.6.6.9) (gene torA). Nitrate reductase (EC:1.7.99.4) from Klebsiella pneumoniae (gene nasA), Alcaligenes eutrophus, Escherichia coli, Rhodobacter sphaeroides, Thiosphaera pantotropha (gene napA), and Synechococcus PCC 7942 (gene narB).
