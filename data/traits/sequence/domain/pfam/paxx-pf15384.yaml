identifier: Pfam:PF15384
label: PAXX, PAralog of XRCC4 and XLF, also called C9orf142
definition: >-
  Protein PAXX is involved in DNA double-strand break (DSB) repair. PAXX interacts directly with the DSB-repair protein Ku and is recruited to DNA-damage sites in cells.
