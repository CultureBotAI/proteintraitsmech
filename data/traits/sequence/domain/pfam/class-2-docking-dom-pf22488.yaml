identifier: Pfam:PF22488
label: Class 2 C-terminal docking domain
definition: >-
  This short domain is found at the C-terminal end of the polyketide synthase module CurG from the cyanobacteria Moorena producens (UniProtKB:F4Y429). It consists of two α-helices connected by a sharp bend (PDB:4MYY).
