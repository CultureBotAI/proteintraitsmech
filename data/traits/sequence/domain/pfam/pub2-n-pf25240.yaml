identifier: Pfam:PF25240
label: PUB2-like, N-terminal domain
definition: >-
  This domain is found at the N-terminal end of U-box domain-containing protein 2, 3 and 4 from Arabidopsis thaliana (PUB2/3/4) and similar plant sequences. This domain is predicted to show an all-α configuration. It is often found associated with InterPro:IPR003613 and InterPro:IPR000225.
