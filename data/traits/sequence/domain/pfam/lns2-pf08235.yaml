identifier: Pfam:PF08235
label: LNS2 (Lipin/Ned1/Smp2)
definition: >-
  This domain is found in lipins and lipin homologues from Saccharomyces cerevisiae (Smp2) and from Schizosaccharomyces pombe (Ned1). Smp2 (also known as PAH1) is involved in plasmid maintenance and respiration and has been identified as a Mg2+-dependent phosphatidate phosphatase (EC:3.1.3.4) that contains a haloacid dehalogenase (HAD)-like domain. Lipin proteins are phosphatidate phosphatases which catalyse the dephosphorylation of phosphatidic acid to diacylglycerol, the penultimate step in triacylglycerol synthesis. They are involved in adipose tissue development and insulin resistance.
