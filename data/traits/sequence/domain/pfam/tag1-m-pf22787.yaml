identifier: Pfam:PF22787
label: Tag1 middle barrel-like domain
definition: >-
  This entry represents the middle barrel-like domain of yeast Tag1 (also known as YLR173W). Tag1 is a vacuolar membrane protein involved in termination of autophagy. It regulates autophagy termination during persistent nitrogen starvation through Atg1p-mediated re-phosphorylation of Atg13p and PAS disassembly. It shows homology to LEA-2 domain, and together with TMEM106B from humans and Vac7 from yeast, are all predicted to be lipid transfer proteins. It was proposed that Tag1 is composed of 3 tandemly repeated LEA-2 domains.
