identifier: Pfam:PF21186
label: Domain of unknown function (DUF6852)
definition: >-
  This domain is found at the C-terminal of BVU_3817 from Phocaeicola vulgatus (UniProtKB:A6L6W4) and similar proteins mostly from Bacteroidetes. This domain shows an α/β structure and is usually found associated with InterPro:IPR041218. Its function is unknown.
