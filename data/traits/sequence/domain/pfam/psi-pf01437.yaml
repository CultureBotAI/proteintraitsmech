identifier: Pfam:PF01437
label: Plexin repeat
definition: >-
  This is a cysteine rich repeat found in several different extracellular receptors. The function of the repeat is unknown. Three copies of the repeat are found in plexin (UniProtKB:P70206). Two copies of the repeat are found in mahogany protein. A related Caenorhabditis elegans protein (UniProtKB:Q19981) contains four copies of the repeat, while the Met receptor contains a single copy of the repeat.
