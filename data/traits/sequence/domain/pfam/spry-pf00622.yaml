identifier: Pfam:PF00622
label: SPRY domain
definition: >-
  The RFPL defining motif (RDM) is a domain found on RFPL (Ret finger protein like) proteins. In humans, RFPL transcripts can be detected at the onset of neurogenesis in differentiating human embryonic stem cells, and in the developing human neocortex. The RDM domain is thought to have emerged from a neofunctionalisation event. It is found N-terminal to the SPRY domain (Pfam:PF00622).
