identifier: Pfam:PF22834
label: Polo box domain
definition: >-
  This entry represents a domain found in a family of eukaryotic proteins, including the human uncharacterised protein C5orf34, which has been reported to be correlated with an unfavorable prognosis of patients from a variety of human malignancies. This domain appears C-terminal to InterPro:IPR027830 and InterPro:IPR053899 and N-terminal to InterPro:IPR027865. This domain is predicted to show an α/β configuration with high structural similarity to a polo box.
