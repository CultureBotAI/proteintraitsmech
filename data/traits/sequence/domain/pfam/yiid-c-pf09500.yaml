identifier: Pfam:PF09500
label: Putative thioesterase (yiiD_Cterm)
definition: >-
  This entry consists of a broadly distributed uncharacterised domain found often as a standalone protein. The member from is described from crystallography work as a putative thioesterase. About half of the members of this family are fused to an N-terminal acetyltransferase domain (InterPro:IPR000182). The function of these proteins are unknown.
