identifier: Pfam:PF21754
label: Probable sensor domain DacZ_A
definition: >-
  This is a probable sensor domain found at the N-terminal of archaeal diadenylate cyclases, which are typically followed by the DAC (InterPro:IPR003390) domain. It may consist of four α-helices and four β-strands according to structure predictions. DacZ_A is distantly related to PK_C (InterPro:IPR015795), DacZ_N (InterPro:IPR045586) and DACZ_P (InterPro:IPR048544).
