identifier: Pfam:PF25108
label: YMR265C C-terminal domain
definition: >-
  This is the presumed C-terminal domain of the uncharacterised yeast protein YMR265C, which has a HAD domain (InterPro:IPR018812) at the N-terminal, found in Swiss Army Knife RNA repair proteins. The function of this domain is unknown.
