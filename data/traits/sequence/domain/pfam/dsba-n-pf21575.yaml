identifier: Pfam:PF21575
label: DsbA, N-terminal domain
definition: >-
  This domain is found at the N-terminal end of Putative secreted protein from Corynebacterium diphtheriae (DsbA, UniProtKB:Q6NJK4). It is usually found associated with InterPro:IPR012336. Its specific function is unknown. It adopts an α/β structure with a central antiparallel β-sheet and α-helices packed on it (PDB:4PWO).
