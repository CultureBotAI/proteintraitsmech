identifier: Pfam:PF22251
label: Vacuolar membrane protease, transmembrane domain
definition: >-
  This entry includes fungal vacuolar membrane proteases, such as PFF1 from yeast, which may be involved in vacuolar sorting and osmoregulation. It is the homologue of human ERMP1. According to AlphaFold structure predictions, these proteins consist of a M28 peptidase domain (InterPro:IPR007484) at the N-terminal, a central transmembrane domain (TM) and a C-terminal domain with an elongated β-sandwich-like fold (InterPro:IPR053975), similar to the Mu homology domain (MHD) (InterPro:IPR028565). This entry represents the TM domain of PFF1 and its fungal homologues.
