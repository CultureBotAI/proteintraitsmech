identifier: Pfam:PF00097
label: Zinc finger, C3HC4 type (RING finger)
definition: >-
  This domain family is found in eukaryotes, and is approximately 120 amino acids in length. The family is found in association with Pfam:PF00097. There are two completely conserved residues (R and L) that may be functionally important.
