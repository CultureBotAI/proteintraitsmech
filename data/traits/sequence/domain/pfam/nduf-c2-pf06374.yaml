identifier: Pfam:PF06374
label: NADH-ubiquinone oxidoreductase subunit b14.5b (NDUFC2)
definition: >-
  This family consists of several NADH dehydrogenase [ubiquinone] 1 subunit C2 (NDUC2 or NDUFC2, also known as NADH-ubiquinone oxidoreductase subunit b14.5b) proteins. It is an accessory protein, not involved in catalysis.
