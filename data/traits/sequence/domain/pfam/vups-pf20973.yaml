identifier: Pfam:PF20973
label: Vitamin uptake-like sensor
definition: >-
  This is an integral membrane sensory domain related to the queuosine precursor transporter (InterPro:IPR003744, found in YhhQ protein from E. coli). This domain, named Vitamin uptake-like sensor (VUPS), is found in a variety of bacteria in combination with PAS (InterPro:IPR000014, InterPro:IPR013655), GGDEF (InterPro:IPR000160), and EAL (InterPro:IPR001633) domains, and with histidine sensor kinases (InterPro:IPR005467).
