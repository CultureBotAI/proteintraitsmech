identifier: Pfam:PF08402
label: TOBE domain
definition: >-
  The TOBE domain (Transport-associated OB) always occurs as a dimer as the C-terminal strand of each domain is supplied by the partner. Probably involved in the recognition of small ligands such as molybdenum (e.g. UniProtKB:P46930) and sulphate (UniProtKB:P16676). Found in ABC transporters immediately after the ATPase domain. A strong RPE motif is found at the presumed N terminus of the domain.
