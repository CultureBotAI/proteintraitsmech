identifier: Pfam:PF27068
label: SPbeta prophage YomF protein, middle domain
definition: >-
  This entry represents the middle domain in YomF. The function of this domain remains unknown. YomF is an uncharacterised protein encoded by the SPbeta prophage in Bacillus subtilis. This protein contains an N-terminal domain InterPro:IPR059666, middle domain InterPro:IPR059746 and a C-terminal domain InterPro:IPR059764.
