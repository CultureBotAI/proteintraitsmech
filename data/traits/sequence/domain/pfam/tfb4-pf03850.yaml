identifier: Pfam:PF03850
label: Transcription factor Tfb4
definition: >-
  This entry represents Tfb4/GTF2H3, a component of the transcription factor TFIIH core (includes XPB, p62, p52, p44, p34). TFIIH complex is involved in the nucleotide excision repair (NER) and polymerase II transcription.
