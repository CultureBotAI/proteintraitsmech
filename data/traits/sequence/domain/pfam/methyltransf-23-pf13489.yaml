identifier: Pfam:PF13489
label: Methyltransferase domain
definition: >-
  This domain is found in a group of uncharacterised bacterial proteins. It is usually found associated with methyltransferase domains such as Pfam:PF13489 and Pfam:PF13649 and is predicted to adopt an α-β configuration. It has a conserved motif F/YWDG.
