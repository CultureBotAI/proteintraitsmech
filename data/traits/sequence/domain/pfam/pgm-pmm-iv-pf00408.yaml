identifier: Pfam:PF00408
label: Phosphoglucomutase/phosphomannomutase, C-terminal domain
definition: >-
  This entry represents the C-terminal domain alpha-D-phosphohexomutase enzymes. The alpha-D-phosphohexomutase superfamily is composed of four related enzymes, each of which catalyses a phosphoryl transfer on their sugar substrates: phosphoglucomutase (PGM), phosphoglucomutase/phosphomannomutase (PGM/PMM), phosphoglucosamine mutase (PNGM), and phosphoacetylglucosamine mutase (PAGM). PGM (EC:5.4.2.2) converts D-glucose 1-phosphate into D-glucose 6-phosphate, and participates in both the breakdown and synthesis of glucose. PGM/PMM (EC:5.4.2.2; EC:5.4.2.8) are primarily bacterial enzymes that use either glucose or mannose as substrate, participating in the biosynthesis of a variety of carbohydrates such as lipopolysaccharides and alginate. Both PNGM (EC:5.4.2.3) and PAGM (EC:5.4.2.10) are involved in the biosynthesis of UDP-N-acetylglucosamine.
