identifier: Pfam:PF21167
label: Domain of unknown function (DUF6851)
definition: >-
  This domain of unknown function is found in the N-terminal region of a group of bacterial proteins, including Vanadium-dependent haloperoxidases such as NapH1 (UniProtKB:A7KH27) and NapH3 (UniProtKB:A7KH32). In some proteins, this domain is found associated to InterPro:IPR000326. Its specific function is unknown.
