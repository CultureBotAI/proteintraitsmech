identifier: Pfam:PF23264
label: Domain of unknown function (DUF7073)
definition: >-
  This domain is found in Histone-lysine N-methyltransferase, H3 lysine-4 specific from Plasmodium falciparum (UniProtKB:W4J2P1) and similar sequences from alveolates. In some proteins this domain is found associated with Pfam:PF00628. It shows a conserved motif LLxxYKxKI/LxDLL.
