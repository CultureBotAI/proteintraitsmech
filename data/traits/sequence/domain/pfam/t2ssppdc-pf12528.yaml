identifier: Pfam:PF12528
label: Type II secretion prepilin peptidase dependent protein C
definition: >-
  This entry represents a domain found al proteins mainly found in Enterobacterales, including Prepilin peptidase-dependent protein C from Escherichia coli (PpdC). PpdC is predicted to be a bitopic inner membrane protein. This domain is found in association with InterPro:IPR012902. There are two completely conserved C residues that may be functionally important.
