identifier: Pfam:PF25050
label: TARBP1 domain
definition: >-
  This domain is found in the human probable methyltransferase TARBP1 and similar animal proteins. TARBP1 methylates RNA molecules such as tRNAs. This domain is often found associated with InterPro:IPR001537.
