identifier: Pfam:PF29610
label: Mycolysin C-terminal domain
definition: >-
  This entry represents the peptidase C-terminal domain of mycolysin, a metalloprotease found in Actinomycetes, particularly Streptomyces and Pseudonocardiaceae species. The full-length mycolysin contains an N-terminal domain (InterPro:IPR059677) and a middle domain (InterPro:IPR059663). This domain is also found at the C-terminal of Uncharacterized protein AF_1944.
