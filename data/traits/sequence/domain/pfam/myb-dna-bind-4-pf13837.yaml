identifier: Pfam:PF13837
label: Myb/SANT-like DNA-binding domain
definition: >-
  This presumed domain appears to be related to other Myb/SANT-like DNA binding domains. In particular InterPro:IPR006578 seems most related. Proteins containing this domain are greatly expanded in plants and appears in several proteins annotated as transposon proteins.
