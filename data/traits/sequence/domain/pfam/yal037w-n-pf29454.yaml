identifier: Pfam:PF29454
label: YAL037W N-terminal domain
definition: >-
  This entry represents an N-terminal domain found in uncharacterised proteins from fungi. The domain adopts a β-sheet structure. Family members include YAL037W (UniProtKB:P39728) and YOR342C (UniProtKB:Q12182) from Saccharomyces cerevisiae, along with orthologues from other fungal species. The proteins containing this domain are uncharacterised and their function remains to be determined.
