identifier: Pfam:PF30125
label: Uncharacterized protein YHR127W N-terminal domain
definition: >-
  This entry represents a domain in YHR127W proteins found in fungi. These proteins contain RRM domains InterPro:IPR063508 and are involved in mitotic spindle elongation. The proteins localise to the nucleus and have nucleic acid binding activity. The function of this domain remains to be determined.
