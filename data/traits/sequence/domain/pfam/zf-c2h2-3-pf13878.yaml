identifier: Pfam:PF13878
label: zinc-finger of acetyl-transferase ESCO
definition: >-
  This entry represents the zinc-inger domain of the acetyl-transferase ESCO. N-acetyltransferase ESCO1 and ESCO2 are required for the establishment of sister chromatid cohesion and couple the processes of cohesion and DNA replication to ensure that only sister chromatids become paired together. They act by mediating the acetylation of cohesin component SMC3. They feature a conserved C-terminal domain consisting of a H2C2 zinc finger motif and an acetyltransferase domain (InterPro:IPR028009), while the diverse N-terminal domain is involved in chromosome binding and could target these proteins to different chromosome structures.
