identifier: Pfam:PF21109
label: Stonustoxin helical domain
definition: >-
  This entry represents the Stonustoxin helical domain (PDB:4WVM). Stonustoxin is a large pore forming toxin found in stonefish. This entry contains Stonustoxin as well as a variety of other toxin proteins such as Veruccotoxin and Neoverrucotoxin.
