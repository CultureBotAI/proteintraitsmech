identifier: Pfam:PF00929
label: Exonuclease
definition: >-
  This entry represents a C-terminal domain of approximately 50 residues found in bacterial proteins containing an RNase_T-like exonuclease domain (Pfam:PF00929). It is found in Bacillota and Pseudomonadota. The function of this domain remains to be determined.
