identifier: Pfam:PF30375
label: Phosphoglycerol transferase I, N-terminal domain
definition: >-
  This entry represents the N-terminal domain of phosphoglycerol transferase I (MdoB/OpgB) from Gammaproteobacteria. MdoB transfers phosphoglycerol residues from phosphatidylglycerol to membrane-bound nascent glucan backbones during the biosynthesis of osmoregulated periplasmic glucans (OPGs). The protein is located in the inner membrane with four N-terminal transmembrane helices. This domain is followed by a sulfatase-like catalytic domain (InterPro:IPR000917) and a C-terminal domain (InterPro:IPR054288). The specific function of this N-terminal domain remains to be determined.
