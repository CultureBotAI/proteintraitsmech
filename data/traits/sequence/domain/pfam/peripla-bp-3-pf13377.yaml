identifier: Pfam:PF13377
label: Periplasmic binding protein-like domain
definition: >-
  This domain is found in a variety of transcriptional regulatory proteins from the LacI/GalR family, including HTH-type transcriptional regulators GalR, CytR, LacR and the transcriptional repressor PurR. It is related to bacterial periplasmic binding proteins, although this domain is unlikely to be found in the periplasm. This domain acts as the sensor domain which binds ligands that the DNA-binding domain responds to. This domain recognises sugars, sugar phosphates, sugar acids and purines. The LacI/GalR family, which includes the LacL superfamily, represents one of the largest and most diverse groups of bacterial transcriptional regulators. These proteins play crucial roles in regulating various aspects of bacterial metabolism, particularly carbohydrate utilisation. Characterised by a conserved N-terminal helix-turn-helix (HTH) DNA-binding motif InterPro:IPR000843 and a C-terminal regulatory domain that binds effector molecules InterPro:IPR046335, members of this family can function as both repressors and activators, though most act as repressors. They typically respond to specific effector molecules, often sugars or metabolites, which modulate their DNA-binding affinity and consequently their regulatory activity. This allows bacteria to fine-tune gene expression in response to environmental conditions and available carbon sources. Some well-characterised members of this family include: LacI (lactose operon repressor) in Escherichia coli GalR (galactose operon repressor) in Escherichia coli PurR (purine biosynthesis repressor) in various bacteria CcpA (catabolite control protein A) in Gram-positive bacteria FruR (fructose repressor) in Enterobacteriaceae
