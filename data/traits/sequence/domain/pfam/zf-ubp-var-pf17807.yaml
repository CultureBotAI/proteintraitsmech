identifier: Pfam:PF17807
label: Variant UBP zinc finger
definition: >-
  This domain is found at the C terminus of the ubiquitin hydrolases and is related to the UBP-type zinc finger domain (InterPro:IPR001607). However, it has an altered pattern of zinc binding residues.
