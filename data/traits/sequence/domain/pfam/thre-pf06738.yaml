identifier: Pfam:PF06738
label: Putative threonine/serine exporter
definition: >-
  This entry represents a domain found in ThrE family members, found in bacteria, fungi and some archaeal species. ThrE is a family of proteins that catalyse the export of L-threonine from the cell. UniProtKB:Q79VD1 has been characterised as being necessary for this export. The domain exhibits 10 putative TMs and catalyses the proton-motive-force-dependent efflux of threonine and serine.
