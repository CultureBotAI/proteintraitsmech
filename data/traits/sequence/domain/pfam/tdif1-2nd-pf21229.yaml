identifier: Pfam:PF21229
label: TdIF1, C-terminal
definition: >-
  This domain is found in deoxynucleotidyltransferase terminal- interacting protein 1 from humans (TdIF1) (UniProtKB:Q9H147) and similar proteins conserved from nematodes to mammals. TdIF1 is part of a histone deacetylase complex that is upregulated during mitosis and is associated with cyclin A. It is organised into two domains. This entry represents the C-terminal domain, which adopts a structure related to the SKI/SNO/DAC domain (PDB:2MWI) (InterPro:IPR003380) and is involved in the interaction with both DNA and nucleosomes.
