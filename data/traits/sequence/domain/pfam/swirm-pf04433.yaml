identifier: Pfam:PF04433
label: SWIRM domain
definition: >-
  The SWIRM domain is a small α-helical domain of about 85 amino acid residues found in eukaryotic chromosomal proteins. It is named after the proteins SWI3, RSC8 and MOIRA in which it was first recognised. This domain mediates protein-protein interactions in the assembly of chromatin-protein complexes. The yeast SWI3 SWIRM structure revealed that it forms a four-helix globular domain containing a helix-turn-helix motif. The SWIRM domain can be linked to different domains, such as the ZZ-type zinc finger (InterPro:IPR000433), the Myb DNA-binding domain (InterPro:IPR001005), the HORMA domain (InterPro:IPR003511), the amino-oxidase domain, the chromo domain (InterPro:IPR000953), and the JAB1/PAD1 domain.
