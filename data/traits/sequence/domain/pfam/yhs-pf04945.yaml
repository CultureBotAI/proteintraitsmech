identifier: Pfam:PF04945
label: YHS domain
definition: >-
  This short presumed domain is about 50 amino acid residues long. It often contains two cysteines that may be functionally important. This domain is found in cation transporting ATPases, some oxygenase components of multicomponent enzymatic monooxigenases, and in a set of uncharacterised membrane proteins including UniProtKB:Q9CNI0. This domain is named after three of the most conserved amino acids it contains. The domain may be metal binding. This domain is duplicated in some copper transporting ATPases.
