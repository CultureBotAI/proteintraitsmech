identifier: Pfam:PF08951
label: Bacteriocin immunity protein family
definition: >-
  Gram-positive lactobacilli produce bacteriocins to kill closely-related competitor species. To protect themselves from the bactericidal activity of this molecule they co-express an immunity protein. This entry represents Lactococcin-A immunity protein from Lactococcus lactis and similar proteins predominantly found in the bacterial class Bacilli.
