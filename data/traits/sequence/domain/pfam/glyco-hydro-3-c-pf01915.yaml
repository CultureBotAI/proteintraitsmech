identifier: Pfam:PF01915
label: Glycosyl hydrolase family 3 C-terminal domain
definition: >-
  Glycoside hydrolase family 3 CAZy:GH3 comprises enzymes with a number of known activities; beta-glucosidase (EC:3.2.1.21); beta-xylosidase (EC:3.2.1.37); N-acetyl beta-glucosaminidase (EC:3.2.1.52); glucan beta-1,3-glucosidase (EC:3.2.1.58); cellodextrinase(EC:3.2.1.74); exo-1,3-1,4-glucanase (EC:3.2.1). These enzymes are two-domain globular proteins that are N-glycosylated at three sites. This entry represents the C-terminal domain, involved in catalysis and may be involved in binding beta-glucan. It is found associated with Pfam:PF00933.
