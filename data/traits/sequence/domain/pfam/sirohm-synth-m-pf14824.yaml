identifier: Pfam:PF14824
label: Sirohaem biosynthesis protein central
definition: >-
  This is the central domain of a multifunctional enzyme which catalyses the biosynthesis of sirohaem. Both of the catalytic activities of this enzyme (precorrin-2 dehydrogenase (EC:1.3.1.76) and sirohydrochlorin ferrochelatase (EC:4.99.1.4)) are located in the N-terminal domain of this enzyme, InterPro:IPR006367.
