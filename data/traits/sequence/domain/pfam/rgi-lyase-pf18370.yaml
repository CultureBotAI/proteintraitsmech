identifier: Pfam:PF18370
label: 'Rhamnogalacturonan I lyases beta-sheet domain  '
definition: >-
  This is the β-sheet domain found in rhamnogalacturonan (RG) lyases, which are responsible for an initial cleavage of the RG type I (RG-I) region of plant cell wall pectin. Polysaccharide lyase family 11 carrying this domain, such as YesW (EC:4.2.2.23) and YesX (EC:4.2.2.24), cleave glycoside bonds between rhamnose and galacturonic acid residues in RG-I through a beta-elimination reaction.
