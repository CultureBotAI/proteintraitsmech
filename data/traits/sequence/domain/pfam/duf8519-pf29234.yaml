identifier: Pfam:PF29234
label: Domain of unknown function (DUF8519)
definition: >-
  This entry represents a domain of unknown function found in spirochaetes. The domain is approximately 100-130 residues in length and is found C-terminal to a heptaprenyl diphosphate synthase domain (Pfam:PF07456). The family shows distant sequence similarity to the CbiQ domain (Pfam:PF02361), a protein involved in cobalt transport. The function of this domain remains to be determined.
