identifier: Pfam:PF00676
label: Dehydrogenase E1 component
definition: >-
  This entry represents a domain found in a number of dehydrogenases, all of which use thiamine pyrophosphate as a cofactor and are members of a multienzyme complex: pyruvate dehydrogenase (EC:1.2.4.1), a component of the multienzyme pyruvate dehydrogenase complex; 2-oxoglutarate dehydrogenase (EC:1.2.4.2), a component of the multienzyme 2-oxoglutarate dehydrogenase, which contains multiple copies of three enzymatic components: 2-oxoglutarate dehydrogenase (E1), dihydrolipoamide succinyltransferase (E2) and lipoamide dehydrogenase (E3); 2-oxoisovalerate dehydrogenase (EC:1.2.4.4), a component of the multienzyme branched-chain alpha-keto dehydrogenase complex.
