identifier: Pfam:PF04990
label: RNA polymerase Rpb1, domain 7
definition: >-
  RNA polymerases catalyse the DNA dependent polymerisation of RNA. Prokaryotes contain a single RNA polymerase compared to three in eukaryotes (not including mitochondrial and chloroplast polymerases). This domain, domain 7, represents a mobile module of the RNA polymerase. Domain 7 interacts with the lobe domain of Rpb2 (InterPro:IPR007642).
