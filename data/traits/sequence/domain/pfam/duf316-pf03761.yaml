identifier: Pfam:PF03761
label: Nematode trypsin-6-like family
definition: >-
  This is a family of trypsin-6 part of the chymotrypsin family S21, ie a serine peptidase. The C. elegans sequence (UniProtKB:O01566) is trypsin-6: all the active site residues are present (His90, Asp168, Ser267).
