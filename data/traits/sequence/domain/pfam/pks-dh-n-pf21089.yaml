identifier: Pfam:PF21089
label: Polyketide synthase dehydratase domain
definition: >-
  This domain is found in the C-terminal of a dehydratase domain (InterPro:IPR020807) found in diverse PKS enzymes. This domain adopts a HotDog fold. Structural analysis shows these DH domains are double hotdogs in which the active site contains a histidine from the N-terminal hotdog and an aspartate from the C-terminal hotdog. Studies have uncovered that a substrate tunnel formed between the DH domains may be essential for loading substrates and unloading products. Polyketide synthases (PKSs) are large, multifunctional enzyme complexes that catalyse the biosynthesis of diverse secondary metabolites known as polyketides. These enzymes operate in an assembly line-like manner, utilising multiple domains such as acyltransferase (AT) InterPro:IPR014043, and acyl carrier protein (ACP) InterPro:IPR009081 to perform stepwise condensation of simple carboxylic acid units. PKSs can be classified into three main types: type I (modular), type II (iterative), and type III, each with distinct structural and functional characteristics. The modular type I PKSs, in particular, contain additional domains like ketoreductase (KR) InterPro:IPR013968, dehydratase (DH) InterPro:IPR020807, and enoylreductase (ER) InterPro:IPR020843 that modify the growing polyketide chain.
