identifier: Pfam:PF30664
label: Iron-sulfur cluster protein N-terminal domain
definition: >-
  This entry represents an approximately 70-80 residue N-terminal domain found in iron-sulfur cluster proteins, predominantly in Actinomycetota. The domain is commonly located upstream of NifU domains (InterPro:IPR001075) and sometimes Rieske domains. Several family members, including HhyE (UniProtKB:A0A6I8M4W6) and HucE (UniProtKB:A0QUN2), have been reported to be putative iron-sulfur proteins required for atmospheric hydrogen oxidation in mycobacteria, likely mediating electron transfer between hydrogenase catalytic subunits and the respiratory chain. The specific function of this N-terminal domain remains to be determined.
