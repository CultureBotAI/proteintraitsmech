identifier: Pfam:PF24919
label: Meiotically up-regulated gene 62 protein-like domain
definition: >-
  This domain is found in Meiotically up-regulated gene 62 protein from Schizosaccharomyces pombe (Mug62) and similar proteins predominantly found in fungi, including Homeostatic regulator of DAG. Mug62 plays a role in meiosis. This domain is often found associated to InterPro:IPR000873 and InterPro:IPR025110.
