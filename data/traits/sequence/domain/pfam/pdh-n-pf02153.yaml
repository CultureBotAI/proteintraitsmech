identifier: Pfam:PF02153
label: Prephenate dehydrogenase, nucleotide-binding domain
definition: >-
  This entry includes prephenate dehydrogenases (PDHs) EC:1.3.1.12 involved in tyrosine biosynthesis, and related proteins predominantly found in bacteria. This is the N-terminal nucleotide-binding domain of PDHs, which has a modified Rossmann nucleotide-binding fold with an extended β-sheet sandwiched by three helices on each face.
