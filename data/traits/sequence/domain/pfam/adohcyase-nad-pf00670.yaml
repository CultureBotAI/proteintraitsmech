identifier: Pfam:PF00670
label: S-adenosyl-L-homocysteine hydrolase, NAD binding domain
definition: >-
  S-adenosyl-L-homocysteine hydrolase (EC:3.3.1.1) (AdoHcyase) is an enzyme of the activated methyl cycle, responsible for the reversible hydration of S-adenosyl-L-homocysteine into adenosine and homocysteine. AdoHcyase is an ubiquitous enzyme which binds and requires NAD + as a cofactor. AdoHcyase is a highly conserved protein of about 430 to 470 amino acids.
