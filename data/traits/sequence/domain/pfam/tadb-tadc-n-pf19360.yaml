identifier: Pfam:PF19360
label: TadB/TadC N-terminal domain
definition: >-
  This presumed domain, mainly found in Alphaproteobacteria, is functionally uncharacterised. It is found at the N-terminal of predicted type II secretion proteins, such as TadB. It is found in association with InterPro:IPR018076.
