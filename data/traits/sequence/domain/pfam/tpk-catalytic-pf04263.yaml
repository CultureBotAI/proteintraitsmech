identifier: Pfam:PF04263
label: Thiamin pyrophosphokinase, catalytic domain
definition: >-
  Thiamin pyrophosphokinase (TPK, EC:2.7.6.2) catalyzes the transfer of a pyrophosphate group from ATP to vitamin B1 (thiamin) to form the coenzyme thiamin pyrophosphate (TPP). Thus, TPK is important for the formation of a coenzyme required for central metabolic functions. The structure of thiamin pyrophosphokinase suggests that the enzyme may operate by a mechanism of pyrophosphoryl transfer similar to those described for pyrophosphokinases functioning in nucleotide biosynthesis.
