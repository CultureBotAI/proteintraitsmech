identifier: Pfam:PF31086
label: Actinomycete conjugal transfer protein N-terminal domain
definition: >-
  This entry represents an N-terminal domain of approximately 120 residues found in FtsK/SpoIIIE family conjugal transfer proteins in Actinomycetes. This domain is located N-terminal to the FtsK_SpoIIIE ATPase domain (InterPro:IPR002543). These proteins are related to TraSA conjugal transfer proteins. The domain is structurally related to FtsK_alpha (InterPro:IPR041027). The function of this domain remains to be determined.
