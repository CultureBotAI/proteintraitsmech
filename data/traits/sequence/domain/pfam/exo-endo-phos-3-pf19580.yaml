identifier: Pfam:PF19580
label: Endonuclease/Exonuclease/phosphatase family
definition: >-
  This entry represents a domain of unknown function found in large multi-domain proteins. The domain is typically located between N-terminal domains, such as lamin tail domains (Pfam:PF00932) or cadherin-like domains, and C-terminal regions containing endonuclease/exonuclease (Pfam:PF03372, Pfam:PF19580) or calcium-binding repeat domains (Pfam:PF00353). The function of this domain remains to be determined.
