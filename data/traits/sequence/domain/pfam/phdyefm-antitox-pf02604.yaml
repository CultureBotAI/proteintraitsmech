identifier: Pfam:PF02604
label: Antitoxin Phd_YefM, type II toxin-antitoxin system
definition: >-
  Members of this family act as antitoxins in type II toxin-antitoxin systems. When bound to their toxin partners, they can bind DNA via the N terminus and repress the expression of operons containing genes encoding the toxin and the antitoxin.
