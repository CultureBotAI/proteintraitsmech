identifier: Pfam:PF21110
label: GlxA beta barrel domain
definition: >-
  This entry represents the second domain of the GlxA protein from Streptomyces lividans (UniProtKB:D6EWM0). GlxA contains a β-propeller domain and this β-barrel domain is inserted within it. This domain is often found associated with InterPro:IPR015202.
