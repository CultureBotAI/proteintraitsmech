identifier: Pfam:PF31155
label: Phosphoglucan water dikinase linker domain
definition: >-
  This entry represents a linker domain of approximately 200 residues found in phosphoglucan water dikinase (PWD/GWD3) in Viridiplantae. This domain is located between the N-terminal starch-binding CBM20 domain (InterPro:IPR002044) and the phosphohistidine domain GWD1_pHisD (InterPro:IPR054481). PWD phosphorylates starch at the C-3 position of glucose units during starch degradation. The specific function of this linker domain remains to be determined.
