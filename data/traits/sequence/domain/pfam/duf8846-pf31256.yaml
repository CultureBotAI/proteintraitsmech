identifier: Pfam:PF31256
label: Domain of unknown function (DUF8846)
definition: >-
  This entry represents a domain of unknown function found in uncharcaterised proteins from Alphaproteobacteria, predominantly in Rhodobacterales (including Roseobacteraceae and Paracoccaceae). The domain is approximately 100 residues in length and is predicted to adopt an α/β structure containing a four stranded antiparallel β-sheet. STRING analysis shows these proteins are consistently associated with cell division and secretion system proteins, including DivIB (Pfam:PF03799), RodZ (Pfam:PF13464) and SPOR domain proteins (Pfam:PF05036). The specific function of this domain remains to be determined.
