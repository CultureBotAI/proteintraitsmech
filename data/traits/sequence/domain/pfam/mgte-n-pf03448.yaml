identifier: Pfam:PF03448
label: MgtE intracellular N domain
definition: >-
  This domain is found at the N terminus of eubacterial magnesium transporters of the MgtE family InterPro:IPR006667. This domain is an intracellular domain that has an α-helical structure. The crystal structure of the MgtE transporter shows two of 5 magnesium ions are in the interface between the N domain and the CBS domains. In the absence of magnesium there is a large shift between the N and CBS domains.
