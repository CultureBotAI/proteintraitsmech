identifier: Pfam:PF22175
label: 8-oxoguanine DNA glycosylase
definition: >-
  This entry represents bifunctional, thermostable 8-oxoguanine DNA glycosylase/DNA lyase enzymes (OGG or OG glycosylases), which are involved in base excision repair of DNA damaged by oxidation or by mutagenic agents. Most damage to bases in DNA is repaired by the base excision repair pathway. These enzymes have both DNA glycosylase activity (EC:3.2.2) and AP lyase activity (EC:4.2.99.18). OGG1 enzymes are active only towards the removal of 8-oxoguanine.
