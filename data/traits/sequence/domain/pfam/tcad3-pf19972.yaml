identifier: Pfam:PF19972
label: Ternary complex associated domain 3
definition: >-
  This entry represents a novel uncharacterised domain found associated with the vWA-MoxR-VMAP ternary systems. This domain is usually found at the N-terminal. It can be found associated with InterPro:IPR024983 and InterPro:IPR045438 in proteins named as uncharacterised UniProtKB:B2J079. This domain is found in cyanobacteria.
