identifier: Pfam:PF23250
label: Zinc finger domain of DNA polymerase-epsilon
definition: >-
  This is a CysA-type zinc finger domain found in human DNA polymerase epsilon catalytic subunit A (DPOE, also known as POLE), the catalytic component of the DNA polymerase epsilon complex. It is often found associated with InterPro:IPR054475.
