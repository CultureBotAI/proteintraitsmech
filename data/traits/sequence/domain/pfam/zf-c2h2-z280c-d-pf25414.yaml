identifier: Pfam:PF25414
label: Z280C/D-like C2H2 zinc finger
definition: >-
  This C2H2 zinc finger domain is found in several zinc-finger proteins such as Zinc finger protein 280C and 280D as well as protein Pogo transposable element with ZNF domain (POGZ). 280C and 280D are probably involved in transcriptional regulation. POGZ plays a role in mitotic cell cycle progression and is involved in kinetochore assembly and mitotic sister chromatid cohesion. It is an essential protein that links HP1alpha dissociation with Aurora B kinase activation during mitosis. POGZ also promotes the repair of DNA double-strand breaks through the homologous recombination pathway. This domain is not presents in 280A and 280B. Zinc finger (Znf) domains are relatively small protein motifs which contain multiple finger-like protrusions that make tandem contacts with their target molecule. Some of these domains bind zinc, but many do not; instead, they bind other metals, such as iron, or no metal at all. For example, some family members form salt bridges to stabilise the finger-like folds. They were first identified as a DNA-binding motif in transcription factor TFIIIA from Xenopus laevis (African clawed frog); however, they are now recognised to bind DNA, RNA, protein and/or lipid substrates. Their binding properties depend on the amino acid sequence of the finger domains and of the linker between fingers, as well as on the higher-order structures and the number of fingers. Znf domains are often found in clusters, where fingers can have different binding specificities. There are many superfamilies of Znf motifs, varying in both sequence and structure. They display considerable versatility in binding modes, even between members of the same class (e.g., some bind DNA, others protein), suggesting that Znf motifs are stable scaffolds that have evolved specialised functions…
