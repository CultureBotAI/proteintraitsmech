identifier: Pfam:PF02436
label: Conserved carboxylase domain
definition: >-
  This domain represents a conserved region in pyruvate carboxylase (PYC) (EC:6.4.1.1), oxaloacetate decarboxylase alpha chain (OADA) (EC:4.1.1.3), and transcarboxylase 5s subunit (EC:2.1.3.1). The domain is found adjacent to the HMGL-like domain (InterPro:IPR000891) and often close to the biotin_lipoyl domain (InterPro:IPR000089) of biotin requiring enzymes.
