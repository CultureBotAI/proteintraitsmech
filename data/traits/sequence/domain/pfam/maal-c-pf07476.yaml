identifier: Pfam:PF07476
label: Methylaspartate ammonia-lyase C-terminus
definition: >-
  Methylaspartate ammonia-lyase EC:4.3.1.2 catalyses the second step of fermentation of glutamate. It is a homodimer. This domain represents the C-terminal region of methylaspartate ammonia-lyase and contains a TIM barrel fold similar to the Pfam:PF13378. This domain represents the catalytic domain and contains a metal binding site.
