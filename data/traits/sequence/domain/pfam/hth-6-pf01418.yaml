identifier: Pfam:PF01418
label: Helix-turn-helix domain, rpiR family
definition: >-
  This domain contains a helix-turn-helix motif. Every member of this family is N-terminal to a SIS domain InterPro:IPR001347. Members of this family are probably regulators of genes involved in phosphosugar metobolism.
