identifier: Pfam:PF02098
label: Tick histamine binding protein
definition: >-
  The lipocalins are a diverse, interesting, yet poorly understood family of proteins composed, in the main, of extracellular ligand-binding proteins displaying high specificity for small hydrophobic molecules. Functions of these proteins include transport of nutrients, control of cell regulation, pheromone transport, cryptic colouration and the enzymatic synthesis of prostaglandins. The crystal structures of several lipocalins have been solved and show a novel 8-stranded anti-parallel β-barrel fold well conserved within the family. Sequence similarity within the family is at a much lower level and would seem to be restricted to conserved disulphides and 3 motifs, which form a juxtaposed cluster that may act as a common cell surface receptor site. By contrast, at the more variable end of the fold are found an internal ligand binding site and a putative surface for the formation of macromolecular complexes. The anti-parallel β-barrel fold is also exploited by the fatty acid-binding proteins (which function similarly by binding small hydrophobic molecules), by avidin and the closely related metalloprotease inhibitors, and by triabin. Similarity at the sequence level, however, is less obvious, being confined to a single short N-terminal motif. The lipocalin family can be subdivided into kernal and outlier sets. The kernal lipocalins form the largest self-consistent group, comprising the subfamily of tick histamine-binding proteins. The outlier lipocalins form several smaller distinct subgroups: the OBPs, the von Ebner's gland proteins, alpha-1-acid glycoproteins, tick histamine binding proteins and the nitrophorins. The tick histamine binding proteins are the most recently identified set of outlier lipocalins. The structure of one tick histamine binding protein has been sol…
