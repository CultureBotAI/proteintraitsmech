identifier: Pfam:PF02098
label: Tick histamine binding protein
definition: >-
  The lipocalins are a diverse, interesting, yet poorly understood family of proteins composed, in the main, of extracellular ligand-binding proteins displaying high specificity for small hydrophobic molecules. Functions of these proteins include transport of nutrients, control of cell regulation, pheromone transport, cryptic colouration and the enzymatic synthesis of prostaglandins. The crystal structures of several lipocalins have been solved and show a novel 8-stranded anti-parallel β-barrel fold well conserved within the family. Sequence similarity within the family is at a much lower level and would seem to be restricted to conserved disulphides and 3 motifs, which form a juxtaposed cluster that may act as a common … The tick histamine binding proteins are the most recently identified set of outlier lipocalins. The structure of one tick histamine binding protein has been solved and has shown the proteins to have the characteristic lipocalin fold but without any appreciable sequence similarity. The tick histamine binding proteins are secreted into the saliva of the ixodid tick Rhipicephalus appendiculatus and share functional similarity with the nitrophorins, sequestering histamine at the wound site. Because the tick histamine binding proteins outcompete histamine receptors, they are able to overcome host inflammatory and immune responses. This enables the ticks to feed for extended periods, lasting from days to several weeks, and are able to gorge themselves on large blood meals increasing their body mass 100 fold. Unlike nitrophorins, the tick proteins do not bind haem (or other cofactor), but ligate histamine directly in two rigid orthogonally-arranged binding sites, at opposing ends of the lipocalin anti-parallel β-barrel, which have an unusually polar character.
