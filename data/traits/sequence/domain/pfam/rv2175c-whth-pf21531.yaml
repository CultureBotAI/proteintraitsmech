identifier: Pfam:PF21531
label: DNA-binding protein Rv2175c, wHTH domain
definition: >-
  This entry represents the N-terminal wHTH domain of Rv2175c (UniProtKB:O53509) from Mycobacterium tuberculosis and related bacterial proteins. It was shown that this domain bind DNA. The C-terminal domain InterPro:IPR041098 may play a regulatory role.
