identifier: Pfam:PF01266
label: FAD dependent oxidoreductase
definition: >-
  This entry includes various FAD dependent oxidoreductases: glycerol-3-phosphate dehydrogenase (EC:1.1.99.5), sarcosine oxidase beta subunit (EC:1.5.3.1), D-amino acid dehydrogenase (EC:1.4.99.1), D-aspartate oxidase (EC:1.4.3.1). D-amino acid oxidase (EC:1.4.3.3) (DAMOX or DAO) is an FAD flavoenzyme that catalyzes the oxidation of neutral and basic D-amino acids into their corresponding keto acids. DAOs have been characterised and sequenced in fungi and vertebrates where they are known to be located in the peroxisomes. D-aspartate oxidase (EC:1.4.3.1) (DASOX) is an enzyme, structurally related to DAO, which catalyzes the same reaction but is active only toward dicarboxylic D-amino acids. In DAO, a conserved histidine has been shown to be important for the enzyme's catalytic activity.
