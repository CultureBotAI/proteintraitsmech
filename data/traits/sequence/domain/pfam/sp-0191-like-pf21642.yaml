identifier: Pfam:PF21642
label: SP_0191-like
definition: >-
  This entry represents a domain predominantly found in streptococcus. Members include a lipoprotein from Streptococcus pneumoniae (UniProtKB:A0A0H2UNC7), whose structure is known and consists of six-stranded antiparallel β-sheet packed on one side with helices (PDB:2MVB). The function of this domain is unknown. This domain is always found C-terminal to a lipoprotein lipid attachment site suggesting that it may be associated with the membrane.
