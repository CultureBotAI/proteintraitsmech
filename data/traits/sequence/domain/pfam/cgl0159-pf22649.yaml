identifier: Pfam:PF22649
label: Cgl0159-like
definition: >-
  This domain is found in the uncharacterised protein Cgl0159 from Corynebacterium glutamicum (UniProtKB:Q8NTZ2) and its homologues mainly from actinomycetes. It adopts a classical (β/α)8 barrel. Members of this entry share significant similarity with Deoxyribose-phosphate aldolase.
