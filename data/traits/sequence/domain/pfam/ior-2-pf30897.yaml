identifier: Pfam:PF30897
label: Indolepyruvate oxidoreductase domain
definition: >-
  This entry represents a domain of approximately 150 residues found in indolepyruvate ferredoxin oxidoreductases (IOR, EC:1.2.7.8). This domain is located between the N-terminal thiamine pyrophosphate (TPP) binding region (InterPro:IPR002880) and the TPP_enzyme_C domain (InterPro:IPR011766). IOR enzymes catalyse the ferredoxin-dependent oxidative decarboxylation of arylpyruvates such as indole-3-pyruvate, forming acyl-CoA derivatives. The enzymes typically function as heterodimers and contain iron-sulphur clusters for electron transfer. This domain is structurally related to the PFOR_II domain (InterPro:IPR033412) found in pyruvate:ferredoxin oxidoreductases. Members are found predominantly in bacteria.
