identifier: Pfam:PF06271
label: RDD family
definition: >-
  This entry represents the C-terminal domain found in RDD family proteins, which follows the RDD domain (Pfam:PF06271). This family is found predominantly in Bacteroidota, particularly in the orders Flavobacteriales and Cytophagales. The domain is approximately 65-85 residues in length. The function of this domain remains to be determined.
