identifier: Pfam:PF30156
label: Fungal histidine kinase, N-terminal domain
definition: >-
  This domain is found at the N-terminal of a group of histidine kinases from firmicutes, including CroS (UniProtKB:Q82YZ0) from Enterococcus faecalis, a member of the two-component regulatory system CroR/CroS. This domain is found associated with Pfam:PF30155, InterPro:IPR003661 and InterPro:IPR003594. It is predicted to show an α-helical configuration.
