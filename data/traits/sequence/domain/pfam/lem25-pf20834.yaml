identifier: Pfam:PF20834
label: Dot/Icm T4SS effector Lem25 domain
definition: >-
  This domain is found in Dot/Icm T4SS effector Lem25, the hypothetical protein lpg2422 from Legionella pneumophila (UniProtKB:Q5ZSU4) and related proteins from Legionella species. It adopts an α-helical structure consisting of a four-helical bundle (PDB:4M0M). This domain is found C-terminal to InterPro:IPR040945 and usually in three tandem copies. Its function is unknown.
