identifier: Pfam:PF01318
label: Bromovirus coat protein
definition: >-
  This family consists of Bromovirus coat proteins. RNA-protein interactions stabilise many viruses and also the nucleoprotein cores of enveloped animal viruses (e.g. retroviruses). The nucleoprotein particles are frequently pleomorphic and generally unstable due to the lack of strong protein-protein interactions in their capsids. The structure is known for Cowpea chlorotic mottle virus (CCMV). It shows novel quaternary structure interactions based on interwoven carboxyterminal polypeptides that extend from canonical capsid β-barrel subunits. Additional particle stability is provided by intercapsomere contacts between metal ion mediated carboxyl cages and by protein interactions with regions of ordered RNA.
