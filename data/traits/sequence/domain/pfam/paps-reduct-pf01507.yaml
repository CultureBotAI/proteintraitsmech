identifier: Pfam:PF01507
label: Phosphoadenosine phosphosulfate reductase domain
definition: >-
  This presumed domain is functionally uncharacterised. This domain is found in bacteria. This domain is typically between 53 to 190 amino acids in length. This domain is found associated with Pfam:PF01507. This domain has a conserved KND sequence motif.
