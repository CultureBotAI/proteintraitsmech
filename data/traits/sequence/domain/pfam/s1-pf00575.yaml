definition: >-
  This domain is found in uncharacterised proteins mainly from Alveolata lineage. It is predicted to fold into a simple structure composed of beta-hairpin followed by an alpha-hairpin. Many proteins contain tandem repeats of this domain. It is frequently found in combination with and .
