identifier: Pfam:PF03621
label: MbtH-like protein
definition: >-
  This domain is found in the MbtH protein UniProtKB:O05821 as well as at the N terminus of the antibiotic synthesis protein NIKP1. This domain is about 70 amino acids long and contains 3 fully conserved tryptophan residues. Many of the members of this family are found in known antibiotic synthesis gene clusters.
