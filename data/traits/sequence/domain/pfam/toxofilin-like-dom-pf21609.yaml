identifier: Pfam:PF21609
label: Toxofilin-like domain
definition: >-
  This domain is found in a group of proteins from eukaryotic parasites, including Toxofilin (UniProtKB:Q9NG25) from Toxoplasma gondii, an actin-binding protein involved in invasion. This domain interacts with the host mammalian actin. It folds into five α-helices connected by loops (PDB:2Q97).
