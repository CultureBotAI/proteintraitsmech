identifier: Pfam:PF00017
label: SH2 domain
definition: >-
  This entry represents the C-terminal domain of STAT1, which selectively binds the TAZ2 domain of CRB (CREB-binding protein). This group of eukaryotic proteins is approximately 20 amino acids in length, and is found in association with Pfam:PF02865, Pfam:PF00017, Pfam:PF01017, Pfam:PF02864. By binding to CRB, it becomes a transcriptional activator and can initiate transcription of certain genes.
