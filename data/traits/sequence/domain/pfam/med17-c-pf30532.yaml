identifier: Pfam:PF30532
label: Mediator complex subunit 17 C-terminal domain
definition: >-
  This entry represents a C-terminal domain found in Mediator complex subunit 17 (MED17) proteins from metazoans. This domain is associated to InterPro:IPR019313. MED17 is a component of the Mediator complex, a coactivator involved in the regulated transcription of nearly all RNA polymerase II-dependent genes. The Mediator complex functions as a bridge to convey information from gene-specific regulatory proteins to the basal RNA polymerase II transcription machinery. In Drosophila, MED17 is required for adult cell and segment identity specification. Mutations in MED17 are associated with microcephaly, postnatal progressive, with seizures and brain atrophy (MCPHSBA) in humans. The specific function of this domain remains to be determined.
