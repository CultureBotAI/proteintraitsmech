identifier: Pfam:PF21690
label: Uncharacterized ATP-binding protein MJ1010-like, C-terminal domain
definition: >-
  This domain is found at the C-terminal of a group of uncharacterised proteins that belong to the archaeal AAA+ ATPase superfamily, including MJ1010 from Methanocaldococcus jannaschii. This domain is usually found associated with InterPro:IPR011579.
