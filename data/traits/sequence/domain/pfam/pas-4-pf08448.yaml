identifier: Pfam:PF08448
label: PAS fold
definition: >-
  The PAS fold corresponds to the structural domain that has previously been defined as PAS and PAC motifs. The PAS fold appears in archaea, eubacteria and eukarya, and is involved in a variety of functions within sensory proteins promoting protein-protein interactions, signal transfer or as a stimuli sensor. The PAS domain contains a sensory box, or S-box domain that occupies the central portion of the PAS domain but is more widely distributed. It is often tandemly repeated. Known prosthetic groups bound in the S-box domain include haem in the oxygen sensor FixL, FAD in the redox potential sensor NifL, and a 4-hydroxycinnamyl chromophore in photoactive yellow protein. Proteins containing the domain often contain other regulatory domains such as response regulator or sensor histidine kinase domains. Other S-box proteins include phytochromes and the aryl hydrocarbon receptor nuclear translocator. PAS domains are involved in many signalling proteins where they are used as a signal sensor domain. PAS domains appear in archaea, bacteria and eukaryotes. Several PAS-domain proteins are known to detect their signal by way of an associated cofactor. Heme, flavin, and a 4-hydroxycinnamyl chromophore are used in different proteins. The PAS domain was named after three proteins that it occurs in: Per- period circadian protein Arnt- Ah receptor nuclear translocator protein Sim- single-minded protein. PAS domains are often associated with PAC motifs InterPro:IPR001610. It appears that these domains are directly linked, and that together they form the conserved 3D PAS fold. The division between the PAS and PAC domains is caused by major differences in sequences in the region connecting these two motifs. In human PAS kinase, this region has been shown to be very flexible, and adopts di…
