label: Animal helix-turn-helix domain
definition: >-
  This predicted helix-turn-helix (HTH) domain is found in a group of uncharacterised proteins mainly found in animals. Many members of this family are annotated as reverse transcriptases, some of them also harbouring InterPro:IPR000477.
