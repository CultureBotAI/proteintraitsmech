identifier: Pfam:PF00211
label: Adenylate and Guanylate cyclase catalytic domain
definition: >-
  Guanylate cyclases (EC:4.6.1.2) catalyse the formation of cyclic GMP (cGMP) from GTP. cGMP acts as an intracellular messenger, activating cGMP-dependent kinases and regulating cGMP-sensitive ion channels. The role of cGMP as a second messenger in vascular smooth muscle relaxation and retinal photo-transduction is well established. Guanylate cyclase is found both in the soluble and particulate fractions of eukaryotic cells. The soluble and plasma membrane-bound forms differ in structure, regulation and other properties. Most currently known plasma membrane-bound forms are receptors for small polypeptides. The soluble forms of guanylate cyclase are cytoplasmic heterodimers having alpha and beta subunits. This domain is also found in bacterial pyrimidine cyclases, which synthesize cyclic nucleotides in response to bacteriophage infection, providing immunity. These cyclic nucleotides serve as specific second messenger signals that activate the adjacent effector, leading to bacterial cell death and abortive phage infection. In all characterised eukaryote guanylyl- and adenylyl cyclases, cyclic nucleotide synthesis is carried out by the conserved class III cyclase domain.
