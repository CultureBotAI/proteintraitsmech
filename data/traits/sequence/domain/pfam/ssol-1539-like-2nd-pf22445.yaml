identifier: Pfam:PF22445
label: Ssol_1539-like, second domain
definition: >-
  This domain is found in Ssol_1539 UniProtKB:D0KSP7 from Saccharolobus solfataricus and similar archaeal sequences. Ssol_1539 is organised into two domains PDB:5K5A. The N-terminal domain contains two subdomains separated by a central helix. This entry represents the second subdomain, which shows an all-α configuration.
