identifier: Pfam:PF28290
label: SCO0607-like
definition: >-
  This entry represents the homologues of SCO0607 lipoprotein. The lipoprotein SCO0607 of Streptomyces coelicolor (UniProtKB:A0AB39MQ17), along with a number of morphogenic membrane proteins, is regulated by the response regulator transcription factor MarR (SCO2120) UniProtKB:Q9S2M4. Related lipoproteins are found in a large number of Streptomyces species.
