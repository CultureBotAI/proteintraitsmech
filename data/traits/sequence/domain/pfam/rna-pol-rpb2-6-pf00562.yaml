identifier: Pfam:PF00562
label: RNA polymerase Rpb2, domain 6
definition: >-
  RNA polymerases (EC:2.7.7.6) catalyse the DNA dependent polymerisation of RNA. Prokaryotes contain a single RNA polymerase compared to three in eukaryotes (not including mitochondrial and chloroplast polymerases). This domain represents the hybrid-binding domain and the wall domain. The hybrid-binding domain binds the nascent RNA strand/template DNA strand in the Pol II transcription elongation complex. This domain contains the important structural motifs, switch 3 and the flap loop and binds an active site metal ion. This domain is also involved in binding to Rpb1 and Rpb3. Many of the bacterial members contain large insertions within this domain, which are known as dispensable region 2 (DRII).
