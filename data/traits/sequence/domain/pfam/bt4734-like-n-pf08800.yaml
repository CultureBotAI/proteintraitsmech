identifier: Pfam:PF08800
label: BT4734-like, N-terminal domain
definition: >-
  This domain is found mainly in bacteroidetes. In some instances, it is at the N-terminal of InterPro:IPR007936, such as in the product of BT4734 UniProtKB:Q89YJ7, which is incorrectly named Virulence protein E. The function of the domain is unknown.
