identifier: Pfam:PF24162
label: Protein root UVB sensitive 6, N-terminal
definition: >-
  This domain is found at the N-terminal of Protein root UVB sensitive 6 from Arabidopsis thaliana (RUS6) and similar sequences from plants. RUS6 is required for normal embryo development. This domain is normally found associated with InterPro:IPR054549 and InterPro:IPR055412.
