identifier: proteintraitsmech:TRANSIT_PEPTIDE_HYDROGENOSOME_MITOSOME
label: "hydrogenosomal / mitosomal N-terminal transit presequence"
definition: >-
  A short cleavable N-terminal transit presequence (typically 5-25 residues, enriched in sub-terminal arginine/lysine residues proximal to the cleavage site) on nuclear-encoded proteins of anaerobic protists that directs import across the double membrane of mitochondrion-related organelles — hydrogenosomes (GO:0042566) and mitosomes (GO:0032047) — and is proteolytically removed in the organellar lumen by hydrogenosomal or mitosomal processing peptidase (HPP / GPP).
