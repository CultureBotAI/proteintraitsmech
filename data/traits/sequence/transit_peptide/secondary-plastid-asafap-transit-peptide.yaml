identifier: proteintraitsmech:TRANSIT_PEPTIDE_SECONDARY_PLASTID_ASAFAP
label: "secondary plastid bipartite ASAFAP transit peptide"
definition: >-
  A bipartite N-terminal targeting presequence of secondary-endosymbiotic complex plastids (diatoms, cryptophytes, haptophytes, and peridinin-lacking chromalveolates) comprising an anterior endoplasmic-reticulum signal peptide followed immediately at the signal-peptidase cleavage junction by a conserved aromatic-rich ASAFAP motif (canonical consensus A-S-A-F/W/Y-A-P with an invariant +1 aromatic residue) and a hydrophilic stroma transit peptide that mediates translocation across four envelope membranes via the symbiont-specific ERAD-like machinery (SELMA) and TOC/TIC.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_TRANSIT_PEPTIDE
term_kind: CLASS
mapping_status: SEEDED
parent_traits:
