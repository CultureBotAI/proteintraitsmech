identifier: proteintraitsmech:TRANSIT_PEPTIDE_CHLOROPLAST_STROMA
label: "chloroplast stroma transit peptide (cTP)"
definition: >-
  Cleavable N-terminal plastid-targeting sequence enriched in serine/threonine residues and lacking acidic residues, directing nuclear-encoded precursor proteins through the TOC/TIC translocons into the chloroplast stroma where SPP cleaves it.
