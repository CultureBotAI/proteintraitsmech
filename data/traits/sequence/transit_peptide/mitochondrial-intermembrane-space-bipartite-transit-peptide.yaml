identifier: proteintraitsmech:TRANSIT_PEPTIDE_MITO_IMS
label: "mitochondrial intermembrane-space bipartite transit peptide"
definition: >-
  A cleavable bipartite N-terminal mitochondrial transit peptide composed of an N-terminal positively charged matrix-targeting presequence (cleaved in the matrix by mitochondrial processing peptidase, MPP) followed immediately by a hydrophobic stop-transfer sorting signal that arrests translocation in the TIM23 channel and is cleaved on the intermembrane-space side of the inner membrane by the inner membrane peptidase complex (Imp1p/Imp2p, IMP) to release the soluble protein into the mitochondrial intermembrane space (GO:0005758).
