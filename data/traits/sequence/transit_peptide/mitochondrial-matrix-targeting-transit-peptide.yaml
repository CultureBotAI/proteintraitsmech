    synonym_type: EXACT_SYNONYM
  - synonym_text: "mitochondrial presequence"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "mitochondrial matrix targeting signal"
    synonym_type: EXACT_SYNONYM
xrefs:
