detection_methods:
  - name: "TargetP 2.0 mitochondrial / chloroplast / thylakoid transit peptide predictor"
    method_type: ML_PREDICTOR
    edam_operation: EDAM:operation_2489
    tool: "biotools:targetp"
    evidence_code: ECO:0000255
    reference: PMID:41809595
    recipe: "targetp -fasta {input} -org pl -format short -prefix {output}"
causal_graphs:
  - graph_id: mtp_tom_tim23_import_mpp_cleavage
    title: "TOM/TIM23 mitochondrial matrix import and MPP presequence cleavage"
    description: "An N-terminal mitochondrial_targeting_signal (SO:0001808) participates in protein import into mitochondrial matrix (GO:0030150) across the TOM and TIM23 translocons, causally upstream of mitochondrial processing peptidase endopeptidase activity (GO:0004175) with target end location in the mitochondrial matrix (GO:0005759)."
    nodes:
      - node_id: "SO:0001808"
        label: mitochondrial_targeting_signal
        node_type: MOTIF
        grounding: "SO:0001808"
        description: "Amphipathic positively charged N-terminal mitochondrial presequence (mTP)."
      - node_id: "GO:0030150"
        label: "protein import into mitochondrial matrix"
        node_type: BIOLOGICAL_PROCESS
        grounding: "GO:0030150"
        description: "TOM/TIM23-mediated translocation of nuclear-encoded precursor proteins."
      - node_id: "GO:0004175"
        label: "endopeptidase activity"
        node_type: MOLECULAR_FUNCTION
        grounding: "GO:0004175"
        description: "Heterodimeric MPP metallopeptidase (EC:3.4.24.64) excising the N-terminal mTP."
      - node_id: "GO:0005759"
        label: "mitochondrial matrix"
        node_type: CELLULAR_LOCALIZATION
        grounding: "GO:0005759"
        description: "Destination mitochondrial matrix compartment of the cleaved mature protein."
    edges:
      - subject: "SO:0001808"
        predicate: "participates in"
        predicate_id: RO:0000056
        object: "GO:0030150"
        description: "The amphipathic N-terminal presequence is recognized by Tom20 to initiate matrix import."
        evidence:
          - reference: PMID:36173160
            snippet: "The 20-kDa TOM (translocase of outer mitochondrial membrane) subunit, Tom20, is the first receptor of the protein import pathway into mitochondria. Tom20 recognizes the mitochondrial targeting signal embedded in the presequences attached to mature mitochondrial proteins, as an N-terminal extension."
            notes: "mTP recognition by Tom20 for mitochondrial matrix import (PMID:36173160). (ECO:0000269)"
      - subject: "GO:0030150"
        predicate: "causally upstream of"
        predicate_id: RO:0002411
        object: "GO:0004175"
        description: "Translocation into the matrix exposes the presequence attached to mature mitochondrial proteins for cleavage."
        evidence:
          - reference: PMID:36173160
            snippet: "Tom20 recognizes the mitochondrial targeting signal embedded in the presequences attached to mature mitochondrial proteins, as an N-terminal extension. Consequently, ~1,000 different mitochondrial proteins are sorted into the mitochondrial matrix, and distinguished from non-mitochondrial proteins."
            notes: "Presequence processing upon mitochondrial matrix import (PMID:36173160). (ECO:0000269)"
      - subject: "GO:0030150"
        predicate: "has target end location"
        predicate_id: RO:0002339
        object: "GO:0005759"
        description: "Mitochondrial matrix import delivers sorted proteins into the mitochondrial matrix."
        evidence:
          - reference: PMID:36173160
            snippet: "Consequently, ~1,000 different mitochondrial proteins are sorted into the mitochondrial matrix, and distinguished from non-mitochondrial proteins."
            notes: "Target end location in the mitochondrial matrix (PMID:36173160). (ECO:0000269)"
evidence:
  - reference: PMID:36173160
    notes: "Tom20 recognizes the mitochondrial targeting signal in N-terminal presequences to sort proteins into the mitochondrial matrix."
