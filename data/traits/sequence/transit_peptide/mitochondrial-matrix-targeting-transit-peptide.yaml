identifier: proteintraitsmech:TRANSIT_PEPTIDE_MITOCHONDRIAL
label: "mitochondrial targeting transit peptide (mTP)"
definition: >-
  Cleavable N-terminal presequence enriched in positively charged, hydroxylated, and hydrophobic residues (forming an amphipathic alpha-helix devoid of acidic residues) recognized by TOM20/TOM22 and cleaved by mitochondrial processing peptidase (MPP).
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
trait_axis: SEQUENCE
trait_category: SEQ_TRANSIT_PEPTIDE
term_kind: CLASS
mapping_status: SEEDED
