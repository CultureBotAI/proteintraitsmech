identifier: proteintraitsmech:UNIPROT_FT_SEQ_TRANSIT_PEPTIDE
label: transit peptide
definition: >-
  An N-terminal organelle-targeting transit peptide (mitochondrial matrix presequence, chloroplast stromal/thylakoid transit peptide, hydrogenosomal/mitosomal presequence, or apicoplast bipartite leader) that directs post-translational import into a membrane-bounded organelle and is proteolytically cleaved after translocation.
definition_source: UniProtKB feature type
trait_axis: SEQUENCE
trait_category: SEQ_TRANSIT_PEPTIDE
term_kind: CLASS
mapping_status: SEEDED
