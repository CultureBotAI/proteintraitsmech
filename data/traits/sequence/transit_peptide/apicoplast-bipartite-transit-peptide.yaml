identifier: proteintraitsmech:TRANSIT_PEPTIDE_APICOPLAST
label: "apicoplast bipartite transit peptide"
definition: >-
  A cleavable bipartite N-terminal leader sequence in apicomplexan parasites (such as Plasmodium and Toxoplasma) consisting of an N-terminal hydrophobic secretory signal peptide that mediates co-translational entry into the endoplasmic reticulum followed by a net-positively charged plant-like plastid transit peptide that directs subsequent transport across the four surrounding membranes into the apicoplast stroma (GO:0020011), with both segments removed stepwise during import.
definition_source: "ProteinTraitsMech curated protein-trait taxonomy"
