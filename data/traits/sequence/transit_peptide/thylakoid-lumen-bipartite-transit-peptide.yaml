identifier: proteintraitsmech:TRANSIT_PEPTIDE_THYLAKOID_LUMEN
label: "thylakoid lumen bipartite transit peptide (luTP)"
definition: >-
  Bipartite N-terminal plastid transit peptide consisting of an N-terminal stromal import domain (cTP) followed by a Sec- or Tat-type thylakoid transfer peptide cleaved by thylakoidal processing peptidase (TPP) in the thylakoid lumen.
