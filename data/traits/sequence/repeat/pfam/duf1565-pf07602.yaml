identifier: Pfam:PF07602
label: Protein of unknown function (DUF1565)
definition: >-
  These proteins share a region of homology in their N termini, and are found in several phylogenetically diverse bacteria and in some species of archaea from Methanobacteriales order. Some of these proteins also contain characterised domains such as InterPro:IPR001119 (e.g. UniProtKB:Q8YWJ6) and InterPro:IPR005084 (e.g. UniProtKB:Q9FBS2).
