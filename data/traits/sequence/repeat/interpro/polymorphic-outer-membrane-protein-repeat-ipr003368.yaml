identifier: InterPro:IPR003368
label: "Polymorphic outer membrane protein repeat"
definition: >-
  This repeat is found in several Chlamydia polymorphic membrane proteins. Chlamydia pneumoniae (Chlamydophila pneumoniae) is an obligate intracellular bacterium and a common human pathogen causing infection of the upper and lower respiratory tract. Proteins in this entry consist of there repeats at the N-terminal which may adopt a β-helical structure, a middle domain (InterPro:IPR011427) and a C-terminal domain InterPro:IPR005546.
