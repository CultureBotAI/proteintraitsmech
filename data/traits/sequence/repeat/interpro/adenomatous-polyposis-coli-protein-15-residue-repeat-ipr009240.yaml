identifier: InterPro:IPR009240
label: Adenomatous polyposis coli protein, 15 residue repeat
definition: >-
  The 15 aa repeat is found in the APC protein family. It is involved in binding beta-catenin along with the InterPro:IPR009223 repeats. Many human cancer mutations map to the region around these motifs, and may be involved in disrupting their binding of beta-catenin.
