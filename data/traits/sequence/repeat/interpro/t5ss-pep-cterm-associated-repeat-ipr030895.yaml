identifier: InterPro:IPR030895
label: "T5SS/PEP-CTERM-associated repeat"
definition: >-
  This entry describes a repeat about 50 amino acids in length. Most proteins with this repeat have a C-terminal autotransporter domain (InterPro:IPR006315) and/or an N-terminal type V secretion system signal peptide (InterPro:IPR024973), while others instead have a C-terminal PEP-CTERM domain (InterPro:IPR013424).
