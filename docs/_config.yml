title: ProteinTraitsMech
description: Knowledge base of protein sequence and structure traits — one YAML per trait, LinkML-validated, evidence-backed.
# No remote theme: docs/_layouts/default.html is the site's own shell, so the
# Markdown pages render in the same teal/amber identity as the hand-built
# landing and map instead of Cayman's green->blue (issue #5).
show_downloads: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

# Exclude the vendored raw data + non-docs directories from Jekyll's build.
# (Pages only builds from /docs anyway, but this keeps the safe list explicit.)
exclude:
  - data/raw/
  - "*.tsv"
  - "*.tsv.gz"
  - "*.dat"

include:
  - theme-toggle.js
  - schema.md
  - example.md
  - browse.html
  - browse.css
  - browse.js
  - data
