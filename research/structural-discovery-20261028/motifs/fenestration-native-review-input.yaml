limitations:
- CAVER is a documented alternative candidate generator. No detector was executed, publication analysis
  replayed, membrane frame assigned, or local residue boundary qualified.
- The published main-text description of SI FigureS1D was inspected; this review does not claim independent
  image-level analysis of that supplemental panel.
- The 7WLI archive is only partially modeled and includes lipids/calcium. Apo is relative to the investigated
  inhibitors; representation does not assert a fully modeled or ligand-free channel.
- A geometric class does not establish permeability, ligand access, selectivity or allostery across its
  members.
- Qualified examples remain zero; REVIEWED human status and occurrence qualification are not conferred
  by this review.
- Corpus collision/remote-work checks and writer implementation are coordinator-owned. This review identifies
  maintained owners but does not independently certify those whole-workflow gates.
- Raw primary snapshots and historical downloads may remain ignored local evidence; source URLs and hashes
  are preserved. The PDF originally came from /tmp/nalcn-fenestration.pdf and is retained unchanged with
  provenance. Portable reproduction may require reacquisition and explicit byte/version checking.
- Publisher HTML worked through the browser tool but direct retention returned403. Scientific inspection
  used the publisher text plus the same published CC-BY4 PDF; the failed retrieval is preserved in fenestration-source-retrieval.json.
