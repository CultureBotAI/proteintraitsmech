identifier: proteintraitsmech:ALLOSTERIC_SUBUNIT_INTERFACE_SITE
label: "subunit-interface allosteric site"
definition: >-
  An allosteric regulatory site formed at an interface between protein subunits, whose engagement
  changes activity or affinity at a distinct functional site through coupling within the oligomer.
definition_source: PMID:31665428
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: PROPOSED
parent_traits:
  - proteintraitsmech:ALLOSTERIC_REGULATORY_SITE
  - proteintraitsmech:INTERFACE
synonyms:
  - synonym_text: "inter-subunit allosteric pocket"
    synonym_type: EXACT_SYNONYM
  - synonym_text: "quaternary interface allosteric site"
    synonym_type: EXACT_SYNONYM
detection_methods:
- name: fpocket candidate surface-pocket detection (allosteric function requires independent evidence)
  method_type: STRUCTURAL_ALGORITHM
  tool: biotools:fpocket
  reference: PMID:19486540
  recipe: fpocket -f {input}
  edam_operation: EDAM:operation_2575
  evidence_code: ECO:0007669

evidence:
- reference: PMID:42628823
  notes: Interface-localized pockets across oligomeric enzyme ensembles serve as candidate regulatory
    regions for allosteric modulation.
- reference: PMID:42539251
  notes: The FraB preprint studies substrate half-site reactivity in a dimer. It is context for intersubunit
    coupling, not evidence for the generic effector-binding interface mechanism.
- reference: PMID:19486540
  notes: Candidate pocket geometry is computational evidence; allosteric coupling requires independent
    support.
- reference: PMID:31665428
  notes: The ASD resource provides context for modulation at a site distinct from the orthosteric site;
    it does not impose one conformational or kinetic model.
