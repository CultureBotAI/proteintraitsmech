identifier: proteintraitsmech:CATALYTIC_RESIDUE
label: catalytic residue
definition: >-
  An amino acid residue that contributes directly to an enzyme reaction mechanism or provides an
  essential indirect catalytic role, such as controlling catalytic-group reactivity,
  stereochemistry, transition-state stabilization or a catalytic metal environment.
definition_source: PMID:29106569
trait_axis: STRUCTURE
trait_category: STRUCT_ACTIVE_SITE
term_kind: CLASS
mapping_status: PROPOSED
xrefs:
- SO:0001104

evidence:
- reference: PMID:12421562
  notes: Bartlett et al. (2002) define the criteria and functional roles of amino acid residues directly
    involved in catalysis across 178 enzyme active sites.
- reference: PMID:29106569
  notes: Ribeiro et al. (2018) describe the Mechanism and Catalytic Site Atlas (M-CSA) cataloguing catalytic
    residues and enzyme reaction mechanisms.
- reference: https://linkml.io/valuesets/elements/LocalStructuralFeature/
  notes: Source enum member retained as provenance, not an equivalent identifier.
- reference: https://www.ebi.ac.uk/thornton-srv/m-csa/documentation/
  notes: Catalytic annotation includes direct and essential indirect roles; homology-based annotation
    is kept separate from experimental mechanism evidence.
