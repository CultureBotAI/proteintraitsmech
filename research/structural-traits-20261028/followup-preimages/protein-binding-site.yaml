identifier: proteintraitsmech:PROTEIN_BINDING_SITE
label: protein binding site
definition: >-
  A contiguous or discontinuous set of residues in a protein that forms a selective noncovalent
  binding site for a polypeptide partner.
definition_source: SO:0000410
trait_axis: STRUCTURE
trait_category: STRUCT_BINDING_SITE
term_kind: CLASS
mapping_status: PROPOSED
xrefs:
- SO:0000410

evidence:
- reference: PMID:24081580
  notes: Mosca et al. (2014) characterize domain-based and motif-based protein-protein binding sites
    and interaction topologies across high-resolution 3D structures in 3did.
- reference: https://linkml.io/valuesets/elements/LocalStructuralFeature/
  notes: Source enum member retained as provenance, not an equivalent identifier.
- reference: https://raw.githubusercontent.com/The-Sequence-Ontology/SO-Ontologies/master/so-edit.obo
  notes: The native SO release2026-08-07 marks SO0001091 obsolete; its generic chemical-group binding
    meaning is broader than this protein-partner site.
- reference: PMID:17681537
  notes: PISA infers assemblies and interfaces from structural data; its predictions require biological-context
    review.
- reference: https://www.ccp4.ac.uk/html/pisa.html
  notes: Author CLI documentation specifies the session identifier, configuration file and XML export
    command used here. An installed, configured PISA is a prerequisite; the command was not executed
    in this curation.
- reference: PMID:9020082
  notes: The Bcl-xL/Bak peptide complex and interaction-disrupting variants support a representative
    protein-binding interface. This does not establish a universal oligomerization mechanism.
