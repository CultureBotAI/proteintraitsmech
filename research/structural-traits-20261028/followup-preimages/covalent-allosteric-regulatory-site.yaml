  description: Specific-study mechanism from Ostrem et al. (2013), PMID:24256730, for the tested KRAS(G12C)
    mutant/inhibitors. Cysteine-dependent capture alters switch regions and observed nucleotide/Raf
    binding. This is an example associated with the class, not a universal mechanism or qualified protein
    occurrence.
  nodes:
