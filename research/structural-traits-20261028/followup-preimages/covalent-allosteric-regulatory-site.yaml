      snippet: rely on the mutant cysteine for binding
      notes: Source abstract; Cys12 in paper numbering, no UniProt coordinate assertion. (ECO:0000269)
  - subject: GO:0036094
    predicate: causally upstream of
    predicate_id: RO:0002411
    object: kras_g12c_altered_binding_state
    description: Inhibitor binding changes KRAS(G12C) nucleotide preference and impairs its Raf interaction.
    evidence:
    - reference: PMID:24256730
      snippet: impairing binding to Raf
      notes: Source abstract also reports preference for GDP over GTP; claim is scoped to tested KRAS(G12C)
        inhibitors. (ECO:0000269)
evidence:
- reference: PMID:24256730
  notes: Small molecules that irreversibly bind to a reactive cysteine in the K-Ras(G12C) switch-II
    allosteric pocket subvert nucleotide preference and impair effector interactions.
- reference: PMID:19486540
  notes: Candidate pocket geometry is computational evidence; allosteric coupling requires independent
    support.
- reference: PMID:31665428
  notes: The ASD resource provides context for modulation at a site distinct from the orthosteric site;
    it does not impose one conformational or kinetic model.
discussions:
- discussion_id: STRUCTURE_20261028_ALLOSTERIC_COVALENT_REGULATORY_SITE_DETECTION
  prompt: Pocket detection does not establish residue reactivity, covalent attachment or allosteric
    function. Verify the adduct/site and a coupled functional effect; the cited KRAS study is specific
    to mutant G12C.
