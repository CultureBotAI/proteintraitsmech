  synonym_type: NARROW_SYNONYM
- synonym_text: cysteine-reactive allosteric site
  synonym_type: NARROW_SYNONYM
- synonym_text: electrophile-modified allosteric regulatory site
  synonym_type: RELATED_SYNONYM
