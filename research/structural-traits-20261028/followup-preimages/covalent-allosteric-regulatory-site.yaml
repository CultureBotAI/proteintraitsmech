  - node_id: GO:0036094
    label: small molecule binding
    node_type: MOLECULAR_FUNCTION
    grounding: GO:0036094
    description: Covalent inhibitor binding in the KRAS(G12C) switch-II pocket in the cited study.
  - node_id: kras_g12c_altered_binding_state
    label: Altered nucleotide preference and Raf binding in KRAS(G12C)
    node_type: STATE
