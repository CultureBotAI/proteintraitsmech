identifier: proteintraitsmech:ALLOSTERIC_COVALENT_REGULATORY_SITE
label: "covalent allosteric regulatory site"
definition: >-
  An allosteric regulatory site at which covalent attachment of an effector to a protein residue
  changes activity or affinity at a distinct functional site.
definition_source: PMID:24256730
trait_axis: STRUCTURE
trait_category: STRUCT_ALLOSTERIC_SITE
term_kind: CLASS
mapping_status: PROPOSED
