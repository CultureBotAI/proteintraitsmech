  description: 'CDD:cd21551 states ''The PRC2 complex methylates Lys-9 (H3K9) and Lys-27 (H3K27) of histone H3'', whereas canonical PRC2 (EZH1/EZH2 stimulated by the SUZ12 VEFS box) catalyzes H3K27me1/2/3 and reported H3K9me3 reductions upon SUZ12 loss reflect indirect cross-talk rather than intrinsic PRC2 H3K9 methyltransferase activity. Blocked candidate: ug-44aa2243f55dd0bb095beac3f1d82993fc80a2db2cb5e276dcde11e61a26c8bb (Q15022, 563-684).'
