- finding_id: F7
  issue_key: cdd-cd16523-mylip-proteasomal-vs-lysosomal-ldlr-degradation
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd16523 (RING-HC_MYLIP) sentence 2 claims proteasomal degradation of LDLR, VLDLR, and LRP8, contradicting sentence 4 (lysosomal degradation)
  description: 'In CDD:cd16523, sentence 2 claims that MYLIP/IDOL mediates ''ubiquitination and subsequent proteasomal degradation of myosin regulatory light chain (MRLC), low density lipoprotein receptor (LDLR), very low-density lipoprotein receptor (VLDLR) and low density lipoprotein receptor-related protein 8 (LRP8)'', contradicting sentence 4 (''triggers the ubiquitination and degradation of LDLR in lysosomes'') and primary literature (PMID:20884618, PMID:23225852) showing ESCRT/MVB-dependent lysosomal degradation of lipoprotein receptors. Blocked candidate: ug-75a40219c6b45df1ff1c607cf4d9a3e5e07de73f79ba1367231206244ab507c9 (Q8WY64, 383-434).'
