- finding_id: F5
  issue_key: cdd-cd14999-uts2r-hypocretin-receptor-misaliasing
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd14999 erroneously aliases urotensin-II receptor (UTS2R/GPR14) as the hypocretin receptor
  description: CDD:cd14999 (7tmA_UII-R) states 'The urotensin-II receptor (also known as G-protein coupled receptor 14, GPR14, or the hypocretin receptor) is a receptor for the cyclic undecapeptide urotensin-II'. Hypocretin/orexin receptors (HCRTR1/HCRTR2) are distinct GPCRs; UTS2R/GPR14 is not the hypocretin receptor. This misaliasing blocked Stage 3 promotion of human UTS2R candidate ug-4ca0bc07c3ff11d11874a90b7bcbb2b3c258f9ecae390a173ba6162ff34f887d (Q9UKP6, 53-337).
