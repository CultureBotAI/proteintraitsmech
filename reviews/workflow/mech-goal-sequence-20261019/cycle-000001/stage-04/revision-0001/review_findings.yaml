- finding_id: F3
  issue_key: cdd-cd09530-samd14-vs-samd15-nomenclature-conflict
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd09530 names Samd14 in label/definition whereas its human carrier is SAMD15 (Q9P1V8) and human SAMD14 (Q8IZD0) matches CDD:cd09512
  description: CDD:cd09530 (short_name SAM_Samd14) defines the domain as 'SAM domain of Samd14 (sterile alpha motif domain-containing protein 14) and similar proteins', without noting that human SAMD14 (UniProtKB:Q8IZD0) is classified under sibling CDD:cd09512 (SAM_Neurabin-like) while the actual human protein matched by CDD:cd09530 in InterPro/CDD is SAMD15/FAM15A (UniProtKB:Q9P1V8, residues 543-609). This nomenclature conflict blocked Stage 3 promotion of candidate ug-261dc8be43fe67ef5a89ce9ecdbdd8107e3ab08802277a3f574bf5c5f9b8c78b.
  target_ids:
