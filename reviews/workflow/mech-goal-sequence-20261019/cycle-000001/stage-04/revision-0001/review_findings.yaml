  issue_key: cdd-cd15894-snap25-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd15894 (SNARE_SNAP25N) asserts that Qb/Qc SNAREs have a transmembrane domain whereas SNAP25 is membrane-anchored via palmitoylated cysteines
  description: CDD:cd15894 states 'Both, Qb/Qc SNAREs consist of 2 coiled-coil helices (which form a single SNARE domain) and a transmembrane domain'. SNAP25 (human P60880, 19-81) is a t-SNARE containing an N-terminal Qb SNARE motif (cd15894) and a C-terminal Qc SNARE motif (sibling cd15885) linked by a palmitoylated cysteine-rich region and lacks any transmembrane domain. This overclaim blocked Stage 3 promotion of candidate ug-e252e4d82e1d26e10002d5abaa0877a146c31f0fd970400dc106954f6c8a85e7.
