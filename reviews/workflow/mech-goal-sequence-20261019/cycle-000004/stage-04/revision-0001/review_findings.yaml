- finding_id: F21
  issue_key: cdd-cd15884-snap23c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: resolved
  certainty: confirmed
  title: CDD:cd15884 (SNARE_SNAP23C) asserts that Qb/Qc SNAREs have a transmembrane
    domain whereas SNAP23 is membrane-anchored via palmitoylated cysteines
  description: CDD:cd15884 (label=SNARE_SNAP23C, parent_traits=[CDD:cl22856]) models
    the C-terminal Qc SNARE motif of SNAP23 (Homo sapiens UniProtKB:O00161 and Mus
    musculus UniProtKB:O09044), but its upstream CDD definition stated 'Qb/Qc SNAREs
    consist of 2 coiled-coil helices ... and a transmembrane domain.' SNAP23- and
    SNAP25-family Qb/Qc SNAREs lack a transmembrane domain and attach to membranes
    via palmitoylated cysteines in their central inter-motif linker (PMID:9759094,
    PMID:9159129).
