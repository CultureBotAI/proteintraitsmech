- finding_id: F29
  issue_key: cdd-cd15856-snap29c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd15856 (SNARE_SNAP29C) asserts that Qb/Qc SNAREs have a transmembrane
    domain whereas SNAP29 lacks both a transmembrane domain and palmitoylated membrane-anchoring
    cysteines
  description: CDD:cd15856 (label=SNARE_SNAP29C, parent_traits=[CDD:cl22856], SEEDED,
    unpromoted seed examples Homo sapiens SNAP29 UniProtKB:O95721, Mus musculus Snap29
    UniProtKB:Q9ERB0, and Caenorhabditis elegans SNAP29 UniProtKB:P83351) models the C-terminal
    Qc SNARE motif of SNAP29 (sibling of N-terminal Qb SNARE motif CDD:cd15887 SNARE_SNAP29N),
    but its upstream CDD definition states 'Qb/Qc SNAREs consist of 2 coiled-coil
    helices (called SNARE motifs, one belonging to the Qb subgroup and one belonging
    to the Qc subgroup), which mediate the interactions with other SNARE proteins,
    and a transmembrane domain.' In fact, Qb/Qc SNAP-25 family SNAREs lack a transmembrane
    domain, and unlike SNAP25 and SNAP23, SNAP29 (UniProtKB:O95721) also lacks the
    central cluster of palmitoylated cysteines and associates with membranes through
    protein-protein interactions with syntaxins and Rab GTPases (PMID:9736707, PMID:9759094).
