- finding_id: F27
  issue_key: cdd-cd15855-snap25c-23c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd15855 (SNARE_SNAP25C_23C) asserts that Qb/Qc SNAREs have a transmembrane
    domain whereas SNAP25 and SNAP23 are membrane-anchored via palmitoylated cysteines
  description: CDD:cd15855 (label=SNARE_SNAP25C_23C, parent_traits=[CDD:cl22856],
    SEEDED, 0 canonical_examples) models the combined C-terminal Qc SNARE motif subfamily
    profile of SNAP25 and SNAP23 (parent of paralog-specific profiles CDD:cd15885
    SNARE_SNAP25C and CDD:cd15884 SNARE_SNAP23C), but its upstream CDD definition
    states 'Qb/Qc SNAREs consist of 2 coiled-coil helices (called SNARE motifs, one
    belonging to the Qb subgroup and one belonging to the Qc subgroup), which mediate
    the interactions with other SNARE proteins, and a transmembrane domain.' In fact,
    Qb/Qc SNAP-25 family SNAREs lack a transmembrane domain; SNAP25 and SNAP23 attach
    to membranes via palmitoylated cysteine residues in the central linker between
    their N-terminal Qb and C-terminal Qc SNARE motifs (PMID:9759094, PMID:9159129).
  target_ids:
  - CDD:cd15855
  field_paths:
