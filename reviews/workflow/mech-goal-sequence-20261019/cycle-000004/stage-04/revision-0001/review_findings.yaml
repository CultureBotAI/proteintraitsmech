  issue_key: cdd-cd17071-dcx1-dcdc2-like-typo-and-ubiquitin-modifier-digression
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: CDD:cd17071 (DCX1_DCDC2_like) misspells Doublecortin-like as Dublecortin-like
    in definition and interpolates an off-target ubiquitin protein-modifier sentence
  description: CDD:cd17071 (label=DCX1_DCDC2_like, parent_traits=[CDD:cl28922], SEEDED,
    0 canonical_examples) models the N-terminal first doublecortin-like domain (DCX1)
    subfamily profile of doublecortin domain-containing protein 2 (DCDC2) and similar
    proteins (parent of paralog-specific profiles CDD:cd17149 DCX1_DCDC2, CDD:cd17150
    DCX1_DCDC2B, and CDD:cd17151 DCX1_DCDC2C), but its definition begins with the
    typo 'Dublecortin-like domain 1 found in doublecortin domain-containing protein
    2 (DCDC2) and similar proteins.', interpolates the off-target sentence 'Ubiquitin
    (Ub) is a protein modifier in eukaryotes that is involved in various cellular
    processes, including transcriptional regulation, cell cycle control, and DNA repair.'
    even though DCX domains only share a ubiquitin-like beta-grasp fold and do not
    act as ubiquitin protein modifiers, and lacks a literature evidence block citing
    PMID:16278295.
