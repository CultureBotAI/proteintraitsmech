- finding_id: F19
  issue_key: cdd-cd17152-dcdc2-rpt2-ubiquitin-modifier-digression
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: CDD:cd17152 (DCX2_DCDC2) interpolates an off-target ubiquitin protein-modifier definition sentence
    into a microtubule-binding DCX repeat profile
  description: CDD:cd17152 (label=DCX2_DCDC2, parent_traits=[CDD:cl28922]) models the C-terminal second
    doublecortin-like domain (DCX2) of DCDC2 (unpromoted seed examples Homo sapiens UniProtKB:Q9UHG0 and
    Mus musculus UniProtKB:Q5DU00), a microtubule-associated protein with tandem ubiquitin-like beta-grasp
    DCX repeats associated with human reading disability/dyslexia (PMID:16278295). However, its upstream
    CDD definition interpolates the off-target sentence 'Ubiquitin (Ub) is a protein modifier in eukaryotes
    that is involved in various cellular processes, including transcriptional regulation, cell cycle control,
    and DNA repair.' even though DCX domains only adopt a ubiquitin-like beta-grasp fold and do not function
    as ubiquitin protein modifiers, and the record lacks an evidence block citing PMID:16278295.
