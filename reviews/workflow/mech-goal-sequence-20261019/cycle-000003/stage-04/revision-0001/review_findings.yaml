- finding_id: F21
  issue_key: cdd-cd15884-snap23c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd15884 (SNARE_SNAP23C) asserts that Qb/Qc SNAREs have a transmembrane domain whereas SNAP23
    is membrane-anchored via palmitoylated cysteines
  description: CDD:cd15884 (label=SNARE_SNAP23C, parent_traits=[CDD:cl22856]) models the C-terminal Qc
    SNARE motif of SNAP23 (unpromoted seed examples Mus musculus UniProtKB:O09044 and Homo sapiens UniProtKB:O00161),
    but its upstream CDD definition states 'Qb/Qc SNAREs consist of 2 coiled-coil helices (called SNARE
    motifs, one belonging to the Qb subgroup and one belonging to the Qc subgroup), which mediate the
    interactions with other SNARE proteins, and a transmembrane domain.' SNAP25/SNAP23-family Qb/Qc t-SNAREs
    lack a transmembrane domain and SNAP23 attaches to membranes via palmitoylated cysteine residues in
    the inter-motif linker between its N-terminal Qb (CDD:cd15895) and C-terminal Qc (CDD:cd15884) SNARE
    motifs (PMID:9159129, PMID:9759094).
