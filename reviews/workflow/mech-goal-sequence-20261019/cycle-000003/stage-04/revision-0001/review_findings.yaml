  description: CDD:cd17153 (label=DCX2_DCDC2B, parent_traits=[CDD:cl28922]) models the C-terminal second
    doublecortin-like domain (DCX2) of DCDC2B (Homo sapiens UniProtKB:A2VCK2, HGNC:33489, carried on N-terminal
    repeat 1 sibling CDD:cd17150), but sentence 2 switches without qualification to paralog DCDC2 ('DCDC2
    is a member of the doublecortin (DCX) family.' and 'DCDC2 genetic variation in humans is associated
    with reading disability, attention deficit hyperactivity disorder (ADHD), and difficulties in mathematics.
    A genetic variant of DCDC2 associates with dyslexia, a common neurobehavioral disorder of reading.')
    without distinguishing DCDC2B from DCDC2 (UniProtKB:Q9UHG0, HGNC:18141, modeled by CDD:cd17149 and
    CDD:cd17152), and lacks a grounded evidence block.
