  issue_key: cdd-cd17149-dcdc2-typo-and-ubiquitin-modifier-digression
  category: consistency
  severity: minor
  status: resolved
  certainty: confirmed
  title: CDD:cd17149 (DCX1_DCDC2) misspells Doublecortin-like as Dublecortin-like in definition and interpolates
    an off-target ubiquitin protein-modifier sentence
  description: CDD:cd17149 (label=DCX1_DCDC2, parent_traits=[CDD:cl28922]) models the N-terminal first
    doublecortin-like domain (DCX1) of human DCDC2 (unpromoted seed example UniProtKB:Q9UHG0, HGNC:18141),
    begins its definition with the typo 'Dublecortin-like domain 1 found in doublecortin domain-containing
    protein 2 (DCDC2).', and interpolates an off-target sentence defining the ubiquitin protein modifier
