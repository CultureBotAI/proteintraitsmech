  title: CDD:cd20535 (CYCLIN_CCNM_CCNQ_rpt2) conflates the second cyclin box of Cyclin-Q/Cyclin-M (CCNQ/FAM58A)
    with the CNNM1-4 (ACDP) magnesium transporter family
  description: CDD:cd20535 (label=CYCLIN_CCNM_CCNQ_rpt2, parent_traits=[CDD:cl40454]) models the C-terminal
    second cyclin box of Cyclin-Q/Cyclin-M (CCNQ/FAM58A; unpromoted seed examples Mus musculus UniProtKB:Q8QZR8
