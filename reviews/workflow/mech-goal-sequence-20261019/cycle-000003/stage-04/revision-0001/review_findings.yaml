- finding_id: F23
  issue_key: cdd-cd18599-mrp5-8-9-d2-abcc-mrp7-cftr-misassignment-and-mdr-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd18599 (ABC_6TM_MRP5_8_9_D2) misassigns MRP7 to ABCC7 (CFTR) instead of ABCC10 and overclaims
    anticancer multidrug-resistance efflux across all MRP1-MRP9 members
  description: CDD:cd18599 (label=ABC_6TM_MRP5_8_9_D2, parent_traits=[CDD:cl38913]) models C-terminal
    TMD2 of MRPs 5, 8, and 9 (unpromoted seed examples Homo sapiens ABCC5 UniProtKB:O15440, Mus musculus
    ABCC5 UniProtKB:Q9R1X5, Homo sapiens ABCC11 UniProtKB:Q96J66, Caenorhabditis elegans mrp-5 UniProtKB:G5EE72,
    Homo sapiens ABCC12 UniProtKB:Q96J65, and Mus musculus ABCC12 UniProtKB:Q80WJ6), but carries the corrupted
    upstream CDD ABCC template text stating 'On the other hand, MRP1, 2, 3, 6 and 7 (ABCC1, 2, 3, 6 and
    7, respectively) have an additional N-terminal five transmembrane segments in a single domain (TMD0)
    connected to the core (TMD-NBD) by a cytoplasmic linker (L0)' and claiming 'The MRP subfamily (ABCC
    subfamily) is composed of 13 members, of which MRP1 to MRP9 are the major transporters that cause
    multidrug resistance in tumor cells by pumping anticancer drugs out of the cell.' In HGNC/UniProt
    nomenclature, ABCC7 is CFTR (an epithelial chloride channel lacking TMD0), whereas MRP7 is ABCC10
    (UniProtKB:Q5T3U5), MRP8 is ABCC11, and MRP9 is ABCC12 (a paralog whose physiological substrates and
    transport activity remain less characterized, PMID:16984901).
  target_ids:
  - CDD:cd18599
  field_paths:
  - data/traits/sequence/domain/cdd/six-transmembrane-helical-domain-2-tmd2-of-multidrug-resistance-associ-cd18599.yaml#/definition
