- finding_id: F18
  issue_key: cdd-cd18593-mrp4-abcc-mrp7-cftr-misassignment-and-mdr-overclaim
  category: consistency
  severity: major
  status: resolved
  certainty: confirmed
  title: CDD:cd18593 (ABC_6TM_MRP4_D1_like) misassigns MRP7 to ABCC7 (CFTR) instead of ABCC10 and overclaims
    anticancer multidrug-resistance efflux across all MRP1-MRP9 members
  description: CDD:cd18593 (label=ABC_6TM_MRP4_D1_like, parent_traits=[CDD:cl38913]) models TMD1 of MRP4/ABCC4
    (unpromoted seed examples Homo sapiens UniProtKB:O15439 and Mus musculus UniProtKB:E9Q236), but carries
    the corrupted upstream CDD ABCC template text stating 'On the other hand, MRP1, 2, 3, 6 and 7 (ABCC1,
    2, 3, 6 and 7, respectively) have an additional N-terminal five transmembrane segments in a single
    domain (TMD0) connected to the core (TMD-NBD) by a cytoplasmic linker (L0)' and claiming 'The MRP
    subfamily (ABCC subfamily) is composed of 13 members, of which MRP1 to MRP9 are the major transporters
    that cause multidrug resistance in tumor cells by pumping anticancer drugs out of the cell.' In HGNC/UniProt
    nomenclature, ABCC7 is CFTR (an epithelial chloride channel lacking TMD0), whereas MRP7 is ABCC10
    (UniProtKB:Q5T3U5), MRP8 is ABCC11, and MRP9 is ABCC12 (a paralog whose physiological substrates and
    transport activity remain less characterized, PMID:16984901).
  target_ids:
