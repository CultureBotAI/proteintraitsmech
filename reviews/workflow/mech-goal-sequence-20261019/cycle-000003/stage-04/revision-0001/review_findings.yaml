- finding_id: F14
  issue_key: cdd-cd15885-snap25c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: resolved
  certainty: confirmed
  title: CDD:cd15885 (SNARE_SNAP25C) asserts that Qb/Qc SNAREs have a transmembrane domain whereas SNAP25
    is membrane-anchored via palmitoylated cysteines
  description: CDD:cd15885 (label=SNARE_SNAP25C, parent_traits=[CDD:cl22856]) models the C-terminal Qc
    SNARE motif of SNAP25 (unpromoted seed examples Mus musculus UniProtKB:P60879, Homo sapiens UniProtKB:P60880,
    and Drosophila melanogaster UniProtKB:P36975), but its upstream CDD definition states 'Qb/Qc SNAREs
    consist of 2 coiled-coil helices (called SNARE motifs, one belonging to the Qb subgroup and one belonging
    to the Qc subgroup), which mediate the interactions with other SNARE proteins, and a transmembrane
    domain.' SNAP25-family Qb/Qc t-SNAREs lack a transmembrane domain and attach to membranes via palmitoylated
    cysteines in the inter-motif linker between the N-terminal Qb (CDD:cd15894) and C-terminal Qc (CDD:cd15885)
    SNARE motifs (PMID:9759094).
