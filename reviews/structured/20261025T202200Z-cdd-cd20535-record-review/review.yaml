- evidence_id: ev-cd20534-sibling
  kind: record_content
  reference: data/traits/sequence/domain/cdd/first-cyclin-box-found-in-cyclin-m-ccnm-family-the-ccnm-family-protein-cd20534.yaml
  locator: id, short_name, definition, canonical_examples, evidence (PMID:23912459)
  accessed_at: '2026-10-25T20:15:00Z'
  snapshot_sha256: 72fbd3487668c097281cf6ee45a4daf0366a2bcc80866330f8ed4832141d7e88
  support: supports
  quote: Cyclin-Q (CCNQ, formerly FAM58A; also termed Cyclin-M) is the activating
    cyclin partner of cyclin-dependent kinase 10 (CDK10), and loss-of-function mutations
    in CCNQ/FAM58A cause X-linked STAR syndrome (toe syndactyly, telecanthus, and
    anogenital and renal malformations). Note that the legacy 'cyclin-M (CCNM)' alias
    used by CDD is distinct from the CNNM1-4 (ancient conserved domain-containing
    protein, ACDP) magnesium transporter family, which contains CBS-pair domains (CDD:cd04590)
    rather than cyclin-box folds.
  summary: First-repeat sibling CDD:cd20534 (CYCLIN_CCNM_CCNQ_rpt1, qualified on human
    Q8N1B3 residues 27-128) was repaired in Cycle 1 Stage 5 (#1171) to disambiguate
    CCNQ/FAM58A from CNNM1-4/ACDP and cite PMID:23912459.
