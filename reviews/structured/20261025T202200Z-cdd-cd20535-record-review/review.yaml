summary: CDD:cd20535 (Second cyclin box found in cyclin-M (CCNM) family; short_name
  CYCLIN_CCNM_CCNQ_rpt2) passes strict LinkML schema validation and represents a valid
  class-level sequence domain trait (SEQ_DOMAIN on SEQUENCE, parent InterPro:IPR006670)
  modeling the C-terminal cyclin-box repeat of Cyclin-Q/Cyclin-M (CCNQ/FAM58A; human
  UniProtKB:Q8N1B3 and mouse UniProtKB:Q8QZR8), the activating cyclin partner of CDK10
  mutated in X-linked STAR syndrome (PMID:23912459). However, its upstream CDD-seeded
  definition and PMID:14695534 citation conflate the CCNM/CCNQ cyclin family with
  the unrelated CNNM1-4 (ancient conserved domain-containing protein, ACDP) CBS-pair
  magnesium transporter family (modeled by CDD:cd04590) and urofacial, hypomagnesemia,
  and Jalili syndromes — the exact upstream nomenclature conflation repaired on first-repeat
  sibling CDD:cd20534 in Cycle 1 Stage 5 (#1171). Preserved as open finding F13 for
  Cycle 2 Stage 5 grouped remediation via scripts/cdd_errata.py and scripts/repair_cdd_errata.py.
