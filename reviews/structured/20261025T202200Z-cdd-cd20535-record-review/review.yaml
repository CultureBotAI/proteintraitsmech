findings:
- finding_id: F13
  issue_key: cdd-cd20535-ccnq-rpt2-cnnm-acdp-magnesium-transporter-conflation
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd20535 (CYCLIN_CCNM_CCNQ_rpt2) conflates the second cyclin box of Cyclin-Q/Cyclin-M
    (CCNQ/FAM58A) with the CNNM1-4 (ACDP) magnesium transporter family
  description: In data/traits/sequence/domain/cdd/second-cyclin-box-found-in-cyclin-m-ccnm-family-the-ccnm-family-protei-cd20535.yaml,
    the domain profile models the C-terminal second cyclin box (CYCLIN_CCNM_CCNQ_rpt2)
    of Cyclin-Q/Cyclin-M (CCNQ/FAM58A; human UniProtKB:Q8N1B3, mouse UniProtKB:Q8QZR8),
    the activating cyclin partner of CDK10 mutated in X-linked STAR syndrome (PMID:23912459).
    However, its upstream CDD definition states 'The CCNM family proteins, also known
    as ancient conserved domain-containing proteins (ACDPs), are involved in magnesium
    homeostasis. Mutations in CCNM1 (also known as ACDP1) are associated with urofacial
    syndrome, while mutations in CCNM2 and CCNM4 are associated with hypomagnesemia
    and Jalili syndrome, respectively' and cites PMID:14695534 (an ACDP paper). CNNM1-4
    (ACDP1-4) are CBS-pair magnesium transporters modeled by CDD:cd04590, not cyclin-box
    proteins. Preserved open in Stage 4 for Stage 5 grouped remediation via scripts/cdd_errata.py
    and scripts/repair_cdd_errata.py.
