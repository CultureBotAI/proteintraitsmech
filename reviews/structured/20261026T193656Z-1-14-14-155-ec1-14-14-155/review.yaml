limitations:
- PMID 26527149 links corrigendum 29652264. The complete indexed correction response
  says a statement was amended but does not identify it; the public DOI landing page
  returned an HTTP 403 challenge, so the actual amendment and its scientific impact
  remain unreviewed.
- Independent biochemical activity evidence is retained, while no residue-level structural
  conclusion is based on the unreviewed amendment.
- The source describes a loose, likely transient reductase association; it does not
  establish an obligatory stable physical complex.
- IUBMB optical-sign wording and current ChEBI preferred/systematic naming differ;
  shared chemical grounding and explicit stereochemical structures are retained.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not described as new downloads.
- Complete bibliography arrays do not imply full article reading. No unselected linked
  paper or ancestor protein assay is claimed as reviewed.
- Legacy CURATOR/ENZYME examples establish source membership rather than release-qualified
  sequence-coordinate evidence.
- The ignored-inclusive searches cover only the declared owned scripts/conf/data/mappings/history
  scope and do not prove global absence of historical approval.
