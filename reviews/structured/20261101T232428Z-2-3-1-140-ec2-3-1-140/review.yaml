limitations:
- One entire selected record is reviewed. Whole local ancestors and mapped neighbors
  are context only.
- Retained authority/RDF captures retain original UTC acquisition times and source
  releases; current live responses are separate.
- Primary papers were read at complete CORE abstract/bibliography scope only. No full
  article, image pixels, sequence, unrelated provider xrefs or new residue mechanism
  is claimed.
- Atom/charge balance and directional database assertions do not establish physiological
  irreversibility or a catalytic intermediate.
- Ignored-inclusive negative searches cover scripts, conf, data/mappings and history
  only; they do not prove global absence of a human decision.
- This review does not supply human sign-off, change status/history, qualify a protein,
  mutate a trait, or authorize publication.
