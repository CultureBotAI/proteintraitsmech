  and declared ChEBI identity/chemical/structure/name fields, were used; other cross-reference/ontology-role
  catalogues and sequence-wide alignments are outside scope.
- The dated 20-entry iModulon catalogue has no selected-provider host match. ROOT
  runner unavailability is bounded to current PATH/module/recovery virtualenv; no
  live/global absence, gene membership or activity conclusion follows.
- Generic Rhea16241 and narrower 55080/55092 overlap. Generic chemical R groups remain
  unspecified; D-fructofuranose is represented without an assigned anomer.
- PMID22184213 has linked Comment-in PMID 22421139 and author reply that were not
  read. The review does not resolve physiological debate or infer universal cellulose/starch
  necessity. PMID4441071 has no abstract.
- The carrot PMID 7784526 biochemical report supports the enzyme and matching provider
  kinetic values despite PE2/untagged CA. The exact modern accession link remains
