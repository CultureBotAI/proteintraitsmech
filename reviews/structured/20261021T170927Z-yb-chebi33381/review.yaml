- issue_key: chebi.cofactor-requirement.CHEBI-33381.chemical-entity-equivalence
  category: grounding
  severity: major
  certainty: confirmed
  title: Chemical identity is used as protein-trait equivalence
  description: 'The record asserts a protein functional requirement but xrefs contains
    CHEBI:33381, which denotes a neutral ytterbium atom. The schema reserves xrefs
    for true source-direct equivalence. An activity involving that chemical is not
    identical to the chemical entity or chemical class, even when a source role or
    positive protein experiment supports its relevance. The maintained emitter creates
    this relation by construction. '
  field_paths:
  - xrefs
  - chemical_participants
  evidence_ids:
  - record
  - schema
  - owner
  - chemical
  - chemical-ontology
  - yb-assay
  normalization_reason: The record equates different entity types in a defining grounding
    field; the schema requires their distinction. This is independent of whether a
    particular protein can use the chemical.
  finding_id: F1
  status: open
