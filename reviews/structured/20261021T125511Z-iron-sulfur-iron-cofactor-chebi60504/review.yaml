findings:
- issue_key: chebi.cofactor-requirement.CHEBI-60504.cluster-identity-conflict
  category: identity
  severity: blocker
  title: Definition conflates the P-cluster with a chemically inconsistent FeFe cofactor
  description: The defining source-derived assertion calls CHEBI:60504 a P-cluster,
    but modern Fe nitrogenase structures distinguish the Fe8S7 electron-transfer P-cluster
    from the Fe8S9C-homocitrate catalytic cofactor. The source alias names the latter
    while its default formula and structure retain an interstitial nitrogen. The same
    copied text says no structures are available, now contradicted by inspected primary
    structures. These mutually incompatible identity signals prevent safe exact grounding;
    this is not merely an uncertain protein requirement.
  evidence_ids:
  - record
  - chemical
  - chemical-ontology
  - fefe-structure-fulltext
  - fefe-independent-structure
  - fefe-carbide-fulltext
  certainty: confirmed
  field_paths:
  - identifier
  - label
  - definition
  - xrefs
  - chemical_participants
  normalization_reason: The defining cluster class and molecular anchor conflict,
    blocking safe identity-dependent use. Stable identifier resolution alone does
    not limit this to a wording issue; no universal non-cofactor claim is needed.
  finding_id: F1
  status: open
  target_ids:
  - proteintraitsmech:COFACTOR_REQ_CHEBI_60504
  owner_paths:
  - path: scripts/seed_chebi_cofactor.py
    repository: CultureBotAI/proteintraitsmech
    role: Maintained ChEBI role parser, requirement-class synthesis, hierarchy selection
      and YAML emitter
  rule_id: ProteinTraitRecord field checklist
  native_severity: blocker
- issue_key: chebi.cofactor-requirement.CHEBI-60504.chemical-entity-equivalence
  category: grounding
  severity: major
  title: Chemical entity is asserted equivalent to a protein requirement
  description: The target xrefs treats CHEBI:60504 as equivalent to a protein functional-requirement
    class, although the source denotes a chemical entity. This violates the schema's
    true-equivalence semantics independently of the eventual activity-relative requirement
    decision. Fixing the conflicting cluster definition alone would leave this emitter-level
    type error intact.
  evidence_ids:
  - record
  - schema
  - owner
  - chemical
  certainty: confirmed
  field_paths:
  - xrefs
  - chemical_participants
  normalization_reason: The chemical entity and protein-requirement class are different
    entity types, a major grounding defect. Its repair depends on the separately identified
    cluster-identity blocker and must not preserve the wrong chemical depiction.
  finding_id: F2
  status: open
