  summary: The active purified R. capsulatus Fe nitrogenase and its ADP·AlF3-trapped
    2.35 Å structure contain separate Fe8S7 P-clusters and Fe8S9C-(R)-homocitrate
    catalytic cofactors. The reduced P-cluster is a six-cysteine-ligated relay; the
    active cofactor is 19.4 Å away and its apical iron coordinates histidine and bidentate
    homocitrate. Metal analysis and activity were measured, with about 80% catalytic-component
    Fe occupancy. This directly contradicts the copied P-cluster identity and no-structures
    assertion, without measuring every proton or proving a universal net charge.
