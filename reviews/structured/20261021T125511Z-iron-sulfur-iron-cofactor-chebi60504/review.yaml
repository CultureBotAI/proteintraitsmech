  summary: CHEBI:60504 resolves to the iron-sulfur-iron cofactor entry but its fields
    conflict. The definition calls it a P-cluster from Mo-independent nitrogenases,
    assigned to pH 7.3, and says no structures are available. Its UniProt name is
    [8Fe-9S-C-homocitryl] cluster, whereas its formula is C7H12Fe8NO7S9, charge −2,
    and the default structure places [N] at the interstitial site. The seven carbon
    atoms belong to homocitrate; this is not a carbon-centred Fe8S9C cofactor depiction.
    It has direct cofactor role and iron-sulfur-cluster ancestry. Source fidelity
    therefore does not establish a coherent modern chemical identity.
