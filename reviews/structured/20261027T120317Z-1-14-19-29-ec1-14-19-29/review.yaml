limitations:
- IUBMB marks the two short aliases ambiguous whereas current GO marks them exact;
  this is an explicit upstream nomenclature disagreement, not resolved by blindly
  replacing source labels.
- IUBMB says the actual substrate form has not been experimentally studied. Yeast
  sphingobase product measurements are not treated as universal direct assays on an
  isolated N-acyl substrate.
- PMID 10328826 concerns an Euglena fatty-acid delta-8 enzyme. Its presence in the
  actual Rhea citations is real, but its abstract is not direct evidence for this
  sphingolipid reaction. E-only yeast/diatom papers remain related context.
- PMID 12203571 delivers no abstract; its bibliographic title and the UniProt association
  are retained without inventing detailed mechanistic results.
- The recursive RDF includes generic donor context RHEA:25828. It is not an additional
  mapped focal master or evidence that all donors are interchangeable.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Legacy CURATOR/ENZYME pointers retain source membership without inventing sequence-coordinate
  qualification.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
