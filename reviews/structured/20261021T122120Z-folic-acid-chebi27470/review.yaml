- The candidate requirement was selected by the MGA alignment emitter, not independently
  demonstrated through a direct ChEBI cofactor-role selection. The original sibling
  reference table, its upstream evidence, licence and release were not inspected.
  The captured crosswalk is output provenance, not the emitter input or independent
  physiology.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- The folic-acid primary article was successfully inspected through alternate PMC
  HTML; failed XML/BioC responses are excluded. Human-liver DHFR substrate and inhibition
  data are not a universal test of all folic-acid roles. The authors' no-known-cofactor
  statement is contextual, not an experimentally exhaustive negative. Supplementary
  files, original MGA input and its external release were not independently inspected.
