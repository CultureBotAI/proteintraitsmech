- evidence_id: folate-abstract
  kind: primary_source
  reference: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID%3A19706381%20AND%20SRC%3AMED&format=json&resultType=core
  accessed_at: '2026-10-21T12:15:00.055797Z'
  snapshot_sha256: 6d0ac94c4f3016bc84526dc333aa758a1bb3fdd3a0cdfb75dc30d4de18cad9c0
  support: supports
  locator: Verified PMID/DOI and complete indexed abstract; full article not inspected
    through this response
  summary: PMID:19706381; DOI:10.1073/pnas.0902072106. The primary study measures
    DHFR conversion of folic acid to tetrahydrofolate in six human liver samples and
    rat liver, reporting much lower human activity at physiological pH. It supports
    precursor/substrate conversion in that tested system, not an obligatory non-substrate
    role for folic acid in all proteins.
- evidence_id: folate-fulltext
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC2730961/
  accessed_at: '2026-10-21T12:15:00.056361Z'
  snapshot_sha256: 549bcb16a9725503a7e1ebca2002e496f065693439be6e4263b95d98a078ec96
  support: supports
  locator: 'Successful full article HTML: Abstract, Introduction/Fig. 1, Results with
    Tables 1–3 and Fig. 2, Discussion scope and Materials and Methods; supplementary
    files not independently inspected'
  summary: PMID:19706381; DOI:10.1073/pnas.0902072106. The successful article HTML
    distinguishes oxidized folic acid from active THF derivatives and states in its
    introduction that folic acid itself has no known cofactor activity. Results directly
    measure THF formation with folic acid as DHFR substrate and examine inhibition
    of DHF reduction. Reactions were at pH 7.4 and 27 °C; six human livers were compared
    with rat preparations. This supports a precursor/substrate interpretation and
    a missing-support concern for the local non-substrate requirement. The background
    statement is not proof of universal absence of every possible cofactor role.
