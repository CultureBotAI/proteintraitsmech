  - trait_category
  - chemical_participants
  normalization_reason: The unresolved assertion is the defining non-substrate requirement,
    so its possible effect is major. Certainty remains provisional because precursor/substrate
    evidence and absent direct source role do not establish universal nonmembership.
  finding_id: F1
  status: open
