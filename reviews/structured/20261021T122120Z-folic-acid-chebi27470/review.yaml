  summary: CHEBI:27470 is neutral folic acid, C19H19N7O6, with the L-glutamate S stereocentre,
    two COOH groups and oxidized pteridine ring. The copied definition describes vitamin
    B9 and identifies tetrahydrofolate and other reduced active forms in one-carbon
    metabolism. Direct source roles include nutrient, human/mouse metabolite and several
    application roles; no direct cofactor or coenzyme relation occurs in the current
    outgoing list. Structural parents are N-acyl-amino acid and folic acids, with
    functional parent pteroic acid and conjugate base folate(2−). This absence alone
    does not refute all possible cofactor roles.
