findings:
- issue_key: chebi.cofactor-requirement.CHEBI-27470.non-substrate-requirement-support
  category: scope
  severity: major
  title: Folic acid non-substrate requirement lacks demonstrated support
  description: The defining protein-cofactor requirement is stronger than the available
    source evidence. The record itself assigns active one-carbon function to reduced
    folates, current ChEBI roles do not directly assert cofactor/coenzyme for folic
    acid, and the inspected primary experiment treats folic acid as a DHFR substrate/precursor.
    These observations leave the asserted non-substrate requirement ungrounded; they
    do not prove that folic acid can never have another cofactor role.
  evidence_ids:
  - record
  - schema
  - chemical
  - owner
  - folate-fulltext
  - context-15635
  certainty: provisional
  field_paths:
