- issue_key: ec-1-14-14-130-flavin-reactive-part-type
  category: graph
  severity: major
  certainty: confirmed
  title: Flavin cofactors are typed as amino-acid residues
  description: The two reactive-part nodes identify FMNH2 and FMN but use RESIDUE.
    The schema defines LIGAND for small-molecule cofactors, while RESIDUE denotes
    a specific residue or residue set. Current ChEBI chemistry supports flavin cofactor
    identities, and the maintained builder hardcodes RESIDUE for every Rhea reactive
    part. The generic reductase carrier nodes and their part-of links remain supported.
  field_paths:
  - causal_graphs[0].nodes[node_id=sub2_rp1].node_type
