limitations:
- Human CYP4Z1 has several laurate products and additional activities; this review
  does not imply exclusive C7 specificity.
- The fungal omega-7 study is retained as bibliography/context rather than used to
  validate the focal C7 chemistry.
- Rhea has a GO seeAlso entry, but the target and captured ec2go lookup have no GO
  mapping. No global claim about GO coverage is made.
- Literature reading covers complete delivered indexed bibliography, abstracts or
  explicit nulls and correction lists. No full article, figure, sequence-residue inspection
  or undeclared API field is claimed.
- No trait edit, human sign-off or publication is performed.
