limitations:
- Net reaction balance is not an elementary residue mechanism or universal sequence-family
  detector.
- Available source annotations retain experimental, rule-derived, homology and untagged
  tiers. No identical assay evidence is implied for every example.
- All 16 delivered MED responses and seven supplemental query envelopes were read;
  linked full articles were not. Two initial MED records lack abstracts; three exact
  DOI queries return no records.
- No correction-list field in the actual indexed responses is not proof that no correction
  exists.
- A1B8Z0 entry strain Pd1222 differs from the ATCC17741/DSM413 strain in its attached
  experimental reference. The active 67 donor O28608 was not retrieved; only the source
  transfer annotation is reported.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Catalogue import, current annotation support and direct experimental qualification
  are separate. Current successful identity checks do not imply every reference is
  an exact-strain or isolated-protein assay.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
