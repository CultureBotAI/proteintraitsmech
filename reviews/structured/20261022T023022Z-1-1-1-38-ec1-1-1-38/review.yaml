  summary: Tronconi and colleagues (2010) compared kinetic mechanisms of Arabidopsis
    NAD-ME homodimers and heterodimer using product inhibition, substrate analogues
    and a chimeric protein. NAD-ME2 followed an ordered mechanism, whereas the other
    entities could bind substrates randomly with qualifications. Reverse pyruvate
    reductive carboxylation had very low activity. These complete-abstract results
    support source-specific oxidation and do not make an irreversible or uniform binding-order
    claim for the whole class.
