- Complete indexed abstracts and selected citation/correction fields were read; full
  articles and accession-specific experimental reconstruction were not.
- UniProt reading covers identity/audit/taxonomy/description/genes/existence, length,
  selected functional comments, classification references and their cited bibliography.
  No sequence or coordinate qualification.
