  balance covers defined chemical and reactive-group formulas with unchanged generic
  carrier remainder symbolic.
- Shared captures retain their original retrieval dates and hashes; no latest-release
  claim.
- Ignored files were included only within the declared owned-checkout scripts, conf,
  data/mappings and history search scope; no global approval-absence claim.
- iModulonDB is inapplicable to these reaction-identity questions; no negative expression
  inference.
