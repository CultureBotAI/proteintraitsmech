    check before emitting a requirement from a curated name plus ChEBI definition.
    First determine the intended class from independently verified source evidence;
    reconcile label, identifier, definition, attribution, synonyms, parent and category
    accordingly. Do not promote this target, move CHEBI:61202 into a BCCP chemical_participant,
    guess a replacement ID, or silently relabel it as a carteolol requirement. If
    BCCP remains intended, explicitly design a protein-component/partner representation
    rather than retaining the current small-molecule cofactor category.
