  description: The label and alignment synonym identify biotin carboxyl carrier protein,
    but CHEBI:61202 and the appended definition identify carteolol(1+). Official chemical
    structure and independent BCCP protein evidence confirm the conflict. The record
    therefore lacks a coherent scientific denotation, and the stated BCCP protein
    concept also conflicts with the category’s small-molecule scope. A generic xref-to-participant
    rewrite cannot repair this root identity error.
