limitations:
- Complete indexed envelopes were read, not the full articles. Database reaction annotation,
  direct biochemical work, structure, genetics and similarity transfer remain separate
  evidence tiers.
- Current OLS attempts returned404 after original recorded transport failures; full
  error bodies are preserved. Successful QuickGO and EC/Rhea support the actual classification,
  without claiming term absence or unavailable-field corroboration.
- The graph represents selected left-to-right net chemistry. It does not prove elementary
  electron-transfer steps, universal kinetics, metal/flavin requirements, residue
  coordinates or all-branch activity for every member.
- Contextual references and unselected transfer donors were explicitly dispositioned
  in the finite supplemental plan; no automatic bibliography cascade was performed.
- Chromate-specific electron partitioning, semiquinone generation and ROS are not
  inferred as the selected quinone mechanism.
- The original P0AGE7 HTTP500 and its successful new-alias capture are both retained;
  no failed body substitutes for the current protein scope.
