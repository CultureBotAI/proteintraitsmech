limitations:
- The two literature captures contain indexed abstracts and metadata, not full experimental
  articles. Other IUBMB bibliography entries were read only as citations on that page.
- No accession-specific activity or unique protein identity follows from the Spodoptera
  pathway/isotope studies. PMID 10563812 leaves the E/Z one-enzyme versus two-enzyme
  alternative unresolved.
- Formal arithmetic concerns declared reactive parts and generic lipid substituents
  with unchanged protein remainders symbolic; it is not a whole-protein molecular
  formula.
- Current snapshots can differ from the historical seeding release. Reused capture
  timestamps remain original; negative provenance searches cover only their explicitly
  declared ignored-inclusive directories.
