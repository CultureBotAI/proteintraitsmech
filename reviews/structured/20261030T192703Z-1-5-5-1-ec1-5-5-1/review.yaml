summary: EC1.5.5.1 is supported as the generic ETF-to-ubiquinone oxidoreductase class.
  Current exact ENZYME DR and UniProt annotations support all three selected accessions
  with their distinct evidence tiers; human Q16134 is a transfer donor, not an additional
  target exemplar. Curation requires one automatic-status major and 2 bounded minor
  finding(s). The overall R24053 reaction uses generic reduced/oxidized ETF proteins
  and their FADH2/FAD reactive groups, plus ubiquinone/ubiquinol with matching polymer
  n. The protein scaffold cancels; no amino-acid identity or sequence position is
  asserted. Correct the two RESIDUE classifications while retaining both supported
  part_of relations and all eleven edges.
