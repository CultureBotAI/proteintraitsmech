limitations:
- All declared source fields and complete indexed MED envelopes were personally read;
  full articles were not. Source association, genetic evidence, purified-domain work
  and direct full-protein assays are distinguished.
- The graph describes source-selected left-to-right net chemistry. It does not establish
  elementary electron-transfer steps, universal product exclusivity, protein sufficiency
  or residue coordinates.
- Contextual GO processes, alternate activities, donor binding-site transfers and
  nonselected species were not expanded into new class claims.
- Q5JGP4 Vmax/kcat label ordering and the paper/function NADPH-preference statement
  are not quantitatively reconciled from an abstract; the target contains no kinetic
  numbers.
- The class equation and selected >75% water-producing assay are compatible without
  claiming that every oxygen molecule always yields water. CoA, sulfur, oxidation
  state and species can change observed behavior.
