  title: Automatic graph construction asserts scientific review
  description: The record has mapping_status REVIEWED and one LLM-assisted event saying
    SEEDED -> REVIEWED because its graph was added. Current build_ec_causal_graphs.py
    emits this transition mechanically. The schema and repository contract define
    REVIEWED as curator/human sign-off on label, definition and parents. The inspected
    event and bounded ignored-inclusive owner/history search do not establish that
    sign-off. This is a status-evidence mismatch, not proof that no human ever reviewed
    it.
