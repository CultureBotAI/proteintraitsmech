- issue_key: myelin-palmitoylation-attachment-conflict
  category: consistency
  severity: major
  title: The label and mapped GO description disagree with the S-acyl reaction
  description: 'This target is identified by the O-palmitoyltransferase name and mapped
    GO:0047157, but its definition, MECHANISTIC text and reaction graph explicitly
    transfer palmitate to cysteine sulfur. The discrepancy is present upstream: ENZYME
    retains the O name with an S reaction; IUBMB/GO still describe an O product; Rhea
    67388 is S-acylation. The ec2go line cannot establish identical chemistry across
    that attachment-atom conflict. Current primary abstract evidence does not resolve
    it. A target-only rename would conceal the source conflict.'
