- issue_key: chebi.cofactor-requirement.CHEBI-60344.chemical-entity-equivalence
  category: grounding
  severity: major
  title: Chemical entity is asserted equivalent to a protein requirement
  description: CHEBI:60344 denotes a chemical entity, whereas the local record denotes
    a protein functional requirement. Authentic cofactor roles, structural identity
    and bounded functional evidence do not satisfy the schema's true own-source equivalence
    meaning of xrefs.
  evidence_ids:
  - record
  - schema
  - chemical
  - owner
  certainty: confirmed
  field_paths:
