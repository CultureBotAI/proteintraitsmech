findings:
- issue_key: uniprot-keyword.KW-0349.protoporphyrin-only-definition
  category: scope
  severity: major
  title: Separate broad heme identity from the heme-b chemical example
  description: The class-defining opening equates heme with iron coordinated to protoporphyrin
    IX. ChEBI distinguishes this heme-b chemistry from broader heme, including chemically
    distinct heme a, and reviewed UniProt applies KW-0349 to a heme-A-bearing protein.
    The defect is the universal ligand definition; this finding does not assert that
    COX1 can never bind another ligand or that a particular detector excludes every
    heme-A protein.
