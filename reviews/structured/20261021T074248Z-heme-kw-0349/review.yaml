  title: Qualify the claim about covalent heme attachment
  description: The final sentence calls cytochrome c the only common covalently bound
    heme-protein case. Inspected primary structure evidence documents three covalent
    heme-protein bonds in human myeloperoxidase, a current source-assigned Heme member.
    Common is undefined, so the uniqueness wording is poorly bounded; this review
    does not quantify prevalence.
