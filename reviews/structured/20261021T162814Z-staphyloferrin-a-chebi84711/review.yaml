summary: The exact staphyloferrin A chemical identity and source-role provenance are
  supported, with positive experimental context assessed at its stated scope. The
  record still asserts a chemical entity as an equivalent protein-requirement class,
  a confirmed major grounding defect. The source siderophore role and its cofactor
  ancestry supply positive candidate context. Transport of a ferric complex does not
  automatically establish the non-substrate requirement represented here, nor does
  it exclude another role of the free ligand. Role and state must be adjudicated relative
  to the chosen protein activity; no example is promoted.
