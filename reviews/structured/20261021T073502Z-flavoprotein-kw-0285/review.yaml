findings:
- issue_key: uniprot-keyword.KW-0285.redox-enzyme-only-definition
  category: scope
  severity: major
  title: Broaden the definition to supported nonredox flavin roles
  description: The first sentence requires an enzyme with flavin redox cofactor/cosubstrate
    roles. Source-assigned, experimentally characterized RibL uses FMN as substrate
    and produces FAD in nucleotidyl transfer. Independently, primary AppA studies
    describe a flavoprotein FAD light sensor and transcriptional antirepressor. The
    enzyme/redox-only definition does not accommodate these demonstrated uses of flavin.
  evidence_ids:
