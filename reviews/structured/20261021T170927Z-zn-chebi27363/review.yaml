findings:
- issue_key: chebi.cofactor-requirement.CHEBI-27363.chemical-entity-equivalence
  category: grounding
  severity: major
  certainty: confirmed
  title: Chemical entity is asserted as equivalent to a protein requirement class
  description: The local identifier and requirement definition denote a protein trait,
    whereas CHEBI:27363 denotes the inspected chemical entity. The xrefs field asserts
    true own-source equivalence, so this association is encoded with the wrong semantics.
    Adjudicate element-level Zn versus exact neutral-atom/ionic scope before replacing
    any identifier or adding COFACTOR. Preserve the zinc_ion token as source provenance
    until its scope is resolved. Do not mechanically move neutral CHEBI:27363 into
    a COFACTOR participant on the strength of Zn2+ evidence, and do not silently replace
    it with CHEBI:29105.
  field_paths:
