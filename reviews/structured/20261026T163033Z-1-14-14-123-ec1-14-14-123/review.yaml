limitations:
- Literature reading covers the complete indexed abstracts and selected citation/correction
  fields, not full papers or independent reconstruction of every accession-specific
  experiment.
- UniProt reading covers declared identity/audit/taxonomy/description/genes/existence,
  length, selected functional comments, classification references and their cited
  bibliography; no sequence or coordinate qualification.
- Rhea reading covers declared selected properties of the focal recursive closure.
  Formal balance uses only declared reactive-group formulas; unchanged generic carrier
  remainder is symbolic.
- Shared chemical/property/release scopes retain the same reader’s original bytes,
  URLs and retrieval times; no latest-release claim.
- Owner/history discovery includes ignored files only within scripts, conf, data/mappings
  and history in the owned checkout; no global absence claim.
- iModulonDB is not applicable to these activity/reaction identity questions; no negative
  expression-module inference.
- No trait, status, history or protein qualification is changed. This agent review
  is not human scientific sign-off.
