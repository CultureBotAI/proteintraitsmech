limitations:
- The two MbtG examples have homology-inferred existence and by-similarity function;
  genome bibliography is not a direct catalytic assay.
- The EN222 and recombinant-IucD papers support their own preparations; their quantitative
  properties are not assigned to every homolog.
- IUBMB's extra-proton display and ambiguous alternative name remain explicit upstream
  source qualifications without changing correct target chemistry.
- PMID2935523 is deletion/subcloning pathway evidence, and PMID8218389 assays a 47-residue
  N-terminal deletion construct; neither is represented as a full-length exact-accession
  purified assay.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not described as new downloads.
- Complete bibliography arrays do not imply full article reading. No unselected linked
  paper or ancestor protein assay is claimed as reviewed.
- Legacy CURATOR/ENZYME examples establish source membership rather than release-qualified
  sequence-coordinate evidence.
- The ignored-inclusive searches cover only the declared owned scripts/conf/data/mappings/history
  scope and do not prove global absence of historical approval.
