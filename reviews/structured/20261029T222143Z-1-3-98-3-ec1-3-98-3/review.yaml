summary: EC 1.3.98.3 denotes oxygen-independent coproporphyrinogen dehydrogenase,
  with two SAM-dependent decarboxylations yielding protoporphyrinogen IX. Current
  EC, Rhea15425, GO:0051989 and KEGGK02495 agree on the class; the HEMF_CERS4 mnemonic
  does not override the actual current hemN/EC annotation. One major finding and one
  minor finding concern automated signoff and actual provenance. Formal chemistry
  and evidence-qualified protein associations remain supported.
