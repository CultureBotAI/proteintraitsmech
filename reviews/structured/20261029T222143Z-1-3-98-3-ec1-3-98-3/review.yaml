limitations:
- AI-agent reading does not confer human curator signoff.
- Declared source/API scopes and named indexed abstracts were read; complete articles
  and unrelated indexing fields were not.
- Original capture URLs, times and hashes are preserved; retained sources are not
  new upstream releases.
- Ignored-inclusive discovery searches cover scripts, conf, data/mappings and history
  only; raw releases and other checkouts are excluded.
- All 15 named indexed results omit commentCorrectionList. Field absence is not global
  proof that no correction exists.
- The three stored proteins use named P32131 catalytic/function transfer; E. coli
  donor biochemistry is not a direct focal assay.
- The HEMF_CERS4 mnemonic does not override its current hemN/EC 1.3.98.3 annotation.
  Old-sequence initiation cautions do not establish a defect in an unspecified target
  sequence.
- O31381 bll7086/450-residue USDA110 identity is consistent with the functional HemN2
  length/strain in 11157943, but the delivered indexed scope does not explicitly connect
  the accession/locus. No definitive focal-paper identity or purified focal assay
  is asserted.
- The external-local TraitOntoMap catalogue path raised PermissionError; no current
  catalogue row/hash was captured. Current targetxref, KEGGK02495 response and maintained
  owner route are the bounded evidence.
- Donor PMID 7768836 was read only as a complete attached UniProt reference; no separate
  article or abstract was acquired.
