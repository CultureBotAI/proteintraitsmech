  - quickgo
  - ols
  - seed-owner
  target_ids:
  - EC:1.14.18.6
  assessment_id: assessment-3
  topic: Trait nomenclature
- area: evidence
  outcome: supported
  summary: Q03529 remains a positive current yeast association. Its generic EC 1.14.18.6/EC
    1.14.18.7 reactions carry cautious ECO:0000305 annotations and FUNCTION says postulated;
    yeast disruption/complementation and lipid profiling provide functional evidence
    without a purified generic-substrate assay. Human and mouse FA2H abstracts support
    class context and R stereochemistry without directly qualifying the yeast accession.
    PMID 26977056 is genuinely attached in RDF but its delivered abstract does not
    name Scs7; PMID 19074599 is GPI-remodeling context. The Scs7 structure contains
    two zinc ions; that dimetal-center observation must not be conflated with the
    cytochrome b5 iron donor represented in the reaction.
  evidence_ids:
