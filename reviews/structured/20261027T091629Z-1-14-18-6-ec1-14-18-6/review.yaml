  outcome: supported
  summary: The record denotes phytoceramide fatty-acyl C2 hydroxylation, not sphingoid-base
    C4 hydroxylation. Its FUNCTION axis, enzymatic-activity category, CLASS kind and
    EC 1.14.18 donor-class ancestry are coherent. Both represented substrate classes
    retain the 4R-hydroxysphingoid backbone and gain the acyl 2R hydroxyl group.
  evidence_ids:
