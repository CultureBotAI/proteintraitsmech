- area: nomenclature
  outcome: concern
  summary: 'The accepted class name is supported and no alternate-name array is stored.
    The root and MECHANISTIC definitions contain three chemical-token breaks introduced
    by line joining: Fe(II)- [cytochrome b5], N-(2R-hydroxyacyl)- 4R-hydroxysphinganine
    and (R)-4- hydroxysphingoid base. The correctly spelled graph/RDF terms permit
    a bounded text repair.'
  evidence_ids:
