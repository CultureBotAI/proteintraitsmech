limitations:
- Only declared source fields, exact authority rows and complete focal RDF closures
  were read; no whole UniProt entry, whole release or full article claim.
- All delivered indexed abstracts or nulls, publication types and correction lists
  were inspected. Citation-only records do not establish detailed experimental results.
- Legacy CURATOR/DR associations are not promoted to qualified occurrences. Current
  reviewed UniProt status does not establish direct experimental support for every
  annotation.
- Original shared source bodies, HTTP times and headers are retained; reuse is not
  a new retrieval.
- Formal balance uses symbolic R groups and the reactive Fe portions of generic donor
  proteins, not complete protein formulas or proof of catalytic mechanism.
- No trait edit, native status/history mutation, protein qualification, publication
  or residue-coordinate claim was made.
- iModulonDB does not bear on these catalytic class claims; no transcriptomic inference
  was used.
- Human/mouse FA2H experiments are class context; their results are not direct assays
  of yeast Q03529.
- Rhea really cites PMID 26977056, but the delivered abstract does not explicitly
  name Scs7. GPI-anchor remodeling PMID 19074599 is context-only.
- The Scs7 structure contains zinc, whereas the reaction donor is cytochrome b5 with
  Fe; these are distinct molecular roles.
