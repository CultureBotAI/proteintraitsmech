- area: representation
  outcome: concern
  summary: The root and sourced definitions describe class chemistry without residue
    coordinates. The cytochrome b5 Fe(2+)/Fe(3+) reactive parts are chemical entities,
    whereas the target types them as RESIDUE. A sequence-position disclaimer does
    not change their entity class. Preserve the generic carrier proteins and their
    redox forms; do not infer a focal enzyme active-site iron atom from these donor
    participants.
  evidence_ids:
