- area: grounding
  outcome: supported
  summary: Current EC2GO and Rhea-to-EC rows support GO:0120521 and masters 46520/64532.
    RDF explicitly makes 64532 a subclass of 46520; the target uses narrowMatch links
    for both reactions and left-to-right children 46521/64533 for participant direction.
    OLS also qualifies 64532 as narrower. All substrate/product identifiers, symbolic
    formulas and stereochemical labels match the represented source forms.
