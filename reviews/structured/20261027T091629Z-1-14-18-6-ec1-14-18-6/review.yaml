  topic: Defining representation and axis/category
- area: graph
  outcome: concern
  summary: 'All 22 actual edges were independently reconstructed: two curated-reaction
    links, 14 input/output relations, four reactive-part relations, one GO association
    and one exemplar enables link. The two formal balances are C20H42Fe2NO6R and C6H13Fe2NO6R2,
    each with charge +6 on both sides. The carrier reactive parts and symbolic R groups
    provide formal bookkeeping, not whole-protein formulas. Four Fe(2+)/Fe(3+) nodes
    are incorrectly typed RESIDUE despite their correct ChEBI identifiers.'
  evidence_ids:
