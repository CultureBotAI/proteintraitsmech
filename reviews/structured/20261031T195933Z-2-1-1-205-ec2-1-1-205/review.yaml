limitations:
- Whole indexed MED envelopes were read; linked full articles, supplementary datasets
  and coordinate files were not inspected.
- Chemical scope is the seven declared fields; the separate shared hydron policy scope
  includes its default structure.
- The class concerns tRNA C32/G34 ribose 2′-O methylation. The two-part Rhea net reaction
  is supported; substrate, partner and experimental-organism qualifications remain
  explicit. Human FTSJ1 has direct partner-dependent evidence; worm and amoeba entries
  are HAMAP-supported.
- 'The complete represented net reaction transfers two methyl groups: 2 SAM to 2 SAH
  plus 2 H+. Both RNA reactive parts and exact chemical formulas/charges balance with
  the unchanged tRNA remainder canceled. This net count is not a claim that one complex
  necessarily modifies both positions under every assay condition.'
- Ignored-inclusive provenance searches cover owned scripts, conf, data/mappings and
  history only; no global absence of human approval is asserted.
- SAM role-type refinement preserves balanced chemistry. RNA positions are not enzyme
  amino-acid coordinates.
- PMID 32558197 directly reconstitutes FTSJ1-WDR6 position 34 activity; C32 evidence
  from PMID 25404562 is heterologous complementation with yeast partners.
- Patient phenotypes, variant mechanisms and protein structural annotations are not
  new experimental conclusions of this review.
- Current Q9UET6 references include an erratum link for PMID 32393790; no causal claim
  depends on an uninspected corrected article.
- The absent-GO finding concerns the current introduction; optional GO content is
  not required.
