  - path: scripts/seed_chebi_cofactor.py
    repository: CultureBotAI/proteintraitsmech
    role: Imported ChEBI chemical-name/definition and formatting dependency
  rule_id: ProteinTraitRecord field checklist
  native_severity: major
- issue_key: chebi.cofactor-requirement.CHEBI-30154.category-token-synonym
  category: nomenclature
  severity: minor
  certainty: confirmed
  title: Alignment category is represented as a trait synonym
  description: The captured alignment transform copies the category token 'metals'
    into RELATED_SYNONYM. It denotes a broad metadata category, not an alternate name
    for this particular requirement class. The local crosswalk explains its origin
    but does not change that naming distinction.
  field_paths:
