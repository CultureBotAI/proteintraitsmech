limitations:
- The reviewed record does not identify the exact ChEBI source release used for the
  seed. Current official responses are comparison snapshots, not proof of the original
  release.
- The captured alignment emitter and local crosswalk document candidate provenance.
  The original MicroGrowAgents reference tables and their release were not independently
  inspected, and no sibling checkout was accessed. This provenance is not proof of
  an activity-specific non-substrate requirement.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- All four primary publication contexts were inspected through complete indexed abstracts;
  their full texts were not inspected. Tungsten positive evidence concerns a coordinated
  pterin cofactor, not a bare atom or an automatically selected replacement. No proposed
  identity migration has been performed.
