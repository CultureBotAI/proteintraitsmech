  rule_id: ProteinTraitRecord field checklist
  native_severity: blocker
- issue_key: chebi.cofactor-requirement.CHEBI-30154.chemical-entity-equivalence
  category: grounding
  severity: major
  certainty: confirmed
  title: Chemical identity is used as protein-trait equivalence
  description: The record asserts a protein functional requirement but xrefs contains
    CHEBI:30154, which denotes a steroid rather than a protein requirement. The schema
    reserves xrefs for true source-direct equivalence. An activity involving that
    chemical is not identical to the chemical entity or chemical class, even when
    a source role or positive protein experiment supports its relevance. The maintained
    emitter creates this relation by construction. The separate identity blocker must
    be resolved first; merely changing the accession would still leave the independent
    chemical-versus-trait equivalence error.
  field_paths:
  - xrefs
  - chemical_participants
  evidence_ids:
  - record
  - schema
  - owner
  - chemical
  - chemical-ontology
  normalization_reason: The record equates different entity types in a defining grounding
    field; the schema requires their distinction. This is independent of whether a
    particular protein can use the chemical.
  finding_id: F2
  status: open
  target_ids:
  - proteintraitsmech:COFACTOR_REQ_CHEBI_30154
  owner_paths:
  - path: scripts/seed_cofactor_alignment.py
    repository: CultureBotAI/proteintraitsmech
