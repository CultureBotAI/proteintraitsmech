findings:
- issue_key: chebi.cofactor-requirement.CHEBI-30154.chemical-identity-conflict
  category: grounding
  severity: blocker
  certainty: confirmed
  title: Tungsten naming is grounded to a steroid accession
  description: The record combines requires W and tungsten_ion with CHEBI:30154 and
    the copied definition of 5β-pregnane-3,20-dione. Current official backend and
    OLS agree on the steroid identity, formula and stereochemical structure. This
    is a positive conflict between different chemicals, not a missing role edge or
    uncertainty about biological necessity.
  field_paths:
  - identifier
  - label
  - definition
  - xrefs
  - synonyms
  evidence_ids:
  - record
  - chemical
  - chemical-ontology
  - owner
  - alignment-crosswalk
  - tungsten-comparison
  normalization_reason: The defining anchor denotes a steroid rather than the named
    element, preventing safe scientific use until identity is repaired.
  finding_id: F1
  status: open
  target_ids:
