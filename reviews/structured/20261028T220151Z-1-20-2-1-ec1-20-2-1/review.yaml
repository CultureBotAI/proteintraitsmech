limitations:
- Primary-paper support is limited to complete indexed abstracts and bibliography/publication-type
  fields; no full article, table or supplementary file was read.
- The four inspected indexed records have no correction/comment pointers in their
  delivered arrays; this is not a global claim that no notice exists.
- IUBMB and Rhea use different proton/species conventions. The stored charged Rhea
  reaction balances; its undirected master is not itself a physiological direction
  assertion.
- The generic cytochrome carriers are not specific protein accessions. The reacting-part
  balance assumes their paired nonreacting remainders are unchanged and does not establish
  a complete carrier formula.
- Source-specific cytochromes, in vitro substitutes and inferred structural/transport
  details are not universal class claims.
- Ignored-inclusive provenance searches cover only the recorded owned-checkout directories;
  no global absence of sign-off evidence is asserted.
