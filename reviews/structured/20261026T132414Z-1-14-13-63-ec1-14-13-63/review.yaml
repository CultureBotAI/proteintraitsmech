limitations:
- Current UniProt annotates both donor reactions for Q078T0 with experiment-tagged
  evidence, but the read phacB abstract establishes microsomal hydroxylation rather
  than a sequence-specific NADH-versus-NADPH efficiency comparison.
- PMID 10329644 concerns phacA and is contextual here. The bacterial Flavobacterium
  FAD/dimer/donor-efficiency observations are not transferred to the fungal P450-family
  protein.
- GO:0047094 omits an explicit hydron. ChEBI 16169 definition prose says 2,6-dihydroxyphenylacetate
  while its IUPAC name and structure identify 2,5-dihydroxyphenylacetate. The latter
  agree with homogentisate and the reaction; no target-identity correction is inferred.
- Literature reading covers complete delivered indexed bibliography, abstracts or
  explicit nulls and correction lists. No full article, figure, sequence-residue inspection
  or undeclared API field is claimed.
- No trait edit, human sign-off or publication is performed.
