findings:
- issue_key: evo-clade-specific-detection-and-orphan-scope
  category: scope
  severity: major
  certainty: provisional
  title: Restriction and orphan equivalence need an operational scope
  description: The definition asserts biological presence only in a taxon, and assigns
    orphan gene as an exact synonym across arbitrary clades. The inspected primary
    source instead defines detection-based restriction and limits orphan to one species.
    This creates a material membership ambiguity. Terminology varies, so curator adjudication
    should retain the conflict and choose an explicit convention rather than declare
    every historical use wrong.
  field_paths:
  - definition
  - synonyms
  - evolutionary_scope.conservation_metric
