  snapshot_sha256: fd7dc3af4c9120523b0d00017a4c8b631bcd635468f031a23fc9ef480646ab06
  support: supports
  quote: C-terminal SNARE motif of SNAP25 and SNAP23. C-terminal SNARE motifs of SNAP25 and SNAP23, members
    of the Qb/Qc subfamily of SNARE (soluble N-ethylmaleimide-sensitive factor attachment protein receptor)
    proteins. SNAP23 interacts with STX4 (Qa) and the lysosomal R-SNARE VAMP8. The complex plays a role
    in transport of secretory granule from trans-Golgi network to the plasma membrane. SNAP25 interacts
    with Syntaxin-1 (Qa) and the R-SNARE VAMP2 (also called synaptobrevin-2). The complex plays a role
    in transport of secretory granule from trans-Golgi network to the plasma membrane. Qb/Qc SNAREs consist
    of 2 coiled-coil helices (called SNARE motifs, one belonging to the Qb subgroup and one belonging
    to the Qc subgroup), which mediate the interactions with other SNARE proteins, and lack a transmembrane
    domain; SNAP25 and SNAP23 are anchored to target membranes via palmitoylated cysteine residues in
    the linker between their two SNARE motifs. In general, the SNARE complex mediates membrane fusion,
    important for trafficking of newly synthesized proteins, recycling of pre-existing proteins and organelle
    formation. SNARE proteins are classified into four groups, Qa-, Qb-, Qc- and R-SNAREs, depending on
    whether the residue in the hydrophilic center layer of the four-helical bundle is a glutamine (Q)
    or arginine (R). Qa-, as well as Qb- and Qc-SNAREs, are localized to target organelle membranes, while
    R-SNARE is localized to vesicle membranes. They form unique complexes consisting of one member of
    each subgroup, that mediate fusion between a specific type of vesicles and their target organelle.
    Their SNARE motifs form twisted and parallel heterotetrameric helix bundles. Other members of the
    Qb/Qc SNAREs are SNAP29, SNAP47 and SEC9
  summary: 'CDD:cd15855 (label SNARE_SNAP25C_23C, parent_traits=[CDD:cl22856], PROPOSED) is verified repaired
    on disk after Cycle 4 Stage 5 (#1217) errata remediation: the false Qb/Qc transmembrane-domain claim
    has been replaced with the accurate statement that Qb/Qc SNAREs lack a transmembrane domain and are
