  support: supports
  quote: Six-transmembrane helical domain 2 (TMD2) of multidrug resistance-associated proteins (MRPs)
    5, 8, and 9. This group represents the six-transmembrane domain 2 (TMD2) of multidrug resistance-associated
    proteins (MRPs) 5, 8, and 9, all of which are belonging to the subfamily C of the ATP-binding cassette
    (ABC) transporter superfamily. The human ABCC subfamily includes nine multidrug resistance-associated
    proteins (MRP1-MRP6 corresponding to ABCC1-ABCC6, and MRP7-MRP9 corresponding to ABCC10-ABCC12, whereas
    ABCC7 is the CFTR chloride channel and ABCC8/ABCC9 are the sulfonylurea receptors SUR1/SUR2). Several
    MRP members (notably MRP1-MRP5, MRP7/ABCC10, and MRP8/ABCC11) function as ATP-dependent efflux pumps
    for endogenous organic anions, cyclic nucleotides, and xenobiotics, whereas physiological substrates
    and transport activity of MRP9 (ABCC12) remain less characterized. MRP family can be divided into
    two groups, depending on their structural architecture. MRP4, MRP5, MRP8, and MRP9 (ABCC4, 5, 11 and
    12, respectively) have a typical ABC transporter structure and each composed of two transmembrane
    domains (TMD1 and TMD2) and two nucleotide domains (NBD1 and NBD2). On the other hand, MRP1, 2, 3,
    6 and 7 (ABCC1, 2, 3, 6 and 10, respectively) have an additional N-terminal five transmembrane segments
    in a single domain (TMD0) connected to the core (TMD-NBD) by a cytoplasmic linker (L0)
  summary: CDD:cd18599 (label ABC_6TM_MRP5_8_9_D2, parent_traits=[CDD:cl38913], PROPOSED) remains verified
