  description: CDD:cd15856 (label=SNARE_SNAP29C, parent_traits=[CDD:cl22856], unpromoted seed examples
    Homo sapiens SNAP29 UniProtKB:O95721, Mus musculus Snap29 UniProtKB:Q9ERB0, and Caenorhabditis elegans
    SNAP29 UniProtKB:P83351) models the C-terminal Qc SNARE motif of SNAP29, but its upstream CDD definition
