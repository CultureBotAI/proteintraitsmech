  snapshot_sha256: e69d6f93c2ecb23a1f5ebf31407261c087a24b52333f171544127e919db95510
  support: supports
  quote: C-terminal SNARE motif of SNAP23. C-terminal SNARE motifs of SNAP23, a member of the Qb/Qc subfamily
    of SNARE (soluble N-ethylmaleimide-sensitive factor attachment protein receptor) proteins. SNAP23
    interacts with Syntaxin-4 (Qa) and the R-SNARE VAMP8. The complex plays a role in exocytosis of secretory
    granule. Qb/Qc SNAREs consist of 2 coiled-coil helices (called SNARE motifs, one belonging to the
    Qb subgroup and one belonging to the Qc subgroup), which mediate the interactions with other SNARE
    proteins, and lack a transmembrane domain; SNAP23 is anchored to target membranes via palmitoylated
    cysteine residues in the linker between its two SNARE motifs. In general, the SNARE complex mediates
    membrane fusion, important for trafficking of newly synthesized proteins, recycling of pre-existing
    proteins and organelle formation. SNARE proteins are classified into four groups, Qa-, Qb-, Qc- and
    R-SNAREs, depending on whether the residue in the hydrophilic center layer of the four-helical bundle
    is a glutamine (Q) or arginine (R). Qa-, as well as Qb- and Qc-SNAREs, are localized to target organelle
    membranes, while R-SNARE is localized to vesicle membranes. They form unique complexes consisting
    of one member of each subgroup, that mediate fusion between a specific type of vesicles and their
    target organelle. Their SNARE motifs form twisted and parallel heterotetrameric helix bundles. Other
    members of the Qb/Qc SNAREs are SNAP25, SNAP29, SNAP47 and SEC9
  summary: CDD:cd15884 (label SNARE_SNAP23C, parent_traits=[CDD:cl22856], PROPOSED) remains verified resolved
