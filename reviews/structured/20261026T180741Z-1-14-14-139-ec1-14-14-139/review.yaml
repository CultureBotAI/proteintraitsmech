limitations:
- Current source support does not establish direct assays of every substrate for each
  example. PMID 14643796 supplies developmental-expression abstract scope despite
  the positive direct catalytic annotation in UniProt.
- PMID 12069850 was resolved and its delivered indexed abstract read as rat CYP8B1
  transcriptional-regulation context, not an exact-reaction assay. The null abstract
  for PMID 6766451 supplies bibliography only.
- The source GO equation punctuation and IUBMB versus Rhea proton conventions are
  preserved without inferring a reaction-identity error.
- Literature reading covers complete delivered indexed bibliography, abstracts or
  explicit nulls and correction lists. No full article, figure, sequence-residue inspection
  or undeclared API field is claimed.
- No trait edit, human sign-off or publication is performed.
