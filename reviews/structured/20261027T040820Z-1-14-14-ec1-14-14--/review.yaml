limitations:
- Historical profile notes describe 80,066 reviewed entries, ten organisms and twenty
  carriers. The exact owner-configured matrix/cache/candidate paths are unavailable
  in the bounded checkout, so these historical counts and ranking were not replayed.
  This is a verification limit, not evidence that the examples are false.
- SWISSPROT_PROFILE discovery and current positive annotations do not constitute release-pinned
  sequence-coordinate qualification or authorize promotion. No required qualification
  defect is inferred merely from the legacy representation.
- 'The indexed PMID 22591743 Erratum-in lead remains unresolved: the exact-title/year
  query returned zero results, which does not prove absence or harmlessness of the
  correction. Specific corrected stereochemical claims are excluded from the parent
  conclusion.'
- Only selected primary abstracts were read; references for other activities, variant
  studies and all unpublished observations were not independently acquired.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Legacy SWISSPROT_PROFILE membership is separated from release-qualified sequence-coordinate
  evidence; no promotion is performed.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
