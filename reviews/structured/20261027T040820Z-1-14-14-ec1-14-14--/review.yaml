- area: evidence
  outcome: supported
  summary: Reviewed human CYP2D6 is 497 residues and directly carries the exact parent
    EC 1.14.14.- annotation. Selected catalytic comments describe CPR-dependent monooxygenation,
    including anandamide hydroxylation and epoxidation, with source-specific experimental
    references such as PMID 18698000. Current identity and family crossreferences
    support the legacy profile association without replaying its historical ranking.
    Reviewed Caenorhabditis elegans DAF-9 is 572 residues and directly carries EC
    1.14.14.-. Its selected annotation describes successive C26 steroid oxidation
    to dafachronic acids, with direct references including PMID 16529801 and PMID
    22505847. The annotation supports parent membership; it does not imply that every
    linked article was read. Reviewed human CYP2J2 is 502 residues and carries exact
    parent EC 1.14.14.- with direct arachidonic-acid epoxygenase support including
    PMID 8631948. Additional separately annotated hydroxylation, sulfoxidation and
    hydroperoxide-isomerase activities are retained as distinct activities rather
    than collapsed into a single parent reaction. Reviewed Arabidopsis CYP89A9 is
    511 residues and carries exact EC 1.14.14.-. Its selected FUNCTION annotation
    describes oxygenolytic deformylation of fluorescent chlorophyll catabolites to
    fluorescent dioxobilin-type catabolites, followed by a nonenzymatic acid-catalyzed
    conversion. PMID 23723324 is published support; the complete bibliography also
    distinguishes unpublished observations from published experiments. Reviewed Arabidopsis
    CYP82C4 is 524 residues and retains the recommended xanthotoxin 5-hydroxylase
    name and exact EC 1.14.14.- annotation with PMID 18291319. Its separately annotated
    fraxetin hydroxylase activity and more specific EC assignment do not negate that
    broader parent annotation. Reviewed human CYP2W1 is 490 residues and carries exact
    EC 1.14.14.-. The selected annotation supports CPR-dependent oxidation of lysophospholipids
    and retinoids, with direct references including PMID 22591743 and PMID 26936974.
    Reviewed human CYP2S1 is 504 residues and carries exact EC 1.14.14.- with retinoid
    monooxygenation support including PMID 12711469. Its annotation also describes
    distinct hydroperoxide/peroxidase or isomerase chemistry that can proceed without
    NADPH-CPR and molecular oxygen. These separate activities do not erase the positive
    monooxygenase annotation. Reviewed mouse CYP2C40 is 491 residues and carries exact
    EC 1.14.14.- with direct PMID 10908295 support. Selected annotation includes arachidonic-acid
    oxygenation and CPR dependence; current sequence length, taxon and family identifiers
    support the legacy profile association.
