  summary: CHEBI:61717 is ferroheme c(2−), C34H34FeN4O4S2, net −2. Its two carboxylates
    distinguish it from neutral CHEBI:60562. Both structures encode Fe(II), two 1-sulfanylethyl
    groups with terminal S-H and unspecified configuration at the two substituent
    stereocentres. The SMILES [Fe-2] is coordinate-bond formal-charge notation, not
    iron oxidation state −II. Direct role is cofactor; its structural parent is cyclic
    tetrapyrrole anion. The source assigns a state at pH 7.3 without supplying a measurement
    in this response.
