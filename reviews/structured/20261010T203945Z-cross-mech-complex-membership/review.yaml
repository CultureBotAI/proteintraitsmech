limitations:
- AI self-review; no human mapping_status upgrade or independent reviewer is implied.
- All examples are whole-protein membership claims. No binding interfaces, residue
  intervals, stoichiometry or catalytic reactions are installed.
- Most evidence was inspected at curated-database level. Primary checks were limited
  to Hsp104 Results/Figure-2 text and the Ssc1/ARG82 abstracts; other linked papers
  were not reread.
- Live Complex Portal web/API pages were unavailable or exposed only the application
  shell; exact receipt-bound UniProt cross-references and pinned record identities
  remain the qualification basis.
- Ignored-inclusive history search covered decision JSONL/approval TSV under reports/uniprot-grounding
  and found no prior decisions for these complex record paths. It is not a repository-wide
  or literature-wide absence claim.
- The pinned sibling snapshot and prior review dispositions are preserved; no sibling
  refresh or repository publication is performed in this batch.
