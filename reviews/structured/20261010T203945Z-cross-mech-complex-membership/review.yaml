  certainty: confirmed
  title: ARG82 association is not unambiguous mature-complex membership
  description: Hold/reject promotion pending assembly-state clarification. Exact UniProt
    complex membership and physical ARG80/MCM1 interactions are present, but the target
    definition itself cautions that ARG82 may not be in the mature DNA-bound complex.
    The inspected primary abstract of PMID:10632874 (DOI:10.1046/j.1365-2958.2000.01665.x)
    distinguishes stabilization/recruitment from presence in the arginine-box-bound
    complex. Later primary literature (PMID:19459978) uses broader component language,
    so this is a scoped ambiguity, not proof of no interaction. An unqualified whole-protein
    occurrence cannot express the assembly-state distinction; retain discovery and
    re-review a specific assembly state or an independently supported enzymatic alternative.
