- evidence_id: hsp104-primary
  kind: primary_source
  reference: https://doi.org/10.1016/j.molcel.2010.08.038
  locator: 'PMC3652556, Results: Sgt2 Is a Scaffold Protein; Figure 2A-B and S2A discussion'
  accessed_at: '2026-10-10T20:39:45Z'
  support: supports
  summary: Affinity purification and mass spectrometry identify Hsp104 in the GET4/GET5-associated
    assembly. Sgt2 TPR mutations remove Hsp association. The figure does not specify
    component copy number.
  quote: Get4 and Get5 exist in a complex with each other, as well as Hsp104, Hsp70s,
    Sgt2, and Ybr137w
