limitations:
- Literature review covers the delivered indexed abstracts and selected full citation/correction
  fields, not full articles.
- UniProt scope, where applicable, is the selected identity/audit/taxonomy, protein
  description, length, functional comments and cited bibliography; no sequence or
  coordinate qualification.
- Complete focal recursive RDF closures were read, not the entire archive. Balances
  concern defined chemical/reactive groups; the unchanged generic carrier remainder
  is symbolic.
- Shared captures retain original access times and hashes; no latest-release or new
  retrieval claim is made for reused bytes.
- Approval discovery includes ignored files only in owned-checkout scripts, conf,
  data/mappings and history. It does not establish universal absence of approval.
- iModulonDB is inapplicable to these reaction-identity questions; no negative expression
  inference is made.
- This review changes no trait, status or history and confers no protein qualification
  or human sign-off.
