  graph-edge evidence array, exact current authority rows and complete recursive RDF
  closures, declared chemical fields and entire relevant indexed responses. All five
  MID focal identity, audit, organism, names, genes, existence, comments, references,
  features, keywords and GO/material-family crossreferences were read. Sequence metadata
  were checked; residues and unrelated crossreference categories were excluded. No
  linked full article was read.
