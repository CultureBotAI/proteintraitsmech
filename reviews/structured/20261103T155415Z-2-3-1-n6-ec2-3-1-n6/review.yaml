limitations:
- The current shared reaction/chemical result establishes bounded net chemistry and
  source mappings, not every physiological specificity or residue mechanism.
- The exact dated iModulon catalogue has no selected MID organism match; this is not
  current whole-service absence, nonmembership or an assay result.
- Human/worm MBOAT and murine Aytl comparator experiments do not become selected Arabidopsis/yeast
  assays. Plant and yeast acyl-donor preferences differ; the source-wide oleoyl preference
  is not imposed on every example.
- Source-specific provider pH annotations differ from the retained PMID 19445718 abstract;
  neither value is silently reconciled or added to the target.
