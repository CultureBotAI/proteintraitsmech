- issue_key: chebi.cofactor-requirement.CHEBI-59539.alpha-gamma-linkage-conflict
  category: consistency
  severity: major
  title: α-F420-3 naming conflicts with the source γ-linked structure
  description: The target names the five-minus α-F420-3 form and grounds it to CHEBI:59539,
    whose actual structure has two γ interglutamate amides; its conjugate acid 59537
    carries the same structure and an explicitly γ/γ definition. The inspected primary
    study experimentally distinguishes α-F420-3 by a terminal α-linked L-glutamate.
    Thus the local source-grounded chemical identity is not coherent across name and
    structure. No alternative accession or unilateral rename is established here.
