- action_id: A1
  description: Correct build in scripts/seed_chebi_cofactor.py so chemical association
    is not emitted as protein-trait equality. Preserve positive regenerated SAM catalysis
    and distinguish it from consumed methyl donation. Adjudicate proton location and
    sulfur stereochemical scope before optional participant enrichment; do not automatically
    substitute the S-configured child, tautomer or neutral conjugate base. Preserve
    ChEBI provenance. Optional chemical_participants with role COFACTOR requires adjudication
    of the exact chemical and activity-relative non-substrate role; unresolved qualification
    can remain explicit without inventing a participant. Do not relocate this false
    equality to mapped_xrefs, require optional examples, merge distinct chemical states
    automatically or promote native status.
  finding_ids:
