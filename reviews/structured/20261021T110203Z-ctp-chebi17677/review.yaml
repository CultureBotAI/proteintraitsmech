limitations:
- The reviewed record does not identify the exact ChEBI source release used for the
  seed. Current official responses are comparison snapshots, not proof of the original
  release.
- MicroGrowAgents alignment supplies candidate provenance, not a direct ChEBI cofactor-role
  assertion or proof of a particular protein requirement. The original upstream alignment
  table and release remain uninspected.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- Both CTP(3−) and CTP(4−) comparison definitions assert major species at pH 7.3.
  Their apparent population-scope conflict is unresolved; neither assertion is imported
  into this neutral target, which makes no pH claim. Exact protein-bound protonation
  and metal complexation are not established.
