limitations:
- The reviewed record does not identify the exact ChEBI source release used for the
  seed. Current official responses are comparison snapshots, not proof of the original
  release.
- A ChEBI chemical-role assertion supplies candidate class context, not evidence that
  a particular protein requires that chemical, that every related protein does, or
  that the chemical is an obligatory physiological cofactor. No such per-protein qualification
  is claimed.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its cohort or ancestors. The target makes
  no gene-, strain- or dataset-specific expression claim; iModulonDB is not applicable
  to that defining claim. Literature protein contexts remain bounded and are not promoted
  examples.
- The CA experiment establishes a scoped Zn2+ association and activity recovery. Binding
  constants depend on the authors’ competitive-equilibrium model and assay conditions;
  no single universal zinc affinity, coordination number or requirement for all proteins
  is asserted.
- No uninspected external CCD structure is treated as an exact match. The shared source
  links/ionic synonyms on the neutral atom are kept distinct from the explicit charge
  and graph.
