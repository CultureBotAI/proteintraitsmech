- action_id: A1
  description: Repair the maintained emitter so CHEBI:29105 is not emitted as an equivalent
    protein-trait identifier. Preserve chemical provenance; moving the same assertion
    blindly into mapped_xrefs does not repair its meaning. Preserve the supported
    Zn2+ cofactor association while keeping enzyme-specific coordination, stoichiometry
    and measured activity scoped; do not generalize a carbonic-anhydrase experiment
    to every zinc-associated protein. Use an optional typed association only after
    its activity-relative role and exact chemical scope are justified. If no supported
    representation is available, retain the provenance and explicit uncertainty rather
    than inventing a participant or qualified protein example.
