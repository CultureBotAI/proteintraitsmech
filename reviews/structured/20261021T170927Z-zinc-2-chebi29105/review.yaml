findings:
- issue_key: chebi.cofactor-requirement.CHEBI-29105.chemical-entity-equivalence
  category: grounding
  severity: major
  certainty: confirmed
  title: Chemical entity is asserted as equivalent to a protein requirement class
  description: The local identifier and requirement definition denote a protein trait,
    whereas CHEBI:29105 denotes the inspected chemical entity. The xrefs field asserts
    true own-source equivalence, so this association is encoded with the wrong semantics.
    Preserve the supported Zn2+ cofactor association while keeping enzyme-specific
    coordination, stoichiometry and measured activity scoped; do not generalize a
    carbonic-anhydrase experiment to every zinc-associated protein.
  field_paths:
  - xrefs
  - chemical_participants
  evidence_ids:
  - record
  - schema
  - owner
  - chemical
  - ontology
  - state-comparison
  - ca-full
  normalization_reason: True-equivalence grounding materially conflates different
    denotations. Positive chemical identity or activity evidence can support an association
    without making the molecule or ion identical to a protein-trait class.
  finding_id: F1
  status: open
  target_ids:
  - proteintraitsmech:COFACTOR_REQ_CHEBI_29105
