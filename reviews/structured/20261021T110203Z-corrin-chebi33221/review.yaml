actions:
- action_id: A1
  description: Update build() in scripts/seed_chebi_cofactor.py to remove CHEBI:33221
    from trait-equivalence xrefs and preserve the exact chemical source identity through
    schema-compatible typed grounding. For a retained proposed requirement, adjudicate
    activity-relative non-substrate scope before emitting a COFACTOR chemical_participant
    or qualifying a protein. Preserve source provenance and SEEDED status. Do not
    use mapped_xrefs for this own-source association, substitute a chemically related
    entity, or treat chemical role membership alone as functional qualification.
  finding_ids:
