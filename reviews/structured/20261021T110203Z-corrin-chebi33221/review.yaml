    repository: CultureBotAI/proteintraitsmech
    role: Maintained ChEBI role parser, requirement-class synthesis, hierarchy selection
      and YAML emitter
  acceptance_checks:
  - The regenerated target preserves the intended CHEBI:33221 chemical identity or
    class without asserting equality to a protein requirement.
  - Preserve bare metal-free corrin identity and distinguish it from substituted hydrogenobyric
    acid, cobalt corrinoids and specific B12 cofactors. Do not transfer cofactor activity
    of a derivative to the scaffold or substitute a more biologically familiar chemical
    without adjudication.
  - Any COFACTOR participant has the supported chemical scope and activity-relative
    role; no unreviewed protein example, universal requirement or automatic status
    promotion is introduced.
  - After repair run just validate data/traits/function/cofactor_requirement/chebi/corrin-chebi33221.yaml;
    just validate-all data/traits/function/cofactor_requirement/chebi/corrin-chebi33221.yaml;
    and just audit-graphs data/traits/function/cofactor_requirement/chebi/corrin-chebi33221.yaml.
    These future curation checks do not imply the finding has already been fixed.
  - For maintained Python/writer changes add focused pytest coverage, then run just
    lint, just test and just audit-writers. Regenerate the scoped existing target
    through an audited route. Run full-corpus just validate-all before merging record
    changes and save a fresh structured scientific review against changed bytes.
limitations:
- The reviewed record does not identify the exact ChEBI source release used for the
  seed. Current official responses are comparison snapshots, not proof of the original
  release.
- A ChEBI chemical-role assertion supplies candidate class context, not evidence that
  a particular protein requires that chemical, that every related protein does, or
  that the chemical is an obligatory physiological cofactor. No such per-protein qualification
  is claimed.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- PMID31115943 was inspected at complete abstract level; it studies engineered substituted
  hydrogenobyric acid, not bare corrin. The authority text supplies nomenclature and
  chemistry, not proof of physiological use. No universal absence of corrin cofactor
  activity or automatic replacement ID is asserted.
