- area: evidence
  outcome: supported
  summary: CHEBI:33221 is the neutral metal-free corrin fundamental parent, C19H22N4,
    with four nitrogen-containing rings and three one-carbon bridges plus one direct
    ring-to-ring C−C link. The source structure contains no cobalt, side-chain pattern
    or nucleotide loop of a specific B12 cofactor. Its InChI specifies bridge double-bond
    geometry but no tetrahedral stereolayer, so it is not evidence for the full absolute
    stereochemistry of a substituted natural corrinoid.
