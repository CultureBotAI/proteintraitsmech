findings:
- issue_key: evo-shell-accessory-exact-scope
  category: scope
  severity: major
  title: Broad accessory identity is equated with a bounded shell class
  description: The shell method and numeric bounds identify an intermediate-frequency
    partition, but definition and exact accessory/dispensable synonyms include genes
    from other frequencies. A family occurring in 5 percent of a sample can be accessory
    while falling outside the target shell band. The 95-percent endpoint also needs
    an explicit exclusive comparator.
