summary: The shell record declares a Roary-style 15-to-95 percent band but defines
  shell as accessory/dispensable in general and gives those broader terms exact synonym
  status. The generic accessory concept includes low-frequency families outside this
  shell band. The seeder should narrow the prose and synonym semantics, including
  the exclusive 95-percent boundary.
