  summary: CHEBI:16048 is neutral FMNH2, C17H23N4O9P, charge 0, with two phosphate
    OH groups, the stereospecified ribityl chain and the 1,5-dihydro flavin ring.
    Relative to oxidized neutral FMN CHEBI:17621 it adds two hydrogen atoms through
    ring reduction, not phosphate protonation. Direct roles are cofactor and E. coli
    metabolite. Its structural parent is flavin mononucleotide CHEBI:24041; conjugate
    bases include CHEBI:57618 and CHEBI:133886.
