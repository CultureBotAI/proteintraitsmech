- issue_key: uniprot-keyword.KW-0848.calcitriol-d2-d3-naming
  category: nomenclature
  severity: minor
  title: Clarify D2/D3 naming in the precursor narrative
  description: The opening identifies calcitriol with active D3, while subsequent
    prose also derives active calcitriol from ergosterol and later distinguishes D2/D3
    forms. ChEBI gives separate identities for D3 calcitriol and active D2, whereas
    NIH uses the name more generically. This mixed terminology warrants clarification,
    not a claim that all broad usage is erroneous.
