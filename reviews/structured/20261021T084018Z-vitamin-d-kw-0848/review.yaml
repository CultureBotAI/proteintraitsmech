findings:
- issue_key: uniprot-keyword.KW-0848.response-union-binding-equivalence
  category: representation
  severity: major
  title: Transcription-response scope is recast as vitamin-D binding
  description: The source explicitly unions direct interaction with transcriptional
    regulation by vitamin D. P78411/IRX5 is source-assigned and has linked primary
    response evidence, confirming that response is an actual source usage rather than
    hypothetical prose. The local category and xrefs equality to GO:0005499 instead
    assert a binding function. This materially changes the class predicate; it does
    not establish that IRX5 or any other member cannot also bind vitamin D.
  evidence_ids:
  - record
  - keyword
  - go
  - response-member
  - response-primary
  - schema
  - owner
  normalization_reason: The transformation materially substitutes a direct-binding
    predicate for a source class explicitly including transcriptional response and
    then asserts equivalence to a binding-only function.
  finding_id: F1
  status: open
  target_ids:
