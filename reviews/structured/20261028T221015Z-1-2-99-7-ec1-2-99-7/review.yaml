limitations:
- All 22 indexed scopes across the first group were read at bibliography/abstract/publication-type/correction-field
  level. No main article body, figure or supplement was inspected; all delivered correction
  lists are null.
- Complete focal reference arrays, comments and GO annotations were read. Genomic
  citations retained only as accession/sequence context were not individually acquired
  as article content.
- Balances cancel the generic acceptor consistently and keep any aldehyde sidechain
  distinct. No concrete natural acceptor or universal physiological direction is inferred
  from A/AH2.
- The FAD-containing KY4690 paper is a source-bibliography limitation, not support
  for FAD-independent MOP. Historical names and GO related-synonym scope are distinct;
  differing synonym types alone do not establish a defect.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Legacy protein pointers retain their current parent/component identities and evidence
  tiers. No qualified-example promotion or isolated-chain activity/inactivity is inferred.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
