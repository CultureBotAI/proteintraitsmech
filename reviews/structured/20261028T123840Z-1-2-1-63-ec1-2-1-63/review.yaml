limitations:
- The old local GO proton convention differs from the current 2-proton representation;
  current Rhea/ChEBI support the stored balanced equation.
- Arthrobacter KI72 NylE1 is separate from the stored Acinetobacter proteins. Its
  correction notice 29234852 identifies table-legend/figure-sublabel errors, but the
  exact corrected labels/full notice and their detailed effects were not read.
- No isolated purified-Q9F7E3 kinetic result is inferred from recombinant pathway
  genetics.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Legacy associations and candidate comparisons are assessed at their actual direct,
  pathway or transferred evidence tier; no grounding-workflow qualification or promotion
  occurs.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
