limitations:
- Reading is limited to the explicitly declared current response/field scopes. Complete
  indexed abstracts are not full primary articles; database annotation and genomic
  context do not become purified-enzyme assays.
- A direction-unspecified Rhea master and its cited directional child are kept distinct.
  Atom/charge agreement alone is not the whole scientific review.
- Current ignored-inclusive provenance searches cover only their specified owned-checkout
  directories; they establish no global absence of curator activity.
- The thioredoxin balance expands only explicit cysteine/cystine reactive groups and
  retains the same unexpanded polypeptide remainder. Relative reactive-part positions
  do not identify accession-specific residue numbers.
- The shared PA/glycine literature and current GrdA class annotations support complex
  association; no isolated-A sarcosine/betaine assay is inferred. PMC206445 correction
  content and effect remain unknown because the Europe PMC route returned HTTP 403
  and the official PMC route delivered an HTTP 200 reCAPTCHA challenge.
- The current ENZYME CC glycine/ammonia wording and IUBMB betaine/trimethylamine wording
  are reported as a source-local difference; the target does not assert the former
  CC text.
