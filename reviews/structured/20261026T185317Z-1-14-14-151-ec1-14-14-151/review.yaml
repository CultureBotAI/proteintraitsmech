  summary: PMID 17715131 reports HPO successive C2 hydroxylation and oxidation to
    solavetivone, and compares its C2 preference with the distinct EAH C1/C3 activity.
    Mutagenesis improves HPO catalytic efficiency without changing its regio/stereoselectivity.
    The EAH reaction is not attributed to HPO. A6YIH8 is the Hyoscyamus muticus 502-residue
    protein (taxon 35626); its focal catalytic annotations cite ECO:0000269/17715131,
    while heme assignment is similarity-based.
  evidence_ids:
