    5-epi-aristolochene hydroxylation,57676 4-epi-eremophilene hydroxylation. The
    graph explicitly states that only the first three are shown, so the fourth is
    not an undisclosed omission. Its introductory GO-equivalence promise is inconsistent
    with the actual empty GO node/edge set and bounded captured EC2GO lookup.
  evidence_ids:
