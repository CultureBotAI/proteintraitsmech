limitations:
- This is a read-only scientific review; no trait, mapping, example, graph or status
  was edited.
- Literature coverage is the complete delivered indexed abstracts and bibliography
  metadata; linked full articles were not read.
- Shared immutable source captures retain original HTTP dates and release identity;
  current per-target source selections were read separately.
- RDF balance concerns defined chemicals and reactive groups with an unchanged symbolic
  protein remainder, not a molecular formula for a whole protein.
- Protein FUNCTION, catalytic and cofactor evidence codes are kept distinct. Current
  UniProt inspection and a clean semantic audit do not qualify the imported CURATOR
  example.
- Provenance searches included ignored files only within scripts, conf, data/mappings
  and history; no absence claim covers raw releases or other checkouts.
