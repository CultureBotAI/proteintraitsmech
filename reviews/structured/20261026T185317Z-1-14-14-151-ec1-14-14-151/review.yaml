  summary: The class oxidizes premnaspirodiene, also named (-)-vetispiradiene, to
    solavetivone through successive C2 oxidations. CYP71D55/HPO are documented enzyme
    aliases; preserve their source context without generalizing one protein to all
    proteins. The species spelling in one inherited synonym needs correction.
