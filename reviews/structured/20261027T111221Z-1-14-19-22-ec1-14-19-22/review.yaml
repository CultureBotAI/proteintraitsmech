limitations:
- IUBMB describes a fixed omega-6 rule, whereas P46313 FUNCTION and PMID 8685264 report
  C16:1 to C16:2 delta9,12 products, an omega-4 endpoint. This source-scope tension
  is retained without rejecting the explicit focal EC/Rhea assignment or resolving
  every substrate preference from an abstract.
- The yeast product abstract does not identify the substrate carrier for every reaction.
  Current additional CoA catalytic annotations are positive source annotations with
  separate references, not evidence that all historical activity names are exact synonyms
  of the focal glycerolipid class.
- Formal balance uses the R-group chemical class and the unchanged generic protein
  remainder; it does not determine whole-protein formulas or validate residue typing.
- Literature reading covers complete delivered indexed bibliography, abstracts, publication
  types and correction lists. No full original article, supplementary figure, sequence-residue
  inspection or undeclared API field is claimed.
- No trait edit, human sign-off or publication is performed.
