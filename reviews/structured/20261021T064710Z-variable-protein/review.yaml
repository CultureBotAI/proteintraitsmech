- assessment_id: definition
  area: evidence
  topic: Definition and nearest source support
  outcome: concern
  evidence_ids:
  - record
  - owner
  - consurf
  summary: The definition and exact fast-evolving synonym describe sequence change,
    while evolutionary_scope defines low cross-taxon retention. ConSurf measures evolutionary
    rates at homologous positions; low presence breadth is a different measurement.
    A variable region also does not identify an entire protein class without an explicit
    whole-protein membership rule.
  target_ids:
  - proteintraitsmech:EVO_VARIABLE
- assessment_id: representation
  area: representation
  topic: Metric, method and scope completeness
  outcome: concern
  evidence_ids:
  - record
  - schema
  - consurf
  summary: The sole conservation_metric is presence-breadth. It cannot express substitution-rate
    variation or a region-level score. No comparison panel, rate estimator or aggregation
    rule is asserted. An intentionally generic scope is acceptable; conflating metrics
    is the substantive problem.
  target_ids:
  - proteintraitsmech:EVO_VARIABLE
- assessment_id: hierarchy
  area: scope
  topic: Hierarchy and equivalence boundaries
  outcome: concern
  evidence_ids:
