findings:
- issue_key: evo-variable-retention-rate-region-conflation
  category: representation
  severity: major
  title: Presence breadth, sequence rate and region variability are conflated
  description: The explicit low-retention metric conflicts with the fast-evolving/hypervariable
    definition and exact synonyms. In addition, a variable region is a subprotein
    object, not automatically an equivalent whole-protein class. The record does not
    declare a rule connecting those scopes.
  field_paths:
  - definition
  - synonyms
  - evolutionary_scope.conservation_metric
  evidence_ids:
