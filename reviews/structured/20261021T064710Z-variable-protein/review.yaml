  description: 'Adjudicate EVO_VARIABLE in scripts/seed_evolution.py: retain one declared
    metric and entity scope, narrow the definition/synonyms to it, and propose separately
    identified rate-based or region-based traits only if needed. Preserve distinctions
    from EVO_CONSERVED and use the audited generation route after authorization.'
  finding_ids:
