  acceptance_checks:
  - All exact synonyms denote the same entity scope and same measurable property as
    conservation_metric.
  - A broadly retained but rapidly evolving homolog does not receive a low-presence-breadth
    label solely because of its substitution rate.
  - A protein containing one variable region is not equated with the region without
    an explicit membership rule.
  - Run just validate-all data/traits/evolution/conservation/variable-protein.yaml.
limitations:
- This is a generic class review, not a species-level distribution estimate or qualification
  of any protein.
- The record cites project curation rather than a versioned primary bibliography.
  This review records external support without changing the target.
- No individual protein sequence, alignment, substitution estimate or taxon panel
  was evaluated.
