  its oxidative-decarboxylation wording is not substituted for the balanced stored
  reaction.
- The HspB FAD comment uses ECO:0000305, while its function and reaction carry experimental-source
  annotations. Proposed Cys218 mechanism details in PMID 38415602 include computational
  inference.
- Genome, induction and PDB submission references are not additional complete activity
  assays. EMBL/RefSeq links and HspA alternative-initiation annotation were inspected,
  but sequence residues were not independently retrieved.
- Literature reading covers complete delivered indexed bibliography, abstracts or
  explicit nulls and correction lists. No full article, figure, sequence-residue inspection
  or undeclared API field is claimed.
