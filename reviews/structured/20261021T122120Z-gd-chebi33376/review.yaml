  summary: 'PMID:35369483; DOI:10.3389/fmicb.2022.820327. The evo-HLn strain derives
    from MDH-3 lacking MxaF and XoxF methanol dehydrogenases, while retaining ExaF.
    Mutation reconstruction supports the Gd-growth phenotype. The study reports cell-extract
    MDH activity and attributes its increase primarily to ExaF: Gd-grown evo-HLn activity
    was about fourfold below La-grown evo-HLn yet fourfold above ancestral MDH-3 grown
    with La. Wild-type growth with Gd was attributed to calcium-dependent MxaFI, not
    ExaF. These results are positive evolved-strain/ion-context evidence, not purified
    Gd-ExaF metal occupancy, neutral Gd dependence or any support for terbium CHEBI:33376.'
