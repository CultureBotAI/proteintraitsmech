limitations:
- Review of exact current target and declared local/source scopes; no exhaustive literature
  search or full-article reading.
- Shared ENZYME, Rhea, classification, relation and mapping captures retain their
  original October 21 acquisition metadata; every other source retains its own recorded
  acquisition date.
- Net-reaction and ontology correspondence do not establish catalytic intermediates,
  species-specific physiological direction, direct assay for every member, or qualification
  of a selected protein.
- Optional detection methods, sequences and additional graphs are not required merely
  because absent. Native schema/history/graph success is separate from scientific
  support.
- P52183 and P12260 whole provider bodies were read. P00488 was read in exact declared
  complete functional/identity/sequence/selected-feature/reference/GO parents, not
  as a whole provider document.
- No conclusion of P12260 experimental catalytic competence is drawn from the fragment
  entry; no selected protein was qualified or promoted.
- IUBMB uses a broader alkylamine reaction and historical protein-specific comments;
  Rhea/GO support the selected lysyl-protein branch. ENZYME alternative names are
  treated as source aliases, not evidence that every alternate term has identical
  substrate scope.
