  topic: Defining representation and axis/category
- area: consistency
  outcome: concern
  summary: The current GO definition includes both reaction branches with the same
    explicit carrier convention, consistent with the EC/Rhea scope. IUBMB, protein
    names and the focal literature use CYP93C, whereas the target faithfully inherits
    CYT93C from ENZYME. GO labels isoflavonoid synthase a broad synonym while the
    EC authorities list it as an alternative name; this source-specific qualifier
    is documented without treating the broad historical name alone as a second proven
    defect.
