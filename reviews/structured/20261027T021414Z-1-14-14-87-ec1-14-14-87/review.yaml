  assessment_id: assessment-4
  topic: Causal mechanism evidence
- area: representation
  outcome: supported
  summary: FUNCTION/FUNC_ENZYMATIC_ACTIVITY/CLASS correctly denotes a reusable enzymatic
    activity. The sourced general layer follows the EC parent hierarchy and the MECHANISTIC
    layer reproduces net reaction text; neither is a sequence classifier nor a residue-level
    mechanism. No profile signature, universal family classifier or localization annotation
    is inferred.
  evidence_ids:
