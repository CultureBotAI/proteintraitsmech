assessments:
- area: identity
  outcome: supported
  summary: The accepted EC 1.14.14.87 class forms 2-hydroxyisoflavanones from (2S)-liquiritigenin
    or (2S)-naringenin, with aryl migration from C2 to C3. The Rhea branches preserve
    the hydroxylated intermediates rather than substituting the later isoflavones
    daidzein or genistein. The direct EC parent and FUNCTION enzymatic-activity placement
    are appropriate. CYT93C is a source-propagated spelling discrepancy against CYP93C.
  evidence_ids:
  - target
  - iubmb
  - expasy
  - enzyme
  - enzclass
  - rhea2ec
  - seed-owner
  target_ids:
  - EC:1.14.14.87
  assessment_id: assessment-1
  topic: Source identity and protein-trait scope
- area: grounding
  outcome: supported
  summary: 'Glycyrrhiza echinata Q9SXS3/CYP93C2 has direct ECO:0000269 support for
    both Rhea reactions, including PMIDs 10557230, 12207646 and 15809082. Soybean
    Q9SWR5/CYP93C1 has directly supported FUNCTION text from PMID 10375412, but its
    two current catalytic-reaction annotations are ECO:0000250 transfers from Q9SXS3.
    Glycyrrhiza uralensis G4XV71 carries transferred FUNCTION and catalytic annotations
    from Q9SXS3 and remains at transcript-level protein-existence evidence. Those
    differences are retained: a reviewed UniProt entry is not itself proof that both
    reactions were directly assayed for every accession. All three stored examples
    remain unqualified legacy associations.'
  evidence_ids:
  - target
  - enzyme
  - grounding-policy
  - schema
  - protein-Q9SWR5
  - protein-Q9SXS3
  - protein-G4XV71
  - paper-12207646
  - paper-10375412
  - paper-2226805
  - paper-3956488
  - paper-15809082
  - paper-10557230
  target_ids:
  - EC:1.14.14.87
  assessment_id: assessment-2
  topic: Source grounding and trait associations
- area: evidence
  outcome: supported
  summary: PMID 10557230 reports expressed CYP93C2 converting both flavanones into
    products that yield isoflavones after acid treatment. PMID 10375412 reports soybean
    expression and isoflavone formation, with the unstable intermediate inferred at
    that abstract's scope. PMIDs 2226805 and 3956488 distinguish the P450/NADPH-dependent
    hydroxylated intermediate from subsequent dehydration. PMIDs 12207646 and 15809082
    examine CYP93C2 mutations affecting aryl migration, hydroxylated byproducts and
    folding; these enzyme-specific positions are not promoted into universal class
    residue nodes. Indexed abstracts and specified protein fields, not full papers,
    were read.
  evidence_ids:
  - target
  - rhea-rdf
  - iubmb
  - protein-Q9SWR5
  - protein-Q9SXS3
  - protein-G4XV71
  - paper-12207646
