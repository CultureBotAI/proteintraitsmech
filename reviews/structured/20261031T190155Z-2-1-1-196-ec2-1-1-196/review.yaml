limitations:
- Entire indexed MED envelopes were read; linked full articles, supplements, coordinate
  files and raw experimental data were not inspected.
- Chemical reading covers seven declared fields; the separate shared hydron policy
  scope includes its default structure.
- Cobalt-precorrin C15 methylation and coupled decarboxylation are supported. O87694
  is a bifunctional CbiET with direct provider attribution; O29526 and Q9HPN4 retain
  probable CbiT homology-based annotations.
- The complete molecular balance is C59 H70 Co1 N10 O21 S1 with charge -6 on each
  side, including the emitted CO2. CHEBI:70791 and Rhea agree on C44H50CoN4O14 and
  charge -6 despite the ChEBI name saying cobalt-precorrin-7(7-); that is a provider-internal
  name/charge discrepancy, not a target balance failure.
- Ignored-inclusive provenance searches cover owned scripts, conf, data/mappings and
  history only; no global absence of human approval is asserted.
- SAM node-type precision does not change reaction chemistry. RNA nucleotide positions
  are not coordinates in an enzyme protein.
- CbiET bifunctionality and CbiT homology are kept separate; genomic or family evidence
  is not an isolated current-sequence assay.
- The GO0043776 C5/omitted-CO2 prose and ChEBI70791 name/charge conflict are upstream
  context limitations. Positive source identifiers and balanced target chemistry remain
  preserved.
- The absent-GO finding concerns the current introduction only; optional GO content
  is not required.
- All nine initial UniProt HTTP 500 captures and the nine successful same-URL retry
  1 captures remain separate immutable evidence. HTTP failures are not biological
  absence.
