- issue_key: ec-1-6-5-6-automatic-reviewed-promotion
  category: provenance
  severity: major
  certainty: confirmed
  title: Graph generation does not establish curator sign-off
  description: The current July 30 LLM-assisted graph event explicitly promoted SEEDED
    to REVIEWED, and the maintained graph builder implements that automatic transition.
    The schema defines REVIEWED as curator sign-off on label, definition and parents.
    The observed route does not establish that sign-off; this is not a global assertion
    that no human ever reviewed the record.
