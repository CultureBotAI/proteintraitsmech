limitations:
- Entire delivered indexed MED envelopes were read; full articles, linked comments/errata/preprints
  and experimental coordinate files were not inspected. Database annotations, source
  association and exact-accession experiments are distinguished.
- A balanced source reaction is a net chemical relation; it does not establish an
  elementary catalytic mechanism, every physiological substrate, or membrane-transport
  coupling.
- This scientific review does not edit traits, confer curator sign-off or publish
  content. Native validation and saving are recorded separately by the executor.
