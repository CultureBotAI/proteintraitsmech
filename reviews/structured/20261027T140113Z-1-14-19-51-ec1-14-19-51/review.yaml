limitations:
- Research-paper evidence is limited to delivered indexed abstracts, citations, publication
  types and correction fields; no full research article or supplementary assay material
  was read.
- Generic carrier/reactive-part balances do not identify physiological partner sequences
  or provide whole-protein formulas.
- UniProt review status, family annotation and ENZYME DR membership are distinct from
  independently qualified protein occurrences; no qualification or human sign-off
  is implied.
- GO uses NADPH/H+ whereas Rhea resolves CPR-bound FMNH2/FMN. Donor and protonation
  conventions must not be equated without an explicit transformation.
- IUBMB omits two product protons printed by ENZYME and Rhea. This is an upstream
  equation difference, not an imbalance in the stored graph.
- Secondary substrate activities recorded for the example do not invalidate the accepted
  (S)-reticuline class.
- The provenance searches cover only their named checkout directories, including ignored
  files; they do not establish global absence.
