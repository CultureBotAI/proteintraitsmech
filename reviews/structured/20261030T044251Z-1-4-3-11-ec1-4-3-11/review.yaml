limitations:
- PMID 30631897 names six best substrates including lysine but not glutamate; the
  glutamate assignment is separately credited to the current source-native catalytic
  annotation.
- A0A1B1PF34 FAD/site/location annotations transferred from Q8L3C7 are ECO:0000250,
  while the directly assayed catalytic activity is ECO:0000269.
- Precursor, protease-treated, mature and engineered forms have distinct measured
  properties; mutation effects and processed-enzyme kinetics are not silently transferred
  to the unmodified precursor.
- The 1983 Q8L3C7 reference and additional annotated structural/mutagenesis references
  were read as complete current UniProt reference objects, not as their full papers.
- Whole target and ancestor records, selected local defining fields and all local
  edge/evidence arrays were read. Neighboring local graph nodes/descriptions/examples/history
  were excluded. Complete normalized IUBMB texts, whole GO responses, recursive mapped
  Rhea closures, selected ChEBI fields, complete focal comments/references/features
  and GO/family crossreferences, and all 13 complete delivered indexed response envelopes
  were read. Sequence residues, other database crossreferences and extra API fields
  were excluded; linked articles were not read.
- No trait edit, human sign-off or publication is performed.
