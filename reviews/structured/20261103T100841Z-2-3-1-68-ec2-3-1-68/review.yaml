- issue_key: legacy_example_provenance
  category: provenance
  severity: minor
  title: Distinguish automatic DR import from curator selection and assay evidence
  description: 'CanonicalExample.source describes the selection or promotion route;
    CURATOR means a curator-picked archetype and does not encode an assay tier. These
    examples carry CURATOR with a DR cross-reference note, while scripts/seed_ec.py
    automatically selects rec[''dr''][:3] and emits that value. This is a mismatch
    between the documented route and the maintained import, independent of whether
    an accession has direct experimental support. Separately, the enables edges cite
    the shared ENZYME DR line and omit accession-specific support: GLYATL1 has direct
    phenylacetyl-CoA/glutamine evidence, whereas GLYATL1B is putative and assigned
    by similarity. DR membership and positive primary observations remain supported.'
