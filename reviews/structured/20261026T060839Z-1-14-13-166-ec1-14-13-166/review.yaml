limitations:
- The current NpcA/NpcB bibliography mixes SAO101 sequence/system evidence with JS905
  biochemical system evidence. Experimental-source annotation codes do not make every
  cited experiment specific to each accession.
- NpcB is the reductase component. Positive enables/system association is preserved
  without asserting standalone oxygenase sufficiency or treating the component as
  inactive.
- IUBMB displays an additional hydron compared with the explicit Rhea/ENZYME and GO
  species equations. The stored charged species balance; no undocumented proton correction
  or global identity conflict is inferred.
- Hydroxyquinol in coupled-system abstracts and benzoquinone intermediates in other
  organisms are not collapsed into a single isolated reaction assay. The WBC-3 PnpA/PnpB
  abstract is contextual to the Rhodococcus examples.
- Literature reading covers complete delivered indexed bibliography, abstracts or
  explicit nulls and correction lists. No full article, figure, sequence-residue inspection
  or undeclared API field is claimed.
- No trait edit, human sign-off or publication is performed.
