findings:
- issue_key: uniprot-keyword.KW-0704.lysine-only-linkage-definition
  category: scope
  severity: major
  title: Definition omits source-supported pyruvoyl-mediated Schiff bases
  description: The target describes a Schiff linkage between enzyme lysine amino and
    substrate carbonyl groups. Source-annotated human AMD1 P17707 carries this keyword,
    while its accession-linked primary study identifies substrate Schiff-base formation
    through the enzyme pyruvoyl moiety. The specific mechanism asserted as the class
    explanation is therefore incomplete. This does not claim the protein can never
    form any other linkage or that it lacks trait membership.
  evidence_ids:
  - record
  - keyword
  - chemical
  - protein-context
  - primary-mechanism
  - owner
  normalization_reason: The class definition materially restricts the linkage mechanism
    despite a source-annotated and accession-linked primary example of another defining
    linkage.
