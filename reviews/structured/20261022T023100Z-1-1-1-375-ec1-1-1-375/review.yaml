limitations:
- Shared official responses are digest-verified reuses with their original URLs and
  access times. Current ENZYME, mapping and Rhea agreement does not prove the historical
  source release or human review of this record.
- Reading covers the entire target and recursive-parent class fields, scoped captured
  local-reference fields, exact source stanzas/mapping rows, complete material RDF
  subjects, chemical material fields and the stated publication scope. Extraction
  of the entire archive is not scientific review of every reaction.
- 'Seventeen indexed publication bodies were inspected across these three reviews:
  sixteen complete delivered abstracts and one bibliography-only record. The review
  article is explicitly context rather than primary experimental support. No primary
  full article, supplement or complete citation chain was inspected. Each record cites
  its own material subset.'
- Source chemical formulas and reaction coefficients do not establish universal bound
  microspecies, substrate populations, physiological flux or kinetic limits. External
  ChEBI pH, organism and other unused annotations are not imported into the target
  as experimental claims.
- Swiss-Prot reviewed status, Rhea approval and ENZYME DR membership do not confer
  native human sign-off or new example qualification. Optional fields remain optional.
- The status finding follows positive target history and maintained writer behavior,
  not a global negative search for every possible past human review. The author performs
  no native gates or saves; actual root operations are recorded separately.
- For EC 1.1.1.375, the Rhea bibliography is broader than a direct assay of MJ0490.
  PMID12013276 is a review; 11451450 describes a distinct archaeal enzyme-family stereochemical
  result and is not used to assign hydride-face specificity to Q60176. The FBP-activated
  LDH result in 11292347 is retained alongside current UniProt’s negative statement
  and earlier negative assays, without choosing a universal condition-independent
  answer. The source’s sulfolactate S/R naming correction is explicit. No full papers
  or physiological flux reconstruction were inspected.
