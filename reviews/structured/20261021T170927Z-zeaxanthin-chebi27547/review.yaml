- action_id: A1
  description: Repair the maintained emitter so CHEBI:27547 is not emitted as an equivalent
    protein-trait identifier. Preserve chemical provenance; moving the same assertion
    blindly into mapped_xrefs does not repair its meaning. Retain positive zeaxanthin-associated
    photophysical function and adjudicate the exact protein activity before assigning
    a typed optional role; binding or a source cofactor tag alone is not a universal
    requirement. Use an optional typed association only after its activity-relative
    role and exact chemical scope are justified. If no supported representation is
    available, retain the provenance and explicit uncertainty rather than inventing
    a participant or qualified protein example.
