findings:
- issue_key: chebi.cofactor-requirement.CHEBI-27547.chemical-entity-equivalence
  category: grounding
  severity: major
  certainty: confirmed
  title: Chemical entity is asserted as equivalent to a protein requirement class
  description: The local identifier and requirement definition denote a protein trait,
    whereas CHEBI:27547 denotes the inspected chemical entity. The xrefs field asserts
    true own-source equivalence, so this association is encoded with the wrong semantics.
    Retain positive zeaxanthin-associated photophysical function and adjudicate the
    exact protein activity before assigning a typed optional role; binding or a source
    cofactor tag alone is not a universal requirement.
  field_paths:
  - xrefs
  - chemical_participants
  evidence_ids:
  - record
  - schema
  - owner
  - chemical
  - ontology
  - cp29-photophysics
  - cp26-photophysics
  - ocp-specificity
  normalization_reason: True-equivalence grounding materially conflates different
    denotations. Positive chemical identity or activity evidence can support an association
    without making the molecule or ion identical to a protein-trait class.
  finding_id: F1
  status: open
  target_ids:
  - proteintraitsmech:COFACTOR_REQ_CHEBI_27547
  owner_paths:
  - path: scripts/seed_chebi_cofactor.py
    repository: CultureBotAI/proteintraitsmech
    role: Maintained ChEBI role parser, requirement-class synthesis, hierarchy selection
      and YAML emitter
  rule_id: ProteinTraitRecord field checklist
  native_severity: major
