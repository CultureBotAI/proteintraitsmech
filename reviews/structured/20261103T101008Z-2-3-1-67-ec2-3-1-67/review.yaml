limitations:
- PMC2224237 returned HTTP500 with a 150-byte error JSON, so no full text was attained.
  The complete CORE18156367 remains available and its abstract is the paper scope
  used here; no retry or alternative acquisition occurred.
- The complete CORE41740885 reports LPLAT10/LPEAT2 unsaturated sn-1 phospholipid production
  and in-vitro lysophospholipid acylation. It does not itself state a tested negative
  acetyl-CoA result; the negative lyso-PAF assertion remains provider-attributed.
- Current missing DR memberships do not establish when an annotation changed or biological
  absence. Frog EC67 annotation is not treated as an isolated-enzyme assay. Other
  LPCAT family papers do not directly validate these selected accessions.
- The dated catalogue has no exact selected MID host match; no gene search, membership,
  expression or catalytic absence is inferred.
- ROOT separately performed acquisition and native checks. This scratch scientific
  review supplies no HUMAN sign-off, operational action or publication authorization.
