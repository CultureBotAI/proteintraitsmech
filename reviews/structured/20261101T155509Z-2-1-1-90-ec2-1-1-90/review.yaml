limitations:
- Retained release, mapping and relation snapshots preserve original metadata UTCs;
  current endpoint capture does not establish a new bulk release.
- Native structural checks, source mappings and evidence codes do not constitute independent
  experimental replication or human sign-off.
- Bounded provenance search includes ignored files in scripts, conf, data/mappings
  and history only; raw releases and sibling checkouts are outside its scope.
- UniProt reading covers complete declared identity/comments/references/GO parents,
  not sequence/features or incidental non-GO cross-references.
- Purified bound-carrier and recombinant free-cobalamin abstract reports are distinguished;
  no full primary method, image or supplement is claimed.
- GO 0047152 current free-cofactor/Co(I) product wording conflicts with current bound-carrier
  Co(III) chemistry; the upstream mapping is preserved as provenance.
