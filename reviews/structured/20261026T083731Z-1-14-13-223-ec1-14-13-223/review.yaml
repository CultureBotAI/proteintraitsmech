limitations:
- This agent review is not human sign-off and changes no trait, status or history.
- Reused captures retain original URLs, body hashes and access times; they are not
  fresh downloads.
- Only declared source scopes, recursive RDF projections and indexed abstracts/bibliography
  were read; no whole archive, whole UniProt, sequence or full-paper claim.
- Legacy DR examples are not newly qualified release-pinned sequence-coordinate occurrences.
- Bounded ignored-inclusive searches do not establish global absence of historical
  approval.
- Formal atom/charge balance is representation consistency, not experimental proof.
- Carrier-bound substrate chemistry and reactive-part mass balance do not establish
  a complete protein formula or a particular sequence residue coordinate.
- Primary abstracts were read; published kinetic values remain at the database-annotation
  tier.
