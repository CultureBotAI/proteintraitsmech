- issue_key: EC.1.1.1.443.automatic-reviewed-status
  category: provenance
  severity: major
  certainty: confirmed
  title: Automatic graph generation asserts human-reviewed lifecycle status
  description: The current EC 1.1.1.443 record is REVIEWED and its LLM-assisted edison-causal-graphs
    event explicitly records SEEDED to REVIEWED. The maintained graph writer performs
    that replacement after machine graph construction without a human-sign-off prerequisite.
    This conflicts with the schema and review checklist meaning of REVIEWED. The finding
    establishes a positive automated promotion defect, not global absence of historical
    human activity.
