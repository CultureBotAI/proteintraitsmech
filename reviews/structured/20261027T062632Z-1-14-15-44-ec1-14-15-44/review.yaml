- area: evidence
  outcome: supported
  summary: The legacy Q9NGX9/CP302_DROME association resolves to reviewed Drosophila
    melanogaster Dib/CYP302A1, 489 aa, entry 166/sequence 2. Its current catalytic
    annotation supports Rhea 82055 with PMID 12177427. That study transfects dib into
    Drosophila S2 cells and detects conversion of 2,22-dideoxyecdysone to 2-deoxyecdysone,
    with product migration and subsequent metabolism supporting identity. It does
    not directly assay the two 3-dehydro reactions for this accession. The paper also
    finds 22-deoxyecdysone is not metabolized by Dib-transfected cells, emphasizing
    substrate specificity. PMID 16503480 concerns Manduca homolog characterization/expression;
    PMID 17628274 examines comparative evolution; PMID 20837145 is explicitly a review
    of crustacean ecdysteroid metabolism. These references provide class/pathway context
    but are not interchangeable direct assays of all three reactions in Drosophila
    Dib. Retain the supported legacy association without sequence qualification or
    transfer of every class reaction to this protein.
  evidence_ids:
  - target
  - enzyme
  - protein
  - grounding-policy
