- check_id: source-resolution
  name: Source reference inspection
  status: passed
  required: true
  summary: 'The accepted 3-dehydro-2,22-dideoxyecdysone 22-hydroxylase label denotes
    an EC activity class that also includes other ecdysteroid 22-hydroxylations. ENZYME/IUBMB
    and current GO 0042767 support this broader scope. Rhea 82055, 83295 and 83299
    are retained as three individually scoped reactions; the accepted name is not
    a reason to collapse them or to assign every substrate to every protein exemplar.
    The legacy Q9NGX9/CP302_DROME association resolves to reviewed Drosophila melanogaster
    Dib/CYP302A1, 489 aa, entry 166/sequence 2. Its current catalytic annotation supports
    Rhea 82055 with PMID 12177427. That study transfects dib into Drosophila S2 cells
    and detects conversion of 2,22-dideoxyecdysone to 2-deoxyecdysone, with product
    migration and subsequent metabolism supporting identity. It does not directly
    assay the two 3-dehydro reactions for this accession. The paper also finds 22-deoxyecdysone
    is not metabolized by Dib-transfected cells, emphasizing substrate specificity.
    PMID 16503480 concerns Manduca homolog characterization/expression; PMID 17628274
    examines comparative evolution; PMID 20837145 is explicitly a review of crustacean
    ecdysteroid metabolism. These references provide class/pathway context but are
    not interchangeable direct assays of all three reactions in Drosophila Dib. Retain
    the supported legacy association without sequence qualification or transfer of
    every class reaction to this protein. All 32 edges correspond mechanically: 21
    reaction participants, 6 reactive-part links, 3 EC-to-Rhea narrower mappings,
    1 ec2go association and 1 ENZYME protein association. Each of the three reaction
    nodes has its own directional inputs/outputs, preventing substrate sets from being
    merged at the class node. Rhea 82056, 83296 and 83300 are the respective left-to-right
    forms. Current GO 0042767 includes the represented activities, supporting the
    existing close mapping at the class level. The six Fe2S2 groups in generic adrenodoxin
    are chemical cofactors incorrectly typed RESIDUE; adrenodoxin is separate from
    enzyme heme and the graph does not establish a specific physiological partner.
    Each of the three reactions consumes two reduced adrenodoxin reactive parts, O2
    and two hydrons and produces the corresponding 22-hydroxylated steroid, two oxidized
    parts and water. Rhea 82055 transforms C27H44O4 to C27H44O5, balancing C27H46Fe4O6S4/charge
    +4. Rhea 83295 transforms C27H42O4 to C27H42O5, balancing C27H44Fe4O6S4/charge
    +4. Rhea 83299 transforms C27H42O3 to C27H42O4, balancing C27H44Fe4O5S4/charge
    +4. The totals include reactive parts and equal symbolic carrier remainders, not
    whole protein formulas.'
