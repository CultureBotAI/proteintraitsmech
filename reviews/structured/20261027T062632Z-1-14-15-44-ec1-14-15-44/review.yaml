- area: consistency
  outcome: supported
  summary: Each of the three reactions consumes two reduced adrenodoxin reactive parts,
    O2 and two hydrons and produces the corresponding 22-hydroxylated steroid, two
    oxidized parts and water. Rhea 82055 transforms C27H44O4 to C27H44O5, balancing
    C27H46Fe4O6S4/charge +4. Rhea 83295 transforms C27H42O4 to C27H42O5, balancing
    C27H44Fe4O6S4/charge +4. Rhea 83299 transforms C27H42O3 to C27H42O4, balancing
    C27H44Fe4O5S4/charge +4. The totals include reactive parts and equal symbolic
    carrier remainders, not whole protein formulas.
