  topic: Source identity and protein-trait scope
- area: grounding
  outcome: supported
  summary: EC ancestry and the selected Rhea mappings support class-level function
    identity. Top-level mapped_xrefs without predicates assert mapping-defined relatedness.
    Selected neighboring defining fields corroborate the associations; their full
    graphs and histories were not reviewed.
