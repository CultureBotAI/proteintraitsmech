- area: representation
  outcome: supported
  summary: This is a reaction-defined enzymatic function class. EC/Rhea identity and
    chemical participants are appropriate; broad P450 family membership alone is not
    an activity detector. No executable signature, sequence coordinates, residue-level
    mechanism or genomic occurrence is asserted. The net graph does not constitute
    a complete catalytic mechanism.
