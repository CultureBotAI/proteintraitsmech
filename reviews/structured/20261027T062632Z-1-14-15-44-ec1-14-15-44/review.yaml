  assessment_id: assessment-3
  topic: Class-level evidence and scientific scope
- area: graph
  outcome: concern
  summary: 'All 32 edges correspond mechanically: 21 reaction participants, 6 reactive-part
    links, 3 EC-to-Rhea narrower mappings, 1 ec2go association and 1 ENZYME protein
    association. Each of the three reaction nodes has its own directional inputs/outputs,
    preventing substrate sets from being merged at the class node. Rhea 82056, 83296
    and 83300 are the respective left-to-right forms. Current GO 0042767 includes
    the represented activities, supporting the existing close mapping at the class
    level. The six Fe2S2 groups in generic adrenodoxin are chemical cofactors incorrectly
    typed RESIDUE; adrenodoxin is separate from enzyme heme and the graph does not
    establish a specific physiological partner.'
  evidence_ids:
