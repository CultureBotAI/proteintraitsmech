limitations:
- This is an agent review of exact captured working-tree bytes, not independent human
  sign-off or permission to promote scientific status, qualify new protein examples,
  curate records or publish.
- Native closed-schema, graph and history checks establish deterministic integrity
  only. They do not prove all source-derived activity claims or residue mechanisms.
- Retained shared-source and chemical captures keep their original UTC timestamps
  and release context; a current extraction is not a new download. Source-specific
  licenses remain separate.
- Bounded provenance searches included ignored files in scripts, conf, data/mappings
  and history; raw release trees and sibling checkouts were outside those searches.
  No global absence claim is made.
- The complete PMID18223037 abstract was read, but no full article was successfully
  captured. The publisher challenge and failed browser continuation are access limitations;
  no retries or bypass were used.
- The major OMT2 finding confirms disagreement between current provider attribution
  and the cited abstract. It does not determine the underlying assay product by independent
  full-text analysis or declare OMT2 globally inactive.
- Active-site and binding-site annotations are rule-based. Other provider localization/review
  citations were not separately acquired as primary experiments; no detailed residue
  or physiological localization mechanism is inferred.
