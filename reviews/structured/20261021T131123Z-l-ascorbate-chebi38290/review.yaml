  summary: CHEBI:38290 resolves to L-ascorbate, C6H7O6, charge −1, with the L stereochemistry
    and a single deprotonated enediol oxygen. Its definition identifies selective
    3-hydroxy deprotonation of L-ascorbic acid and states a requirement for essential
    metabolic reactions in all animals and plants. Direct cofactor, human-metabolite
    and Daphnia-magna-metabolite roles are asserted, with ascorbate and vitamin-C
    structural parents and conjugate-base relation to CHEBI:29073. Traditional ascorbic-acid
    numbering and the systematic furan name are different numbering conventions, not
    evidence of an incorrect deprotonation site.
