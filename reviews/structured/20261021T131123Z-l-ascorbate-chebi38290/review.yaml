limitations:
- The reviewed record does not identify the exact ChEBI source release used for the
  seed. Current official responses are comparison snapshots, not proof of the original
  release.
- A ChEBI chemical-role assertion supplies candidate class context, not evidence that
  a particular protein requires that chemical, that every related protein does, or
  that the chemical is an obligatory physiological cofactor. No such per-protein qualification
  is claimed.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- The myrosinase primary study was inspected through its complete indexed abstract,
  not the full coordinates. The complete Arabidopsis main text, tables and figure
  captions were inspected, but not supplementary files. The study's total-ascorbate
  assay and acid supplementation do not resolve exact intracellular or protein-bound
  acid/base populations; its species and growth-condition bounds remain explicit.
- The universal all-animals-and-plants wording is verified as a current source assertion,
  not independently certified across all taxa. Source-linked reviews and pharmacological/glycation
  experiments were read for citation scope and are not used as proof of universal
  metabolic necessity.
