  locator: Verified bibliographic identifiers and complete indexed abstract; full
    experimental paper not inspected through this response
  summary: PMID:10978344; DOI:10.1074/jbc.M006796200. High-resolution myrosinase complexes
    and reactivation measurements support ascorbate-assisted catalysis. The ascorbate
    site is distinct from the glucose site and overlaps the aglycone region; water
    positioning and kinetic reactivation support a catalytic-base role. This is positive
    non-redox cofactor context, without determining every ligand hydrogen or asserting
    that every ascorbate interaction is required.
- evidence_id: plant-primary
  kind: primary_source
  reference: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4943039/fullTextXML
  accessed_at: '2026-10-21T13:04:34.783388Z'
  snapshot_sha256: 3e79c428aae3b044fa3fc8a0c5b4f53573f8d69c4b99b966e890a1ffcd90c9c7
  support: supports
  locator: Complete primary main text, Methods, Results/Discussion, tables and figure
    captions, especially double-mutant Results and Figure 4; supplements not inspected
  summary: PMID:27468291; DOI:10.3389/fpls.2016.01025. In Arabidopsis Col-0 backgrounds,
    vtc2-4;vtc5 double mutants had undetectable total ascorbate, seedling lethality
    and rescue by ascorbate supplementation; Figure 4 specifies 0.5 mM L-ascorbic
    acid. Single vtc2-4 mutants retained roughly 30% of wild-type ascorbate with much
    less growth impairment than the cryptic-mutation-containing vtc2-1 line. This
    supports a bounded positive physiological requirement, not all species or a specific
    non-substrate protein requirement. The assay measured ascorbate plus dehydroascorbate.
