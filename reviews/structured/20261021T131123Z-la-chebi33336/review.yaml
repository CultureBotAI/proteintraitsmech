- This alignment-selected candidate comes from the maintained MicroGrowAgents alignment
  emitter and locally captured crosswalk. The exact external source-table release
  and its independent licensing were not inspected, and no sibling checkout was accessed.
  Current ChEBI outgoing relations have no direct cofactor-role edge for this atom;
  this bounded database observation does not prove that all biological roles are absent.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- The XoxF study was inspected through its complete indexed abstract plus official
  structural-entry and CCD metadata. No coordinate-level geometry analysis, exhaustive
  neutral-lanthanum literature survey or canonical protein qualification was performed.
  Current source-role absence and ionic enzyme activity do not establish a universal
  negative about neutral-lanthanum biology.
