  category: nomenclature
  severity: minor
  title: Broad source category is stored as a target synonym
  description: The aligned record stores metals as a MicroGrowAgents RELATED_SYNONYM
    alongside lanthanum. The captured crosswalk and build_aligned show that metals
    is the shared category token, not an alternate name for this element or its protein-requirement
    class. RELATED_SYNONYM is broader than exact synonymy, so this is a bounded naming/provenance
    defect, not a false exact-equivalence claim or a wrong-element identity.
