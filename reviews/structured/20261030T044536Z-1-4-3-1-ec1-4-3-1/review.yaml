limitations:
- Net reaction balance is not a complete elementary mechanism or a universal sequence-family
  detector.
- Database evidence codes, comparative assays, transfer annotations and individual
  constructs remain distinct.
- Linked bibliography does not imply full article reading; no main article text was
  acquired.
- A8WXM1 catalysis is transferred from Q19564 and its Tyr221/Phe caution is retained.
  No direct recipient assay or loss of activity is inferred. Maize evidence concerns
  an MBP fusion; porcine kinetic properties are class context, not focal-protein attributes.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Current class and focal annotation checks are complete. Catalogue selection, direct
  experimental support, construct scope and transferred associations remain separate.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
