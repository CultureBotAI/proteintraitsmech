- area: evidence
  outcome: supported
  summary: The current 386-aa Zea mays entry has protein-level existence and experimentally
    tagged D-amino-acid, D-alanine and D-aspartate oxidation annotations tied to PMID19267668.
    That complete abstract reports a purified maltose-binding-protein fusion that
    oxidizes D-alanine and D-aspartate but not D-leucine, D-isoleucine or D-serine
    under the tested conditions. This directly supports a bounded D-aspartate association,
    not universal D-amino-acid specificity. Nutrient-use function transfers from Q9HGY3;
    current sequence-conflict annotations are retained without inferring that every
    deposited sequence or untagged preparation was tested. The current 334-aa Caenorhabditis
    elegans DDO-1 entry has protein-level existence and experimentally tagged D-aspartate
    and D-glutamate oxidation. The complete PMID20564561 abstract compares recombinant
    C47Ap/DDO-1, F18Ep/DDO-2 and F20Hp/DDO-3; all three have functional DDO activity
    and higher catalytic efficiency for D-glutamate than D-aspartate in the reported
    comparison. Broader substrate preference does not invalidate the D-aspartate activity-class
    association. Other attached physiological and localization annotations retain
    their original reference scope. The current 331-aa Caenorhabditis briggsae entry
    has existence inferred from homology. D-aspartate and D-glutamate catalysis and
    physiological direction transfer by ECO:0000250 from Q19564. Its caution notes
    that conserved active-site Tyr221 is replaced by Phe, with ECO:0000305. The separately
    captured Q19564 donor has direct DDO annotations, but that does not turn the recipient
    into a directly assayed protein or establish loss of activity. Retain a qualified
    transferred association and the explicit source caution.
