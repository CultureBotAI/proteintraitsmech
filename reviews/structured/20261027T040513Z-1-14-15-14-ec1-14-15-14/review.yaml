- Selected UniProt fields exclude full sequences/features and uncited bibliography;
  indexed abstracts are not full papers. Whole raw releases and other checkouts were
  not read.
- No protein qualification/promotion, sequence-coordinate assertion, record edit or
  curation-history event was performed.
- Provenance searches include hidden/ignored files only within scripts, conf, data/mappings
  and history; no global absence claim follows.
- Structural/history gates do not establish human scientific approval. iModulon expression-module
  lookup is inapplicable to these EC reaction-identity claims.
- Retained archive/policy sources preserve their original HTTP access dates; local
  reuse is not a fresh upstream fetch.
