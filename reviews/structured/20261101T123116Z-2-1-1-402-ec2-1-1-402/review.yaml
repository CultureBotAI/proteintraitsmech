limitations:
- PMIDs 9490063 and 1576206 were read as complete indexed CORE abstracts, not whole
  articles. The later purified activity and earlier membrane-fraction/bound-glycan
  studies remain distinct.
- Free Neu5Ac and Neu5Gc are supported acceptors. Better bound-substrate performance
  does not refute the drawn free-Neu5Ac branch; apparent Km values retain the stated
  substrate and AdoMet conditions.
- The purification abstract leaves the relationship of the 58/62 kDa bands unresolved
  and supplies no sequence identity. No protein exemplar is inferred from those bands.
- The abstract reports restoration by Mn2+ and less effectively Co2+ after EDTA treatment.
  That contextual observation is not expanded into a mandatory metal-specific elementary
  graph.
- Repairing the conditional introduction does not require unsupported GO mappings
  or sequence-qualified examples.
- Retained ENZYME/Rhea bodies preserve their original capture times and release identities.
  Formula balance and native structural checks do not establish exhaustive specificity,
  elementary mechanism or human scientific review.
- The schema describes MOLECULAR_FUNCTION in GO terms while maintained graph guidance
  supports EC/Rhea activities. This owner-contract wording tension is not treated
  as a native-schema failure or false activity assertion.
