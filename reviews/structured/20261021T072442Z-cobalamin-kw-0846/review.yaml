- issue_key: uniprot-keyword.KW-0846.axial-coordination-background
  category: scope
  severity: minor
  title: Qualify solution versus protein-bound cobalamin coordination
  description: The chemical background states intramolecular dimethylbenzimidazole
    axial ligation without qualification. The primary abstract explicitly contrasts
    this solution/base-on geometry with base-off, protein-histidine ligation in methylmalonyl-CoA
