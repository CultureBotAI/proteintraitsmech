summary: CDD:cd00104 (Kazal-type serine protease inhibitors and follistatin-like domains)
  passes strict LinkML validation and release-pinned UniProt grounding replay for
  all three qualified human canonical examples (P00995 SPINK1 25-79, P19835 CEL 46-91,
  and Q9NQ38 SPINK5 six Kazal repeats), and its PMID:6192856 evidence and InterPro:IPR002350
  parent hierarchy are accurate. However, its upstream CDD-seeded definition contains
  a typographical error ('chyomotrypsin' for 'chymotrypsin') and lists 'avian ovomucoids'
  (which are Kazal-type serine protease inhibitor proteins, not target serine proteases)
  among the inhibited enzymes. Preserved as open finding F1 for Stage 5 grouped repair
  and qualified-binding re-verification.
