findings:
- finding_id: F1
  issue_key: cdd-cd00104-kazal-definition-typo-and-inhibitor-target-confusion
  category: consistency
  severity: minor
  status: open
  certainty: confirmed
  title: CDD:cd00104 definition misspells chymotrypsin and lists avian ovomucoids
    as target serine proteases
  description: In data/traits/sequence/domain/cdd/kazal-type-serine-protease-inhibitors-and-follistatin-like-domains-kaz-cd00104.yaml,
    the upstream CDD definition states 'Kazal inhibitors inhibit serine proteases,
    such as, trypsin, chyomotrypsin, avian ovomucoids, and elastases'. First, 'chyomotrypsin'
    is a typographical error for 'chymotrypsin'. Second, avian ovomucoids are Kazal-type
    serine protease inhibitor proteins (as shown by the record's own cited reference
    PMID:6192856), not target serine proteases. Because CDD:cd00104 has 3 promoted
    QUALIFIED canonical examples bound in data/grounding/qualified_record_bindings.jsonl.d/,
    repairing the definition in Stage 5 requires updating scripts/seed_cdd.py via
    a guarded CDD errata module and re-binding the record SHA-256.
  target_ids:
  - CDD:cd00104
  field_paths:
