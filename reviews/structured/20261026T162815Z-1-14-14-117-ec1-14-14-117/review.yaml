    studies, which do not become direct catalytic assays merely by appearing in the
    entry. B8NHY4 is the A. flavus NRRL 3357 OrdA transfer donor, inspected as context
    rather than as an additional stored canonical example. Its FUNCTION annotation
    carries experimental evidence linked to PMID 9143099 and its catalytic comments
    list both focal reactions. The complete donor identity, comments and bibliography
    were read; the linked 9143099 abstract and full article were not acquired, so
