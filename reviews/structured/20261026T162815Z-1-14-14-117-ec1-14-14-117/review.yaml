    The schema reserves RESIDUE for specific protein residues or residue sets and
    provides LIGAND for cofactors. The maintained builder assigns RESIDUE unconditionally
    to rh:reactivePart. This is a material generated type assertion error, not a chemical
    identity, balance, part-of or sequence-coordinate defect.
