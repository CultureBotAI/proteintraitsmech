limitations:
- Three complete indexed abstracts and one bibliography-only record were read; no
  original full paper or supplementary material was inspected for this record.
- The 1,4-lactone is a directly reported stable product in the inspected RlAraDH abstract.
  The immediate enzymatic lactone and possible rearrangement remain unresolved at
  this reading scope; no mechanistic error finding is made.
- Shared bulk, cofactor and relation responses are immutable verified reuse with original
  URLs, hashes and access times; current target-specific stanzas/mapping rows/RDF
  subjects were freshly read.
- Local context reading is bounded to declared class/definition/hierarchy/mapping
  fields. Maintained-owner and schema reading is bounded to the material scopes cited,
  not an exhaustive review of every repository file.
- Legacy example associations were inspected at accession/evidence-code scope; no
  new QUALIFIED occurrence, residue coordinates, sequence-registry assertion or human
  sign-off was created.
