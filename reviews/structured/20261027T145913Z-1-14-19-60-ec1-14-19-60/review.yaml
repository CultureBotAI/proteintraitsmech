limitations:
- Research-paper evidence is limited to delivered indexed abstracts, citation objects,
  publication types and correction fields; no full research article or supporting
  assay data was read.
- UniProt review status, ENZYME DR membership and family annotation do not qualify
  protein coordinates or establish human sign-off for this trait record.
- The two provenance searches are bounded to their named checkout directories with
  ignored files included; they do not prove global absence of approval.
- IUBMB prints an additional substrate H(+), whereas ENZYME/Rhea and the stored graph
  omit it. The represented charged species balance without that extra proton; this
  is an upstream equation discrepancy, not a stored-graph stoichiometry defect.
- KtzR prefers but is not described as absolutely restricted to 7-chloro-L-tryptophan.
  The upstream tandem enzyme and other organism pathways are context, not additional
  class examples.
- The UniProt sequence caution concerns the older submitted sequence; no independent
  alignment or sequence-coordinate qualification was performed.
