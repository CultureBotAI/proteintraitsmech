- area: evidence
  outcome: supported
  summary: 'PMID10069828: Arabidopsis DWF1 characterization concerns plant sterol
    biosynthesis and the combined isomerization/reduction context. It supplies pathway
    comparison rather than a direct assay of the three stored animal DHCR24 proteins.
    PMID11519011: Human DHCR24 expression and enzyme analysis establish desmosterol-to-cholesterol
    reduction; the delivered abstract reports strict NADPH dependence and approximately
    twofold FAD stimulation. This is direct human enzyme evidence, separate from nematode
    and macaque transfers. PMID12162789: The study uses human cells and rat liver
    microsomes to assess sterol-reductase inhibition and substrate context. It is
    not a purified assay of every current focal protein or every mapped reaction.
    PMID22178193: The study addresses regulation of human DHCR24 and cholesterol synthesis.
    The indexed publication year and earlier electronic date are retained separately;
    its abstract does not establish a complete lanosterol substrate-range assay. PMID23583456:
    The comprehensive cholesterol-pathway treatment is synthesis/review context by
    content, even though the delivered publication labels include research-article.
    It is not counted as a new isolated focal-protein assay. PMID26114596: Mouse tissue/cell
    isotope-flux work supports multiple cholesterol-biosynthetic routes and is the
    direct reference on mouse donor Q8VCH6 for zymosterol reduction. Tissue flux is
    distinguished from isolated human or nematode kinetics. PMID9291139: Rat liver
    microsomes show broad sterol substrate scope and a more reactive 7,24-dienol substrate.
    These species/preparation-specific kinetic results support class breadth without
    proving identical kinetics for every focal protein. PMID9761794: Arabidopsis DIM/DWF1
    mutant and biochemical context concerns plant sterol side-chain isomerization/reduction.
    It is not direct experimental evidence for the stored animal DHCR24 accessions.
    PMID21671375: A desmosterolosis case and literature review also reports reduced
    activity of patient DHCR24 variants expressed in yeast. Its mixed publication
    types do not negate that stated experimental component, but the case and structural
    interpretation remain distinct from broad substrate specificity. PMID25637936:
    The abstract reports coimmunoprecipitation and functional coupling of DHCR24 and
    DHCR7, including knockdown and overexpression. This is interaction/cellular activity
    evidence, not a direct assay of every mapped substrate. The exact reciprocal notice
    PMID 25924892 is indexed as an erratum but has no delivered abstract. Its linked
    HTML returned an HTTP 403 JavaScript/cookies challenge, so the correction effect
    remains unresolved and no effect is inferred.'
