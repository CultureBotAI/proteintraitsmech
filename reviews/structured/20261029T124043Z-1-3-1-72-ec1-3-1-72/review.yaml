limitations:
- Only the declared current authority/API/material scopes and indexed abstracts were
  read; no full article is credited.
- Original reused HTTP access times are retained; alias reuse is not a fresh upstream
  release.
- The ignored-inclusive discovery search covers owned scripts, conf, data/mappings
  and history; no global absence claim.
- Protein existence levels are separate from function/catalytic evidence codes.
- Rhea masters are undirected; formal oxidation equations do not establish physiological
  flux.
- The mouse donor directly annotates zymosterol reduction from PMID26114596 and transfers
  desmosterol/lanosterol annotations from human Q15392. Its desmosterol physiological-direction
  field is left-to-right for a written oxidation equation, a source-local inconsistency
  that is not copied into the target or used to infer reverse physiological flux.
- The reciprocal indexed erratum PMID 25924892 for PMID 25637936 has no delivered
  abstract, and its linked HTML returned only an HTTP 403 JavaScript/cookies challenge.
  No correction text or effect was retrieved; the effect remains unresolved. The independent
  PMID11519011 and PMID21671375 evidence is not made contingent on an assumed erratum
  effect.
