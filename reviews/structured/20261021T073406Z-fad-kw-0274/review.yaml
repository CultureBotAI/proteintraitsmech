    role: Maintained source parser, category routing, parent selection and YAML emitter
  acceptance_checks:
  - The corrected hierarchy consistently accommodates the experimentally characterized
    RibL role without claiming it uses FAD as a redox cofactor.
  - Do not remove the synthesis branch, equate the trait to a molecule or redox activity,
    or infer a nonbinding protein from this evidence.
  - Regenerate through the maintained input, run strict validation, and save a new
    scoped review of changed target and parent bytes.
