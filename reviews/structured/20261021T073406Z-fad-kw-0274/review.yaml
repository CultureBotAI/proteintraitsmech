    through scripts/seed_uniprot_keywords.py or a maintained correction input it consumes.
    Preserve source identity and the biosynthetic branch; explicitly accommodate supported
    nonredox flavin substrate/product roles in a defensible parent or revise the relation
    with documented source justification.
  finding_ids:
  - F1
  target_ids:
