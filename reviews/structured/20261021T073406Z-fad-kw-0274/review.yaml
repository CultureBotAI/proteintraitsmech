findings:
- issue_key: uniprot-keyword.KW-0274.flavoprotein-parent-scope
  category: consistency
  severity: major
  title: Reconcile the biosynthetic branch with the redox-only parent
  description: 'FAD includes biosynthetic proteins, but its asserted local Flavoprotein
    parent defines only enzymes with flavin redox cofactors/cosubstrates. Reviewed,
    keyword-assigned RibL Q58579 and its primary experiment show a nonredox nucleotidyl-transfer
    role: FMN substrate becomes FAD product. The current parent definition therefore
    fails to describe a demonstrated member role covered by the child.'
