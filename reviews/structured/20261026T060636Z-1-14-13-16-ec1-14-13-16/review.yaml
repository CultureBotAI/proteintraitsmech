limitations:
- The 2003 correction to PMID 12406764 is identified as PMC154837/DOI 10.1128/aem.69.4.2414.2003.
  Its delivered indexed response has no abstract; the fullTextXML request returned
  HTTP 500. Correction content was not read and no claim that it is harmless is made.
- PMID 26771671 concerns human FMO5, and PMID 24903773 does not name each tested BVMO
  in its abstract. These are distinguished from protein-specific evidence.
- The UniProt homotetramer annotation cites the 1996 Bes paper; only its complete
  bibliography was read. The 1976 abstract itself allows three or four subunits and
  describes partial FAD loss.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not described as new downloads.
- Complete bibliography arrays do not imply full article reading. No unselected linked
  paper or ancestor protein assay is claimed as reviewed.
- Legacy CURATOR/ENZYME examples establish source membership rather than release-qualified
  sequence-coordinate evidence.
- The ignored-inclusive searches cover only the declared owned scripts/conf/data/mappings/history
  scope and do not prove global absence of historical approval.
