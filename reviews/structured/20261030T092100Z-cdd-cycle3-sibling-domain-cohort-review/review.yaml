summary: 'Full cohort review of all 14 eligible CDD sequence-domain records in the
  frozen Cycle 3 Stage 4 inventory (8 resolved carry-forward records from Cycle 2
  Stage 5: CDD:cd00104, CDD:cd00959, CDD:cd20535, CDD:cd15885, CDD:cd17151, CDD:cd17154,
  CDD:cd17149, and CDD:cd18593, plus 6 unpromoted tandem-repeat and paralog-subfamily
  siblings of the Cycle 1/2 CDD cohorts: CDD:cd17152, CDD:cd17153, CDD:cd15884, CDD:cd15895,
  CDD:cd18599, and CDD:cd18601). All 14 records pass strict LinkML schema validation,
  UniProt grounding replay, causal-graph audit, writer audit, and curation-history
  validation, and each represents a genuine, non-redundant conserved sequence domain
  class (SEQ_DOMAIN on SEQUENCE) that should be retained as a distinct record. Carry-forward
  findings F1, F2, and F13-F18 remain verified resolved on disk at adef1252dc47d9fc25268e3f36ad2ade8adba1a2.
  Six new open findings (F19-F24: 5 major, 1 minor) across the 6 newly audited sibling
  CDD records share a single root cause in upstream NCBI CDD template descriptions
  and are preserved open for Cycle 3 Stage 5 grouped remediation via scripts/cdd_errata.py
  and scripts/repair_cdd_errata.py.'
