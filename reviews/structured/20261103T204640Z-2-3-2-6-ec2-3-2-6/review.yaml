- Phe transfer is reported in vitro and is not established here as physiological activity.
- The E. coli studies do not directly assay A3DES1, Q6FDS1 or A0KJE0; symbolic carrier
  remainder R and generic tRNA/protein chemistry do not supply instance coordinates.
