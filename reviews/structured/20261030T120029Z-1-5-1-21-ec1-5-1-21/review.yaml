- area: grounding
  outcome: supported
  summary: 'Pseudomonas aeruginosa PAO1 Q9I492 has current experimentally tagged EC
    1.5.1.21 comments: Rhea 12524 cites 24649405; Rhea 20317 cites 24649405,24980702
    and 27929065. The current FUNCTION states NADPH use and inability to substitute
    NADH. Complete indexed 24649405 concerns pathway enzymes including reductases;24980702
    is a functional-network study. The newly read 27929065 abstract focuses on upstream
    LhpI dehydratase, so its detailed reductase support remains the database annotation
    tier and is not represented as an abstract-level selected reductase assay. Pseudomonas
    putida Q5FB93 has both selected NADP reactions annotated with ECO:0000269 to 15561717.
    The whole indexed abstract reports recombinant DpkA reduction of both cyclic imines,
    lower reverse rates, and NADH rates below 1% of NADPH. This supports the selected
    NADPH activity class without making minor NADH activity an identity contradiction.
    Ancillary N-methylalanine activity and its 15720386 reference are separate. Pseudomonas
    syringae pv. tomato Q4U331 has both selected NADP reactions annotated with ECO:0000269
    to 16192274. Its complete indexed record describes unliganded and NADPH/substrate-analogue
    structures and a cofactor-recognition rationale. The full focal features and bibliography
    were read; their detailed residue assignments remain database annotations rather
    than an independently replayed elementary mechanism.'
