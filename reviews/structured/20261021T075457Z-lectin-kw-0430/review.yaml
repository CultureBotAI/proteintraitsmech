findings:
- issue_key: uniprot-keyword.KW-0430.agglutination-background-scope
  category: scope
  severity: minor
  title: Clarify whether agglutination is background or a class requirement
  description: 'The definition states without qualification that lectins agglutinate
    cells. Primary experiments show engineered Mitsuba-1 binds Raji cells without
    agglutinating them under the tested conditions. The engineered protein is not
    established here as a native KW-0430-assigned member, and a negative assay does
    not prove inability under every condition. A scope concern remains provisional:
    the background should not silently impose a universal agglutination gate on the
    supported carbohydrate-binding core.'
  evidence_ids:
  - record
  - keyword
  - go
  - agglutination-primary
  certainty: provisional
  finding_id: F1
  status: open
  target_ids:
  - UniProtKB-KW:KW-0430
