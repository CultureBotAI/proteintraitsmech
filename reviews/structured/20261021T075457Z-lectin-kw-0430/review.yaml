  acceptance_checks:
  - Establish whether cell agglutination is a required source-class criterion or a
    possible activity under suitable conditions.
  - Do not infer universal nonagglutination from engineered Mitsuba-1 or equate monomeric
    with monovalent.
  - Preserve carbohydrate-binding identity and source-direct GO mapping; validate
    and review any regenerated wording.
limitations:
- The original keywlist release used in the July seed is not recoverable from this
  record. Current API release 2026_03 is a comparison snapshot, not an asserted historical
  seed release.
- External responses were inspected and SHA256-captured in session scratch; the bundle
  retains URLs, access times, digests and bounded observations, not full response
  bodies.
- This is one record review, not a source-wide audit. No examples or mechanisms are
  qualified. iModulonDB is not applicable to this generic ligand class without a gene,
  organism or expression dataset.
- The primary example is engineered Mitsuba-1, not a verified native KW-0430 member
  or a qualified canonical example. Negative agglutination results apply only to the
  tested cells and conditions; its monomeric architecture does not imply monovalence.
- This review does not establish a wrong keyword identity, category route or GO mapping,
  or quantify lectin taxonomic distribution.
