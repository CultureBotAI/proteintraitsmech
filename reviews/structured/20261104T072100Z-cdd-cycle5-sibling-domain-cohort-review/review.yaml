- finding_id: F35
  issue_key: cdd-cd18598-mrp7-d1-abcc-mrp7-cftr-misassignment-and-mdr-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd18598 (ABC_6TM_MRP7_D1_like) misassigns MRP7 to ABCC7 (CFTR) instead
    of ABCC10 and overclaims anticancer multidrug-resistance efflux across all MRP1-MRP9
    members
  description: CDD:cd18598 (label=ABC_6TM_MRP7_D1_like, parent_traits=[CDD:cl38913],
    SEEDED, unpromoted seed example Mus musculus Abcc10 UniProtKB:Q8R4P9) models the
    N-terminal six-helix transmembrane domain 1 (TMD1) of multidrug resistance-associated
    protein 7 (MRP7/ABCC10) and similar proteins (sibling of C-terminal TMD2 profile
    CDD:cd18605 ABC_6TM_MRP7_D2_like), but its upstream CDD definition states 'The
    human ABCC subfamily contains nine multidrug resistance-associated proteins (MRPs
    1-9, or ABCC1-6, ABCC7 and ABCC10-12). MRP1-MRP9 represent the major contributors
    to multidrug resistance (MDR) in human tumor cells, which are ATP-dependent efflux
    pumps for endogenous substances and xenobiotics.' In human HGNC/UniProt nomenclature,
    ABCC7 is the cystic fibrosis transmembrane conductance regulator (CFTR) chloride
    channel (not an MRP), whereas MRP7 is encoded by ABCC10 (alongside MRP1-MRP6 =
    ABCC1-ABCC6, MRP8 = ABCC11, and MRP9 = ABCC12), and only a subset of MRPs (including
    MRP7/ABCC10 taxane efflux) have established roles in tumor multidrug resistance
    (PMID:16984901).
  target_ids:
  - CDD:cd18598
