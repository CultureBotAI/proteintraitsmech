  issue_key: cdd-cd15854-snap47c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd15854 (SNARE_SNAP47C) asserts that Qb/Qc SNAREs have a transmembrane
    domain whereas SNAP47 lacks both a transmembrane domain and palmitoylated membrane-anchoring
    cysteines
  description: CDD:cd15854 (label=SNARE_SNAP47C, parent_traits=[CDD:cl22856], SEEDED,
    unpromoted seed examples Rattus norvegicus Snap47 UniProtKB:Q6RHT0 and Mus musculus
    Snap47 UniProtKB:Q8R570) models the C-terminal Qc SNARE motif of SNAP47 (synaptosomal-associated
    protein 47, sibling of N-terminal Qb SNARE motif CDD:cd15888 SNARE_SNAP47N), but
    its upstream CDD definition states 'Qb/Qc SNAREs consist of 2 coiled-coil helices
    (called SNARE motifs, one belonging to the Qb subgroup and one belonging to the
    Qc subgroup), which mediate the interactions with other SNARE proteins, and a
    transmembrane domain.' In fact, Qb/Qc SNAP-25 family SNAREs lack a transmembrane
    domain, and like SNAP29 (and unlike SNAP25 and SNAP23), SNAP47 also lacks palmitoylated
    cysteine membrane anchors and associates with intracellular membranes via protein-protein
    interactions with other SNARE partners (PMID:16565078, PMID:9759094).
