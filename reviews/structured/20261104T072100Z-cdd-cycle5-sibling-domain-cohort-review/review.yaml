- finding_id: F33
  issue_key: cdd-cd15857-sec9c-transmembrane-domain-overclaim
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: CDD:cd15857 (SNARE_SEC9C) asserts that Qb/Qc SNAREs have a transmembrane
    domain whereas fungal SEC9 lacks both a transmembrane domain and palmitoylated
    cysteines
  description: CDD:cd15857 (label=SNARE_SEC9C, parent_traits=[CDD:cl22856], SEEDED,
    unpromoted seed examples Neurospora crassa UniProtKB:Q7S4P6, Emericella nidulans
    UniProtKB:Q5B5C7, and Schizosaccharomyces pombe Sec9 UniProtKB:O74423) models
    the C-terminal Qc SNARE motif of fungal SEC9 and similar proteins (sibling of
    N-terminal Qb SNARE motif CDD:cd15886 SNARE_SEC9N), which interact with Qa-SNAREs
    SSO1/SSO2 and R-SNAREs SNC1/SNC2 in secretory vesicle fusion with the plasma membrane.
    Its upstream CDD definition states 'Qb/Qc SNAREs consist of 2 coiled-coil helices
    (called SNARE motifs, one belonging to the Qb subgroup and one belonging to the
    Qc subgroup), which mediate the interactions with other SNARE proteins, and a
    transmembrane domain.' In fact, Qb/Qc SNAP-25 family SNAREs lack a transmembrane
    domain, and fungal Sec9p is a hydrophilic peripheral membrane protein lacking
    both a transmembrane domain and palmitoylated cysteine residues, associating with
    the plasma membrane via assembly into SNARE complexes with syntaxins Sso1p/Sso2p
    and synaptobrevins Snc1p/Snc2p (PMID:7929585, PMID:9759094).
  target_ids:
  - CDD:cd15857
  field_paths:
