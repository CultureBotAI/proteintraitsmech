summary: 'Full cohort review of all 12 eligible CDD sequence-domain records in the
  frozen Cycle 5 Stage 4 inventory (6 resolved Cycle 4 Stage 5 G5 records: CDD:cd17071,
  CDD:cd16113, CDD:cd15855, CDD:cd15889, CDD:cd15856, and CDD:cd15887, plus 6 newly
  audited paralog-sibling and tandem-domain CDD records in the Qb/Qc SNARE SNAP47/SEC9
  and ABCC MRP7/ABCC10 6TM clades: CDD:cd15854, CDD:cd15888, CDD:cd15857, CDD:cd15886,
  CDD:cd18598, and CDD:cd18605). All 12 records pass strict LinkML schema validation,
  UniProt grounding replay, causal-graph audit, writer audit, and curation-history
  validation, and each represents a genuine, non-redundant conserved sequence domain
  class (SEQ_DOMAIN on SEQUENCE) that should be retained as a distinct record. Cycle
  4 G5 findings F25-F30 remain verified resolved on disk at 568e78869fb08b86849d13f6a23b3a32ec27cd08.
  Six new open findings (F31-F36: 6 major) across the 6 newly audited paralog/tandem-domain
  sibling CDD records share a single root cause in upstream NCBI CDD template descriptions
  and are preserved open for Cycle 5 Stage 5 grouped remediation via scripts/cdd_errata.py
  and scripts/repair_cdd_errata.py.'
