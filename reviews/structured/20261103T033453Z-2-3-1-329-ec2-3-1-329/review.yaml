assessments:
- area: identity
  outcome: supported
  summary: EC 2.3.1.329/Rhea82171 covers two isonitrile acyl transfers to carrier-bound
    lysine followed by reductive release as the alcohol. Lysine activation/loading
    is separately EC 6.2.1.77; broader pathway reactions Rhea75547/75551 do not replace
    this selected net reaction.
