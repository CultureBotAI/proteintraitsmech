  topic: Source grounding and trait associations
- area: evidence
  outcome: supported
  summary: PMID 28634299 reports in vivo heterologous reconstitution and in vitro
    biochemical analyses that support the five-enzyme pathway, including a single
    condensation domain acting at both lysine amino groups. PMID 29906336 supports
    upstream ScoE chemistry; PMID 22451903 supports nonprocessive reductase offloading
    in mycobacterial NRPSs. Failed PMC5502637 supplies no full-text assay details.
  evidence_ids:
