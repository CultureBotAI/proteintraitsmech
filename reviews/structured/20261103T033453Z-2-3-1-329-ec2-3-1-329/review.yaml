- area: grounding
  outcome: supported
  summary: P0DX16 is selected ScoA from Streptomyces coeruleorubidus, with NRRL 18370
    specified in its reference parent. The current provider and PMID 28634299 support
    direct pathway/reconstitution involvement and the unusual double acylation. The
    ScoE paper concerns the upstream iron enzyme, and mycobacterial reductase-domain
    assays are mechanistic context rather than a direct assay of this selected ScoA
    sequence.
  evidence_ids:
