  chemical_data. The observed source formulas and target structures are retained without
  speculative repair.
- The structured catalogue comparison is bounded to its retained 2026-11-02 snapshot
  and exact selected organisms; it establishes neither global dataset absence nor
  negative biological evidence.
- This author performed read-only source/scientific work and pure scratch checks.
  ROOT separately acquired sources and executed the captured native gates; no publication
