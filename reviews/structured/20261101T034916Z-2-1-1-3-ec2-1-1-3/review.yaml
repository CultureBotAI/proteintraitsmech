summary: EC 2.1.1.3 has supported class identity and source-corresponding chemistry.
  One major finding concerns its automatic reviewed state; one minor concerns absent-exemplar
  introduction wording; no protein example is required. This FUNCTION class transfers
  a methyl group from dimethylsulfonioacetate (thetin/sulfobetaine) to L-homocysteine,
  giving (methylsulfanyl)acetate and L-methionine. RHEA22788 and GO0047149 agree with
  the focal donor/acceptor chemistry. SAM is not the methyl donor for this class,
  and no canonical protein example is selected.
