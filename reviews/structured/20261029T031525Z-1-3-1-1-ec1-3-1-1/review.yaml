  outcome: supported
  summary: Current UniProt identifies E. coli O157:H7 PreA with homology-level existence.
    Function/reaction and heterotetramer annotations transfer from focal K12 P25889,
    while iron-sulfur annotation includes sequence-derived support. This supports
    a PreA component association, not a direct O157 assay or autonomous-subunit catalysis.
    Current UniProt identifies E. coli K12 PreA with direct functional and reaction
    annotations and a heterotetramer of two PreA and two PreT subunits. PMID 18482579
    reports recombinant complex activity and 21169495 identifies the NADH-dependent
    heterotetramer. The 2021 characterization 34097066 is additional complex evidence
    with its linked erratum handled separately. Current UniProt identifies Salmonella
    Typhimurium LT2 PreA with homology-level existence and by-similarity function/subunit
    annotation; its full bibliography contains the genome paper. The source supports
    an inferred component association; it does not provide a direct strain-specific
    assay or identify a particular transfer donor.
