- issue_key: uniprot-keyword.KW-0076.universal-phytol-overrestriction
  category: scope
  severity: major
  title: Bacteriochlorophyll is incorrectly restricted to a phytol ester
  description: The ligand description names phytol as the esterifying alcohol without
    qualification. Primary bacteriochlorophyll c chemistry establishes predominant
    farnesol and several other alcohols. Read as a class boundary, the definition
    excludes genuine bacteriochlorophyll forms encompassed by the keyword and GO binding
    term.
