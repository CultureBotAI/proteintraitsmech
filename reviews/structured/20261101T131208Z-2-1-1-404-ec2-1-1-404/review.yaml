  category: provenance
  severity: major
  certainty: confirmed
  title: Automatic enrichment does not establish curator sign-off
  description: The current history explicitly records LLM-assisted graph enrichment
    and SEEDED-to-REVIEWED promotion, matching the maintained builder. The current
    schema/profile require curator or human sign-off. The automatic route and bounded
    ignored-inclusive searches do not establish that decision; this does not claim
    that no human review exists anywhere.
