- area: representation
  outcome: supported
  summary: The graph represents molecular activities and small-molecule participants,
    without residue or carrier typing. The schema describes MOLECULAR_FUNCTION as
    GO and TRAIT as another record, while maintained molecular guidance explicitly
    permits EC/Rhea activity nodes. These groundings unambiguously denote activities.
    The convention needs maintained schema/guidance reconciliation; it is not an independently
    established wrong class or an automatic-retyping instruction.
