    human Q6PHW0. Structural work and the engineered soluble expression study are
    distinguished from the intact native membrane protein. Edge 9: Q6TA49 enables
    the activity is supported by the current matching ENZYME DR row and the protein
    and primary-evidence assessment with explicit evidence limits. Current pig Q6TA49
