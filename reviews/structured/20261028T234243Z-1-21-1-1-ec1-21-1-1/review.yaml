    agrees with CHEBI:57506 coefficient 1 on the explicitly displayed Rhea side. Formula
    C9H8I2NO3 and charge -1 match the captured ChEBI form; the master remains direction-unspecified.
    Edge 4: activity has output prd2 agrees with CHEBI:57783 coefficient 2 on the
    explicitly displayed Rhea side. Formula C21H26N7O17P3 and charge -4 match the
    captured ChEBI form; the master remains direction-unspecified. Edge 5: activity
    has output prd3 agrees with CHEBI:15378 coefficient 1 on the explicitly displayed
    Rhea side. Formula H and charge 1 match the captured ChEBI form; the master remains
    direction-unspecified. Edge 6: the exact current EC2GO identifier pair and both
    GO endpoints support the close mapping. Source-specific definition and protonation
    conventions remain explicit. Edge 7: Q6PHW0 enables the activity is supported
    by the current matching ENZYME DR row and the protein and primary-evidence assessment
    with explicit evidence limits. Current human Q6PHW0 is a reviewed 289-residue
