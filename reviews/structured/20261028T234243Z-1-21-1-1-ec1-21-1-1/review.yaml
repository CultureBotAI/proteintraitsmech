limitations:
- Complete captured authority, declared raw annotation/reference arrays and indexed
  abstracts were read. No main-article full text is claimed.
- The two reaction masters remain direction-unspecified; the stored graphs explicitly
  select their left-to-right children. Physiological reductive direction is assessed
  separately.
- PMID4394169 is a null-abstract bibliographic record; 18434655 is null-abstract commentary,
  not a correction. PMID27643701 is Drosophila comparative context.
- Current UniProt FUNCTION prose uses the word oxidative for an NADPH-dependent deiodination
  step; the assessment follows its explicit reaction and experimental reductive chemistry.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not new downloads.
- Complete bibliography arrays do not imply full article reading or acquisition of
  every linked paper.
- Direct, transferred and engineered-construct scopes are retained separately; no
  inactive-protein or wrong-species conclusion follows from an indirect annotation
  alone.
- Ignored-inclusive searches cover only the declared owned scope and do not prove
  global absence of historical evidence.
