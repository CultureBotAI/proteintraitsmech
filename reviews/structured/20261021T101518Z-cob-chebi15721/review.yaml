limitations:
- The reviewed record does not identify the exact ChEBI source release used for the
  seed. Current official responses are comparison snapshots, not proof of the original
  release.
- No claim is made that sedoheptulose phosphate can never serve a cofactor role; the
  blocker rests on a positive structural/name mismatch. The original MicroGrowAgents
  input table/release remains independently unverified.
- External sources were inspected and SHA256-captured in session scratch. This bundle
  retains URLs, access times, digests and bounded observations rather than full response
  bodies.
- This one-record review does not certify its source cohort or parents. iModulonDB
  is not applicable to this generic chemical requirement class without a gene, organism
  or expression dataset.
- Both primary CoB studies were inspected at complete indexed-abstract level. Their
  structural and in vitro assay evidence is not a qualified protein example or an
  exact physiological protonation assignment.
- The external neutral and trianionic coenzyme B entries are inspected identity comparisons
  only; no replacement ID, local counterpart change or migration is selected here.
