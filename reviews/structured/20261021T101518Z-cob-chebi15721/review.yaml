  title: CoB requirement is grounded to unrelated sedoheptulose 7-phosphate
  description: The label and coenzyme_b synonym identify coenzyme B, while CHEBI:15721
    and the appended definition identify a ketoheptose phosphate. Official structures
    and primary coenzyme-B chemistry establish incompatible identities. The record
    lacks a coherent denotation; a generic xref-to-participant rewrite would retain
    the wrong chemical.
