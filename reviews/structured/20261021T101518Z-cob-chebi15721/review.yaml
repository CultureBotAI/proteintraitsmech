    check before joining a curated name to a ChEBI definition. First adjudicate the
    intended coenzyme requirement and exact chemical state using verified source provenance,
    then reconcile identifier, label, definition, synonyms, attribution, hierarchy
    and chemical grounding. Do not move CHEBI:15721 into a CoB participant, silently
    relabel the class as a sedoheptulose requirement, or automatically replace it
    with either inspected coenzyme-B protonation state. Once identity is resolved,
    use chemical_participants with role COFACTOR where justified instead of chemical-to-trait
    equivalence.
