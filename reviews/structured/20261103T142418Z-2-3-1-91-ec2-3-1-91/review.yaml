    attributes the transition to automated Edison graph enrichment. The maintained
    builder and Edison instruction implement that promotion, whereas the current curation
    guidance and schema reserve REVIEWED for curator sign-off. The captured record
    does not document that sign-off; this finding does not assert that an off-record
    human review could never exist.
