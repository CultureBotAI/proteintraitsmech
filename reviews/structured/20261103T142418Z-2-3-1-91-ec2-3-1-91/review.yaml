limitations:
- This review covers the exact captured target, maintained owners, complete local
  reference records and declared delivered source scopes; it is not an exhaustive
  literature or protein-discovery search.
- Shared ENZYME/Rhea/EC-to-GO/classification captures retain their original October
  21 acquisition dates. Current provider/ontology responses and retained chemical/article
  copies retain their own original metadata dates.
- A formula/charge balance check establishes stoichiometric accounting, not the correctness
  of every upstream chemical structure, assay attribution or biological annotation.
- The 12657648 and 20428885 evidence is limited to complete attained CORE envelopes
  and abstracts; experimental details beyond them were not read.
- Provider active-site positions are similarity-derived. The current graph does not
  claim a directly demonstrated residue-level mechanism.
- The November 2 catalogue contains no Arabidopsis entry; this bounds structured applicability
  and says nothing about actual membership or regulation.
