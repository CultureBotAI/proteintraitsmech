limitations:
- Retained bodies retain their original URL, metadata and acquisition time; an available
  exact copy can differ from the unchanged original body_path. No fresh-release claim
  follows from retaining bytes.
- The graph represents net reactions rather than atomistic catalysis, physiological
  flux or thermodynamic direction.
- Whole CORE envelopes and declared provider scopes were read; no complete primary
  article, external supplement or figure pixels were inspected.
- A valid review does not supply human REVIEWED sign-off or authorize canonical example
  promotion.
- IUBMB’s displayed 12738270 citation has an inconsistent 11571203 hyperlink; the
  exact retained 12738270 title resolves the displayed identity.
- The historical 12404452 CORE has no abstract; transferred residue sites and algorithmic
  SHMT annotation are separate from the focal experimental evidence.
