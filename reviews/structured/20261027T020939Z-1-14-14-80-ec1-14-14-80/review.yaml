  summary: Q9C788 (C70B1_ARATH, Arabidopsis thaliana) is a 524-residue CYP704B1 protein
    with direct ECO:0000269 focal long-chain fatty-acid omega-hydroxylase FUNCTION
    and EC 1.14.14.80/Rhea 56748 annotation linked to PMID 19700560. Its selected
    annotations connect the activity to sporopollenin synthesis and pollen exine.
    The complete bibliography separates genome/cDNA resources from that functional
    study; the generic activity annotation does not establish that every class-linked
    substrate was assayed with this accession. P48422 (C86A1_ARATH, Arabidopsis thaliana)
    is a 513-residue CYP86A1 protein with direct ECO:0000269 focal EC 1.14.14.80/Rhea
    56748 annotation linked to PMID 9500987. FUNCTION describes omega-hydroxylation
    of saturated and unsaturated C12–C18 fatty acids, without hexadecane activity,
    and cites additional expression/functional work. The complete eight-reference
    bibliography preserves the distinct characterization, expression and later functional-study
    scopes. Q0IIF9 (CP2U1_BOVIN, Bos taurus) is a 543-residue CYP2U1 entry with transcript-level
    protein-existence evidence. Its selected focal FUNCTION and EC 1.14.14.80/Rhea
    56748 catalytic activity use ECO:0000250 transfer from human Q7Z449, as do its
    other selected catalytic/cofactor annotations. The complete bibliography contains
    a nucleotide-sequence submission. This is positive transferred activity support,
    not a bovine assay or proof of each displayed fatty-acid reaction.
