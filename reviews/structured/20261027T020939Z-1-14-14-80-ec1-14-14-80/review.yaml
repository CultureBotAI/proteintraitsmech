limitations:
- The current ENZYME and IUBMB plant comment calls palmitate 18:0; ChEBI:7896 and
  Rhea correctly represent C16H31O2−. This upstream wording is not silently rewritten
  or promoted to a focal graph error.
- Q0IIF9 focal catalysis is transferred from Q7Z449. Direct human annotation does
  not become a bovine assay, nor does class-level evidence imply that each stored
  protein accepts all three displayed specific fatty acids.
- The human CYP4A11 laurate abstract is C12 donor-system context. No inference of
  direct stearate activity is made from that abstract alone.
- Q7Z449 is an inspected transfer-donor annotation; its separately linked full articles
  were not acquired.
- Source URLs, original access times and body hashes are preserved; retained captures
  are not described as new downloads.
- Complete bibliography arrays do not imply full article reading. No unselected linked
  paper or ancestor protein assay is claimed as reviewed.
- Legacy CURATOR/ENZYME examples establish source membership rather than release-qualified
  sequence-coordinate evidence.
- The ignored-inclusive searches cover only the declared owned scripts/conf/data/mappings/history
  scope and do not prove global absence of historical approval.
