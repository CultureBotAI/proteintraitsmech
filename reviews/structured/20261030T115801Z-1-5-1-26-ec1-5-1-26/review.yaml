limitations:
- Rhea master reactions are undirected. Directional children establish displayed participant
  roles, not physiological irreversibility.
- Mapping correspondence and ENZYME catalogue membership do not themselves establish
  an accession-specific experimental assay.
- Indexed field absence is a limitation of the delivered response, not evidence of
  global absence of literature or biological activity.
- The Sato 1987 citation is bibliographic source context only. No full article, accession-specific
  assay or unrecorded PMID is claimed.
- Reading covers the whole current target and ancestors, selected local defining fields
  and every local graph-edge evidence array, complete authority rows and recursive
  RDF closures, declared chemical fields, and entire declared indexed and GO responses.
  All focal identity, audit, organism, names, genes, existence, comments, references,
  features, keywords and GO/material-family crossreferences were read. Sequence length
  and checksum metadata were checked; residues and unrelated database crossreferences
  were excluded. No linked full article was read.
- No trait edit, human sign-off or publication is performed.
