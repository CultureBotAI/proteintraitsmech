  summary: CHEBI:17621 is oxidized FMN, C17H21N4O9P, net charge 0. Its single phosphate
    retains two OH groups and is esterified to the primary hydroxy group of the stereospecified
    D-ribityl chain. The three ribityl stereocentres and oxidized isoalloxazine connectivity
    are explicit. Direct roles include coenzyme, cofactor, bacterial/human/mouse metabolite
    and ophthalmology drug. Structural parents are flavin mononucleotide CHEBI:24041
    and vitamin B2 CHEBI:176838. Its source-linked trianion is a conjugate base, not
    a reduced flavin.
