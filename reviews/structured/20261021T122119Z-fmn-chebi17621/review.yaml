  summary: CHEBI:57618 is FMNH2(2−), C17H21N4O9P, charge −2, with both phosphate OH
    groups deprotonated and the reduced 1,5-dihydro flavin core retained. It preserves
    the three ribityl stereocentres. Its direct roles are cofactor and yeast metabolite;
    its structural parent is organophosphate oxoanion. It is a conjugate base of neutral
    reduced FMNH2 CHEBI:16048 and a conjugate acid of reduced trianion CHEBI:133886.
    Its formula happens to equal neutral oxidized FMN, but charge and redox connectivity
    do not.
