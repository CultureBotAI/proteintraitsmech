[project]
name = "proteintraitsmech"
version = "0.1.0"
description = "Knowledge base of protein traits, functions, and mechanisms — curated one YAML per trait with evidence-backed causal graphs"
authors = [
    {name = "ProteinTraitsMech Contributors"}
]
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.10"
keywords = [
    "protein",
    "trait",
    "function",
    "ontology",
    "knowledge graph",
    "linkml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "linkml>=1.10.0",
    "linkml-runtime>=1.7.0",
    # Below 0.7.2, `sqlite:obo:` resolves against https://s3.amazonaws.com/bbop-sqlite,
    # which is retired and answers 403. The id↔label gate builds eight such adapters
    # (conf/id_label_targets.yaml) and ground_categories.py one per ontology, so a
    # cold cache put every one of them on a dead bucket. 0.7.2 moved the default to
    # https://semanticsql.berkeleybop.io (oaklib#897, semantic-sql#110).
    #
    # >=0.7.3, not 0.7.2: 0.7.2 declares requires_python <3.14 while this project
    # declares an unbounded >=3.10, so 0.7.2 names a floor that is not installable
    # across the range we claim. 0.7.3 widened it to <3.15. Matches
    # MediaIngredientMech, CultureMech, TraitMech and culturebotai-claw (#646).
    "oaklib>=0.7.3",
    # oaklib imports eutils, which still imports pkg_resources; setuptools 82
    # removed it. Nothing else bounds setuptools here, so without this a relock
    # can take it to 82 and every `import oaklib` dies. <82 not <81: 81 still
    # ships pkg_resources and is what resolves today. Matches AntibioticMech.
    "setuptools<82",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "deep-research-client[cyberian]>=0.2.10; python_version >= '3.12'",
]
# Local text-embedding stack (scripts/embed_*.py) — heavy (torch), kept out of
# the core install. Runs on Apple-Silicon MPS / CUDA / CPU. UMAP is optional
# (only the corpus-map builder needs it).
embed = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pacmap>=0.7",
    "umap-learn>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteintraitsmech"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Vendored BYTE-IDENTICAL from canonical CultureBotAI/culturebotai-claw via the
# immutable manifest pin and guarded by `just check-vendored-sync` — any local edit
# fails that gate. The two
# E741 `l` findings are upstream's to fix, not ours: linting them here only tempts
# a drift-inducing edit, which is the one thing the vendoring contract forbids.
# Scoped to E741 rather than excluding the file, so every other rule still sees it.
# Same resolution TraitMech reached (#312 there).
"scripts/validate_id_label_correspondence.py" = ["E741"]
