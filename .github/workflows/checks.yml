# Runs the two gates that do not need the source releases.
#
# Issue #107 is that ruff was a declared dev dependency with config in pyproject.toml
# that NOTHING ever ran, so the error count could only go up — and it had, to 63. A
# `just lint` recipe alone would not have fixed that: a gate nobody runs is the thing
# being complained about. This is what makes it a gate.
#
# `validate-all` and `audit-graphs` run in .github/workflows/validate-strict.yaml
# instead — not because they need data/raw (neither does; that claim was false, #485),
# but because the ~430K-record corpus makes them too slow to bundle here on every PR.
# Source-registry structure is checked here; licence dispositions explicitly marked
# pending remain notices until the owner/legal decision in #517.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - run: uv sync --extra dev

      # Lint first: it is seconds, and it catches the class of defect that the tests
      # structurally cannot. A NameError inside a function body only fires when that
      # line runs, so the import-time test added in #108 passes over it — exactly how
      # `write_record` reached a PR uncalled and undefined in seed_ncbifam (#100).
      - run: just lint

      # Enforce download.yaml's script roles and fail on unclassified seeders, missing
      # scripts, invalid statuses/roles, or restrictive terms lacking a review state.
      - run: just sources-check
      # Gates the two classes this repository can fix -- its manifest disagreeing
      # with its own schema, and its enum dropping a token it agreed to govern.
      # Cross-Mech description drift stays a NOTICE and is printed on every run:
      # TraitMech can reword its own description at any time, and that must not
      # fail pull requests here until someone reconciles a vocabulary they may not
      # own (#585). `--fail-on any` blocks on that too, when the fleet wants it.
      # --check-remote compares the reviewed TraitMech pin against the live
      # repository, so pin staleness is visible here instead of waiting for
      # someone to run --refresh (#584). Same host this repo already fetches for
      # the canonical hub. Both remote classes are NOTICES: a sibling repository
      # editing its own vocabulary, or an unreachable network, must not fail a
      # pull request here.
      - run: just audit-cross-mech-categories --check-remote

      # Schema-quality probes (#496). In CI on purpose: this recipe existed for the life
      # of the repo pointing at a script that was never written, and because nothing ran
      # it, nothing was ever red. A recipe nobody runs is indistinguishable from a passing
      # one -- which is the same argument this workflow's own header makes about ruff.
      # Needs no data/raw; it reads the schema and counts enum usage in data/traits.
      - run: just audit-schema

      # Writer-safety audit (#492). Same reason, same cost: no data/raw, seconds to run.
      - run: just audit-writers

      # Actionable id-label gate (#493). Offline and self-contained: resolves
      # proteintraitsmech: causal nodes against committed record labels and pins
      # both mismatch count and identity.
      - run: just validate-internal-id-labels

      - run: just test
