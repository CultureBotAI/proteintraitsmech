# Two cheap blocking gates added with the shared Mech foundation (#484).
#
# BOTH USE SPARSE CHECKOUT, and that is not premature optimisation: this repo is ~431,000
# files and ~768 MB, essentially all of it `data/traits/`, and neither job reads a single
# record. `vendored-sync`'s stated property is that it fails in seconds — a full checkout
# costs orders of magnitude more than the six curl+diff calls it exists to run, which
# would have made that claim false on arrival.
name: history-and-vendored

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # curl + diff only: no uv, no Python, no dependency resolution. It fetches the hub's
  # copies at the pinned commit and diffs. Deliberately NOT a self-generated checksum —
  # a pin the repo computes from its own file passes whatever that file happens to say,
  # which is the blind spot this design replaced.
  vendored-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src
            tests
          sparse-checkout-cone-mode: true
      - run: bash scripts/check_vendored_sync.sh

  # Enforces the split the shared schema documents: a history record that EXISTS must be
  # schema-valid (hard), while a PR that writes none is not blocked. See history/README.md
  # for why presence is advisory — briefly, a provenance gate people route around is worse
  # than no gate.
  #
  # Kept as its own job even though `just test` covers the same ground via
  # test_the_committed_history_records_are_valid: that test is one of 1,000+ behind an
  # 11-minute suite, and this is the gate a curator writing a history record wants to see
  # go red in under a minute. Sparse checkout is what makes keeping both cheap.
  #
  # README.md is in the sparse list because `uv sync` BUILDS this package and
  # pyproject declares `readme = "README.md"` -- hatchling raises `Readme file does not
  # exist` without it. A sparse checkout has to include the build's inputs, not just the
  # command's, which is exactly what the first version of this job got wrong.
  validate-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            history
            src
            scripts
            justfile
            pyproject.toml
            uv.lock
            README.md
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv sync --extra dev
      - run: just validate-history
