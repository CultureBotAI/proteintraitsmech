# Two cheap blocking gates added with the shared Mech foundation (#484).
#
# BOTH USE SPARSE CHECKOUT, and that is not premature optimisation: this repo is ~431,000
# files and ~768 MB, essentially all of it `data/traits/`, and neither job reads a single
# record. `vendored-sync` reads claw's manifest and governed payloads at one immutable
# commit — a full checkout would dominate the bounded standard-library HTTPS checks.
name: history-and-vendored

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Standard-library Python only: no uv or dependency resolution. The checker fetches
  # claw's single manifest and governed payloads at the pinned immutable commit, verifies
  # their manifest digests, and compares local bytes and modes. Deliberately NOT a
  # self-generated checksum — a pin the repo computes from its own file passes whatever
  # that file happens to say, which is the blind spot this design replaced.
  vendored-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src
            tests
            prompts
          sparse-checkout-cone-mode: true
      # Keep retry policy in the workflow rather than forking the byte-governed launcher.
      # Exit 1 is the checker's retryable class; exit 2 is a local governance precondition
      # failure, so another network attempt cannot change its outcome.
      - name: Verify vendored files match canonical claw
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            status=0
            bash scripts/check_vendored_sync.sh || status=$?
            case "$status" in
              0)
                exit 0
                ;;
              1)
                ;;
              2)
                echo "::error::vendored-sync governance precondition failed" >&2
                exit 2
                ;;
              *)
                echo "::error::vendored-sync returned unexpected exit $status" >&2
                exit "$status"
                ;;
            esac
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::vendored-sync attempt $attempt failed (exit $status); retrying in 5s" >&2
              sleep 5
            fi
          done
          echo "::error::vendored files differ from canonical claw, or claw could not be reached after 3 attempts" >&2
          exit 1

  # Enforces the split the shared schema documents: a history record that EXISTS must be
  # schema-valid (hard), while a PR that writes none is not blocked. See history/README.md
  # for why presence is advisory — briefly, a provenance gate people route around is worse
  # than no gate.
  #
  # Kept as its own job even though `just test` covers the same ground via
  # test_the_committed_history_records_are_valid: that test is one of 1,000+ behind an
  # 11-minute suite, and this is the gate a curator writing a history record wants to see
  # go red in under a minute. Sparse checkout is what makes keeping both cheap.
  #
  # README.md is in the sparse list because `uv sync` BUILDS this package and
  # pyproject declares `readme = "README.md"` -- hatchling raises `Readme file does not
  # exist` without it. A sparse checkout has to include the build's inputs, not just the
  # command's, which is exactly what the first version of this job got wrong.
  validate-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            history
            src
            scripts
            justfile
            pyproject.toml
            uv.lock
            README.md
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv sync --extra dev
      - run: just validate-history
